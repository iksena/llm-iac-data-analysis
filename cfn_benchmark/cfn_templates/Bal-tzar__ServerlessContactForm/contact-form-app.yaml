AWSTemplateFormatVersion: '2010-09-09'
Description: 'Complete Serverless Contact Form App with S3 Website, DynamoDB, Lambda, API Gateway, and SES'

Parameters:
  FromEmail:
    Type: String
    Description: Verified email address to send from
    Default: ottodemare1@gmail.com
  ToEmail:
    Type: String
    Description: Email address to send notifications to
    Default: 94ottdem@gafe.molndal.se
  BucketName:
    Type: String
    Description: Name for the S3 bucket (must be globally unique)
    Default: otto-contact-form-website-2024

Resources:

  # S3 Bucket for Website Hosting
  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: error.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  # S3 Bucket Policy for Public Read Access
  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    DependsOn: WebsiteBucket
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: "*"
            Action: 's3:GetObject'
            Resource: !Join
              - ''
              - - 'arn:aws:s3:::'
                - !Ref WebsiteBucket
                - '/*'

  # DynamoDB Table for storing contacts
  ContactsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Contacts
      AttributeDefinitions:
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: timestamp
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  # IAM Role for Lambda functions
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
        - 'arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess'
        - 'arn:aws:iam::aws:policy/AmazonSESFullAccess'

  # Lambda Function to handle contact form submissions
  AddContactFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: AddContactInfo
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          FROM_EMAIL: !Ref FromEmail
          TO_EMAIL: !Ref ToEmail
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          from datetime import datetime

          def lambda_handler(event, context):
              # Handle CORS preflight requests
              if event.get("httpMethod") == "OPTIONS":
                  return {
                      "statusCode": 200,
                      "headers": {
                          "Access-Control-Allow-Origin": "*",
                          "Access-Control-Allow-Methods": "OPTIONS,POST",
                          "Access-Control-Allow-Headers": "Content-Type"
                      }
                  }

              try:
                  # Parse the request body
                  payload = json.loads(event['body'])

                  # Save to DynamoDB
                  db = boto3.resource('dynamodb')
                  table = db.Table('Contacts')
                  dateTime = (datetime.now()).strftime("%Y-%m-%d %H:%M:%S")

                  # Store contact in DynamoDB
                  table.put_item(
                      Item={
                          'timestamp': dateTime,
                          'name': payload['name'],
                          'email': payload['email'],
                          'message': payload['msg']
                      }
                  )

                  # Send email notification using SES
                  ses = boto3.client('ses')
                  email_body = f"New Contact Form Submission:\n\nName: {payload['name']}\nEmail: {payload['email']}\nMessage: {payload['msg']}\nSubmitted: {dateTime}\n\n---\nThis email was sent automatically from your contact form."

                  ses.send_email(
                      Source=os.environ['FROM_EMAIL'],
                      Destination={'ToAddresses': [os.environ['TO_EMAIL']]},
                      Message={
                          'Subject': {'Data': f"New Contact Form: {payload['name']}", 'Charset': 'UTF-8'},
                          'Body': {'Text': {'Data': email_body, 'Charset': 'UTF-8'}}
                      }
                  )

                  return {
                      "statusCode": 200,
                      "headers": {
                          "Access-Control-Allow-Origin": "*",
                          "Access-Control-Allow-Methods": "OPTIONS,POST",
                          "Access-Control-Allow-Headers": "Content-Type"
                      },
                      "body": json.dumps({
                          "message": "Thank you! Your message has been sent successfully.",
                          "timestamp": dateTime
                      })
                  }

              except json.JSONDecodeError:
                  return {
                      "statusCode": 400,
                      "headers": {
                          "Access-Control-Allow-Origin": "*",
                          "Access-Control-Allow-Methods": "OPTIONS,POST",
                          "Access-Control-Allow-Headers": "Content-Type"
                      },
                      "body": json.dumps({"error": "Invalid JSON in request body"})
                  }
              except Exception as e:
                  print(f"Error: {str(e)}")
                  return {
                      "statusCode": 500,
                      "headers": {
                          "Access-Control-Allow-Origin": "*",
                          "Access-Control-Allow-Methods": "OPTIONS,POST",
                          "Access-Control-Allow-Headers": "Content-Type"
                      },
                      "body": json.dumps({"error": f"Server error: {str(e)}"})
                  }

  # API Gateway REST API
  ApiGatewayRestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: ContactFormApi
      Description: API for contact form submissions
      EndpointConfiguration:
        Types:
          - REGIONAL

  # API Gateway Resource for /contact
  ApiGatewayResourceContact:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt ApiGatewayRestApi.RootResourceId
      PathPart: contact
      RestApiId: !Ref ApiGatewayRestApi

  # POST method for contact submissions
  ApiGatewayMethodContact:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      ResourceId: !Ref ApiGatewayResourceContact
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AddContactFunction.Arn}/invocations
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true

  # OPTIONS method for CORS preflight
  ApiGatewayMethodOptions:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      ResourceId: !Ref ApiGatewayResourceContact
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
              method.response.header.Access-Control-Allow-Methods: "'OPTIONS,POST'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type'"
            ResponseTemplates:
              application/json: '{}'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Headers: true

  # API Gateway Deployment
  ApiGatewayDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - ApiGatewayMethodContact
      - ApiGatewayMethodOptions
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      StageName: prod

  # Lambda permission for API Gateway to invoke the function
  LambdaApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AddContactFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGatewayRestApi}/*/POST/contact'

  # Lambda permission for OPTIONS method
  LambdaOptionsPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AddContactFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGatewayRestApi}/*/OPTIONS/contact'

Outputs:
  WebsiteURL:
    Description: S3 Website URL - use this to access your contact form
    Value: !GetAtt WebsiteBucket.WebsiteURL
    Export:
      Name: !Sub '${AWS::StackName}-WebsiteURL'

  ApiUrl:
    Description: API Gateway URL for contact form submissions
    Value: !Sub 'https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.amazonaws.com/prod/contact'
    Export:
      Name: !Sub '${AWS::StackName}-ApiUrl'

  BucketName:
    Description: S3 Bucket Name for uploading website files
    Value: !Ref WebsiteBucket
    Export:
      Name: !Sub '${AWS::StackName}-BucketName'

  DynamoDBTable:
    Description: DynamoDB table storing contact submissions
    Value: !Ref ContactsTable
    Export:
      Name: !Sub '${AWS::StackName}-ContactsTable'

  SetupInstructions:
    Description: 'Next steps to complete setup'
    Value: '1. Make sure your emails are verified in SES. 2. Upload your index.html to the S3 bucket. 3. Update the API URL in your HTML file. 4. Access your website using the WebsiteURL.'