AWSTemplateFormatVersion: 2010-09-09
Description: CloudFormation template to create a Fargate ECS Task Definition with ECR image, task role, and execution role
Parameters:
  RepositoryName:
    Type: String
    Default: sample-app
    Description: Name of the ECR repository
  ImageTag:
    Type: String
    Default: v1.0.0
    Description: Immutable tag for the container image
Resources:
  # Execution Role: grants ECS agent permissions to pull the image from ECR and write logs
  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ECRPullPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetAuthorizationToken
                Resource: '*'
  # Task Role: grants permissions to the container tasks (adjust as needed)
  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonECS_FullAccess
  # Fargate Task Definition
  FargateTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: fargate-task-definition
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      RequiresCompatibilities:
        - FARGATE
      ContainerDefinitions:
        - Name: app-container
          Image: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${RepositoryName}:${ImageTag}
          Cpu: 256
          Memory: 512
          Essential: true
          PortMappings:
            - ContainerPort: 80
              Protocol: tcp
      Tags:
        - Key: Name
          Value: fargate-task-definition
Outputs:
  ImageURI:
    Description: Full URI of the container image in ECR
    Value: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${RepositoryName}:${ImageTag}
  TaskDefinitionArn:
    Description: ARN of the ECS Task Definition
    Value: !Ref FargateTaskDefinition