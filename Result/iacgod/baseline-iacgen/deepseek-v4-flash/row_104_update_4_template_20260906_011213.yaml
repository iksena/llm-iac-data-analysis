AWSTemplateFormatVersion: "2010-09-09"
Description: "Elastic Beanstalk Blue-Green Deployment Template - Creates or references a blue environment and optionally creates a temporary green environment for traffic routing during updates."
Parameters:
  CreateNewApplication:
    Type: String
    AllowedValues:
      - "true"
      - "false"
    Default: "true"
    Description: "Set to true to create a new application and blue environment. Set to false to use an existing blue application and environment."
  ApplicationName:
    Type: String
    Default: "MyApplication"
    Description: "Name of the Elastic Beanstalk application. If creating new, this will be the application name. If using existing, this must match the existing application name."
  BlueEnvironmentName:
    Type: String
    Default: "blue-env"
    Description: "Name of the blue environment. If creating new, this will be created. If using existing, this must match the existing environment name."
  GreenEnvironmentName:
    Type: String
    Default: "green-env"
    Description: "Name of the green environment (temporary)."
  SolutionStackName:
    Type: String
    Default: "64bit Amazon Linux 2 v5.8.0 running PHP 8.1"
    Description: "The solution stack for the environments. Use a modern supported stack appropriate for your application. Default is PHP 8.1; adjust SampleAppKey accordingly (e.g., php.zip for PHP, nodejs.zip for Node.js)."
  SampleAppBucket:
    Type: String
    Default: ""
    Description: "S3 bucket containing the sample application. Leave empty to use the default Elastic Beanstalk sample bucket (region appended automatically)."
  SampleAppKey:
    Type: String
    Default: "php.zip"
    Description: "S3 key of the sample application zip file. Default is php.zip for PHP; change to nodejs.zip for Node.js, etc."
  CreateGreenEnvironment:
    Type: String
    AllowedValues:
      - "true"
      - "false"
    Default: "true"
    Description: "Set to true to create a green environment for blue-green deployment. Set to false to remove the green environment after traffic is routed back to blue."
Conditions:
  IsNewApp: !Equals [!Ref CreateNewApplication, "true"]
  UseDefaultBucket: !Equals [!Ref SampleAppBucket, ""]
  ShouldCreateGreen: !Equals [!Ref CreateGreenEnvironment, "true"]
Resources:
  ElasticBeanstalkServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: elasticbeanstalk.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSElasticBeanstalkService
      Path: "/"
  ElasticBeanstalkInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSElasticBeanstalkWebTier
        - arn:aws:iam::aws:policy/AWSElasticBeanstalkWorkerTier
        - arn:aws:iam::aws:policy/AWSElasticBeanstalkMulticontainerDocker
      Path: "/"
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: "/"
      Roles:
        - !Ref ElasticBeanstalkInstanceRole
  Application:
    Condition: IsNewApp
    Type: AWS::ElasticBeanstalk::Application
    Properties:
      ApplicationName: !Ref ApplicationName
      Description: "Application for Blue-Green deployment"
  BlueAppVersion:
    Condition: IsNewApp
    Type: AWS::ElasticBeanstalk::ApplicationVersion
    Properties:
      ApplicationName: !Ref ApplicationName
      Description: "Sample application version for blue environment"
      SourceBundle:
        S3Bucket: !If [UseDefaultBucket, !Sub "elasticbeanstalk-samples-${AWS::Region}", !Ref SampleAppBucket]
        S3Key: !Ref SampleAppKey
  BlueEnvironment:
    Condition: IsNewApp
    Type: AWS::ElasticBeanstalk::Environment
    Properties:
      ApplicationName: !Ref ApplicationName
      EnvironmentName: !Ref BlueEnvironmentName
      SolutionStackName: !Ref SolutionStackName
      VersionLabel: !Ref BlueAppVersion
      OptionSettings:
        - Namespace: "aws:autoscaling:launchconfiguration"
          OptionName: "IamInstanceProfile"
          Value: !Ref InstanceProfile
        - Namespace: "aws:elasticbeanstalk:environment"
          OptionName: "ServiceRole"
          Value: !Ref ElasticBeanstalkServiceRole
  GreenAppVersion:
    Condition: ShouldCreateGreen
    Type: AWS::ElasticBeanstalk::ApplicationVersion
    Properties:
      ApplicationName: !Ref ApplicationName
      Description: "Sample application version for green environment"
      SourceBundle:
        S3Bucket: !If [UseDefaultBucket, !Sub "elasticbeanstalk-samples-${AWS::Region}", !Ref SampleAppBucket]
        S3Key: !Ref SampleAppKey
  GreenEnvironment:
    Condition: ShouldCreateGreen
    Type: AWS::ElasticBeanstalk::Environment
    Properties:
      ApplicationName: !Ref ApplicationName
      EnvironmentName: !Ref GreenEnvironmentName
      SolutionStackName: !Ref SolutionStackName
      VersionLabel: !Ref GreenAppVersion
      OptionSettings:
        - Namespace: "aws:autoscaling:launchconfiguration"
          OptionName: "IamInstanceProfile"
          Value: !Ref InstanceProfile
        - Namespace: "aws:elasticbeanstalk:environment"
          OptionName: "ServiceRole"
          Value: !Ref ElasticBeanstalkServiceRole
Outputs:
  BlueEnvironmentEndpointURL:
    Description: "URL of the blue environment (only if created new)"
    Value: !GetAtt BlueEnvironment.EndpointURL
    Condition: IsNewApp
  GreenEnvironmentEndpointURL:
    Description: "URL of the green environment"
    Value: !GetAtt GreenEnvironment.EndpointURL
    Condition: ShouldCreateGreen
  ApplicationName:
    Description: "Application name"
    Value: !Ref ApplicationName