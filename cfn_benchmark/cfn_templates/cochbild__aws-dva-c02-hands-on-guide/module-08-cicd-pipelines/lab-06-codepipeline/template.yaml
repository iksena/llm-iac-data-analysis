AWSTemplateFormatVersion: "2010-09-09"
Description: Lab 8.6 — Minimal CodeCommit + CodeBuild + ManualApproval + CloudFormation deploy pipeline

Resources:
  Repo:
    Type: AWS::CodeCommit::Repository
    Properties:
      RepositoryName: dva-lab-08-06-repo
      Code:
        BranchName: main
        S3:
          Bucket: !Ref RepoSeedBucket
          Key: seed.zip

  RepoSeedBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub "dva-lab-08-06-seed-${AWS::AccountId}-${AWS::Region}"

  ArtifactsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub "dva-lab-08-06-artifacts-${AWS::AccountId}-${AWS::Region}"

  ApprovalTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: dva-lab-08-06-approvals

  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BuildPerms
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:*, s3:*, codecommit:GitPull]
                Resource: "*"

  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: dva-lab-08-06-build
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Source:
        Type: CODEPIPELINE
        BuildSpec: |
          version: 0.2
          phases:
            build:
              commands:
                - echo "Building $CODEBUILD_RESOLVED_SOURCE_VERSION"
                - cp template-to-deploy.yaml output.yaml || echo "no template-to-deploy.yaml; using placeholder"
                - |
                  if [ ! -f output.yaml ]; then
                    cat > output.yaml <<'YAML'
                  AWSTemplateFormatVersion: '2010-09-09'
                  Resources:
                    Dummy:
                      Type: AWS::SNS::Topic
                      Properties:
                        TopicName: dva-lab-08-06-deployed-by-pipeline
                  YAML
                  fi
          artifacts:
            files: [output.yaml]
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        ComputeType: BUILD_GENERAL1_SMALL

  CfnDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dva-lab-08-06-cfn-deploy-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudformation.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess

  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: codepipeline.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PipelinePerms
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: "*"
                Resource: "*"

  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: dva-lab-08-06-pipeline
      RoleArn: !GetAtt PipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactsBucket
      Stages:
        - Name: Source
          Actions:
            - Name: CodeCommit-Source
              ActionTypeId:
                Category: Source
                Owner: AWS
                Version: "1"
                Provider: CodeCommit
              Configuration:
                RepositoryName: !GetAtt Repo.Name
                BranchName: main
              OutputArtifacts:
                - Name: SourceOutput
        - Name: Build
          Actions:
            - Name: CodeBuild-Build
              ActionTypeId:
                Category: Build
                Owner: AWS
                Version: "1"
                Provider: CodeBuild
              Configuration:
                ProjectName: !Ref BuildProject
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: BuildOutput
        - Name: Approve
          Actions:
            - Name: Approve
              ActionTypeId:
                Category: Approval
                Owner: AWS
                Version: "1"
                Provider: Manual
              Configuration:
                NotificationArn: !Ref ApprovalTopic
                CustomData: "Approve to proceed to CFN deploy"
        - Name: Deploy
          Actions:
            - Name: CFN-Deploy
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Version: "1"
                Provider: CloudFormation
              Configuration:
                ActionMode: CREATE_UPDATE
                StackName: dva-lab-08-06-deployed
                TemplatePath: BuildOutput::output.yaml
                RoleArn: !GetAtt CfnDeployRole.Arn
                Capabilities: CAPABILITY_IAM
              InputArtifacts:
                - Name: BuildOutput

Outputs:
  PipelineName:
    Value: !Ref Pipeline
  RepoUrl:
    Value: !GetAtt Repo.CloneUrlHttp
  TopicArn:
    Value: !Ref ApprovalTopic
  ArtifactsBucket:
    Value: !Ref ArtifactsBucket
  RepoSeedBucket:
    Value: !Ref RepoSeedBucket