AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Lambda と Batch 実行ロール用の IAM ロール定義。

  既存の管理ポリシー（NextjsPolicy / BatchWorkerPolicy）を外部から渡して
  ロールにアタッチするようにし、テンプレートの引数を簡素化します。

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: デプロイ環境名

  NextjsPolicyArn:
    Type: String
    Description: Next.js 用に作成済みの管理ポリシーの ARN (e.g. infra/iam/policies/nextjs-policy.yaml の出力)

  BatchWorkerPolicyArn:
    Type: String
    Description: Batch ワーカー用に作成済みの管理ポリシーの ARN (e.g. infra/iam/policies/batch-policy.yaml の出力)

Resources:
  # ============================================================================
  # Lambda 実行ロール (Next.js 用ポリシーをアタッチ)
  # ============================================================================
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'codec-converter-lambda-role-${Environment}'
      Description: "CodecConverter Lambda execution role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - !Ref NextjsPolicyArn
      Tags:
        - Key: Application
          Value: codec-converter
        - Key: Environment
          Value: !Ref Environment

  # ============================================================================
  # Batch タスク実行ロール (ECS タスク用)
  # ============================================================================
  BatchTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'codec-converter-batch-execution-role-${Environment}'
      Description: "CodecConverter Batch task execution role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Tags:
        - Key: Application
          Value: codec-converter
        - Key: Environment
          Value: !Ref Environment

  # ============================================================================
  # Batch ジョブロール (コンテナ内で使用) - Batch ワーカーポリシーをアタッチ
  # ============================================================================
  BatchJobRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'codec-converter-batch-job-role-${Environment}'
      Description: "CodecConverter Batch job role for container execution"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref BatchWorkerPolicyArn
      Tags:
        - Key: Application
          Value: codec-converter
        - Key: Environment
          Value: !Ref Environment

Outputs:
  LambdaExecutionRoleArn:
    Description: Lambda 実行ロールの ARN
    Value: !GetAtt LambdaExecutionRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-LambdaExecutionRoleArn'

  LambdaExecutionRoleName:
    Description: Lambda 実行ロールの名前
    Value: !Ref LambdaExecutionRole
    Export:
      Name: !Sub '${AWS::StackName}-LambdaExecutionRoleName'

  BatchTaskExecutionRoleArn:
    Description: Batch タスク実行ロールの ARN
    Value: !GetAtt BatchTaskExecutionRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-BatchTaskExecutionRoleArn'

  BatchJobRoleArn:
    Description: Batch ジョブロールの ARN
    Value: !GetAtt BatchJobRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-BatchJobRoleArn'

  BatchJobRoleName:
    Description: Batch ジョブロールの名前
    Value: !Ref BatchJobRole
    Export:
      Name: !Sub '${AWS::StackName}-BatchJobRoleName'