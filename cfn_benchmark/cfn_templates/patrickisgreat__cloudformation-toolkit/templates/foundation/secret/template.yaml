AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  Secrets Manager secret, either generated at create time or supplied, with
  optional customer-managed encryption, cross-account access, and replication.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Naming
        Parameters:
          - NamePrefix
          - Environment
          - SecretSuffix
          - SecretDescription
      - Label:
          default: Value
        Parameters:
          - GenerateSecret
          - SecretStringTemplate
          - GenerateStringKey
          - PasswordLength
          - ExcludeCharacters
      - Label:
          default: Encryption and access
        Parameters:
          - KmsKeyId
          - ReaderRoleArn
      - Label:
          default: Lifecycle
        Parameters:
          - RecoveryWindowInDays
          - ReplicaRegion

Parameters:
  NamePrefix:
    Type: String
    Description: Prefix for the secret name.
    AllowedPattern: "^[a-z][a-z0-9-]{1,30}[a-z0-9]$"
    ConstraintDescription: 3-32 lowercase characters, digits and hyphens.

  Environment:
    Type: String
    Description: Environment this secret belongs to.
    Default: dev
    AllowedValues: [dev, staging, prod]

  SecretSuffix:
    Type: String
    Description: >-
      Suffix identifying what this secret holds. The full name becomes
      <Environment>/<NamePrefix>/<SecretSuffix>, e.g. dev/checkout-api/db.
    Default: default
    AllowedPattern: "^[A-Za-z0-9/_+=.@-]{1,80}$"

  SecretDescription:
    Type: String
    Description: >-
      What this secret is and who rotates it. Worth writing: the console shows it
      next to the value, and it is what stops someone deleting a secret they do
      not recognise.
    Default: Managed by cloudformation-toolkit.

  GenerateSecret:
    Type: String
    Description: >-
      Have Secrets Manager generate the value at create time. This is the whole
      point of the resource - a generated secret has never been in a template, a
      parameter file, a terminal, or CloudTrail. Set to false only when the value
      comes from a third party (an API key you were issued), and then populate it
      out of band with `aws secretsmanager put-secret-value`.
    Default: "true"
    AllowedValues: ["true", "false"]

  SecretStringTemplate:
    Type: String
    Description: >-
      JSON the generated password is merged into, e.g.
      '{"username":"appuser"}'. Leave empty to store a bare string.
    Default: '{"username":"app"}'

  GenerateStringKey:
    Type: String
    Description: >-
      Key in SecretStringTemplate that receives the generated password. Must be
      set whenever SecretStringTemplate is.
    Default: password

  PasswordLength:
    Type: Number
    Description: Length of the generated password.
    Default: 32
    MinValue: 16
    MaxValue: 128

  ExcludeCharacters:
    Type: String
    Description: >-
      Characters to keep out of the generated password. The default excludes the
      ones that break shell quoting, JDBC URLs, and RDS master passwords - which
      is a much more common outage than a slightly smaller alphabet.
    Default: "\"@/\\'`$&;|<>()[]{}"

  KmsKeyId:
    Type: String
    Description: >-
      Customer-managed KMS key ARN or alias. Leave empty to use the AWS-managed
      aws/secretsmanager key, which is free. A customer-managed key is required
      for cross-account access.
    Default: ""

  ReaderRoleArn:
    Type: String
    Description: >-
      IAM role ARN granted GetSecretValue through a resource policy. Useful for
      cross-account reads; for same-account access, prefer granting the
      permission on the role instead of here.
    Default: ""

  RecoveryWindowInDays:
    Type: Number
    Description: >-
      Days a deleted secret stays recoverable. The minimum AWS allows is 7; there
      is no zero, because deleting a database password by accident is common
      enough that AWS removed the option.
    Default: 30
    MinValue: 7
    MaxValue: 30

  ReplicaRegion:
    Type: String
    Description: >-
      Region to replicate this secret into, for a multi-region workload. Leave
      empty for none.
    Default: ""

Conditions:
  ShouldGenerateSecret: !Equals [!Ref GenerateSecret, "true"]
  HasStringTemplate: !Not [!Equals [!Ref SecretStringTemplate, ""]]
  HasKmsKey: !Not [!Equals [!Ref KmsKeyId, ""]]
  HasReaderRole: !Not [!Equals [!Ref ReaderRoleArn, ""]]
  HasReplica: !Not [!Equals [!Ref ReplicaRegion, ""]]

Resources:
  Secret:
    Type: AWS::SecretsManager::Secret
    # A secret is a piece of state, and the things that read it (a database, a
    # third party) do not roll back when the stack does.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "${Environment}/${NamePrefix}/${SecretSuffix}"
      Description: !Ref SecretDescription
      KmsKeyId: !If [HasKmsKey, !Ref KmsKeyId, !Ref "AWS::NoValue"]
      # There is deliberately no `SecretString` parameter on this template. A
      # value passed as a stack parameter is visible in the change set, the
      # events, and every CI log that echoes the deploy — which defeats the
      # entire purpose of Secrets Manager.
      GenerateSecretString: !If
        - ShouldGenerateSecret
        - SecretStringTemplate: !If [HasStringTemplate, !Ref SecretStringTemplate, !Ref "AWS::NoValue"]
          GenerateStringKey: !If [HasStringTemplate, !Ref GenerateStringKey, !Ref "AWS::NoValue"]
          PasswordLength: !Ref PasswordLength
          ExcludeCharacters: !Ref ExcludeCharacters
          RequireEachIncludedType: true
        - !Ref AWS::NoValue
      ReplicaRegions: !If
        - HasReplica
        - - Region: !Ref ReplicaRegion
            KmsKeyId: !If [HasKmsKey, !Ref KmsKeyId, !Ref "AWS::NoValue"]
        - !Ref AWS::NoValue

  ResourcePolicy:
    Type: AWS::SecretsManager::ResourcePolicy
    Condition: HasReaderRole
    Properties:
      SecretId: !Ref Secret
      # Blocks a policy that would make the secret readable by anyone. Cheap
      # insurance against a copy-pasted principal.
      BlockPublicPolicy: true
      ResourcePolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowReaderRoleToReadTheValue
            Effect: Allow
            Principal:
              AWS: !Ref ReaderRoleArn
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:DescribeSecret
            Resource: "*"

Outputs:
  SecretArn:
    Description: >-
      Secret ARN. This is what an ECS task definition's `secrets` block takes,
      and what a CloudFormation dynamic secretsmanager reference resolves
      against. See the README for both forms.
    Value: !Ref Secret

  SecretName:
    Description: Full secret name, for the CLI and for IAM policy resource patterns.
    Value: !Sub "${Environment}/${NamePrefix}/${SecretSuffix}"

  RecoveryWindowInDays:
    Description: How long a deleted secret stays recoverable, echoed for runbooks.
    Value: !Ref RecoveryWindowInDays