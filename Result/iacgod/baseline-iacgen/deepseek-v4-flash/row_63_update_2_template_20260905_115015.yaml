AWSTemplateFormatVersion: "2010-10-17"
Description: "CloudFormation template for Step Functions state machine with two pass states and two API Gateway REST APIs (GET and POST) with IAM roles."
Resources:
  StepFunctionsStateMachine:
    Type: "AWS::StepFunctions::StateMachine"
    Properties:
      StateMachineName: "SimpleTwoStepPassWorkflow"
      DefinitionString:
        '{
          "Comment": "A simple two-step pass workflow",
          "StartAt": "FirstPass",
          "States": {
            "FirstPass": {
              "Type": "Pass",
              "Result": "First step completed",
              "Next": "SecondPass"
            },
            "SecondPass": {
              "Type": "Pass",
              "Result": "Second step completed",
              "End": true
            }
          }
        }'
      RoleArn: !GetAtt StateMachineExecutionRole.Arn
  StateMachineExecutionRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service: "states.amazonaws.com"
            Action: "sts:AssumeRole"
      Policies:
        - PolicyName: "StateMachineExecutionPolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Action: "logs:CreateLogGroup"
                Resource: "*"
              - Effect: "Allow"
                Action:
                  - "logs:CreateLogStream"
                  - "logs:PutLogEvents"
                Resource: "*"
  GetApiRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service: "apigateway.amazonaws.com"
            Action: "sts:AssumeRole"
      Policies:
        - PolicyName: "ApiGatewayToStateMachinePolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Action: "states:StartExecution"
                Resource: !GetAtt StepFunctionsStateMachine.Arn
  PostApiRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service: "apigateway.amazonaws.com"
            Action: "sts:AssumeRole"
      Policies:
        - PolicyName: "ApiGatewayToStateMachinePolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Action: "states:StartExecution"
                Resource: !GetAtt StepFunctionsStateMachine.Arn
  GetApiRestApi:
    Type: "AWS::ApiGateway::RestApi"
    Properties:
      Name: "GetApiForStepFunctions"
      Description: "REST API exposing a GET endpoint to start Step Functions execution."
  GetApiResource:
    Type: "AWS::ApiGateway::Resource"
    Properties:
      RestApiId: !Ref GetApiRestApi
      ParentId: !GetAtt GetApiRestApi.RootResourceId
      PathPart: "execute"
  GetApiMethod:
    Type: "AWS::ApiGateway::Method"
    Properties:
      RestApiId: !Ref GetApiRestApi
      ResourceId: !Ref GetApiResource
      HttpMethod: "GET"
      AuthorizationType: "NONE"
      Integration:
        Type: "AWS"
        IntegrationHttpMethod: "POST"
        Uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:states:action/StartExecution"
        Credentials: !GetAtt GetApiRole.Arn
        RequestTemplates:
          application/json:
            Fn::Sub:
              - '{"stateMachineArn":"${StateMachineArn}","input":"{}"}'
              - StateMachineArn: !GetAtt StepFunctionsStateMachine.Arn
        IntegrationResponses:
          - StatusCode: 200
            ResponseTemplates:
              application/json: ""
      MethodResponses:
        - StatusCode: 200
  GetApiDeployment:
    Type: "AWS::ApiGateway::Deployment"
    DependsOn:
      - GetApiMethod
    Properties:
      RestApiId: !Ref GetApiRestApi
      StageName: "prod"
  PostApiRestApi:
    Type: "AWS::ApiGateway::RestApi"
    Properties:
      Name: "PostApiForStepFunctions"
      Description: "REST API exposing a POST endpoint to start Step Functions execution."
  PostApiResource:
    Type: "AWS::ApiGateway::Resource"
    Properties:
      RestApiId: !Ref PostApiRestApi
      ParentId: !GetAtt PostApiRestApi.RootResourceId
      PathPart: "execute"
  PostApiMethod:
    Type: "AWS::ApiGateway::Method"
    Properties:
      RestApiId: !Ref PostApiRestApi
      ResourceId: !Ref PostApiResource
      HttpMethod: "POST"
      AuthorizationType: "NONE"
      Integration:
        Type: "AWS"
        IntegrationHttpMethod: "POST"
        Uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:states:action/StartExecution"
        Credentials: !GetAtt PostApiRole.Arn
        RequestTemplates:
          application/json:
            Fn::Sub:
              - '{"stateMachineArn":"${StateMachineArn}","input":"$util.escapeJavaScript($input.json(''$''))"}'
              - StateMachineArn: !GetAtt StepFunctionsStateMachine.Arn
        IntegrationResponses:
          - StatusCode: 200
            ResponseTemplates:
              application/json: ""
      MethodResponses:
        - StatusCode: 200
  PostApiDeployment:
    Type: "AWS::ApiGateway::Deployment"
    DependsOn:
      - PostApiMethod
    Properties:
      RestApiId: !Ref PostApiRestApi
      StageName: "prod"
Outputs:
  StateMachineArn:
    Description: "ARN of the Step Functions state machine"
    Value: !GetAtt StepFunctionsStateMachine.Arn
    Export:
      Name: !Sub "${AWS::StackName}-StateMachineArn"
  GetApiUrl:
    Description: "URL for the GET API endpoint"
    Value: !Sub "https://${GetApiRestApi}.execute-api.${AWS::Region}.amazonaws.com/prod/execute"
    Export:
      Name: !Sub "${AWS::StackName}-GetApiUrl"
  PostApiUrl:
    Description: "URL for the POST API endpoint"
    Value: !Sub "https://${PostApiRestApi}.execute-api.${AWS::Region}.amazonaws.com/prod/execute"
    Export:
      Name: !Sub "${AWS::StackName}-PostApiUrl"
  GetApiRoleArn:
    Description: "ARN of the IAM role for GET API"
    Value: !GetAtt GetApiRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-GetApiRoleArn"
  PostApiRoleArn:
    Description: "ARN of the IAM role for POST API"
    Value: !GetAtt PostApiRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-PostApiRoleArn"