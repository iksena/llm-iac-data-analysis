AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  S3 bucket with encryption, all public access blocked, a TLS-only bucket policy,
  optional versioning, lifecycle transitions, and AWS log-delivery modes.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Naming
        Parameters:
          - NamePrefix
          - Environment
          - BucketSuffix
      - Label:
          default: Encryption
        Parameters:
          - KmsKeyArn
      - Label:
          default: Versioning and retention
        Parameters:
          - Versioning
          - ExpireObjectsAfterDays
          - ExpireNoncurrentVersionsAfterDays
          - AbortIncompleteUploadsAfterDays
      - Label:
          default: Storage class transitions (cost)
        Parameters:
          - TransitionToInfrequentAccessDays
          - TransitionToGlacierDays
      - Label:
          default: Integrations
        Parameters:
          - LogDeliveryMode
          - EnableEventBridge
          - CorsAllowedOrigin

Parameters:
  NamePrefix:
    Type: String
    Description: Prefix for the bucket name.
    AllowedPattern: "^[a-z][a-z0-9-]{1,30}[a-z0-9]$"
    ConstraintDescription: 3-32 lowercase characters, digits and hyphens.

  Environment:
    Type: String
    Description: Environment this bucket belongs to.
    Default: dev
    AllowedValues: [dev, staging, prod]

  BucketSuffix:
    Type: String
    Description: >-
      What this bucket holds, e.g. "uploads" or "artifacts". The full name
      becomes <NamePrefix>-<Environment>-<BucketSuffix>-<account>-<region>. The
      account and region are appended because bucket names are globally unique
      across every AWS customer, and a short name is almost certainly taken.
    Default: data
    AllowedPattern: "^[a-z0-9][a-z0-9-]{0,20}$"

  KmsKeyArn:
    Type: String
    Description: >-
      Customer-managed KMS key ARN. Leave empty for SSE-S3 (AES256), which is
      free and satisfies encryption-at-rest. Use a key when you need
      cross-account access, key-level audit, or independent revocation - and
      budget for a KMS request per object operation.
    Default: ""

  Versioning:
    Type: String
    Description: >-
      Keep previous versions of overwritten and deleted objects. This is the only
      protection against an application bug that overwrites data and against a
      delete you did not mean; it costs storage for every version kept, which
      ExpireNoncurrentVersionsAfterDays bounds.
    Default: Enabled
    AllowedValues: [Enabled, Suspended]

  ExpireObjectsAfterDays:
    Type: Number
    Description: >-
      Delete current objects this many days after creation. 0 keeps them
      forever, which is right for a data lake and wrong for scratch space.
    Default: 0
    MinValue: 0
    MaxValue: 36500

  ExpireNoncurrentVersionsAfterDays:
    Type: Number
    Description: >-
      Delete superseded versions after this many days. Without it, versioning
      turns into unbounded storage growth that nobody notices until the bill.
    Default: 30
    MinValue: 1
    MaxValue: 36500

  AbortIncompleteUploadsAfterDays:
    Type: Number
    Description: >-
      Abandon incomplete multipart uploads after this many days. Their parts are
      billed as storage and are invisible in the console object listing, which
      makes them the classic mystery line item.
    Default: 7
    MinValue: 1
    MaxValue: 365

  TransitionToInfrequentAccessDays:
    Type: Number
    Description: >-
      Move objects to STANDARD_IA after this many days. 0 disables. Note IA has a
      30-day minimum billing duration and a per-GB retrieval charge, so this only
      saves money for objects that really are read rarely.
    Default: 0
    MinValue: 0
    MaxValue: 36500

  TransitionToGlacierDays:
    Type: Number
    Description: >-
      Move objects to GLACIER_IR (instant retrieval) after this many days. 0
      disables. Must be greater than the IA transition when both are set.
    Default: 0
    MinValue: 0
    MaxValue: 36500

  LogDeliveryMode:
    Type: String
    Description: >-
      Add a bucket policy statement letting an AWS service write logs here.
      `alb` grants the ELB log-delivery principal, `waf-firehose` grants the
      delivery.logs principal used by WAF and VPC flow logs. `none` for a normal
      data bucket.
    Default: none
    AllowedValues: [none, alb, waf-firehose]

  EnableEventBridge:
    Type: String
    Description: >-
      Publish object-created and object-removed events to EventBridge, which is
      how you trigger an ETL job or a Lambda on upload without coupling the
      bucket to a specific consumer.
    Default: "false"
    AllowedValues: ["true", "false"]

  CorsAllowedOrigin:
    Type: String
    Description: >-
      Origin allowed to make browser requests, e.g. https://app.example.com for
      direct-to-S3 uploads. Leave empty for no CORS rule. "*" is accepted and
      almost never correct.
    Default: ""

Conditions:
  UsesKms: !Not [!Equals [!Ref KmsKeyArn, ""]]
  ExpiresObjects: !Not [!Equals [!Ref ExpireObjectsAfterDays, 0]]
  TransitionsToIa: !Not [!Equals [!Ref TransitionToInfrequentAccessDays, 0]]
  TransitionsToGlacier: !Not [!Equals [!Ref TransitionToGlacierDays, 0]]
  IsVersioned: !Equals [!Ref Versioning, "Enabled"]
  HasCors: !Not [!Equals [!Ref CorsAllowedOrigin, ""]]
  IsAlbLogTarget: !Equals [!Ref LogDeliveryMode, "alb"]
  IsFirehoseLogTarget: !Equals [!Ref LogDeliveryMode, "waf-firehose"]

Resources:
  Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      # Bucket names are globally unique across all AWS customers, so the
      # account and region are appended rather than hoping "app-dev-data" is
      # free. Lower-cased because S3 rejects uppercase in bucket names and
      # AWS::Region is already lowercase.
      BucketName: !Sub "${NamePrefix}-${Environment}-${BucketSuffix}-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          # ACLs are disabled outright. Every "public bucket" incident of the
          # last decade routed through an ACL rather than a policy.
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: !If [UsesKms, aws:kms, AES256]
              KMSMasterKeyID: !If [UsesKms, !Ref KmsKeyArn, !Ref "AWS::NoValue"]
            # Uses one data key per bucket instead of one per object. On a
            # write-heavy bucket this is the difference between a negligible KMS
            # bill and a startling one.
            BucketKeyEnabled: !If [UsesKms, true, !Ref "AWS::NoValue"]
      VersioningConfiguration:
        Status: !Ref Versioning
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: !Ref EnableEventBridge
      CorsConfiguration: !If
        - HasCors
        - CorsRules:
            - AllowedOrigins: [!Ref CorsAllowedOrigin]
              AllowedMethods: [GET, PUT, POST, HEAD]
              AllowedHeaders: ["*"]
              ExposedHeaders: [ETag]
              MaxAge: 3000
        - !Ref AWS::NoValue
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-multipart-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: !Ref AbortIncompleteUploadsAfterDays
          - !If
            - IsVersioned
            - Id: expire-noncurrent-versions
              Status: Enabled
              NoncurrentVersionExpiration:
                NoncurrentDays: !Ref ExpireNoncurrentVersionsAfterDays
            - !Ref AWS::NoValue
          - !If
            - ExpiresObjects
            - Id: expire-current-objects
              Status: Enabled
              ExpirationInDays: !Ref ExpireObjectsAfterDays
            - !Ref AWS::NoValue
          - !If
            - TransitionsToIa
            - Id: transition-to-infrequent-access
              Status: Enabled
              Transitions:
                - StorageClass: STANDARD_IA
                  TransitionInDays: !Ref TransitionToInfrequentAccessDays
            - !Ref AWS::NoValue
          - !If
            - TransitionsToGlacier
            - Id: transition-to-glacier
              Status: Enabled
              Transitions:
                - StorageClass: GLACIER_IR
                  TransitionInDays: !Ref TransitionToGlacierDays
            - !Ref AWS::NoValue

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Encryption at rest does nothing for a request made over plain HTTP.
          # This is the statement that closes that gap, and it is unconditional.
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt Bucket.Arn
              - !Sub "${Bucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

          - !If
            - IsAlbLogTarget
            - Sid: AllowAlbLogDelivery
              Effect: Allow
              Principal:
                Service: logdelivery.elasticloadbalancing.amazonaws.com
              Action: s3:PutObject
              Resource: !Sub "${Bucket.Arn}/*"
              Condition:
                StringEquals:
                  aws:SourceAccount: !Ref AWS::AccountId
            - !Ref AWS::NoValue

          - !If
            - IsFirehoseLogTarget
            - Sid: AllowServiceLogDelivery
              Effect: Allow
              Principal:
                Service: delivery.logs.amazonaws.com
              Action: s3:PutObject
              Resource: !Sub "${Bucket.Arn}/*"
              Condition:
                StringEquals:
                  aws:SourceAccount: !Ref AWS::AccountId
                  s3:x-amz-acl: bucket-owner-full-control
            - !Ref AWS::NoValue

Outputs:
  BucketName:
    Description: Bucket name, for CLI use and for properties that take a name.
    Value: !Ref Bucket

  BucketArn:
    Description: Bucket ARN, for IAM policies. Object access needs the ARN plus "/*".
    Value: !GetAtt Bucket.Arn

  BucketDomainName:
    Description: Regional domain name, for a CloudFront origin.
    Value: !GetAtt Bucket.RegionalDomainName

  BucketUri:
    Description: s3:// URI of the bucket root.
    Value: !Sub "s3://${Bucket}"