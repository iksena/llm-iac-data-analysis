AWSTemplateFormatVersion: 2010-09-09
Description: CloudFormation template for AWS Service Catalog environment for ML Workshop
Parameters:
  RootS3Url:
    Type: String
    Default: https://aws-service-catalog-reference-architectures.s3.amazonaws.com/blog_content/securing-third-party-data-and-ml-apps
    Description: Root S3 URL for nested CloudFormation templates
  EnvironmentPrefix:
    Type: String
    Default: user-1
    Description: Prefix for environment-specific resources
Resources:
  RootS3UrlParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${EnvironmentPrefix}/RootS3Url"
      Type: String
      Value: !Ref RootS3Url
      Description: Root S3 URL for nested templates
  AdminLeadEndUserRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentPrefix}-admin-lead-end-user"
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SCReadAndDescribe
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - servicecatalog:ListPortfolios
                  - servicecatalog:SearchProducts
                  - servicecatalog:DescribeProduct
                  - servicecatalog:DescribeProductView
                  - servicecatalog:DescribeProvisioningParameters
                  - servicecatalog:ListProvisioningArtifacts
                  - servicecatalog:DescribeProvisionedProduct
                  - servicecatalog:ListProvisionedProductPlans
                  - servicecatalog:DescribeRecord
                  - servicecatalog:ListRecordHistory
                  - servicecatalog:SearchProvisionedProducts
                  - servicecatalog:ScanProvisionedProducts
                Resource: "*"
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParametersByPath
                  - ssm:DescribeParameters
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/MLWorkshop/*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: "arn:aws:s3:::*/*"
                Condition:
                  StringEquals:
                    s3:ExistingObjectTag/provisioning: "true"
  StandardEndUserRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentPrefix}-standard-end-user"
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SCReadAndDescribe
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - servicecatalog:ListPortfolios
                  - servicecatalog:SearchProducts
                  - servicecatalog:DescribeProduct
                  - servicecatalog:DescribeProductView
                  - servicecatalog:DescribeProvisioningParameters
                  - servicecatalog:ListProvisioningArtifacts
                  - servicecatalog:DescribeProvisionedProduct
                  - servicecatalog:ListProvisionedProductPlans
                  - servicecatalog:DescribeRecord
                  - servicecatalog:ListRecordHistory
                  - servicecatalog:SearchProvisionedProducts
                  - servicecatalog:ScanProvisionedProducts
                Resource: "*"
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParametersByPath
                  - ssm:DescribeParameters
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/MLWorkshop/*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: "arn:aws:s3:::*/*"
                Condition:
                  StringEquals:
                    s3:ExistingObjectTag/provisioning: "true"
  VPCLaunchRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentPrefix}-vpc-launch-role"
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: servicecatalog.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LaunchPermissions
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - ec2:*
                  - cloudformation:*
                  - iam:PassRole
                Resource: "*"
  IAMRolesLaunchRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentPrefix}-iam-roles-launch-role"
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: servicecatalog.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LaunchPermissions
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - iam:*
                  - kms:*
                  - s3:*
                  - cloudformation:*
                  - iam:PassRole
                Resource: "*"
  DataExchangeLaunchRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentPrefix}-dataexchange-launch-role"
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: servicecatalog.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LaunchPermissions
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - dataexchange:*
                  - cloudformation:*
                  - iam:PassRole
                Resource: "*"
  InfrastructureLaunchRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentPrefix}-infrastructure-launch-role"
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: servicecatalog.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LaunchPermissions
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - ec2:*
                  - iam:*
                  - s3:*
                  - cloudformation:*
                  - iam:PassRole
                Resource: "*"
  ApplicationLaunchRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentPrefix}-application-launch-role"
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: servicecatalog.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LaunchPermissions
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - ec2:*
                  - iam:*
                  - s3:*
                  - cloudformation:*
                  - iam:PassRole
                Resource: "*"
  SageMakerLaunchRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentPrefix}-sagemaker-launch-role"
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: servicecatalog.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LaunchPermissions
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - sagemaker:*
                  - iam:PassRole
                  - cloudformation:*
                Resource: "*"
  ThirdPartyMLLaunchRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentPrefix}-thirdparty-ml-launch-role"
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: servicecatalog.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LaunchPermissions
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - sagemaker:*
                  - iam:PassRole
                  - cloudformation:*
                Resource: "*"
  AdminPortfolio:
    Type: AWS::ServiceCatalog::Portfolio
    Properties:
      DisplayName: !Sub "${EnvironmentPrefix}-Admin-Portfolio"
      ProviderName: AdminTeam
      Description: Portfolio for admin team
  EndUserPortfolio:
    Type: AWS::ServiceCatalog::Portfolio
    Properties:
      DisplayName: !Sub "${EnvironmentPrefix}-EndUser-Portfolio"
      ProviderName: EndUserTeam
      Description: Portfolio for end users
  VPCProduct:
    Type: AWS::ServiceCatalog::CloudFormationProduct
    Properties:
      Name: !Sub "${EnvironmentPrefix}-VPC-Product"
      Owner: AdminTeam
      Description: VPC with private subnets and endpoints
      ProvisioningArtifactParameters:
        - Name: v1
          Description: Initial version
          Info:
            TemplateBody: |
              AWSTemplateFormatVersion: 2010-09-09
              Description: VPC with private subnets and endpoints
              Resources:
                VPC:
                  Type: AWS::EC2::VPC
                  Properties:
                    CidrBlock: 10.0.0.0/16
                    EnableDnsSupport: true
                    EnableDnsHostnames: true
                PrivateSubnet1:
                  Type: AWS::EC2::Subnet
                  Properties:
                    VpcId: !Ref VPC
                    CidrBlock: 10.0.1.0/24
                    AvailabilityZone: !Select [0, !GetAZs ""]
                PrivateSubnet2:
                  Type: AWS::EC2::Subnet
                  Properties:
                    VpcId: !Ref VPC
                    CidrBlock: 10.0.2.0/24
                    AvailabilityZone: !Select [1, !GetAZs ""]
                VPCEndpoint:
                  Type: AWS::EC2::VPCEndpoint
                  Properties:
                    VpcId: !Ref VPC
                    ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
                    VpcEndpointType: Gateway
                    RouteTableIds: []
  IAMRolesProduct:
    Type: AWS::ServiceCatalog::CloudFormationProduct
    Properties:
      Name: !Sub "${EnvironmentPrefix}-IAMRoles-Product"
      Owner: AdminTeam
      Description: IAM roles with KMS keys and S3 buckets
      ProvisioningArtifactParameters:
        - Name: v1
          Description: Initial version
          Info:
            TemplateBody: |
              AWSTemplateFormatVersion: 2010-09-09
              Description: IAM roles with KMS keys and S3 buckets
              Resources:
                KMSKey:
                  Type: AWS::KMS::Key
                  Properties:
                    KeyPolicy:
                      Version: 2012-10-17
                      Statement:
                        - Effect: Allow
                          Principal:
                            AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
                          Action: kms:*
                          Resource: "*"
                S3Bucket:
                  Type: AWS::S3::Bucket
                  Properties:
                    BucketEncryption:
                      ServerSideEncryptionConfiguration:
                        - ServerSideEncryptionByDefault:
                            KMSMasterKeyID: !Ref KMSKey
                            SSEAlgorithm: aws:kms
                IAMRole:
                  Type: AWS::IAM::Role
                  Properties:
                    AssumeRolePolicyDocument:
                      Version: 2012-10-17
                      Statement:
                        - Effect: Allow
                          Principal:
                            Service: ec2.amazonaws.com
                          Action: sts:AssumeRole
                    Policies:
                      - PolicyName: S3Access
                        PolicyDocument:
                          Version: 2012-10-17
                          Statement:
                            - Effect: Allow
                              Action: s3:GetObject
                              Resource: !Sub "arn:aws:s3:::${S3Bucket}/*"
  DataExchangeProduct:
    Type: AWS::ServiceCatalog::CloudFormationProduct
    Properties:
      Name: !Sub "${EnvironmentPrefix}-DataExchange-Product"
      Owner: EndUserTeam
      Description: AWS Data Exchange product
      ProvisioningArtifactParameters:
        - Name: v1
          Description: Initial version
          Info:
            TemplateBody: |
              AWSTemplateFormatVersion: 2010-09-09
              Description: AWS Data Exchange product
              Parameters:
                DataSetId:
                  Type: String
                  Description: ID of the AWS Data Exchange dataset
              Resources:
                DataSet:
                  Type: AWS::DataExchange::DataSet
                  Properties:
                    Name: !Ref DataSetId
                    AssetType: S3_SNAPSHOT
                    Description: Sample dataset
              Outputs:
                DataSetArn:
                  Value: !GetAtt DataSet.Arn
  InfrastructureProduct:
    Type: AWS::ServiceCatalog::CloudFormationProduct
    Properties:
      Name: !Sub "${EnvironmentPrefix}-Infrastructure-Product"
      Owner: AdminTeam
      Description: Infrastructure product
      ProvisioningArtifactParameters:
        - Name: v1
          Description: Initial version
          Info:
            TemplateBody: |
              AWSTemplateFormatVersion: 2010-09-09
              Description: Infrastructure product
              Resources:
                S3Bucket:
                  Type: AWS::S3::Bucket
                  Properties:
                    VersioningConfiguration:
                      Status: Enabled
  ApplicationProduct:
    Type: AWS::ServiceCatalog::CloudFormationProduct
    Properties:
      Name: !Sub "${EnvironmentPrefix}-Application-Product"
      Owner: EndUserTeam
      Description: Application product
      ProvisioningArtifactParameters:
        - Name: v1
          Description: Initial version
          Info:
            TemplateBody: |
              AWSTemplateFormatVersion: 2010-09-09
              Description: Application product
              Resources:
                LambdaFunction:
                  Type: AWS::Lambda::Function
                  Properties:
                    Runtime: python3.9
                    Handler: index.handler
                    Code:
                      ZipFile: |
                        def handler(event, context):
                            return {'statusCode': 200}
                    Role: !GetAtt ExecutionRole.Arn
                ExecutionRole:
                  Type: AWS::IAM::Role
                  Properties:
                    AssumeRolePolicyDocument:
                      Version: 2012-10-17
                      Statement:
                        - Effect: Allow
                          Principal:
                            Service: lambda.amazonaws.com
                          Action: sts:AssumeRole
                    ManagedPolicyArns:
                      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
  SageMakerProduct:
    Type: AWS::ServiceCatalog::CloudFormationProduct
    Properties:
      Name: !Sub "${EnvironmentPrefix}-SageMaker-Product"
      Owner: EndUserTeam
      Description: SageMaker notebook instance
      ProvisioningArtifactParameters:
        - Name: v1
          Description: Initial version
          Info:
            TemplateBody: |
              AWSTemplateFormatVersion: 2010-09-09
              Description: SageMaker notebook instance
              Resources:
                NotebookInstance:
                  Type: AWS::SageMaker::NotebookInstance
                  Properties:
                    InstanceType: ml.t2.medium
                    RoleArn: !GetAtt NotebookRole.Arn
                    DirectInternetAccess: Disabled
                NotebookRole:
                  Type: AWS::IAM::Role
                  Properties:
                    AssumeRolePolicyDocument:
                      Version: 2012-10-17
                      Statement:
                        - Effect: Allow
                          Principal:
                            Service: sagemaker.amazonaws.com
                          Action: sts:AssumeRole
                    ManagedPolicyArns:
                      - arn:aws:iam::aws:policy/AmazonSageMakerFullAccess
  ThirdPartyMLProduct:
    Type: AWS::ServiceCatalog::CloudFormationProduct
    Properties:
      Name: !Sub "${EnvironmentPrefix}-ThirdPartyML-Product"
      Owner: EndUserTeam
      Description: Third-party ML model
      ProvisioningArtifactParameters:
        - Name: v1
          Description: Initial version
          Info:
            TemplateBody: |
              AWSTemplateFormatVersion: 2010-09-09
              Description: Third-party ML model
              Resources:
                SageMakerModel:
                  Type: AWS::SageMaker::Model
                  Properties:
                    ExecutionRoleArn: !GetAtt ModelRole.Arn
                    PrimaryContainer:
                      Image: 382416733822.dkr.ecr.us-east-1.amazonaws.com/ml-model:latest
                ModelRole:
                  Type: AWS::IAM::Role
                  Properties:
                    AssumeRolePolicyDocument:
                      Version: 2012-10-17
                      Statement:
                        - Effect: Allow
                          Principal:
                            Service: sagemaker.amazonaws.com
                          Action: sts:AssumeRole
                    ManagedPolicyArns:
                      - arn:aws:iam::aws:policy/AmazonSageMakerFullAccess
  AssociateVPCToAdmin:
    Type: AWS::ServiceCatalog::PortfolioProductAssociation
    Properties:
      PortfolioId: !Ref AdminPortfolio
      ProductId: !Ref VPCProduct
  AssociateIAMRolesToAdmin:
    Type: AWS::ServiceCatalog::PortfolioProductAssociation
    Properties:
      PortfolioId: !Ref AdminPortfolio
      ProductId: !Ref IAMRolesProduct
  AssociateDataExchangeToEndUser:
    Type: AWS::ServiceCatalog::PortfolioProductAssociation
    Properties:
      PortfolioId: !Ref EndUserPortfolio
      ProductId: !Ref DataExchangeProduct
  AssociateInfrastructureToAdmin:
    Type: AWS::ServiceCatalog::PortfolioProductAssociation
    Properties:
      PortfolioId: !Ref AdminPortfolio
      ProductId: !Ref InfrastructureProduct
  AssociateApplicationToEndUser:
    Type: AWS::ServiceCatalog::PortfolioProductAssociation
    Properties:
      PortfolioId: !Ref EndUserPortfolio
      ProductId: !Ref ApplicationProduct
  AssociateSageMakerToEndUser:
    Type: AWS::ServiceCatalog::PortfolioProductAssociation
    Properties:
      PortfolioId: !Ref EndUserPortfolio
      ProductId: !Ref SageMakerProduct
  AssociateThirdPartyMLToEndUser:
    Type: AWS::ServiceCatalog::PortfolioProductAssociation
    Properties:
      PortfolioId: !Ref EndUserPortfolio
      ProductId: !Ref ThirdPartyMLProduct
  VPCLaunchConstraint:
    Type: AWS::ServiceCatalog::LaunchRoleConstraint
    Properties:
      PortfolioId: !Ref AdminPortfolio
      ProductId: !Ref VPCProduct
      Description: Launch constraint for VPC product
      RoleArn: !GetAtt VPCLaunchRole.Arn
  IAMRolesLaunchConstraint:
    Type: AWS::ServiceCatalog::LaunchRoleConstraint
    Properties:
      PortfolioId: !Ref AdminPortfolio
      ProductId: !Ref IAMRolesProduct
      Description: Launch constraint for IAM roles product
      RoleArn: !GetAtt IAMRolesLaunchRole.Arn
  DataExchangeLaunchConstraint:
    Type: AWS::ServiceCatalog::LaunchRoleConstraint
    Properties:
      PortfolioId: !Ref EndUserPortfolio
      ProductId: !Ref DataExchangeProduct
      Description: Launch constraint for Data Exchange product
      RoleArn: !GetAtt DataExchangeLaunchRole.Arn
  InfrastructureLaunchConstraint:
    Type: AWS::ServiceCatalog::LaunchRoleConstraint
    Properties:
      PortfolioId: !Ref AdminPortfolio
      ProductId: !Ref InfrastructureProduct
      Description: Launch constraint for infrastructure product
      RoleArn: !GetAtt InfrastructureLaunchRole.Arn
  ApplicationLaunchConstraint:
    Type: AWS::ServiceCatalog::LaunchRoleConstraint
    Properties:
      PortfolioId: !Ref EndUserPortfolio
      ProductId: !Ref ApplicationProduct
      Description: Launch constraint for application product
      RoleArn: !GetAtt ApplicationLaunchRole.Arn
  SageMakerLaunchConstraint:
    Type: AWS::ServiceCatalog::LaunchRoleConstraint
    Properties:
      PortfolioId: !Ref EndUserPortfolio
      ProductId: !Ref SageMakerProduct
      Description: Launch constraint for SageMaker product
      RoleArn: !GetAtt SageMakerLaunchRole.Arn
  ThirdPartyMLLaunchConstraint:
    Type: AWS::ServiceCatalog::LaunchRoleConstraint
    Properties:
      PortfolioId: !Ref EndUserPortfolio
      ProductId: !Ref ThirdPartyMLProduct
      Description: Launch constraint for third-party ML product
      RoleArn: !GetAtt ThirdPartyMLLaunchRole.Arn
  AdminLeadPrincipalAssociation:
    Type: AWS::ServiceCatalog::PortfolioPrincipalAssociation
    Properties:
      PortfolioId: !Ref AdminPortfolio
      PrincipalARN: !GetAtt AdminLeadEndUserRole.Arn
      PrincipalType: IAM
  StandardEndUserPrincipalAssociation:
    Type: AWS::ServiceCatalog::PortfolioPrincipalAssociation
    Properties:
      PortfolioId: !Ref EndUserPortfolio
      PrincipalARN: !GetAtt StandardEndUserRole.Arn
      PrincipalType: IAM
Outputs:
  AdminSwitchRoleURL:
    Description: Switch role URL for admin lead end user
    Value: !Sub "https://signin.aws.amazon.com/switchrole?roleName=${AdminLeadEndUserRole}&account=${AWS::AccountId}"
  DeveloperSwitchRoleURL:
    Description: Switch role URL for standard end user
    Value: !Sub "https://signin.aws.amazon.com/switchrole?roleName=${StandardEndUserRole}&account=${AWS::AccountId}"