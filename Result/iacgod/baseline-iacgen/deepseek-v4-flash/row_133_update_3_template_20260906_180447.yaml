AWSTemplateFormatVersion: "2010-09-09"
Description: "Create three private subnets with dedicated route tables, NACL associations, and S3 VPC endpoint"
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: "The VPC ID where subnets will be created"
  NatGatewayA:
    Type: String
    Description: "NAT Gateway ID in us-east-1a"
  NatGatewayB:
    Type: String
    Description: "NAT Gateway ID in us-east-1b"
  NatGatewayC:
    Type: String
    Description: "NAT Gateway ID in us-east-1c"
  NetworkAclId:
    Type: String
    Description: "Network ACL ID to associate with each subnet"
  AvailabilityZoneA:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: "Availability Zone for subnet A (default us-east-1a)"
    Default: "us-east-1a"
  AvailabilityZoneB:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: "Availability Zone for subnet B (default us-east-1b)"
    Default: "us-east-1b"
  AvailabilityZoneC:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: "Availability Zone for subnet C (default us-east-1c)"
    Default: "us-east-1c"
Resources:
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcId
      CidrBlock: "10.24.24.0/24"
      AvailabilityZone: !Ref AvailabilityZoneA
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-PrivateSubnet-1a"
  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcId
      CidrBlock: "10.24.25.0/24"
      AvailabilityZone: !Ref AvailabilityZoneB
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-PrivateSubnet-1b"
  PrivateSubnetC:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcId
      CidrBlock: "10.24.26.0/24"
      AvailabilityZone: !Ref AvailabilityZoneC
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-PrivateSubnet-1c"
  RouteTableA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-PrivateRouteTable-1a"
  RouteTableB:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-PrivateRouteTable-1b"
  RouteTableC:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-PrivateRouteTable-1c"
  RouteA:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref RouteTableA
      DestinationCidrBlock: "0.0.0.0/0"
      NatGatewayId: !Ref NatGatewayA
  RouteB:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref RouteTableB
      DestinationCidrBlock: "0.0.0.0/0"
      NatGatewayId: !Ref NatGatewayB
  RouteC:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref RouteTableC
      DestinationCidrBlock: "0.0.0.0/0"
      NatGatewayId: !Ref NatGatewayC
  SubnetRouteTableAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref RouteTableA
  SubnetRouteTableAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref RouteTableB
  SubnetRouteTableAssociationC:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetC
      RouteTableId: !Ref RouteTableC
  SubnetNetworkAclAssociationA:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      NetworkAclId: !Ref NetworkAclId
  SubnetNetworkAclAssociationB:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      NetworkAclId: !Ref NetworkAclId
  SubnetNetworkAclAssociationC:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetC
      NetworkAclId: !Ref NetworkAclId
  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      RouteTableIds:
        - !Ref RouteTableA
        - !Ref RouteTableB
        - !Ref RouteTableC
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: "s3:*"
            Resource: "*"
      VpcEndpointType: Gateway
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-S3Endpoint"
Outputs:
  PrivateSubnetIds:
    Description: "Comma separated list of private subnet IDs"
    Value: !Join [",", [!Ref PrivateSubnetA, !Ref PrivateSubnetB, !Ref PrivateSubnetC]]
    Export:
      Name: !Sub "${AWS::Region}-${AWS::StackName}-PrivateSubnetIds"
  RouteTableIds:
    Description: "Comma separated list of private route table IDs"
    Value: !Join [",", [!Ref RouteTableA, !Ref RouteTableB, !Ref RouteTableC]]
    Export:
      Name: !Sub "${AWS::Region}-${AWS::StackName}-RouteTableIds"
  SubnetGroupCidr:
    Description: "CIDR block covering all private subnets"
    Value: "10.24.24.0/21"
    Export:
      Name: !Sub "${AWS::Region}-${AWS::StackName}-SubnetGroupCidr"