AWSTemplateFormatVersion: "2010-09-09"

Description: |
  This stack creates a SQS queue using KMS encryption
  with a SQS policy allowing the account that the
  queue is deployed into the ability to read and write
  from the queue

Parameters:
  KmsKey:
    Description: The KMS key master ID
    Type: String

Resources:
  # An SQS queue
  Queue:
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Type: AWS::SQS::Queue
    Properties:
      DelaySeconds: 0
      FifoQueue: false
      KmsDataKeyReusePeriodSeconds: 300
      KmsMasterKeyId: !Ref KmsKey
      MaximumMessageSize: 262144
      MessageRetentionPeriod: 345600
      ReceiveMessageWaitTimeSeconds: 0
      VisibilityTimeout: 30

  # An SQS queue policy for the account to read/write from the queue
  QueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !GetAtt Queue.QueueUrl
      PolicyDocument:
        Statement:
          - Action:
              - SQS:SendMessage
              - SQS:ReceiveMessage
            Effect: Allow
            Resource: !GetAtt Queue.Arn
            Principal:
              AWS:
                - !Ref AWS::AccountId

  # CloudWatch Alarm to monitor the number of visible messages in the SQS queue
  AlarmVisibleMessages:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "Alarm when number of visible messages exceeds 10"
      MetricName: ApproximateNumberOfMessagesVisible
      Namespace: AWS/SQS
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      ActionsEnabled: true
      AlarmActions:
        - !Ref SnsTopic
      Dimensions:
        QueueName:
          !GetAtt Queue.QueueName

  # SNS Topic for alarm notifications
  SnsTopic:
    Type: AWS::SNS::Topic
    Properties: {}