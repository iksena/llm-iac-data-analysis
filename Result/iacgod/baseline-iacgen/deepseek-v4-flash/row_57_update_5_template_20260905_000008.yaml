AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFormation template for PII classification scanner using S3 Access Point, Comprehend, DynamoDB, and optional SNS notifications.'

Parameters:
  AccessPointArn:
    Type: String
    Description: ARN of the S3 Access Point to scan.
  LambdaCodeS3Bucket:
    Type: String
    Description: S3 bucket containing the Lambda function code.
  LambdaCodeS3Key:
    Type: String
    Description: S3 key for the Lambda function code zip file.
  LambdaMemorySize:
    Type: Number
    Default: 512
    Description: Memory size for the Lambda function (MB).
    AllowedValues:
      - 128
      - 256
      - 512
      - 1024
      - 2048
      - 4096
      - 8192
      - 10240
  LambdaTimeout:
    Type: Number
    Default: 600
    Description: Timeout for the Lambda function (seconds).
    MinValue: 1
    MaxValue: 900
  ComprehendLanguageCode:
    Type: String
    Default: en
    Description: Language code for Comprehend DetectPiiEntities.
    AllowedValues:
      - en
      - es
      - fr
      - de
      - it
      - pt
      - ar
      - hi
      - ja
      - ko
      - zh
      - zh-TW
  MaxFilesToScan:
    Type: Number
    Default: 500
    Description: Maximum number of files to scan per Lambda invocation.
    MinValue: 1
    MaxValue: 10000
  VpcId:
    Type: String
    Default: ''
    Description: VPC ID if the Access Point is VPC-scoped. Leave empty for internet-origin.
    AllowedPattern: '^(vpc-[0-9a-f]{8}|vpc-[0-9a-f]{17})?$'
  SubnetIds:
    Type: CommaDelimitedList
    Default: ''
    Description: Comma-separated list of subnet IDs for Lambda VPC configuration.
    AllowedPattern: '^(subnet-[0-9a-f]{8,17}(,subnet-[0-9a-f]{8,17})*)?$'
  SecurityGroupId:
    Type: String
    Default: ''
    Description: Security group ID for Lambda VPC configuration.
    AllowedPattern: '^(sg-[0-9a-f]{8}|sg-[0-9a-f]{17})?$'
  RouteTableIds:
    Type: CommaDelimitedList
    Default: ''
    Description: Comma-separated list of route table IDs for S3 Gateway endpoint.
    AllowedPattern: '^(rtb-[0-9a-f]{8,17}(,rtb-[0-9a-f]{8,17})*)?$'
  CreateEndpoints:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Set to false if the VPC already has endpoints for S3, DynamoDB, Comprehend, and SNS.
  SnsTopicArn:
    Type: String
    Default: ''
    Description: Optional SNS topic ARN for notifications. Leave empty to disable.
  DynamoDBTableName:
    Type: String
    Default: PiiClassificationReports
    Description: Name of the DynamoDB table for classification reports.

Conditions:
  IsVpcDeployment: !Not [!Equals [!Ref VpcId, '']]
  HasSubnetIds: !Not [!Equals [!Join [',', !Ref SubnetIds], '']]
  HasSecurityGroupId: !Not [!Equals [!Ref SecurityGroupId, '']]
  IsVpcDeploymentValid: !And
    - !Condition IsVpcDeployment
    - !Condition HasSubnetIds
    - !Condition HasSecurityGroupId
  CreateVpcEndpoints: !And
    - !Condition IsVpcDeploymentValid
    - !Equals [!Ref CreateEndpoints, 'true']
  HasSnsTopic: !Not [!Equals [!Ref SnsTopicArn, '']]

Resources:
  ScannerLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref ScannerLambdaPolicy
        - !If
          - IsVpcDeploymentValid
          - !Ref VpcLambdaPolicy
          - !Ref AWS::NoValue
        - !If
          - HasSnsTopic
          - !Ref SnsPublishPolicy
          - !Ref AWS::NoValue

  ScannerLambdaPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:ListBucket
            Resource:
              - !Ref AccessPointArn
              - !Join ['', [!Ref AccessPointArn, '/*']]
          - Effect: Allow
            Action:
              - comprehend:DetectPiiEntities
            Resource: '*'
          - Effect: Allow
            Action:
              - dynamodb:PutItem
            Resource: !GetAtt ReportTable.Arn
          - Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: '*'

  VpcLambdaPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: IsVpcDeploymentValid
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - ec2:CreateNetworkInterface
              - ec2:DescribeNetworkInterfaces
              - ec2:DeleteNetworkInterface
            Resource: '*'

  SnsPublishPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: HasSnsTopic
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - sns:Publish
            Resource: !Ref SnsTopicArn

  ReportTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref DynamoDBTableName
      AttributeDefinitions:
        - AttributeName: FileKey
          AttributeType: S
        - AttributeName: ScanTimestamp
          AttributeType: S
      KeySchema:
        - AttributeName: FileKey
          KeyType: HASH
        - AttributeName: ScanTimestamp
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS

  ScannerLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-pii-scanner'
      Runtime: python3.12
      Handler: index.handler
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      MemorySize: !Ref LambdaMemorySize
      Timeout: !Ref LambdaTimeout
      Role: !GetAtt ScannerLambdaRole.Arn
      Environment:
        Variables:
          ACCESS_POINT_ARN: !Ref AccessPointArn
          DYNAMODB_TABLE: !Ref DynamoDBTableName
          COMPREHEND_LANGUAGE_CODE: !Ref ComprehendLanguageCode
          MAX_FILES_TO_SCAN: !Ref MaxFilesToScan
          SNS_TOPIC_ARN: !If [HasSnsTopic, !Ref SnsTopicArn, '']
      VpcConfig:
        Fn::If:
          - IsVpcDeploymentValid
          -
            SubnetIds: !Ref SubnetIds
            SecurityGroupIds:
              - !Ref SecurityGroupId
          - !Ref AWS::NoValue

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateVpcEndpoints
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      RouteTableIds: !Ref RouteTableIds
      VpcEndpointType: Gateway

  DynamoDBEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateVpcEndpoints
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.dynamodb'
      SubnetIds: !Ref SubnetIds
      SecurityGroupIds:
        - !Ref SecurityGroupId
      VpcEndpointType: Interface

  ComprehendEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateVpcEndpoints
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.comprehend'
      SubnetIds: !Ref SubnetIds
      SecurityGroupIds:
        - !Ref SecurityGroupId
      VpcEndpointType: Interface

  SNSEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateVpcEndpoints
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.sns'
      SubnetIds: !Ref SubnetIds
      SecurityGroupIds:
        - !Ref SecurityGroupId
      VpcEndpointType: Interface

Outputs:
  ScannerFunctionArn:
    Description: ARN of the PII scanner Lambda function
    Value: !GetAtt ScannerLambdaFunction.Arn
  ReportTableName:
    Description: Name of the DynamoDB table storing classification reports
    Value: !Ref DynamoDBTableName
  ExampleCliInvocation:
    Description: Example AWS CLI command to invoke the scanner
    Value: !Sub 'aws lambda invoke --function-name ${ScannerLambdaFunction} --payload "{}" response.json'