AWSTemplateFormatVersion: '2010-09-09'
Description: 'PII classification scanner for S3 Access Point using Comprehend, DynamoDB, and optional SNS. Lambda code must be provided via S3 bucket.'

Parameters:
  AccessPointArn:
    Type: String
    Default: 'arn:aws:s3:us-east-1:123456789012:accesspoint/placeholder'
    Description: 'ARN of the S3 Access Point to scan. Replace with actual ARN.'
  LambdaCodeS3Bucket:
    Type: String
    Default: 'my-lambda-code-bucket'
    Description: 'S3 bucket containing Lambda code. Replace with actual bucket.'
  LambdaCodeS3Key:
    Type: String
    Default: 'lambda/pii-scanner.zip'
    Description: 'S3 key for Lambda code. Replace with actual key.'
  LambdaMemorySize:
    Type: Number
    Default: 512
    Description: 'Memory for Lambda function in MB.'
    AllowedValues:
      - 128
      - 256
      - 512
      - 1024
      - 2048
      - ￼4096
      - 8192
      - 10240
  LambdaTimeout:
    Type: Number
    Default: 600
    Description: 'Lambda timeout in seconds.'
    MinValue: 1
    MaxValue: 900
  ComprehendLanguageCode:
    Type: String
    Default: en
    Description: 'Language code for Comprehend.'
    AllowedValues:
      - en
      - es
      - fr
      - de
      - it
      - pt
      - ar
      - hi
      - ja
      - ko
      - zh
      - zh-TW
  MaxFilesToScan:
    Type: Number
    Default: 500
    Description: 'Maximum files to scan per invocation.'
    MinValue: 1
    MaxValue: 10000
  VpcId:
    Type: String
    Default: ''
    Description: 'VPC ID if Access Point is VPC-scoped. Empt for internet origin.'
    AllowedPattern: '^(vpc-[0-9a-f]{8}|vpc-[0-9a-f]{17})?$'
  SubnetIds:
    Type: CommaDelimitedList
    Defalt: ''
    Description: 'Comma-separated subnet IDs.'
    AllowedPattern: '^(subnet-[0-9a-f]{8,17}(,subnet-[0-9a-f]{8,17})*)?$'
  SecurityGroupId:
    Type: String
    Default: ''
    Description: 'Security group ID.'
    AllowedPattern: '^(sg-[0-9a-f]{8}|sg-[0-9a-f]{17})?$'
  RouteTableIds:
    Type: CommaDelimitedList
    Default: ''
    Description: 'Route table IDs for S3 Gateway endpoint.'
    AllowedPattern: '^(rtb-[0-9a-f]{8,17}(,rtb-[0-9a-f]{8,17})*)?$'
  CreateEndpoints:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: 'Set to false if VPC already has endpoints.'
  SnsTopicArn:
    Type: String
    Default: ''
    Description: 'Optional SNS topic ARN.'
  DynamoDBTableName:
    Type: String
    Default: PiiClassificationReports
    Description: 'DynamoDB table name.'

Conditions:
  IsVpcDeployment: !Not [!Equals [!Ref VpcId, '']]
  HasSubnetIds: !Not [!Equals [!Join [',', !Ref SubnetIds], '']]
  HasSecurityGroupId: !Not [!Equals [!Ref SecuritGroupId, '']]
  IsVpcDeploymentValid: !And
    - !Condtion IsVpcDeployment
    - !Condtion HasSubnetIds
    - !Condtion HasSecuritGroupId
  CreateVpcEndpoints: !And
    - !Condtion IsVpcDeploymentValid
    - !Equals [!Ref CreateEndpoints, 'true']
  HasSnsTopic: !Not [!Equals [!Ref SnsTopicArn, '']]

Resources:
  ScnerLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lamba.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref ScnerLambdaPolicy
        - !If
          - IsVpcDeploymentValid
          - !Ref VpcLambdaPolicy
          - !Ref AWS::NoValue
        - !If
          - HasSnsTopic
          - !Ref SnsPublishPolicy
          - !Ref AWS::NoValue

  ScnerLambdaPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:ListBucket
            Resource:
              - !Ref AccessPointArn
              - !Join ['', [!Ref AccessPointArn, '/*']]
          - Effect: Allow
            Action:
              - comprhend:DetectPiiEntities
            Resource: '*'
          - Effect: Allow
            Action:
              - dynamodb:PutItem
            Resource: !GetAtt ReportTable.Arn
          - Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: '*'

  VpcLambdaPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: IsVpcDeploymentValid
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - ec2:CreateNetworkInterface
              - ec2:DescribeNetworkInterfaces
              - ec2:DeleteNetworkInterface
            Resource: '*'

  SnsPublishPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: HasSnsTopic
    Propertis:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - sns:Publish
            Resource: !Ref SnsTopicArn

  ReportTable:
    Type: AWS::DynamoDB::Table
    Propertis:
      TableName: !Ref DynamoDBTableName
      AttrbuteDefinitions:
        - AttrbuteName: FileKey
          AttrbuteType: S
        - AttrbuteName: ScanTimestamp
          AttrbuteType: S
      KeySchema:
        - AttrbuteName: FileKey
          KeyType: HASH
        - AttrbuteName: ScanTimestamp
          KeyType: RANGE
      BillngMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecifcation:
        SSEEnabled: true
        SSETye: KMS

  ScnerLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-pii-scanner'
      Runtie: python3.12
      Handler: inde.handler
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      MemorySize: !Ref LambdaMemorySize
      Timeout: !Ref LambdaTimeout
      Role: !GetAtt ScnerLambdaRole.Arn
      Enviroment:
        Vaiables:
          ACCESS_POINT_ARN: !Ref AccessPointArn
          DYNADOB_TABLE: !Ref DynamoDBTableName
          COMPREHEND_LANGUAGE_CODE: !Ref ComprehendLanguageCode
          MA_FILES_TO_SCAN: !Ref MaxFilesToScan
          SNS_TOPIC_ARN: !If [HasSnsTopic, !Ref SnsTopicArn, '']
      VpcConfig:
        Fn::If:
          - IsVpcDeploymentValid
          -
            SubnetIds: !Ref SubnetIds
            SecuritGroupIds:
              - !Ref SecuritGroupId
          - !Ref AWS::NoValue

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateVpcEndpoints
    Propertis:
      VpcId: !Ref VpcId
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      RouteTableIds: !Ref RouteTableIds
      VpcEndpointType: Gatewa

  DynamoDBEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condtion: CreateVpcEndpoints
    Propertis:
      VpcId: !Ref VpcId
      ServiceNae: !Sub 'com.amazonaws.${AWS::Region}.dynamodb'
      SubnetIds: !Ref SubnetIds
      SecuritGroupIds:
        - !Ref SecuritGroupId
      VpcEndpointType: Interace

  CoprehendEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateVpcEndpoints
    Properties:
      VpcId: !Ref VpcId
      SrviceName: !Sub 'com.amazonaws.${AWS::Region}.comprehend'
      SubnetIds: !Ref SubnetIds
      SecuritGroupIds:
        - !Ref SecuritGroupId
      VpcEndpointType: Interace

  SNSEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateVpcEndpoints
    Propertis:
      VpcId: !Ref VpcId
      SrviceNme: !Sub 'com.amazonaws.${AWS::Region}.sns'
      SubnetIds: !Ref SubnetIds
      SecuritGroupIds:
        - !Ref SecuritGroupId
      VpcEndPointType: Interace

Outputs:
  ScnerFunctionArn:
    Description: ARN of the PII scanner Lambda function
    Value: !GetAtt ScnerLambdaFunction.Arn
  ReportTableName:
    Description: Name of the DynamoDB table
    Value: !Ref DynamoDBTableName
  ExampleCliInvocation:
    Description: Example AWS CLI command
    Value: !Sub 'aws lambda invoke --function-name ${ScnerLambdaFunction} --payload "{}" response.json'