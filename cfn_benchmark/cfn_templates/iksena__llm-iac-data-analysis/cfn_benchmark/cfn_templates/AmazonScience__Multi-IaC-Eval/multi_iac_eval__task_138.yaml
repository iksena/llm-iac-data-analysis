Description: |
  This stack automates the creation of EC2 DHCP options and an SQS queue for processing messages

Conditions:
  IsUsEast1: !Equals [!Ref AWS::Region, "us-east-1"]

Resources:

  # DHCP options using Amazon provided DNS
  IamRole:
    Type: AWS::EC2::DHCPOptions
    Properties:
      DomainName: !If [IsUsEast1, "ec2.internal", !Sub "${AWS::Region}.compute.internal"]
      DomainNameServers:
        - AmazonProvidedDNS
      NetbiosNodeType: 2

  # SQS Queue for processing messages
  MessageQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-queue"
      VisibilityTimeout: 300
      MessageRetentionPeriod: 1209600
      KmsMasterKeyId: alias/aws/sqs
      KmsDataKeyReusePeriodSeconds: 300
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 15

  # Dead Letter Queue for failed messages
  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-dead-letter-queue"
      MessageRetentionPeriod: 1209600