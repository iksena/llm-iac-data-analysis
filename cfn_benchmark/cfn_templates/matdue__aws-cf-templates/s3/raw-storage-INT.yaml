AWSTemplateFormatVersion: '2010-09-09'
Description: 'S3 Bucket to store raw data'

Parameters:
  Project:
    Description: The project name.
    Type: String
  EncryptionKeyStack:
    Description: The stack name containing the encryption key to enable server-side encryption.
    Type: String
    Default: ''

Conditions:
  EncryptionKeyProvided: !Not [!Equals [!Ref EncryptionKeyStack, '']]

Resources:
  Bucket:
    Type: 'AWS::S3::Bucket'
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              KMSMasterKeyID: !If [EncryptionKeyProvided, 'Fn::ImportValue': !Sub '${EncryptionKeyStack}-Alias', !Ref 'AWS::NoValue']
              SSEAlgorithm: aws:kms
      LifecycleConfiguration:
        Rules:
          #- Status: Enabled
          #  Transitions:
          #    - StorageClass: STANDARD_IA
          #      TransitionInDays: 30
          #    - StorageClass: GLACIER
          #      TransitionInDays: 90
          #    # - StorageClass: DEEP_ARCHIVE   Not yet available in CloudFormation templates (although documented...)
          #    #   TransitionInDays: 180
          - Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Project
          Value: !Ref Project

  BucketPolicy:
    Type: 'AWS::S3::BucketPolicy'
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Action:
              - 's3:ReplicateDelete'
              - 's3:ReplicateObject'
              - 's3:GetBucketVersioning'
              - 's3:PutBucketVersioning'
            Effect: Allow
            Resource:
              - !Sub 'arn:aws:s3:::${Bucket}'
              - !Sub 'arn:aws:s3:::${Bucket}/*'
            Principal:
              AWS: 'arn:aws:iam::123456789012:root'  # Allow PROD account to replicate into this bucket
          - Action:
              - 's3:*'
            Effect: Deny
            Resource:
              - !Join
                - ''
                - - 'arn:aws:s3:::'
                  - !Ref Bucket
              - !Join
                - ''
                - - 'arn:aws:s3:::'
                  - !Ref Bucket
                  - /*
            Principal: '*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

Outputs:
  BucketName:
    Value: !Ref Bucket
    Description: S3 Bucket to store raw data
    Export:
      Name: !Sub '${AWS::StackName}-BucketName'
  Arn:
    Value: !GetAtt Bucket.Arn
    Description: Arn
    Export:
      Name: !Sub '${AWS::StackName}-Arn'