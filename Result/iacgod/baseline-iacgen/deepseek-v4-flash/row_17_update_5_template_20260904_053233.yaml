AWSTemplateFormatVersion: "2010-09-09"
Description: "Creates two VPCs (Users and Fog) for edge computing with private connectivity to S3, KMS, and additional services for Fog VPC. If your account has reached the VPC limit, set CreateNewVPCs to false and provide existing VPC IDs."
Parameters:
  CreateNewVPCs:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: "Set to 'true' to create new VPCs, or 'false' to use existing VPCs provided below."
  ExistingUsersVPCId:
    Type: String
    Default: ""
    Description: "If CreateNewVPCs is false, provide the ID of an existing VPC for the Users layer (CIDR 10.50.0.0/16 recommended)."
  ExistingFogVPCId:
    Type: String
    Default: ""
    Description: "If CreateNewVPCs is false, provide the ID of an existing VPC for the Fog layer (CIDR 10.60.0.0/16 recommended)."
Conditions:
  CreateUsersVPC: !Equals [!Ref CreateNewVPCs, "true"]
  CreateFogVPC: !Equals [!Ref CreateNewVPCs, "true"]
  UseExistingUsersVPC: !Equals [!Ref CreateNewVPCs, "false"]
  UseExistingFogVPC: !Equals [!Ref CreateNewVPCs, "false"]
Resources:
  UsersVPC:
    Type: AWS::EC2::VPC
    Condition: CreateUsersVPC
    Properties:
      CidrBlock: 10.50.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: UsersVPC
  UsersSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !If [CreateUsersVPC, !Ref UsersVPC, !Ref ExistingUsersVPCId]
      CidrBlock: 10.50.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: UsersSubnet
  UsersRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !If [CreateUsersVPC, !Ref UsersVPC, !Ref ExistingUsersVPCId]
      Tags:
        - Key: Name
          Value: UsersRouteTable
  UsersSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref UsersSubnet
      RouteTableId: !Ref UsersRouteTable
  UsersS3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !If [CreateUsersVPC, !Ref UsersVPC, !Ref ExistingUsersVPCId]
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref UsersRouteTable
  UsersKMSEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for KMS interface endpoint in Users VPC
      VpcId: !If [CreateUsersVPC, !Ref UsersVPC, !Ref ExistingUsersVPCId]
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 10.50.0.0/16
  UsersKMSEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !If [CreateUsersVPC, !Ref UsersVPC, !Ref ExistingUsersVPCId]
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.kms"
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref UsersSubnet
      SecurityGroupIds:
        - !Ref UsersKMSEndpointSecurityGroup
      PrivateDnsEnabled: true
  FogVPC:
    Type: AWS::EC2::VPC
    Condition: CreateFogVPC
    Properties:
      CidrBlock: 10.60.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: FogVPC
  FogSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !If [CreateFogVPC, !Ref FogVPC, !Ref ExistingFogVPCId]
      CidrBlock: 10.60.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: FogSubnet
  FogRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !If [CreateFogVPC, !Ref FogVPC, !Ref ExistingFogVPCId]
      Tags:
        - Key: Name
          Value: FogRouteTable
  FogSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref FogSubnet
      RouteTableId: !Ref FogRouteTable
  FogS3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !If [CreateFogVPC, !Ref FogVPC, !Ref ExistingFogVPCId]
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref FogRouteTable
  FogEndpointsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for interface endpoints in Fog VPC
      VpcId: !If [CreateFogVPC, !Ref FogVPC, !Ref ExistingFogVPCId]
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 10.60.0.0/16
  FogKMSEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !If [CreateFogVPC, !Ref FogVPC, !Ref ExistingFogVPCId]
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.kms"
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref FogSubnet
      SecurityGroupIds:
        - !Ref FogEndpointsSecurityGroup
      PrivateDnsEnabled: true
  FogSecretsManagerEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !If [CreateFogVPC, !Ref FogVPC, !Ref ExistingFogVPCId]
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.secretsmanager"
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref FogSubnet
      SecurityGroupIds:
        - !Ref FogEndpointsSecurityGroup
      PrivateDnsEnabled: true
  FogEventBridgeEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !If [CreateFogVPC, !Ref FogVPC, !Ref ExistingFogVPCId]
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.events"
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref FogSubnet
      SecurityGroupIds:
        - !Ref FogEndpointsSecurityGroup
      PrivateDnsEnabled: true
  FogSTSEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !If [CreateFogVPC, !Ref FogVPC, !Ref ExistingFogVPCId]
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.sts"
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref FogSubnet
      SecurityGroupIds:
        - !Ref FogEndpointsSecurityGroup
      PrivateDnsEnabled: true
  FogLambdaEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !If [CreateFogVPC, !Ref FogVPC, !Ref ExistingFogVPCId]
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.lambda"
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref FogSubnet
      SecurityGroupIds:
        - !Ref FogEndpointsSecurityGroup
      PrivateDnsEnabled: true