AWSTemplateFormatVersion: "2010-09-09"
Description: "Main Stack for Hive Metastore Infrastructure"

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "CFN templates Location"
        Parameters:
          - TemplateBucketName
      - Label:
          default: "Environment Configuration"
        Parameters:
          - ProjectName
      - Label:
          default: "Network Configuration"
        Parameters:
          - VpcCIDR
          - PublicSubnet1CIDR
          - PublicSubnet2CIDR
          - PrivateSubnet1CIDR
          - PrivateSubnet2CIDR
      - Label:
          default: "ECR Configuration"
        Parameters:
          - ECRRepoName
      - Label:
          default: "Database Configuration"
        Parameters:
          - DBIdentifier
          - DBInstanceClass
          - DBEngineVersion
      - Label:
          default: "S3 Configuration"
        Parameters:
          - HiveMetastoreS3BucketName
      - Label:
          default: "EKS Configuration"
        Parameters:
          - AnalyticsClusterName
          - ClusterVersion
          - InstanceType
          - DeploymentSourceIP

Parameters:
  # Bucket to store CFN templates
  TemplateBucketName:
    Description: Name of the S3 bucket containing the nested stack templates
    Type: String

  # Resource Tag
  ProjectName:
    Description: An environment name that is prefixed to resource names
    Type: String
    Default: KerberosEMRonEKS

  # Network
  VpcCIDR:
    Description: Please enter the IP range (CIDR notation) for this VPC
    Type: String
    Default: 10.0.1.0/24

  PublicSubnet1CIDR:
    Description: Please enter the IP range (CIDR notation) for the public subnet in the first Availability Zone
    Type: String
    Default: 10.0.1.0/26

  PublicSubnet2CIDR:
    Description: Please enter the IP range (CIDR notation) for the public subnet in the second Availability Zone
    Type: String
    Default: 10.0.1.64/26

  PrivateSubnet1CIDR:
    Description: Please enter the IP range (CIDR notation) for the private subnet in the first Availability Zone
    Type: String
    Default: 10.0.1.128/26

  PrivateSubnet2CIDR:
    Description: Please enter the IP range (CIDR notation) for the private subnet in the second Availability Zone
    Type: String
    Default: 10.0.1.192/26

  # ECR
  ECRRepoName:
    Type: String
    Default: "hive-metastore"
    Description: Name of the ECR repository for Hive Metastore

  # RDS
  DBIdentifier:
    Description: Name of the database for the Hive Metastore
    Type: String
    Default: hivemetastoredb

  DBInstanceClass:
    Description: The compute and memory capacity class for the RDS instance
    Type: String
    Default: db.r5.large

  DBEngineVersion:
    Description: The version number of the Aurora PostgreSQL database engine
    Type: String
    Default: "16.4"

  # S3
  HiveMetastoreS3BucketName:
    Description: Name of the S3 bucket to be used for Hive Metastore data storage
    Type: String
    Default: "demo-emr-eks-kerberos-data"

  # EKS
  AnalyticsClusterName:
    Description: Name of the Analytics EKS cluster
    Type: String
    Default: analytics-cluster

  ClusterVersion:
    Description: Kubernetes version for EKS clusters
    Type: String
    Default: "1.35"

  InstanceType:
    Description: EC2 instance type for the EKS worker nodes
    Type: String
    Default: m5.xlarge

  DeploymentSourceIP:
    Description: Public IP of deployment machine for EKS API access
    Type: String
    AllowedPattern: "^([0-9]{1,3}\\.){3}[0-9]{1,3}$"

Resources:
  NetworkStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub https://${TemplateBucketName}.s3.${AWS::Region}.amazonaws.com/cloudformation/data-infra/network-stack.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        VpcCIDR: !Ref VpcCIDR
        PublicSubnet1CIDR: !Ref PublicSubnet1CIDR
        PublicSubnet2CIDR: !Ref PublicSubnet2CIDR
        PrivateSubnet1CIDR: !Ref PrivateSubnet1CIDR
        PrivateSubnet2CIDR: !Ref PrivateSubnet2CIDR
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete

  ECRStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub https://${TemplateBucketName}.s3.${AWS::Region}.amazonaws.com/cloudformation/data-infra/ecr-stack.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        ECRRepoName: !Ref ECRRepoName
        CommonKMSKeyArn: !GetAtt NetworkStack.Outputs.CommonKMSKeyArn
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete

  S3Stack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub https://${TemplateBucketName}.s3.${AWS::Region}.amazonaws.com/cloudformation/data-infra/s3-stack.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        HiveMetastoreS3BucketName: !Ref HiveMetastoreS3BucketName
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete

  EKSStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - S3Stack # NetworkStack - Dependency already enforced
    Properties:
      TemplateURL: !Sub https://${TemplateBucketName}.s3.${AWS::Region}.amazonaws.com/cloudformation/data-infra/eks-stack.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        VPC: !GetAtt NetworkStack.Outputs.VPC
        PrivateSubnets: !GetAtt NetworkStack.Outputs.PrivateSubnets
        InstanceType: !Ref InstanceType
        AnalyticsClusterName: !Ref AnalyticsClusterName
        ClusterVersion: !Ref ClusterVersion
        HiveMetastoreS3BucketName: !Ref HiveMetastoreS3BucketName
        DeploymentSourceIP: !Ref DeploymentSourceIP
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete

  EMROnEKSRolesStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub https://${TemplateBucketName}.s3.${AWS::Region}.amazonaws.com/cloudformation/data-infra/emr-on-eks-roles-stack.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        CreateEMRContainersServiceLinkedRole: "false"
        HiveMetastoreS3BucketName: !Ref HiveMetastoreS3BucketName
        CommonKMSKeyArn: !GetAtt NetworkStack.Outputs.CommonKMSKeyArn
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete

  RDSStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - ECRStack # NetworkStack, EKSStack - Dependency already enforced
      - S3Stack
    Properties:
      TemplateURL: !Sub https://${TemplateBucketName}.s3.${AWS::Region}.amazonaws.com/cloudformation/data-infra/rds-stack.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        VPC: !GetAtt NetworkStack.Outputs.VPC
        VpcCIDR: !Ref VpcCIDR
        PrivateSubnets: !GetAtt NetworkStack.Outputs.PrivateSubnets
        DBIdentifier: !Ref DBIdentifier
        DBInstanceClass: !Ref DBInstanceClass
        DBEngineVersion: !Ref DBEngineVersion
        DBName: hivemetastore
        EKSSecurityGroups: !GetAtt EKSStack.Outputs.EKSSecurityGroups
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete

  RDSProxyStack:
    Type: AWS::CloudFormation::Stack
    # RDSStack - Dependency already enforced
    Properties:
      TemplateURL: !Sub https://${TemplateBucketName}.s3.${AWS::Region}.amazonaws.com/cloudformation/data-infra/rds-proxy-stack.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        DBIdentifier: !Ref DBIdentifier
        VPC: !GetAtt NetworkStack.Outputs.VPC
        VpcCIDR: !Ref VpcCIDR
        PrivateSubnets: !GetAtt NetworkStack.Outputs.PrivateSubnets
        EKSSecurityGroups: !GetAtt EKSStack.Outputs.EKSSecurityGroups
        DBSecretArn: !GetAtt RDSStack.Outputs.DBSecretArn
        DBSecurityGroup: !GetAtt RDSStack.Outputs.DBSecurityGroup
        DBSecretKMSKeyArn: !GetAtt RDSStack.Outputs.DBSecretKMSKeyArn
        DBClusterIdentifier: !GetAtt RDSStack.Outputs.DBClusterIdentifier
      TimeoutInMinutes: 30
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete

Outputs:
  VPC:
    Description: A reference to the created VPC
    Value: !GetAtt NetworkStack.Outputs.VPC

  PublicSubnets:
    Description: A list of the public subnets
    Value: !GetAtt NetworkStack.Outputs.PublicSubnets

  PrivateSubnets:
    Description: A list of the private subnets
    Value: !GetAtt NetworkStack.Outputs.PrivateSubnets

  HiveMetastoreECRRepositoryName:
    Description: Name of the ECR repository for Hive Metastore
    Value: !GetAtt ECRStack.Outputs.HiveMetastoreRepositoryName

  HiveMetastoreECRRepositoryUri:
    Description: URI of the ECR repository for Hive Metastore
    Value: !GetAtt ECRStack.Outputs.HiveMetastoreRepositoryUri

  S3BucketName:
    Description: Name of the S3 bucket for Hive Metastore
    Value: !GetAtt S3Stack.Outputs.S3BucketName

  S3BucketArn:
    Description: ARN of the S3 bucket for Hive Metastore
    Value: !GetAtt S3Stack.Outputs.S3BucketArn

  AnalyticsClusterName:
    Description: Name of the Analytics EKS cluster
    Value: !GetAtt EKSStack.Outputs.AnalyticsClusterName

  AnalyticsClusterEndpoint:
    Description: API server endpoint of the Analytics EKS cluster
    Value: !GetAtt EKSStack.Outputs.AnalyticsClusterEndpoint

  AnalyticsEKSSecurityGroup:
    Description: Security Group ID for the Analytics EKS cluster
    Value: !GetAtt EKSStack.Outputs.AnalyticsEKSSecurityGroup

  RDSClusterIdentifier:
    Description: Identifier of the RDS Aurora cluster
    Value: !GetAtt RDSStack.Outputs.DBClusterIdentifier

  RDSClusterEndpoint:
    Description: Endpoint of the RDS Aurora cluster
    Value: !GetAtt RDSStack.Outputs.DBClusterEndpoint

  RDSClusterReadEndpoint:
    Description: Read endpoint of the RDS Aurora cluster
    Value: !GetAtt RDSStack.Outputs.DBClusterReadEndpoint

  RDSClusterSecurityGroup:
    Description: ID of the DB Security Group
    Value: !GetAtt RDSStack.Outputs.DBSecurityGroup

  RDSProxyName:
    Description: The name of the created DB Proxy
    Value: !GetAtt RDSProxyStack.Outputs.DBProxyName

  RDSProxyEndpoint:
    Description: The endpoint of the created DB Proxy
    Value: !GetAtt RDSProxyStack.Outputs.DBProxyEndpoint