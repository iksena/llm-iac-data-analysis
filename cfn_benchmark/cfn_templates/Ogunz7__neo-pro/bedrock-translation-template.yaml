AWSTemplateFormatVersion: '2010-09-09'
Description: Bedrock translation reference stack (API Gateway + Lambda + DynamoDB + S3)

Parameters:
  ProjectName:
    Type: String
    Default: bedrock-translator
  ModelId:
    Type: String
    Default: anthropic.claude-3-sonnet-20240229-v1:0
  LambdaCodeS3Bucket:
    Type: String
    Description: S3 bucket containing translate.zip
  LambdaCodeS3Key:
    Type: String
    Default: translate.zip
  AllowedOrigin:
    Type: String
    Default: "*"

Resources:
  TranslationBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  TranslationTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  TranslationLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: !Sub '${ProjectName}-lambda-policy'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                Resource: !GetAtt TranslationTable.Arn
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub '${TranslationBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: '*'

  TranslationLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-api'
      Runtime: python3.11
      Handler: translate.handler
      Role: !GetAtt TranslationLambdaRole.Arn
      Timeout: 30
      MemorySize: 512
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      Environment:
        Variables:
          MODEL_ID: !Ref ModelId
          DYNAMODB_TABLE: !Ref TranslationTable
          S3_BUCKET: !Ref TranslationBucket
          ALLOWED_ORIGIN: !Ref AllowedOrigin

  TranslationApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub '${ProjectName}-api'

  TranslateResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref TranslationApi
      ParentId: !GetAtt TranslationApi.RootResourceId
      PathPart: translate

  TranslateMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref TranslationApi
      ResourceId: !Ref TranslateResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        IntegrationHttpMethod: POST
        Type: AWS_PROXY
        Uri: !Sub >-
          arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TranslationLambda.Arn}/invocations

  TranslateOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref TranslationApi
      ResourceId: !Ref TranslateResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Idempotency-Key'"
              method.response.header.Access-Control-Allow-Methods: "'OPTIONS,POST'"
              method.response.header.Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref TranslationLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${TranslationApi}/*/POST/translate'

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - TranslateMethod
      - TranslateOptionsMethod
    Properties:
      RestApiId: !Ref TranslationApi
      StageName: prod

Outputs:
  ApiEndpoint:
    Value: !Sub 'https://${TranslationApi}.execute-api.${AWS::Region}.amazonaws.com/prod/translate'
  TranslationBucketName:
    Value: !Ref TranslationBucket
  TranslationTableName:
    Value: !Ref TranslationTable