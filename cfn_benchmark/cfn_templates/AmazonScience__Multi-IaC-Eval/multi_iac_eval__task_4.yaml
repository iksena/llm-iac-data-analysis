AWSTemplateFormatVersion: "2010-09-09"

Description: Best Practice SNS Topic with Dead Letter Queue

Parameters:
  SubscriptionEndPoint:
    Description: The endpoint that receives notifications from the Amazon SNS topic. The endpoint value depends on the protocol that you specify. This could be a URL or ARN
    Type: String

  SubscriptionProtocol:
    Description: The subscription's protocol
    Type: String
    AllowedValues:
      - http
      - https
      - email
      - email-json
      - sms
      - sqs
      - application
      - lambda
    Default: sqs

Mappings: {}

Conditions: {}

Resources:
  SNSTopic:
    Type: AWS::SNS::Topic
    Properties: {}

  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties: {}

  DeadLetterQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: sqs:SendMessage
            Resource: !GetAtt DeadLetterQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref SNSTopic
     Queues:
       - !Ref DeadLetterQueue

  SNSSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Endpoint: !Ref SubscriptionEndPoint
      Protocol: !Ref SubscriptionProtocol
      TopicArn: !Ref SNSTopic
      RawMessageDelivery: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 15

Outputs:
  TopicARN:
    Description: ARN of newly created SNS Topic
    Value: !Ref SNSTopic

  QueueName:
    Description: Name of newly created SNS Topic
    Value: !GetAtt SNSTopic.TopicName

  DeadLetterQueueARN:
    Description: ARN of the Dead Letter Queue
    Value: !Ref DeadLetterQueue