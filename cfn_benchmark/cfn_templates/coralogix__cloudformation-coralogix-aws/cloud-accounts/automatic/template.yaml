AWSTemplateFormatVersion: 2010-09-09
Description: Creates an IAM role allowing Coralogix to collect metrics from your AWS account.

Metadata:
  SemanticVersion: 2.0.0
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Coralogix configuration
        Parameters:
          - CoralogixRegion
          - CoralogixCompanyId
          - CustomAWSAccountId
          - CustomRoleSuffix
      - Label:
          default: Role configuration
        Parameters:
          - RoleName
          - ExternalIdSecret

Parameters:
  CoralogixRegion:
    Type: String
    Default: EU1
    Description: The Coralogix region for your account. Select CustomEndpoint to supply a custom trusted AWS account ID and role suffix.
    AllowedValues:
      - staging
      - EU1
      - EU2
      - AP1
      - AP2
      - AP3
      - US1
      - US2
      - gov1
      - CustomEndpoint
  CoralogixCompanyId:
    Type: String
    Description: Your Coralogix company ID. Used to build the external ID when ExternalIdSecret is provided.
    AllowedPattern: "[0-9]+"
    MaxLength: 64
  RoleName:
    Type: String
    Default: coralogix-cloud-account
    Description: The name of the main IAM role that will be created. Static Firehose service roles use this name with -fh and -ms suffixes.
    AllowedPattern: '[\w+=,.@-]+'
    MaxLength: 56
  ExternalIdSecret:
    Type: String
    Default: ""
    Description: Optional ExternalIdSecret to increase security for sts:AssumeRole.
    AllowedPattern: '^$|^[\w+=,.:\/-]+$'
    MaxLength: 64
  CustomAWSAccountId:
    Type: String
    Default: ""
    Description: Custom Coralogix AWS account ID. Required when CoralogixRegion is CustomEndpoint.
    AllowedPattern: "^$|^[0-9]{12}$"
  CustomRoleSuffix:
    Type: String
    Default: ""
    Description: Custom suffix for the trusted coralogix-ingestion role. Required when CoralogixRegion is CustomEndpoint.
    AllowedPattern: '[\w+=,.@-]*'
    MaxLength: 44

Mappings:
  CoralogixEnvironment:
    staging:
      AwsAccountId: "233221153619"
      RoleSuffix: stg1
    EU1:
      AwsAccountId: "625240141681"
      RoleSuffix: eu1
    EU2:
      AwsAccountId: "625240141681"
      RoleSuffix: eu2
    AP1:
      AwsAccountId: "625240141681"
      RoleSuffix: ap1
    AP2:
      AwsAccountId: "625240141681"
      RoleSuffix: ap2
    AP3:
      AwsAccountId: "025066248247"
      RoleSuffix: ap3
    US1:
      AwsAccountId: "625240141681"
      RoleSuffix: us1
    US2:
      AwsAccountId: "739076534691"
      RoleSuffix: us2
    gov1:
      AwsAccountId: "309801239943"
      RoleSuffix: gov1
    CustomEndpoint:
      AwsAccountId: "000000000000"
      RoleSuffix: custom

Rules:
  CustomEndpointRequiresAccountIdAndRoleSuffix:
    RuleCondition: !Equals [!Ref CoralogixRegion, CustomEndpoint]
    Assertions:
      - Assert: !Not [!Equals [!Ref CustomAWSAccountId, ""]]
        AssertDescription: CustomAWSAccountId is required when CoralogixRegion is CustomEndpoint.
      - Assert: !Not [!Equals [!Ref CustomRoleSuffix, ""]]
        AssertDescription: CustomRoleSuffix is required when CoralogixRegion is CustomEndpoint.

Conditions:
  HasExternalId: !Not [!Equals [!Ref ExternalIdSecret, ""]]
  IsCustomEndpoint: !Equals [!Ref CoralogixRegion, CustomEndpoint]

Resources:
  CoralogixFirehoseServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${RoleName}-fh"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: firehose.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: CoralogixS3BackupAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:GetBucketLocation
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:ListBucketMultipartUploads
                  - s3:PutObject
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::cx-*
                  - !Sub arn:${AWS::Partition}:s3:::cx-*/*

  CoralogixMetricStreamsServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${RoleName}-ms"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: streams.metrics.cloudwatch.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: CoralogixFirehosePutAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - firehose:PutRecord
                  - firehose:PutRecordBatch
                Resource: !Sub arn:${AWS::Partition}:firehose:*:${AWS::AccountId}:deliverystream/cx-*

  CoralogixAwsMetricsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Tags:
        - Key: CoralogixCloudAccountTemplateVersion
          Value: "2"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub
                - "arn:${AWS::Partition}:iam::${AwsAccountId}:role/coralogix-ingestion-${RoleSuffix}"
                - AwsAccountId: !If
                    - IsCustomEndpoint
                    - !Ref CustomAWSAccountId
                    - !FindInMap [
                        CoralogixEnvironment,
                        !Ref CoralogixRegion,
                        AwsAccountId,
                      ]
                  RoleSuffix: !If
                    - IsCustomEndpoint
                    - !Ref CustomRoleSuffix
                    - !FindInMap [
                        CoralogixEnvironment,
                        !Ref CoralogixRegion,
                        RoleSuffix,
                      ]
            Action:
              - sts:AssumeRole
            Condition: !If
              - HasExternalId
              - StringEquals:
                  sts:ExternalId: !Sub "${ExternalIdSecret}@${CoralogixCompanyId}"
              - !Ref "AWS::NoValue"
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/ReadOnlyAccess
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AWSResourceExplorerFullAccess
      Policies:
        - PolicyName: CoralogixCloudAccountResourceManagement
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ManageCoralogixFirehoseDeliveryStreams
                Effect: Allow
                Action:
                  - firehose:CreateDeliveryStream
                  - firehose:DeleteDeliveryStream
                  - firehose:UpdateDestination
                Resource: !Sub arn:${AWS::Partition}:firehose:*:${AWS::AccountId}:deliverystream/cx-*
              - Sid: ManageCoralogixMetricStreams
                Effect: Allow
                Action:
                  - cloudwatch:PutMetricStream
                  - cloudwatch:DeleteMetricStream
                Resource: !Sub arn:${AWS::Partition}:cloudwatch:*:${AWS::AccountId}:metric-stream/cx-*
              - Sid: ManageCoralogixBackupBuckets
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:PutBucketPublicAccessBlock
                  - s3:DeleteBucket
                Resource: !Sub arn:${AWS::Partition}:s3:::cx-*
              - Sid: DeleteCoralogixBackupObjects
                Effect: Allow
                Action:
                  - s3:DeleteObject
                Resource: !Sub arn:${AWS::Partition}:s3:::cx-*/*
              - Sid: PassCoralogixFirehoseServiceRole
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !GetAtt CoralogixFirehoseServiceRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: firehose.amazonaws.com
              - Sid: PassCoralogixMetricStreamsServiceRole
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !GetAtt CoralogixMetricStreamsServiceRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: streams.metrics.cloudwatch.amazonaws.com

Outputs:
  CoralogixAwsMetricsRoleArn:
    Description: The ARN of the Coralogix AWS Metrics role.
    Value: !GetAtt CoralogixAwsMetricsRole.Arn
  ExternalId:
    Condition: HasExternalId
    Description: The ExternalId of the Coralogix AWS Metrics role.
    Value: !Sub "${ExternalIdSecret}@${CoralogixCompanyId}"