AWSTemplateFormatVersion: "2010-09-09"
Description: >
  IAM roles for EMR on EC2 cluster: EMR service role, EC2 instance profile,
  and autoscaling role. Follows least-privilege policies scoped to project resources.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Configuration
        Parameters:
          - ProjectName
      - Label:
          default: S3
        Parameters:
          - S3BucketName

Parameters:
  ProjectName:
    Type: String
    Default: emr-celeborn-demo
    Description: Project name used to import exports and for tagging

  S3BucketName:
    Type: String
    Description: S3 bucket name for Spark job artifacts, data, and EMR logs

Resources:
  # --- EMR Service Role ---
  # Used by the EMR service to provision and manage EC2 instances

  EMRServiceRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: "Explicit role name required for cross-stack ImportValue references. This is a blog post demonstration — resource replacement constraints are not a concern."
    Properties:
      RoleName: !Sub "${ProjectName}-emr-ec2-service-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: elasticmapreduce.amazonaws.com
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonElasticMapReduceRole"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-emr-ec2-service-role"
        - Key: Project
          Value: !Ref ProjectName

  # --- EC2 Instance Role ---
  # Assumed by EC2 instances in the EMR cluster

  EMREC2Role:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: "Explicit role name required for cross-stack ImportValue references. This is a blog post demonstration — resource replacement constraints are not a concern."
          - id: W11
            reason: "logs:DescribeLogGroups does not support resource-level permissions — wildcard resource is required for this API action."
      guard:
        SuppressedRules:
          - IAM_NO_INLINE_POLICY_CHECK: "Inline policy is tightly scoped to S3, KMS, and CloudWatch access for EMR EC2 instances. A managed policy would require a separate stack with no security benefit for a blog post demonstration."
      checkov:
        skip:
          - id: CKV_AWS_111
            comment: "logs:DescribeLogGroups does not support resource-level permissions — wildcard resource is required for this API action."
    Properties:
      RoleName: !Sub "${ProjectName}-emr-ec2-instance-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonElasticMapReduceforEC2Role"
      Policies:
        - PolicyName: EMREC2InstancePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # S3 access for job artifacts, data, and EMR logs
              - Sid: AllowS3BucketAccess
                Effect: Allow
                Action:
                  - "s3:ListBucket"
                  - "s3:GetBucketLocation"
                Resource: !Sub "arn:${AWS::Partition}:s3:::${S3BucketName}"
              - Sid: AllowS3ObjectAccess
                Effect: Allow
                Action:
                  - "s3:GetObject"
                  - "s3:PutObject"
                  - "s3:DeleteObject"
                Resource: !Sub "arn:${AWS::Partition}:s3:::${S3BucketName}/*"
              # KMS for encryption of logs and data
              - Sid: AllowKMSAccess
                Effect: Allow
                Action:
                  - "kms:Decrypt"
                  - "kms:GenerateDataKey"
                Resource: !ImportValue
                  Fn::Sub: "${ProjectName}-KMSKeyArn"
              # CloudWatch Logs — DescribeLogGroups is a list action requiring wildcard resource
              - Sid: AllowCloudWatchLogsDescribe
                Effect: Allow
                Action:
                  - "logs:DescribeLogGroups"
                Resource: "*"
              # CloudWatch Logs — scoped write operations
              - Sid: AllowCloudWatchLogs
                Effect: Allow
                Action:
                  - "logs:CreateLogGroup"
                  - "logs:CreateLogStream"
                  - "logs:PutLogEvents"
                  - "logs:DescribeLogStreams"
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/emr-on-ec2/${ProjectName}*"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-emr-ec2-instance-role"
        - Key: Project
          Value: !Ref ProjectName

  # --- EC2 Instance Profile ---

  EMREC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "${ProjectName}-emr-ec2-instance-profile"
      Roles:
        - !Ref EMREC2Role

  # --- EMR Auto Scaling Role ---
  # Used by EMR managed scaling to add/remove instances

  EMRAutoScalingRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: "Explicit role name required for cross-stack ImportValue references. This is a blog post demonstration — resource replacement constraints are not a concern."
    Properties:
      RoleName: !Sub "${ProjectName}-emr-ec2-autoscaling-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - elasticmapreduce.amazonaws.com
                - application-autoscaling.amazonaws.com
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonElasticMapReduceforAutoScalingRole"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-emr-ec2-autoscaling-role"
        - Key: Project
          Value: !Ref ProjectName

Outputs:
  EMRServiceRoleArn:
    Description: ARN of the EMR service role
    Value: !GetAtt EMRServiceRole.Arn
    Export:
      Name: !Sub "${ProjectName}-EmrEc2ServiceRoleArn"

  EMRServiceRoleName:
    Description: Name of the EMR service role
    Value: !Ref EMRServiceRole
    Export:
      Name: !Sub "${ProjectName}-EmrEc2ServiceRoleName"

  EMREC2InstanceProfileArn:
    Description: ARN of the EC2 instance profile for EMR nodes
    Value: !GetAtt EMREC2InstanceProfile.Arn
    Export:
      Name: !Sub "${ProjectName}-EmrEc2InstanceProfileArn"

  EMREC2InstanceProfileName:
    Description: Name of the EC2 instance profile for EMR nodes
    Value: !Ref EMREC2InstanceProfile
    Export:
      Name: !Sub "${ProjectName}-EmrEc2InstanceProfileName"

  EMREC2RoleArn:
    Description: ARN of the EC2 instance role for EMR nodes
    Value: !GetAtt EMREC2Role.Arn
    Export:
      Name: !Sub "${ProjectName}-EmrEc2RoleArn"

  EMRAutoScalingRoleArn:
    Description: ARN of the EMR auto scaling role
    Value: !GetAtt EMRAutoScalingRole.Arn
    Export:
      Name: !Sub "${ProjectName}-EmrEc2AutoScalingRoleArn"