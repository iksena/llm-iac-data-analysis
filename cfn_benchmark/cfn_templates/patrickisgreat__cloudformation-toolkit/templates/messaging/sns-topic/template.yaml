AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  SNS topic with encryption at rest, optional FIFO ordering, an email and an SQS
  subscription, and a delivery-retry policy for HTTPS endpoints.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Naming
        Parameters:
          - NamePrefix
          - Environment
          - TopicSuffix
          - FifoTopic
      - Label:
          default: Encryption
        Parameters:
          - KmsKeyId
      - Label:
          default: Subscriptions
        Parameters:
          - EmailEndpoint
          - SqsQueueArn
          - FilterPolicy
      - Label:
          default: Cross-service publishing
        Parameters:
          - AllowPublishFromService
          - AllowPublishFromSourceArn

Parameters:
  NamePrefix:
    Type: String
    Description: Prefix for the topic name.
    AllowedPattern: "^[a-z][a-z0-9-]{1,30}[a-z0-9]$"
    ConstraintDescription: 3-32 lowercase characters, digits and hyphens.

  Environment:
    Type: String
    Description: Environment this topic belongs to.
    Default: dev
    AllowedValues: [dev, staging, prod]

  TopicSuffix:
    Type: String
    Description: What this topic carries, e.g. "alarms" or "order-events".
    Default: events
    AllowedPattern: "^[a-z0-9][a-z0-9-]{0,40}$"

  FifoTopic:
    Type: String
    Description: >-
      Strict ordering and deduplication, at the cost of only being subscribable
      by FIFO SQS queues - no email, no HTTPS, no Lambda. Choose it only when a
      FIFO queue is the only consumer you will ever have.
    Default: "false"
    AllowedValues: ["true", "false"]

  KmsKeyId:
    Type: String
    Description: >-
      KMS key ID, ARN or alias. Defaults to the AWS-managed SNS key, which is
      free. SNS has no managed-SSE toggle, so this is how a topic gets
      encryption at rest at all.
    Default: alias/aws/sns

  EmailEndpoint:
    Type: String
    Description: >-
      Email address to subscribe. Note the subscription stays "pending
      confirmation" until the recipient clicks the link, and CloudFormation
      reports the stack as complete either way - so an unconfirmed alarm topic
      looks healthy and delivers nothing.
    Default: ""

  SqsQueueArn:
    Type: String
    Description: >-
      SQS queue ARN to subscribe. The queue's own resource policy must allow
      sns:SendMessage from this topic; that policy lives with the queue, not
      here.
    Default: ""

  FilterPolicy:
    Type: String
    Description: >-
      JSON message-attribute filter for the SQS subscription, e.g.
      '{"eventType":["order.created"]}'. Filtering at the topic is cheaper than
      delivering everything and discarding in the consumer.
    Default: ""

  AllowPublishFromService:
    Type: String
    Description: >-
      AWS service principal allowed to publish, e.g. "s3.amazonaws.com" or
      "cloudwatch.amazonaws.com" for alarm notifications. Leave empty for none.
    Default: ""

  AllowPublishFromSourceArn:
    Type: String
    Description: >-
      ARN of the specific resource allowed to publish through
      AllowPublishFromService. Required when that is set - an unscoped service
      grant lets any bucket or alarm in any account publish to this topic.
    Default: ""

Conditions:
  IsFifo: !Equals [!Ref FifoTopic, "true"]
  HasEmail: !Not [!Equals [!Ref EmailEndpoint, ""]]
  HasSqs: !Not [!Equals [!Ref SqsQueueArn, ""]]
  HasFilterPolicy: !Not [!Equals [!Ref FilterPolicy, ""]]
  HasServicePublisher: !Not [!Equals [!Ref AllowPublishFromService, ""]]

Resources:
  Topic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !If
        - IsFifo
        - !Sub "${NamePrefix}-${Environment}-${TopicSuffix}.fifo"
        - !Sub "${NamePrefix}-${Environment}-${TopicSuffix}"
      DisplayName: !Sub "${NamePrefix} ${TopicSuffix} (${Environment})"
      FifoTopic: !If [IsFifo, true, !Ref "AWS::NoValue"]
      ContentBasedDeduplication: !If [IsFifo, true, !Ref "AWS::NoValue"]
      KmsMasterKeyId: !Ref KmsKeyId
      Subscription:
        - !If
          - HasEmail
          - Protocol: email
            Endpoint: !Ref EmailEndpoint
          - !Ref AWS::NoValue

  # The SQS subscription is a separate resource rather than an inline entry
  # because only AWS::SNS::Subscription supports FilterPolicy and RawMessageDelivery.
  QueueSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasSqs
    Properties:
      TopicArn: !Ref Topic
      Protocol: sqs
      Endpoint: !Ref SqsQueueArn
      # Without raw delivery the consumer receives the SNS envelope wrapping the
      # payload as a JSON string, so every consumer has to unwrap it.
      RawMessageDelivery: true
      FilterPolicy: !If [HasFilterPolicy, !Ref FilterPolicy, !Ref "AWS::NoValue"]
      FilterPolicyScope: !If [HasFilterPolicy, MessageAttributes, !Ref "AWS::NoValue"]

  TopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Condition: HasServicePublisher
    Properties:
      Topics: [!Ref Topic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowServicePublish
            Effect: Allow
            Principal:
              Service: !Ref AllowPublishFromService
            Action: sns:Publish
            Resource: !Ref Topic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                # Scoping to the source ARN is what stops any bucket or alarm in
                # the account from publishing here.
                aws:SourceArn: !Ref AllowPublishFromSourceArn

Outputs:
  TopicArn:
    Description: Topic ARN, for publishers and for alarm AlarmActions.
    Value: !Ref Topic

  TopicName:
    Description: Topic name, for CloudWatch dimensions.
    Value: !GetAtt Topic.TopicName