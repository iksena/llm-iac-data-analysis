AWSTemplateFormatVersion: '2010-09-09'
Description: >
  CloudFormation template to create a MongoDB Atlas Project.

Parameters:
  OrganizationId:
    Type: String
    Description: Mongo DB Atlas Organization ID

  ProfileName:
    Type: String
    Description: Secret Manager Profile that contains the Atlas Programmatic keys

  ProjectName:
    Type: String
    Description: Mongo DB Atlas project name

Resources:
  AtlasProject:
    Type: MongoDB::Atlas::Project
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            - E3006
    Properties:
      WithDefaultAlertsSettings: true
      Profile: !Ref ProfileName
      Name: !Ref ProjectName
      OrgId: !Ref OrganizationId

Outputs:
  ProjectId:
    Description: The ID of the MongoDB Atlas Project
    Value: !GetAtt AtlasProject.Id