AWSTemplateFormatVersion: "2010-09-09"
Description: "EventBridge Rules for Lambda Functions"
Parameters:
  Environment:
    Type: String
    AllowedValues:
      - dev
      - test
      - prod
      - shared

Resources:

    SftpRule:
        Type: "AWS::Events::Rule"
        Properties:
            Name: !Sub "SFTP-${Environment}"
            EventPattern: !Sub "{\"source\":[\"aws.s3\"],\"detail-type\":[\"Object Created\"],\"detail.object.key\":[{\"prefix\":\"${Environment}\"}]}"
            State: "ENABLED"
            Targets:
              -
                Arn:
                  Fn::ImportValue: !Sub "RADx-SQS-SftpQueue-${Environment}"
                Id: "SftpQueueTarget"
                DeadLetterConfig:
                    Arn:
                      Fn::ImportValue: !Sub "RADx-SQS-SftpQueueDlq-${Environment}"
            EventBusName: "default"

    ReporterRule:
        Type: "AWS::Events::Rule"
        Properties:
            Name: !Sub "RADx-REPORTER-${Environment}"
            Description: "Variables Report schedule for environment"
            ScheduleExpression: "cron(0 12 ? * 2#1 *)"
            State: "ENABLED"
            Targets:
              -
                Arn:
                  Fn::ImportValue: !Sub "RADx-Lambda-RADxReporterTestLambda-${Environment}"
                Id: "ReporterLambdaTarget"
            EventBusName: "default"

    VariableReportRule:
        Type: "AWS::Events::Rule"
        Properties:
            Name: "VARIABLES-REPORT"
            Description: "Variables Report schedule for PROD environment"
            ScheduleExpression: "cron(0 8 1 * ? *)"
            State: "ENABLED"
            Targets:
              -
                Arn:
                  Fn::ImportValue: !Sub "RADx-Lambda-VariablesReportLambda-${Environment}"
                Id: "VariablesReportLambdaTarget"
            EventBusName: "default"

    CanvasAutoShutdownRule:
        Type: "AWS::Events::Rule"
        Properties:
            Name: "sagemaker-canvas-auto-shutdown-on-idle-CanvasAutoShutdownRule"
            Description: "Rule that executes a Lambda function whenever the Alarm is triggered"
            EventPattern: !Sub "{\"detail-type\":[\"CloudWatch Alarm State Change\"],\"resources\":[\"arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:sagemaker-canvas-auto-shutdown-on-idle-TimeSinceLastActiveAlarm\"],\"source\":[\"aws.cloudwatch\"]}"
            State: "ENABLED"
            Targets:
              -
                Arn:
                  Fn::ImportValue: !Sub "RADx-Lambda-SageMakerCanvasAutoShutdownLambda-${Environment}"
                Id: "DeleteCanvasAppFunction"
            EventBusName: "default"

    EventBridgeSchedulerRole:
        Type: AWS::IAM::Role
        Properties:
            RoleName: !Sub "RADx-EventBridgeScheduler-Role-${Environment}"
            AssumeRolePolicyDocument:
                Version: '2012-10-17'
                Statement:
                    - Effect: Allow
                      Principal:
                          Service: scheduler.amazonaws.com
                      Action: sts:AssumeRole
            Policies:
                - PolicyName: InvokeLambdaPolicy
                  PolicyDocument:
                      Version: '2012-10-17'
                      Statement:
                          - Effect: Allow
                            Action:
                                - lambda:InvokeFunction
                            Resource:
                                - Fn::ImportValue: !Sub "RADx-Lambda-VariablesReportLambda-${Environment}"
                                - Fn::ImportValue: !Sub "RADx-Lambda-SageMakerCanvasAutoShutdownLambda-${Environment}"

    VariableReportSchedule:
        Type: AWS::Scheduler::Schedule
        Properties:
            Name: "variables-report"
            Description: ""
            State: "DISABLED"
            GroupName: "default"
            ScheduleExpression: "cron(0 8 1 * ? *)"
            ScheduleExpressionTimezone: "America/New_York"
            FlexibleTimeWindow:
                Mode: "OFF"
            Target:
                Arn:
                  Fn::ImportValue: !Sub "RADx-Lambda-VariablesReportLambda-${Environment}"
                RetryPolicy:
                    MaximumEventAgeInSeconds: 86400
                    MaximumRetryAttempts: 185
                RoleArn: !GetAtt EventBridgeSchedulerRole.Arn

    HealthEvents:
        Type: "AWS::Events::Rule"
        Properties:
            Name: "Health"
            EventPattern: "{\"source\":[\"aws.health\"]}"
            State: "ENABLED"
            EventBusName: "default"

    EcsDeploymentFailed:
        Type: "AWS::Events::Rule"
        Properties:
            Name: "ecs-deployment-failed"
            EventPattern: "{\"source\":[\"aws.ecs\"],\"detail-type\":[\"ECS Deployment State Change\"],\"detail\":{\"eventType\":[\"ERROR\"],\"eventName\":[\"SERVICE_DEPLOYMENT_FAILED\"]}}"
            State: "ENABLED"
            EventBusName: "default"