  # ─────────── Guard 커스텀 정책 룰 (Owner: CUSTOM_POLICY) ───────────
  # 관리형 룰이 없는 기준을 위해 직접 작성한 정책. Lambda 불필요.
  # cfn-guard 단위 테스트 7건(준수 2 / 위반 3 / 판정제외 2)을 통과한 정책이다.
  Fsi64IamRoleMaxSessionDuration:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: fsi-6-4-iam-role-max-session-duration
      Description: '[FSI-AWS 6.4] API 세션 및 서명 유효기간 적용'
      Scope:
        ComplianceResourceTypes:
        - AWS::IAM::Role
      Source:
        Owner: CUSTOM_POLICY
        SourceDetails:
        - EventSource: aws.config
          MessageType: ConfigurationItemChangeNotification
        CustomPolicyDetails:
          EnableDebugLogDelivery: false
          PolicyRuntime: guard-2.x.x
          PolicyText: |
            #
            # [FSI-AWS 6.4] API 세션 및 서명 유효기간 적용
            #
            #   "클라우드 가상자원 관리를 위해 API 기능 이용 시 세션 및 서명값에 대한
            #    유효기간을 설정하여야 한다."
            #
            # AWS Signature Version 4 의 서명 유효기간은 이용자가 조정할 수 없으므로,
            # 조정 가능한 통제점인 IAM 역할의 최대 세션 유효기간(maxSessionDuration)을 판정한다.
            # AWS 기본값은 3600초이며 최대 43200초(12시간)까지 늘릴 수 있다.
            #
            # 서비스 연결 역할(/aws-service-role/)은 AWS가 관리하며 이용자가 값을 바꿀 수 없어
            # 판정 대상에서 제외한다.
            #
            # 임계값은 아래 max_session_seconds 상수로 직접 수정한다
            # (CloudFormation 파라미터로 노출하지 않는 이유는 README 참조).
            #

            let max_session_seconds = 14400

            rule iam_role_max_session_duration when
                resourceType == "AWS::IAM::Role"
                configuration.path != /^\/aws-service-role/ {

                configuration.maxSessionDuration exists
                    <<[6.4] 구성 항목에 maxSessionDuration 이 없습니다. AWS Config 가 기록한 실제 구성 항목의 필드 경로를 확인하세요.>>

                configuration.maxSessionDuration <= %max_session_seconds
                    <<[6.4] IAM 역할의 최대 세션 유효기간이 허용치를 초과했습니다. 세션 유효기간을 줄이거나 예외를 승인받으세요.>>
            }