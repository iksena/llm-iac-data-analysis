AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  Kinesis Data Stream in on-demand or provisioned capacity mode, encrypted at
  rest, with configurable retention and optional enhanced fan-out.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Naming
        Parameters:
          - NamePrefix
          - Environment
          - StreamSuffix
      - Label:
          default: Capacity (this is the cost decision)
        Parameters:
          - CapacityMode
          - ShardCount
      - Label:
          default: Retention and encryption
        Parameters:
          - RetentionHours
          - KmsKeyId
      - Label:
          default: Consumers
        Parameters:
          - EnhancedFanOutConsumerName

Parameters:
  NamePrefix:
    Type: String
    Description: Prefix for the stream name.
    AllowedPattern: "^[a-z][a-z0-9-]{1,30}[a-z0-9]$"
    ConstraintDescription: 3-32 lowercase characters, digits and hyphens.

  Environment:
    Type: String
    Description: Environment this stream belongs to.
    Default: dev
    AllowedValues: [dev, staging, prod]

  StreamSuffix:
    Type: String
    Description: What this stream carries, e.g. "clickstream" or "telemetry".
    Default: events
    AllowedPattern: "^[a-z0-9][a-z0-9-]{0,40}$"

  CapacityMode:
    Type: String
    Description: >-
      ON_DEMAND scales automatically and bills per GB written and read, with no
      shard management - the right default, and much cheaper for spiky or
      unknown load. PROVISIONED bills per shard-hour and is cheaper only above
      roughly a sustained 1 MB/s per shard, but requires you to predict the
      shard count and to reshard when you are wrong.
    Default: ON_DEMAND
    AllowedValues: [ON_DEMAND, PROVISIONED]

  ShardCount:
    Type: Number
    Description: >-
      Shards, when CapacityMode is PROVISIONED. Each shard takes 1 MB/s or 1000
      records/s in and 2 MB/s out. Exceeding it returns
      ProvisionedThroughputExceededException to the producer, which most SDKs
      retry into a backlog rather than surfacing.
    Default: 1
    MinValue: 1
    MaxValue: 10000

  RetentionHours:
    Type: Number
    Description: >-
      How long records stay readable. 24 hours is the AWS default and is the
      window you have to fix a broken consumer before data is gone; 168 (7 days)
      costs extra but turns a weekend outage into a replay.
    Default: 24
    MinValue: 24
    MaxValue: 8760

  KmsKeyId:
    Type: String
    Description: >-
      KMS key ID, ARN or alias for server-side encryption. Defaults to the
      AWS-managed Kinesis key, which is free.
    Default: alias/aws/kinesis

  EnhancedFanOutConsumerName:
    Type: String
    Description: >-
      Register a dedicated-throughput consumer with this name. Each enhanced
      fan-out consumer gets its own 2 MB/s per shard instead of sharing the
      stream's read capacity, and is billed hourly per shard. Leave empty to
      share read throughput, which is fine up to two or three consumers.
    Default: ""

Conditions:
  IsProvisioned: !Equals [!Ref CapacityMode, "PROVISIONED"]
  HasEnhancedFanOut: !Not [!Equals [!Ref EnhancedFanOutConsumerName, ""]]

Resources:
  Stream:
    Type: AWS::Kinesis::Stream
    # A stream holds unconsumed records. Deleting it during a rollback discards
    # whatever the consumers had not read yet.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "${NamePrefix}-${Environment}-${StreamSuffix}"
      StreamModeDetails:
        StreamMode: !Ref CapacityMode
      # ShardCount and ON_DEMAND are mutually exclusive: supplying both is
      # rejected, so the property has to disappear rather than be zero.
      ShardCount: !If [IsProvisioned, !Ref ShardCount, !Ref "AWS::NoValue"]
      RetentionPeriodHours: !Ref RetentionHours
      StreamEncryption:
        EncryptionType: KMS
        KeyId: !Ref KmsKeyId

  Consumer:
    Type: AWS::Kinesis::StreamConsumer
    Condition: HasEnhancedFanOut
    Properties:
      ConsumerName: !Ref EnhancedFanOutConsumerName
      StreamARN: !GetAtt Stream.Arn

Outputs:
  StreamName:
    Description: Stream name, for the SDK and for CloudWatch alarm dimensions.
    Value: !Ref Stream

  StreamArn:
    Description: Stream ARN, for IAM policies, Firehose sources and Lambda event sources.
    Value: !GetAtt Stream.Arn

  ConsumerArn:
    Description: Enhanced fan-out consumer ARN, when one was registered.
    Condition: HasEnhancedFanOut
    Value: !GetAtt Consumer.ConsumerARN