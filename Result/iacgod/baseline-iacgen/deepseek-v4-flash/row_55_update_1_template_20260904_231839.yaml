AWSTemplateFormatVersion: "2010-09-09"
Description: "CloudFormation template to provision 5 EC2 instances and CloudWatch alarms for CPU, status check, and EBS reachability"
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: "VPC ID for the instances"
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: "Subnet ID for the instances"
  InstanceType:
    Type: String
    Default: t2.micro
    AllowedValues:
      - t2.micro
      - t2.small
      - t2.medium
    Description: "EC2 instance type"
  ImageId:
    Type: AWS::EC2::Image::Id
    Default: ami-0c55b159cbfafe1f0
    Description: "AMI ID for the instances (default Amazon Linux 2)"
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: "Optional key pair for SSH access"
    Default: ""
  SSHLocation:
    Type: String
    Default: 0.0.0.0/0
    Description: "CIDR range allowed to SSH into instances"
Resources:
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Security group for EC2 instances"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SSHLocation
  Instance1:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref ImageId
      KeyName: !Ref KeyName
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup
  Instance2:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref ImageId
      KeyName: !Ref KeyName
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup
  Instance3:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref ImageId
      KeyName: !Ref KeyName
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup
  Instance4:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref ImageId
      KeyName: !Ref KeyName
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup
  Instance5:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref ImageId
      KeyName: !Ref KeyName
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup
  CPUAlarm1:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "CPUAlarm-${Instance1}"
      AlarmDescription: "CPU utilization > 80% for 3 consecutive 300-second periods"
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: InstanceId
          Value: !Ref Instance1
      ActionsEnabled: false
  CPUAlarm2:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "CPUAlarm-${Instance2}"
      AlarmDescription: "CPU utilization > 80% for 3 consecutive 300-second periods"
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: InstanceId
          Value: !Ref Instance2
      ActionsEnabled: false
  CPUAlarm3:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "CPUAlarm-${Instance3}"
      AlarmDescription: "CPU utilization > 80% for 3 consecutive 300-second periods"
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: InstanceId
          Value: !Ref Instance3
      ActionsEnabled: false
  CPUAlarm4:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "CPUAlarm-${Instance4}"
      AlarmDescription: "CPU utilization > 80% for 3 consecutive 300-second periods"
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: InstanceId
          Value: !Ref Instance4
      ActionsEnabled: false
  CPUAlarm5:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "CPUAlarm-${Instance5}"
      AlarmDescription: "CPU utilization > 80% for 3 consecutive 300-second periods"
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: InstanceId
          Value: !Ref Instance5
      ActionsEnabled: false
  StatusCheckAlarm1:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "StatusCheckAlarm-${Instance1}"
      AlarmDescription: "Status check failed for 2 consecutive 300-second periods"
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: InstanceId
          Value: !Ref Instance1
      ActionsEnabled: false
  StatusCheckAlarm2:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "StatusCheckAlarm-${Instance2}"
      AlarmDescription: "Status check failed for 2 consecutive 300-second periods"
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: InstanceId
          Value: !Ref Instance2
      ActionsEnabled: false
  StatusCheckAlarm3:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "StatusCheckAlarm-${Instance3}"
      AlarmDescription: "Status check failed for 2 consecutive 300-second periods"
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: InstanceId
          Value: !Ref Instance3
      ActionsEnabled: false
  EBSReachabilityAlarm1:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "EBSReachabilityAlarm-${Instance1}"
      AlarmDescription: "EBS volume reachability check failed for 10 consecutive 60-second periods"
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed_AttachedEBS
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 10
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: InstanceId
          Value: !Ref Instance1
      ActionsEnabled: false
  EBSReachabilityAlarm2:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "EBSReachabilityAlarm-${Instance2}"
      AlarmDescription: "EBS volume reachability check failed for 10 consecutive 60-second periods"
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed_AttachedEBS
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 10
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: InstanceId
          Value: !Ref Instance2
      ActionsEnabled: false
  EBSReachabilityAlarm3:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "EBSReachabilityAlarm-${Instance3}"
      AlarmDescription: "EBS volume reachability check failed for 10 consecutive 60-second periods"
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed_AttachedEBS
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 10
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: InstanceId
          Value: !Ref Instance3
      ActionsEnabled: false
Outputs:
  InstanceIds:
    Description: "IDs of the provisioned EC2 instances"
    Value: !Join
      - ", "
      - - !Ref Instance1
        - !Ref Instance2
        - !Ref Instance3
        - !Ref Instance4
        - !Ref Instance5
  AlarmNames:
    Description: "Names of the created CloudWatch alarms"
    Value: !Join
      - ", "
      - - !Ref CPUAlarm1
        - !Ref CPUAlarm2
        - !Ref CPUAlarm3
        - !Ref CPUAlarm4
        - !Ref CPUAlarm5
        - !Ref StatusCheckAlarm1
        - !Ref StatusCheckAlarm2
        - !Ref StatusCheckAlarm3
        - !Ref EBSReachabilityAlarm1
        - !Ref EBSReachabilityAlarm2
        - !Ref EBSReachabilityAlarm3