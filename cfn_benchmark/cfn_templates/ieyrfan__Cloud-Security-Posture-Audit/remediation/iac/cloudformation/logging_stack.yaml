AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudTrail + CloudWatch Logs Stack with Encryption and Alarms'

Parameters:
  Environment:
    Type: String
    Description: Environment name
    Default: production
    AllowedValues:
      - development
      - staging
      - production

  CloudTrailName:
    Type: String
    Description: Name of the CloudTrail trail
    Default: 'organization-trail'

  LogRetentionDays:
    Type: Number
    Description: Retention period for CloudWatch Logs in days
    Default: 365
    AllowedValues:
      - 1
      - 3
      - 5
      - 7
      - 14
      - 30
      - 60
      - 90
      - 120
      - 150
      - 180
      - 365
      - 400
      - 545
      - 731
      - 1827
      - 3653

  AlertEmail:
    Type: String
    Description: Email address for security alerts
    Default: ''

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]

Resources:
  # ---------------------------------------------------------------------------
  # CloudTrail S3 Bucket
  # ---------------------------------------------------------------------------
  CloudTrailBucket:
    Type: 'AWS::S3::Bucket'
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '\-cloudtrail-logs-\'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldLogs
            Status: Enabled
            ExpirationInDays: !Ref LogRetentionDays
            Filter:
              Prefix: ''
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: cloudformation

  CloudTrailBucketPolicy:
    Type: 'AWS::S3::BucketPolicy'
    Properties:
      Bucket: !Ref CloudTrailBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AWSCloudTrailAclCheck
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: 's3:GetBucketAcl'
            Resource: !GetAtt CloudTrailBucket.Arn
            Condition:
              StringEquals:
                'aws:SourceArn': !Sub 'arn:\:cloudtrail:\:\:trail/\'
          - Sid: AWSCloudTrailWrite
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: 's3:PutObject'
            Resource: !Sub '\/AWSLogs/\/*'
            Condition:
              StringEquals:
                's3:x-amz-acl': bucket-owner-full-control
                'aws:SourceArn': !Sub 'arn:\:cloudtrail:\:\:trail/\'

  # ---------------------------------------------------------------------------
  # CloudWatch Log Group for CloudTrail
  # ---------------------------------------------------------------------------
  CloudTrailLogGroup:
    Type: 'AWS::Logs::LogGroup'
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/cloudtrail/\'
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: cloudformation

  CloudTrailLogGroupRole:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: !Sub '\-cloudtrail-cw-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: WriteToCloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource: !GetAtt CloudTrailLogGroup.Arn
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: cloudformation

  # ---------------------------------------------------------------------------
  # CloudTrail - Multi-Region
  # ---------------------------------------------------------------------------
  CloudTrail:
    Type: 'AWS::CloudTrail::Trail'
    DependsOn:
      - CloudTrailBucketPolicy
    Properties:
      TrailName: !Ref CloudTrailName
      S3BucketName: !Ref CloudTrailBucket
      CloudWatchLogsLogGroupArn: !GetAtt CloudTrailLogGroup.Arn
      CloudWatchLogsRoleArn: !GetAtt CloudTrailLogGroupRole.Arn
      EnableLogFileValidation: true
      IncludeGlobalServiceEvents: true
      IsMultiRegionTrail: true
      KMSKeyId: !Ref CloudTrailKMSKey
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: cloudformation

  # ---------------------------------------------------------------------------
  # KMS Key for CloudTrail
  # ---------------------------------------------------------------------------
  CloudTrailKMSKey:
    Type: 'AWS::KMS::Key'
    Properties:
      Description: !Sub 'KMS key for CloudTrail log encryption in \'
      Enabled: true
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableRootAccess
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:\:iam::\:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: AllowCloudTrailEncrypt
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action:
              - 'kms:GenerateDataKey'
              - 'kms:Decrypt'
            Resource: '*'
          - Sid: AllowCloudWatchLogsDecrypt
            Effect: Allow
            Principal:
              Service: logs.\.amazonaws.com
            Action: 'kms:Decrypt'
            Resource: '*'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: cloudformation

  CloudTrailKMSAlias:
    Type: 'AWS::KMS::Alias'
    Properties:
      AliasName: !Sub 'alias/\-cloudtrail'
      TargetKeyId: !Ref CloudTrailKMSKey

  # ---------------------------------------------------------------------------
  # SNS Topic for Alerts
  # ---------------------------------------------------------------------------
  SecurityAlertsTopic:
    Type: 'AWS::SNS::Topic'
    Properties:
      TopicName: !Sub '\-security-alerts'
      DisplayName: !Sub '[\] Security Alerts'
      KmsMasterKeyId: !Ref CloudTrailKMSKey
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: cloudformation

  SecurityAlertsTopicPolicy:
    Type: 'AWS::SNS::TopicPolicy'
    Properties:
      Topics:
        - !Ref SecurityAlertsTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudWatchAlarms
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: 'SNS:Publish'
            Resource: !Ref SecurityAlertsTopic

  EmailSubscription:
    Type: 'AWS::SNS::Subscription'
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref SecurityAlertsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

Outputs:
  CloudTrailArn:
    Description: ARN of the CloudTrail trail
    Value: !GetAtt CloudTrail.Arn
  CloudTrailBucketName:
    Description: S3 bucket for CloudTrail logs
    Value: !Ref CloudTrailBucket
  LogGroupName:
    Description: CloudWatch Log Group name
    Value: !Ref CloudTrailLogGroup
  SnsTopicArn:
    Description: SNS topic for security alerts
    Value: !Ref SecurityAlertsTopic
  KmsKeyId:
    Description: KMS Key ID for CloudTrail encryption
    Value: !Ref CloudTrailKMSKey