AWSTemplateFormatVersion: "2010-09-09"
Description: Payment processing stack

Resources:
  PaymentFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: payment-processor
      Runtime: provided.al2023
      Handler: bootstrap
      MemorySize: 256

  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: orders
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  EventQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: payment-events