AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Archestra Secrets Manager — stores auth secret, admin credentials,
  and LLM API keys. Grants read access to the Archestra IRSA role.

Parameters:
  EnvironmentName:
    Type: String

  AdminEmail:
    Type: String

  AdminPassword:
    Type: String
    NoEcho: true

  DatabaseUrlSecretArn:
    Type: String
    Description: ARN of the database URL secret created by the RDS stack

  ArchestraServiceAccountRoleArn:
    Type: String
    Description: IRSA role ARN for the Archestra pod

Resources:
  # ---------- Auth Secret (signing key) ----------
  AuthSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${EnvironmentName}/archestra/auth-secret"
      Description: Archestra auth token signing key (do NOT rotate — invalidates all sessions)
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  # ---------- Admin Credentials ----------
  AdminCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${EnvironmentName}/archestra/admin-credentials"
      Description: Initial admin email and password
      SecretString: !Sub |
        {
          "email": "${AdminEmail}",
          "password": "${AdminPassword}"
        }

  # ---------- LLM API Keys (placeholder) ----------
  LlmApiKeysSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${EnvironmentName}/archestra/llm-api-keys"
      Description: >
        LLM provider API keys. Update this secret after deployment with your
        OpenAI, Anthropic, or other provider keys.
      SecretString: |
        {
          "openai": "",
          "anthropic": "",
          "cohere": ""
        }

  # ---------- IAM Policy: IRSA read access ----------
  SecretsReadPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "${EnvironmentName}-secrets-read"
      Roles:
        - !Select [1, !Split ["/", !Ref ArchestraServiceAccountRoleArn]]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:DescribeSecret
            Resource:
              - !Ref AuthSecret
              - !Ref AdminCredentialsSecret
              - !Ref LlmApiKeysSecret
              - !Ref DatabaseUrlSecretArn

Outputs:
  AuthSecretArn:
    Value: !Ref AuthSecret
    Export:
      Name: !Sub "${EnvironmentName}-AuthSecretArn"

  AdminCredentialsSecretArn:
    Value: !Ref AdminCredentialsSecret
    Export:
      Name: !Sub "${EnvironmentName}-AdminCredentialsSecretArn"

  LlmApiKeysSecretArn:
    Value: !Ref LlmApiKeysSecret
    Export:
      Name: !Sub "${EnvironmentName}-LlmApiKeysSecretArn"