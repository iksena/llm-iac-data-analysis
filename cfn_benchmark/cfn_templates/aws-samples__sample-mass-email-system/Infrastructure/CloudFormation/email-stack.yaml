                              logger.info(f"Recorded failure for {mask_email(email)} and updated batch {batch_id}")
                          except Exception as record_e:
                              logger.error(f"Failed to record failure: {str(record_e)}")

                      failed_sends += 1
                      raise  # Re-raise for SQS retry

              # Update batch statistics in campaign-specific DynamoDB tables
              for (batch_id, batch_table_name), counts in batch_counts.items():
                  if counts['success'] > 0 or counts['fail'] > 0:
                      try:
                          # Initialize DynamoDB table for this batch
                          dynamodb = boto3.resource('dynamodb')
                          batch_table = dynamodb.Table(batch_table_name)

                          batch_table.update_item(
                              Key={'BatchId': batch_id},
                              UpdateExpression="ADD SentCount :success, FailedCount :fail",
                              ExpressionAttributeValues={
                                  ':success': counts['success'],
                                  ':fail': counts['fail']
                              }
                          )
                          logger.info(f"Updated batch {batch_id} with {counts['success']} success, {counts['fail']} failures")
                      except Exception as e:
                          logger.error(f"Failed to update counts for batch {batch_id}: {str(e)}")

              # Log summary
              logger.info(f"Processing complete: {successful_sends} successful, {failed_sends} failed")

              # Return summary
              return {
                  'statusCode': 200,
                  'body': json.dumps({
                      'successful': successful_sends,
                      'failed': failed_sends
                  })
              }

          def extract_embedded_images(html_content):
              """
              Extract embedded images from HTML content and convert data: URLs to cid: references
              Returns: (modified_html, list_of_embedded_attachments)
              """
              import re
              import uuid

              embedded_attachments = []

              # Pattern to match data: URLs in img src attributes
              data_url_pattern = r'<img[^>]+src="data:([^;]+);base64,([^"]+)"[^>]*>'

              def replace_data_url(match):
                  full_tag = match.group(0)
                  mime_type = match.group(1)
                  base64_data = match.group(2)

                  # Generate unique content ID
                  content_id = str(uuid.uuid4())

                  # Determine file extension from MIME type
                  extension_map = {
                      'image/png': 'png',
                      'image/jpeg': 'jpg',
                      'image/jpg': 'jpg',
                      'image/gif': 'gif',
                      'image/webp': 'webp',
                      'image/svg+xml': 'svg'
                  }
                  extension = extension_map.get(mime_type, 'bin')
                  filename = f"embedded_image_{content_id}.{extension}"

                  # Add to embedded attachments list
                  embedded_attachments.append({
                      'filename': filename,
                      'content': base64_data,
                      'contentType': mime_type,
                      'contentDisposition': 'INLINE',
                      'contentId': content_id
                  })

                  # Replace data: URL with cid: reference
                  return full_tag.replace(f'data:{mime_type};base64,{base64_data}', f'cid:{content_id}')

              # Replace all data: URLs with cid: references
              modified_html = re.sub(data_url_pattern, replace_data_url, html_content)

              return modified_html, embedded_attachments

          def record_failure(batch_id, campaign_id, email, recipient_table, error_message, attempts):
              """Record a failed email send in DynamoDB"""
              try:
                  # Record failure in recipient tracking table
                  failure_item = {
                      'EmailAddress': email,
                      'BatchId': batch_id,
                      'CampaignId': campaign_id,
                      'Status': 'FAILED',
                      'ErrorMessage': error_message,
                      'Timestamp': datetime.now(timezone.utc).isoformat(),
                      'Attempts': attempts
                  }
                  expiration_time = tracking_expiration()
                  if expiration_time is not None:
                      failure_item['ExpirationTime'] = expiration_time
                  recipient_table.put_item(Item=failure_item)

                  logger.info(f"Recorded failure for {mask_email(email)} in batch {batch_id}: {error_message}")
              except Exception as e:
                  logger.error(f"Failed to record failure for {mask_email(email)}: {str(e)}")

          def generate_token_reply_to(function_arn, recipient_email, campaign_id):
              """Invoke Please-Reply Token Generator to get a tokenized Reply-To address."""
              lambda_client = boto3.client('lambda')
              # Extract function name or ARN — Lambda invoke accepts both
              payload = json.dumps({
                  'customerId': recipient_email,
                  'campaignId': campaign_id or 'campaign'
              })
              response = lambda_client.invoke(
                  FunctionName=function_arn,
                  InvocationType='RequestResponse',
                  Payload=payload.encode('utf-8')
              )
              result = json.loads(response['Payload'].read())
              body = json.loads(result.get('body', '{}'))
              return body.get('replyToEmail')

