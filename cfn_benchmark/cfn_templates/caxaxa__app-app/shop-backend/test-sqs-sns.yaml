AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Test SQS and SNS resources

Resources:
  # Dead Letter Queue for failed WhatsApp messages (MUST be FIFO for FIFO source)
  WhatsAppDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-whatsapp-dlq.fifo"
      FifoQueue: true
      MessageRetentionPeriod: 1209600  # 14 days
      VisibilityTimeout: 300

  # Main SQS FIFO Queue for WhatsApp messages
  WhatsAppMainQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-whatsapp-main.fifo"
      FifoQueue: true
      ContentBasedDeduplication: false
      MessageRetentionPeriod: 1209600   # 14 days
      VisibilityTimeout: 180     # 3 minutes
      ReceiveMessageWaitTimeSeconds: 20 # Long polling
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt WhatsAppDLQ.Arn
        maxReceiveCount: 3

  # Dead Letter Queue for failed Lambda invocations
  WebhookDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-webhook-dlq"
      MessageRetentionPeriod: 1209600  # 14 days
      VisibilityTimeout: 300

  # SNS Topic for critical alerts
  CriticalAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-critical-alerts"
      DisplayName: "WhatsApp Platform Critical Alerts"

Outputs:
  WhatsAppMainQueueUrl:
    Description: Main WhatsApp queue URL
    Value: !Ref WhatsAppMainQueue
  CriticalAlertsTopicArn:
    Description: SNS topic ARN
    Value: !Ref CriticalAlertsTopic