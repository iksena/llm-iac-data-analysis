AWSTemplateFormatVersion: '2010-09-09'
Description: CloudFormation template for Puppet Quick Start VPC infrastructure with Route53 private hosted zone
Parameters:
  VpcCIDR:
    Type: String
    Default: 10.0.0.0/16
    Description: CIDR block for the VPC
  SubnetCIDR:
    Type: String
    Default: 10.0.0.0/19
    Description: CIDR block for the public subnet
  PuppetIP:
    Type: String
    Default: 10.0.0.10
    Description: IP address for puppet.example.com
  LinuxAgentIP:
    Type: String
    Default: 10.0.0.11
    Description: IP address for linuxagent.example.com
  WindowsAgentIP:
    Type: String
    Default: 10.0.0.12
    Description: IP address for windowsagent.example.com
Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCIDR
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: PuppetQuickStartVPC
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: PuppetQuickStartIGW
  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref SubnetCIDR
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: PuppetQuickStartPublicSubnet
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: PuppetQuickStartPublicRouteTable
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable
  PrivateHostedZone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: example.com
      VPCs:
        - VPCId: !Ref VPC
          VPCRegion: !Ref AWS::Region
      HostedZoneConfig:
        Comment: Private hosted zone for Puppet Quick Start
  PuppetRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref PrivateHostedZone
      Name: puppet.example.com
      Type: A
      TTL: 300
      ResourceRecords:
        - !Ref PuppetIP
  LinuxAgentRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref PrivateHostedZone
      Name: linuxagent.example.com
      Type: A
      TTL: 300
      ResourceRecords:
        - !Ref LinuxAgentIP
  WindowsAgentRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref PrivateHostedZone
      Name: windowsagent.example.com
      Type: A
      TTL: 300
      ResourceRecords:
        - !Ref WindowsAgentIP
Outputs:
  VpcId:
    Description: ID of the created VPC
    Value: !Ref VPC
  SubnetId:
    Description: ID of the created public subnet
    Value: !Ref PublicSubnet