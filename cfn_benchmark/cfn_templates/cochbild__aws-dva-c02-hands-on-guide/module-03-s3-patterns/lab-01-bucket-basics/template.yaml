AWSTemplateFormatVersion: "2010-09-09"
Description: >
  DVA-C02 Lab 3.1 — Bucket basics. Creates a single S3 bucket with default
  SSE-S3 encryption (the post-2023 default), Block Public Access carved out
  to allow website reads, and static website hosting enabled. The bucket is
  shared across labs 3.1–3.4.

Resources:
  DemoBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub "dva-lab-03-demo-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: false
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: false   # allow our public-read website policy
        IgnorePublicAcls: true
        RestrictPublicBuckets: false
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: error.html

  DemoBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DemoBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowPublicRead
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${DemoBucket.Arn}/*"

Outputs:
  BucketName:
    Description: Demo bucket name (used by labs 3.2 - 3.4)
    Value: !Ref DemoBucket
    Export:
      Name: dva-lab-03-demo-bucket-name

  BucketArn:
    Description: Demo bucket ARN
    Value: !GetAtt DemoBucket.Arn
    Export:
      Name: dva-lab-03-demo-bucket-arn

  WebsiteURL:
    Description: S3 website endpoint (HTTP only)
    Value: !GetAtt DemoBucket.WebsiteURL

  RegionalDomain:
    Description: Regional REST endpoint (for SDK/CLI use)
    Value: !GetAtt DemoBucket.RegionalDomainName