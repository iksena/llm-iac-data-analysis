AWSTemplateFormatVersion: '2010-09-09'
Description: 'Co-Intelligence Infrastructure - VPC, RDS, ECR, S3, EKS'

Parameters:
  DBUsername:
    Type: String
    Default: cointelligence
    Description: Database master username
  EnableGuardDuty:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Set to true to enable GuardDuty detector creation
  EnableSecretRotation:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Set to true to enable Secrets Manager single-user rotation for the database secret
  IRSAOidcProviderArn:
    Type: String
    Default: ""
    Description: OIDC provider ARN for EKS (required to create IRSA role). Leave blank to skip IRSA role creation.
  IRSAOidcProviderUrl:
    Type: String
    Default: ""
    Description: OIDC issuer URL for EKS (e.g., https://oidc.eks.<region>.amazonaws.com/id/XXXXXXXXXX). Required if IRSA role is created.

Conditions:
  CreateIRSA: !And [!Not [!Equals [!Ref IRSAOidcProviderArn, ""]], !Not [!Equals [!Ref IRSAOidcProviderUrl, ""]]]
  CreateGuardDuty: !Equals [!Ref EnableGuardDuty, "true"]
  CreateSecretRotation: !Equals [!Ref EnableSecretRotation, "true"]

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: co-intelligence-vpc

  SubnetPublicA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: co-intelligence-public-a

  SubnetPublicB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: co-intelligence-public-b

  SubnetPrivateA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: co-intelligence-private-a

  SubnetPrivateB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.4.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: co-intelligence-private-b

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: co-intelligence-igw

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: co-intelligence-rt-public

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetPublicA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetRouteTableAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetPublicB
      RouteTableId: !Ref PublicRouteTable

  NatEipA:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  NatEipB:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  NatGatewayA:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEipA.AllocationId
      SubnetId: !Ref SubnetPublicA
      Tags:
        - Key: Name
          Value: co-intelligence-nat-a

  NatGatewayB:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEipB.AllocationId
      SubnetId: !Ref SubnetPublicB
      Tags:
        - Key: Name
          Value: co-intelligence-nat-b

  PrivateRouteTableA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: co-intelligence-rt-private-a

  PrivateRouteTableB:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: co-intelligence-rt-private-b

  PrivateRouteA:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTableA
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGatewayA

  PrivateRouteB:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTableB
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGatewayB

  PrivateSubnetRouteTableAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetPrivateA
      RouteTableId: !Ref PrivateRouteTableA

  PrivateSubnetRouteTableAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetPrivateB
      RouteTableId: !Ref PrivateRouteTableB

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnet group for RDS
      SubnetIds:
        - !Ref SubnetPrivateA
        - !Ref SubnetPrivateB
      Tags:
        - Key: Name
          Value: co-intelligence-db-subnet-group

  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for RDS
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 10.0.3.0/24
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 10.0.4.0/24
      Tags:
        - Key: Name
          Value: co-intelligence-db-sg

  CacheSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Redis
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          CidrIp: 10.0.3.0/24
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          CidrIp: 10.0.4.0/24
      Tags:
        - Key: Name
          Value: co-intelligence-redis-sg

  EKSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for EKS nodes
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: -1
          CidrIp: 10.0.0.0/16                         # allow from VPC (LBs and node-to-node)
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: co-intelligence-eks-sg

  RDSParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      DBParameterGroupName: co-intelligence-pg
      Description: Parameter group enforcing SSL
      Family: postgres17
      Parameters:
        rds.force_ssl: '1'
      Tags:
        - Key: Name
          Value: co-intelligence-pg

  RDSInstance:
    Type: AWS::RDS::DBInstance
    DependsOn: AppSecrets
    Properties:
      DBInstanceIdentifier: co-intelligence-db
      Engine: postgres
      EngineVersion: '17.2'
      DBInstanceClass: db.t3.medium
      AllocatedStorage: 20
      StorageType: gp3
      StorageEncrypted: true
      MasterUsername: !Sub '{{resolve:secretsmanager:${AppSecrets}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${AppSecrets}:SecretString:password}}'
      DBSubnetGroupName: !Ref DBSubnetGroup
      DBParameterGroupName: !Ref RDSParameterGroup
      VPCSecurityGroups:
        - !Ref DBSecurityGroup
      PubliclyAccessible: false
      MultiAZ: true
      BackupRetentionPeriod: 7
      DeletionProtection: false
      Tags:
        - Key: Name
          Value: co-intelligence-rds

  EKSClusterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: co-intelligence-eks-cluster-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy

  EKSNodeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: co-intelligence-eks-node-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
      Policies:
        - PolicyName: LambdaInvokePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt CodeExecutorLambda.Arn

  BackendECR:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: co-intelligence-backend
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep last 30 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 30
                },
                "action": { "type": "expire" }
              }
            ]
          }

  FrontendECR:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: co-intelligence-frontend
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep last 30 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 30
                },
                "action": { "type": "expire" }
              }
            ]
          }

  S3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'co-intelligence-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # Secrets Manager - Auto-generates DB password (uses 'username'/'password' keys for RDS attachment)
  AppSecrets:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: co-intelligence-secrets
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username":"${DBUsername}"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/\\'''
      Tags:
        - Key: Name
          Value: co-intelligence-secrets

  # Auto-generate SECRET_KEY separately
  AppSecretKey:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: co-intelligence-secret-key
      GenerateSecretString:
        PasswordLength: 32
        ExcludePunctuation: true
      Tags:
        - Key: Name
          Value: co-intelligence-secret-key

  # Attach secret to RDS for rotation support
  SecretRDSAttachment:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Properties:
      SecretId: !Ref AppSecrets
      TargetId: !Ref RDSInstance
      TargetType: AWS::RDS::DBInstance

  # Rotation schedule for DB secret (single-user rotation)
  SecretRotationSchedule:
    Type: AWS::SecretsManager::RotationSchedule
    Condition: CreateSecretRotation
    DependsOn:
      - SecretRDSAttachment
      - RDSInstance
    Properties:
      SecretId: !Ref AppSecrets
      HostedRotationLambda:
        RotationType: PostgreSQLSingleUser
        VpcSecurityGroupIds:
          - !Ref DBSecurityGroup
        VpcSubnetIds:
          - !Ref SubnetPrivateA
          - !Ref SubnetPrivateB
      RotationRules:
        AutomaticallyAfterDays: 30

  # EKS Cluster
  EKSCluster:
    Type: AWS::EKS::Cluster
    DependsOn:
      - EKSClusterRole
      - SubnetPublicA
      - SubnetPublicB
      - SubnetPrivateA
      - SubnetPrivateB
      - EKSSecurityGroup
    Properties:
      Name: co-intelligence-cluster
      Version: '1.34'
      RoleArn: !GetAtt EKSClusterRole.Arn
      UpgradePolicy:
        SupportType: STANDARD
      AccessConfig:
        AuthenticationMode: API_AND_CONFIG_MAP
      Logging:
        ClusterLogging:
          EnabledTypes:
            - Type: api
            - Type: audit
            - Type: authenticator
            - Type: controllerManager
            - Type: scheduler
      ResourcesVpcConfig:
        SubnetIds:
          - !Ref SubnetPublicA
          - !Ref SubnetPublicB
          - !Ref SubnetPrivateA
          - !Ref SubnetPrivateB
        SecurityGroupIds:
          - !Ref EKSSecurityGroup
        EndpointPublicAccess: true
        EndpointPrivateAccess: true
      Tags:
        - Key: Name
          Value: co-intelligence-cluster

  NodeLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: co-intelligence-node-lt
      LaunchTemplateData:
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 20
              VolumeType: gp3
              Encrypted: true
        SecurityGroupIds:
          - !Ref EKSSecurityGroup

  # EKS Node Group
  EKSNodeGroup:
    Type: AWS::EKS::Nodegroup
    DependsOn: EKSCluster
    Properties:
      ClusterName: !Ref EKSCluster
      NodegroupName: co-intelligence-nodes
      NodeRole: !GetAtt EKSNodeRole.Arn
      InstanceTypes:
        - t3.medium
      ScalingConfig:
        MinSize: 8
        MaxSize: 9
        DesiredSize: 8
      Subnets:
        - !Ref SubnetPrivateA
        - !Ref SubnetPrivateB
      LaunchTemplate:
        Id: !Ref NodeLaunchTemplate
        Version: !GetAtt NodeLaunchTemplate.LatestVersionNumber
      Tags:
        Name: co-intelligence-nodes

  CacheSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      Description: Private subnets for Redis
      SubnetIds:
        - !Ref SubnetPrivateA
        - !Ref SubnetPrivateB

  RedisReplicationGroup:
    Type: AWS::ElastiCache::ReplicationGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ReplicationGroupDescription: Redis for Co-Intelligence
      Engine: redis
      CacheNodeType: cache.t3.micro
      NumNodeGroups: 1
      ReplicasPerNodeGroup: 0
      AutomaticFailoverEnabled: false
      MultiAZEnabled: false
      AtRestEncryptionEnabled: true
      TransitEncryptionEnabled: true
      SecurityGroupIds:
        - !Ref CacheSecurityGroup
      CacheSubnetGroupName: !Ref CacheSubnetGroup

  # Lambda Execution Role
  CodeExecutorLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: co-intelligence-code-executor-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Tags:
        - Key: Name
          Value: co-intelligence-code-executor-role

  # Lambda Function for Code Execution (inline ZipFile for self-contained stack)
  CodeExecutorLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: co-intelligence-code-executor
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt CodeExecutorLambdaRole.Arn
      Timeout: 20
      MemorySize: 512
      Code:
        ZipFile: |
          import json
          import io
          import traceback
          from contextlib import redirect_stdout, redirect_stderr
          import math
          import datetime
          import random
          import statistics
          import re
          import collections
          import itertools
          import string
          import decimal
          import fractions
          import uuid
          import hashlib
          import base64
          import textwrap

          ALLOWED_MODULES = {
              "math",
              "json",
              "datetime",
              "random",
              "statistics",
              "re",
              "collections",
              "itertools",
              "string",
              "decimal",
              "fractions",
              "uuid",
              "hashlib",
              "base64",
              "textwrap",
          }

          def safe_import(name, *args, **kwargs):
              if name in ALLOWED_MODULES:
                  return __import__(name, *args, **kwargs)
              raise ImportError(f"Module '{name}' is not allowed")

          SAFE_BUILTINS = {
              "__import__": safe_import,
              "print": print,
              "len": len,
              "range": range,
              "str": str,
              "int": int,
              "float": float,
              "list": list,
              "dict": dict,
              "set": set,
              "tuple": tuple,
              "sum": sum,
              "max": max,
              "min": min,
              "abs": abs,
              "round": round,
              "sorted": sorted,
              "enumerate": enumerate,
              "zip": zip,
              "map": map,
              "filter": filter,
              "any": any,
              "all": all,
              "bool": bool,
              "bytes": bytes,
              "chr": chr,
              "ord": ord,
              "hex": hex,
              "oct": oct,
              "bin": bin,
              "pow": pow,
              "divmod": divmod,
              "isinstance": isinstance,
              "issubclass": issubclass,
              "type": type,
          }

          SAFE_GLOBALS = {
              "__builtins__": SAFE_BUILTINS,
              "math": math,
              "json": json,
              "datetime": datetime,
              "random": random,
              "statistics": statistics,
              "re": re,
              "collections": collections,
              "itertools": itertools,
              "string": string,
              "decimal": decimal,
              "fractions": fractions,
              "uuid": uuid,
              "hashlib": hashlib,
              "base64": base64,
              "textwrap": textwrap,
          }

          def lambda_handler(event, context):
              code = event.get("code", "")
              if not code:
                  return {"statusCode": 400, "body": json.dumps({"error": "No code provided"})}

              stdout_capture = io.StringIO()
              stderr_capture = io.StringIO()

              try:
                  with redirect_stdout(stdout_capture), redirect_stderr(stderr_capture):
                      exec(code, SAFE_GLOBALS)

                  return {
                      "statusCode": 200,
                      "body": json.dumps(
                          {"output": stdout_capture.getvalue(), "errors": stderr_capture.getvalue() or None, "success": True}
                      ),
                  }
              except Exception as exc:  # pylint: disable=broad-except
                  return {
                      "statusCode": 200,
                      "body": json.dumps(
                          {
                              "output": stdout_capture.getvalue(),
                              "errors": f"{type(exc).__name__}: {exc}\n{traceback.format_exc()}",
                              "success": False,
                          }
                      ),
                  }
      Environment:
        Variables:
          PYTHONUNBUFFERED: "1"
      Tags:
        - Key: Name
          Value: co-intelligence-code-executor

  GuardDutyDetector:
    Type: AWS::GuardDuty::Detector
    Condition: CreateGuardDuty
    Properties:
      Enable: true

  DataAnalysisPepperSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: co-intelligence-data-analysis-pepper
      GenerateSecretString:
        SecretStringTemplate: '{"pepper":""}'
        GenerateStringKey: pepper
        PasswordLength: 48
        ExcludePunctuation: true
      Tags:
        - Key: Name
          Value: co-intelligence-data-analysis-pepper

  DataAnalysisAthenaWorkGroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: co-intelligence-data-analysis
      Description: Athena workgroup for Data Analysis app
      State: ENABLED
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        PublishCloudWatchMetricsEnabled: true
        ResultConfiguration:
          OutputLocation: !Sub "s3://${S3Bucket}/data-analysis/athena_results/"

  DataAnalysisGlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: co_intelligence_data_analysis
        Description: Glue catalog database for Data Analysis app

  DataAnalysisGlueSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Glue job ENIs (Data Analysis)
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: co-intelligence-glue-data-analysis-sg

  DataAnalysisPostgresConnection:
    Type: AWS::Glue::Connection
    Properties:
      CatalogId: !Ref AWS::AccountId
      ConnectionInput:
        Name: co-intelligence-data-analysis-postgres
        ConnectionType: JDBC
        ConnectionProperties:
          JDBC_CONNECTION_URL: !Sub "jdbc:postgresql://${RDSInstance.Endpoint.Address}:5432/postgres"
          USERNAME: !Sub "{{resolve:secretsmanager:co-intelligence-secrets:SecretString:username}}"
          PASSWORD: !Sub "{{resolve:secretsmanager:co-intelligence-secrets:SecretString:password}}"
          JDBC_ENFORCE_SSL: "false"
        PhysicalConnectionRequirements:
          SubnetId: !Ref SubnetPrivateA
          SecurityGroupIdList:
            - !Ref DataAnalysisGlueSecurityGroup

  DataAnalysisGlueRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: co-intelligence-data-analysis-glue-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - glue.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: data-analysis-glue-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !Sub arn:aws:s3:::${S3Bucket}
                  - !Sub arn:aws:s3:::${S3Bucket}/*
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref DataAnalysisPepperSecret
                  - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:co-intelligence-secrets*
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"

  DataAnalysisGlueJobS3:
    Type: AWS::Glue::Job
    Properties:
      Name: co-intelligence-data-analysis-etl-s3
      Role: !GetAtt DataAnalysisGlueRole.Arn
      GlueVersion: "4.0"
      WorkerType: G.2X
      NumberOfWorkers: 10
      Command:
        Name: glueetl
        PythonVersion: "3"
        ScriptLocation: !Sub "s3://${S3Bucket}/glue-scripts/data-analysis-etl.py"
      DefaultArguments:
        "--enable-continuous-cloudwatch-log": "true"
        "--enable-metrics": "true"
        "--job-language": "python"

  DataAnalysisGlueJobPostgres:
    Type: AWS::Glue::Job
    Properties:
      Name: co-intelligence-data-analysis-etl-postgres
      Role: !GetAtt DataAnalysisGlueRole.Arn
      GlueVersion: "4.0"
      WorkerType: G.2X
      NumberOfWorkers: 10
      Command:
        Name: glueetl
        PythonVersion: "3"
        ScriptLocation: !Sub "s3://${S3Bucket}/glue-scripts/data-analysis-etl.py"
      DefaultArguments:
        "--enable-continuous-cloudwatch-log": "true"
        "--enable-metrics": "true"
        "--job-language": "python"
      Connections:
        Connections:
          - !Ref DataAnalysisPostgresConnection

  DataAnalysisCatalogLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: co-intelligence-data-analysis-catalog-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: data-analysis-catalog-lambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub arn:aws:s3:::${S3Bucket}/*
              - Effect: Allow
                Action:
                  - glue:GetTable
                  - glue:CreateTable
                  - glue:UpdateTable
                Resource: "*"

  DataAnalysisCatalogFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: co-intelligence-data-analysis-catalog
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt DataAnalysisCatalogLambdaRole.Arn
      Timeout: 60
      Code:
        ZipFile: |
          import json
          import boto3

          glue = boto3.client("glue")
          s3 = boto3.client("s3")

          def _parse_s3_uri(uri: str):
            if not uri.startswith("s3://"):
              raise ValueError("Expected s3:// URI")
            b, k = uri.replace("s3://", "", 1).split("/", 1)
            return b, k

          def _to_storage_descriptor(columns, location):
            return {
              "Columns": [{"Name": c["name"], "Type": c["type"]} for c in columns],
              "Location": location,
              "InputFormat": "org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat",
              "OutputFormat": "org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat",
              "SerdeInfo": {
                "SerializationLibrary": "org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe",
                "Parameters": {"serialization.format": "1"},
              },
            }

          def lambda_handler(event, context):
            schema_uri = event["schema_s3_uri"]
            curated_uri = event["curated_s3_uri"]
            database = event["glue_database"]
            table = event["glue_table"]

            b, k = _parse_s3_uri(schema_uri)
            obj = s3.get_object(Bucket=b, Key=k)
            payload = json.loads(obj["Body"].read().decode("utf-8"))
            cols = payload.get("columns", [])
            if not cols:
              raise ValueError("schema.json missing columns")

            sd = _to_storage_descriptor(cols, curated_uri)
            table_input = {"Name": table, "TableType": "EXTERNAL_TABLE", "StorageDescriptor": sd, "Parameters": {"classification": "parquet"}}

            try:
              glue.get_table(DatabaseName=database, Name=table)
              glue.update_table(DatabaseName=database, TableInput=table_input)
              action = "updated"
            except glue.exceptions.EntityNotFoundException:
              glue.create_table(DatabaseName=database, TableInput=table_input)
              action = "created"

            return {"status": "ok", "action": action, "database": database, "table": table}

