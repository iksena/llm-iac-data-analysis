AWSTemplateFormatVersion: '2010-09-09'
Description: 'SAA Lab 06 - Lambda, API Gateway HTTP API e IAM de menor privilegio'

Parameters:
  ProjectName:
    Type: String
    Default: saa-lab-06

Resources:
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-lambda-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WriteOwnLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-hello:*'
      Tags: [{Key: Project, Value: saa-c03-intensive}, {Key: Lab, Value: '06'}, {Key: ManagedBy, Value: CloudFormation}]

  HelloFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-hello'
      Description: Handler simples para HTTP API
      Runtime: nodejs24.x
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      MemorySize: 128
      Timeout: 5
      Architectures: [arm64]
      Environment:
        Variables: {LAB_NAME: !Ref ProjectName}
      Code:
        ZipFile: |
          exports.handler = async (event) => ({
            statusCode: 200,
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              message: "Olá do SAA Lab 06!",
              requestId: event.requestContext?.requestId
            })
          });
      Tags: [{Key: Project, Value: saa-c03-intensive}, {Key: Lab, Value: '06'}, {Key: ManagedBy, Value: CloudFormation}]
  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-hello'
      RetentionInDays: 7
      Tags: [{Key: Project, Value: saa-c03-intensive}, {Key: Lab, Value: '06'}]

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${ProjectName}-http-api'
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowMethods: [GET]
      Tags: {Project: saa-c03-intensive, Lab: '06', ManagedBy: CloudFormation}
  LambdaIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt HelloFunction.Arn
      IntegrationMethod: POST
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 5000
  HelloRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /hello'
      Target: !Sub 'integrations/${LambdaIntegration}'
  DefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: '$default'
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5
      Tags: {Project: saa-c03-intensive, Lab: '06'}
  ApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref HelloFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/GET/hello'

Outputs:
  ApiUrl: {Description: Execute GET neste endpoint, Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/hello'}
  FunctionName: {Value: !Ref HelloFunction}
  ExecutionRoleArn: {Value: !GetAtt LambdaExecutionRole.Arn}
  LogGroupName: {Value: !Ref LambdaLogGroup}