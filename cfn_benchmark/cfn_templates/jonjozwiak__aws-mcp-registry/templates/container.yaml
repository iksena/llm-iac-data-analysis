AWSTemplateFormatVersion: '2010-09-09'
Description: 'MCP Registry - ECS Fargate Cluster, Service, and Task Definition'

Parameters:
  EnvironmentName:
    Type: String
    Description: Environment name for resource naming
    Default: mcp-registry

  DeployMode:
    Type: String
    AllowedValues:
      - lab
      - ha
    Default: lab
    Description: Deployment mode - lab (cost-optimized) or ha (high availability)

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID

  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: List of private subnet IDs for ECS tasks

  ECSSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group ID for ECS tasks

  ECSTaskExecutionRoleArn:
    Type: String
    Description: ECS Task Execution Role ARN

  ECSTaskRoleArn:
    Type: String
    Description: ECS Task Role ARN

  TargetGroupArn:
    Type: String
    Description: ALB Target Group ARN

  DatabaseEndpoint:
    Type: String
    Description: RDS PostgreSQL endpoint

  DatabasePort:
    Type: String
    Description: RDS PostgreSQL port
    Default: '5432'

  DatabaseName:
    Type: String
    Description: Database name

  DatabaseUsername:
    Type: String
    Description: Database username
    NoEcho: true

  DatabasePassword:
    Type: String
    Description: Database password
    NoEcho: true

  GitHubClientId:
    Type: String
    Description: GitHub OAuth App client ID

  GitHubClientSecret:
    Type: String
    Description: GitHub OAuth App client secret
    NoEcho: true

  JWTPrivateKey:
    Type: String
    Description: 32-byte hex string for JWT signing
    NoEcho: true

  RegistryBaseURL:
    Type: String
    Description: Base URL for the registry (e.g., https://registry.example.com)

  EnableAnonymousAuth:
    Type: String
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'false'
    Description: Enable anonymous authentication

  EnableSeedData:
    Type: String
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'true'
    Description: Enable seed data population

  SeedFrom:
    Type: String
    Default: 'https://registry.modelcontextprotocol.io/v0/servers'
    Description: Seed data source URL

  EnableRegistryValidation:
    Type: String
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'true'
    Description: Enable registry validation (package ownership)

  ContainerImage:
    Type: String
    Default: ghcr.io/modelcontextprotocol/registry:latest
    Description: Container image for the MCP registry

  LogRetentionDays:
    Type: Number
    Default: 30
    Description: CloudWatch log retention in days

Conditions:
  IsHA: !Equals [!Ref DeployMode, 'ha']

Resources:
  # CloudWatch Log Group
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${EnvironmentName}'
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-logs'

  # Secrets Manager - Database URL
  DatabaseURLSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${EnvironmentName}/database-url'
      Description: MCP Registry database connection URL
      SecretString: !Sub 'postgresql://${DatabaseUsername}:${DatabasePassword}@${DatabaseEndpoint}:${DatabasePort}/${DatabaseName}?sslmode=require'
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-database-url'

  # Secrets Manager - GitHub OAuth
  GitHubClientIdSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${EnvironmentName}/github-client-id'
      Description: MCP Registry GitHub OAuth client ID
      SecretString: !Ref GitHubClientId
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-github-client-id'

  GitHubClientSecretSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${EnvironmentName}/github-client-secret'
      Description: MCP Registry GitHub OAuth client secret
      SecretString: !Ref GitHubClientSecret
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-github-client-secret'

  # Secrets Manager - JWT Private Key
  JWTPrivateKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${EnvironmentName}/jwt-private-key'
      Description: MCP Registry JWT signing key
      SecretString: !Ref JWTPrivateKey
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-jwt-private-key'

  # ECS Cluster
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${EnvironmentName}-cluster'
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Configuration:
        ExecuteCommandConfiguration:
          Logging: DEFAULT
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-cluster'

  # ECS Task Definition
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${EnvironmentName}-task'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: !If [IsHA, '1024', '512']
      Memory: !If [IsHA, '2048', '1024']
      ExecutionRoleArn: !Ref ECSTaskExecutionRoleArn
      TaskRoleArn: !Ref ECSTaskRoleArn
      ContainerDefinitions:
        - Name: mcp-registry
          Image: !Ref ContainerImage
          Essential: true
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          Environment:
            - Name: MCP_REGISTRY_SERVER_ADDRESS
              Value: ':8080'
            - Name: MCP_REGISTRY_ENABLE_ANONYMOUS_AUTH
              Value: !Ref EnableAnonymousAuth
            - Name: MCP_REGISTRY_ENABLE_SEED_DATA
              Value: !Ref EnableSeedData
            - Name: MCP_REGISTRY_SEED_FROM
              Value: !Ref SeedFrom
            - Name: MCP_REGISTRY_ENABLE_REGISTRY_VALIDATION
              Value: !Ref EnableRegistryValidation
            - Name: MCP_REGISTRY_BASE_URL
              Value: !Ref RegistryBaseURL
          Secrets:
            - Name: MCP_REGISTRY_DATABASE_URL
              ValueFrom: !Ref DatabaseURLSecret
            - Name: MCP_REGISTRY_GITHUB_CLIENT_ID
              ValueFrom: !Ref GitHubClientIdSecret
            - Name: MCP_REGISTRY_GITHUB_CLIENT_SECRET
              ValueFrom: !Ref GitHubClientSecretSecret
            - Name: MCP_REGISTRY_JWT_PRIVATE_KEY
              ValueFrom: !Ref JWTPrivateKeySecret
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: mcp-registry
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-task'

  # ECS Service
  ECSService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub '${EnvironmentName}-service'
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      DesiredCount: !If [IsHA, 3, 1]
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Ref PrivateSubnetIds
          SecurityGroups:
            - !Ref ECSSecurityGroupId
      LoadBalancers:
        - TargetGroupArn: !Ref TargetGroupArn
          ContainerName: mcp-registry
          ContainerPort: 8080
      DeploymentConfiguration:
        MinimumHealthyPercent: !If [IsHA, 66, 0]
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      EnableExecuteCommand: true
      HealthCheckGracePeriodSeconds: 60
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-service'

  # Auto Scaling Target
  AutoScalingTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub 'service/${ECSCluster}/${ECSService.Name}'
      MinCapacity: !If [IsHA, 3, 1]
      MaxCapacity: !If [IsHA, 10, 2]
      RoleARN: !Sub 'arn:aws:iam::${AWS::AccountId}:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService'

  # Auto Scaling Policy - CPU
  CPUScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub '${EnvironmentName}-cpu-scaling'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref AutoScalingTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: 70.0
        ScaleInCooldown: 300
        ScaleOutCooldown: 60

  # Auto Scaling Policy - Memory
  MemoryScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub '${EnvironmentName}-memory-scaling'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref AutoScalingTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageMemoryUtilization
        TargetValue: 80.0
        ScaleInCooldown: 300
        ScaleOutCooldown: 60

Outputs:
  ClusterName:
    Description: ECS Cluster name
    Value: !Ref ECSCluster
    Export:
      Name: !Sub '${EnvironmentName}-ClusterName'

  ClusterArn:
    Description: ECS Cluster ARN
    Value: !GetAtt ECSCluster.Arn
    Export:
      Name: !Sub '${EnvironmentName}-ClusterArn'

  ServiceName:
    Description: ECS Service name
    Value: !GetAtt ECSService.Name
    Export:
      Name: !Sub '${EnvironmentName}-ServiceName'

  ServiceArn:
    Description: ECS Service ARN
    Value: !Ref ECSService
    Export:
      Name: !Sub '${EnvironmentName}-ServiceArn'

  TaskDefinitionArn:
    Description: Task Definition ARN
    Value: !Ref TaskDefinition
    Export:
      Name: !Sub '${EnvironmentName}-TaskDefinitionArn'

  LogGroupName:
    Description: CloudWatch Log Group name
    Value: !Ref LogGroup
    Export:
      Name: !Sub '${EnvironmentName}-LogGroupName'

  DatabaseURLSecretArn:
    Description: Database URL Secret ARN
    Value: !Ref DatabaseURLSecret
    Export:
      Name: !Sub '${EnvironmentName}-DatabaseURLSecretArn'