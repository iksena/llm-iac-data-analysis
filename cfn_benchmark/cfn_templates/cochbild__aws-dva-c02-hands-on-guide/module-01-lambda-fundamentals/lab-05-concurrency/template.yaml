AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: |
  DVA-C02 Lab 1.5 — Concurrency
  Three functions: baseline slow, reserved-capped, provisioned (no cold start).

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    LoggingConfig:
      LogFormat: JSON

Resources:
  # Baseline -- no concurrency limits
  SlowFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dva-lab-01-05-slow
      CodeUri: src/
      Handler: app.handler
      Environment:
        Variables:
          SLEEP_SECS: '3'

  # Reserved concurrency = 2: hard cap
  ReservedFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dva-lab-01-05-reserved
      CodeUri: src/
      Handler: app.handler
      ReservedConcurrentExecutions: 2
      Environment:
        Variables:
          SLEEP_SECS: '3'

  # Provisioned concurrency on the alias
  ProvisionedFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dva-lab-01-05-provisioned
      CodeUri: src/
      Handler: app.handler
      AutoPublishAlias: live
      Environment:
        Variables:
          SLEEP_SECS: '3'
      ProvisionedConcurrencyConfig:
        ProvisionedConcurrentExecutions: 2

Outputs:
  SlowFunctionName:
    Value: !Ref SlowFunction
  ReservedFunctionName:
    Value: !Ref ReservedFunction
  ProvisionedAliasArn:
    Value: !Ref ProvisionedFunction.Alias