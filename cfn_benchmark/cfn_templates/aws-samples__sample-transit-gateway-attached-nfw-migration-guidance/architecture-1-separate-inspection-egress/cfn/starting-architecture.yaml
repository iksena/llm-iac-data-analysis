AWSTemplateFormatVersion: "2010-09-09"
Description: "Starting architecture with separate inspection and egress VPCs for TGW-attached Network Firewall migration (uksb-kel1jgq0uo)(tag:arch1-starting)"

Metadata:
  "AWS::CloudFormation::Interface":
    ParameterGroups:
      - Label:
          default: "VPC Parameters"
        Parameters:
          - AvailabilityZoneSelection
          - DeleteDefaultVPC
      - Label:
          default: "EC2 Parameters"
        Parameters:
          - LatestAmiId
      - Label:
          default: "Migration Parameters (only used during migration)"
        Parameters:
          - MigrationPhase
          - NewFirewallAttachmentId

Parameters:
  AvailabilityZoneSelection:
    Description: Availability Zone
    Type: AWS::EC2::AvailabilityZone::Name
    Default: us-east-1a

  DeleteDefaultVPC:
    Description: Delete the default VPC to stay within the default 5 VPC per region quota. Set to false if you have resources in the default VPC or have already increased your VPC quota.
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"

  LatestAmiId:
    Description: Latest EC2 AMI from Systems Manager Parameter Store
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: '/aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2'

  MigrationPhase:
    Description: |
      Controls migration state of this stack:
      - none: No migration in progress (default)
      - test-spoke: Spoke B disassociated from spoke RT (being migrated to new firewall)
      - all-spokes: Spoke RT default route points to new TGW-attached firewall
    Type: String
    Default: "none"
    AllowedValues:
      - "none"
      - "test-spoke"
      - "all-spokes"

  NewFirewallAttachmentId:
    Description: TGW attachment ID of the new TGW-attached Network Firewall (required for all-spokes phase). Get from migration stack outputs.
    Type: String
    Default: ""

Conditions:
  ShouldDeleteDefaultVPC: !Equals [!Ref DeleteDefaultVPC, "true"]
  SpokeBOnOldRT: !Not [!Equals [!Ref MigrationPhase, "test-spoke"]]
  RouteToNewFirewall: !Equals [!Ref MigrationPhase, "all-spokes"]

Resources:

# Delete default VPC - This stack creates 4 VPCs and the migration requires a 5th.
# The default region limit is 5 VPCs. While this limit can be increased, we delete the
# default VPC to work within the default quota since this is typically deployed in
# lab/POC accounts that may not have quota increases configured.

  DeleteDefaultVPCRole:
    Type: AWS::IAM::Role
    Condition: ShouldDeleteDefaultVPC
    Properties:
      RoleName: !Sub "delete-default-vpc-role-${AWS::StackName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: DeleteDefaultVPC
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeVpcs
                  - ec2:DescribeInternetGateways
                  - ec2:DetachInternetGateway
                  - ec2:DeleteInternetGateway
                  - ec2:DescribeSubnets
                  - ec2:DeleteSubnet
                  - ec2:DescribeRouteTables
                  - ec2:DeleteRouteTable
                  - ec2:DescribeNetworkAcls
                  - ec2:DeleteNetworkAcl
                  - ec2:DescribeSecurityGroups
                  - ec2:DeleteSecurityGroup
                  - ec2:DeleteVpc
                Resource: "*"

  DeleteDefaultVPCFunction:
    Type: AWS::Lambda::Function
    Condition: ShouldDeleteDefaultVPC
    Properties:
      FunctionName: !Sub "delete-default-vpc-${AWS::StackName}"
      Runtime: python3.12
      Handler: index.handler
      Timeout: 120
      Role: !GetAtt DeleteDefaultVPCRole.Arn
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          def handler(event, context):
              if event['RequestType'] == 'Delete':
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                  return
              try:
                  ec2 = boto3.client('ec2')
                  vpcs = ec2.describe_vpcs(Filters=[{'Name': 'isDefault', 'Values': ['true']}])
                  if not vpcs['Vpcs']:
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {'Message': 'No default VPC found'})
                      return
                  vpc_id = vpcs['Vpcs'][0]['VpcId']
                  # Delete IGWs
                  for igw in ec2.describe_internet_gateways(Filters=[{'Name': 'attachment.vpc-id', 'Values': [vpc_id]}])['InternetGateways']:
                      ec2.detach_internet_gateway(InternetGatewayId=igw['InternetGatewayId'], VpcId=vpc_id)
                      ec2.delete_internet_gateway(InternetGatewayId=igw['InternetGatewayId'])
                  # Delete subnets
                  for subnet in ec2.describe_subnets(Filters=[{'Name': 'vpc-id', 'Values': [vpc_id]}])['Subnets']:
                      ec2.delete_subnet(SubnetId=subnet['SubnetId'])
                  # Delete non-main route tables
                  for rt in ec2.describe_route_tables(Filters=[{'Name': 'vpc-id', 'Values': [vpc_id]}])['RouteTables']:
                      if not any(a['Main'] for a in rt['Associations']):
                          ec2.delete_route_table(RouteTableId=rt['RouteTableId'])
                  # Delete non-default NACLs
                  for acl in ec2.describe_network_acls(Filters=[{'Name': 'vpc-id', 'Values': [vpc_id]}])['NetworkAcls']:
                      if not acl['IsDefault']:
                          ec2.delete_network_acl(NetworkAclId=acl['NetworkAclId'])
                  # Delete non-default security groups
                  for sg in ec2.describe_security_groups(Filters=[{'Name': 'vpc-id', 'Values': [vpc_id]}])['SecurityGroups']:
                      if sg['GroupName'] != 'default':
                          ec2.delete_security_group(GroupId=sg['GroupId'])
                  ec2.delete_vpc(VpcId=vpc_id)
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {'Message': f'Deleted default VPC {vpc_id}'})
              except Exception as e:
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Message': str(e)})

  DeleteDefaultVPCCustomResource:
    Type: Custom::DeleteDefaultVPC
    Condition: ShouldDeleteDefaultVPC
    Properties:
      ServiceToken: !GetAtt DeleteDefaultVPCFunction.Arn

# spoke-a VPC
  VPCA:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: "10.1.0.0/16"
      EnableDnsSupport: "true"
      EnableDnsHostnames: "true"
      InstanceTenancy: default
      Tags:
        - Key: Name
          Value: !Sub "spoke-a-${AWS::StackName}"

  SubnetAWorkload:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: VPCA
      CidrBlock: "10.1.1.0/24"
      AvailabilityZone:
        Ref: AvailabilityZoneSelection
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "spoke-a-workload-${AWS::StackName}"

  SubnetATGW:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: VPCA
      CidrBlock: "10.1.0.0/28"
      AvailabilityZone:
        Ref: AvailabilityZoneSelection
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "spoke-a-tgw-${AWS::StackName}"

  VPCAEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
        GroupDescription: Allow instances to get to SSM Systems Manager
        VpcId: !Ref VPCA
        SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 10.1.0.0/16

  VPCASSMEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
        PrivateDnsEnabled: true
        SecurityGroupIds:
          - !Ref VPCAEndpointSecurityGroup
        ServiceName: !Sub "com.amazonaws.${AWS::Region}.ssm"
        SubnetIds:
          - !Ref SubnetAWorkload
        VpcEndpointType: Interface
        VpcId: !Ref VPCA

  VPCAEC2MessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
        PrivateDnsEnabled: true
        SecurityGroupIds:
          - !Ref VPCAEndpointSecurityGroup
        ServiceName: !Sub "com.amazonaws.${AWS::Region}.ec2messages"
        SubnetIds:
          - !Ref SubnetAWorkload
        VpcEndpointType: Interface
        VpcId: !Ref VPCA

  VPCASSMMessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
        PrivateDnsEnabled: true
        SecurityGroupIds:
          - !Ref VPCAEndpointSecurityGroup
        ServiceName: !Sub "com.amazonaws.${AWS::Region}.ssmmessages"
        SubnetIds:
          - !Ref SubnetAWorkload
        VpcEndpointType: Interface
        VpcId: !Ref VPCA

  SpokeARole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "spoke-a-role-${AWS::StackName}"
      Path: "/"
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole

  SpokeAInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: "/"
      Roles:
        - !Ref SpokeARole

  SpokeASecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "ICMP acess from 10.0.0.0/8"
      GroupName: !Sub "spoke-a-sec-group-${AWS::StackName}"
      VpcId: !Ref VPCA
      SecurityGroupIngress:
        - IpProtocol: icmp
          CidrIp: 10.0.0.0/8
          Description: "Allow ICMP from private networks"
          FromPort: "-1"
          ToPort: "-1"

  SpokeAInstance:
    Type: 'AWS::EC2::Instance'
    Properties:
      ImageId: !Ref LatestAmiId
      SubnetId: !Ref SubnetAWorkload
      InstanceType: t2.micro
      SecurityGroupIds:
        - !Ref SpokeASecurityGroup
      IamInstanceProfile: !Ref SpokeAInstanceProfile
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      Tags:
        - Key: Name
          Value: !Sub "spoke-a-${AWS::StackName}"

