AWSTemplateFormatVersion: "2010-09-09"

Description: |
  This stack creates a SNS topic using KMS encryption and an SQS queue to subscribe to the SNS topic

Parameters:
  KmsKey:
    Description: The KMS key master ID
    Type: String

Resources:

  # A SNS topic
  Topic:
    Type: AWS::SNS::Topic
    Properties:
      KmsMasterKeyId: !Ref KmsKey

  # An SQS queue to subscribe to the SNS topic
  Queue:
    Type: AWS::SQS::Queue
    Properties: {}

  # A subscription to connect the SQS queue to the SNS topic
  Subscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref Topic
      Protocol: sqs
      Endpoint: !GetAtt Queue.Arn