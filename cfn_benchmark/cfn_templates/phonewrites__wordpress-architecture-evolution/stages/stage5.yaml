AWSTemplateFormatVersion: 2010-09-09
Description: >-
  WordPress architecture evolution - Stage 5 nested root stack
  ALB + ASG with RDS, EFS and optional Route 53 custom domain
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Stage 5 configuration
        Parameters:
          - LatestAmiId
      - Label:
          default: Optional custom domain
        Parameters:
          - HostedZoneName
          - HostedZoneId
          - CustomSubdomainName
    ParameterLabels:
      LatestAmiId:
        default: Amazon Linux 2023 AMI
      HostedZoneName:
        default: Route 53 hosted zone name
      HostedZoneId:
        default: Route 53 hosted zone ID
      CustomSubdomainName:
        default: WordPress subdomain

Parameters:
  LatestAmiId:
    Description: Latest Amazon Linux 2023 AMI for greenfield stage 5.
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.18-x86_64
  HostedZoneName:
    Description: Optional Route 53 hosted zone name, for example example.com. Leave blank to use the ALB DNS name.
    Type: String
    Default: ''
    AllowedPattern: '^$|^[A-Za-z0-9][A-Za-z0-9.-]*[A-Za-z0-9]$'
  HostedZoneId:
    Description: Optional Route 53 hosted zone ID for HostedZoneName, for example Z1234567890ABC. Required when using a custom domain.
    Type: String
    Default: ''
    AllowedPattern: '^$|^[A-Z0-9]+$'
  CustomSubdomainName:
    Description: Optional single DNS label for WordPress, for example wordpress. Leave blank to use the ALB DNS name.
    Type: String
    Default: ''
    AllowedPattern: '^$|^[A-Za-z0-9][A-Za-z0-9-]{0,62}$'

Rules:
  CustomDomainAllOrNone:
    Assertions:
      - Assert: !Or
          - !And
              - !Equals [!Ref HostedZoneName, '']
              - !Equals [!Ref HostedZoneId, '']
              - !Equals [!Ref CustomSubdomainName, '']
          - !And
              - !Not [!Equals [!Ref HostedZoneName, '']]
              - !Not [!Equals [!Ref HostedZoneId, '']]
              - !Not [!Equals [!Ref CustomSubdomainName, '']]
        AssertDescription: Enter HostedZoneName, HostedZoneId, and CustomSubdomainName together, or leave all three blank.

Resources:
  NetworkStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../nested/network.yaml

  IamStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../nested/iam.yaml

  DatabaseStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../nested/database.yaml
      Parameters:
        RootStackName: !Ref AWS::StackName
        VpcId: !GetAtt NetworkStack.Outputs.VpcId
        DbSubnetAId: !GetAtt NetworkStack.Outputs.DbSubnetAId
        DbSubnetBId: !GetAtt NetworkStack.Outputs.DbSubnetBId
        DbSubnetCId: !GetAtt NetworkStack.Outputs.DbSubnetCId

  ContentStorageStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../nested/content-storage.yaml
      Parameters:
        VpcId: !GetAtt NetworkStack.Outputs.VpcId
        AppSubnetAId: !GetAtt NetworkStack.Outputs.AppSubnetAId
        AppSubnetBId: !GetAtt NetworkStack.Outputs.AppSubnetBId
        AppSubnetCId: !GetAtt NetworkStack.Outputs.AppSubnetCId

  SharedSsmStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../nested/shared-ssm.yaml
      Parameters:
        DBEndpointValue: !GetAtt DatabaseStack.Outputs.DBEndpointAddress
        EFSfsidValue: !GetAtt ContentStorageStack.Outputs.EfsId

  AlbAsgStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: SharedSsmStack
    Properties:
      TemplateURL: ../nested/alb-asg.yaml
      Parameters:
        LatestAmiId: !Ref LatestAmiId
        VpcId: !GetAtt NetworkStack.Outputs.VpcId
        PublicSubnetAId: !GetAtt NetworkStack.Outputs.PublicSubnetAId
        PublicSubnetBId: !GetAtt NetworkStack.Outputs.PublicSubnetBId
        PublicSubnetCId: !GetAtt NetworkStack.Outputs.PublicSubnetCId
        InstanceProfileName: !GetAtt IamStack.Outputs.InstanceProfileName
        EfsId: !GetAtt ContentStorageStack.Outputs.EfsId
        HostedZoneName: !Ref HostedZoneName
        HostedZoneId: !Ref HostedZoneId
        CustomSubdomainName: !Ref CustomSubdomainName

Outputs:
  WordpressURL:
    Description: Open this URL to verify WordPress.
    Value: !GetAtt AlbAsgStack.Outputs.WordpressURL
  AlbDnsName:
    Value: !GetAtt AlbAsgStack.Outputs.AlbDnsName
  EfsId:
    Value: !GetAtt ContentStorageStack.Outputs.EfsId
  VpcId:
    Value: !GetAtt NetworkStack.Outputs.VpcId