AWSTemplateFormatVersion: '2010-09-09'
Description: 'MergeBetter SaaS - DynamoDB tables for installations and subscriptions'

Parameters:
  Environment:
    Type: String
    Default: 'prod'
    AllowedValues: ['dev', 'staging', 'prod']
    Description: Environment name

Resources:
  # Installations table
  InstallationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'mergebetter-installations-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: installationId
          AttributeType: N
        - AttributeName: accountId
          AttributeType: N
        - AttributeName: subscriptionStatus
          AttributeType: S
      KeySchema:
        - AttributeName: installationId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: account-index
          KeySchema:
            - AttributeName: accountId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: subscription-status-index
          KeySchema:
            - AttributeName: subscriptionStatus
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: MergeBetter
        - Key: Component
          Value: Database

  # Usage analytics table
  UsageAnalyticsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'mergebetter-usage-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: installationId
          AttributeType: N
        - AttributeName: date
          AttributeType: S
        - AttributeName: repositoryFullName
          AttributeType: S
      KeySchema:
        - AttributeName: installationId
          KeyType: HASH
        - AttributeName: date
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: repository-date-index
          KeySchema:
            - AttributeName: repositoryFullName
              KeyType: HASH
            - AttributeName: date
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: MergeBetter
        - Key: Component
          Value: Analytics

  # Webhook events table (for debugging and audit)
  WebhookEventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'mergebetter-webhook-events-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
        - AttributeName: installationId
          AttributeType: N
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: installation-timestamp-index
          KeySchema:
            - AttributeName: installationId
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: MergeBetter
        - Key: Component
          Value: Events

Outputs:
  InstallationsTableName:
    Description: Name of the installations table
    Value: !Ref InstallationsTable
    Export:
      Name: !Sub '${AWS::StackName}-InstallationsTable'

  InstallationsTableArn:
    Description: ARN of the installations table
    Value: !GetAtt InstallationsTable.Arn
    Export:
      Name: !Sub '${AWS::StackName}-InstallationsTableArn'

  UsageAnalyticsTableName:
    Description: Name of the usage analytics table
    Value: !Ref UsageAnalyticsTable
    Export:
      Name: !Sub '${AWS::StackName}-UsageAnalyticsTable'

  WebhookEventsTableName:
    Description: Name of the webhook events table
    Value: !Ref WebhookEventsTable
    Export:
      Name: !Sub '${AWS::StackName}-WebhookEventsTable'