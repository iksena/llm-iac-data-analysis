AWSTemplateFormatVersion: '2010-09-09'
Description: 'Self-contained test environment for ElastiCache Redis replication group with cluster mode, Multi-AZ, encryption, SNS topic, and IAM role for SSM Automation signals.'
Parameters:
  VpcCIDR:
    Type: String
    Default: 10.0.0.0/22
    Description: CIDR block for the VPC
  Subnet1CIDR:
    Type: String
    Default: 10.0.0.0/24
    Description: CIDR block for the first private subnet
  Subnet2CIDR:
    Type: String
    Default: 10.0.1.0/24
    Description: CIDR block for the second private subnet
  CacheNodeType:
    Type: String
    Default: cache.r5.large
    Description: ElastiCache node type
  EngineVersion:
    Type: String
    Default: '7.0'
    Description: Redis engine version
Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCIDR
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-vpc'
  Subnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref Subnet1CIDR
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-subnet1'
  Subnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref Subnet2CIDR
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-subnet2'
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for ElastiCache Redis
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          CidrIp: !Ref VpcCIDR
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-sg'
  ElastiCacheSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      Description: Subnet group for ElastiCache Redis
      SubnetIds:
        - !Ref Subnet1
        - !Ref Subnet2
  KMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Customer-managed KMS key for ElastiCache and SNS encryption
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'
          - Sid: Allow ElastiCache to use key
            Effect: Allow
            Principal:
              Service: elasticache.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey
            Resource: '*'
          - Sid: Allow SNS to use key
            Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey
            Resource: '*'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-kms'
  SNSTopic:
    Type: AWS::SNS::Topic
    Properties:
      KmsMasterKeyId: !Ref KMSKey
      TopicName: !Sub '${AWS::StackName}-alarm-topic'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-sns'
  SNSTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref SNSTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref SNSTopic
  IAMRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Path: /
      Policies:
        - PolicyName: SSMSendAutomationSignal
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ssm:SendAutomationSignal
                Resource: '*'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-iam-role'
  ReplicationGroup:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      Engine: redis
      EngineVersion: !Ref EngineVersion
      CacheNodeType: !Ref CacheNodeType
      ReplicationGroupDescription: Redis cluster with Multi-AZ and encryption
      NumNodeGroups: 2
      ReplicasPerNodeGroup: 1
      AutomaticFailoverEnabled: true
      MultiAZEnabled: true
      AtRestEncryptionEnabled: true
      TransitEncryptionEnabled: true
      KmsKeyId: !Ref KMSKey
      CacheSubnetGroupName: !Ref ElastiCacheSubnetGroup
      SecurityGroupIds:
        - !Ref SecurityGroup
      Port: 6379
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-redis'
Outputs:
  VpcId:
    Description: VPC ID
    Value: !Ref VPC
  Subnet1Id:
    Description: First private subnet ID
    Value: !Ref Subnet1
  Subnet2Id:
    Description: Second private subnet ID
    Value: !Ref Subnet2
  SecurityGroupId:
    Description: Security group ID
    Value: !Ref SecurityGroup
  ReplicationGroupId:
    Description: ElastiCache replication group ID
    Value: !Ref ReplicationGroup
  KMSKeyId:
    Description: KMS key ID
    Value: !Ref KMSKey
  SNSTopicArn:
    Description: SNS topic ARN
    Value: !Ref SNSTopic
  IAMRoleArn:
    Description: IAM role ARN
    Value: !GetAtt IAMRole.Arn