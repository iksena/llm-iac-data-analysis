AWSTemplateFormatVersion: "2010-09-09"
Description: "CloudFormation template for AppSync GraphQL API with DynamoDB"
Resources:
  AppSyncApi:
    Type: AWS::AppSync::GraphQLApi
    Properties:
      Name: SuperCoolAPI
      AuthenticationType: AWS_IAM
      LogConfig:
        CloudWatchLogsRoleArn: !GetAtt AppSyncLogsRole.Arn
        FieldLogLevel: ALL
      XrayEnabled: false
  AppSyncLogsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: appsync.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AppSyncLogsPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
  AppSyncSchema:
    Type: AWS::AppSync::GraphQLSchema
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      Definition: |
        type Todo {
          id: ID!
          description: String
        }
        type Query {
          getTodo(id: ID!): Todo
        }
        type Mutation {
          addTodo(id: ID!, description: String): Todo
        }
        schema {
          query: Query
          mutation: Mutation
        }
  DynamoDBTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Table1
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
  AppSyncDynamoDBRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: appsync.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AppSyncDynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: dynamodb:*
                Resource:
                  - !GetAtt DynamoDBTable.Arn
                  - !Sub "${DynamoDBTable.Arn}/index/*"
  AppSyncDataSource1:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      Name: DynamoDBDataSource1
      Type: AMAZON_DYNAMODB
      DynamoDBConfig:
        TableName: !Ref DynamoDBTable
        Region: !Ref "AWS::Region"
        AwsRegion: !Ref "AWS::Region"
        ServiceRoleArn: !GetAtt AppSyncDynamoDBRole.Arn
  AppSyncDataSource2:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      Name: DynamoDBDataSource2
      Type: AMAZON_DYNAMODB
      DynamoDBConfig:
        TableName: !Select [1, !Split ["/", !GetAtt DynamoDBTable.Arn]]
        Region: !Select [3, !Split [":", !GetAtt DynamoDBTable.Arn]]
        AwsRegion: !Select [3, !Split [":", !GetAtt DynamoDBTable.Arn]]
        ServiceRoleArn: !GetAtt AppSyncDynamoDBRole.Arn
  GetTodoResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      TypeName: Query
      FieldName: getTodo
      DataSourceName: !GetAtt AppSyncDataSource1.Name
      RequestMappingTemplate: |
        {
          "version": "2017-02-28",
          "operation": "GetItem",
          "key": {
            "id": $util.dynamodb.toDynamoDBJson($ctx.args.id)
          }
        }
      ResponseMappingTemplate: |
        $util.toJson($ctx.result)
  AddTodoResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      TypeName: Mutation
      FieldName: addTodo
      DataSourceName: !GetAtt AppSyncDataSource2.Name
      RequestMappingTemplate: |
        {
          "version": "2017-02-28",
          "operation": "PutItem",
          "key": {
            "id": $util.dynamodb.toDynamoDBJson($ctx.args.id)
          },
          "attributeValues": {
            "description": $util.dynamodb.toDynamoDBJson($ctx.args.description)
          }
        }
      ResponseMappingTemplate: |
        $util.toJson($ctx.result)
Outputs:
  GraphQLUrl:
    Description: "GraphQL API URL"
    Value: !GetAtt AppSyncApi.GraphQLUrl
  ApiId:
    Description: "AppSync API ID"
    Value: !GetAtt AppSyncApi.ApiId
  TableName:
    Description: "DynamoDB Table Name"
    Value: !Ref DynamoDBTable