AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFormation template for a serverless CRUD API for Kitten service using API Gateway, Lambda, and DynamoDB.'
Resources:
  KittenTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Kitten
      AttributeDefinitions:
        - AttributeName: KittenId
          AttributeType: S
      KeySchema:
        - AttributeName: KittenId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: KittenLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Scan
                Resource: !GetAtt KittenTable.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: arn:aws:logs:*:*:*
  LambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: KittenCrudFunction
      Runtime: python3.9
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref KittenTable
      Code:
        ZipFile: |
          import json
          import uuid
          import boto3
          import os
          from datetime import datetime

          dynamodb = boto3.resource('dynamodb')
          table = dynamodb.Table(os.environ['TABLE_NAME'])

          def lambda_handler(event, context):
              http_method = event['httpMethod']
              path = event['path']
              path_params = event.get('pathParameters') or {}
              body = json.loads(event.get('body') or '{}')
              
              headers = {
                  'Content-Type': 'application/json',
                  'Access-Control-Allow-Origin': '*',
                  'Access-Control-Allow-Methods': 'GET,POST,PUT,DELETE,OPTIONS',
                  'Access-Control-Allow-Headers': 'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'
              }
              
              try:
                  if http_method == 'OPTIONS':
                      return {
                          'statusCode': 200,
                          'headers': headers,
                          'body': ''
                      }
                  
                  if http_method == 'POST' and path == '/kitten':
                      kitten_id = str(uuid.uuid4())
                      name = body.get('name')
                      color = body.get('color')
                      if not name or not color:
                          return {
                              'statusCode': 400,
                              'headers': headers,
                              'body': json.dumps({'error': 'Missing name or color'})
                          }
                      item = {
                          'KittenId': kitten_id,
                          'name': name,
                          'color': color,
                          'createdAt': datetime.utcnow().isoformat()
                      }
                      table.put_item(Item=item)
                      return {
                          'statusCode': 201,
                          'headers': headers,
                          'body': json.dumps(item)
                      }
                  
                  elif http_method == 'GET' and path == '/kitten':
                      response = table.scan()
                      items = response.get('Items', [])
                      return {
                          'statusCode': 200,
                          'headers': headers,
                          'body': json.dumps(items)
                      }
                  
                  elif http_method == 'GET' and path.startswith('/kitten/'):
                      kitten_id = path_params.get('id')
                      if not kitten_id:
                          return {
                              'statusCode': 400,
                              'headers': headers,
                              'body': json.dumps({'error': 'Missing KittenId'})
                          }
                      response = table.get_item(Key={'KittenId': kitten_id})
                      if 'Item' not in response:
                          return {
                              'statusCode': 404,
                              'headers': headers,
                              'body': json.dumps({'error': 'Kitten not found'})
                          }
                      return {
                          'statusCode': 200,
                          'headers': headers,
                          'body': json.dumps(response['Item'])
                      }
                  
                  elif http_method == 'PUT' and path.startswith('/kitten/'):
                      kitten_id = path_params.get('id')
                      if not kitten_id:
                          return {
                              'statusCode': 400,
                              'headers': headers,
                              'body': json.dumps({'error': 'Missing KittenId'})
                          }
                      name = body.get('name')
                      color = body.get('color')
                      if not name or not color:
                          return {
                              'statusCode': 400,
                              'headers': headers,
                              'body': json.dumps({'error': 'Missing name or color'})
                          }
                      response = table.get_item(Key={'KittenId': kitten_id})
                      if 'Item' not in response:
                          return {
                              'statusCode': 404,
                              'headers': headers,
                              'body': json.dumps({'error': 'Kitten not found'})
                          }
                      table.update_item(
                          Key={'KittenId': kitten_id},
                          UpdateExpression='SET #name = :name, #color = :color',
                          ExpressionAttributeNames={'#name': 'name', '#color': 'color'},
                          ExpressionAttributeValues={':name': name, ':color': color}
                      )
                      updated_item = table.get_item(Key={'KittenId': kitten_id})['Item']
                      return {
                          'statusCode': 200,
                          'headers': headers,
                          'body': json.dumps(updated_item)
                      }
                  
                  elif http_method == 'DELETE' and path.startswith('/kitten/'):
                      kitten_id = path_params.get('id')
                      if not kitten_id:
                          return {
                              'statusCode': 400,
                              'headers': headers,
                              'body': json.dumps({'error': 'Missing KittenId'})
                          }
                      response = table.get_item(Key={'KittenId': kitten_id})
                      if 'Item' not in response:
                          return {
                              'statusCode': 404,
                              'headers': headers,
                              'body': json.dumps({'error': 'Kitten not found'})
                          }
                      table.delete_item(Key={'KittenId': kitten_id})
                      return {
                          'statusCode': 200,
                          'headers': headers,
                          'body': json.dumps({'message': 'Kitten deleted'})
                      }
                  
                  else:
                      return {
                          'statusCode': 400,
                          'headers': headers,
                          'body': json.dumps({'error': 'Unsupported operation'})
                      }
              
              except Exception as e:
                  return {
                      'statusCode': 500,
                      'headers': headers,
                      'body': json.dumps({'error': str(e)})
                  }
  ApiGatewayRestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: KittenApi
      Description: API for CRUD operations on Kittens
      EndpointConfiguration:
        Types:
          - REGIONAL
  ApiGatewayResourceKitten:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      ParentId: !GetAtt ApiGatewayRestApi.RootResourceId
      PathPart: kitten
  ApiGatewayResourceKittenId:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      ParentId: !Ref ApiGatewayResourceKitten
      PathPart: '{id}'
  ApiGatewayMethodKittenOptions:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      ResourceId: !Ref ApiGatewayResourceKitten
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaFunction.Arn}/invocations'
  ApiGatewayMethodKittenPost:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      ResourceId: !Ref ApiGatewayResourceKitten
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaFunction.Arn}/invocations'
  ApiGatewayMethodKittenGet:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      ResourceId: !Ref ApiGatewayResourceKitten
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaFunction.Arn}/invocations'
  ApiGatewayMethodKittenIdOptions:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      ResourceId: !Ref ApiGatewayResourceKittenId
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaFunction.Arn}/invocations'
  ApiGatewayMethodKittenIdGet:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      ResourceId: !Ref ApiGatewayResourceKittenId
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaFunction.Arn}/invocations'
  ApiGatewayMethodKittenIdPut:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      ResourceId: !Ref ApiGatewayResourceKittenId
      HttpMethod: PUT
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaFunction.Arn}/invocations'
  ApiGatewayMethodKittenIdDelete:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      ResourceId: !Ref ApiGatewayResourceKittenId
      HttpMethod: DELETE
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaFunction.Arn}/invocations'
  ApiGatewayDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - ApiGatewayMethodKittenOptions
      - ApiGatewayMethodKittenPost
      - ApiGatewayMethodKittenGet
      - ApiGatewayMethodKittenIdOptions
      - ApiGatewayMethodKittenIdGet
      - ApiGatewayMethodKittenIdPut
      - ApiGatewayMethodKittenIdDelete
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      StageName: Prod
  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LambdaFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGatewayRestApi}/*/*/*'
Outputs:
  ApiUrl:
    Description: 'URL of the Kitten API'
    Value: !Sub 'https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/'
  KittenTableName:
    Description: 'Name of the DynamoDB table'
    Value: !Ref KittenTable