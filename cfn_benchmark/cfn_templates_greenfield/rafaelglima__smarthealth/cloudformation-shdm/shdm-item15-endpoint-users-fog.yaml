Description: Gateway Endpoint para as Camadas de Usuarios e Nevoa

Resources:
  # Camada de Usuarios (User Layer) - VPC criada internamente
  UserVPC:
    Type: 'AWS::EC2::VPC'
    Properties:
      CidrBlock: '172.31.0.0/16'
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: 'user-layer-vpc'

  UserSubnet:
    Type: 'AWS::EC2::Subnet'
    Properties:
      VpcId: !Ref UserVPC
      CidrBlock: '172.31.0.0/24'
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: 'user-layer-subnet'

  UserRouteTable:
    Type: 'AWS::EC2::RouteTable'
    Properties:
      VpcId: !Ref UserVPC
      Tags:
        - Key: Name
          Value: 'user-layer-route-table'

  UserRouteTableAssociation:
    Type: 'AWS::EC2::SubnetRouteTableAssociation'
    Properties:
      SubnetId: !Ref UserSubnet
      RouteTableId: !Ref UserRouteTable

  # Camada de Nevoa (Fog Layer) - VPC criada internamente
  FogVPC:
    Type: 'AWS::EC2::VPC'
    Properties:
      CidrBlock: '10.0.0.0/16'
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: 'fog-layer-vpc'

  FogPrivateSubnet:
    Type: 'AWS::EC2::Subnet'
    Properties:
      VpcId: !Ref FogVPC
      CidrBlock: '10.0.1.0/24'
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: 'fog-layer-private-subnet'

  FogPrivateRouteTable:
    Type: 'AWS::EC2::RouteTable'
    Properties:
      VpcId: !Ref FogVPC
      Tags:
        - Key: Name
          Value: 'fog-layer-private-route-table'

  FogPrivateRouteTableAssociation:
    Type: 'AWS::EC2::SubnetRouteTableAssociation'
    Properties:
      SubnetId: !Ref FogPrivateSubnet
      RouteTableId: !Ref FogPrivateRouteTable

  S3GatewayEndpointUsers:
    Type: 'AWS::EC2::VPCEndpoint'
    Properties:
      VpcEndpointType: 'Gateway'
      #vpc padrao da camada de usuarios, criada neste template
      VpcId: !Ref UserVPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal: '*'
            Action:
              - 's3:*'
            Resource:
              - "*"
      RouteTableIds:
      #tabela de rotas da vpc de usuarios, criada neste template
        - !Ref UserRouteTable

  S3GatewayEndpointUsers2:
    Type: 'AWS::EC2::VPCEndpoint'
    Properties:
      VpcEndpointType: 'Gateway'
      VpcId: !Ref UserVPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal: '*'
            Action:
              - 's3:*'
            Resource:
              - "*"
      RouteTableIds:
        - !Ref UserRouteTable

  S3GatewayEndpointFog:
    Type: 'AWS::EC2::VPCEndpoint'
    Properties:
      VpcEndpointType: 'Gateway'
      VpcId: !Ref FogVPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal: '*'
            Action:
              - 's3:*'
            Resource:
              - "*"
      RouteTableIds:
        - !Ref FogPrivateRouteTable

  SecretsManagerGatewayEndpointFog:
    Type: 'AWS::EC2::VPCEndpoint'
    Properties:
      VpcEndpointType: 'Interface'
      VpcId: !Ref FogVPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.secretsmanager'
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal: '*'
            Action:
              - 'secretsmanager:*'
            Resource:
              - "*"

  KmsGatewayEndpointUsers:
    Type: 'AWS::EC2::VPCEndpoint'
    Properties:
      VpcEndpointType: 'Interface'
      #vpc padrao da camada de usuarios, criada neste template
      VpcId: !Ref UserVPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.kms'
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal: '*'
            Action:
              - 'kms:GenerateDataKey'
            Resource:
              - "*"

  KmsGatewayEndpointFog:
    Type: 'AWS::EC2::VPCEndpoint'
    Properties:
      VpcEndpointType: 'Interface'
      VpcId: !Ref FogVPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.kms'
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal: '*'
            Action:
              - 'kms:GenerateDataKey'
              - 'kafka:ListScramSecrets'
            Resource:
              - "*"

  EventsGatewayEndpointFog:
    Type: 'AWS::EC2::VPCEndpoint'
    Properties:
      VpcEndpointType: 'Interface'
      VpcId: !Ref FogVPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.events'
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal: '*'
            Action:
              - 'events:*'
              - 'pipes:*'
            Resource:
              - "*"

  StsGatewayEndpointFog:
    Type: 'AWS::EC2::VPCEndpoint'
    Properties:
      VpcEndpointType: 'Interface'
      VpcId: !Ref FogVPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.sts'
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal: '*'
            Action:
              - '*'
            Resource:
              - "*"
  LambdaGatewayEndpointFog:
    Type: 'AWS::EC2::VPCEndpoint'
    Properties:
      VpcEndpointType: 'Interface'
      VpcId: !Ref FogVPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.lambda'
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal: '*'
            Action:
              - '*'
            Resource:
              - "*"
