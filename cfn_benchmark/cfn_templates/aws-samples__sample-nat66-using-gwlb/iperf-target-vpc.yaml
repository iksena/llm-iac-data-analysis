AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Standalone IPv6 iperf3 load test target. Own VPC with IGW and public GUA.
  NOT connected to any TGW - reached from client via public IPv6 internet,
  so load traverses the NAT66 appliance path end-to-end.

Parameters:
  InstanceType:
    Type: String
    Default: c6in.large
    AllowedValues: [t3.medium, c6i.large, c6in.large, c6in.xlarge]
  LatestAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  AllowedSourceIpv6:
    Type: String
    Default: ::/0
    Description: >-
      IPv6 CIDR allowed to reach the iperf3 target on TCP/UDP 5201-5205.
      Defaults to ::/0 for POC convenience. For tighter security, set this
      to the SNAT egress prefix of your NAT66 appliance (e.g. the inspection
      VPC IPv6 /56 or appliance ENI's /64).

Resources:
  IperfVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.50.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Name, Value: iperf-target-vpc}]

  IperfVpcV6:
    Type: AWS::EC2::VPCCidrBlock
    Properties:
      VpcId: !Ref IperfVpc
      AmazonProvidedIpv6CidrBlock: true

  IperfIgw:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{Key: Name, Value: iperf-igw}]

  IperfIgwAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref IperfVpc
      InternetGatewayId: !Ref IperfIgw

  IperfSubnet:
    Type: AWS::EC2::Subnet
    DependsOn: IperfVpcV6
    Properties:
      VpcId: !Ref IperfVpc
      CidrBlock: 10.50.1.0/24
      Ipv6CidrBlock: !Select [0, !Cidr [!Select [0, !GetAtt IperfVpc.Ipv6CidrBlocks], 1, 64]]
      AvailabilityZone: !Select [0, !GetAZs '']
      AssignIpv6AddressOnCreation: true
      MapPublicIpOnLaunch: true
      Tags: [{Key: Name, Value: iperf-subnet}]

  IperfRt:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref IperfVpc
      Tags: [{Key: Name, Value: iperf-rt}]

  IperfRtAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref IperfSubnet
      RouteTableId: !Ref IperfRt

  IperfRtV4Default:
    Type: AWS::EC2::Route
    DependsOn: IperfIgwAttach
    Properties:
      RouteTableId: !Ref IperfRt
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref IperfIgw

  IperfRtV6Default:
    Type: AWS::EC2::Route
    DependsOn: IperfIgwAttach
    Properties:
      RouteTableId: !Ref IperfRt
      DestinationIpv6CidrBlock: ::/0
      GatewayId: !Ref IperfIgw

  IperfSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: iperf3 target SG - IPv6 inbound on ports 5201-5205
      VpcId: !Ref IperfVpc
      # Ingress: restricted via AllowedSourceIpv6 parameter (default ::/0 for POC).
      # For production, set parameter to the SNAT egress prefix of your NAT66 appliance.
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5201
          ToPort: 5205
          CidrIpv6: !Ref AllowedSourceIpv6
          Description: iperf3 TCP test ports
        - IpProtocol: udp
          FromPort: 5201
          ToPort: 5205
          CidrIpv6: !Ref AllowedSourceIpv6
          Description: iperf3 UDP test ports
        - IpProtocol: icmpv6
          FromPort: -1
          ToPort: -1
          CidrIpv6: !Ref AllowedSourceIpv6
          Description: ICMPv6 (ping, PMTUD, ND)
      # Egress: restricted to TCP 443 (SSM, dnf repo, AWS APIs) + DNS.
      # iperf3 reply traffic to test clients is automatically permitted by SG
      # statefulness (replies to inbound 5201-5205 flows).
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS for SSM, dnf, AWS APIs
        - IpProtocol: udp
          FromPort: 53
          ToPort: 53
          CidrIp: 0.0.0.0/0
          Description: DNS (IPv4)
        - IpProtocol: tcp
          FromPort: 53
          ToPort: 53
          CidrIp: 0.0.0.0/0
          Description: DNS over TCP (IPv4)
      Tags: [{Key: Name, Value: iperf-sg}]

  IperfRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  IperfInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref IperfRole]

  IperfEc2:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmi
      InstanceType: !Ref InstanceType
      SubnetId: !Ref IperfSubnet
      SecurityGroupIds: [!Ref IperfSg]
      IamInstanceProfile: !Ref IperfInstanceProfile
      Ipv6AddressCount: 1
      Tags: [{Key: Name, Value: iperf-target}]
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euxo pipefail
          exec > >(tee /var/log/iperf-setup.log) 2>&1
          dnf install -y iperf3 tcpdump bind-utils
          for P in 5201 5202 5203 5204 5205; do
            cat > /etc/systemd/system/iperf3-$P.service <<SVC
          [Unit]
          Description=iperf3 server on port $P
          After=network-online.target
          [Service]
          Type=simple
          ExecStart=/usr/bin/iperf3 -s -p $P
          Restart=always
          RestartSec=2
          [Install]
          WantedBy=multi-user.target
          SVC
            systemctl daemon-reload
            systemctl enable --now iperf3-$P.service
          done
          IPV6=$(ip -6 addr show ens5 scope global | awk '/inet6/ {print $2}' | cut -d/ -f1 | head -1)
          echo "iperf3 target ready $(date). Ports 5201-5205. IPv6: $IPV6" > /var/run/iperf-ready

Outputs:
  IperfInstanceId:
    Value: !Ref IperfEc2
    Description: Get IPv6 after deploy with-- aws ec2 describe-instances --instance-ids <ID> --query 'Reservations[].Instances[].Ipv6Address'
  IperfVpcId:
    Value: !Ref IperfVpc
  SsmConnectIperf:
    Value: !Sub 'aws ssm start-session --region ${AWS::Region} --target ${IperfEc2}'
  GetIperfIpv6:
    Value: !Sub 'aws ec2 describe-instances --region ${AWS::Region} --instance-ids ${IperfEc2} --query "Reservations[].Instances[].Ipv6Address" --output text'