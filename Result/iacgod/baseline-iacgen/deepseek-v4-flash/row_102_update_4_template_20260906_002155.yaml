AWSTemplateFormatVersion: "2010-09-09"
Description: "CDK Bootstrap Environment - Creates encrypted S3 bucket, immutable ECR repository, KMS key, IAM roles, and SSM parameter for CDK application deployment"

Parameters:
  Qualifier:
    Type: String
    Description: "Short qualifier string to uniquely identify stack components in the same AWS account and region"
    Default: "cdk-toolkit"
    AllowedPattern: "^[a-z0-9-]{1,32}$"
    ConstraintDescription: "Must be alphanumeric lowercase with hyphens, max 32 characters"

  BootstrapVersion:
    Type: String
    Description: "Version of the bootstrap stack to track in SSM parameter"
    Default: "1"

  FileAssetsBucketName:
    Type: String
    Description: "Optional custom name for the file assets S3 bucket. If not provided, a name will be auto-generated"
    Default: ""
    AllowedPattern: "^$|^[a-z0-9.-]{3,63}$"
    ConstraintDescription: "Must be a valid S3 bucket name or empty"

  KmsKeyAlias:
    Type: String
    Description: "Alias for the KMS key used for bucket encryption"
    Default: "cdk-bootstrap"
    AllowedPattern: "^[a-zA-Z0-9/_+=,.@-]{1,256}$"
    ConstraintDescription: "Must be a valid KMS alias"

  ExistingKmsKeyId:
    Type: String
    Description: "Optional existing KMS key ID, ARN, or alias to use for S3 bucket encryption"
    Default: ""
    AllowedPattern: "^$|^[a-f0-9-]{36,}|^arn:aws:kms:[a-z0-9-]+:[0-9]{12}:key/[a-f0-9-]{36,}|^arn:aws:kms:[a-z0-9-]+:[0-9]{12}:alias/[a-zA-Z0-9/_+=,.@-]+|^alias/[a-zA-Z0-9/_+=,.@-]+$"
    ConstraintDescription: "Must be a valid KMS key identifier or empty"

  TrustedAccounts:
    Type: CommaDelimitedList
    Description: "List of trusted AWS account IDs that can assume the created IAM roles"
    Default: ""

  FilePublishingManagedPolicyArns:
    Type: CommaDelimitedList
    Description: "Optional managed policy ARNs to attach to the file publishing role"
    Default: ""

  ImagePublishingManagedPolicyArns:
    Type: CommaDelimitedList
    Description: "Optional managed policy ARNs to attach to the image publishing role"
    Default: ""

  AccountLookupManagedPolicyArns:
    Type: CommaDelimitedList
    Description: "Optional managed policy ARNs to attach to the account lookup role"
    Default: ""

  DeploymentActionManagedPolicyArns:
    Type: CommaDelimitedList
    Description: "Optional managed policy ARNs to attach to the deployment action role"
    Default: ""

  CloudFormationExecutionManagedPolicyArns:
    Type: CommaDelimitedList
    Description: "Optional managed policy ARNs to attach to the CloudFormation execution role"
    Default: ""

Conditions:
  UseExistingKmsKey: !Not [!Equals [!Ref ExistingKmsKeyId, ""]]
  CreateKmsKey: !Equals [!Ref ExistingKmsKeyId, ""]
  CreateCustomBucket: !Not [!Equals [!Ref FileAssetsBucketName, ""]]
  HasTrustedAccounts: !Not [!Equals [!Join ["", !Ref TrustedAccounts], ""]]
  AttachFilePublishingPolicies: !Not [!Equals [!Join ["", !Ref FilePublishingManagedPolicyArns], ""]]
  AttachImagePublishingPolicies: !Not [!Equals [!Join ["", !Ref ImagePublishingManagedPolicyArns], ""]]
  AttachAccountLookupPolicies: !Not [!Equals [!Join ["", !Ref AccountLookupManagedPolicyArns], ""]]
  AttachDeploymentActionPolicies: !Not [!Equals [!Join ["", !Ref DeploymentActionManagedPolicyArns], ""]]
  AttachCloudFormationExecutionPolicies: !Not [!Equals [!Join ["", !Ref CloudFormationExecutionManagedPolicyArns], ""]]

Resources:
  KmsKey:
    Type: AWS::KMS::Key
    Condition: CreateKmsKey
    Properties:
      KeyUsage: ENCRYPT_DECRYPT
      KeySpec: SYMMETRIC_DEFAULT
      Description: !Sub "KMS key for CDK bootstrap environment - ${Qualifier}"
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action:
              - kms:*
            Resource: "*"
      Tags:
        - Key: "cdk-bootstrap"
          Value: !Ref Qualifier

  KmsAlias:
    Type: AWS::KMS::Alias
    Condition: CreateKmsKey
    Properties:
      AliasName: !Sub "alias/${KmsKeyAlias}"
      TargetKeyId: !Ref KmsKey

  FileAssetsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !If
        - CreateCustomBucket
        - !Ref FileAssetsBucketName
        - !Sub "${Qualifier}-assets-${AWS::AccountId}-${AWS::Region}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !If
                - UseExistingKmsKey
                - !Ref ExistingKmsKeyId
                - !Ref KmsKey
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUpload
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: "cdk-bootstrap"
          Value: !Ref Qualifier

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FileAssetsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "DenyInsecureConnections"
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !Sub "${FileAssetsBucket.Arn}/*"
              - !GetAtt FileAssetsBucket.Arn
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  EcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${Qualifier}-container-assets"
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire untagged images older than 14 days",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 14
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }
      Tags:
        - Key: "cdk-bootstrap"
          Value: !Ref Qualifier

  BootstrapVersionParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/cdk-bootstrap/${Qualifier}/version"
      Type: String
      Value: !Ref BootstrapVersion
      Description: !Sub "CDK bootstrap version for qualifier ${Qualifier}"
      Tags:
        "cdk-bootstrap": !Ref Qualifier

  FilePublishingRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Qualifier}-file-publishing-role-${AWS::AccountId}-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: sts:AssumeRole
          - !If
            - HasTrustedAccounts
            - Effect: Allow
              Principal:
                AWS: !Ref TrustedAccounts
              Action: sts:AssumeRole
            - !Ref "AWS::NoValue"
      Path: "/"
      Policies:
        - PolicyName: !Sub "${Qualifier}-file-publishing-policy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:PutObjectAcl
                  - s3:GetObject
                  - s3:GetObjectAcl
                  - s3:GetObjectTagging
                  - s3:PutObjectTagging
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - !GetAtt FileAssetsBucket.Arn
                  - !Sub "${FileAssetsBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - kms:Encrypt
                  - kms:Decrypt
                  - kms:ReEncrypt*
                  - kms:GenerateDataKey*
                  - kms:DescribeKey
                Resource: !If
                  - UseExistingKmsKey
                  - !Sub "arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/${ExistingKmsKeyId}"
                  - !GetAtt KmsKey.Arn
      ManagedPolicyArns: !If
        - AttachFilePublishingPolicies
        - !Ref FilePublishingManagedPolicyArns
        - !Ref "AWS::NoValue"
      Tags:
        - Key: "cdk-bootstrap"
          Value: !Ref Qualifier

  ImagePublishingRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Qualifier}-image-publishing-role-${AWS::AccountId}-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: sts:AssumeRole
          - !If
            - HasTrustedAccounts
            - Effect: Allow
              Principal:
                AWS: !Ref TrustedAccounts
              Action: sts:AssumeRole
            - !Ref "AWS::NoValue"
      Path: "/"
      Policies:
        - PolicyName: !Sub "${Qualifier}-image-publishing-policy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:DescribeRepositories
                  - ecr:DescribeImages
                Resource: "*"
      ManagedPolicyArns: !If
        - AttachImagePublishingPolicies
        - !Ref ImagePublishingManagedPolicyArns
        - !Ref "AWS::NoValue"
      Tags:
        - Key: "cdk-bootstrap"
          Value: !Ref Qualifier

  AccountLookupRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Qualifier}-lookup-role-${AWS::AccountId}-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: sts:AssumeRole
          - !If
            - HasTrustedAccounts
            - Effect: Allow
              Principal:
                AWS: !Ref TrustedAccounts
              Action: sts:AssumeRole
            - !Ref "AWS::NoValue"
      Path: "/"
      Policies:
        - PolicyName: !Sub "${Qualifier}-lookup-policy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeAvailabilityZones
                  - ec2:DescribeRegions
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:DescribeParameters
                  - sts:GetCallerIdentity
                Resource: "*"
      ManagedPolicyArns: !If
        - AttachAccountLookupPolicies
        - !Ref AccountLookupManagedPolicyArns
        - !Ref "AWS::NoValue"
      Tags:
        - Key: "cdk-bootstrap"
          Value: !Ref Qualifier

  DeploymentActionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Qualifier}-deploy-role-${AWS::AccountId}-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: sts:AssumeRole
          - !If
            - HasTrustedAccounts
            - Effect: Allow
              Principal:
                AWS: !Ref TrustedAccounts
              Action: sts:AssumeRole
            - !Ref "AWS::NoValue"
      Path: "/"
      Policies:
        - PolicyName: !Sub "${Qualifier}-deploy-policy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:ValidateTemplate
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DeleteChangeSet
                  - cloudformation:ListChangeSets
                  - cloudformation:DescribeChangeSet
                  - cloudformation:GetTemplateSummary
                  - iam:PassRole
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:BatchCheckLayerAvailability
                  - ecr:DescribeRepositories
                  - ecr:DescribeImages
                Resource: "*"
      ManagedPolicyArns: !If
        - AttachDeploymentActionPolicies
        - !Ref DeploymentActionManagedPolicyArns
        - !Ref "AWS::NoValue"
      Tags:
        - Key: "cdk-bootstrap"
          Value: !Ref Qualifier

  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Qualifier}-cf-exec-role-${AWS::AccountId}-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: sts:AssumeRole
          - !If
            - HasTrustedAccounts
            - Effect: Allow
              Principal:
                AWS: !Ref TrustedAccounts
              Action: sts:AssumeRole
            - !Ref "AWS::NoValue"
      Path: "/"
      Policies:
        - PolicyName: !Sub "${Qualifier}-cf-exec-policy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: "*"
                Resource: "*"
      ManagedPolicyArns: !If
        - AttachCloudFormationExecutionPolicies
        - !Ref CloudFormationExecutionManagedPolicyArns
        - !Ref "AWS::NoValue"
      Tags:
        - Key: "cdk-bootstrap"
          Value: !Ref Qualifier

Outputs:
  FileAssetsBucketName:
    Description: "Name of the S3 bucket for file assets"
    Value: !Ref FileAssetsBucket

  FileAssetsBucketArn:
    Description: "ARN of the S3 bucket for file assets"
    Value: !GetAtt FileAssetsBucket.Arn

  EcrRepositoryName:
    Description: "Name of the ECR repository for container assets"
    Value: !Ref EcrRepository

  EcrRepositoryUri:
    Description: "URI of the ECR repository for container assets"
    Value: !GetAtt EcrRepository.RepositoryUri

  KmsKeyArn:
    Description: "ARN of the KMS key used for bucket encryption"
    Value: !If
      - UseExistingKmsKey
      - !Sub "arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/${ExistingKmsKeyId}"
      - !GetAtt KmsKey.Arn

  BootstrapVersionParameter:
    Description: "SSM parameter storing the bootstrap version"
    Value: !Ref BootstrapVersionParam

  FilePublishingRoleArn:
    Description: "ARN of the IAM role for file publishing"
    Value: !GetAtt FilePublishingRole.Arn

  ImagePublishingRoleArn:
    Description: "ARN of the IAM role for image publishing"
    Value: !GetAtt ImagePublishingRole.Arn

  AccountLookupRoleArn:
    Description: "ARN of the IAM role for account lookup"
    Value: !GetAtt AccountLookupRole.Arn

  DeploymentActionRoleArn:
    Description: "ARN of the IAM role for deployment actions"
    Value: !GetAtt DeploymentActionRole.Arn

  CloudFormationExecutionRoleArn:
    Description: "ARN of the IAM role for CloudFormation execution"
    Value: !GetAtt CloudFormationExecutionRole.Arn