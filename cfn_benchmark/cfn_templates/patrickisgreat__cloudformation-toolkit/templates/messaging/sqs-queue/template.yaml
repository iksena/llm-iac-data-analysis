AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  SQS queue with encryption, long polling, and a dead-letter queue wired to a
  redrive policy. Optionally FIFO.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Naming
        Parameters:
          - NamePrefix
          - Environment
          - QueueSuffix
          - FifoQueue
          - ContentBasedDeduplication
      - Label:
          default: Delivery semantics
        Parameters:
          - VisibilityTimeoutSeconds
          - MessageRetentionSeconds
          - ReceiveMessageWaitTimeSeconds
          - DelaySeconds
      - Label:
          default: Dead-letter queue
        Parameters:
          - MaxReceiveCount
          - DeadLetterRetentionSeconds
      - Label:
          default: Encryption
        Parameters:
          - KmsKeyArn

Parameters:
  NamePrefix:
    Type: String
    Description: Prefix for the queue names.
    AllowedPattern: "^[a-z][a-z0-9-]{1,30}[a-z0-9]$"
    ConstraintDescription: 3-32 lowercase characters, digits and hyphens.

  Environment:
    Type: String
    Description: Environment this queue belongs to.
    Default: dev
    AllowedValues: [dev, staging, prod]

  QueueSuffix:
    Type: String
    Description: What this queue carries, e.g. "orders" or "thumbnails".
    Default: events
    AllowedPattern: "^[a-z0-9][a-z0-9-]{0,40}$"

  FifoQueue:
    Type: String
    Description: >-
      Exactly-once, strictly ordered delivery within a message group, at the cost
      of throughput and of every producer having to supply a group ID. Standard
      queues are at-least-once and unordered, which most consumers should be
      built for anyway.
    Default: "false"
    AllowedValues: ["true", "false"]

  ContentBasedDeduplication:
    Type: String
    Description: >-
      For FIFO queues, derive the deduplication ID from a hash of the body
      instead of requiring producers to send one. Ignored for standard queues.
    Default: "true"
    AllowedValues: ["true", "false"]

  VisibilityTimeoutSeconds:
    Type: Number
    Description: >-
      How long a received message stays invisible to other consumers. Set it
      above your worst-case processing time: if processing outlives the timeout,
      a second consumer picks up the same message and you get duplicate work that
      looks like a bug in the producer.
    Default: 30
    MinValue: 0
    MaxValue: 43200

  MessageRetentionSeconds:
    Type: Number
    Description: >-
      How long an unconsumed message survives. The 4-day default is short enough
      that a weekend outage silently drops messages; 14 days is the maximum.
    Default: 345600
    MinValue: 60
    MaxValue: 1209600

  ReceiveMessageWaitTimeSeconds:
    Type: Number
    Description: >-
      Long-poll wait. 20 is the maximum and the right answer almost always: short
      polling bills a request per empty receive, so an idle consumer at 0 costs
      real money to receive nothing.
    Default: 20
    MinValue: 0
    MaxValue: 20

  DelaySeconds:
    Type: Number
    Description: Delay before a message becomes visible.
    Default: 0
    MinValue: 0
    MaxValue: 900

  MaxReceiveCount:
    Type: Number
    Description: >-
      Failed deliveries before a message moves to the dead-letter queue. Too high
      and a poison message is retried for hours while blocking a FIFO group; too
      low and a transient failure loses the message to the DLQ.
    Default: 5
    MinValue: 1
    MaxValue: 1000

  DeadLetterRetentionSeconds:
    Type: Number
    Description: >-
      Retention on the dead-letter queue. Longer than the main queue on purpose -
      the DLQ is what you inspect after the incident, and 14 days is the maximum.
    Default: 1209600
    MinValue: 60
    MaxValue: 1209600

  KmsKeyArn:
    Type: String
    Description: >-
      Customer-managed KMS key. Leave empty to use SQS-managed encryption, which
      is free and requires no key policy. A CMK is needed for cross-account
      consumers.
    Default: ""

Conditions:
  IsFifo: !Equals [!Ref FifoQueue, "true"]
  UsesKms: !Not [!Equals [!Ref KmsKeyArn, ""]]

Resources:
  DeadLetterQueue:
    Type: AWS::SQS::Queue
    # A DLQ holds the messages that failed. Deleting it during a rollback throws
    # away the evidence of whatever went wrong.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      # FIFO queues must have a .fifo suffix and a FIFO DLQ; mismatching them is
      # rejected with a message that does not mention the suffix.
      QueueName: !If
        - IsFifo
        - !Sub "${NamePrefix}-${Environment}-${QueueSuffix}-dlq.fifo"
        - !Sub "${NamePrefix}-${Environment}-${QueueSuffix}-dlq"
      FifoQueue: !If [IsFifo, true, !Ref "AWS::NoValue"]
      MessageRetentionPeriod: !Ref DeadLetterRetentionSeconds
      SqsManagedSseEnabled: !If [UsesKms, !Ref "AWS::NoValue", true]
      KmsMasterKeyId: !If [UsesKms, !Ref KmsKeyArn, !Ref "AWS::NoValue"]

  Queue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      QueueName: !If
        - IsFifo
        - !Sub "${NamePrefix}-${Environment}-${QueueSuffix}.fifo"
        - !Sub "${NamePrefix}-${Environment}-${QueueSuffix}"
      FifoQueue: !If [IsFifo, true, !Ref "AWS::NoValue"]
      ContentBasedDeduplication: !If [IsFifo, !Ref ContentBasedDeduplication, !Ref "AWS::NoValue"]
      VisibilityTimeout: !Ref VisibilityTimeoutSeconds
      MessageRetentionPeriod: !Ref MessageRetentionSeconds
      ReceiveMessageWaitTimeSeconds: !Ref ReceiveMessageWaitTimeSeconds
      DelaySeconds: !Ref DelaySeconds
      # SqsManagedSseEnabled and KmsMasterKeyId conflict in the API: setting the
      # first to false alongside a key still errors, because the check fires on
      # the argument being present at all. Hence AWS::NoValue rather than false.
      SqsManagedSseEnabled: !If [UsesKms, !Ref "AWS::NoValue", true]
      KmsMasterKeyId: !If [UsesKms, !Ref KmsKeyArn, !Ref "AWS::NoValue"]
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: !Ref MaxReceiveCount

Outputs:
  QueueUrl:
    Description: Queue URL, which is what the SDK send/receive calls take.
    Value: !Ref Queue

  QueueArn:
    Description: Queue ARN, for IAM policies and event source mappings.
    Value: !GetAtt Queue.Arn

  QueueName:
    Description: Queue name, for CloudWatch alarm dimensions.
    Value: !GetAtt Queue.QueueName

  DeadLetterQueueUrl:
    Description: Dead-letter queue URL, for redriving messages after a fix.
    Value: !Ref DeadLetterQueue

  DeadLetterQueueArn:
    Description: Dead-letter queue ARN.
    Value: !GetAtt DeadLetterQueue.Arn

  DeadLetterQueueName:
    Description: >-
      Dead-letter queue name. Alarm on its ApproximateNumberOfMessagesVisible -
      a non-zero DLQ is the single most useful signal a queue-backed system has.
    Value: !GetAtt DeadLetterQueue.QueueName