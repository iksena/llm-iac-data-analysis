AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: |
  DVA-C02 Lab 2.3 — LSI vs GSI

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    LoggingConfig:
      LogFormat: JSON

Resources:
  TasksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: dva-lab-02-03-tasks
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: task_id
          AttributeType: S
        - AttributeName: due_date
          AttributeType: S
        - AttributeName: status
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: task_id
          KeyType: RANGE
      LocalSecondaryIndexes:
        # Same PK as base, different sort key
        - IndexName: LSI_DueDate
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
            - AttributeName: due_date
              KeyType: RANGE
          Projection:
            ProjectionType: ALL    # KEYS_ONLY | INCLUDE | ALL
      GlobalSecondaryIndexes:
        # Different PK -- can query across users
        - IndexName: GSI_Status
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: due_date
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  SeedFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dva-lab-02-03-seed
      CodeUri: src/
      Handler: seed.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref TasksTable
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref TasksTable

  QueryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dva-lab-02-03-query
      CodeUri: src/
      Handler: query.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref TasksTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TasksTable

Outputs:
  TableName:
    Value: !Ref TasksTable
  SeedFunctionName:
    Value: !Ref SeedFunction
  QueryFunctionName:
    Value: !Ref QueryFunction