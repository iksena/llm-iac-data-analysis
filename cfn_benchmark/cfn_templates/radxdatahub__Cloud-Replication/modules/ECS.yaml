    ECSTaskRole:
        Type: "AWS::IAM::Role"
        Properties:
            RoleName: !Sub "${ProjectNameUpper}-${Environment}-ECS-Task-Role"
            AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                  - Effect: "Allow"
                    Principal:
                        Service: "ecs-tasks.amazonaws.com"
                    Action: "sts:AssumeRole"
            ManagedPolicyArns:
              - "arn:aws:iam::aws:policy/AmazonS3FullAccess"
              - "arn:aws:iam::aws:policy/AmazonRDSDataFullAccess"
              - "arn:aws:iam::aws:policy/AmazonOpenSearchServiceFullAccess"
              - "arn:aws:iam::aws:policy/SecretsManagerReadWrite"
              - "arn:aws:iam::aws:policy/AmazonSESFullAccess"
              - "arn:aws:iam::aws:policy/AmazonMacieFullAccess"
              - "arn:aws:iam::aws:policy/AWSStepFunctionsFullAccess"

    ECSExecutionRole:
        Type: "AWS::IAM::Role"
        Properties:
            RoleName: !Sub "${ProjectNameUpper}-${Environment}-ECS-Execution-Role"
            AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                  - Effect: "Allow"
                    Principal:
                        Service: "ecs-tasks.amazonaws.com"
                    Action: "sts:AssumeRole"
            ManagedPolicyArns:
              - "arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"

    ECSCluster:
        Type: "AWS::ECS::Cluster"
        Properties:
            ClusterName: !Sub "${ProjectNameUpper}-Services-${Environment}"
            CapacityProviders:
              - "FARGATE"
              - "FARGATE_SPOT"
            DefaultCapacityProviderStrategy:
              -
                CapacityProvider: "FARGATE"
                Weight: 1
                Base: 0
              -
                CapacityProvider: "FARGATE_SPOT"
                Weight: 1
                Base: 0