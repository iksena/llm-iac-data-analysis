AWSTemplateFormatVersion: "2010-09-09"
Description: "AWS CloudFormation template for AWS IAM Roles, Policies, OIDC Providers, and Amazon EMR on EKS Virtual Clusters"

Parameters:
  ProjectName:
    Description: An environment name that is prefixed to resource names
    Type: String
    Default: KerberosEMRonEKS

  HiveMetastoreS3BucketName:
    Description: Name of the S3 bucket for Hive Metastore (without account ID and region suffix)
    Type: String
    Default: "demo-emr-eks-kerberos-data"

  CreateEMRContainersServiceLinkedRole:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Set to true if the AWSServiceRoleForAmazonEMRContainers doesn't exists. It is usually already present.

  CommonKMSKeyArn:
    Description: ARN of the AWS KMS key used for Amazon CloudWatch Logs encryption
    Type: String

Conditions:
  ShouldCreateEMRContainersServiceLinkedRole: !Equals
    - !Ref CreateEMRContainersServiceLinkedRole
    - "true"

Resources:
  # Single IAM Role for both Spark job clusters
  EMRSparkJobRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: "Explicit name required for EMR job execution role as it needs to be referenced consistently across the application"
      guard:
        SuppressedRules:
          - IAM_NO_INLINE_POLICY_CHECK: "Inline policy acceptable for demo purposes. For production, refactor to managed policies."
    Properties:
      RoleName: EmrSparkJobExecutionRolekrb
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: elasticmapreduce.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: EMRSparkJobPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "s3:GetObject"
                  - "s3:PutObject"
                  - "s3:DeleteObject"
                  - "s3:ListBucket"
                  - "s3:GetBucketLocation"
                Resource:
                  - !Sub "arn:aws:s3:::${HiveMetastoreS3BucketName}-${AWS::AccountId}-${AWS::Region}"
                  - !Sub "arn:aws:s3:::${HiveMetastoreS3BucketName}-${AWS::AccountId}-${AWS::Region}/*"
              - Effect: Allow
                Action:
                  - "logs:CreateLogGroup"
                  - "logs:CreateLogStream"
                  - "logs:PutLogEvents"
                  - "logs:DescribeLogGroups"
                  - "logs:DescribeLogStreams"
                Resource:
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/emr-containers/*"
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/emr-containers/*:log-stream:*"
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey*
                Resource: !Ref CommonKMSKeyArn
              # Access to Kerberos keytabs for Spark jobs authenticating with Hive Metastore
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource:
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/eks/kerberos/keytabs/*"
      Tags:
        - Key: ProjectName
          Value: !Ref ProjectName

  # AWSServiceRoleForAmazonEMRContainers
  AWSServiceRoleForEMRContainers:
    Type: AWS::IAM::Role
    Condition: ShouldCreateEMRContainersServiceLinkedRole
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: "Explicit name required as this is a service-linked role with a specific required name"
      guard:
        SuppressedRules:
          - IAM_NO_INLINE_POLICY_CHECK: "Inline policy acceptable for demo purposes. For production, refactor to managed policies."
    Properties:
      RoleName: AWSServiceRoleForAmazonEMRContainerskrb
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: emr-containers.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/aws-service-role/AmazonEMRContainersServiceRolePolicy
      Policies:
        - PolicyName: KMSAccessForLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey*
                Resource: !Ref CommonKMSKeyArn
      Tags:
        - Key: ProjectName
          Value: !Ref ProjectName

Outputs:
  EMRSparkJobRoleArn:
    Description: ARN of the IAM Role for EMR Spark jobs
    Value: !GetAtt EMRSparkJobRole.Arn