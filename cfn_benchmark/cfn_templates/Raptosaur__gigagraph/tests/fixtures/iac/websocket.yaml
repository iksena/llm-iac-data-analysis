# WebSocket API (aws-samples/serverless-patterns shape): bare RouteKey on
# AWS::ApiGatewayV2::Route means a wss:// action route, not an HTTP path.
# $connect and a custom action route to the same lambda via the integration.
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: WebSocket API routes

Resources:
  WsHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers/report.lambda_handler
      Runtime: python3.12

  WsApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: ws-api
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: $request.body.action

  WsIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WsApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WsHandlerFunction.Arn}/invocations

  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WsApi
      RouteKey: $connect
      AuthorizationType: NONE
      Target: !Join ['/', ['integrations', !Ref WsIntegration]]

  SendMessageRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WsApi
      RouteKey: sendMessage
      Target: !Join ['/', ['integrations', !Ref WsIntegration]]