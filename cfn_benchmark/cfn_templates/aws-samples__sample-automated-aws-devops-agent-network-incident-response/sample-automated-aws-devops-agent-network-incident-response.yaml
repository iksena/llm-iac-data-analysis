              - !Sub '${ProdConfigBucket.Arn}'
              - !Sub '${ProdConfigBucket.Arn}/*'
              - !Sub '${DataLakeRawBucket.Arn}'
              - !Sub '${DataLakeRawBucket.Arn}/*'
              - !Sub '${MLModelsBucket.Arn}'
              - !Sub '${MLModelsBucket.Arn}/*'
              - !Sub '${BackupArchiveBucket.Arn}'
              - !Sub '${BackupArchiveBucket.Arn}/*'
