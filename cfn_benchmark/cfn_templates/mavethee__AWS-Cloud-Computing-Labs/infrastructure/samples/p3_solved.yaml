AWSTemplateFormatVersion: '2010-09-09'
Description: Baza Danych RDS z "zaszytym" hasłem (Hardened for Trivy)

Resources:
  # KMS Key for Performance Insights encryption (AWS-0078)
  PIKmsKey:
    Type: 'AWS::KMS::Key'
    Properties:
      Description: 'KMS key for RDS Performance Insights'
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: 'Enable IAM User Permissions'
            Effect: 'Allow'
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'

  MyDatabase:
    Type: 'AWS::RDS::DBInstance'
    Properties:
      DBName: 'ecommerce_db'
      Engine: 'mysql'
      MasterUsername: 'admin'
      MasterUserPassword: 'Password123!'
      AllocatedStorage: '20'
      DBInstanceClass: 'db.t3.micro'

      # Security hardenings
      PubliclyAccessible: false
      StorageEncrypted: true
      BackupRetentionPeriod: 7
      EnableIAMDatabaseAuthentication: true
      DeletionProtection: true

      # Added CMK for Performance Insights (AWS-0078)
      EnablePerformanceInsights: true
      PerformanceInsightsKMSKeyId: !GetAtt PIKmsKey.Arn