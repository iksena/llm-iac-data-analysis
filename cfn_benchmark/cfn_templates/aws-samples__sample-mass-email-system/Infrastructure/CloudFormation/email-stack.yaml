  ListRecipientsTablesLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-ListRecipientsTables
      ReservedConcurrentExecutions: 5
      Handler: index.lambda_handler
      Role: !GetAtt CSVProcessorRole.Arn
      Runtime: python3.13
      Timeout: 30
      MemorySize: 128
      DeadLetterConfig:
        TargetArn: !GetAtt LambdaDeadLetterQueue.Arn
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          from botocore.exceptions import ClientError
          from datetime import datetime

          def lambda_handler(event, context):
              CORS_ORIGIN = os.environ.get('ALLOWED_ORIGIN', 'NONE')
              try:
                  dynamodb = boto3.resource('dynamodb')
                  dynamodb_client = boto3.client('dynamodb')
                  s3_client = boto3.client('s3')
                  registry_table = dynamodb.Table(os.environ['REGISTRY_TABLE'])
                  recipients_bucket = os.environ.get('RECIPIENTS_BUCKET', '')

                  # Check for lite mode (skip expensive metadata lookups)
                  query_params = event.get('queryStringParameters') or {}
                  lite_mode = (query_params.get('lite') or '').lower() == 'true'

                  # Scan the registry table to get all recipient tables
                  response = registry_table.scan()

                  tables = []
                  for item in response.get('Items', []):
                      table_name = item.get('TableName', '')
                      s3_key = item.get('S3Key', '')
                      source = item.get('Source', 'csv')
                      created_at = item.get('CreatedAt', '')

                      entry = {
                          'name': table_name,
                          'originalFilename': item.get('OriginalFilename', ''),
                          'createdAt': created_at,
                          'source': source,
                          's3Key': s3_key
                      }

                      # Only fetch size/lastModified when not in lite mode
                      if not lite_mode:
                          size = 0
                          last_modified = created_at

                          try:
                              if source == 'manual':
                                  try:
                                      table_desc = dynamodb_client.describe_table(TableName=table_name)
                                      size = table_desc['Table'].get('ItemCount', 0) * 100
                                      last_modified = table_desc['Table'].get('CreationDateTime', datetime.now()).isoformat()
                                  except:
                                      size = 0
                              else:
                                  if recipients_bucket and s3_key and s3_key != 'manual-entry':
                                      try:
                                          s3_obj = s3_client.head_object(Bucket=recipients_bucket, Key=s3_key)
                                          size = s3_obj.get('ContentLength', 0)
                                          last_modified = s3_obj.get('LastModified', datetime.now()).isoformat()
                                      except:
                                          size = 0
                          except Exception as e:
                              print(f"Error getting size/modified for {table_name}: {e}")

                          entry['size'] = size
                          entry['lastModified'] = last_modified

                      tables.append(entry)

                  return {
                      'statusCode': 200,
                      'headers': {
                          'Content-Type': 'application/json',
                          'Access-Control-Allow-Origin': CORS_ORIGIN,
                      },
                      'body': json.dumps({
                          'files': tables
                      })
                  }

              except ClientError as e:
                  return {
                      'statusCode': 500,
                      'headers': {
                          'Content-Type': 'application/json',
                          'Access-Control-Allow-Origin': CORS_ORIGIN,
                      },
                      'body': json.dumps({
                          'error': f'AWS error: {str(e)}'
                      })
                  }
              except Exception as e:
                  return {
                      'statusCode': 500,
                      'headers': {
                          'Content-Type': 'application/json',
                          'Access-Control-Allow-Origin': CORS_ORIGIN,
                      },
                      'body': json.dumps({
                          'error': f'Internal server error: {str(e)}'
                      })
                  }
      Environment:
        Variables:
          REGISTRY_TABLE: !Ref RecipientTablesRegistry
          DYNAMODB_KMS_KEY_ID: !Ref DynamoDBKMSKey
          RECIPIENTS_BUCKET: !Ref RecipientsBucket
          ALLOWED_ORIGIN: !Ref AllowedOrigin
      KmsKeyArn: !Ref LambdaKMSKeyArn

