AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: |
  DVA-C02 Lab 1.2C — S3 push trigger (async) with on-failure destination

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 256
    LoggingConfig:
      LogFormat: JSON

Resources:
  # Where failed async invokes land after retries
  OnFailureQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: dva-lab-01-02-s3-onfailure
      MessageRetentionPeriod: 1209600

  # The bucket -- SAM auto-creates the S3->Lambda permission
  IngestBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'dva-lab-01-02-s3-${AWS::AccountId}-${AWS::Region}'

  S3Processor:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dva-lab-01-02-s3-processor
      CodeUri: src/
      Handler: app.handler
      Policies:
        - S3ReadPolicy:
            BucketName: !Sub 'dva-lab-01-02-s3-${AWS::AccountId}-${AWS::Region}'
      # Async invoke configuration
      EventInvokeConfig:
        MaximumRetryAttempts: 2          # default; can be 0, 1, or 2
        MaximumEventAgeInSeconds: 3600   # discard if older than 1 hour
        DestinationConfig:
          OnFailure:
            Type: SQS
            Destination: !GetAtt OnFailureQueue.Arn
          # OnSuccess can also be configured -- routes successful invokes too
      Events:
        S3Event:
          Type: S3
          Properties:
            Bucket: !Ref IngestBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: suffix
                    Value: .json

Outputs:
  BucketName:
    Value: !Ref IngestBucket
  FunctionName:
    Value: !Ref S3Processor
  OnFailureDestQueueUrl:
    Value: !Ref OnFailureQueue