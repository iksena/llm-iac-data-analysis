AWSTemplateFormatVersion: '2010-09-09'
Description: |
  AWS Batch CloudFormation template for video codec conversion.
  Defines Compute Environment, Job Queue, and Job Definition for the batch worker.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Deployment environment name

  BatchJobRoleArn:
    Type: String
    Description: IAM role ARN for Batch jobs

  BatchTaskExecutionRoleArn:
    Type: String
    Description: IAM role ARN for Batch task execution

  MaxvCpus:
    Type: Number
    Default: 16
    MinValue: 1
    MaxValue: 256
    Description: Maximum vCPUs for Compute Environment

  JobMemory:
    Type: Number
    Default: 4096
    AllowedValues:
      - 1024
      - 2048
      - 4096
      - 8192
      - 16384
    Description: Memory allocation for jobs (MiB)

  JobVcpus:
    Type: Number
    Default: 2
    AllowedValues:
      - 1
      - 2
      - 4
    Description: vCPU allocation for jobs

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID for Batch Compute Environment

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnet IDs for Batch Compute Environment

  EcrRepositoryUri:
    Type: String
    Description: ECR repository URI for batch worker image

  ImageTag:
    Type: String
    Default: latest
    Description: Docker image tag to use

  JobTimeoutSeconds:
    Type: Number
    Default: 600
    MinValue: 60
    MaxValue: 3600
    Description: Job timeout in seconds

Resources:
  # ============================================================================
  # Security Group for Batch Compute Environment
  # ============================================================================
  BatchSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub 'codec-converter-batch-sg-${Environment}'
      GroupDescription: Security group for Batch Compute Environment
      VpcId: !Ref VpcId
      # Egress rule for external communication (S3, DynamoDB, ECR)
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: Allow HTTPS outbound for AWS services
      Tags:
        - Key: Name
          Value: !Sub 'codec-converter-batch-sg-${Environment}'
        - Key: Project
          Value: codec-converter
        - Key: Environment
          Value: !Ref Environment

  # ============================================================================
  # CloudWatch Log Group for Batch Jobs
  # ============================================================================
  BatchLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/batch/codec-converter-${Environment}'
      RetentionInDays: 30
      Tags:
        - Key: Project
          Value: codec-converter
        - Key: Environment
          Value: !Ref Environment

  # ============================================================================
  # Batch Compute Environment (Fargate)
  # ============================================================================
  BatchComputeEnvironment:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      ComputeEnvironmentName: !Sub 'codec-converter-compute-${Environment}'
      Type: MANAGED
      State: ENABLED
      ComputeResources:
        Type: FARGATE
        MaxvCpus: !Ref MaxvCpus
        Subnets: !Ref SubnetIds
        SecurityGroupIds:
          - !Ref BatchSecurityGroup
      Tags:
        Project: codec-converter
        Environment: !Ref Environment
        ManagedBy: CloudFormation

  # ============================================================================
  # Batch Job Queue
  # ============================================================================
  BatchJobQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      JobQueueName: !Sub 'codec-converter-queue-${Environment}'
      Priority: 1
      State: ENABLED
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment: !Ref BatchComputeEnvironment
      Tags:
        Project: codec-converter
        Environment: !Ref Environment
        ManagedBy: CloudFormation

  # ============================================================================
  # Batch Job Definition
  # ============================================================================
  BatchJobDefinition:
    Type: AWS::Batch::JobDefinition
    Properties:
      JobDefinitionName: !Sub 'codec-converter-job-${Environment}'
      Type: container
      PlatformCapabilities:
        - FARGATE
      Timeout:
        AttemptDurationSeconds: !Ref JobTimeoutSeconds
      RetryStrategy:
        Attempts: 2
        EvaluateOnExit:
          # Retry on Fargate resource initialization errors
          - OnStatusReason: 'ResourceInitializationError*'
            Action: RETRY
          # Retry on container pull errors
          - OnStatusReason: 'CannotPullContainerError*'
            Action: RETRY
          # Do not retry on successful exit
          - OnExitCode: '0'
            Action: EXIT
      ContainerProperties:
        Image: !Sub '${EcrRepositoryUri}:${ImageTag}'
        JobRoleArn: !Ref BatchJobRoleArn
        ExecutionRoleArn: !Ref BatchTaskExecutionRoleArn
        ResourceRequirements:
          - Type: VCPU
            Value: !Sub '${JobVcpus}'
          - Type: MEMORY
            Value: !Sub '${JobMemory}'
        NetworkConfiguration:
          AssignPublicIp: ENABLED
        FargatePlatformConfiguration:
          PlatformVersion: LATEST
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: !Ref BatchLogGroup
            awslogs-region: !Ref AWS::Region
            awslogs-stream-prefix: batch
        Environment:
          - Name: ENVIRONMENT
            Value: !Ref Environment
          - Name: AWS_REGION
            Value: !Ref AWS::Region
        # Job parameters can be overridden at job submission
        Command:
          - 'Ref::jobId'
          - 'Ref::inputBucket'
          - 'Ref::inputKey'
          - 'Ref::outputBucket'
          - 'Ref::outputKey'
          - 'Ref::targetCodec'
      Parameters:
        jobId: ''
        inputBucket: ''
        inputKey: ''
        outputBucket: ''
        outputKey: ''
        targetCodec: h264
      Tags:
        Project: codec-converter
        Environment: !Ref Environment
        ManagedBy: CloudFormation

Outputs:
  BatchSecurityGroupId:
    Description: Security Group ID for Batch Compute Environment
    Value: !Ref BatchSecurityGroup
    Export:
      Name: !Sub '${AWS::StackName}-BatchSecurityGroupId'

  ComputeEnvironmentArn:
    Description: Batch Compute Environment ARN
    Value: !Ref BatchComputeEnvironment
    Export:
      Name: !Sub '${AWS::StackName}-ComputeEnvironmentArn'

  JobQueueArn:
    Description: Batch Job Queue ARN
    Value: !Ref BatchJobQueue
    Export:
      Name: !Sub '${AWS::StackName}-JobQueueArn'

  JobQueueName:
    Description: Batch Job Queue name
    Value: !Sub 'codec-converter-queue-${Environment}'
    Export:
      Name: !Sub '${AWS::StackName}-JobQueueName'

  JobDefinitionArn:
    Description: Batch Job Definition ARN
    Value: !Ref BatchJobDefinition
    Export:
      Name: !Sub '${AWS::StackName}-JobDefinitionArn'

  JobDefinitionName:
    Description: Batch Job Definition name
    Value: !Sub 'codec-converter-job-${Environment}'
    Export:
      Name: !Sub '${AWS::StackName}-JobDefinitionName'

  BatchLogGroupName:
    Description: CloudWatch Log Group name for Batch jobs
    Value: !Ref BatchLogGroup
    Export:
      Name: !Sub '${AWS::StackName}-BatchLogGroupName'