AWSTemplateFormatVersion: '2010-09-09'
Description: >
  IAM user for local Batch worker development.

  This template creates an IAM user for local developers to run the Batch worker
  application locally with access to AWS resources.
  Access keys should be created manually via AWS Console and stored securely.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: デプロイ環境名

  BatchPolicyArn:
    Type: String
    Description: >
      Batch ワーカーポリシーの ARN
      (policies/batch-policy.yaml からエクスポートされた値を使用)

Resources:
  # ============================================================================
  # ローカル開発用 Batch ワーカー IAM ユーザー
  # ============================================================================
  DevBatchUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Sub 'codec-converter-dev-batch-${Environment}'
      ManagedPolicyArns:
        - !Ref BatchPolicyArn
      Tags:
        - Key: Application
          Value: codec-converter
        - Key: Environment
          Value: !Ref Environment
        - Key: Purpose
          Value: Local Batch Worker Development

Outputs:
  DevBatchUserName:
    Description: ローカル開発用 Batch ワーカーユーザーの名前
    Value: !Ref DevBatchUser
    Export:
      Name: !Sub '${AWS::StackName}-DevBatchUserName'

  DevBatchUserArn:
    Description: ローカル開発用 Batch ワーカーユーザーの ARN
    Value: !GetAtt DevBatchUser.Arn
    Export:
      Name: !Sub '${AWS::StackName}-DevBatchUserArn'