AWSTemplateFormatVersion: '2010-09-09'
Description: CloudFront Distribution stack

Parameters:
  UICodeS3Bucket:
    Type: String
  UICodeS3BucketDomainName:
    Type: String
  UICodeS3BucketArn:
    Type: String
  UniqueSuffix:
    Type: String
    Description: 'Deterministic hash suffix for S3 bucket names (avoids exposing AWS account ID)'
    AllowedPattern: '[a-f0-9]{8}'
    ConstraintDescription: 'Must be an 8-character lowercase hex string'

Resources:
  CloudFrontAccessLogsBucket:
    Type: AWS::S3::Bucket
    Metadata:
      Comment: >-
        This bucket is the access log destination for CloudFrontLogsBucket.
        Enabling access logging on a log destination bucket makes log writes
        generate further log records, so it is omitted by design.
      checkov:
        skip:
          - id: CKV_AWS_18
            comment: Log destination bucket; self-logging would recurse.
      guard:
        SuppressedRules:
          - S3_BUCKET_LOGGING_ENABLED
    Properties:
      BucketName: !Sub '${AWS::StackName}-cf-access-logs-${UniqueSuffix}'
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      ObjectLockEnabled: true
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention:
            Mode: GOVERNANCE
            Days: 1
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  CloudFrontAccessLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CloudFrontAccessLogsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyNonSSLRequests
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !Sub 'arn:${AWS::Partition}:s3:::${CloudFrontAccessLogsBucket}'
              - !Sub 'arn:${AWS::Partition}:s3:::${CloudFrontAccessLogsBucket}/*'
            Condition:
              Bool:
                aws:SecureTransport: false

  CloudFrontLogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-cf-logs-${UniqueSuffix}'
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      ObjectLockEnabled: true
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention:
            Mode: GOVERNANCE
            Days: 1
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LoggingConfiguration:
        DestinationBucketName: !Ref CloudFrontAccessLogsBucket
        LogFilePrefix: "cloudfront-logs/"

  CloudFrontLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CloudFrontLogsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyNonSSLRequests
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !Sub 'arn:${AWS::Partition}:s3:::${CloudFrontLogsBucket}'
              - !Sub 'arn:${AWS::Partition}:s3:::${CloudFrontLogsBucket}/*'
            Condition:
              Bool:
                aws:SecureTransport: false

  CloudFrontWebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub ${AWS::StackName}-CloudFront-WAF
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      Rules:
        - Name: AWSManagedRulesCommonRuleSet
          Priority: 1
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: CommonRuleSetMetric
        - Name: AWSManagedRulesKnownBadInputsRuleSet
          Priority: 2
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: KnownBadInputsRuleSetMetric
        - Name: RateLimitRule
          Priority: 3
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: 2000
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: RateLimitRuleMetric
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub ${AWS::StackName}-CloudFront-WAF

  CloudFrontDistribution:
    Type: "AWS::CloudFront::Distribution"
    Metadata:
      Comment: >-
        This distribution serves the default *.cloudfront.net domain, so
        CloudFront pins the viewer security policy to TLSv1 and MinimumProtocolVersion
        has no effect. Raising the TLS floor requires Aliases plus a custom ACM or
        IAM certificate, which is out of scope for this sample. All current browsers
        negotiate TLS 1.2 or 1.3 regardless.
      checkov:
        skip:
          - id: CKV_AWS_174
            comment: Default CloudFront certificate; TLS floor is not configurable without a custom domain.
      guard:
        SuppressedRules:
          - CLOUDFRONT_CUSTOM_SSL_CERTIFICATE
    Properties:
      DistributionConfig:
        Origins:
          - ConnectionAttempts: 3
            ConnectionTimeout: 10
            DomainName: !Ref UICodeS3BucketDomainName
            Id: !Sub "${AWS::StackName}-cf-distro"
            OriginPath: ""
            S3OriginConfig: {}
            OriginAccessControlId: !GetAtt CloudFrontOriginAccessControl.Id
        DefaultCacheBehavior:
          AllowedMethods:
            - "HEAD"
            - "GET"
          CachedMethods:
            - "HEAD"
            - "GET"
          Compress: true
          CachePolicyId: "658327ea-f89d-4fab-a63d-7e88639e58f6"
          SmoothStreaming: false
          TargetOriginId: !Sub "${AWS::StackName}-cf-distro"
          ViewerProtocolPolicy: "redirect-to-https"
        Comment: !Sub "${AWS::StackName} CloudFront Distribution"
        PriceClass: "PriceClass_All"
        Enabled: true
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
          MinimumProtocolVersion: "TLSv1.2_2021"
        Restrictions:
          GeoRestriction:
            RestrictionType: "none"
        HttpVersion: "http2"
        DefaultRootObject: "index.html"
        IPV6Enabled: true
        WebACLId: !GetAtt CloudFrontWebACL.Arn
        Logging:
          Bucket: !GetAtt CloudFrontLogsBucket.DomainName
          IncludeCookies: false
          Prefix: "cloudfront-logs/"

  CloudFrontOriginAccessControl:
    Type: "AWS::CloudFront::OriginAccessControl"
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-cf-distro"
        OriginAccessControlOriginType: "s3"
        SigningBehavior: "always"
        SigningProtocol: "sigv4"

  S3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UICodeS3Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Id: !Sub "${AWS::StackName}-PolicyForCloudFrontPrivateContent"
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${UICodeS3BucketArn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"
          - Sid: DenyNonSSLRequests
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !Ref UICodeS3BucketArn
              - !Sub '${UICodeS3BucketArn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false

Outputs:
  CloudFrontDistributionId:
    Description: CloudFront Distribution ID
    Value: !Ref CloudFrontDistribution
  CloudFrontDomainName:
    Description: CloudFront Distribution Domain Name
    Value: !GetAtt CloudFrontDistribution.DomainName