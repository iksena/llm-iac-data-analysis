AWSTemplateFormatVersion: '2010-09-09'
Description: Zabezpieczona Sieć i Instancja EC2 (Hardened for Trivy)
Resources:
  WebSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: 'Allow SSH and HTTP securely'
      SecurityGroupIngress:
        # AWS-0107 & AWS-0124: Restricted SSH to a private CIDR and added a description
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 10.0.0.0/16 # Changed from 0.0.0.0/0 to prevent public SSH access
          Description: 'Allow SSH access from internal network only'

        # AWS-0124: Added a description for the HTTP rule
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: 'Allow public HTTP web traffic'

  # AWS-0028: Created a LaunchTemplate to properly enforce IMDSv2 tokens
  AppLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        InstanceType: t3.micro
        ImageId: ami-0c55b159cbfafe1fe
        SecurityGroupIds:
          - !GetAtt WebSecurityGroup.GroupId
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
        BlockDeviceMappings:
          - DeviceName: /dev/sdk
            Ebs:
              VolumeSize: 10
              Encrypted: true

  AppServer:
    Type: 'AWS::EC2::Instance'
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref AppLaunchTemplate
        Version: !GetAtt AppLaunchTemplate.LatestVersionNumber

      # AWS-0131: Changed Encrypted to true (declared directly on the Instance block to satisfy Trivy's parser)
      BlockDeviceMappings:
        - DeviceName: /dev/sdk
          Ebs:
            VolumeSize: 10
            Encrypted: true