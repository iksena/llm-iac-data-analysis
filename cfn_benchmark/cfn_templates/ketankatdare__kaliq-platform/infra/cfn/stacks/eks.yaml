AWSTemplateFormatVersion: "2010-09-09"
Description: |
  KALIQ EKS Stack (Stack E)
  - EKS cluster, managed node group, and IRSA enablement
  - Reference: docs/infrastructure/STACKS.md

Parameters:
  Project:
    Type: String
    Default: kaliq
    Description: Project name

  Env:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]
    Description: Environment name

  KubernetesVersion:
    Type: String
    Default: "1.30"
    Description: EKS Kubernetes version

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID for cluster (from network stack)

  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnet IDs for cluster nodes (from network stack)

  # Cluster endpoint access controls
  ClusterEndpointAccess:
    Type: String
    Default: PublicAndPrivate
    AllowedValues:
      - PublicAndPrivate
      - PrivateOnly
    Description: Cluster API endpoint access mode

  PublicAccessCidrs:
    Type: CommaDelimitedList
    Default: "1.2.3.4/32"
    Description: CIDR blocks allowed for public API access (set to your public IP(s) before deploy)

  # OIDC provider thumbprint (must be set correctly before first deploy)
  OidcThumbprint:
    Type: String
    Default: "9e99a48a9960b14926bb7f3b02e22da2b0ab7280"
    Description: OIDC provider thumbprint (obtain via openssl or AWS docs)

  # Control plane logging
  EnableControlPlaneLogs:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Enable EKS control plane logging (api, audit, authenticator)

  # Node group configuration (dev-cost aware)
  CreateNodeGroup:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Create managed node group (set false to defer or use Fargate)

  NodeInstanceType:
    Type: String
    Default: t3a.small
    Description: EC2 instance type for nodes

  NodeMinSize:
    Type: Number
    Default: 1
    MinValue: 0
    Description: Node group minimum size

  NodeDesiredSize:
    Type: Number
    Default: 1
    MinValue: 0
    Description: Node group desired size

  NodeMaxSize:
    Type: Number
    Default: 1
    MinValue: 1
    Description: Node group maximum size

  NodeDiskSizeGiB:
    Type: Number
    Default: 20
    MinValue: 20
    Description: Node root volume size in GiB

  AdminPrincipalArn:
    Type: String
    Description: IAM role/user ARN that should have cluster-admin access

Conditions:
  CreateNodeGroupCondition: !Equals [!Ref CreateNodeGroup, "true"]
  EnableLogsCondition: !Equals [!Ref EnableControlPlaneLogs, "true"]
  PublicAccessEnabled: !Equals [!Ref ClusterEndpointAccess, "PublicAndPrivate"]

Resources:
  EksClusterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Project}-${Env}-eks-cluster-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Env
          Value: !Ref Env

  EksClusterSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${Project}-${Env}-eks-cluster-sg"
      GroupDescription: EKS cluster security group
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: !Sub "${Project}-${Env}-eks-cluster-sg"
        - Key: Project
          Value: !Ref Project
        - Key: Env
          Value: !Ref Env

  EksCluster:
    Type: AWS::EKS::Cluster
    Properties:
      Name: !Sub "${Project}-${Env}-eks"
      Version: !Ref KubernetesVersion
      RoleArn: !GetAtt EksClusterRole.Arn
      AccessConfig:
        AuthenticationMode: API_AND_CONFIG_MAP
      ResourcesVpcConfig:
        SubnetIds: !Ref PrivateSubnetIds
        SecurityGroupIds:
          - !Ref EksClusterSecurityGroup
        EndpointPrivateAccess: true
        EndpointPublicAccess: !If [PublicAccessEnabled, true, false]
        PublicAccessCidrs: !If [PublicAccessEnabled, !Ref PublicAccessCidrs, !Ref AWS::NoValue]
      Logging:
        ClusterLogging:
          EnabledTypes: !If
            - EnableLogsCondition
            - - Type: api
              - Type: audit
              - Type: authenticator
            - !Ref AWS::NoValue
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Env
          Value: !Ref Env

  AdminAccessEntry:
    Type: AWS::EKS::AccessEntry
    Properties:
      ClusterName: !Ref EksCluster
      PrincipalArn: !Ref AdminPrincipalArn
      Type: STANDARD
      AccessPolicies:
        - AccessScope:
            Type: cluster
          PolicyArn: !Sub arn:${AWS::Partition}:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy

  EksOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: !GetAtt EksCluster.OpenIdConnectIssuerUrl
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - !Ref OidcThumbprint
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Env
          Value: !Ref Env

  NodeInstanceRole:
    Type: AWS::IAM::Role
    Condition: CreateNodeGroupCondition
    Properties:
      RoleName: !Sub "${Project}-${Env}-eks-node-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Env
          Value: !Ref Env

  NodeGroup:
    Type: AWS::EKS::Nodegroup
    Condition: CreateNodeGroupCondition
    DependsOn: EksCluster
    Properties:
      NodegroupName: !Sub "${Project}-${Env}-node-group"
      ClusterName: !Ref EksCluster
      NodeRole: !GetAtt NodeInstanceRole.Arn
      Subnets: !Ref PrivateSubnetIds
      ScalingConfig:
        MinSize: !Ref NodeMinSize
        MaxSize: !Ref NodeMaxSize
        DesiredSize: !Ref NodeDesiredSize
      InstanceTypes:
        - !Ref NodeInstanceType
      DiskSize: !Ref NodeDiskSizeGiB
      AmiType: AL2_x86_64
      Tags:
        Project: !Ref Project
        Env: !Ref Env

Outputs:
  ClusterName:
    Description: EKS cluster name
    Value: !Ref EksCluster
    Export:
      Name: !Sub "${Project}-${Env}-eks-ClusterName"

  ClusterArn:
    Description: EKS cluster ARN
    Value: !GetAtt EksCluster.Arn
    Export:
      Name: !Sub "${Project}-${Env}-eks-ClusterArn"

  ClusterEndpoint:
    Description: EKS cluster API endpoint
    Value: !GetAtt EksCluster.Endpoint
    Export:
      Name: !Sub "${Project}-${Env}-eks-ClusterEndpoint"

  ClusterSecurityGroupId:
    Description: EKS cluster security group ID
    Value: !Ref EksClusterSecurityGroup
    Export:
      Name: !Sub "${Project}-${Env}-eks-ClusterSecurityGroupId"

  OidcProviderArn:
    Description: OIDC provider ARN for IRSA
    Value: !Ref EksOidcProvider
    Export:
      Name: !Sub "${Project}-${Env}-eks-OidcProviderArn"

  OidcIssuerUrl:
    Description: OIDC issuer URL (full https:// URL)
    Value: !GetAtt EksCluster.OpenIdConnectIssuerUrl
    Export:
      Name: !Sub "${Project}-${Env}-eks-OidcIssuerUrl"

  OidcIssuerHostPath:
    Description: OIDC issuer host/path (without https:// for IAM trust policies)
    Value: !Select [1, !Split ["https://", !GetAtt EksCluster.OpenIdConnectIssuerUrl]]
    Export:
      Name: !Sub "${Project}-${Env}-eks-OidcIssuerHostPath"

  NodeInstanceRoleArn:
    Description: Node instance role ARN (only if nodegroup created)
    Value: !If [CreateNodeGroupCondition, !GetAtt NodeInstanceRole.Arn, "N/A"]
    Export:
      Name: !Sub "${Project}-${Env}-eks-NodeInstanceRoleArn"