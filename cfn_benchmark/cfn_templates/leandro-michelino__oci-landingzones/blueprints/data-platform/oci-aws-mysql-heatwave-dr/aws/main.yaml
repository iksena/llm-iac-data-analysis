AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  AWS secondary stack for OCI-primary MySQL HeatWave DR. Creates VPC networking,
  security boundaries, and optional MySQL-compatible RDS standby endpoint.

Parameters:
  VpcCidr:
    Type: String
    Default: 10.84.0.0/16
  SubnetOneCidr:
    Type: String
    Default: 10.84.10.0/24
  SubnetTwoCidr:
    Type: String
    Default: 10.84.20.0/24
  OciReplicationCidr:
    Type: String
    Default: 10.74.0.0/16
  CreateRdsStandby:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
  DbIdentifier:
    Type: String
    Default: oci-aws-mysql-standby
  DbName:
    Type: String
    Default: appdr
  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
  DbAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
  DbMasterUsername:
    Type: String
    Default: adminuser
  DbMasterUserPassword:
    Type: String
    NoEcho: true
  DbPort:
    Type: Number
    Default: 3306
  DbDeletionProtection:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
  DbBackupRetentionPeriod:
    Type: Number
    Default: 7
    MinValue: 0
    MaxValue: 35
  DbPerformanceInsightsEnabled:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'

Conditions:
  EnableRdsStandby: !Equals [!Ref CreateRdsStandby, 'true']
  EnableDbDeletionProtection: !Equals [!Ref DbDeletionProtection, 'true']
  EnableDbPerformanceInsights: !Equals [!Ref DbPerformanceInsightsEnabled, 'true']

Resources:
  AwsDrVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-vpc'

  AwsDrLogKey:
    Type: AWS::KMS::Key
    Properties:
      Description: VPC flow log encryption key for OCI AWS MySQL DR.
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableAccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: kms:*
            Resource: '*'
          - Sid: AllowCloudWatchLogsUse
            Effect: Allow
            Principal:
              Service: !Sub 'logs.${AWS::Region}.amazonaws.com'
            Action:
              - kms:Decrypt
              - kms:DescribeKey
              - kms:Encrypt
              - kms:GenerateDataKey
              - kms:ReEncrypt*
            Resource: '*'

  AwsDrFlowLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      KmsKeyId: !GetAtt AwsDrLogKey.Arn
      RetentionInDays: 30

  AwsDrFlowLogRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: vpc-flow-logs.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: write-vpc-flow-logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                  - logs:PutLogEvents
                Resource: !Sub '${AwsDrFlowLogGroup.Arn}:*'

  AwsDrVpcFlowLog:
    Type: AWS::EC2::FlowLog
    Properties:
      DeliverLogsPermissionArn: !GetAtt AwsDrFlowLogRole.Arn
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Ref AwsDrFlowLogGroup
      ResourceId: !Ref AwsDrVpc
      ResourceType: VPC
      TrafficType: ALL

  AwsDrRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref AwsDrVpc
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-rt'

  AwsDrSubnetOne:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref AwsDrVpc
      CidrBlock: !Ref SubnetOneCidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-subnet-1'

  AwsDrSubnetTwo:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref AwsDrVpc
      CidrBlock: !Ref SubnetTwoCidr
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-subnet-2'

  AwsDrSubnetOneRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AwsDrSubnetOne
      RouteTableId: !Ref AwsDrRouteTable

  AwsDrSubnetTwoRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AwsDrSubnetTwo
      RouteTableId: !Ref AwsDrRouteTable

  AwsDrDatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow OCI replication and application traffic to MySQL standby.
      VpcId: !Ref AwsDrVpc
      SecurityGroupIngress:
        - Description: Allow MySQL replication and failover traffic from OCI.
          IpProtocol: tcp
          FromPort: !Ref DbPort
          ToPort: !Ref DbPort
          CidrIp: !Ref OciReplicationCidr
      SecurityGroupEgress:
        - Description: Allow MySQL response traffic to the OCI replication CIDR.
          IpProtocol: tcp
          FromPort: !Ref DbPort
          ToPort: !Ref DbPort
          CidrIp: !Ref OciReplicationCidr
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-sg'

  AwsDrDbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Condition: EnableRdsStandby
    Properties:
      DBSubnetGroupDescription: Subnets for AWS MySQL standby in OCI-primary DR pattern.
      DBSubnetGroupName: !Sub '${AWS::StackName}-subnet-group'
      SubnetIds:
        - !Ref AwsDrSubnetOne
        - !Ref AwsDrSubnetTwo

  AwsDrMySqlStandby:
    Type: AWS::RDS::DBInstance
    Condition: EnableRdsStandby
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Ref DbIdentifier
      Engine: mysql
      EngineVersion: '8.0'
      DBName: !Ref DbName
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: !Ref DbAllocatedStorage
      MasterUsername: !Ref DbMasterUsername
      MasterUserPassword: !Ref DbMasterUserPassword
      PubliclyAccessible: false
      MultiAZ: false
      DeletionProtection: !If [EnableDbDeletionProtection, true, false]
      EnableIAMDatabaseAuthentication: true
      EnablePerformanceInsights: !If [EnableDbPerformanceInsights, true, false]
      PerformanceInsightsKMSKeyId: !If [EnableDbPerformanceInsights, !GetAtt AwsDrLogKey.Arn, !Ref AWS::NoValue]
      BackupRetentionPeriod: !Ref DbBackupRetentionPeriod
      Port: !Ref DbPort
      DBSubnetGroupName: !Ref AwsDrDbSubnetGroup
      VPCSecurityGroups:
        - !Ref AwsDrDatabaseSecurityGroup
      StorageEncrypted: true
      CopyTagsToSnapshot: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-standby'

Outputs:
  AwsDrVpcId:
    Description: AWS VPC ID for DR standby networking.
    Value: !Ref AwsDrVpc

  AwsDrRouteTableId:
    Description: AWS route table ID associated with standby subnets.
    Value: !Ref AwsDrRouteTable

  AwsDrSubnetIds:
    Description: AWS subnet IDs used by the standby data tier.
    Value: !Join [",", [!Ref AwsDrSubnetOne, !Ref AwsDrSubnetTwo]]

  AwsDrSecurityGroupId:
    Description: Security group ID controlling MySQL standby ingress and egress.
    Value: !Ref AwsDrDatabaseSecurityGroup

  AwsStandbyEngine:
    Description: Secondary database engine provisioned by CloudFormation in AWS.
    Value: !If [EnableRdsStandby, "mysql-rds", "external-managed"]

  AwsStandbyEndpoint:
    Description: AWS standby endpoint for replication and failover contracts.
    Value: !If
      - EnableRdsStandby
      - !GetAtt AwsDrMySqlStandby.Endpoint.Address
      - "set-externally"

  AwsStandbyPort:
    Description: AWS standby MySQL port.
    Value: !Ref DbPort