Description: |
  This stack creates a cost based budget with additional AWS Lambda function

Resources:

  # An AWS budget that alerts by email
  Budget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetLimit:
          Amount: 100
          Unit: USD
        TimeUnit: MONTHLY
        BudgetType: COST
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 99
          Subscribers:
            - SubscriptionType: EMAIL
              Address: email@example.com
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
          Subscribers:
            - SubscriptionType: EMAIL
              Address: email@example.com

  # A new AWS Lambda function to execute custom code when budget limit is exceeded
  LambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.handler
      Role: arn:aws:iam::123456789012:role/service-role/MyTestFunction-role-tges65dfgsdfg
      Code:
        S3Bucket: my-test-bucket
        S3Key: my-test-function.zip
      Runtime: nodejs14.x
      MemorySize: 128
      Timeout: 900