AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Lab 6.4 — Parallel + Map state demo

Resources:
  ValidateAddress:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dva-lab-06-04-validate
      Runtime: python3.12
      Handler: handler.validate_address
      CodeUri: src/

  ChargeCard:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dva-lab-06-04-charge
      Runtime: python3.12
      Handler: handler.charge_card
      CodeUri: src/

  ProcessOrder:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dva-lab-06-04-process
      Runtime: python3.12
      Handler: handler.process_order
      CodeUri: src/

  SfnRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: states.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-lambdas
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource:
                  - !GetAtt ValidateAddress.Arn
                  - !GetAtt ChargeCard.Arn
                  - !GetAtt ProcessOrder.Arn

  StateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: dva-lab-06-04-parallel-and-map
      RoleArn: !GetAtt SfnRole.Arn
      DefinitionSubstitutions:
        ValidateArn: !GetAtt ValidateAddress.Arn
        ChargeArn: !GetAtt ChargeCard.Arn
        ProcessArn: !GetAtt ProcessOrder.Arn
      DefinitionString: |-
        {
          "Comment": "Parallel + Map demo",
          "StartAt": "PreflightChecks",
          "States": {
            "PreflightChecks": {
              "Type": "Parallel",
              "Branches": [
                {
                  "StartAt": "VAddr",
                  "States": {
                    "VAddr": {
                      "Type": "Task",
                      "Resource": "arn:aws:states:::lambda:invoke",
                      "Parameters": { "FunctionName": "${ValidateArn}", "Payload.$": "$" },
                      "ResultSelector": { "result.$": "$.Payload" },
                      "End": true
                    }
                  }
                },
                {
                  "StartAt": "Charge",
                  "States": {
                    "Charge": {
                      "Type": "Task",
                      "Resource": "arn:aws:states:::lambda:invoke",
                      "Parameters": { "FunctionName": "${ChargeArn}", "Payload.$": "$" },
                      "ResultSelector": { "result.$": "$.Payload" },
                      "End": true
                    }
                  }
                }
              ],
              "ResultPath": "$.preflight",
              "Next": "ProcessAll"
            },
            "ProcessAll": {
              "Type": "Map",
              "ItemsPath": "$.orders",
              "MaxConcurrency": 5,
              "ItemSelector": {
                "order.$": "$$.Map.Item.Value",
                "tenantId.$": "$.tenantId"
              },
              "ItemProcessor": {
                "ProcessorConfig": { "Mode": "INLINE" },
                "StartAt": "POne",
                "States": {
                  "POne": {
                    "Type": "Task",
                    "Resource": "arn:aws:states:::lambda:invoke",
                    "Parameters": { "FunctionName": "${ProcessArn}", "Payload.$": "$" },
                    "ResultSelector": { "result.$": "$.Payload" },
                    "End": true
                  }
                }
              },
              "ResultPath": "$.processed",
              "End": true
            }
          }
        }

Outputs:
  StateMachineArn:
    Value: !Ref StateMachine