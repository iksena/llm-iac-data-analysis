AWSTemplateFormatVersion: "2010-09-09"
Description: >
  DVA-C02 Lab 3.3 — Multipart upload. A single bucket with a lifecycle rule
  that aborts incomplete multipart uploads after 7 days. This is the canonical
  fix for the "phantom S3 charges" exam scenario.

Resources:
  MultipartBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub "dva-lab-03-03-multipart-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipart
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

Outputs:
  BucketName:
    Description: Multipart demo bucket
    Value: !Ref MultipartBucket
  BucketArn:
    Value: !GetAtt MultipartBucket.Arn