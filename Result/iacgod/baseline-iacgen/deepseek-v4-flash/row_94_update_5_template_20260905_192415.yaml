AWSTemplateFormatVersion: "2010-09-09"
Description: "Route53 DNS infrastructure for theworld.org multi-environment web platform with email authentication, mail routing, and SSL validation records"

Parameters:
  DomainName:
    Type: String
    Default: theworld.org
    Description: "Primary domain name for the hosted zone"
  CloudFrontHostedZoneId:
    Type: String
    Default: Z2FDTNDATAQYW2
    Description: "AWS CloudFront distribution hosted zone ID (global)"
  CloudFrontDomainName:
    Type: String
    Default: d123.cloudfront.net
    Description: "CloudFront distribution domain name (e.g., d123.cloudfront.net)"
  ProdFrontendALBDNS:
    Type: String
    Default: prod-fe-123456.elb.amazonaws.com
    Description: "Production frontend ALB DNS name"
  StagFrontendALBDNS:
    Type: String
    Default: stag-fe-123456.elb.amazonaws.com
    Description: "Staging frontend ALB DNS name"
  ProdWordPressALBDNS:
    Type: String
    Default: prod-wp-123456.elb.amazonaws.com
    Description: "Production WordPress backend ALB DNS name"
  StagWordPressALBDNS:
    Type: String
    Default: stag-wp-123456.elb.amazonaws.com
    Description: "Staging WordPress backend ALB DNS name"
  ProdAdminALBDNS:
    Type: String
    Default: prod-admin-123456.elb.amazonaws.com
    Description: "Production admin interface ALB DNS name"
  StagAdminALBDNS:
    Type: String
    Default: stag-admin-123456.elb.amazonaws.com
    Description: "Staging admin interface ALB DNS name"
  ProdAPIALBDNS:
    Type: String
    Default: prod-api-123456.elb.amazonaws.com
    Description: "Production API ALB DNS name"
  StagAPIALBDNS:
    Type: String
    Default: stag-api-123456.elb.amazonaws.com
    Description: "Staging API ALB DNS name"
  ProdFeedALBDNS:
    Type: String
    Default: prod-feed-123456.elb.amazonaws.com
    Description: "Production feed service ALB DNS name"
  StagFeedALBDNS:
    Type: String
    Default: stag-feed-123456.elb.amazonaws.com
    Description: "Staging feed service ALB DNS name"
  ProdProjectPagesALBDNS:
    Type: String
    Default: prod-projects-123456.elb.amazonaws.com
    Description: "Production project pages ALB DNS name"
  StagProjectPagesALBDNS:
    Type: String
    Default: stag-projects-123456.elb.amazonaws.com
    Description: "Staging project pages ALB DNS name"
  ProdFileRepoALBDNS:
    Type: String
    Default: prod-files-123456.elb.amazonaws.com
    Description: "Production file repository ALB DNS name"
  StagFileRepoALBDNS:
    Type: String
    Default: stag-files-123456.elb.amazonaws.com
    Description: "Staging file repository ALB DNS name"
  SPFRecordValue:
    Type: String
    Default: "v=spf1 include:spf.protection.outlook.com include:_spf.google.com include:mail.zendesk.com include:spf.campaignmonitor.com ~all"
    Description: "SPF TXT record value for email authentication"
  DMARCRecordValue:
    Type: String
    Default: "v=DMARC1; p=quarantine; rua=mailto:dmarc-reports@theworld.org; pct=100"
    Description: "DMARC TXT record value for email policy"
  Office365MXExchange:
    Type: String
    Default: theworld-org.mail.protection.outlook.com
    Description: "Office 365 MX exchange value (e.g., domain.mail.protection.outlook.com)"
  GoogleWorkspaceMXExchange:
    Type: String
    Default: aspmx.l.google.com
    Description: "Google Workspace primary MX exchange"
  GoogleWorkspaceMXBackup1:
    Type: String
    Default: alt1.aspmx.l.google.com
    Description: "Google Workspace backup MX exchange 1"
  GoogleWorkspaceMXBackup2:
    Type: String
    Default: alt2.aspmx.l.google.com
    Description: "Google Workspace backup MX exchange 2"
  ZenDeskCNAMEValue:
    Type: String
    Default: zendesk1.theworld.org
    Description: "ZenDesk CNAME target value"
  CampaignMonitorCNAMEValue:
    Type: String
    Default: cm1.theworld.org
    Description: "Campaign Monitor CNAME target value"
  DKIMSelector1Value:
    Type: String
    Default: "v=DKIM1; h=sha256; k=rsa; p=MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA..."
    Description: "DKIM selector 1 TXT record value"
  DKIMSelector2Value:
    Type: String
    Default: "v=DKIM1; h=sha256; k=rsa; p=MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA..."
    Description: "DKIM selector 2 TXT record value"
  DKIMSelector3Value:
    Type: String
    Default: "v=DKIM1; h=sha256; k=rsa; p=MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA..."
    Description: "DKIM selector 3 TXT record value"
  ACMValidationRecord1Name:
    Type: String
    Default: _validation1.theworld.org.
    Description: "ACM validation CNAME record name (include trailing dot)"
  ACMValidationRecord1Value:
    Type: String
    Default: _acm-validation1.example.com.
    Description: "ACM validation CNAME record value (include trailing dot)"
  ACMValidationRecord2Name:
    Type: String
    Default: _validation2.theworld.org.
    Description: "ACM validation CNAME record name (include trailing dot)"
  ACMValidationRecord2Value:
    Type: String
    Default: _acm-validation2.example.com.
    Description: "ACM validation CNAME record value (include trailing dot)"
  ACMValidationRecord3Name:
    Type: String
    Default: _validation3.theworld.org.
    Description: "ACM validation CNAME record name (include trailing dot)"
  ACMValidationRecord3Value:
    Type: String
    Default: _acm-validation3.example.com.
    Description: "ACM validation CNAME record value (include trailing dot)"
  DomainVerificationCode1:
    Type: String
    Default: "google-site-verification=xxxxxxxxxxxxxxxxxxxxx"
    Description: "Domain verification TXT record value for Google Workspace"
  DomainVerificationCode2:
    Type: String
    Default: "MS=msXXXXXXXX"
    Description: "Domain verification TXT record value for Office 365"

Resources:
  # --------------------------------------------
  # Route53 Hosted Zone
  # --------------------------------------------
  Route53HostedZone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: !Ref DomainName
      HostedZoneConfig:
        Comment: !Sub "Hosted zone for ${DomainName} multi-environment web infrastructure"
      HostedZoneTags:
        - Key: Environment
          Value: Multi
        - Key: Service
          Value: DNS
        - Key: Domain
          Value: !Ref DomainName

  # --------------------------------------------
  # ALIAS Records for CloudFront
  # --------------------------------------------
  AliasRootCloudFront:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref Route53HostedZone
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        HostedZoneId: !Ref CloudFrontHostedZoneId
        DNSName: !Ref CloudFrontDomainName
        EvaluateTargetHealth: false

  AliasProdCloudFront:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref Route53HostedZone
      Name: !Sub "prod.${DomainName}"
      Type: A
      AliasTarget:
        HostedZoneId: !Ref CloudFrontHostedZoneId
        DNSName: !Ref CloudFrontDomainName
        EvaluateTargetHealth: false

  AliasStagCloudFront:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref Route53HostedZone
      Name: !Sub "stag.${DomainName}"
      Type: A
      AliasTarget:
        HostedZoneId: !Ref CloudFrontHostedZoneId
        DNSName: !Ref CloudFrontDomainName
        EvaluateTargetHealth: false

  # --------------------------------------------
  # CNAME Records for Application Load Balancers
  # --------------------------------------------
  CNAMEFrontendProd:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref Route53HostedZone
      Name: !Sub "fe-prod.${DomainName}"
      Type: CNAME
      TTL: 300
      ResourceRecords:
        - !Ref ProdFrontendALBDNS

  CNAMEFrontendStag:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref Route53HostedZone
      Name: !Sub "fe-stag.${DomainName}"
      Type: CNAME
      TTL: 300
      ResourceRecords:
        - !Ref StagFrontendALBDNS

  CNAMEWordPressProd:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref Route53HostedZone
      Name: !Sub "wp-prod.${DomainName}"
      Type: CNAME
      TTL: 300
      ResourceRecords:
        - !Ref ProdWordPressALBDNS

  CNAMEWordPressStag:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref Route53HostedZone
      Name: !Sub "wp-stag.${DomainName}"
      Type: CNAME
      TTL: 300
      ResourceRecords:
        - !Ref StagWordPressALBDNS

  CNAMEAdminProd:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref Route53HostedZone
      Name: !Sub "admin-prod.${DomainName}"
      Type: CNAME
      TTL: 300
      ResourceRecords:
        - !Ref ProdAdminALBDNS

  CNAMEAdminStag:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref Route53HostedZone
      Name: !Sub "admin-stag.${DomainName}"
      Type: CNAME
      TTL: 300
      ResourceRecords:
        - !Ref StagAdminALBDNS

  CNAMEAPIProd:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref Route53HostedZone
      Name: !Sub "api-prod.${DomainName}"
      Type: CNAME
      TTL: 300
      ResourceRecords:
        - !Ref ProdAPIALBDNS

  CNAMEAPIStag:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref Route53HostedZone
      Name: !Sub "api-stag.${DomainName}"
      Type: CNAME
      TTL: 300
      ResourceRecords:
        - !Ref StagAPIALBDNS

  CNAMEFeedProd:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref Route53HostedZone
      Name: !Sub "feed-prod.${DomainName}"
      Type: CNAME
      TTL: 300
      ResourceRecords:
        - !Ref ProdFeedALBDNS

  CNAMEFeedStag:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref Route53HostedZone
      Name: !Sub "feed-stag.${DomainName}"
      Type: CNAME
      TTL: 300
      ResourceRecords:
        - !Ref StagFeedALBDNS

  CNAMEProjectPagesProd:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref Route53HostedZone
      Name: !Sub "projects-prod.${DomainName}"
      Type: CNAME
      TTL: 300
      ResourceRecords:
        - !Ref ProdProjectPagesALBDNS

  CNAMEProjectPagesStag:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref Route53HostedZone
      Name: !Sub "projects-stag.${DomainName}"
      Type: CNAME
      TTL: 300
      ResourceRecords:
        - !Ref StagProjectPagesALBDNS

  CNAMEFileRepoProd:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref Route53HostedZone
      Name: !Sub "files-prod.${DomainName}"
      Type: CNAME
      TTL: 300
      ResourceRecords:
        - !Ref ProdFileRepoALBDNS

  CNAMEFileRepoStag:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref Route53HostedZone
      Name: !Sub "files-stag.${DomainName}"
      Type: CNAME
      TTL: 300
      ResourceRecords:
        - !Ref StagFileRepoALBDNS

  # --------------------------------------------
  # Combined MX Record for Email Routing
  # --------------------------------------------
  MXCombined:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref Route53HostedZone
      Name: !Ref DomainName
      Type: MX
      TTL: 3600
      ResourceRecords:
        - !Sub "0 ${Office365MXExchange}"
        - "10 smtp.mail.protection.outlook.com"
        - !Sub "5 ${GoogleWorkspaceMXExchange}"
        - !Sub "10 ${GoogleWorkspaceMXBackup1}"
        - !Sub "20 ${GoogleWorkspaceMXBackup2}"
        - "30 alt3.aspmx.l.google.com"
        - "40 alt4.aspmx.l.google.com"

  # --------------------------------------------
  # Combined TXT Record for Root Domain
  # --------------------------------------------
  TXTCombinedRoot:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref Route53HostedZone
      Name: !Ref DomainName
      Type: TXT
      TTL: 3600
      ResourceRecords:
        - !Sub "\"${SPFRecordValue}\""
        - !Sub "\"${DomainVerificationCode2}\""
        - !Sub "\"${DomainVerificationCode1}\""

  # --------------------------------------------
  # TXT Record for DMARC
  # --------------------------------------------
  TXTDMARC:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref Route53HostedZone
      Name: !Sub "_dmarc.${DomainName}"
      Type: TXT
      TTL: 3600
      ResourceRecords:
        - !Sub "\"${DMARCRecordValue}\""

  # --------------------------------------------
  # DKIM Records for Email Authentication
  # --------------------------------------------
  TXTDKIMSelector1:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref Route53HostedZone
      Name: !Sub "selector1._domainkey.${DomainName}"
      Type: TXT
      TTL: 3600
      ResourceRecords:
        - !Sub "\"${DKIMSelector1Value}\""

  TXTDKIMSelector2:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref Route53HostedZone
      Name: !Sub "selector2._domainkey.${DomainName}"
      Type: TXT
      TTL: 3600
      ResourceRecords:
        - !Sub "\"${DKIMSelector2Value}\""

  TXTDKIMSelector3:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref Route53HostedZone
      Name: !Sub "selector3._domainkey.${DomainName}"
      Type: TXT
      TTL: 3600
      ResourceRecords:
        - !Sub "\"${DKIMSelector3Value}\""

  # --------------------------------------------
  # CNAME Records for External Email/Marketing Services
  # --------------------------------------------
  CNAMEZenDesk:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref Route53HostedZone
      Name: !Sub "zendesk.${DomainName}"
      Type: CNAME
      TTL: 300
      ResourceRecords:
        - !Ref ZenDeskCNAMEValue

  CNAMEZenDeskAlt:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref Route53HostedZone
      Name: !Sub "zendesk2.${DomainName}"
      Type: CNAME
      TTL: 300
      ResourceRecords:
        - !Ref ZenDeskCNAMEValue

  CNAMECampaignMonitor:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref Route53HostedZone
      Name: !Sub "cm.${DomainName}"
      Type: CNAME
      TTL: 300
      ResourceRecords:
        - !Ref CampaignMonitorCNAMEValue

  CNAMECampaignMonitorAlt:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref Route53HostedZone
      Name: !Sub "cm2.${DomainName}"
      Type: CNAME
      TTL: 300
      ResourceRecords:
        - !Ref CampaignMonitorCNAMEValue

  # --------------------------------------------
  # ACM Validation CNAME Records
  # --------------------------------------------
  ACMValidationRecord1:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref Route53HostedZone
      Name: !Ref ACMValidationRecord1Name
      Type: CNAME
      TTL: 300
      ResourceRecords:
        - !Ref ACMValidationRecord1Value

  ACMValidationRecord2:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref Route53HostedZone
      Name: !Ref ACMValidationRecord2Name
      Type: CNAME
      TTL: 300
      ResourceRecords:
        - !Ref ACMValidationRecord2Value

  ACMValidationRecord3:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref Route53HostedZone
      Name: !Ref ACMValidationRecord3Name
      Type: CNAME
      TTL: 300
      ResourceRecords:
        - !Ref ACMValidationRecord3Value

Outputs:
  HostedZoneId:
    Description: "Route53 Hosted Zone ID"
    Value: !Ref Route53HostedZone
  HostedZoneNameServers:
    Description: "Name servers for the hosted zone"
    Value:
      Fn::Join:
        - ", "
        - !GetAtt Route53HostedZone.NameServers