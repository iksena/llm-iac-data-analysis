AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  AX Ripple Network — ECS Services Stack
  Task definitions, ECS services, ECR repos, service discovery entries.
  Deploys into the shared ECS cluster.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  VpcId:
    Type: String
  PrivateSubnetIds:
    Type: CommaDelimitedList
  RippledPeerSGId:
    Type: String
  RippledAPISGId:
    Type: String
  ECSClusterArn:
    Type: String
    Description: Shared ECS Cluster ARN
  ECSTaskExecutionRoleArn:
    Type: String
    Description: Shared ECS Task Execution Role ARN
  ServiceDiscoveryNamespaceId:
    Type: String
    Description: Shared Service Discovery namespace ID
  ValidatorImage:
    Type: String
    Description: ECR image URI for validator containers
  ApiNodeImage:
    Type: String
    Description: ECR image URI for API node containers
  ValidatorDesiredCount:
    Type: Number
    Default: 3
  ApiNodeDesiredCount:
    Type: Number
    Default: 2
  TaskCpu:
    Type: String
    Default: "1024"
  TaskMemory:
    Type: String
    Default: "2048"
  # ValidatorPublicKeys is stored in Secrets Manager:
  #   ax-ripple-<env>/validator-public-keys
  # and injected into containers via ECS Secrets — NOT passed as a parameter.

Resources:
  # ===========================================================================
  # NOTE: ECR Repositories are managed OUTSIDE CloudFormation
  # They are created by the bootstrap workflow (003_scripts/create-ecr-repos.sh)
  # or manually via AWS CLI. This prevents delete/recreate conflicts when
  # images already exist in the repos.
  # ===========================================================================

  # ===========================================================================
  # CloudWatch Log Groups
  # ===========================================================================
  ValidatorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/ax-ripple-${Environment}/validator"
      RetentionInDays: 30

  ApiNodeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/ax-ripple-${Environment}/api-node"
      RetentionInDays: 30

  # ===========================================================================
  # Service Discovery Entries (into shared namespace)
  # ===========================================================================
  ValidatorServiceDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: ripple-validator
      NamespaceId: !Ref ServiceDiscoveryNamespaceId
      DnsConfig:
        RoutingPolicy: MULTIVALUE
        DnsRecords:
          - Type: A
            TTL: 10
      HealthCheckCustomConfig:
        FailureThreshold: 1

  ApiNodeServiceDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: ripple-api
      NamespaceId: !Ref ServiceDiscoveryNamespaceId
      DnsConfig:
        RoutingPolicy: MULTIVALUE
        DnsRecords:
          - Type: A
            TTL: 10
      HealthCheckCustomConfig:
        FailureThreshold: 1

  # ===========================================================================
  # IAM — Ripple-specific task role
  # ===========================================================================
  RippledTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "ax-ripple-${Environment}-rippled-task"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RippledTaskPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "arn:aws:s3:::ax-ripple-${Environment}-configs/*"

  # ===========================================================================
  # Task Definitions — Validators (3 separate, each with unique seed)
  # VALIDATOR_PUBLIC_KEYS and VALIDATOR_TOKEN both come from Secrets Manager.
  # ===========================================================================
  Validator1TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "ax-ripple-${Environment}-validator-1"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      ExecutionRoleArn: !Ref ECSTaskExecutionRoleArn
      TaskRoleArn: !GetAtt RippledTaskRole.Arn
      ContainerDefinitions:
        - Name: rippled-validator
          Image: !Ref ValidatorImage
          Essential: true
          PortMappings:
            - ContainerPort: 51235
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ValidatorLogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: validator-1
          HealthCheck:
            Command: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/51235' 2>/dev/null || exit 1"]
            Interval: 15
            Timeout: 5
            Retries: 5
            StartPeriod: 60
          Environment:
            - Name: RIPPLED_ROLE
              Value: validator
            - Name: ENVIRONMENT
              Value: !Ref Environment
            - Name: NETWORK_ID
              Value: "10000"
            - Name: PEER_IPS
              Value: !Sub "ripple-validator.${Environment}.local 51235,ripple-api.${Environment}.local 51235"
          Secrets:
            - Name: VALIDATOR_TOKEN
              ValueFrom: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:ax-ripple-${Environment}/validator-seed"
            - Name: VALIDATOR_PUBLIC_KEYS
              ValueFrom: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:ax-ripple-${Environment}/validator-public-keys"

  Validator2TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "ax-ripple-${Environment}-validator-2"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      ExecutionRoleArn: !Ref ECSTaskExecutionRoleArn
      TaskRoleArn: !GetAtt RippledTaskRole.Arn
      ContainerDefinitions:
        - Name: rippled-validator
          Image: !Ref ValidatorImage
          Essential: true
          PortMappings:
            - ContainerPort: 51235
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ValidatorLogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: validator-2
          HealthCheck:
            Command: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/51235' 2>/dev/null || exit 1"]
            Interval: 15
            Timeout: 5
            Retries: 5
            StartPeriod: 60
          Environment:
            - Name: RIPPLED_ROLE
              Value: validator
            - Name: ENVIRONMENT
              Value: !Ref Environment
            - Name: NETWORK_ID
              Value: "10000"
            - Name: PEER_IPS
              Value: !Sub "ripple-validator.${Environment}.local 51235,ripple-api.${Environment}.local 51235"
          Secrets:
            - Name: VALIDATOR_TOKEN
              ValueFrom: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:ax-ripple-${Environment}/validator-seed-2"
            - Name: VALIDATOR_PUBLIC_KEYS
              ValueFrom: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:ax-ripple-${Environment}/validator-public-keys"

  Validator3TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "ax-ripple-${Environment}-validator-3"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      ExecutionRoleArn: !Ref ECSTaskExecutionRoleArn
      TaskRoleArn: !GetAtt RippledTaskRole.Arn
      ContainerDefinitions:
        - Name: rippled-validator
          Image: !Ref ValidatorImage
          Essential: true
          PortMappings:
            - ContainerPort: 51235
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ValidatorLogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: validator-3
          HealthCheck:
            Command: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/51235' 2>/dev/null || exit 1"]
            Interval: 15
            Timeout: 5
            Retries: 5
            StartPeriod: 60
          Environment:
            - Name: RIPPLED_ROLE
              Value: validator
            - Name: ENVIRONMENT
              Value: !Ref Environment
            - Name: NETWORK_ID
              Value: "10000"
            - Name: PEER_IPS
              Value: !Sub "ripple-validator.${Environment}.local 51235,ripple-api.${Environment}.local 51235"
          Secrets:
            - Name: VALIDATOR_TOKEN
              ValueFrom: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:ax-ripple-${Environment}/validator-seed-3"
            - Name: VALIDATOR_PUBLIC_KEYS
              ValueFrom: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:ax-ripple-${Environment}/validator-public-keys"

  # ===========================================================================
  # Task Definition — API Node
  # VALIDATOR_PUBLIC_KEYS comes from Secrets Manager (same secret, all nodes)
  # ===========================================================================
  ApiNodeTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "ax-ripple-${Environment}-api-node"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      ExecutionRoleArn: !Ref ECSTaskExecutionRoleArn
      TaskRoleArn: !GetAtt RippledTaskRole.Arn
      ContainerDefinitions:
        - Name: rippled-api
          Image: !Ref ApiNodeImage
          Essential: true
          PortMappings:
            - ContainerPort: 51234
              Protocol: tcp
            - ContainerPort: 6006
              Protocol: tcp
            - ContainerPort: 51235
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApiNodeLogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: api-node
          HealthCheck:
            Command: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/51234' 2>/dev/null || exit 1"]
            Interval: 15
            Timeout: 5
            Retries: 5
            StartPeriod: 60
          Environment:
            - Name: RIPPLED_ROLE
              Value: api
            - Name: ENVIRONMENT
              Value: !Ref Environment
            - Name: NETWORK_ID
              Value: "10000"
            - Name: PEER_IPS
              Value: !Sub "ripple-validator.${Environment}.local 51235,ripple-api.${Environment}.local 51235"
          Secrets:
            - Name: VALIDATOR_PUBLIC_KEYS
              ValueFrom: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:ax-ripple-${Environment}/validator-public-keys"

  # ===========================================================================
  # ECS Services — Validators (one service per validator for unique seeds)
  # ===========================================================================
  Validator1Service:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub "ax-ripple-${Environment}-validator-1"
      Cluster: !Ref ECSClusterArn
      TaskDefinition: !Ref Validator1TaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Ref PrivateSubnetIds
          SecurityGroups:
            - !Ref RippledPeerSGId
      ServiceRegistries:
        - RegistryArn: !GetAtt ValidatorServiceDiscovery.Arn
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
      EnableExecuteCommand: true

  Validator2Service:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub "ax-ripple-${Environment}-validator-2"
      Cluster: !Ref ECSClusterArn
      TaskDefinition: !Ref Validator2TaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Ref PrivateSubnetIds
          SecurityGroups:
            - !Ref RippledPeerSGId
      ServiceRegistries:
        - RegistryArn: !GetAtt ValidatorServiceDiscovery.Arn
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
      EnableExecuteCommand: true

  Validator3Service:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub "ax-ripple-${Environment}-validator-3"
      Cluster: !Ref ECSClusterArn
      TaskDefinition: !Ref Validator3TaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Ref PrivateSubnetIds
          SecurityGroups:
            - !Ref RippledPeerSGId
      ServiceRegistries:
        - RegistryArn: !GetAtt ValidatorServiceDiscovery.Arn
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
      EnableExecuteCommand: true

  # ===========================================================================
  # ECS Service — API Nodes
  # ===========================================================================
  ApiNodeService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub "ax-ripple-${Environment}-api-nodes"
      Cluster: !Ref ECSClusterArn
      TaskDefinition: !Ref ApiNodeTaskDefinition
      DesiredCount: !Ref ApiNodeDesiredCount
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Ref PrivateSubnetIds
          SecurityGroups:
            - !Ref RippledPeerSGId
            - !Ref RippledAPISGId
      ServiceRegistries:
        - RegistryArn: !GetAtt ApiNodeServiceDiscovery.Arn
      DeploymentConfiguration:
        MinimumHealthyPercent: 50
        MaximumPercent: 200
      EnableExecuteCommand: true

Outputs:
  ApiNodeServiceName:
    Description: API Node ECS Service Name
    Value: !GetAtt ApiNodeService.Name
    Export:
      Name: !Sub "${AWS::StackName}-ApiNodeServiceName"

  ApiNodeDiscoveryEndpoint:
    Description: DNS endpoint for API nodes
    Value: !Sub "ripple-api.${Environment}.local"
    Export:
      Name: !Sub "${AWS::StackName}-ApiNodeDiscoveryEndpoint"