AWSTemplateFormatVersion: '2010-09-09'
Resources:
  GraphQLApi:
    Type: AWS::AppSync::GraphQLApi
    Properties:
      Name: WS-API
      AuthenticationType: API_KEY
      SchemaDefinition: |
        type Channel {
          name: String!
          data: AWSJSON!
        }
        type Query {
          getChannel(name: String!): Channel
        }
        type Mutation {
          publish2channel(name: String!, data: AWSJSON!): Channel
        }
        type Subscription {
          subscribe2channel(name: String!): Channel @aws_subscribe(mutations: ["publish2channel"])
        }
        schema {
          query: Query
          mutation: Mutation
          subscription: Subscription
        }
  ApiKey:
    Type: AWS::AppSync::ApiKey
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      Description: Default API key for WS-API
  DataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      Name: pubsub
      Type: NONE
  Resolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      TypeName: Mutation
      FieldName: publish2channel
      DataSourceName: !GetAtt DataSource.Name
      Kind: UNIT
      RequestMappingTemplate: |
        $util.toJson($context.arguments)
      ResponseMappingTemplate: |
        $util.toJson($context.result)
Outputs:
  GraphQLUrl:
    Value: !GetAtt GraphQLApi.GraphQLUrl
  ApiKey:
    Value: !GetAtt ApiKey.ApiKey
  ApiId:
    Value: !GetAtt GraphQLApi.ApiId
  Region:
    Value: !Ref "AWS::Region"