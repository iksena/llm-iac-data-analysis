AWSTemplateFormatVersion: 2010-09-09
Description: "Desafio DevOps 02 - CloudFormation Intermediario: Fluxo S3 -> Lambda -> SNS processando vendas CSV."

Parameters:
  BucketName:
    Type: String
    Description: Nome do bucket S3 para upload dos arquivos CSV

  NotificationEmail:
    Type: String
    Description: Endereço de e-mail que receberá as notificações do SNS

Mappings:
  Naming:
    us-east-1:
      Prefix: us
    eu-west-1:
      Prefix: eu

Resources:
  ###############################################################
  # S3 Bucket
  ###############################################################
  S3Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      BucketName: !Ref BucketName
      NotificationConfiguration:
        LambdaConfigurations:
          - Function: !GetAtt Lambda.Arn
            Event: "s3:ObjectCreated:*"
    DependsOn: AllowS3InvokeLambda

  ###############################################################
  # SNS Topic
  ###############################################################
  SnsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "desafio-devops-02-sns-${AWS::AccountId}-${AWS::Region}"

  ###############################################################
  # SNS Subscription (Email)
  ###############################################################
  SnsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: email
      Endpoint: !Ref NotificationEmail
      TopicArn: !Ref SnsTopic

  ###############################################################
  # IAM Role para Lambda
  ###############################################################
  LambdaRole:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: !Sub "desafio-devops-02-role-${AWS::AccountId}-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: LambdaAccessPolicies
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref SnsTopic
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "arn:aws:s3:::${BucketName}/*"

  ###############################################################
  # Lambda Function
  ###############################################################
  Lambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub
        - "desafio-devops-02-lambda-${Prefix}"
        - Prefix: !FindInMap
            - Naming
            - !Ref AWS::Region
            - Prefix
      Runtime: python3.13
      Role: !GetAtt LambdaRole.Arn
      Handler: index.lambda_handler
      Timeout: 15
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref SnsTopic
      Code:
        ZipFile: |
          import json
          import urllib.parse
          import boto3
          import csv
          import os

          s3 = boto3.client("s3")
          sns = boto3.client("sns")

          def lambda_handler(event, context):
              record = event["Records"][0]
              bucket = record["s3"]["bucket"]["name"]
              key = urllib.parse.unquote_plus(record["s3"]["object"]["key"])

              print(f"Arquivo recebido: {key} no bucket {bucket}")

              response = s3.get_object(Bucket=bucket, Key=key)
              content = response["Body"].read().decode("utf-8").splitlines()

              reader = csv.DictReader(content)

              total_sales = 0
              total_amount = 0.0

              for row in reader:
                  total_sales += 1
                  total_amount += float(row["amount"])

              message = f'''
                  ✅ Arquivo de vendas processado com sucesso

                  Bucket: {bucket}
                  Arquivo: {key}

                  Total de vendas: {total_sales}
                  Valor total vendido: R$ {total_amount:.2f}
                  '''
              sns.publish(
                  TopicArn=os.environ["SNS_TOPIC_ARN"],
                  Subject="Resumo de vendas processadas",
                  Message=message
              )

              return {
                  "statusCode": 200,
                  "body": json.dumps("Processamento concluído")
              }
      Description: "Lambda que processa arquivos CSV de vendas e publica resumo no SNS."
      TracingConfig:
        Mode: Active

  ###############################################################
  # Permissão S3 → Lambda
  ###############################################################
  AllowS3InvokeLambda:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Lambda
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com

###############################################################
# Outputs
###############################################################
Outputs:
  BucketName:
    Description: "Nome do bucket que recebe os arquivos"
    Value: !Ref S3Bucket

  LambdaArn:
    Description: "ARN da Lambda acionada pelos uploads"
    Value: !GetAtt Lambda.Arn

  SnsTopicArn:
    Description: "ARN do tópico SNS utilizado para notificações"
    Value: !Ref SnsTopic