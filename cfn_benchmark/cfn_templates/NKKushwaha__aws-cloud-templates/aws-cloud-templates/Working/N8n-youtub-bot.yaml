AWSTemplateFormatVersion: '2010-09-09'
Description: 'n8n youtube bot EC2 with CloudWatch Agent (Disk/Mem/CPU Metrics), SSH, Logging, and Scheduled Start/Stop'

Parameters:
  ProjectName:
    Description: Prefix for all resources so you can find them easily.
    Type: String
    Default: "n8n-youtube-bot"

  KeyName:
    Description: Name of your existing EC2 KeyPair (Required for SSH)
    Type: AWS::EC2::KeyPair::KeyName

  MyIP:
    Description: Your Public IP to restrict SSH access (Search 'what is my ip' and add /32)
    Type: String
    Default: 0.0.0.0/0

  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.micro, t3.small, t3.medium]
    Description: EC2 Instance Type

  # --- Schedule Configuration ---
  Timezone:
    Type: String
    Default: "Asia/Kolkata"
    Description: Timezone for scheduled start/stop
  StartTime1:
    Type: String
    Default: "cron(0 9 * * ? *)"
    Description: Schedule to start the instance (UTC)
  StartState1:
    Type: String
    Default: "ENABLED"
    Description: State of the first start schedule
    AllowedValues: [ "ENABLED", "DISABLED" ]
  StopTime1:
    Type: String
    Default: "cron(0 12 * * ? *)"
    Description: Schedule to stop the instance (UTC)
  StopState1:
    Type: String
    Default: "ENABLED"
    Description: State of the first stop schedule
    AllowedValues: [ "ENABLED", "DISABLED" ]
  StartTime2:
    Type: String
    Default: "cron(0 18 * * ? *)"
    Description: Schedule to start the instance (UTC)
  StartState2:
    Type: String
    Default: "ENABLED"
    Description: State of the second start schedule
    AllowedValues: [ "ENABLED", "DISABLED" ]
  StopTime2:
    Type: String
    Default: "cron(0 21 * * ? *)"
    Description: Schedule to stop the instance (UTC)
  StopState2:
    Type: String
    Default: "ENABLED"
    Description: State of the second stop schedule
    AllowedValues: [ "ENABLED", "DISABLED" ]

Resources:
  # -------------------------------------------------------------------------
  # 1. CloudWatch Log Group
  # -------------------------------------------------------------------------
  N8nLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/ec2/${ProjectName}"
      RetentionInDays: 7

  # -------------------------------------------------------------------------
  # 2. IAM Role (UPDATED for Metrics)
  # -------------------------------------------------------------------------
  N8nInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Policies:
        - PolicyName: N8nSpecificAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: "*"
              - Effect: Allow
                Action: ec2:StopInstances
                Resource: "*"
                Condition:
                  StringEquals:
                    "aws:ResourceTag/Project": !Ref ProjectName
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt N8nLogGroup.Arn

  N8nInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "${ProjectName}-profile"
      Roles: [ !Ref N8nInstanceRole ]

  # -------------------------------------------------------------------------
  # 3. Security Group
  # -------------------------------------------------------------------------
  N8nSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "Firewall for ${ProjectName}"
      GroupName: !Sub "${ProjectName}-firewall"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref MyIP
          Description: SSH Access
        - IpProtocol: tcp
          FromPort: 5678
          ToPort: 5678
          CidrIp: !Ref MyIP
          Description: n8n Web UI
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-firewall"

  # -------------------------------------------------------------------------
  # 4. EC2 Instance (UPDATED UserData)
  # -------------------------------------------------------------------------
  N8nInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: 'resolve:ssm:/aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id'
      KeyName: !Ref KeyName
      IamInstanceProfile: !Ref N8nInstanceProfile
      SecurityGroupIds: [ !Ref N8nSecurityGroup ]
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-server"
        - Key: Project
          Value: !Ref ProjectName
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          # ----------------------------------------
          # 1. Install Docker & Compose
          # ----------------------------------------
          apt-get update -y
          apt-get install -y ca-certificates curl gnupg
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
          chmod a+r /etc/apt/keyrings/docker.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu \
          $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
          apt-get update -y
          apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
          usermod -aG docker ubuntu

          # ----------------------------------------
          # 2. Install & Configure CloudWatch Agent (Metrics)
          # ----------------------------------------
          wget https://s3.amazonaws.com/amazoncloudwatch-agent/ubuntu/amd64/latest/amazon-cloudwatch-agent.deb
          dpkg -i -E ./amazon-cloudwatch-agent.deb

          # Create Config for Memory, Disk, and CPU
          # Note: We use ${!aws:InstanceId} to escape the variable so CloudFormation ignores it
          cat <<EOF > /opt/aws/amazon-cloudwatch-agent/bin/config.json
          {
            "agent": {
              "metrics_collection_interval": 60,
              "run_as_user": "root"
            },
            "metrics": {
              "append_dimensions": {
                "InstanceId": "${!aws:InstanceId}"
              },
              "metrics_collected": {
                "disk": {
                  "measurement": ["used_percent"],
                  "metrics_collection_interval": 60,
                  "resources": ["/"]
                },
                "mem": {
                  "measurement": ["mem_used_percent"],
                  "metrics_collection_interval": 60
                },
                "cpu": {
                  "measurement": ["cpu_usage_active"],
                  "metrics_collection_interval": 60,
                  "totalcpu": true
                }
              }
            }
          }
          EOF

          # Start the Agent
          /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -c file:/opt/aws/amazon-cloudwatch-agent/bin/config.json -s

          # ----------------------------------------
          # 3. Setup n8n
          # ----------------------------------------
          mkdir -p /home/ubuntu/n8n
          chown ubuntu:ubuntu /home/ubuntu/n8n
          cd /home/ubuntu/n8n

          TOKEN=`curl -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 21600"`
          PUBLIC_IP=`curl -H "X-aws-ec2-metadata-token: $TOKEN" -v http://169.254.169.254/latest/meta-data/public-ipv4`
          INSTANCE_ID=`curl -H "X-aws-ec2-metadata-token: $TOKEN" -v http://169.254.169.254/latest/meta-data/instance-id`

          cat <<EOF > docker-compose.yml
          services:
            n8n:
              image: n8nio/n8n:latest
              restart: always
              ports:
                - "5678:5678"
              environment:
                - N8N_HOST=$PUBLIC_IP
                - WEBHOOK_URL=http://$PUBLIC_IP:5678/
                - GENERIC_TIMEZONE=${Timezone}
                - N8N_SECURE_COOKIE=false
              volumes:
                - n8n_data:/home/node/.n8n
              logging:
                driver: awslogs
                options:
                  awslogs-region: ${AWS::Region}
                  awslogs-group: /aws/ec2/${ProjectName}
                  awslogs-stream: n8n-container-$INSTANCE_ID
          volumes:
            n8n_data:
          EOF

          docker compose up -d

  # -------------------------------------------------------------------------
  # 5. Schedules
  # -------------------------------------------------------------------------
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-scheduler-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StartStopEC2
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ 'ec2:StartInstances', 'ec2:StopInstances' ]
                Resource: !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/${N8nInstance}"

  ScheduleStart1:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${ProjectName}-wake-morning"
      ScheduleExpression: !Ref StartTime1
      State: !Ref StartState1
      ScheduleExpressionTimezone: !Ref Timezone
      FlexibleTimeWindow: { Mode: "OFF" }
      Target: { Arn: "arn:aws:scheduler:::aws-sdk:ec2:startInstances", RoleArn: !GetAtt SchedulerRole.Arn, Input: !Sub '{"InstanceIds": ["${N8nInstance}"]}' }

  ScheduleStop1:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${ProjectName}-sleep-morning"
      ScheduleExpression: !Ref StopTime1
      State: !Ref StopState1
      ScheduleExpressionTimezone: !Ref Timezone
      FlexibleTimeWindow: { Mode: "OFF" }
      Target: { Arn: "arn:aws:scheduler:::aws-sdk:ec2:stopInstances", RoleArn: !GetAtt SchedulerRole.Arn, Input: !Sub '{"InstanceIds": ["${N8nInstance}"]}' }

  ScheduleStart2:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${ProjectName}-wake-evening"
      ScheduleExpression: !Ref StartTime2
      State: !Ref StartState2
      ScheduleExpressionTimezone: !Ref Timezone
      FlexibleTimeWindow: { Mode: "OFF" }
      Target: { Arn: "arn:aws:scheduler:::aws-sdk:ec2:startInstances", RoleArn: !GetAtt SchedulerRole.Arn, Input: !Sub '{"InstanceIds": ["${N8nInstance}"]}' }

  ScheduleStop2:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${ProjectName}-sleep-evening"
      ScheduleExpression: !Ref StopTime2
      State: !Ref StopState2
      ScheduleExpressionTimezone: !Ref Timezone
      FlexibleTimeWindow: { Mode: "OFF" }
      Target: { Arn: "arn:aws:scheduler:::aws-sdk:ec2:stopInstances", RoleArn: !GetAtt SchedulerRole.Arn, Input: !Sub '{"InstanceIds": ["${N8nInstance}"]}' }

Outputs:
  N8nUrl:
    Value: !Sub "http://${N8nInstance.PublicIp}:5678"
  LogGroup:
    Value: !Ref N8nLogGroup