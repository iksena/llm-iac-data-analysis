#
# BLOG SAMPLE NOTICE: This template is designed for educational purposes.
# Some configurations are intentionally simplified for the blog sample:
# - ALB uses HTTP (no TLS) since no custom domain/ACM certificate is available
# - ALB Security Group allows 0.0.0.0/0 inbound on port 80 for public access
# - RDS uses single-AZ, no backups, no deletion protection for easy cleanup
# - App/ALB security groups allow open egress for NAT Gateway and AWS service access
# - SNS topic encryption removed: CloudWatch Alarms cannot publish to
#   SNS topics encrypted with aws/sns KMS key without a custom key policy
# These should NOT be used as-is in production environments.
#
# Third-party dependencies (installed via npm in UserData):
#   express (MIT), mysql2 (MIT), @aws-sdk/* (Apache-2.0)
# Python standard library used in Lambda: urllib3 (MIT, bundled with Python)
AWSTemplateFormatVersion: '2010-09-09'
Description: 'Automated Network Incident Response with AWS DevOps Agent - Blog Infrastructure. Deploys a 3-tier application (ALB, EC2, RDS) with S3 buckets, Bedrock interface endpoint, VPC gateway endpoint, and CloudWatch alarms wired to DevOps Agent via SNS/Lambda webhook for 4 scenarios covering security groups, route tables, VPC endpoint policies, and interface endpoints.'

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Network Configuration"
        Parameters:
          - VpcCIDR
          - PublicSubnet1CIDR
          - PublicSubnet2CIDR
          - PrivateSubnet1CIDR
          - PrivateSubnet2CIDR
      - Label:
          default: "Application Configuration"
        Parameters:
          - LatestAmiId
      - Label:
          default: "Resource Configuration"
        Parameters:
          - ResourcePrefix

Parameters:
  VpcCIDR:
    Description: CIDR block for the VPC
    Type: String
    Default: 10.0.0.0/16

  PublicSubnet1CIDR:
    Description: CIDR block for Public Subnet 1
    Type: String
    Default: 10.0.1.0/24

  PublicSubnet2CIDR:
    Description: CIDR block for Public Subnet 2
    Type: String
    Default: 10.0.2.0/24

  PrivateSubnet1CIDR:
    Description: CIDR block for Private Subnet 1
    Type: String
    Default: 10.0.11.0/24

  PrivateSubnet2CIDR:
    Description: CIDR block for Private Subnet 2
    Type: String
    Default: 10.0.12.0/24

  LatestAmiId:
    Description: Latest Amazon Linux 2023 AMI ID
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

  ResourcePrefix:
    Description: Prefix for all resource names
    Type: String
    Default: devops-agent-sample-app

Resources:

  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCIDR
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub '${ResourcePrefix}-VPC'
        - Key: Module
          Value: Module1-SecurityGroup

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${ResourcePrefix}-IGW'

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet1CIDR
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${ResourcePrefix}-Public-Subnet-1'

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet2CIDR
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${ResourcePrefix}-Public-Subnet-2'

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnet1CIDR
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${ResourcePrefix}-Private-Subnet-1'

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnet2CIDR
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${ResourcePrefix}-Private-Subnet-2'

  NATGatewayEIP:
    Type: AWS::EC2::EIP
    DependsOn: AttachGateway
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${ResourcePrefix}-NAT-EIP'

  NATGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NATGatewayEIP.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub '${ResourcePrefix}-NAT-Gateway'

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${ResourcePrefix}-Public-RT'

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${ResourcePrefix}-Private-RT'

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NATGateway

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  FlowLogsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: vpc-flow-logs.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudWatchLogPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                Resource: !GetAtt FlowLogsLogGroup.Arn
      Tags:
        - Key: Name
          Value: !Sub '${ResourcePrefix}-FlowLogs-Role'

  FlowLogsLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      RetentionInDays: 7

  VPCFlowLog:
    Type: AWS::EC2::FlowLog
    Properties:
      ResourceType: VPC
      ResourceId: !Ref VPC
      TrafficType: ALL
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Ref FlowLogsLogGroup
      DeliverLogsPermissionArn: !GetAtt FlowLogsRole.Arn
      Tags:
        - Key: Name
          Value: !Sub '${ResourcePrefix}-VPC-FlowLog'

  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${ResourcePrefix}-ALB-SG'
      GroupDescription: Security group for Application Load Balancer
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: Allow HTTP from internet
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic
      Tags:
        - Key: Name
          Value: !Sub '${ResourcePrefix}-ALB-SG'

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${ResourcePrefix}-App-SG'
      GroupDescription: Security group for Application Servers
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref ALBSecurityGroup
          Description: Allow HTTP from ALB
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: Allow HTTPS for AWS services via NAT Gateway and VPC endpoints
      Tags:
        - Key: Name
          Value: !Sub '${ResourcePrefix}-App-SG'

  AppToDBEgressRule:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref AppSecurityGroup
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      DestinationSecurityGroupId: !Ref DBSecurityGroup
      Description: Allow MySQL to RDS

  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${ResourcePrefix}-DB-SG'
      GroupDescription: Security group for RDS Database
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref AppSecurityGroup
          Description: Allow MySQL from App Servers
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCIDR
          Description: Allow HTTPS within VPC
      Tags:
        - Key: Name
          Value: !Sub '${ResourcePrefix}-DB-SG'
        - Key: Protected
          Value: 'true'

  EC2Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: AppServerPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:${ResourcePrefix}-*'
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: '*'
                Condition:
                  StringEquals:
                    cloudwatch:namespace: DevOpsAgentSample
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock-runtime:InvokeModel
                Resource:
                  - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-haiku-4-5-20251001-v1:0'
                  - !Sub 'arn:aws:bedrock:*::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0'
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  - !Sub 'arn:aws:s3:::${ResourcePrefix}-prod-app-data-${AWS::AccountId}'
                  - !Sub 'arn:aws:s3:::${ResourcePrefix}-prod-app-data-${AWS::AccountId}/*'
                  - !Sub 'arn:aws:s3:::${ResourcePrefix}-prod-config-${AWS::AccountId}'
                  - !Sub 'arn:aws:s3:::${ResourcePrefix}-prod-config-${AWS::AccountId}/*'
                  - !Sub 'arn:aws:s3:::${ResourcePrefix}-data-lake-raw-${AWS::AccountId}'
                  - !Sub 'arn:aws:s3:::${ResourcePrefix}-data-lake-raw-${AWS::AccountId}/*'
                  - !Sub 'arn:aws:s3:::${ResourcePrefix}-ml-models-${AWS::AccountId}'
                  - !Sub 'arn:aws:s3:::${ResourcePrefix}-ml-models-${AWS::AccountId}/*'
                  - !Sub 'arn:aws:s3:::${ResourcePrefix}-backup-archive-${AWS::AccountId}'
                  - !Sub 'arn:aws:s3:::${ResourcePrefix}-backup-archive-${AWS::AccountId}/*'
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref DBSecret
      Tags:
        - Key: Name
          Value: !Sub '${ResourcePrefix}-EC2-Role'

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref EC2Role

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${ResourcePrefix}-ALB'
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub '${ResourcePrefix}-ALB'

  ALBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${ResourcePrefix}-TG'
      Port: 80
      Protocol: HTTP
      VpcId: !Ref VPC
      HealthCheckEnabled: true
      HealthCheckPath: /ping
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      TargetType: instance
      Tags:
        - Key: Name
          Value: !Sub '${ResourcePrefix}-TG'

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ALBTargetGroup

  AppServerLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub '${ResourcePrefix}-App-Template'
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: t3.micro
        IamInstanceProfile:
          Arn: !GetAtt EC2InstanceProfile.Arn
        MetadataOptions:
          HttpTokens: required
          HttpEndpoint: enabled
        SecurityGroupIds:
          - !Ref AppSecurityGroup
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub '${ResourcePrefix}-App-Server'
        UserData:
          Fn::Base64:
            Fn::Sub:
              - |
                #!/bin/bash
                set -e

                # Update system
                dnf update -y

                # Install Node.js and dependencies
                dnf install -y nodejs npm mariadb105

                # Create application directory
                mkdir -p /opt/webapp
                cd /opt/webapp

                # Create package.json
                cat > package.json << 'PACKAGE_EOF'
                {
                  "name": "devops-agent-demo-app",
                  "version": "1.0.0",
                  "description": "Demo app for DevOps Agent Sample App",
                  "main": "server.js",
                  "dependencies": {
                    "express": "^4.18.2",
                    "mysql2": "^3.6.0",
                    "@aws-sdk/client-s3": "^3.400.0",
                    "@aws-sdk/client-cloudwatch": "^3.400.0",
                    "@aws-sdk/client-bedrock-runtime": "^3.400.0"
                  }
                }
                PACKAGE_EOF

                # Install dependencies
                npm install

                # Create application server
                cat > server.js << 'SERVER_EOF'
                const express = require('express');
                const mysql = require('mysql2/promise');
                const { S3Client, ListObjectsV2Command } = require('@aws-sdk/client-s3');
                const { CloudWatchClient, PutMetricDataCommand } = require('@aws-sdk/client-cloudwatch');
                const { BedrockRuntimeClient, InvokeModelCommand } = require('@aws-sdk/client-bedrock-runtime');

                const app = express();
                const PORT = 80;
                const REGION = '${AWSRegion}';
                const STACK_NAME = '${StackName}';
                const BEDROCK_MODEL_ID = 'us.anthropic.claude-haiku-4-5-20251001-v1:0';

                const s3 = new S3Client({ region: REGION });
                const cw = new CloudWatchClient({ region: REGION });
                const bedrock = new BedrockRuntimeClient({ region: REGION });

                const S3_BUCKETS = [
                  '${ProdAppDataBucket}',
                  '${ProdConfigBucket}',
                  '${DataLakeRawBucket}',
                  '${MLModelsBucket}',
                  '${BackupArchiveBucket}'
                ];

                const dbCreds = JSON.parse(require('fs').readFileSync('/opt/webapp/db-creds.json', 'utf8'));

                const dbConfig = {
                  host: '${DBEndpoint}',
                  user: dbCreds.username,
                  password: dbCreds.password,
                  database: 'sampleapp',
                  connectTimeout: 3000,
                  timeout: 3000
                };

                let dbStatus = { connected: false, lastCheck: null, error: null };
                let s3Status = {};
                S3_BUCKETS.forEach(b => { s3Status[b] = { accessible: false, lastCheck: null, error: null }; });
                let quoteStatus = { quote: 'Loading...', accessible: true, lastCheck: null, error: null };
                let extStatus = { accessible: true, lastCheck: null, error: null };

                async function checkDatabase() {
                  try {
                    const connPromise = mysql.createConnection(dbConfig).then(async (connection) => {
                      await connection.ping();
                      await connection.end();
                    });
                    await Promise.race([connPromise, new Promise((_, reject) => setTimeout(() => reject(new Error('Connection timeout')), 4000))]);
                    dbStatus = { connected: true, lastCheck: new Date().toISOString(), error: null };
                  } catch (error) {
                    dbStatus = { connected: false, lastCheck: new Date().toISOString(), error: error.message };
                  }
                  try {
                    await cw.send(new PutMetricDataCommand({
                      Namespace: 'DevOpsAgentSample',
                      MetricData: [{
                        MetricName: 'DatabaseConnectionFailures',
                        Value: dbStatus.connected ? 0 : 1,
                        Unit: 'Count',
                        Dimensions: [{ Name: 'StackName', Value: STACK_NAME }]
                      }]
                    }));
                  } catch (e) { console.error('Failed to publish DB metric:', e.message); }
                }

                async function checkS3Buckets() {
                  let failCount = 0;
                  for (const bucket of S3_BUCKETS) {
                    try {
                      await s3.send(new ListObjectsV2Command({ Bucket: bucket, MaxKeys: 1 }));
                      s3Status[bucket] = { accessible: true, lastCheck: new Date().toISOString(), error: null };
                    } catch (error) {
                      failCount++;
                      s3Status[bucket] = { accessible: false, lastCheck: new Date().toISOString(), error: error.name || error.message };
                    }
                  }
                  try {
                    await cw.send(new PutMetricDataCommand({
                      Namespace: 'DevOpsAgentSample',
                      MetricData: [{
                        MetricName: 'S3BucketAccessFailures',
                        Value: failCount,
                        Unit: 'Count',
                        Dimensions: [{ Name: 'StackName', Value: STACK_NAME }]
                      }]
                    }));
                  } catch (e) { console.error('Failed to publish S3 metric:', e.message); }
                }

                async function generateQuote() {
                  try {
                    const body = JSON.stringify({
                      anthropic_version: 'bedrock-2023-05-31',
                      max_tokens: 100,
                      messages: [{ role: 'user', content: 'Generate one short inspirational quote (1-2 sentences) about kindness, teamwork, or doing good in the world. Return only the quote text, no attribution or quotation marks.' }]
                    });
                    const invokePromise = bedrock.send(new InvokeModelCommand({
                      modelId: BEDROCK_MODEL_ID,
                      contentType: 'application/json',
                      accept: 'application/json',
                      body: body
                    }));
                    const resp = await Promise.race([invokePromise, new Promise((_, reject) => setTimeout(() => reject(new Error('Bedrock timeout')), 10000))]);
                    const result = JSON.parse(new TextDecoder().decode(resp.body));
                    const text = result.content[0].text.trim();
                    quoteStatus = { quote: text, accessible: true, lastCheck: new Date().toISOString(), error: null };
                  } catch (error) {
                    quoteStatus = { quote: null, accessible: false, lastCheck: new Date().toISOString(), error: error.name || error.message };
                  }
                  try {
                    await cw.send(new PutMetricDataCommand({
                      Namespace: 'DevOpsAgentSample',
                      MetricData: [{
                        MetricName: 'BedrockAccessFailures',
                        Value: quoteStatus.accessible ? 0 : 1,
                        Unit: 'Count',
                        Dimensions: [{ Name: 'StackName', Value: STACK_NAME }]
                      }]
                    }));
                  } catch (e) { console.error('Failed to publish Bedrock metric:', e.message); }
                }

                async function checkExternal() {
                  try {
                    const https = require('https');
                    await new Promise((resolve, reject) => {
                      const req = https.get('https://aws.amazon.com', { timeout: 5000 }, (res) => {
                        res.resume();
                        resolve();
                      });
                      req.on('error', reject);
                      req.on('timeout', () => { req.destroy(); reject(new Error('Timeout')); });
                    });
                    extStatus = { accessible: true, lastCheck: new Date().toISOString(), error: null };
                  } catch (error) {
                    extStatus = { accessible: false, lastCheck: new Date().toISOString(), error: error.message };
                  }
                  try {
                    await cw.send(new PutMetricDataCommand({
                      Namespace: 'DevOpsAgentSample',
                      MetricData: [{
                        MetricName: 'ExternalConnectivityFailures',
                        Value: extStatus.accessible ? 0 : 1,
                        Unit: 'Count',
                        Dimensions: [{ Name: 'StackName', Value: STACK_NAME }]
                      }]
                    }));
                  } catch (e) { console.error('Failed to publish external metric:', e.message); }
                }

                setInterval(checkDatabase, 5000);
                setInterval(checkS3Buckets, 10000);
                setInterval(generateQuote, 60000);
                setInterval(checkExternal, 15000);
                checkDatabase();
                setTimeout(checkS3Buckets, 2000);
                setTimeout(generateQuote, 3000);
                setTimeout(checkExternal, 4000);

                app.get('/', (req, res) => {

                  let s3Rows = '';
                  let s3AllOk = true;
                  for (const bucket of S3_BUCKETS) {
                    const st = s3Status[bucket];
                    const shortName = bucket.replace(STACK_NAME + '-', '').replace(/-\d+$/, '');
                    const errText = st.error ? ' (' + st.error + ')' : '';
                    const statusDot = st.accessible ? '<span class="dot dot-ok"></span>' : '<span class="dot dot-err"></span>';
                    s3Rows += '<tr><td>' + statusDot + shortName + '</td><td>' + (st.accessible ? 'Accessible' : 'Failed' + errText) + '</td></tr>';
                    if (!st.accessible) s3AllOk = false;
                  }

                  const html = '<!DOCTYPE html><html lang="en"><head>' +
                    '<meta charset="utf-8">' +
                    '<title>DevOps Agent Sample App</title>' +
                    '<meta http-equiv="refresh" content="5">' +
                    '<meta name="viewport" content="width=device-width,initial-scale=1">' +
                    '<style>' +
                    ':root{--primary:#0972d3;--bg:#f2f3f3;--surface:#fff;--text:#000716;--text-sec:#5f6b7a;--border:#d1d5db;--ok:#037f0c;--ok-bg:#f2fcf3;--ok-border:#29ad32;--err:#d91515;--err-bg:#fff7f7;--err-border:#d91515;--radius:8px;--shadow:0 1px 2px rgba(0,7,22,0.12)}' +
                    '*{box-sizing:border-box;margin:0;padding:0}' +
                    'body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}' +
                    '.topbar{background:#232f3e;padding:12px 24px;display:flex;align-items:center;gap:12px}' +
                    '.topbar svg{width:20px;height:20px;fill:#fff}' +
                    '.topbar h1{color:#fff;font-size:16px;font-weight:600;letter-spacing:0.2px}' +
                    '.container{max-width:960px;margin:0 auto;padding:24px}' +
                    '.page-header{margin-bottom:24px}' +
                    '.page-header h2{font-size:24px;font-weight:700;color:var(--text)}' +
                    '.page-header p{color:var(--text-sec);font-size:14px;margin-top:4px}' +
                    '.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}' +
                    '.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}' +
                    '.card-header{padding:16px 20px 12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}' +
                    '.card-header h3{font-size:14px;font-weight:600;color:var(--text)}' +
                    '.card-body{padding:16px 20px}' +
                    '.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:4px}' +
                    '.badge-ok{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-border)}' +
                    '.badge-err{background:var(--err-bg);color:var(--err);border:1px solid var(--err-border)}' +
                    '.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;flex-shrink:0}' +
                    '.dot-ok{background:var(--ok)}' +
                    '.dot-err{background:var(--err)}' +
                    '.meta{font-size:12px;color:var(--text-sec);margin-top:8px}' +
                    '.err-msg{font-size:13px;color:var(--err);margin-top:6px}' +
                    '.quote{font-style:italic;font-size:15px;color:var(--text);margin:8px 0;line-height:1.5}' +
                    'table{width:100%;border-collapse:collapse;font-size:13px}' +
                    'th{text-align:left;padding:8px 12px;background:var(--bg);font-weight:600;font-size:12px;color:var(--text-sec);text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid var(--border)}' +
                    'td{padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:middle}' +
                    '.card-full{grid-column:1/-1}' +
                    '.info-bar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 20px;display:flex;gap:24px;font-size:13px;color:var(--text-sec);box-shadow:var(--shadow)}' +
                    '.info-bar span{color:var(--text);font-weight:500}' +
                    '.tag{font-size:11px;color:var(--text-sec);font-weight:400;margin-left:6px}' +
                    '@media(max-width:640px){.grid{grid-template-columns:1fr}}' +
                    '</style></head><body>' +
                    '<div class="topbar"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg><h1>DevOps Agent Sample App</h1></div>' +
                    '<div class="container">' +
                    '<div class="page-header"><h2>Application Status</h2><p>Auto-refreshes every 5 seconds</p></div>' +
                    '<div class="grid">' +
                    '<div class="card"><div class="card-header"><h3>Database Connectivity<span class="tag">Scenario 1</span></h3>' +
                    '<span class="badge ' + (dbStatus.connected ? 'badge-ok' : 'badge-err') + '"><span class="dot ' + (dbStatus.connected ? 'dot-ok' : 'dot-err') + '"></span>' + (dbStatus.connected ? 'Connected' : 'Failed') + '</span></div>' +
                    '<div class="card-body">' +
                    (dbStatus.error ? '<p class="err-msg">' + dbStatus.error + '</p>' : '') +
                    '<p class="meta">Last check: ' + (dbStatus.lastCheck || 'Pending') + '</p></div></div>' +
                    '<div class="card"><div class="card-header"><h3>External Connectivity<span class="tag">Scenario 2</span></h3>' +
                    '<span class="badge ' + (extStatus.accessible ? 'badge-ok' : 'badge-err') + '"><span class="dot ' + (extStatus.accessible ? 'dot-ok' : 'dot-err') + '"></span>' + (extStatus.accessible ? 'Reachable' : 'Unreachable') + '</span></div>' +
                    '<div class="card-body"><p class="meta">Outbound internet via NAT Gateway (every 15s)</p>' +
                    (extStatus.error ? '<p class="err-msg">' + extStatus.error + '</p>' : '') +
                    '<p class="meta">Last check: ' + (extStatus.lastCheck || 'Pending') + '</p></div></div>' +
                    '<div class="card card-full"><div class="card-header"><h3>S3 Bucket Access<span class="tag">Scenario 3</span></h3>' +
                    '<span class="badge ' + (s3AllOk ? 'badge-ok' : 'badge-err') + '"><span class="dot ' + (s3AllOk ? 'dot-ok' : 'dot-err') + '"></span>' + (s3AllOk ? 'All Accessible' : 'Failures Detected') + '</span></div>' +
                    '<div class="card-body"><table><tr><th>Bucket</th><th>Status</th></tr>' + s3Rows + '</table></div></div>' +
                    '<div class="card card-full"><div class="card-header"><h3>Bedrock AI<span class="tag">Scenario 4</span></h3>' +
                    '<span class="badge ' + (quoteStatus.accessible ? 'badge-ok' : 'badge-err') + '"><span class="dot ' + (quoteStatus.accessible ? 'dot-ok' : 'dot-err') + '"></span>' + (quoteStatus.accessible ? 'Connected' : 'Failed') + '</span></div>' +
                    '<div class="card-body">' +
                    (quoteStatus.accessible && quoteStatus.quote ? '<p class="quote">&ldquo;' + quoteStatus.quote + '&rdquo;</p>' : '') +
                    (quoteStatus.error ? '<p class="err-msg">' + quoteStatus.error + '</p>' : '') +
                    '<p class="meta">Last check: ' + (quoteStatus.lastCheck || 'Pending') + '</p></div></div>' +
                    '</div>' +
                    '<div class="info-bar">Region: <span>' + REGION + '</span>&nbsp;&nbsp;|&nbsp;&nbsp;Stack: <span>' + STACK_NAME + '</span></div>' +
                    '</div></body></html>';
                  res.send(html);
                });

                app.get('/ping', (req, res) => {
                  res.status(200).json({ status: 'ok' });
                });

                app.get('/health', (req, res) => {
                  if (dbStatus.connected) {
                    res.status(200).json({ status: 'healthy', database: 'connected' });
                  } else {
                    res.status(503).json({ status: 'unhealthy', database: 'disconnected', error: dbStatus.error });
                  }
                });

                app.get('/s3health', (req, res) => {
                  const allOk = S3_BUCKETS.every(b => s3Status[b].accessible);
                  res.status(allOk ? 200 : 503).json({ status: allOk ? 'healthy' : 'degraded', buckets: s3Status });
                });

                app.listen(PORT, () => { console.log('Server running on port ' + PORT); });
                SERVER_EOF

                # Fetch DB credentials from Secrets Manager and write to file
                aws secretsmanager get-secret-value --secret-id ${DBSecretArn} --region ${AWSRegion} --query SecretString --output text > /opt/webapp/db-creds.json
                chmod 600 /opt/webapp/db-creds.json

                # Create systemd service
                cat > /etc/systemd/system/webapp.service << 'SERVICE_EOF'
                [Unit]
                Description=DevOps Agent Demo Web Application
                After=network.target

                [Service]
                Type=simple
                User=root
                WorkingDirectory=/opt/webapp
                ExecStart=/usr/bin/node server.js
                Restart=always
                RestartSec=10

                [Install]
                WantedBy=multi-user.target
                SERVICE_EOF

                # Signal CloudFormation SUCCESS (before starting app)
                /opt/aws/bin/cfn-signal -e 0 --stack ${RealStackName} --resource AppServerAutoScalingGroup --region ${AWSRegion}

                # Start the service (after signaling)
                systemctl daemon-reload
                systemctl enable webapp
                systemctl start webapp
              - DBEndpoint: !GetAtt DBInstance.Endpoint.Address
                DBSecretArn: !Ref DBSecret
                AWSRegion: !Ref AWS::Region
                RealStackName: !Ref AWS::StackName
                StackName: !Ref ResourcePrefix
                ProdAppDataBucket: !Ref ProdAppDataBucket
                ProdConfigBucket: !Ref ProdConfigBucket
                DataLakeRawBucket: !Ref DataLakeRawBucket
                MLModelsBucket: !Ref MLModelsBucket
                BackupArchiveBucket: !Ref BackupArchiveBucket

