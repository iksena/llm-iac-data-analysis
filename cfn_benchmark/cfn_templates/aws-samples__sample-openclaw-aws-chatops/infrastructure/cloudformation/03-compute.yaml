AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  OpenClaw Compute Stack - ECR, ECS cluster, Fargate services, task definitions,
  IAM roles, ALB. Includes MCP server services with Cloud Map service discovery.

Parameters:
  Environment:
    Type: String
    Default: dev
  ProjectName:
    Type: String
    Default: openclaw
  VpcId:
    Type: String
    Description: VPC ID from Foundation
  VpcCidr:
    Type: String
    Description: VPC CIDR from Foundation (for trusted proxies)
  ComputeSubnet1Id:
    Type: String
    Description: Compute subnet AZ-1 from Foundation
  ComputeSubnet2Id:
    Type: String
    Description: Compute subnet AZ-2 from Foundation
  PublicSubnet1Id:
    Type: String
    Description: Public subnet AZ-1 from Foundation (for ALB)
  PublicSubnet2Id:
    Type: String
    Description: Public subnet AZ-2 from Foundation (for ALB)
  ComputeSGId:
    Type: String
    Description: Compute security group from Foundation
  ALBSecurityGroupId:
    Type: String
    Description: ALB security group from Foundation
  EfsId:
    Type: String
    Description: EFS file system ID from Foundation
  EfsAccessPointId:
    Type: String
    Description: EFS access point ID from Foundation
  OpenSearchEndpoint:
    Type: String
    Description: OpenSearch domain endpoint from Data
  OpenSearchArn:
    Type: String
    Description: OpenSearch domain ARN from Data
  KnowledgeBucketArn:
    Type: String
    Description: Knowledge S3 bucket ARN from Data
  KnowledgeKeyArn:
    Type: String
    Description: Knowledge KMS key ARN from Foundation
  InfraLogsKeyArn:
    Type: String
    Description: InfraLogs KMS key ARN from Foundation
  EventsKeyArn:
    Type: String
    Description: Events KMS key ARN from Foundation
  OpenSearchKeyArn:
    Type: String
    Description: OpenSearch KMS key ARN from Foundation
  ALBLogsBucketName:
    Type: String
    Description: S3 bucket for ALB access logs (SSE-S3 encrypted) from Data stack
  DataSGId:
    Type: String
    Description: Data security group from Foundation (for MCP -> OpenSearch access)
  MCPKnowledgeTaskRoleArn:
    Type: String
    Description: MCP Knowledge task role ARN from Data (FGAC master user)
  MCPKnowledgeTaskRoleName:
    Type: String
    Description: MCP Knowledge task role name from Data (for IAM::Policy attachment)
  S3PrefixListId:
    Type: String
    Description: S3 managed prefix list ID for MCP service SG egress
  FargateCpu:
    Type: String
    Default: '512'
    Description: Fargate CPU units
  FargateMemory:
    Type: String
    Default: '1024'
    Description: Fargate memory (MB)
  ImageTag:
    Type: String
    Default: latest
    Description: Container image tag
  DesiredCount:
    Type: Number
    Default: 0
    Description: Number of Fargate tasks (0 for initial deploy before image push)
  TemplateBucketName:
    Type: String
    Description: S3 bucket for CFN templates and build sources
  EnableGraphMem:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enable mcp-graphmem in-memory graph for infrastructure impact analysis
  EFSSecurityGroupId:
    Type: String
    Description: EFS security group ID from Foundation

Conditions:
  GraphMemEnabled: !Equals [!Ref EnableGraphMem, 'true']

Resources:
  # ============================================================================
  # ECR Repository (Gateway)
  # ============================================================================
  ECRRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${ProjectName}-${Environment}-gateway'
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: KMS
        KmsKey: !Ref KnowledgeKeyArn
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep last 10 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-gateway'

  # ============================================================================
  # CloudWatch Log Group (Gateway)
  # ============================================================================
  ServiceLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/openclaw/${Environment}/engine'
      RetentionInDays: 365
      KmsKeyId: !Ref InfraLogsKeyArn
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-engine-logs'

  # ============================================================================
  # IAM Roles — Gateway
  # ============================================================================
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-task-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Tags:
        - Key: Environment
          Value: !Ref Environment
      Policies:
        - PolicyName: !Sub '${ProjectName}-${Environment}-task-policy'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: BedrockInvokeModel
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/*'
                  - 'arn:aws:bedrock:*::foundation-model/*'
                  - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*'
                  - !Sub 'arn:aws:bedrock:${AWS::Region}::inference-profile/*'
              - Sid: BedrockListModels
                Effect: Allow
                Action:
                  - bedrock:ListFoundationModels
                  - bedrock:ListInferenceProfiles
                  - bedrock:GetFoundationModel
                Resource: '*'
              - Sid: BedrockGuardrails
                Effect: Allow
                Action: bedrock:ApplyGuardrail
                Resource: !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:guardrail/*'
              - Sid: S3BucketAccess
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - !Ref KnowledgeBucketArn
                  - !Sub '${KnowledgeBucketArn}/*'
                  - !Sub 'arn:aws:s3:::${ProjectName}-${Environment}-infra-logs-${AWS::AccountId}'
                  - !Sub 'arn:aws:s3:::${ProjectName}-${Environment}-infra-logs-${AWS::AccountId}/*'
                  - !Sub 'arn:aws:s3:::${ProjectName}-${Environment}-event-summaries-${AWS::AccountId}'
                  - !Sub 'arn:aws:s3:::${ProjectName}-${Environment}-event-summaries-${AWS::AccountId}/*'
              - Sid: CloudWatchLogsWrite
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/openclaw/${Environment}/*:*'
              - Sid: CloudWatchMetrics
                Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: '*'
                Condition:
                  StringEquals:
                    cloudwatch:namespace: !Sub 'OpenClaw/${Environment}'
              - Sid: SSMParameterReadWrite
                Effect: Allow
                Action:
                  - ssm:PutParameter
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:DeleteParameter
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/*'
              - Sid: KMSDecryptAndGenerateKey
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                  - kms:DescribeKey
                Resource:
                  - !Ref KnowledgeKeyArn
                  - !Ref InfraLogsKeyArn
                  - !Ref EventsKeyArn
              - Sid: EFSAccess
                Effect: Allow
                Action:
                  - elasticfilesystem:ClientMount
                  - elasticfilesystem:ClientWrite
                  - elasticfilesystem:DescribeMountTargets
                Resource: !Sub 'arn:aws:elasticfilesystem:${AWS::Region}:${AWS::AccountId}:file-system/${EfsId}'
                Condition:
                  StringEquals:
                    elasticfilesystem:AccessPointArn: !Sub 'arn:aws:elasticfilesystem:${AWS::Region}:${AWS::AccountId}:access-point/${EfsAccessPointId}'

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-execution-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub '${ProjectName}-${Environment}-execution-policy'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ECRPull
                Effect: Allow
                Action:
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:BatchCheckLayerAvailability
                Resource: !GetAtt ECRRepository.Arn
              - Sid: ECRAuth
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/openclaw/${Environment}/*:*'
              - Sid: SSMSecrets
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/${Environment}/*'
              - Sid: KMSForSSM
                Effect: Allow
                Action: kms:Decrypt
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'
              - Sid: EFSAccess
                Effect: Allow
                Action:
                  - elasticfilesystem:ClientMount
                  - elasticfilesystem:ClientWrite
                  - elasticfilesystem:DescribeMountTargets
                Resource: !Sub 'arn:aws:elasticfilesystem:${AWS::Region}:${AWS::AccountId}:file-system/${EfsId}'
                Condition:
                  StringEquals:
                    elasticfilesystem:AccessPointArn: !Sub 'arn:aws:elasticfilesystem:${AWS::Region}:${AWS::AccountId}:access-point/${EfsAccessPointId}'

  # ============================================================================
  # ECS Cluster + Gateway Task Definition + Service
  # ============================================================================
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${ProjectName}-${Environment}'
      ClusterSettings:
        - Name: containerInsights
          Value: enhanced
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-cluster'

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-${Environment}-gateway'
      Cpu: !Ref FargateCpu
      Memory: !Ref FargateMemory
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: openclaw
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ProjectName}-${Environment}-gateway:${ImageTag}'
          Essential: true
          PortMappings:
            - ContainerPort: 18789
              Protocol: tcp
          Environment:
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: OPENCLAW_ENV
              Value: !Ref Environment
            - Name: OPENCLAW_MODEL
              Value: global.anthropic.claude-sonnet-4-6
            - Name: OPENSEARCH_ENDPOINT
              Value: !Ref OpenSearchEndpoint
            - Name: OPENCLAW_INSECURE_AUTH
              Value: 'true'
            - Name: OPENCLAW_DISABLE_DEVICE_AUTH
              Value: 'true'
            - Name: OPENCLAW_TRUSTED_PROXIES
              Value: !Ref VpcCidr
            - Name: OPENCLAW_BIND
              Value: lan
            - Name: MCPORTER_CONFIG
              Value: /home/openclaw/.openclaw/config/mcporter.json
          Secrets:
            - Name: OPENCLAW_GATEWAY_TOKEN
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/${Environment}/gateway-token'
            - Name: MCPORTER_SERVERS
              ValueFrom: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/${Environment}/mcporter-servers'
          MountPoints:
            - SourceVolume: openclaw-state
              ContainerPath: /home/openclaw/.openclaw
          HealthCheck:
            Command:
              - CMD-SHELL
              - curl -sf http://localhost:18789/ || exit 1
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ServiceLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: fargate
      Volumes:
        - Name: openclaw-state
          EFSVolumeConfiguration:
            FilesystemId: !Ref EfsId
            TransitEncryption: ENABLED
            AuthorizationConfig:
              AccessPointId: !Ref EfsAccessPointId
              IAM: ENABLED

  FargateService:
    Type: AWS::ECS::Service
    DependsOn: HTTPListener
    Properties:
      ServiceName: !Sub '${ProjectName}-gateway'
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      EnableExecuteCommand: false
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
        MaximumPercent: 200
        MinimumHealthyPercent: 100
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets:
            - !Ref ComputeSubnet1Id
            - !Ref ComputeSubnet2Id
          SecurityGroups:
            - !Ref ComputeSGId
          AssignPublicIp: DISABLED
      LoadBalancers:
        - ContainerName: openclaw
          ContainerPort: 18789
          TargetGroupArn: !Ref TargetGroup

  # ============================================================================
  # ALB + Target Group + Listener
  # ============================================================================
  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-alb'
      Scheme: internet-facing
      Type: application
      Subnets:
        - !Ref PublicSubnet1Id
        - !Ref PublicSubnet2Id
      SecurityGroups:
        - !Ref ALBSecurityGroupId
      LoadBalancerAttributes:
        - Key: access_logs.s3.enabled
          Value: 'true'
        - Key: access_logs.s3.bucket
          Value: !Ref ALBLogsBucketName
        - Key: access_logs.s3.prefix
          Value: alb-logs
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'
        - Key: deletion_protection.enabled
          Value: 'true'
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-alb'

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-tg'
      Protocol: HTTP
      Port: 18789
      VpcId: !Ref VpcId
      TargetType: ip
      HealthCheckPath: /
      HealthCheckProtocol: HTTP
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'
        - Key: slow_start.duration_seconds
          Value: '60'
        - Key: stickiness.enabled
          Value: 'true'
        - Key: stickiness.type
          Value: lb_cookie
        - Key: stickiness.lb_cookie.duration_seconds
          Value: '86400'
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-tg'

  HTTPListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # ============================================================================
  # Auto Scaling (Gateway)
  # ============================================================================
  ScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: 4
      MinCapacity: 0
      ResourceId: !Sub 'service/${ECSCluster}/${FargateService.Name}'
      RoleARN: !Sub 'arn:aws:iam::${AWS::AccountId}:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService'
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs

  ScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub '${ProjectName}-${Environment}-cpu-scaling'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: 70.0
        ScaleInCooldown: 300
        ScaleOutCooldown: 60

  # ============================================================================
  # SSM Parameters (placeholders — deploy scripts update the values)
  # ============================================================================
  GatewayTokenParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/${Environment}/gateway-token'
      Type: String
      Value: 'placeholder-run-deploy-openclaw-to-set'
      Description: OpenClaw gateway auth token (updated by deploy-openclaw.sh)
      Tags:
        Environment: !Ref Environment
        Project: !Ref ProjectName

  McporterServersParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/${Environment}/mcporter-servers'
      Type: String
      Value: 'none'
      Description: Semicolon-separated MCP server URLs (updated by deploy-mcp.sh)
      Tags:
        Environment: !Ref Environment
        Project: !Ref ProjectName

  CognitoUsernameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/${Environment}/cognito-username'
      Type: String
      Value: 'admin'
      Description: Default Cognito admin username
      Tags:
        Environment: !Ref Environment
        Project: !Ref ProjectName

  CognitoPasswordParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/${Environment}/cognito-password'
      Type: String
      Value: 'placeholder-run-deploy-openclaw-to-set'
      Description: Cognito admin password (updated by deploy-openclaw.sh)
      Tags:
        Environment: !Ref Environment
        Project: !Ref ProjectName

  # ============================================================================
  # MCP Server Infrastructure
  # ECR repos, log groups, Cloud Map, security groups, IAM roles,
  # task definitions, and ECS services for MCP-knowledge and MCP-ops.
  # ============================================================================

  # ── MCP ECR Repositories ───────────────────────────────────────────────────
  MCPKnowledgeECRRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${ProjectName}-${Environment}-mcp-knowledge'
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: KMS
        KmsKey: !Ref KnowledgeKeyArn
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep last 10 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-mcp-knowledge'

  MCPOpsECRRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${ProjectName}-${Environment}-mcp-ops'
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: KMS
        KmsKey: !Ref KnowledgeKeyArn
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep last 10 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-mcp-ops'

  # ── MCP CloudWatch Log Groups ──────────────────────────────────────────────
  MCPKnowledgeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/openclaw/${Environment}/mcp-knowledge'
      RetentionInDays: 365
      KmsKeyId: !Ref InfraLogsKeyArn

  MCPOpsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/openclaw/${Environment}/mcp-ops'
      RetentionInDays: 365
      KmsKeyId: !Ref InfraLogsKeyArn

  # ── Cloud Map Service Discovery ────────────────────────────────────────────
  CloudMapNamespace:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Properties:
      Name: !Sub '${ProjectName}.local'
      Vpc: !Ref VpcId
      Description: !Sub 'Service discovery for ${ProjectName}-${Environment} MCP servers'

  MCPKnowledgeDiscoveryService:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: knowledge
      NamespaceId: !Ref CloudMapNamespace
      DnsConfig:
        DnsRecords:
          - Type: A
            TTL: 10
      HealthCheckCustomConfig:
        FailureThreshold: 1

  MCPOpsDiscoveryService:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: ops
      NamespaceId: !Ref CloudMapNamespace
      DnsConfig:
        DnsRecords:
          - Type: A
            TTL: 10
      HealthCheckCustomConfig:
        FailureThreshold: 1

  # ── MCP Security Groups ────────────────────────────────────────────────────
  # Knowledge SG: Air-gapped (compute subnet) — only VPC endpoints for OpenSearch
  MCPServicesSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub '${ProjectName}-${Environment} MCP Knowledge (air-gapped)'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8001
          ToPort: 8001
          SourceSecurityGroupId: !Ref ComputeSGId
          Description: MCP HTTP from OpenClaw gateway
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCidr
          Description: HTTPS to VPC endpoints
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          DestinationPrefixListId: !Ref S3PrefixListId
          Description: HTTPS to S3 via prefix list
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-mcp-knowledge-sg'

  ComputeSGEgressToMCPKnowledge:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref ComputeSGId
      IpProtocol: tcp
      FromPort: 8001
      ToPort: 8001
      DestinationSecurityGroupId: !Ref MCPServicesSG
      Description: MCP HTTP to Knowledge service

  # Ops SG: Public subnet — needs internet for AWS API calls
  MCPOpsSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub '${ProjectName}-${Environment} MCP Ops (public, internet access)'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8002
          ToPort: 8002
          SourceSecurityGroupId: !Ref ComputeSGId
          Description: MCP HTTP from OpenClaw gateway
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS to AWS APIs via internet
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-mcp-ops-sg'

  ComputeSGEgressToMCPOps:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref ComputeSGId
      IpProtocol: tcp
      FromPort: 8002
      ToPort: 8002
      DestinationSecurityGroupId: !Ref MCPOpsSG
      Description: MCP HTTP to Ops service

  DataSGIngressFromMCP:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DataSGId
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref MCPServicesSG
      Description: HTTPS from MCP Knowledge to OpenSearch

  # ── MCP Knowledge IAM ──────────────────────────────────────────────────────
  # Role created in Data stack (02-data.yaml) as OpenSearch FGAC master user.
  # Policies attached here via standalone AWS::IAM::Policy (cross-stack pattern).
  MCPKnowledgeTaskPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: MCPKnowledgePolicy
      Roles:
        - !Ref MCPKnowledgeTaskRoleName
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: OpenSearchDataAccess
            Effect: Allow
            Action:
              - es:ESHttpGet
              - es:ESHttpPut
              - es:ESHttpPost
              - es:ESHttpDelete
              - es:ESHttpHead
            Resource:
              - !Ref OpenSearchArn
              - !Sub '${OpenSearchArn}/*'
          - Sid: CloudWatchLogsWrite
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/openclaw/${Environment}/mcp-knowledge:*'
          - Sid: KMSForOpenSearch
            Effect: Allow
            Action:
              - kms:Decrypt
              - kms:DescribeKey
            Resource:
              - !Ref OpenSearchKeyArn

  MCPKnowledgeExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-mcp-knowledge-exec-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: MCPKnowledgeExecutionPolicy
