AWSTemplateFormatVersion: "2010-09-09"
Parameters:
  LogGroupName:
    Type: String
    Default: "BenchmarkResults"
    Description: "Name of the CloudWatch Logs log group for benchmark results"
    AllowedPattern: "^[a-zA-Z0-9_-]+$"
  RetentionInDays:
    Type: Number
    Default: 30
    Description: "Retention period for log group in days"
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1827, 3653]
Resources:
  BenchmarkLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Ref LogGroupName
      RetentionInDays: !Ref RetentionInDays
  JavaMemoryEfficiencyFilter:
    Type: AWS::Logs::MetricFilter
    DependsOn: BenchmarkLogGroup
    Properties:
      LogGroupName: !Ref LogGroupName
      FilterPattern: "{ $.testType = \"memory\" && $.language = \"java\" }"
      MetricTransformations:
        - MetricValue: "$.efficiencyRatio"
          MetricNamespace: "Benchmark/Java"
          MetricName: "MemoryEfficiencyRatio"
          DefaultValue: 0
  JavaPeakMemoryFilter:
    Type: AWS::Logs::MetricFilter
    DependsOn: BenchmarkLogGroup
    Properties:
      LogGroupName: !Ref LogGroupName
      FilterPattern: "{ $.testType = \"memory\" && $.language = \"java\" }"
      MetricTransformations:
        - MetricValue: "$.peakMemoryMB"
          MetricNamespace: "Benchmark/Java"
          MetricName: "PeakMemoryMB"
          DefaultValue: 0
  JavaThroughputP50Filter:
    Type: AWS::Logs::MetricFilter
    DependsOn: BenchmarkLogGroup
    Properties:
      LogGroupName: !Ref LogGroupName
      FilterPattern: "{ $.testType = \"throughput\" && $.dataSize = \"1KB\" && $.language = \"java\" }"
      MetricTransformations:
        - MetricValue: "$.latency.p50"
          MetricNamespace: "Benchmark/Java"
          MetricName: "ThroughputP50Latency"
          DefaultValue: 0
  JavaThroughputP95Filter:
    Type: AWS::Logs::MetricFilter
    DependsOn: BenchmarkLogGroup
    Properties:
      LogGroupName: !Ref LogGroupName
      FilterPattern: "{ $.testType = \"throughput\" && $.dataSize = \"1KB\" && $.language = \"java\" }"
      MetricTransformations:
        - MetricValue: "$.latency.p95"
          MetricNamespace: "Benchmark/Java"
          MetricName: "ThroughputP95Latency"
          DefaultValue: 0
  JavaThroughputP99Filter:
    Type: AWS::Logs::MetricFilter
    DependsOn: BenchmarkLogGroup
    Properties:
      LogGroupName: !Ref LogGroupName
      FilterPattern: "{ $.testType = \"throughput\" && $.dataSize = \"1KB\" && $.language = \"java\" }"
      MetricTransformations:
        - MetricValue: "$.latency.p99"
          MetricNamespace: "Benchmark/Java"
          MetricName: "ThroughputP99Latency"
          DefaultValue: 0
  JavaConcurrencyP50Filter:
    Type: AWS::Logs::MetricFilter
    DependsOn: BenchmarkLogGroup
    Properties:
      LogGroupName: !Ref LogGroupName
      FilterPattern: "{ $.testType = \"concurrency\" && $.language = \"java\" }"
      MetricTransformations:
        - MetricValue: "$.latency.p50"
          MetricNamespace: "Benchmark/Java"
          MetricName: "ConcurrencyP50Latency"
          DefaultValue: 0
  JavaConcurrencyP95Filter:
    Type: AWS::Logs::MetricFilter
