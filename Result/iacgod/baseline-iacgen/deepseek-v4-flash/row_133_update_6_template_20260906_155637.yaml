AWSTemplateFormatVersion: "2010-09-09"
Description: "CloudFormation template for private subnets with NAT gateways, S3 VPC endpoint, and exports. Default parameter values are placeholders and must be replaced with actual resource IDs for real deployments."
Parameters:
  VpcId:
    Type: String
    Description: "ID of the target VPC (required, e.g., vpc-xxxxxxxx)"
    Default: "vpc-12345678"
    AllowedPattern: "^vpc-[0-9a-f]{8