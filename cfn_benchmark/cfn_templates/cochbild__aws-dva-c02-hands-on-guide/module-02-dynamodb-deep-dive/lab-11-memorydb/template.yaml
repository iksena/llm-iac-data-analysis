AWSTemplateFormatVersion: '2010-09-09'
Description: |
  DVA-C02 Lab 2.11 — MemoryDB for Redis (1 shard, 1 node, db.t4g.small).
  TLS + ACL auth (open-access-iam-user for lab simplicity).

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>

Resources:
  MemoryDBSubnetGroup:
    Type: AWS::MemoryDB::SubnetGroup
    Properties:
      SubnetGroupName: dva-lab-02-11-subnet-group
      Description: DVA Lab 2.11 MemoryDB subnet group
      SubnetIds: !Ref SubnetIds

  MemoryDBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: dva-lab-02-11-cache-sg
      GroupDescription: MemoryDB security group
      VpcId: !Ref VpcId

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: dva-lab-02-11-lambda-sg
      GroupDescription: Lambda security group
      VpcId: !Ref VpcId

  CacheIngressFromLambda:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref MemoryDBSecurityGroup
      IpProtocol: tcp
      FromPort: 6379
      ToPort: 6379
      SourceSecurityGroupId: !Ref LambdaSecurityGroup

  # Use the built-in open-access ACL (no auth) for simplicity.
  # Production: create a User with a Secrets-Manager password and use it here.
  MemoryDBACL:
    Type: AWS::MemoryDB::ACL
    Properties:
      ACLName: dva-lab-02-11-acl
      UserNames:
        - default

  MemoryDBCluster:
    Type: AWS::MemoryDB::Cluster
    Properties:
      ClusterName: dva-lab-02-11-cluster
      NodeType: db.t4g.small
      ACLName: !Ref MemoryDBACL
      EngineVersion: '7.0'
      NumShards: 1
      NumReplicasPerShard: 0
      SubnetGroupName: !Ref MemoryDBSubnetGroup
      SecurityGroupIds:
        - !GetAtt MemoryDBSecurityGroup.GroupId
      TLSEnabled: true
      Port: 6379
      AutoMinorVersionUpgrade: true

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole

  CounterFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: dva-lab-02-11-counter
      Runtime: python3.12
      Handler: handler.handler
      Role: !GetAtt LambdaRole.Arn
      Code: ./src
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          MEMORYDB_HOST: !GetAtt MemoryDBCluster.ClusterEndpoint.Address
          MEMORYDB_PORT: !GetAtt MemoryDBCluster.ClusterEndpoint.Port
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds: !Ref SubnetIds

Outputs:
  FunctionName:
    Value: !Ref CounterFunction
  ClusterEndpoint:
    Value: !GetAtt MemoryDBCluster.ClusterEndpoint.Address
  ClusterPort:
    Value: !GetAtt MemoryDBCluster.ClusterEndpoint.Port