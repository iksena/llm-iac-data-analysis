AWSTemplateFormatVersion: "2010-09-09"

Description: >
  FinOps-RAG — VPC-deployed Amazon OpenSearch domain with fine-grained
  access control (internal user database), node-to-node encryption,
  at-rest encryption, TLS 1.2 enforcement, and HTTPS-only ingress on
  port 443. Equivalent topology to the sibling Terraform module
  (terraform/main.tf) — pick one or the other per environment.

# ---------------------------------------------------------------------------
# Parameters
# ---------------------------------------------------------------------------

Parameters:

  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment; used in the domain name and tags.

  InstanceType:
    Type: String
    Default: t3.medium.search
    Description: Data-node instance type.

  InstanceCount:
    Type: Number
    Default: 2
    MinValue: 2
    Description: >
      Number of data nodes. Must be even when zone awareness is enabled
      (we enable it for 2-AZ HA).

  StorageSize:
    Type: Number
    Default: 20
    MinValue: 10
    MaxValue: 3584
    Description: EBS gp3 volume size per node, in GiB.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC the domain attaches to.

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >
      Subnets the domain ENIs land in. Pass two subnets in distinct AZs
      when InstanceCount is 2 (the default).

  AllowedCidr:
    Type: String
    Default: 10.0.0.0/8
    AllowedPattern: ^([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[12][0-9]|3[0-2])$
    Description: CIDR block permitted to reach the domain on TCP/443.

  MasterUser:
    Type: String
    Default: finops_admin
    MinLength: 1
    MaxLength: 64
    Description: Internal-user-DB master username.

  MasterPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: >
      Internal-user-DB master password. Must meet AWS complexity rules
      (8+ chars; one upper, lower, digit, and symbol). NoEcho keeps it
      out of CloudFormation events and stack outputs.

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------

Resources:

  OpenSearchSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: FinOps-RAG OpenSearch domain — HTTPS-only ingress.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref AllowedCidr
          Description: HTTPS to the OpenSearch domain.
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
          Description: Egress to AWS service endpoints.
      Tags:
        - Key: Name
          Value: !Sub finops-rag-${Environment}-sg
        - Key: Project
          Value: FinOps-RAG
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  OpenSearchDomain:
    Type: AWS::OpenSearchService::Domain
    Properties:
      DomainName: !Sub finops-rag-${Environment}
      EngineVersion: OpenSearch_2.11

      ClusterConfig:
        InstanceType: !Ref InstanceType
        InstanceCount: !Ref InstanceCount
        ZoneAwarenessEnabled: true
        ZoneAwarenessConfig:
          AvailabilityZoneCount: 2

      EBSOptions:
        EBSEnabled: true
        VolumeType: gp3
        VolumeSize: !Ref StorageSize

      VPCOptions:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds:
          - !Ref OpenSearchSecurityGroup

      # --- TLS / encryption -----------------------------------------------
      NodeToNodeEncryptionOptions:
        Enabled: true

      EncryptionAtRestOptions:
        Enabled: true
        # KmsKeyId omitted → AWS-managed aws/opensearch-service key.

      DomainEndpointOptions:
        EnforceHTTPS: true
        TLSSecurityPolicy: Policy-Min-TLS-1-2-2019-07

      # --- Fine-grained access control with internal user database -------
      AdvancedSecurityOptions:
        Enabled: true
        InternalUserDatabaseEnabled: true
        MasterUserOptions:
          MasterUserName: !Ref MasterUser
          MasterUserPassword: !Ref MasterPassword

      # Wide-open resource policy: network reach is gated by the VPC + SG,
      # application auth is gated by fine-grained access control above.
      AccessPolicies:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: "*"
            Action: es:*
            Resource: !Sub arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/finops-rag-${Environment}/*

      Tags:
        - Key: Name
          Value: !Sub finops-rag-${Environment}
        - Key: Project
          Value: FinOps-RAG
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------

Outputs:

  OpenSearchEndpoint:
    Description: HTTPS endpoint of the OpenSearch domain (VPC-private).
    Value: !Sub https://${OpenSearchDomain.DomainEndpoint}
    Export:
      Name: !Sub ${AWS::StackName}-OpenSearchEndpoint

  OpenSearchDashboardUrl:
    Description: OpenSearch Dashboards URL (formerly Kibana).
    Value: !Sub https://${OpenSearchDomain.DomainEndpoint}/_dashboards/
    Export:
      Name: !Sub ${AWS::StackName}-OpenSearchDashboardUrl

  OpenSearchArn:
    Description: ARN of the OpenSearch domain.
    Value: !GetAtt OpenSearchDomain.Arn
    Export:
      Name: !Sub ${AWS::StackName}-OpenSearchArn

  SecurityGroupId:
    Description: Security group attached to the domain ENIs.
    Value: !Ref OpenSearchSecurityGroup
    Export:
      Name: !Sub ${AWS::StackName}-SecurityGroupId