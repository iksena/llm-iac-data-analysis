AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  OpenClaw Master Stack - Orchestrates all 5 child stacks via nested
  CloudFormation. Single deploy command, single delete command.

Parameters:
  Environment:
    Type: String
    Default: dev
    Description: Environment name
  ProjectName:
    Type: String
    Default: openclaw
    Description: Resource name prefix
  VpcCidr:
    Type: String
    Default: '10.100.0.0/16'
    Description: VPC CIDR block (env-specific)
  TemplateBucketName:
    Type: String
    Description: S3 bucket containing child templates
  S3PrefixListId:
    Type: String
    Description: S3 managed prefix list ID (resolved by deploy.sh)
  CloudFrontPrefixListId:
    Type: String
    Description: CloudFront origin-facing prefix list ID (resolved by deploy.sh)
  OpenSearchInstanceType:
    Type: String
    Default: t3.small.search
    Description: OpenSearch instance type
  FargateCpu:
    Type: String
    Default: '512'
    Description: Fargate CPU units
  FargateMemory:
    Type: String
    Default: '1024'
    Description: Fargate memory (MB)
  ImageTag:
    Type: String
    Default: initial
    Description: Container image tag
  DesiredCount:
    Type: Number
    Default: 0
    Description: Number of Fargate tasks (0 for initial deploy, 1 for updates)
  EnableCloudTrail:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Whether to create a CloudTrail trail (default false — most accounts already have account-level trails)
  EnableGraphMem:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enable mcp-graphmem in-memory graph for infrastructure impact analysis

Conditions:
  HasTrail: !Equals [!Ref EnableCloudTrail, 'true']

Resources:
  # ============================================================================
  # Foundation: VPC, subnets, endpoints, KMS, SGs, EFS
  # No dependencies -- deploys first
  # ============================================================================
  Foundation:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${TemplateBucketName}.s3.amazonaws.com/templates/01-foundation.yaml'
      Parameters:
        Environment: !Ref Environment
        ProjectName: !Ref ProjectName
        VpcCidr: !Ref VpcCidr
        S3PrefixListId: !Ref S3PrefixListId
        CloudFrontPrefixListId: !Ref CloudFrontPrefixListId

  # ============================================================================
  # Data: OpenSearch, S3 buckets, SNS topics
  # DependsOn: Foundation
  # ============================================================================
  Data:
    Type: AWS::CloudFormation::Stack
    DependsOn: Foundation
    Properties:
      TemplateURL: !Sub 'https://${TemplateBucketName}.s3.amazonaws.com/templates/02-data.yaml'
      Parameters:
        Environment: !Ref Environment
        ProjectName: !Ref ProjectName
        VpcId: !GetAtt Foundation.Outputs.VpcId
        DataSubnet1Id: !GetAtt Foundation.Outputs.DataSubnet1Id
        DataSubnet2Id: !GetAtt Foundation.Outputs.DataSubnet2Id
        DataSGId: !GetAtt Foundation.Outputs.DataSGId
        KnowledgeKeyArn: !GetAtt Foundation.Outputs.KnowledgeKeyArn
        InfraLogsKeyArn: !GetAtt Foundation.Outputs.InfraLogsKeyArn
        EventsKeyArn: !GetAtt Foundation.Outputs.EventsKeyArn
        OpenSearchKeyArn: !GetAtt Foundation.Outputs.OpenSearchKeyArn
        OpenSearchInstanceType: !Ref OpenSearchInstanceType

  # ============================================================================
  # Compute: ECR, ECS, Fargate, IAM, ALB
  # DependsOn: Foundation, Data
  # ============================================================================
  Compute:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - Foundation
      - Data
    Properties:
      TemplateURL: !Sub 'https://${TemplateBucketName}.s3.amazonaws.com/templates/03-compute.yaml'
      Parameters:
        Environment: !Ref Environment
        ProjectName: !Ref ProjectName
        VpcId: !GetAtt Foundation.Outputs.VpcId
        VpcCidr: !GetAtt Foundation.Outputs.VpcCidr
        ComputeSubnet1Id: !GetAtt Foundation.Outputs.ComputeSubnet1Id
        ComputeSubnet2Id: !GetAtt Foundation.Outputs.ComputeSubnet2Id
        PublicSubnet1Id: !GetAtt Foundation.Outputs.PublicSubnet1Id
        PublicSubnet2Id: !GetAtt Foundation.Outputs.PublicSubnet2Id
        ComputeSGId: !GetAtt Foundation.Outputs.ComputeSGId
        ALBSecurityGroupId: !GetAtt Foundation.Outputs.ALBSecurityGroupId
        DataSGId: !GetAtt Foundation.Outputs.DataSGId
        EfsId: !GetAtt Foundation.Outputs.EfsId
        EfsAccessPointId: !GetAtt Foundation.Outputs.EfsAccessPointId
        KnowledgeKeyArn: !GetAtt Foundation.Outputs.KnowledgeKeyArn
        InfraLogsKeyArn: !GetAtt Foundation.Outputs.InfraLogsKeyArn
        EventsKeyArn: !GetAtt Foundation.Outputs.EventsKeyArn
        OpenSearchKeyArn: !GetAtt Foundation.Outputs.OpenSearchKeyArn
        OpenSearchEndpoint: !GetAtt Data.Outputs.OpenSearchEndpoint
        OpenSearchArn: !GetAtt Data.Outputs.OpenSearchArn
        MCPKnowledgeTaskRoleArn: !GetAtt Data.Outputs.MCPKnowledgeTaskRoleArn
        MCPKnowledgeTaskRoleName: !GetAtt Data.Outputs.MCPKnowledgeTaskRoleName
        KnowledgeBucketArn: !GetAtt Data.Outputs.KnowledgeBucketArn
        ALBLogsBucketName: !GetAtt Data.Outputs.ALBLogsBucketName
        S3PrefixListId: !GetAtt Foundation.Outputs.S3PrefixListId
        FargateCpu: !Ref FargateCpu
        FargateMemory: !Ref FargateMemory
        ImageTag: !Ref ImageTag
        DesiredCount: !Ref DesiredCount
        TemplateBucketName: !Ref TemplateBucketName
        EnableGraphMem: !Ref EnableGraphMem
        EFSSecurityGroupId: !GetAtt Foundation.Outputs.EFSSecurityGroupId

  # ============================================================================
  # Web: CloudFront, Cognito, Lambda@Edge, WAF
  # DependsOn: Compute (needs ALB DNS)
  # ============================================================================
  Web:
    Type: AWS::CloudFormation::Stack
    DependsOn: Compute
    Properties:
      TemplateURL: !Sub 'https://${TemplateBucketName}.s3.amazonaws.com/templates/04-web.yaml'
      Parameters:
        Environment: !Ref Environment
        ProjectName: !Ref ProjectName
        ALBDnsName: !GetAtt Compute.Outputs.ALBDnsName
        ALBHostedZoneId: !GetAtt Compute.Outputs.ALBHostedZoneId

  # ============================================================================
  # Observability: CloudWatch, CloudTrail, VPC Flow Logs, Dashboard
  # DependsOn: Foundation, Data, Compute -- deploys LAST
  # ============================================================================
  Observability:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - Foundation
      - Data
      - Compute
    Properties:
      TemplateURL: !Sub 'https://${TemplateBucketName}.s3.amazonaws.com/templates/05-observability.yaml'
      Parameters:
        Environment: !Ref Environment
        ProjectName: !Ref ProjectName
        VpcId: !GetAtt Foundation.Outputs.VpcId
        InfraLogsKeyArn: !GetAtt Foundation.Outputs.InfraLogsKeyArn
        EventsKeyArn: !GetAtt Foundation.Outputs.EventsKeyArn
        InfraLogsBucketArn: !GetAtt Data.Outputs.InfraLogsBucketArn
        InfraLogsBucketName: !GetAtt Data.Outputs.InfraLogsBucketName
        AdminSNSTopicArn: !GetAtt Data.Outputs.AdminSNSTopicArn
        ECSClusterName: !GetAtt Compute.Outputs.ECSClusterName
        ECSServiceName: !GetAtt Compute.Outputs.ECSServiceName
        ALBArn: !GetAtt Compute.Outputs.ALBArn
        EnableCloudTrail: !Ref EnableCloudTrail
        KnowledgeBucketArn: !GetAtt Data.Outputs.KnowledgeBucketArn
        BackupBucketArn: !GetAtt Data.Outputs.BackupBucketArn

Outputs:
  CloudFrontDomain:
    Description: CloudFront distribution domain name
    Value: !GetAtt Web.Outputs.CloudFrontDomain
  GatewayALBDns:
    Description: ALB DNS name (direct access / debugging)
    Value: !GetAtt Compute.Outputs.ALBDnsName
  OpenSearchEndpoint:
    Description: OpenSearch domain endpoint
    Value: !GetAtt Data.Outputs.OpenSearchEndpoint
  ECSClusterName:
    Description: ECS cluster name (for deploy.sh / operations)
    Value: !GetAtt Compute.Outputs.ECSClusterName
  ECSServiceName:
    Description: ECS service name (for deploy.sh / operations)
    Value: !GetAtt Compute.Outputs.ECSServiceName
  ECRRepositoryUri:
    Description: ECR repository URI (for build-and-push)
    Value: !GetAtt Compute.Outputs.ECRRepositoryUri
  UserPoolId:
    Description: Cognito user pool ID (for deploy.sh user creation)
    Value: !GetAtt Web.Outputs.UserPoolId
  UserPoolClientId:
    Description: Cognito user pool client ID (for auth flow)
    Value: !GetAtt Web.Outputs.UserPoolClientId
  CloudFrontDistributionId:
    Description: CloudFront distribution ID (for cache invalidation)
    Value: !GetAtt Web.Outputs.CloudFrontDistributionId
  CognitoDomain:
    Description: Cognito hosted UI domain
    Value: !GetAtt Web.Outputs.CognitoDomain
  TrailArn:
    Condition: HasTrail
    Description: CloudTrail trail ARN
    Value: !GetAtt Observability.Outputs.TrailArn
  GatewayTokenParameterName:
    Description: SSM parameter for gateway token (updated by deploy-openclaw.sh)
    Value: !GetAtt Compute.Outputs.GatewayTokenParameterName
  McporterServersParameterName:
    Description: SSM parameter for MCP server URLs (updated by deploy-mcp.sh)
    Value: !GetAtt Compute.Outputs.McporterServersParameterName
  CognitoUsernameParameterName:
    Description: SSM parameter for Cognito admin username
    Value: !GetAtt Compute.Outputs.CognitoUsernameParameterName
  CognitoPasswordParameterName:
    Description: SSM parameter for Cognito admin password (updated by deploy-openclaw.sh)
    Value: !GetAtt Compute.Outputs.CognitoPasswordParameterName
  MCPKnowledgeECRRepositoryUri:
    Description: ECR URI for MCP Knowledge server images
    Value: !GetAtt Compute.Outputs.MCPKnowledgeECRRepositoryUri
  MCPKnowledgeServiceName:
    Description: ECS service name for MCP Knowledge
    Value: !GetAtt Compute.Outputs.MCPKnowledgeServiceName
  MCPOpsECRRepositoryUri:
    Description: ECR URI for MCP Ops server images
    Value: !GetAtt Compute.Outputs.MCPOpsECRRepositoryUri
  MCPOpsServiceName:
    Description: ECS service name for MCP Ops
    Value: !GetAtt Compute.Outputs.MCPOpsServiceName
  CodeBuildProjectName:
    Description: CodeBuild project name for image builds
    Value: !GetAtt Compute.Outputs.CodeBuildProjectName
  MCPGraphMemECRRepositoryUri:
    Description: ECR URI for MCP GraphMem server images (empty if disabled)
    Value: !GetAtt Compute.Outputs.MCPGraphMemECRRepositoryUri
  MCPGraphMemServiceName:
    Description: ECS service name for MCP GraphMem (empty if disabled)
    Value: !GetAtt Compute.Outputs.MCPGraphMemServiceName
  GraphMemEnabled:
    Description: Whether mcp-graphmem is enabled in this stack
    Value: !GetAtt Compute.Outputs.GraphMemEnabled