AWSTemplateFormatVersion: '2010-09-09'
Description: |
  **WARNING** This template creates VPCs, subnets, route tables, a Transit Gateway, Transit Gateway VPC attachments, routes,
   security groups, VPC endpoints, EC2 instances, IAM roles, instance profiles, and SSM documents. You will be billed for the
   AWS resources used if you create a stack from this template.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Source Network"
        Parameters:
          - PrimarySourceVpcCidrParam
          - PrimarySourcePrivateSubnetCidrParam
      - Label:
          default: "Staging And Recovery Area Network"
        Parameters:
          - PrimaryStagingVpcCidrParam
          - PrimaryStagingPrivateSubnetCidrParam
      - Label:
          default: "Recovery Info"
        Parameters:
          - RecoveryVpcCidrParam
          - RecoveryRegionParam

Parameters:
  # -----------------------
  # Source‐side values (fetched from /dr/primary/... in SSM)
  # -----------------------
  PrimarySourceVpcCidrParam:
    Type: AWS::SSM::Parameter::Value<String>
    Default: "/dr/primary/sourceVpcCidr"
    Description: "CIDR block for the source VPC in your primary region (from SSM)"

  PrimaryStagingVpcCidrParam:
    Type: AWS::SSM::Parameter::Value<String>
    Default: "/dr/primary/stagingVpcCidr"
    Description: "CIDR block for the staging VPC in your primary region (from SSM)"

  PrimarySourcePrivateSubnetCidrParam:
    Type: AWS::SSM::Parameter::Value<String>
    Default: "/dr/primary/sourcePrivateSubnetCidr"
    Description: "CIDR block for the private subnet in the primary region (from SSM)"

  PrimaryStagingPrivateSubnetCidrParam:
    Type: AWS::SSM::Parameter::Value<String>
    Default: "/dr/primary/stagingPrivateSubnetCidr"
    Description: "CIDR block for the staging private subnet in the primary region (from SSM)"

  # -----------------------
  # Recovery‐side values (fetched from /dr/recovery/... in SSM)
  # -----------------------
  RecoveryVpcCidrParam:
    Type: AWS::SSM::Parameter::Value<String>
    Default: "/dr/recovery/vpcCidr"
    Description: "CIDR block for the recovery VPC in the recovery region (from SSM)"

  RecoveryRegionParam:
    Type: AWS::SSM::Parameter::Value<String>
    Default: "/dr/recovery/region"
    Description: "Disaster recovery site region (from SSM)"

Resources:
  ### Source VPC, Subnet & Route Table ###
  SourceVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref PrimarySourceVpcCidrParam
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: "source-vpc"
        - Key: addtotransitgateway
          Value: "true"
        - Key: staging
          Value: "false"
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W60
            reason: "VPC flow logs not required for this demo"

  SourcePrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref SourceVpc
      CidrBlock: !Ref PrimarySourcePrivateSubnetCidrParam
      AvailabilityZone:
        Fn::Select:
          - 0
          - Fn::GetAZs: !Ref "AWS::Region"
      Tags:
        - Key: Name
          Value: "source-private-subnet"

  SourcePrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref SourceVpc
      Tags:
        - Key: Name
          Value: "source-private-routetable"
        - Key: staging
          Value: "false"

  SourcePrivateSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SourcePrivateSubnet
      RouteTableId: !Ref SourcePrivateRouteTable

  ### Single Transit Gateway + Attachments ###
  SourceTransitGateway:
    Type: AWS::EC2::TransitGateway
    Properties:
      Description: "Transit Gateway for connecting Source & Staging VPCs"
      DefaultRouteTableAssociation: enable
      DefaultRouteTablePropagation: enable
      AutoAcceptSharedAttachments: enable
      DnsSupport: enable
      VpnEcmpSupport: enable
      Tags:
        - Key: Name
          Value: "source-transit-gateway"

  # Attach Source VPC
  SourceTransitGatewayAttachment:
    Type: AWS::EC2::TransitGatewayVpcAttachment
    Properties:
      TransitGatewayId: !Ref SourceTransitGateway
      VpcId: !Ref SourceVpc
      SubnetIds:
        - !Ref SourcePrivateSubnet
      Tags:
        - Key: Name
          Value: "source-vpc-attachment"

  # Attach Staging VPC (defined later)
  StagingTransitGatewayAttachment:
    Type: AWS::EC2::TransitGatewayVpcAttachment
    Properties:
      TransitGatewayId: !Ref SourceTransitGateway
      VpcId: !Ref SourceStagingVpc
      SubnetIds:
        - !Ref StagingPrivateSubnet
      Tags:
        - Key: Name
          Value: "staging-vpc-attachment"

  ### Routes via the single TGW ###
  # Source -> Staging
  TransitGatewayRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref SourcePrivateRouteTable
      DestinationCidrBlock: !Ref PrimaryStagingVpcCidrParam
      TransitGatewayId: !Ref SourceTransitGateway
    DependsOn: SourceTransitGatewayAttachment

  # Staging -> Source
  RouteFromStagingToSource:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref StagingPrivateRouteTable
      DestinationCidrBlock: !Ref PrimarySourceVpcCidrParam
      TransitGatewayId: !Ref SourceTransitGateway
    DependsOn: StagingTransitGatewayAttachment

  ### VPC Endpoints & Security Groups ###
  SourceVPCEndpointSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for VPC endpoints
      VpcId: !Ref SourceVpc
      Tags:
        - Key: Name
          Value: "source-vpc-endpoint-sg"
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W5
            reason: "open to world only for outbound traffic"
          - id: W40
            reason: "All protocol only for outbound traffic"

  SourceVPCEndpointIngress1:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref SourceVPCEndpointSG
      Description: Allow HTTPS from Source VPC
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: !Ref PrimarySourceVpcCidrParam

  SourceVPCEndpointIngress2:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref SourceVPCEndpointSG
      Description: Allow HTTPS from Staging VPC
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: !Ref PrimaryStagingVpcCidrParam

  VPCEndpointEgress1:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref SourceVPCEndpointSG
      Description: Allow all traffic to endpoints
      IpProtocol: "-1"
      CidrIp: "0.0.0.0/0"

  SSMEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref SourceVpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ssm"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SecurityGroupIds:
        - !Ref SourceVPCEndpointSG
      SubnetIds:
        - !Ref SourcePrivateSubnet

  EC2MessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref SourceVpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ec2messages"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SecurityGroupIds:
        - !Ref SourceVPCEndpointSG
      SubnetIds:
        - !Ref SourcePrivateSubnet

  SSMMessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref SourceVpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ssmmessages"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SecurityGroupIds:
        - !Ref SourceVPCEndpointSG
      SubnetIds:
        - !Ref SourcePrivateSubnet

  SourceS3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Gateway
      VpcId: !Ref SourceVpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      RouteTableIds:
        - !Ref SourcePrivateRouteTable

  ### Source Server & SSM Document ###
  SourceServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Source Server
      VpcId: !Ref SourceVpc
      Tags:
        - Key: Name
          Value: "source-server-sg"
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W5
            reason: "open to world only for outbound traffic"
          - id: W40
            reason: "All protocol only for outbound traffic"

  SourceServerEgress1:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref SourceServerSecurityGroup
      Description: Allow all traffic to endpoints
      IpProtocol: "-1"
      CidrIp: "0.0.0.0/0"

  SourceServerEC2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: [ec2.amazonaws.com]
            Action: ["sts:AssumeRole"]
      Policies:
        - PolicyName: "primary-source-server-iam-policy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ["s3:GetObject"]
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::aws-elastic-disaster-recovery-${RecoveryRegionParam}/*"
                  - !Sub "arn:${AWS::Partition}:s3:::aws-elastic-disaster-recovery-hashes-${RecoveryRegionParam}/*"
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSElasticDisasterRecoveryEc2InstancePolicy"

  SourceServerIamInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref SourceServerEC2InstanceRole

  SourceServer:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.medium
      ImageId: "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
      SubnetId: !Ref SourcePrivateSubnet
      Monitoring: true
      EbsOptimized: true
      IamInstanceProfile: !Ref SourceServerIamInstanceProfile
      SecurityGroupIds:
        - !Ref SourceServerSecurityGroup
      Tags:
        - Key: Name
          Value: "drs-primary-source-server"

  SsmDoc:
    Type: AWS::SSM::Document
    Properties:
      Name: "drs-agent-installation"
      DocumentType: Command
      Content:
        description: |
          This action will install the AWS Elastic Disaster Recovery (DRS) Replication Agent on an EC2 instance.
        schemaVersion: "2.2"
        parameters:
          S3InterfaceEndpoint:
            type: String
            description: (Required) S3 Interface VPC endpoint to use.
            default: ""
          Region:
            type: String
            description: (Required) AWS Region into which you are replicating.
            allowedValues:
              - us-east-1
              - us-east-2
              - us-west-1
              - us-west-2
              - ap-southeast-1
              - ap-southeast-2
              - ap-southeast-3
              - ap-northeast-1
              - ap-northeast-2
              - ap-northeast-3
              - eu-central-1
              - eu-west-1
              - eu-west-2
              - eu-west-3
              - ca-central-1
              - ap-south-1
              - sa-east-1
              - eu-north-1
              - me-south-1
              - af-south-1
              - ap-east-1
              - eu-south-1
              - eu-central-2
              - eu-south-2
              - ap-south-2
              - ap-southeast-4
              - me-central-1
              - il-central-1
          Tags:
            type: String
            description: (Optional) Use this parameter to add resource tags to the Source server. Use a comma to separate each tag.
            default: ""
            allowedPattern: "^(([a-zA-Z_0-9.+:/@\\-]{1,50}=[a-zA-Z_0-9.+:/@ \\-]{1,50})(,[a-zA-Z_0-9.+:/@\\-]{1,50}=[a-zA-Z_0-9.+:/@ \\-]{1,50}){0,20})?$"
        mainSteps:
          - action: aws:runShellScript
            name: InstallLinuxAgent
            precondition:
              StringEquals:
                - platformType
                - Linux
            inputs:
              timeoutSeconds: "3600"
              runCommand:
                - "sudo curl -o ./aws-installer.sha512 https://aws-elastic-disaster-recovery-hashes-{{ Region }}.{{ S3InterfaceEndpoint }}/latest/linux/aws-replication-installer-init.py.sha512"
                - "asset_hash=$(cat ./aws-installer.sha512)"
                - "sudo curl -o ./aws-replication-installer-init.py https://aws-elastic-disaster-recovery-{{ Region }}.{{ S3InterfaceEndpoint }}/latest/linux/aws-replication-installer-init.py"
                - "computed_hash=$(sha512sum ./aws-replication-installer-init.py | cut -d' ' -f1)"
                - 'if [ "$computed_hash" != "$asset_hash" ]; then'
                - '  echo "Checksum validation failed" >&2'
                - "else"
                - "  pyexec=python3"
                - "  which python3"
                - "  ispy3=$?"
                - "  if [ $ispy3 -eq 1 ]; then pyexec=python; fi"
                - "  cat << EOF > install_agent.py"
                - "#!/usr/bin/python"
                - "import subprocess"
                - "import shlex"
                - 'raw_cmd = "$pyexec aws-replication-installer-init.py --no-prompt --region {0} --s3-endpoint {1}".format(''{{ Region }}'', ''{{ S3InterfaceEndpoint }}'')'
                - "cmd = shlex.split(raw_cmd)"
                - "if len('{{ Tags }}' ) > 0:"
                - "  tags_to_split='{{ Tags }}'"
                - "  tags=tags_to_split.split(',')"
                - '  cmd.append("--tags")'
                - "  for tag in tags:"
                - "    cmd.append(tag)"
                - "try:"
                - "  response = subprocess.check_output(cmd, shell=False)"
                - "except Exception as e:"
                - "  print(e)"
                - "  exit(1)"
                - "EOF"
                - "chmod +x install_agent.py"
                - "$pyexec install_agent.py"
                - "result=$?"
                - "fi"
                - "rm -f ./aws-installer.sha512 ./aws-replication-installer-init.py"
                - "rm -f install_agent.py"
                - "exit $result"

  ### Staging VPC & Subnet ###
  SourceStagingVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref PrimaryStagingVpcCidrParam
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: "primary-staging-vpc"
        - Key: addtotransitgateway
          Value: "true"
        - Key: staging
          Value: "true"
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W60
            reason: "VPC flow logs not required for this demo"

  StagingPrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref SourceStagingVpc
      CidrBlock: !Ref PrimaryStagingPrivateSubnetCidrParam
      AvailabilityZone:
        Fn::Select:
          - 0
          - Fn::GetAZs: !Ref "AWS::Region"
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: "primary-staging-private-subnet"

  StagingPrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref SourceStagingVpc
      Tags:
        - Key: Name
          Value: "primary-staging-private-route-table"
        - Key: staging
          Value: "true"

  StagingSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref StagingPrivateSubnet
      RouteTableId: !Ref StagingPrivateRouteTable

  ### Staging VPC Endpoints & SG ###
  StagingVPCEndpointSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for VPC endpoints
      VpcId: !Ref SourceStagingVpc
      Tags:
        - Key: Name
          Value: "primary-staging-vpc-endpoint-sg"
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W5
            reason: "open to world only for outbound traffic"
          - id: W40
            reason: "All protocol only for outbound traffic"

  StagingVPCEndpointIngress6:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref StagingVPCEndpointSG
      Description: Allow HTTPS from Recovery VPC
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: !Ref RecoveryVpcCidrParam

  StagingVPCEndpointIngress1:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref StagingVPCEndpointSG
      Description: Allow HTTPS from Source VPC
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: !Ref PrimarySourceVpcCidrParam

  StagingVPCEndpointIngress2:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref StagingVPCEndpointSG
      Description: Allow HTTPS from Staging VPC
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: !Ref PrimaryStagingVpcCidrParam

  StagingVPCEndpointIngress3:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref StagingVPCEndpointSG
      Description: Allow TCP/1500 from Source VPC
      IpProtocol: tcp
      FromPort: 1500
      ToPort: 1500
      CidrIp: !Ref PrimarySourceVpcCidrParam

  StagingVPCEndpointIngress4:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref StagingVPCEndpointSG
      Description: Allow UDP/53 from Source VPC
      IpProtocol: udp
      FromPort: 53
      ToPort: 53
      CidrIp: !Ref PrimarySourceVpcCidrParam

  StagingVPCEndpointIngress5:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref StagingVPCEndpointSG
      Description: Allow UDP/53 from Staging VPC
      IpProtocol: udp
      FromPort: 53
      ToPort: 53
      CidrIp: !Ref PrimaryStagingVpcCidrParam

  StagingVPCEndpointEgress1:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref StagingVPCEndpointSG
      Description: Allow all traffic to VPC endpoints
      IpProtocol: "-1"
      CidrIp: "0.0.0.0/0"

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Gateway
      VpcId: !Ref SourceStagingVpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      RouteTableIds:
        - !Ref StagingPrivateRouteTable

  DRSEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      SecurityGroupIds:
        - !Ref StagingVPCEndpointSG
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.drs"
      VpcId: !Ref SourceStagingVpc
      SubnetIds:
        - !Ref StagingPrivateSubnet
      PrivateDnsEnabled: true

  EC2Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      SecurityGroupIds:
        - !Ref StagingVPCEndpointSG
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ec2"
      VpcId: !Ref SourceStagingVpc
      SubnetIds:
        - !Ref StagingPrivateSubnet
      PrivateDnsEnabled: true

  ### Replication Server SG ###
  ReplicationServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Security group for DRS replication server"
      VpcId: !Ref SourceStagingVpc
      Tags:
        - Key: Name
          Value: "primary-staging-replication-server-sg"
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W5
            reason: "open to world only for outbound traffic"
          - id: W40
            reason: "All protocol only for outbound traffic"

  ReplicationServerSgIngress1:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ReplicationServerSecurityGroup
      Description: Allow TCP/1500 from Staging VPC
      IpProtocol: tcp
      FromPort: 1500
      ToPort: 1500
      CidrIp: !Ref PrimarySourceVpcCidrParam

  ReplicationServerSgIngress2:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ReplicationServerSecurityGroup
      Description: Allow HTTPS from Source VPC
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: !Ref PrimarySourceVpcCidrParam

  ReplicationServerSgIngress3:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ReplicationServerSecurityGroup
      Description: Allow HTTPS from Staging VPC
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: !Ref PrimaryStagingVpcCidrParam

  ReplicationServerSgEgress1:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref ReplicationServerSecurityGroup
      Description: Allow all traffic
      IpProtocol: "-1"
      CidrIp: "0.0.0.0/0"

Outputs:
  SourceTransitGatewayId:
    Description: "Primary-region TGW ID"
    Value: !Ref SourceTransitGateway
    Export:
      Name: SourceTransitGatewayId

  SourcePrivateRouteTableId:
    Description: "Primary-region private subnet route table"
    Value: !Ref SourcePrivateRouteTable
    Export:
      Name: SourcePrivateRouteTableId

  SourceStagingPrivateRouteTableId:
    Description: "Primary-region staging private subnet route table"
    Value: !Ref StagingPrivateRouteTable
    Export:
      Name: SourceStagingPrivateRouteTableId

  SourceVpcId:
    Description: "Primary-region VPC ID"
    Value: !Ref SourceVpc
    Export:
      Name: SourceVpcId

  SourceStagingVpcId:
    Description: "Primary-region staging VPC ID"
    Value: !Ref SourceStagingVpc
    Export:
      Name: SourceStagingVpcId