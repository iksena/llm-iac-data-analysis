AWSTemplateFormatVersion: "2010-09-09"

Description: |
  This stack creates different EC2 Volumes and an S3 bucket with specific configurations

Parameters:
  KmsKeyId:
    Description: The KMS key master ID
    Type: String

Resources:
  # An EC2 volume
  Volume:
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Type: AWS::EC2::Volume
    Properties:
      AvailabilityZone: !Select [0, Fn::GetAZs: !Ref "AWS::Region"]
      Encrypted: true
      KmsKeyId: !Ref KmsKeyId
      Size: 10
      VolumeType: gp2

  # An EC2 gp3 volume
  VolumeGp3:
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Type: AWS::EC2::Volume
    Properties:
      AvailabilityZone: !Select [0, Fn::GetAZs: !Ref "AWS::Region"]
      Encrypted: true
      Iops: 3000
      KmsKeyId: !Ref KmsKeyId
      Size: 10
      Throughput: 125
      VolumeType: gp3

  # An EC2 io2 volume
  VolumeIo2:
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Type: AWS::EC2::Volume
    Properties:
      AvailabilityZone: !Select [0, Fn::GetAZs: !Ref "AWS::Region"]
      Encrypted: true
      KmsKeyId: !Ref KmsKeyId
      Size: 10
      Iops: 100
      VolumeType: io2

  # S3 bucket with versioning and encryption
  S3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-s3-bucket"
      VersioningConfiguration:
        Status: Enabled
      ServerSideEncryptionConfiguration:
        Rules:
          - ApplyServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref KmsKeyId
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

  # Adding a CloudWatch alarm to monitor the S3 bucket's storage utilization
  S3BucketAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-s3-bucket-alarm"
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 1
      MetricName: BucketSizeBytes
      Namespace: AWS/S3
      Period: 300
      Statistic: Maximum
      Threshold: 90
      ActionsEnabled: false
      AlarmDescription: Alarm when S3 bucket storage exceeds 90% of its limit
      Dimensions:
        - Name: BucketName
          Value: !Ref S3Bucket
      AlarmActions:
        - !Ref SnsTopic
      OkActions:
        - !Ref SnsTopic

  # SNS topic for alarm notifications
  SnsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-sns-topic"