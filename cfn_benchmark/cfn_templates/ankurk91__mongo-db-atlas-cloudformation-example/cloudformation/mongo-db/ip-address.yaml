AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Whitelist IP addresses for Mongo DB Access

Parameters:
  ProjectId:
    Type: String
    Description: Unique 24-hexadecimal digit string that identifies your project

  ProfileName:
    Type: String
    Description: Secret Manager Profile that contains the Atlas Programmatic keys

  NATGatewayIP:
    Type: String
    Description: NAT Gateway IP address

Resources:
  AtlasIpAccessList:
    Type: MongoDB::Atlas::ProjectIpAccessList
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            - E3006
    Properties:
      Profile: !Ref ProfileName
      ProjectId: !Ref ProjectId
      AccessList:
        - IPAddress: !Ref NATGatewayIP
          Comment: "NAT Gateway"