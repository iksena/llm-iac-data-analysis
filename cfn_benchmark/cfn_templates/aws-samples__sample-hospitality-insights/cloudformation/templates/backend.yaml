              "Choices": [
                {
                  "Variable": "$.pendingPosts.Payload.count",
                  "NumericGreaterThan": 0,
                  "Next": "ProcessPostsMap"
                }
              ],
              "Default": "NoPosts"
            },
            "NoPosts": {
              "Type": "Pass",
              "Result": {
                "Payload": {
                  "processed": 0,
                  "filtered": 0,
                  "outages": {}
                }
              },
              "ResultPath": "$.analysisResult",
              "Next": "DetectAlerts"
            },
            "ProcessPostsMap": {
              "Type": "Map",
              "ToleratedFailurePercentage": 10,
              "ItemReader": {
                "Resource": "arn:aws:states:::s3:getObject",
                "ReaderConfig": {
                  "InputType": "JSONL",
                  "MaxItems": 10000
                },
                "Parameters": {
                  "Bucket.$": "$.pendingPosts.Payload.bucket",
                  "Key.$": "$.pendingPosts.Payload.key"
                }
              },
              "MaxConcurrency": 5,
              "ItemProcessor": {
                "ProcessorConfig": {
                  "Mode": "DISTRIBUTED",
                  "ExecutionType": "EXPRESS"
                },
                "StartAt": "CheckToxicity",
                "States": {
                  "CheckToxicity": {
                    "Type": "Task",
                    "Resource": "arn:aws:states:::lambda:invoke",
                    "Parameters": {
                      "FunctionName": "${ToxicityCheckerFunction}",
                      "Payload.$": "$"
                    },
                    "ResultSelector": {
                      "platformSourceId.$": "$.Payload.platformSourceId",
                      "timestampPostId.$": "$.Payload.timestampPostId",
                      "isToxic.$": "$.Payload.isToxic"
                    },
                    "Next": "IsToxic"
                  },
                  "IsToxic": {
                    "Type": "Choice",
                    "Choices": [
                      {
                        "Variable": "$.isToxic",
                        "BooleanEquals": true,
                        "Next": "PostFiltered"
                      }
                    ],
                    "Default": "AnalyzeSentiment"
                  },
                  "PostFiltered": {
                    "Type": "Pass",
                    "Result": {
                      "filtered": true
                    },
                    "End": true
                  },
                  "AnalyzeSentiment": {
                    "Type": "Task",
                    "Resource": "arn:aws:states:::lambda:invoke",
                    "Parameters": {
                      "FunctionName": "${SentimentAnalyzerSingleFunction}",
                      "Payload.$": "$"
                    },
                    "ResultSelector": {
                      "platformSourceId.$": "$.Payload.platformSourceId",
                      "timestampPostId.$": "$.Payload.timestampPostId",
                      "sentiment.$": "$.Payload.sentiment"
                    },
                    "Next": "ClassifyIssue"
                  },
                  "ClassifyIssue": {
                    "Type": "Task",
                    "Resource": "arn:aws:states:::lambda:invoke",
                    "Parameters": {
                      "FunctionName": "${IssueClassifierSingleFunction}",
                      "Payload.$": "$"
                    },
                    "ResultSelector": {
                      "platformSourceId.$": "$.Payload.platformSourceId",
                      "timestampPostId.$": "$.Payload.timestampPostId",
                      "sentiment.$": "$.Payload.sentiment",
                      "issueClassification.$": "$.Payload.issueClassification"
                    },
                    "Next": "StoreResult"
                  },
                  "StoreResult": {
                    "Type": "Task",
                    "Resource": "arn:aws:states:::lambda:invoke",
                    "Parameters": {
                      "FunctionName": "${StoreAnalysisResultFunction}",
                      "Payload.$": "$"
                    },
                    "ResultPath": null,
                    "End": true
                  }
                }
              },
              "ResultPath": null,
              "Next": "AggregateOutages"
            },
            "AggregateOutages": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${AggregateOutagesFunction}",
                "Payload": {}
              },
              "ResultPath": "$.analysisResult",
              "Next": "CheckOutagesDetected"
            },
            "CheckOutagesDetected": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.analysisResult.Payload.hasOutages",
                  "BooleanEquals": true,
                  "Next": "VerifyOutages"
                }
              ],
              "Default": "DetectAlerts"
            },
            "VerifyOutages": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${OutageVerifierFunction}",
