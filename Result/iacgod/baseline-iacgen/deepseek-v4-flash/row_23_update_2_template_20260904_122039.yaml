AWSTemplateFormatVersion: "2010-09-09"
Description: "Amazon Verified Permissions policy store for Bookstore application with Cedar-based access control"
Resources:
  BookstorePolicyStore:
    Type: AWS::VerifiedPermissions::PolicyStore
    Properties:
      ValidationSettings:
        Mode: STRICT
      Description: "Policy store for Bookstore application with Role, User, and Book entities"

  BookstoreSchema:
    Type: AWS::VerifiedPermissions::PolicyStore
    Properties:
      PolicyStoreId: !Ref BookstorePolicyStore
      ValidationSettings:
        Mode: STRICT
      Description: "Schema for Bookstore application with Cedar entity types and actions"

  AdminViewAllPolicy:
    Type: AWS::VerifiedPermissions::Policy
    Properties:
      PolicyStoreId: !Ref BookstorePolicyStore
      Definition:
        Static:
          Description: "Permit users in Admin role to view any book"
          Statement: |
            permit (principal in Bookstore::Role::"Admin", action == Bookstore::Action::"View", resource in Bookstore::Book::"*");

  ForbidAdminViewPolicy:
    Type: AWS::VerifiedPermissions::Policy
    Properties:
      PolicyStoreId: !Ref BookstorePolicyStore
      Definition:
        Static:
          Description: "Explicitly forbid specific admin from viewing books"
          Statement: |
            forbid (principal == Bookstore::User::"admin1", action == Bookstore::Action::"View", resource in Bookstore::Book::"*");

  PublisherViewOwnPolicy:
    Type: AWS::VerifiedPermissions::Policy
    Properties:
      PolicyStoreId: !Ref BookstorePolicyStore
      Definition:
        Static:
          Description: "Permit users in Publisher role to view only their own books"
          Statement: |
            permit (principal in Bookstore::Role::"Publisher", action == Bookstore::Action::"View", resource == Bookstore::Book::"*")
            when { resource.owningUser == principal };

  SpecificUserViewSpecificBookPolicy:
    Type: AWS::VerifiedPermissions::Policy
    Properties:
      PolicyStoreId: !Ref BookstorePolicyStore
      Definition:
        Static:
          Description: "Permit specific user to view specific book"
          Statement: |
            permit (principal == Bookstore::User::"user1", action == Bookstore::Action::"View", resource == Bookstore::Book::"book1");

  CustomerViewPremiumOffersPolicy:
    Type: AWS::VerifiedPermissions::Policy
    Properties:
      PolicyStoreId: !Ref BookstorePolicyStore
      Definition:
        Static:
          Description: "Permit Customer role with 2+ years membership to view premium offers"
          Statement: |
            permit (principal in Bookstore::Role::"Customer", action == Bookstore::Action::"ViewWithPremiumOffers", resource in Bookstore::Book::"*")
            when { principal.yearsAsMember >= 2 };

  ForbidCustomerPremiumOffersPolicy:
    Type: AWS::VerifiedPermissions::Policy
    Properties:
      PolicyStoreId: !Ref BookstorePolicyStore
      Definition:
        Static:
          Description: "Forbid Customer role with less than 2 years membership from viewing premium offers"
          Statement: |
            forbid (principal in Bookstore::Role::"Customer", action == Bookstore::Action::"ViewWithPremiumOffers", resource in Bookstore::Book::"*")
            when { principal.yearsAsMember < 2 };

  ForbidNonUSRegionPolicy:
    Type: AWS::VerifiedPermissions::Policy
    Properties:
      PolicyStoreId: !Ref BookstorePolicyStore
      Definition:
        Static:
          Description: "Forbid View and ViewWithPremiumOffers when region is not US"
          Statement: |
            forbid (principal in Bookstore::User::"*", action in [Bookstore::Action::"View", Bookstore::Action::"ViewWithPremiumOffers"], resource in Bookstore::Book::"*")
            when { context.region != "US" };

  PolicyStoreIdParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: "/bookstore/policy-store-id"
      Type: String
      Value: !Ref BookstorePolicyStore
      Description: "Policy store ID for Bookstore application"

Outputs:
  PolicyStoreId:
    Description: "ID of the Bookstore policy store"
    Value: !Ref BookstorePolicyStore
  PolicyStoreArn:
    Description: "ARN of the Bookstore policy store"
    Value: !GetAtt BookstorePolicyStore.Arn