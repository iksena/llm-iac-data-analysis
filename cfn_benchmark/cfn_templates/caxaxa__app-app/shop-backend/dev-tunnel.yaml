AWSTemplateFormatVersion: '2010-09-09'
Description: Development Tunnel - API Gateway Proxy to Local Development Environment

Parameters:
  LocalIP:
    Type: String
    Description: Public IP of development machine
    Default: "127.0.0.1"
  LocalPort:
    Type: String
    Description: Local port where SAM is running
    Default: "3002"

Resources:
  # API Gateway for tunneling
  DevTunnelApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: dev-tunnel-proxy
      Description: HTTP proxy to local development environment
      EndpointConfiguration:
        Types:
          - REGIONAL

  # Proxy resource to catch all paths
  ProxyResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref DevTunnelApi
      ParentId: !GetAtt DevTunnelApi.RootResourceId
      PathPart: '{proxy+}'

  # OPTIONS method for CORS
  OptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref DevTunnelApi
      ResourceId: !Ref ProxyResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
              method.response.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: ''
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: false
            method.response.header.Access-Control-Allow-Methods: false
            method.response.header.Access-Control-Allow-Origin: false

  # Proxy method for all HTTP methods
  ProxyMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref DevTunnelApi
      ResourceId: !Ref ProxyResource
      HttpMethod: ANY
      AuthorizationType: NONE
      RequestParameters:
        method.request.path.proxy: true
      Integration:
        Type: HTTP_PROXY
        IntegrationHttpMethod: ANY
        Uri: !Sub 'http://${LocalIP}:${LocalPort}/{proxy}'
        RequestParameters:
          integration.request.path.proxy: method.request.path.proxy
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: false

  # Root resource methods (for root path requests)
  RootOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref DevTunnelApi
      ResourceId: !GetAtt DevTunnelApi.RootResourceId
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key'"
              method.response.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: ''
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: false
            method.response.header.Access-Control-Allow-Methods: false
            method.response.header.Access-Control-Allow-Origin: false

  RootProxyMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref DevTunnelApi
      ResourceId: !GetAtt DevTunnelApi.RootResourceId
      HttpMethod: ANY
      AuthorizationType: NONE
      Integration:
        Type: HTTP_PROXY
        IntegrationHttpMethod: ANY
        Uri: !Sub 'http://${LocalIP}:${LocalPort}/'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: false

  # Deployment
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - ProxyMethod
      - OptionsMethod
      - RootProxyMethod
      - RootOptionsMethod
    Properties:
      RestApiId: !Ref DevTunnelApi
      StageName: dev

Outputs:
  DevTunnelUrl:
    Description: Development tunnel URL for WhatsApp webhooks
    Value: !Sub 'https://${DevTunnelApi}.execute-api.${AWS::Region}.amazonaws.com/dev'
    Export:
      Name: DevTunnelUrl

  WebhookUrl:
    Description: WhatsApp webhook URL (append /whatsapp-webhook)
    Value: !Sub 'https://${DevTunnelApi}.execute-api.${AWS::Region}.amazonaws.com/dev/whatsapp-webhook'
    Export:
      Name: DevTunnelWebhookUrl