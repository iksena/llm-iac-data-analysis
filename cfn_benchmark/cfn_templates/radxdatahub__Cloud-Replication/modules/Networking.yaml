  #     SecurityGroupIds:
  #       - !Ref ECSHostSecurityGroup

# S3 VPC ENDPOINT
  RADxS3VPCEndpoint:
      Type: "AWS::EC2::VPCEndpoint"
      Properties:
          VpcEndpointType: "Interface"
          VpcId: !Ref RADxVPC
          ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
          PolicyDocument: |
              {
                "Statement": [
                  {
                    "Action": "*",
                    "Effect": "Allow",
                    "Principal": "*",
                    "Resource": "*"
                  }
                ]
              }
          SubnetIds:
            - !Ref RADxPrivateSubnetAZ1
            - !Ref RADxPrivateSubnetAZ2
          PrivateDnsEnabled: false
          SecurityGroupIds:
            - !Ref ECSHostSecurityGroup

# DATASYNC VPC ENDPOINT
  # RADxVPCEndpoint3:
  #   Type: "AWS::EC2::VPCEndpoint"
  #   Properties:
  #     VpcEndpointType: "Interface"
  #     VpcId: !Ref RADxVPC
  #     ServiceName: !Sub "com.amazonaws.${AWS::Region}.datasync"
  #     PolicyDocument: |
  #         {
  #           "Statement": [
  #             {
  #               "Action": "*",
  #               "Effect": "Allow",
  #               "Principal": "*",
  #               "Resource": "*"
  #             }
  #           ]
  #         }
  #     SubnetIds:
  #       - !Ref RADxPrivateSubnetAZ1
  #       - !Ref RADxPrivateSubnetAZ2
  #     PrivateDnsEnabled: true
  #     SecurityGroupIds:
  #       - "sg-0aa8e3f5049fbe1bf"

  RADxVPCGatewayAttachment:
    Type: "AWS::EC2::VPCGatewayAttachment"
    Properties:
      InternetGatewayId: !Ref RADxInternetGateway
      VpcId: !Ref RADxVPC

  EC2SubnetRouteTableAssociation:
      Type: "AWS::EC2::SubnetRouteTableAssociation"
      Properties:
        RouteTableId: !Ref RADxPrivateRoutesAZ1
        SubnetId: !Ref RADxPrivateSubnetAZ1

  EC2SubnetRouteTableAssociation2:
    Type: "AWS::EC2::SubnetRouteTableAssociation"
    Properties:
      RouteTableId: !Ref RADxPrivateRoutesAZ2
      SubnetId: !Ref  RADxPrivateSubnetAZ2

  EC2SubnetRouteTableAssociation3:
    Type: "AWS::EC2::SubnetRouteTableAssociation"
    Properties:
        RouteTableId: !Ref RADxPublicRoutesAZ1
        SubnetId: !Ref RADxPublicSubnetAZ1

  EC2SubnetRouteTableAssociation4:
    Type: "AWS::EC2::SubnetRouteTableAssociation"
    Properties:
      RouteTableId: !Ref RADxPublicRoutesAZ2
      SubnetId: !Ref RADxPublicSubnetAZ2

  ECSHostSecurityGroup:
      Type: AWS::EC2::SecurityGroup
      Properties:
          VpcId: !Ref RADxVPC
          GroupDescription: Access to the ECS hosts and the tasks/containers that run on them
          SecurityGroupIngress:
              # Only allow inbound access to ECS from the ELB
              - SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
                IpProtocol: -1
              - CidrIp: 10.40.0.0/16
                IpProtocol: -1
          Tags:
              - Key: Name
                Value: !Sub "${ProjectNameUpper}-ECS-Hosts-${Environment}"

  # This security group defines who/where is allowed to access the Application Load Balancer.
  # By default, we've opened this up to the public internet (0.0.0.0/0) but can you restrict
  # it further if you want.
  LoadBalancerSecurityGroup:
      Type: AWS::EC2::SecurityGroup
      Properties:
          VpcId: !Ref RADxVPC
          GroupDescription: Access to the load balancer that sits in front of ECS
          SecurityGroupIngress:
              # Allow access from anywhere to our ECS services
              - CidrIp: 10.40.0.0/16
                IpProtocol: -1
          Tags:
              - Key: Name
                Value: !Sub "${ProjectNameUpper}-LoadBalancers-${Environment}"

Outputs:
  VpcId:
    Value: !Ref RADxVPC
    Export:
      Name: !Sub "${AWS::StackName}-VPC-ID"

  PublicSubnetAZ1:
    Value: !Ref RADxPublicSubnetAZ1
    Export:
      Name: !Sub "${AWS::StackName}-Public-Subnet-AZ1"

  PublicSubnetAZ2:
    Value: !Ref RADxPublicSubnetAZ2
    Export:
      Name: !Sub "${AWS::StackName}-Public-Subnet-AZ2"

  PrivateSubnetAZ1:
    Value: !Ref RADxPrivateSubnetAZ1
    Export:
      Name: !Sub "${AWS::StackName}-Private-Subnet-AZ1"

  PrivateSubnetAZ2:
    Value: !Ref RADxPrivateSubnetAZ2
    Export:
      Name: !Sub "${AWS::StackName}-Private-Subnet-AZ2"

  LoadBalancerSecurityGroup:
    Value: !Ref LoadBalancerSecurityGroup
    Export:
      Name: !Sub "${AWS::StackName}-LoadBalancer-SecurityGroup"

  ECSHostSecurityGroup:
    Value: !Ref ECSHostSecurityGroup
    Export:
      Name: !Sub "${AWS::StackName}-ECS-Host-SecurityGroup"