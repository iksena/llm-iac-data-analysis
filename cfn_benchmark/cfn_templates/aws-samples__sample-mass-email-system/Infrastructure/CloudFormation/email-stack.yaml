  CampaignListDynamoDBPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Allows CampaignList Lambda to read campaign tracking tables
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:Scan
              - dynamodb:GetItem
              - dynamodb:Query
              - dynamodb:DescribeTable
            # Dynamic campaign-specific table names require wildcard pattern
            Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/*email-*-tracking*
          # ListTables is required to discover archived campaigns whose Step Functions
          # execution history has expired or belongs to a previous deployment. The API
          # does not operate on a specific table, so it cannot be resource-scoped.
          - Effect: Allow
            Action:
              - dynamodb:ListTables
            Resource: '*'

  CampaignListKMSPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Allows CampaignList Lambda to decrypt with KMS keys
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - kms:Decrypt
              - kms:DescribeKey
            Resource:
              - !Ref LambdaKMSKeyArn
              - !GetAtt DynamoDBKMSKey.Arn
          # Renaming a campaign writes to the encrypted campaign registry, and DynamoDB
          # needs to wrap a data key to do that. Reading alone does not require these, so
          # they are scoped to this stack's DynamoDB CMK and to use through DynamoDB.
          - Effect: Allow
            Action:
              - kms:Encrypt
              - kms:GenerateDataKey
            Resource: !GetAtt DynamoDBKMSKey.Arn
            Condition:
              StringEquals:
                kms:ViaService: !Sub dynamodb.${AWS::Region}.amazonaws.com
          # Tracking tables created by earlier deployments are encrypted with that
          # deployment's own CMK, whose id this stack cannot know. Without this the campaign
          # list can list those tables but never read them: DynamoDB fails the decrypt and
          # the campaign silently appears to have no data at all.
          #
          # Every deployment of this system creates its DynamoDB key with the alias
          # <stackname>-dynamodb, and the stack name always ends in '-email', so the alias
          # pattern below identifies this system's keys across deployments while excluding
          # unrelated keys in the account.
          #
          # Narrowed three ways: to KMS keys in this account and Region, to keys carrying
          # one of this system's aliases, and to use through DynamoDB on this role's behalf.
          # The DynamoDB policy above independently limits which tables that covers.
          #
          # Note that aliases are mutable, so this trusts whoever can manage KMS aliases in
          # this account not to point a matching alias at an unrelated key. Replace this
          # statement with explicit key ARNs if that assumption does not hold for you.
          #
          # Encrypt and GenerateDataKey are included so that a campaign recorded by an
          # earlier deployment can still be renamed: its registry is encrypted with that
          # deployment's own CMK, which this stack cannot name. They add no trust beyond the
          # Decrypt already granted here under the identical condition.
          - Effect: Allow
            Action:
              - kms:Decrypt
              - kms:DescribeKey
              - kms:Encrypt
              - kms:GenerateDataKey
            Resource: !Sub arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*
            Condition:
              ForAnyValue:StringLike:
                kms:ResourceAliases: alias/*-email-dynamodb
              StringEquals:
                kms:ViaService: !Sub dynamodb.${AWS::Region}.amazonaws.com

