AWSTemplateFormatVersion: 2010-09-09
Description: CloudFormation template to create a SageMaker notebook instance for RAPIDS AI development
Parameters:
  NotebookInstanceName:
    Type: String
    Default: rapidsai
    Description: Name of the SageMaker notebook instance
  InstanceType:
    Type: String
    Default: ml.p3.2xlarge
    Description: Instance type for the notebook (GPU-enabled)
  VolumeSizeInGB:
    Type: Number
    Default: 50
    Description: Size of the EBS volume in GB
  RepositoryUrl:
    Type: String
    Default: https://github.com/rapidsai/notebooks.git
    Description: URL of the git repository to clone
Resources:
  SageMakerLifecycleConfig:
    Type: AWS::SageMaker::NotebookInstanceLifecycleConfig
    Properties:
      NotebookInstanceLifecycleConfigName: rapidsai-lifecycle-config
      OnCreate:
        - Content:
            Fn::Base64: !Sub |
              #!/bin/bash
              set -e
              # Install RAPIDS AI conda environment
              conda create -n rapids -c rapidsai -c nvidia -c conda-forge \
                rapids=24.12 python=3.10 cudatoolkit=11.0 -y
              # Register Jupyter kernel
              /home/ec2-user/anaconda3/envs/JupyterSystemEnv/bin/python -m ipykernel install \
                --user --name rapids --display-name "RAPIDS AI"
      OnStart:
        - Content:
            Fn::Base64: !Sub |
              #!/bin/bash
              set -e
              # Clone repository if not already present
              if [ ! -d /home/ec2-user/SageMaker/notebooks ]; then
                git clone ${RepositoryUrl} /home/ec2-user/SageMaker/notebooks
              fi
  SageMakerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: sagemaker.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSageMakerFullAccess
      Policies:
        - PolicyName: rapidsai-lifecycle-permissions
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - sage-maker:CreatePresignedNotebookInstanceUrl
                  - ec2:DescribeNetworkInterfaces
                Resource: '*'
  SageMakerNotebookInstance:
    Type: AWS::SageMaker::NotebookInstance
    Properties:
      NotebookInstanceName: !Ref NotebookInstanceName
      InstanceType: !Ref InstanceType
      RoleArn: !GetAtt SageMakerExecutionRole.Arn
      LifecycleConfigName: !Ref SageMakerLifecycleConfig
      VolumeSizeInGB: !Ref VolumeSizeInGB
      DefaultCodeRepository: !Ref RepositoryUrl
Outputs:
  NotebookInstanceArn:
    Description: ARN of the SageMaker notebook instance
    Value: !GetAtt SageMakerNotebookInstance.NotebookInstanceArn
  NotebookInstanceName:
    Description: Name of the SageMaker notebook instance
    Value: !Ref NotebookInstanceName
  ExecutionRoleArn:
    Description: ARN of the IAM role for SageMaker
    Value: !GetAtt SageMakerExecutionRole.Arn