AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  codeML

  Sample SAM Template for codeML

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 900 # 15 minutes, maximum allowed value
    Handler: app.lambda_handler
    Runtime: python3.9
    Tracing: Active
    Architectures:
      - x86_64

Parameters:
  AppSyncApiName:
    Type: String
    Default: codeML-API
    Description: The GraphQL Api Name
  Env:
    Type: String
    Default: dev
    Description: The environment of the stack. One of [dev, prod].

Resources:
  # AppSync Api
  GraphqlApi:
    Type: AWS::Serverless::Application
    Properties:
      Location: ./graphql-api/template.yaml
      Parameters:
        AppSyncApiName: !Ref AppSyncApiName
        Env: !Ref Env
        # UserPoolId: !Ref UserPool
        SubmissionTableName:
          !Select [1, !Split ["/", !GetAtt SubmissionTable.Arn]]
        ChallengeTableName:
          !Select [1, !Split ["/", !GetAtt ChallengeTable.Arn]]
        TeamTableName: !Select [1, !Split ["/", !GetAtt TeamTable.Arn]]
        createSubmissionInputValidationLambdaFunctionArn: !GetAtt LambdaFunctions.Outputs.createSubmissionInputValidationLambdaFunctionArn
        getSubmissionLinkLambdaFunctionArn: !GetAtt LambdaFunctions.Outputs.getSubmissionLinkLambdaFunctionArn
        setFinalSubmissionLambdaFunctionArn: !GetAtt LambdaFunctions.Outputs.setFinalSubmissionLambdaFunctionArn
        authorizationLambdaFunctionArn: !GetAtt LambdaFunctions.Outputs.authorizationLambdaFunctionArn
        getHiddenPerformancesLambdaFunctionArn: !GetAtt LambdaFunctions.Outputs.getHiddenPerformancesLambdaFunctionArn
  LambdaFunctions:
    Type: AWS::Serverless::Application
    Properties:
      Location: ./lambdas/template.yaml
      Parameters:
        Env: !Ref Env
        SubmissionTableArn: !GetAtt SubmissionTable.Arn
        TeamTableArn: !GetAtt TeamTable.Arn
        PrivateDatasetsBucketArn: !GetAtt PrivateDatasetsBucket.Arn
        PredictionsBucketArn: !GetAtt PredictionsBucket.Arn
        ModelBucketArn: !GetAtt ModelBucket.Arn
        ModelBucketName: !Ref ModelBucket
        PredictionsBucketName: !Ref PredictionsBucket
        PrivateDatasetsBucketName: !Ref PrivateDatasetsBucket
        SubmissionTableStreamArn: !GetAtt SubmissionTable.StreamArn

  ModelBucket:
    Type: AWS::S3::Bucket
    Properties:
      CorsConfiguration:
        CorsRules:
          - AllowedMethods:
              - "GET"
              - "PUT"
              - "HEAD"
              - "POST"
              - "DELETE"
            AllowedOrigins:
              - "*"
            AllowedHeaders:
              - "*"
  # ModelBucketPolicy:
  #   Type: AWS::S3::BucketPolicy
  #   Properties:
  #     Bucket: !Ref ModelBucket
  #     PolicyDocument:
  #       Version: 2012-10-17
  #       Statement:
  #         - Action:
  #             - "s3:PutObject"
  #           Effect: Allow
  #           Resource:
  #             - !Sub "${ModelBucket.Arn}/*"
  #           Principal: "*"
  PredictionsBucket:
    Type: AWS::S3::Bucket
    Properties:
      CorsConfiguration:
        CorsRules:
          - AllowedMethods:
              - "GET"
              - "PUT"
              - "HEAD"
              - "POST"
              - "DELETE"
            AllowedOrigins:
              - "*"
            AllowedHeaders:
              - "*"
  # PredictionsBucketPolicy:
  #   Type: AWS::S3::BucketPolicy
  #   Properties:
  #     Bucket: !Ref PredictionsBucket
  #     PolicyDocument:
  #       Version: 2012-10-17
  #       Statement:
  #         - Action:
  #             - "s3:PutObject"
  #           Effect: Allow
  #           Resource:
  #             - !Sub "${PredictionsBucket.Arn}/*"
  #           Principal: "*"
  PublicDatasetsBucket:
    Type: AWS::S3::Bucket
    Properties:
      CorsConfiguration:
        CorsRules:
          - AllowedMethods:
              - "GET"
              - "PUT"
              - "HEAD"
              - "POST"
              - "DELETE"
            AllowedOrigins:
              - "*"
            AllowedHeaders:
              - "*"
  # PublicDatasetsBucketPolicy:
  #   Type: AWS::S3::BucketPolicy
  #   Properties:
  #     Bucket: !Ref PublicDatasetsBucket
  #     PolicyDocument:
  #       Version: 2012-10-17
  #       Statement:
  #         - Action:
  #             - "s3:GetObject"
  #           Effect: Allow
  #           Resource:
  #             - !Sub "${PublicDatasetsBucket.Arn}/*"
  #           Principal: "*"
  #         - Action:
  #             - "s3:ListBucket"
  #           Effect: Allow
  #           Resource:
  #             - !Sub "${PublicDatasetsBucket.Arn}"
  #           Principal: "*"

  PrivateDatasetsBucket:
    Type: AWS::S3::Bucket

  # Data Sources
  SubmissionTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: challengeId
          AttributeType: S
        - AttributeName: teamId
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S

      KeySchema:
        - AttributeName: id
          KeyType: HASH
      # Workload is not predictable, thus this billing mode
      BillingMode: PAY_PER_REQUEST
      # Specifies what is shown in the stream of the dynamoDB (only new image in this case)
      StreamSpecification:
        StreamViewType: NEW_IMAGE
      GlobalSecondaryIndexes:
        - IndexName: byChallenge
          KeySchema:
            - AttributeName: challengeId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: byTeam
          KeySchema:
            - AttributeName: teamId
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
  ChallengeTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      # Workload is not predictable, thus this billing mode
      BillingMode: PAY_PER_REQUEST
      # Specifies what is shown in the stream of the dynamoDB (only new image in this case)
      StreamSpecification:
        StreamViewType: NEW_IMAGE

  TeamTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      # Workload is not predictable, thus this billing mode
      BillingMode: PAY_PER_REQUEST
      # Specifies what is shown in the stream of the dynamoDB (only new image in this case)
      StreamSpecification:
        StreamViewType: NEW_IMAGE
  AllowSubmissionsParameterStore:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "${Env}-allow-submissions"
      Description: "Whether the application allows participants to upload their results."
      Type: String
      Value: "True"

Outputs:
  ApiUrl:
    Description: "GraphQL API endpoint"
    Value: !GetAtt GraphqlApi.Outputs.ApiUrl
# UserPoolId:
#   Description: "The id for the user pool"
#   Value: !Ref UserPool