AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFormation template for a DynamoDB test table with on-demand billing, point-in-time recovery, and comprehensive CloudWatch monitoring alarms.'
Parameters:
  TableName:
    Type: String
    Default: TestTable
    Description: Name of the DynamoDB table (for testing purposes).
  AlarmActionsSNSTopicArn:
    Type: String
    Default: ''
    Description: 'Optional ARN of an SNS topic to receive alarm notifications. If left empty, no actions are triggered.'
Conditions:
  HasAlarmActions: !Not [!Equals [!Ref AlarmActionsSNSTopicArn, '']]
Resources:
  DynamoDBTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      AttributeDefinitions:
        - AttributeName: USER_ID
          AttributeType: S
      KeySchema:
        - AttributeName: USER_ID
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  WriteThrottleEventsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${TableName}-WriteThrottleEvents'
      AlarmDescription: !Sub 'Alarm when WriteThrottleEvents exceeds 1 for table ${TableName}'
      Namespace: AWS/DynamoDB
      MetricName: WriteThrottleEvents
      Dimensions:
        - Name: TableName
          Value: !Ref DynamoDBTable
      Period: 60
      EvaluationPeriods: 1
      Statistic: Sum
      Threshold: 1
      ComparisonOperator: GreaterThanThreshold
      ActionsEnabled: !If [HasAlarmActions, true, false]
      AlarmActions: !If [HasAlarmActions, [!Ref AlarmActionsSNSTopicArn], !Ref AWS::NoValue]
  ThrottledRequestsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${TableName}-ThrottledRequests'
      AlarmDescription: !Sub 'Alarm when ThrottledRequests exceeds 1 for table ${TableName}'
      Namespace: AWS/DynamoDB
      MetricName: ThrottledRequests
      Dimensions:
        - Name: TableName
          Value: !Ref DynamoDBTable
      Period: 60
      EvaluationPeriods: 1
      Statistic: Sum
      Threshold: 1
      ComparisonOperator: GreaterThanThreshold
      ActionsEnabled: !If [HasAlarmActions, true, false]
      AlarmActions: !If [HasAlarmActions, [!Ref AlarmActionsSNSTopicArn], !Ref AWS::NoValue]
  ConditionalCheckFailedRequestsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${TableName}-ConditionalCheckFailedRequests'
      AlarmDescription: !Sub 'Alarm when ConditionalCheckFailedRequests exceeds 1 for table ${TableName}'
      Namespace: AWS/DynamoDB
      MetricName: ConditionalCheckFailedRequests
      Dimensions:
        - Name: TableName
          Value: !Ref DynamoDBTable
      Period: 60
      EvaluationPeriods: 1
      Statistic: Sum
      Threshold: 1
      ComparisonOperator: GreaterThanThreshold
      ActionsEnabled: !If [HasAlarmActions, true, false]
      AlarmActions: !If [HasAlarmActions, [!Ref AlarmActionsSNSTopicArn], !Ref AWS::NoValue]
  UserErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${TableName}-UserErrors'
      AlarmDescription: !Sub 'Alarm when UserErrors exceeds 1 for table ${TableName}'
      Namespace: AWS/DynamoDB
      MetricName: UserErrors
      Dimensions:
        - Name: TableName
          Value: !Ref DynamoDBTable
      Period: 60
      EvaluationPeriods: 1
      Statistic: Sum
      Threshold: 1
      ComparisonOperator: GreaterThanThreshold
      ActionsEnabled: !If [HasAlarmActions, true, false]
      AlarmActions: !If [HasAlarmActions, [!Ref AlarmActionsSNSTopicArn], !Ref AWS::NoValue]
  SystemErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${TableName}-SystemErrors'
      AlarmDescription: !Sub 'Alarm when SystemErrors exceeds 1 for table ${TableName}'
      Namespace: AWS/DynamoDB
      MetricName: SystemErrors
      Dimensions:
        - Name: TableName
          Value: !Ref DynamoDBTable
      Period: 60
      EvaluationPeriods: 1
      Statistic: Sum
      Threshold: 1
      ComparisonOperator: GreaterThanThreshold
      ActionsEnabled: !If [HasAlarmActions, true, false]
      AlarmActions: !If [HasAlarmActions, [!Ref AlarmActionsSNSTopicArn], !Ref AWS::NoValue]
  TransactionConflictAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${TableName}-TransactionConflict'
      AlarmDescription: !Sub 'Alarm when TransactionConflict exceeds 1 for table ${TableName}'
      Namespace: AWS/DynamoDB
      MetricName: TransactionConflict
      Dimensions:
        - Name: TableName
          Value: !Ref DynamoDBTable
      Period: 60
      EvaluationPeriods: 1
      Statistic: Sum
      Threshold: 1
      ComparisonOperator: GreaterThanThreshold
      ActionsEnabled: !If [HasAlarmActions, true, false]
      AlarmActions: !If [HasAlarmActions, [!Ref AlarmActionsSNSTopicArn], !Ref AWS::NoValue]
  OnlineIndexThrottleEventsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${TableName}-OnlineIndexThrottleEvents'
      AlarmDescription: !Sub 'Alarm when OnlineIndexThrottleEvents exceeds 10 for table ${TableName}'
      Namespace: AWS/DynamoDB
      MetricName: OnlineIndexThrottleEvents
      Dimensions:
        - Name: TableName
          Value: !Ref DynamoDBTable
      Period: 60
      EvaluationPeriods: 1
      Statistic: Sum
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      ActionsEnabled: !If [HasAlarmActions, true, false]
      AlarmActions: !If [HasAlarmActions, [!Ref AlarmActionsSNSTopicArn], !Ref AWS::NoValue]
  SuccessfulRequestLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${TableName}-SuccessfulRequestLatency'
      AlarmDescription: !Sub 'Alarm when SuccessfulRequestLatency exceeds 100 ms for table ${TableName}'
      Namespace: AWS/DynamoDB
      MetricName: SuccessfulRequestLatency
      Dimensions:
        - Name: TableName
          Value: !Ref DynamoDBTable
      Period: 60
      EvaluationPeriods: 1
      Statistic: Average
      Threshold: 100
      ComparisonOperator: GreaterThanThreshold
      ActionsEnabled: !If [HasAlarmActions, true, false]
      AlarmActions: !If [HasAlarmActions, [!Ref AlarmActionsSNSTopicArn], !Ref AWS::NoValue]
  AccountProvisionedReadCapacityUtilizationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::AccountId}-AccountProvisionedReadCapacityUtilization'
      AlarmDescription: 'Alarm when account-level ProvisionedReadCapacityUtilization exceeds 85%'
      Namespace: AWS/DynamoDB
      MetricName: AccountProvisionedReadCapacityUtilization
      Period: 60
      EvaluationPeriods: 1
      Statistic: Average
      Threshold: 85
      ComparisonOperator: GreaterThanThreshold
      ActionsEnabled: !If [HasAlarmActions, true, false]
      AlarmActions: !If [HasAlarmActions, [!Ref AlarmActionsSNSTopicArn], !Ref AWS::NoValue]
  AccountProvisionedWriteCapacityUtilizationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::AccountId}-AccountProvisionedWriteCapacityUtilization'
      AlarmDescription: 'Alarm when account-level ProvisionedWriteCapacityUtilization exceeds 85%'
      Namespace: AWS/DynamoDB
      MetricName: AccountProvisionedWriteCapacityUtilization
      Period: 60
      EvaluationPeriods: 1
      Statistic: Average
      Threshold: 85
      ComparisonOperator: GreaterThanThreshold
      ActionsEnabled: !If [HasAlarmActions, true, false]
      AlarmActions: !If [HasAlarmActions, [!Ref AlarmActionsSNSTopicArn], !Ref AWS::NoValue]
  ProvisionedReadCapacityUtilizationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${TableName}-ProvisionedReadCapacityUtilization'
      AlarmDescription: !Sub 'Alarm when table-level ProvisionedReadCapacityUtilization exceeds 85% for table ${TableName}'
      Namespace: AWS/DynamoDB
      MetricName: ProvisionedReadCapacityUtilization
      Dimensions:
        - Name: TableName
          Value: !Ref DynamoDBTable
      Period: 60
      EvaluationPeriods: 1
      Statistic: Average
      Threshold: 85
      ComparisonOperator: GreaterThanThreshold
      ActionsEnabled: !If [HasAlarmActions, true, false]
      AlarmActions: !If [HasAlarmActions, [!Ref AlarmActionsSNSTopicArn], !Ref AWS::NoValue]
  ProvisionedWriteCapacityUtilizationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${TableName}-ProvisionedWriteCapacityUtilization'
      AlarmDescription: !Sub 'Alarm when table-level ProvisionedWriteCapacityUtilization exceeds 85% for table ${TableName}'
      Namespace: AWS/DynamoDB
      MetricName: ProvisionedWriteCapacityUtilization
      Dimensions:
        - Name: TableName
          Value: !Ref DynamoDBTable
      Period: 60
      EvaluationPeriods: 1
      Statistic: Average
      Threshold: 85
      ComparisonOperator: GreaterThanThreshold
      ActionsEnabled: !If [HasAlarmActions, true, false]
      AlarmActions: !If [HasAlarmActions, [!Ref AlarmActionsSNSTopicArn], !Ref AWS::NoValue]
  PendingReplicationCountAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${TableName}-PendingReplicationCount'
      AlarmDescription: !Sub 'Alarm when PendingReplicationCount exceeds 100 for table ${TableName}'
      Namespace: AWS/DynamoDB
      MetricName: PendingReplicationCount
      Dimensions:
        - Name: TableName
          Value: !Ref DynamoDBTable
      Period: 60
      EvaluationPeriods: 5
      DatapointsToAlarm: 3
      Statistic: Average
      Threshold: 100
      ComparisonOperator: GreaterThanThreshold
      ActionsEnabled: !If [HasAlarmActions, true, false]
      AlarmActions: !If [HasAlarmActions, [!Ref AlarmActionsSNSTopicArn], !Ref AWS::NoValue]
  ReplicationLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${TableName}-ReplicationLatency'
      AlarmDescription: !Sub 'Alarm when ReplicationLatency exceeds 10 ms for table ${TableName}'
      Namespace: AWS/DynamoDB
      MetricName: ReplicationLatency
      Dimensions:
        - Name: TableName
          Value: !Ref DynamoDBTable
      Period: 60
      EvaluationPeriods: 5
      DatapointsToAlarm: 3
      Statistic: Average
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      ActionsEnabled: !If [HasAlarmActions, true, false]
      AlarmActions: !If [HasAlarmActions, [!Ref AlarmActionsSNSTopicArn], !Ref AWS::NoValue]
Outputs:
  TableName:
    Description: Name of the DynamoDB table
    Value: !Ref DynamoDBTable
  TableArn:
    Description: ARN of the DynamoDB table
    Value: !GetAtt DynamoDBTable.Arn
  WriteThrottleEventsAlarmName:
    Description: CloudWatch alarm for write throttle events
    Value: !Ref WriteThrottleEventsAlarm
  ThrottledRequestsAlarmName:
    Description: CloudWatch alarm for throttled requests
    Value: !Ref ThrottledRequestsAlarm
  ConditionalCheckFailedRequestsAlarmName:
    Description: CloudWatch alarm for conditional check failures
    Value: !Ref ConditionalCheckFailedRequestsAlarm
  UserErrorsAlarmName:
    Description: CloudWatch alarm for user errors
    Value: !Ref UserErrorsAlarm
  SystemErrorsAlarmName:
    Description: CloudWatch alarm for system errors
    Value: !Ref SystemErrorsAlarm
  TransactionConflictAlarmName:
    Description: CloudWatch alarm for transaction conflicts
    Value: !Ref TransactionConflictAlarm
  OnlineIndexThrottleEventsAlarmName:
    Description: CloudWatch alarm for online index throttle events
    Value: !Ref OnlineIndexThrottleEventsAlarm
  SuccessfulRequestLatencyAlarmName:
    Description: CloudWatch alarm for successful request latency
    Value: !Ref SuccessfulRequestLatencyAlarm
  AccountProvisionedReadCapacityUtilizationAlarmName:
    Description: CloudWatch alarm for account-level read capacity utilization
    Value: !Ref AccountProvisionedReadCapacityUtilizationAlarm
  AccountProvisionedWriteCapacityUtilizationAlarmName:
    Description: CloudWatch alarm for account-level write capacity utilization
    Value: !Ref AccountProvisionedWriteCapacityUtilizationAlarm
  ProvisionedReadCapacityUtilizationAlarmName:
    Description: CloudWatch alarm for table-level read capacity utilization
    Value: !Ref ProvisionedReadCapacityUtilizationAlarm
  ProvisionedWriteCapacityUtilizationAlarmName:
    Description: CloudWatch alarm for table-level write capacity utilization
    Value: !Ref ProvisionedWriteCapacityUtilizationAlarm
  PendingReplicationCountAlarmName:
    Description: CloudWatch alarm for pending replication count
    Value: !Ref PendingReplicationCountAlarm
  ReplicationLatencyAlarmName:
    Description: CloudWatch alarm for replication latency
    Value: !Ref ReplicationLatencyAlarm