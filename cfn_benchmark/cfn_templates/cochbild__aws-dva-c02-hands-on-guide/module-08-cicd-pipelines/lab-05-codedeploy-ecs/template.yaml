AWSTemplateFormatVersion: "2010-09-09"
Description: Lab 8.5 — Minimal ECS Fargate + ALB + CodeDeploy blue/green setup

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Default VPC
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: 2+ subnets

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: dva-lab-08-05-cluster

  AlbSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: dva-lab-08-05-alb-sg
      GroupDescription: ALB ingress
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0

  ServiceSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: dva-lab-08-05-service-sg
      GroupDescription: Allow ALB to ECS
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref AlbSG

  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: dva-lab-08-05-alb
      Scheme: internet-facing
      SecurityGroups: [!Ref AlbSG]
      Subnets: !Ref SubnetIds
      Type: application

  TgBlue:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: dva-lab-08-05-tg-blue
      VpcId: !Ref VpcId
      Port: 80
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /

  TgGreen:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: dva-lab-08-05-tg-green
      VpcId: !Ref VpcId
      Port: 80
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /

  ProdListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TgBlue

  TestListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 8080
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TgGreen

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: dva-lab-08-05-task
      Cpu: 256
      Memory: 512
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: web
          Image: public.ecr.aws/nginx/nginx:latest
          PortMappings:
            - ContainerPort: 80
              Protocol: tcp
          Essential: true

  Service:
    Type: AWS::ECS::Service
    DependsOn: [ProdListener, TestListener]
    Properties:
      ServiceName: dva-lab-08-05-svc
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: 1
      TaskDefinition: !Ref TaskDefinition
      DeploymentController:
        Type: CODE_DEPLOY
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups: [!Ref ServiceSG]
          Subnets: !Ref SubnetIds
      LoadBalancers:
        - ContainerName: web
          ContainerPort: 80
          TargetGroupArn: !Ref TgBlue

  CodeDeployRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: codedeploy.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSCodeDeployRoleForECS

  CodeDeployApp:
    Type: AWS::CodeDeploy::Application
    Properties:
      ApplicationName: dva-lab-08-05-app
      ComputePlatform: ECS

  DeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Properties:
      ApplicationName: !Ref CodeDeployApp
      DeploymentGroupName: dva-lab-08-05-dg
      ServiceRoleArn: !GetAtt CodeDeployRole.Arn
      DeploymentConfigName: CodeDeployDefault.ECSAllAtOnce
      DeploymentStyle:
        DeploymentType: BLUE_GREEN
        DeploymentOption: WITH_TRAFFIC_CONTROL
      BlueGreenDeploymentConfiguration:
        DeploymentReadyOption:
          ActionOnTimeout: CONTINUE_DEPLOYMENT
        TerminateBlueInstancesOnDeploymentSuccess:
          Action: TERMINATE
          TerminationWaitTimeInMinutes: 5
      LoadBalancerInfo:
        TargetGroupPairInfoList:
          - ProdTrafficRoute:
              ListenerArns: [!Ref ProdListener]
            TestTrafficRoute:
              ListenerArns: [!Ref TestListener]
            TargetGroups:
              - Name: !GetAtt TgBlue.TargetGroupName
              - Name: !GetAtt TgGreen.TargetGroupName
      ECSServices:
        - ClusterName: !Ref Cluster
          ServiceName: !GetAtt Service.Name

Outputs:
  AlbUrl:
    Value: !Sub "http://${Alb.DNSName}"
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
  AppName:
    Value: !Ref CodeDeployApp
  DeploymentGroup:
    Value: !Ref DeploymentGroup