    Properties:
      FunctionName: !Sub '${ProjectName}-transform-insight-${Environment}'
      CodeUri: ../lambda/data-transform/
      Handler: transform_insight.lambda_handler
      Role: !GetAtt DataTransformLambdaRole.Arn
      Timeout: 300
      MemorySize: 256
      Environment:
        Variables:
          SOURCE_INSIGHTS_TABLE: !Sub '${ProjectName}-insights-${Environment}'
          DEST_INSIGHTS_TABLE: !Sub '${ProjectName}-insights-scrubbed'
          TARGET_COMPANY: !Ref TargetCompany
          KEYWORD_REPLACEMENTS_JSON: !Ref KeywordReplacementsJson
          BRAND_CONFIG_TABLE: !Sub '${ProjectName}-brand-config-${Environment}'

  DataTransformStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub '${ProjectName}-data-transform-${Environment}'
      RoleArn: !GetAtt DataTransformStateMachineRole.Arn
      TracingConfiguration:
        Enabled: true
      DefinitionString: !Sub |
        {
          "Comment": "Scan AnalysisResults and Insights, transform company references via Bedrock, write to scrubbed tables",
          "StartAt": "Parallel",
          "States": {
            "Parallel": {
              "Type": "Parallel",
              "Branches": [
                {
                  "StartAt": "ScanAnalysisKeys",
                  "States": {
                    "ScanAnalysisKeys": {
                      "Type": "Task",
                      "Resource": "${ScanKeysFunction.Arn}",
                      "ResultPath": "$.scanResult",
                      "Next": "TransformAnalysisItems"
                    },
                    "TransformAnalysisItems": {
                      "Type": "Map",
                      "ToleratedFailurePercentage": 5,
                      "ItemReader": {
                        "Resource": "arn:aws:states:::s3:getObject",
                        "ReaderConfig": {
                          "InputType": "JSONL"
                        },
                        "Parameters": {
                          "Bucket.$": "$.scanResult.bucket",
                          "Key.$": "$.scanResult.key"
                        }
                      },
                      "MaxConcurrency": 5,
                      "ResultPath": null,
                      "ItemProcessor": {
                        "ProcessorConfig": {
                          "Mode": "DISTRIBUTED",
                          "ExecutionType": "EXPRESS"
                        },
                        "StartAt": "TransformSingleItem",
                        "States": {
                          "TransformSingleItem": {
                            "Type": "Task",
                            "Resource": "${TransformItemFunction.Arn}",
                            "ResultPath": null,
                            "End": true
                          }
                        }
                      },
                      "End": true
                    }
                  }
                },
                {
                  "StartAt": "ScanInsightsKeys",
                  "States": {
                    "ScanInsightsKeys": {
                      "Type": "Task",
                      "Resource": "${ScanInsightsKeysFunction.Arn}",
                      "ResultPath": "$.scanResult",
                      "Next": "TransformInsightsItems"
                    },
                    "TransformInsightsItems": {
                      "Type": "Map",
                      "ToleratedFailurePercentage": 5,
                      "ItemReader": {
                        "Resource": "arn:aws:states:::s3:getObject",
                        "ReaderConfig": {
                          "InputType": "JSONL"
                        },
                        "Parameters": {
                          "Bucket.$": "$.scanResult.bucket",
                          "Key.$": "$.scanResult.key"
                        }
                      },
                      "MaxConcurrency": 5,
                      "ResultPath": null,
                      "ItemProcessor": {
                        "ProcessorConfig": {
                          "Mode": "DISTRIBUTED",
                          "ExecutionType": "EXPRESS"
                        },
                        "StartAt": "TransformSingleInsight",
                        "States": {
                          "TransformSingleInsight": {
                            "Type": "Task",
                            "Resource": "${TransformInsightFunction.Arn}",
                            "ResultPath": null,
                            "End": true
                          }
                        }
                      },
                      "End": true
                    }
                  }
                }
              ],
              "Next": "Done"
            },
            "Done": {
              "Type": "Succeed"
            }
          }
        }
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectTag

