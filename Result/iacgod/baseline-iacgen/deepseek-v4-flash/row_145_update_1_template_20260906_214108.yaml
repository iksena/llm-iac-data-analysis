AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFormation template for AppSync GraphQL API for songs service with DynamoDB and IAM authorization'
Resources:
  SongsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      TableName: !Sub '${AWS::StackName}-songs'

  AppSyncApi:
    Type: AWS::AppSync::GraphQLApi
    Properties:
      Name: !Sub '${AWS::StackName}-songs-api'
      AuthenticationType: AWS_IAM
      XrayEnabled: true

  AppSyncSchema:
    Type: AWS::AppSync::GraphQLSchema
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      Definition: |
        type Song {
          id: ID!
          name: String!
          artist: String!
        }
        type Query {
          getSongs: [Song]
        }
        type Mutation {
          addSong(name: String!, artist: String!): Song
        }
        schema {
          query: Query
          mutation: Mutation
        }

  AppSyncRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: appsync.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AppSyncDynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Scan
                  - dynamodb:PutItem
                Resource: !GetAtt SongsTable.Arn

  DataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      Name: SongsDataSource
      Type: AMAZON_DYNAMODB
      ServiceRoleArn: !GetAtt AppSyncRole.Arn
      DynamoDBConfig:
        TableName: !Ref SongsTable
        AwsRegion: !Ref AWS::Region

  ValidationFunction:
    Type: AWS::AppSync::FunctionConfiguration
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      DataSourceName: !GetAtt DataSource.Name
      Name: validateArtist
      FunctionVersion: '2018-05-29'
      RequestMappingTemplate: |
        {
          "version": "2018-05-29",
          "payload": {
            "artist": $context.arguments.artist
          }
        }
      ResponseMappingTemplate: |
        #if ($context.result.artist == "" || $context.result.artist == $util.toJson(""))
          $util.error("Artist is missing", "ValidationError")
        #elseif (!$util.matches($context.result.artist, "^[A-Za-z]+$"))
          $util.error("Artist must contain only letters", "ValidationError")
        #else
          $util.toJson($context.result)
        #end

  PutSongFunction:
    Type: AWS::AppSync::FunctionConfiguration
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      DataSourceName: !GetAtt DataSource.Name
      Name: putSong
      FunctionVersion: '2018-05-29'
      RequestMappingTemplate: |
        {
          "version": "2017-02-28",
          "operation": "PutItem",
          "key": {
            "id": $util.dynamodb.toDynamoDBJson($util.autoId())
          },
          "attributeValues": {
            "name": $util.dynamodb.toDynamoDBJson($context.arguments.name),
            "artist": $util.dynamodb.toDynamoDBJson($context.arguments.artist)
          }
        }
      ResponseMappingTemplate: |
        $util.toJson($context.result)

  GetSongsResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      TypeName: Query
      FieldName: getSongs
      DataSourceName: !GetAtt DataSource.Name
      RequestMappingTemplate: |
        {
          "version": "2017-02-28",
          "operation": "Scan",
          "limit": $util.defaultIfNull($context.arguments.limit, 100)
        }
      ResponseMappingTemplate: |
        $util.toJson($context.result.items)

  AddSongResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !GetAtt AppSyncApi.ApiId
      TypeName: Mutation
      FieldName: addSong
      Kind: PIPELINE
      PipelineConfig:
        Functions:
          - !GetAtt ValidationFunction.FunctionId
          - !GetAtt PutSongFunction.FunctionId
      RequestMappingTemplate: |
        {
          "version": "2018-05-29",
          "payload": {}
        }
      ResponseMappingTemplate: |
        $util.toJson($context.result)

Outputs:
  GraphQLApiId:
    Description: AppSync API ID
    Value: !GetAtt AppSyncApi.ApiId
  GraphQLUrl:
    Description: AppSync GraphQL endpoint URL
    Value: !GetAtt AppSyncApi.GraphQLUrl
  DynamoDBTableName:
    Description: DynamoDB table name
    Value: !Ref SongsTable