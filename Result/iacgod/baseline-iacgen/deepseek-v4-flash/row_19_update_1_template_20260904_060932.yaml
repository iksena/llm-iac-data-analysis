AWSTemplateFormatVersion: "2010-09-09"
Description: "Security Hub Automation Rules to suppress accepted findings across the organization"
Parameters:
  ExcludedIAMUsers:
    Type: CommaDelimitedList
    Default: "user1,user2"
    Description: "List of IAM user names to exclude from IAM finding suppression"
  SubAccountId:
    Type: String
    Default: "111111111111"
    Description: "AWS account ID for CIS benchmark suppression scope"
  SecurityGroupAdminPortsKeywords:
    Type: CommaDelimitedList
    Default: "admin,bastion,22,3389"
    Description: "Keywords in finding title to identify security group admin port findings"
  S3PublicAccessKeywords:
    Type: CommaDelimitedList
    Default: "public,HTTP"
    Description: "Keywords in finding title to identify S3 public access and HTTP findings"
  ConfigCoverageKeywords:
    Type: CommaDelimitedList
    Default: "Config,regional coverage"
    Description: "Keywords in finding title to identify AWS Config regional coverage findings"
  PublicBucketNames:
    Type: CommaDelimitedList
    Default: "bucket1,bucket2"
    Description: "List of S3 bucket names that are intentionally public"
  EBSEncryptionAccountId:
    Type: String
    Default: "222222222222"
    Description: "AWS account ID for EBS default encryption suppression"
  UnusedCredentialAccounts:
    Type: CommaDelimitedList
    Default: "333333333333,444444444444"
    Description: "List of AWS account IDs for unused credential and access key rotation suppression"
  GuardDutyFindingType:
    Type: String
    Default: "GuardDuty/UnauthorizedAccess:EC2/SSHBruteForce"
    Description: "GuardDuty finding type to suppress (e.g., cross-account Bedrock API activity)"
Resources:
  IAMSuppressionRule:
    Type: AWS::SecurityHub::AutomationRule
    Properties:
      RuleStatus: ENABLED
      RuleOrder: 1
      Criteria:
        Type:
          - Comparison: PREFIX
            Value:
              - "Software and Configuration Checks/IAM"
              - "IAM Policy Monitoring"
              - "IAM Access Analyzer"
        ResourceId:
          - Comparison: NOT_CONTAINS
            Value: !Ref ExcludedIAMUsers
      Actions:
        - Type: FINDING_UPDATE
          FindingUpdate:
            Workflow:
              Status: SUPPRESSED
            Note:
              Text: "Suppressed as reviewed and accepted IAM findings, excluding specific users."
              UpdatedBy: "AutomationRule"
  CISSubAccountRule:
    Type: AWS::SecurityHub::AutomationRule
    Properties:
      RuleStatus: ENABLED
      RuleOrder: 2
      Criteria:
        Type:
          - Comparison: PREFIX
            Value:
              - "CIS AWS Foundations Benchmark"
        AwsAccountId:
          - Comparison: EQUALS
            Value:
              - !Ref SubAccountId
      Actions:
        - Type: FINDING_UPDATE
          FindingUpdate:
            Workflow:
              Status: SUPPRESSED
            Note:
              Text: "Suppressed CIS benchmark findings for sub-account as reviewed."
              UpdatedBy: "AutomationRule"
  SGSup