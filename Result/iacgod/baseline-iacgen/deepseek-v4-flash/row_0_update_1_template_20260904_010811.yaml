AWSTemplateFormatVersion: "2010-09-09"
Description: "CloudFormation template for testing Cognito identity pools with Lambda and Step Functions roles"
Parameters:
  EnvName:
    Type: String
    Default: "test"
    Description: "Environment name appended to resources"
Resources:
  LambdaIdentityPool:
    Type: "AWS::Cognito::IdentityPool"
    Properties:
      IdentityPoolName: !Sub "${EnvName}-lambda-identity-pool"
      AllowUnauthenticatedIdentities: true
  LambdaRole:
    Type: "AWS::IAM::Role"
    Properties:
      RoleName: !Sub "${EnvName}-lambda-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: "cognito-identity.amazonaws.com"
            Action: "sts:AssumeRoleWithWebIdentity"
            Condition:
              StringEquals:
                "cognito-identity.amazonaws.com:aud": !Ref LambdaIdentityPool
          - Effect: Allow
            Principal:
              Service: "lambda.amazonaws.com"
            Action: "sts:AssumeRole"
      Policies:
        - PolicyName: "LambdaInvokeDynamoDBSES"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: "lambda:InvokeFunction"
                Resource: "*"
              - Effect: Allow
                Action:
                  - "dynamodb:*"
                Resource: "*"
              - Effect: Allow
                Action:
                  - "ses:*"
                Resource: "*"
  LambdaPoolRoleAttachment:
    Type: "AWS::Cognito::IdentityPoolRoleAttachment"
    Properties:
      IdentityPoolId: !Ref LambdaIdentityPool
      Roles:
        unauthenticated: !GetAtt LambdaRole.Arn
  StepFunctionsIdentityPool:
    Type: "AWS::Cognito::IdentityPool"
    Properties:
      IdentityPoolName: !Sub "${EnvName}-stepfunctions-identity-pool"
      AllowUnauthenticatedIdentities: true
  StepFunctionsRole:
    Type: "AWS::IAM::Role"
    Properties:
      RoleName: !Sub "${EnvName}-stepfunctions-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: "cognito-identity.amazonaws.com"
            Action: "sts:AssumeRoleWithWebIdentity"
            Condition:
              StringEquals:
                "cognito-identity.amazonaws.com:aud": !Ref StepFunctionsIdentityPool
          - Effect: Allow
            Principal:
              Service: "states.amazonaws.com"
            Action: "sts:AssumeRole"
      Policies:
        - PolicyName: "LambdaInvoke"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: "lambda:InvokeFunction"
                Resource: "*"
  StepFunctionsPoolRoleAttachment:
    Type: "AWS::Cognito::IdentityPoolRoleAttachment"
    Properties:
      IdentityPoolId: !Ref StepFunctionsIdentityPool
      Roles:
        unauthenticated: !GetAtt StepFunctionsRole.Arn
Outputs:
  LambdaIdentityPoolId:
    Description: "ID of the Lambda identity pool"
    Value: !Ref LambdaIdentityPool
  LambdaRoleArn:
    Description: "ARN of the Lambda role"
    Value: !GetAtt LambdaRole.Arn
  StepFunctionsIdentityPoolId:
    Description: "ID of the Step Functions identity pool"
    Value: !Ref StepFunctionsIdentityPool
  StepFunctionsRoleArn:
    Description: "ARN of the Step Functions role"
    Value: !GetAtt StepFunctionsRole.Arn