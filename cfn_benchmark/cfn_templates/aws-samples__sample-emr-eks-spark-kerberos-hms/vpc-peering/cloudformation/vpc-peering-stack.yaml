AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  AWS CloudFormation Amazon VPC Peering between Amazon EKS VPC and AD VPC.
  Creates Amazon VPC peering connection, Amazon EC2 routes, and security group rules
  for Kerberos authentication traffic.

Parameters:
  ProjectName:
    Description: An environment name that is prefixed to resource names
    Type: String
    Default: KerberosEMRonEKS

Resources:
  VPCPeeringConnection:
    Type: AWS::EC2::VPCPeeringConnection
    Properties:
      VpcId:
        Fn::ImportValue: !Sub "${ProjectName}-EKS-VPC"
      PeerVpcId:
        Fn::ImportValue: !Sub "${ProjectName}-AD-VPC"
      Tags:
        - Key: Name
          Value: EKS-AD-Peering

  # Create routes in EKS VPC route tables to AD VPC
  # Public route table (kept for completeness)
  EksToAdRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId:
        Fn::ImportValue: !Sub "${ProjectName}-EKS-RouteTable"
      DestinationCidrBlock:
        Fn::ImportValue: !Sub "${ProjectName}-AD-CIDR"
      VpcPeeringConnectionId: !Ref VPCPeeringConnection

  # Private route tables (where EKS nodes actually run)
  EksToAdRoutePrivate1:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId:
        Fn::ImportValue: !Sub "${ProjectName}-EKS-PrivateRouteTable1"
      DestinationCidrBlock:
        Fn::ImportValue: !Sub "${ProjectName}-AD-CIDR"
      VpcPeeringConnectionId: !Ref VPCPeeringConnection

  EksToAdRoutePrivate2:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId:
        Fn::ImportValue: !Sub "${ProjectName}-EKS-PrivateRouteTable2"
      DestinationCidrBlock:
        Fn::ImportValue: !Sub "${ProjectName}-AD-CIDR"
      VpcPeeringConnectionId: !Ref VPCPeeringConnection

  # Create routes in AD VPC route tables to EKS VPC
  # Public route table
  AdToEksRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId:
        Fn::ImportValue: !Sub "${ProjectName}-AD-PublicRouteTable"
      DestinationCidrBlock:
        Fn::ImportValue: !Sub "${ProjectName}-EKS-CIDR"
      VpcPeeringConnectionId: !Ref VPCPeeringConnection

  # Private route tables (where AD instances run)
  AdToEksRoutePrivate1:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId:
        Fn::ImportValue: !Sub "${ProjectName}-AD-PrivateRouteTable1"
      DestinationCidrBlock:
        Fn::ImportValue: !Sub "${ProjectName}-EKS-CIDR"
      VpcPeeringConnectionId: !Ref VPCPeeringConnection

  AdToEksRoutePrivate2:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId:
        Fn::ImportValue: !Sub "${ProjectName}-AD-PrivateRouteTable2"
      DestinationCidrBlock:
        Fn::ImportValue: !Sub "${ProjectName}-EKS-CIDR"
      VpcPeeringConnectionId: !Ref VPCPeeringConnection

  # Security Group Rules for AD Server
  ADSecurityGroupKerberosTCPRule:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Fn::ImportValue: !Sub "${ProjectName}-AD-SecurityGroup"
      IpProtocol: tcp
      FromPort: 88
      ToPort: 88
      Description: 'Allow Kerberos authentication (TCP) from EKS VPC'
      CidrIp:
        Fn::ImportValue: !Sub "${ProjectName}-EKS-CIDR"

  ADSecurityGroupKerberosUDPRule:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Fn::ImportValue: !Sub "${ProjectName}-AD-SecurityGroup"
      IpProtocol: udp
      FromPort: 88
      ToPort: 88
      Description: 'Allow Kerberos authentication (UDP) from EKS VPC'
      CidrIp:
        Fn::ImportValue: !Sub "${ProjectName}-EKS-CIDR"

  ADSecurityGroupDNSTCPRule:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Fn::ImportValue: !Sub "${ProjectName}-AD-SecurityGroup"
      IpProtocol: tcp
      FromPort: 53
      ToPort: 53
      Description: 'Allow DNS (TCP) from EKS VPC'
      CidrIp:
        Fn::ImportValue: !Sub "${ProjectName}-EKS-CIDR"

  ADSecurityGroupDNSUDPRule:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Fn::ImportValue: !Sub "${ProjectName}-AD-SecurityGroup"
      IpProtocol: udp
      FromPort: 53
      ToPort: 53
      Description: 'Allow DNS (UDP) from EKS VPC'
      CidrIp:
        Fn::ImportValue: !Sub "${ProjectName}-EKS-CIDR"

  ADSecurityGroupLDAPTCPRule:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Fn::ImportValue: !Sub "${ProjectName}-AD-SecurityGroup"
      IpProtocol: tcp
      FromPort: 389
      ToPort: 389
      Description: 'Allow LDAP (TCP) from EKS VPC'
      CidrIp:
        Fn::ImportValue: !Sub "${ProjectName}-EKS-CIDR"

  ADSecurityGroupLDAPUDPRule:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Fn::ImportValue: !Sub "${ProjectName}-AD-SecurityGroup"
      IpProtocol: udp
      FromPort: 389
      ToPort: 389
      Description: 'Allow LDAP (UDP) from EKS VPC'
      CidrIp:
        Fn::ImportValue: !Sub "${ProjectName}-EKS-CIDR"

  ADSecurityGroupKpasswdUDPRule:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Fn::ImportValue: !Sub "${ProjectName}-AD-SecurityGroup"
      IpProtocol: udp
      FromPort: 464
      ToPort: 464
      Description: 'Allow Kerberos password changes (UDP) from EKS VPC'
      CidrIp:
        Fn::ImportValue: !Sub "${ProjectName}-EKS-CIDR"

  ADSecurityGroupKpasswdTCPRule:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Fn::ImportValue: !Sub "${ProjectName}-AD-SecurityGroup"
      IpProtocol: tcp
      FromPort: 464
      ToPort: 464
      Description: 'Allow Kerberos password changes (TCP) from EKS VPC'
      CidrIp:
        Fn::ImportValue: !Sub "${ProjectName}-EKS-CIDR"

  ADSecurityGroupLDAPSRule:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Fn::ImportValue: !Sub "${ProjectName}-AD-SecurityGroup"
      IpProtocol: tcp
      FromPort: 636
      ToPort: 636
      Description: 'Allow LDAPS from EKS VPC'
      CidrIp:
        Fn::ImportValue: !Sub "${ProjectName}-EKS-CIDR"

  ADSecurityGroupWinRMRule:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Fn::ImportValue: !Sub "${ProjectName}-AD-SecurityGroup"
      IpProtocol: tcp
      FromPort: 5985
      ToPort: 5985
      Description: 'Allow WinRM from EKS VPC'
      CidrIp:
        Fn::ImportValue: !Sub "${ProjectName}-EKS-CIDR"

  ADSecurityGroupKadminRule:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Fn::ImportValue: !Sub "${ProjectName}-AD-SecurityGroup"
      IpProtocol: tcp
      FromPort: 749
      ToPort: 749
      Description: 'Allow Kerberos admin from EKS VPC'
      CidrIp:
        Fn::ImportValue: !Sub "${ProjectName}-EKS-CIDR"

Outputs:
  VPCPeeringConnectionId:
    Description: VPC Peering Connection ID
    Value: !Ref VPCPeeringConnection
    Export:
      Name: !Sub "${ProjectName}-VPCPeeringConnectionId"