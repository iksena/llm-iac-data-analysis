    S3ResourcesListenerRule:
        Type: "AWS::ElasticLoadBalancingV2::ListenerRule"
        Properties:
            Priority: "70"
            ListenerArn: !Ref HttpsLoadBalancerListener
            Conditions:
              -
                Field: "path-pattern"
                PathPatternConfig:
                    Values:
                      - "/radx-s3-resources*"
                      - "/variables-explorer*"
            Actions:
              -
                Type: "forward"
                TargetGroupArn: !Ref S3TargetGroup
                Order: 1
                ForwardConfig:
                    TargetGroups:
                      -
                        TargetGroupArn: !Ref S3TargetGroup
                        Weight: 1
                    TargetGroupStickinessConfig:
                        Enabled: false
                        DurationSeconds: 3600

    SubmissionServiceListenerRule:
        Type: "AWS::ElasticLoadBalancingV2::ListenerRule"
