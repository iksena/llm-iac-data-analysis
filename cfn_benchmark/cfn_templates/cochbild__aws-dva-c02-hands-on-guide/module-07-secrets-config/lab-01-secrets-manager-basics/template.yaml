AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: |
  DVA Lab 7.1 — Secrets Manager basics & rotation.
  Creates a secret with an initial random password, a reader Lambda that
  caches the value at module level, and a custom rotation Lambda that
  implements the four-step rotation state machine.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Tracing: Active

Resources:

  AppSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: dva-lab-07-01-app-credentials
      Description: Lab 7.1 application credentials. Auto-rotated by RotationFunction.
      GenerateSecretString:
        SecretStringTemplate: '{"username":"appuser"}'
        GenerateStringKey: password
        PasswordLength: 24
        ExcludePunctuation: true

  ReaderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dva-lab-07-01-reader
      CodeUri: src/
      Handler: reader.handler
      Environment:
        Variables:
          SECRET_ARN: !Ref AppSecret
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
                - secretsmanager:DescribeSecret
              Resource: !Ref AppSecret

  RotationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dva-lab-07-01-rotation
      CodeUri: src/
      Handler: rotation.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:DescribeSecret
                - secretsmanager:GetSecretValue
                - secretsmanager:PutSecretValue
                - secretsmanager:UpdateSecretVersionStage
              Resource: !Ref AppSecret
            - Effect: Allow
              Action:
                - secretsmanager:GetRandomPassword
              Resource: "*"

  # Allow Secrets Manager to invoke the rotation Lambda.
  RotationInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RotationFunction
      Action: lambda:InvokeFunction
      Principal: secretsmanager.amazonaws.com

  # Wire the rotation Lambda to the secret. Schedule = on-demand (no auto interval).
  # Real-world rotations use AutomaticallyAfterDays: 30.
  RotationSchedule:
    Type: AWS::SecretsManager::RotationSchedule
    DependsOn: RotationInvokePermission
    Properties:
      SecretId: !Ref AppSecret
      RotationLambdaARN: !GetAtt RotationFunction.Arn
      RotationRules:
        # No automatic rotation in the lab — we trigger manually.
        # In production you'd set: AutomaticallyAfterDays: 30
        ScheduleExpression: "rate(365 days)"

Outputs:
  SecretArn:
    Description: ARN of the lab secret
    Value: !Ref AppSecret
  ReaderFunctionName:
    Description: Reader Lambda function name
    Value: !Ref ReaderFunction
  RotationFunctionName:
    Description: Rotation Lambda function name
    Value: !Ref RotationFunction