AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: |
  DVA-C02 Lab 1.2B — DynamoDB Streams ESM with bisect-on-error and on-failure destination

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    LoggingConfig:
      LogFormat: JSON
      ApplicationLogLevel: INFO

Resources:
  # SQS queue for failed records (Streams ESM on-failure destination)
  StreamFailureQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: dva-lab-01-02-ddb-failures
      MessageRetentionPeriod: 1209600

  # DynamoDB table with stream enabled
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: dva-lab-01-02-ddb
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      StreamSpecification:
        # Possible values: KEYS_ONLY, NEW_IMAGE, OLD_IMAGE, NEW_AND_OLD_IMAGES
        StreamViewType: NEW_AND_OLD_IMAGES

  StreamConsumer:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dva-lab-01-02-ddb-consumer
      CodeUri: src/
      Handler: app.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: !GetAtt StreamFailureQueue.Arn
      Events:
        DdbStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt Table.StreamArn
            # Where to start reading on first deploy
            StartingPosition: TRIM_HORIZON   # or LATEST
            BatchSize: 10
            MaximumBatchingWindowInSeconds: 5
            # Failure handling
            BisectBatchOnFunctionError: true   # split batch on failure to isolate poison record
            MaximumRetryAttempts: 2            # discard after N retries (default: -1 = forever)
            MaximumRecordAgeInSeconds: 600     # discard records older than 10 min
            # Send failed records to SQS (Kinesis/DDB Streams ESM ONLY supports this)
            DestinationConfig:
              OnFailure:
                Destination: !GetAtt StreamFailureQueue.Arn
            # Report partial failures
            FunctionResponseTypes:
              - ReportBatchItemFailures

Outputs:
  TableName:
    Value: !Ref Table
  StreamArn:
    Value: !GetAtt Table.StreamArn
  FailureQueueUrl:
    Value: !Ref StreamFailureQueue