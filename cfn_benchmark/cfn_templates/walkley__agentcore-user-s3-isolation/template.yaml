AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Infrastructure for AgentCore per-user S3 isolation demo.
  AgentCore Runtime itself is deployed via the starter toolkit (agentcore launch).

Parameters:
  ProjectName:
    Type: String
    Default: agentcore-s3-isolation

Resources:

  # ============================================================
  # Cognito User Pool (OIDC Provider)
  # ============================================================

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${ProjectName}-users
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: agent-client
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      GenerateSecret: false

  # ============================================================
  # IAM OIDC Provider
  # ============================================================

  OIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
      ClientIdList:
        - !Ref UserPoolClient
      # AWS no longer uses thumbprints to verify Cognito/OIDC tokens (validated
      # via the OIDC discovery endpoint instead). A placeholder value is required
      # by the CloudFormation schema but is not used for authentication.
      ThumbprintList:
        - "0000000000000000000000000000000000000000"

  # ============================================================
  # S3 Bucket
  # ============================================================

  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ============================================================
  # S3 Access Role — per-user prefix isolation
  # ============================================================

  S3AccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-s3-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref OIDCProvider
            Action: sts:AssumeRoleWithWebIdentity
            # Note: audience (aud) restriction is enforced by the OIDCProvider's
            # ClientIdList — STS validates the token's aud claim against it during
            # AssumeRoleWithWebIdentity. A Condition block for aud is not needed here
            # (and CFN doesn't support intrinsic functions as Condition keys).
      Policies:
        - PolicyName: PerUserS3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub
                  - "arn:aws:s3:::${DataBucket}/${!${Issuer}:sub}/*"
                  - Issuer: !Sub "cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DataBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix: !Sub
                      - "${!${Issuer}:sub}/*"
                      - Issuer: !Sub "cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"

  # ============================================================
  # AgentCore Runtime execution role (no S3 permissions)
  # ============================================================

  RuntimeExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-runtime-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BedrockAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - "arn:aws:bedrock:*:*:foundation-model/*"
                  - "arn:aws:bedrock:*:*:inference-profile/*"
        - PolicyName: Logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                Resource: "*"

Outputs:
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  OIDCIssuer:
    Value: !Sub cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
  BucketName:
    Value: !Ref DataBucket
  S3AccessRoleArn:
    Value: !GetAtt S3AccessRole.Arn
  RuntimeExecutionRoleArn:
    Value: !GetAtt RuntimeExecutionRole.Arn