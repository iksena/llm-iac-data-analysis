AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Lab 5.3 — Custom event bus + 2 rules + Lambda and SQS targets

Resources:
  EventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: dva-lab-05-03-bus

  TargetFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dva-lab-05-03-target
      Runtime: python3.12
      Handler: handler.handler
      CodeUri: src/

  TargetFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref TargetFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt LambdaRule.Arn

  Queue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: dva-lab-05-03-refunds-queue
      MessageRetentionPeriod: 86400

  QueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref Queue]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt Queue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt SqsRule.Arn

  ## Rule 1: amount > 100 AND region prefix us- → Lambda (with InputTransformer)
  LambdaRule:
    Type: AWS::Events::Rule
    Properties:
      Name: dva-lab-05-03-big-orders
      EventBusName: !Ref EventBus
      EventPattern:
        source: [ "myapp.orders" ]
        detail-type: [ "Order Placed" ]
        detail:
          amount: [ { numeric: [ ">", 100 ] } ]
          region: [ { prefix: "us-" } ]
      Targets:
        - Id: ToLambda
          Arn: !GetAtt TargetFunction.Arn
          InputTransformer:
            InputPathsMap:
              amount: "$.detail.amount"
              region: "$.detail.region"
            InputTemplate: |
              { "msg": "big order in <region> for <amount>", "is_big": true }

  ## Rule 2: detail-type "Order Refunded" → SQS
  SqsRule:
    Type: AWS::Events::Rule
    Properties:
      Name: dva-lab-05-03-refunds
      EventBusName: !Ref EventBus
      EventPattern:
        source: [ "myapp.orders" ]
        detail-type: [ "Order Refunded" ]
      Targets:
        - Id: ToSqs
          Arn: !GetAtt Queue.Arn

Outputs:
  BusName:
    Value: !Ref EventBus
  QueueUrl:
    Value: !Ref Queue
  FunctionName:
    Value: !Ref TargetFunction