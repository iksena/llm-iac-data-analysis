AWSTemplateFormatVersion: "2010-09-09"
Description: "CloudFormation template for PiBot Cognito authentication infrastructure - creates separate Main Web App and IoT Provisioning authentication setups with IAM roles and identity pools"
Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    Description: "Environment name used for resource naming"
    AllowedPattern: "^[a-z0-9-]+$"
  ProjectName:
    Type: String
    Default: PiBot
    Description: "Project name used for resource naming"
    AllowedPattern: "^[a-zA-Z0-9-]+$"
Resources:
  MainWebAppUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${ProjectName}-MainWebApp-${EnvironmentName}"
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
      Schema:
        - AttributeDataType: String
          Name: email
          Required: true
          Mutable: true
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      UsernameAttributes:
        - email
  MainWebAppUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${ProjectName}-MainWebApp-${EnvironmentName}"
      UserPoolId: !Ref MainWebAppUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
  MainWebAppIdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      IdentityPoolName: !Sub "${ProjectName}-MainWebApp-${EnvironmentName}"
      AllowUnauthenticatedIdentities: true
      CognitoIdentityProviders:
        - ClientId: !Ref MainWebAppUserPoolClient
          ProviderName: !GetAtt MainWebAppUserPool.ProviderName
          ServerSideTokenCheck: false
  MainWebAppAuthenticatedRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-MainWebApp-Auth-${EnvironmentName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                cognito-identity.amazonaws.com:aud: !Ref MainWebAppIdentityPool
              ForAnyValue:StringLike:
                cognito-identity.amazonaws.com:amr: authenticated
      Policies:
        - PolicyName: !Sub "${ProjectName}-MainWebApp-AuthPolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - iot:Connect
                  - iot:Publish
                  - iot:Subscribe
                  - iot:Receive
                  - iot:GetThingShadow
                  - iot:UpdateThingShadow
                  - iot:DeleteThingShadow
                  - iot:ListThings
                  - iot:DescribeThing
                Resource: "*"
              - Effect: Allow
                Action:
                  - kinesisvideo:PutMedia
                  - kinesisvideo:GetMedia
                  - kinesisvideo:GetMediaForFragmentList
                  - kinesisvideo:ListStreams
                  - kinesisvideo:DescribeStream
                  - kinesisvideo:GetDataEndpoint
                Resource: "*"
              - Effect: Allow
                Action:
                  - rekognition:DetectLabels
                  - rekognition:DetectModerationLabels
                  - rekognition:DetectFaces
                  - rekognition:RecognizeCelebrities
                Resource: "*"
              - Effect: Allow
                Action:
                  - cognito-identity:GetId
                  - cognito-identity:GetCredentialsForIdentity
                  - cognito-sync:*
                  - mobileanalytics:PutEvents
                Resource: "*"
  MainWebAppUnauthenticatedRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-MainWebApp-Unauth-${EnvironmentName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                cognito-identity.amazonaws.com:aud: !Ref MainWebAppIdentityPool
              ForAnyValue:StringLike:
                cognito-identity.amazonaws.com:amr: unauthenticated
      Policies:
        - PolicyName: !Sub "${ProjectName}-MainWebApp-UnauthPolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cognito-identity:GetId
                  - cognito-identity:GetCredentialsForIdentity
                  - mobileanalytics:PutEvents
                Resource: "*"
  MainWebAppIdentityPoolRoleAttachment:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Properties:
      IdentityPoolId: !Ref MainWebAppIdentityPool
      Roles:
        authenticated: !GetAtt MainWebAppAuthenticatedRole.Arn
        unauthenticated: !GetAtt MainWebAppUnauthenticatedRole.Arn
  ProvisioningUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${ProjectName}-Provisioning-${EnvironmentName}"
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
      Schema:
        - AttributeDataType: String
          Name: email
          Required: true
          Mutable: true
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      UsernameAttributes:
        - email
  ProvisioningUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${ProjectName}-Provisioning-${EnvironmentName}"
      UserPoolId: !Ref ProvisioningUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
  ProvisioningIdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      IdentityPoolName: !Sub "${ProjectName}-Provisioning-${EnvironmentName}"
      AllowUnauthenticatedIdentities: true
      CognitoIdentityProviders:
        - ClientId: !Ref ProvisioningUserPoolClient
          ProviderName: !GetAtt ProvisioningUserPool.ProviderName
          ServerSideTokenCheck: false
  ProvisioningAuthenticatedRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-Provisioning-Auth-${EnvironmentName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                cognito-identity.amazonaws.com:aud: !Ref ProvisioningIdentityPool
              ForAnyValue:StringLike:
                cognito-identity.amazonaws.com:amr: authenticated
      Policies:
        - PolicyName: !Sub "${ProjectName}-Provisioning-AuthPolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - iot:CreateKeysAndCertificate
                  - iot:CreatePolicy
                  - iot:AttachPolicy
                  - iot:AttachCertificateToThing
                  - iot:RegisterThing
                  - iot:CreateThing
                  - iot:DescribeThing
                  - iot:ListThings
                  - iot:DescribeCertificate
                  - iot:UpdateCertificate
                  - iot:DeleteCertificate
                  - iot:DetachPolicy
                  - iot:DetachCertificateFromThing
                  - iot:ListCertificates
                  - iot:ListPolicies
                Resource: "*"
  ProvisioningUnauthenticatedRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-Provisioning-Unauth-${EnvironmentName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                cognito-identity.amazonaws.com:aud: !Ref ProvisioningIdentityPool
              ForAnyValue:StringLike:
                cognito-identity.amazonaws.com:amr: unauthenticated
      Policies:
        - PolicyName: !Sub "${ProjectName}-Provisioning-UnauthPolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cognito-identity:GetId
                  - cognito-identity:GetCredentialsForIdentity
                Resource: "*"
  ProvisioningIdentityPoolRoleAttachment:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Properties:
      IdentityPoolId: !Ref ProvisioningIdentityPool
      Roles:
        authenticated: !GetAtt ProvisioningAuthenticatedRole.Arn
        unauthenticated: !GetAtt ProvisioningUnauthenticatedRole.Arn
Outputs:
  MainWebAppUserPoolId:
    Description: "User Pool ID for the Main Web Application"
    Value: !Ref MainWebAppUserPool
  MainWebAppUserPoolClientId:
    Description: "User Pool Client ID for the Main Web Application"
    Value: !Ref MainWebAppUserPoolClient
  MainWebAppIdentityPoolId:
    Description: "Identity Pool ID for the Main Web Application"
    Value: !Ref MainWebAppIdentityPool
  ProvisioningUserPoolId:
    Description: "User Pool ID for IoT Trusted User Provisioning"
    Value: !Ref ProvisioningUserPool
  ProvisioningUserPoolClientId:
    Description: "User Pool Client ID for IoT Trusted User Provisioning"
    Value: !Ref ProvisioningUserPoolClient
  ProvisioningIdentityPoolId:
    Description: "Identity Pool ID for IoT Trusted User Provisioning"
    Value: !Ref ProvisioningIdentityPool