AWSTemplateFormatVersion: '2010-09-09'
Description: 'Evolution API v2 with PostgreSQL - Following Official Requirements'

Resources:
  # VPC and Networking
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: evolution-vpc

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: !Select [0, !GetAZs '']

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.4.0/24
      AvailabilityZone: !Select [1, !GetAZs '']

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetRouteTableAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # Security Groups
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for ALB
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for ECS
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref ALBSecurityGroup

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for PostgreSQL
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref ECSSecurityGroup

  # RDS PostgreSQL Database (as required by Evolution API)
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnet group for Evolution PostgreSQL
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      Tags:
        - Key: Name
          Value: evolution-db-subnet-group

  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: evolution-db-credentials
      Description: Evolution API PostgreSQL credentials
      SecretString: '{"username": "evolution", "password": "***REMOVED_PG_PASSWORD***"}'

  PostgreSQLDatabase:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    Properties:
      DBInstanceIdentifier: evolution-postgresql
      DBName: evolution
      Engine: postgres
      EngineVersion: "13.21"
      DBInstanceClass: db.t3.micro
      AllocatedStorage: 20
      StorageType: gp2
      StorageEncrypted: false
      MasterUsername: evolution
      MasterUserPassword: "***REMOVED_PG_PASSWORD***"
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroup
      DBSubnetGroupName: !Ref DBSubnetGroup
      BackupRetentionPeriod: 7
      MultiAZ: false
      PubliclyAccessible: false
      Tags:
        - Key: Name
          Value: evolution-postgresql

  # Load Balancer
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: evolution-postgres-alb
      Scheme: internet-facing
      Type: application
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroups:
        - !Ref ALBSecurityGroup

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: evolution-postgres-tg
      Port: 8080
      Protocol: HTTP
      VpcId: !Ref VPC
      TargetType: ip
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 60
      HealthCheckTimeoutSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 10

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP

  # ECS Cluster
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: evolution-postgres-cluster

  # IAM Roles
  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref DatabaseSecret

  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole

  # CloudWatch Log Group
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/evolution-postgres
      RetentionInDays: 7

  # ECS Task Definition - Following Official Evolution API Requirements
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: evolution-postgres
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: 1024
      Memory: 2048
      ExecutionRoleArn: !Ref ECSTaskExecutionRole
      TaskRoleArn: !Ref ECSTaskRole
      ContainerDefinitions:
        - Name: evolution-api-instance
          Image: atendai/evolution-api:v2.1.1
          Essential: true
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          Environment:
            # Server Configuration
            - Name: SERVER_TYPE
              Value: "http"
            - Name: SERVER_PORT
              Value: "8080"
            - Name: SERVER_URL
              Value: !Sub "http://${ApplicationLoadBalancer.DNSName}"

            # CORS Configuration
            - Name: CORS_ORIGIN
              Value: "*"
            - Name: CORS_METHODS
              Value: "GET,POST,PUT,DELETE"
            - Name: CORS_CREDENTIALS
              Value: "true"

            # Logging Configuration
            - Name: LOG_LEVEL
              Value: "ERROR,WARN,DEBUG,INFO,LOG,VERBOSE,DARK,WEBHOOKS,WEBSOCKET"
            - Name: LOG_COLOR
              Value: "true"
            - Name: LOG_BAILEYS
              Value: "error"

            # Event Emitter Configuration
            - Name: EVENT_EMITTER_MAX_LISTENERS
              Value: "50"

            # Instance Management
            - Name: DEL_INSTANCE
              Value: "false"

            # Database Configuration (PostgreSQL as required)
            - Name: DATABASE_PROVIDER
              Value: "postgresql"
            - Name: DATABASE_CONNECTION_CLIENT_NAME
              Value: "evolution_exchange"
            - Name: DATABASE_SAVE_DATA_INSTANCE
              Value: "true"
            - Name: DATABASE_SAVE_DATA_NEW_MESSAGE
              Value: "true"
            - Name: DATABASE_SAVE_MESSAGE_UPDATE
              Value: "true"
            - Name: DATABASE_SAVE_DATA_CONTACTS
              Value: "true"
            - Name: DATABASE_SAVE_DATA_CHATS
              Value: "true"
            - Name: DATABASE_SAVE_DATA_LABELS
              Value: "true"
            - Name: DATABASE_SAVE_DATA_HISTORIC
              Value: "true"
            - Name: DATABASE_SAVE_IS_ON_WHATSAPP
              Value: "true"
            - Name: DATABASE_SAVE_IS_ON_WHATSAPP_DAYS
              Value: "7"
            - Name: DATABASE_DELETE_MESSAGE
              Value: "true"

            # RabbitMQ Configuration (Disabled)
            - Name: RABBITMQ_ENABLED
              Value: "false"

            # SQS Configuration (Disabled)
            - Name: SQS_ENABLED
              Value: "false"

            # Websocket Configuration (Disabled)
            - Name: WEBSOCKET_ENABLED
              Value: "false"

            # Pusher Configuration (Disabled)
            - Name: PUSHER_ENABLED
              Value: "false"

            # WhatsApp Business API Configuration
            - Name: WA_BUSINESS_TOKEN_WEBHOOK
              Value: "evolution"
            - Name: WA_BUSINESS_URL
              Value: "https://graph.facebook.com"
            - Name: WA_BUSINESS_VERSION
              Value: "v20.0"
            - Name: WA_BUSINESS_LANGUAGE
              Value: "en_US"

            # Global Webhook Settings
            - Name: WEBHOOK_GLOBAL_ENABLED
              Value: "true"
            - Name: WEBHOOK_GLOBAL_URL
              Value: "https://is8ccrbye3.execute-api.us-east-2.amazonaws.com/Prod/whatsapp-webhook"
            - Name: WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS
              Value: "false"
            - Name: WEBHOOK_EVENTS_APPLICATION_STARTUP
              Value: "false"
            - Name: WEBHOOK_EVENTS_QRCODE_UPDATED
              Value: "true"
            - Name: WEBHOOK_EVENTS_MESSAGES_SET
              Value: "true"
            - Name: WEBHOOK_EVENTS_MESSAGES_UPSERT
              Value: "true"
            - Name: WEBHOOK_EVENTS_MESSAGES_EDITED
              Value: "true"
            - Name: WEBHOOK_EVENTS_MESSAGES_UPDATE
              Value: "true"
            - Name: WEBHOOK_EVENTS_MESSAGES_DELETE
              Value: "true"
            - Name: WEBHOOK_EVENTS_SEND_MESSAGE
              Value: "true"
            - Name: WEBHOOK_EVENTS_CONTACTS_SET
              Value: "true"
            - Name: WEBHOOK_EVENTS_CONTACTS_UPSERT
              Value: "true"
            - Name: WEBHOOK_EVENTS_CONTACTS_UPDATE
              Value: "true"
            - Name: WEBHOOK_EVENTS_PRESENCE_UPDATE
              Value: "true"
            - Name: WEBHOOK_EVENTS_CHATS_SET
              Value: "true"
            - Name: WEBHOOK_EVENTS_CHATS_UPSERT
              Value: "true"
            - Name: WEBHOOK_EVENTS_CHATS_UPDATE
              Value: "true"
            - Name: WEBHOOK_EVENTS_CHATS_DELETE
              Value: "true"
            - Name: WEBHOOK_EVENTS_GROUPS_UPSERT
              Value: "true"
            - Name: WEBHOOK_EVENTS_GROUPS_UPDATE
              Value: "true"
            - Name: WEBHOOK_EVENTS_GROUP_PARTICIPANTS_UPDATE
              Value: "true"
            - Name: WEBHOOK_EVENTS_CONNECTION_UPDATE
              Value: "true"
            - Name: WEBHOOK_EVENTS_REMOVE_INSTANCE
              Value: "false"
            - Name: WEBHOOK_EVENTS_LOGOUT_INSTANCE
              Value: "false"
            - Name: WEBHOOK_EVENTS_LABELS_EDIT
              Value: "true"
            - Name: WEBHOOK_EVENTS_LABELS_ASSOCIATION
              Value: "true"
            - Name: WEBHOOK_EVENTS_CALL
              Value: "true"
            - Name: WEBHOOK_EVENTS_TYPEBOT_START
              Value: "false"
            - Name: WEBHOOK_EVENTS_TYPEBOT_CHANGE_STATUS
              Value: "false"
            - Name: WEBHOOK_EVENTS_ERRORS
              Value: "false"

            # WhatsApp Session Configuration
            - Name: CONFIG_SESSION_PHONE_CLIENT
              Value: "Evolution API"
            - Name: CONFIG_SESSION_PHONE_NAME
              Value: "Chrome"
            - Name: CONFIG_SESSION_PHONE_VERSION
              Value: "2.3000.1025075656"

            # QR Code Configuration
            - Name: QRCODE_LIMIT
              Value: "30"
            - Name: QRCODE_COLOR
              Value: "#175197"

            # Feature Toggles (Disabled)
            - Name: TYPEBOT_ENABLED
              Value: "false"
            - Name: CHATWOOT_ENABLED
              Value: "false"
            - Name: OPENAI_ENABLED
              Value: "false"
            - Name: DIFY_ENABLED
              Value: "false"

            # Cache Configuration (Local only)
            - Name: CACHE_REDIS_ENABLED
              Value: "false"
            - Name: CACHE_LOCAL_ENABLED
              Value: "true"

            # S3 Configuration (Disabled)
            - Name: S3_ENABLED
              Value: "false"

            # Authentication
            - Name: AUTHENTICATION_API_KEY
              Value: "***REMOVED_EVO_API_KEY***"
            - Name: AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES
              Value: "true"
            - Name: LANGUAGE
              Value: "en"

            - Name: DATABASE_CONNECTION_URI
              Value: !Sub "postgresql://evolution:***REMOVED_PG_PASSWORD***@${PostgreSQLDatabase.Endpoint.Address}:5432/evolution?schema=public"

  # ECS Service
  ECSService:
    Type: AWS::ECS::Service
    DependsOn:
      - ALBListener
      - PostgreSQLDatabase
    Properties:
      ServiceName: evolution-postgres-service
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      DesiredCount: 1
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - !Ref PublicSubnet1
            - !Ref PublicSubnet2
          SecurityGroups:
            - !Ref ECSSecurityGroup
      LoadBalancers:
        - ContainerName: evolution-api-instance
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup
      HealthCheckGracePeriodSeconds: 900

Outputs:
  EvolutionApiUrl:
    Description: Evolution API Manager URL with PostgreSQL
    Value: !Sub "http://${ApplicationLoadBalancer.DNSName}"
    Export:
      Name: !Sub "${AWS::StackName}-EvolutionApiUrl"

  ApiKey:
    Description: Evolution API Key
    Value: "***REMOVED_EVO_API_KEY***"
    Export:
      Name: !Sub "${AWS::StackName}-ApiKey"

  LoadBalancerDNS:
    Description: Load Balancer DNS
    Value: !GetAtt ApplicationLoadBalancer.DNSName
    Export:
      Name: !Sub "${AWS::StackName}-LoadBalancerDNS"

  PostgreSQLEndpoint:
    Description: PostgreSQL Database Endpoint
    Value: !GetAtt PostgreSQLDatabase.Endpoint.Address
    Export:
      Name: !Sub "${AWS::StackName}-PostgreSQLEndpoint"