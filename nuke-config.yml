regions:
  - global
  - us-east-1
  - ap-southeast-2

blocklist:
  - "000000000000" 

bypass-alias-check-accounts:
  - "649872913223"
  - "386347569109"
  - "614084726772"
  - "000000000000"

accounts:
  "649872913223":
    filters:
      IAMUser:
        - "admin-user"
      IAMUserPolicyAttachment:
        - "admin-user -> AdministratorAccess"
      IAMUserAccessKey:
        - "admin-user -> AKIAZOT3RWNDYNPQTWXF"
      IAMVirtualMFADevice:
        - "arn:aws:iam::649872913223:mfa/admin-user"
  # data_analysis project's dummy/sandbox account (the 'default' AWS CLI
  # profile), used for the CFN benchmark's ground-truth deployability checks.
  # NOTE: "root" here is a regular IAM user literally named "root"
  # (arn:aws:iam::386347569109:user/root, created 2026-08-07) -- NOT the AWS
  # account root identity (which would be arn:aws:iam::386347569109:root,
  # no "/user/" path, and isn't a nukeable IAM::User resource at all). It's
  # the CLI's own identity, so it's excluded the same way "admin-user" is
  # excluded above.
  "386347569109":
    filters:
      IAMUser:
        - "root"
      IAMUserPolicyAttachment:
        - "root -> AdministratorAccess"
      IAMUserAccessKey:
        - "root -> AKIAVT5A4B7KZGUUIRNH"
  # data_analysis project's second sandbox account, used via the 'senatwo'
  # AWS CLI profile (TF_Benchmark_Analytics.ipynb's real-AWS deploy check,
  # when AWS_PROFILE is pointed here instead of 'default'). "senatwo" is a
  # regular IAM user (arn:aws:iam::614084726772:user/senatwo) -- the CLI's
  # own identity, excluded the same way "root"/"admin-user" are excluded
  # above. No MFA device or group memberships on this user as of the entry
  # being added (2026-08-27) -- if one is added later, extend the filters
  # below (IAMVirtualMFADevice, IAMGroup) the same way 649872913223's entry
  # would need to.
  "614084726772":
    filters:
      IAMUser:
        - "senatwo"
      IAMUserPolicyAttachment:
        - "senatwo -> AdministratorAccess"
      IAMUserAccessKey:
        - "senatwo -> AKIAY56SNJ72OXQLKPXT"

