AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Main stack for Microsoft AD infrastructure. Deploys VPC with public/private subnets
  and EC2 AD Domain Controller as Kerberos KDC.
  COST WARNING: Creates billable resources (NAT Gateways, EC2). Delete stack to stop charges.
  CLEANUP: 1) aws cloudformation delete-stack --stack-name KerberosEMRonEKS-AD
  2) Verify: describe-stacks should return "does not exist"
  3) Nested stacks auto-deleted. Or run cleanup.sh.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "CFN templates Location"
        Parameters:
          - TemplateBucketName
      - Label:
          default: "Environment Configuration"
        Parameters:
          - ProjectName
      - Label:
          default: "Network Configuration"
        Parameters:
          - VpcCIDR
          - PublicSubnet1CIDR
          - PublicSubnet2CIDR
          - PrivateSubnet1CIDR
          - PrivateSubnet2CIDR

Parameters:
  # Bucket to store CFN templates
  TemplateBucketName:
    Description: Name of the S3 bucket containing the nested stack templates
    Type: String

  # Resource Tag
  ProjectName:
    Description: An environment name that is prefixed to resource names
    Type: String
    Default: KerberosEMRonEKS

  # Network
  VpcCIDR:
    Description: Please enter the IP range (CIDR notation) for this VPC
    Type: String
    Default: 10.0.0.0/24

  PublicSubnet1CIDR:
    Description: Please enter the IP range (CIDR notation) for the public subnet in the first Availability Zone
    Type: String
    Default: 10.0.0.0/26

  PublicSubnet2CIDR:
    Description: Please enter the IP range (CIDR notation) for the public subnet in the second Availability Zone
    Type: String
    Default: 10.0.0.64/26

  PrivateSubnet1CIDR:
    Description: Please enter the IP range (CIDR notation) for the private subnet in the first Availability Zone
    Type: String
    Default: 10.0.0.128/26

  PrivateSubnet2CIDR:
    Description: Please enter the IP range (CIDR notation) for the private subnet in the second Availability Zone
    Type: String
    Default: 10.0.0.192/26

  ADServerInstanceType:
    Description: EC2 instance type for the AD server
    Type: String
    Default: t3.medium

  DomainName:
    Description: Fully qualified domain name (FQDN) for the Active Directory domain
    Type: String
    Default: corp.kerberos

  DomainNetBIOSName:
    Description: NetBIOS name for the Active Directory domain (up to 15 characters)
    Type: String
    Default: CORP

  DomainAdminPassword:
    Description: >-
      Password for the domain administrator account. Must be at least 12 characters
      and include uppercase, lowercase, numbers, and special characters.
    Type: String
    NoEcho: true
    MinLength: 12
    ConstraintDescription: Password must be at least 12 characters long.

Resources:
  NetworkStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub https://${TemplateBucketName}.s3.${AWS::Region}.amazonaws.com/cloudformation/microsoft-ad/network-stack.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        VpcCIDR: !Ref VpcCIDR
        PublicSubnet1CIDR: !Ref PublicSubnet1CIDR
        PublicSubnet2CIDR: !Ref PublicSubnet2CIDR
        PrivateSubnet1CIDR: !Ref PrivateSubnet1CIDR
        PrivateSubnet2CIDR: !Ref PrivateSubnet2CIDR
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete

  MicrosoftADStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub https://${TemplateBucketName}.s3.${AWS::Region}.amazonaws.com/cloudformation/microsoft-ad/microsoft-ad.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        VPCID: !GetAtt NetworkStack.Outputs.VPC
        VpcCIDR: !Ref VpcCIDR
        PrivateSubnet1Id: !Select [0, !Split [",", !GetAtt NetworkStack.Outputs.PrivateSubnets]]
        PrivateSubnet2Id: !Select [1, !Split [",", !GetAtt NetworkStack.Outputs.PrivateSubnets]]
        ADServerInstanceType: !Ref ADServerInstanceType

        DomainName: !Ref DomainName
        DomainNetBIOSName: !Ref DomainNetBIOSName
        DomainAdminPassword: !Ref DomainAdminPassword

Outputs:
  VPC:
    Description: A reference to the created VPC
    Value: !GetAtt NetworkStack.Outputs.VPC

  PublicSubnets:
    Description: A list of the public subnets
    Value: !GetAtt NetworkStack.Outputs.PublicSubnets

  PrivateSubnets:
    Description: A list of the private subnets
    Value: !GetAtt NetworkStack.Outputs.PrivateSubnets

  ADServerPrivateIP:
    Description: Private IP address of the AD server
    Value: !GetAtt MicrosoftADStack.Outputs.ADServerPrivateIP
    Export:
      Name: !Sub ${ProjectName}-AD-ADServerPrivateIP

  ADServerInstanceId:
    Description: Instance ID of the AD server
    Value: !GetAtt MicrosoftADStack.Outputs.ADServerInstanceId
    Export:
      Name: !Sub ${ProjectName}-AD-ADServerInstanceId