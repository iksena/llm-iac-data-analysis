AWSTemplateFormatVersion: "2010-09-09"
Description: >
  IAM roles for EMR on EKS job execution and the EMR virtual cluster.
  The job execution role trust policy is updated post-deploy for OIDC-based IRSA.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Configuration
        Parameters:
          - ProjectName
      - Label:
          default: S3
        Parameters:
          - S3BucketName

Parameters:
  ProjectName:
    Type: String
    Default: emr-celeborn-demo
    Description: Project name used to import exports and for tagging

  S3BucketName:
    Type: String
    Description: S3 bucket name for Spark job artifacts and data

Resources:
  # --- EMR Job Execution IAM Role ---
  # Trust policy is updated post-deploy via deploy script to add OIDC provider trust

  EMRJobExecutionRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: "Explicit role name required for cross-stack ImportValue references and IRSA trust policy binding. This is a blog post demonstration — resource replacement constraints are not a concern."
          - id: W11
            reason: "logs:DescribeLogGroups does not support resource-level permissions — wildcard resource is required for this API action."
      guard:
        SuppressedRules:
          - IAM_NO_INLINE_POLICY_CHECK: "Inline policy is tightly scoped to S3, KMS, and CloudWatch access for EMR job execution. A managed policy would require a separate stack with no security benefit for a blog post demonstration."
    Properties:
      RoleName: !Sub "${ProjectName}-emr-job-execution-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: elasticmapreduce.amazonaws.com
            Action: "sts:AssumeRole"
      Policies:
        - PolicyName: EMRJobExecutionPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # CloudWatch Logs — DescribeLogGroups is a list action requiring wildcard resource
              - Sid: AllowCloudWatchLogsDescribe
                Effect: Allow
                Action:
                  - "logs:DescribeLogGroups"
                Resource: "*"
              # CloudWatch Logs — scoped to the project log group for write operations
              - Sid: AllowCloudWatchLogs
                Effect: Allow
                Action:
                  - "logs:CreateLogGroup"
                  - "logs:CreateLogStream"
                  - "logs:PutLogEvents"
                  - "logs:DescribeLogStreams"
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/emr-on-eks/${ProjectName}*"
              # S3 access for job artifacts and data
              - Sid: AllowS3Access
                Effect: Allow
                Action:
                  - "s3:ListBucket"
                  - "s3:GetBucketLocation"
                Resource: !Sub "arn:${AWS::Partition}:s3:::${S3BucketName}"
              - Sid: AllowS3ObjectAccess
                Effect: Allow
                Action:
                  - "s3:GetObject"
                  - "s3:PutObject"
                  - "s3:DeleteObject"
                Resource: !Sub "arn:${AWS::Partition}:s3:::${S3BucketName}/*"
              # KMS for log encryption
              - Sid: AllowKMSAccess
                Effect: Allow
                Action:
                  - "kms:Decrypt"
                  - "kms:GenerateDataKey"
                Resource: !ImportValue
                  Fn::Sub: "${ProjectName}-KMSKeyArn"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-emr-job-execution-role"
        - Key: Project
          Value: !Ref ProjectName

  # --- EMR on EKS Virtual Cluster ---

  EMRVirtualCluster:
    Type: AWS::EMRContainers::VirtualCluster
    Properties:
      Name: !Sub "${ProjectName}-virtual-cluster"
      ContainerProvider:
        Id: !ImportValue
          Fn::Sub: "${ProjectName}-EmrClusterName"
        Type: EKS
        Info:
          EksInfo:
            Namespace: emr
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-virtual-cluster"
        - Key: Project
          Value: !Ref ProjectName

Outputs:
  VirtualClusterId:
    Description: ID of the EMR virtual cluster
    Value: !Ref EMRVirtualCluster
    Export:
      Name: !Sub "${ProjectName}-EmrVirtualClusterId"

  VirtualClusterArn:
    Description: ARN of the EMR virtual cluster
    Value: !GetAtt EMRVirtualCluster.Arn
    Export:
      Name: !Sub "${ProjectName}-EmrVirtualClusterArn"

  JobExecutionRoleArn:
    Description: ARN of the EMR job execution role
    Value: !GetAtt EMRJobExecutionRole.Arn
    Export:
      Name: !Sub "${ProjectName}-EmrJobExecutionRoleArn"

  JobExecutionRoleName:
    Description: Name of the EMR job execution role (for IRSA trust policy update)
    Value: !Ref EMRJobExecutionRole
    Export:
      Name: !Sub "${ProjectName}-EmrJobExecutionRoleName"