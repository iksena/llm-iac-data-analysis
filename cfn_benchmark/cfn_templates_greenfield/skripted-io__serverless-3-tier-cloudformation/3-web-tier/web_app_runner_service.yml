AWSTemplateFormatVersion: "2010-09-09"
Description: Deploys an App Runner service to run our main application

Parameters:
  AppName:
    Type: String
    Default: shopify
  NodeEnvironment:
    Type: String
    Default: development
  AWSEnvironment:
    Type: String
    Default: staging
  InstancePort:
    Type: Number
    Default: 80
  InstanceCPU:
    Type: String
    Default: "1 vCPU"
  InstanceMemory:
    Type: String
    Default: "2 GB"

Resources:
  AppVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${AppName}-vpc"

  AppPrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref AppVPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub "${AppName}-private-subnet-a"

  AppPrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref AppVPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub "${AppName}-private-subnet-b"

  AppPrivateRouteTableA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref AppVPC
      Tags:
        - Key: Name
          Value: !Sub "${AppName}-private-route-table-a"

  AppPrivateRouteTableB:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref AppVPC
      Tags:
        - Key: Name
          Value: !Sub "${AppName}-private-route-table-b"

  AppPrivateSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AppPrivateSubnetA
      RouteTableId: !Ref AppPrivateRouteTableA

  AppPrivateSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AppPrivateSubnetB
      RouteTableId: !Ref AppPrivateRouteTableB

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for the App Runner VPC connector
      VpcId: !Ref AppVPC
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  AppWebSecrets:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AppName}-web-secrets"
      Description: Web application secrets consumed by the App Runner service
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: "placeholder"

  DynamoDbSessionTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AppName}-session-table"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  AppRunnerECRRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${AppName}-main"

  AppRunnerECRAccessRole:
    Type: AWS::IAM::Role
    Properties:
      Description: IAM Role for App Runner to be able to pull our ECR image
      AssumeRolePolicyDocument:
        Version: "2008-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: build.apprunner.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSAppRunnerServicePolicyForECRAccess
      Path: /
      RoleName: AppRunnerECRAccessRole

  AppRunnerInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      Description: IAM Role for App Runner container instance to access necesarry resources
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: tasks.apprunner.amazonaws.com
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - !Ref AppRunnerInstanceManagedPolicy
        - arn:aws:iam::aws:policy/service-role/AWSAppRunnerServicePolicyForECRAccess
        # this second policy is only needed if you want your app to display an image version.

  AppRunnerInstanceManagedPolicy:
    Type: "AWS::IAM::ManagedPolicy"
    Properties:
      Description: Custom managed policy for our App Runner instance role to get access to secrets
      ManagedPolicyName: AppRunnerInstanceManagedPolicy
      Path: /
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - "secretsmanager:GetSecretValue"
            Resource: !Ref AppWebSecrets
          - Effect: Allow
            Action:
              - "dynamodb:*"
            Resource: !GetAtt DynamoDbSessionTable.Arn

  DynamoDbGatewayEndpoint:
    Type: "AWS::EC2::VPCEndpoint"
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Deny
            Principal: "*"
            Action: "*"
            Resource: "*"
            Condition:
              ArnNotEquals:
                "aws:PrincipalArn": !GetAtt AppRunnerInstanceRole.Arn
          - Effect: Allow
            Principal: "*"
            Action: "dynamodb:*"
            Resource: !GetAtt DynamoDbSessionTable.Arn
      ServiceName:
        Fn::Sub: "com.amazonaws.${AWS::Region}.dynamodb"
      VpcId: !Ref AppVPC
      RouteTableIds:
        - !Ref AppPrivateRouteTableA
        - !Ref AppPrivateRouteTableB

  AppRunnerVPCConnector:
    Type: AWS::AppRunner::VpcConnector
    Properties:
      SecurityGroups:
        - !Ref AppSecurityGroup
      Subnets:
        - !Ref AppPrivateSubnetA
        - !Ref AppPrivateSubnetB

  AppRunnerService:
    Type: AWS::AppRunner::Service
    Properties:
      ServiceName: !Sub "${AppName}-${NodeEnvironment}"
      SourceConfiguration:
        AuthenticationConfiguration:
          AccessRoleArn: !GetAtt AppRunnerECRAccessRole.Arn
        AutoDeploymentsEnabled: true
        ImageRepository:
          ImageIdentifier:
            Fn::Join:
              - ""
              - - !GetAtt AppRunnerECRRepository.RepositoryUri
                - ":latest"
          ImageRepositoryType: ECR
          ImageConfiguration:
            Port: !Ref InstancePort
            RuntimeEnvironmentVariables:
              - Name: NODE_ENV
                Value: !Ref NodeEnvironment
              - Name: SHOPIFY_ENV
                Value: !Ref AWSEnvironment
              - Name: MAIN_SECRETS_ARN
                Value: !Ref AppWebSecrets
      InstanceConfiguration:
        Cpu: !Ref InstanceCPU
        Memory: !Ref InstanceMemory
        InstanceRoleArn: !GetAtt AppRunnerInstanceRole.Arn
      NetworkConfiguration:
        EgressConfiguration:
          EgressType: VPC
          VpcConnectorArn: !Ref AppRunnerVPCConnector
      Tags:
        - Key: "Application"
          Value: !Ref "AppName"
        - Key: "Name"
          Value:
            Fn::Sub: "${AppName}-app-runner"
