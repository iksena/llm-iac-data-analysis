                              # For templated emails, only add if template has placeholder
                              should_add_list_management = template_s3_key or (not template_s3_key and template_has_placeholder)

                              if should_add_list_management:
                                  list_management_options = {
                                      'ContactListName': contact_list_name
                                  }
                                  if message_topic_name and message_topic_name != "NONE":
                                      list_management_options['TopicName'] = message_topic_name

                                  email_params['ListManagementOptions'] = list_management_options

                                  logger.info(f"Added list management options: {list_management_options}")
                              elif not template_s3_key:
