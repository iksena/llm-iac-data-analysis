AWSTemplateFormatVersion: "2010-09-09"
Description: "CloudFormation template for SageMaker project template IAM roles"
Parameters:
  CreateExecutionRole:
    Type: String
    AllowedValues:
      - "YES"
      - "NO"
    Default: "YES"
    Description: "Create the AmazonSageMakerServiceCatalogProductsExecutionRole"
  CreateLaunchRole:
    Type: String
    AllowedValues:
      - "YES"
      - "NO"
    Default: "NO"
    Description: "Create the AmazonSageMakerServiceCatalogProductsLaunchRole"
  CreateUseRole:
    Type: String
    AllowedValues:
      - "YES"
      - "NO"
    Default: "NO"
    Description: "Create the AmazonSageMakerServiceCatalogProductsUseRole"
  CreateCloudFormationRole:
    Type: String
    AllowedValues:
      - "YES"
      - "NO"
    Default: "YES"
    Description: "Create the CloudFormation service role"
  CreateCodeBuildRole:
    Type: String
    AllowedValues:
      - "YES"
      - "NO"
    Default: "YES"
    Description: "Create the CodeBuild service role"
  CreateCodePipelineRole:
    Type: String
    AllowedValues:
      - "YES"
      - "NO"
    Default: "YES"
    Description: "Create the CodePipeline service role"
  CreateEventsRole:
    Type: String
    AllowedValues:
      - "YES"
      - "NO"
    Default: "YES"
    Description: "Create the Events service role"
  CreateAPIGatewayRole:
    Type: String
    AllowedValues:
      - "YES"
      - "NO"
    Default: "YES"
    Description: "Create the API Gateway service role"
  CreateFirehoseRole:
    Type: String
    AllowedValues:
      - "YES"
      - "NO"
    Default: "YES"
    Description: "Create the Firehose service role"
  CreateGlueRole:
    Type: String
    AllowedValues:
      - "YES"
      - "NO"
    Default: "YES"
    Description: "Create the Glue service role"
  CreateLambdaRole:
    Type: String
    AllowedValues:
      - "YES"
      - "NO"
    Default: "YES"
    Description: "Create the Lambda service role"
Conditions:
  ShouldCreateExecutionRole: !Equals
    - !Ref CreateExecutionRole
    - "YES"
  ShouldCreateLaunchRole: !Equals
    - !Ref CreateLaunchRole
    - "YES"
  ShouldCreateUseRole: !Equals
    - !Ref CreateUseRole
    - "YES"
  ShouldCreateCloudFormationRole: !Equals
    - !Ref CreateCloudFormationRole
    - "YES"
  ShouldCreateCodeBuildRole: !Equals
    - !Ref CreateCodeBuildRole
    - "YES"
  ShouldCreateCodePipelineRole: !Equals
    - !Ref CreateCodePipelineRole
    - "YES"
  ShouldCreateEventsRole: !Equals
    - !Ref CreateEventsRole
    - "YES"
  ShouldCreateAPIGatewayRole: !Equals
    - !Ref CreateAPIGatewayRole
    - "YES"
  ShouldCreateFirehoseRole: !Equals
    - !Ref CreateFirehoseRole
    - "YES"
  ShouldCreateGlueRole: !Equals
    - !Ref CreateGlueRole
    - "YES"
  ShouldCreateLambdaRole: !Equals
    - !Ref CreateLambdaRole
    - "YES"
Resources:
  SageMakerExecutionRole:
    Condition: ShouldCreateExecutionRole
    Type: AWS::IAM::Role
    Properties:
      RoleName: AmazonSageMakerServiceCatalogProductsExecutionRole
      Path: "/service-role/"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - sagemaker.amazonaws.com
                - servicecatalog.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSageMakerFullAccess
  SageMakerLaunchRole:
    Condition: ShouldCreateLaunchRole
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    Properties:
      RoleName: AmazonSageMakerServiceCatalogProductsLaunchRole
      Path: "/service-role/"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - sagemaker.amazonaws.com
                - servicecatalog.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSageMakerAdmin-ServiceCatalogProductsServiceRolePolicy
  SageMakerUseRole:
    Condition: ShouldCreateUseRole
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    Properties:
      RoleName: AmazonSageMakerServiceCatalogProductsUseRole
      Path: "/service-role/"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - sagemaker.amazonaws.com
                - servicecatalog.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEC2ReadOnlyAccess
      Policies:
        - PolicyName: SageMakerUseRoleInlinePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: SageMakerPermissions
                Effect: Allow
                Action:
                  - sagemaker:List*
                  - sagemaker:Describe*
                  - sagemaker:Search
                  - sagemaker:Get*
                  - sagemaker:BatchGet*
                  - sagemaker:AddTags
                  - sagemaker:CreatePresignedDomainUrl
                  - sagemaker:CreatePresignedNotebookInstanceUrl
                Resource: "*"
              - Sid: CloudFormationPermissions
                Effect: Allow
                Action:
                  - cloudformation:Describe*
                  - cloudformation:List*
                  - cloudformation:Get*
                  - cloudformation:EstimateTemplateCost
                  - cloudformation:CreateChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:CreateStackSet
                  - cloudformation:UpdateStackSet
                  - cloudformation:DeleteStackSet
                  - cloudformation:CreateStackInstances
                  - cloudformation:DeleteStackInstances
                  - cloudformation:UpdateStackInstances
                  - cloudformation:DetectStackDrift
                  - cloudformation:DetectStackResourceDrift
                  - cloudformation:DetectStackSetDrift
                Resource: "*"
              - Sid: CloudWatchPermissions
                Effect: Allow
                Action:
                  - cloudwatch:Describe*
                  - cloudwatch:List*
                  - cloudwatch:Get*
                  - cloudwatch:PutMetricData
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:SetAlarmState
                  - cloudwatch:DeleteAlarms
                  - cloudwatch:PutDashboard
                  - cloudwatch:DeleteDashboards
                  - cloudwatch:GetDashboard
                  - cloudwatch:ListDashboards
                Resource: "*"
              - Sid: CodeBuildPermissions
                Effect: Allow
                Action:
                  - codebuild:List*
                  - codebuild:Describe*
                  - codebuild:BatchGet*
                  - codebuild:GetResourcePolicy
                  - codebuild:StartBuild
                  - codebuild:StopBuild
                  - codebuild:StartBuildBatch
                  - codebuild:StopBuildBatch
                  - codebuild:CreateProject
                  - codebuild:UpdateProject
                  - codebuild:DeleteProject
                  - codebuild:PutResourcePolicy
                  - codebuild:DeleteResourcePolicy
                Resource: "*"
              - Sid: CodeCommitPermissions
                Effect: Allow
                Action:
                  - codecommit:List*
                  - codecommit:Get*
                  - codecommit:BatchGet*
                  - codecommit:GitPull
                  - codecommit:GitPush
                  - codecommit:CreateRepository
                  - codecommit:DeleteRepository
                  - codecommit:UpdateRepository*
                  - codecommit:Put*
                  - codecommit:UploadArchive
                  - codecommit:CancelUploadArchive
                Resource: "*"
              - Sid: CodePipelinePermissions
                Effect: Allow
                Action:
                  - codepipeline:List*
                  - codepipeline:Get*
                  - codepipeline:Describe*
                  - codepipeline:StartPipelineExecution
                  - codepipeline:StopPipelineExecution
                  - codepipeline:CreatePipeline
                  - codepipeline:UpdatePipeline
                  - codepipeline:DeletePipeline
                  - codepipeline:PutActionRevision
                  - codepipeline:PutApprovalResult
                  - codepipeline:RetryStageExecution
                Resource: "*"
              - Sid: EC2Permissions
                Effect: Allow
                Action:
                  - ec2:Describe*
                  - ec2:CreateNetworkInterface
                  - ec2:DeleteNetworkInterface
                  - ec2:AttachNetworkInterface
                  - ec2:DetachNetworkInterface
                  - ec2:ModifyNetworkInterfaceAttribute
                  - ec2:DescribeNetworkInterfaceAttribute
                  - ec2:CreateNetworkInterfacePermission
                  - ec2:DeleteNetworkInterfacePermission
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                  - ec2:CreateSecurityGroup
                  - ec2:DeleteSecurityGroup
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupEgress
                  - ec2:CreateTags
                  - ec2:DeleteTags
                Resource: "*"
              - Sid: ECRPermissions
                Effect: Allow
                Action:
                  - ecr:Describe*
                  - ecr:List*
                  - ecr:Get*
                  - ecr:BatchGet*
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetAuthorizationToken
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchDeleteImage
                  - ecr:CreateRepository
                  - ecr:DeleteRepository
                  - ecr:SetRepositoryPolicy
                  - ecr:GetRepositoryPolicy
                Resource: "*"
              - Sid: EventsPermissions
                Effect: Allow
                Action:
                  - events:Describe*
                  - events:List*
                  - events:Put*
                  - events:EnableRule
                  - events:DisableRule
                  - events:RemoveTargets
                  - events:PutTargets
                  - events:PutRule
                  - events:DeleteRule
                  - events:CreateEventBus
                  - events:DeleteEventBus
                  - events:PutEvents
                Resource: "*"
              - Sid: FirehosePermissions
                Effect: Allow
                Action:
                  - firehose:Describe*
                  - firehose:List*
                  - firehose:PutRecord
                  - firehose:PutRecordBatch
                  - firehose:CreateDeliveryStream
                  - firehose:DeleteDeliveryStream
                  - firehose:UpdateDestination
                  - firehose:StartDeliveryStreamEncryption
                  - firehose:StopDeliveryStreamEncryption
                Resource: "*"
              - Sid: GluePermissions
                Effect: Allow
                Action:
                  - glue:Get*
                  - glue:List*
                  - glue:BatchGet*
                  - glue:CreateDatabase
                  - glue:CreateTable
                  - glue:UpdateDatabase
                  - glue:UpdateTable
                  - glue:DeleteDatabase
                  - glue:DeleteTable
                  - glue:CreateJob
                  - glue:UpdateJob
                  - glue:DeleteJob
                  - glue:StartJobRun
                  - glue:StopJobRun
                  - glue:GetJobRun
                  - glue:GetJobRuns
                  - glue:CreateCrawler
                  - glue:UpdateCrawler
                  - glue:DeleteCrawler
                  - glue:StartCrawler
                  - glue:StopCrawler
                  - glue:CreateTrigger
                  - glue:UpdateTrigger
                  - glue:DeleteTrigger
                  - glue:StartTrigger
                  - glue:StopTrigger
                  - glue:CreateWorkflow
                  - glue:UpdateWorkflow
                  - glue:DeleteWorkflow
                  - glue:CreateDevEndpoint
                  - glue:UpdateDevEndpoint
                  - glue:DeleteDevEndpoint
                  - glue:CreateClassifier
                  - glue:UpdateClassifier
                  - glue:DeleteClassifier
                  - glue:CreateConnection
                  - glue:UpdateConnection
                  - glue:DeleteConnection
                  - glue:BatchCreatePartition
                  - glue:BatchDeletePartition
                  - glue:BatchUpdatePartition
                Resource: "*"
              - Sid: IAMPermissions
                Effect: Allow
                Action:
                  - iam:PassRole
                  - iam:GetRole
                  - iam:ListRoles
                  - iam:GetPolicy
                  - iam:ListPolicies
                  - iam:SimulatePrincipalPolicy
                  - iam:CreateServiceLinkedRole
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:GetPolicyVersion
                  - iam:ListPolicyVersions
                Resource: "*"
              - Sid: LambdaPermissions
                Effect: Allow
                Action:
                  - lambda:List*
                  - lambda:Get*
                  - lambda:InvokeFunction
                  - lambda:InvokeAsync
                  - lambda:CreateFunction
                  - lambda:UpdateFunction*
                  - lambda:DeleteFunction
                  - lambda:AddPermission
                  - lambda:RemovePermission
                  - lambda:CreateEventSourceMapping
                  - lambda:UpdateEventSourceMapping
                  - lambda:DeleteEventSourceMapping
                  - lambda:GetEventSourceMapping
                  - lambda:ListEventSourceMappings
                  - lambda:PublishVersion
                  - lambda:UpdateAlias
                  - lambda:CreateAlias
                  - lambda:DeleteAlias
                  - lambda:GetAlias
                  - lambda:ListAliases
                  - lambda:GetLayerVersion
                  - lambda:ListLayerVersions
                  - lambda:PublishLayerVersion
                  - lambda:DeleteLayerVersion
                Resource: "*"
              - Sid: LogsPermissions
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:Describe*
                  - logs:List*
                  - logs:GetLogEvents
                  - logs:FilterLogEvents
                  - logs:PutRetentionPolicy
                  - logs:DeleteRetentionPolicy
                  - logs:PutMetricFilter
                  - logs:DeleteMetricFilter
                  - logs:PutSubscriptionFilter
                  - logs:DeleteSubscriptionFilter
                  - logs:CreateExportTask
                  - logs:CancelExportTask
                  - logs:DescribeExportTasks
                  - logs:TagLogGroup
                  - logs:UntagLogGroup
                Resource: "*"
              - Sid: S3Permissions
                Effect: Allow
                Action:
                  - s3:Get*
                  - s3:List*
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                  - s3:HeadObject
                  - s3:AbortMultipartUpload
                  - s3:ListMultipartUploads
                  - s3:ListParts
                  - s3:PutObjectTagging
                  - s3:GetObjectTagging
                  - s3:DeleteObjectTagging
                  - s3:PutObjectVersion
                  - s3:GetObjectVersion
                  - s3:DeleteObjectVersion
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:PutBucketPolicy
                  - s3:GetBucketPolicy
                  - s3:DeleteBucketPolicy
                  - s3:PutBucketPublicAccessBlock
                  - s3:GetBucketPublicAccessBlock
                  - s3:PutEncryptionConfiguration
                  - s3:GetEncryption