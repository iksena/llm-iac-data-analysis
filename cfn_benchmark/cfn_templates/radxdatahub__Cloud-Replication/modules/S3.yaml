## Bucket containing approved files for access after PII processing
  S3BucketCovidRadxDefault:
    Type: "AWS::S3::Bucket"
    DeletionPolicy: Delete ## CHANGE THIS  FOR PRODUCTION
    Properties:
      PublicAccessBlockConfiguration:
        RestrictPublicBuckets: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        BlockPublicAcls: true
      BucketName: !Sub "covid-radx-default-${Environment}" ## PLEASE MODIFY to ensure global uniqueness according to our organization's needs
      OwnershipControls:
        Rules:
        - ObjectOwnership: "BucketOwnerEnforced"
      BucketEncryption:
