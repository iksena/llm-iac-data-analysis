AWSTemplateFormatVersion: '2010-09-09'
Description: 'Template for Call Processing Pipeline with API Gateway, Lambda, Step Functions, and DynamoDB'

Parameters:
  SalesforceAPIEndpoint:
    Type: String
    Description: Salesforce API endpoint
  SalesforceUsername:
    Type: String
    Description: Salesforce username
    NoEcho: true
  SalesforcePassword:
    Type: String
    Description: Salesforce password
    NoEcho: true

Resources:
  # KMS Key for encryption
  EncryptionKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS key for encrypting call processing data
      EnableKeyRotation: true
      KeyPolicy:
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: Allow DynamoDB Service
            Effect: Allow
            Principal:
              Service: dynamodb.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey
            Resource: '*'
          - Sid: Allow CloudWatch Logs Service
            Effect: Allow
            Principal:
              Service: !Sub 'logs.${AWS::Region}.amazonaws.com'
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: '*'

  EncryptionKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/call-processing-key
      TargetKeyId: !Ref EncryptionKey

  # Secrets Manager for Salesforce credentials
  SalesforceCredentials:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: salesforce-credentials
      Description: Salesforce API credentials
      SecretString: !Sub |
        {
          "username": "${SalesforceUsername}",
          "password": "${SalesforcePassword}",
          "endpoint": "${SalesforceAPIEndpoint}"
        }
      KmsKeyId: !Ref EncryptionKey

  # DynamoDB Table for Status Tracking
  StatusTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: callId
          AttributeType: S
      KeySchema:
        - AttributeName: callId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref EncryptionKey

  # CloudWatch Log Groups
  CallSalesforceLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/CallSalesforceFunction
      RetentionInDays: 14
      KmsKeyId: !GetAtt EncryptionKey.Arn

  CallBedrockLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/CallBedrockFunction
      RetentionInDays: 14
      KmsKeyId: !GetAtt EncryptionKey.Arn

  WriteFeedbackLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/WriteFeedbackFunction
      RetentionInDays: 14
      KmsKeyId: !GetAtt EncryptionKey.Arn

  ReceiveTriggerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/ReceiveTriggerFunction
      RetentionInDays: 14
      KmsKeyId: !GetAtt EncryptionKey.Arn

  APIGatewayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/apigateway/CallProcessingAPI
      RetentionInDays: 14
      KmsKeyId: !GetAtt EncryptionKey.Arn

  # Base Lambda Execution Role
  LambdaBasicExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub "${CallSalesforceLogGroup.Arn}:*"
                  - !Sub "${CallBedrockLogGroup.Arn}:*"
                  - !Sub "${WriteFeedbackLogGroup.Arn}:*"
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt StatusTable.Arn
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref SalesforceCredentials
        - PolicyName: KMSAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource: !GetAtt EncryptionKey.Arn
        - PolicyName: BedrockAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-3-sonnet-20240229-v1:0"
                  - !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-v2"

  # API Gateway with API Key authentication
  CallProcessingAPI:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: CallProcessingAPI
      ApiKeySourceType: HEADER

  APIKey:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Enabled: true

  UsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    Properties:
      UsagePlanName: CallProcessingUsagePlan
      ApiStages:
        - ApiId: !Ref CallProcessingAPI
          Stage: !Ref APIStage
      Throttle:
        RateLimit: 100
        BurstLimit: 200

  UsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref APIKey
      KeyType: API_KEY
      UsagePlanId: !Ref UsagePlan

  APIResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CallProcessingAPI
      ParentId: !GetAtt CallProcessingAPI.RootResourceId
      PathPart: process-call

  APIDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: APIMethod
    Properties:
      RestApiId: !Ref CallProcessingAPI

  APIStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref CallProcessingAPI
      DeploymentId: !Ref APIDeployment
      StageName: prod
      AccessLogSetting:
        DestinationArn: !GetAtt APIGatewayLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","caller":"$context.identity.caller","user":"$context.identity.user","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","resourcePath":"$context.resourcePath","status":"$context.status","protocol":"$context.protocol","responseLength":"$context.responseLength"}'
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          LoggingLevel: INFO
          DataTraceEnabled: false

  # Step Function IAM Role
  StepFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaInvocation
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt CallSalesforceFunction.Arn
                  - !GetAtt CallBedrockFunction.Arn
                  - !GetAtt WriteFeedbackFunction.Arn

  # Lambda Functions
  CallSalesforceFunction:
    Type: AWS::Lambda::Function
    DependsOn: CallSalesforceLogGroup
    Properties:
      FunctionName: CallSalesforceFunction
      Handler: index.lambda_handler
      Role: !GetAtt LambdaBasicExecutionRole.Arn
      ReservedConcurrentExecutions: 10
      Code:
        ZipFile: |
          import json
          import boto3
          import requests
          import os

          def get_salesforce_credentials():
              secrets_client = boto3.client('secretsmanager')
              response = secrets_client.get_secret_value(SecretId='salesforce-credentials')
              return json.loads(response['SecretString'])

          def update_status(dynamodb, call_id, status):
              table = dynamodb.Table(os.environ['DYNAMODB_TABLE'])
              table.update_item(
                  Key={'callId': call_id},
                  UpdateExpression='SET #status = :status',
                  ExpressionAttributeNames={'#status': 'status'},
                  ExpressionAttributeValues={':status': status}
              )

          def lambda_handler(event, context):
              call_id = event['callId']
              dynamodb = boto3.resource('dynamodb')
              update_status(dynamodb, call_id, 'fetching_transcript')

              creds = get_salesforce_credentials()
              response = requests.get(
                  f"{creds['endpoint']}/transcript/{call_id}",
                  headers={'Authorization': f"Bearer {creds['password']}"}
              )

              if response.status_code == 200:
                  transcript = response.json()
                  update_status(dynamodb, call_id, 'transcript_received')
                  return {
                      'transcriptAvailable': True,
                      'transcript': transcript,
                      'callId': call_id
                  }

              return {
                  'transcriptAvailable': False,
                  'callId': call_id
              }
      Runtime: python3.9
      Environment:
        Variables:
          DYNAMODB_TABLE: !Ref StatusTable

  CallBedrockFunction:
    Type: AWS::Lambda::Function
    DependsOn: CallBedrockLogGroup
    Properties:
      FunctionName: CallBedrockFunction
      Handler: index.lambda_handler
      Role: !GetAtt LambdaBasicExecutionRole.Arn
      ReservedConcurrentExecutions: 5
      Code:
        ZipFile: |
          import json
          import boto3

          def update_status(dynamodb, call_id, status):
              table = dynamodb.Table(os.environ['DYNAMODB_TABLE'])
              table.update_item(
                  Key={'callId': call_id},
                  UpdateExpression='SET #status = :status',
                  ExpressionAttributeNames={'#status': 'status'},
                  ExpressionAttributeValues={':status': status}
              )

          def lambda_handler(event, context):
              call_id = event['callId']
              transcript = event['transcript']

              dynamodb = boto3.resource('dynamodb')
              update_status(dynamodb, call_id, 'calling_bedrock')

              bedrock = boto3.client('bedrock-runtime')
              inference_config = {"temperature": 0}
              additional_model_fields = {"top_k": 200}
              model_id='anthropic.claude-3-sonnet-20240229-v1:0'
              prompt = f'Please summarize this call transcript: {transcript}'
              response = bedrock.converse(
                  modelId=model_id,
                  messages=[
                          {
                              "role": "user",
                              "content": [
                                  {
                                      "text": prompt
                                  }
                              ]
                          }],
                  inferenceConfig=inference_config,
                  additionalModelRequestFields=additional_model_fields
                  )

              summary = response['output']['message']['content'][0]['text']

              return {
                  'callId': call_id,
                  'summary': summary,
                  'transcript': transcript
              }

      Runtime: python3.9
      Timeout: 300
      Environment:
        Variables:
          DYNAMODB_TABLE: !Ref StatusTable

  WriteFeedbackFunction:
    Type: AWS::Lambda::Function
    DependsOn: WriteFeedbackLogGroup
    Properties:
      FunctionName: WriteFeedbackFunction
      Handler: index.lambda_handler
      Role: !GetAtt LambdaBasicExecutionRole.Arn
      ReservedConcurrentExecutions: 10
      Code:
        ZipFile: |
          import json
          import boto3
          import requests
          import os

          def get_salesforce_credentials():
              secrets_client = boto3.client('secretsmanager')
              response = secrets_client.get_secret_value(SecretId='salesforce-credentials')
              return json.loads(response['SecretString'])

          def update_status(dynamodb, call_id, status):
              table = dynamodb.Table(os.environ['DYNAMODB_TABLE'])
              table.update_item(
                  Key={'callId': call_id},
                  UpdateExpression='SET #status = :status',
                  ExpressionAttributeNames={'#status': 'status'},
                  ExpressionAttributeValues={':status': status}
              )

          def lambda_handler(event, context):
              call_id = event['callId']
              summary = event['summary']

              dynamodb = boto3.resource('dynamodb')

              creds = get_salesforce_credentials()
              response = requests.post(
                  f"{creds['endpoint']}/update-summary/{call_id}",
                  headers={'Authorization': f"Bearer {creds['password']}"},
                  json={'summary': summary}
              )

              if response.status_code == 200:
                  update_status(dynamodb, call_id, 'feedback_written')
                  return {
                      'statusCode': 200,
                      'body': 'Summary updated successfully'
                  }
              else:
                  update_status(dynamodb, call_id, 'feedback_write_failed')
                  return {
                      'statusCode': 500,
                      'body': 'Failed to update summary'
                  }
      Runtime: python3.9
      Environment:
        Variables:
          DYNAMODB_TABLE: !Ref StatusTable

  # State Machine
  CallProcessingStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      RoleArn: !GetAtt StepFunctionRole.Arn
      DefinitionString: !Sub |
        {
          "Comment": "Call Processing State Machine",
          "StartAt": "FetchTranscript",
          "States": {
            "FetchTranscript": {
              "Type": "Task",
              "Resource": "${CallSalesforceFunction.Arn}",
              "Next": "CheckTranscript"
            },
            "CheckTranscript": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.transcriptAvailable",
                  "BooleanEquals": true,
                  "Next": "ProcessWithBedrock"
                }
              ],
              "Default": "Wait"
            },
            "Wait": {
              "Type": "Wait",
              "Seconds": 300,
              "Next": "FetchTranscript"
            },
            "ProcessWithBedrock": {
              "Type": "Task",
              "Resource": "${CallBedrockFunction.Arn}",
              "Next": "WriteFeedback"
            },
            "WriteFeedback": {
              "Type": "Task",
              "Resource": "${WriteFeedbackFunction.Arn}",
              "End": true
            }
          }
        }

  # Trigger Lambda and its role
  TriggerLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${ReceiveTriggerLogGroup.Arn}:*"
        - PolicyName: StepFunctionsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - states:StartExecution
                Resource: !Ref CallProcessingStateMachine
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource: !GetAtt StatusTable.Arn
        - PolicyName: KMSAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource: !GetAtt EncryptionKey.Arn

  ReceiveTriggerFunction:
    Type: AWS::Lambda::Function
    DependsOn: ReceiveTriggerLogGroup
    Properties:
      FunctionName: ReceiveTriggerFunction
      Handler: index.lambda_handler
      Role: !GetAtt TriggerLambdaRole.Arn
      ReservedConcurrentExecutions: 20
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          import datetime

          def update_status(dynamodb, call_id, status):
              table = dynamodb.Table(os.environ['DYNAMODB_TABLE'])
              table.put_item(
                  Item={
                      'callId': call_id,
                      'status': status,
                      'timestamp': str(datetime.datetime.now())
                  }
              )

          def lambda_handler(event, context):
              body = json.loads(event['body'])
              call_id = body.get('callId')

              if not call_id:
                  return {
                      'statusCode': 400,
                      'body': json.dumps({'error': 'callId is required'})
                  }

              dynamodb = boto3.resource('dynamodb')
              update_status(dynamodb, call_id, 'trigger_received')

              sfn = boto3.client('stepfunctions')
              response = sfn.start_execution(
                  stateMachineArn=os.environ['STATE_MACHINE_ARN'],
                  input=json.dumps({'callId': call_id})
              )

              return {
                  'statusCode': 200,
                  'body': json.dumps({
                      'message': 'Processing started',
                      'executionArn': response['executionArn']
                  })
              }
      Runtime: python3.9
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref CallProcessingStateMachine
          DYNAMODB_TABLE: !Ref StatusTable

  APIMethodPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ReceiveTriggerFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${CallProcessingAPI}/*/POST/process-call

  APIMethod:
    Type: AWS::ApiGateway::Method
    DependsOn: APIMethodPermission
    Properties:
      RestApiId: !Ref CallProcessingAPI
      ResourceId: !Ref APIResource
      HttpMethod: POST
      AuthorizationType: NONE
      ApiKeyRequired: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ReceiveTriggerFunction.Arn}/invocations

Outputs:
  ApiEndpoint:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${CallProcessingAPI}.execute-api.${AWS::Region}.amazonaws.com/prod"
  StateMachineArn:
    Description: "State Machine ARN"
    Value: !Ref CallProcessingStateMachine
  APIKey:
    Description: "API Key for authentication"
    Value: !Ref APIKey
  EncryptionKeyId:
    Description: "KMS Key ID for encryption"
    Value: !Ref EncryptionKey