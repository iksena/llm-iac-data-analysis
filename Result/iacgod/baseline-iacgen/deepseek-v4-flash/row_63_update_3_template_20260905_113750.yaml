AWSTemplateFormatVersion: "2010-09-09"
Description: "CloudFormation template for Step Functions state machine with two API Gateway REST APIs (GET and POST) that trigger state machine execution."
Parameters:
  StateMachineName:
    Type: String
    Default: "MyStateMachine"
    Description: "Name for the Step Functions state machine."
  GetApiName:
    Type: String
    Default: "GetApi"
    Description: "Name for the GET API."
  PostApiName:
    Type: String
    Default: "PostApi"
    Description: "Name for the POST API."
  StageName:
    Type: String
    Default: "prod"
    Description: "Stage name for both APIs."
Resources:
  StateMachineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/states/${StateMachineName}"
      RetentionInDays: 7
  StateMachineExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StateMachineLoggingPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutLogEvents
                  - logs:CreateLogStream
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                Resource: "*"
      RoleName: !Sub "${StateMachineName}-ExecutionRole"
  StateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Ref StateMachineName
      RoleArn: !GetAtt StateMachineExecutionRole.Arn
      DefinitionString: |-
        {
          "Comment": "A simple two-step pass workflow",
          "StartAt": "FirstStep",
          "States": {
            "FirstStep": {
              "Type": "Pass",
              "Result": "Step 1 completed",
              "Next": "SecondStep"
            },
            "SecondStep": {
              "Type": "Pass",
              "Result": "Step 2 completed",
              "End": true
            }
          }
        }
      LoggingConfiguration:
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt StateMachineLogGroup.Arn
        Level: "ALL"
      TracingConfiguration:
        Enabled: false
  GetApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StartExecutionPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !GetAtt StateMachine.Arn
      RoleName: !Sub "${GetApiName}-Role"
  PostApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StartExecutionPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !GetAtt StateMachine.Arn
      RoleName: !Sub "${PostApiName}-Role"
  GetApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Ref GetApiName
      Description: "REST API with GET endpoint to trigger Step Functions execution."
  PostApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Ref PostApiName
      Description: "REST API with POST endpoint to trigger Step Functions execution."
  GetApiResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref GetApi
      ParentId: !GetAtt GetApi.RootResourceId
      PathPart: "trigger"
  PostApiResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref PostApi
      ParentId: !GetAtt PostApi.RootResourceId
      PathPart: "trigger"
  GetApiMethod:
    Type: AWS::ApiGateway::Method
    DependsOn:
      - GetApiResource
    Properties:
      RestApiId: !Ref GetApi
      ResourceId: !Ref GetApiResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:states:action/StartExecution"
        Credentials: !GetAtt GetApiRole.Arn
        RequestTemplates:
          application/json: !Sub |
            {
              "input": "$util.escapeJavaScript($input.json('$'))",
              "stateMachineArn": "${StateMachine.Arn}"
            }
        IntegrationResponses:
          - StatusCode: 200
            ResponseTemplates:
              application/json: |
                {
                  "executionArn": "$input.path('$.executionArn')"
                }
      MethodResponses:
        - StatusCode: 200
  PostApiMethod:
    Type: AWS::ApiGateway::Method
    DependsOn:
      - PostApiResource
    Properties:
      RestApiId: !Ref PostApi
      ResourceId: !Ref PostApiResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:states:action/StartExecution"
        Credentials: !GetAtt PostApiRole.Arn
        RequestTemplates:
          application/json: !Sub |
            {
              "input": "$util.escapeJavaScript($input.json('$'))",
              "stateMachineArn": "${StateMachine.Arn}"
            }
        IntegrationResponses:
          - StatusCode: 200
            ResponseTemplates:
              application/json: |
                {
                  "executionArn": "$input.path('$.executionArn')"
                }
      MethodResponses:
        - StatusCode: 200
  GetApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - GetApiMethod
    Properties:
      RestApiId: !Ref GetApi
      Description: "Deployment for GET API"
  PostApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - PostApiMethod
    Properties:
      RestApiId: !Ref PostApi
      Description: "Deployment for POST API"
  GetApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref GetApi
      DeploymentId: !Ref GetApiDeployment
      StageName: !Ref StageName
      Description: "Stage for GET API"
  PostApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref PostApi
      DeploymentId: !Ref PostApiDeployment
      StageName: !Ref StageName
      Description: "Stage for POST API"
Outputs:
  StateMachineArn:
    Description: "ARN of the Step Functions state machine"
    Value: !GetAtt StateMachine.Arn
  GetApiEndpoint:
    Description: "URL of the GET API stage"
    Value: !Sub "https://${GetApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/trigger"
  PostApiEndpoint:
    Description: "URL of the POST API stage"
    Value: !Sub "https://${PostApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/trigger"