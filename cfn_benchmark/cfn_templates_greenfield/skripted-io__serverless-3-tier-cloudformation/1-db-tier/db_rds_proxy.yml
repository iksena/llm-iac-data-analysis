AWSTemplateFormatVersion: "2010-09-09"
Description: Deploys an RDS proxy for the Aurora cluster

Parameters:
  AppName:
    Type: String
    Default: shopify
  ProxyName:
    Type: String
    Default: aurora-cluster
  DBMasterUsername:
    Type: String
    Default: postgres
    Description: Master username for the Aurora PostgreSQL cluster

Resources:
  ProxyVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: "Application"
          Value: !Ref "AppName"
        - Key: "Name"
          Value: !Sub "${AppName}-vpc"

  DbPrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ProxyVpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: "Application"
          Value: !Ref "AppName"
        - Key: "Name"
          Value: !Sub "${AppName}-db-private-subnet-a"

  DbPrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ProxyVpc
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: "Application"
          Value: !Ref "AppName"
        - Key: "Name"
          Value: !Sub "${AppName}-db-private-subnet-b"

  DbSecurityGroup:
    Type: "AWS::EC2::SecurityGroup"
    Properties:
      VpcId: !Ref ProxyVpc
      GroupDescription: "Security group for the Aurora database"
      Tags:
        - Key: "Application"
          Value: !Ref "AppName"
        - Key: "Name"
          Value: !Sub "${AppName}-db-sg"

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "Subnet group for ${AppName} Aurora cluster"
      SubnetIds:
        - !Ref DbPrivateSubnetA
        - !Ref DbPrivateSubnetB
      Tags:
        - Key: "Application"
          Value: !Ref "AppName"

  DbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AppName}-db-secrets"
      Description: !Sub "Credentials for the ${AppName} Aurora PostgreSQL cluster"
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username":"${DBMasterUsername}"}'
        GenerateStringKey: password
        PasswordLength: 24
        ExcludeCharacters: '"@/\'

  AuroraCluster:
    Type: AWS::RDS::DBCluster
    Properties:
      Engine: aurora-postgresql
      MasterUsername: !Sub "{{resolve:secretsmanager:${DbSecret}:SecretString:username}}"
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DbSecret}:SecretString:password}}"
      DBSubnetGroupName: !Ref DbSubnetGroup
      VpcSecurityGroupIds:
        - !Ref DbSecurityGroup
      Tags:
        - Key: "Application"
          Value: !Ref "AppName"
        - Key: "Name"
          Value: !Sub "${AppName}-aurora-cluster"

  DbSecretTargetAttachment:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Properties:
      SecretId: !Ref DbSecret
      TargetId: !Ref AuroraCluster
      TargetType: AWS::RDS::DBCluster

  ProxySecretReaderRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: rds.amazonaws.com
            Action: sts:AssumeRole
      Description: "Role for RDS Proxy"
      ManagedPolicyArns:
        - !Ref DbSecretsManagerManagedPolicy
      Path: /
      RoleName: ProxyDbSecretsAccessRole

  DbSecretsManagerManagedPolicy:
    Type: "AWS::IAM::ManagedPolicy"
    Properties:
      Description: Allows access to secrets of db-tier
      ManagedPolicyName: DbSecretsManagerManagedPolicy
      Path: /
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - "secretsmanager:GetSecretValue"
            Resource: !Ref DbSecret

  AuroraProxySecurityGroup:
    Type: "AWS::EC2::SecurityGroup"
    Properties:
      VpcId: !Ref ProxyVpc
      GroupDescription: "Security group for the Aurora Proxy"
      Tags:
        - Key: "Application"
          Value: !Ref "AppName"
        - Key: "Name"
          Value:
            Fn::Sub: "${AppName}-aurora-proxy-sg"

  LambdaApiSecurityGroup:
    Type: "AWS::EC2::SecurityGroup"
    Properties:
      VpcId: !Ref ProxyVpc
      GroupDescription: "Security group for the lambda-api"
      Tags:
        - Key: "Application"
          Value: !Ref "AppName"
        - Key: "Name"
          Value:
            Fn::Sub: "${AppName}-lambda-api-sg"

  AuroraProxySecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AuroraProxySecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref LambdaApiSecurityGroup

  AuroraProxy:
    Type: AWS::RDS::DBProxy
    Properties:
      DebugLogging: true
      DBProxyName: !Ref ProxyName
      EngineFamily: POSTGRESQL
      IdleClientTimeout: 120
      RequireTLS: true
      RoleArn: !GetAtt ProxySecretReaderRole.Arn
      Auth:
        - AuthScheme: SECRETS
          SecretArn: !Ref DbSecret
          IAMAuth: REQUIRED
      VpcSubnetIds:
        - !Ref DbPrivateSubnetA
        - !Ref DbPrivateSubnetB
      VpcSecurityGroupIds:
        - !Ref AuroraProxySecurityGroup
        - !Ref DbSecurityGroup
      Tags:
        - Key: "Application"
          Value: !Ref "AppName"
        - Key: "Name"
          Value:
            Fn::Sub: "${AppName}-rds-proxy"

  AuroraProxyTargetGroup:
    Type: AWS::RDS::DBProxyTargetGroup
    Properties:
      DBProxyName: !Ref AuroraProxy
      DBClusterIdentifiers:
        - !Ref AuroraCluster
      TargetGroupName: default
      ConnectionPoolConfigurationInfo:
        MaxConnectionsPercent: 100
        MaxIdleConnectionsPercent: 50
        ConnectionBorrowTimeout: 120

Outputs:
  AuroraProxyEndpoint:
    Description: "End-point for the Aurora Proxy"
    Value: !GetAtt AuroraProxy.Endpoint
    Export:
      Name: !Sub "${AWS::Region}-${AppName}:aurora-proxy-endpoint"
  AuroraProxyArn:
    Description: "Arn for the Aurora Proxy"
    Value: !GetAtt AuroraProxy.DBProxyArn
    Export:
      Name: !Sub "${AWS::Region}-${AppName}:aurora-proxy-arn"
  AuroraProxySecurityGroup:
    Description: "Id of the aurora-proxy security group"
    Value:
      Ref: "AuroraProxySecurityGroup"
    Export:
      Name: !Sub "${AWS::Region}-${AppName}:aurora-proxy-sg"
  LambdaApiSecurityGroup:
    Description: "Id of the lambda-api security group"
    Value:
      Ref: "LambdaApiSecurityGroup"
    Export:
      Name: !Sub "${AWS::Region}-${AppName}:lambda-api-sg"
