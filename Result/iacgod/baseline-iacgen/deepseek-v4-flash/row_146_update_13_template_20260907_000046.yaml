AWSTemplateFormatVersion: "2010-09-09"
Description: "CloudFormation template for Cognito User Pool with API Gateway and Lambda"
Parameters:
  EnvironmentName:
    Type: String
    Default: prod
    Description: "Environment name for the deployment stage"
  PasswordMinLength:
    Type: Number
    Default: 8
    Description: "Minimum password length for the user pool"
Resources:
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-user-pool"
      AliasAttributes:
        - email
      AutoVerfiedAttributes:
        - email
      EmailVerificationSubject: "Your verification code from MyApp"
      EmailVerificationMessage: "Your verification code is {####}"
      Policies:
        PasswordPolicy:
          MinimumLength: !Ref PasswordMinLength
          RequireLowercase: true
          RequireUpper case: true
          RequireNumbers: true
          RequireSymbols: true
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
      UserNameConfiguration:
        CaseSensitive: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
  CognitoUserPoolClient:
    Type: AWS::Cognito::User Pool Client
    Properties:
      ClientName: !Sub "${AWS::StackName}-app-client"
      GenerateSecret: false
      UserPoolId: !Re f CognitoUserPool
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      SupportedIdentityProviders:
        - COGNITO
  lambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: lambdaExecutionPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLog Events
                Resource: "*"
  lambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-function"
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt lambdaExecutionRole.Arn
      Code:
        ZipFile: |
          import json

          def lambda_handler(event, context):
              http_method = event.get('httpMethod')
              resource = event.get('resource')

              if resource == '/me' and http_method == 'GET':
                  claims = event.get('requestContext', {}).get('authorizer', {}).get('claims', {})
                  response = {
                      'statusCode': 200,
                      'headers': {
                          'Content-Type': 'application/json',
                          'Access-Control-Allow-Origin': '*'
                      },
                      'body': json.dumps({
                          'message': 'This is a protected endpoint. You are authenticated.',
                          'claims': claims
                      })
                  }
              elif resource == '/open' and http_method == 'GET':
                  response = {
                      'statusCode': 200,
                      'headers': {
                          'Content-Type': 'application/json',
                          'Access-Control-Allow-Origin': '*'
                      },
                      'body': json.dumps({
                          'message': 'This is an open endpoint. No authentication required.',
                          'claims': 'none'
                      })
                  }
              else:
                  response = {
                      'statusCode': 404,
                      'headers': {
                          'Content-Type': 'application/json',
                          'Access-Control-Allow-Origin': '*'
                      },
                      'body': json.dumps({
                          'error': 'Resource not found'
                      })
                  }

              return response
  lambdaApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt lambdaFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGatewayRestApi}/*"
  ApiGatewayRestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "${AWS::StackName}-api"
      Description: "REST API secured by Cognito"
      EndpointConfiguration:
        Types:
          - REGIONAL
  ApiGatewayAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      AuthorizerResultTtlInSeconds: 300
      IdentitySource: method.request.header.Authorization
      Name: !Sub "${AWS::StackName}-CognitoAuthorizer"
      RestApiId: !Ref ApiGatewayRestApi
      Type: COGNITO
      ProviderARNs:
        - !GetAtt CognitoUserPool.Arn
  ApiGatewayResourceMe:
    Type: AWS::ApiGateway::Resource
    Properties:
      PathPart: me
      ParentId: !GetAtt ApiGatewayRestApi.RootResourceId
      RestApiId: !Ref ApiGatewayRestApi
  ApiGatewayMethodMeGet:
    Type: AWS::ApiGateway::Method
    Properties:
      AuthorizationType: COGNITO
      AuthorizerId: !Ref ApiGatewayAuthorizer
      HttpMethod: GET
      ResourceId: !Ref ApiGatewayResourceMe
      RestApiId: !Ref ApiGatewayRestApi
      Integration:
        IntegrationHttpMethod: POST
        Type: AWS_PROXY
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${lambdaFunction.Arn}/invocations"
      MethodResponses:
        - StatusCode: 200
          ResponseModels:
            application/json: Empty
  ApiGatewayResourceOpen:
    Type: AWS::ApiGateway::Resource
    Properties:
      PathPart: open
      ParentId: !GetAtt ApiGatewayRestApi.RootResourceId
      RestApiId: !Ref ApiGatewayRestApi
  ApiGatewayMethodOpenGet:
    Type: AWS::ApiGateway::Method
    Properties:
      AuthorizationType: NONE
      HttpMethod: GET
      ResourceId: !Ref ApiGatewayResourceOpen
      RestApiId: !Ref ApiGatewayRestApi
      Integration:
        IntegrationHttpMethod: POST
        Type: AWS_PROXY
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${lambdaFunction.Arn}/invocations"
      MethodResponses:
        - StatusCode: 200
          ResponseModels:
            application/json: Empty
  ApiGatewayDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - ApiGatewayMethodMeGet
      - ApiGatewayMethodOpenGet
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      Description: "Deployment for the API"
  ApiGatewayStageProd:
    Type: AWS::ApiGateway::Stage
    Properties:
      DeploymentId: !Ref ApiGatewayDeployment
      RestApiId: !Ref ApiGatewayRestApi
      StageName: !Ref EnvironmentName
      Description: "Prod stage"
      MethodSettings:
        - DataTraceEnabled: false
          HttpMethod: "*"
          LoggingLevel: INFO
          ResourcePath: "/*"
          MetricsEnabled: true
Outputs:
  UserPoolId:
    Description: "Cognito User Pool ID"
    Value: !Ref CognitoUserPool
    Export:
      Name: !Sub "${AWS::StackName}-UserPoolId"
  UserPoolClientId:
    Description: "Cognito User Pool Client ID"
    Value: !Ref CognitoUserPoolClient
    Export:
      Name: !Sub "${AWS::StackName}-UserPoolClientId"
  ApiEndpoint:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}"
    Export:
      Name: !Sub "${AWS::StackName}-ApiEndpoint"
  LambdaFunctionArn:
    Description: "Lambda Function ARN"
    Value: !GetAtt lambdaFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-LambdaFunctionArn"