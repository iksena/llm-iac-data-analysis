AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: OvalEdge MCP Server — Remote MCP (Lambda ZIP package; same stack as template.yaml without container image)

Parameters:
  AuthMode:
    Type: String
    Default: remote_credentials
    AllowedValues:
      - remote
      - remote_credentials
    Description: >
      remote = OAuth/OIDC Bearer per request; remote_credentials = X-OvalEdge-Credentials or Token + Secret headers.
  OvalEdgeBaseUrl:
    Type: String
  OvalEdgeTokenExchangePath:
    Type: String
    Default: /api/user/token/generate
  OvalEdgeMaxRetries:
    Type: String
    Default: "3"
    AllowedPattern: "^[0-9]+$"
    Description: Max retries for outbound OvalEdge HTTP (integer as string for SAM schema compatibility).
  OAuthIssuer:
    Type: String
    Default: ""
    Description: >
      (AUTH_MODE=remote) Authorization Server issuer URL (must match JWT iss). Discovery loads
      /.well-known/openid-configuration or oauth-authorization-server under this base.
  OAuthAllowedIssuers:
    Type: String
    Default: ""
    Description: >
      Comma-separated additional trusted JWT iss values (e.g. Auth0 custom domain and *.auth0.com).
  OAuthAudience:
    Type: String
    Default: ""
    Description: (AUTH_MODE=remote) Resource identifier expected as JWT aud claim (optional for opaque)
  OAuthClientId:
    Type: String
    Default: ""
    Description: (AUTH_MODE=remote) Pre-registered Okta/OIDC app client_id returned by POST /register
  OAuthClientSecret:
    Type: String
    Default: ""
    NoEcho: true
    Description: (AUTH_MODE=remote) Client secret for token introspection (and confidential clients)
  OAuthIntrospectionUrl:
    Type: String
    Default: ""
    Description: >
      (AUTH_MODE=remote) RFC 7662 introspect URL. Empty uses {OAuthIssuer}/v1/introspect.
  OAuthScopes:
    Type: String
    Default: "openid profile email"
    Description: (AUTH_MODE=remote) Scopes advertised in discovery / registration
  OvalEdgeForwardIdpToken:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      If true (default), skip OvalEdge token/generate and forward the IdP access token to OvalEdge APIs.
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  McpHttpStateless:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      Streamable HTTP stateless mode (default true for Lambda). Set false only if your MCP client
      requires GET /mcp (SSE); adds session state in the worker.
  McpServerVersion:
    Type: String
    Default: ""
    Description: >
      MCP product version for /health and initialize. deploy.sh sets from pyproject.toml; leave
      empty to resolve from pyproject.toml at runtime when staged in the Lambda package.
  LambdaArchitecture:
    Type: String
    Default: x86_64
    AllowedValues:
      - x86_64
      - arm64
    Description: >
      Lambda CPU architecture. For ZIP builds, SAM installs manylinux wheels matching this arch.
      Use arm64 on Graviton; build on arm64 or with --use-container so pip targets Linux.
  OvalEdgeHttpAuthScheme:
    Type: String
    Default: jwt
    Description: >
      Outbound OvalEdge API Authorization scheme (e.g. jwt, Bearer). Must match what
      /api/v1/mcp/** expects after token exchange.
  CredentialsCacheMaxEntries:
    Type: String
    Default: "10000"
    AllowedPattern: "^[0-9]+$"
    Description: >
      AUTH_MODE=remote_credentials only — max distinct credential-key JWT entries per Lambda
      instance (in-memory LRU).
  LambdaMemorySize:
    Type: String
    Default: "1024"
    AllowedPattern: "^[0-9]+$"
    Description: >
      Lambda memory (MB), 512–10240. Higher values add CPU and help large tool responses
      (lineage, docs search). HTTP API integration timeout remains 30s max.
  LambdaTimeout:
    Type: String
    Default: "30"
    AllowedPattern: "^[0-9]+$"
    Description: >
      Lambda timeout (seconds), 10–30. API Gateway HTTP API caps integration at 30s; values
      above 30 have no effect on /mcp until a longer-timeout front end is used.
  EnableWaf:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      Attach regional AWS WAF IP allowlist to the HTTP API stage (default action block).
  AllowedSourceCidrs:
    Type: String
    Default: "127.0.0.1/32"
    Description: >
      Comma-separated IPv4 CIDR blocks allowed when EnableWaf=true. Ignored when WAF is disabled.
  TelemetryBackend:
    Type: String
    Default: none
    AllowedValues:
      - none
      - phoenix
      - langfuse
    Description: >
      OpenTelemetry OTLP export backend. none = disabled (default). phoenix | langfuse = export traces.
  TelemetryServiceName:
    Type: String
    Default: oe-mcp
    Description: OTLP service.name resource attribute.
  TelemetryProjectName:
    Type: String
    Default: ""
    Description: >
      OTLP project name (Phoenix x-project-name; openinference.project.name). Empty = TelemetryServiceName.
  PhoenixHost:
    Type: String
    Default: ""
    Description: Phoenix base URL when TelemetryBackend=phoenix (e.g. https://phoenix.example.com).
  PhoenixApiKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: Optional Bearer token when Phoenix auth is enabled.
  LangfuseHost:
    Type: String
    Default: ""
    Description: Langfuse base URL when TelemetryBackend=langfuse (e.g. https://langfuse.example.com).
  LangfusePublicKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: Langfuse public key (pk-lf-...) when TelemetryBackend=langfuse.
  LangfuseSecretKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: Langfuse secret key (sk-lf-...) when TelemetryBackend=langfuse.
  TelemetryOtlpEndpoint:
    Type: String
    Default: ""
    Description: Optional full OTLP traces URL override (any backend).
  TelemetryApiKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: Optional Bearer token when using TelemetryOtlpEndpoint.

Conditions:
  CreateWaf:
    Fn::Equals:
      - !Ref EnableWaf
      - "true"

Globals:
  Function:
    Timeout: !Ref LambdaTimeout
    MemorySize: !Ref LambdaMemorySize
    Architectures:
      - !Ref LambdaArchitecture

Resources:
  OEMCPFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: python3.12
      BuildProperties:
        # Pip reads requirements.txt at CodeUri; deploy.sh stages a minimal tree for --zip.
        # false = native pip (no Docker). Use SAM_USE_CONTAINER=true if wheels must match Amazon Linux.
        UseContainer: false
    Properties:
      # Physical name = stack + env (+ -lambda) so ZIP and container stacks can coexist.
      # Example: STACK_NAME=oe-mcp-zip ENVIRONMENT=dev → oe-mcp-zip-dev-lambda
      FunctionName: !Sub "${AWS::StackName}-${Environment}-lambda"
      Handler: entrypoints.lambda_handler.handler
      Runtime: python3.12
      CodeUri: ../
      Tags:
        Application: oe-mcp
        Component: mcp-server
        ManagedBy: SAM
      Environment:
        Variables:
          AUTH_MODE: !Ref AuthMode
          OVALEDGE_BASE_URL: !Ref OvalEdgeBaseUrl
          OVALEDGE_TOKEN_EXCHANGE_PATH: !Ref OvalEdgeTokenExchangePath
          OVALEDGE_MAX_RETRIES: !Ref OvalEdgeMaxRetries
          OAUTH_ISSUER: !Ref OAuthIssuer
          OAUTH_ALLOWED_ISSUERS: !Ref OAuthAllowedIssuers
          OAUTH_AUDIENCE: !Ref OAuthAudience
          OAUTH_CLIENT_ID: !Ref OAuthClientId
          OAUTH_CLIENT_SECRET: !Ref OAuthClientSecret
          OAUTH_INTROSPECTION_URL: !Ref OAuthIntrospectionUrl
          OAUTH_SCOPES: !Ref OAuthScopes
          OVALEDGE_REMOTE_FORWARD_IDP_TOKEN: !Ref OvalEdgeForwardIdpToken
          OVALEDGE_HTTP_AUTH_SCHEME: !Ref OvalEdgeHttpAuthScheme
          CREDENTIALS_CACHE_MAX_ENTRIES: !Ref CredentialsCacheMaxEntries
          MCP_HTTP_STATELESS: !Ref McpHttpStateless
          MCP_SERVER_VERSION: !Ref McpServerVersion
          TELEMETRY_BACKEND: !Ref TelemetryBackend
          TELEMETRY_SERVICE_NAME: !Ref TelemetryServiceName
          TELEMETRY_PROJECT_NAME: !Ref TelemetryProjectName
          PHOENIX_HOST: !Ref PhoenixHost
          PHOENIX_API_KEY: !Ref PhoenixApiKey
          LANGFUSE_HOST: !Ref LangfuseHost
          LANGFUSE_PUBLIC_KEY: !Ref LangfusePublicKey
          LANGFUSE_SECRET_KEY: !Ref LangfuseSecretKey
          TELEMETRY_OTLP_ENDPOINT: !Ref TelemetryOtlpEndpoint
          TELEMETRY_API_KEY: !Ref TelemetryApiKey
      Events:
        MCPPost:
          Type: HttpApi
          Properties:
            Path: /mcp
            Method: POST
            ApiId: !Ref MCPApi
        MCPGet:
          Type: HttpApi
          Properties:
            Path: /mcp
            Method: GET
            ApiId: !Ref MCPApi
        OAuthDiscovery:
          Type: HttpApi
          Properties:
            Path: /.well-known/oauth-authorization-server
            Method: GET
            ApiId: !Ref MCPApi
        OIDCDiscovery:
          Type: HttpApi
          Properties:
            Path: /.well-known/openid-configuration
            Method: GET
            ApiId: !Ref MCPApi
        OAuthProtectedResource:
          Type: HttpApi
          Properties:
            Path: /.well-known/oauth-protected-resource
            Method: GET
            ApiId: !Ref MCPApi
        OAuthProtectedResourceMcp:
          Type: HttpApi
          Properties:
            Path: /.well-known/oauth-protected-resource/mcp
            Method: GET
            ApiId: !Ref MCPApi
        McpAuthDeclinedGet:
          Type: HttpApi
          Properties:
            Path: /mcp-auth/declined
            Method: GET
            ApiId: !Ref MCPApi
        McpAuthDeclinedPost:
          Type: HttpApi
          Properties:
            Path: /mcp-auth/declined
            Method: POST
            ApiId: !Ref MCPApi
        McpAuthDeclinedOptions:
          Type: HttpApi
          Properties:
            Path: /mcp-auth/declined
            Method: OPTIONS
            ApiId: !Ref MCPApi
        ClientRegistration:
          Type: HttpApi
          Properties:
            Path: /register
            Method: POST
            ApiId: !Ref MCPApi
        HealthCheck:
          Type: HttpApi
          Properties:
            Path: /health
            Method: GET
            ApiId: !Ref MCPApi
        BrandIcon:
          Type: HttpApi
          Properties:
            Path: /brand/ovaledge-mcp-icon.png
            Method: GET
            ApiId: !Ref MCPApi

  MCPApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Name: !Sub "${AWS::StackName}-${Environment}-httpapi"
      StageName: $default
      DefaultRouteSettings:
        ThrottlingBurstLimit: 200
        ThrottlingRateLimit: 100
      CorsConfiguration:
        AllowOrigins:
          - "https://claude.ai"
          - "https://cursor.sh"
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
          - X-OvalEdge-Credentials
          - X-OvalEdge-Token
          - X-OvalEdge-Secret
      RouteSettings:
        "POST /mcp":
          ThrottlingBurstLimit: 100
          ThrottlingRateLimit: 50
        "POST /register":
          ThrottlingBurstLimit: 10
          ThrottlingRateLimit: 5

  AllowedSourceIpSet:
    Type: AWS::WAFv2::IPSet
    Condition: CreateWaf
    Properties:
      Name: !Sub ${AWS::StackName}-${Environment}-allowed-ipv4
      Description: !Sub IPv4 allowlist for ${AWS::StackName} MCP HTTP API
      Scope: REGIONAL
      IPAddressVersion: IPV4
      Addresses: !Split [",", !Ref AllowedSourceCidrs]

  MCPWebACL:
    Type: AWS::WAFv2::WebACL
    Condition: CreateWaf
    Properties:
      Name: !Sub ${AWS::StackName}-${Environment}-webacl
      Description: !Sub IP allowlist Web ACL for ${AWS::StackName} MCP HTTP API
      Scope: REGIONAL
      DefaultAction:
        Block: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub ${AWS::StackName}-${Environment}-webacl
      Rules:
        - Name: AllowListedSourceIpv4
          Priority: 0
          Statement:
            IPSetReferenceStatement:
              Arn: !GetAtt AllowedSourceIpSet.Arn
          Action:
            Allow: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: AllowListedSourceIpv4

  MCPWebACLAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Condition: CreateWaf
    Properties:
      ResourceArn: !Sub "arn:aws:apigateway:${AWS::Region}::/apis/${MCPApi}/stages/$default"
      WebACLArn: !GetAtt MCPWebACL.Arn

Outputs:
  MCPEndpointUrl:
    Description: Remote MCP endpoint
    Value: !Sub
      - "https://${ApiId}.execute-api.${AWS::Region}.amazonaws.com/mcp"
      - ApiId: !Ref MCPApi
  OAuthDiscoveryUrl:
    Description: OAuth discovery endpoint
    Value: !Sub
      - "https://${ApiId}.execute-api.${AWS::Region}.amazonaws.com/.well-known/oauth-authorization-server"
      - ApiId: !Ref MCPApi
  HealthUrl:
    Description: Health check endpoint
    Value: !Sub
      - "https://${ApiId}.execute-api.${AWS::Region}.amazonaws.com/health"
      - ApiId: !Ref MCPApi
  MCPPublicBaseUrl:
    Description: >-
      Set as Lambda env MCP_PUBLIC_BASE_URL (no path suffix) so MCP initialize
      advertises the branding icon URL. Not injected automatically (CFN circular dep).
    Value: !Sub
      - "https://${ApiId}.execute-api.${AWS::Region}.amazonaws.com"
      - ApiId: !Ref MCPApi
  MCPBrandIconUrl:
    Description: Public MCP server icon (GET, no auth)
    Value: !Sub
      - "https://${ApiId}.execute-api.${AWS::Region}.amazonaws.com/brand/ovaledge-mcp-icon.png"
      - ApiId: !Ref MCPApi
  WAFWebAclArn:
    Condition: CreateWaf
    Description: Regional WAF Web ACL attached to the HTTP API $default stage
    Value: !GetAtt MCPWebACL.Arn
  WAFAllowedSourceCidrs:
    Condition: CreateWaf
    Description: IPv4 CIDR allowlist enforced by WAF
    Value: !Ref AllowedSourceCidrs