AWSTemplateFormatVersion: '2010-09-09'
Description: 'MCP Registry - RDS PostgreSQL Database'

Parameters:
  EnvironmentName:
    Type: String
    Description: Environment name for resource naming
    Default: mcp-registry

  DeployMode:
    Type: String
    AllowedValues:
      - lab
      - ha
    Default: lab
    Description: Deployment mode - lab (cost-optimized) or ha (high availability)

  DatabaseSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: List of database subnet IDs

  RDSSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group ID for RDS

  DatabaseName:
    Type: String
    Default: mcpregistry
    Description: Name of the database to create

  DatabaseUsername:
    Type: String
    Default: mcpadmin
    Description: Master username for the database
    NoEcho: true

  DatabasePassword:
    Type: String
    Description: Master password for the database
    NoEcho: true
    MinLength: 16
    MaxLength: 128
    ConstraintDescription: Must be at least 16 characters

Conditions:
  IsHA: !Equals [!Ref DeployMode, 'ha']

Resources:
  # DB Subnet Group
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupName: !Sub '${EnvironmentName}-db-subnet-group'
      DBSubnetGroupDescription: Subnet group for MCP Registry PostgreSQL
      SubnetIds: !Ref DatabaseSubnetIds
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-db-subnet-group'

  # DB Parameter Group
  DBParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Family: postgres17
      Description: !Sub 'Parameter group for ${EnvironmentName}'
      Parameters:
        log_statement: all
        log_min_duration_statement: '1000'
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-db-params'

  # RDS PostgreSQL Instance
  PostgreSQLInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub '${EnvironmentName}-postgres'
      DBInstanceClass: !If [IsHA, 'db.m6g.large', 'db.t4g.micro']
      Engine: postgres
      EngineVersion: '17.7'
      AllocatedStorage: !If [IsHA, 50, 20]
      MaxAllocatedStorage: !If [IsHA, 200, 50]
      StorageType: gp3
      StorageEncrypted: true
      DBName: !Ref DatabaseName
      MasterUsername: !Ref DatabaseUsername
      MasterUserPassword: !Ref DatabasePassword
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref RDSSecurityGroupId
      DBParameterGroupName: !Ref DBParameterGroup
      MultiAZ: !If [IsHA, true, false]
      PubliclyAccessible: false
      BackupRetentionPeriod: !If [IsHA, 14, 7]
      PreferredBackupWindow: '03:00-04:00'
      PreferredMaintenanceWindow: 'sun:04:00-sun:05:00'
      AutoMinorVersionUpgrade: true
      DeletionProtection: !If [IsHA, true, false]
      EnablePerformanceInsights: !If [IsHA, true, false]
      PerformanceInsightsRetentionPeriod: !If [IsHA, 7, !Ref 'AWS::NoValue']
      CopyTagsToSnapshot: true
      EnableCloudwatchLogsExports:
        - postgresql
        - upgrade
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-postgres'
        - Key: Environment
          Value: !Ref DeployMode

Outputs:
  DBEndpoint:
    Description: Database endpoint address
    Value: !GetAtt PostgreSQLInstance.Endpoint.Address
    Export:
      Name: !Sub '${EnvironmentName}-DBEndpoint'

  DBPort:
    Description: Database port
    Value: !GetAtt PostgreSQLInstance.Endpoint.Port
    Export:
      Name: !Sub '${EnvironmentName}-DBPort'

  DBName:
    Description: Database name
    Value: !Ref DatabaseName
    Export:
      Name: !Sub '${EnvironmentName}-DBName'

  DBUsername:
    Description: Database master username
    Value: !Ref DatabaseUsername
    Export:
      Name: !Sub '${EnvironmentName}-DBUsername'

  DatabaseConnectionString:
    Description: PostgreSQL connection string (without password)
    Value: !Sub 'postgresql://${DatabaseUsername}@${PostgreSQLInstance.Endpoint.Address}:${PostgreSQLInstance.Endpoint.Port}/${DatabaseName}'
    Export:
      Name: !Sub '${EnvironmentName}-DatabaseConnectionString'

  DBInstanceArn:
    Description: RDS instance ARN
    Value: !Sub 'arn:aws:rds:${AWS::Region}:${AWS::AccountId}:db:${PostgreSQLInstance}'
    Export:
      Name: !Sub '${EnvironmentName}-DBInstanceArn'