AWSTemplateFormatVersion: '2010-09-09'
Description: 'Lab 24: Reserved Instances and Savings Plans Analysis Infrastructure'

Parameters:
  EnvironmentName:
    Type: String
    Default: Lab24
    Description: Environment name prefix

Resources:
  # S3 Bucket for Cost and Usage Reports
  CURBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${EnvironmentName}-cur-reports-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Name
          Value: CUR-Reports-Bucket
        - Key: Lab
          Value: Lab24

  # Lambda for RI/SP Recommendations
  RecommendationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${EnvironmentName}-RI-SP-Recommendations
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 300
      Code:
        ZipFile: |
          import json
          import boto3
          from datetime import datetime, timedelta

          ce_client = boto3.client('ce', region_name='us-east-1')

          def lambda_handler(event, context):
              end_date = datetime.now().date()
              start_date = end_date - timedelta(days=30)

              # Get RI recommendations
              ri_recs = ce_client.get_reservation_purchase_recommendation(
                  Service='Amazon Elastic Compute Cloud - Compute',
                  LookbackPeriodInDays='THIRTY_DAYS',
                  TermInYears='THREE_YEARS',
                  PaymentOption='NO_UPFRONT'
              )

              # Get Savings Plans recommendations
              sp_recs = ce_client.get_savings_plans_purchase_recommendation(
                  SavingsPlanType='COMPUTE_SP',
                  LookbackPeriodInDays='THIRTY_DAYS',
                  TermInYears='THREE_YEARS',
                  PaymentOption='NO_UPFRONT'
              )

              return {
                  'statusCode': 200,
                  'body': json.dumps({
                      'ri_recommendations': ri_recs,
                      'sp_recommendations': sp_recs
                  })
              }
      Tags:
        - Key: Name
          Value: RI-SP-Recommendations
        - Key: Lab
          Value: Lab24

  # IAM Role for Lambda
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${EnvironmentName}-Lambda-Role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CostExplorerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ce:GetReservationPurchaseRecommendation
                  - ce:GetSavingsPlansPurchaseRecommendation
                  - ce:GetReservationUtilization
                  - ce:GetReservationCoverage
                  - ce:GetSavingsPlansUtilization
                  - ce:GetSavingsPlansCoverage
                Resource: '*'

Outputs:
  CURBucketName:
    Value: !Ref CURBucket
    Description: Bucket for Cost and Usage Reports

  RecommendationFunctionArn:
    Value: !GetAtt RecommendationFunction.Arn
    Description: Lambda function for RI/SP recommendations

  NextSteps:
    Value: |
      1. Set up Cost and Usage Report in Billing console
      2. Run Lambda function to get recommendations
      3. Analyze RI vs SP options for your workload
      4. Review utilization and coverage reports
      5. Purchase RIs or commit to Savings Plans based on analysis