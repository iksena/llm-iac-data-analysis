AWSTemplateFormatVersion: '2010-09-09'
Description: 'MergeBetter Bot - GitHub merge conflict detection service'

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID for the ECS cluster

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnet IDs for the ECS service (recommend private subnets)

  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Public subnet IDs for the Application Load Balancer

  GitHubToken:
    Type: String
    NoEcho: true
    Default: 'not-used-in-saas-mode'
    Description: GitHub Personal Access Token (not used in SaaS mode)

  GitHubWebhookSecret:
    Type: String
    NoEcho: true
    Description: GitHub Webhook Secret

  GitHubAppId:
    Type: String
    Description: GitHub App ID

  GitHubAppPrivateKey:
    Type: String
    NoEcho: true
    Description: GitHub App Private Key (PEM format)

  StripeSecretKey:
    Type: String
    NoEcho: true
    Default: ''
    Description: Stripe Secret Key for billing (optional)

  StripeWebhookSecret:
    Type: String
    NoEcho: true
    Default: ''
    Description: Stripe Webhook Secret (optional)

  GitHubClientId:
    Type: String
    Default: ''
    Description: GitHub OAuth Client ID for customer dashboard (optional)

  GitHubClientSecret:
    Type: String
    NoEcho: true
    Default: ''
    Description: GitHub OAuth Client Secret for customer dashboard (optional)

  GitHubClientSecretArn:
    Type: String
    Default: ''
    Description: Optional ARN of an existing Secrets Manager secret containing the GitHub OAuth Client Secret

  JWTSecret:
    Type: String
    NoEcho: true
    Default: 'default-jwt-secret-change-in-production'
    Description: JWT secret for session management

  FrontendURL:
    Type: String
    Default: 'https://mergebetter.com'
    Description: Frontend URL for OAuth redirects

  Environment:
    Type: String
    Default: 'prod'
    AllowedValues: ['dev', 'staging', 'prod']
    Description: Environment name

  ECSServiceName:
    Type: String
    Default: 'mergebetter-service-cd'
    Description: Name of the existing ECS service to target (use mergebetter-service-cd for CodeDeploy-managed service)

  CreateECSService:
    Type: String
    Default: 'false'
    AllowedValues: ['true','false']
    Description: Whether this stack should create/manage the ECS Service resource

  DomainName:
    Type: String
    Default: ''
    Description: Optional domain name for the service

  CertificateArn:
    Type: String
    Default: ''
    Description: Optional SSL certificate ARN for HTTPS

Resources:
  # DynamoDB Tables - Reference existing stack

  # Idempotency table for Stripe (and other) webhook deduplication
  IdempotencyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'mergebetter-idempotency-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # Secrets Manager for sensitive data
  GitHubTokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: mergebetter/github-token
      Description: GitHub token for MergeBetter bot
      SecretString: !Ref GitHubToken

  GitHubWebhookSecretResource:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: mergebetter/webhook-secret
      Description: GitHub webhook secret for MergeBetter bot
      SecretString: !Ref GitHubWebhookSecret

  GitHubAppPrivateKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: mergebetter/github-app-private-key
      Description: GitHub App private key for MergeBetter
      SecretString: !Ref GitHubAppPrivateKey

  GitHubClientSecretSecret:
    Type: AWS::SecretsManager::Secret
    Condition: UseOAuthProvided
    Properties:
      Name: mergebetter/github-oauth-client-secret
      Description: GitHub OAuth client secret for customer dashboard
      SecretString: !Ref GitHubClientSecret

  StripeSecretKeySecret:
    Type: AWS::SecretsManager::Secret
    Condition: HasStripeConfig
    Properties:
      Name: mergebetter/stripe-secret-key
      Description: Stripe secret key for billing
      SecretString: !Ref StripeSecretKey

  StripeWebhookSecretSecret:
    Type: AWS::SecretsManager::Secret
    Condition: HasStripeConfig
    Properties:
      Name: mergebetter/stripe-webhook-secret
      Description: Stripe webhook secret for billing
      SecretString: !Ref StripeWebhookSecret

  # ECS Cluster
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: mergebetter-cluster
      CapacityProviders:
        - FARGATE
        - FARGATE_SPOT

  # CloudWatch Log Group
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/mergebetter
      RetentionInDays: 14

  # Security Group for ECS tasks
  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for MergeBetter ECS tasks
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref ALBSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS outbound for AWS services (Secrets Manager, ECR, etc)

  # Security Group for ALB
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for MergeBetter ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

  # Application Load Balancer
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: mergebetter-alb
      Type: application
      Scheme: internet-facing
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Subnets: !Ref PublicSubnetIds

  # Target Group
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: mergebetter-targets
      Port: 3000
      Protocol: HTTP
      VpcId: !Ref VpcId
      TargetType: ip
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  # ALB Listener
  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP

  # HTTPS Listener (conditional)
  HTTPSListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn

  # IAM Role for ECS Task Execution
  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: mergebetter-ecs-execution-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref GitHubTokenSecret
                  - !Ref GitHubWebhookSecretResource
                  - !Ref GitHubAppPrivateKeySecret
                  - !If [HasStripeConfig, !Ref StripeSecretKeySecret, !Ref 'AWS::NoValue']
                  - !If [HasStripeConfig, !Ref StripeWebhookSecretSecret, !Ref 'AWS::NoValue']
              - !If
                - UseOAuthProvided
                - Effect: Allow
                  Action:
                    - secretsmanager:GetSecretValue
                  Resource: !GetAtt GitHubClientSecretSecret.Arn
                - !Ref 'AWS::NoValue'
              - !If
                - HasOAuthSecretArn
                - Effect: Allow
                  Action:
                    - secretsmanager:GetSecretValue
                  Resource: !Ref GitHubClientSecretArn
                - !Ref 'AWS::NoValue'
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !ImportValue mergebetter-saas-database-InstallationsTableArn
                  - !Sub
                    - '${TableArn}/index/*'
                    - TableArn: !ImportValue mergebetter-saas-database-InstallationsTableArn
                  - !GetAtt IdempotencyTable.Arn

  # IAM Role for ECS Tasks
  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: mergebetter-ecs-task-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt LogGroup.Arn
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !ImportValue mergebetter-saas-database-InstallationsTableArn
                  - !Sub
                    - 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${UsageAnalyticsTable}'
                    - UsageAnalyticsTable: !ImportValue mergebetter-saas-database-UsageAnalyticsTable
                  - !Sub
                    - 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${WebhookEventsTable}'
                    - WebhookEventsTable: !ImportValue mergebetter-saas-database-WebhookEventsTable
                  - !Sub
                    - '${TableArn}/index/*'
                    - TableArn: !ImportValue mergebetter-saas-database-InstallationsTableArn
                  - !Sub
                    - 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${UsageAnalyticsTable}/index/*'
                    - UsageAnalyticsTable: !ImportValue mergebetter-saas-database-UsageAnalyticsTable
                  - !Sub
                    - 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${WebhookEventsTable}/index/*'
                    - WebhookEventsTable: !ImportValue mergebetter-saas-database-WebhookEventsTable
                  - !GetAtt IdempotencyTable.Arn

  # ECS Task Definition
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: mergebetter-bot
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: 512
      Memory: 1024
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      ContainerDefinitions:
        - Name: mergebetter
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/mergebetter:latest'
          Essential: true
          PortMappings:
            - ContainerPort: 3000
              Protocol: tcp
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: PORT
              Value: '3000'
            - Name: SAAS_MODE
              Value: 'true'
            - Name: PR_STALENESS_MODE
              Value: non-stale
            - Name: PR_STALE_DAYS
              Value: '30'
            - Name: LOG_LEVEL
              Value: info
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: INSTALLATIONS_TABLE
              Value: !ImportValue mergebetter-saas-database-InstallationsTable
            - Name: USAGE_ANALYTICS_TABLE
              Value: !ImportValue mergebetter-saas-database-UsageAnalyticsTable
            - Name: WEBHOOK_EVENTS_TABLE
              Value: !ImportValue mergebetter-saas-database-WebhookEventsTable
            - Name: IDEMPOTENCY_TABLE
              Value: !Ref IdempotencyTable
            - Name: GITHUB_APP_ID
              Value: !Ref GitHubAppId
            - Name: GITHUB_CLIENT_ID
              Value: !Ref GitHubClientId
            - Name: JWT_SECRET
              Value: !Ref JWTSecret
            - Name: FRONTEND_URL
              Value: !Ref FrontendURL
          Secrets:
            - Name: GITHUB_TOKEN
              ValueFrom: !Ref GitHubTokenSecret
            - Name: GITHUB_WEBHOOK_SECRET
              ValueFrom: !Ref GitHubWebhookSecretResource
            - Name: GITHUB_APP_PRIVATE_KEY
              ValueFrom: !Ref GitHubAppPrivateKeySecret
            - !If
              - UseOAuthProvided
              - Name: GITHUB_CLIENT_SECRET
                ValueFrom: !GetAtt GitHubClientSecretSecret.Arn
              - !Ref 'AWS::NoValue'
            - !If
              - HasOAuthSecretArn
              - Name: GITHUB_CLIENT_SECRET
                ValueFrom: !Ref GitHubClientSecretArn
              - !Ref 'AWS::NoValue'
            - !If
              - HasStripeConfig
              - Name: STRIPE_SECRET_KEY
                ValueFrom: !Ref StripeSecretKeySecret
              - !Ref 'AWS::NoValue'
            - !If
              - HasStripeConfig
              - Name: STRIPE_WEBHOOK_SECRET
                ValueFrom: !Ref StripeWebhookSecretSecret
              - !Ref 'AWS::NoValue'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          HealthCheck:
            Command:
              - CMD-SHELL
              - 'wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1'
            Interval: 30
            Timeout: 10
            Retries: 5
            StartPeriod: 120

  # ECS Service
  ECSService:
    Condition: CreateService
    Type: AWS::ECS::Service
    DependsOn: ALBListener
    Properties:
      ServiceName: !Ref ECSServiceName
      Cluster: !Ref ECSCluster
      LaunchType: FARGATE
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 1
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref ECSSecurityGroup
          Subnets: !Ref SubnetIds
      LoadBalancers:
        - ContainerName: mergebetter
          ContainerPort: 3000
          TargetGroupArn: !Ref TargetGroup

  # Auto Scaling Target
  AutoScalingTarget:
    Condition: CreateService
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: 10
      MinCapacity: 1
      ResourceId: !Sub service/${ECSCluster}/${ECSServiceName}
      RoleARN: !Sub arn:aws:iam::${AWS::AccountId}:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs

  # CPU-based Auto Scaling Policy
  CPUScalingPolicy:
    Condition: CreateService
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: mergebetter-cpu-scaling-policy
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref AutoScalingTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 70.0
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        ScaleOutCooldown: 300
        ScaleInCooldown: 300

  # Memory-based Auto Scaling Policy
  MemoryScalingPolicy:
    Condition: CreateService
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: mergebetter-memory-scaling-policy
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref AutoScalingTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 80.0
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageMemoryUtilization
        ScaleOutCooldown: 300
        ScaleInCooldown: 300

  # Request-based Auto Scaling Policy
  RequestScalingPolicy:
    Condition: CreateService
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: mergebetter-request-scaling-policy
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref AutoScalingTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 1000.0
        PredefinedMetricSpecification:
          PredefinedMetricType: ALBRequestCountPerTarget
          ResourceLabel: !Sub ${ApplicationLoadBalancer.LoadBalancerFullName}/${TargetGroup.TargetGroupFullName}
        ScaleOutCooldown: 300
        ScaleInCooldown: 600

Conditions:
  HasCertificate: !Not [!Equals [!Ref CertificateArn, '']]
  HasDomain: !Not [!Equals [!Ref DomainName, '']]
  HasStripeConfig: !Not [!Equals [!Ref StripeSecretKey, '']]
  HasOAuthConfigProvided: !Not [!Equals [!Ref GitHubClientSecret, '']]
  HasOAuthSecretArn: !Not [!Equals [!Ref GitHubClientSecretArn, '']]
  HasOAuthConfig:
    Fn::Or:
      - Condition: HasOAuthConfigProvided
      - Condition: HasOAuthSecretArn
  UseOAuthProvided:
    Fn::And:
      - Condition: HasOAuthConfigProvided
      - Fn::Not:
          - Condition: HasOAuthSecretArn
  CreateService: !Equals [!Ref CreateECSService, 'true']

Outputs:
  LoadBalancerURL:
    Description: URL of the Application Load Balancer
    Value: !Sub 'http://${ApplicationLoadBalancer.DNSName}'

  HTTPSLoadBalancerURL:
    Condition: HasCertificate
    Description: HTTPS URL of the Application Load Balancer
    Value: !Sub 'https://${ApplicationLoadBalancer.DNSName}'

  WebhookEndpoint:
    Description: GitHub webhook endpoint
    Value: !Sub 'http://${ApplicationLoadBalancer.DNSName}/webhook'

  HTTPSWebhookEndpoint:
    Condition: HasCertificate
    Description: HTTPS GitHub webhook endpoint
    Value: !Sub 'https://${ApplicationLoadBalancer.DNSName}/webhook'

  InstallationsTableName:
    Description: Name of the DynamoDB installations table
    Value: !ImportValue mergebetter-saas-database-InstallationsTable

  APIEndpoint:
    Description: API endpoint for customer dashboard
    Value: !Sub 'https://${ApplicationLoadBalancer.DNSName}/api'