          import json
          import os
          import boto3
          import hashlib
          import logging
          import base64
          import html as html_lib
          from datetime import datetime, timedelta, timezone

          # Configure logging
          logger = logging.getLogger()
          logger.setLevel(getattr(logging, os.environ.get('LOG_LEVEL', 'WARN').upper(), logging.WARNING))

          def mask_email(address):
              """Short digest of an address, for correlating log lines without
              writing the address itself to CloudWatch Logs. Per-recipient status
              lives in the DynamoDB tracking table, not in the logs."""
              if not address:
                  return 'unknown'
              return 'sha256:' + hashlib.sha256(address.encode('utf-8')).hexdigest()[:12]

          def tracking_expiration():
              """Epoch seconds at which tracking items should expire, or None to keep them.

              Driven by the TrackingDataRetentionDays stack parameter. Returning None means
              the item is written without an ExpirationTime attribute, so DynamoDB TTL leaves
              it alone permanently.
              """
              try:
                  days = int(os.environ.get('TRACKING_RETENTION_DAYS', '400'))
              except ValueError:
                  days = 400
              if days <= 0:
                  return None
              return int((datetime.now(timezone.utc) + timedelta(days=days)).timestamp())

          def lambda_handler(event, context):
              """
              Lambda function to send emails from SQS messages
              Uses campaign-specific DynamoDB tables
              """
              logger.info(f"Processing {len(event.get('Records', []))} SQS messages")

              # Track success/failure
              successful_sends = 0
              failed_sends = 0

              # Initialize SES client
              ses_client = boto3.client('sesv2')

              # Track batch counts for campaign-specific tables
              batch_counts = {}  # Format: {(batch_id, batch_table): {'success': 0, 'fail': 0}}

              # Process each SQS message
              for record in event.get('Records', []):
                  try:
                      # Parse the message
                      message_body = json.loads(record['body'])

                      # Extract data from message
                      batch_id = message_body.get('batchId')
                      campaign_id = message_body.get('campaignId')
                      recipient = message_body.get('recipient', {})
                      sender = message_body.get('sender', {})
                      template = message_body.get('template', {})
                      topic_name = message_body.get('topicName')
                      template_s3_key = message_body.get('templateS3Key')

                      # Get campaign-specific table names
                      recipient_table_name = message_body.get('recipientTrackingTable')
                      batch_table_name = message_body.get('batchTrackingTable')

                      # Skip if missing essential data
                      if not all([batch_id, campaign_id, recipient, sender, template, recipient_table_name, batch_table_name]):
                          logger.error("Message missing required fields")
                          continue

                      # Initialize batch counts if not already tracked
                      batch_key = (batch_id, batch_table_name)
                      if batch_key not in batch_counts:
                          batch_counts[batch_key] = {'success': 0, 'fail': 0}

                      # Extract recipient email
                      email = recipient.get('email')
                      if not email:
                          logger.error(f"Recipient in batch {batch_id} missing email address")
                          failed_sends += 1
                          batch_counts[batch_key]['fail'] += 1
                          continue

                      # Initialize DynamoDB tables for this message
                      dynamodb = boto3.resource('dynamodb')
                      recipient_table = dynamodb.Table(recipient_table_name)
                      batch_table = dynamodb.Table(batch_table_name)

                      # Get current attempts count from DynamoDB table
                      attempts = 0
                      try:
                          response = recipient_table.get_item(Key={'EmailAddress': email})
                          if 'Item' in response:
                              existing_item = response['Item']
                              if existing_item.get('Status') == 'SENT':
                                  logger.info(f"Email already sent to {mask_email(email)} in campaign {campaign_id}, skipping")
                                  successful_sends += 1
                                  batch_counts[batch_key]['success'] += 1
                                  continue
                              attempts = int(existing_item.get('Attempts', 0))
                      except Exception as e:
                          logger.warning(f"Error checking recipient status for {mask_email(email)}: {str(e)}")
                          attempts = 0

                      # Log the send attempt
                      logger.info(f"Sending email to {mask_email(email)} for batch {batch_id}")

                      try:
                          # Initialize variables
                          s3_client = None
                          embedded_attachments = []
                          template_has_placeholder = False

                          # Check if we need to use S3 template (has embedded images)
                          if template_s3_key:
                              # Load template from S3 and send as simple email with embedded images
                              s3_client = boto3.client('s3')
                              attachments_bucket = os.environ.get('ATTACHMENTS_BUCKET')

                              # Get template from S3
                              template_response = s3_client.get_object(Bucket=attachments_bucket, Key=template_s3_key)
                              template_data = json.loads(template_response['Body'].read().decode('utf-8'))

                              html_content = template_data.get('htmlContent', '')
                              text_content = template_data.get('textContent', '')
                              subject = template_data.get('subject', '')

                              # Replace template variables
                              metadata = recipient.get('metadata', {})
                              first_name = metadata.get('firstName', '')
