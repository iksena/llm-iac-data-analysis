AWSTemplateFormatVersion: '2010-09-09'
Description: EKS-FAIL-DEMO - Unified CloudWatch dashboard covering the API path (EKS pods -> RDS)

# Puts the two halves of the API workload on one page:
#   - EKS-side  : api-server pod CPU/memory + api-loadgen success rate
#   - RDS-side  : DatabaseConnections, CPU, IOPS, latency, storage
# So an incident like "API is slow" can be triaged in one view instead
# of clicking through Container Insights + RDS console + a plain
# CloudWatch metrics search.

Parameters:
  ProjectName:
    Type: String
    Default: devops-agent-demo
  ClusterName:
    Type: String
    Description: EKS cluster name (used as ContainerInsights dimension)
  RdsInstanceId:
    Type: String
    Description: RDS DBInstanceIdentifier (used as AWS/RDS dimension)

Resources:
  ApiRdsDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub ${ProjectName}-api-rds
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type":"text","x":0,"y":0,"width":24,"height":1,
              "properties":{"markdown":"## EKS API path — pods + Service, api-demo namespace"}
            },
            {
              "type":"metric","x":0,"y":1,"width":8,"height":6,
              "properties":{
                "title":"api-server pod CPU % (avg across replicas)",
                "metrics":[
                  ["ContainerInsights","pod_cpu_utilization","Service","api-server","Namespace","api-demo","ClusterName","${ClusterName}",{"stat":"Average","period":60}],
                  ["...",{"stat":"Maximum","period":60,"label":"Max across pods"}]
                ],
                "view":"timeSeries","region":"${AWS::Region}",
                "yAxis":{"left":{"label":"%","showUnits":false,"min":0}}
              }
            },
            {
              "type":"metric","x":8,"y":1,"width":8,"height":6,
              "properties":{
                "title":"api-server pod memory (working set, MiB)",
                "metrics":[
                  [{"expression":"m1/1048576","label":"Avg WorkingSet MiB"}],
                  [{"expression":"m2/1048576","label":"Max WorkingSet MiB"}],
                  ["ContainerInsights","pod_memory_working_set","Service","api-server","Namespace","api-demo","ClusterName","${ClusterName}",{"stat":"Average","period":60,"id":"m1","visible":false}],
                  ["...",{"stat":"Maximum","period":60,"id":"m2","visible":false}]
                ],
                "view":"timeSeries","region":"${AWS::Region}",
                "yAxis":{"left":{"label":"MiB","showUnits":false,"min":0}},
                "annotations":{"horizontal":[{"label":"limit 256 MiB","value":256,"color":"#d62728"}]}
              }
            },
            {
              "type":"metric","x":16,"y":1,"width":8,"height":6,
              "properties":{
                "title":"api-server replica health",
                "metrics":[
                  ["ContainerInsights","service_number_of_running_pods","Service","api-server","Namespace","api-demo","ClusterName","${ClusterName}",{"stat":"Average","period":60,"label":"Running pods"}],
                  ["ContainerInsights","pod_number_of_container_restarts","PodName","api-server","Namespace","api-demo","ClusterName","${ClusterName}",{"stat":"Sum","period":60,"label":"Container restarts (sum)"}]
                ],
                "view":"timeSeries","region":"${AWS::Region}",
                "yAxis":{"left":{"min":0}}
              }
            },

            {
              "type":"text","x":0,"y":7,"width":24,"height":1,
              "properties":{"markdown":"## RDS — devops-agent-demo-api-db (Postgres, db.t3.micro)"}
            },
            {
              "type":"metric","x":0,"y":8,"width":8,"height":6,
              "properties":{
                "title":"DatabaseConnections (open) — smoking gun for connection issues",
                "metrics":[
                  ["AWS/RDS","DatabaseConnections","DBInstanceIdentifier","${RdsInstanceId}",{"stat":"Average","period":60}]
                ],
                "view":"timeSeries","region":"${AWS::Region}",
                "yAxis":{"left":{"label":"connections","showUnits":false,"min":0}}
              }
            },
            {
              "type":"metric","x":8,"y":8,"width":8,"height":6,
              "properties":{
                "title":"RDS CPUUtilization %",
                "metrics":[
                  ["AWS/RDS","CPUUtilization","DBInstanceIdentifier","${RdsInstanceId}",{"stat":"Average","period":60}]
                ],
                "view":"timeSeries","region":"${AWS::Region}",
                "yAxis":{"left":{"label":"%","showUnits":false,"min":0,"max":100}},
                "annotations":{"horizontal":[{"label":"80% (t3.micro burst)","value":80,"color":"#d62728"}]}
              }
            },
            {
              "type":"metric","x":16,"y":8,"width":8,"height":6,
              "properties":{
                "title":"RDS Read/Write Latency (ms)",
                "metrics":[
                  [{"expression":"m1*1000","label":"Read latency (ms)"}],
                  [{"expression":"m2*1000","label":"Write latency (ms)"}],
                  ["AWS/RDS","ReadLatency","DBInstanceIdentifier","${RdsInstanceId}",{"stat":"Average","period":60,"id":"m1","visible":false}],
                  ["AWS/RDS","WriteLatency","DBInstanceIdentifier","${RdsInstanceId}",{"stat":"Average","period":60,"id":"m2","visible":false}]
                ],
                "view":"timeSeries","region":"${AWS::Region}",
                "yAxis":{"left":{"label":"ms","showUnits":false,"min":0}}
              }
            },
            {
              "type":"metric","x":0,"y":14,"width":8,"height":6,
              "properties":{
                "title":"RDS IOPS (Read + Write)",
                "metrics":[
                  ["AWS/RDS","ReadIOPS","DBInstanceIdentifier","${RdsInstanceId}",{"stat":"Average","period":60}],
                  ["AWS/RDS","WriteIOPS","DBInstanceIdentifier","${RdsInstanceId}",{"stat":"Average","period":60}]
                ],
                "view":"timeSeries","stacked":true,"region":"${AWS::Region}",
                "yAxis":{"left":{"label":"ops/sec","showUnits":false,"min":0}}
              }
            },
            {
              "type":"metric","x":8,"y":14,"width":8,"height":6,
              "properties":{
                "title":"RDS Storage headroom",
                "metrics":[
                  [{"expression":"m1/1073741824","label":"FreeStorage GiB"}],
                  ["AWS/RDS","FreeStorageSpace","DBInstanceIdentifier","${RdsInstanceId}",{"stat":"Average","period":60,"id":"m1","visible":false}]
                ],
                "view":"timeSeries","region":"${AWS::Region}",
                "yAxis":{"left":{"label":"GiB","showUnits":false,"min":0}}
              }
            },
            {
              "type":"metric","x":16,"y":14,"width":8,"height":6,
              "properties":{
                "title":"RDS DiskQueueDepth (I/O contention)",
                "metrics":[
                  ["AWS/RDS","DiskQueueDepth","DBInstanceIdentifier","${RdsInstanceId}",{"stat":"Average","period":60}]
                ],
                "view":"timeSeries","region":"${AWS::Region}",
                "annotations":{"horizontal":[
                  {"label":"queue=1 (elevated)","value":1,"color":"#aaa"},
                  {"label":"queue=5 (contention)","value":5,"color":"#d62728"}
                ]}
              }
            }
          ]
        }

Outputs:
  DashboardName:
    Value: !Ref ApiRdsDashboard
  DashboardUrl:
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${ProjectName}-api-rds