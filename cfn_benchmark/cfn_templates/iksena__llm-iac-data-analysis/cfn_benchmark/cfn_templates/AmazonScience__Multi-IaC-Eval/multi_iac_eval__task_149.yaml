AWSTemplateFormatVersion: "2010-09-09"

Description: |
  Create a AWS resource groups

Resources:
  # An AWS resource group based on a CloudFormation stack
  CloudFormationStackGroup:
    Type: AWS::ResourceGroups::Group
    Properties:
      Name: !Ref AWS::StackName
      Description: A group that is based on this stack
      ResourceQuery:
        Type: CLOUDFORMATION_STACK_1_0
        Query:
          ResourceTypeFilters:
            - AWS::AllSupported
          StackIdentifier: !Ref AWS::StackId

  # An AWS resource group based on a tag
  TagGroup:
    Type: AWS::ResourceGroups::Group
    Properties:
      Name: !Ref AWS::StackName
      Description: A group that is based on a tag
      ResourceQuery:
        Type: TAG_FILTERS_1_0
        Query:
          ResourceTypeFilters:
            - AWS::AllSupported
          TagFilters:
            - Key: Environment
              Values:
                - Production

  # An Amazon S3 bucket with versioning enabled
  S3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-s3-bucket"
      VersioningConfiguration:
        Status: Enabled

  # An Amazon SageMaker notebook instance
  SageMakerNotebookInstance:
    Type: AWS::SageMaker::NotebookInstance
    Properties:
      NotebookInstanceName: !Ref AWS::StackName
      InstanceType: ml.t2.medium
      RoleArn: !GetAtt SageMakerExecutionRole.Arn
      # Additional properties can be added as needed