AWSTemplateFormatVersion: '2010-09-09'
Description: 'Production ML Platform with SageMaker, S3, and VPC infrastructure'

Parameters:
  EnvironmentName:
    Type: String
    Default: production
    Description: Environment name for resource tagging
    AllowedValues:
      - development
      - staging
      - production

  VpcCIDR:
    Type: String
    Default: 10.0.0.0/16
    Description: CIDR block for VPC
    AllowedPattern: '^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/([0-9]|[1-2][0-9]|3[0-2]))$'

  PrivateSubnet1CIDR:
    Type: String
    Default: 10.0.1.0/24
    Description: CIDR block for private subnet 1

  PrivateSubnet2CIDR:
    Type: String
    Default: 10.0.2.0/24
    Description: CIDR block for private subnet 2

  PublicSubnet1CIDR:
    Type: String
    Default: 10.0.101.0/24
    Description: CIDR block for public subnet 1

  PublicSubnet2CIDR:
    Type: String
    Default: 10.0.102.0/24
    Description: CIDR block for public subnet 2

  NotebookInstanceType:
    Type: String
    Default: ml.t3.medium
    Description: SageMaker notebook instance type
    AllowedValues:
      - ml.t3.medium
      - ml.t3.large
      - ml.t3.xlarge
      - ml.m5.large
      - ml.m5.xlarge

  DomainName:
    Type: String
    Default: ml-platform-domain
    Description: Name for SageMaker Studio Domain

  DataRetentionDays:
    Type: Number
    Default: 90
    Description: Number of days to retain ML artifacts

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Environment Configuration
        Parameters:
          - EnvironmentName
          - DataRetentionDays
      - Label:
          default: Network Configuration
        Parameters:
          - VpcCIDR
          - PrivateSubnet1CIDR
          - PrivateSubnet2CIDR
          - PublicSubnet1CIDR
          - PublicSubnet2CIDR
      - Label:
          default: SageMaker Configuration
        Parameters:
          - NotebookInstanceType
          - DomainName

Resources:
  # VPC Configuration
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCIDR
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-ml-vpc
        - Key: Environment
          Value: !Ref EnvironmentName

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-ml-igw
        - Key: Environment
          Value: !Ref EnvironmentName

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref VPC

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Ref PublicSubnet1CIDR
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-ml-public-subnet-1
        - Key: Environment
          Value: !Ref EnvironmentName

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: !Ref PublicSubnet2CIDR
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-ml-public-subnet-2
        - Key: Environment
          Value: !Ref EnvironmentName

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Ref PrivateSubnet1CIDR
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-ml-private-subnet-1
        - Key: Environment
          Value: !Ref EnvironmentName

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: !Ref PrivateSubnet2CIDR
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-ml-private-subnet-2
        - Key: Environment
          Value: !Ref EnvironmentName

  NatGateway1EIP:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-ml-nat-eip-1

  NatGateway2EIP:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-ml-nat-eip-2

  NatGateway1:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatGateway1EIP.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-ml-nat-1

  NatGateway2:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatGateway2EIP.AllocationId
      SubnetId: !Ref PublicSubnet2
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-ml-nat-2

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-ml-public-rt
        - Key: Environment
          Value: !Ref EnvironmentName

  DefaultPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet1

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet2

  PrivateRouteTable1:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-ml-private-rt-1
        - Key: Environment
          Value: !Ref EnvironmentName

  DefaultPrivateRoute1:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable1
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway1

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable1
      SubnetId: !Ref PrivateSubnet1

  PrivateRouteTable2:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-ml-private-rt-2
        - Key: Environment
          Value: !Ref EnvironmentName

  DefaultPrivateRoute2:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable2
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway2

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable2
      SubnetId: !Ref PrivateSubnet2

  # Security Groups
  SageMakerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${EnvironmentName}-sagemaker-sg
      GroupDescription: Security group for SageMaker resources
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-sagemaker-sg
        - Key: Environment
          Value: !Ref EnvironmentName

  SageMakerSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref SageMakerSecurityGroup
      IpProtocol: "-1"
      SourceSecurityGroupId: !Ref SageMakerSecurityGroup
      Description: Allow traffic within security group

  # KMS Keys for Encryption
  # SECURITY FLAW 5: KMS key without rotation enabled
  MLEncryptionKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS key for ML platform data encryption
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: Allow SageMaker to use the key
            Effect: Allow
            Principal:
              Service: sagemaker.amazonaws.com
            Action:
              - 'kms:Decrypt'
              - 'kms:Encrypt'
              - 'kms:ReEncrypt*'
              - 'kms:GenerateDataKey*'
              - 'kms:CreateGrant'
              - 'kms:DescribeKey'
            Resource: '*'
            Condition:
              StringEquals:
                'kms:ViaService':
                  - !Sub 'sagemaker.${AWS::Region}.amazonaws.com'
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-ml-encryption-key
        - Key: Environment
          Value: !Ref EnvironmentName

  MLEncryptionKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/${EnvironmentName}-ml-encryption'
      TargetKeyId: !Ref MLEncryptionKey

  # S3 Buckets
  TrainingDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${EnvironmentName}-ml-training-data-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: 'aws:kms'
              KMSMasterKeyID: !GetAtt MLEncryptionKey.Arn
            BucketKeyEnabled: true
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldTrainingData
            Status: Enabled
            ExpirationInDays: !Ref DataRetentionDays
            NoncurrentVersionExpirationInDays: 30
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-training-data
        - Key: Environment
          Value: !Ref EnvironmentName

  # SECURITY FLAW 2: S3 bucket without versioning enabled
  ModelArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${EnvironmentName}-ml-models-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: 'aws:kms'
              KMSMasterKeyID: !GetAtt MLEncryptionKey.Arn
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: TransitionToIA
            Status: Enabled
            Transitions:
              - TransitionInDays: 30
                StorageClass: STANDARD_IA
              - TransitionInDays: 90
                StorageClass: GLACIER
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-model-artifacts
        - Key: Environment
          Value: !Ref EnvironmentName

  NotebooksBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${EnvironmentName}-ml-notebooks-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: 'aws:kms'
              KMSMasterKeyID: !GetAtt MLEncryptionKey.Arn
            BucketKeyEnabled: true
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-notebooks
        - Key: Environment
          Value: !Ref EnvironmentName

  # IAM Roles
  # SECURITY FLAW 3: Overly permissive S3 access (s3:*)
  SageMakerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${EnvironmentName}-SageMakerExecutionRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - sagemaker.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AmazonSageMakerFullAccess'
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 's3:*'
                Resource:
                  - !GetAtt TrainingDataBucket.Arn
                  - !Sub '${TrainingDataBucket.Arn}/*'
                  - !GetAtt ModelArtifactsBucket.Arn
                  - !Sub '${ModelArtifactsBucket.Arn}/*'
                  - !GetAtt NotebooksBucket.Arn
                  - !Sub '${NotebooksBucket.Arn}/*'
        - PolicyName: KMSAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'kms:Decrypt'
                  - 'kms:Encrypt'
                  - 'kms:ReEncrypt*'
                  - 'kms:GenerateDataKey*'
                  - 'kms:DescribeKey'
                  - 'kms:CreateGrant'
                Resource: !GetAtt MLEncryptionKey.Arn
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                  - 'logs:DescribeLogStreams'
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/sagemaker/*'
        - PolicyName: ECRAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'ecr:GetAuthorizationToken'
                  - 'ecr:BatchCheckLayerAvailability'
                  - 'ecr:GetDownloadUrlForLayer'
                  - 'ecr:BatchGetImage'
                Resource: '*'
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-sagemaker-execution-role
        - Key: Environment
          Value: !Ref EnvironmentName

  SageMakerStudioRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${EnvironmentName}-SageMakerStudioRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - sagemaker.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AmazonSageMakerFullAccess'
      Policies:
        - PolicyName: StudioS3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 's3:GetObject'
                  - 's3:PutObject'
                  - 's3:DeleteObject'
                  - 's3:ListBucket'
                Resource:
                  - !GetAtt NotebooksBucket.Arn
                  - !Sub '${NotebooksBucket.Arn}/*'
                  - !GetAtt TrainingDataBucket.Arn
                  - !Sub '${TrainingDataBucket.Arn}/*'
                  - !GetAtt ModelArtifactsBucket.Arn
                  - !Sub '${ModelArtifactsBucket.Arn}/*'
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-sagemaker-studio-role
        - Key: Environment
          Value: !Ref EnvironmentName

  # SageMaker Studio Domain
  SageMakerStudioDomain:
    Type: AWS::SageMaker::Domain
    Properties:
      DomainName: !Ref DomainName
      AuthMode: IAM
      DefaultUserSettings:
        ExecutionRole: !GetAtt SageMakerStudioRole.Arn
        SecurityGroups:
          - !Ref SageMakerSecurityGroup
        SharingSettings:
          NotebookOutputOption: Allowed
          S3OutputPath: !Sub 's3://${NotebooksBucket}/studio-output'
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      VpcId: !Ref VPC
      AppNetworkAccessType: VpcOnly
      KmsKeyId: !GetAtt MLEncryptionKey.Arn
      Tags:
        - Key: Name
          Value: !Ref DomainName
        - Key: Environment
          Value: !Ref EnvironmentName

  # SageMaker Studio User Profile
  DataScienceUserProfile:
    Type: AWS::SageMaker::UserProfile
    Properties:
      DomainId: !Ref SageMakerStudioDomain
      UserProfileName: data-scientist
      UserSettings:
        ExecutionRole: !GetAtt SageMakerStudioRole.Arn
        SecurityGroups:
          - !Ref SageMakerSecurityGroup
      Tags:
        - Key: Name
          Value: data-scientist-profile
        - Key: Environment
          Value: !Ref EnvironmentName

  # SECURITY FLAW 1: Notebook instance with direct internet access
  # SECURITY FLAW 4: Root access enabled
  DevelopmentNotebookInstance:
    Type: AWS::SageMaker::NotebookInstance
    Properties:
      NotebookInstanceName: !Sub ${EnvironmentName}-dev-notebook
      InstanceType: !Ref NotebookInstanceType
      RoleArn: !GetAtt SageMakerExecutionRole.Arn
      SubnetId: !Ref PublicSubnet1
      SecurityGroupIds:
        - !Ref SageMakerSecurityGroup
      DirectInternetAccess: Enabled
      RootAccess: Enabled
      KmsKeyId: !GetAtt MLEncryptionKey.Arn
      VolumeSizeInGB: 100
      DefaultCodeRepository: !GetAtt MLCodeRepository.CloneUrlHttp
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-dev-notebook
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Purpose
          Value: Development

  ProductionNotebookInstance:
    Type: AWS::SageMaker::NotebookInstance
    Properties:
      NotebookInstanceName: !Sub ${EnvironmentName}-prod-notebook
      InstanceType: !Ref NotebookInstanceType
      RoleArn: !GetAtt SageMakerExecutionRole.Arn
      SubnetId: !Ref PrivateSubnet1
      SecurityGroupIds:
        - !Ref SageMakerSecurityGroup
      DirectInternetAccess: Disabled
      RootAccess: Disabled
      KmsKeyId: !GetAtt MLEncryptionKey.Arn
      VolumeSizeInGB: 200
      LifecycleConfigName: !GetAtt NotebookLifecycleConfig.NotebookInstanceLifecycleConfigName
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-prod-notebook
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Purpose
          Value: Production

  # SageMaker Notebook Lifecycle Configuration
  NotebookLifecycleConfig:
    Type: AWS::SageMaker::NotebookInstanceLifecycleConfig
    Properties:
      NotebookInstanceLifecycleConfigName: !Sub ${EnvironmentName}-notebook-lifecycle
      OnStart:
        - Content:
            Fn::Base64: |
              #!/bin/bash
              set -e

              # Update pip and install common ML libraries
              sudo -u ec2-user -i <<'EOF'
              source /home/ec2-user/anaconda3/bin/activate python3
              pip install --upgrade pip
              pip install --upgrade boto3 sagemaker pandas numpy scikit-learn matplotlib seaborn
              pip install --upgrade tensorflow torch transformers
              source /home/ec2-user/anaconda3/bin/deactivate
              EOF

              # Configure CloudWatch monitoring
              echo "Notebook instance started at $(date)" >> /var/log/notebook-lifecycle.log

  # CodeCommit Repository for ML Code
  MLCodeRepository:
    Type: AWS::CodeCommit::Repository
    Properties:
      RepositoryName: !Sub ${EnvironmentName}-ml-code
      RepositoryDescription: ML platform code repository
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-ml-code
        - Key: Environment
          Value: !Ref EnvironmentName

  # CloudWatch Log Groups
  SageMakerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/sagemaker/${EnvironmentName}'
      RetentionInDays: 30
      KmsKeyId: !GetAtt MLEncryptionKey.Arn

  TrainingJobLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/sagemaker/${EnvironmentName}/training-jobs'
      RetentionInDays: 90
      KmsKeyId: !GetAtt MLEncryptionKey.Arn

  EndpointLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/sagemaker/${EnvironmentName}/endpoints'
      RetentionInDays: 90
      KmsKeyId: !GetAtt MLEncryptionKey.Arn

  # CloudWatch Alarms
  NotebookInstanceStatusAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${EnvironmentName}-notebook-instance-failed
      AlarmDescription: Alert when notebook instance status check fails
      MetricName: NotebookInstanceStatusCheckFailed
      Namespace: AWS/SageMaker
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: NotebookInstanceName
          Value: !GetAtt DevelopmentNotebookInstance.NotebookInstanceName

  # SNS Topic for Notifications
  MLPlatformNotificationsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${EnvironmentName}-ml-platform-notifications
      DisplayName: ML Platform Notifications
      KmsMasterKeyId: !Ref MLEncryptionKey
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-ml-notifications
        - Key: Environment
          Value: !Ref EnvironmentName

  # ECR Repository for Custom Containers
  MLContainerRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub ${EnvironmentName}-ml-containers
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: KMS
        KmsKey: !GetAtt MLEncryptionKey.Arn
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep last 10 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-ml-containers
        - Key: Environment
          Value: !Ref EnvironmentName

  # VPC Endpoints for SageMaker
  SageMakerAPIVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.sagemaker.api'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref SageMakerSecurityGroup

  SageMakerRuntimeVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.sagemaker.runtime'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref SageMakerSecurityGroup

  S3VPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable1
        - !Ref PrivateRouteTable2

Outputs:
  VPCId:
    Description: VPC ID for ML platform
    Value: !Ref VPC
    Export:
      Name: !Sub ${EnvironmentName}-ml-vpc-id

  SageMakerDomainId:
    Description: SageMaker Studio Domain ID
    Value: !Ref SageMakerStudioDomain
    Export:
      Name: !Sub ${EnvironmentName}-sagemaker-domain-id

  SageMakerDomainUrl:
    Description: SageMaker Studio Domain URL
    Value: !Sub 'https://${SageMakerStudioDomain}.studio.${AWS::Region}.sagemaker.aws'

  TrainingDataBucketName:
    Description: S3 bucket for training data
    Value: !Ref TrainingDataBucket
    Export:
      Name: !Sub ${EnvironmentName}-training-data-bucket

  ModelArtifactsBucketName:
    Description: S3 bucket for model artifacts
    Value: !Ref ModelArtifactsBucket
    Export:
      Name: !Sub ${EnvironmentName}-model-artifacts-bucket

  NotebooksBucketName:
    Description: S3 bucket for notebooks
    Value: !Ref NotebooksBucket
    Export:
      Name: !Sub ${EnvironmentName}-notebooks-bucket

  SageMakerExecutionRoleArn:
    Description: SageMaker execution role ARN
    Value: !GetAtt SageMakerExecutionRole.Arn
    Export:
      Name: !Sub ${EnvironmentName}-sagemaker-execution-role-arn

  DevelopmentNotebookInstanceName:
    Description: Development notebook instance name
    Value: !GetAtt DevelopmentNotebookInstance.NotebookInstanceName

  ProductionNotebookInstanceName:
    Description: Production notebook instance name
    Value: !GetAtt ProductionNotebookInstance.NotebookInstanceName

  MLEncryptionKeyId:
    Description: KMS key ID for ML platform encryption
    Value: !Ref MLEncryptionKey
    Export:
      Name: !Sub ${EnvironmentName}-ml-encryption-key-id

  MLCodeRepositoryName:
    Description: CodeCommit repository name
    Value: !GetAtt MLCodeRepository.Name

  MLCodeRepositoryCloneUrl:
    Description: CodeCommit repository clone URL
    Value: !GetAtt MLCodeRepository.CloneUrlHttp

  ECRRepositoryUri:
    Description: ECR repository URI for ML containers
    Value: !GetAtt MLContainerRepository.RepositoryUri

  NotificationTopicArn:
    Description: SNS topic ARN for ML platform notifications
    Value: !Ref MLPlatformNotificationsTopic
    Export:
      Name: !Sub ${EnvironmentName}-ml-notifications-topic-arn

  PrivateSubnets:
    Description: Private subnet IDs
    Value: !Join [',', [!Ref PrivateSubnet1, !Ref PrivateSubnet2]]
    Export:
      Name: !Sub ${EnvironmentName}-ml-private-subnets

  SageMakerSecurityGroupId:
    Description: Security group ID for SageMaker resources
    Value: !Ref SageMakerSecurityGroup
    Export:
      Name: !Sub ${EnvironmentName}-sagemaker-security-group-id