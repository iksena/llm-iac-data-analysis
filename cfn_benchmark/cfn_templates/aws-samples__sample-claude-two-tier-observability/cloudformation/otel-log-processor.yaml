AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Processes OTLP log events from Co-work and CLI into CloudWatch metrics
  and S3 session records for QuickSight. Bridges the gap between OTLP logs
  (which Co-work sends) and the metrics/S3 pipelines used by dashboards.

Parameters:
  OrgName:
    Type: String
    Default: my-org
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, staging, prod]
  ProcessedBucket:
    Type: String
    Description: S3 bucket for processed session records (Athena/QuickSight)
  OtelLogsLogGroup:
    Type: String
    Default: /aws/claude-code/otel-logs
    Description: CloudWatch log group receiving OTLP log events
  MetricsNamespace:
    Type: String
    Default: ClaudeCode/GenAI
  PermissionsBoundaryArn:
    Type: String
    Default: ''

Conditions:
  HasPermissionsBoundary: !Not [!Equals [!Ref PermissionsBoundaryArn, '']]

Resources:
  # checkov:skip=CKV_AWS_158:Sample uses default encryption — production deployments should add KMS
  DerivedMetricsLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W84
            reason: "Sample uses default encryption — production deployments should add KMS"
    Properties:
      LogGroupName: !Sub '/aws/claude-code/otel-derived-metrics'
      RetentionInDays: 30

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: "Explicit name required for deploy.sh cross-stack references"
    Properties:
      RoleName: !Sub 'claude-code-otel-log-processor-role-${OrgName}-${Environment}'
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref 'AWS::NoValue']
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3Write
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub 'arn:aws:s3:::${ProcessedBucket}/processed/sessions/*'
        - PolicyName: KMSAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - kms:GenerateDataKey
                  - kms:Decrypt
                Resource: !Sub 'arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/*'
                Condition:
                  StringLike:
                    kms:ViaService: !Sub 's3.${AWS::Region}.amazonaws.com'
        - PolicyName: CloudWatchWrite
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/claude-code/otel-derived-metrics:*'
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/claude-code-otel-log-processor-${OrgName}-${Environment}:*'

  # checkov:skip=CKV_AWS_117:Lambdas call AWS APIs only — VPC adds NAT Gateway cost with no benefit
  # checkov:skip=CKV_AWS_116:Synchronous invocation — DLQ not applicable
  # checkov:skip=CKV_AWS_173:Environment variables contain config (table names, ARNs), not secrets
  ProcessorFunction:
    Type: AWS::Lambda::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Lambda calls AWS APIs only — VPC adds cost with no benefit"
          - id: W92
            reason: "ReservedConcurrentExecutions set on function"
    Properties:
      FunctionName: !Sub 'claude-code-otel-log-processor-${OrgName}-${Environment}'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 60
      MemorySize: 256
      ReservedConcurrentExecutions: 10
      Environment:
        Variables:
          PROCESSED_BUCKET: !Ref ProcessedBucket
          ORG_NAME: !Ref OrgName
          CW_LOG_GROUP: /aws/claude-code/otel-derived-metrics
          METRICS_NAMESPACE: !Ref MetricsNamespace
      Code:
        ZipFile: |
          # Deploy the full processor from lambda/otel_log_processor/
          def handler(event, context):
              print("Deploy the full otel log processor from lambda/otel_log_processor/")
              return {"statusCode": 200}

  SubscriptionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt ProcessorFunction.Arn
      Action: lambda:InvokeFunction
      Principal: !Sub 'logs.${AWS::Region}.amazonaws.com'
      SourceArn: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:${OtelLogsLogGroup}:*'

  LogSubscription:
    Type: AWS::Logs::SubscriptionFilter
    DependsOn: SubscriptionPermission
    Properties:
      LogGroupName: !Ref OtelLogsLogGroup
      FilterPattern: ''
      DestinationArn: !GetAtt ProcessorFunction.Arn

Outputs:
  FunctionArn:
    Value: !GetAtt ProcessorFunction.Arn
  FunctionName:
    Value: !Ref ProcessorFunction