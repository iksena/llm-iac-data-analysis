AWSTemplateFormatVersion: '2010-09-09'
Description: Budgets example
Resources:

  AWSConfig:
    Type: AWS::Budgets::Budget
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Budget:
        BudgetLimit:
          Amount: '10000.0'
          Unit: USD
        BudgetName: AWS-Config
        BudgetType: COST
        CostFilters:
          Service:
            - AWS Config
        CostTypes:
          IncludeCredit: false
          IncludeDiscount: false
          IncludeOtherSubscription: true
          IncludeRecurring: true
          IncludeRefund: false
          IncludeSubscription: true
          IncludeSupport: false
          IncludeTax: false
          IncludeUpfront: true
          UseAmortized: true
          UseBlended: false
        TimePeriod:
          End: 3706473600
          Start: 1682899200
        TimeUnit: MONTHLY

