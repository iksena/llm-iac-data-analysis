AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Lab 9.1 — CloudWatch Logs basics. Emitter writes mixed INFO/ERROR
             lines; metric filter counts ERRORs; subscription filter ships
             ERRORs to a forwarder Lambda.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 256
    LoggingConfig:
      LogFormat: JSON

Resources:

  # --- Emitter: writes mixed log lines ---

  EmitterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dva-lab-09-01-emitter
      CodeUri: src/
      Handler: emitter.handler

  EmitterLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${EmitterFunction}
      RetentionInDays: 7   # CRITICAL: default is never-expire = pays forever

  # --- Metric filter: count "ERROR" lines ---

  ErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    DependsOn: EmitterLogGroup
    Properties:
      LogGroupName: !Ref EmitterLogGroup
      FilterPattern: '"ERROR"'
      MetricTransformations:
        - MetricName: ErrorCount
          MetricNamespace: dva/lab-09-01
          MetricValue: '1'
          DefaultValue: 0

  # --- Forwarder: receives subscription-filter batches ---

  ForwarderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dva-lab-09-01-forwarder
      CodeUri: src/
      Handler: forwarder.handler

  ForwarderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ForwarderFunction}
      RetentionInDays: 7

  ForwarderInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ForwarderFunction
      Principal: !Sub logs.${AWS::Region}.amazonaws.com
      SourceArn: !GetAtt EmitterLogGroup.Arn

  # --- Subscription filter: stream ERROR events to forwarder ---

  ErrorSubscriptionFilter:
    Type: AWS::Logs::SubscriptionFilter
    DependsOn: ForwarderInvokePermission
    Properties:
      LogGroupName: !Ref EmitterLogGroup
      FilterPattern: 'ERROR'
      DestinationArn: !GetAtt ForwarderFunction.Arn

Outputs:
  EmitterFunctionName:
    Value: !Ref EmitterFunction
  ForwarderFunctionName:
    Value: !Ref ForwarderFunction
  EmitterLogGroup:
    Value: !Ref EmitterLogGroup
  ForwarderLogGroup:
    Value: !Ref ForwarderLogGroup
  MetricNamespace:
    Value: dva/lab-09-01