AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: |
  DVA Lab 6.1 — ASL Basics. A Standard state machine that exercises every fundamental
  state type (Pass, Task, Choice, Wait, Succeed, Fail) and demonstrates JSONPath
  with InputPath / Parameters / ResultPath / OutputPath.

Resources:

  ValidateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dva-lab-06-01-validate
      Runtime: python3.12
      Handler: handler.validate
      CodeUri: src/
      Timeout: 10
      MemorySize: 128

  StateMachineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/vendedlogs/states/dva-lab-06-01-asl-basics
      RetentionInDays: 7

  StateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-lambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt ValidateFunction.Arn
        - PolicyName: cloudwatch-logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogGroups
                Resource: '*'

  StateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: dva-lab-06-01-asl-basics
      StateMachineType: STANDARD
      RoleArn: !GetAtt StateMachineRole.Arn
      LoggingConfiguration:
        Level: ALL
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt StateMachineLogGroup.Arn
      DefinitionSubstitutions:
        ValidateFunctionArn: !GetAtt ValidateFunction.Arn
      DefinitionString: |-
        {
          "Comment": "Order pipeline: tag input, validate, branch on amount.",
          "StartAt": "Tag Input",
          "States": {
            "Tag Input": {
              "Type": "Pass",
              "Comment": "Demonstrates Parameters: build a new payload referencing the input via JSONPath.",
              "Parameters": {
                "order.$": "$",
                "receivedAt.$": "$$.State.EnteredTime",
                "stage": "tagged"
              },
              "Next": "Validate"
            },
            "Validate": {
              "Type": "Task",
              "Comment": "Lambda Task. ResultPath stashes the result under $.validation, leaving the original input intact.",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${ValidateFunctionArn}",
                "Payload.$": "$.order"
              },
              "ResultSelector": {
                "ok.$": "$.Payload.ok",
                "amountUsd.$": "$.Payload.amountUsd",
                "reason.$": "$.Payload.reason"
              },
              "ResultPath": "$.validation",
              "Retry": [
                {
                  "ErrorEquals": ["Lambda.ServiceException", "Lambda.AWSLambdaException", "Lambda.SdkClientException"],
                  "IntervalSeconds": 1,
                  "MaxAttempts": 3,
                  "BackoffRate": 2.0
                }
              ],
              "Next": "Amount Branch"
            },
            "Amount Branch": {
              "Type": "Choice",
              "Comment": "Branch on the amountUsd computed by the Validate Lambda.",
              "Choices": [
                {
                  "Variable": "$.validation.ok",
                  "BooleanEquals": false,
                  "Next": "Reject"
                },
                {
                  "Variable": "$.validation.amountUsd",
                  "NumericGreaterThanEquals": 100,
                  "Next": "Wait For Settlement"
                }
              ],
              "Default": "Auto Approve"
            },
            "Wait For Settlement": {
              "Type": "Wait",
              "Comment": "High-value orders pause 3s as a placeholder for a settlement window.",
              "Seconds": 3,
              "Next": "Approve"
            },
            "Auto Approve": {
              "Type": "Pass",
              "Result": { "decision": "auto-approved" },
              "ResultPath": "$.outcome",
              "Next": "Done"
            },
            "Approve": {
              "Type": "Pass",
              "Result": { "decision": "approved-after-settlement" },
              "ResultPath": "$.outcome",
              "Next": "Done"
            },
            "Reject": {
              "Type": "Fail",
              "Error": "ValidationFailed",
              "Cause": "Validate Lambda returned ok=false."
            },
            "Done": {
              "Type": "Succeed",
              "Comment": "OutputPath could prune the output here. We keep the full payload for inspection."
            }
          }
        }

Outputs:
  StateMachineArn:
    Description: ARN of the Standard state machine
    Value: !Ref StateMachine
    Export:
      Name: dva-lab-06-01-StateMachineArn
  StateMachineName:
    Value: !GetAtt StateMachine.Name
  ValidateFunctionName:
    Value: !Ref ValidateFunction
  LogGroupName:
    Value: !Ref StateMachineLogGroup