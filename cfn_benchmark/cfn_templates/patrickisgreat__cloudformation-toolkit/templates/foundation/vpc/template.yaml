AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  Multi-AZ VPC with public and private subnets, a configurable NAT posture,
  gateway and interface endpoints, and optional flow logs. The landing zone every
  other template in this library runs inside.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Naming
        Parameters:
          - NamePrefix
          - Environment
      - Label:
          default: Addressing
        Parameters:
          - VpcCidr
          - AvailabilityZoneCount
      - Label:
          default: Egress (this is the cost decision)
        Parameters:
          - NatGatewayMode
      - Label:
          default: VPC endpoints
        Parameters:
          - EnableS3Endpoint
          - EnableDynamoDbEndpoint
          - EnableEcrEndpoints
          - EnableLogsEndpoint
          - EnableSecretsManagerEndpoint
          - EnableSsmEndpoints
      - Label:
          default: Flow logs
        Parameters:
          - EnableFlowLogs
          - FlowLogRetentionDays
          - FlowLogTrafficType

Parameters:
  NamePrefix:
    Type: String
    Description: >-
      Prefix for every resource this stack names. Must be unique per account and
      region.
    AllowedPattern: "^[a-z][a-z0-9-]{1,30}[a-z0-9]$"
    ConstraintDescription: >-
      3-32 characters, lowercase letters, digits and hyphens, starting with a
      letter and ending with a letter or digit.

  Environment:
    Type: String
    Description: Environment this VPC belongs to. Used in names and tags.
    Default: dev
    AllowedValues: [dev, staging, prod]

  VpcCidr:
    Type: String
    Description: >-
      IPv4 range for the VPC. A /16 gives six /24 subnets with room to grow; if
      this VPC will ever peer with another, pick a range that does not overlap.
    Default: 10.0.0.0/16
    AllowedPattern: "^(\\d{1,3}\\.){3}\\d{1,3}/(1[6-9]|2[0-4])$"
    ConstraintDescription: Must be a CIDR between /16 and /24, e.g. 10.0.0.0/16.

  AvailabilityZoneCount:
    Type: String
    Description: >-
      How many AZs to spread across. Two is the minimum for an ALB and for
      Multi-AZ RDS; three is what you want in prod, because losing one AZ then
      costs a third of capacity rather than half.
    Default: "2"
    AllowedValues: ["2", "3"]

  NatGatewayMode:
    Type: String
    Description: >-
      Egress for private subnets. `none` is free and correct when workloads only
      talk to AWS APIs reachable through VPC endpoints. `single` is one NAT
      gateway shared by every AZ - cheapest working option, but an AZ failure
      takes egress with it. `per-az` survives an AZ failure and costs one NAT
      gateway per AZ (roughly $32/month each, plus data processing).
    Default: single
    AllowedValues: [none, single, per-az]

  EnableS3Endpoint:
    Type: String
    Description: >-
      Create the S3 gateway endpoint. Gateway endpoints are free and route S3
      traffic off the NAT gateway, so this usually pays for itself immediately.
    Default: "true"
    AllowedValues: ["true", "false"]

  EnableDynamoDbEndpoint:
    Type: String
    Description: Create the DynamoDB gateway endpoint. Also free.
    Default: "true"
    AllowedValues: ["true", "false"]

  EnableEcrEndpoints:
    Type: String
    Description: >-
      Create the ecr.api and ecr.dkr interface endpoints. Together with the S3
      gateway endpoint (which serves the image layers), these are what let a
      Fargate task pull an image with NatGatewayMode=none.
    Default: "false"
    AllowedValues: ["true", "false"]

  EnableLogsEndpoint:
    Type: String
    Description: >-
      Create the CloudWatch Logs interface endpoint. Required for tasks in
      private subnets with no NAT to ship logs.
    Default: "false"
    AllowedValues: ["true", "false"]

  EnableSecretsManagerEndpoint:
    Type: String
    Description: >-
      Create the Secrets Manager interface endpoint. Required for a task
      definition that injects secrets when there is no NAT.
    Default: "false"
    AllowedValues: ["true", "false"]

  EnableSsmEndpoints:
    Type: String
    Description: >-
      Create the ssm and ssmmessages interface endpoints, which is what ECS Exec
      ("docker exec into a Fargate task") and Session Manager need without NAT.
    Default: "false"
    AllowedValues: ["true", "false"]

  EnableFlowLogs:
    Type: String
    Description: >-
      Send VPC flow logs to CloudWatch Logs. Off by default because flow logs on
      a busy VPC are a real line item; turn them on in prod and anywhere you need
      to answer "did this actually talk to that".
    Default: "false"
    AllowedValues: ["true", "false"]

  FlowLogTrafficType:
    Type: String
    Description: Which flows to record.
    Default: REJECT
    AllowedValues: [ACCEPT, REJECT, ALL]

  FlowLogRetentionDays:
    Type: Number
    Description: Retention for the flow log group.
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1827, 3653]

Conditions:
  HasThreeAzs: !Equals [!Ref AvailabilityZoneCount, "3"]
  HasNat: !Not [!Equals [!Ref NatGatewayMode, none]]
  HasNatPerAz: !Equals [!Ref NatGatewayMode, per-az]
  HasNatInAz3: !And [!Condition HasNatPerAz, !Condition HasThreeAzs]
  HasPrivateRouteInAz3: !And [!Condition HasNat, !Condition HasThreeAzs]
  ShouldCreateS3Endpoint: !Equals [!Ref EnableS3Endpoint, "true"]
  ShouldCreateDynamoDbEndpoint: !Equals [!Ref EnableDynamoDbEndpoint, "true"]
  ShouldCreateEcrEndpoints: !Equals [!Ref EnableEcrEndpoints, "true"]
  ShouldCreateLogsEndpoint: !Equals [!Ref EnableLogsEndpoint, "true"]
  ShouldCreateSecretsEndpoint: !Equals [!Ref EnableSecretsManagerEndpoint, "true"]
  ShouldCreateSsmEndpoints: !Equals [!Ref EnableSsmEndpoints, "true"]
  # The shared endpoint security group exists if any interface endpoint does.
  HasInterfaceEndpoints: !Or
    - !Condition ShouldCreateEcrEndpoints
    - !Condition ShouldCreateLogsEndpoint
    - !Condition ShouldCreateSecretsEndpoint
    - !Condition ShouldCreateSsmEndpoints
  ShouldCreateFlowLogs: !Equals [!Ref EnableFlowLogs, "true"]

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      # Both are required for interface endpoints and for RDS/ElastiCache
      # private DNS to resolve to in-VPC addresses.
      EnableDnsSupport: true
      EnableDnsHostnames: true
      InstanceTenancy: default
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-vpc"

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-igw"

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # Subnets are carved with Fn::Cidr rather than taken as parameters: six equal
  # blocks out of the VPC range, public first. Handing a caller six CIDR
  # parameters would be six chances to typo an overlapping range.
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 6, 8]]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-public-1"
        # Consumed by the AWS Load Balancer Controller and by ECS service
        # discovery when they auto-detect where to place a public load balancer.
        - Key: kubernetes.io/role/elb
          Value: "1"

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 6, 8]]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-public-2"
        - Key: kubernetes.io/role/elb
          Value: "1"

  PublicSubnet3:
    Type: AWS::EC2::Subnet
    Condition: HasThreeAzs
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [2, !GetAZs ""]
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidr, 6, 8]]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-public-3"
        - Key: kubernetes.io/role/elb
          Value: "1"

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [3, !Cidr [!Ref VpcCidr, 6, 8]]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-private-1"
        - Key: kubernetes.io/role/internal-elb
          Value: "1"

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [4, !Cidr [!Ref VpcCidr, 6, 8]]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-private-2"
        - Key: kubernetes.io/role/internal-elb
          Value: "1"

  PrivateSubnet3:
    Type: AWS::EC2::Subnet
    Condition: HasThreeAzs
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [2, !GetAZs ""]
      CidrBlock: !Select [5, !Cidr [!Ref VpcCidr, 6, 8]]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-private-3"
        - Key: kubernetes.io/role/internal-elb
          Value: "1"

  # --- public routing -------------------------------------------------------

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-public"

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet3RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: HasThreeAzs
    Properties:
      SubnetId: !Ref PublicSubnet3
      RouteTableId: !Ref PublicRouteTable

  # --- NAT ------------------------------------------------------------------

  NatEip1:
    Type: AWS::EC2::EIP
    Condition: HasNat
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-nat-1"

  NatGateway1:
    Type: AWS::EC2::NatGateway
    Condition: HasNat
    Properties:
      AllocationId: !GetAtt NatEip1.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-nat-1"

  NatEip2:
    Type: AWS::EC2::EIP
    Condition: HasNatPerAz
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-nat-2"

  NatGateway2:
    Type: AWS::EC2::NatGateway
    Condition: HasNatPerAz
    Properties:
      AllocationId: !GetAtt NatEip2.AllocationId
      SubnetId: !Ref PublicSubnet2
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-nat-2"

  NatEip3:
    Type: AWS::EC2::EIP
    Condition: HasNatInAz3
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-nat-3"

  NatGateway3:
    Type: AWS::EC2::NatGateway
    Condition: HasNatInAz3
    Properties:
      AllocationId: !GetAtt NatEip3.AllocationId
      SubnetId: !Ref PublicSubnet3
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-nat-3"

  # --- private routing ------------------------------------------------------
  #
  # One route table per AZ even in `single` mode. It costs nothing, and it means
  # switching to per-az later changes one route target instead of re-associating
  # every subnet.

  PrivateRouteTable1:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-private-1"

  PrivateRouteTable2:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-private-2"

  PrivateRouteTable3:
    Type: AWS::EC2::RouteTable
    Condition: HasThreeAzs
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-private-3"

  PrivateDefaultRoute1:
    Type: AWS::EC2::Route
    Condition: HasNat
    Properties:
      RouteTableId: !Ref PrivateRouteTable1
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway1

  PrivateDefaultRoute2:
    Type: AWS::EC2::Route
    Condition: HasNat
    Properties:
      RouteTableId: !Ref PrivateRouteTable2
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !If [HasNatPerAz, !Ref NatGateway2, !Ref NatGateway1]

  PrivateDefaultRoute3:
    Type: AWS::EC2::Route
    Condition: HasPrivateRouteInAz3
    Properties:
      RouteTableId: !Ref PrivateRouteTable3
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !If [HasNatPerAz, !Ref NatGateway3, !Ref NatGateway1]

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable1

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable2

  PrivateSubnet3RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: HasThreeAzs
    Properties:
      SubnetId: !Ref PrivateSubnet3
      RouteTableId: !Ref PrivateRouteTable3

  # --- endpoints ------------------------------------------------------------

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: ShouldCreateS3Endpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds: !If
        - HasThreeAzs
        - [!Ref PrivateRouteTable1, !Ref PrivateRouteTable2, !Ref PrivateRouteTable3, !Ref PublicRouteTable]
        - [!Ref PrivateRouteTable1, !Ref PrivateRouteTable2, !Ref PublicRouteTable]

  DynamoDbGatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: ShouldCreateDynamoDbEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.dynamodb"
      VpcEndpointType: Gateway
      RouteTableIds: !If
        - HasThreeAzs
        - [!Ref PrivateRouteTable1, !Ref PrivateRouteTable2, !Ref PrivateRouteTable3]
        - [!Ref PrivateRouteTable1, !Ref PrivateRouteTable2]

  InterfaceEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: HasInterfaceEndpoints
    Properties:
      GroupDescription: !Sub "HTTPS to PrivateLink endpoints in ${NamePrefix}"
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - Description: HTTPS from anywhere inside this VPC
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCidr
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-endpoints"

  # Interface endpoints are enumerated rather than taken as a list parameter.
  # CloudFormation cannot loop over a list to create N resources without the
  # AWS::LanguageExtensions transform, and that transform expands at deploy
  # time — which means cfn-lint cannot check the result and `describe-change-set`
  # shows you the unexpanded form. Six explicit resources are checkable; a loop
  # that only the service can evaluate is not.
  #
  # These are the endpoints that matter: with S3 + ECR + Logs, a Fargate service
  # runs in a VPC with NatGatewayMode=none.

  EcrApiEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: ShouldCreateEcrEndpoints
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ecr.api"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SecurityGroupIds: [!Ref InterfaceEndpointSecurityGroup]
      SubnetIds: !If
        - HasThreeAzs
        - [!Ref PrivateSubnet1, !Ref PrivateSubnet2, !Ref PrivateSubnet3]
        - [!Ref PrivateSubnet1, !Ref PrivateSubnet2]

  EcrDockerEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: ShouldCreateEcrEndpoints
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ecr.dkr"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SecurityGroupIds: [!Ref InterfaceEndpointSecurityGroup]
      SubnetIds: !If
        - HasThreeAzs
        - [!Ref PrivateSubnet1, !Ref PrivateSubnet2, !Ref PrivateSubnet3]
        - [!Ref PrivateSubnet1, !Ref PrivateSubnet2]

  LogsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: ShouldCreateLogsEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.logs"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SecurityGroupIds: [!Ref InterfaceEndpointSecurityGroup]
      SubnetIds: !If
        - HasThreeAzs
        - [!Ref PrivateSubnet1, !Ref PrivateSubnet2, !Ref PrivateSubnet3]
        - [!Ref PrivateSubnet1, !Ref PrivateSubnet2]

  SecretsManagerEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: ShouldCreateSecretsEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.secretsmanager"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SecurityGroupIds: [!Ref InterfaceEndpointSecurityGroup]
      SubnetIds: !If
        - HasThreeAzs
        - [!Ref PrivateSubnet1, !Ref PrivateSubnet2, !Ref PrivateSubnet3]
        - [!Ref PrivateSubnet1, !Ref PrivateSubnet2]

  SsmEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: ShouldCreateSsmEndpoints
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ssm"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SecurityGroupIds: [!Ref InterfaceEndpointSecurityGroup]
      SubnetIds: !If
        - HasThreeAzs
        - [!Ref PrivateSubnet1, !Ref PrivateSubnet2, !Ref PrivateSubnet3]
        - [!Ref PrivateSubnet1, !Ref PrivateSubnet2]

  # ECS Exec and Session Manager both need ssmmessages in addition to ssm; a
  # task that has one but not the other fails to open a session with an opaque
  # "TargetNotConnected".
  SsmMessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: ShouldCreateSsmEndpoints
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ssmmessages"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SecurityGroupIds: [!Ref InterfaceEndpointSecurityGroup]
      SubnetIds: !If
        - HasThreeAzs
        - [!Ref PrivateSubnet1, !Ref PrivateSubnet2, !Ref PrivateSubnet3]
        - [!Ref PrivateSubnet1, !Ref PrivateSubnet2]

  # --- flow logs ------------------------------------------------------------

  FlowLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: ShouldCreateFlowLogs
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/${Environment}/${NamePrefix}/vpc-flow-logs"
      RetentionInDays: !Ref FlowLogRetentionDays

  FlowLogRole:
    Type: AWS::IAM::Role
    Condition: ShouldCreateFlowLogs
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: vpc-flow-logs.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: publish-flow-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource: !Sub "${FlowLogGroup.Arn}:*"

  FlowLog:
    Type: AWS::EC2::FlowLog
    Condition: ShouldCreateFlowLogs
    Properties:
      ResourceId: !Ref Vpc
      ResourceType: VPC
      TrafficType: !Ref FlowLogTrafficType
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Ref FlowLogGroup
      DeliverLogsPermissionArn: !GetAtt FlowLogRole.Arn
      MaxAggregationInterval: 600

Outputs:
  VpcId:
    Description: ID of the VPC.
    Value: !Ref Vpc

  VpcCidrBlock:
    Description: IPv4 range of the VPC, for security group rules in other stacks.
    Value: !GetAtt Vpc.CidrBlock

  PublicSubnetIds:
    Description: Comma-separated public subnet IDs, for internet-facing load balancers.
    Value: !If
      - HasThreeAzs
      - !Join [",", [!Ref PublicSubnet1, !Ref PublicSubnet2, !Ref PublicSubnet3]]
      - !Join [",", [!Ref PublicSubnet1, !Ref PublicSubnet2]]

  PrivateSubnetIds:
    Description: Comma-separated private subnet IDs, for tasks, functions and databases.
    Value: !If
      - HasThreeAzs
      - !Join [",", [!Ref PrivateSubnet1, !Ref PrivateSubnet2, !Ref PrivateSubnet3]]
      - !Join [",", [!Ref PrivateSubnet1, !Ref PrivateSubnet2]]

  AvailabilityZones:
    Description: Comma-separated AZs this VPC spans.
    Value: !If
      - HasThreeAzs
      - !Join [",", [!GetAtt PublicSubnet1.AvailabilityZone, !GetAtt PublicSubnet2.AvailabilityZone, !GetAtt PublicSubnet3.AvailabilityZone]]
      - !Join [",", [!GetAtt PublicSubnet1.AvailabilityZone, !GetAtt PublicSubnet2.AvailabilityZone]]

  PrivateRouteTableIds:
    Description: Comma-separated private route table IDs, for adding peering or endpoint routes.
    Value: !If
      - HasThreeAzs
      - !Join [",", [!Ref PrivateRouteTable1, !Ref PrivateRouteTable2, !Ref PrivateRouteTable3]]
      - !Join [",", [!Ref PrivateRouteTable1, !Ref PrivateRouteTable2]]

  InterfaceEndpointSecurityGroupId:
    Description: Security group attached to the interface endpoints, when any were created.
    Condition: HasInterfaceEndpoints
    Value: !Ref InterfaceEndpointSecurityGroup

  HasNatGateway:
    Description: Whether private subnets have a default route to the internet.
    Value: !If [HasNat, "true", "false"]