AWSTemplateFormatVersion: '2010-09-09'
Description: 'CryptoTickerAPI: AWS AppSync GraphQL API for cryptocurrency ticker data with DynamoDB backend'
Resources:
  APIDataTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: APIDataTable
      AttributeDefinitions:
        - AttributeName: hk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: hk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: false
  CryptoTickerAPI:
    Type: AWS::AppSync::GraphQLApi
    Properties:
      Name: CryptoTickerAPI
      AuthenticationType: API_KEY
  AppSyncSchema:
    Type: AWS::AppSync::GraphQLSchema
    DependsOn: CryptoTickerAPI
    Properties:
      ApiId: !GetAtt CryptoTickerAPI.ApiId
      Definition: |
        type PriceRecord {
          ticker: String!
          price: Float!
          timestamp: String!
        }
        type PriceHistoryResult {
          items: [PriceRecord!]!
          nextToken: String
        }
        type TickerInfo {
          ticker: String!
          price: Float!
          timestamp: String!
        }
        type Query {
          ticker(ticker: String!): TickerInfo
          priceHistory(ticker: String!, limit: Int = 25, nextToken: String): PriceHistoryResult
        }
        schema {
          query: Query
        }
  AppSyncDynamoDBRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: appsync.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AppSyncDynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:Query
                Resource: !GetAtt APIDataTable.Arn
  AppSyncHTTPRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: appsync.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AppSyncHTTPAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sts:AssumeRole
                Resource: '*'
  DynamoDBDataSource:
    Type: AWS::AppSync::DataSource
    DependsOn:
      - CryptoTickerAPI
      - AppSyncDynamoDBRole
    Properties:
      ApiId: !GetAtt CryptoTickerAPI.ApiId
      Name: DynamoDBDataSource
      Type: AMAZON_DYNAMODB
      ServiceRoleArn: !GetAtt AppSyncDynamoDBRole.Arn
      DynamoDBConfig:
        TableName: !Ref APIDataTable
  CoinGeckoDataSource:
    Type: AWS::AppSync::DataSource
    DependsOn:
      - CryptoTickerAPI
      - AppSyncHTTPRole
    Properties:
      ApiId: !GetAtt CryptoTickerAPI.ApiId
      Name: CoinGeckoDataSource
      Type: HTTP
      ServiceRoleArn: !GetAtt AppSyncHTTPRole.Arn
      HttpConfig:
        Endpoint: https://api.coingecko.com/api/v3
  GetCoinGeckoPriceFunction:
    Type: AWS::AppSync::FunctionConfiguration
    DependsOn:
      - CryptoTickerAPI
      - CoinGeckoDataSource
    Properties:
      ApiId: !GetAtt CryptoTickerAPI.ApiId
      DataSourceName: CoinGeckoDataSource
      Name: GetCoinGeckoPriceFunction
      FunctionVersion: '2018-05-29'
      RequestMappingTemplate: |
        {
          "version": "2018-05-29",
          "method": "GET",
          "params": {
            "query": {
              "ids": "$context.arguments.ticker",
              "vs_currencies": "usd"
            }
          },
          "resourcePath": "/simple/price"
        }
      ResponseMappingTemplate: |
        #set($result = $util.parseJson($context.result.body))
        #if ($result.containsKey($context.arguments.ticker))
          #set($priceData = $result.get($context.arguments.ticker))
          #if ($priceData.containsKey("usd"))
            $util.toJson({
              "ticker": "$context.arguments.ticker",
              "price": $util.toJson($priceData.usd),
              "timestamp": "$util.time.nowISO8601()"
            })
          #else
            $util.error("USD price not available for ticker", "PRICE_NOT_FOUND")
          #end
        #else
          $util.error("Ticker not found on CoinGecko", "TICKER_NOT_FOUND")
        #end
  SavePriceToDynamoDBFunction:
    Type: AWS::AppSync::FunctionConfiguration
    DependsOn:
      - CryptoTickerAPI
      - DynamoDBDataSource
    Properties:
      ApiId: !GetAtt CryptoTickerAPI.ApiId
      DataSourceName: DynamoDBDataSource
      Name: SavePriceToDynamoDBFunction
      FunctionVersion: '2018-05-29'
      RequestMappingTemplate: |
        {
          "version": "2018-05-29",
          "operation": "PutItem",
          "key": {
            "hk": { "S": "$context.prev.result.ticker" },
            "sk": { "S": "$context.prev.result.timestamp" }
          },
          "attributeValues": {
            "ticker": { "S": "$context.prev.result.ticker" },
            "price": { "N": "$context.prev.result.price" },
            "timestamp": { "S": "$context.prev.result.timestamp" }
          }
        }
      ResponseMappingTemplate: |
        {
          "ticker": "$context.result.ticker.S",
          "price": $context.result.price.N,
          "timestamp": "$context.result.timestamp.S"
        }
  TickerResolver:
    Type: AWS::AppSync::Resolver
    DependsOn:
      - CryptoTickerAPI
      - AppSyncSchema
      - GetCoinGeckoPriceFunction
      - SavePriceToDynamoDBFunction
    Properties:
      ApiId: !GetAtt CryptoTickerAPI.ApiId
      TypeName: Query
      FieldName: ticker
      Kind: PIPELINE
      PipelineConfig:
        Functions:
          - !GetAtt GetCoinGeckoPriceFunction.FunctionId
          - !GetAtt SavePriceToDynamoDBFunction.FunctionId
      RequestMappingTemplate: |
        {
          "version": "2018-05-29"
        }
      ResponseMappingTemplate: |
        $util.toJson($context.result)