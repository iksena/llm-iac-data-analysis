  # API Gateway Stage Variables
  EmailDistributionAPIStage:
    Type: AWS::ApiGateway::Stage
    Metadata:
      Comment: >-
        X-Ray tracing is out of scope for this sample. The stage already emits
        access logs, INFO-level method logs and CloudWatch metrics. Response
        caching is intentionally disabled because this API mutates state.
      checkov:
        skip:
          - id: CKV_AWS_73
            comment: X-Ray out of scope; access logging, method logging and metrics are enabled.
      guard:
        SuppressedRules:
          - API_GW_CACHE_ENABLED_AND_ENCRYPTED
    Properties:
      RestApiId: !Ref EmailDistributionAPI
      StageName: !Ref ApiGatewayStageName
      # Must track the Deployment logical ID, which is bumped whenever the API
      # definition changes. See the comment on that resource.
      DeploymentId: !Ref EmailDistributionAPIDeploymentV2
      Variables:
        recipientsBucket: !Ref RecipientsBucket
      CacheClusterEnabled: false
      AccessLogSetting:
        DestinationArn: !GetAtt ApiGatewayLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","caller":"$context.identity.caller","user":"$context.identity.user","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","resourcePath":"$context.resourcePath","status":"$context.status","protocol":"$context.protocol","responseLength":"$context.responseLength","responseTime":"$context.responseTime","error":"$context.error.message","integrationError":"$context.integration.error","integrationStatus":"$context.integration.status","integrationLatency":"$context.integration.latency","integrationRequestId":"$context.integration.requestId","userAgent":"$context.identity.userAgent"}'
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          LoggingLevel: INFO
          DataTraceEnabled: true
          MetricsEnabled: true

  # WAF Association with API Gateway
  ApiGatewayWebACLAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    DependsOn: EmailDistributionAPIStage
    Properties:
      ResourceArn: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}::/restapis/${EmailDistributionAPI}/stages/${ApiGatewayStageName}"
      WebACLArn: !GetAtt ApiGatewayWebACL.Arn

  # API Gateway Account (for CloudWatch Logs)
  ApiGatewayAccount:
    Type: AWS::ApiGateway::Account
    Properties:
      CloudWatchRoleArn: !GetAtt ApiGatewayCloudWatchRole.Arn

  # IAM Role for API Gateway CloudWatch Logs
  ApiGatewayCloudWatchRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs

  ###############################
  # API Gateway Deployment
  #
  # !!! BUMP THE LOGICAL ID BELOW WHENEVER THE API DEFINITION CHANGES !!!
  #
  # An API Gateway deployment is an immutable snapshot of the API taken when the
  # resource is created. CloudFormation only creates a new snapshot when this
  # resource's own logical ID changes: editing the RestApi 'Body' above leaves this
  # resource identical, so CloudFormation makes no change and the stage carries on
  # serving the previous snapshot. The symptom is a deploy that reports success while
  # the live API still lacks the new route - a preflight rejecting the new method with
  # "not allowed by Access-Control-Allow-Methods" is the usual first sign.
  #
  # Note that adding a version marker to Description does NOT work: Description is an
  # in-place update ("no interruption"), so it mutates the existing deployment's
  # description without producing a new snapshot.
  #
  # So: any time a path, method, integration or CORS header in the Body above is
  # changed, increment the V<n> suffix here and in the Stage's DeploymentId. That is
  # the same mechanism the CDK automates by hashing the API model into this logical ID.
  #
  # V2: added PUT /campaigns/{campaignId} for editing a campaign's name.
  ###############################
  EmailDistributionAPIDeploymentV2:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - ApiGatewayAccount
      - GatewayResponseDefault4XX
      - GatewayResponseDefault5XX
    Properties:
      RestApiId: !Ref EmailDistributionAPI
      Description: !Sub "${ApiGatewayStageName} deployment"

  # Gateway Responses — ensures CORS headers on API Gateway-level errors
  # (WAF blocks, auth failures, throttling, etc.)
  GatewayResponseDefault4XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref EmailDistributionAPI
      ResponseType: DEFAULT_4XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,Accept'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,DELETE,OPTIONS'"

  GatewayResponseDefault5XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref EmailDistributionAPI
      ResponseType: DEFAULT_5XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,Accept'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,DELETE,OPTIONS'"

