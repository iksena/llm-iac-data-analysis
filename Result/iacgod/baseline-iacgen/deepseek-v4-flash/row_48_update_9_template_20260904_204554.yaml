AWSTemplateFormatVersion: "2010-09-09"
Description: >
  AWS FIS Cross-Region Disruption Experiment Template – Chaos engineering stack that
  creates a fault injection simulator experiment targeting transit gateways, subnets,
  S3 buckets, and DynamoDB global tables tagged with ChaosAllowed=true.
Parameters:
  ExperimentDuration:
    Type: Number
    Default: 1200
    Description: Duration in seconds for each FIS action (default 20 minutes).
  ChaosTagValue:
    Type: String
    Default: true
    AllowedValues:
      - true
    Description: Tag value used to select resources (ChaosAllowed=true).
  LogGroupRetention:
    Type: Number
    Default: 7
    Description: Retention period in days for the CloudWatch Log Group.
Resources:
  FisKmsKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: KMS key for encrypting FIS experiment CloudWatch logs.
      KeyPolicy:
        Version: 2012-10-17
        Statement:
          - Sid: EnableRootManage
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: "*"
          - Sid: AllowCloudWatchLogsService
            Effect: Allow
            Principal:
              Service: !Sub logs.${AWS::Region}.amazonaws.com
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*              - kms:DescribeKey
            Resource: "*"
      Enabled: true
      KeySpec: SYMMETRIC_DEFAULT
      KeyUsage: ENCRYPT_DECRYPT
      MultiRegion: false
      PendingWindowInDays: 7
      Tags:
        - Key: ChaosAllowed          Value: true
        - Key: Name          Value: !Sub fis-kms-key-${AWS::StackName}
  FisKmsAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/fis-logs-${AWS::StackName}
      TargetKeyId: !Ref FisKmsKey
  FisLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/fis/${AWS::StackName}
      RentionInDays: !Ref LogGroupRetention
      KmsKeyId: !GetAtt FisKmsKey.Arn
      Tags:
        - Key: ChaosAllowed
          Value: true
        - Key: Name
          Value: !Sub fis-log-group-${AWS::StackName}
  FisRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub fis-experiment-role-${AWS::StackName}
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: fis.amazonaws.com
            Action: sts:AssumeRole      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSFaultInjectionSimulatroEC2Access
        - arn:aws:iam::aws:policy/AWSFaultInjectionSimulatroNetworkAccess
        - arn:aws:iam::aws:policy/AWSFaultInjectionSimulatroSSMAutomationAccess
      Policies:
        - PolicyName: fis-custom-disruption-policy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Sid: AllowTransitGatewayDisruption
                Effect: Allow
                Action:
                  - ec2:CreateTransitGatewayRoute
                  - ec2:DeleteTransitGatewayRoute
                  - ec2:ReplaceTransitGatewayRoute
                  - ec2:EnableTransitGatewayRouteTablePropagation
                  - ec2:DisableTransitGatewayRouteTablePropagation
                  - ec2:SearchTransitGatewayRoutes
                  - ec2:GetTransitGatewayRouteTableAssociations
                  - ec2:GetTransitGatewayRouteTablePropagations
                  - ec2:ModifyTransitGatewayVpcAttachment
                  - ec2:DescribeTransitGatewayVpcAttachments
                  - ec2:DescribeTransitGatewayRouteTables
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/ChaosAllowed: !Ref ChaosTagValue
              - Sid: AllowSubnetDisruption
                Effect: Allow
                Action:
                  - ec2:DescribeRouteTables
                  - ec2:CreateRoute
                  - ec2:ReplaceRoute
                  - ec2:DeleteRoute
                  - ec2:DisassociateRouteTable
                  - ec2:AssociateRouteTable
                  - ec2:DescribeSubnets
                  - ec2:DescribeNetworkInterfaces
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/ChaosAllowed: !Ref ChaosTagValue
              - Sid: AllowS3ReplicationPause
                Effect: Allow
                Action:
                  - s3:GetReplicationConfiguration
                  - s3:PutReplicationConfiguratrion
                  - s3:GetBucketVersioning
                  - s3:GetBucketLocation
                  - s3:ListBucket
                  - s3:GetBucketTagging
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/ChaosAllowed: !Ref ChaosTagValue
              - Sid: AllowDynamoDBReplicationPause
                Effect: Allow
                Action:
                  - dynamodb:DescribeGlobalTable
                  - dynamodb:UpdaeGlobalTable
                  - dynamodb:DescribeTable
                  - dynamodb:ListTagsOfResource                  - dynamodb:DescribeContinuousBackups
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/ChaosAllowed: !Ref ChaosTagValue
              - Sid: AllowCloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                Resource: !GetAtt FisLogGroup.Arn
              - Sid: AllowKMSDecryptForLogs
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                  - kms:DescribeKey
                Resource: !GetAtt FisKmsKey.Arn
              - Sid: AllowFISReadActions
                Effect: Allow
                Action:
                  - fis:GetExperiment
                  - fis:ListExperiments
                  - fis:ListExperimentTemplates
                  - fis:GetExperimentTemplate
                  - fis:ListTagsForResource
                Resource: "*"
      Tags:
        - Key: ChaosAllowed          Value: true
        - Key: Name
          Value: !Sub fis-role-${AWS::StackName}
  FisExperimentTemplate:
    Type: AWS::FIS::ExperimentTemplate
    Properties:
      Description: >
        Chaos engineering experiment that disrupts cross-region network connectivity
        by targeting transit gateways and subnets, and pauses replication for S3 buckets
        and DynamoDB global tables. Only resources tagged with ChaosAllowed=true are
        affected.
      Targets:
        TransitGatewayTarget:
          Resourcetype: aws:ec2:transit-gateway
          ResourcTags:
            chaosAllowed: !Ref ChaosTagValue
          SelectonMode: ALL
        SubnetTarget:
          Resourcetype: aws:ec2:subnet
          ResourcTags:
            chaosAllowed: !Ref ChaosTagValue
          SelectionMode: ALL
        S3BucketTarget:
          ResourcType: aws:s3:bucket
          ResourcTags:
            chaosAllowed: !Ref ChaosTAgValue
          SelectionMode: ALL
        DyanmoDBTableTarget:
          ResourcType: aws:dynamodb:table
          ResourcTags:
            chaosAllowed: !Ref ChaosTagValue
          SelectionMode: ALL
      Actions:
        TransitGatewayDisruption:
          ActionId: aws:ec2:transit-gateway-route-table-modify
          Description: Disrupts transit gateway route tables to break cross-region connectivity.
          Parameters:
            duration: !Ref ExperimentDuration
          Targets:
            TransitGateways: TransitGatewayTarget
        SubnetDisruption:
          ActionId: aws:ec2:disrupt-route-table
          Description: Disrupts subnet route tables to break local network paths.
          Parameters:
            duration: !Ref ExperimentDuration
          Targets:
            Subnets: SubnetTarget
        S3ReplicationPause:
          ActionId: aws:s3:pause-replication
          Description: Pauses S3 cross-region replication for tagged buckets.
          Parameters:
            duration: !Ref ExperimentDuration
          Targets:
            Buckets: S3BucketTarget
        DynamoDBReplicationPause:
          ActionId: aws:dynamodb:pause-replication
          Description: Pauses DynamoDB global table replication for tagged tables.
          Parameters:
            duration: !Ref ExperimentDuration
          Targets:
            Tables: DynamoDBTableTarget
      StopConditons:
        - Source: none
      RoleArn: !GetAtt FisRole.Arn
      ExperimentOptions:
        EmptyTargetResoutionMode: skip      LogConfiguration:
        CloudWatchLogsConfiguraton:
          LogGroupArn: !GetAtt FisLogGroup.Arn
        LogSchemaVersin: 1
      Tags:
        chaosAllowed: !Ref ChaosTagValue
        Name: !Sub fis-experiment-${AWS::StackName}
Outputs:
  ExperimentTemplateId:
    Description: The ID of the FIS experiment template.
    Value: !Ref FisExperimentTemplate
  FisRoleArn:
    Description: The ARN of the IAM role used by FIS.
    Value: !GetAtt FisRole.Arn  KmsKeyId:
    Description: The ID of the KMS key used for log encryption.
    Value: !Ref FisKmsKey
  LogGroupName:
    Description: The name of the CloudWatch log group for experiment logs.
    Value: !Ref FisLogGroup