AWSTemplateFormatVersion: "2010-09-09"
Parameters:
  ProjectName:
    Type: String
    Default: emr-celeborn-demo
    Description: Project name used for naming resources
  KubernetesVersion:
    Type: String
    Default: "1.30"
    Description: "EKS cluster Kubernetes version (supported versions: 1.30, 1.29, 1.28, etc.)"
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    Description: CIDR block for the VPC
  PrivateSubnet1Cidr:
    Type: String
    Default: 10.0.1.0/24
    Description: CIDR for private subnet 1
  PrivateSubnet2Cidr:
    Type: String
    Default: 10.0.2.0/24
    Description: CIDR for private subnet 2
  PublicSubnet1Cidr:
    Type: String
    Default: 10.0.101.0/24
    Description: CIDR for public subnet 1 (for NAT gateway)
  PublicSubnet2Cidr:
    Type: String
    Default: 10.0.102.0/24
    Description: CIDR for public subnet 2 (for NAT gateway)
  GeneralNodeInstanceType:
    Type: String
    Default: m5.xlarge
    Description: EC2 instance type for general node group
  SparkNodeInstanceType:
    Type: String
    Default: r5.2xlarge
    Description: EC2 instance type for Spark node group
  GeneralNodeMinDesiredSize:
    Type: Number
    Default: 2
    Description: Minimum and desired size for general node group
  GeneralNodeMaxSize:
    Type: Number
    Default: 3
    Description: Maximum size for general node group
  SparkNodeMinDesiredSize:
    Type: Number
    Default: 3
    Description: Minimum and desired size for Spark node group
  SparkNodeMaxSize:
    Type: Number
    Default: 6
    Description: Maximum size for Spark node group
  DiskSizeGB:
    Type: Number
    Default: 50
    Description: Disk size in GB for node group instances
  AmiType:
    Type: String
    Default: AL2023_x86_64_STANDARD
    Description: AMI type for node groups (AL2023 standard)
Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-vpc"
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-igw"
  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-public-subnet-1"
        - Key: kubernetes.io/role/elb
          Value: "1"
  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-public-subnet-2"
        - Key: kubernetes.io/role/elb
          Value: "1"
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-private-subnet-1"
        - Key: kubernetes.io/role/internal-elb
          Value: "1"
  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-private-subnet-2"
        - Key: kubernetes.io/role/internal-elb
          Value: "1"
  ElasticIP1:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
  ElasticIP2:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
  NatGateway1:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt ElasticIP1.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-nat-gateway-1"
  NatGateway2:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt ElasticIP2.AllocationId
      SubnetId: !Ref PublicSubnet2
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-nat-gateway-2"
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-public-rtb"
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable
  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable
  PrivateRouteTable1:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-private-rtb-1"
  PrivateRouteTable2:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-private-rtb-2"
  PrivateRoute1:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable1
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway1
  PrivateRoute2:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable2
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway2
  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable1
  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable2
  EksClusterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-eks-cluster-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy
  EmrClusterSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for EMR on EKS jobs
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-emr-cluster-sg"
  EmrCelebornAccessSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for EMR Celeborn access
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-emr-celeborn-access-sg"
  EmrClusterSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref EmrClusterSecurityGroup
      IpProtocol: "-1"
      SourceSecurityGroupId: !Ref EmrClusterSecurityGroup
      Description: Allow all traffic from self
  EmrClusterSecurityGroupIngressFromCeleborn:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref EmrClusterSecurityGroup
      IpProtocol: "-1"
      SourceSecurityGroupId: !Ref EmrCelebornAccessSecurityGroup
      Description: Allow all traffic from Celeborn access SG
  EmrCelebornAccessSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref EmrCelebornAccessSecurityGroup
      IpProtocol: "-1"
      SourceSecurityGroupId: !Ref EmrClusterSecurityGroup
      Description: Allow all traffic from EMR cluster SG
  EksCluster:
    Type: AWS::EKS::Cluster
    Properties:
      Name: !Sub "${ProjectName}-cluster"
      RoleArn: !GetAtt EksClusterRole.Arn
      Version: !Ref KubernetesVersion
      ResourcesVpcConfig:
        SubnetIds:
          - !Ref PrivateSubnet1
          - !Ref PrivateSubnet2
        SecurityGroupIds:
          - !Ref EmrClusterSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-cluster"
  NodeGroupRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-node-group-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
  EbsCsiDriverRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-ebs-csi-driver-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Join
                - ""
                - - "arn:aws:iam::"
                  - !Ref AWS::AccountId
                  - ":oidc-provider/"
                  - !Select [1, !Split ["https://", !GetAtt EksCluster.OpenIdConnectIssuerUrl]]
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "oidc.eks:aud": "sts.amazonaws.com"
                "oidc.eks:sub": "system:serviceaccount:kube-system:ebs-csi-controller-sa"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEBSCSIDriverPolicy
  NodeLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "${ProjectName}-node-launch-template"
      LaunchTemplateData:
        BlockDeviceMappings:
          - DeviceName: "/dev/xvda"
            Ebs:
              VolumeSize: !Ref DiskSizeGB
              VolumeType: gp3
        SecurityGroupIds:
          - !GetAtt EksCluster.ClusterSecurityGroupId
          - !Ref EmrClusterSecurityGroup
          - !Ref EmrCelebornAccessSecurityGroup
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub "${ProjectName}-managed-node"
          - ResourceType: volume
            Tags:
              - Key: Name
                Value: !Sub "${ProjectName}-node-volume"
  GeneralNodeGroup:
    Type: AWS::EKS::Nodegroup
    Properties:
      ClusterName: !Ref EksCluster
      NodegroupName: !Sub "${ProjectName}-general-nodegroup"
      NodeRole: !GetAtt NodeGroupRole.Arn
      Subnets:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      InstanceTypes:
        - !Ref GeneralNodeInstanceType
      ScalingConfig:
        MinSize: !Ref GeneralNodeMinDesiredSize
        DesiredSize: !Ref GeneralNodeMinDesiredSize
        MaxSize: !Ref GeneralNodeMaxSize
      AmiType: !Ref AmiType
      LaunchTemplate:
        Id: !Ref NodeLaunchTemplate
        Version: "$Default"
      Labels:
        role: general
      Tags:
        Name: !Sub "${ProjectName}-general-nodegroup"
  SparkNodeGroup:
    Type: AWS::EKS::Nodegroup
    Properties:
      ClusterName: !Ref EksCluster
      NodegroupName: !Sub "${ProjectName}-spark-nodegroup"
      NodeRole: !GetAtt NodeGroupRole.Arn
      Subnets:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      InstanceTypes:
        - !Ref SparkNodeInstanceType
      ScalingConfig:
        MinSize: !Ref SparkNodeMinDesiredSize
        DesiredSize: !Ref SparkNodeMinDesiredSize
        MaxSize: !Ref SparkNodeMaxSize
      AmiType: !Ref AmiType
      LaunchTemplate:
        Id: !Ref NodeLaunchTemplate
        Version: "$Default"
      Labels:
        role: spark
      Taints:
        - Key: spark
          Value: executor
          Effect: NO_SCHEDULE
      Tags:
        Name: !Sub "${ProjectName}-spark-nodegroup"
Outputs:
  GeneralNodeGroupName:
    Description: Name of the general node group
    Value: !Ref GeneralNodeGroup
  SparkNodeGroupName:
    Description: Name of the Spark node group
    Value: !Ref SparkNodeGroup
  EbsCsiDriverRoleName:
    Description: Name of the IAM role for EBS CSI driver (for IRSA)
    Value: !Ref EbsCsiDriverRole