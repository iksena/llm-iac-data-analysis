AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  Application Load Balancer with a security group, an HTTPS listener, HTTP-to-
  HTTPS redirection, optional access logs and WAF, and a deny-by-default listener
  that services attach rules to.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Naming
        Parameters:
          - NamePrefix
          - Environment
      - Label:
          default: Placement
        Parameters:
          - VpcId
          - SubnetIds
          - Scheme
          - IngressCidr
      - Label:
          default: TLS
        Parameters:
          - CertificateArn
          - SslPolicy
          - RedirectHttpToHttps
      - Label:
          default: Behaviour
        Parameters:
          - IdleTimeoutSeconds
          - EnableHttp2
          - DesyncMitigationMode
          - EnableDeletionProtection
      - Label:
          default: Access logs and WAF
        Parameters:
          - AccessLogsBucket
          - AccessLogsPrefix
          - WebAclArn

Parameters:
  NamePrefix:
    Type: String
    Description: Prefix for the load balancer and security group names.
    AllowedPattern: "^[a-z][a-z0-9-]{1,30}[a-z0-9]$"
    ConstraintDescription: 3-32 lowercase characters, digits and hyphens.

  Environment:
    Type: String
    Description: Environment this load balancer serves.
    Default: dev
    AllowedValues: [dev, staging, prod]

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC the load balancer and its security group live in.

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >-
      At least two subnets in different AZs - the ALB service requires it. Use
      public subnets for an internet-facing scheme and private subnets for an
      internal one.

  Scheme:
    Type: String
    Description: >-
      internet-facing gets public IPs and must sit in public subnets. internal is
      reachable only from inside the VPC (and anything peered to it).
    Default: internet-facing
    AllowedValues: [internet-facing, internal]

  IngressCidr:
    Type: String
    Description: >-
      Source range allowed to reach ports 80 and 443. 0.0.0.0/0 is correct for a
      public site; narrow it for an internal load balancer or an admin surface.
    Default: 0.0.0.0/0
    AllowedPattern: "^(\\d{1,3}\\.){3}\\d{1,3}/\\d{1,2}$"

  CertificateArn:
    Type: String
    Description: >-
      ACM certificate ARN for the HTTPS listener. Leave empty to serve plain HTTP
      only - acceptable for a scratch environment, never for anything handling a
      cookie or a credential.
    Default: ""

  SslPolicy:
    Type: String
    Description: >-
      Negotiation policy for the HTTPS listener. The default supports TLS 1.3 and
      1.2 only; the -Res- variants additionally drop the weaker 1.2 cipher suites
      at the cost of very old client support.
    Default: ELBSecurityPolicy-TLS13-1-2-2021-06
    AllowedValues:
      - ELBSecurityPolicy-TLS13-1-2-2021-06
      - ELBSecurityPolicy-TLS13-1-2-Res-2021-06
      - ELBSecurityPolicy-TLS13-1-3-2021-06
      - ELBSecurityPolicy-FS-1-2-Res-2020-10

  RedirectHttpToHttps:
    Type: String
    Description: >-
      Make port 80 issue a 301 to HTTPS instead of serving content. Only takes
      effect when a certificate is supplied.
    Default: "true"
    AllowedValues: ["true", "false"]

  IdleTimeoutSeconds:
    Type: Number
    Description: >-
      How long an idle connection is held open. Raise it above your slowest
      endpoint's response time - an LLM streaming response or a long report can
      exceed the 60s default and surface as a 504 with no backend error.
    Default: 60
    MinValue: 1
    MaxValue: 4000

  EnableHttp2:
    Type: String
    Description: >-
      HTTP/2 for clients. Note this is separate from backend protocol: gRPC
      services need the target group's ProtocolVersion set to GRPC, which
      containers/fargate-service exposes.
    Default: "true"
    AllowedValues: ["true", "false"]

  DesyncMitigationMode:
    Type: String
    Description: >-
      How strictly to reject ambiguous HTTP requests. `defensive` blocks the
      known request-smuggling shapes while tolerating merely non-compliant
      clients; `strictest` rejects anything non-compliant.
    Default: defensive
    AllowedValues: [defensive, strictest, monitor]

  EnableDeletionProtection:
    Type: String
    Description: >-
      Refuse to delete the load balancer. Worth turning on in prod: deleting an
      ALB releases its DNS name, and anything with that name cached keeps
      resolving to nothing.
    Default: "false"
    AllowedValues: ["true", "false"]

  AccessLogsBucket:
    Type: String
    Description: >-
      S3 bucket for access logs. The bucket policy must already allow ELB log
      delivery - see the README. Leave empty to disable.
    Default: ""

  AccessLogsPrefix:
    Type: String
    Description: Key prefix within the access log bucket.
    Default: alb

  WebAclArn:
    Type: String
    Description: >-
      WAFv2 web ACL ARN to associate, from networking/waf-web-acl. Leave empty
      for none.
    Default: ""

Conditions:
  HasCertificate: !Not [!Equals [!Ref CertificateArn, ""]]
  ShouldRedirect: !And [!Condition HasCertificate, !Equals [!Ref RedirectHttpToHttps, "true"]]
  HasAccessLogs: !Not [!Equals [!Ref AccessLogsBucket, ""]]
  HasWebAcl: !Not [!Equals [!Ref WebAclArn, ""]]

Resources:
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "Ingress to the ${NamePrefix} load balancer (${Environment})"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - Description: HTTP from the allowed source range
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref IngressCidr
        - Description: HTTPS from the allowed source range
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref IngressCidr
      # Egress is deliberately not declared. CloudFormation only omits the
      # default allow-all egress rule when SecurityGroupEgress is present, and an
      # ALB must reach its targets on whatever port they listen on — which this
      # template does not know. The target's security group is where ingress is
      # actually restricted, and containers/fargate-service scopes it to this
      # group.
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-alb"

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${NamePrefix}-${Environment}"
      Type: application
      Scheme: !Ref Scheme
      IpAddressType: ipv4
      Subnets: !Ref SubnetIds
      SecurityGroups:
        - !Ref SecurityGroup
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: !Ref IdleTimeoutSeconds
        - Key: routing.http2.enabled
          Value: !Ref EnableHttp2
        - Key: routing.http.desync_mitigation_mode
          Value: !Ref DesyncMitigationMode
        - Key: deletion_protection.enabled
          Value: !Ref EnableDeletionProtection
        # Strips headers that leak the ALB's own identity and the backend's.
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
        - Key: access_logs.s3.enabled
          Value: !If [HasAccessLogs, "true", "false"]
        - Key: access_logs.s3.bucket
          Value: !If [HasAccessLogs, !Ref AccessLogsBucket, !Ref "AWS::NoValue"]
        - Key: access_logs.s3.prefix
          Value: !If [HasAccessLogs, !Ref AccessLogsPrefix, !Ref "AWS::NoValue"]

  # Port 80. With a certificate it redirects; without one it serves the same
  # deny-by-default 404 as the HTTPS listener.
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - !If
          - ShouldRedirect
          - Type: redirect
            RedirectConfig:
              Protocol: HTTPS
              Port: "443"
              Host: "#{host}"
              Path: /#{path}
              Query: "#{query}"
              StatusCode: HTTP_301
          - Type: fixed-response
            FixedResponseConfig:
              StatusCode: "404"
              ContentType: text/plain
              MessageBody: No route matched.

  # The default action is a 404, not a forward. A load balancer whose default
  # action forwards to some service means every unmatched host and path lands
  # there — including scanner traffic and requests for services that have been
  # removed. Services attach their own ListenerRule with a host or path
  # condition; nothing reaches a backend by accident.
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: !Ref SslPolicy
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: "404"
            ContentType: text/plain
            MessageBody: No route matched.

  WebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Condition: HasWebAcl
    Properties:
      ResourceArn: !Ref LoadBalancer
      WebACLArn: !Ref WebAclArn

Outputs:
  LoadBalancerArn:
    Description: ARN of the load balancer.
    Value: !Ref LoadBalancer

  LoadBalancerDnsName:
    Description: >-
      DNS name to point a Route 53 alias record at. Do not hand this out
      directly - it changes if the load balancer is replaced.
    Value: !GetAtt LoadBalancer.DNSName

  LoadBalancerFullName:
    Description: >-
      Full name (app/<name>/<id>). Application Auto Scaling needs this, combined
      with a target group's full name, to build the ALBRequestCountPerTarget
      resource label — request-based scaling cannot be configured without it.
    Value: !GetAtt LoadBalancer.LoadBalancerFullName

  LoadBalancerHostedZoneId:
    Description: Canonical hosted zone ID, required by a Route 53 alias record.
    Value: !GetAtt LoadBalancer.CanonicalHostedZoneID

  SecurityGroupId:
    Description: >-
      Security group of the load balancer. A service's own security group should
      allow ingress from this group and nothing else.
    Value: !Ref SecurityGroup

  HttpListenerArn:
    Description: ARN of the port 80 listener.
    Value: !Ref HttpListener

  HttpsListenerArn:
    Description: >-
      ARN of the port 443 listener, when a certificate was supplied. This is what
      a service attaches its ListenerRule to.
    Condition: HasCertificate
    Value: !Ref HttpsListener

  ListenerArn:
    Description: >-
      The listener a service should attach rules to - HTTPS when a certificate
      exists, HTTP otherwise. Wire this into fargate-service's ListenerArn so the
      service does not need to know which one exists.
    Value: !If [HasCertificate, !Ref HttpsListener, !Ref HttpListener]