AWSTemplateFormatVersion: '2010-09-09'
Parameters:
  StageName:
    Type: String
    Default: api
    Description: The stage name for the WebSocket API.
Resources:
  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub 'WebSocket-${AWS::StackName}'
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: $request.body.action
  ApiGatewayRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StartStateMachine
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !GetAtt StateMachine.Arn
  WebSocketIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:states:action/StartExecution'
      CredentialsArn: !GetAtt ApiGatewayRole.Arn
      RequestTemplates:
        application/json: !Sub |
          {
            "input": "{\"connectionId\":\"$context.connectionId\",\"message\":\"$util.escapeJavaScript($input.body)\",\"domainName\":\"$context.domainName\",\"stage\":\"$context.stage\"}",
            "stateMachineArn": "${StateMachine}"
          }
      TemplateSelectionExpression: $default
  WebSocketRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $default
      Target: !Join ['/', ['integrations', !Ref WebSocketIntegration]]
  WebSocketDeployment:
    Type: AWS::ApiGatewayV2::Deployment
    DependsOn:
      - WebSocketRoute
    Properties:
      ApiId: !Ref WebSocketApi
  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WebSocketApi
      StageName: !Ref StageName
      DeploymentId: !Ref WebSocketDeployment
  StateMachineExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PostToConnection
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: execute-api:ManageConnections
                Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/${StageName}/POST/@connections/*'
  StateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub 'WebSocketResponse-${AWS::StackName}'
      StateMachineType: STANDARD
      DefinitionString: |
        {
          "Comment": "WebSocket response state machine",
          "StartAt": "WaitFiveSeconds",
          "States": {
            "WaitFiveSeconds": {
              "Type": "Wait",
              "Seconds": 5,
              "Next": "SendResponse"
            },
            "SendResponse": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:apigatewaymanagementapi:postToConnection",
              "Parameters": {
                "ConnectionId.$": "$.connectionId",
                "Data.$": "$.message",
                "ApiEndpoint": "https://{}.{}"
              },
              "End": true
            }
          }
        }
      RoleArn: !GetAtt StateMachineExecutionRole.Arn
Outputs:
  WebSocketApiId:
    Description: WebSocket API ID
    Value: !Ref WebSocketApi
  WebSocketEndpoint:
    Description: WebSocket API endpoint URL
    Value: !Sub 'wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}'
  StageName:
    Description: Stage name
    Value: !Ref StageName