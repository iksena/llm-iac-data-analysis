AWSTemplateFormatVersion: "2010-09-09"
Description: "Nginx Service"

Parameters:

    SpringCloudConfigLabel:
       Description: The branch of the config environment to use
       Type: String

    LoadbalancerDNS:
        Type: String

    SpringProfilesActive:
        Type: String

    NginxImageVersion:
        Type: String

    NginxCustomImage:
      Description: A custom image to be used
      Type: String

Conditions:
    CustomImageProvided: !Not [ !Equals [ "", !Ref NginxCustomImage ] ]

Resources:
    TaskDefinition:
        Type: AWS::ECS::TaskDefinition
        Properties:
            Family: ixortalk-nginx-external
            ContainerDefinitions:
                - Name: ixortalk-nginx-external
                  Image: !If [CustomImageProvided, !Ref NginxCustomImage, !Sub "ixortalk/ixortalk-nginx-docker-proxy:${NginxImageVersion}"]
                  Hostname: ixortalk-nginx-external
                  Memory: 64
                  Environment:
                  - Name: "IXORTALK_NGINX_PROFILE"
                    Value: !Ref SpringProfilesActive
                  - Name: "IXORTALK_CONFIG_SERVER_LABEL"
                    Value: !Ref SpringCloudConfigLabel
                  - Name: "IXORTALK_NGINX_ENABLE_BASIC_AUTH"
                    Value: 'false'
                  - Name: "IXORTALK_CONFIG_SERVER_URL"
                    Value: !Sub http://${LoadbalancerDNS}/config
                  - Name: "IXORTALK_NGINX_SUFFIX"
                    Value: external
                  PortMappings:
                    - ContainerPort: 80
                  LogConfiguration:
                    LogDriver: awslogs
                    Options:
                        awslogs-group: nginx-external-logs
                        awslogs-region: !Ref AWS::Region

    CloudWatchLogsGroup:
        Type: AWS::Logs::LogGroup
        Properties:
            LogGroupName: nginx-external-logs
            RetentionInDays: 365

Outputs:
    TaskDefinition:
        Value: !Ref TaskDefinition