Description: |
  This template will create a lambda function and an associated lambda
  version with added API Gateway to trigger the lambda function

Resources:
  # A lambda role to be used by the lambda function
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: LambdaRole
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole

  # A lambda function that returns hello world
  Function:
    Metadata:
      Comment: A lambda function that implements REST API endpoints
      checkov:
        skip:
          - id: CKV_AWS_116
            comment: This function is not called async
          - id: CKV_AWS_117
            comment: This example does not run in a VPC
      guard:
        SuppressedRules:
          - LAMBDA_INSIDE_VPC
          - LAMBDA_DLQ_CHECK
        Comments:
          - This example does not run in a VPC
          - The function is not called async so a DLQ is not necessary
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.handler
      Role: !GetAtt LambdaRole.Arn
      ReservedConcurrentExecutions: 20
      Code:
        ZipFile: |
          def handler(event, context):
            return 'Hello World!'
      Runtime: python3.10
      TracingConfig:
        Mode: Active

  # A lambda version with concurrency
  Version:
    Type: AWS::Lambda::Version
    Properties:
      FunctionName: !Ref Function
      Description: v1
      ProvisionedConcurrencyConfig:
        ProvisionedConcurrentExecutions: 20

  # API Gateway to trigger the lambda function
  ApiGatewayRestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: LambdaTriggerApi
      Description: API Gateway to trigger Lambda function

  ApiGatewayResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      ParentId: !GetAtt ApiGatewayRestApi.RootResourceId
      PathPart: hello

  ApiGatewayMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      ResourceId: !Ref ApiGatewayResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        IntegrationHttpMethod: POST
        Type: AWS_PROXY
        Uri:
          Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${Function.Arn}/invocations
      MethodResponses:
        - StatusCode: 200

  ApiGatewayDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - ApiGatewayMethod
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      StageName: prod