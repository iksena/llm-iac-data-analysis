AWSTemplateFormatVersion: '2010-09-09'
Description: 'Authentication and authorization infrastructure for ontology lookup service using Amazon Cognito'
Parameters:
  ApplicationName:
    Type: String
    Default: ontology-lookup-service
    Description: Application name used as SSM parameter path prefix
  UserPoolName:
    Type: String
    Default: OLSGatewayPool
    Description: Name of the Cognito user pool
  DomainPrefix:
    Type: String
    Default: ols-gateway
    Description: Prefix for the Cognito custom domain (must be globally unique)
Resources:
  OntologyUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Ref UserPoolName
      MfaConfiguration: OPTIONAL
      SoftwareTokenMfaConfiguration:
        Enabled: true
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
      AutoVerifiedAttributes:
        - email
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  OntologyResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      Identifier: !Sub ${ApplicationName}-resource-server
      Name: !Sub ${ApplicationName} Resource Server
      UserPoolId: !Ref OntologyUserPool
      Scopes:
        - ScopeName: read
          ScopeDescription: Read access to ontology data

  OntologyClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub ${ApplicationName}-machine-to-machine
      UserPoolId: !Ref OntologyUserPool
      GenerateSecret: true
      ExplicitAuthFlows:
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_PASSWORD_AUTH
      AllowedOAuthFlows:
        - client_credentials
      AllowedOAuthScopes:
        - !Sub ${OntologyResourceServer}/read
      AllowedOAuthFlowsUserPoolClient: true
      CallbackURLs:
        - https://example.com
      SupportedIdentityProviders:
        - COGNITO

  OntologyDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref DomainPrefix
      UserPoolId: !Ref OntologyUserPool

  SSMClientId:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${ApplicationName}/clientId
      Type: String
      Value: !Ref OntologyClient
      Description: Cognito app client ID

  SSMClientSecret:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${ApplicationName}/clientSecret
      Type: String
      Value: !GetAtt OntologyClient.ClientSecret
      Description: Cognito app client secret

  SSMUserPoolId:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${ApplicationName}/userPoolId
      Type: String
      Value: !Ref OntologyUserPool
      Description: Cognito user pool ID

  SSMOAuthScope:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${ApplicationName}/oauthScope
      Type: String
      Value: !Sub ${OntologyResourceServer}/read
      Description: OAuth scope for the resource server

  SSMDiscoveryUrl:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${ApplicationName}/discoveryUrl
      Type: String
      Value: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${OntologyUserPool}/.well-known/openid-configuration
      Description: OpenID Connect discovery URL

  SSMTokenUrl:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${ApplicationName}/tokenUrl
      Type: String
      Value: !Sub https://${DomainPrefix}.auth.${AWS::Region}.amazoncognito.com/oauth2/token
      Description: OAuth token endpoint

  SSMDomain:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${ApplicationName}/domain
      Type: String
      Value: !Sub https://${DomainPrefix}.auth.${AWS::Region}.amazoncognito.com
      Description: Cognito domain base URL