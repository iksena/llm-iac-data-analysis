AWSTemplateFormatVersion: "2010-09-09"
Description: "EC2 Bastion Host Stack for Apache Yunikorn on EMR in EKS Infrastructure"

Parameters:
  ProjectName:
    Description: An environment name that is prefixed to resource names
    Type: String
    Default: yunikorn-emr-eks

  VPC:
    Description: The VPC ID where the Bastion Host will be created
    Type: AWS::EC2::VPC::Id

  PrivateSubnet:
    Description: The private subnet ID where the Bastion Host will be created
    Type: AWS::EC2::Subnet::Id

  BastionInstanceType:
    Description: EC2 instance type for the Bastion Host
    Type: String
    Default: t3.small

  LatestAmazonLinux2023AMI:
    Description: Latest Amazon Linux 2023 AMI from SSM Parameter Store
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

  EKSClusterName:
    Description: Name of the EKS cluster to connect to
    Type: String
    Default: emr-on-eks-cluster

  EKSSecurityGroup:
    Description: Security Group ID for the EKS cluster
    Type: AWS::EC2::SecurityGroup::Id

  VPCEndpointSecurityGroup:
    Description: Security Group ID for VPC Endpoints
    Type: AWS::EC2::SecurityGroup::Id

  BastionHostSecurityGroupId:
    Description: Security Group ID for the Bastion Host (created in main stack)
    Type: AWS::EC2::SecurityGroup::Id

  BastionHostInstanceProfile:
    Description: Instance Profile for the Bastion Host (created in main stack)
    Type: String

  BucketName:
    Description: Name of the existing S3 bucket containing all project artifacts
    Type: String

Resources:
  # Bastion Host EC2 Instance
  BastionHost:
    Type: AWS::EC2::Instance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Metadata:
      cdk_nag:
        rules_to_suppress:
          # Suppression removed as termination protection is now enabled
          - id: AwsSolutions-EC28
            reason: "Detailed monitoring is not required for this bastion host as it's not a production-critical resource"
    Properties:
      DisableApiTermination: true
      ImageId: !Ref LatestAmazonLinux2023AMI
      InstanceType: !Ref BastionInstanceType
      IamInstanceProfile: !Ref BastionHostInstanceProfile
      SubnetId: !Ref PrivateSubnet
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1  # Restrict token hop limit for security
      SecurityGroupIds:
        - !Ref BastionHostSecurityGroupId
        - !Ref EKSSecurityGroup
        - !Ref VPCEndpointSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash -xe

          echo "Downloading bastion setup script from S3..."
          aws s3 cp s3://${BucketName}/ec2/setup-bastion.sh /tmp/setup-bastion.sh
          chmod +x /tmp/setup-bastion.sh

          # Execute the setup script with parameters
          echo "Executing bastion setup script..."
          /tmp/setup-bastion.sh ${EKSClusterName} ${AWS::Region}

          echo "Bastion host setup completed via S3 script!"

      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-bastion-host

Outputs:
  BastionHostId:
    Description: ID of the Bastion Host
    Value: !Ref BastionHost

  BastionHostPrivateIP:
    Description: Private IP address of the Bastion Host
    Value: !GetAtt BastionHost.PrivateIp

  BastionHostSecurityGroupId:
    Description: Security Group ID for the Bastion Host
    Value: !Ref BastionHostSecurityGroupId

  SSMConnectionCommand:
    Description: Command to connect to the Bastion Host using SSM
    Value: !Sub "aws ssm start-session --target ${BastionHost}"

  EKSAccessCommand:
    Description: Command to verify EKS cluster access from the Bastion Host
    Value: !Sub "aws ssm start-session --target ${BastionHost} --document-name AWS-StartInteractiveCommand --parameters command='kubectl get nodes'"