---
# Bashlinux::Kubernetes Master::EC2::IAM Role
#
#   Cloudformation template to deploy the IAM role
#   for the Kubernetes master on EC2
#
#   Manuel F Martinez
#   Bashlinux
#   Los Angeles, CA
#
AWSTemplateFormatVersion: "2010-09-09"
Description: EC2 Kubernetes Master IAM role template

###############################################################################
Parameters:

  Environment:
    Description: Environment this IAM role is deployed to
    Type: String
    MinLength: "1"
    MaxLength: "20"
    Default: staging
    AllowedValues: [ "prod", "staging" ]
    ConstraintDescription: Environment name can only contain "prod" or "staging".

  Organization:
    Description: Organization or Customer name
    Type: String
    MinLength: "1"
    MaxLength: "32"
    Default: bashlinux
    AllowedPattern: "[a-zA-Z0-9\\-]*"
    ConstraintDescription: >
      Name of the organization must contains only letters, numbers and hyphens.

###############################################################################
Resources:

  KubernetesMasterEc2Role:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - "sts:AssumeRole"
      RoleName: !Sub "${Organization}-${Environment}-kubernetes-master-ec2-role"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - !Ref SsmKubernetesMasterPolicy
      Tags:
      - Key: Name
        Value: !Sub "${Organization}-${Environment}-kubernetes-master-ec2-role"
      - Key: bashlinux:network-visibility
        Value: private
      - Key: bashlinux:organization-name
        Value: !Ref Organization
      - Key: bashlinux:environment-name
        Value: !Ref Environment
      - Key: bashlinux:application-role
        Value: kubernetes-master
      - Key: bashlinux:application-id
        Value: !Ref AWS::StackName

  KubernetesMasterEc2InstanceProfile:
    Type: "AWS::IAM::InstanceProfile"
    DependsOn: KubernetesMasterEc2Role
    Properties:
      InstanceProfileName: !Sub "${Organization}-${Environment}-kubernetes-master-ec2-role"
      Path: "/"
      Roles:
        - !Sub "${Organization}-${Environment}-kubernetes-master-ec2-role"

  # IAM Policies --------------------------------------------------------------
  AlbIngressControllerPolicy:
    Type: "AWS::IAM::Policy"
    Properties:
      PolicyName: !Sub "${Organization}-${Environment}-alb-ingress-controller-policy"
      PolicyDocument:
        "Fn::Transform":
          Name: AWS::Include
          Parameters:
            Location: "s3://bashlinux-devops/iam-policies/iam_policy_bashlinux_alb_ingress_contoller.json"
      Roles: [ !Ref KubernetesMasterEc2Role ]

  SsmKubernetesMasterPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${Organization}-${Environment}-kubernetes-master-ssm-policy"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - "ssm:PutParameter"
              - "ssm:UpdateInstanceInformation"
            Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${Organization}/${Environment}/*"

###############################################################################
Outputs:

  KubernetesMasterEc2RoleArn:
    Description: The ARN of the role to use for Kubernetes master servers
    Value: !GetAtt KubernetesMasterEc2Role.Arn
    Export:
      Name: !Sub "${Organization}-${Environment}-master-KubernetesEc2RoleArn"

  KubernetesMasterEc2RoleId:
    Description: The ID of the IAM role to use for Kubernetes master servers
    Value: !GetAtt KubernetesMasterEc2Role.RoleId
    Export:
      Name: !Sub "${Organization}-${Environment}-master-KubernetesEc2RoleId"

  KubernetesMasterEc2RoleName:
    Description: The IAM role to use for Kubernetes master servers
    Value: !Ref KubernetesMasterEc2Role
    Export:
      Name: !Sub "${Organization}-${Environment}-master-KubernetesEc2RoleName"

  KubernetesMasterEc2InstanceProfileArn:
    Description: The ARN of the instance profile for Kubernetes master servers
    Value: !GetAtt KubernetesMasterEc2InstanceProfile.Arn
    Export:
      Name: !Sub "${Organization}-${Environment}-master-KubernetesEc2InstanceProfileArn"