AWSTemplateFormatVersion: "2010-09-09"
Description:  >-
    Last Modified: 2025/10/16 17:06:37
    "RADx Elastic Container Service (ECS) stack"

Parameters:
  Environment:
    Type: String
    Description: The Project Environment
    AllowedValues:
      - dev
      - test
      - prod
      - shared
  ProjectName:
    Type: String
    Description: The Project name
    Default: radx
    AllowedValues:
      - radx
  ProjectNameUpper:
    Type: String
    Description: The Project name in uppercase
    Default: RADx
    AllowedValues:
      - RADx

Conditions:
  DEV: !Equals [!Ref Environment, dev]
  TEST: !Equals [!Ref Environment, test]
  PROD: !Equals [!Ref Environment, prod]
  NOTDEV: !Not [!Equals [!Ref Environment, dev]]
  NOTPROD: !Not [!Equals [!Ref Environment, prod]]

Resources:
    ReportService:
        Type: "AWS::ECS::Service"
        Properties:
            ServiceName: !Sub "${ProjectNameUpper}-ReportService"
            Cluster: !GetAtt ECSCluster.Arn
            LoadBalancers:
              -
                TargetGroupArn:
                  Fn::ImportValue: !Sub "RADx-LoadBalancer-${Environment}-ReportServiceTargetGroup"
                ContainerName: !Sub "${ProjectNameUpper}-ReportService"
                ContainerPort: 8080
            DesiredCount: 0
            PlatformVersion: "LATEST"
            TaskDefinition: !Ref ReportServiceTaskDefinition
            DeploymentConfiguration:
                MaximumPercent: 200
                MinimumHealthyPercent: 100
                DeploymentCircuitBreaker:
                    Enable: true
                    Rollback: true
            NetworkConfiguration:
                AwsvpcConfiguration:
                    AssignPublicIp: "DISABLED"
                    SecurityGroups:
                      - Fn::ImportValue: !Sub RADx-Networking-${Environment}-ECS-Host-SecurityGroup
                    Subnets:
                      - Fn::ImportValue: !Sub "RADx-Networking-${Environment}-Private-Subnet-AZ1"
                      - Fn::ImportValue: !Sub "RADx-Networking-${Environment}-Private-Subnet-AZ2"
            HealthCheckGracePeriodSeconds: 300
            SchedulingStrategy: "REPLICA"
            DeploymentController:
                Type: "ECS"
            CapacityProviderStrategy:
              -
                CapacityProvider: "FARGATE"
                Weight: 0
                Base: 0
              -
                CapacityProvider: "FARGATE_SPOT"
                Weight: 1
                Base: 0

