AWSTemplateFormatVersion: "2010-09-09"

Description: Best Practice SNS Topic with added CloudWatch Alarms

Parameters:
  SubscriptionEndPoint:
    Description: The endpoint that receives notifications from the Amazon SNS topic. The endpoint value depends on the protocol that you specify. This could be a URL or ARN
    Type: String

  SubscriptionProtocol:
    Description: The subscription's protocol
    Type: String
    AllowedValues:
      - http
      - https
      - email
      - email-json
      - sms
      - sqs
      - application
      - lambda
    Default: sqs

Mappings: {}

Conditions: {}

Resources:
  SNSTopic:
    Type: AWS::SNS::Topic
    Properties: {}

  SNSSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Endpoint: !Ref SubscriptionEndPoint
      Protocol: !Ref SubscriptionProtocol
      TopicArn: !Ref SNSTopic
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 15

  DeadLetterQueue:
    Type: AWS::SQS::Queue

  CloudWatchAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      MetricName: NumberOfMessagesPublished
      Namespace: AWS/SNS
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 100
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
        - !Ref SNSTopic
      Dimensions:
        TopicName: !Ref SNSTopic

Outputs:
  TopicARN:
    Description: ARN of newly created SNS Topic
    Value: !Ref SNSTopic

  QueueName:
    Description: Name of newly created SNS Topic
    Value: !GetAtt SNSTopic.TopicName