AWSTemplateFormatVersion: 2010-09-09
Description: >-
  GraphQL API Template
Transform:
  - AWS::Serverless-2016-10-31

Parameters:
  AppSyncApiName:
    Type: String
    Default: codeML-API
  SubmissionTableName:
    Type: String
  ChallengeTableName:
    Type: String
  TeamTableName:
    Type: String
  createSubmissionInputValidationLambdaFunctionArn:
    Type: String
  getSubmissionLinkLambdaFunctionArn:
    Type: String
  setFinalSubmissionLambdaFunctionArn:
    Type: String
  authorizationLambdaFunctionArn:
    Type: String
  getHiddenPerformancesLambdaFunctionArn:
    Type: String
  Env:
    Type: String

Globals:
  Function:
    Timeout: 900 # 15 minutes, maximum allowed value
    Handler: app.lambda_handler
    Runtime: python3.9
    Tracing: Active
    Architectures:
      - x86_64

Resources:
  # Appsync service role for data sources
  AppSyncServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Env}-AppSyncServiceRole"
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: appsync.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: InvokeLambda
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: lambda:invokeFunction
                Resource:
                  - !Sub "arn:aws:lambda:${AWS::Region}:*:*"
        - PolicyName: AppSyncServiceRole
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: "*"
                Resource:
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/*"

  # Data sources
  SubmissionDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      Name: SubmissionDataSource
      Type: AMAZON_DYNAMODB
      ServiceRoleArn: !GetAtt AppSyncServiceRole.Arn
      DynamoDBConfig:
        AwsRegion: !Sub "${AWS::Region}"
        TableName: !Ref SubmissionTableName
  NoneDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      Name: NoneDataSource
      Type: NONE

  ChallengeDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      Name: ChallengeDataSource
      Type: AMAZON_DYNAMODB
      ServiceRoleArn: !GetAtt AppSyncServiceRole.Arn
      DynamoDBConfig:
        AwsRegion: !Sub "${AWS::Region}"
        TableName: !Ref ChallengeTableName

  TeamDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      Name: TeamDataSource
      Type: AMAZON_DYNAMODB
      ServiceRoleArn: !GetAtt AppSyncServiceRole.Arn
      DynamoDBConfig:
        AwsRegion: !Sub "${AWS::Region}"
        TableName: !Ref TeamTableName

  createSubmissionInputValidationDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      Name: createSubmissionInputValidationDataSource
      Type: AWS_LAMBDA
      ServiceRoleArn: !GetAtt AppSyncServiceRole.Arn
      LambdaConfig:
        LambdaFunctionArn: !Ref createSubmissionInputValidationLambdaFunctionArn
  getSubmissionLinkDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      Name: getSubmissionLinkDataSource
      Type: AWS_LAMBDA
      ServiceRoleArn: !GetAtt AppSyncServiceRole.Arn
      LambdaConfig:
        LambdaFunctionArn: !Ref getSubmissionLinkLambdaFunctionArn
  setFinalSubmissionDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      Name: setFinalSubmissionDataSource
      Type: AWS_LAMBDA
      ServiceRoleArn: !GetAtt AppSyncServiceRole.Arn
      LambdaConfig:
        LambdaFunctionArn: !Ref setFinalSubmissionLambdaFunctionArn
  getHiddenPerformancesDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      Name: getHiddenPerformances
      Type: AWS_LAMBDA
      ServiceRoleArn: !GetAtt AppSyncServiceRole.Arn
      LambdaConfig:
        LambdaFunctionArn: !Ref getHiddenPerformancesLambdaFunctionArn

  # Resolvers
  # Query
  getSubmissionResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      FieldName: getSubmission
      TypeName: Query
      DataSourceName: !GetAtt SubmissionDataSource.Name
      RequestMappingTemplateS3Location: "./resolvers/Query.getsubmission.req.vtl"
      ResponseMappingTemplateS3Location: "./resolvers/Query.getsubmission.res.vtl"

  getTeamResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      FieldName: getTeam
      TypeName: Query
      DataSourceName: !GetAtt TeamDataSource.Name
      RequestMappingTemplateS3Location: "./resolvers/Query.getTeam.req.vtl"
      ResponseMappingTemplateS3Location: "./resolvers/Query.getTeam.res.vtl"

  getChallengeResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      FieldName: getChallenge
      TypeName: Query
      DataSourceName: !GetAtt ChallengeDataSource.Name
      RequestMappingTemplateS3Location: "./resolvers/Query.getChallenge.req.vtl"
      ResponseMappingTemplateS3Location: "./resolvers/Query.getChallenge.res.vtl"

  # Mutation
  createTeamResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      FieldName: createTeam
      TypeName: Mutation
      DataSourceName: !GetAtt TeamDataSource.Name
      RequestMappingTemplateS3Location: "./resolvers/Mutation.createTeam.req.vtl"
      ResponseMappingTemplateS3Location: "./resolvers/Mutation.createTeam.res.vtl"
  createChallengeResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      FieldName: createChallenge
      TypeName: Mutation
      DataSourceName: !GetAtt ChallengeDataSource.Name
      RequestMappingTemplateS3Location: "./resolvers/Mutation.createChallenge.req.vtl"
      ResponseMappingTemplateS3Location: "./resolvers/Mutation.createChallenge.res.vtl"
  createSubmissionResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      FieldName: createSubmission
      TypeName: Mutation
      DataSourceName: !GetAtt createSubmissionInputValidationDataSource.Name
      RequestMappingTemplateS3Location: "./resolvers/Mutation.createSubmission.req.vtl"
      ResponseMappingTemplateS3Location: "./resolvers/Mutation.createSubmission.res.vtl"
  getSubmissionLink:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      FieldName: getSubmissionLink
      TypeName: Query
      DataSourceName: !GetAtt getSubmissionLinkDataSource.Name
      RequestMappingTemplateS3Location: "./resolvers/Query.getSubmissionLink.req.vtl"
      ResponseMappingTemplateS3Location: "./resolvers/Query.getSubmissionLink.res.vtl"
  setFinalSubmissionResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      FieldName: setFinalSubmission
      TypeName: Mutation
      DataSourceName: !GetAtt setFinalSubmissionDataSource.Name
      RequestMappingTemplateS3Location: "./resolvers/Mutation.setFinalSubmission.req.vtl"
      ResponseMappingTemplateS3Location: "./resolvers/Mutation.setFinalSubmission.res.vtl"

  # Field resolver
  SubmissionTeamResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      FieldName: team
      TypeName: Submission
      DataSourceName: !GetAtt TeamDataSource.Name
      RequestMappingTemplateS3Location: "./resolvers/Submission.team.req.vtl"
      ResponseMappingTemplateS3Location: "./resolvers/Submission.team.res.vtl"
  SubmissionChallengeResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      FieldName: challenge
      TypeName: Submission
      DataSourceName: !GetAtt ChallengeDataSource.Name
      RequestMappingTemplateS3Location: "./resolvers/Submission.challenge.req.vtl"
      ResponseMappingTemplateS3Location: "./resolvers/Submission.challenge.res.vtl"
  TeamSubmissionsResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      FieldName: submissions
      TypeName: Team
      DataSourceName: !GetAtt SubmissionDataSource.Name
      RequestMappingTemplateS3Location: "./resolvers/Team.submissions.req.vtl"
      ResponseMappingTemplateS3Location: "./resolvers/Team.submissions.res.vtl"
  ChallengeSubmissionsResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      FieldName: submissions
      TypeName: Challenge
      DataSourceName: !GetAtt SubmissionDataSource.Name
      RequestMappingTemplateS3Location: "./resolvers/Challenge.submissions.req.vtl"
      ResponseMappingTemplateS3Location: "./resolvers/Challenge.submissions.res.vtl"
  SubmissionHiddenPerformanceResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      FieldName: hiddenPerformance
      TypeName: Submission
      DataSourceName: !GetAtt getHiddenPerformancesDataSource.Name
      RequestMappingTemplateS3Location: "./resolvers/Submission.hidden_performance.req.vtl"
      ResponseMappingTemplateS3Location: "./resolvers/Submission.hidden_performance.res.vtl"

  # Api
  GraphQLApi:
    Type: AWS::AppSync::GraphQLApi
    Properties:
      Name: !Sub "${Env}-${AppSyncApiName}"
      AuthenticationType: API_KEY
      AdditionalAuthenticationProviders:
        - AuthenticationType: AWS_LAMBDA
          LambdaAuthorizerConfig:
            AuthorizerUri: !Ref authorizationLambdaFunctionArn

  GraphQLApiApiKey:
    Type: AWS::AppSync::ApiKey
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
  GraphQLSchema:
    Type: AWS::AppSync::GraphQLSchema
    Properties:
      ApiId: !GetAtt GraphQLApi.ApiId
      DefinitionS3Location: "./schema.graphql"
Outputs:
  ApiUrl:
    Description: "GraphQL API endpoint"
    Value: !GetAtt GraphQLApi.GraphQLUrl