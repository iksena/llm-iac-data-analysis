        - !Ref CampaignRegistryNameWritePolicy

  CampaignListLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-CampaignList
      Runtime: python3.13
      Handler: index.lambda_handler
      Role: !GetAtt CampaignListRole.Arn
      Timeout: 30
      MemorySize: 256
      KmsKeyArn: !Ref LambdaKMSKeyArn
      ReservedConcurrentExecutions: 5
      DeadLetterConfig:
        TargetArn: !GetAtt LambdaDeadLetterQueue.Arn
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          STATE_MACHINE_ARN: !Ref CampaignInitiatorStateMachine
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          CAMPAIGN_REGISTRY_TABLE: !Ref CampaignRegistry
      Code:
        ZipFile: |
          import json
          import os
          import logging
          import decimal
          import re
          from datetime import datetime, timezone

          import boto3

          logger = logging.getLogger()
          logger.setLevel(getattr(logging, os.environ.get('LOG_LEVEL', 'WARN').upper(), logging.WARNING))

          STATE_MACHINE_ARN = os.environ.get('STATE_MACHINE_ARN', '')
          CORS_ORIGIN = os.environ.get('ALLOWED_ORIGIN', 'NONE')

          CAMPAIGN_REGISTRY_TABLE = os.environ.get('CAMPAIGN_REGISTRY_TABLE', '')

          EXECUTION_STATUSES = ['RUNNING', 'SUCCEEDED', 'FAILED', 'TIMED_OUT', 'ABORTED']
          EXECUTION_NAME_PREFIX = 'Campaign-'

          # Per-campaign tracking tables outlive Step Functions execution history, so they
          # are used to recover campaigns that the state machine no longer knows about.
          BATCH_TABLE_PREFIX = 'email-batch-tracking-'
          RECIPIENT_TABLE_PREFIX = 'email-recipient-tracking-'

          # Registries are discovered by prefix rather than read from a single configured
          # name, so campaigns recorded by earlier deployments remain visible.
          REGISTRY_TABLE_PREFIX = 'email-campaign-registry-'

          # Bound the work done per request so the 30s Lambda timeout is not exceeded.
          MAX_EXECUTIONS_PER_STATUS = 500

          # Running campaigns are the only ones needing a live recipient count, and there are
          # normally very few. Capped so a backlog cannot turn the list into many scans.
          MAX_RUNNING_COUNT_LOOKUPS = 10

          CORS_HEADERS = {
              'Access-Control-Allow-Origin': CORS_ORIGIN,
              'Access-Control-Allow-Headers': 'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token',
              'Content-Type': 'application/json',
          }

          class DecimalEncoder(json.JSONEncoder):
              def default(self, obj):
                  if isinstance(obj, decimal.Decimal):
                      return int(obj) if obj % 1 == 0 else float(obj)
                  return super().default(obj)

          def lambda_handler(event, context):
              http_method = (event.get('httpMethod') or 'GET').upper()
              path_params = event.get('pathParameters') or {}
              campaign_id = path_params.get('campaignId')

              if campaign_id and http_method in ('PUT', 'PATCH'):
                  return update_campaign_name(campaign_id, event)
              if campaign_id:
                  return get_campaign_detail(campaign_id, event)
              return list_campaigns()

          def list_campaigns():
              """List all campaigns by combining three sources.

              1. The campaign registry. Durable metadata and last known status for every
                 campaign ever recorded, including registries left by earlier deployments.
              2. Step Functions executions for the CURRENT state machine. Authoritative for
                 status and timing, but only covers the last 90 days of this deployment.
              3. Surviving per-campaign tracking tables. Recovers campaigns that predate the
                 registry, identified purely from the table name.

              Source 2 wins on status and timing because it is the only real-time view.
              Source 1 supplies everything descriptive. Source 3 is the last resort.

              Cost note: this performs a fixed number of API calls regardless of how many
              campaigns exist. It deliberately makes no DescribeExecution call per campaign,
              which is what the metadata used to require on every 30 second refresh.
              """
              try:
                  # A single ListTables pass serves both discovery needs.
                  registry_tables, archived_ids = _discover_tables()

                  registry = _load_registry(registry_tables)
                  live = _list_live_executions()

                  campaign_ids = set(registry) | set(live) | archived_ids
                  campaigns = [
                      _merge_campaign(campaign_id, registry.get(campaign_id), live.get(campaign_id))
                      for campaign_id in campaign_ids
                  ]

                  _fill_missing_recipient_counts(campaigns, set(live))

                  # Sort by start time descending
                  campaigns.sort(key=lambda c: c.get('startTime', ''), reverse=True)

                  return _response(200, {'campaigns': campaigns})

              except Exception as e:
                  logger.error(f'Error listing campaigns: {e}', exc_info=True)
                  return _response(500, {'error': str(e)})

          def _discover_tables():
              """One ListTables pass collecting campaign registries and archived campaign ids.

              Archived ids come straight from the tracking table names
              (email-batch-tracking-<campaignId>), so no table reads are needed to enumerate
              past campaigns.
              """
              dynamodb = boto3.client('dynamodb')
              registry_tables = []
              archived_ids = set()
              start_table = None

              while True:
                  kwargs = {'Limit': 100}
                  if start_table:
                      kwargs['ExclusiveStartTableName'] = start_table
                  resp = dynamodb.list_tables(**kwargs)

                  for table_name in resp.get('TableNames', []):
                      if table_name.startswith(REGISTRY_TABLE_PREFIX):
                          registry_tables.append(table_name)
                      elif table_name.startswith(BATCH_TABLE_PREFIX):
                          campaign_id = table_name[len(BATCH_TABLE_PREFIX):]
                          if campaign_id:
                              archived_ids.add(campaign_id)

                  start_table = resp.get('LastEvaluatedTableName')
                  if not start_table:
                      break

              return registry_tables, archived_ids

          def _load_registry(registry_tables):
              """Campaign metadata from every discovered registry, keyed by campaign id.

              Registries belonging to earlier deployments are included so that redeploying
              under a new stack name does not hide past campaigns. This deployment's own
              registry is read last so it wins any conflict.
              """
              ordered = sorted(registry_tables, key=lambda name: name == CAMPAIGN_REGISTRY_TABLE)
              dynamodb = boto3.resource('dynamodb')
              registry = {}

              for table_name in ordered:
                  try:
                      table = dynamodb.Table(table_name)
                      kwargs = {}
                      while True:
                          resp = table.scan(**kwargs)
                          for item in resp.get('Items', []):
                              campaign_id = item.get('CampaignId')
                              if campaign_id:
                                  registry[campaign_id] = item
                          if 'LastEvaluatedKey' not in resp:
                              break
                          kwargs['ExclusiveStartKey'] = resp['LastEvaluatedKey']
                  except Exception as e:
                      # A missing or unreadable registry must not break the list.
                      logger.warning(f'Could not read campaign registry {table_name}: {e}')

              logger.info(f'Loaded {len(registry)} campaigns from {len(ordered)} registry table(s)')
              return registry

          def _list_live_executions():
              """Current execution keyed by campaign id, for the active state machine.

              Only ListExecutions is called. The DescribeExecution that used to run once per
              campaign is gone: that metadata now comes from the registry instead.
              """
              sfn = boto3.client('stepfunctions')
              live = {}

              for status in EXECUTION_STATUSES:
                  try:
                      next_token = None
                      fetched = 0
                      while fetched < MAX_EXECUTIONS_PER_STATUS:
                          kwargs = {
                              'stateMachineArn': STATE_MACHINE_ARN,
                              'statusFilter': status,
                              'maxResults': 100,
                          }
                          if next_token:
                              kwargs['nextToken'] = next_token
                          resp = sfn.list_executions(**kwargs)
                          executions = resp.get('executions', [])
                          for ex in executions:
                              campaign_id = _campaign_id_from_execution_name(ex.get('name', ''))
                              if campaign_id:
                                  live[campaign_id] = ex
                          fetched += len(executions)
                          next_token = resp.get('nextToken')
                          if not next_token:
                              break
                  except Exception as e:
                      logger.warning(f'Error listing {status} executions: {e}')

              return live

          def _campaign_id_from_execution_name(name):
              """Campaign id encoded in an execution name ('Campaign-<campaignId>')."""
              if name.startswith(EXECUTION_NAME_PREFIX):
                  return name[len(EXECUTION_NAME_PREFIX):]
              return name

          def _merge_campaign(campaign_id, entry, execution):
              """Combine a registry row and a live execution into one campaign summary.

              The live execution owns status and timing. The registry owns descriptive
              metadata and the last known status for campaigns Step Functions has forgotten.
              Anything still unknown is derived from the campaign id.
              """
              entry = entry or {}

              campaign = {
                  'campaignId': campaign_id,
                  'campaignName': entry.get('CampaignName') or campaign_id,
                  # Optional user-supplied label. Left empty rather than defaulted to the
                  # campaign id so the UI can tell a named campaign from an unnamed one.
                  'displayName': entry.get('DisplayName') or '',
                  'templateName': entry.get('TemplateName') or '',
                  'totalRecipients': _as_int(entry.get('TotalRecipients')),
                  'startTime': entry.get('StartTime') or _start_time_from_campaign_id(campaign_id),
                  'endTime': entry.get('EndTime') or '',
                  'status': entry.get('Status') or 'ARCHIVED',
              }

              if execution:
                  campaign['status'] = execution.get('status') or campaign['status']
                  campaign['startTime'] = _iso_utc(execution.get('startDate')) or campaign['startTime']
                  campaign['endTime'] = _iso_utc(execution.get('stopDate')) or campaign['endTime']
              elif not entry:
                  # Known only from a surviving tracking table: no metadata is recoverable.
                  campaign['archived'] = True

              return campaign

          def _fill_missing_recipient_counts(campaigns, live_ids):
              """Total recipients for campaigns the registry has no count for yet.

              Limited to campaigns Step Functions still knows about. Those are bounded by the
              90 day history window, and covers two cases: campaigns still running, and
              campaigns that finished before the registry existed to record their totals.

              Archived campaigns are deliberately excluded. There can be a great many of them
              and their tracking tables are usually empty after TTL, so scanning them would
              add cost on every refresh for no benefit. Their counts come from the detail view.
              """
              pending = [
                  c for c in campaigns
                  if c['campaignId'] in live_ids and not c.get('totalRecipients')
              ]
              if not pending:
                  return

              dynamodb = boto3.resource('dynamodb')
              for campaign in pending[:MAX_RUNNING_COUNT_LOOKUPS]:
                  try:
                      table = dynamodb.Table(f"{BATCH_TABLE_PREFIX}{campaign['campaignId']}")
                      resp = table.scan(ProjectionExpression='RecipientCount')
                      campaign['totalRecipients'] = sum(
                          _as_int(item.get('RecipientCount')) for item in resp.get('Items', [])
                      )
                  except Exception as e:
                      _log_table_read_failure(f"{BATCH_TABLE_PREFIX}{campaign['campaignId']}", e)

          def _as_int(value):
              """Coerce a DynamoDB number or string to int, 0 when absent or unparseable."""
              if value is None:
                  return 0
              try:
                  return int(value)
              except (TypeError, ValueError):
                  return 0

          def _log_table_read_failure(table_name, exc):
              """Log a failed tracking table read at a level that matches its cause.

              A missing table is expected for campaigns that never got past setup, so that
              stays quiet. Anything else - most importantly AccessDenied from a KMS key
              belonging to an earlier deployment - is a real fault that silently empties a
              campaign's statistics, so it must be visible at the default log level.
              """
              code = ''
              response = getattr(exc, 'response', None)
              if isinstance(response, dict):
                  code = (response.get('Error') or {}).get('Code', '')

              if code == 'ResourceNotFoundException':
                  logger.info(f'Tracking table {table_name} does not exist')
              else:
                  logger.warning(f'Could not read tracking table {table_name}: {code or type(exc).__name__}: {exc}')

          def _load_json(raw):
              """Parse a JSON payload defensively, returning {} on anything unexpected."""
              if not raw:
                  return {}
              if isinstance(raw, dict):
                  return raw
              try:
                  parsed = json.loads(raw)
              except (ValueError, TypeError):
                  return {}
              return parsed if isinstance(parsed, dict) else {}

          def _locate_registry_entry(campaign_id):
              """(table_name, row) for the registry holding this campaign, else (None, None).

              Tries this deployment's registry first with a direct GetItem, which is the
              common case and avoids a discovery pass. Only on a miss does it search
              registries left behind by earlier deployments.

              The table name is returned as well as the row so that an edit can be written
              back to whichever registry the campaign actually lives in, rather than
              silently creating a second row for it in this deployment's registry.
              """
              dynamodb = boto3.resource('dynamodb')

              if CAMPAIGN_REGISTRY_TABLE:
                  try:
                      resp = dynamodb.Table(CAMPAIGN_REGISTRY_TABLE).get_item(
                          Key={'CampaignId': campaign_id}
                      )
                      if resp.get('Item'):
                          return CAMPAIGN_REGISTRY_TABLE, resp['Item']
                  except Exception as e:
                      logger.info(f'Could not read registry {CAMPAIGN_REGISTRY_TABLE}: {e}')

              try:
                  registry_tables, _ = _discover_tables()
              except Exception as e:
                  logger.warning(f'Could not discover campaign registries: {e}')
                  return None, None

              for table_name in registry_tables:
                  if table_name == CAMPAIGN_REGISTRY_TABLE:
                      continue
                  try:
                      resp = dynamodb.Table(table_name).get_item(Key={'CampaignId': campaign_id})
                      if resp.get('Item'):
                          return table_name, resp['Item']
                  except Exception as e:
                      logger.info(f'Could not read registry {table_name}: {e}')

              return None, None

          def _registry_entry(campaign_id):
              """Registry row for a single campaign, or None if it was never recorded."""
              return _locate_registry_entry(campaign_id)[1]

          def update_campaign_name(campaign_id, event):
              """Set or clear the optional user-supplied name for one campaign.

              Only the DisplayName attribute is written. CampaignId is the key and is never
              touched, so every table name, S3 key and execution name derived from it stay
              exactly as they were. Renaming is purely cosmetic and safe at any point in a
              campaign's life, including while it is still sending.
              """
              try:
                  body = event.get('body')
                  if isinstance(body, str):
                      body = json.loads(body or '{}')
                  if not isinstance(body, dict):
                      raise ValueError('body must be a JSON object')
              except (ValueError, TypeError):
                  return _response(400, {'error': 'Request body must be valid JSON.'})

              display_name = str(body.get('displayName') or '').strip()

              # Mirrors the validation the campaign initiator applies. Free text is allowed
              # because this value is only ever stored and displayed, never used to build an
              # id, a table name or an S3 key. An empty value clears the name.
              if len(display_name) > 200 or re.search(r'[\x00-\x1f\x7f]', display_name):
                  return _response(400, {
                      'error': 'Invalid campaign name. Maximum 200 characters, no control characters.'
                  })

              table_name, entry = _locate_registry_entry(campaign_id)

              # No registry row means the campaign predates the registry or lost its write.
              # It is still renameable provided it genuinely exists, which a surviving
              # tracking table confirms; the update then creates the row. Without this check
              # any arbitrary id could be used to write junk rows into the registry.
              if not entry:
                  if not _tracking_table_exists(boto3.resource('dynamodb'), campaign_id):
                      return _response(404, {'error': f'Campaign {campaign_id} not found'})
                  if not CAMPAIGN_REGISTRY_TABLE:
                      return _response(500, {'error': 'Campaign registry is not configured.'})
                  table_name = CAMPAIGN_REGISTRY_TABLE

              try:
                  boto3.resource('dynamodb').Table(table_name).update_item(
                      Key={'CampaignId': campaign_id},
                      UpdateExpression='SET #n = :n',
                      ExpressionAttributeNames={'#n': 'DisplayName'},
                      ExpressionAttributeValues={':n': display_name},
                  )
              except Exception as e:
                  logger.error(f'Could not update name for campaign {campaign_id}: {e}')
                  return _response(500, {'error': 'Could not update the campaign name.'})

              logger.info(f'Campaign {campaign_id} name updated in {table_name}')
              return _response(200, {'campaignId': campaign_id, 'displayName': display_name})

          def _archived_campaign_summary(campaign_id):
              """Build a campaign summary for a campaign with no execution history."""
              return {
                  'campaignId': campaign_id,
                  'campaignName': campaign_id,
                  'displayName': '',
                  'status': 'ARCHIVED',
                  'templateName': '',
                  'totalRecipients': 0,
                  'startTime': _start_time_from_campaign_id(campaign_id),
                  'endTime': '',
                  'archived': True,
              }

          def _tracking_table_exists(dynamodb, campaign_id):
              """True if either tracking table exists for this campaign id.

              Guards the archived detail fallback so that unknown or malformed campaign ids
              still return 404 rather than an empty campaign.
              """
              client = dynamodb.meta.client
              for prefix in (BATCH_TABLE_PREFIX, RECIPIENT_TABLE_PREFIX):
                  try:
                      client.describe_table(TableName=f'{prefix}{campaign_id}')
                      return True
                  except Exception:
                      continue
              return False

          def _start_time_from_campaign_id(campaign_id):
              """Recover an ISO 8601 start time from a campaign id.

              Ids are shaped 'campaign-<epoch_ms>-<YYYYMMDDHHMMSS>'. The epoch component is
              preferred because it is unambiguously UTC. Returns '' if neither is parseable,
              which sorts the campaign to the bottom of the list rather than failing.
              """
              parts = campaign_id.split('-')

              for part in parts:
                  if part.isdigit() and len(part) == 13:
                      try:
                          return datetime.fromtimestamp(int(part) / 1000, tz=timezone.utc).isoformat()
                      except (ValueError, OSError, OverflowError):
                          pass

              for part in parts:
                  if part.isdigit() and len(part) == 14:
                      try:
                          return datetime.strptime(part, '%Y%m%d%H%M%S').replace(tzinfo=timezone.utc).isoformat()
                      except ValueError:
                          pass

              return ''

          def get_campaign_detail(campaign_id, event):
              """Get detailed info for a specific campaign including batch and recipient stats."""
              sfn = boto3.client('stepfunctions')
              dynamodb = boto3.resource('dynamodb')

              # Parse search query parameter early so it's always defined
              query_params = event.get('queryStringParameters') or {}
              search_email = (query_params.get('search') or '').strip().lower()

              try:
                  # Find the execution by name pattern
                  execution = None
                  for status in EXECUTION_STATUSES:
                      try:
                          resp = sfn.list_executions(
                              stateMachineArn=STATE_MACHINE_ARN,
                              statusFilter=status,
                              maxResults=100,
                          )
                          for ex in resp.get('executions', []):
                              if campaign_id in ex.get('name', ''):
                                  execution = ex
                                  break
                      except Exception:
                          pass
                      if execution:
                          break

                  if execution:
                      # A single DescribeExecution supplies both the input payload and the
                      # output, which is where the final recipient count lives.
                      detail = sfn.describe_execution(executionArn=execution['executionArn'])
                      input_data = _load_json(detail.get('input'))
                      output_data = _load_json(detail.get('output'))

                      campaign = _merge_campaign(campaign_id, _registry_entry(campaign_id), execution)
                      campaign['campaignName'] = input_data.get('campaignName') or campaign['campaignName']
                      # The registry owns displayName, because that is where edits are
                      # written. The execution input only carries the name the campaign was
                      # started with, so it is a fallback for campaigns whose registry write
                      # failed - it must never shadow a name edited later.
                      if not campaign.get('displayName'):
                          campaign['displayName'] = str(input_data.get('displayName') or '').strip()
                      campaign['templateName'] = input_data.get('templateName') or campaign['templateName']
                      campaign['senderEmail'] = input_data.get('senderEmail', '')
                      campaign['senderName'] = input_data.get('senderName', '')
                      campaign['recipientListFile'] = input_data.get('recipientListFile', '')
                      campaign['attachmentCount'] = len(input_data.get('attachments') or [])

                      extraction = output_data.get('extractionResult') or {}
                      extracted_total = (_as_int(extraction.get('processedRecipients'))
                                         or _as_int(extraction.get('totalRecipients')))
                      if extracted_total:
                          campaign['totalRecipients'] = extracted_total
                  else:
                      # No execution history. Either the campaign aged out of Step Functions
                      # or it ran under a previous deployment. Prefer the registry, which
                      # retains the metadata the execution input used to carry, and fall back
                      # to the tracking tables for campaigns that predate the registry.
                      entry = _registry_entry(campaign_id)

                      if entry:
                          campaign = _merge_campaign(campaign_id, entry, None)
                          campaign['senderEmail'] = entry.get('SenderEmail') or ''
                          campaign['senderName'] = entry.get('SenderName') or ''
                          campaign['recipientListFile'] = entry.get('RecipientListFile') or ''
                          campaign['attachmentCount'] = _as_int(entry.get('AttachmentCount'))
                      else:
                          if not _tracking_table_exists(dynamodb, campaign_id):
                              return _response(404, {'error': f'Campaign {campaign_id} not found'})

                          campaign = _archived_campaign_summary(campaign_id)
                          campaign['senderEmail'] = ''
                          campaign['senderName'] = ''
                          campaign['recipientListFile'] = ''
                          campaign['attachmentCount'] = 0

                  # Try to read batch tracking table for delivery stats
                  batch_table_name = f"email-batch-tracking-{campaign_id}"
                  recipient_table_name = f"email-recipient-tracking-{campaign_id}"

                  batches = []
                  try:
                      batch_table = dynamodb.Table(batch_table_name)
                      scan_resp = batch_table.scan()
                      batches = scan_resp.get('Items', [])
                  except Exception as e:
                      _log_table_read_failure(batch_table_name, e)

                  recipients = []
                  # Tracked separately from len(recipients) so an active search filter does
                  # not make the campaign look like it had only the matching recipients.
                  recipient_total = 0
                  delivery_stats = {'sent': 0, 'delivered': 0, 'bounced': 0, 'complaint': 0, 'failed': 0, 'pending': 0, 'opened': 0, 'clicked': 0}
                  try:
                      recipient_table = dynamodb.Table(recipient_table_name)

                      # Paginated scan to get ALL recipients (DynamoDB scan returns max 1MB per call)
                      all_items = []
                      scan_kwargs = {}
                      while True:
                          scan_resp = recipient_table.scan(**scan_kwargs)
                          all_items.extend(scan_resp.get('Items', []))
                          if 'LastEvaluatedKey' not in scan_resp:
                              break
                          scan_kwargs['ExclusiveStartKey'] = scan_resp['LastEvaluatedKey']

                      recipient_total = len(all_items)

                      # Compute delivery stats from ALL recipients
                      for r in all_items:
                          status = r.get('Status', 'PENDING').upper()
                          if status == 'SENT':
                              delivery_stats['sent'] += 1
                          elif status == 'DELIVERED':
                              delivery_stats['delivered'] += 1
                          elif status in ('BOUNCED', 'BOUNCE'):
                              delivery_stats['bounced'] += 1
                          elif status == 'COMPLAINT':
                              delivery_stats['complaint'] += 1
                          elif status in ('FAILED', 'ERROR', 'REJECTED'):
                              delivery_stats['failed'] += 1
                          else:
                              delivery_stats['pending'] += 1
                          if r.get('Opened'):
                              delivery_stats['opened'] += 1
                          if r.get('Clicked'):
                              delivery_stats['clicked'] += 1

                      # Apply search filter if provided (case-insensitive)
                      if search_email:
                          recipients = [r for r in all_items if search_email in (r.get('EmailAddress', '') or '').lower()]
                      else:
                          recipients = all_items
                  except Exception as e:
                      _log_table_read_failure(recipient_table_name, e)

                  campaign['batches'] = [
                      {
                          'batchId': b.get('BatchId', ''),
                          'status': b.get('Status', 'UNKNOWN'),
                          'recipientCount': b.get('RecipientCount', 0),
                          'queuedCount': b.get('QueuedCount', 0),
                      }
                      for b in batches
                  ]
                  campaign['deliveryStats'] = delivery_stats
                  campaign['totalRecipients'] = recipient_total or campaign.get('totalRecipients', 0)

                  # When searching, return all matches; otherwise cap at 500
                  display_recipients = recipients if search_email else recipients[:500]
                  campaign['recipients'] = [
                      {
                          'email': r.get('EmailAddress', ''),
                          'status': r.get('Status', 'PENDING'),
                          'messageId': r.get('MessageId', ''),
                          'sentAt': r.get('SentTimestamp', ''),
                          'attempts': r.get('Attempts', 0),
                          'opened': bool(r.get('Opened', False)),
                          'clicked': bool(r.get('Clicked', False)),
                      }
                      for r in display_recipients
                  ]
                  campaign['searchActive'] = bool(search_email)

                  return _response(200, campaign)

              except Exception as e:
                  logger.error(f'Error getting campaign detail: {e}', exc_info=True)
                  return _response(500, {'error': str(e)})

          def _iso_utc(value):
              """Render a datetime as an ISO 8601 string normalised to UTC.

              Campaigns are sorted by comparing these strings, so every source must use the
              same offset. boto3 returns timestamps in the runtime's local zone, which is UTC
              in Lambda but not necessarily elsewhere; normalising keeps the sort correct
              either way and matches the UTC times derived from archived campaign ids.
              """
              if not value:
                  return ''
              try:
                  if value.tzinfo is None:
                      value = value.replace(tzinfo=timezone.utc)
                  return value.astimezone(timezone.utc).isoformat()
              except (AttributeError, ValueError, OSError, OverflowError):
                  return ''

          def _response(status_code, body):
              return {
                  'statusCode': status_code,
                  'headers': CORS_HEADERS,
                  'body': json.dumps(body, default=str, cls=DecimalEncoder),
              }

  ###############################
  # Delivery Callback Pipeline (Optional — requires SES Configuration Set)
  ###############################
  DeliveryCallbackLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: HasConfigSet
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-DeliveryCallback
      RetentionInDays: 14
      KmsKeyId: !Ref CloudWatchLogsKMSKeyArn

  # Add EventBridge event destination to the SES Configuration Set
  # so delivery/bounce/complaint events are published to EventBridge
  SESEventBridgeDestination:
    Type: AWS::SES::ConfigurationSetEventDestination
    Condition: HasConfigSet
    Properties:
      ConfigurationSetName: !Ref SESConfigurationSetName
      EventDestination:
        Name: !Sub ${AWS::StackName}-eventbridge-dest
        Enabled: true
        MatchingEventTypes:
          - delivery
          - bounce
          - complaint
          - reject
          - open
          - click
        EventBridgeDestination:
          EventBusArn: !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/default

  DeliveryCallbackDynamoDBPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: HasConfigSet
    Properties:
      Description: Allows DeliveryCallback Lambda to update campaign tracking tables
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:UpdateItem
              - dynamodb:GetItem
            # Dynamic campaign-specific table names require wildcard pattern
            Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/*email-*-tracking*

  DeliveryCallbackKMSPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: HasConfigSet
    Properties:
      Description: Allows DeliveryCallback Lambda to decrypt with KMS keys
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - kms:Decrypt
              - kms:DescribeKey
            Resource:
              - !Ref LambdaKMSKeyArn
              - !GetAtt DynamoDBKMSKey.Arn

  DeliveryCallbackDLQPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: HasConfigSet
    Properties:
      Description: Allows DeliveryCallback Lambda to send messages to the dead letter queue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - sqs:SendMessage
            Resource: !GetAtt LambdaDeadLetterQueue.Arn

  DeliveryCallbackRole:
    Type: AWS::IAM::Role
    Condition: HasConfigSet
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - !Ref DeliveryCallbackDynamoDBPolicy
        - !Ref DeliveryCallbackKMSPolicy
        - !Ref DeliveryCallbackDLQPolicy

  DeliveryCallbackLambda:
    Type: AWS::Lambda::Function
    Condition: HasConfigSet
    Properties:
      FunctionName: !Sub ${AWS::StackName}-DeliveryCallback
      Runtime: python3.13
      Handler: index.lambda_handler
      Role: !GetAtt DeliveryCallbackRole.Arn
      Timeout: 30
      MemorySize: 128
      KmsKeyArn: !Ref LambdaKMSKeyArn
      ReservedConcurrentExecutions: 10
      DeadLetterConfig:
        TargetArn: !GetAtt LambdaDeadLetterQueue.Arn
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          ALLOWED_ORIGIN: !Ref AllowedOrigin
      Code:
        ZipFile: |
          import json
          import os
          import hashlib
          import logging
          import boto3

          logger = logging.getLogger()
          logger.setLevel(getattr(logging, os.environ.get('LOG_LEVEL', 'WARN').upper(), logging.WARNING))

          dynamodb = boto3.resource('dynamodb')

          def mask_email(address):
              """Short digest of an address, for correlating log lines without
              writing the address itself to CloudWatch Logs."""
              if not address:
                  return 'unknown'
              return 'sha256:' + hashlib.sha256(address.encode('utf-8')).hexdigest()[:12]

          def lambda_handler(event, context):
              """Process SES delivery events from EventBridge and update campaign tracking tables."""
              # Log event type only. SES delivery events carry the recipient
              # address in mail.destination and message headers.
              logger.info(f"Received SES event: detail-type={event.get('detail-type', 'unknown')}")

              detail = event.get('detail', {})
              detail_type = event.get('detail-type', '')

              # Map EventBridge detail-type to status
              DETAIL_TYPE_MAP = {
                  'Email Delivered': 'DELIVERED',
                  'Email Bounced': 'BOUNCED',
                  'Email Complaint Received': 'COMPLAINT',
                  'Email Rejected': 'REJECTED',
              }

              # Engagement events — don't overwrite delivery status, set flags instead
              ENGAGEMENT_EVENTS = {
                  'Email Opened': 'opened',
                  'Email Clicked': 'clicked',
              }

              # Also support legacy eventType format
              EVENT_TYPE_MAP = {
                  'Delivery': 'DELIVERED',
                  'Bounce': 'BOUNCED',
                  'Complaint': 'COMPLAINT',
                  'Reject': 'REJECTED',
              }
              LEGACY_ENGAGEMENT = {
                  'Open': 'opened',
                  'Click': 'clicked',
              }

              engagement_flag = ENGAGEMENT_EVENTS.get(detail_type)
              if not engagement_flag:
                  event_type = detail.get('eventType', '')
                  engagement_flag = LEGACY_ENGAGEMENT.get(event_type)

              new_status = DETAIL_TYPE_MAP.get(detail_type)
              if not new_status and not engagement_flag:
                  event_type = detail.get('eventType', '')
                  new_status = EVENT_TYPE_MAP.get(event_type)

              if not new_status and not engagement_flag:
                  logger.info(f'Skipping event: detail-type={detail_type}')
                  return {'statusCode': 200, 'body': 'skipped'}

              # Extract message tags
              mail = detail.get('mail', {})
              tags = mail.get('tags', {})

              # Tags come as {'tagName': ['tagValue']}
              campaign_id = _get_tag(tags, 'campaignId')
              recipient_table_name = _get_tag(tags, 'recipientTable')

              if not campaign_id or not recipient_table_name:
                  logger.info(f'No campaign tags on message {mail.get("messageId", "unknown")}, skipping')
                  return {'statusCode': 200, 'body': 'no campaign tags'}

              # Get recipient email from the event
              recipients = mail.get('destination', [])
              if not recipients:
                  logger.warning('No destination in mail event')
                  return {'statusCode': 200, 'body': 'no destination'}

              # Update each recipient in the tracking table
              updated = 0
              for email in recipients:
                  try:
                      table = dynamodb.Table(recipient_table_name)

                      if engagement_flag:
                          # Engagement event — set a flag, don't overwrite status
                          table.update_item(
                              Key={'EmailAddress': email},
                              UpdateExpression='SET #flag = :val, #flagTs = :ts',
                              ExpressionAttributeNames={
                                  '#flag': engagement_flag.capitalize(),
                                  '#flagTs': f'{engagement_flag.capitalize()}Timestamp',
                              },
                              ExpressionAttributeValues={
                                  ':val': True,
                                  ':ts': mail.get('timestamp', ''),
                              },
                              ConditionExpression='attribute_exists(EmailAddress)',
                          )
                          updated += 1
                          logger.info(f'{engagement_flag} flag set for {mask_email(email)} in {recipient_table_name}')
                          continue

                      update_expr = 'SET #s = :status, DeliveryTimestamp = :ts'
                      expr_values = {
                          ':status': new_status,
                          ':ts': mail.get('timestamp', ''),
                      }
                      expr_names = {'#s': 'Status'}

                      # Add bounce details if applicable
                      if new_status == 'BOUNCED':
                          bounce = detail.get('bounce', {})
                          update_expr += ', BounceType = :bt, BounceSubType = :bst'
                          expr_values[':bt'] = bounce.get('bounceType', '')
                          expr_values[':bst'] = bounce.get('bounceSubType', '')

                      # Add complaint details if applicable
                      if new_status == 'COMPLAINT':
                          complaint = detail.get('complaint', {})
                          update_expr += ', ComplaintFeedbackType = :cft'
                          expr_values[':cft'] = complaint.get('complaintFeedbackType', '')

                      table.update_item(
                          Key={'EmailAddress': email},
                          UpdateExpression=update_expr,
                          ExpressionAttributeNames=expr_names,
                          ExpressionAttributeValues=expr_values,
                          ConditionExpression='attribute_exists(EmailAddress)',
                      )
                      updated += 1
                      logger.info(f'{event_type} -> {new_status} for {mask_email(email)} in {recipient_table_name}')

                  except dynamodb.meta.client.exceptions.ConditionalCheckFailedException:
                      logger.info(f'Recipient {mask_email(email)} not found in {recipient_table_name}, skipping')
                  except Exception as e:
                      logger.error(f'Error updating {mask_email(email)} in {recipient_table_name}: {e}')

              return {'statusCode': 200, 'body': f'updated {updated} recipients'}

          def _get_tag(tags, name):
              """Extract a tag value from SES mail tags (format: {'name': ['value']})."""
              values = tags.get(name, [])
              return values[0] if values else None

  DeliveryCallbackEventRule:
    Type: AWS::Events::Rule
    Condition: HasConfigSet
    Properties:
      Name: !Sub ${AWS::StackName}-SES-DeliveryCallback
      Description: Routes SES delivery, bounce, and complaint events to the callback Lambda
      EventPattern:
        source:
          - aws.ses
        detail-type:
          - "Email Delivered"
          - "Email Bounced"
          - "Email Complaint Received"
          - "Email Rejected"
          - "Email Opened"
          - "Email Clicked"
      State: ENABLED
      Targets:
        - Arn: !GetAtt DeliveryCallbackLambda.Arn
          Id: DeliveryCallbackTarget

  DeliveryCallbackEventPermission:
    Type: AWS::Lambda::Permission
    Condition: HasConfigSet
    Properties:
      FunctionName: !Ref DeliveryCallbackLambda
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DeliveryCallbackEventRule.Arn

  ###############################
  # SES Insights Agent Proxy (Optional)
  ###############################
  InsightsProxyLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: HasInsightsRuntime
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-InsightsProxy
      RetentionInDays: 14
      KmsKeyId: !Ref CloudWatchLogsKMSKeyArn

  InsightsProxyInvokePolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: HasInsightsRuntime
    Properties:
      Description: Allows InsightsProxy Lambda to invoke Bedrock AgentCore Runtime
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - bedrock-agentcore:InvokeAgentRuntime
            Resource:
              - !Ref InsightsRuntimeArn
              - !Sub "${InsightsRuntimeArn}/runtime-endpoint/DEFAULT"

  InsightsProxyKMSPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: HasInsightsRuntime
    Properties:
      Description: Allows InsightsProxy Lambda to decrypt with KMS key
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - kms:Decrypt
              - kms:DescribeKey
            Resource: !Ref LambdaKMSKeyArn

  InsightsProxyDLQPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: HasInsightsRuntime
    Properties:
      Description: Allows InsightsProxy Lambda to send messages to the dead letter queue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - sqs:SendMessage
            Resource: !GetAtt LambdaDeadLetterQueue.Arn

  InsightsProxyRole:
    Type: AWS::IAM::Role
    Condition: HasInsightsRuntime
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - !Ref InsightsProxyInvokePolicy
        - !Ref InsightsProxyKMSPolicy
        - !Ref InsightsProxyDLQPolicy

  InsightsProxyLambda:
    Type: AWS::Lambda::Function
    Condition: HasInsightsRuntime
    Properties:
      FunctionName: !Sub ${AWS::StackName}-InsightsProxy
      Runtime: python3.13
      Handler: index.lambda_handler
      Role: !GetAtt InsightsProxyRole.Arn
      Timeout: 300
      MemorySize: 512
      KmsKeyArn: !Ref LambdaKMSKeyArn
      ReservedConcurrentExecutions: 10
      DeadLetterConfig:
        TargetArn: !GetAtt LambdaDeadLetterQueue.Arn
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          INSIGHTS_RUNTIME_ARN: !Ref InsightsRuntimeArn
          ALLOWED_ORIGIN: !Ref AllowedOrigin
      Code:
        ZipFile: |
          import json
          import logging
          import os
          import re

          logger = logging.getLogger()
          logger.setLevel(getattr(logging, os.environ.get('LOG_LEVEL', 'WARN').upper(), logging.WARNING))

          RUNTIME_ARN = os.environ.get('INSIGHTS_RUNTIME_ARN', '')
          AWS_REGION = os.environ.get('AWS_REGION', 'us-east-1')
          CORS_ORIGIN = os.environ.get('ALLOWED_ORIGIN', 'NONE')

          CORS_HEADERS = {
              'Access-Control-Allow-Origin': CORS_ORIGIN,
              'Access-Control-Allow-Headers': 'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token',
              'Access-Control-Allow-Methods': 'POST,OPTIONS',
              'Content-Type': 'application/json',
          }

          def lambda_handler(event, context):
              if not RUNTIME_ARN:
                  return _response(503, {'error': 'Insights agent is not configured'})
              try:
                  body = json.loads(event.get('body', '{}'))
              except (json.JSONDecodeError, TypeError):
                  return _response(400, {'error': 'Invalid JSON body'})
              prompt = body.get('prompt', '').strip()
              if not prompt:
                  return _response(400, {'error': 'prompt is required'})
              session_id = body.get('sessionId', '')
              if not session_id or len(session_id) < 33:
                  raw = f"email-proxy-{context.aws_request_id}"
                  session_id = raw if len(raw) >= 33 else raw + '-' + '0' * (33 - len(raw) - 1)
              try:
                  import boto3
                  client = boto3.client('bedrock-agentcore', region_name=AWS_REGION)
                  response = client.invoke_agent_runtime(
                      agentRuntimeArn=RUNTIME_ARN,
                      payload=json.dumps({'prompt': prompt, 'sessionId': session_id}),
                      runtimeSessionId=session_id,
                  )
                  content_type = response.get('contentType', '')
                  logger.info(f'Response contentType: {content_type}')
                  content_lines = []
                  events = []
                  if 'text/event-stream' in content_type:
                      for line in response['response'].iter_lines(chunk_size=1024):
                          if line:
                              decoded = line.decode('utf-8') if isinstance(line, bytes) else line
                              if decoded.startswith('data: '):
                                  data_str = decoded[6:]
                                  content_lines.append(data_str)
                                  try:
                                      events.append(json.loads(data_str))
                                  except json.JSONDecodeError:
                                      pass
                              elif decoded.startswith('data:'):
                                  data_str = decoded[5:]
                                  content_lines.append(data_str)
                                  try:
                                      events.append(json.loads(data_str))
                                  except json.JSONDecodeError:
                                      pass
                  elif content_type == 'application/json':
                      chunks = []
                      for chunk in response.get('response', []):
                          chunks.append(chunk.decode('utf-8') if isinstance(chunk, bytes) else str(chunk))
                      full = ''.join(chunks)
                      try:
                          return _response(200, json.loads(full))
                      except json.JSONDecodeError:
                          return _response(200, {'output': full})
                  else:
                      resp_obj = response.get('response', None)
                      if resp_obj:
                          if hasattr(resp_obj, 'iter_lines'):
                              parts = []
                              for line in resp_obj.iter_lines(chunk_size=1024):
                                  if line:
                                      parts.append(line.decode('utf-8') if isinstance(line, bytes) else line)
                              raw = '\n'.join(parts)
                          elif hasattr(resp_obj, 'read'):
                              raw = resp_obj.read()
                              raw = raw.decode('utf-8') if isinstance(raw, bytes) else raw
                          else:
                              raw = str(resp_obj)
                          try:
                              return _response(200, json.loads(raw))
                          except json.JSONDecodeError:
                              return _response(200, {'output': raw})
                  # Post-process: extract image markers from text events
                  img_pattern = re.compile(r'__IMG_BASE64_START__(.+?)__IMG_BASE64_END__', re.DOTALL)
                  final_events = []
                  for evt in events:
                      if evt.get('type') == 'assistant_delta':
                          txt = evt.get('data', {}).get('text', '')
                          if '__IMG_BASE64_START__' in txt:
                              for m in img_pattern.finditer(txt):
                                  final_events.append({'type': 'image', 'data': {'base64': m.group(1).strip()}})
                              cleaned = img_pattern.sub('', txt).strip()
                              if cleaned:
                                  evt['data']['text'] = cleaned
                                  final_events.append(evt)
                          else:
                              final_events.append(evt)
                      else:
                          raw_str = json.dumps(evt)
                          if '__IMG_BASE64_START__' in raw_str:
                              for m in img_pattern.finditer(raw_str):
                                  final_events.append({'type': 'image', 'data': {'base64': m.group(1).strip()}})
                          final_events.append(evt)
                  if final_events:
                      return _response(200, final_events)
                  elif content_lines:
                      return _response(200, {'output': '\n'.join(content_lines)})
                  else:
                      return _response(200, {'output': ''})
              except Exception as e:
                  logger.error(f'Error invoking AgentCore Runtime: {e}', exc_info=True)
                  return _response(502, {'error': f'Agent invocation failed: {str(e)}'})

          def _response(status_code, body):
              return {
                  'statusCode': status_code,
                  'headers': CORS_HEADERS,
                  'body': json.dumps(body, default=str),
              }

  InsightsProxyPermission:
    Type: AWS::Lambda::Permission
    Condition: HasInsightsRuntime
    Properties:
      FunctionName: !Ref InsightsProxyLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${EmailDistributionAPI}/*/*"

  InsightsApiResource:
    Type: AWS::ApiGateway::Resource
    Condition: HasInsightsRuntime
    Properties:
      RestApiId: !Ref EmailDistributionAPI
      ParentId: !GetAtt EmailDistributionAPI.RootResourceId
      PathPart: insights

  InsightsApiMethodPost:
    Type: AWS::ApiGateway::Method
    Condition: HasInsightsRuntime
    Properties:
      RestApiId: !Ref EmailDistributionAPI
      ResourceId: !Ref InsightsApiResource
      HttpMethod: POST
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref InsightsCognitoAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${InsightsProxyLambda.Arn}/invocations"

  InsightsApiMethodOptions:
    Type: AWS::ApiGateway::Method
    Condition: HasInsightsRuntime
    Properties:
      RestApiId: !Ref EmailDistributionAPI
      ResourceId: !Ref InsightsApiResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: !Sub "'${AllowedOrigin}'"
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  InsightsCognitoAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Condition: HasInsightsRuntime
    Properties:
      Name: InsightsCognitoAuthorizer
      Type: COGNITO_USER_POOLS
      RestApiId: !Ref EmailDistributionAPI
      IdentitySource: method.request.header.Authorization
      ProviderARNs:
        - !Sub "arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}"

