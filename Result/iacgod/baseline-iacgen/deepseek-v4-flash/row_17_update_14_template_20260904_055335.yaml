AWSTemplateFormatVersion: "2010-09-09"
Description: "Configures subnets, route tables, and VPC endpoints for Users and Fog layers using the default VPC in the account. This template does not create any new VPCs; it uses the existing default VPC."
Resources:
  UsersSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Sub "{{resolve:ssm:/aws/vpc/defaultVpcId}}"
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: UsersSubnet
  FogSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Sub "{{resolve:ssm:/aws/vpc/defaultVpcId}}"
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: FogSubnet
  UsersRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Sub "{{resolve:ssm:/aws/vpc/defaultVpcId}}"
      Tags:
        - Key: Name
          Value: UsersRouteTable
  FogRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Sub "{{resolve:ssm:/aws/vpc/defaultVpcId}}"
      Tags:
        - Key: Name
          Value: FogRouteTable
  UsersSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref UsersSubnet
      RouteTableId: !Ref UsersRouteTable
  FogSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref FogSubnet
      RouteTableId: !Ref FogRouteTable
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Sub "{{resolve:ssm:/aws/vpc/defaultVpcId}}"
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref UsersRouteTable
        - !Ref FogRouteTable
  KMSEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for KMS interface endpoint
      VpcId: !Sub "{{resolve:ssm:/aws/vpc/defaultVpcId}}"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 10.0.0.0/16
  KMSEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Sub "{{resolve:ssm:/aws/vpc/defaultVpcId}}"
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.kms"
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref UsersSubnet
        - !Ref FogSubnet
      SecurityGroupIds:
        - !Ref KMSEndpointSecurityGroup
      PrivateDnsEnabled: true
  FogSecretsManagerEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Sub "{{resolve:ssm:/aws/vpc/defaultVpcId}}"
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.secretsmanager"
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref FogSubnet
      SecurityGroupIds:
        - !Ref KMSEndpointSecurityGroup
      PrivateDnsEnabled: true
  FogEventBridgeEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Sub "{{resolve:ssm:/aws/vpc/defaultVpcId}}"
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.events"
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref FogSubnet
      SecurityGroupIds:
        - !Ref KMSEndpointSecurityGroup
      PrivateDnsEnabled: true
  FogSTSEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Sub "{{resolve:ssm:/aws/vpc/defaultVpcId}}"
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.sts"
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref FogSubnet
      SecurityGroupIds:
        - !Ref KMSEndpointSecurityGroup
      PrivateDnsEnabled: true
  FogLambdaEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Sub "{{resolve:ssm:/aws/vpc/defaultVpcId}}"
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.lambda"
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref FogSubnet
      SecurityGroupIds:
        - !Ref KMSEndpointSecurityGroup
      PrivateDnsEnabled: true