AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: |
  DVA-C02 Lab 2.5 — Transactions
  Two tables: accounts + transfers. Demonstrates atomic multi-table updates.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 15
    MemorySize: 256
    LoggingConfig:
      LogFormat: JSON

Resources:
  AccountsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: dva-lab-02-05-accounts
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: account_id
          AttributeType: S
      KeySchema:
        - AttributeName: account_id
          KeyType: HASH

  TransfersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: dva-lab-02-05-transfers
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: transfer_id
          AttributeType: S
      KeySchema:
        - AttributeName: transfer_id
          KeyType: HASH

  Function:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dva-lab-02-05-transactions
      CodeUri: src/
      Handler: app.handler
      Environment:
        Variables:
          ACCOUNTS_TABLE: !Ref AccountsTable
          TRANSFERS_TABLE: !Ref TransfersTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AccountsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TransfersTable

Outputs:
  FunctionName:
    Value: !Ref Function
  AccountsTableName:
    Value: !Ref AccountsTable
  TransfersTableName:
    Value: !Ref TransfersTable