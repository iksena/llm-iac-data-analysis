AWSTemplateFormatVersion: 2010-09-09
Parameters:
  CreateInternetGateway:
    Type: String
    AllowedValues:
      - true
      - false
    Default: true
    Description: Whether to create an Internet Gateway
  CreatePublicSubnet:
    Type: String
    AllowedValues:
      - true
      - false
    Default: true
    Description: Whether to create a public subnet
  CreateRouteTable:
    Type: String
    AllowedValues:
      - true
      - false
    Default: true
    Description: Whether to create a route table
  CreateSecurityGroup:
    Type: String
    AllowedValues:
      - true
      - false
    Default: true
    Description: Whether to create a security group
  NamePrefix:
    Type: String
    Default: SimpleApp1
    Description: Prefix for naming resources
  VpcCIDR:
    Type: String
    Default: 10.0.0.0/16
    Description: CIDR block for the VPC
  PublicSubnetCIDR:
    Type: String
    Default: 10.0.1.0/24
    Description: CIDR block for the public subnet
  SourceIPRange:
    Type: String
    Default: 0.0.0.0/0
    Description: IP range allowed for HTTP and HTTPS traffic
Conditions:
  CreateIGW:
    Fn::Equals:
      - Ref: CreateInternetGateway
      - true
  CreateSubnet:
    Fn::Equals:
      - Ref: CreatePublicSubnet
      - true
  CreateRT:
    Fn::Equals:
      - Ref: CreateRouteTable
      - true
  CreateSG:
    Fn::Equals:
      - Ref: CreateSecurityGroup
      - true
  CreateRouteCondition:
    Fn::And:
      - Condition: CreateIGW
      - Condition: CreateRT
  CreateAssociation:
    Fn::And:
      - Condition: CreateSubnet
      - Condition: CreateRT
Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock:
        Ref: VpcCIDR
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value:
            Fn::Sub: ${NamePrefix}-vpc
  InternetGateway:
    Condition: CreateIGW
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value:
            Fn::Sub: ${NamePrefix}-igw
  VPCGatewayAttachment:
    Condition: CreateIGW
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId:
        Ref: VPC
      InternetGatewayId:
        Ref: InternetGateway
  PublicSubnet:
    Condition: CreateSubnet
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone:
        Fn::Select:
          - 0
          - Fn::GetAZs: ""
      CidrBlock:
        Ref: PublicSubnetCIDR
      MapPublicIpOnLaunch: true
      VpcId:
        Ref: VPC
      Tags:
        - Key: Name
          Value:
            Fn::Sub: ${NamePrefix}-public-subnet
  RouteTable:
    Condition: CreateRT
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId:
        Ref: VPC
      Tags:
        - Key: Name
          Value:
            Fn::Sub: ${NamePrefix}-route-table
  InternetRoute:
    Condition: CreateRouteCondition
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId:
        Ref: InternetGateway
      RouteTableId:
        Ref: RouteTable
  SubnetRouteTableAssociation:
    Condition: CreateAssociation
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId:
        Ref: RouteTable
      SubnetId:
        Ref: PublicSubnet
  SecurityGroup:
    Condition: CreateSG
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group allowing HTTP and HTTPS traffic
      SecurityGroupIngress:
        - CidrIp:
            Ref: SourceIPRange
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
        - CidrIp:
            Ref: SourceIPRange
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
      VpcId:
        Ref: VPC
      Tags:
        - Key: Name
          Value:
            Fn::Sub: ${NamePrefix}-security-group
Outputs:
  VpcId:
    Description: The ID of the newly created VPC
    Value:
      Ref: VPC