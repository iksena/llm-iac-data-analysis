  DataExtractorLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-EmailDataExtractor
      ReservedConcurrentExecutions: 5
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      DeadLetterConfig:
        TargetArn: !GetAtt LambdaDeadLetterQueue.Arn
      Code:
        ZipFile: !Sub |
          import json
          import os
          import boto3
          import uuid
          import logging
          import time
          import csv
          import io
          from datetime import datetime, timedelta, timezone

          # Configure logging
          logger = logging.getLogger()
          logger.setLevel(getattr(logging, os.environ.get('LOG_LEVEL', 'WARN').upper(), logging.WARNING))

          def tracking_expiration():
              """Epoch seconds at which tracking items should expire, or None to keep them.

              Driven by the TrackingDataRetentionDays stack parameter. Returning None means
              the item is written without an ExpirationTime attribute, so DynamoDB TTL leaves
              it alone permanently.
              """
              try:
                  days = int(os.environ.get('TRACKING_RETENTION_DAYS', '400'))
              except ValueError:
                  days = 400
              if days <= 0:
                  return None
              return int((datetime.now(timezone.utc) + timedelta(days=days)).timestamp())

          def lambda_handler(event, context):
              """
              Lambda function to fetch email addresses from a CSV file in S3 and create batch files
              Uses campaign-specific DynamoDB tables. CSV should have only email addresses.
              """
              # Log identifying fields only. The event carries the sender's address,
              # so the whole payload is never written to CloudWatch Logs.
              logger.info(
                  f"Starting data extraction: campaignId={event.get('campaignId')} "
                  f"templateName={event.get('templateName')} "
                  f"recipientListTable={event.get('recipientListFile')}"
              )

              # Check if this is an S3 event trigger (to prevent recursion)
              if 'Records' in event and any(record.get('eventSource') == 'aws:s3' for record in event.get('Records', [])):
                  logger.warning("Received S3 event trigger. Breaking potential recursion.")
                  return {
                      'statusCode': 200,
                      'message': 'Ignoring S3 event to prevent recursion'
                  }

              # Get configuration from environment variables
              batch_bucket = os.environ['BATCH_BUCKET']
              batch_size = int(os.environ.get('BATCH_SIZE', '100000'))
              recipients_bucket = os.environ.get('RECIPIENTS_BUCKET')
              template_name = event.get('templateName')
              template_version = os.environ.get('TEMPLATE_VERSION', '1.0')
              campaign_name = event.get('campaignName', os.environ.get('CAMPAIGN_NAME', 'email_campaign'))

              # Get the recipient table name from event parameter
              recipient_list_table = event.get('recipientListFile')

              # Get sender information from event
              sender_email = event.get('senderEmail', 'notifications@example.com')
              sender_name = event.get('senderName', 'AnyCompany')

              # Get campaign-specific table names from event
              campaign_id = event.get('campaignId')
              recipient_table_name = event.get('recipientTrackingTable')
              batch_table_name = event.get('batchTrackingTable')

              if not recipient_list_table:
                  logger.error("Missing recipient table name in event")
                  return {
                      'statusCode': 400,
                      'body': json.dumps({
                          'error': 'Missing recipient table name - please provide recipientListFile in the campaign request. Use the /recipients-lists API to see available tables.'
                      })
                  }

              if not campaign_id or not recipient_table_name or not batch_table_name:
                  logger.error("Missing required campaign information in event")
                  return {
                      'statusCode': 400,
                      'body': json.dumps({
                          'error': 'Missing required campaign information'
                      })
                  }

              try:
                  # Initialize AWS clients
                  dynamodb = boto3.resource('dynamodb')
                  s3_client = boto3.client('s3')

                  # Get recipients from DynamoDB table
                  try:
                      logger.info(f"Retrieving recipients from DynamoDB table: {recipient_list_table}")
                      recipients_table = dynamodb.Table(recipient_list_table)

                      # Scan the table to get all recipients
                      response = recipients_table.scan()

                      all_recipients = []
                      for item in response.get('Items', []):
                          email = item.get('EmailAddress', '').strip()
                          first_name = item.get('FirstName', '').strip()
                          last_name = item.get('LastName', '').strip()

                          if email and '@' in email:
                              recipient = {
                                  "email": email,
                                  "metadata": {
                                      "firstName": first_name,
                                      "lastName": last_name,
                                      "emailId": str(uuid.uuid4())
                                  }
                              }
                              all_recipients.append(recipient)

                      logger.info(f"Successfully retrieved {len(all_recipients)} recipients from DynamoDB table: {recipient_list_table}")
                  except Exception as e:
                      logger.error(f"Error retrieving recipients from DynamoDB: {str(e)}")
                      return {
                          'statusCode': 500,
                          'body': json.dumps({
                              'error': f"Failed to retrieve recipients from table: {str(e)}"
                          })
                      }

                  # Get total count of recipients
                  total_count = len(all_recipients)
                  logger.info(f"Total valid email addresses found in table: {total_count}")

                  if total_count == 0:
                      return {
                          'statusCode': 200,
                          'body': json.dumps({
                              'message': 'No valid email addresses found in the table',
                              'timestamp': datetime.now().isoformat()
                          })
                      }

                  # Calculate number of batches needed
                  total_batches = (total_count + batch_size - 1) // batch_size
                  logger.info(f"Will create {total_batches} batch files with up to {batch_size} recipients each")

                  # Initialize batch tracking
                  dynamodb = boto3.resource('dynamodb')
                  batch_table = dynamodb.Table(batch_table_name)

                  # Create manifest file structure
                  manifest = {
                      'campaignId': campaign_id,
                      'totalRecipients': total_count,
                      'createdAt': datetime.now().isoformat(),
                      'sender': {
                          'email': sender_email,
                          'name': sender_name
                      },
                      'template': {
                          'name': template_name,
                          'version': template_version
                      },
                      'batches': []
                  }

                  # Process records and create S3 batch files
                  processed = 0
                  batch_files_created = 0
                  start_time = time.time()

                  # Process in batches
                  for batch_num in range(total_batches):
                      start_idx = batch_num * batch_size
                      end_idx = min(start_idx + batch_size, total_count)

                      batch_recipients = all_recipients[start_idx:end_idx]
                      logger.info(f"Processing batch {batch_num+1}/{total_batches} with {len(batch_recipients)} recipients")

                      batch_id = f"{campaign_id}-batch-{batch_num+1:04d}"
                      batch_key = f"batches/{campaign_id}/{batch_id}.json"

                      # Create batch data structure
                      batch_data = {
                          "batchId": batch_id,
                          "campaignId": campaign_id,
                          "recipientTrackingTable": recipient_table_name,
                          "batchTrackingTable": batch_table_name,
                          "sender": {
                              "email": sender_email,
                              "name": sender_name
                          },
                          "template": {
                              "name": template_name,
                              "version": template_version
                          },
                          "destinations": batch_recipients,
                          "attachments": event.get('attachments', []),
                          "topicName": event.get('topicName'),
                          "templateS3Key": event.get('templateS3Key'),
                          "createdAt": datetime.now().isoformat(),
                          "campaign": campaign_name
                      }

                      # Upload batch file to S3
                      s3_client.put_object(
                          Bucket=batch_bucket,
                          Key=batch_key,
                          Body=json.dumps(batch_data),
                          ContentType='application/json'
                      )

                      # Add batch entry to manifest
                      manifest['batches'].append({
                          'batchId': batch_id,
                          'objectKey': batch_key,
                          'recipientCount': len(batch_recipients),
                          'recipientTrackingTable': recipient_table_name,
                          'batchTrackingTable': batch_table_name
                      })

                      # Add entry to campaign-specific DynamoDB batch tracking table
                      batch_item = {
                          'BatchId': batch_id,
                          'Status': 'PENDING',
                          'CampaignId': campaign_id,
                          'RecipientCount': len(batch_recipients),
                          'S3Key': batch_key,
                          'CreatedAt': datetime.now().isoformat()
                      }
                      expiration_time = tracking_expiration()
                      if expiration_time is not None:
                          batch_item['ExpirationTime'] = expiration_time
                      batch_table.put_item(Item=batch_item)

                      batch_files_created += 1
                      processed += len(batch_recipients)

                      # Log progress periodically
                      if batch_files_created % 5 == 0 or batch_files_created == total_batches:
                          pct_done = (processed * 100) // total_count
                          elapsed = time.time() - start_time
                          rate = processed / elapsed if elapsed > 0 else 0

                          logger.info(f"Progress: {processed}/{total_count} emails ({pct_done}%) - "
                                    f"Created {batch_files_created} batch files - Rate: {rate:.2f} records/sec")

                      # Check if we're approaching Lambda timeout (max 15 min, give 1 min buffer)
                      if context.get_remaining_time_in_millis() < 60000 and processed < total_count:
                          logger.warning("Approaching Lambda timeout. Returning partial completion.")

                          # Upload partial manifest
                          manifest_key = f"batches/{campaign_id}/manifest.json"
                          manifest['isComplete'] = False
                          manifest['processedRecipients'] = processed
                          manifest['campaignId'] = campaign_id
                          manifest['recipientTrackingTable'] = recipient_table_name
                          manifest['batchTrackingTable'] = batch_table_name

                          s3_client.put_object(
                              Bucket=batch_bucket,
                              Key=manifest_key,
                              Body=json.dumps(manifest),
                              ContentType='application/json'
                          )

                          return {
                              'statusCode': 206,  # Partial Content
                              'message': 'Email processing partially completed due to time constraints',
                              'campaignId': campaign_id,
                              'manifestKey': manifest_key,
                              'processedRecipients': processed,
                              'batchesCreated': batch_files_created,
                              'totalRecipients': total_count,
                              'remainingRecipients': total_count - processed,
                              'recipientTrackingTable': recipient_table_name,
                              'batchTrackingTable': batch_table_name,
                              'batches': manifest['batches'],
                              'senderEmail': sender_email,
                              'senderName': sender_name
                          }

                  end_time = time.time()
                  duration = end_time - start_time

                  # Upload complete manifest
                  manifest_key = f"batches/{campaign_id}/manifest.json"
                  manifest['isComplete'] = True
                  manifest['processingTimeSeconds'] = duration
                  manifest['campaignId'] = campaign_id
                  manifest['recipientTrackingTable'] = recipient_table_name
                  manifest['batchTrackingTable'] = batch_table_name

                  s3_client.put_object(
                      Bucket=batch_bucket,
                      Key=manifest_key,
                      Body=json.dumps(manifest),
                      ContentType='application/json'
                  )

                  # Return the data needed for step function processing
                  return {
                      'statusCode': 200,
                      'message': 'Email batch preparation completed successfully',
                      'campaignId': campaign_id,
                      'manifestKey': manifest_key,
                      'processedRecipients': processed,
                      'batchesCreated': batch_files_created,
                      'durationSeconds': duration,
                      'timestamp': datetime.now().isoformat(),
                      'recipientTrackingTable': recipient_table_name,
                      'batchTrackingTable': batch_table_name,
                      'batches': manifest['batches'],
                      'senderEmail': sender_email,
                      'senderName': sender_name,
                      'recipientTableSource': recipient_list_table
                  }

              except Exception as e:
                  logger.error(f"Error during email processing: {str(e)}")
                  return {
                      'statusCode': 500,
                      'body': json.dumps({
                          'error': str(e)
                      })
                  }

      Runtime: python3.13
      Timeout: 900  # 15 minutes
      MemorySize: 2048
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          RECIPIENTS_BUCKET: !Ref RecipientsBucket
          BATCH_BUCKET: !Ref EmailBatchBucket
          BATCH_SIZE: !Ref BatchSize
          TRACKING_RETENTION_DAYS: !Ref TrackingDataRetentionDays
      KmsKeyArn: !Ref LambdaKMSKeyArn

