      #       Status: "Enabled"
      #     Filter: {}
      #     Priority: 0

  ## S3 Bucket policy for static website hosting
  # S3BucketPolicyRadxDataHubNihGov:
  #   UpdateReplacePolicy: "Retain"
  #   Type: "AWS::S3::BucketPolicy"
  #   DeletionPolicy: "Retain"
  #   Properties:
  #     Bucket:
  #       Ref: "S3BucketRadxDataHubNihGov"
  #     PolicyDocument:
  #       Version: "2012-10-17"
  #       Statement:
  #       - Condition:
  #           StringEquals:
  #             aws:SourceVpce: !Ref VPCId ##FIXME - Parameterize VPC Endpoint ID
  #         Resource:
  #         - "arn:aws:s3:::radxdatahub.nih.gov" ##FIXME
  #         - "arn:aws:s3:::radxdatahub.nih.gov/*" ##FIXME
  #         Action: "s3:GetObject"
  #         Effect: "Allow"
  #         Principal: "*"
  #         Sid: "Access-to-specific-VPCE-only"
  #       Id: "VPC-Endpoint-Interface-4-S3-Webpages"

  ## Bucket containing Lambda function code artifacts for deployment
  S3BucketRadxLambdaArtifacts:
    Type: "AWS::S3::Bucket"
    DeletionPolicy: Delete ## CHANGE THIS
    Properties:
      PublicAccessBlockConfiguration:
        RestrictPublicBuckets: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        BlockPublicAcls: true
      BucketName: !Sub "radx-lambda-artifacts-${Environment}" ## PLEASE MODIFY to ensure global uniqueness according to our organization's needs
      Tags:
      - Key: "Environment"
        Value: !Sub "${Environment}"
      VersioningConfiguration:
        Status: "Enabled"
      OwnershipControls:
        Rules:
        - ObjectOwnership: "BucketOwnerEnforced"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - BucketKeyEnabled: true
          ServerSideEncryptionByDefault:
            SSEAlgorithm: "AES256"

Outputs:
  S3BucketRadxMacieResultsName:
    Description: "The ARN of the S3 bucket for Macie results"
    Value: !GetAtt S3BucketRadxMacieResults.Arn
    Export:
      Name: !Sub "${AWS::StackName}-S3BucketRadxMacieResults-Arn"
  S3BucketCovidRadxReviewName:
    Description: "The ARN of the S3 bucket for Covid RADx review files"
    Value: !GetAtt S3BucketCovidRadxReview.Arn
    Export:
      Name: !Sub "${AWS::StackName}-S3BucketCovidRadxReview-Arn"
  S3BucketCovidRadxDefaultName:
    Description: "The ARN of the S3 bucket for Covid RADx default files"
    Value: !GetAtt S3BucketCovidRadxDefault.Arn
    Export:
      Name: !Sub "${AWS::StackName}-S3BucketCovidRadxDefault-Arn"
  S3BucketSftpRadxName:
    Description: "The ARN of the S3 bucket for SFTP user home directories"
    Value: !GetAtt S3BucketSftpRadx.Arn
    Export:
      Name: !Sub "${AWS::StackName}-S3BucketSftpRadx-Arn"
  S3BucketRadxUploadPortalName:
    Description: "The ARN of the main S3 bucket for the RADx Upload Portal"
    Value: !GetAtt S3BucketRadxUploadPortal.Arn
    Export:
      Name: !Sub "${AWS::StackName}-S3BucketRadxUploadPortal-Arn"
  S3BucketCovidRadxIngestPdfName:
    Description: "The ARN of the S3 bucket for Covid RADx ingest PDF files"
    Value: !GetAtt S3BucketCovidRadxIngestPdf.Arn
    Export:
      Name: !Sub "${AWS::StackName}-S3BucketCovidRadxIngestPdf-Arn"
  S3BucketRadxLambdaArtifactsName:
    Description: "The ARN of the S3 bucket for Lambda function artifacts"
    Value: !GetAtt S3BucketRadxLambdaArtifacts.Arn
    Export:
      Name: !Sub "${AWS::StackName}-S3BucketRadxLambdaArtifacts-Arn"