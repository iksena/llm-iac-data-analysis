AWSTemplateFormatVersion: '2010-09-09'
Description: 'Creates shared IAM roles and instance profiles required by Amazon EKS Quick Start stacks'
Resources:
  CopyZipArtifactsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: eks-quickstart-copy-zip-artifacts-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: copy-zip-artifacts-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource: '*'
  ReadResourceInfoRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: eks-quickstart-read-resource-info-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/ReadOnlyAccess
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
  CreateVpcRoleLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: eks-quickstart-create-vpc-role-lambda-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: assume-role-creation-role
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sts:AssumeRole
                Resource: !GetAtt RoleCreationRole.Arn
  DeleteBucketContentsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: eks-quickstart-delete-bucket-contents-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: delete-bucket-contents-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:ListBucket
                  - s3:GetObject
                Resource: '*'
  CleanupLoadBalancersRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: eks-quickstart-cleanup-load-balancers-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: cleanup-load-balancers-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - elasticloadbalancing:DescribeLoadBalancers
                  - elasticloadbalancing:DescribeTargetGroups
                  - elasticloadbalancing:DescribeListeners
                  - elasticloadbalancing:DeleteLoadBalancer
                  - elasticloadbalancing:DeleteTargetGroup
                  - elasticloadbalancing:DeleteListener
                Resource: '*'
  CleanupSecurityGroupDependenciesRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: eks-quickstart-cleanup-sg-dependencies-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: cleanup-sg-dependencies-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSecurityGroupReferences
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupEgress
                  - ec2:DeleteSecurityGroup
                Resource: '*'
  CleanupLambdaFunctionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: eks-quickstart-cleanup-lambda-functions-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: cleanup-lambda-functions-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:DeleteFunction
                  - lambda:ListFunctions
                  - lambda:GetFunction
                Resource: '*'
  ResolveCallerARNsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: eks-quickstart-resolve-caller-arns-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: get-caller-identity
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sts:GetCallerIdentity
                Resource: '*'
  RegisterCustomResourceTypesRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: eks-quickstart-register-custom-resource-types-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: register-custom-resource-types-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:RegisterType
                  - cloudformation:DeregisterType
                  - cloudformation:DescribeType
                  - cloudformation:ListTypes
                Resource: '*'
  ManageNodeSecurityGroupsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: eks-quickstart-manage-node-sg-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: manage-security-groups-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:CreateSecurityGroup
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupEgress
                  - ec2:DeleteSecurityGroup
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSecurityGroupRules
                Resource: '*'
  CreateFargateProfilesRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: eks-quickstart-create-fargate-profiles-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: create-fargate-profiles-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - eks:CreateFargateProfile
                  - eks:DeleteFargateProfile
                  - eks:DescribeFargateProfile
                  - eks:ListFargateProfiles
                Resource: '*'
  ResolveSSMParametersRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: eks-quickstart-resolve-ssm-parameters-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: get-ssm-parameters
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/quickstart/amazon-eks/*'
  EKSControlPlaneRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: eks-quickstart-control-plane-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy
        - arn:aws:iam::aws:policy/AmazonEKSServicePolicy
      Policies:
        - PolicyName: additional-control-plane-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeAccountAttributes
                  - ec2:DescribeAddresses
                  - ec2:DescribeInternetGateways
                Resource: '*'
  FargateExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: eks-quickstart-fargate-execution-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: eks-fargate-pods.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSFargatePodExecutionRolePolicy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
  ManagedNodeInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: eks-quickstart-managed-node-instance-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/AmazonElasticFileSystemReadOnlyAccess
      Policies:
        - PolicyName: cloudformation-signal
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: cloudformation:SignalResource
                Resource: !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*'
  UnmanagedNodeInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: eks-quickstart-unmanaged-node-instance-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/AmazonElasticFileSystemReadOnlyAccess
      Policies:
        - PolicyName: cloudformation-signal
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: cloudformation:SignalResource
                Resource: !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*'
  ManagedNodeInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: eks-quickstart-managed-node-instance-profile
      Roles:
        - !Ref ManagedNodeInstanceRole
  UnmanagedNodeInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: eks-quickstart-unmanaged-node-instance-profile
      Roles:
        - !Ref UnmanagedNodeInstanceRole
  RoleCreationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: eks-quickstart-role-creation-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: create-vpc-role
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: iam:CreateRole
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/CloudFormation-Kubernetes-VPC'
              - Effect: Allow
                Action: iam:AttachRolePolicy
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/CloudFormation-Kubernetes-VPC'
                Condition:
                  StringEquals:
                    'iam:PolicyARN':
                      - 'arn:aws:iam::aws:policy/service-role/AWSLambdaENIManagementAccess'
                      - 'arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
  CopyZipArtifactsParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /quickstart/amazon-eks/LambdaRole/CopyZipArtifacts
      Type: String
      Value: !GetAtt CopyZipArtifactsRole.Arn
  ReadResourceInfoParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /quickstart/amazon-eks/LambdaRole/ReadResourceInfo
      Type: String
      Value: !GetAtt ReadResourceInfoRole.Arn
  CreateVpcRoleLambdaParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /quickstart/amazon-eks/LambdaRole/CreateVpcRole
      Type: String
      Value: !GetAtt CreateVpcRoleLambdaRole.Arn
  DeleteBucketContentsParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /quickstart/amazon-eks/LambdaRole/DeleteBucketContents
      Type: String
      Value: !GetAtt DeleteBucketContentsRole.Arn
  CleanupLoadBalancersParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /quickstart/amazon-eks/LambdaRole/CleanupLoadBalancers
      Type: String
      Value: !GetAtt CleanupLoadBalancersRole.Arn
  CleanupSecurityGroupDependenciesParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /quickstart/amazon-eks/LambdaRole/CleanupSecurityGroupDependencies
      Type: String
      Value: !GetAtt CleanupSecurityGroupDependenciesRole.Arn
  CleanupLambdaFunctionsParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /quickstart/amazon-eks/LambdaRole/CleanupLambdaFunctions
      Type: String
      Value: !GetAtt CleanupLambdaFunctionsRole.Arn
  ResolveCallerARNsParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /quickstart/amazon-eks/LambdaRole/ResolveCallerARNs
      Type: String
      Value: !GetAtt ResolveCallerARNsRole.Arn
  RegisterCustomResourceTypesParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /quickstart/amazon-eks/LambdaRole/RegisterCustomResourceTypes
      Type: String
      Value: !GetAtt RegisterCustomResourceTypesRole.Arn
  ManageNodeSecurityGroupsParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /quickstart/amazon-eks/LambdaRole/ManageNodeSecurityGroups
      Type: String
      Value: !GetAtt ManageNodeSecurityGroupsRole.Arn
  CreateFargateProfilesParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /quickstart/amazon-eks/LambdaRole/CreateFargateProfiles
      Type: String
      Value: !GetAtt CreateFargateProfilesRole.Arn
  ResolveSSMParametersParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /quickstart/amazon-eks/LambdaRole/ResolveSSMParameters
      Type: String
      Value: !GetAtt ResolveSSMParametersRole.Arn
  EKSControlPlaneRoleParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /quickstart/amazon-eks/Role/ControlPlane
      Type: String
      Value: !GetAtt EKSControlPlaneRole.Arn
  FargateExecutionRoleParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /quickstart/amazon-eks/Role/FargateExecution
      Type: String
      Value: !GetAtt FargateExecutionRole.Arn
  ManagedNodeInstanceRoleParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /quickstart/amazon-eks/Role/ManagedNodeInstance
      Type: String
      Value: !GetAtt ManagedNodeInstanceRole.Arn
  UnmanagedNodeInstanceRoleParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /quickstart/amazon-eks/Role/UnmanagedNodeInstance
      Type: String
      Value: !GetAtt UnmanagedNodeInstanceRole.Arn
  ManagedNodeInstanceProfileParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /quickstart/amazon-eks/InstanceProfile/ManagedNode
      Type: String
      Value: !GetAtt ManagedNodeInstanceProfile.Arn
  UnmanagedNodeInstanceProfileParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /quickstart/amazon-eks/InstanceProfile/UnmanagedNode
      Type: String
      Value: !GetAtt UnmanagedNodeInstanceProfile.Arn
  RoleCreationRoleParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /quickstart/amazon-eks/Role/RoleCreation
      Type: String
      Value: !GetAtt RoleCreationRole.Arn