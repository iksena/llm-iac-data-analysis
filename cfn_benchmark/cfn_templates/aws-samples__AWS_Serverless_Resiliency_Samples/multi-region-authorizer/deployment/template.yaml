AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Tardigrada-authorizer Mainstack

Globals:
  Function:
    Timeout: 3

Parameters:
  DomainName:
    Type: String
    Description: The custom domain name for the API Gateway
    Default: "<< ADD YOUR DOMAIN NAME - example.com >>"
  ACMCertificatePrimary:
    Type: String
    Description: ACM Certificate for the primary region
    Default: "<< ADD CERTIFICATE ARN FOR THE PRIMARY REGION >>"
  ACMCertificateSecondary:
    Type: String
    Description: ACM Certificate for the secondary region
    Default: "<< ADD CERTIFICATE ARN FOR THE SECONDARY REGION >>"
  APIStageName:
    Type: String
    Description: Deployment stage for the Rest API
    Default: "prod"
  Auth0DomainName:
    Type: String
    Description: Deployment stage for the Rest API
    Default: "prod"
  Auth0ClientId:
    Type: String
    Description: Deployment stage for the Rest API
    Default: "prod"

Conditions:
  IsinUsEast1:
    Fn::Equals:
      - !Ref AWS::Region
      - us-east-1

Resources:

  CustomAuthorizer:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: multi-region-custom-authorizer
      CodeUri: "../custom-authorizer/"
      Handler: app.handler
      Runtime: nodejs20.x
      Environment:
        Variables:
          AUTH0_DOMAIN: !Ref Auth0DomainName
          OIDC_CLIENT_ID: !Ref Auth0ClientId

  BackendFuncRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: InvokeCustomAuthorizer
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'lambda:InvokeFunction'
                Resource: !GetAtt CustomAuthorizer.Arn

  BackendFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: tardi-backend
      Runtime: nodejs20.x
      CodeUri: "../backend-function/"
      Handler: index.handler
      Events:
        RegionalApi:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /hello
            Method: GET

  FailureFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: MockHealthCheck
      Runtime: nodejs20.x
      CodeUri: "../failure-function/"
      Handler: index.handler
      Events:
        RegionalApi:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /failure
            Method: GET
            Auth:
              Authorizer: NONE
              OverrideApiAuth: true

  BackendLambdaInvokePermission:
     Type: AWS::Lambda::Permission
     Properties:
       FunctionName: !GetAtt BackendFunction.Arn
       Action: lambda:InvokeFunction
       Principal: apigateway.amazonaws.com
       SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/GET/'

  FailureLambdaInvokePermission:
     Type: AWS::Lambda::Permission
     Properties:
       FunctionName: !GetAtt FailureFunction.Arn
       Action: lambda:InvokeFunction
       Principal: apigateway.amazonaws.com
       SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/GET/'

  RestApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref APIStageName
      EndpointConfiguration:
        Type: REGIONAL
      Auth:
        DefaultAuthorizer: CustomAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CustomAuthorizer:
            FunctionArn: !GetAtt CustomAuthorizer.Arn
            FunctionPayloadType: TOKEN
            Identity:
              Header: Authorization

      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"

      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          LoggingLevel: INFO
          DataTraceEnabled: true

      DefinitionBody:
        openapi: 3.0.0
        info:
          title: Multi_region_Authorizer
        paths:
          /hello:
            get:
              responses:
                '200':
                  description: OK
                '500':
                  description: 'Backend Failure'
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                payloadFormatVersion: '2.0'
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${BackendFunction.Arn}/invocations
            options:
              summary: CORS support
              description: Enable CORS by returning correct headers
              responses:
                '200':
                  description: Default response for CORS method
                  headers:
                    Access-Control-Allow-Origin:
                      schema:
                        type: string
                    Access-Control-Allow-Methods:
                      schema:
                        type: string
                    Access-Control-Allow-Headers:
                      schema:
                        type: string
                  content: {}
              x-amazon-apigateway-integration:
                type: mock
                requestTemplates:
                  application/json: '{"statusCode": 200}'
                responses:
                  default:
                    statusCode: "200"
                    responseParameters:
                      method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
                      method.response.header.Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: "{}\n"

          /failure:
            get:
              responses:
                '200':
                  description: OK
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/ResponseModel'
                '500':
                  description: 'Backend Failure'
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/ErrorModel'
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                payloadFormatVersion: '2.0'
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FailureFunction.Arn}/invocations

            options:
              summary: CORS support
              description: Enable CORS by returning correct headers
              responses:
                '200':
                  description: Default response for CORS method
                  headers:
                    Access-Control-Allow-Origin:
                      schema:
                        type: string
                    Access-Control-Allow-Methods:
                      schema:
                        type: string
                    Access-Control-Allow-Headers:
                      schema:
                        type: string
                  content: {}
              x-amazon-apigateway-integration:
                type: mock
                requestTemplates:
                  application/json: '{"statusCode": 200}'
                responses:
                  default:
                    statusCode: "200"
                    responseParameters:
                      method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
                      method.response.header.Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
                      method.response.header.Access-Control-Allow-Origin: "'*'"
                    responseTemplates:
                      application/json: "{}\n"

  ApiGatewayDomainName:
    DependsOn: RestApi
    Type: AWS::ApiGateway::DomainName
    Properties:
      DomainName: !Ref DomainName
      RegionalCertificateArn:
        Fn::If:
          - IsinUsEast1
          - !Ref ACMCertificatePrimary
          - !Ref ACMCertificateSecondary
      EndpointConfiguration:
        Types:
          - REGIONAL

  RestApiMapping:
    Type: AWS::ApiGateway::BasePathMapping
    Properties:
      DomainName: !Ref ApiGatewayDomainName
      RestApiId: !Ref RestApi
      Stage: !Ref APIStageName

Outputs:
  ApiUrl:
    Description: API Gateway Endpoint URL for Prod Stage
    Value: !Sub https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/${APIStageName}

  ApiDNSName:
    Description: Distribution Domain Name
    Value: !GetAtt ApiGatewayDomainName.RegionalDomainName

  HostedZoneId:
    Description: Distribution Hosted Zone ID
    Value: !GetAtt ApiGatewayDomainName.RegionalHostedZoneId