AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Lab 7.3 — AppConfig hosted free-form configuration with reader Lambda

Resources:
  Application:
    Type: AWS::AppConfig::Application
    Properties:
      Name: dva-lab-07-03

  Environment:
    Type: AWS::AppConfig::Environment
    Properties:
      ApplicationId: !Ref Application
      Name: dev

  Profile:
    Type: AWS::AppConfig::ConfigurationProfile
    Properties:
      ApplicationId: !Ref Application
      Name: app-config
      LocationUri: hosted
      Type: AWS.Freeform
      Validators: []

  InitialVersion:
    Type: AWS::AppConfig::HostedConfigurationVersion
    Properties:
      ApplicationId: !Ref Application
      ConfigurationProfileId: !Ref Profile
      ContentType: application/json
      Content: |
        {
          "checkout_v2_enabled": false,
          "free_shipping_enabled": false,
          "max_items": 100
        }

  Strategy:
    Type: AWS::AppConfig::DeploymentStrategy
    Properties:
      Name: dva-lab-07-03-all-at-once
      DeploymentDurationInMinutes: 0
      FinalBakeTimeInMinutes: 0
      GrowthFactor: 100
      ReplicateTo: NONE

  InitialDeployment:
    Type: AWS::AppConfig::Deployment
    Properties:
      ApplicationId: !Ref Application
      EnvironmentId: !Ref Environment
      DeploymentStrategyId: !Ref Strategy
      ConfigurationProfileId: !Ref Profile
      ConfigurationVersion: !Ref InitialVersion

  ReaderRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ReadAppConfig
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - appconfig:StartConfigurationSession
                  - appconfig:GetLatestConfiguration
                  - appconfigdata:StartConfigurationSession
                  - appconfigdata:GetLatestConfiguration
                Resource: "*"

  Reader:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dva-lab-07-03-reader
      Runtime: python3.12
      Handler: handler.handler
      Role: !GetAtt ReaderRole.Arn
      CodeUri: src/
      Timeout: 10
      Environment:
        Variables:
          APP_ID: !Ref Application
          ENV_ID: !Ref Environment
          PROFILE_ID: !Ref Profile

Outputs:
  ApplicationId:
    Value: !Ref Application
  EnvironmentId:
    Value: !Ref Environment
  ProfileId:
    Value: !Ref Profile
  StrategyId:
    Value: !Ref Strategy
  ReaderFunctionName:
    Value: !Ref Reader