AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  OR-Tools FaaS feasibility probe. This template intentionally creates no
  public Function URL or API endpoint.

Resources:
  SolverProbeFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: .
      Dockerfile: Dockerfile
      DockerTag: python3.14-ortools-probe
    Properties:
      PackageType: Image
      Architectures:
        - x86_64
      MemorySize: 2048
      Timeout: 45
      # This validation account has only the minimum unreserved concurrency
      # quota, so reserving even one execution is rejected by Lambda. The
      # function has no public trigger and is invoked directly by an operator.
      Tags:
        Project: football-scheduler
        Purpose: faas-ortools-spike
      Environment:
        Variables:
          SOLVER_MAX_TIME_SECONDS: "30"

  SolverProbeLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/aws/lambda/${SolverProbeFunction}"
      RetentionInDays: 1
      Tags:
        - Key: Project
          Value: football-scheduler
        - Key: Purpose
          Value: faas-ortools-spike

Outputs:
  FunctionName:
    Description: Name of the private Lambda function used by the probe.
    Value: !Ref SolverProbeFunction
  LogGroupName:
    Description: CloudWatch Logs group deleted with the probe stack.
    Value: !Ref SolverProbeLogGroup

# A browser origin restriction (CORS) is not authentication or abuse
# prevention. If an HTTP endpoint is introduced for a later experiment, add
# authentication, rate limiting, and cost controls explicitly; do not expose
# this function merely by adding an unrestricted Function URL.