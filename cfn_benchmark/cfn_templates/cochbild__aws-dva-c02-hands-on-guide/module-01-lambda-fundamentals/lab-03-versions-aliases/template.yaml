AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: |
  DVA-C02 Lab 1.3 — Versions and aliases
  Demonstrates AutoPublishAlias which publishes a new version on every deploy
  and updates the alias to point at it.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 5
    MemorySize: 128
    LoggingConfig:
      LogFormat: JSON

Resources:
  VersionedFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dva-lab-01-03-versions
      CodeUri: src/
      Handler: app.handler
      # AutoPublishAlias: SAM publishes a new version on every deploy and updates this alias.
      # The alias is a stable name callers can use; behind the scenes it points at numbered versions.
      AutoPublishAlias: live
      # Bonus: configure deployment preference for canary on every deploy
      # Uncomment when ready (this triggers a CodeDeploy deployment per stack update)
      # DeploymentPreference:
      #   Type: Canary10Percent5Minutes
      #   Alarms:
      #     - !Ref AliasErrorAlarm

  # Optional alarm referenced by DeploymentPreference (for Module 8 reuse)
  AliasErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: dva-lab-01-03-alias-errors
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: Resource
          Value: dva-lab-01-03-versions:live
        - Name: FunctionName
          Value: dva-lab-01-03-versions
      TreatMissingData: notBreaching

Outputs:
  FunctionName:
    Value: !Ref VersionedFunction
  AliasArn:
    Description: ARN to invoke the alias (use this in callers)
    Value: !Ref VersionedFunction.Alias
  CurrentVersion:
    Value: !Ref VersionedFunction.Version