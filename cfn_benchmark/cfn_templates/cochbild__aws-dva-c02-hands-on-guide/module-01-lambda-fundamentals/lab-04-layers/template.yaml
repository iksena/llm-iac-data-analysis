AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: |
  DVA-C02 Lab 1.4 — Lambda layers
  Defines a shared layer with `requests` and two functions that both consume it.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 256
    LoggingConfig:
      LogFormat: JSON

Resources:
  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: dva-shared-layer
      Description: Shared HTTP client (requests)
      ContentUri: layer/
      CompatibleRuntimes:
        - python3.12
      RetentionPolicy: Delete
    Metadata:
      # SAM uses this to pip-install layer/python/requirements.txt
      BuildMethod: python3.12

  FunctionA:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dva-lab-01-04-fn-a
      CodeUri: src/
      Handler: app_a.handler
      Layers:
        - !Ref SharedLayer

  FunctionB:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dva-lab-01-04-fn-b
      CodeUri: src/
      Handler: app_b.handler
      Layers:
        - !Ref SharedLayer

Outputs:
  LayerArn:
    Value: !Ref SharedLayer
  FunctionAName:
    Value: !Ref FunctionA
  FunctionBName:
    Value: !Ref FunctionB