AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  LMI Example - Application Stack (Application Team)
  Deploys a sample Lambda function on an existing LMI capacity provider.
  The capacity provider ARN is provided as a parameter.

Parameters:
  CapacityProviderArn:
    Type: String
    Description: ARN of the LMI capacity provider to run this function on
  FunctionName:
    Type: String
    Default: lmi-example-function

Resources:
  SampleFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Ref FunctionName
      Runtime: python3.13
      Handler: handler.handler
      CodeUri: src/
      MemorySize: 2048
      Timeout: 30
      Architectures:
        - arm64
      CapacityProviderConfig:
        Arn: !Ref CapacityProviderArn
        ExecutionEnvironmentMemoryGiBPerVCpu: 2
        PerExecutionEnvironmentMaxConcurrency: 10
      PublishToLatestPublished: true

Outputs:
  FunctionName:
    Description: Function name
    Value: !Ref FunctionName
  FunctionArn:
    Description: Function ARN
    Value: !GetAtt SampleFunction.Arn