AWSTemplateFormatVersion: "2010-09-09"
Description: Static SPA hosting on S3 behind CloudFront (OAC). Optional custom domain + Route53.

Parameters:
  BucketName:
    Type: String
    Description: Globally-unique S3 bucket name for site content (no dots if you’ll add OAC, recommended).
  DomainName:
    Type: String
    Default: ""
    Description: Optional apex or subdomain (e.g., app.example.com). Leave blank to use default CloudFront domain.
  AcmCertificateArn:
    Type: String
    Default: ""
    Description: Optional ACM cert ARN (must be in us-east-1 for CloudFront). Required if DomainName is set.
  HostedZoneId:
    Type: String
    Default: ""
    Description: Optional Route53 Hosted Zone ID (required only if CreateAliasRecord is true).
  CreateAliasRecord:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Create Route53 alias A-record for DomainName? (true/false)
  PriceClass:
    Type: String
    Default: PriceClass_100
    AllowedValues: [PriceClass_100, PriceClass_200, PriceClass_All]
    Description: CloudFront price class / edge coverage.

Conditions:
  UseAliases: !Not [!Equals [!Ref DomainName, ""]]
  UseCert: !Not [!Equals [!Ref AcmCertificateArn, ""]]
  CreateRecord:
    !And [
      !Condition UseAliases,
      !Equals [!Ref CreateAliasRecord, "true"],
      !Not [!Equals [!Ref HostedZoneId, ""]],
    ]

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${BucketName}-oac"
        Description: Access S3 with SigV4
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        PriceClass: !Ref PriceClass
        DefaultRootObject: index.html
        Aliases: !If [UseAliases, [!Ref DomainName], !Ref "AWS::NoValue"]
        Origins:
          - Id: s3origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            S3OriginConfig: {}
            OriginAccessControlId: !Ref OriginAccessControl
        DefaultCacheBehavior:
          TargetOriginId: s3origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # CORS-Simple + Security (optional)
        CustomErrorResponses:
          # SPA fallback: serve index.html on 404/403
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
        ViewerCertificate: !If
          - UseCert
          - AcmCertificateArn: !Ref AcmCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2019
          - CloudFrontDefaultCertificate: true
        HttpVersion: http2and3
        IPV6Enabled: true

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOACRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: "s3:GetObject"
            Resource: !Sub "arn:aws:s3:::${BucketName}/*"
            Condition:
              StringEquals:
                "AWS:SourceArn": !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  DnsRecord:
    Condition: CreateRecord
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        HostedZoneId: Z2FDTNDATAQYW2 # CloudFront hosted zone id (global constant)
        DNSName: !GetAtt Distribution.DomainName

Outputs:
  BucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
  WebsiteURL:
    Value:
      !If [
        UseAliases,
        !Sub "https://${DomainName}",
        !Sub "https://${Distribution.DomainName}",
      ]