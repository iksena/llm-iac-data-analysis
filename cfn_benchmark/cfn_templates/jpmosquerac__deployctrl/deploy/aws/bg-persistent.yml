AWSTemplateFormatVersion: '2010-09-09'
Description: >
  DeployCtrl - persistent Blue/Green infrastructure.
  Creates the ALB, two target groups (blue/green), the listener, and a
  long-lived MongoDB EC2 instance that both colors share.
  Deployed ONCE; the per-color app stacks (bg-app.yml) plug into it.

Parameters:

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC for the ALB and instances. Default VPC works fine.

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >
      At least TWO public subnets in different AZs (ALB requirement).
      The MongoDB instance is placed in the first subnet.

  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: EC2 key pair for SSH access to the MongoDB instance.

  SSHLocation:
    Type: String
    Default: 0.0.0.0/0
    AllowedPattern: '(\d{1,3}\.){3}\d{1,3}/\d{1,2}'
    Description: CIDR allowed to SSH into instances. Restrict to your IP (x.x.x.x/32) in production.

  MongoInstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.micro, t3.small, t3.medium, t3.large, m5.large]

  MongoDiskSizeGB:
    Type: Number
    Default: 50
    MinValue: 10
    MaxValue: 1000

  MongoDBVersion:
    Type: String
    Default: '8.0'
    AllowedValues: ['7.0', '8.0']

  HealthCheckPath:
    Type: String
    Default: /
    Description: Path the ALB hits on each target. Django returns 302 on / when not logged in - both 200 and 302 are accepted.

Resources:

  # ── Security groups ────────────────────────────────────────────────────────
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${AWS::StackName}-alb-sg'
      GroupDescription: ALB - HTTP/HTTPS from the world
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80,  ToPort: 80,  CidrIp: 0.0.0.0/0, Description: HTTP }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTPS }
      Tags:
        - { Key: Name,  Value: !Sub '${AWS::StackName}-alb-sg' }
        - { Key: Stack, Value: !Ref AWS::StackName }

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${AWS::StackName}-app-sg'
      GroupDescription: DeployCtrl app instances - port 80 from ALB, restricted SSH
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref AlbSecurityGroup
          Description: HTTP from ALB
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SSHLocation
          Description: SSH (restrict in prod)
      Tags:
        - { Key: Name,  Value: !Sub '${AWS::StackName}-app-sg' }
        - { Key: Stack, Value: !Ref AWS::StackName }

  MongoSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${AWS::StackName}-mongo-sg'
      GroupDescription: MongoDB - port 27017 from app instances only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 27017
          ToPort: 27017
          SourceSecurityGroupId: !Ref AppSecurityGroup
          Description: MongoDB from app SG
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SSHLocation
          Description: SSH (restrict in prod)
      Tags:
        - { Key: Name,  Value: !Sub '${AWS::StackName}-mongo-sg' }
        - { Key: Stack, Value: !Ref AWS::StackName }

  # ── Application Load Balancer ──────────────────────────────────────────────
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${AWS::StackName}-alb'
      Scheme: internet-facing
      Type: application
      SecurityGroups: [!Ref AlbSecurityGroup]
      Subnets: !Ref SubnetIds
      Tags:
        - { Key: Stack, Value: !Ref AWS::StackName }

  BlueTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${AWS::StackName}-tg-blue'
      Port: 80
      Protocol: HTTP
      VpcId: !Ref VpcId
      TargetType: instance
      HealthCheckPath: !Ref HealthCheckPath
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: '200,301,302' }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: '30' }
      Tags:
        - { Key: Color, Value: blue  }
        - { Key: Stack, Value: !Ref AWS::StackName }

  GreenTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${AWS::StackName}-tg-green'
      Port: 80
      Protocol: HTTP
      VpcId: !Ref VpcId
      TargetType: instance
      HealthCheckPath: !Ref HealthCheckPath
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: '200,301,302' }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: '30' }
      Tags:
        - { Key: Color, Value: green }
        - { Key: Stack, Value: !Ref AWS::StackName }

  # Listener defaults to BLUE on first deploy. The workflow flips it
  # to GREEN once the green stack is healthy, and back again on the
  # next deploy.
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref BlueTargetGroup

  # ── MongoDB instance ───────────────────────────────────────────────────────
  MongoRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-mongo-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - { Effect: Allow, Principal: { Service: ec2.amazonaws.com }, Action: sts:AssumeRole }
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy

  MongoInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref MongoRole]

  MongoInstance:
    Type: AWS::EC2::Instance
    CreationPolicy:
      ResourceSignal:
        Timeout: PT15M
    Properties:
      InstanceType: !Ref MongoInstanceType
      KeyName: !Ref KeyPairName
      IamInstanceProfile: !Ref MongoInstanceProfile
      SubnetId: !Select [0, !Ref SubnetIds]
      SecurityGroupIds: [!Ref MongoSecurityGroup]
      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref MongoDiskSizeGB
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - { Key: Name,  Value: !Sub '${AWS::StackName}-mongo' }
        - { Key: Stack, Value: !Ref AWS::StackName }
        - { Key: Role,  Value: mongodb }
      UserData:
        Fn::Base64:
          Fn::Sub: |
            #!/bin/bash -xe
            exec > >(tee /var/log/mongo-init.log | logger -t mongo-init -s 2>/dev/console) 2>&1
            export PATH=$PATH:/opt/aws/bin
            trap 'cfn-signal -e 1 --stack ${AWS::StackName} --resource MongoInstance --region ${AWS::Region}' ERR

            printf '[mongodb-org]\nname=MongoDB Repository\nbaseurl=https://repo.mongodb.org/yum/amazon/2023/mongodb-org/${MongoDBVersion}/x86_64/\ngpgcheck=1\nenabled=1\ngpgkey=https://pgp.mongodb.com/server-${MongoDBVersion}.asc\n' \
              > /etc/yum.repos.d/mongodb-org.repo

            dnf install -y mongodb-org

            # Bind to 0.0.0.0 - the security group restricts who can reach 27017.
            sed -i 's/^  bindIp:.*/  bindIp: 0.0.0.0/' /etc/mongod.conf

            systemctl enable --now mongod

            for i in $(seq 1 15); do
              mongosh --eval "db.adminCommand('ping')" --quiet && break
              sleep 2
            done

            cfn-signal -e 0 --stack ${AWS::StackName} --resource MongoInstance --region ${AWS::Region}

Outputs:

  AlbDnsName:
    Description: Public DNS of the ALB - point your domain CNAME here
    Value: !GetAtt ApplicationLoadBalancer.DNSName
    Export: { Name: !Sub '${AWS::StackName}-alb-dns' }

  AlbArn:
    Value: !Ref ApplicationLoadBalancer
    Export: { Name: !Sub '${AWS::StackName}-alb-arn' }

  HttpListenerArn:
    Description: ALB listener whose default action the workflow flips on swap
    Value: !Ref HttpListener
    Export: { Name: !Sub '${AWS::StackName}-listener-arn' }

  BlueTargetGroupArn:
    Value: !Ref BlueTargetGroup
    Export: { Name: !Sub '${AWS::StackName}-blue-tg' }

  GreenTargetGroupArn:
    Value: !Ref GreenTargetGroup
    Export: { Name: !Sub '${AWS::StackName}-green-tg' }

  AppSecurityGroupId:
    Value: !Ref AppSecurityGroup
    Export: { Name: !Sub '${AWS::StackName}-app-sg' }

  MongoPrivateIp:
    Description: Private IP the app instances use for MONGO_URI
    Value: !GetAtt MongoInstance.PrivateIp
    Export: { Name: !Sub '${AWS::StackName}-mongo-ip' }

  MongoInstanceId:
    Value: !Ref MongoInstance
    Export: { Name: !Sub '${AWS::StackName}-mongo-id' }