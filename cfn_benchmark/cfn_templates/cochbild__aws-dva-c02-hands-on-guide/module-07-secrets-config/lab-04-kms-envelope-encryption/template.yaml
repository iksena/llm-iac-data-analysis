AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Lab 7.4 — Customer-managed CMK + Lambda envelope-encryption demo. Lab 7.5 reuses this key.

Resources:
  CustomerKey:
    Type: AWS::KMS::Key
    Properties:
      Description: DVA Lab 7.4 CMK for envelope encryption
      EnableKeyRotation: true
      KeySpec: SYMMETRIC_DEFAULT
      KeyUsage: ENCRYPT_DECRYPT
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowAccountFullAccess
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: "kms:*"
            Resource: "*"

  CustomerKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/dva-lab-07-04-cmk
      TargetKeyId: !Ref CustomerKey

  EnvelopeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: KmsOps
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - kms:GenerateDataKey
                  - kms:Decrypt
                  - kms:Encrypt
                Resource: !GetAtt CustomerKey.Arn

  EnvelopeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dva-lab-07-04-envelope
      Runtime: python3.12
      Handler: handler.handler
      Role: !GetAtt EnvelopeRole.Arn
      CodeUri: src/
      Timeout: 10
      Environment:
        Variables:
          KEY_ARN: !GetAtt CustomerKey.Arn

Outputs:
  FunctionName:
    Value: !Ref EnvelopeFunction
  KeyArn:
    Value: !GetAtt CustomerKey.Arn
    Export:
      Name: dva-lab-07-04-key-arn
  KeyId:
    Value: !Ref CustomerKey
    Export:
      Name: dva-lab-07-04-key-id