Description: |
  This stack creates a cost based budget with an additional SNS topic notification

Resources:

  # An AWS budget that alerts by email
  Budget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetLimit:
          Amount: 100
          Unit: USD
        TimeUnit: MONTHLY
        BudgetType: COST
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 99
          Subscribers:
            - SubscriptionType: EMAIL
              Address: email@example.com
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
          Subscribers:
            - SubscriptionType: EMAIL
              Address: email@example.com
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 70
          Subscribers:
            - SubscriptionType: SNS
              Address:
                'Fn::GetAtt':
                  - BudgetSNSTopic
                  - TopicArn

  # SNS Topic for budget notifications
  BudgetSNSTopic:
    Type: AWS::SNS::Topic
    Properties: {}