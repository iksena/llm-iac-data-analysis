AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Lab 4.4 — Lab 4.3 stack + usage plan + API key + ApiKeyRequired + method-level throttling

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 256

Resources:

  HelloFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-hello
      CodeUri: src/
      Handler: handler.lambda_handler
      AutoPublishAlias: prod

  DevAlias:
    Type: AWS::Lambda::Alias
    Properties:
      FunctionName: !Ref HelloFunction
      Name: dev
      FunctionVersion: $LATEST

  RestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub ${AWS::StackName}-api
      EndpointConfiguration:
        Types: [REGIONAL]

  HelloResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: hello

  HelloMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref HelloResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FnArn}:${!stageVariables.alias}/invocations
          - FnArn: !GetAtt HelloFunction.Arn

  OrdersResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: orders

  OrderModel:
    Type: AWS::ApiGateway::Model
    Properties:
      RestApiId: !Ref RestApi
      Name: OrderModel
      ContentType: application/json
      Schema:
        $schema: "http://json-schema.org/draft-04/schema#"
        title: Order
        type: object
        required: [customerId, quantity]
        properties:
          customerId: { type: string, minLength: 1 }
          quantity: { type: integer, minimum: 1 }
          metadata: { type: object }

  BodyValidator:
    Type: AWS::ApiGateway::RequestValidator
    Properties:
      RestApiId: !Ref RestApi
      Name: validate-body
      ValidateRequestBody: true
      ValidateRequestParameters: false

  OrdersMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref OrdersResource
      HttpMethod: POST
      AuthorizationType: NONE
      ApiKeyRequired: true     # NEW in Lab 4.4 — caller must send x-api-key
      RequestValidatorId: !Ref BodyValidator
      RequestModels:
        application/json: !Ref OrderModel
      Integration:
        Type: AWS
        IntegrationHttpMethod: POST
        Uri: !Sub
          - arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FnArn}:${!stageVariables.alias}/invocations
          - FnArn: !GetAtt HelloFunction.Arn
        PassthroughBehavior: NEVER
        RequestTemplates:
          application/json: |
            {
              "customer_id": $input.json('$.customerId'),
              "qty": $input.json('$.quantity'),
              "source": $input.json('$.metadata.source'),
              "request_id": "$context.requestId",
              "caller_ip": "$context.identity.sourceIp"
            }
        IntegrationResponses:
          - StatusCode: 201
            SelectionPattern: ""
            ResponseTemplates:
              application/json: |
                {
                  "ok": true,
                  "transformed": $input.body,
                  "request_id": "$context.requestId"
                }
          - StatusCode: 422
            SelectionPattern: ".*ORDER_TOO_LARGE.*"
            ResponseTemplates:
              application/json: |
                {"error": "ORDER_TOO_LARGE", "message": "Quantity must be <= 1000"}
      MethodResponses:
        - StatusCode: 201
        - StatusCode: 422

  HelloMethodOptions:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref HelloResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode":200}'
        IntegrationResponses:
          - StatusCode: 200

  DevAliasPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Sub ${HelloFunction}:dev
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/*/*

  ProdAliasPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Sub ${HelloFunction}:prod
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/*/*

  Deployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: [HelloMethod, OrdersMethod, HelloMethodOptions]
    Properties:
      RestApiId: !Ref RestApi
      Description: Lab 4.4 deployment with throttling and API key

  DevStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      StageName: dev
      RestApiId: !Ref RestApi
      DeploymentId: !Ref Deployment
      Variables:
        alias: dev
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          LoggingLevel: INFO
          MetricsEnabled: true
        # NEW in Lab 4.4 — method-level throttle override on /hello GET
        - ResourcePath: /hello
          HttpMethod: GET
          ThrottlingRateLimit: 5
          ThrottlingBurstLimit: 10

  ProdStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      StageName: prod
      RestApiId: !Ref RestApi
      DeploymentId: !Ref Deployment
      Variables:
        alias: prod
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          LoggingLevel: INFO
          MetricsEnabled: true

  # ───────────────────────────── NEW in Lab 4.4 ─────────────────────────────

  ApiKey:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Name: dva-lab-04-04-key
      Enabled: true
      StageKeys:
        - RestApiId: !Ref RestApi
          StageName: !Ref DevStage

  UsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    Properties:
      UsagePlanName: dva-lab-04-04-plan
      Description: rate=2 RPS, burst=5, quota=100/day
      ApiStages:
        - ApiId: !Ref RestApi
          Stage: !Ref DevStage
      Throttle:
        RateLimit: 2
        BurstLimit: 5
      Quota:
        Limit: 100
        Period: DAY

  UsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref ApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref UsagePlan

Outputs:
  RestApiId:
    Value: !Ref RestApi
  DevUrl:
    Value: !Sub https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/dev
  ProdUrl:
    Value: !Sub https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/prod
  FunctionName:
    Value: !Ref HelloFunction
  ApiKeyId:
    Value: !Ref ApiKey
  UsagePlanId:
    Value: !Ref UsagePlan