AWSTemplateFormatVersion: "2010-09-09"

Description: ""

Parameters:
  APIGatewayName:
    Type: String
  UICodeS3Bucket:
    Type: String

Resources:

  ApiGatewayWebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub ${APIGatewayName}-WAF
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      Rules:
        - Name: AWSManagedRulesCommonRuleSet
          Priority: 1
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: CommonRuleSetMetric
        - Name: AWSManagedRulesKnownBadInputsRuleSet
          Priority: 2
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: KnownBadInputsRuleSetMetric
        - Name: RateLimitRule
          Priority: 3
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: 2000
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: RateLimitRuleMetric
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub ${APIGatewayName}-WAF

  APIGatewayS3AccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: GetObjectInBucket
            Effect: Allow
            Action:
              - s3:GetObject
            Resource:
              - !Sub arn:${AWS::Partition}:s3:::${UICodeS3Bucket}/*
  IAMRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument: "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Sid\":\"\",\"Effect\":\"Allow\",\"Principal\":{\"Service\":\"apigateway.amazonaws.com\"},\"Action\":\"sts:AssumeRole\"}]}"
      MaxSessionDuration: 3600
      ManagedPolicyArns:
      - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs"
      - !Ref APIGatewayS3AccessPolicy

  APIGatewayLoggingRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument: "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Sid\":\"\",\"Effect\":\"Allow\",\"Principal\":{\"Service\":\"apigateway.amazonaws.com\"},\"Action\":\"sts:AssumeRole\"}]}"
      MaxSessionDuration: 3600
      ManagedPolicyArns:
      - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs"

  ApiGatewayAccount:
    Type: "AWS::ApiGateway::Account"
    Properties:
      CloudWatchRoleArn: !GetAtt
        - APIGatewayLoggingRole
        - Arn

  ApiGatewayRestApi:
    Type: "AWS::ApiGateway::RestApi"
    Properties:
      Name: !Sub ${APIGatewayName}
      ApiKeySourceType: "HEADER"
      BinaryMediaTypes:
      - "*/*"
      EndpointConfiguration:
        Types:
        - "REGIONAL"

  EmailResource:
    Type: "AWS::ApiGateway::Resource"
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      PathPart: "email"
      ParentId: !GetAtt ApiGatewayRestApi.RootResourceId

  ApiGatewayResource2:
    Type: "AWS::ApiGateway::Resource"
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      PathPart: "{item+}"
      ParentId: !Ref EmailResource

  ApiGatewayMethod:
    Type: "AWS::ApiGateway::Method"
    Metadata:
      Comment: >-
        Public by design. CloudFront is unavailable in GovCloud, so this API
        Gateway acts as the static site host for the React bundle and this GET
        proxies public UI assets from S3, exactly as a CloudFront distribution
        would. The stage is fronted by a WAFv2 Web ACL, and the email API itself
        (email-stack.yaml) gates every operation with a Cognito authorizer.
      checkov:
        skip:
          - id: CKV_AWS_59
            comment: Static site host for public UI assets; the data-plane API is Cognito-authorized.
      guard:
        SuppressedRules:
          - API_GW_METHOD_AUTHORIZATION_TYPE_RULE
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      ResourceId: !Ref ApiGatewayResource2
      HttpMethod: "GET"
      AuthorizationType: "NONE"
      ApiKeyRequired: false
      RequestParameters:
        "method.request.path.item": true
      MethodResponses:
      -
        ResponseModels:
          "application/json": !Ref ApiGatewayModel
        ResponseParameters:
          "method.response.header.Access-Control-Allow-Origin": false
          "method.response.header.Content-Type": false
          "method.response.header.content-type": false
          "method.response.header.Cache-Control": false
        StatusCode: "200"
      # Error responses must declare Content-Type as a method response header so the
      # integration responses below can override S3's application/xml with our own
      # sanitized body. Without these the raw S3 <Error> XML (which contains
      # <BucketName> and <Key>) is returned to the caller verbatim.
      -
        ResponseParameters:
          "method.response.header.Access-Control-Allow-Origin": false
          "method.response.header.Content-Type": false
        StatusCode: "404"
      -
        ResponseParameters:
          "method.response.header.Access-Control-Allow-Origin": false
          "method.response.header.Content-Type": false
        StatusCode: "500"
      Integration:
        Credentials: !GetAtt IAMRole.Arn
        IntegrationHttpMethod: "GET"
        IntegrationResponses:
        -
          ResponseParameters:
            "method.response.header.Access-Control-Allow-Origin": "'*'"
            "method.response.header.Content-Type": "integration.response.header.Content-Type"
            "method.response.header.content-type": "integration.response.header.content-type"
            # Set here rather than passed through from S3 so it holds for every asset
            # regardless of which path uploaded it (deploy.sh or the CodeBuild sync).
            # The build is a single inlined index.html, so a cached copy means users run
            # stale application code against a current backend. "no-cache" still allows
            # storage but forces revalidation, so unchanged assets come back as cheap 304s.
            "method.response.header.Cache-Control": "'no-cache'"
          StatusCode: "200"
        # S3 returns an XML <Error> document on failure that echoes the bucket name and
        # object key (NoSuchKey when the object is missing, AccessDenied when the object
        # is missing and the role has no s3:ListBucket - which is the case here). Both
        # collapse into this 4xx branch. ResponseTemplates replace the body with a static
        # page so nothing about the bucket or key reaches the caller.
        #
        # ContentHandling: CONVERT_TO_TEXT is required because BinaryMediaTypes on this
        # API is "*/*", which makes API Gateway treat every response as binary and skip
        # body mapping templates. Forcing text handling on the error branches only keeps
        # binary passthrough intact for real assets on the 200 branch.
        #
        # Templates are keyed by several content types because API Gateway selects a
        # response template by matching against the payload/Accept content type; a single
        # key would be bypassed for callers negotiating a different type.
        -
          SelectionPattern: "4\\d{2}"
          StatusCode: "404"
          ContentHandling: "CONVERT_TO_TEXT"
          ResponseParameters:
            "method.response.header.Access-Control-Allow-Origin": "'*'"
            "method.response.header.Content-Type": "'text/html'"
          ResponseTemplates:
            "application/xml": '<!DOCTYPE html><html lang=en><head><meta charset=utf-8><title>Not Found</title></head><body><h1>Not Found</h1><p>The requested resource is not available.</p></body></html>'
            "text/xml": '<!DOCTYPE html><html lang=en><head><meta charset=utf-8><title>Not Found</title></head><body><h1>Not Found</h1><p>The requested resource is not available.</p></body></html>'
            "application/json": '<!DOCTYPE html><html lang=en><head><meta charset=utf-8><title>Not Found</title></head><body><h1>Not Found</h1><p>The requested resource is not available.</p></body></html>'
            "text/html": '<!DOCTYPE html><html lang=en><head><meta charset=utf-8><title>Not Found</title></head><body><h1>Not Found</h1><p>The requested resource is not available.</p></body></html>'
        -
          SelectionPattern: "5\\d{2}"
          StatusCode: "500"
          ContentHandling: "CONVERT_TO_TEXT"
          ResponseParameters:
            "method.response.header.Access-Control-Allow-Origin": "'*'"
            "method.response.header.Content-Type": "'text/html'"
          ResponseTemplates:
            "application/xml": '<!DOCTYPE html><html lang=en><head><meta charset=utf-8><title>Error</title></head><body><h1>Error</h1><p>The request could not be completed.</p></body></html>'
            "text/xml": '<!DOCTYPE html><html lang=en><head><meta charset=utf-8><title>Error</title></head><body><h1>Error</h1><p>The request could not be completed.</p></body></html>'
            "application/json": '<!DOCTYPE html><html lang=en><head><meta charset=utf-8><title>Error</title></head><body><h1>Error</h1><p>The request could not be completed.</p></body></html>'
            "text/html": '<!DOCTYPE html><html lang=en><head><meta charset=utf-8><title>Error</title></head><body><h1>Error</h1><p>The request could not be completed.</p></body></html>'
        PassthroughBehavior: "WHEN_NO_MATCH"
        RequestParameters:
          "integration.request.path.object": "method.request.path.item"
        TimeoutInMillis: 29000
        Type: "AWS"
        Uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:s3:path/${UICodeS3Bucket}/{object}"

  ApiGatewayMethod2:
    Type: "AWS::ApiGateway::Method"
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      ResourceId: !Ref ApiGatewayResource2
      HttpMethod: "OPTIONS"
      AuthorizationType: "NONE"
      ApiKeyRequired: false
      RequestParameters:
        "method.request.path.item": true
      MethodResponses:
      -
        ResponseModels:
          "application/json": !Ref ApiGatewayModel
        ResponseParameters:
          "method.response.header.Access-Control-Allow-Headers": false
          "method.response.header.Access-Control-Allow-Methods": false
          "method.response.header.Access-Control-Allow-Origin": false
        StatusCode: "200"
      Integration:
        IntegrationResponses:
        -
          ResponseParameters:
            "method.response.header.Access-Control-Allow-Headers": "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
            "method.response.header.Access-Control-Allow-Methods": "'GET,OPTIONS'"
            "method.response.header.Access-Control-Allow-Origin": "'*'"
          StatusCode: "200"
        PassthroughBehavior: "WHEN_NO_MATCH"
        RequestTemplates:
          "application/json": "{\"statusCode\": 200}"
        TimeoutInMillis: 29000
        Type: "MOCK"

  ApiGatewayModel:
    Type: "AWS::ApiGateway::Model"
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      Schema: |
          {
            "title" : "Empty Schema",
            "type" : "object"
          }
      ContentType: "application/json"

  ApiGatewayLogKMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS key for API Gateway access logs encryption
      EnableKeyRotation: true
      # Note on the wildcards below, which security scanners commonly flag:
      #
      # A key policy is attached to exactly one key, so 'Resource: *' means THIS key,
      # not every key in the account. Referencing the key's own ARN from inside its
      # KeyPolicy is a CloudFormation circular dependency, so there is no narrower value.
      #
      # 'arn:...:root' is the account principal, not the root user. It grants no
      # principal access by itself; it is what allows IAM policies in this account to
      # govern the key. Narrowing 'kms:*' here would break IAM-delegated administration
      # of the key, including CloudFormation's ability to update or delete it. If you
      # need tighter control in production, restrict which IAM principals may use the
      # key through their identity policies rather than by editing this statement.
      #
      # Contrast the second statement below, which grants the CloudWatch Logs service
      # only the specific actions it needs. That is the pattern to copy for application
      # principals; do not copy 'kms:*' into an identity policy.
      # See https://docs.aws.amazon.com/kms/latest/developerguide/key-policy-default.html
      KeyPolicy:
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'
          - Effect: Allow
            Principal:
              Service: !Sub logs.${AWS::Region}.amazonaws.com
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: '*'

  ApiGatewayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/apigateway/${APIGatewayName}"
      RetentionInDays: 14
      KmsKeyId: !GetAtt ApiGatewayLogKMSKey.Arn

  ApiGatewayStage:
    Type: "AWS::ApiGateway::Stage"
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      StageName: "v1"
      DeploymentId: !Ref ApiGatewayDeploymentV2
      AccessLogSetting:
        DestinationArn: !GetAtt ApiGatewayLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","caller":"$context.identity.caller","user":"$context.identity.user","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","resourcePath":"$context.resourcePath","status":"$context.status","protocol":"$context.protocol","responseLength":"$context.responseLength","responseTime":"$context.responseTime","error":"$context.error.message","integrationError":"$context.integration.error","integrationStatus":"$context.integration.status","integrationLatency":"$context.integration.latency","integrationRequestId":"$context.integration.requestId","userAgent":"$context.identity.userAgent"}'
      TracingEnabled: true
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          LoggingLevel: INFO
          DataTraceEnabled: true
          MetricsEnabled: true

  ApiGatewayWebACLAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    DependsOn: ApiGatewayStage
    Properties:
      ResourceArn: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}::/restapis/${ApiGatewayRestApi}/stages/v1"
      WebACLArn: !GetAtt ApiGatewayWebACL.Arn

  # Gateway Responses - sanitize errors raised by API Gateway itself, before the
  # integration is ever reached (unknown path, WAF block, throttling). The stock
  # DEFAULT_4XX body leaks internals such as "Missing Authentication Token", which
  # is what a request to /v1/email (no object key) returns.
  GatewayResponseDefault4XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      ResponseType: DEFAULT_4XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Content-Type: "'text/html'"
      ResponseTemplates:
        application/json: '<!DOCTYPE html><html lang=en><head><meta charset=utf-8><title>Not Found</title></head><body><h1>Not Found</h1><p>The requested resource is not available.</p></body></html>'

  GatewayResponseDefault5XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      ResponseType: DEFAULT_5XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Content-Type: "'text/html'"
      ResponseTemplates:
        application/json: '<!DOCTYPE html><html lang=en><head><meta charset=utf-8><title>Error</title></head><body><h1>Error</h1><p>The request could not be completed.</p></body></html>'

  ###############################
  # Deployment logical ID is versioned on purpose.
  #
  # AWS::ApiGateway::Deployment captures a snapshot of the API model at create time.
  # Editing a method, integration response or gateway response above does NOT produce
  # a new snapshot, so CloudFormation reports UPDATE_COMPLETE while the live v1 stage
  # keeps serving the old model. Bumping Description does not help either - that is an
  # in-place update on the existing deployment.
  #
  # Any time the API model above changes, increment the V<n> suffix here and in the
  # Stage's DeploymentId. Same convention as EmailDistributionAPIDeploymentV2 in
  # email-stack.yaml.
  #
  # V2: sanitized 4xx/5xx integration responses and added gateway responses so S3
  #     error XML (bucket name + object key) is no longer returned to callers.
  ###############################
  ApiGatewayDeploymentV2:
    Type: "AWS::ApiGateway::Deployment"
    DependsOn:
      - ApiGatewayMethod
      - ApiGatewayMethod2
      - GatewayResponseDefault4XX
      - GatewayResponseDefault5XX
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      Description: "Deployment for email frontend API"

Outputs:
  ApiEndpoint:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.amazonaws.com/v1/email"
  UserURL:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.amazonaws.com/v1/email/index.html"