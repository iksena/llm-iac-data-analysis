##############################################################################
#
#   Conformance Pack:
#     금융분야 상용 클라우드컴퓨팅서비스 보안 관리 참고서 - AWS (2025)
#
#   출처: 금융보안원, 업무참고 2025-클라우드대응-(2)-56, 2025-09-19
#   범위: 전체 47개 기준 중 자동 판정이 가능한 항목
#         정책/절차 항목 등 판정 불가 기준과 그 사유는 MAPPING.md 참조
#
#   [주의] 기준 2.6 은 AWS 편 PDF 에 누락되어 있어(목차/본문 모두 2.1~2.5 로 끝남)
#          같은 시리즈 NAVER Cloud 편(업무참고 2025-클라우드대응-(2)-60)의 2.6 조문을
#          근거로 매핑했습니다. 감사 대응 시 근거 문서가 다릅니다 - MAPPING.md 참조.
#
#   관리형 룰 식별자 150개는 AWS 공식 conformance pack 32종 + 개별 룰 문서 페이지에서
#   추출한 카탈로그와 전부 대조 검증함.
#   Guard 커스텀 정책 1개는 아래 Fsi64IamRoleMaxSessionDuration 에 인라인되어 있다.
#
#   수정 시 MAPPING.md / mapping.csv 도 함께 맞춰 주세요 - 셋은 같은 내용입니다.
#
##############################################################################
Parameters:
  # [1.4/2.2] 인터넷 구간 차단 대상 포트 (FTP-DATA)
  BlockedPort1:
    Type: String
    Default: '20'
  # [1.4/2.2] 인터넷 구간 차단 대상 포트 (FTP)
  BlockedPort2:
    Type: String
    Default: '21'
  # [1.4/2.2] 인터넷 구간 차단 대상 포트 (RDP)
  BlockedPort3:
    Type: String
    Default: '3389'
  # [1.4/2.2] 인터넷 구간 차단 대상 포트 (MySQL)
  BlockedPort4:
    Type: String
    Default: '3306'
  # [1.4/2.2] 인터넷 구간 차단 대상 포트 (PostgreSQL)
  BlockedPort5:
    Type: String
    Default: '5432'
  # [1.4] 0.0.0.0/0 개방을 허용할 TCP 포트 목록. 예: '443,80'
  AuthorizedTcpPorts:
    Type: String
    Default: '443'
  # [1.7] GuardDuty 高 심각도 결과 미처리 허용 일수
  GuardDutyDaysHighSev:
    Type: String
    Default: '1'
  # [1.7] GuardDuty 中 심각도 결과 미처리 허용 일수
  GuardDutyDaysMediumSev:
    Type: String
    Default: '7'
  # [1.7] GuardDuty 低 심각도 결과 미처리 허용 일수
  GuardDutyDaysLowSev:
    Type: String
    Default: '30'
  # [2.1] VPC·서브넷에 요구할 용도 구분 태그의 키
  NetworkPurposeTagKey:
    Type: String
    Default: 'Environment'
  # [2.1] 해당 태그로 허용할 값 목록(쉼표 구분). 조직의 망 구분 체계에 맞게 조정.
  NetworkPurposeTagValues:
    Type: String
    Default: 'dev,stg,prod'
  # [3.3/6.3] 자격증명 최대 미사용 기간(일). 초과 시 인사 변경 조치 누락 의심.
  MaxCredentialUsageAgeDays:
    Type: String
    Default: '90'
  # [3.3/6.1/6.3] 액세스 키 최대 미교체 기간(일)
  MaxAccessKeyAgeDays:
    Type: String
    Default: '90'
  # [3.5/5.2/5.7] 경보에 ALARM 액션 필수 여부
  AlarmActionRequired:
    Type: String
    Default: 'true'
  # [3.5/5.2/5.7] 경보에 INSUFFICIENT_DATA 액션 필수 여부
  InsufficientDataActionRequired:
    Type: String
    Default: 'false'
  # [3.5/5.2/5.7] 경보에 OK 액션 필수 여부
  OkActionRequired:
    Type: String
    Default: 'false'
  # [3.6] IAM 암호 최소 길이. 참고서는 수치를 정하지 않아 전자금융감독규정 관행값을 사용.
  IamPasswordMinimumLength:
    Type: String
    Default: '8'
  # [3.6] 대문자 포함 요구
  IamPasswordRequireUppercase:
    Type: String
    Default: 'true'
  # [3.6] 소문자 포함 요구
  IamPasswordRequireLowercase:
    Type: String
    Default: 'true'
  # [3.6] 숫자 포함 요구
  IamPasswordRequireNumbers:
    Type: String
    Default: 'true'
  # [3.6] 특수문자 포함 요구
  IamPasswordRequireSymbols:
    Type: String
    Default: 'true'
  # [3.6] 암호 최대 사용 기간(일)
  IamPasswordMaxAge:
    Type: String
    Default: '90'
  # [3.6] 재사용 금지 이력 개수
  IamPasswordReusePrevention:
    Type: String
    Default: '12'
  # [4.3/4.4] IAM 정책에서 부여를 금지할 KMS 액션
  BlockedKmsActions:
    Type: String
    Default: 'kms:Decrypt,kms:ReEncryptFrom'
  # [4.5] CLB에 요구할 사전 정의 SSL 협상 정책
  ElbPredefinedSslPolicy:
    Type: String
    Default: 'ELBSecurityPolicy-TLS-1-2-2017-01'
  # [4.5] ACM 인증서 만료 경고 기준(일)
  AcmDaysToExpiration:
    Type: String
    Default: '90'
  # [6.3] Secrets Manager 보안 암호 최대 미사용 기간(일)
  SecretUnusedForDays:
    Type: String
    Default: '90'
  # [6.5] 허용할 API Gateway 엔드포인트 유형. 퍼블릭 API를 운영한다면 'PRIVATE,REGIONAL' 등으로 완화 필요.
  ApiGwAllowedEndpointTypes:
    Type: String
    Default: 'PRIVATE'
  # [6.5] VPC 엔드포인트 존재를 요구할 서비스. 룰 특성상 서비스당 1개만 지정 가능.
  VpcEndpointServiceName:
    Type: String
    Default: 's3'
  # [7.1] 계정 수준 퍼블릭 액세스 차단
  S3BlockPublicAcls:
    Type: String
    Default: 'True'
  # [7.1] 계정 수준 퍼블릭 정책 차단
  S3BlockPublicPolicy:
    Type: String
    Default: 'True'
  # [7.1] 계정 수준 퍼블릭 ACL 무시
  S3IgnorePublicAcls:
    Type: String
    Default: 'True'
  # [7.1] 계정 수준 퍼블릭 버킷 제한
  S3RestrictPublicBuckets:
    Type: String
    Default: 'True'
  # [7.2] 버킷 정책에서 부여를 금지할 S3 액션
  S3BlacklistedActions:
    Type: String
    Default: 's3:DeleteBucketPolicy,s3:PutBucketAcl,s3:PutBucketPolicy,s3:PutEncryptionConfiguration,s3:PutObjectAcl'
  # [8.1] 로그 그룹 최소 보존 기간(일). 참고서의 '1년 이상 보관' 요구를 반영. Config 허용값: 1,3,5,7,14,30,60,90,120,150,180,365,400,545,731,1827,3653
  LogGroupMinRetentionDays:
    Type: String
    Default: '365'
  # [8.2/8.4] S3 Object Lock 모드. COMPLIANCE 는 루트 계정도 해제 불가하므로 도입 전 검토 필요.
  S3ObjectLockMode:
    Type: String
    Default: 'COMPLIANCE'
  # [8.3] 백업 계획 최소 주기 단위 (hours|days|weeks|months)
  BackupRequiredFrequencyUnit:
    Type: String
    Default: 'days'
  # [8.3] 백업 계획 최소 주기 값
  BackupRequiredFrequencyValue:
    Type: String
    Default: '1'
  # [8.3] 백업 계획 최소 보관 일수. 참고서의 1년 이상 보관 요구를 반영.
  BackupRequiredRetentionDays:
    Type: String
    Default: '365'
  # [8.5] 복구 지점 최소 보관 일수
  RecoveryPointMinRetentionDays:
    Type: String
    Default: '365'
Resources:

  # ─────────── 가상자원 관리 ───────────
  Ec2InstanceNoPublicIp:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: ec2-instance-no-public-ip
      Description: '[FSI-AWS 1.4, 2.5] 가상자원 생성 시 네트워크 설정 적용 / 네트워크 사설 IP주소 할당 및 관리'
      Scope:
        ComplianceResourceTypes:
        - AWS::EC2::Instance
      Source:
        Owner: AWS
        SourceIdentifier: EC2_INSTANCE_NO_PUBLIC_IP
  Ec2InstancesInVpc:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: ec2-instances-in-vpc
      Description: '[FSI-AWS 1.4] 가상자원 생성 시 네트워크 설정 적용'
      Scope:
        ComplianceResourceTypes:
        - AWS::EC2::Instance
      Source:
        Owner: AWS
        SourceIdentifier: INSTANCES_IN_VPC
  RestrictedCommonPorts:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: restricted-common-ports
      Description: '[FSI-AWS 1.4, 2.2, 2.6] 가상자원 생성 시 네트워크 설정 적용 / 내부망 네트워크 보안 통제 / 네트워크(방화벽 등) 정책 주기적 검토'
      InputParameters:
        blockedPort1:
          Ref: BlockedPort1
        blockedPort2:
          Ref: BlockedPort2
        blockedPort3:
          Ref: BlockedPort3
        blockedPort4:
          Ref: BlockedPort4
        blockedPort5:
          Ref: BlockedPort5
      Scope:
        ComplianceResourceTypes:
        - AWS::EC2::SecurityGroup
      Source:
        Owner: AWS
        SourceIdentifier: RESTRICTED_INCOMING_TRAFFIC
  RestrictedSsh:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: restricted-ssh
      Description: '[FSI-AWS 1.4] 가상자원 생성 시 네트워크 설정 적용'
      Scope:
        ComplianceResourceTypes:
        - AWS::EC2::SecurityGroup
      Source:
        Owner: AWS
        SourceIdentifier: INCOMING_SSH_DISABLED
  SubnetAutoAssignPublicIpDisabled:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: subnet-auto-assign-public-ip-disabled
      Description: '[FSI-AWS 1.4, 2.5] 가상자원 생성 시 네트워크 설정 적용 / 네트워크 사설 IP주소 할당 및 관리'
      Scope:
        ComplianceResourceTypes:
        - AWS::EC2::Subnet
      Source:
        Owner: AWS
        SourceIdentifier: SUBNET_AUTO_ASSIGN_PUBLIC_IP_DISABLED
  VpcDefaultSecurityGroupClosed:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: vpc-default-security-group-closed
      Description: '[FSI-AWS 1.4, 2.2, 2.6] 가상자원 생성 시 네트워크 설정 적용 / 내부망 네트워크 보안 통제 / 네트워크(방화벽 등) 정책 주기적 검토'
      Scope:
        ComplianceResourceTypes:
        - AWS::EC2::SecurityGroup
      Source:
        Owner: AWS
        SourceIdentifier: VPC_DEFAULT_SECURITY_GROUP_CLOSED
  VpcSgOpenOnlyToAuthorizedPorts:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: vpc-sg-open-only-to-authorized-ports
      Description: '[FSI-AWS 1.4, 2.6] 가상자원 생성 시 네트워크 설정 적용 / 네트워크(방화벽 등) 정책 주기적 검토'
      InputParameters:
        authorizedTcpPorts:
          Ref: AuthorizedTcpPorts
      Scope:
        ComplianceResourceTypes:
        - AWS::EC2::SecurityGroup
      Source:
        Owner: AWS
        SourceIdentifier: VPC_SG_OPEN_ONLY_TO_AUTHORIZED_PORTS
  Ec2Imdsv2Check:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: ec2-imdsv2-check
      Description: '[FSI-AWS 1.5] 가상자원 접속 시 보안 방안 수립'
      Scope:
        ComplianceResourceTypes:
        - AWS::EC2::Instance
      Source:
        Owner: AWS
        SourceIdentifier: EC2_IMDSV2_CHECK
  Ec2InstanceManagedBySystemsManager:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: ec2-instance-managed-by-systems-manager
      Description: '[FSI-AWS 1.5] 가상자원 접속 시 보안 방안 수립'
      Scope:
        ComplianceResourceTypes:
        - AWS::EC2::Instance
        - AWS::SSM::ManagedInstanceInventory
      Source:
        Owner: AWS
        SourceIdentifier: EC2_INSTANCE_MANAGED_BY_SSM
  Ec2InstanceProfileAttached:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: ec2-instance-profile-attached
      Description: '[FSI-AWS 1.6] 이용자 가상자원 별 권한 설정'
      Scope:
        ComplianceResourceTypes:
        - AWS::EC2::Instance
      Source:
        Owner: AWS
        SourceIdentifier: EC2_INSTANCE_PROFILE_ATTACHED
  Ec2ManagedinstanceAssociationComplianceStatusCheck:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: ec2-managedinstance-association-compliance-status-check
      Description: '[FSI-AWS 1.7] 이용자 가상자원 내 악성코드 통제방안 수립'
      Scope:
        ComplianceResourceTypes:
        - AWS::SSM::AssociationCompliance
      Source:
        Owner: AWS
        SourceIdentifier: EC2_MANAGEDINSTANCE_ASSOCIATION_COMPLIANCE_STATUS_CHECK
  Ec2ManagedinstancePatchComplianceStatusCheck:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: ec2-managedinstance-patch-compliance-status-check
      Description: '[FSI-AWS 1.7] 이용자 가상자원 내 악성코드 통제방안 수립'
      Scope:
        ComplianceResourceTypes:
        - AWS::SSM::PatchCompliance
      Source:
        Owner: AWS
        SourceIdentifier: EC2_MANAGEDINSTANCE_PATCH_COMPLIANCE_STATUS_CHECK
  GuarddutyEnabledCentralized:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: guardduty-enabled-centralized
      Description: '[FSI-AWS 1.7] 이용자 가상자원 내 악성코드 통제방안 수립'
      Source:
        Owner: AWS
        SourceIdentifier: GUARDDUTY_ENABLED_CENTRALIZED
  GuarddutyMalwareProtectionEnabled:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: guardduty-malware-protection-enabled
      Description: '[FSI-AWS 1.7] 이용자 가상자원 내 악성코드 통제방안 수립'
      Scope:
        ComplianceResourceTypes:
        - AWS::GuardDuty::Detector
      Source:
        Owner: AWS
        SourceIdentifier: GUARDDUTY_MALWARE_PROTECTION_ENABLED
  GuarddutyNonArchivedFindings:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: guardduty-non-archived-findings
      Description: '[FSI-AWS 1.7] 이용자 가상자원 내 악성코드 통제방안 수립'
      InputParameters:
        daysHighSev:
          Ref: GuardDutyDaysHighSev
        daysMediumSev:
          Ref: GuardDutyDaysMediumSev
        daysLowSev:
          Ref: GuardDutyDaysLowSev
      Source:
        Owner: AWS
        SourceIdentifier: GUARDDUTY_NON_ARCHIVED_FINDINGS

  # ─────────── 네트워크 관리 ───────────
  RequiredTags:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: required-tags
      Description: '[FSI-AWS 2.1] 업무 목적에 따른 네트워크 구성'
      InputParameters:
        tag1Key:
          Ref: NetworkPurposeTagKey
        tag1Value:
          Ref: NetworkPurposeTagValues
      Scope:
        ComplianceResourceTypes:
        - AWS::EC2::VPC
        - AWS::EC2::Subnet
      Source:
        Owner: AWS
        SourceIdentifier: REQUIRED_TAGS
  LambdaFunctionPublicAccessProhibited:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: lambda-function-public-access-prohibited
      Description: '[FSI-AWS 2.2] 내부망 네트워크 보안 통제'
      Scope:
        ComplianceResourceTypes:
        - AWS::Lambda::Function
      Source:
        Owner: AWS
        SourceIdentifier: LAMBDA_FUNCTION_PUBLIC_ACCESS_PROHIBITED
  NaclNoUnrestrictedSshRdp:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: nacl-no-unrestricted-ssh-rdp
      Description: '[FSI-AWS 2.2, 2.6] 내부망 네트워크 보안 통제 / 네트워크(방화벽 등) 정책 주기적 검토'
      Scope:
        ComplianceResourceTypes:
        - AWS::EC2::NetworkAcl
      Source:
        Owner: AWS
        SourceIdentifier: NACL_NO_UNRESTRICTED_SSH_RDP
  NoUnrestrictedRouteToIgw:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: no-unrestricted-route-to-igw
      Description: '[FSI-AWS 2.2, 2.6] 내부망 네트워크 보안 통제 / 네트워크(방화벽 등) 정책 주기적 검토'
      Scope:
        ComplianceResourceTypes:
        - AWS::EC2::RouteTable
      Source:
        Owner: AWS
        SourceIdentifier: NO_UNRESTRICTED_ROUTE_TO_IGW
  RdsInstancePublicAccessCheck:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: rds-instance-public-access-check
      Description: '[FSI-AWS 2.2] 내부망 네트워크 보안 통제'
      Scope:
        ComplianceResourceTypes:
        - AWS::RDS::DBInstance
      Source:
        Owner: AWS
        SourceIdentifier: RDS_INSTANCE_PUBLIC_ACCESS_CHECK
  RedshiftClusterPublicAccessCheck:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: redshift-cluster-public-access-check
      Description: '[FSI-AWS 2.2] 내부망 네트워크 보안 통제'
      Scope:
        ComplianceResourceTypes:
        - AWS::Redshift::Cluster
      Source:
        Owner: AWS
        SourceIdentifier: REDSHIFT_CLUSTER_PUBLIC_ACCESS_CHECK
  AlbWafEnabled:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: alb-waf-enabled
      Description: '[FSI-AWS 2.3] 네트워크 보안 관제 수행'
      Scope:
        ComplianceResourceTypes:
        - AWS::ElasticLoadBalancingV2::LoadBalancer
      Source:
        Owner: AWS
        SourceIdentifier: ALB_WAF_ENABLED
  ApiGwAssociatedWithWaf:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: api-gw-associated-with-waf
      Description: '[FSI-AWS 2.3] 네트워크 보안 관제 수행'
      Scope:
        ComplianceResourceTypes:
        - AWS::ApiGateway::Stage
      Source:
        Owner: AWS
        SourceIdentifier: API_GW_ASSOCIATED_WITH_WAF
  CloudfrontAssociatedWithWaf:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: cloudfront-associated-with-waf
      Description: '[FSI-AWS 2.3] 네트워크 보안 관제 수행'
      Scope:
        ComplianceResourceTypes:
        - AWS::CloudFront::Distribution
      Source:
        Owner: AWS
        SourceIdentifier: CLOUDFRONT_ASSOCIATED_WITH_WAF
  NetfwPolicyRuleGroupAssociated:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: netfw-policy-rule-group-associated
      Description: '[FSI-AWS 2.3] 네트워크 보안 관제 수행'
      Scope:
        ComplianceResourceTypes:
        - AWS::NetworkFirewall::FirewallPolicy
      Source:
        Owner: AWS
        SourceIdentifier: NETFW_POLICY_RULE_GROUP_ASSOCIATED
  ShieldAdvancedEnabledAutorenew:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: shield-advanced-enabled-autorenew
      Description: '[FSI-AWS 2.3] 네트워크 보안 관제 수행'
      Source:
        Owner: AWS
        SourceIdentifier: SHIELD_ADVANCED_ENABLED_AUTORENEW
  ShieldDrtAccess:
    Type: AWS::Config::ConfigRule
    Properties:
      ConfigRuleName: shield-drt-access
