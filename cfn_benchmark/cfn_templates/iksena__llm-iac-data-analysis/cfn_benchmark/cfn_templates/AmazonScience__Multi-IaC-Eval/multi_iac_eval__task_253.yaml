Description: |
  This template will create a lambda function and an associated lambda
  version, along with a CloudWatch alarm to monitor the lambda function's performance.

Resources:
  # A lambda role to be used by the lambda function
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: LambdaRole
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole

  # A lambda function that returns hello world
  Function:
    Metadata:
      Comment: A lambda function that implements REST API endpoints
      checkov:
        skip:
          - id: CKV_AWS_116
            comment: This function is not called async
          - id: CKV_AWS_117
            comment: This example does not run in a VPC
      guard:
        SuppressedRules:
          - LAMBDA_INSIDE_VPC
          - LAMBDA_DLQ_CHECK
        Comments:
          - This example does not run in a VPC
          - The function is not called async so a DLQ is not necessary
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.handler
      Role: !GetAtt LambdaRole.Arn
      ReservedConcurrentExecutions: 20
      Code:
        ZipFile: |
          def handler(event, context):
            return 'Hello World!'
      Runtime: python3.10
      TracingConfig:
        Mode: Active

  # A lambda version with concurrency
  Version:
    Type: AWS::Lambda::Version
    Properties:
      FunctionName: !Ref Function
      Description: v1
      ProvisionedConcurrencyConfig:
        ProvisionedConcurrentExecutions: 20

  # CloudWatch alarm to monitor the lambda function's performance
  LambdaFunctionAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: LambdaFunctionAlarm
      AlarmDescription: Alarm for Lambda function error metrics
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref Function
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: missing
      AlarmActions:
        - "arn:aws:sns:REGION:ACCOUNT_ID:LambdaFunctionAlarmTopic"