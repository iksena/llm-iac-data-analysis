AWSTemplateFormatVersion: "2010-09-09"
Description: Healthcare AI Bot - ALB + ASG with Multiple Ports

Parameters:
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnets:
    Type: List<AWS::EC2::Subnet::Id>
  InstanceType:
    Type: String
    Default: t3.micro
  MyIP:
    Type: String
    Default: 0.0.0.0/0
  S3BucketName:
    Type: String
    Default: healthcare-bot-docs-475132940174
  S3ZipFileName:
    Type: String
    Default: healthcare-FIXED-PATIENT.zip
  MinSize:
    Type: Number
    Default: 1
  MaxSize:
    Type: Number
    Default: 2
  DesiredCapacity:
    Type: Number
    Default: 1

  # NEW: Option to expose backend directly
  ExposeBackendDirectly:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Set to true to expose Flask backend on port 5000 directly via ALB

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Conditions:
  ExposeBackend: !Equals [!Ref ExposeBackendDirectly, "true"]

Resources:
  EC2Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonS3FullAccess

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref EC2Role

  # ALB Security Group - Port 80 and optionally 5000
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: healthcare-bot-alb-sg-multiport
      GroupDescription: Security group for Application Load Balancer
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP from anywhere
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS from anywhere (for future SSL)
        # Conditionally add port 5000
        - !If
          - ExposeBackend
          - IpProtocol: tcp
            FromPort: 5000
            ToPort: 5000
            CidrIp: 0.0.0.0/0
            Description: Direct backend access (optional)
          - !Ref AWS::NoValue

  # Instance Security Group
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: healthcare-bot-instance-sg-multiport
      GroupDescription: Security group for EC2 instances
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        # SSH from your IP
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref MyIP
          Description: SSH access
        # Port 80 from ALB
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref ALBSecurityGroup
          Description: HTTP from ALB
        # Port 5000 from ALB (for backend)
        - IpProtocol: tcp
          FromPort: 5000
          ToPort: 5000
          SourceSecurityGroupId: !Ref ALBSecurityGroup
          Description: Backend from ALB

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: healthcare-bot-multiport-lt
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref InstanceType
        KeyName: !Ref KeyName
        IamInstanceProfile:
          Arn: !GetAtt InstanceProfile.Arn
        SecurityGroupIds:
          - !Ref InstanceSecurityGroup
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 20
              VolumeType: gp3
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: healthcare-bot-multiport
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash -xe
            exec > /var/log/user-data.log 2>&1
            echo "============================================="
            echo "Healthcare AI Bot - Multi-Port Setup"
            echo "============================================="
            date

            # Install packages
            echo "[1/8] Installing system packages..."
            dnf update -y
            dnf install -y git python3 python3-pip nginx gcc gcc-c++ make \
                           python3-devel libffi-devel openssl-devel unzip sqlite
            pip3 install awscli --upgrade

            # Create directories
            echo "[2/8] Creating directory structure..."
            mkdir -p /home/ec2-user/healthcare-bot/{backend,dist,logs}
            cd /home/ec2-user/healthcare-bot

            # Download from S3
            echo "[3/8] Downloading from S3..."
            if aws s3 cp s3://${S3BucketName}/${S3ZipFileName} .; then
                echo "✅ Downloaded ${S3ZipFileName}"
                unzip -o ${S3ZipFileName}
                rm ${S3ZipFileName}

                # Install dependencies
                python3 -m venv venv
                source venv/bin/activate
                pip install --upgrade pip

                if [ -f backend/requirements.txt ]; then
                    pip install -r backend/requirements.txt
                else
                    pip install Flask==2.3.0 Flask-CORS==4.0.0 gunicorn==21.2.0 \
                               Werkzeug==2.3.0 python-docx==1.1.0 PyPDF2==3.0.1 \
                               boto3==1.28.0 openpyxl pandas
                fi
                deactivate
            else
                echo "⚠️  S3 download failed, creating placeholder..."

                # Placeholder backend
                mkdir -p backend
                cat > backend/app.py << 'EOFAPP'
            from flask import Flask, jsonify
            from flask_cors import CORS

            app = Flask(__name__)
            CORS(app)

            @app.route('/api/health')
            def health():
                return jsonify({"status": "healthy", "message": "Backend running"})

            @app.route('/health')
            def health_simple():
                return "healthy"

            if __name__ == '__main__':
                app.run(host='0.0.0.0', port=5000)
            EOFAPP

                # Placeholder frontend
                mkdir -p dist
                cat > dist/index.html << 'EOFHTML'
            <!DOCTYPE html>
            <html>
            <head>
                <title>Healthcare AI Bot</title>
                <style>
                    body {
                        display: flex;
                        justify-content: center;
                        align-items: center;
                        min-height: 100vh;
                        margin: 0;
                        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                        color: white;
                        font-family: Arial, sans-serif;
                    }
                    .container {
                        text-align: center;
                        background: rgba(255, 255, 255, 0.1);
                        padding: 3rem;
                        border-radius: 20px;
                        backdrop-filter: blur(10px);
                    }
                    h1 { font-size: 2.5rem; margin: 0; }
                    .status {
                        margin-top: 1rem;
                        padding: 0.5rem 1rem;
                        background: rgba(16, 185, 129, 0.2);
                        border-radius: 10px;
                        display: inline-block;
                    }
                </style>
            </head>
            <body>
                <div class="container">
                    <h1>🏥 Healthcare AI Bot</h1>
                    <p>✅ Running via ALB + ASG</p>
                    <div class="status">Multi-Port Configuration</div>
                    <p style="font-size: 0.9rem; margin-top: 2rem; opacity: 0.7;">
                        Upload healthcare-FIXED-PATIENT.zip to S3
                    </p>
                </div>
            </body>
            </html>
            EOFHTML

                # Install Flask
                python3 -m venv venv
                source venv/bin/activate
                pip install --upgrade pip
                pip install Flask==2.3.0 Flask-CORS==4.0.0 gunicorn==21.2.0
                deactivate
            fi

            # Create backend service
            echo "[7/8] Creating backend service..."
            cat > /etc/systemd/system/healthcare-bot.service << 'EOFSVC'
            [Unit]
            Description=Healthcare AI Bot Backend
            After=network.target

            [Service]
            Type=simple
            User=ec2-user
            Group=ec2-user
            WorkingDirectory=/home/ec2-user/healthcare-bot/backend
            Environment="PATH=/home/ec2-user/healthcare-bot/venv/bin"
            ExecStart=/home/ec2-user/healthcare-bot/venv/bin/gunicorn \
                --chdir /home/ec2-user/healthcare-bot/backend \
                --bind 0.0.0.0:5000 \
                --workers 2 \
                --timeout 120 \
                --access-logfile /home/ec2-user/healthcare-bot/logs/access.log \
                --error-logfile /home/ec2-user/healthcare-bot/logs/error.log \
                app:app
            Restart=always
            RestartSec=3

            [Install]
            WantedBy=multi-user.target
            EOFSVC

            # Configure NGINX
            echo "[8/8] Configuring NGINX..."
            cat > /etc/nginx/conf.d/healthcare-bot.conf << 'EOFNGINX'
            server {
                listen 80;
                server_name _;
                client_max_body_size 50M;

                # Frontend
                location / {
                    root /home/ec2-user/healthcare-bot/dist;
                    try_files $uri $uri/ /index.html;
                }

                # Backend API (proxied)
                location /api/ {
                    proxy_pass http://127.0.0.1:5000;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                }

                # Health check
                location /health {
                    access_log off;
                    return 200 "healthy\n";
                    add_header Content-Type text/plain;
                }
            }
            EOFNGINX

            rm -f /etc/nginx/conf.d/default.conf

            # Set permissions
            chown -R ec2-user:ec2-user /home/ec2-user/healthcare-bot
            chmod -R 755 /home/ec2-user/healthcare-bot/dist

            # Start services
            systemctl daemon-reload
            systemctl enable healthcare-bot nginx
            systemctl start healthcare-bot
            sleep 2
            systemctl start nginx

            echo "============================================="
            echo "✅ Setup Complete!"
            echo "============================================="
            echo "NGINX on port 80: $(systemctl is-active nginx)"
            echo "Backend on port 5000: $(systemctl is-active healthcare-bot)"
            curl -I localhost:80 || echo "Port 80 not responding"
            curl localhost:5000/api/health || echo "Port 5000 not responding"
            echo "============================================="
            date

  # Application Load Balancer
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: healthcare-bot-alb-multi
      Type: application
      Scheme: internet-facing
      Subnets: !Ref PublicSubnets
      SecurityGroups:
        - !Ref ALBSecurityGroup

  # Target Group for Port 80 (Frontend + proxied backend)
  TargetGroup80:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: healthcare-bot-tg-80
      Port: 80
      Protocol: HTTP
      VpcId: !Ref VpcId
      HealthCheckEnabled: true
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  # Target Group for Port 5000 (Direct backend access)
  TargetGroup5000:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Condition: ExposeBackend
    Properties:
      Name: healthcare-bot-tg-5000
      Port: 5000
      Protocol: HTTP
      VpcId: !Ref VpcId
      HealthCheckEnabled: true
      HealthCheckPath: /api/health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  # Listener for Port 80
  ALBListener80:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup80

  # Listener for Port 5000 (optional)
  ALBListener5000:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: ExposeBackend
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 5000
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup5000

  # Auto Scaling Group
  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: healthcare-bot-asg-multi
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      MinSize: !Ref MinSize
      MaxSize: !Ref MaxSize
      DesiredCapacity: !Ref DesiredCapacity
      VPCZoneIdentifier: !Ref PublicSubnets
      TargetGroupARNs:
        - !Ref TargetGroup80
        - !If [ExposeBackend, !Ref TargetGroup5000, !Ref AWS::NoValue]
      HealthCheckType: ELB
      HealthCheckGracePeriod: 300

  ScaleUpPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref AutoScalingGroup
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        TargetValue: 70.0

Outputs:
  LoadBalancerDNS:
    Description: Load Balancer DNS
    Value: !GetAtt ApplicationLoadBalancer.DNSName

  FrontendURL:
    Description: Frontend URL (port 80)
    Value: !Sub 'http://${ApplicationLoadBalancer.DNSName}'

  BackendAPIviaProxy:
    Description: Backend API via NGINX proxy (recommended)
    Value: !Sub 'http://${ApplicationLoadBalancer.DNSName}/api/health'

  BackendAPIDirectURL:
    Description: Backend API direct access (port 5000) - only if enabled
    Value: !If
      - ExposeBackend
      - !Sub 'http://${ApplicationLoadBalancer.DNSName}:5000/api/health'
      - 'Not exposed (set ExposeBackendDirectly=true to enable)'

  SecurityNote:
    Description: Access pattern
    Value: !If
      - ExposeBackend
      - 'Both port 80 (recommended) and port 5000 (direct) are accessible'
      - 'Only port 80 accessible - backend accessed via /api/ proxy (recommended)'