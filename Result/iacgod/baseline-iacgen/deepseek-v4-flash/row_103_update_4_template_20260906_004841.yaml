  TemplateGenMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      ResourceId: !Ref TemplateGenResource
      HttpMethod: POST
      AuthorizationType: COGNITO
      AuthorizerId: !Ref ApiAuthorizer
      Integration:
        Type: AWS
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:sqs:path/${AWS::AccountId}/TemplateGenQueue
        Credentials: !GetAtt SQSIntegrationRole.Arn
        RequestTemplates:
          application/json: '{"payload": "{\"data\": \"$input.body\"}"}'
        IntegrationResponses:
          - StatusCode: 200
            ResponseTemplates:
              application/json: '{"message": "Request submitted"}'
      MethodResponses:
        - StatusCode: 200
  TemplateGenOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      ResourceId: !Ref TemplateGenResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
            ResponseTemplates:
              application/json: ''
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Headers: true
  KMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS key for SQS queue encryption
      KeyPolicy:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action:
              - kms:*
            Resource: '*'
          - Effect: Allow
            Principal:
              Service: sqs.amazonaws.com
            Action:
              - kms:GenerateDataKey
              - kms:Decrypt
            Resource: '*'
      Enabled: true
  KMSKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/NIHGrantsSQSKMSKey
      TargetKeyId: !Ref KMSKey
  TemplateGenQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: TemplateGenQueue
      KmsMasterKeyId: !Ref KMSKey
      KmsDataKeyReusePeriodSeconds: 300
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt TemplateGenDLQ.Arn
        maxReceiveCount: 5
      VisibilityTimeout: 30
  TemplateGenDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: TemplateGenDLQ
      KmsMasterKeyId: !Ref KMSKey
      KmsDataKeyReusePeriodSeconds: 300
  TemplateGenQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref TemplateGenQueue
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action:
              - sqs:SendMessage
            Resource: !GetAtt TemplateGenQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGatewayRestApi}
  SQSIntegrationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SQSIntegrationPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt TemplateGenQueue.Arn
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource: !GetAtt KMSKey.Arn
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      Description: Initial deployment
    DependsOn:
      - SearchMethod
      - SearchOptionsMethod
      - ScrapeMethod
      - ScrapeOptionsMethod
      - GenerateMethod
      - GenerateOptionsMethod
      - StatusMethod
      - StatusOptionsMethod
      - ArtifactsMethod
      - ArtifactsOptionsMethod
      - NihReporterMethod
      - NihReporterOptionsMethod
      - TemplateGenMethod
      - TemplateGenOptionsMethod
  DevStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      StageName: Dev
      RestApiId: !Ref ApiGatewayRestApi
      DeploymentId: !Ref ApiDeployment
      MethodSettings:
        - DataTraceEnabled: true
          LoggingLevel: INFO
          MetricsEnabled: true
          ResourcePath: '/*'
          HttpMethod: '*'
  ApiKey:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Name: NIHGrantsAPIKey
      Description: API key for NIH Grants Research Assistant
      Enabled: true
      StageKeys:
        - RestApiId: !Ref ApiGatewayRestApi
          StageName: Dev
    DependsOn:
      - DevStage
  UsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    Properties:
      UsagePlanName: NIHGrantsUsagePlan
      Description: Usage plan with monthly quota and throttle limits
      ApiStages:
        - ApiId: !Ref ApiGatewayRestApi
          Stage: Dev
      Quota:
        Limit: 1000
        Period: MONTH
      Throttle:
        BurstLimit: 100
        RateLimit: 50
    DependsOn:
      - DevStage
  UsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref ApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref UsagePlan
    DependsOn:
      - ApiKey
      - UsagePlan
  ApiGatewayAccountSettings:
    Type: AWS::ApiGateway::Account
    Properties:
      CloudWatchRoleArn: !GetAtt ApiGatewayCloudWatchRole.Arn
  ApiGatewayCloudWatchRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ApiGatewayCloudWatchPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: arn:aws:logs:*:*:*
Outputs:
  InvokeURL:
    Description: Invoke URL for the Dev stage
    Value: !Sub https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.amazonaws.com/Dev
  ApiKeyValue:
    Description: API key ID for the NIH Grants API
    Value: !Ref ApiKey