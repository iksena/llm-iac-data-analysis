  AdhocEmailSenderLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-AdhocEmailSender
      ReservedConcurrentExecutions: 10
      Handler: index.lambda_handler
      Role: !GetAtt LambdaSESRole.Arn
      DeadLetterConfig:
        TargetArn: !GetAtt LambdaDeadLetterQueue.Arn
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          import base64
          import hashlib
          import logging
          import re
          import uuid
          from datetime import datetime

          # Configure logging
          logger = logging.getLogger()
          logger.setLevel(getattr(logging, os.environ.get('LOG_LEVEL', 'WARN').upper(), logging.WARNING))

          CORS_ORIGIN = os.environ.get('ALLOWED_ORIGIN', 'NONE')

          def mask_email(address):
              """Short digest of an address, for correlating log lines without
              writing the address itself to CloudWatch Logs. Per-recipient status
              lives in the DynamoDB tracking table, not in the logs."""
              if not address:
                  return 'unknown'
              return 'sha256:' + hashlib.sha256(address.encode('utf-8')).hexdigest()[:12]

          def lambda_handler(event, context):
              """
              Lambda function to send adhoc emails directly via API Gateway
              """
              # Log request metadata only. The event body carries recipient and
              # sender addresses plus the message content, none of which belongs
              # in CloudWatch Logs.
              logger.info(f"Received adhoc email request: requestId={getattr(context, 'aws_request_id', 'unknown')}")

              try:
                  # Parse request body
                  if 'body' in event:
                      if isinstance(event['body'], str):
                          body = json.loads(event['body'])
                      else:
                          body = event['body']
                  else:
                      body = event

                  # Extract email parameters
                  to_email = body.get('to')
                  from_email = body.get('from')
                  from_name = body.get('fromName', 'Email System')
                  subject = body.get('subject')
                  html_content = body.get('htmlContent')
                  text_content = body.get('textContent')
                  attachments = body.get('attachments', [])

                  # Validate required fields
                  if not to_email or not from_email or not subject:
                      return {
                          'statusCode': 400,
                          'headers': {
                              'Content-Type': 'application/json',
                              'Access-Control-Allow-Origin': CORS_ORIGIN,
                          },
                          'body': json.dumps({
                              'error': 'Missing required fields: to, from, subject'
                          })
                      }

                  if not html_content and not text_content:
                      return {
                          'statusCode': 400,
                          'headers': {
                              'Content-Type': 'application/json',
                              'Access-Control-Allow-Origin': CORS_ORIGIN,
                          },
                          'body': json.dumps({
                              'error': 'Either htmlContent or textContent is required'
                          })
                      }

                  # Validate attachment filenames before they are interpolated into an
                  # S3 key further down. Without this a filename such as
                  # ../../templates/x lets the caller write to an arbitrary key in the
                  # attachments bucket, which also holds campaign templates that the
                  # sender lambda reads back. Mirrors the check already applied in
                  # EmailCampaignInitiatorLambda so both entry points behave the same.
                  for att in attachments:
                      fname = att.get('filename', '')
                      if not fname or len(fname) > 255 or re.search(r'[/\\:\x00]', fname) or fname.startswith('.'):
                          return {
                              'statusCode': 400,
                              'headers': {
                                  'Content-Type': 'application/json',
                                  'Access-Control-Allow-Origin': CORS_ORIGIN,
                              },
                              'body': json.dumps({
                                  'error': 'Invalid attachment filename. No path separators, null bytes, or leading dots.'
                              })
                          }

                  # Initialize SES client
                  ses_client = boto3.client('sesv2')

                  # Process embedded images in HTML content
                  embedded_attachments = []
                  if html_content:
                      html_content, embedded_attachments = extract_embedded_images(html_content)

                  # Prepare email content
                  content = {
                      'Simple': {
                          'Subject': {
                              'Data': subject,
                              'Charset': 'UTF-8'
                          },
                          'Body': {}
                      }
                  }

                  if html_content:
                      content['Simple']['Body']['Html'] = {
                          'Data': html_content,
                          'Charset': 'UTF-8'
                      }

                  if text_content:
                      content['Simple']['Body']['Text'] = {
                          'Data': text_content,
                          'Charset': 'UTF-8'
                      }

                  # Process attachments (both regular and embedded)
                  all_attachments = list(attachments) + embedded_attachments
                  if all_attachments:
                      s3_client = boto3.client('s3')
                      attachments_bucket = os.environ.get('ATTACHMENTS_BUCKET')

                      attachment_list = []
                      for attachment in all_attachments:
                          filename = attachment.get('filename')
                          content_data = attachment.get('content')  # base64 encoded
                          content_type = attachment.get('contentType', 'application/octet-stream')
                          content_disposition = attachment.get('contentDisposition', 'ATTACHMENT')
                          content_id = attachment.get('contentId')

                          if filename and content_data:
                              # For adhoc emails, upload to different S3 prefix
                              timestamp = datetime.now().strftime('%Y%m%d%H%M%S')
                              s3_key = f"adhoc/{timestamp}/attachments/{filename}"

                              # Decode base64 content
                              file_data = base64.b64decode(content_data)

                              # Upload to S3
                              s3_client.put_object(
                                  Bucket=attachments_bucket,
                                  Key=s3_key,
                                  Body=file_data,
                                  ContentType=content_type,
                                  Metadata={
                                      'original-filename': filename,
                                      'content-type': content_type
                                  }
                              )

                              logger.info(f"Uploaded attachment {filename} to s3://{attachments_bucket}/{s3_key}")

                              attachment_obj = {
                                  'RawContent': file_data,
                                  'ContentDisposition': content_disposition,
                                  'FileName': filename,
                                  'ContentType': content_type,
                                  'ContentTransferEncoding': 'BASE64'
                              }

                              # Add ContentId for embedded images
                              if content_id:
                                  attachment_obj['ContentId'] = content_id

                              attachment_list.append(attachment_obj)

                      if attachment_list:
                          content['Simple']['Attachments'] = attachment_list
                          logger.info(f"Added {len(attachment_list)} attachments to email ({len(embedded_attachments)} embedded)")

                  # Prepare email parameters with unsubscribe headers
                  email_params = {
                      'FromEmailAddress': f"{from_name} <{from_email}>",
                      'Destination': {
                          'ToAddresses': [to_email]
                      },
                      'Content': content
                  }

                  # Add SES native subscription management
                  contact_list_name = os.environ.get('CONTACT_LIST_NAME')
                  topic_name = os.environ.get('TOPIC_NAME')

                  if contact_list_name:
                      list_management_options = {
                          'ContactListName': contact_list_name
                      }
                      if topic_name and topic_name != "NONE":
                          list_management_options['TopicName'] = topic_name

                      email_params['ListManagementOptions'] = list_management_options

                      # Add unsubscribe placeholder to HTML content if configured
                      if html_content and '{{amazonSESUnsubscribeUrl}}' not in html_content:
                          unsubscribe_html = '<p>To unsubscribe from this newsletter, <a href="{{amazonSESUnsubscribeUrl}}">click here</a>.</p>'

                          # Add unsubscribe link to end of HTML content
                          if '</body>' in html_content:
                              html_content = html_content.replace('</body>', f'{unsubscribe_html}</body>')
                          else:
                              html_content += unsubscribe_html

                          # Update the content with modified HTML
                          email_params['Content']['Simple']['Body']['Html']['Data'] = html_content

                  # Add tokenized Reply-To for Please-Reply integration
                  token_generator_fn = os.environ.get('TOKEN_GENERATOR_FN')
                  if token_generator_fn:
                      try:
                          lambda_client = boto3.client('lambda')
                          token_payload = json.dumps({
                              'customerId': to_email,
                              'campaignId': 'adhoc'
                          })
                          token_response = lambda_client.invoke(
                              FunctionName=token_generator_fn,
                              InvocationType='RequestResponse',
                              Payload=token_payload.encode('utf-8')
                          )
                          token_result = json.loads(token_response['Payload'].read())
                          token_body = json.loads(token_result.get('body', '{}'))
                          reply_to = token_body.get('replyToEmail')
                          if reply_to:
                              email_params['ReplyToAddresses'] = [reply_to]
                              logger.info(f"Set tokenized Reply-To for {mask_email(to_email)}")
                      except Exception as token_err:
                          logger.warning(f"Token generation failed for {mask_email(to_email)}, sending without Reply-To: {token_err}")

                  # Add configuration set if available
                  config_set = os.environ.get('SES_CONFIGURATION_SET')
                  if config_set:
                      email_params['ConfigurationSetName'] = config_set

                  # Send email
                  response = ses_client.send_email(**email_params)

                  logger.info(f"Email sent successfully to {mask_email(to_email)}, MessageId: {response.get('MessageId')}")

                  return {
                      'statusCode': 200,
                      'headers': {
                          'Content-Type': 'application/json',
                          'Access-Control-Allow-Origin': CORS_ORIGIN,
                      },
                      'body': json.dumps({
                          'message': 'Email sent successfully',
                          'messageId': response.get('MessageId'),
                          'timestamp': datetime.now().isoformat()
                      })
                  }

              except Exception as e:
                  logger.error(f"Error sending adhoc email: {str(e)}")
                  return {
                      'statusCode': 500,
                      'headers': {
                          'Content-Type': 'application/json',
                          'Access-Control-Allow-Origin': CORS_ORIGIN,
                      },
                      'body': json.dumps({
                          'error': 'Failed to send email',
                          'message': str(e)
                      })
                  }

          def extract_embedded_images(html_content):
              """
              Extract embedded images from HTML content and convert data: URLs to cid: references
              Returns: (modified_html, list_of_embedded_attachments)
              """
              embedded_attachments = []

              # Pattern to match data: URLs in img src attributes
              data_url_pattern = r'<img[^>]+src="data:([^;]+);base64,([^"]+)"[^>]*>'

              def replace_data_url(match):
                  full_tag = match.group(0)
                  mime_type = match.group(1)
                  base64_data = match.group(2)

                  # Generate unique content ID
                  content_id = str(uuid.uuid4())

                  # Determine file extension from MIME type
                  extension_map = {
                      'image/png': 'png',
                      'image/jpeg': 'jpg',
                      'image/jpg': 'jpg',
                      'image/gif': 'gif',
                      'image/webp': 'webp',
                      'image/svg+xml': 'svg'
                  }
                  extension = extension_map.get(mime_type, 'bin')
                  filename = f"embedded_image_{content_id}.{extension}"

                  # Add to embedded attachments list
                  embedded_attachments.append({
                      'filename': filename,
                      'content': base64_data,
                      'contentType': mime_type,
                      'contentDisposition': 'INLINE',
                      'contentId': content_id
                  })

                  # Replace data: URL with cid: reference
                  return full_tag.replace(f'data:{mime_type};base64,{base64_data}', f'cid:{content_id}')

              # Replace all data: URLs with cid: references
              modified_html = re.sub(data_url_pattern, replace_data_url, html_content)

              return modified_html, embedded_attachments
