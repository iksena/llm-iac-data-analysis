  # S3 VPC Endpoint with Full Access Policy (Module 4: user restricts this)
  S3VPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowAmazonLinuxRepos
            Effect: Allow
            Principal: '*'
            Action:
              - s3:GetObject
              - s3:ListBucket
            Resource:
              - 'arn:aws:s3:::al2023-repos-*/*'
              - 'arn:aws:s3:::al2023-repos-*'
              - 'arn:aws:s3:::amazonlinux-2-repos-*/*'
              - 'arn:aws:s3:::amazonlinux-2-repos-*'
          - Sid: AllowAllSampleBuckets
            Effect: Allow
            Principal: '*'
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:ListBucket
              - s3:ListBucketVersions
