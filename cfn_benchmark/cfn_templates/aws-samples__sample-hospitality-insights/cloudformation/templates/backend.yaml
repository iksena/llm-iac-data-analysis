              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${AlertDetectorFunction}",
                "Payload": {
                  "action": "check_pending",
                  "outagesDetected": {}
                }
              },
              "ResultPath": "$.alertResult",
              "Next": "FormatSummary"
            },
            "FormatSummary": {
              "Type": "Pass",
              "Parameters": {
                "summary": {
                  "totalItemsAdded.$": "$.analysisResult.Payload.processed",
