AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  AWS CloudFormation Amazon EKS Stack for Hive Metastore Infrastructure.
  COST WARNING: Creates billable resources (EKS cluster, EC2 node groups, KMS key).
  Delete this stack to stop charges.

Parameters:
  ProjectName:
    Description: An environment name that is prefixed to resource names
    Type: String
    Default: KerberosEMRonEKS

  VPC:
    Description: The Amazon VPC ID where Amazon EKS clusters will be created
    Type: AWS::EC2::VPC::Id

  PrivateSubnets:
    Description: List of private subnet IDs for Amazon EKS clusters
    Type: List<AWS::EC2::Subnet::Id>

  InstanceType:
    Description: Amazon EC2 instance type for Amazon EKS node groups
    Type: String
    Default: m5.4xlarge

  AnalyticsClusterName:
    Description: Name of the Analytics Amazon EKS cluster
    Type: String
    Default: analytics-cluster

  ClusterVersion:
    Description: Kubernetes version for Amazon EKS clusters
    Type: String
    Default: "1.35"

  HiveMetastoreS3BucketName:
    Description: Name of the Amazon S3 bucket for Hive Metastore (without account ID and region suffix)
    Type: String
    Default: "demo-emr-eks-kerberos-data"

  DeploymentSourceIP:
    Description: >-
      Your deployment machine's public IP address for Amazon EKS API access.
      Run 'curl -s ifconfig.me' to find your IP. Example format: 203.0.113.1
    Type: String
    AllowedPattern: "^([0-9]{1,3}\\.){3}[0-9]{1,3}$"

Resources:
  EKSClusterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy

  EKSNodeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly

  EC2ClientRole:
    Type: AWS::IAM::Role
    Metadata:
      guard:
        SuppressedRules:
          - IAM_NO_INLINE_POLICY_CHECK: "Inline policy acceptable for demo purposes. For production, refactor to managed policies."
    Properties:
      Path: /
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-EC2Role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/AmazonSSMPatchAssociation
      Policies:
        - PolicyName: !Sub "${ProjectName}-EC2Policy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Amazon EKS read-only permissions
              - Sid: EKSReadOnly
                Effect: Allow
                Action:
                  - eks:DescribeCluster
                  - eks:ListClusters
                  - eks:DescribeNodegroup
                  - eks:ListNodegroups
                Resource:
                  - !Sub "arn:aws:eks:${AWS::Region}:${AWS::AccountId}:cluster/*"
                  - !Sub "arn:aws:eks:${AWS::Region}:${AWS::AccountId}:nodegroup/*/*/*"
              - Sid: S3HiveMetastore
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectAcl
                  - s3:GetObjectTagging
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${HiveMetastoreS3BucketName}-${AWS::AccountId}-${AWS::Region}"
                  - !Sub "arn:aws:s3:::${HiveMetastoreS3BucketName}-${AWS::AccountId}-${AWS::Region}/*"

  EKSKMSKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Description: KMS key for EKS cluster secrets encryption
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          - Sid: Allow EKS to use the key
            Effect: Allow
            Principal:
              AWS: !GetAtt EKSClusterRole.Arn
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: "*"

  ######### Analytics EKS Cluster #########
  # Amazon EKS cluster incurs hourly charges. Delete AWS CloudFormation stack to remove.
  AnalyticsEKSCluster:
    Type: AWS::EKS::Cluster
    DeletionPolicy: Delete
    Metadata:
      guard:
        SuppressedRules:
          - EKS_ENDPOINT_NO_PUBLIC_ACCESS: "Public endpoint is enabled but restricted to deployment source IP only via PublicAccessCidrs. Private endpoint is also enabled for internal cluster access."
    Properties:
      Name: !Ref AnalyticsClusterName
      Version: !Ref ClusterVersion
      RoleArn: !GetAtt EKSClusterRole.Arn
      AccessConfig:
        AuthenticationMode: API_AND_CONFIG_MAP
      ResourcesVpcConfig:
        SubnetIds: !Ref PrivateSubnets
        SecurityGroupIds: []
        EndpointPublicAccess: true
        EndpointPrivateAccess: true
        PublicAccessCidrs:
          - !Sub "${DeploymentSourceIP}/32"
      EncryptionConfig:
        - Provider:
            KeyArn: !GetAtt EKSKMSKey.Arn
          Resources:
            - secrets
      Tags:
        - Key: ProjectName
          Value: !Ref ProjectName

  # Node group with m5.xlarge instances. Delete AWS CloudFormation stack to remove.
  AnalyticsNodeGroup:
    Type: AWS::EKS::Nodegroup
    DeletionPolicy: Delete
    Properties:
      ClusterName: !Ref AnalyticsEKSCluster
      NodeRole: !GetAtt EKSNodeRole.Arn
      ScalingConfig:
        MinSize: 1
        DesiredSize: 3
        MaxSize: 5
      InstanceTypes:
        - !Ref InstanceType
      DiskSize: 100
      Subnets: !Ref PrivateSubnets

  EKSAccessEntity:
    Type: AWS::EKS::AccessEntry
    Properties:
      PrincipalArn: !GetAtt EC2ClientRole.Arn
      ClusterName: !Ref AnalyticsEKSCluster
      AccessPolicies:
        - PolicyArn: 'arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy'
          AccessScope:
            Type: "cluster"

Outputs:
  AnalyticsClusterName:
    Description: Name of the Analytics EKS cluster
    Value: !Ref AnalyticsEKSCluster

  AnalyticsClusterEndpoint:
    Description: Endpoint for the Analytics EKS cluster
    Value: !GetAtt AnalyticsEKSCluster.Endpoint

  EKSSecurityGroups:
    Description: Security Groups for the EKS clusters
    Value:
      !Join [
        ",",
        [
          !GetAtt AnalyticsEKSCluster.ClusterSecurityGroupId,
        ],
      ]

  AnalyticsEKSSecurityGroup:
    Description: ID of the second EKS Security Group
    Value: !GetAtt AnalyticsEKSCluster.ClusterSecurityGroupId

  AnalyticsClusterOidcProviderUrl:
    Value:
      !Select [
        1,
        !Split ["https://", !GetAtt AnalyticsEKSCluster.OpenIdConnectIssuerUrl],
      ]