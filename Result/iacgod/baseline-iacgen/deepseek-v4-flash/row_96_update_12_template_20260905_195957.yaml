AWSTemplateFormatVersion: '2010-09-09'
Description: Shared IAM roles and GuardDuty configuration for EKS deployments
Parameters:
  EnvironmentAlias:
    Type: String
    Description: Prefix for all resource names
    Default: dev
    AllowedPattern: ^[a-zA-Z0-9-]+$
  Hash:
    Type: String
    Default: ''
    Description: Optional hash suffix for naming
    AllowedPattern: ^[a-zA-Z0-9-]*$
  S3BucketName:
    Type: String
    Description: S3 bucket name for bastion role access
    Default: my-eks-bastion-bucket
  PermissionsBoundaryArn:
    Type: String
    Default: ''
    Description: Optional ARN of permissions boundary policy
Conditions:
  HasHash: !Not [!Equals [!Ref Hash, '']]
  HasPermissionsBoundary: !Not [!Equals [!Ref PermissionsBoundaryArn, '']]
Resources:
  GuardDutyDetector:
    Type: AWS::GuardDuty::Detector
    Properties:
      Enable: true
      FindingPublishingFrequency: FIFTEEN_MINUTES
  LambdaExecutionRoleReadOnly:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !If
        - HasHash
        - !Sub ${EnvironmentAlias}-lambda-readonly-${Hash}
        - !Sub ${EnvironmentAlias}-lambda-readonly
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/ReadOnlyAccess
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue
  LambdaRoleGetCallerIdentity:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !If
        - HasHash
        - !Sub ${EnvironmentAlias}-lambda-identity-${Hash}
        - !Sub ${EnvironmentAlias}-lambda-identity
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: GetCallerIdentityAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sts:GetCallerIdentity
                  - cloudformation:DescribeStacks
                  - cloudtrail:LookupEvents
                Resource: '*'
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue
  EKSNodeGroupDescribeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !If
        - HasHash
        - !Sub ${EnvironmentAlias}-eks-node-describer-${Hash}
        - !Sub ${EnvironmentAlias}-eks-node-describer
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DescribeNodeGroups
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - eks:DescribeNodegroup
                  - eks:ListNodegroups
                Resource: '*'
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue
  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !If
        - HasHash
        - !Sub ${EnvironmentAlias}-cfn-execution-${Hash}
        - !Sub ${EnvironmentAlias}-cfn-execution
      MaxSessionDuration: 8400
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: EKSManagement
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - eks:*
                  - secretsmanager:*
                  - kms:*
                  - s3:*
                  - ec2:*
                  - lambda:*
                  - logs:*
                Resource: '*'
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue
  LoggingDeliveryRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !If
        - HasHash
        - !Sub ${EnvironmentAlias}-logging-delivery-${Hash}
        - !Sub ${EnvironmentAlias}-logging-delivery
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudWatchLogsDelivery
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogGroups
                Resource: '*'
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue
  CodeBuildEKSServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !If
        - HasHash
        - !Sub ${EnvironmentAlias}-codebuild-eks-${Hash}
        - !Sub ${EnvironmentAlias}-codebuild-eks
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - codebuild.amazonaws.com
                - eks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ECRS3EKS
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecr:*
                  - s3:*
                  - eks:*
                Resource: '*'
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue
  CloudFormationExtensionHookRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !If
        - HasHash
        - !Sub ${EnvironmentAlias}-cfn-extension-${Hash}
        - !Sub ${EnvironmentAlias}-cfn-extension
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ExtensionHookPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:*
                  - kms:*
                  - eks:*
                  - s3:*
                  - sts:*
                  - iam:*
                  - ec2:*
                  - lambda:*
                  - logs:*
                  - cloudwatch:*
                  - ssm:*
                Resource: '*'
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue
  BastionInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !If
        - HasHash
        - !Sub ${EnvironmentAlias}-bastion-${Hash}
        - !Sub ${EnvironmentAlias}-bastion
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BastionAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub arn:aws:s3:::${S3BucketName}/*
              - Effect: Allow
                Action:
                  - ecr:*
                  - ec2:*
                  - eks:*
                  - codebuild:*
                  - codepipeline:*
                  - logs:*
                  - cloudwatch:*
                Resource: '*'
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue
  KubernetesResourceTypeActivation:
    Type: AWS::CloudFormation::TypeActivation
    Properties:
      PublicTypeArn: !Sub arn:aws:cloudformation:${AWS::Region}::type/resource/aws-quickstart/AWSQS-Kubernetes-Resource
      ExecutionRoleArn: !GetAtt CloudFormationExecutionRole.Arn
      LoggingConfig:
        LogRoleArn: !GetAtt LoggingDeliveryRole.Arn
        LogGroupName: cloudformation/registry/awsqs-kubernetes-resource
      VersionBump: MAJOR
  KubernetesHelmTypeActivation:
    Type: AWS::CloudFormation::TypeActivation
    Properties:
      PublicTypeArn: !Sub arn:aws:cloudformation:${AWS::Region}::type/resource/aws-quickstart/AWSQS-Kubernetes-Helm
      ExecutionRoleArn: !GetAtt CloudFormationExecutionRole.Arn
      LoggingConfig:
        LogRoleArn: !GetAtt LoggingDeliveryRole.Arn
        LogGroupName: awsqs-kubernetes-helm-logs
      VersionBump: MAJOR
  EKSClusterTypeActivation:
    Type: AWS::CloudFormation::TypeActivation
    Properties:
      PublicTypeArn: !Sub arn:aws:cloudformation:${AWS::Region}::type/resource/aws-quickstart/AWSQS-EKS-Cluster
      ExecutionRoleArn: !GetAtt CloudFormationExecutionRole.Arn
      LoggingConfig:
        LogRoleArn: !GetAtt LoggingDeliveryRole.Arn
        LogGroupName: cloudformation/registry/awsqs-eks-cluster
      VersionBump: MAJOR
Outputs:
  GuardDutyDetectorId:
    Description: GuardDuty Detector ID
    Value: !GetAtt GuardDutyDetector.Id
  LambdaExecutionRoleReadOnlyArn:
    Description: Lambda execution role ARN for read-only access
    Value: !GetAtt LambdaExecutionRoleReadOnly.Arn
  LambdaRoleGetCallerIdentityArn:
    Description: Lambda role ARN for get caller identity
    Value: !GetAtt LambdaRoleGetCallerIdentity.Arn
  EKSNodeGroupDescribeRoleArn:
    Description: EKS node group describer role ARN
    Value: !GetAtt EKSNodeGroupDescribeRole.Arn
  CloudFormationExecutionRoleArn:
    Description: CloudFormation execution role ARN
    Value: !GetAtt CloudFormationExecutionRole.Arn
  LoggingDeliveryRoleArn:
    Description: Logging delivery role ARN
    Value: !GetAtt LoggingDeliveryRole.Arn
  CodeBuildEKSServiceRoleArn:
    Description: CodeBuild/EKS service role ARN
    Value: !GetAtt CodeBuildEKSServiceRole.Arn
  CloudFormationExtensionHookRoleArn:
    Description: CloudFormation extension hook role ARN
    Value: !GetAtt CloudFormationExtensionHookRole.Arn
  BastionInstanceRoleArn:
    Description: Bastion instance role ARN
    Value: !GetAtt BastionInstanceRole.Arn