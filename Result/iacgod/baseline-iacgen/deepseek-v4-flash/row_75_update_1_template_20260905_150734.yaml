AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFormation template for AnyCompany Hotel Cognito User Pool with advanced security, custom attributes, groups, OAuth2 client, and domain.'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: 'Environment for the stack (dev, staging, prod).'

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub 'AnyCompanyHotel-${Environment}-UserPool'
      UsernameAttributes:
        - email
      Schema:
        - Name: guest_id
          AttributeDataType: String
          Mutable: true
          Required: false
        - Name: property_id
          AttributeDataType: String
          Mutable: true
          Required: false
        - Name: region
          AttributeDataType: String
          Mutable: true
          Required: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
      AutoVerifiedAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
        UnusedAccountValidityDays: 7
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      UserPoolAddOns:
        AdvancedSecurityMode: ENFORCED

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub 'anycompany-hotel-${Environment}-${AWS::AccountId}'
      UserPoolId: !Ref UserPool

  ResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      Identifier: !Sub 'anycompany-hotel-${Environment}-resource-server'
      Name: !Sub 'AnyCompanyHotel-${Environment}-ResourceServer'
      UserPoolId: !Ref UserPool
      Scopes:
        - ScopeName: read
          ScopeDescription: 'Read access'
        - ScopeName: write
          ScopeDescription: 'Write access'
        - ScopeName: admin
          ScopeDescription: 'Admin access'

  SPAUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub 'AnyCompanyHotel-${Environment}-SPA-Client'
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AllowedOAuthFlowsUserPoolClient: false
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      SupportedIdentityProviders:
        - COGNITO

  AdminUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub 'AnyCompanyHotel-${Environment}-Admin-Client'
      UserPoolId: !Ref UserPool
      GenerateSecret: true
      ExplicitAuthFlows:
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AllowedOAuthFlowsUserPoolClient: false
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      SupportedIdentityProviders:
        - COGNITO

  M2MUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub 'AnyCompanyHotel-${Environment}-M2M-Client'
      UserPoolId: !Ref UserPool
      GenerateSecret: true
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - client_credentials
      AllowedOAuthScopes:
        - !Sub '${ResourceServer.Identifier}/read'
        - !Sub '${ResourceServer.Identifier}/write'
        - !Sub '${ResourceServer.Identifier}/admin'
      SupportedIdentityProviders:
        - COGNITO
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
    DependsOn: ResourceServer

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Admin
      UserPoolId: !Ref UserPool
      Description: 'Administrators'

  ManagerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Manager
      UserPoolId: !Ref UserPool
      Description: 'Managers'

  RegionalManagerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: RegionalManager
      UserPoolId: !Ref UserPool
      Description: 'Regional Managers'

  RevenueManagerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: RevenueManager
      UserPoolId: !Ref UserPool
      Description: 'Revenue Managers'

  FrontDeskGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: FrontDesk
      UserPoolId: !Ref UserPool
      Description: 'Front Desk Staff'

  HousekeepingGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Housekeeping
      UserPoolId: !Ref UserPool
      Description: 'Housekeeping Staff'

Outputs:
  UserPoolId:
    Description: 'The ID of the user pool'
    Value: !Ref UserPool
    Export:
      Name: !Sub '${AWS::StackName}-UserPoolId'
  UserPoolArn:
    Description: 'The ARN of the user pool'
    Value: !GetAtt UserPool.Arn
    Export:
      Name: !Sub '${AWS::StackName}-UserPoolArn'
  SPAUserPoolClientId:
    Description: 'Client ID for the SPA client'
    Value: !Ref SPAUserPoolClient
    Export:
      Name: !Sub '${AWS::StackName}-SPAUserPoolClientId'
  AdminUserPoolClientId:
    Description: 'Client ID for the admin client'
    Value: !Ref AdminUserPoolClient
    Export:
      Name: !Sub '${AWS::StackName}-AdminUserPoolClientId'
  AdminUserPoolClientSecret:
    Description: 'Client secret for the admin client'
    Value: !GetAtt AdminUserPoolClient.ClientSecret
    Export:
      Name: !Sub '${AWS::StackName}-AdminUserPoolClientSecret'
  M2MUserPoolClientId:
    Description: 'Client ID for the M2M client'
    Value: !Ref M2MUserPoolClient
    Export:
      Name: !Sub '${AWS::StackName}-M2MUserPoolClientId'
  M2MUserPoolClientSecret:
    Description: 'Client secret for the M2M client'
    Value: !GetAtt M2MUserPoolClient.ClientSecret
    Export:
      Name: !Sub '${AWS::StackName}-M2MUserPoolClientSecret'
  UserPoolDomainName:
    Description: 'The domain URL for the user pool'
    Value: !Sub 'https://${UserPoolDomain.Domain}.auth.${AWS::Region}.amazoncognito.com'
    Export:
      Name: !Sub '${AWS::StackName}-UserPoolDomain'
  ResourceServerIdentifier:
    Description: 'The resource server identifier'
    Value: !Ref ResourceServer
    Export:
      Name: !Sub '${AWS::StackName}-ResourceServerIdentifier'
  AdminGroupName:
    Description: 'Admin group name'
    Value: !Ref AdminGroup
    Export:
      Name: !Sub '${AWS::StackName}-AdminGroupName'
  ManagerGroupName:
    Description: 'Manager group name'
    Value: !Ref ManagerGroup
    Export:
      Name: !Sub '${AWS::StackName}-ManagerGroupName'
  RegionalManagerGroupName:
    Description: 'Regional Manager group name'
    Value: !Ref RegionalManagerGroup
    Export:
      Name: !Sub '${AWS::StackName}-RegionalManagerGroupName'
  RevenueManagerGroupName:
    Description: 'Revenue Manager group name'
    Value: !Ref RevenueManagerGroup
    Export:
      Name: !Sub '${AWS::StackName}-RevenueManagerGroupName'
  FrontDeskGroupName:
    Description: 'Front Desk group name'
    Value: !Ref FrontDeskGroup
    Export:
      Name: !Sub '${AWS::StackName}-FrontDeskGroupName'
  HousekeepingGroupName:
    Description: 'Housekeeping group name'
    Value: !Ref HousekeepingGroup
    Export:
      Name: !Sub '${AWS::StackName}-HousekeepingGroupName'