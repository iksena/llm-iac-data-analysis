AWSTemplateFormatVersion: '2010-09-09'
Description: '3pTTS Integration for Amazon Connect'

Parameters:
  ConnectInstanceArn:
    Type: String
    Description: ARN of the Amazon Connect instance

Resources:
  # KMS Key for Secrets Manager
  3pTTSKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS key for 3pTTS API secret
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: Allow Connect to decrypt
            Effect: Allow
            Principal:
              Service: connect.amazonaws.com
            Action: kms:Decrypt
            Resource: '*'
            Condition:
              ArnLike:
                'aws:sourceArn': !Ref ConnectInstanceArn
              StringEquals:
                'aws:sourceAccount': !Ref AWS::AccountId

  # Secrets Manager for 3p TTS API Key
  3pTTSApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}-3pTTSApiKey'
      Description: 3pTTS API key for text-to-speech
      KmsKeyId: !Ref 3pTTSKmsKey
      SecretString: '{"apiToken":"PLACEHOLDER","apiTokenRegion":"us"}'
    DeletionPolicy: Delete

  # Resource Policy for Secrets Manager
  3pTTSSecretResourcePolicy:
    Type: AWS::SecretsManager::ResourcePolicy
    Properties:
      SecretId: !Ref 3pTTSApiKeySecret
      ResourcePolicy:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: connect.amazonaws.com
            Action: 'secretsmanager:GetSecretValue'
            Resource: '*'
            Condition:
              ArnLike:
                'aws:sourceArn': !Ref ConnectInstanceArn
              StringEquals:
                'aws:sourceAccount': !Ref AWS::AccountId

Outputs:
  3pTTSSecretArn:
    Description: ARN of the 3pTTS API key secret
    Value: !Ref 3pTTSApiKeySecret
    Export:
      Name: !Sub '${AWS::StackName}-SecretArn'

  3pTTSKmsKeyId:
    Description: ID of the KMS key for the secret
    Value: !Ref 3pTTSKmsKey
    Export:
      Name: !Sub '${AWS::StackName}-KmsKeyId'