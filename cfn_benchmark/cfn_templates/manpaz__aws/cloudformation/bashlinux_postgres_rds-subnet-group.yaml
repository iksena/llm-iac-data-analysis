---
# Bashlinux::Postgres::RDS Subnet Group
#
#   Cloudformation template to deploy an RDS Subnet Group
#   for a Postgres cluster on a private subnet
#
#   Manuel F Martinez
#   Bashlinux
#   Los Angeles, CA
#
AWSTemplateFormatVersion: "2010-09-09"
Description: RDS Subnet Group template

###############################################################################
Parameters:

  Environment:
    Description: Postgres cluster environment
    Type: String
    MinLength: "1"
    MaxLength: "20"
    Default: staging
    AllowedValues: [ "prod", "staging" ]
    ConstraintDescription: >
      Environment name can only contain "prod" or "staging".

  Organization:
    Description: Organization or Customer name
    Type: String
    MinLength: "1"
    MaxLength: "32"
    Default: bashlinux
    AllowedPattern: "[a-zA-Z0-9\\-]*"
    ConstraintDescription: >
      Name of the organization must contains only letters, numbers and hyphens

  RDSPrivateSubnets:
    Description: Private subnets 01A where the cluster is deployed
    Type: List<AWS::EC2::Subnet::Id>
    MinLength: "1"
    MaxLength: "96"

###############################################################################
Resources:

  RdsSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: PostgresSubnetGroup
      DBSubnetGroupName: !Sub "${Organization}-postgres-${Environment}"
      SubnetIds: !Ref RDSPrivateSubnets
      Tags:
      - Key: bashlinux:network-visibility
        Value: private
      - Key: bashlinux:organization-name
        Value: !Ref Organization
      - Key: bashlinux:environment-name
        Value: !Ref Environment
      - Key: bashlinux:can-delete
        Value: "false"
      - Key: bashlinux:application-id
        Value: !Ref AWS::StackName
      - Key: Name
        Value: !Sub "${Organization}-postgres-${Environment}"

###############################################################################
Outputs:

  RdsSubnetGroupId:
    Description: "SubnetGroup: RDS Postgres SubnetGroup"
    Value: !Ref RdsSubnetGroup
    Export:
      Name: !Sub "${Organization}-${Environment}-RdsSubnetGroupId"

  RdsSubnetIds:
    Description: "SubnetIds: RDS Postgres SubnetIDs belonging to the Subnet Group"
    Value: !Join [ ",", !Ref RDSPrivateSubnets ]
    Export:
      Name: !Sub "${Organization}-${Environment}-RdsSubnetIds"