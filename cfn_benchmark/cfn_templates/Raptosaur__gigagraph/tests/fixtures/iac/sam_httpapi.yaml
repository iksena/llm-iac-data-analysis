# Real-world shapes from aws-samples corpora:
#  - a duplicate mapping key (CodeUri pasted twice — CloudFormation accepts
#    last-wins, strict YAML parsers reject the whole document),
#  - AWS::Serverless::HttpApi with an OpenAPI DefinitionBody: one route
#    restating a function event (must not double-count) and one http_proxy
#    route to an external upstream (a real route of the deployed API, with
#    honestly no handler).
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: HttpApi DefinitionBody + duplicate-key resilience

Resources:
  DupKeyFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri:
      Handler: handlers/items.handler
      Runtime: nodejs18.x
      CodeUri: src/
      Events:
        Dup:
          Type: HttpApi
          Properties:
            ApiId: !Ref JokesApi
            Path: /dup
            Method: GET

  JokesApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      FailOnWarnings: true
      DefinitionBody:
        openapi: "3.0.1"
        info:
          title: "Jokes"
        paths:
          /dup:
            get:
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                payloadFormatVersion: "2.0"
                uri: !GetAtt DupKeyFunction.Arn
          /jokes:
            get:
              responses:
                default:
                  description: "Default response for GET /jokes"
              x-amazon-apigateway-integration:
                type: http_proxy
                httpMethod: ANY
                uri: "https://icanhazdadjoke.com/"
                connectionType: INTERNET
        x-amazon-apigateway-importexport-version: "1.0"