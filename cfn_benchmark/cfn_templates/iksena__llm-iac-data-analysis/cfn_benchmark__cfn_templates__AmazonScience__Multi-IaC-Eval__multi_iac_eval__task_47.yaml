AWSTemplateFormatVersion: "2010-09-09"

Parameters:
  AWSPrincipals:
    Type: CommaDelimitedList

  SubnetIDs:
    Type: CommaDelimitedList

Resources:

  # An internal network load balancer with cross zone load balancing enabled
  NetworkLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: network
      Scheme: internal
      Subnets: !Ref SubnetIDs
      LoadBalancerAttributes:
        - Key: load_balancing.cross_zone.enabled
          Value: true

  # Create a VPC endpoint service for the NLB
  VpcEndpointService:
    Type: AWS::EC2::VPCEndpointService
    Properties:
      AcceptanceRequired: true
      NetworkLoadBalancerArns:
        - !Ref NetworkLoadBalancer

  # Give permissions to AWS principals to access the endpoint
  VpcEndpointServicePermissions:
    Type: AWS::EC2::VPCEndpointServicePermissions
    Properties:
      AllowedPrincipals: !Ref AWSPrincipals
      ServiceId: !Ref VpcEndpointService

  # Add a CloudWatch Alarm for Network Load Balancer
  NetworkLoadBalancerAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "Alarm when Network Load Balancer unhealthy host count is greater than or equal to 1"
      MetricName: UnHealthyHostCount
      Namespace: AWS/NetworkELB
      Statistic: Maximum
      Period: "60"
      EvaluationPeriods: "2"
      Threshold: "1"
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: LoadBalancer
          Value: !Ref NetworkLoadBalancer
      AlarmActions:
        - "arn:aws:sns:REGION:ACCOUNT_ID:TOPIC_NAME" # Replace with actual SNS topic ARN