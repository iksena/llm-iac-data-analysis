AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Shared Infrastructure — ECS Cluster Stack
  Shared ECS Cluster, Task Execution Role, and Service Discovery namespace.
  All services (ax-ripple-network, atlantis, etc.) deploy into this cluster.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  VpcId:
    Type: String
    Description: VPC ID from network stack

Resources:
  # ===========================================================================
  # ECS Cluster — shared across all services
  # ===========================================================================
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "ax-ripple-${Environment}"
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      CapacityProviders:
        - FARGATE
        - FARGATE_SPOT
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1
          Base: 2
        - CapacityProvider: FARGATE_SPOT
          Weight: 3
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # ===========================================================================
  # Shared ECS Task Execution Role — used by all services for image pull + logs
  # ===========================================================================
  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "ax-ripple-${Environment}-ecs-execution"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ECRAndSecretsAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: "*"
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - ssm:GetParameters
                Resource: "*"

  # ===========================================================================
  # Service Discovery — shared namespace, each service registers into it
  # ===========================================================================
  ServiceDiscoveryNamespace:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Properties:
      Name: !Sub "${Environment}.local"
      Vpc: !Ref VpcId

Outputs:
  ClusterArn:
    Description: ECS Cluster ARN
    Value: !GetAtt ECSCluster.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ClusterArn"

  ClusterName:
    Description: ECS Cluster Name
    Value: !Ref ECSCluster
    Export:
      Name: !Sub "${AWS::StackName}-ClusterName"

  ECSTaskExecutionRoleArn:
    Description: Shared ECS Task Execution Role ARN
    Value: !GetAtt ECSTaskExecutionRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ECSTaskExecutionRoleArn"

  ServiceDiscoveryNamespaceId:
    Description: Service Discovery namespace ID
    Value: !Ref ServiceDiscoveryNamespace
    Export:
      Name: !Sub "${AWS::StackName}-ServiceDiscoveryNamespaceId"

  ServiceDiscoveryNamespaceName:
    Description: Service Discovery namespace DNS name
    Value: !Sub "${Environment}.local"
    Export:
      Name: !Sub "${AWS::StackName}-ServiceDiscoveryNamespaceName"