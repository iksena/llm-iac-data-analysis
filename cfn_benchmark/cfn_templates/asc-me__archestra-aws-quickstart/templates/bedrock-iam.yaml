AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Archestra Bedrock IAM — attaches Bedrock InvokeModel permissions
  to the Archestra IRSA role, enabling keyless LLM access.

Parameters:
  EnvironmentName:
    Type: String

  ArchestraServiceAccountRoleArn:
    Type: String
    Description: IRSA role ARN for the Archestra pod

  BedrockModelScope:
    Type: String
    Default: "*"
    Description: >
      ARN pattern for allowed Bedrock models.
      Use "*" for all models, or restrict to specific models/providers
      (e.g., "arn:aws:bedrock:*::foundation-model/anthropic.*")

Resources:
  BedrockAccessPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "${EnvironmentName}-bedrock-access"
      Roles:
        - !Select [1, !Split ["/", !Ref ArchestraServiceAccountRoleArn]]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: BedrockInvoke
            Effect: Allow
            Action:
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
            Resource: !Ref BedrockModelScope
          - Sid: BedrockList
            Effect: Allow
            Action:
              - bedrock:ListFoundationModels
              - bedrock:GetFoundationModel
            Resource: "*"

Outputs:
  BedrockPolicyArn:
    Value: !Ref BedrockAccessPolicy
    Description: IAM policy granting Bedrock access to Archestra pods