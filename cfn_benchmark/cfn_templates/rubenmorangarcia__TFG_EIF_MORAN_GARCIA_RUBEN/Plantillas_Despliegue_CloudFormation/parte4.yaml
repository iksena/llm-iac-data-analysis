Description: Parte 4 - Rutas del Transit Gateway para flujos inspeccionados entre VPCs

Parameters:
  TGWId:
    Type: String
    Description: ID del Transit Gateway

Resources:

  # Tabla 1 - Tabla de rutas VPC Produccion
  TGWRouteTableProduccion:
    Type: AWS::EC2::TransitGatewayRouteTable
    Properties:
      TransitGatewayId: !Ref TGWId
      Tags:
        - Key: Name
          Value: TGW-RTB-Produccion

  AssociationIPv6Only:
    Type: AWS::EC2::TransitGatewayRouteTableAssociation
    Properties:
      TransitGatewayAttachmentId: !ImportValue TGWAttachment-IPv6OnlyId
      TransitGatewayRouteTableId: !Ref TGWRouteTableProduccion

  AssociationDualStack:
    Type: AWS::EC2::TransitGatewayRouteTableAssociation
    Properties:
      TransitGatewayAttachmentId: !ImportValue TGWAttachment-DualStackId
      TransitGatewayRouteTableId: !Ref TGWRouteTableProduccion

  RouteToOnPremIPv4:
    Type: AWS::EC2::TransitGatewayRoute
    Properties:
      TransitGatewayRouteTableId: !Ref TGWRouteTableProduccion
      DestinationCidrBlock: 172.16.0.0/16
      TransitGatewayAttachmentId: !ImportValue TGWAttachment-InspeccionEsteId

  RouteToIPv6OnlyIPv4r1:
    Type: AWS::EC2::TransitGatewayRoute
    Properties:
      TransitGatewayRouteTableId: !Ref TGWRouteTableProduccion
      DestinationCidrBlock: 10.10.0.0/16
      TransitGatewayAttachmentId: !ImportValue TGWAttachment-InspeccionOesteId

  RouteToDualStackOnlyIPv4r1:
    Type: AWS::EC2::TransitGatewayRoute
    Properties:
      TransitGatewayRouteTableId: !Ref TGWRouteTableProduccion
      DestinationCidrBlock: 10.20.0.0/16
      TransitGatewayAttachmentId: !ImportValue TGWAttachment-InspeccionOesteId

  RouteToInetIPv4:
    Type: AWS::EC2::TransitGatewayRoute
    Properties:
      TransitGatewayRouteTableId: !Ref TGWRouteTableProduccion
      DestinationCidrBlock: 0.0.0.0/0
      TransitGatewayAttachmentId: !ImportValue TGWAttachment-InspeccionNorteId

  # Tabla 2 - Asociada a OnPrem
  TGWRouteTableOnPrem:
    Type: AWS::EC2::TransitGatewayRouteTable
    Properties:
      TransitGatewayId: !Ref TGWId
      Tags:
        - Key: Name
          Value: TGW-RTB-OnPremise

  AssociationOnPrem:
    Type: AWS::EC2::TransitGatewayRouteTableAssociation
    Properties:
      TransitGatewayAttachmentId: !ImportValue TGWAttachment-OnPremId
      TransitGatewayRouteTableId: !Ref TGWRouteTableOnPrem

  RouteToIPv6OnlyIPv4r2:
    Type: AWS::EC2::TransitGatewayRoute
    Properties:
      TransitGatewayRouteTableId: !Ref TGWRouteTableOnPrem
      DestinationCidrBlock: 10.10.0.0/16
      TransitGatewayAttachmentId: !ImportValue TGWAttachment-InspeccionEsteId

  RouteToDualStackOnlyIPv4r2:
    Type: AWS::EC2::TransitGatewayRoute
    Properties:
      TransitGatewayRouteTableId: !Ref TGWRouteTableOnPrem
      DestinationCidrBlock: 10.20.0.0/16
      TransitGatewayAttachmentId: !ImportValue TGWAttachment-InspeccionEsteId

  # Tabla de rutas en la VPC Inspección Norte (respuesta directa)
  TGWRouteTableInspeccionNorte:
    Type: AWS::EC2::TransitGatewayRouteTable
    Properties:
      TransitGatewayId: !Ref TGWId
      Tags:
        - Key: Name
          Value: TGW-RTB-Inspeccion-Norte

  AssociationInspeccionNorte:
    Type: AWS::EC2::TransitGatewayRouteTableAssociation
    Properties:
      TransitGatewayAttachmentId: !ImportValue TGWAttachment-InspeccionNorteId
      TransitGatewayRouteTableId: !Ref TGWRouteTableInspeccionNorte

  RouteToIPv6OnlyFromNorte:
    Type: AWS::EC2::TransitGatewayRoute
    Properties:
      TransitGatewayRouteTableId: !Ref TGWRouteTableInspeccionNorte
      DestinationCidrBlock: 10.10.0.0/16
      TransitGatewayAttachmentId: !ImportValue TGWAttachment-IPv6OnlyId

  RouteToDualStackFromNorte:
    Type: AWS::EC2::TransitGatewayRoute
    Properties:
      TransitGatewayRouteTableId: !Ref TGWRouteTableInspeccionNorte
      DestinationCidrBlock: 10.20.0.0/16
      TransitGatewayAttachmentId: !ImportValue TGWAttachment-DualStackId

  # Tabla 3 - Asociada a la VPC de inspección Este
  TGWRouteTableInspeccionEste:
    Type: AWS::EC2::TransitGatewayRouteTable
    Properties:
      TransitGatewayId: !Ref TGWId
      Tags:
        - Key: Name
          Value: TGW-RTB-Inspeccion-Este

  AssociationInspeccionEste:
    Type: AWS::EC2::TransitGatewayRouteTableAssociation
    Properties:
      TransitGatewayAttachmentId: !ImportValue TGWAttachment-InspeccionEsteId
      TransitGatewayRouteTableId: !Ref TGWRouteTableInspeccionEste

  RouteFromInspeccionToOnPrem:
    Type: AWS::EC2::TransitGatewayRoute
    Properties:
      TransitGatewayRouteTableId: !Ref TGWRouteTableInspeccionEste
      DestinationCidrBlock: 172.16.0.0/16
      TransitGatewayAttachmentId: !ImportValue TGWAttachment-OnPremId

  RouteFromInspeccionToIPv6Only:
    Type: AWS::EC2::TransitGatewayRoute
    Properties:
      TransitGatewayRouteTableId: !Ref TGWRouteTableInspeccionEste
      DestinationCidrBlock: 10.10.0.0/16
      TransitGatewayAttachmentId: !ImportValue TGWAttachment-IPv6OnlyId

  RouteFromInspeccionToDualStack:
    Type: AWS::EC2::TransitGatewayRoute
    Properties:
      TransitGatewayRouteTableId: !Ref TGWRouteTableInspeccionEste
      DestinationCidrBlock: 10.20.0.0/16
      TransitGatewayAttachmentId: !ImportValue TGWAttachment-DualStackId

  # Tabla 4 - Asociada a la VPC de inspección Oeste
  TGWRouteTableInspeccionOeste:
    Type: AWS::EC2::TransitGatewayRouteTable
    Properties:
      TransitGatewayId: !Ref TGWId
      Tags:
        - Key: Name
          Value: TGW-RTB-Inspeccion-Oeste

  AssociationInspeccionOeste:
    Type: AWS::EC2::TransitGatewayRouteTableAssociation
    Properties:
      TransitGatewayAttachmentId: !ImportValue TGWAttachment-InspeccionOesteId
      TransitGatewayRouteTableId: !Ref TGWRouteTableInspeccionOeste

  RouteFromInspeccionOesteToIPv6Only:
    Type: AWS::EC2::TransitGatewayRoute
    Properties:
      TransitGatewayRouteTableId: !Ref TGWRouteTableInspeccionOeste
      DestinationCidrBlock: 10.10.0.0/16
      TransitGatewayAttachmentId: !ImportValue TGWAttachment-IPv6OnlyId

  RouteFromInspeccionOesteToDualStack:
    Type: AWS::EC2::TransitGatewayRoute
    Properties:
      TransitGatewayRouteTableId: !Ref TGWRouteTableInspeccionOeste
      DestinationCidrBlock: 10.20.0.0/16
      TransitGatewayAttachmentId: !ImportValue TGWAttachment-DualStackId