# DVA-C02 S6: CodeDeploy application specification for Lambda deployments
# Reference: DVA S6 — CodeDeploy Lambda deployment strategies
#
# Strategy used: Canary10Percent5Minutes
#   - Shifts 10% traffic to new version immediately
#   - Waits 5 minutes, runs validation hook
#   - Shifts remaining 90% if hooks succeed (auto-rollback on failure)
#
# Other available strategies:
#   AllAtOnce           — immediate 100% shift (highest risk)
#   Linear10PercentEvery1Minute — gradual shift over 10 minutes
#   Linear10PercentEvery10Minutes
#   Canary10Percent5Minutes     ← this file
#   Canary10Percent10Minutes
#   Canary10Percent15Minutes
#   Canary10Percent30Minutes
#
# DVA S6 Exam Trap: appspec.yaml is CodeDeploy config, NOT CodeBuild config
# DVA S6 Exam Trap: Hooks run Lambda functions (not shell scripts) for Lambda deployments

version: 0.0

Resources:
  # DVA S6: Each function that CodeDeploy manages needs a separate entry
  # The Alias "live" is what traffic is shifted TO (new version)
  # CurrentVersion → TargetVersion: CodeDeploy manages this shift
  - ProductsFunction:
      Type: AWS::Lambda::Function
      Properties:
        # These values are resolved by CodeDeploy from the CloudFormation stack
        Name: !Sub lambdastore-${Stage}-products
        Alias: live
        CurrentVersion: !Ref CurrentVersion    # resolved at deploy time
        TargetVersion: !Ref TargetVersion      # resolved at deploy time

# DVA S6: Lifecycle hooks — Lambda functions that run before/after traffic shift
# Pre-traffic hook: validates new version before any traffic reaches it
# Post-traffic hook: validates after all traffic shifted (smoke test)
Hooks:
  # DVA S6: BeforeAllowTraffic hook runs against new version (0% traffic)
  # Use case: validate DB schema, run smoke tests, check config
  - BeforeAllowTraffic: !Sub lambdastore-${Stage}-pre-traffic-check

  # DVA S6: AfterAllowTraffic hook runs after 100% shift completes
  # Use case: send deployment notification, update metrics baseline
  - AfterAllowTraffic: !Sub lambdastore-${Stage}-post-traffic-check