AWSTemplateFormatVersion: 2010-09-09
Conditions:
  HasEKSClusterName: !Not [!Equals [!Ref EKSClusterName, ""]]
  HasVpcId: !Not [!Equals [!Ref VpcId, ""]]
  HasLifecycleScriptsBucketName: !Not [!Equals [!Ref LifecycleScriptsBucketName, ""]]
  HasSecurityGroupIds: !Not [!Equals [!Join ["", !Ref SecurityGroupIds], ""]]
  HasPrivateSubnetIds: !Not [!Equals [!Join ["", !Ref PrivateSubnetIds], ""]]
  CreateRIGResources: !Equals [!Ref CreateRIGResources, "true"]
  EnableGatedAccess: !Equals [!Ref EnableGatedAccess, "true"]
  HasRIGInputBucket: !Not [!Equals [!Ref RIGInputBucketName, ""]]
  HasRIGOutputBucket: !Not [!Equals [!Ref RIGOutputBucketName, ""]]
  CreateRIGPolicy: !And [!Condition CreateRIGResources, !Condition HasRIGInputBucket]
Parameters:
  ResourceNamePrefix:
    Type: String
    Default: ""
    Description: Prefix for resource names (e.g., my-hyperpod)
  EKSClusterName:
    Type: String
    Default: ""
    Description: Name of the EKS cluster (required for eks-auth policy)
  VpcId:
    Type: String
    Default: ""
    Description: VPC ID for the SageMaker HyperPod cluster (required for ENI policies)
  SecurityGroupIds:
    Type: CommaDelimitedList
    Default: ""
    Description: List of security group IDs (e.g., sg-123,sg-456)
  PrivateSubnetIds:
    Type: CommaDelimitedList
    Default: ""
    Description: List of private subnet IDs (e.g., subnet-789,subnet-012)
  LifecycleScriptsBucketName:
    Type: String
    Default: ""
    Description: S3 bucket name for lifecycle scripts
  RIGInputBucketName:
    Type: String
    Default: ""
    Description: S3 bucket name for RIG input (optional)
  RIGOutputBucketName:
    Type: String
    Default: ""
    Description: S3 bucket name for RIG output (optional)
  CreateRIGResources:
    Type: String
    AllowedValues:
      - true
      - false
    Default: false
    Description: Flag to create RIG resources
  EnableGatedAccess:
    Type: String
    AllowedValues:
      - true
      - false
    Default: false
    Description: Flag to enable gated access
Resources:
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !If
        - !Not [!Equals [!Ref ResourceNamePrefix, ""]]
        - !Join ["", [!Ref ResourceNamePrefix, "ExecRole"]]
        - "ExecRole"
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: sagemaker.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSageMakerClusterInstanceRolePolicy
      Policies:
        - PolicyName: EKSCNIPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - ec2:AttachNetworkInterface
                  - ec2:DescribeInstances
                  - ec2:DescribeTags
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeInstanceTypes
                  - ec2:DescribeSubnets
                  - ec2:CreateTags
                Resource: "*"
                Condition:
                  StringEquals:
                    ec2:ResourceTag/aws:ec2:source: "network-interface"
        - PolicyName: BroaderENIManagementPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - !If
                - HasVpcId
                - Effect: Allow
                  Action:
                    - ec2:AssignPrivateIpAddresses
                    - ec2:CreateNetworkInterface
                    - ec2:DeleteNetworkInterface
                    - ec2:ModifyNetworkInterfaceAttribute
                    - ec2:DetachNetworkInterface
                  Resource: "*"
                  Condition:
                    StringEquals:
                      ec2:Vpc: !Ref VpcId
                - !Ref "AWS::NoValue"
              - Effect: Allow
                Action:
                  - ec2:DescribeVpcs
                  - ec2:DescribeDhcpOptions
                  - ec2:DescribeSecurityGroups
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - cloudwatch:DescribeAlarms
                Resource: "*"
              - !If
                - HasEKSClusterName
                - Effect: Allow
                  Action:
                    - eks-auth:AssumeRoleForPodIdentity
                  Resource: !Join
                    - ""
                    - - "arn:aws:eks:"
                      - !Ref AWS::Region
                      - ":"
                      - !Ref AWS::AccountId
                      - ":cluster/"
                      - !Ref EKSClusterName
                - !Ref "AWS::NoValue"
              - !If
                - HasLifecycleScriptsBucketName
                - Effect: Allow
                  Action:
                    - s3:ListBucket
                    - s3:GetObject
                  Resource:
                    - !Join
                      - ""
                      - - "arn:aws:s3:::"
                        - !Ref LifecycleScriptsBucketName
                    - !Join
                      - ""
                      - - "arn:aws:s3:::"
                        - !Ref LifecycleScriptsBucketName
                        - "/*"
                - !Ref "AWS::NoValue"
        - !If
          - CreateRIGPolicy
          - PolicyName: RIGPolicy
            PolicyDocument:
              Version: 2012-10-17
              Statement:
                - Effect: Allow
                  Action:
                    - s3:ListBucket
                    - s3:GetObject
                  Resource:
                    - !Join
                      - ""
                      - - "arn:aws:s3:::"
                        - !Ref RIGInputBucketName
                    - !Join
                      - ""
                      - - "arn:aws:s3:::"
                        - !Ref RIGInputBucketName
                        - "/*"
                - Effect: Allow
                  Action:
                    - lambda:InvokeFunction
                  Resource: "*"
                  Condition:
                    StringLike:
                      lambda:FunctionName:
                        - "*SageMaker*"
                        - "*sagemaker*"
                - !If
                  - EnableGatedAccess
                  - Effect: Allow
                    Action:
                      - s3:GetObject
                    Resource:
                      - !Join
                        - ""
                        - - "arn:aws:s3:::"
                          - !Ref RIGInputBucketName
                          - "/*"
                      - "arn:aws:s3:*:*:accesspoint/*"
                    Condition:
                      StringEquals:
                        s3:DataAccessPointBucket: !Ref RIGInputBucketName
                  - !Ref "AWS::NoValue"
                - !If
                  - EnableGatedAccess
                  - Effect: Allow
                    Action:
                      - sqs:SendMessage
                      - sqs:ReceiveMessage
                      - sqs:DeleteMessage
                      - sqs:GetQueueAttributes
                      - sqs:GetQueueUrl
                    Resource: "arn:aws:sqs:*:*:*"
                    Condition:
                      StringLike:
                        sqs:QueueName:
                          - "*SageMaker*"
                          - "*sagemaker*"
                  - !Ref "AWS::NoValue"
                - !If
                  - HasRIGOutputBucket
                  - Effect: Allow
                    Action:
                      - s3:GetObject
                      - s3:PutObject
                      - s3:DeleteObject
                    Resource:
                      - !Join
                        - ""
                        - - "arn:aws:s3:::"
                          - !Ref RIGOutputBucketName
                      - !Join
                        - ""
                        - - "arn:aws:s3:::"
                          - !Ref RIGOutputBucketName
                          - "/*"
                  - !Ref "AWS::NoValue"
          - !Ref "AWS::NoValue"
      Tags:
        - Key: SageMakerHyperPodPrerequisites
          Value: !If
            - !Not [!Equals [!Ref ResourceNamePrefix, ""]]
            - !Join ["", [!Ref ResourceNamePrefix, "ExecRole"]]
            - "ExecRole"
  SubnetPolicies:
    Type: AWS::IAM::Policy
    Condition: HasPrivateSubnetIds
    Properties:
      PolicyName: !If
        - !Not [!Equals [!Ref ResourceNamePrefix, ""]]
        - !Join ["", [!Ref ResourceNamePrefix, "-SubnetPolicy"]]
        - "SubnetPolicy"
      Roles:
        - !Ref ExecutionRole
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - ec2:AssignPrivateIpAddresses
              - ec2:CreateNetworkInterface
              - ec2:DeleteNetworkInterface
              - ec2:ModifyNetworkInterfaceAttribute
              - ec2:DetachNetworkInterface
            Resource: "*"
            Condition:
              ForAnyValue:StringEquals:
                ec2:Subnet: !Ref PrivateSubnetIds
              StringEquals:
                ec2:Vpc: !Ref VpcId
  SecurityGroupPolicies:
    Type: AWS::IAM::Policy
    Condition: HasSecurityGroupIds
    Properties:
      PolicyName: !If
        - !Not [!Equals [!Ref ResourceNamePrefix, ""]]
        - !Join ["", [!Ref ResourceNamePrefix, "-SecurityGroupPolicy"]]
        - "SecurityGroupPolicy"
      Roles:
        - !Ref ExecutionRole
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - ec2:AssignPrivateIpAddresses
              - ec2:CreateNetworkInterface
              - ec2:DeleteNetworkInterface
              - ec2:ModifyNetworkInterfaceAttribute
              - ec2:DetachNetworkInterface
            Resource: "*"
            Condition:
              ForAnyValue:StringEquals:
                ec2:SecurityGroup: !Ref SecurityGroupIds
              StringEquals:
                ec2:Vpc: !Ref VpcId
Outputs:
  RoleName:
    Description: Name of the IAM execution role
    Value: !Ref ExecutionRole
  RoleArn:
    Description: ARN of the IAM execution role
    Value: !GetAtt ExecutionRole.Arn