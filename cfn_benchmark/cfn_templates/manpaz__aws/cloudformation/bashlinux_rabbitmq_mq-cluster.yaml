---
# Bashlinux::RabbitMQ::MQ Cluster
#
# Cloudformation template to deploy an MQ RabbitMQ instance
#
#   Manuel F Martinez
#   Bashlinux
#   Los Angeles, CA
#
AWSTemplateFormatVersion: "2010-09-09"
Description: MQ RabbitMQ Cluster template

###############################################################################
Parameters:

  Environment:
    Description: RabbitMQ worker environment
    Type: String
    MinLength: "1"
    MaxLength: "20"
    Default: staging
    AllowedValues: ["prod","staging"]
    ConstraintDescription: >
      Environment name can only contain "prod" or "staging"

  MQMultiAZ:
    Description: The deployment mode of the broker.
    Type: String
    MinLength: "15"
    MaxLength: "24"
    Default: "SINGLE_INSTANCE"
    AllowedValues:
    - "SINGLE_INSTANCE"
    - "ACTIVE_STANDBY_MULTI_AZ"
    - "CLUSTER_MULTI_AZ"

  MQInstanceSize:
    Description: MQ instance size for RabbitMQ
    Type: String
    MinLength: "1"
    MaxLength: "32"
    Default: mq.t3.micro
    AllowedValues:
    - mq.t3.micro
    - mq.m5.large
    - mq.m5.xlarge
    - mq.m5.2xlarge
    - mq.m5.4xlarge
    ConstraintDescription: >
      MQ instance size must be micro, small, medium, or large of the "mq.t3.micro"
      type or large, xlarge, 2xlarge, or 4xlarge of the "mq.m5" type.

  MQRabbitMQEngineVersion:
    Description: MQ Engine version for RabbitMQ
    Type: String
    MinLength: "1"
    MaxLength: "32"
    Default: "3.13"
    AllowedValues:
    - "3.13"
    - "3.12"
    ConstraintDescription: MQ RabbitMQ must be a valid version.

  MQStorageSize:
    Description: MQ instance storage size in GiB
    Type: Number
    MinValue: "5"
    MaxValue: "1024"
    Default: "10"
    ConstraintDescription: RabbitMQ storage size in GiB must be a number.

  Organization:
    Description: Organization or Customer name
    Type: String
    MinLength: "1"
    MaxLength: "32"
    Default: bashlinux
    AllowedPattern: "[a-zA-Z0-9\\-]*"
    ConstraintDescription: >
      Name of the organization must contains only letters, numbers and hyphens

###############################################################################
Resources:

  MqRabbitMqInstance:
    Type: AWS::AmazonMQ::Broker
    Properties:
      AutoMinorVersionUpgrade: "true"
      BrokerName: !Sub "broker01-${Organization}-${Environment}"
      DeploymentMode: !Ref MQMultiAZ
      HostInstanceType: !Ref MQInstanceSize
      SubnetIds:
        - !ImportValue
            "Fn::Sub": "${Organization}-${Environment}-VpcOrgDataSubnetId"
      SecurityGroups:
        - !ImportValue
            "Fn::Sub": "${Organization}-${Environment}-MqRabbitmqSecurityGroup"
      EncryptionOptions:
        KmsKeyId: !Sub "alias/${Organization}/mq/${Environment}"
        UseAwsOwnedKey: "false"
      EngineType: RabbitMQ
      EngineVersion: !Ref MQRabbitMQEngineVersion
      PubliclyAccessible: "false"
      Users:
        - Username: !Ref Organization
          Password: !Sub "{{resolve:secretsmanager:secret/${Organization}/${Environment}/mq:SecretString:password::}}"
      Tags:
      - Key: bashlinux:network-visibility
        Value: private
      - Key: bashlinux:organization-name
        Value: !Ref Organization
      - Key: bashlinux:environment-name
        Value: !Ref Environment
      - Key: bashlinux:application-role
        Value: queue
      - Key: Name
        Value: !Sub "broker01-${Organization}-${Environment}"

###############################################################################
Outputs:

  MqRabbitMqInstanceId:
    Description: "MQ: MQ RabbitMQ instance ID"
    Value: !Ref MqRabbitMqInstance

  MqRabbitMqEndpoint:
    Description: "MQ: MQ RabbitMQ endpoint of each broker instance"
    Value: !Join [ ",", !GetAtt MqRabbitMqInstance.AmqpEndpoints ]