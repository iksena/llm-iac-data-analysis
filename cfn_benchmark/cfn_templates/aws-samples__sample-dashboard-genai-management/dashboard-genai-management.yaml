AWSTemplateFormatVersion: '2010-09-09'
Description: 'AI-powered Dashboard Management System'

Parameters:
  S3BucketFileName:
    Type: String
    Default: metrics.csv
    Description: Name of the metrics file stored in the S3 bucket

  SubnetIds:
    Type: CommaDelimitedList
    Description: VPC subnet IDs for all Lambda functions  e.g subnet-id,subnet-id

  SecurityGroupIds:
    Type: CommaDelimitedList
    Description: Security group IDs for all Lambda functions

  # Api Gateway Parameters
  StageName:
    Type: String
    Default: prod
    Description: API Gateway deployment stage name

  # Create Dashboard Parameters
  CreateImageUri:
    Type: String
    Description: Complete Docker image URI for the create dashboard Lambda function (e.g., 123456789012.dkr.ecr.us-east-1.amazonaws.com/my-repo:tag)

  CreatePromptDescription:
    Type: String
    Default: Prompt to be used to create dashboards on Grafana
    Description: Description for the create dashboard Bedrock prompt

  # Update Dashboard Parameters
  UpdateImageUri:
    Type: String
    Description: Complete Docker image URI for the update dashboard Lambda function (e.g., 123456789012.dkr.ecr.us-east-1.amazonaws.com/my-repo:tag)

  UpdatePromptDescription:
    Type: String
    Default: Prompt to update dashboards used by lambda function.
    Description: Description for the update dashboard Bedrock prompt

  # Delete Dashboard Parameters
  DeleteImageUri:
    Type: String
    Description: Complete Docker image URI for the delete dashboard Lambda function (e.g., 123456789012.dkr.ecr.us-east-1.amazonaws.com/my-repo:tag)

  DeletePromptDescription:
    Type: String
    Default: Prompt to delete dashboard to be used by lambda function
    Description: Description for the delete dashboard Bedrock prompt

  ContainerInsightKBId:
    Type: String
    Description: Existing Knowledge Base ID for Container Insight metrics documentation

  InferenceProfileId:
    Type: String
    Default: us.anthropic.claude-sonnet-4-5-20250929-v1:0
    Description: Bedrock inference profile ID

  GrafanaEndpoint:
    Type: String
    Description: Grafana workspace endpoint URL (e.g https://grafana.endpoint.com)

  LambdaTimeout:
    Type: Number
    Default: 600
    Description: Timeout in seconds for all Lambda functions
    MinValue: 1
    MaxValue: 900

  LambdaReservedConcurrency:
    Type: Number
    Default: 10
    Description: Reserved concurrent executions for each Lambda function
    MinValue: 1
  GrafanaApiToken:
    Type: String
    NoEcho: true
    Description: Grafana API token for dashboard management
    MinLength: 1
    ConstraintDescription: Grafana API token cannot be empty

  SlackSigningSecret:
    Type: String
    NoEcho: true
    Description: Slack Signing Secret for request verification (found in Slack App > Basic Information)
    MinLength: 1
    ConstraintDescription: Slack Signing Secret cannot be empty

Resources:
  # API Gateway
  DashboardManagementApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub '${AWS::StackName}-api'
      Description: API Gateway for Dashboard Management System
      EndpointConfiguration:
        Types:
          - REGIONAL
      ApiKeySourceType: HEADER

  # Slack resource
  SlackResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref DashboardManagementApi
      ParentId: !GetAtt DashboardManagementApi.RootResourceId
      PathPart: slack

  # Create Dashboard resource
  CreateDashboardResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref DashboardManagementApi
      ParentId: !Ref SlackResource
      PathPart: create-dashboard

  # Update Dashboard resource
  UpdateDashboardResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref DashboardManagementApi
      ParentId: !Ref SlackResource
      PathPart: update-dashboard

  # Delete Dashboard resource
  DeleteDashboardResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref DashboardManagementApi
      ParentId: !Ref SlackResource
      PathPart: delete-dashboard

  # Create Dashboard POST method
  CreateDashboardMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref DashboardManagementApi
      ResourceId: !Ref CreateDashboardResource
      HttpMethod: POST
      AuthorizationType: NONE
      ApiKeyRequired: false
      MethodResponses:
        - StatusCode: '200'
          ResponseModels:
            application/json: Empty
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaCreateDashboardFunction.Arn}/invocations'
        PassthroughBehavior: WHEN_NO_MATCH
        ContentHandling: CONVERT_TO_TEXT
        TimeoutInMillis: 1000
        IntegrationResponses:
          - StatusCode: '200'

  # Update Dashboard POST method
  UpdateDashboardMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref DashboardManagementApi
      ResourceId: !Ref UpdateDashboardResource
      HttpMethod: POST
      AuthorizationType: NONE
      ApiKeyRequired: false
      MethodResponses:
        - StatusCode: '200'
          ResponseModels:
            application/json: Empty
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaUpdateDashboardFunction.Arn}/invocations'
        PassthroughBehavior: WHEN_NO_MATCH
        ContentHandling: CONVERT_TO_TEXT
        TimeoutInMillis: 1000
        IntegrationResponses:
          - StatusCode: '200'

  # Delete Dashboard POST method
  DeleteDashboardMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref DashboardManagementApi
      ResourceId: !Ref DeleteDashboardResource
      HttpMethod: POST
      AuthorizationType: NONE
      ApiKeyRequired: false
      MethodResponses:
        - StatusCode: '200'
          ResponseModels:
            application/json: Empty
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaDeleteDashboardFunction.Arn}/invocations'
        PassthroughBehavior: WHEN_NO_MATCH
        ContentHandling: CONVERT_TO_TEXT
        TimeoutInMillis: 1000
        IntegrationResponses:
          - StatusCode: '200'

  # Lambda permissions for API Gateway
  CreateDashboardLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LambdaCreateDashboardFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${DashboardManagementApi}/*/*'

  UpdateDashboardLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LambdaUpdateDashboardFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${DashboardManagementApi}/*/*'

  DeleteDashboardLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LambdaDeleteDashboardFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${DashboardManagementApi}/*/*'

  # Gateway Response for Integration Timeout
  IntegrationTimeoutGatewayResponse:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref DashboardManagementApi
      ResponseType: INTEGRATION_TIMEOUT
      StatusCode: '200'
      ResponseTemplates:
        application/json: |
          {"response_type": "in_channel","text": "ACK: request received, processing...:hourglass_flowing_sand:"}

  # API Gateway Deployment
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - CreateDashboardMethod
      - UpdateDashboardMethod
      - DeleteDashboardMethod
      - IntegrationTimeoutGatewayResponse
    Properties:
      RestApiId: !Ref DashboardManagementApi
      StageName: !Ref StageName

  # IAM Role for API Gateway to invoke Lambda
  ApiGatewayLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref ApiGatewayLambdaPolicy

  ApiGatewayLambdaPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - lambda:InvokeFunction
            Resource:
              - !GetAtt LambdaCreateDashboardFunction.Arn
              - !GetAtt LambdaUpdateDashboardFunction.Arn
              - !GetAtt LambdaDeleteDashboardFunction.Arn

  # S3 Bucket for metrics data
  MetricsDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-metrics-data'
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # KMS Key for Lambda environment variables encryption
  LambdaEnvEncryptionKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS key for encrypting Lambda environment variables
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowRootAccountAccess
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'

  LambdaEnvEncryptionKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/${AWS::StackName}-lambda-env-key'
      TargetKeyId: !Ref LambdaEnvEncryptionKey

  # Secrets Manager KMS Key
  SecretsManagerEncryptionKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS key for encrypting Secrets Manager secrets
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowRootAccountAccess
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'

  SecretsManagerEncryptionKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/${AWS::StackName}-secrets-manager-key'
      TargetKeyId: !Ref SecretsManagerEncryptionKey

  # Secrets Manager for Grafana API Token
  GrafanaApiTokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}-grafana-token'
      Description: Grafana API token for dashboard management
      KmsKeyId: !GetAtt SecretsManagerEncryptionKey.Arn
      SecretString: !Sub |
        {
          "GRAFANA_TOKEN": "${GrafanaApiToken}"
        }
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-grafana-api-token'
        - Key: Purpose
          Value: Grafana Dashboard Management

  SlackSigningSecretSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}-slack-signing-secret'
      Description: Slack Signing Secret for verifying incoming requests
      KmsKeyId: !GetAtt SecretsManagerEncryptionKey.Arn
      SecretString: !Sub |
        {
          "SLACK_SIGNING_SECRET": "${SlackSigningSecret}"
        }
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-slack-signing-secret'
        - Key: Purpose
          Value: Slack Request Verification

  CreateDashboardPrompt:
    Type: AWS::Bedrock::Prompt
    Properties:
      Name: !Sub '${AWS::StackName}-create-dashboard-prompt'
      Description: !Ref CreatePromptDescription
      DefaultVariant: variantOne
      Variants:
        - Name: variantOne
          TemplateType: TEXT
          TemplateConfiguration:
            Text:
              Text: |
                You are a specialist in creating Grafana dashboards. Your task is to analyze the provided context and create comprehensive dashboards automatically using available metrics.

                Create an HTTP POST request in the Grafana API format to create a dashboard with the metric expression, and visualization that should be informative and allow an overview of the resource, use this {{base_json}} as example to create the dashboard, LET THE QueryMode=Metrics.

                Each visualization must have a type of graph that matches the metric, which can be a timeseries chart, stat, gauge, bar chart, bar gauge, pie chart
                Enter the Oregon region, type datasource according to the datasource in {{context}}, if cloudwatch is the datasource, replace for default, enter timezone with browser value and choose the title according to what is requested.

                CRITICAL - MatchExact Configuration:
                - If the metric comes from {{context}} (CSV file with AWS metrics), set "matchExact" to true
                - If the metric comes from {{contextEKS}} (Knowledge Base), set "matchExact" to false
                - This is essential for the dashboard to display data correctly

                If the metrics are from AWS services, use the metrics from AWS services itself cloudwatch and if you create a dashboard based on metrics, "QueryMode" the same as Metrics, always use Metric Query, "MetricQueryType" with value 0, "MetricEditorMode" with value 0, and search for which namespace and datasource are related to each metric in the {{context}}.
                If the request in question is for Kubernetes cluster or EKS, create a dashboard with EKS metrics to monitor cluster performance. The dashboard should be informative and allow for an overview of the cluster and specific details of pods and containers.
                If the dashboard is for Kubernetes or EKS clusters, it can contain visualization of infrastructure such as CPU, requests, memory, logs, requests and all metrics available on {{contextEKS}}
                If a dashboard is requested for a specific lambda/application, also use the {{context}} information to create the visualizations as latency if there is no {{context}}
                Always use {{context}} information to create a dashboard with the name of the resource.
                Always set a title if the user don't set on question.
                Question:
                {{user_message}}
              InputVariables:
                - Name: base_json
                - Name: context
                - Name: contextEKS
                - Name: user_message
          ModelId: us.anthropic.claude-sonnet-4-5-20250929-v1:0

  UpdateDashboardPrompt:
    Type: AWS::Bedrock::Prompt
    Properties:
      Name: !Sub '${AWS::StackName}-update-dashboard-prompt'
      Description: !Ref UpdatePromptDescription
      DefaultVariant: variantOne
      Variants:
        - Name: variantOne
          TemplateType: TEXT
          TemplateConfiguration:
            Text:
              Text: |
                You are a specialist in creating Grafana dashboards. Your task is to analyze the provided context and update comprehensive dashboards automatically using available metrics.

                Create an HTTP POST request in the Grafana API format to create a dashboard configuration based on the {{user_message}} question, use the {{context}} values, create inside the dashboard specified by the user and USE the Oregon region (us-west-2)
                Bring me just the JSON of the request.
                If it is related to the EKS cluster you can use the ContainerInsights namespace based on the context {{contextEKS}}
                If the metrics are from AWS services, use the metrics from AWS services itself cloudwatch and if you create a dashboard based on metrics, "QueryMode" the same as Metrics, always use Metric Query, "MetricQueryType" with value 0, "MetricEditorMode" with value 0, include the property "MatchExact" with value false when necessary, and search for which namespace and datasource are related to each metric in the {{context}}.
                If the user does not specify a data source, use the default CloudWatch datasource (set datasource field to "default").

                CRITICAL METRIC RULES:
                1. ONLY use metric names that EXACTLY exist in {{context}} or {{contextEKS}} - copy the exact name character-by-character
                2. NEVER invent, modify, combine, or create new metric names (e.g., don't create "number_of_running_nodes" if it doesn't exist)
                3. Search {{context}} and {{contextEKS}} for metrics related to user's request, then use the EXACT name found
                4. For Kubernetes/EKS metrics, always check the ContainerInsights namespace in {{contextEKS}} for available metrics
                5. If no exact match exists, use the closest available metric from the context or indicate the metric is unavailable

                Question: {{user_message}}
                Answer:
              InputVariables:
                - Name: user_message
                - Name: context
                - Name: contextEKS
          ModelId: us.anthropic.claude-sonnet-4-5-20250929-v1:0

  DeleteDashboardPrompt:
    Type: AWS::Bedrock::Prompt
    Properties:
      Name: !Sub '${AWS::StackName}-delete-dashboard-prompt'
      Description: !Ref DeletePromptDescription
      DefaultVariant: variantOne
      Variants:
        - Name: variantOne
          TemplateType: TEXT
          TemplateConfiguration:
            Text:
              Text: |
                You are a specialist in creating Grafana dashboards. Your task is to analyze the provided context and delete panels or dashboards automatically according with user message.

                Review the following message and determine:
                1. What action should be performed (delete dashboard or delete view)
                2. The name of the item to be deleted
                Message: "{{user_message}}"
                You MUST answer EXACTLY in this JSON format:
                To delete dashboards:
                {
                "action": "delete_dashboards",
                "items": [
                {"name": "dashboard name 1"},
                {"name": "dashboard name 2"}
                ]}
                To delete panels:
                {
                "action": "delete_panels",
                "items": [
                {
                "name": "dashboard name 1", "dashboard_name": "dashboard name 1", "dashboard_name": "from dashboard"},
                {"name": "panel name 2", "dashboard_name": "dashboard name"}
                ]
                }
                Reply with JSON only, without further explanation.
              InputVariables:
                - Name: user_message
          ModelId: us.anthropic.claude-sonnet-4-5-20250929-v1:0

  LambdaCreateDashboardRole:
    DependsOn: CreateDashboardPrompt
    Type: AWS::IAM::Role
    Properties:
      Path: /service-role/
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - !Ref LambdaCreateDashboardPolicy

  LambdaCreateDashboardPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: BedrockInvokeModel
            Effect: Allow
            Action:
              - bedrock:InvokeModel
            Resource:
              - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-sonnet-4-5-20250929-v1:0'
              - !Sub 'arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-sonnet-4-5-20250929-v1:0'
              - !Sub 'arn:aws:bedrock:us-east-2::foundation-model/anthropic.claude-sonnet-4-5-20250929-v1:0'
              - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-sonnet-4-5-20250929-v1:0'
          - Sid: BedrockPromptManagement
            Effect: Allow
            Action:
              - bedrock:GetPrompt
              - bedrock:ListPrompts
            Resource:
              - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:prompt/*'
          - Sid: BedrockKnowledgeBase
            Effect: Allow
            Action:
              - bedrock:Retrieve
            Resource:
              - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/${ContainerInsightKBId}'
          - Sid: S3DataAccess
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
              - s3:ListBucket
            Resource:
              - !Sub '${MetricsDataBucket.Arn}/*'
              - !GetAtt MetricsDataBucket.Arn
          - Sid: GrafanaSecretAccess
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:DescribeSecret
            Resource:
              - !Ref GrafanaApiTokenSecret
              - !Ref SlackSigningSecretSecret
          - Sid: KMSDecryptAccess
            Effect: Allow
            Action:
              - kms:Decrypt
              - kms:DescribeKey
            Resource:
              - !GetAtt LambdaEnvEncryptionKey.Arn
              - !GetAtt SecretsManagerEncryptionKey.Arn

  LambdaUpdateDashboardRole:
    DependsOn: UpdateDashboardPrompt
    Type: AWS::IAM::Role
    Properties:
      Path: /service-role/
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - !Ref LambdaUpdateDashboardPolicy

  LambdaUpdateDashboardPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: BedrockInvokeModel
            Effect: Allow
            Action:
              - bedrock:InvokeModel
            Resource:
              - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-sonnet-4-5-20250929-v1:0'
              - !Sub 'arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-sonnet-4-5-20250929-v1:0'
              - !Sub 'arn:aws:bedrock:us-east-2::foundation-model/anthropic.claude-sonnet-4-5-20250929-v1:0'
              - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-sonnet-4-5-20250929-v1:0'
          - Sid: BedrockPromptManagement
            Effect: Allow
            Action:
              - bedrock:GetPrompt
              - bedrock:ListPrompts
            Resource:
              - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:prompt/*'
          - Sid: BedrockKnowledgeBase
            Effect: Allow
            Action:
              - bedrock:Retrieve
            Resource:
              - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/${ContainerInsightKBId}'
          - Sid: S3DataAccess
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
              - s3:ListBucket
            Resource:
              - !Sub '${MetricsDataBucket.Arn}/*'
              - !GetAtt MetricsDataBucket.Arn
          - Sid: GrafanaSecretAccess
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:DescribeSecret
            Resource:
              - !Ref GrafanaApiTokenSecret
              - !Ref SlackSigningSecretSecret
          - Sid: KMSDecryptAccess
            Effect: Allow
            Action:
              - kms:Decrypt
              - kms:DescribeKey
            Resource:
              - !GetAtt LambdaEnvEncryptionKey.Arn
              - !GetAtt SecretsManagerEncryptionKey.Arn

  LambdaDeleteDashboardRole:
    DependsOn: DeleteDashboardPrompt
    Type: AWS::IAM::Role
    Properties:
      Path: /service-role/
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - !Ref LambdaDeleteDashboardPolicy

  LambdaDeleteDashboardPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: BedrockInvokeModel
            Effect: Allow
            Action:
              - bedrock:InvokeModel
            Resource:
              - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.anthropic.claude-sonnet-4-5-20250929-v1:0'
              - !Sub 'arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-sonnet-4-5-20250929-v1:0'
              - !Sub 'arn:aws:bedrock:us-east-2::foundation-model/anthropic.claude-sonnet-4-5-20250929-v1:0'
              - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-sonnet-4-5-20250929-v1:0'
          - Sid: BedrockPromptManagement
            Effect: Allow
            Action:
              - bedrock:GetPrompt
              - bedrock:ListPrompts
            Resource:
              - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:prompt/*'
          - Sid: GrafanaSecretAccess
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:DescribeSecret
            Resource:
              - !Ref GrafanaApiTokenSecret
              - !Ref SlackSigningSecretSecret
          - Sid: KMSDecryptAccess
            Effect: Allow
            Action:
              - kms:Decrypt
              - kms:DescribeKey
            Resource:
              - !GetAtt LambdaEnvEncryptionKey.Arn
              - !GetAtt SecretsManagerEncryptionKey.Arn

  LambdaUpdateDashboardFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - LambdaUpdateDashboardRole
      - UpdateDashboardPrompt
    Properties:
      Role: !GetAtt LambdaUpdateDashboardRole.Arn
      Code:
        ImageUri: !Ref UpdateImageUri
      PackageType: Image
      Timeout: !Ref LambdaTimeout
      MemorySize: 128
      ReservedConcurrentExecutions: !Ref LambdaReservedConcurrency
      KmsKeyArn: !GetAtt LambdaEnvEncryptionKey.Arn
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds: !Ref SecurityGroupIds
      Environment:
        Variables:
          GRAFANA_URL: !Ref GrafanaEndpoint
          GRAFANA_TOKEN: !Sub '${AWS::StackName}-grafana-token'
          SLACK_SIGNING_SECRET: !Sub '${AWS::StackName}-slack-signing-secret'
          PROMPT_ID: !Ref UpdateDashboardPrompt
          BUCKET_NAME: !Ref MetricsDataBucket
          INFERENCE_PROFILE_ID: !Ref InferenceProfileId
          KNOWLEDGE_BASE_ID: !Ref ContainerInsightKBId
          BUCKET_FILE: !Ref S3BucketFileName

  LambdaCreateDashboardFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - LambdaCreateDashboardRole
      - CreateDashboardPrompt
    Properties:
      Role: !GetAtt LambdaCreateDashboardRole.Arn
      Code:
        ImageUri: !Ref CreateImageUri
      PackageType: Image
      Timeout: !Ref LambdaTimeout
      MemorySize: 128
      ReservedConcurrentExecutions: !Ref LambdaReservedConcurrency
      KmsKeyArn: !GetAtt LambdaEnvEncryptionKey.Arn
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds: !Ref SecurityGroupIds
      Environment:
        Variables:
          GRAFANA_URL: !Ref GrafanaEndpoint
          GRAFANA_TOKEN: !Sub '${AWS::StackName}-grafana-token'
          SLACK_SIGNING_SECRET: !Sub '${AWS::StackName}-slack-signing-secret'
          PROMPT_ID: !Ref CreateDashboardPrompt
          BUCKET_NAME: !Ref MetricsDataBucket
          INFERENCE_PROFILE_ID: !Ref InferenceProfileId
          KNOWLEDGE_BASE_ID: !Ref ContainerInsightKBId
          BUCKET_FILE: !Ref S3BucketFileName

  LambdaDeleteDashboardFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - LambdaDeleteDashboardRole
      - DeleteDashboardPrompt
    Properties:
      Role: !GetAtt LambdaDeleteDashboardRole.Arn
      Code:
        ImageUri: !Ref DeleteImageUri
      PackageType: Image
      Timeout: !Ref LambdaTimeout
      MemorySize: 128
      ReservedConcurrentExecutions: !Ref LambdaReservedConcurrency
      KmsKeyArn: !GetAtt LambdaEnvEncryptionKey.Arn
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds: !Ref SecurityGroupIds
      Environment:
        Variables:
          GRAFANA_URL: !Ref GrafanaEndpoint
          GRAFANA_TOKEN: !Sub '${AWS::StackName}-grafana-token'
          SLACK_SIGNING_SECRET: !Sub '${AWS::StackName}-slack-signing-secret'
          PROMPT_ID: !Ref DeleteDashboardPrompt
          INFERENCE_PROFILE_ID: !Ref InferenceProfileId

Outputs:
  RoleArn:
    Description: ARN of the Lambda execution role
    Value: !GetAtt LambdaUpdateDashboardRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-RoleArn'

  RoleName:
    Description: Name of the Lambda execution role
    Value: !Ref LambdaUpdateDashboardRole
    Export:
      Name: !Sub '${AWS::StackName}-RoleName'

  FunctionArn:
    Description: ARN of the Lambda function
    Value: !GetAtt LambdaUpdateDashboardFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-FunctionArn'

  FunctionName:
    Description: Name of the Lambda function
    Value: !Ref LambdaUpdateDashboardFunction
    Export:
      Name: !Sub '${AWS::StackName}-FunctionName'

  PromptId:
    Description: ID of the Bedrock prompt
    Value: !Ref UpdateDashboardPrompt
    Export:
      Name: !Sub '${AWS::StackName}-PromptId'

  PromptArn:
    Description: ARN of the Bedrock prompt
    Value: !GetAtt UpdateDashboardPrompt.Arn
    Export:
      Name: !Sub '${AWS::StackName}-PromptArn'

  ApiGatewayId:
    Description: ID of the API Gateway
    Value: !Ref DashboardManagementApi
    Export:
      Name: !Sub '${AWS::StackName}-ApiGatewayId'

  ApiGatewayUrl:
    Description: API Gateway URL for update dashboard
    Value: !Sub 'https://${DashboardManagementApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/slack/update-dashboard'
    Export:
      Name: !Sub '${AWS::StackName}-ApiGatewayUrl'

  SlackResourceId:
    Description: Slack resource ID
    Value: !Ref SlackResource
    Export:
      Name: !Sub '${AWS::StackName}-SlackResourceId'

  UpdateDashboardResourceId:
    Description: Update dashboard resource ID
    Value: !Ref UpdateDashboardResource
    Export:
      Name: !Sub '${AWS::StackName}-UpdateDashboardResourceId'

  CreateDashboardResourceId:
    Description: Create dashboard resource ID
    Value: !Ref CreateDashboardResource
    Export:
      Name: !Sub '${AWS::StackName}-CreateDashboardResourceId'

  CreateFunctionArn:
    Description: ARN of the create dashboard Lambda function
    Value: !GetAtt LambdaCreateDashboardFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-CreateFunctionArn'

  CreatePromptId:
    Description: ID of the create dashboard Bedrock prompt
    Value: !Ref CreateDashboardPrompt
    Export:
      Name: !Sub '${AWS::StackName}-CreatePromptId'

  DeleteDashboardResourceId:
    Description: Delete dashboard resource ID
    Value: !Ref DeleteDashboardResource
    Export:
      Name: !Sub '${AWS::StackName}-DeleteDashboardResourceId'

  DeleteFunctionArn:
    Description: ARN of the delete dashboard Lambda function
    Value: !GetAtt LambdaDeleteDashboardFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-DeleteFunctionArn'

  DeletePromptId:
    Description: ID of the delete dashboard Bedrock prompt
    Value: !Ref DeleteDashboardPrompt
    Export:
      Name: !Sub '${AWS::StackName}-DeletePromptId'

  S3BucketName:
    Description: Name of the S3 bucket for metrics data
    Value: !Ref MetricsDataBucket
    Export:
      Name: !Sub '${AWS::StackName}-S3BucketName'

  ContainerInsightKBId:
    Description: Knowledge Base ID used by Lambda functions
    Value: !Ref ContainerInsightKBId
    Export:
      Name: !Sub '${AWS::StackName}-KnowledgeBaseId'