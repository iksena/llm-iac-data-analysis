  S3VPCEndpoint:
    Condition: PrivateSubnetsCondition
    Type: AWS::EC2::VPCEndpoint
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            - EIAMPolicyActionWildcard
            - EPolicyWildcardPrincipal
          ignore_reasons:
            - EIAMPolicyActionWildcard: Wildcard should not be used for Action in IAM policies. Ignored as we don't want to disable other customer S3 usage from resources created inside this VPC. Apply IAM rules to limit resource access instead.
            - EPolicyWildcardPrincipal: Policy should not allow * Principal. Ignored as we don't want to disable other customer S3 usage from resources created inside this VPC. Apply IAM rules to limit resource access instead.
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Action: '*'
            Effect: Allow
            Resource: '*'
            Principal: '*'
      RouteTableIds:
        - !Ref 'PrivateSubnet1ARouteTable'
        - !If [PrivateSubnets&2AZCondition, !Ref 'PrivateSubnet2ARouteTable', !Ref 'AWS::NoValue']
        - !If [PrivateSubnets&3AZCondition, !Ref 'PrivateSubnet3ARouteTable', !Ref 'AWS::NoValue']
        - !If [PrivateSubnets&4AZCondition, !Ref 'PrivateSubnet4ARouteTable', !Ref 'AWS::NoValue']
        - !If [PrivateSubnets&5AZCondition, !Ref 'PrivateSubnet5ARouteTable', !Ref 'AWS::NoValue']
        - !If [PrivateSubnets&6AZCondition, !Ref 'PrivateSubnet6ARouteTable', !Ref 'AWS::NoValue']
        - !If [AdditionalPrivateSubnetsCondition, !Ref 'PrivateSubnet1BRouteTable', !Ref 'AWS::NoValue']
        - !If [AdditionalPrivateSubnets&2AZCondition, !Ref 'PrivateSubnet2BRouteTable', !Ref 'AWS::NoValue']
        - !If [AdditionalPrivateSubnets&3AZCondition, !Ref 'PrivateSubnet3BRouteTable', !Ref 'AWS::NoValue']
        - !If [AdditionalPrivateSubnets&4AZCondition, !Ref 'PrivateSubnet4BRouteTable', !Ref 'AWS::NoValue']
        - !If [AdditionalPrivateSubnets&5AZCondition, !Ref 'PrivateSubnet5BRouteTable', !Ref 'AWS::NoValue']
        - !If [AdditionalPrivateSubnets&6AZCondition, !Ref 'PrivateSubnet6BRouteTable', !Ref 'AWS::NoValue']
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcId: !Ref 'VPC'
