AWSTemplateFormatVersion: '2010-09-09'
Description: Observability stack with AWS Managed Grafana for Data Master

Resources:

  GrafanaAccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dm-grafana-access-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: grafana.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: dm-grafana-datasource-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - athena:GetDataCatalog
                  - athena:GetDatabase
                  - athena:GetTableMetadata
                  - athena:ListDataCatalogs
                  - athena:ListDatabases
                  - athena:ListTableMetadata
                  - athena:StartQueryExecution
                  - athena:GetQueryExecution
                  - athena:GetQueryResults
                  - athena:StopQueryExecution
                Resource: "*"
              - Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:GetDatabases
                  - glue:GetTable
                  - glue:GetTables
                  - glue:GetPartitions
                Resource: "*"
              - Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:PutObject
                Resource: "*"
              - Effect: Allow
                Action:
                  - cloudwatch:DescribeAlarmsForMetric
                  - cloudwatch:DescribeAlarmHistory
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:ListMetrics
                  - cloudwatch:GetMetricData
                  - cloudwatch:GetInsightRuleReport
                Resource: "*"
              - Effect: Allow
                Action:
                  - logs:DescribeLogGroups
                  - logs:GetLogGroupFields
                  - logs:StartQuery
                  - logs:StopQuery
                  - logs:GetQueryResults
                  - logs:GetLogEvents
                Resource: "*"
              - Effect: Allow
                Action:
                  - ec2:DescribeTags
                  - ec2:DescribeInstances
                  - ec2:DescribeRegions
                Resource: "*"
              - Effect: Allow
                Action:
                  - tag:GetResources
                Resource: "*"

  GrafanaWorkspace:
    Type: AWS::Grafana::Workspace
    Properties:
      Description: Grafana workspace for Data Master observability
      AccountAccessType: CURRENT_ACCOUNT
      AuthenticationProviders:
        - SAML
      PermissionType: SERVICE_MANAGED
      PluginAdminEnabled: true
      RoleArn: !GetAtt GrafanaAccessRole.Arn
      Name: dm-grafana-workspace
      DataSources:
        - ATHENA
        - CLOUDWATCH

Outputs:

  GrafanaWorkspaceId:
    Description: Workspace ID
    Value: !Ref GrafanaWorkspace
    Export:
      Name: dm-grafana-workspace-id

  GrafanaWorkspaceEndpoint:
    Description: URL to access the Grafana Workspace
    Value: !GetAtt GrafanaWorkspace.Endpoint
    Export:
      Name: dm-grafana-workspace-endpoint
