AWSTemplateFormatVersion: "2010-09-09"
Description: "Panoptik — Cognito User Pool, App Client, Domain"

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
  CallbackUrls:
    Type: CommaDelimitedList
    Default: "http://localhost:5173/auth/callback"
  LogoutUrls:
    Type: CommaDelimitedList
    Default: "http://localhost:5173/login"

Resources:
  # Cognito User Pool
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "panoptik-${EnvironmentName}"
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Schema:
        - Name: email
          Required: true
          Mutable: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
      MfaConfiguration: "OPTIONAL"
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      UserPoolTags:
        Name: !Sub "panoptik-${EnvironmentName}-user-pool"

  # Admin Group
  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: panoptik-admin
      UserPoolId: !Ref UserPool
      Description: "Panoptik administrators"

  # Viewer Group
  ViewerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: panoptik-viewer
      UserPoolId: !Ref UserPool
      Description: "Panoptik read-only viewers"

  # App Client (PKCE, no secret)
  AppClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "panoptik-${EnvironmentName}-app"
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlows:
        - code
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      CallbackURLs: !Ref CallbackUrls
      LogoutURLs: !Ref LogoutUrls
      SupportedIdentityProviders:
        - COGNITO
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 7
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      PreventUserExistenceErrors: ENABLED

  # Cognito Domain
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "panoptik-${EnvironmentName}"
      UserPoolId: !Ref UserPool

Outputs:
  UserPoolId:
    Value: !Ref UserPool
    Export:
      Name: !Sub "panoptik-${EnvironmentName}-user-pool-id"
  UserPoolArn:
    Value: !GetAtt UserPool.Arn
  AppClientId:
    Value: !Ref AppClient
    Export:
      Name: !Sub "panoptik-${EnvironmentName}-app-client-id"
  CognitoDomain:
    Value: !Sub "https://panoptik-${EnvironmentName}.auth.${AWS::Region}.amazoncognito.com"
    Export:
      Name: !Sub "panoptik-${EnvironmentName}-cognito-domain"