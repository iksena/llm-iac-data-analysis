AWSTemplateFormatVersion: "2010-09-09"
Description: "Prefix-based IAM Role and Managed Policy for Atlantis Service Role to be assumed when deploying full network stacks (CloudFront + Route53) - Deployed using SAM"

# Atlantis for AWS SAM Deployments
# Service Role Infrastructure Template
# Author: Chad Kluck - 63klabs.net
# Version: v0.0.0/2026-04-23

# Documentation, Issues/Feature Requests, Latest Updates, and Security Reports on GitHub:
# https://github.com/63klabs/atlantis-cfn-template-repo-for-serverless-deployments/

# USE WITH:
# - Network: template-network-route53-cloudfront-s3-apigw.yml
#   - templates/v2/network/template-network-route53-cloudfront-s3-apigw.yml

# =============================================================================
# META DATA
# -----------------------------------------------------------------------------
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-cloudformation-interface.html
#

Metadata:
  cfn-lint:
    config:
      ignore_checks:
        - E6101 # Resources from AWS::Include modules are not visible to cfn-lint
        - W2001 # Parameters consumed by AWS::Include modules appear unused
        - W8001 # Conditions consumed by AWS::Include modules appear unused
  AWS::CloudFormation::Interface:
    ParameterGroups:
      -
        Label:
          default: "Application Resource Naming"
        Parameters:
          - Prefix
          - PrefixUpper
          - S3BucketNameOrgPrefix
          - ServiceRolePath
      -
        Label:
          default: "External Resources"
        Parameters:
          - PermissionsBoundaryArn
      -
        Label:
          default: "Resources to Attach Managed Policy To"
        Parameters:
          - GroupNames
          - UserNames
          - RoleNames
      -
        Label:
          default: "Module Source"
        Parameters:
          - S3ModuleLocation
          - S3ModuleNamespace

# =============================================================================
# PARAMETERS
# -----------------------------------------------------------------------------

Parameters:

  Prefix:
    Type: String
    Default: "acme"
    AllowedPattern: "^[a-z][a-z0-9-]{0,6}[a-z0-9]$"
    MinLength: 2
    MaxLength: 8

  PrefixUpper:
    Type: String
    Default: "ACME"
    AllowedPattern: "^[A-Z][A-Z0-9-]{0,6}[A-Z0-9]$"
    MinLength: 2
    MaxLength: 8

  S3BucketNameOrgPrefix:
    Type: String
    Default: ""
    AllowedPattern: "^[a-z0-9][a-z0-9-]{0,18}[a-z0-9]$|^$"

  ServiceRolePath:
    Type: String
    Default: "/"
    AllowedPattern: "^\\/([a-zA-Z0-9-_]+[\\/])+$|^\\/$"

  PermissionsBoundaryArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:aws:iam::\\d{12}:policy\\/[\\w+=,.@\\-\\/]*[\\w+=,.@\\-]+$"

  GroupNames:
    Type: CommaDelimitedList
    Default: ""
    AllowedPattern: "^[\\w+=,_.@\\-]+$|^$"
  RoleNames:
    Type: CommaDelimitedList
    Default: ""
    AllowedPattern: "^[\\w+=,_.@\\-]+$|^$"
  UserNames:
    Type: CommaDelimitedList
    Default: ""
    AllowedPattern: "^[\\w+=,_.@\\-]+$|^$"

  S3ModuleLocation:
    Type: String
    Description: "S3 bucket name containing module snippets. Modules are loaded from s3://<S3ModuleLocation>/<S3ModuleNamespace>/templates/v2/modules/*. Regional buckets provided by 63klabs: 63klabs-atlas-us-east-1, 63klabs-zenith-us-east-2, 63klabs-fabric-us-west-1, 63klabs-orbit-us-west-2. Admins must supply their own bucket if deploying outside us-*"
    AllowedPattern: "^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$"
    MinLength: 3
    MaxLength: 63
    ConstraintDescription: "Must be a valid S3 bucket name between 3 and 63 characters containing only lowercase letters, numbers, and hyphens."

  S3ModuleNamespace:
    Type: String
    Description: "Namespace prefix within the S3 module bucket. This is the path prefix where modules are stored. Modules are loaded from s3://<BucketName>/<S3ModuleNamespace>/templates/v2/modules/*"
    Default: "atlantis"
    AllowedPattern: "^[a-z0-9][a-z0-9\\-]*(\\/[a-z0-9][a-z0-9\\-]*)*$"
    MinLength: 1
    MaxLength: 128
    ConstraintDescription: "Must be 1 to 128 characters containing only lowercase alphanumeric characters, hyphens, and forward slashes. Must not start or end with a slash. Each segment between slashes must start with a lowercase alphanumeric character."

# =============================================================================
# CONDITIONS
# -----------------------------------------------------------------------------

Conditions:
  UseS3BucketNameOrgPrefix: !Not [!Equals [!Ref S3BucketNameOrgPrefix, ""]]
  HasPermissionsBoundaryArn: !Not [!Equals [!Ref PermissionsBoundaryArn, ""]]
  HasGroupNames: !Not [!Equals [!Join ["", !Ref GroupNames], ""]]
  HasRoleNames: !Not [!Equals [!Join ["", !Ref RoleNames], ""]]
  HasUserNames: !Not [!Equals [!Join ["", !Ref UserNames], ""]]

# =============================================================================
# RESOURCES
# -----------------------------------------------------------------------------

Resources:

  # ---------------------------------------------------------------------------
  # -- Network CloudFront Management Policy --
  PrefixBasedNetworkCloudFrontMgmtPolicy:
    Fn::Transform:
      Name: AWS::Include
      Parameters:
        Location: !Sub "s3://${S3ModuleLocation}/${S3ModuleNamespace}/templates/v2/modules/management-roles/network-cloudfront-mgmt-policy.yml"

  PrefixBasedNetworkRoute53MgmtPolicy:
    Fn::Transform:
      Name: AWS::Include
      Parameters:
        Location: !Sub "s3://${S3ModuleLocation}/${S3ModuleNamespace}/templates/v2/modules/management-roles/network-route53-mgmt-policy.yml"

  PrefixBasedCloudFormationNetworkFullMgmtServiceRole:
    Fn::Transform:
      Name: AWS::Include
      Parameters:
        Location: !Sub "s3://${S3ModuleLocation}/${S3ModuleNamespace}/templates/v2/modules/templates/v2/modules/management-roles/network-full-mgmt-role.yml"

  PrefixBasedNetworkFullMgmtManagedPolicy:
    Fn::Transform:
      Name: AWS::Include
      Parameters:
        Location: !Sub "s3://${S3ModuleLocation}/${S3ModuleNamespace}/templates/v2/modules/management-roles/network-full-mgmt-passrole-policy.yml"

# =============================================================================
# OUTPUTS
# -----------------------------------------------------------------------------

Outputs:

  NetworkFullMgmtServiceRoleArn:
    Description: "The ARN of the Full Network Management Service Role (CloudFront + Route53)"
    Value: !GetAtt PrefixBasedCloudFormationNetworkFullMgmtServiceRole.Arn
    Export:
      Name: !Sub "${PrefixUpper}-CloudFormation-Network-Full-Mgmt-Service-Role-Arn"

  NetworkFullMgmtServiceRoleName:
    Description: "The Name of the Full Network Management Service Role"
    Value: !Ref PrefixBasedCloudFormationNetworkFullMgmtServiceRole
    Export:
      Name: !Sub "${PrefixUpper}-CloudFormation-Network-Full-Mgmt-Service-Role-Name"

  NetworkFullMgmtManagedPolicyArn:
    Description: "The ARN of the Full Network Management Managed Policy"
    Value: !Ref PrefixBasedNetworkFullMgmtManagedPolicy
    Export:
      Name: !Sub "${PrefixUpper}-CloudFormation-Network-Full-Mgmt-ManagedPolicy-Arn"