  # Insights generation workflow
  InsightsStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub '${ProjectName}-insights-generator-${Environment}'
      RoleArn: !GetAtt StepFunctionsExecutionRole.Arn
      TracingConfiguration:
        Enabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref Environment
      DefinitionString: !Sub |
        {
          "Comment": "Generate insights for posts in a date range",
          "StartAt": "CollectPosts",
          "States": {
            "CollectPosts": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${InsightsCollectorFunction}",
                "Payload.$": "$"
              },
              "ResultPath": "$.collectorResult",
              "Next": "CheckPostsExist"
            },
            "CheckPostsExist": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.collectorResult.Payload.posts[0]",
                  "IsPresent": true,
                  "Next": "ProcessPosts"
                }
              ],
              "Default": "NoPostsFound"
            },
            "ProcessPosts": {
              "Type": "Map",
              "ItemsPath": "$.collectorResult.Payload.posts",
              "MaxConcurrency": 5,
              "ResultPath": "$.processedInsights",
              "Parameters": {
                "postId.$": "$$.Map.Item.Value.postId",
                "url.$": "$$.Map.Item.Value.url"
              },
              "Iterator": {
                "StartAt": "ProcessSinglePost",
                "States": {
                  "ProcessSinglePost": {
                    "Type": "Task",
                    "Resource": "arn:aws:states:::lambda:invoke",
                    "Parameters": {
                      "FunctionName": "${InsightsProcessorFunction}",
                      "Payload.$": "$"
                    },
                    "End": true
                  }
                }
              },
              "End": true
            },
            "NoPostsFound": {
              "Type": "Pass",
              "Result": {
                "message": "No posts found in date range or all posts already have insights"
              },
              "End": true
            }
          }
        }

  StepFunctionsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-stepfunctions-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref Environment
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchLogsFullAccess
      Policies:
        - PolicyName: InvokeLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt ScraperOrchestratorFunction.Arn
                  - !GetAtt SentimentAnalysisFunction.Arn
                  - !GetAtt OutageVerifierFunction.Arn
                  - !GetAtt AlertDetectorFunction.Arn
                  - !GetAtt InsightsCollectorFunction.Arn
                  - !GetAtt InsightsProcessorFunction.Arn
                  - !GetAtt QueryPendingPostsFunction.Arn
                  - !GetAtt ToxicityCheckerFunction.Arn
                  - !GetAtt SentimentAnalyzerSingleFunction.Arn
                  - !GetAtt IssueClassifierSingleFunction.Arn
                  - !GetAtt StoreAnalysisResultFunction.Arn
                  - !GetAtt AggregateOutagesFunction.Arn
                  - !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProjectName}-*-scraper-${Environment}'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:aws:s3:::${ProjectName}-scan-results-${AWS::AccountId}'
                  - !Sub 'arn:aws:s3:::${ProjectName}-scan-results-${AWS::AccountId}/*'
              - Effect: Allow
                Action:
                  - states:StartExecution
                Resource:
                  - !Sub 'arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${ProjectName}-scraper-workflow-${Environment}'
                  - !Sub 'arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${ProjectName}-process-raw-posts-${Environment}'
                  - !Sub 'arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${ProjectName}-data-transform-${Environment}'
  # EventBridge Scheduler to trigger Step Functions
  ScraperSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub '${ProjectName}-scraper-schedule-${Environment}'
      Description: Trigger scraper workflow every 15 minutes
      ScheduleExpression: rate(15 minutes)
      FlexibleTimeWindow:
        Mode: 'OFF'
      State: ENABLED
      Target:
        Arn: !GetAtt ScraperWorkflowStateMachine.Arn
        RoleArn: !GetAtt EventBridgeSchedulerRole.Arn
        Input: '{"scrapingInterval": "15min"}'

  EventBridgeSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-scheduler-stepfunctions-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref Environment
      Policies:
        - PolicyName: StartStepFunctionsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - states:StartExecution
                Resource: !GetAtt ScraperWorkflowStateMachine.Arn

  # ============================================================================
  # Data Transform - IAM Role, Lambda Functions, Step Functions State Machine
  # ============================================================================

  DataTransformLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-data-transform-lambda-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref Environment
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Scan
                  - dynamodb:GetItem
                Resource:
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProjectName}-analysis-results-${Environment}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProjectName}-insights-${Environment}'
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                Resource:
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProjectName}-brand-config-${Environment}'
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:Scan
                Resource:
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProjectName}-analysis-results-scrubbed'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProjectName}-insights-scrubbed'
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub 'arn:aws:s3:::${ProjectName}-scan-results-${AWS::AccountId}/*'
        - PolicyName: BedrockAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:GetInferenceProfile
                  - bedrock:InvokeModelWithResponseStream
                Resource: '*'

  DataTransformStateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-data-transform-sfn-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref Environment
      Policies:
        - PolicyName: InvokeLambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt ScanKeysFunction.Arn
                  - !GetAtt TransformItemFunction.Arn
                  - !GetAtt ScanInsightsKeysFunction.Arn
                  - !GetAtt TransformInsightFunction.Arn
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:aws:s3:::${ProjectName}-scan-results-${AWS::AccountId}'
                  - !Sub 'arn:aws:s3:::${ProjectName}-scan-results-${AWS::AccountId}/*'
        - PolicyName: StartChildExecutions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - states:StartExecution
                Resource: !Sub 'arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${ProjectName}-data-transform-${Environment}'

