AWSTemplateFormatVersion: 2010-09-09
Description: Self-contained AWS AppSync GraphQL API with DynamoDB, JavaScript pipeline resolvers, and real-time subscriptions
Resources:
  TodoDynamoDBTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: TodoTable
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: owner
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: owner-index
          KeySchema:
            - AttributeName: owner
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST
  AppSyncGraphQLApi:
    Type: AWS::AppSync::GraphQLApi
    Properties:
      Name: TodoAPIwithJs
      AuthenticationType: API_KEY
  AppSyncApiKey:
    Type: AWS::AppSync::ApiKey
    Properties:
      ApiId: !GetAtt AppSyncGraphQLApi.ApiId
  AppSyncSchema:
    Type: AWS::AppSync::GraphQLSchema
    Properties:
      ApiId: !GetAtt AppSyncGraphQLApi.ApiId
      Definition: "type Todo {\n  id: ID!\n  name: String\n  description: String\n  owner: String\n  createdAt: String\n  updatedAt: String\n}\n\ninput CreateTodoInput {\n  name: String!\n  description: String\n  owner: String!\n}\n\ninput UpdateTodoInput {\n  id: ID!\n  name: String\n  description: String\n  owner: String\n}\n\ntype Query {\n  getTodo(id: ID!): Todo\n  listTodos: [Todo]\n  listTodosByOwner(owner: String!): [Todo]\n}\n\ntype Mutation {\n  createTodo(input: CreateTodoInput!): Todo\n  updateTodo(input: UpdateTodoInput!): Todo\n  deleteTodo(id: ID!): Todo\n}\n\ntype Subscription {\n  onCreateTodo: Todo @aws_subscribe(mutations: [\"createTodo\"])\n  onUpdateTodo: Todo @aws_subscribe(mutations: [\"updateTodo\"])\n  onDeleteTodo: Todo @aws_subscribe(mutations: [\"deleteTodo\"])\n}\n\nschema {\n  query: Query\n  mutation: Mutation\n  subscription: Subscription\n}"
  AppSyncServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: appsync.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AppSyncDynamoDBPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt TodoDynamoDBTable.Arn
                  - !Sub "${TodoDynamoDBTable.Arn}/index/*"
  TodoDataSource:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !GetAtt AppSyncGraphQLApi.ApiId
      Name: TodoDynamoDBDataSource
      Type: AMAZON_DYNAMODB
      ServiceRoleArn: !GetAtt AppSyncServiceRole.Arn
      DynamoDBConfig:
        TableName: !Ref TodoDynamoDBTable
        AwsRegion: !Ref AWS::Region
  CreateTodoFunction:
    Type: AWS::AppSync::FunctionConfiguration
    Properties:
      ApiId: !GetAtt AppSyncGraphQLApi.ApiId
      Name: createTodoFunction
      DataSourceName: TodoDynamoDBDataSource
      FunctionVersion: "2018-05-29"
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: "1.0.0"
      Code: |
        import { util } from '@aws-appsync/utils';
        import { put } from '@aws-appsync/utils/dynamodb';
        export function request(ctx) {
          const { input } = ctx.arguments;
          const id = util.autoId();
          const now = util.time.nowISO8601();
          const item = { id, ...input, createdAt: now, updatedAt: now };
          return put({ key: { id }, item });
        }
        export function response(ctx) {
          return ctx.result;
        }
  UpdateTodoFunction:
    Type: AWS::AppSync::FunctionConfiguration
    Properties:
      ApiId: !GetAtt AppSyncGraphQLApi.ApiId
      Name: updateTodoFunction
      DataSourceName: TodoDynamoDBDataSource
      FunctionVersion: "2018-05-29"
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: "1.0.0"
      Code: |
        import { util } from '@aws-appsync/utils';
        import { update } from '@aws-appsync/utils/dynamodb';
        export function request(ctx) {
          const { input } = ctx.arguments;
          const now = util.time.nowISO8601();
          const updates = {};
          for (const [key, value] of Object.entries(input)) {
            if (key !== 'id' && value !== undefined) {
              updates[key] = value;
            }
          }
          updates.updatedAt = now;
          return update({ key: { id: input.id }, update: updates });
        }
        export function response(ctx) {
          return ctx.result;
        }
  DeleteTodoFunction:
    Type: AWS::AppSync::FunctionConfiguration
    Properties:
      ApiId: !GetAtt AppSyncGraphQLApi.ApiId
      Name: deleteTodoFunction
      DataSourceName: TodoDynamoDBDataSource
      FunctionVersion: "2018-05-29"
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: "1.0.0"
      Code: |
        import { remove } from '@aws-appsync/utils/dynamodb';
        export function request(ctx) {
          return remove({ key: { id: ctx.arguments.id } });
        }
        export function response(ctx) {
          return ctx.result;
        }
  GetTodoFunction:
    Type: AWS::AppSync::FunctionConfiguration
    Properties:
      ApiId: !GetAtt AppSyncGraphQLApi.ApiId
      Name: getTodoFunction
      DataSourceName: TodoDynamoDBDataSource
      FunctionVersion: "2018-05-29"
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: "1.0.0"
      Code: |
        import { get } from '@aws-appsync/utils/dynamodb';
        export function request(ctx) {
          return get({ key: { id: ctx.arguments.id } });
        }
        export function response(ctx) {
          return ctx.result;
        }
  ListTodosFunction:
    Type: AWS::AppSync::FunctionConfiguration
    Properties:
      ApiId: !GetAtt AppSyncGraphQLApi.ApiId
      Name: listTodosFunction
      DataSourceName: TodoDynamoDBDataSource
      FunctionVersion: "2018-05-29"
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: "1.0.0"
      Code: |
        import { list } from '@aws-appsync/utils/dynamodb';
        export function request(ctx) {
          return list({});
        }
        export function response(ctx) {
          return ctx.result.items;
        }
  ListTodosByOwnerFunction:
    Type: AWS::AppSync::FunctionConfiguration
    Properties:
      ApiId: !GetAtt AppSyncGraphQLApi.ApiId
      Name: listTodosByOwnerFunction
      DataSourceName: TodoDynamoDBDataSource
      FunctionVersion: "2018-05-29"
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: "1.0.0"
      Code: |
        import { query } from '@aws-appsync/utils/dynamodb';
        export function request(ctx) {
          const { owner } = ctx.arguments;
          return query({ query: { owner: { eq: owner } }, index: 'owner-index' });
        }
        export function response(ctx) {
          return ctx.result.items;
        }
  CreateTodoResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !GetAtt AppSyncGraphQLApi.ApiId
      TypeName: Mutation
      FieldName: createTodo
      Kind: PIPELINE
      PipelineConfig:
        Functions:
          - !GetAtt CreateTodoFunction.FunctionId
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: "1.0.0"
      Code: |
        export function request(ctx) {
          return {};
        }
        export function response(ctx) {
          return ctx.result;
        }
  UpdateTodoResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !GetAtt AppSyncGraphQLApi.ApiId
      TypeName: Mutation
      FieldName: updateTodo
      Kind: PIPELINE
      PipelineConfig:
        Functions:
          - !GetAtt UpdateTodoFunction.FunctionId
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: "1.0.0"
      Code: |
        export function request(ctx) {
          return {};
        }
        export function response(ctx) {
          return ctx.result;
        }
  DeleteTodoResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !GetAtt AppSyncGraphQLApi.ApiId
      TypeName: Mutation
      FieldName: deleteTodo
      Kind: PIPELINE
      PipelineConfig:
        Functions:
          - !GetAtt DeleteTodoFunction.FunctionId
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: "1.0.0"
      Code: |
        export function request(ctx) {
          return {};
        }
        export function response(ctx) {
          return ctx.result;
        }
  GetTodoResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !GetAtt AppSyncGraphQLApi.ApiId
      TypeName: Query
      FieldName: getTodo
      Kind: PIPELINE
      PipelineConfig:
        Functions:
          - !GetAtt GetTodoFunction.FunctionId
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: "1.0.0"
      Code: |
        export function request(ctx) {
          return {};
        }
        export function response(ctx) {
          return ctx.result;
        }
  ListTodosResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !GetAtt AppSyncGraphQLApi.ApiId
      TypeName: Query
      FieldName: listTodos
      Kind: PIPELINE
      PipelineConfig:
        Functions:
          - !GetAtt ListTodosFunction.FunctionId
      Runtime:
        Name: APPSYNC_JS
        RuntimeVersion: "1.0.0"
      Code: |
        export function request(ctx