            Priority: 1

  CourseCatalogUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain:
        Fn::Sub: course-catalog-${AWS::AccountId}
      UserPoolId:
        Ref: CourseCatalogUserPool

  CourseCatalogResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      Identifier:
        Fn::Sub: https://course-catalog-${AWS::AccountId}
      Name: CourseCatalogResourceServer
