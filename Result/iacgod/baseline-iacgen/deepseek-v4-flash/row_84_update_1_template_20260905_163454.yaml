AWSTemplateFormatVersion: '2010-09-09'
Description: CloudFormation template for DNS records of passengerlist.org
Parameters:
  RootCloudFrontDomain:
    Type: String
    Description: CloudFront distribution domain name for root domain (e.g., d123.cloudfront.net.)
  WWWCloudFrontDomain:
    Type: String
    Description: CloudFront distribution domain name for www subdomain
  DeparturesCloudFrontDomain:
    Type: String
    Description: CloudFront distribution domain name for departures subdomain
  JoinCloudFrontDomain:
    Type: String
    Description: CloudFront distribution domain name for join subdomain
  AthenaCloudFrontDomain:
    Type: String
    Description: CloudFront distribution domain name for athena subdomain
  FeedCloudFrontDomain:
    Type: String
    Description: CloudFront distribution domain name for feed subdomain
  SpfTxtValue:
    Type: String
    Description: SPF record value (e.g., "v=spf1 include:_spf.google.com ~all")
  SiteVerificationTxtValue:
    Type: String
    Description: Site verification TXT record value (e.g., "google-site-verification=xxxx")
  DmarcTxtValue:
    Type: String
    Description: DMARC TXT record value for _dmarc.passengerlist.org (e.g., "v=DMARC1; p=none;")
  ZendeskCnameName:
    Type: String
    Description: CNAME record name for Zendesk mail routing (e.g., "zendesk")
  ZendeskCnameTarget:
    Type: String
    Description: CNAME target for Zendesk (e.g., "zen.zendesk.com.")
  DkimCnameName:
    Type: String
    Description: CNAME record name for DKIM (e.g., "google._domainkey")
  DkimCnameTarget:
    Type: String
    Description: CNAME target for DKIM (e.g., "google._domainkey.dkim.passengerlist.org.")
  SquarespaceCnameName:
    Type: String
    Description: CNAME record name for Squarespace domain verification (e.g., "verify")
  SquarespaceCnameTarget:
    Type: String
    Description: CNAME target for Squarespace (e.g., "verify.squarespace.com.")
  AcmRootValidationName:
    Type: String
    Description: ACM validation CNAME record name for root domain (e.g., "_x.passengerlist.org.")
  AcmRootValidationValue:
    Type: String
    Description: ACM validation CNAME record value for root domain (e.g., "_y.acm-validations.aws.")
  AcmWwwValidationName:
    Type: String
    Description: ACM validation CNAME record name for www
  AcmWwwValidationValue:
    Type: String
    Description: ACM validation CNAME record value for www
  AcmDeparturesValidationName:
    Type: String
    Description: ACM validation CNAME record name for departures
  AcmDeparturesValidationValue:
    Type: String
    Description: ACM validation CNAME record value for departures
  AcmJoinValidationName:
    Type: String
    Description: ACM validation CNAME record name for join
  AcmJoinValidationValue:
    Type: String
    Description: ACM validation CNAME record value for join
  AcmAthenaValidationName:
    Type: String
    Description: ACM validation CNAME record name for athena
  AcmAthenaValidationValue:
    Type: String
    Description: ACM validation CNAME record value for athena
  AcmFeedValidationName:
    Type: String
    Description: ACM validation CNAME record name for feed
  AcmFeedValidationValue:
    Type: String
    Description: ACM validation CNAME record value for feed

Resources:
  PassengerlistHostedZone:
    Type: 'AWS::Route53::HostedZone'
    Properties:
      Name: passengerlist.org.

  DNSRecords:
    Type: 'AWS::Route53::RecordSetGroup'
    Properties:
      HostedZoneId: !Ref PassengerlistHostedZone
      RecordSets:
        - Name: passengerlist.org.
          Type: A
          AliasTarget:
            HostedZoneId: Z2FDTNDATAQYW2
            DNSName: !Ref RootCloudFrontDomain
        - Name: passengerlist.org.
          Type: AAAA
          AliasTarget:
            HostedZoneId: Z2FDTNDATAQYW2
            DNSName: !Ref RootCloudFrontDomain
        - Name: www.passengerlist.org.
          Type: A
          AliasTarget:
            HostedZoneId: Z2FDTNDATAQYW2
            DNSName: !Ref WWWCloudFrontDomain
        - Name: www.passengerlist.org.
          Type: AAAA
          AliasTarget:
            HostedZoneId: Z2FDTNDATAQYW2
            DNSName: !Ref WWWCloudFrontDomain
        - Name: departures.passengerlist.org.
          Type: A
          AliasTarget:
            HostedZoneId: Z2FDTNDATAQYW2
            DNSName: !Ref DeparturesCloudFrontDomain
        - Name: departures.passengerlist.org.
          Type: AAAA
          AliasTarget:
            HostedZoneId: Z2FDTNDATAQYW2
            DNSName: !Ref DeparturesCloudFrontDomain
        - Name: join.passengerlist.org.
          Type: A
          AliasTarget:
            HostedZoneId: Z2FDTNDATAQYW2
            DNSName: !Ref JoinCloudFrontDomain
        - Name: join.passengerlist.org.
          Type: AAAA
          AliasTarget:
            HostedZoneId: Z2FDTNDATAQYW2
            DNSName: !Ref JoinCloudFrontDomain
        - Name: athena.passengerlist.org.
          Type: A
          AliasTarget:
            HostedZoneId: Z2FDTNDATAQYW2
            DNSName: !Ref AthenaCloudFrontDomain
        - Name: athena.passengerlist.org.
          Type: AAAA
          AliasTarget:
            HostedZoneId: Z2FDTNDATAQYW2
            DNSName: !Ref AthenaCloudFrontDomain
        - Name: feed.passengerlist.org.
          Type: A
          AliasTarget:
            HostedZoneId: Z2FDTNDATAQYW2
            DNSName: !Ref FeedCloudFrontDomain
        - Name: feed.passengerlist.org.
          Type: AAAA
          AliasTarget:
            HostedZoneId: Z2FDTNDATAQYW2
            DNSName: !Ref FeedCloudFrontDomain
        - Name: passengerlist.org.
          Type: MX
          TTL: 300
          ResourceRecords:
            - "1 ASPMX.L.GOOGLE.COM."
            - "5 ALT1.ASPMX.L.GOOGLE.COM."
            - "5 ALT2.ASPMX.L.GOOGLE.COM."
            - "10 ALT3.ASPMX.L.GOOGLE.COM."
            - "10 ALT4.ASPMX.L.GOOGLE.COM."
        - Name: passengerlist.org.
          Type: TXT
          TTL: 300
          ResourceRecords:
            - !Sub '"${SpfTxtValue}"'
        - Name: passengerlist.org.
          Type: TXT
          TTL: 300
          ResourceRecords:
            - !Sub '"${SiteVerificationTxtValue}"'
        - Name: _dmarc.passengerlist.org.
          Type: TXT
          TTL: 300
          ResourceRecords:
            - !Sub '"${DmarcTxtValue}"'
        - Name: !Sub '${ZendeskCnameName}.passengerlist.org.'
          Type: CNAME
          TTL: 300
          ResourceRecords:
            - !Ref ZendeskCnameTarget
        - Name: !Sub '${DkimCnameName}.passengerlist.org.'
          Type: CNAME
          TTL: 300
          ResourceRecords:
            - !Ref DkimCnameTarget
        - Name: !Sub '${SquarespaceCnameName}.passengerlist.org.'
          Type: CNAME
          TTL: 300
          ResourceRecords:
            - !Ref SquarespaceCnameTarget
        - Name: !Ref AcmRootValidationName
          Type: CNAME
          TTL: 300
          ResourceRecords:
            - !Ref AcmRootValidationValue
        - Name: !Ref AcmWwwValidationName
          Type: CNAME
          TTL: 300
          ResourceRecords:
            - !Ref AcmWwwValidationValue
        - Name: !Ref AcmDeparturesValidationName
          Type: CNAME
          TTL: 300
          ResourceRecords:
            - !Ref AcmDeparturesValidationValue
        - Name: !Ref AcmJoinValidationName
          Type: CNAME
          TTL: 300
          ResourceRecords:
            - !Ref AcmJoinValidationValue
        - Name: !Ref AcmAthenaValidationName
          Type: CNAME
          TTL: 300
          ResourceRecords:
            - !Ref AcmAthenaValidationValue
        - Name: !Ref AcmFeedValidationName
          Type: CNAME
          TTL: 300
          ResourceRecords:
            - !Ref AcmFeedValidationValue

Outputs:
  HostedZoneId:
    Description: Hosted Zone ID for passengerlist.org
    Value: !Ref PassengerlistHostedZone
  NameServers:
    Description: Name servers for delegation
    Value: !Join [', ', !GetAtt PassengerlistHostedZone.NameServers]