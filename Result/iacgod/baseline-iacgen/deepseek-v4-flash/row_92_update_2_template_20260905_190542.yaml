              ArnLike:
                aws:SourceArn:
                  Fn::Sub: arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:agent/*
      ManagedPolicyArns:
        - Ref: BaseManagedPolicy
      Policies:
        - PolicyName: LoanApplicationSageMakerInvokeEndpoint
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: sagemaker:InvokeEndpoint
                Resource: "*"

  LoanApplicationUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: LoanApplicationUserPool
      AutoVerifiedAttributes:
        - email
      Schema:
