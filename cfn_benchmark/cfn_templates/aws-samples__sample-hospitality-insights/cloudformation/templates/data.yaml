AWSTemplateFormatVersion: '2010-09-09'
Description: 'Data Stack - DynamoDB tables and S3 buckets for Hospitality Insights'

Parameters:
  Environment:
    Type: String
    Description: Environment name
    Default: prod

  ProjectName:
    Type: String
    Description: Project name
    Default: hospitality-insights

  ProjectTag:
    Type: String
    Description: Project tag for all resources
    Default: hospitality-insights

  DataRetentionDays:
    Type: Number
    Description: Number of days to retain data in DynamoDB before archival
    Default: 90

Resources:
  # DynamoDB Table - TableConfig (stores active table names for demo mode toggle)
  TableConfigTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-table-config-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: configId
          AttributeType: S
      KeySchema:
        - AttributeName: configId
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectTag

  # DynamoDB Table - RawPosts
  RawPostsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-raw-posts-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: platformSourceId
          AttributeType: S
        - AttributeName: timestampPostId
          AttributeType: S
        - AttributeName: status
          AttributeType: S
      KeySchema:
        - AttributeName: platformSourceId
          KeyType: HASH
        - AttributeName: timestampPostId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: status-timestampPostId-index
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: timestampPostId
              KeyType: RANGE
          Projection:
            ProjectionType: KEYS_ONLY
      StreamSpecification:
        StreamViewType: NEW_IMAGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectTag

  # DynamoDB Table - AnalysisResults
  AnalysisResultsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-analysis-results-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: platformSourceId
          AttributeType: S
        - AttributeName: timestampPostId
          AttributeType: S
        - AttributeName: sentimentType
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: N
        - AttributeName: postId
          AttributeType: S
        - AttributeName: platform
          AttributeType: S
      KeySchema:
        - AttributeName: platformSourceId
          KeyType: HASH
        - AttributeName: timestampPostId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: sentimentType-timestamp-index
          KeySchema:
            - AttributeName: sentimentType
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: postId-index
          KeySchema:
            - AttributeName: postId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: platform-timestamp-index
          KeySchema:
            - AttributeName: platform
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_IMAGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectTag

  # DynamoDB Table - Alerts
  AlertsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-alerts-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: alertId
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: N
        - AttributeName: platform
          AttributeType: S
      KeySchema:
        - AttributeName: alertId
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: platform-timestamp-index
          KeySchema:
            - AttributeName: platform
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectTag

  # DynamoDB Table - Sources
  SourcesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-sources-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: sourceId
          AttributeType: S
      KeySchema:
        - AttributeName: sourceId
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectTag

  # DynamoDB Table - Keywords
  KeywordsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-keywords-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: keywordId
          AttributeType: S
      KeySchema:
        - AttributeName: keywordId
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectTag

  # DynamoDB Table - AlertConfig
  AlertConfigTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-alert-config-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: configId
          AttributeType: S
      KeySchema:
        - AttributeName: configId
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectTag

  # DynamoDB Table - BrandConfig
  BrandConfigTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-brand-config-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: configId
          AttributeType: S
      KeySchema:
        - AttributeName: configId
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectTag

  # DynamoDB Table - PlatformConfig
  PlatformConfigTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-platform-config-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: platform
          AttributeType: S
      KeySchema:
        - AttributeName: platform
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectTag

  # DynamoDB Table - Insights (individual post insights with deduplication)
  InsightsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-insights-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: postId
          AttributeType: S
        - AttributeName: generatedAt
          AttributeType: N
      KeySchema:
        - AttributeName: postId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: generatedAt-index
          KeySchema:
            - AttributeName: generatedAt
              KeyType: HASH
            - AttributeName: postId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectTag

  # DynamoDB Table - Actions
  ActionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-actions-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: actionId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: N
        - AttributeName: status
          AttributeType: S
        - AttributeName: dueDate
          AttributeType: N
      KeySchema:
        - AttributeName: actionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: status-dueDate-index
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: dueDate
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: createdAt-index
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectTag

  # DynamoDB Table - Brands
  BrandsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-brands-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: brandId
          AttributeType: S
      KeySchema:
        - AttributeName: brandId
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectTag

  # DynamoDB Table - People
  PeopleTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-people-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: personId
          AttributeType: S
        - AttributeName: brandId
          AttributeType: S
      KeySchema:
        - AttributeName: personId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: brandId-index
          KeySchema:
            - AttributeName: brandId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectTag

  # S3 Bucket - Data Archival
  ArchivalBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-archival-${Environment}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: TransitionToGlacier
            Status: Enabled
            Transitions:
              - TransitionInDays: 0
                StorageClass: GLACIER
          - Id: DeleteOldVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 30
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectTag

  # S3 Bucket - Data Transform Scan Results (temp storage for Step Functions distributed map)
  DataTransformScanBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-scan-results-${AWS::AccountId}'
      LifecycleConfiguration:
        Rules:
          - Id: DeleteAfter7Days
            Status: Enabled
            ExpirationInDays: 7
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectTag

  # DynamoDB Table - AnalysisResults Scrubbed (demo mode)
  AnalysisResultsScrubbedTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-analysis-results-scrubbed'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: platformSourceId
          AttributeType: S
        - AttributeName: timestampPostId
          AttributeType: S
        - AttributeName: sentimentType
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: N
        - AttributeName: postId
          AttributeType: S
        - AttributeName: platform
          AttributeType: S
      KeySchema:
        - AttributeName: platformSourceId
          KeyType: HASH
        - AttributeName: timestampPostId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: sentimentType-timestamp-index
          KeySchema:
            - AttributeName: sentimentType
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: postId-index
          KeySchema:
            - AttributeName: postId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: platform-timestamp-index
          KeySchema:
            - AttributeName: platform
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectTag

  # DynamoDB Table - Insights Scrubbed (demo mode)
  InsightsScrubbedTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-insights-scrubbed'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: postId
          AttributeType: S
        - AttributeName: generatedAt
          AttributeType: N
      KeySchema:
        - AttributeName: postId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: generatedAt-index
          KeySchema:
            - AttributeName: generatedAt
              KeyType: HASH
            - AttributeName: postId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectTag

Outputs:
  RawPostsTableName:
    Description: Name of the RawPosts DynamoDB table
    Value: !Ref RawPostsTable

  RawPostsTableArn:
    Description: ARN of the RawPosts DynamoDB table
    Value: !GetAtt RawPostsTable.Arn

  RawPostsTableStreamArn:
    Description: Stream ARN of the RawPosts DynamoDB table
    Value: !GetAtt RawPostsTable.StreamArn

  AnalysisResultsTableName:
    Description: Name of the AnalysisResults DynamoDB table
    Value: !Ref AnalysisResultsTable

  AnalysisResultsTableArn:
    Description: ARN of the AnalysisResults DynamoDB table
    Value: !GetAtt AnalysisResultsTable.Arn

  AnalysisResultsTableStreamArn:
    Description: Stream ARN of the AnalysisResults DynamoDB table
    Value: !GetAtt AnalysisResultsTable.StreamArn

  AlertsTableName:
    Description: Name of the Alerts DynamoDB table
    Value: !Ref AlertsTable

  AlertsTableArn:
    Description: ARN of the Alerts DynamoDB table
    Value: !GetAtt AlertsTable.Arn

  SourcesTableName:
    Description: Name of the Sources DynamoDB table
    Value: !Ref SourcesTable

  SourcesTableArn:
    Description: ARN of the Sources DynamoDB table
    Value: !GetAtt SourcesTable.Arn

  KeywordsTableName:
    Description: Name of the Keywords DynamoDB table
    Value: !Ref KeywordsTable

  KeywordsTableArn:
    Description: ARN of the Keywords DynamoDB table
    Value: !GetAtt KeywordsTable.Arn

  AlertConfigTableName:
    Description: Name of the AlertConfig DynamoDB table
    Value: !Ref AlertConfigTable

  AlertConfigTableArn:
    Description: ARN of the AlertConfig DynamoDB table
    Value: !GetAtt AlertConfigTable.Arn

  BrandConfigTableName:
    Description: Name of the BrandConfig DynamoDB table
    Value: !Ref BrandConfigTable

  BrandConfigTableArn:
    Description: ARN of the BrandConfig DynamoDB table
    Value: !GetAtt BrandConfigTable.Arn

  PlatformConfigTableName:
    Description: Name of the PlatformConfig DynamoDB table
    Value: !Ref PlatformConfigTable

  PlatformConfigTableArn:
    Description: ARN of the PlatformConfig DynamoDB table
    Value: !GetAtt PlatformConfigTable.Arn

  InsightsTableName:
    Description: Name of the Insights DynamoDB table
    Value: !Ref InsightsTable

  InsightsTableArn:
    Description: ARN of the Insights DynamoDB table
    Value: !GetAtt InsightsTable.Arn

  ArchivalBucketName:
    Description: Name of the archival S3 bucket
    Value: !Ref ArchivalBucket

  ArchivalBucketArn:
    Description: ARN of the archival S3 bucket
    Value: !GetAtt ArchivalBucket.Arn

  ActionsTableName:
    Description: Name of the Actions DynamoDB table
    Value: !Ref ActionsTable

  ActionsTableArn:
    Description: ARN of the Actions DynamoDB table
    Value: !GetAtt ActionsTable.Arn

  BrandsTableName:
    Description: Name of the Brands DynamoDB table
    Value: !Ref BrandsTable

  BrandsTableArn:
    Description: ARN of the Brands DynamoDB table
    Value: !GetAtt BrandsTable.Arn

  PeopleTableName:
    Description: Name of the People DynamoDB table
    Value: !Ref PeopleTable

  PeopleTableArn:
    Description: ARN of the People DynamoDB table
    Value: !GetAtt PeopleTable.Arn

  TableConfigTableName:
    Description: Name of the TableConfig DynamoDB table
    Value: !Ref TableConfigTable

  TableConfigTableArn:
    Description: ARN of the TableConfig DynamoDB table
    Value: !GetAtt TableConfigTable.Arn

  DataTransformScanBucketName:
    Description: Name of the data transform scan results S3 bucket
    Value: !Ref DataTransformScanBucket

  DataTransformScanBucketArn:
    Description: ARN of the data transform scan results S3 bucket
    Value: !GetAtt DataTransformScanBucket.Arn

  AnalysisResultsScrubbedTableName:
    Description: Name of the scrubbed AnalysisResults table
    Value: !Ref AnalysisResultsScrubbedTable

  InsightsScrubbedTableName:
    Description: Name of the scrubbed Insights table
    Value: !Ref InsightsScrubbedTable