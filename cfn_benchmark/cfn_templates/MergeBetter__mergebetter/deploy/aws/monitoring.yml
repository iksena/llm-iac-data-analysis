AWSTemplateFormatVersion: '2010-09-09'
Description: CloudWatch dashboard and alarms for MergeBetter ECS service behind ALB

Parameters:
  DashboardName:
    Type: String
    Default: mergebetter-dashboard
    Description: Name of the CloudWatch dashboard
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, staging, prod]
    Description: Environment label for widgets
  ALBFullName:
    Type: String
    Description: ALB LoadBalancerFullName (e.g., app/mergebetter-alb/abc123)
  TargetGroupFullName:
    Type: String
    Description: TargetGroupFullName (e.g., targetgroup/mergebetter-targets/def456)
  ECSClusterName:
    Type: String
    Default: mergebetter-cluster
    Description: ECS cluster name
  ECSServiceName:
    Type: String
    Default: mergebetter-service-cd
    Description: ECS service name (CodeDeploy controlled)
  AlarmTopicArn:
    Type: String
    Default: ''
    Description: Optional SNS topic ARN for alarm notifications

Conditions:
  HasAlarmTopic: !Not [!Equals [!Ref AlarmTopicArn, '']]

Resources:
  AlbP95LatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub mergebetter-${Environment}-alb-p95-latency-gt-2s
      AlarmDescription: P95 TargetResponseTime > 2s for 2 datapoints (5m)
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 2
      TreatMissingData: notBreaching
      Metrics:
        - Id: latency
          MetricStat:
            Metric:
              Namespace: AWS/ApplicationELB
              MetricName: TargetResponseTime
              Dimensions:
                - Name: LoadBalancer
                  Value: !Ref ALBFullName
                - Name: TargetGroup
                  Value: !Ref TargetGroupFullName
            Period: 300
            Stat: p95
          ReturnData: true
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], []]
      OKActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], []]

  Alb5xxRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub mergebetter-${Environment}-alb-5xx-rate-gt-0.5pct
      AlarmDescription: Target 5XX error rate > 0.5% for 5 minutes
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 1
      Threshold: 0.005
      TreatMissingData: notBreaching
      Metrics:
        - Id: req
          MetricStat:
            Metric:
              Namespace: AWS/ApplicationELB
              MetricName: RequestCount
              Dimensions:
                - Name: LoadBalancer
                  Value: !Ref ALBFullName
                - Name: TargetGroup
                  Value: !Ref TargetGroupFullName
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: err
          MetricStat:
            Metric:
              Namespace: AWS/ApplicationELB
              MetricName: HTTPCode_Target_5XX_Count
              Dimensions:
                - Name: LoadBalancer
                  Value: !Ref ALBFullName
                - Name: TargetGroup
                  Value: !Ref TargetGroupFullName
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: rate
          Expression: IF(req>0, err/req, 0)
          Label: 5xx rate
          ReturnData: true
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], []]
      OKActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], []]

  EcsCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub mergebetter-${Environment}-ecs-cpu-gt-70
      AlarmDescription: ECS service average CPU > 70% for 5 minutes
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 1
      Threshold: 70
      TreatMissingData: notBreaching
      MetricName: CPUUtilization
      Namespace: AWS/ECS
      Dimensions:
        - Name: ClusterName
          Value: !Ref ECSClusterName
        - Name: ServiceName
          Value: !Ref ECSServiceName
      Period: 300
      Statistic: Average
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], []]
      OKActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], []]

  EcsMemoryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub mergebetter-${Environment}-ecs-mem-gt-80
      AlarmDescription: ECS service average Memory > 80% for 5 minutes
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 1
      Threshold: 80
      TreatMissingData: notBreaching
      MetricName: MemoryUtilization
      Namespace: AWS/ECS
      Dimensions:
        - Name: ClusterName
          Value: !Ref ECSClusterName
        - Name: ServiceName
          Value: !Ref ECSServiceName
      Period: 300
      Statistic: Average
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], []]
      OKActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], []]

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Ref DashboardName
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "text",
              "x": 0, "y": 0, "width": 24, "height": 2,
              "properties": {
                "markdown": "# MergeBetter (${Environment})\nECS service ${ECSServiceName} on ${ECSClusterName} behind ${ALBFullName} / ${TargetGroupFullName}"
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 2, "width": 12, "height": 6,
              "properties": {
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "stat": "Sum",
                "period": 300,
                "title": "ALB Requests & 5XX",
                "metrics": [
                  [ "AWS/ApplicationELB", "RequestCount", "LoadBalancer", "${ALBFullName}", "TargetGroup", "${TargetGroupFullName}" ],
                  [ ".", "HTTPCode_Target_5XX_Count", ".", ".", ".", "." ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 2, "width": 12, "height": 6,
              "properties": {
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "stat": "p95",
                "period": 300,
                "title": "ALB TargetResponseTime p95",
                "metrics": [
                  [ "AWS/ApplicationELB", "TargetResponseTime", "LoadBalancer", "${ALBFullName}", "TargetGroup", "${TargetGroupFullName}" ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 8, "width": 12, "height": 6,
              "properties": {
                "view": "timeSeries",
                "region": "${AWS::Region}",
                "stat": "Average",
                "period": 300,
                "title": "ECS CPU / Memory (%)",
                "metrics": [
                  [ "AWS/ECS", "CPUUtilization", "ClusterName", "${ECSClusterName}", "ServiceName", "${ECSServiceName}" ],
                  [ ".", "MemoryUtilization", ".", ".", ".", "." ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 8, "width": 12, "height": 6,
              "properties": {
                "view": "singleValue",
                "region": "${AWS::Region}",
                "period": 300,
                "title": "ECS Desired vs Running",
                "metrics": [
                  [ "AWS/ECS", "DesiredTaskCount", "ClusterName", "${ECSClusterName}", "ServiceName", "${ECSServiceName}", {"stat":"Maximum"} ],
                  [ ".", "RunningTaskCount", ".", ".", ".", ".", {"stat":"Maximum"} ]
                ]
              }
            }
          ]
        }

Outputs:
  DashboardName:
    Value: !Ref DashboardName
    Description: Name of the created/updated CloudWatch dashboard