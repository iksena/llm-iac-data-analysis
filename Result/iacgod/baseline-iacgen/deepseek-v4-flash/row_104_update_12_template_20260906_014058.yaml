AWSTemplateFormatVersion: "2010-09-09"
Description: "CloudFormation template for Elastic Beanstalk Blue-Green deployment support. Creates a blue environment with optional new application or references existing application. Supports sample application deployment from default S3 bucket (region appended) or custom bucket."

Parameters:
  CreateNewApplication:
    Type: String
    AllowedValues:
      - "true"
      - "false"
    Default: "true"
    Description: "Set to true to create a new Elastic Beanstalk application; false to use an existing application."

  ApplicationName:
    Type: String
    Default: "DefaultApp"
    Description: "Name of the Elastic Beanstalk application. If CreateNewApplication is true, this will be the new application name; otherwise, it must reference an existing application."

  EnvironmentName:
    Type: String
    Default: "DefaultEnv"
    Description: "Name of the Elastic Beanstalk environment (blue environment)."

  SolutionStackName:
    Type: String
    Default: "64bit Amazon Linux 2 v5.8.0 running Node.js 14"
    Description: "Solution stack name for the Elastic Beanstalk environment. Use a modern supported stack."

  UseDefaultBucket:
    Type: String
    AllowedValues:
      - "true"
      - "false"
    Default: "true"
    Description: "Set to true to use the default Elastic Beanstalk sample application bucket (region appended); false to provide a custom bucket."

  SampleAppBucket:
    Type: String
    Default: "my-sample-bucket"
    AllowedPattern: "^(?![.\\-])(?!.*\\.\\.)(?!.*\\-\\.)(?!.*\\.\\-)[a-z0-9.\\-]{3,63}(?<![.\\-])$"
    Description: "S3 bucket name for the sample application. Required if UseDefaultBucket is false. Must be a valid S3 bucket name."

  SampleAppKey:
    Type: String
    Default: "nodejs-example.zip"
    Description: "S3 key for the sample application zip file. Default uses a Node.js sample; change to php-example.zip or others as needed."

Conditions:
  IsCreateNewApplication: !Equals [!Ref CreateNewApplication, "true"]
  IsUseDefaultBucket: !Equals [!Ref UseDefaultBucket, "true"]

Resources:
  # S3 bucket to store the sample application when using default bucket
  SampleAppBucketLocal:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "elasticbeanstalk-sample-${AWS::AccountId}-${AWS::Region}"
      VersioningConfiguration:
        Status: Enabled

  # Bucket policy to deny public access
  SampleAppBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SampleAppBucketLocal
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !Sub "${SampleAppBucketLocal.Arn}/*"
              - !Sub "${SampleAppBucketLocal.Arn}"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  # IAM role for Lambda function to download and upload sample app
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: "S3UploadAccess"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "s3:PutObject"
                  - "s3:PutObjectAcl"
                Resource: !Sub "arn:aws:s3:::${SampleAppBucketLocal}/${SampleAppKey}"

  # Lambda function to download sample app from public S3 URL and upload to local bucket
  CopySampleAppFunction:
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Runtime: python3.14
      Timeout: 60
      Code:
        ZipFile: |
          import boto3
          import json
          import urllib.request
          import os

          def handler(event, context):
              try:
                  use_default = os.environ.get('USE_DEFAULT_BUCKET', 'false')
                  if event['RequestType'] == 'Create' and use_default == 'true':
                      source_bucket = os.environ['SOURCE_BUCKET']
                      source_key = os.environ['SOURCE_KEY']
                      dest_bucket = os.environ['DEST_BUCKET']
                      dest_key = os.environ['DEST_KEY']
                      # Construct public URL for the source object
                      source_url = f"https://{source_bucket}.s3.amazonaws.com/{source_key}"
                      print(f"Downloading from {source_url}")
                      # Download the file
                      with urllib.request.urlopen(source_url) as response:
                          file_data = response.read()
                      print(f"Downloaded {len(file_data)} bytes")
                      # Upload to destination bucket
                      s3 = boto3.client('s3')
                      s3.put_object(
                          Bucket=dest_bucket,
                          Key=dest_key,
                          Body=file_data
                      )
                      print("Upload successful")
                  send_response(event, context, 'SUCCESS', {})
              except Exception as e:
                  print(f"Error: {str(e)}")
                  send_response(event, context, 'FAILED', {'Error': str(e)})

          def send_response(event, context, status, data):
              response_body = {
                  'Status': status,
                  'Reason': 'See the details in CloudWatch Log Stream: ' + context.log_stream_name,
                  'PhysicalResourceId': context.log_stream_name,
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': data
              }
              json_body = json.dumps(response_body)
              req = urllib.request.Request(
                  event['ResponseURL'],
                  data=json_body.encode('utf-8'),
                  headers={'Content-Type': 'application/json'},
                  method='PUT'
              )
              with urllib.request.urlopen(req) as response:
                  pass
      Environment:
        Variables:
          SOURCE_BUCKET: !Sub "elasticbeanstalk-samples-${AWS::Region}"
          SOURCE_KEY: !Ref SampleAppKey
          DEST_BUCKET: !Ref SampleAppBucketLocal
          DEST_KEY: !Ref SampleAppKey
          USE_DEFAULT_BUCKET: !Ref UseDefaultBucket

  # Custom resource to trigger the Lambda function
  CopySampleAppCustomResource:
    Type: Custom::CopySampleApp
    Properties:
      ServiceToken: !GetAtt CopySampleAppFunction.Arn

  # IAM Service Role for Elastic Beanstalk
  ElasticBeanstalkServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: elasticbeanstalk.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSElasticBeanstalkService
      Path: "/"

  # IAM Instance Profile for EC2 instances
  ElasticBeanstalkInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref ElasticBeanstalkServiceRole
      Path: "/"

  # Application (created only if CreateNewApplication is true)
  Application:
    Condition: IsCreateNewApplication
    Type: AWS::ElasticBeanstalk::Application
    Properties:
      ApplicationName: !Ref ApplicationName
      Description: "Application for blue-green deployment"

  # Application Version (always created, references either new or existing application)
  ApplicationVersion:
    Type: AWS::ElasticBeanstalk::ApplicationVersion
    DependsOn:
      - CopySampleAppCustomResource
    Properties:
      ApplicationName: !If
        - IsCreateNewApplication
        - !Ref Application
        - !Ref ApplicationName
      SourceBundle:
        S3Bucket: !If
          - IsUseDefaultBucket
          - !Ref SampleAppBucketLocal
          - !Ref SampleAppBucket
        S3Key: !Ref SampleAppKey
      Description: "Sample application version for blue environment"

  # Elastic Beanstalk Environment (blue)
  Environment:
    Type: AWS::ElasticBeanstalk::Environment
    Properties:
      ApplicationName: !If
        - IsCreateNewApplication
        - !Ref Application
        - !Ref ApplicationName
      EnvironmentName: !Ref EnvironmentName
      SolutionStackName: !Ref SolutionStackName
      VersionLabel: !Ref ApplicationVersion
      OptionSettings:
        - Namespace: "aws:autoscaling:launchconfiguration"
          OptionName: "IamInstanceProfile"
          Value: !Ref ElasticBeanstalkInstanceProfile
        - Namespace: "aws:elasticbeanstalk:environment"
          OptionName: "ServiceRole"
          Value: !Ref ElasticBeanstalkServiceRole
      Tags:
        - Key: "Name"
          Value: !Ref EnvironmentName
        - Key: "EnvironmentType"
          Value: "blue"

Outputs:
  EnvironmentURL:
    Description: "URL of the Elastic Beanstalk environment (blue)"
    Value: !GetAtt Environment.EndpointURL
  ApplicationName:
    Description: "Elastic Beanstalk application name"
    Value: !Ref ApplicationName
  EnvironmentName:
    Description: "Elastic Beanstalk environment name"
    Value: !Ref EnvironmentName