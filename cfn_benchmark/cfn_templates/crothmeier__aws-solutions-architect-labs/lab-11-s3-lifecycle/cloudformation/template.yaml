AWSTemplateFormatVersion: '2010-09-09'
Description: 'Lab 11: S3 Bucket Policies, Versioning, and Lifecycle Management'

Parameters:
  EnvironmentName:
    Type: String
    Default: Lab11
    Description: Environment name prefix for resources

  EnableMFADelete:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Enable MFA Delete (requires root account with MFA)

Resources:
  # KMS Key for S3 Encryption
  S3EncryptionKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS key for S3 bucket encryption
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: Allow S3 to use the key
            Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action:
              - 'kms:Decrypt'
              - 'kms:GenerateDataKey'
            Resource: '*'
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-S3-KMS-Key'
        - Key: Environment
          Value: !Ref EnvironmentName

  S3EncryptionKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/${EnvironmentName}-s3-encryption'
      TargetKeyId: !Ref S3EncryptionKey

  # Main S3 Bucket with Versioning and Lifecycle
  MainBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${EnvironmentName}-main-bucket-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: 'aws:kms'
              KMSMasterKeyID: !GetAtt S3EncryptionKey.Arn
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          # Rule 1: Transition current version through storage classes
          - Id: TransitionCurrentObjects
            Status: Enabled
            Transitions:
              - TransitionInDays: 30
                StorageClass: STANDARD_IA
              - TransitionInDays: 90
                StorageClass: GLACIER_IR
              - TransitionInDays: 180
                StorageClass: GLACIER
              - TransitionInDays: 365
                StorageClass: DEEP_ARCHIVE
            NoncurrentVersionTransitions:
              - TransitionInDays: 30
                StorageClass: STANDARD_IA
              - TransitionInDays: 90
                StorageClass: GLACIER_IR
            NoncurrentVersionExpiration:
              NoncurrentDays: 730

          # Rule 2: Clean up incomplete multipart uploads
          - Id: CleanupIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

          # Rule 3: Archive old logs
          - Id: ArchiveLogs
            Status: Enabled
            Prefix: logs/
            Transitions:
              - TransitionInDays: 7
                StorageClass: STANDARD_IA
              - TransitionInDays: 30
                StorageClass: GLACIER
            Expiration:
              Days: 90

      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-Main-Bucket'
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Purpose
          Value: LifecycleDemo

  # Bucket Policy - Enforce HTTPS and encryption
  MainBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref MainBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Deny non-HTTPS requests
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt MainBucket.Arn
              - !Sub '${MainBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

          # Deny uploads without encryption
          - Sid: DenyUnencryptedObjectUploads
            Effect: Deny
            Principal: '*'
            Action: 's3:PutObject'
            Resource: !Sub '${MainBucket.Arn}/*'
            Condition:
              StringNotEquals:
                's3:x-amz-server-side-encryption': 'aws:kms'

  # Archive Bucket for compliance
  ArchiveBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${EnvironmentName}-archive-bucket-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ImmediateArchive
            Status: Enabled
            Transitions:
              - TransitionInDays: 0
                StorageClass: GLACIER
      ObjectLockEnabled: true
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention:
            Mode: GOVERNANCE
            Days: 30
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-Archive-Bucket'
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Purpose
          Value: Compliance

  # Intelligent Tiering Bucket
  IntelligentTieringBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${EnvironmentName}-intelligent-bucket-${AWS::AccountId}'
      IntelligentTieringConfigurations:
        - Id: EntireBucket
          Status: Enabled
          Tierings:
            - Days: 90
              AccessTier: ARCHIVE_ACCESS
            - Days: 180
              AccessTier: DEEP_ARCHIVE_ACCESS
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-Intelligent-Tiering-Bucket'
        - Key: Environment
          Value: !Ref EnvironmentName

  # IAM Role for S3 Read-Only Access
  S3ReadOnlyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-S3-ReadOnly-Role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - !Ref S3ReadOnlyPolicy
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-S3-ReadOnly-Role'

  # IAM Policy for S3 Read-Only Access
  S3ReadOnlyPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${EnvironmentName}-S3-ReadOnly-Policy'
      Description: Allows read-only access to S3 buckets
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ListBuckets
            Effect: Allow
            Action:
              - 's3:ListBucket'
              - 's3:ListBucketVersions'
              - 's3:GetBucketLocation'
              - 's3:GetBucketVersioning'
            Resource:
              - !GetAtt MainBucket.Arn
              - !GetAtt ArchiveBucket.Arn
          - Sid: ReadObjects
            Effect: Allow
            Action:
              - 's3:GetObject'
              - 's3:GetObjectVersion'
            Resource:
              - !Sub '${MainBucket.Arn}/*'
              - !Sub '${ArchiveBucket.Arn}/*'
          - Sid: KMSDecrypt
            Effect: Allow
            Action:
              - 'kms:Decrypt'
              - 'kms:DescribeKey'
            Resource: !GetAtt S3EncryptionKey.Arn

  # IAM Role for S3 Read-Write Access
  S3ReadWriteRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-S3-ReadWrite-Role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - !Ref S3ReadWritePolicy
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-S3-ReadWrite-Role'

  # IAM Policy for S3 Read-Write Access
  S3ReadWritePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${EnvironmentName}-S3-ReadWrite-Policy'
      Description: Allows read-write access to S3 buckets
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ListBuckets
            Effect: Allow
            Action:
              - 's3:ListBucket'
              - 's3:ListBucketVersions'
              - 's3:GetBucketLocation'
              - 's3:GetBucketVersioning'
              - 's3:GetLifecycleConfiguration'
            Resource:
              - !GetAtt MainBucket.Arn
          - Sid: ReadWriteObjects
            Effect: Allow
            Action:
              - 's3:GetObject'
              - 's3:GetObjectVersion'
              - 's3:PutObject'
              - 's3:DeleteObject'
              - 's3:DeleteObjectVersion'
            Resource:
              - !Sub '${MainBucket.Arn}/*'
          - Sid: KMSOperations
            Effect: Allow
            Action:
              - 'kms:Decrypt'
              - 'kms:GenerateDataKey'
              - 'kms:DescribeKey'
            Resource: !GetAtt S3EncryptionKey.Arn

Outputs:
  MainBucketName:
    Description: Name of the main S3 bucket
    Value: !Ref MainBucket
    Export:
      Name: !Sub '${AWS::StackName}-MainBucket'

  MainBucketArn:
    Description: ARN of the main S3 bucket
    Value: !GetAtt MainBucket.Arn
    Export:
      Name: !Sub '${AWS::StackName}-MainBucketArn'

  ArchiveBucketName:
    Description: Name of the archive S3 bucket
    Value: !Ref ArchiveBucket
    Export:
      Name: !Sub '${AWS::StackName}-ArchiveBucket'

  IntelligentTieringBucketName:
    Description: Name of the Intelligent-Tiering S3 bucket
    Value: !Ref IntelligentTieringBucket
    Export:
      Name: !Sub '${AWS::StackName}-IntelligentBucket'

  KMSKeyId:
    Description: KMS Key ID for S3 encryption
    Value: !Ref S3EncryptionKey
    Export:
      Name: !Sub '${AWS::StackName}-KMSKey'

  KMSKeyArn:
    Description: KMS Key ARN for S3 encryption
    Value: !GetAtt S3EncryptionKey.Arn
    Export:
      Name: !Sub '${AWS::StackName}-KMSKeyArn'

  S3ReadOnlyRoleArn:
    Description: ARN of S3 Read-Only IAM Role
    Value: !GetAtt S3ReadOnlyRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-ReadOnlyRole'

  S3ReadWriteRoleArn:
    Description: ARN of S3 Read-Write IAM Role
    Value: !GetAtt S3ReadWriteRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-ReadWriteRole'

  BucketURL:
    Description: URL of the main bucket
    Value: !Sub 'https://${MainBucket}.s3.${AWS::Region}.amazonaws.com'