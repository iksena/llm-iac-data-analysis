AWSTemplateFormatVersion: "2010-09-09"
Parameters:
  ScriptBucketName:
    Type: String
    Description: Name of the S3 bucket containing Glue job scripts
  ScriptPathPrefix:
    Type: String
    Default: "glue-scripts/"
    Description: Prefix path for scripts within the script bucket
Resources:
  AdminS3Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "admin-suite-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
  AdminS3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AdminS3Bucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !Sub "arn:aws:s3:::${AdminS3Bucket}"
              - !Sub "arn:aws:s3:::${AdminS3Bucket}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"
  MainIAMRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "admin-suite-role-${AWS::AccountId}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - glue.amazonaws.com
                - cloudformation.amazonaws.com
                - firehose.amazonaws.com
                - streams.metrics.cloudwatch.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: admin-suite-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - quicksight:Describe*
                  - quicksight:List*
                  - quicksight:Search*
                  - quicksight:Get*
                Resource: "*"
              - Effect: Allow
                Action:
                  - glue:CreateJob
                  - glue:GetJob
                  - glue:GetJobRun
                  - glue:StartJobRun
                  - glue:UpdateJob
                  - glue:DeleteJob
                  - glue:CreateTrigger
                  - glue:GetTrigger
                  - glue:StartTrigger
                  - glue:UpdateTrigger
                  - glue:DeleteTrigger
                Resource: "*"
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/admin-suite-role-${AWS::AccountId}"
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:ListBucket
                  - s3:AbortMultipartUpload
                  - s3:ListMultipartUploadParts
                Resource:
                  - !Sub "arn:aws:s3:::${AdminS3Bucket}"
                  - !Sub "arn:aws:s3:::${AdminS3Bucket}/*"
                  - !Sub "arn:aws:s3:::${ScriptBucketName}"
                  - !Sub "arn:aws:s3:::${ScriptBucketName}/${ScriptPathPrefix}*"
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                  - cloudwatch:ListMetrics
                  - cloudwatch:GetMetricData
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:DescribeAlarms
                Resource: "*"
              - Effect: Allow
                Action:
                  - firehose:PutRecord
                  - firehose:PutRecordBatch
                  - firehose:DescribeDeliveryStream
                  - firehose:ListDeliveryStreams
                Resource: !Sub "arn:aws:firehose:${AWS::Region}:${AWS::AccountId}:deliverystream/admin-suite-*"
  GlueJobAssetsAccess:
    Type: AWS::Glue::Job
    Properties:
      Name: etl_job_admin_suite_assets_access
      Role: !GetAtt MainIAMRole.Arn
      Command:
        Name: pythonshell
        PythonVersion: "3.9"
        ScriptLocation: !Sub "s3://${ScriptBucketName}/${ScriptPathPrefix}assets_access.py"
      GlueVersion: "3.0"
      ExecutionProperty:
        MaxConcurrentRuns: 1
      Timeout: 120
      DefaultArguments:
        "--region": !Ref AWS::Region
        "--account-id": !Ref AWS::AccountId
        "--output-bucket": !Ref AdminS3Bucket
  GlueJobAssetsMetadata:
    Type: AWS::Glue::Job
    Properties:
      Name: etl_job_admin_suite_assets_metadata
      Role: !GetAtt MainIAMRole.Arn
      Command:
        Name: pythonshell
        PythonVersion: "3.9"
        ScriptLocation: !Sub "s3://${ScriptBucketName}/${ScriptPathPrefix}assets_metadata.py"
      GlueVersion: "3.0"
      ExecutionProperty:
        MaxConcurrentRuns: 1
      Timeout: 120
      DefaultArguments:
        "--region": !Ref AWS::Region
        "--account-id": !Ref AWS::AccountId
        "--output-bucket": !Ref AdminS3Bucket
  GlueJobFolderAssets:
    Type: AWS::Glue::Job
    Properties:
      Name: etl_job_admin_suite_folder_assets
      Role: !GetAtt MainIAMRole.Arn
      Command:
        Name: pythonshell
        PythonVersion: "3.9"
        ScriptLocation: !Sub "s3://${ScriptBucketName}/${ScriptPathPrefix}folder_assets.py"
      GlueVersion: "3.0"
      ExecutionProperty:
        MaxConcurrentRuns: 1
      Timeout: 120
      DefaultArguments:
        "--region": !Ref AWS::Region
        "--account-id": !Ref AWS::AccountId
        "--output-bucket": !Ref AdminS3Bucket
  GlueJobQMetadata:
    Type: AWS::Glue::Job
    Properties:
      Name: etl_job_admin_suite_q_metadata
      Role: !GetAtt MainIAMRole.Arn
      Command:
        Name: pythonshell
        PythonVersion: "3.9"
        ScriptLocation: !Sub "s3://${ScriptBucketName}/${ScriptPathPrefix}q_metadata.py"
      GlueVersion: "3.0"
      ExecutionProperty:
        MaxConcurrentRuns: 1
      Timeout: 120
      DefaultArguments:
        "--region": !Ref AWS::Region
        "--account-id": !Ref AWS::AccountId
        "--output-bucket": !Ref AdminS3Bucket
  GlueJobQAccess:
    Type: AWS::Glue::Job
    Properties:
      Name: etl_job_admin_suite_q_access
      Role: !GetAtt MainIAMRole.Arn
      Command:
        Name: pythonshell
        PythonVersion: "3.9"
        ScriptLocation: !Sub "s3://${ScriptBucketName}/${ScriptPathPrefix}q_access.py"
      GlueVersion: "3.0"
      ExecutionProperty:
        MaxConcurrentRuns: 1
      Timeout: 120
      DefaultArguments:
        "--region": !Ref AWS::Region
        "--account-id": !Ref AWS::AccountId
        "--output-bucket": !Ref AdminS3Bucket
  GlueJobDsProperties:
    Type: AWS::Glue::Job
    Properties:
      Name: etl_job_admin_suite_ds_properties
      Role: !GetAtt MainIAMRole.Arn
      Command:
        Name: glueetl
        ScriptLocation: !Sub "s3://${ScriptBucketName}/${ScriptPathPrefix}ds_properties.py"
      GlueVersion: "5.0"
      WorkerType: "G.1X"
      NumberOfWorkers: 2
      ExecutionProperty:
        MaxConcurrentRuns: 1
      Timeout: 120
      MaxRetries: 0
      DefaultArguments:
        "--region": !Ref AWS::Region
        "--account-id": !Ref AWS::AccountId
        "--output-bucket": !Ref AdminS3Bucket
  GlueJobDatasourceProperties:
    Type: AWS::Glue::Job
    Properties:
      Name: etl_job_admin_suite_datasource_properties
      Role: !GetAtt MainIAMRole.Arn
      Command:
        Name: glueetl
        ScriptLocation: !Sub "s3://${ScriptBucketName}/${ScriptPathPrefix}datasource_properties.py"
      GlueVersion: "5.0"
      WorkerType: "G.1X"
      NumberOfWorkers: 2
      ExecutionProperty:
        MaxConcurrentRuns: 1
      Timeout: 120
      MaxRetries: 0
      DefaultArguments:
        "--region": !Ref AWS::Region
        "--account-id": !Ref AWS::AccountId
        "--output-bucket": !Ref AdminS3Bucket
  TriggerAssetsAccess:
    Type: AWS::Glue::Trigger
    Properties:
      Type: SCHEDULED
      Schedule: "cron(0 */3 * * ? *)"
      Actions:
        - JobName: !Ref GlueJobAssetsAccess
      StartOnCreation: true
  TriggerAssetsMetadata:
    Type: AWS::Glue::Trigger
    Properties:
      Type: SCHEDULED
      Schedule: "cron(0 */3 * * ? *)"
      Actions:
        - JobName: !Ref GlueJobAssetsMetadata
      StartOnCreation: true
  TriggerFolderAssets:
    Type: AWS::Glue::Trigger
    Properties:
      Type: SCHEDULED
      Schedule: "cron(0 */3 * * ? *)"
      Actions:
        - JobName: !Ref GlueJobFolderAssets
      StartOnCreation: true
  TriggerQMetadata:
    Type: AWS::Glue::Trigger
    Properties:
      Type: SCHEDULED
      Schedule: "cron(0 */3 * * ? *)"
      Actions:
        - JobName: !Ref GlueJobQMetadata
      StartOnCreation: true
  TriggerQAccess:
    Type: AWS::Glue::Trigger
    Properties:
      Type: SCHEDULED
      Schedule: "cron(0 */3 * * ? *)"
      Actions:
        - JobName: !Ref GlueJobQAccess
      StartOnCreation: true
  TriggerDsProperties:
    Type: AWS::Glue::Trigger
    Properties:
      Type: SCHEDULED
      Schedule: "cron(0 */3 * * ? *)"
      Actions:
        - JobName: !Ref GlueJobDsProperties
      StartOnCreation: true
  TriggerDatasourceProperties:
    Type: AWS::Glue::Trigger
    Properties:
      Type: SCHEDULED
      Schedule: "cron(0 */3 * * ? *)"
      Actions:
        - JobName: !Ref GlueJobDatasourceProperties
      StartOnCreation: true
  FirehoseDeliveryStreamIngestion:
    Type: AWS::KinesisFirehose::DeliveryStream
    Properties:
      DeliveryStreamName: !Sub "admin-suite-firehose-ingestion-${AWS::AccountId}"
      DeliveryStreamType: DirectPut
      S3DestinationConfiguration:
        BucketARN: !GetAtt AdminS3Bucket.Arn
        Prefix: "quickSightMetrics/ingestion/"
        BufferingHints:
          IntervalInSeconds: 60
          SizeInMBs: 5
        CompressionFormat: UNCOMPRESSED
        RoleARN: !GetAtt MainIAMRole.Arn
  FirehoseDeliveryStreamVisualization:
    Type: AWS::KinesisFirehose::DeliveryStream
    Properties:
      DeliveryStreamName: !Sub "admin-suite-firehose-visualization-${AWS::AccountId}"
      DeliveryStreamType: DirectPut
      S3DestinationConfiguration:
        BucketARN: !GetAtt AdminS3Bucket.Arn
        Prefix: "quickSightMetrics/visualization/"
        BufferingHints:
          IntervalInSeconds: 60
          SizeInMBs: 5
        CompressionFormat: UNCOMPRESSED
        RoleARN: !GetAtt MainIAMRole.Arn
  FirehoseDeliveryStreamSPICE:
    Type: AWS::KinesisFirehose::DeliveryStream
    Properties:
      DeliveryStreamName: !Sub "admin-suite-firehose-spice-${AWS::AccountId}"
      DeliveryStreamType: DirectPut
      S3DestinationConfiguration:
        BucketARN: !GetAtt AdminS3Bucket.Arn
        Prefix: "quickSightMetrics/spice/"
        BufferingHints:
          IntervalInSeconds: 60
          SizeInMBs: 5
        CompressionFormat: UNCOMPRESSED
        RoleARN: !GetAtt MainIAMRole.Arn
  FirehoseDeliveryStreamQuickIndex:
    Type: AWS::KinesisFirehose::DeliveryStream
    Properties:
      DeliveryStreamName: !Sub "admin-suite-firehose-quickindex-${AWS::AccountId}"
      DeliveryStreamType: DirectPut
      S3DestinationConfiguration:
        BucketARN: !GetAtt AdminS3Bucket.Arn
        Prefix: "quickSightMetrics/quickIndex/"
        BufferingHints:
          IntervalInSeconds: 60
          SizeInMBs: 5
        CompressionFormat: UNCOMPRESSED
        RoleARN: !GetAtt MainIAMRole.Arn
  FirehoseDeliveryStreamActions:
    Type: AWS::KinesisFirehose::DeliveryStream
    Properties:
      DeliveryStreamName: !Sub "admin-suite-firehose-actions-${AWS::AccountId}"
      DeliveryStreamType: DirectPut
      S3DestinationConfiguration:
        BucketARN: !GetAtt AdminS3Bucket.Arn
        Prefix: "quickSightMetrics/actions/"
        BufferingHints:
          IntervalInSeconds: 60
          SizeInMBs: 5
        CompressionFormat: UNCOMPRESSED
        RoleARN: !GetAtt MainIAMRole.Arn
  MetricStreamIngestion:
    Type: AWS::CloudWatch::MetricStream
    Properties:
      Name: !Sub "admin-suite-metricstream-ingestion-${AWS::AccountId}"
      FirehoseArn: !GetAtt FirehoseDeliveryStreamIngestion.Arn
      RoleArn: !GetAtt MainIAMRole.Arn
      OutputFormat: json
      IncludeFilters:
        - Namespace: AWS/QuickSight
          MetricNames:
            - IngestionRowCount
            - IngestionLatency
            - IngestionInvocationCount
            - IngestionErrorCount
  MetricStreamVisualization:
    Type: AWS::CloudWatch::MetricStream
    Properties:
      Name: !Sub "admin-suite-metricstream-visualization-${AWS::AccountId}"
      FirehoseArn: !GetAtt FirehoseDeliveryStreamVisualization.Arn
      RoleArn: !GetAtt MainIAMRole.Arn
      OutputFormat: json
      IncludeFilters:
        - Namespace: AWS/QuickSight
          MetricNames:
            - VisualLoadTime
            - DashboardViewLoadTime
            - DashboardViewCount
            - VisualLoadErrorCount
  MetricStreamSPICE:
    Type: AWS::CloudWatch::MetricStream
    Properties:
      Name: !Sub "admin-suite-metricstream-spice-${AWS::AccountId}"
      FirehoseArn: !GetAtt FirehoseDeliveryStreamSPICE.Arn
      RoleArn: !GetAtt MainIAMRole.Arn
      OutputFormat: json
      IncludeFilters:
        - Namespace: AWS/QuickSight
          MetricNames:
            - SPICECapacityLimitInMB
            - SPICECapacityConsumedInMB
  MetricStreamQuickIndex:
    Type: AWS::CloudWatch::MetricStream
    Properties:
      Name: !Sub "admin-suite-metricstream-quickindex-${AWS::AccountId}"
      FirehoseArn: !GetAtt FirehoseDeliveryStreamQuickIndex.Arn
      RoleArn: !GetAtt MainIAMRole.Arn
      OutputFormat: json
      IncludeFilters:
        - Namespace: AWS/QuickSight
          MetricNames:
            - QuickIndexDocumentCount
            - QuickIndexExtractedTextSize
  MetricStreamActions:
    Type: AWS::CloudWatch::MetricStream
    Properties:
      Name: !Sub "admin-suite-metricstream-actions-${AWS::AccountId}"
      FirehoseArn: !GetAtt FirehoseDeliveryStreamActions.Arn
      RoleArn: !GetAtt MainIAMRole.Arn
      OutputFormat: json
      IncludeFilters:
        - Namespace: AWS/QuickSight
          MetricNames:
            - ActionInvocationError
            - ActionInvocationCount
Outputs:
  S3BucketName:
    Description: Name of the S3 bucket for output storage
    Value: !Ref AdminS3Bucket
  IAMRoleArn:
    Description: ARN of the IAM role used by all services
    Value: !GetAtt MainIAMRole.Arn
  GlueJobNames:
    Description: List of Glue job names created
    Value: !Join
      - ", "
      - - !Ref GlueJobAssetsAccess
        - !Ref GlueJobAssetsMetadata
        - !Ref GlueJobFolderAssets
        - !Ref GlueJobQMetadata
        - !Ref GlueJobQAccess
        - !Ref GlueJobDsProperties
        - !Ref GlueJobDatasourceProperties
  FirehoseDeliveryStreamNames:
    Description: List of Firehose delivery stream names
    Value: !Join
      - ", "
      - - !Ref FirehoseDeliveryStreamIngestion
        - !Ref FirehoseDeliveryStreamVisualization
        - !Ref FirehoseDeliveryStreamSPICE
        - !Ref FirehoseDeliveryStreamQuickIndex
        - !Ref FirehoseDeliveryStreamActions
  MetricStreamNames:
    Description: List of CloudWatch metric stream names
    Value: !Join
      - ", "
      - - !Ref MetricStreamIngestion
        - !Ref MetricStreamVisualization
        - !Ref MetricStreamSPICE
        - !Ref MetricStreamQuickIndex
        - !Ref MetricStreamActions