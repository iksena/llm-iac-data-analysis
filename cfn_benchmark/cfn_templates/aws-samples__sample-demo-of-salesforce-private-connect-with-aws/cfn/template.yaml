AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFormation template for demonstrating AWS PrivateLink with AWS. Deploys environment with two interconnected VPCs, Transit Gateway, Network Load Balancer with TLS termination, VPC Endpoint Service, and a sample Python API application.'

Parameters:
  CertificateArn:
    Type: String
    Description: ARN of the ACM certificate for the NLB listener

  AllowedPrincipal:
    Type: String
    Description: AWS Principal ARN that is allowed to create VPC endpoints to this service

  ProviderServiceName:
    Type: String
    Description: Provider's VPC Service Name for your AWS Region

  Vpc1Cidr:
    Type: String
    Default: 10.0.0.0/16
    Description: CIDR block for VPC1

  Vpc2Cidr:
    Type: String
    Default: 172.16.0.0/16
    Description: CIDR block for VPC2

  Vpc1PrivateSubnet1Cidr:
    Type: String
    Default: 10.0.1.0/24
    Description: CIDR block for VPC1 private subnet 1

  Vpc1PrivateSubnet2Cidr:
    Type: String
    Default: 10.0.2.0/24
    Description: CIDR block for VPC1 private subnet 2

  Vpc2PrivateSubnet1Cidr:
    Type: String
    Default: 172.16.1.0/24
    Description: CIDR block for VPC2 private subnet 1

  Vpc2PrivateSubnet2Cidr:
    Type: String
    Default: 172.16.2.0/24
    Description: CIDR block for VPC2 private subnet 2

  Vpc2PrivateSubnet1AzId:
    Type: String
    Description: Availability Zone ID for VPC2 private subnet 1 (leave empty for auto-selection)

  Vpc2PrivateSubnet2AzId:
    Type: String
    Description: Availability Zone ID for VPC2 private subnet 2 (leave empty for auto-selection)

  Vpc1PublicSubnet1Cidr:
    Type: String
    Default: 10.0.3.0/24
    Description: CIDR block for VPC1 public subnet 1

  Vpc1PublicSubnet2Cidr:
    Type: String
    Default: 10.0.4.0/24
    Description: CIDR block for VPC1 public subnet 2

  AmiId:
    Type: AWS::EC2::Image::Id
    Description: Amazon Linux 2023 AMI ID for the AWS Region
    ConstraintDescription: Must be a valid AMI ID in the format ami-xxxxxxxxxxxxxxxxx
    AllowedPattern: ^ami-[a-z0-9]{17}$

  InstanceType:
    Type: String
    Default: t3.micro
    Description: EC2 Instance type

  ApiUsername:
    Type: String
    Description: Username for Basic Authentication
    NoEcho: true
    MinLength: 8
    ConstraintDescription: Must be at least 8 characters in length

  ApiPassword:
    Type: String
    Description: Password for Basic Authentication
    NoEcho: true
    MinLength: 8
    ConstraintDescription: Must be at least 8 characters in length

  NlbHealthCheckPath:
    Type: String
    Default: /healthcheck
    Description: Path for health checks to verify application health

Conditions:
  HasProviderServiceName: !Not [!Equals [!Ref ProviderServiceName, ""]]
  HasAllowedPrincipal: !Not [!Equals [!Ref AllowedPrincipal, ""]]
  HasVpc2Subnet1AzId: !Not [!Equals [!Ref Vpc2PrivateSubnet1AzId, ""]]
  HasVpc2Subnet2AzId: !Not [!Equals [!Ref Vpc2PrivateSubnet2AzId, ""]]

Resources:
  Vpc1:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref Vpc1Cidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-VPC1

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc1
      InternetGatewayId: !Ref InternetGateway

  Vpc1PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc1
      CidrBlock: !Ref Vpc1PublicSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: VPC1 Public Subnet 1

  Vpc1PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc1
      CidrBlock: !Ref Vpc1PublicSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: VPC1 Public Subnet 2

  Vpc1PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc1
      CidrBlock: !Ref Vpc1PrivateSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: VPC1 Private Subnet 1

  Vpc1PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc1
      CidrBlock: !Ref Vpc1PrivateSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: VPC1 Private Subnet 2

  NatGatewayEip:
    Type: AWS::EC2::EIP
    DependsOn: AttachGateway
    Properties:
      Domain: vpc

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatGatewayEip.AllocationId
      SubnetId: !Ref Vpc1PublicSubnet1

  Vpc1PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc1
      Tags:
        - Key: Name
          Value: VPC1 Public Route Table

  Vpc1PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref Vpc1PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  Vpc1PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc1
      Tags:
        - Key: Name
          Value: VPC1 Private Route Table

  Vpc1PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref Vpc1PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  Vpc1PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref Vpc1PublicSubnet1
      RouteTableId: !Ref Vpc1PublicRouteTable

  Vpc1PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref Vpc1PublicSubnet2
      RouteTableId: !Ref Vpc1PublicRouteTable

  Vpc1PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref Vpc1PrivateSubnet1
      RouteTableId: !Ref Vpc1PrivateRouteTable

  Vpc1PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref Vpc1PrivateSubnet2
      RouteTableId: !Ref Vpc1PrivateRouteTable

  Vpc2:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref Vpc2Cidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-VPC2

  Vpc2PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc2
      CidrBlock: !Ref Vpc2PrivateSubnet1Cidr
      AvailabilityZoneId: !If
        - HasVpc2Subnet1AzId
        - !Ref Vpc2PrivateSubnet1AzId
        - !Ref 'AWS::NoValue'
      Tags:
        - Key: Name
          Value: VPC2 Private Subnet 1

  Vpc2PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc2
      CidrBlock: !Ref Vpc2PrivateSubnet2Cidr
      AvailabilityZoneId: !If
        - HasVpc2Subnet2AzId
        - !Ref Vpc2PrivateSubnet2AzId
        - !Ref 'AWS::NoValue'
      Tags:
        - Key: Name
          Value: VPC2 Private Subnet 2

  TransitGateway:
    Type: AWS::EC2::TransitGateway
    Properties:
      AmazonSideAsn: 64512
      AutoAcceptSharedAttachments: enable
      DefaultRouteTableAssociation: enable
      DefaultRouteTablePropagation: enable
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-TGW

  Vpc1TgwAttachment:
    Type: AWS::EC2::TransitGatewayAttachment
    Properties:
      TransitGatewayId: !Ref TransitGateway
      VpcId: !Ref Vpc1
      SubnetIds:
        - !Ref Vpc1PrivateSubnet1
        - !Ref Vpc1PrivateSubnet2
      Tags:
        - Key: Name
          Value: VPC1-TGW-Attachment

  Vpc2TgwAttachment:
    Type: AWS::EC2::TransitGatewayAttachment
    Properties:
      TransitGatewayId: !Ref TransitGateway
      VpcId: !Ref Vpc2
      SubnetIds:
        - !Ref Vpc2PrivateSubnet1
        - !Ref Vpc2PrivateSubnet2
      Tags:
        - Key: Name
          Value: VPC2-TGW-Attachment

  Vpc2PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc2
      Tags:
        - Key: Name
          Value: VPC2 Private Route Table

  Vpc2PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref Vpc2PrivateSubnet1
      RouteTableId: !Ref Vpc2PrivateRouteTable

  Vpc2PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref Vpc2PrivateSubnet2
      RouteTableId: !Ref Vpc2PrivateRouteTable

  Vpc1ToVpc2Route:
    Type: AWS::EC2::Route
    DependsOn: Vpc1TgwAttachment
    Properties:
      RouteTableId: !Ref Vpc1PrivateRouteTable
      DestinationCidrBlock: !Ref Vpc2Cidr
      TransitGatewayId: !GetAtt TransitGateway.Id

  Vpc2ToVpc1Route:
    Type: AWS::EC2::Route
    DependsOn: Vpc2TgwAttachment
    Properties:
      RouteTableId: !Ref Vpc2PrivateRouteTable
      DestinationCidrBlock: !Ref Vpc1Cidr
      TransitGatewayId: !GetAtt TransitGateway.Id

  Ec2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: /
      Roles:
        - !Ref Ec2Role

  Ec2SecretsManagerPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Allows access to Secrets Manager
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:DescribeSecret
            Resource:
              - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:salesforce/credentials*'
              - !Ref ApiCredentialsSecret

  Ec2Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'
        - !Ref Ec2SecretsManagerPolicy
      Path: /

  Ec2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for EC2 instance
      VpcId: !Ref Vpc1
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref Vpc2PrivateSubnet1Cidr
          Description: Allow HTTPS traffic from NLB (subnet 1)
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref Vpc2PrivateSubnet2Cidr
          Description: Allow HTTPS traffic from NLB (subnet 2)
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: Allow HTTPS outbound traffic
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: Allow HTTP outbound traffic
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-EC2-SG

  NlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for NLB
      VpcId: !Ref Vpc2
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: Allow HTTPS traffic from NLB clients
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref Vpc1PrivateSubnet1Cidr
          Description: Allow HTTPS traffic to EC2 instances (subnet 1)
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref Vpc1PrivateSubnet2Cidr
          Description: Allow HTTPS traffic to EC2 instances (subnet 2)
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-NLB-SG

  ApiCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}/api-credentials'
      Description: 'API Basic Auth Credentials'
      SecretString: !Sub '{"username":"${ApiUsername}","password":"${ApiPassword}"}'

  Ec2Instance:
    Type: AWS::EC2::Instance
    DependsOn: ApiCredentialsSecret
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref Vpc1PrivateSubnet1
      SecurityGroupIds:
        - !Ref Ec2SecurityGroup
      IamInstanceProfile: !Ref Ec2InstanceProfile
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -x
          exec 1> >(tee /var/log/user-data.log) 2>&1

          dnf update -y
          dnf install -y python3 python3-pip python3-flask
          dnf install -y python3-pyOpenSSL python3-boto3 python3-requests
          pip3 install flask_httpauth

          echo "Creating application.py..."
          cd /home/ec2-user

          cat > application.py << 'EOF'
          """
          application.py

          Flask API application with basic authentication.

          This application provides a simple REST API with two endpoints:
          - /healthcheck: Unauthenticated endpoint for health monitoring
          - /characters: Authenticated endpoint requiring basic auth credentials

          Authentication credentials are loaded from AWS Secrets Manager at startup.

          Requirements:
          - boto3
          - flask
          - flask_httpauth

          """

          # pylint: disable=import-error
          import socket
          import json
          import boto3
          from flask import Flask, jsonify
          from flask_httpauth import HTTPBasicAuth

          # Initialize Flask application and authentication handler
          app = Flask(__name__)
          auth = HTTPBasicAuth()

          def load_credentials():
              """
              Retrieve API credentials from AWS Secrets Manager.
              """
              try:
                  # Create Secrets Manager client
                  secrets_client = boto3.client("secretsmanager", region_name="${AWS::Region}")

                  # Get the secret value
                  secret_response = secrets_client.get_secret_value(
                      SecretId="${ApiCredentialsSecret}"
                  )

                  # Parse the credentials from the secret value
                  credentials = json.loads(secret_response["SecretString"])
                  return credentials["username"], credentials["password"]
              except Exception as e: # pylint: disable=broad-exception-caught
                  # Log error but don't expose sensitive details in exception
                  print(f"Error retrieving credentials: {e}")
                  return None, None

          # Load credentials at startup and store in memory
          USERNAME, PASSWORD = load_credentials()
          print("Credentials loaded from Secrets Manager")

          @auth.verify_password
          def verify_password(username, password):
              """
              Verify the provided username and password against stored credentials.
              """
              # Use the in-memory credentials
              if username == USERNAME and password == PASSWORD:
                  return username
              return False

          # Sample data for the API
          characters = [
              {"id": 1, "name": "Astro"},
              {"id": 2, "name": "Einstein"},
              {"id": 3, "name": "Codey"},
              {"id": 4, "name": "Cloudy"},
              {"id": 5, "name": "Brandy"},
              {"id": 6, "name": "Ruth"}
          ]

          @app.route("/healthcheck", methods=["GET"])
          def health_check():
              """
              Unauthenticated health check endpoint for monitoring.
              """
              return jsonify({"status": "healthy", "hostname": socket.gethostname()})

          @app.route("/characters", methods=["GET"])
          @auth.login_required
          def get_characters():
              """
              Protected endpoint requiring authentication.
              Returns a list of characters.
              """
              return jsonify(characters)

          if __name__ == "__main__":
              # Run the application with a self-signed certificate
              # Binding to all interfaces is required by design (NLB access)
              app.run(host="0.0.0.0", port=443, ssl_context="adhoc") # nosec B104
          EOL

          echo "Creating systemd service..."
          cat > /etc/systemd/system/MyApp.service << 'EOL'
          [Unit]
          Description=MyApp Flask Application
          After=network.target

          [Service]
          User=root
          WorkingDirectory=/home/ec2-user
          ExecStart=/usr/bin/python3 /home/ec2-user/application.py
          Restart=always

          [Install]
          WantedBy=multi-user.target
          EOL

          echo "Setting permissions..."
          chown ec2-user:ec2-user application.py
          chmod +x application.py

          echo "Starting service..."
          systemctl daemon-reload
          systemctl enable MyApp
          systemctl start MyApp

          echo "User data script complete."
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-instance

  NetworkLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: network
      Scheme: internal
      Subnets:
        - !Ref Vpc2PrivateSubnet1
        - !Ref Vpc2PrivateSubnet2
      SecurityGroups:
        - !Ref NlbSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-NLB

  NlbListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref NetworkLoadBalancer
      Port: 443
      Protocol: TLS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-Res-2021-06
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref NlbTargetGroup

  NlbTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Port: 443
      Protocol: TLS
      VpcId: !Ref Vpc2
      TargetType: ip
      Targets:
        - Id: !GetAtt Ec2Instance.PrivateIp
          AvailabilityZone: all
      HealthCheckProtocol: HTTPS
      HealthCheckPath: !Ref NlbHealthCheckPath
      Matcher:
        HttpCode: '200-299'
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 3
      UnhealthyThresholdCount: 3
      TargetGroupAttributes:
        - Key: preserve_client_ip.enabled
          Value: 'false'

  VpcEndpointService:
    Type: AWS::EC2::VPCEndpointService
    Properties:
      NetworkLoadBalancerArns:
        - !Ref NetworkLoadBalancer
      AcceptanceRequired: true

  VpcEndpointServicePermissions:
    Type: AWS::EC2::VPCEndpointServicePermissions
    Condition: HasAllowedPrincipal
    Properties:
      AllowedPrincipals:
        - !Ref AllowedPrincipal
      ServiceId: !Ref VpcEndpointService

  VpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: HasProviderServiceName
    Properties:
      ServiceName: !Ref ProviderServiceName
      VpcEndpointType: Interface
      VpcId: !Ref Vpc2
      SubnetIds:
        - !Ref Vpc2PrivateSubnet1
        - !Ref Vpc2PrivateSubnet2
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup
      PrivateDnsEnabled: false

  VpcEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for VPC endpoint
      VpcId: !Ref Vpc2
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref Vpc1PrivateSubnet1Cidr
          Description: Access to VPC endpoint from EC2 instance (subnet 1)
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref Vpc1PrivateSubnet2Cidr
          Description: Access to VPC endpoint from EC2 instance (subnet 1)
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: Allow HTTPS outbound traffic

Outputs:
  EndpointServiceName:
    Description: VPC Endpoint Service Name
    Value: !Sub 'com.amazonaws.vpce.${AWS::Region}.${VpcEndpointService}'

  VpcEndpointDnsName:
    Description: 'Regional DNS Name for the VPC Endpoint'
    Value: !Select [1, !Split [":", !Select [0, !GetAtt VpcEndpoint.DnsEntries]]]
    Condition: HasProviderServiceName

  Ec2InstanceId:
    Description: EC2 Instance ID
    Value: !Ref Ec2Instance

  LoadBalancerDns:
    Description: Network Load Balancer DNS Name
    Value: !GetAtt NetworkLoadBalancer.DNSName

  VpcEndpointId:
    Description: VPC Endpoint ID for connection
    Value: !Ref VpcEndpoint
    Condition: HasProviderServiceName

  Vpc2PrivateSubnet1AzId:
    Description: Availability Zone ID of VPC2 private subnet 1
    Value: !GetAtt Vpc2PrivateSubnet1.AvailabilityZoneId

  Vpc2PrivateSubnet2AzId:
    Description: Availability Zone ID of VPC2 private subnet 2
    Value: !GetAtt Vpc2PrivateSubnet2.AvailabilityZoneId