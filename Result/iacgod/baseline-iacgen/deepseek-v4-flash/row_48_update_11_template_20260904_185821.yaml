AWSTemplateFormatVersion: "2010-09-09"
Description: "CloudFormation template for a self-contained AWS Fault Injection Simulator experiment template for chaos engineering across multiple regions, disrupting cross-region network connectivity and pausing replication for S3 and DynamoDB resources tagged with ChaosAllowed=true."

Parameters:
  ExperimentDuration:
    Type: String
    Default: PT20M
    Description: "Duration of the experiment in ISO 8601 format (e.g., PT20M for 20 minutes)."
    AllowedPattern: "^PT[0-9]+[MHS]$"

Resources:
  ExperimentLogKey:
    Type: AWS::KMS::Key
    Properties:
      Description: "KMS key for encrypting FIS experiment CloudWatch logs"
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: "Enable IAM User Permissions"
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          - Sid: "Allow FIS and CloudWatch Logs to use the key"
            Effect: Allow
            Principal:
              Service:
                - fis.amazonaws.com
                - !Sub "logs.${AWS::Region}.amazonaws.com"
            Action:
              - "kms:Encrypt"
              - "kms:Decrypt"
              - "kms:ReEncrypt*"
              - "kms:GenerateDataKey*"
              - "kms:DescribeKey"
            Resource: "*"
      Enabled: true
      KeyUsage: ENCRYPT_DECRYPT
      KeySpec: SYMMETRIC_DEFAULT

  ExperimentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/fis/experiment-logs
      RetentionInDays: 7
      KmsKeyId: !GetAtt ExperimentLogKey.Arn

  FISRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: fis.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
        - arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess
      Policies:
        - PolicyName: FISNetworkAccessPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeTransitGateways
                  - ec2:DescribeSubnets
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeVpcs
                  - ec2:DescribeRouteTables
                  - ec2:DescribeSecurityGroups
                  - ec2:ModifyNetworkInterfaceAttribute
                  - ec2:CreateNetworkInterface
                  - ec2:DeleteNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                  - ec2:CreateNetworkInterfacePermission
                  - ec2:DeleteNetworkInterfacePermission
                  - ec2:DescribeNetworkInterfacePermissions
                  - ec2:DescribeInstances
                  - ec2:DescribeTags
                  - ec2:DescribeAvailabilityZones
                  - ec2:DescribeRegions
                  - ec2:DescribeAccountAttributes
                  - ec2:DescribeDhcpOptions
                  - ec2:DescribeInternetGateways
                  - ec2:DescribeNatGateways
                  - ec2:DescribeNetworkAcls
                  - ec2:DescribeVpcEndpoints
                  - ec2:DescribeVpcPeeringConnections
                  - ec2:DescribeVpnConnections
                  - ec2:DescribeVpnGateways
                  - ec2:DescribeCustomerGateways
                  - ec2:DescribeEgressOnlyInternetGateways
                  - ec2:DescribeFlowLogs
                  - ec2:DescribePrefixLists
                  - ec2:DescribeTransitGatewayAttachments
                  - ec2:DescribeTransitGatewayRouteTables
                  - ec2:DescribeTransitGatewayVpcAttachments
                  - ec2:DescribeTransitGatewayPeeringAttachments
                  - ec2:DescribeTransitGatewayMulticastDomains
                  - ec2:DescribeTransitGatewayConnects
                  - ec2:DescribeTransitGatewayConnectPeers
                  - ec2:ModifyTransitGatewayVpcAttachment
                  - ec2:ModifyTransitGateway
                  - ec2:CreateTransitGatewayPeeringAttachment
                  - ec2:DeleteTransitGatewayPeeringAttachment
                  - ec2:AcceptTransitGatewayPeeringAttachment
                  - ec2:RejectTransitGatewayPeeringAttachment
                  - ec2:CreateTransitGatewayRoute
                  - ec2:DeleteTransitGatewayRoute
                  - ec2:CreateTransitGatewayRouteTable
                  - ec2:DeleteTransitGatewayRouteTable
                  - ec2:AssociateTransitGatewayRouteTable
                  - ec2:DisassociateTransitGatewayRouteTable
                  - ec2:EnableTransitGatewayRouteTablePropagation
                  - ec2:DisableTransitGatewayRouteTablePropagation
                  - ec2:GetTransitGatewayRouteTablePropagations
                  - ec2:GetTransitGatewayRouteTableAssociations
                  - ec2:SearchTransitGatewayRoutes
                  - ec2:GetTransitGatewayAttachmentPropagations
                  - ec2:GetTransitGatewayMulticastDomainAssociations
                  - ec2:SearchTransitGatewayMulticastGroups
                  - ec2:GetTransitGatewayPrefixListReferences
                  - ec2:GetTransitGatewayPolicyTableAssociations
                  - ec2:GetTransitGatewayPolicyTableEntries
                  - ec2:CreateTransitGatewayPolicyTable
                  - ec2:DeleteTransitGatewayPolicyTable
                  - ec2:AssociateTransitGatewayPolicyTable
                  - ec2:DisassociateTransitGatewayPolicyTable
                  - ec2:CreateTransitGatewayRouteTableAnnouncement
                  - ec2:DeleteTransitGatewayRouteTableAnnouncement
                  - ec2:DescribeTransitGatewayRouteTableAnnouncements
                  - ec2:DescribeTransitGatewayPolicyTables
                Resource: "*"
      Path: /
      RoleName: FISChaosExperimentRole

  ExperimentTemplate:
    Type: AWS::FIS::ExperimentTemplate
    Properties:
      Description: "Chaos engineering experiment to disrupt cross-region network connectivity and pause replication for S3 and DynamoDB resources tagged with ChaosAllowed=true"
      StopConditions:
        - Source: none
      RoleArn: !GetAtt FISRole.Arn
      LogConfiguration:
        LogSchemaVersion: 1
        CloudWatchLogsConfiguration:
          LogGroupArn: !GetAtt ExperimentLogGroup.Arn
      Targets:
        TransitGatewayTarget:
          ResourceType: AWS::EC2::TransitGateway
          ResourceTags:
            ChaosAllowed: "true"
          SelectionMode: COUNT(1)
        SubnetTarget:
          ResourceType: AWS::EC2::Subnet
          ResourceTags:
            ChaosAllowed: "true"
          SelectionMode: COUNT(1)
        DynamoDBTableTarget:
          ResourceType: AWS::DynamoDB::Table
          ResourceTags:
            ChaosAllowed: "true"
          SelectionMode: COUNT(1)
      Actions:
        DisruptTransitGatewayConnectivity:
          ActionId: aws:network:disrupt-connectivity
          Description: "Disrupt cross-region connectivity for transit gateways"
          Parameters:
            duration: !Ref ExperimentDuration
            scope: cross-region
          Targets:
            TransitGateways: TransitGatewayTarget
          StartAfter: []
        DisruptSubnetConnectivity:
          ActionId: aws:network:disrupt-connectivity
          Description: "Disrupt cross-region connectivity for subnets"
          Parameters:
            duration: !Ref ExperimentDuration
            scope: cross-region
          Targets:
            Subnets: SubnetTarget
          StartAfter: []
        PauseDynamoDBReplication:
          ActionId: aws:dynamodb:pause-replication
          Description: "Pause DynamoDB global table replication"
          Parameters:
            duration: !Ref ExperimentDuration
          Targets:
            Tables: DynamoDBTableTarget
          StartAfter: []

Outputs:
  ExperimentTemplateId:
    Description: "ID of the created FIS experiment template"
    Value: !Ref ExperimentTemplate
  FISRoleArn:
    Description: "ARN of the IAM role created for FIS"
    Value: !GetAtt FISRole.Arn
  LogGroupName:
    Description: "Name of the CloudWatch log group for experiment logs"
    Value: !Ref ExperimentLogGroup