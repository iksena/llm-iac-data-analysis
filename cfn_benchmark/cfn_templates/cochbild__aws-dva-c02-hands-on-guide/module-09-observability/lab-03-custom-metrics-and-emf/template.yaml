AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Lab 9.3 — PutMetricData vs EMF demonstration

Resources:
  MetricsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: PutMetricData
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"

  MetricsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dva-lab-09-03-metrics
      Runtime: python3.12
      Handler: handler.handler
      Role: !GetAtt MetricsRole.Arn
      CodeUri: src/
      Timeout: 30
      LoggingConfig:
        LogGroup: !Ref LogGroup

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/dva-lab-09-03-metrics
      RetentionInDays: 3

Outputs:
  FunctionName:
    Value: !Ref MetricsFunction