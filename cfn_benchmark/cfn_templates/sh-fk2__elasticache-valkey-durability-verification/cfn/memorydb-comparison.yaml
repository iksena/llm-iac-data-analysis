AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  MemoryDB for Valkey cluster for head-to-head comparison against the
  ElastiCache durability stack. Same family/size (db.r7g.large), CME, TLS,
  Multi-AZ, unauthenticated via the predefined open-access ACL so the
  client connects the same way (ssl=True, no auth) as ElastiCache durable.
  Deploy AFTER the main valkey-durability-test stack; imports its
  VPC / subnets / client SG.
  NOTE: MemoryDB is always synchronously durable (no sync/async toggle),
  so there is no equivalent to the ElastiCache "switch time" test. MemoryDB
  has no single-cluster FIS AZ-power action either, so failover is triggered
  with the failover-shard API (a GRACEFUL/planned failover, weaker than the
  FIS power interruption used against ElastiCache).

Parameters:
  MainStackName:
    Type: String
    Default: valkey-durability-test
    Description: Name of the deployed main stack (source of ImportValue exports).

  ProjectName:
    Type: String
    Default: valkey-dur-test
    AllowedPattern: '^[a-z][a-z0-9-]{1,24}$'
    Description: Must match the ProjectName used by the main stack (lowercase).

  MemoryDBNodeType:
    Type: String
    Default: db.r7g.large
    AllowedValues:
      - db.r7g.large
      - db.r7g.xlarge
      - db.r6g.large
    Description: >-
      MemoryDB node type. Keep the SAME family/size as the ElastiCache
      CacheNodeType (r7g.large) or the latency comparison is meaningless.

  MemoryDBEngineVersion:
    Type: String
    Default: ''
    Description: >-
      Optional Valkey engine version for MemoryDB. Leave empty to let MemoryDB
      pick the latest (recommended - MemoryDB's Valkey versioning is
      independent of ElastiCache's 9.x).

  MemoryDBParameterGroupName:
    Type: String
    Default: ''
    Description: >-
      Optional. Leave empty to use the engine default. If cluster creation
      fails with a parameter-group/engine mismatch, set this explicitly to
      the Valkey default (e.g. default.memorydb-valkey7).

Conditions:
  HasEngineVersion: !Not [!Equals [!Ref MemoryDBEngineVersion, '']]
  HasParameterGroup: !Not [!Equals [!Ref MemoryDBParameterGroupName, '']]

Resources:
  MemoryDBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: MemoryDB Valkey. Inbound 6379 from the benchmark client only.
      VpcId:
        Fn::ImportValue: !Sub '${MainStackName}-VpcId'
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          SourceSecurityGroupId:
            Fn::ImportValue: !Sub '${MainStackName}-ClientSgId'
          Description: Valkey TLS from benchmark client
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-mdb-sg'

  MemoryDBSubnetGroup:
    Type: AWS::MemoryDB::SubnetGroup
    Properties:
      SubnetGroupName: !Sub '${ProjectName}-mdb-subnets'
      Description: Private subnets across two AZs (Multi-AZ)
      SubnetIds:
        !Split
        - ','
        - Fn::ImportValue: !Sub '${MainStackName}-PrivateSubnetIds'

  # 1 shard + 1 replica across 2 AZs. open-access ACL = default user (nopass),
  # so with TLSEnabled the client connects over TLS with no credentials -
  # matching the ElastiCache durable cluster's ssl=True / no-auth connection.
  # At-rest encryption is always on for MemoryDB (service-managed KMS).
  MemoryDBCluster:
    Type: AWS::MemoryDB::Cluster
    Properties:
      ClusterName: !Sub '${ProjectName}-mdb'
      Description: MemoryDB for Valkey - durability comparison target
      Engine: valkey
      EngineVersion: !If [HasEngineVersion, !Ref MemoryDBEngineVersion, !Ref 'AWS::NoValue']
      ParameterGroupName: !If [HasParameterGroup, !Ref MemoryDBParameterGroupName, !Ref 'AWS::NoValue']
      NodeType: !Ref MemoryDBNodeType
      NumShards: 1
      NumReplicasPerShard: 1
      TLSEnabled: true
      ACLName: open-access
      SubnetGroupName: !Ref MemoryDBSubnetGroup
      SecurityGroupIds:
        - !Ref MemoryDBSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-mdb'

Outputs:
  MemoryDBClusterEndpoint:
    Description: MemoryDB cluster configuration endpoint (TLS required)
    Value: !GetAtt MemoryDBCluster.ClusterEndpoint.Address

  MemoryDBClusterName:
    Description: >-
      Cluster name for "aws memorydb failover-shard --cluster-name <this>
      --shard-name <shard>". Find the shard name with
      "aws memorydb describe-clusters --cluster-name <this> --show-shard-details".
    Value: !Ref MemoryDBCluster