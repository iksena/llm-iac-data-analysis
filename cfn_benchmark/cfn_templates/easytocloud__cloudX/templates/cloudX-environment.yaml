Description : >

  This template creates the IAM resources and SSM parameters defining a cloudX environment.
  Users and Instances are created within an Environment.
  Create multiple environments to separate cloudX resources, for instance to use different subnets/VPCs with different connectivity.

Metadata:

  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Configure your cloudX environment"
        Parameters:
          - EnvironmentName
          - Subnet
          - SSODomain
          - SSORegion
          - AbacTag

    ParameterLabels:
      AbacTag:
        default: "Name of the Instance Tag that identifies the user able to operate it"
      EnvironmentName:
        default: "Name of the cloudX environment (e.g. lab)"
      Subnet:
        default: "SubnetId for cloudX instances in existing VPC"
      SSODomain:
        default: "Domain for your AWS SSO Login page (e.g. mycompany.awsapps.com)"
      SSORegion:
        default: "AWS region where your IAM Identity Center instance is hosted (e.g. eu-west-1)"

Parameters:

  Subnet:
    Type: AWS::EC2::Subnet::Id

  AbacTag:
    Type: String
    Default: "cloudX:user"

  EnvironmentName:
    Type: String
    Default: "OTA"

  SSODomain:
    Type: String
    Default: "<my>.awsapps.com"

  SSORegion:
    Type: String
    Default: "eu-west-1"

Resources:

  # Role with permissions the cloudX EC2 instances needs without a user logged in
  EC2InstanceProfileRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - ec2.amazonaws.com
          Action:
          - sts:AssumeRole
      Path: "/"
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/AWSCloud9SSMInstanceProfile
      - arn:aws:iam::aws:policy/AWSCodeArtifactReadOnlyAccess
      - arn:aws:iam::aws:policy/AWSOrganizationsReadOnlyAccess
      - arn:aws:iam::aws:policy/AmazonEC2ReadOnlyAccess
      - arn:aws:iam::aws:policy/AWSCodeCommitReadOnly
      Policies:
      - PolicyName: CloudXProfilePolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - ec2:StopInstances
            - ec2:RebootInstances
            - ec2:TerminateInstances
            - ec2:CreateTags
            Resource: "*"
          - Effect: Deny
            Action:
            - ec2:StopInstances
            - ec2:RebootInstances
            - ec2:TerminateInstances
            - ec2:CreateTags
            Resource: "*"
            Condition:
              ArnNotLike:
                ec2:SourceInstanceARN: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
              "Null":
                ec2:SourceInstanceARN: "false"
          - Effect: Allow
            Action:
            - ssm:GetParameter
            - ssm:GetParameters
            Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cloudX/${EnvironmentName}/*"

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref EC2InstanceProfileRole

  EnvironmentParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /cloudX/${EnvironmentName}/Environment
      Type: String
      Value: !Ref EnvironmentName
      Description: "Environment name for CloudX environment selection"

  ProfileNameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /cloudX/${EnvironmentName}/InstanceProfileName
      Type: String
      Value: !Ref EC2InstanceProfile

  SubnetParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /cloudX/${EnvironmentName}/Subnet
      Type: String
      Value: !Ref Subnet

  AbacTagParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /cloudX/${EnvironmentName}/AbacTag
      Type: String
      Value: !Ref AbacTag

  SecurityGroupParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /cloudX/${EnvironmentName}/SecurityGroup
      Type: String
      Value: !Ref SecurityGroup

  SSODomainParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /cloudX/${EnvironmentName}/SSODomain
      Type: String
      Value: !Ref SSODomain

  SSORegionParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /cloudX/${EnvironmentName}/SSORegion
      Type: String
      Value: !Ref SSORegion

  GroupNameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /cloudX/${EnvironmentName}/IAMGroupName
      Type: String
      Value: !Ref "cloudXGroup"

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for cloudX instances.
      VpcId: !GetAtt VPC.VPCId
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  VPC:
    # custom resource to get the VPC that hosts the subnet
    Type: Custom::VPCId
    Properties:
      ServiceToken: !GetAtt GetVPC.Arn
      SubnetId: !Ref Subnet

  GetVPC:
    # custom resource to get the VPC that hosts the subnet python code
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.handler
      Runtime: python3.12
      Timeout: 30
      Role: !GetAtt GetVPCRole.Arn
      Code:
        ZipFile: |
          import cfnresponse
          import boto3
          import logging
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          def handler(event, context):
              logger.info('Received event: %s', event)
              try:
                  subnet_id = event['ResourceProperties']['SubnetId']
                  ec2 = boto3.resource('ec2')
                  subnet = ec2.Subnet(subnet_id)
                  vpc = ec2.Vpc(subnet.vpc_id)
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {'VPCId': vpc.id}, vpc.id)
              except Exception as e:
                  logger.error('Failed to process:', exc_info=True)
                  cfnresponse.send(event, context, cfnresponse.FAILED, {}, None)

  GetVPCRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
          Action:
          - sts:AssumeRole
      Path: "/"
      Policies:
      - PolicyName: GetVPCPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - ec2:DescribeSubnets
            - ec2:DescribeVpcs
            Resource: "*"

  # Group for cloudX users with permission
  # - to start and connect to their instances via SSH cloudX-proxy
  # - to rotate their AKSK keys for their cloudX-proxy profile
  cloudXGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: !Sub cloudX-${EnvironmentName}-Group
      ManagedPolicyArns:
      - !Ref VSCodeConnectPolicy
      - !Ref AKSKRotationPolicy

  VSCodeConnectPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: "Permissions for cloudX-proxy to start and connect to cloudX user's EC2 instances"
      PolicyDocument: !Sub |
        {
          "Version": "2012-10-17",
          "Statement" : [
            {
              "Sid": "GetStatusWithSSM1",
              "Effect": "Allow",
              "Action": "ssm:DescribeInstanceInformation",
              "Resource": "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*",
              "Condition": {
                "StringLike" : {
                  "aws:ResourceTag/${AbacTag}" : "${!aws:username}"
                }
              }
            },
            {
              "Sid": "GetStatusWithSSM2",
              "Effect": "Allow",
              "Action": "ssm:DescribeInstanceInformation",
              "Resource": "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:*"
            },
            {
              "Sid": "StartEc2",
              "Effect": "Allow",
              "Action": "ec2:StartInstances",
              "Resource": "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*",
              "Condition": {
                "StringLike" : {
                  "aws:ResourceTag/${AbacTag}" : "${!aws:username}"
                }
              }
            },
            {
              "Sid": "StartSession1",
              "Effect": "Allow",
              "Action": "ssm:StartSession",
              "Resource": "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*",
              "Condition": {
                "StringLike" : {
                  "aws:ResourceTag/${AbacTag}" : "${!aws:username}"
                }
              }
            },
            {
              "Sid": "StartSession2",
              "Effect": "Allow",
              "Action": "ssm:StartSession",
              "Resource": "arn:aws:ssm:${AWS::Region}::document/AWS-StartSSHSession"
            },
            {
              "Sid": "AllowSendPubKey",
              "Effect": "Allow",
              "Action" : [
                "ec2-instance-connect:SendSSHPublicKey"
              ],
              "Resource": "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*",
              "Condition": {
                "StringLike" : {
                  "aws:ResourceTag/${AbacTag}" : "${!aws:username}"
                }
              }
            }
          ]
        }

  AKSKRotationPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Permission to rotate AKSK
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Sid: AllowAKSKRotation
          Effect: Allow
          Action:
          - iam:CreateAccessKey
          - iam:DeleteAccessKey
          - iam:ListAccessKeys
          - iam:UpdateAccessKey
          Resource: ["arn:aws:iam::*:user/${aws:username}"]

  CloudXSetupDocument:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Command
      DocumentFormat: YAML
      TargetType: /AWS/EC2/Instance
      Content:
        schemaVersion: '2.2'
        description: 'cloudX instance setup and configuration - managed by SSM State Manager'
        parameters:
          InstallNvm:
            type: String
            default: "false"
            allowedValues: ["true", "false"]
          InstallDocker:
            type: String
            default: "false"
            allowedValues: ["true", "false"]
          InstallPrivpage:
            type: String
            default: "true"
            allowedValues: ["true", "false"]
          InstallFortools:
            type: String
            default: "true"
            allowedValues: ["true", "false"]
          NvmVersion:
            type: String
            default: "0.40.3"
          ShutdownTimeout:
            type: String
            default: "10"
          EnvironmentName:
            type: String
            default: "OTA"
        mainSteps:

          - name: base
            action: aws:runShellScript
            inputs:
              runCommand:
                - yum update -y
                - yum install -y git jq yq util-linux-user wget ruby ruby-devel rubygems
                - |
                  if ! yum grouplist installed | grep -q "Development Tools"; then
                    yum groupinstall -y 'Development Tools'
                  else
                    echo "Development Tools group already installed"
                  fi
                - ruby --version && gem --version
                - mkdir -p /home/ec2-user/.cloudX /home/ec2-user/environment /home/ec2-user/.aws /home/ec2-user/.config/direnv/lib
                - touch /home/ec2-user/.install-running /home/ec2-user/.cloudxrc /home/ec2-user/.cloudx.bash /home/ec2-user/.cloudx.zsh
                - chown -R ec2-user:ec2-user /home/ec2-user/.cloudX /home/ec2-user/.aws /home/ec2-user/.config
                - chown    ec2-user:ec2-user /home/ec2-user/environment /home/ec2-user/.install-running /home/ec2-user/.cloudxrc /home/ec2-user/.cloudx.bash /home/ec2-user/.cloudx.zsh

          - name: autoshutdown
            action: aws:runShellScript
            inputs:
              runCommand:
                - |
                  cat > /home/ec2-user/.cloudX/autoshutdown-configuration << 'EOCONF'
                  SHUTDOWN_TIMEOUT={{ ShutdownTimeout }}
                  EOCONF
                  chmod 644 /home/ec2-user/.cloudX/autoshutdown-configuration
                  chown ec2-user:ec2-user /home/ec2-user/.cloudX/autoshutdown-configuration
                - |
                  cat > /home/ec2-user/.cloudX/stop-if-inactive.sh << 'EOSCRIPT'
                  #!/bin/bash
                  #
                  # Based on AWS default cloud9 script, this is an improved version for use with C9 and VSCODE
                  #
                  # How it works:
                  #
                  # systemd - by means of /etc/system.d/system/cloudX-automatic-shutdown - runs this script every minute
                  # the script schedules a shutdown in 'SHUTDOWN_TIMEOUT' minutes when instance is idle
                  # if whithin the shutdown timeout period activity is detected (e.g. reconnect), the shutdown is canceled

                  # idle detection is
                  # - no vfs connected
                  # - no vscode-server running

                  # shutdown creates a file /run/systemd/shutdown/scheduled.
                  # shutdown -c doesn't remove the file, the cancel_shutdown function does.
                  # the existence of the file is checked by is_shutting_down as a reliable indicator
                  # of a shutdown being scheduled. if not - just to be sure - pgrep is used to check
                  # if a shutdown process is running

                  # active ssh/ssm sessions are not taken into account for idle detection !!

                  # -- functions --

                  exec 3> /home/ec2-user/.cloudX/autoshutdown-log

                  is_ec2user_connected()
                  {
                      printf "\n$(date): output is_ec2user_connected():\n" >&3

                      # check if server has established connection

                      established=$(/usr/bin/lsof -i -a -u ec2-user | grep 'ESTABLISHED' )
                      if [[ -z "$established" ]]; then
                          echo "no established connection found" >&3
                          return 1
                      fi
                      printf "established connections:\n $established" >&3

                      return 0
                  }

                  is_active()
                  {
                      is_ec2user_connected
                  }

                  is_shutting_down() {
                      local FILE
                      FILE=/run/systemd/shutdown/scheduled
                      if [[ -f "$FILE" ]]; then
                          return 0
                      else
                          pgrep -f /sbin/shutdown >/dev/null
                      fi
                  }

                  cancel_shutdown()
                  {
                      sudo shutdown -c
                      sudo rm -f /run/systemd/shutdown/scheduled
                  }

                  # -- main --

                  set -euo pipefail
                  CONFIG=$(cat /home/ec2-user/.cloudX/autoshutdown-configuration)
                  SHUTDOWN_TIMEOUT=${CONFIG#*=}
                  if ! [[ $SHUTDOWN_TIMEOUT =~ ^[0-9]*$ ]]; then
                      printf "\n*** shutdown timeout is invalid in /home/ec2-user/.cloudX/autoshutdown-configuration\n*** AUTOSHUTDOWN deactivated" >&3
                      exit 1
                  fi

                  touch "/home/ec2-user/.cloudX/autoshutdown-timestamp"

                  echo "$(date): starting evaluation" >&3

                  if is_active; then
                      printf "\n$(date): activity detected, " >&3
                      if is_shutting_down; then
                          cancel_shutdown
                          echo "canceled shutdown " >&3
                      else
                          echo "not shutting down" >&3
                      fi
                  else
                      printf "\n$(date): NO activity detected, " >&3
                      if ! is_shutting_down ; then
                          sudo shutdown -h $SHUTDOWN_TIMEOUT
                          echo "initiated shutdown with waiting time of ${SHUTDOWN_TIMEOUT} minutes" >&3
                      else
                          echo "shutdown still scheduled ${SHUTDOWN_TIMEOUT} minutes after $(stat -c '%z' /run/systemd/shutdown/scheduled | cut -f2 -d' ' | cut -f-2 -d: )" >&3
                      fi
                  fi
                  EOSCRIPT
                  chmod 755 /home/ec2-user/.cloudX/stop-if-inactive.sh
                  chown ec2-user:ec2-user /home/ec2-user/.cloudX/stop-if-inactive.sh
                - |
                  cat > /etc/systemd/system/cloudX-automatic-shutdown.service << 'EOSERVICE'
                  [Unit]
                  Description=Stop system when idle
                  Wants=cloudX-automatic-shutdown.timer

                  [Service]
                  ExecStart=/home/ec2-user/.cloudX/stop-if-inactive.sh
                  Type=oneshot

                  [Install]
                  WantedBy=multi-user.target
                  EOSERVICE
                  chmod 644 /etc/systemd/system/cloudX-automatic-shutdown.service
                - |
                  cat > /etc/systemd/system/cloudX-automatic-shutdown.timer << 'EOTIMER'
                  [Unit]
                  Description=Stop system when idle
                  Requires=cloudX-automatic-shutdown.service

                  [Timer]
                  Unit=cloudX-automatic-shutdown.service
                  OnCalendar=*-*-* *:*:00

                  [Install]
                  WantedBy=timers.target
                  EOTIMER
                  chmod 644 /etc/systemd/system/cloudX-automatic-shutdown.timer
                - sed -i '/pam_nologin.so/s/^/# /' /etc/pam.d/sshd
                - systemctl daemon-reload
                - systemctl enable --now cloudX-automatic-shutdown.timer

          - name: install_add_to_rc
            action: aws:runShellScript
            inputs:
              runCommand:
                - |
                  cat > /usr/local/bin/add-to-rc << 'EOADD'
                  #!/bin/bash
                  # add-to-rc - Manage named blocks in shell rc files
                  #
                  # Usage:
                  #   add-to-rc [OPTIONS] <name> [line ...]
                  #   echo "content" | add-to-rc [OPTIONS] <name>
                  #
                  # Options:
                  #   --bash         Write to ~/.cloudx.bash  (bash-specific config)
                  #   --zsh          Write to ~/.cloudx.zsh   (zsh-specific config)
                  #   --file <path>  Write to a specific file
                  #   --remove       Remove the named block
                  #
                  # Default target: ~/.cloudxrc  (sourced by all shells)
                  #
                  # Blocks in the target file look like:
                  #   # BEGIN:<name>
                  #   ...content...
                  #   # END:<name>
                  #
                  # Re-running with the same <name> replaces the existing block (upsert).

                  set -euo pipefail

                  TARGET="${HOME}/.cloudxrc"
                  REMOVE=false

                  while [[ $# -gt 0 ]]; do
                      case "$1" in
                          --bash)   TARGET="${HOME}/.cloudx.bash"; shift ;;
                          --zsh)    TARGET="${HOME}/.cloudx.zsh";  shift ;;
                          --file)   TARGET="$2"; shift 2 ;;
                          --remove) REMOVE=true; shift ;;
                          --)       shift; break ;;
                          -*)       echo "add-to-rc: unknown option: $1" >&2; exit 1 ;;
                          *)        break ;;
                      esac
                  done

                  [[ $# -ge 1 ]] || { echo "add-to-rc: <name> argument required" >&2; exit 1; }

                  NAME="$1"; shift
                  BEGIN_MARKER="# BEGIN:${NAME}"
                  END_MARKER="# END:${NAME}"

                  touch "$TARGET"

                  # Remove existing block if present (awk is portable across GNU/BSD)
                  if grep -qF "$BEGIN_MARKER" "$TARGET" 2>/dev/null; then
                      awk -v b="$BEGIN_MARKER" -v e="$END_MARKER" \
                          '$0==b{skip=1;next} $0==e{skip=0;next} !skip' \
                          "$TARGET" > "${TARGET}.tmp" && mv "${TARGET}.tmp" "$TARGET"
                  fi

                  [[ "$REMOVE" == true ]] && exit 0

                  # Collect content: remaining args (one line each) or stdin
                  if [[ $# -gt 0 ]]; then
                      CONTENT=$(printf '%s\n' "$@")
                  else
                      CONTENT=$(cat)
                  fi

                  # Append the named block
                  {
                      printf '\n%s\n' "$BEGIN_MARKER"
                      printf '%s\n' "$CONTENT"
                      printf '%s\n' "$END_MARKER"
                  } >> "$TARGET"
                  EOADD
                  chmod 755 /usr/local/bin/add-to-rc

          - name: install_direnv_layouts
            action: aws:runShellScript
            inputs:
              runCommand:
                - |
                  cat > /home/ec2-user/.config/direnv/lib/layout_codeartifact.sh << 'EOCA'
                  #!/usr/bin/env bash
                  # layout_codeartifact - direnv layout for AWS CodeArtifact integration
                  # Supports pip, uv, and twine publishing
                  #
                  # Configuration File (optional): ~/.config/codeartifact/codeartifact.conf
                  # Format:
                  #   domain="your-domain"
                  #   account="123456789012"
                  #   region="us-east-1"
                  #   repository="your-repo"
                  #
                  # If config file exists, values are used as defaults.
                  # Command-line parameters override config file values.

                  layout_codeartifact() {
                      local usage="usage: layout_codeartifact [pip] [publish] [uv] [domain=<domain>] [account=<account>] [region=<region>] [repository=<repo>] [profile=<profile>]"

                      # Initialize defaults
                      local domain=""
                      local account=""
                      local region=""
                      local repository=""
                      local profile=""

                      # Load defaults from config file if it exists
                      if [ -f ~/.config/codeartifact/codeartifact.conf ]; then
                          source ~/.config/codeartifact/codeartifact.conf
                          # Config file variables: domain, account, region, repository
                      fi

                      local enable_pip=false
                      local enable_publish=false
                      local enable_uv=false
                      local modes_explicit=false

                      # Parse arguments (override config file defaults)
                      for arg in "$@"; do
                          case "$arg" in
                              pip)
                                  enable_pip=true
                                  modes_explicit=true
                                  ;;
                              publish)
                                  enable_publish=true
                                  modes_explicit=true
                                  ;;
                              uv)
                                  enable_uv=true
                                  modes_explicit=true
                                  ;;
                              domain=*)
                                  domain=${arg#domain=}
                                  ;;
                              account=*)
                                  account=${arg#account=}
                                  ;;
                              region=*)
                                  region=${arg#region=}
                                  ;;
                              repository=*)
                                  repository=${arg#repository=}
                                  ;;
                              profile=*)
                                  profile=${arg#profile=}
                                  ;;
                              -h|--help|help)
                                  log_status "$usage"
                                  return 0
                                  ;;
                              *)
                                  log_error "Unknown argument: $arg"
                                  log_error "$usage"
                                  return 1
                                  ;;
                          esac
                      done

                      # If no modes specified, enable all
                      if [[ $modes_explicit == false ]]; then
                          enable_pip=true
                          enable_publish=true
                          enable_uv=true
                      fi

                      # Validate required parameters (account is optional, will be inferred from credentials)
                      if [[ -z "$domain" || -z "$region" || -z "$repository" ]]; then
                          log_error "Missing required CodeArtifact parameters."
                          log_error "Either create ~/.config/codeartifact/codeartifact.conf with defaults, or provide required parameters:"
                          log_error "  domain=<domain> region=<region> repository=<repository>"
                          log_error "Optional: account=<account> (will be inferred from AWS credentials if not provided)"
                          log_error "$usage"
                          return 1
                      fi

                      # Build optional arguments
                      local profile_args=()
                      if [[ -n $profile ]]; then
                          profile_args=(--profile "$profile")
                      fi

                      local account_args=()
                      if [[ -n $account ]]; then
                          account_args=(--domain-owner "$account")
                      fi

                      # If account not provided, get it from AWS credentials
                      if [[ -z "$account" ]]; then
                          account=$(aws sts get-caller-identity --query Account --output text "${profile_args[@]}")
                      fi

                      local host="${domain}-${account}.d.codeartifact.${region}.amazonaws.com"
                      local repo_base="https://${host}/pypi/${repository}"

                      # Get CodeArtifact token if needed
                      local token=""
                      if [[ $enable_uv == true || $enable_publish == true ]]; then
                          if ! token=$(aws codeartifact get-authorization-token \
                                  --domain "$domain" \
                                  --region "$region" \
                                  --query authorizationToken \
                                  --output text \
                                  "${account_args[@]}" \
                                  "${profile_args[@]}"); then
                              log_error "Failed to obtain CodeArtifact token"
                              return 1
                          fi
                      fi

                      # Configure uv
                      if [[ $enable_uv == true ]]; then
                          local repo_env
                          repo_env=$(printf '%s' "$repository" | tr '[:lower:]' '[:upper:]' | tr '-' '_')

                          export "UV_INDEX=${repository}=${repo_base}/simple/"
                          export "UV_INDEX_${repo_env}_USERNAME=aws"
                          export "UV_INDEX_${repo_env}_PASSWORD=$token"

                          log_status "uv configured to use CodeArtifact ($repository in ${domain}/$region)"
                      fi

                      # Configure uv publish
                      if [[ $enable_publish == true ]]; then
                          export UV_PUBLISH_URL="https://aws:${token}@${host}/pypi/${repository}/"
                          export UV_PUBLISH_USERNAME="aws"
                          export UV_PUBLISH_PASSWORD="$token"

                          log_status "uv publish configured for CodeArtifact ($repository in ${domain}/$region)"
                      fi

                      # Configure pip
                      if [[ $enable_pip == true ]]; then
                          if ! aws codeartifact login --tool pip \
                                  --domain "$domain" \
                                  --repository "$repository" \
                                  --region "$region" \
                                  "${account_args[@]}" \
                                  "${profile_args[@]}" \
                                  > /dev/null 2>&1; then
                              log_error "Failed to configure pip for CodeArtifact"
                              return 1
                          fi

                          log_status "pip configured to use CodeArtifact ($repository in ${domain}/$region)"
                      fi
                  }
                  EOCA
                  chmod 644 /home/ec2-user/.config/direnv/lib/layout_codeartifact.sh
                  chown ec2-user:ec2-user /home/ec2-user/.config/direnv/lib/layout_codeartifact.sh
                - |
                  cat > /home/ec2-user/.config/direnv/lib/layout_uv.sh << 'EOUV'
                  #!/usr/bin/env bash
                  # layout_uv - direnv layout for uv Python environments
                  # Sets up Python virtual environment using uv (similar to layout python)

                  layout_uv() {
                      # Check if uv is installed
                      if ! command -v uv &> /dev/null; then
                          log_error "uv is not installed. Please install it first: https://docs.astral.sh/uv/"
                          return 1
                      fi

                      # Create .venv if it doesn't exist, passing any args (e.g. --python python3.11)
                      if [[ ! -d .venv ]]; then
                          log_status "Creating virtual environment with uv $*"
                          uv venv --seed "$@"
                      fi

                      # Sync dependencies if project files exist
                      if [[ -f pyproject.toml ]] || [[ -f requirements.txt ]]; then
                          # Watch files to trigger re-sync on changes
                          watch_file pyproject.toml 2>/dev/null || true
                          watch_file uv.lock 2>/dev/null || true
                          watch_file requirements.txt 2>/dev/null || true

                          log_status "Syncing dependencies..."
                          if [[ -f pyproject.toml ]]; then
                              # Try frozen sync first (fast), fall back to full sync if needed
                              uv sync --frozen 2>/dev/null || uv sync
                          elif [[ -f requirements.txt ]]; then
                              uv pip install -r requirements.txt
                          fi
                      fi

                      # Activate the virtual environment
                      export VIRTUAL_ENV="$PWD/.venv"
                      PATH_add "$VIRTUAL_ENV/bin"

                      # Set Python-related environment variables
                      export UV_PROJECT_ENVIRONMENT="$VIRTUAL_ENV"

                      log_status "uv environment is activated: $VIRTUAL_ENV"
                  }
                  EOUV
                  chmod 644 /home/ec2-user/.config/direnv/lib/layout_uv.sh
                  chown ec2-user:ec2-user /home/ec2-user/.config/direnv/lib/layout_uv.sh
                - |
                  cat > /usr/local/bin/banner << 'EOBANNER'
                  #!/bin/bash
                  # Wrapper for AL2023 to display banners via uv/pyfiglet
                  if [[ "$#" -eq 0 ]]; then
                      echo "Usage: banner string" >&2
                      exit 2
                  fi
                  uvx pyfiglet "$@"
                  EOBANNER
                  chmod 755 /usr/local/bin/banner

          - name: write_bootstrap
            action: aws:runShellScript
            inputs:
              runCommand:
                - |
                  cat > /tmp/cloudx-user-bootstrap.sh << 'EOBOOT'
                  #!/bin/bash
                  set -euo pipefail

                  trap 'rm -f /home/ec2-user/.install-running' ERR

                  INSTALL_NVM="{{ InstallNvm }}"
                  NVM_VERSION="{{ NvmVersion }}"
                  INSTALL_PRIVPAGE="{{ InstallPrivpage }}"
                  INSTALL_FORTOOLS="{{ InstallFortools }}"
                  _TOKEN=$(curl -sf -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 60")
                  REGION=$(curl -sf -H "X-aws-ec2-metadata-token: $_TOKEN" http://169.254.169.254/latest/meta-data/placement/region)
                  SSO_DOMAIN=$(aws ssm get-parameter --name "/cloudX/{{ EnvironmentName }}/SSODomain" --query 'Parameter.Value' --output text)
                  SSO_REGION=$(aws ssm get-parameter --name "/cloudX/{{ EnvironmentName }}/SSORegion" --query 'Parameter.Value' --output text)
                  CLOUDX_HOME="/home/ec2-user/.cloudX"
                  EC2_USER_HOME="/home/ec2-user"

                  configure_git() {
                      git config --global credential.helper '!aws codecommit credential-helper $@'
                      git config --global credential.UseHttpPath true
                  }

                  ensure_homebrew() {
                      if ! command -v brew &> /dev/null; then
                          echo "Installing Homebrew..."
                          NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
                      else
                          echo "Homebrew already installed"
                      fi

                      eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
                      brew tap easytocloud/tap >/dev/null 2>&1 || true
                      brew trust easytocloud/tap >/dev/null 2>&1 || true
                  }

                  ensure_direnv() {
                      if ! command -v direnv &> /dev/null; then
                          echo "Installing direnv..."
                          brew install direnv
                      else
                          echo "direnv already installed"
                      fi
                  }

                  ensure_uv() {
                      if ! command -v uv &> /dev/null; then
                          echo "Installing uv..."
                          brew install uv
                      else
                          echo "uv already installed"
                      fi
                  }

                  ensure_zsh_stack() {
                      if [ ! -d ~/.oh-my-zsh ]; then
                          echo "Installing zsh and oh-my-zsh..."
                          brew install zsh easytocloud/tap/sso-tools
                          cd /home/ec2-user || exit 1
                          sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended
                          sh -c "$(curl -fsSL https://raw.githubusercontent.com/easytocloud/oh-my-easytocloud/main/install.sh)"

                          echo '/home/linuxbrew/.linuxbrew/bin/zsh' | sudo tee -a /etc/shells >/dev/null
                      else
                          echo "zsh already installed"
                      fi
                  }

                  install_fortools() {
                      if [[ "$INSTALL_FORTOOLS" != "true" ]]; then
                          return
                      fi

                      if ! command -v for-account &> /dev/null; then
                          echo "Installing for-tools..."
                          brew install easytocloud/tap/for-tools
                      else
                          echo "for-tools already installed"
                      fi
                  }

                  install_nvm_stack() {
                      if [[ "$INSTALL_NVM" != "true" ]]; then
                          return
                      fi

                      if [ ! -d ~/.nvm ]; then
                          echo "Installing nvm ${NVM_VERSION}..."
                          curl -o- "https://raw.githubusercontent.com/nvm-sh/nvm/v${NVM_VERSION}/install.sh" | bash
                      else
                          installed_version=$(cat ~/.nvm/package.json 2>/dev/null | grep '"version"' | head -1 | tr -d ' ",' | cut -d: -f2 || echo "unknown")
                          if [ "$installed_version" != "$NVM_VERSION" ]; then
                              echo "Upgrading nvm from ${installed_version} to ${NVM_VERSION}..."
                              curl -o- "https://raw.githubusercontent.com/nvm-sh/nvm/v${NVM_VERSION}/install.sh" | bash
                          else
                              echo "nvm ${NVM_VERSION} already installed"
                          fi
                      fi
                  }

                  install_privpage_stack() {
                      if [[ "$INSTALL_PRIVPAGE" != "true" ]]; then
                          return
                      fi

                      if ! command -v privpage &> /dev/null; then
                          echo "Installing privpage..."
                          brew install easytocloud/tap/privpage
                      else
                          echo "privpage already installed"
                      fi
                  }

                  setup_rc_files() {
                      local bashrc="$EC2_USER_HOME/.bashrc"
                      local zshrc="$EC2_USER_HOME/.zshrc"

                      # Wire .bashrc to source the cloudX rc files
                      add-to-rc --file "$bashrc" cloudxrc \
                          '[ -f "${HOME}/.cloudxrc" ]    && . "${HOME}/.cloudxrc"' \
                          '[ -f "${HOME}/.cloudx.bash" ] && . "${HOME}/.cloudx.bash"'

                      # Wire .zshrc to source the cloudX rc files (created by ensure_zsh_stack)
                      if [ -f "$zshrc" ]; then
                          add-to-rc --file "$zshrc" cloudxrc \
                              '[ -f "${HOME}/.cloudxrc" ]   && . "${HOME}/.cloudxrc"' \
                              '[ -f "${HOME}/.cloudx.zsh" ] && . "${HOME}/.cloudx.zsh"'
                      fi

                      # oh-my-zsh hygiene, written to ~/.zshenv so it applies BEFORE
                      # `source $ZSH/oh-my-zsh.sh` runs in ~/.zshrc (zsh reads .zshenv first):
                      #   1. Disable oh-my-zsh's self-updater. Updates are delivered via SSM
                      #      State Manager; an uncontrolled `omz update` moves completion files
                      #      under $ZSH (all in fpath) and leaves a stale FPATH / ~/.zcompdump.
                      #   2. Seed Homebrew's site-functions into fpath so the single compinit
                      #      that oh-my-zsh runs already sees brew completions.
                      add-to-rc --file "$EC2_USER_HOME/.zshenv" cloudx-omz \
                          "zstyle ':omz:update' mode disabled" \
                          '[ -d /home/linuxbrew/.linuxbrew/share/zsh/site-functions ] && fpath=(/home/linuxbrew/.linuxbrew/share/zsh/site-functions $fpath)'

                      # Common: Homebrew shell env (both bash and zsh)
                      add-to-rc brew \
                          'eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"'

                      # Shell-specific: direnv hook
                      add-to-rc --bash direnv 'eval "$(direnv hook bash)"'
                      add-to-rc --zsh  direnv 'eval "$(direnv hook zsh)"'

                      # Shell-specific: AWS CLI completion
                      add-to-rc --bash aws-complete \
                          'complete -C aws_completer aws'
                      # aws_completer is an external completer (complete -C), so it only needs
                      # bashcompinit. compinit is run once by oh-my-zsh with a fully-populated
                      # fpath (see the cloudx-omz block in ~/.zshenv) — a second compinit here
                      # wrote a separate ~/.zcompdump and could go stale, so it is removed.
                      add-to-rc --zsh aws-complete \
                          'autoload -Uz bashcompinit && bashcompinit' \
                          'complete -C aws_completer aws'

                      if [[ "$INSTALL_PRIVPAGE" == "true" ]]; then
                          add-to-rc privpage 'export AWS_PAGER=privpage'
                      fi

                      if [[ "$INSTALL_NVM" == "true" ]]; then
                          add-to-rc nvm \
                              'export NVM_DIR="$HOME/.nvm"' \
                              '[ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"'
                      fi

                      # Write ~/.aws/config with SSO setup
                      if [ ! -f "$EC2_USER_HOME/.aws/config" ] || ! grep -q 'sso-session sso' "$EC2_USER_HOME/.aws/config"; then
                          cat > "$EC2_USER_HOME/.aws/config" << AWSCONF
                  [sso-session sso]
                  sso_start_url = https://${SSO_DOMAIN}/start#/
                  sso_region = ${SSO_REGION}
                  sso_registration_scopes = sso:account:access
                  sso_token_provider = aws-toolkit

                  [profile default]
                  sso_session = sso
                  region = ${REGION}
                  output = json

                  [profile sso-browser]
                  sso_session = sso
                  region = ${REGION}
                  output = json
                  sso_account_id = "REPLACE WITH YOU MAIN ACCOUNT ID"
                  sso_role_name = "REPLACE WITH YOUR SSO READONLY ROLE NAME"
                  AWSCONF
                          chmod 600 "$EC2_USER_HOME/.aws/config"
                          chown ec2-user:ec2-user "$EC2_USER_HOME/.aws/config"
                      fi
                  }

                  main_user_setup() {
                      configure_git
                      ensure_homebrew
                      ensure_direnv
                      ensure_uv
                      ensure_zsh_stack
                      install_fortools
                      install_nvm_stack
                      install_privpage_stack
                      setup_rc_files
                  }

                  main_user_setup
                  EOBOOT
                  chmod 755 /tmp/cloudx-user-bootstrap.sh
                  chown ec2-user:ec2-user /tmp/cloudx-user-bootstrap.sh

          - name: user
            action: aws:runShellScript
            inputs:
              runCommand:
                - /usr/bin/su - ec2-user -c '/bin/bash /tmp/cloudx-user-bootstrap.sh'

          - name: post
            action: aws:runShellScript
            inputs:
              runCommand:
                - |
                  if [ -f /home/linuxbrew/.linuxbrew/bin/zsh ]; then
                    current_shell=$(getent passwd ec2-user | cut -d: -f7)
                    if [ "$current_shell" != "/home/linuxbrew/.linuxbrew/bin/zsh" ]; then
                      chsh -s /home/linuxbrew/.linuxbrew/bin/zsh ec2-user
                    fi
                  else
                    echo "Skipping zsh default shell configuration"
                  fi
                - |
                  # Invalidate cached zsh completion dumps on every convergence. A stale
                  # ~/.zcompdump keeps a stale FPATH after tools change (e.g. an oh-my-zsh
                  # update); removing it forces compinit to rebuild on the next shell.
                  rm -f /home/ec2-user/.zcompdump* 2>/dev/null || true
                - |
                  if [ "{{ InstallDocker }}" = "true" ]; then
                    if ! command -v docker &> /dev/null; then
                      yum install -y docker
                    fi
                    /usr/sbin/usermod -a -G docker ec2-user
                    systemctl enable docker
                    systemctl start docker
                  else
                    echo "Docker installation disabled via parameter"
                  fi
                - |
                  cat > /usr/local/bin/ec2-hostname << 'EOEHOSTNAME'
                  #!/bin/bash
                  TOKEN=$(curl -sf -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 60")
                  curl -sf -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/tags/instance/Name
                  echo
                  EOEHOSTNAME
                  chmod 755 /usr/local/bin/ec2-hostname
                - |
                  INSTANCE_ID=$(TOKEN=$(curl -sf -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 60") && curl -sf -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-id)
                  REGION=$(TOKEN=$(curl -sf -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 60") && curl -sf -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/placement/region)
                  DOCUMENT_NAME="cloudX-{{ EnvironmentName }}-setup"
                  RUN_TIMESTAMP=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
                  VERSION_STRING="${DOCUMENT_NAME}@${RUN_TIMESTAMP}"
                  mkdir -p /home/ec2-user/.cloudX
                  printf '%s\n' "$VERSION_STRING" > /home/ec2-user/.cloudX/version
                  chown ec2-user:ec2-user /home/ec2-user/.cloudX/version
                  aws ec2 create-tags --region "$REGION" --resources "$INSTANCE_ID" --tags "Key=cloudX:version,Value=${VERSION_STRING}" || true
                  touch /home/ec2-user/.install-done
                  rm -f /home/ec2-user/.install-running
                  chown ec2-user:ec2-user /home/ec2-user/.install-done

          # CUSTOMIZATION_MARKER:configSets - Add custom mainSteps here (after the 'post' step)
          # CUSTOMIZATION_MARKER:configSetDefinitions - Each SSM mainStep contains both name and runCommand inline.
          #
          # Shell rc integration via add-to-rc
          # -----------------------------------
          # /usr/local/bin/add-to-rc is installed by install_add_to_rc and available to all steps that run after it.
          # Use it to add named, upsert-safe blocks to the cloudX rc files.
          #
          # Target files (sourced automatically by .bashrc / .zshrc):
          #   ~/.cloudxrc      — loaded by both bash and zsh
          #   ~/.cloudx.bash   — loaded by bash only   (use: add-to-rc --bash <name> ...)
          #   ~/.cloudx.zsh    — loaded by zsh only    (use: add-to-rc --zsh  <name> ...)
          #
          # Example custom step (run as ec2-user):
          #
          #   - name: my_custom_step
          #     action: aws:runShellScript
          #     inputs:
          #       runCommand:
          #         - su - ec2-user -c 'add-to-rc mytool "export MYTOOL_HOME=/opt/mytool"'
          #
          # The <name> is used as the block marker (# BEGIN:<name> / # END:<name>).
          # Re-running with the same name replaces the block — safe to call on re-provisioning.

  AutoUpdateAssociation:
    Type: AWS::SSM::Association
    Properties:
      Name: !Ref CloudXSetupDocument
      AssociationName: !Sub "cloudX-${EnvironmentName}-auto-update"
      Targets:
        - Key: "tag:cloudX:update"
          Values:
            - "auto"
        - Key: "tag:cloudX:environment"
          Values:
            - !Ref EnvironmentName
      Parameters:
        EnvironmentName: [!Ref EnvironmentName]
      ScheduleExpression: "cron(0 2 ? * SUN *)"
      ApplyOnlyAtCronInterval: true
      SyncCompliance: AUTO

  SetupDocumentNameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /cloudX/${EnvironmentName}/SetupDocumentName
      Type: String
      Value: !Ref CloudXSetupDocument
      Description: "Name of the SSM document used to set up cloudX instances"