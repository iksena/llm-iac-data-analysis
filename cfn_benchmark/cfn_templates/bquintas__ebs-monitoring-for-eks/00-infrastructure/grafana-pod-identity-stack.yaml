AWSTemplateFormatVersion: "2010-09-09"
Description: >
  EKS Pod Identity setup for Grafana CloudWatch access.
  Creates an IAM role with a Pod Identity trust policy, installs the
  Pod Identity Agent addon, and creates the association between the
  Grafana service account and the IAM role.
  Much simpler than IRSA — no OIDC provider or issuer URL needed.

Parameters:
  EnvironmentName:
    Type: String
    Default: ebs-eks-poc
    Description: Must match the EnvironmentName used in vpc/eks stacks

  ClusterName:
    Type: String
    Default: ebs-monitoring-demo
    Description: EKS cluster name (must match eks-stack)

  GrafanaNamespace:
    Type: String
    Default: monitoring
    Description: Kubernetes namespace where Grafana will be deployed

  GrafanaServiceAccount:
    Type: String
    Default: grafana
    Description: Kubernetes service account name for Grafana

Resources:
  # --- IAM Role with Pod Identity trust policy ---
  GrafanaPodIdentityRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ClusterName}-grafana-pod-identity"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: pods.eks.amazonaws.com
            Action:
              - sts:AssumeRole
              - sts:TagSession
      Policies:
        - PolicyName: grafana-cloudwatch-readonly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CloudWatchReadOnly
                Effect: Allow
                Action:
                  - cloudwatch:Describe*
                  - cloudwatch:Get*
                  - cloudwatch:List*
                Resource: "*"
              - Sid: EC2ReadOnly
                Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeVolumes
                  - ec2:DescribeRegions
                Resource: "*"
              - Sid: LogsReadOnly
                Effect: Allow
                Action:
                  - logs:DescribeLogGroups
                  - logs:GetLogGroupFields
                  - logs:StartQuery
                  - logs:StopQuery
                  - logs:GetQueryResults
                  - logs:GetLogEvents
                Resource: "*"
              - Sid: TagsReadOnly
                Effect: Allow
                Action:
                  - tag:GetResources
                Resource: "*"
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Purpose
          Value: grafana-cloudwatch-access

  # --- Pod Identity Agent EKS Addon ---
  PodIdentityAgentAddon:
    Type: AWS::EKS::Addon
    Properties:
      ClusterName: !Ref ClusterName
      AddonName: eks-pod-identity-agent
      ResolveConflicts: OVERWRITE

  # --- Pod Identity Association (role ↔ service account) ---
  GrafanaPodIdentityAssociation:
    Type: AWS::EKS::PodIdentityAssociation
    DependsOn: PodIdentityAgentAddon
    Properties:
      ClusterName: !Ref ClusterName
      Namespace: !Ref GrafanaNamespace
      ServiceAccount: !Ref GrafanaServiceAccount
      RoleArn: !GetAtt GrafanaPodIdentityRole.Arn

Outputs:
  GrafanaRoleArn:
    Description: IAM Role ARN for Grafana pod identity
    Value: !GetAtt GrafanaPodIdentityRole.Arn
    Export:
      Name: !Sub "${EnvironmentName}-GrafanaRoleArn"

  PodIdentityAssociation:
    Description: Pod Identity association details
    Value: !Sub "namespace=${GrafanaNamespace}, serviceAccount=${GrafanaServiceAccount}"