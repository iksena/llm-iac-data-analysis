AWSTemplateFormatVersion: '2010-09-09'
Resources:
  OrdersApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: orders
      BodyS3Location:
        Bucket: my-specs
        Key: openapi/orders.json
        Version: '3'
  UriApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      DefinitionUri: s3://my-specs/openapi/orders.json