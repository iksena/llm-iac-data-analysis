AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFormation template to create IAM roles for EventBridge to forward events to centralized event buses'
Parameters:
  TagEnvironment:
    Type: String
    Default: Production
    Description: Environment tag value
  TagProject:
    Type: String
    Default: CentralLogging
    Description: Project tag value
  TagOwner:
    Type: String
    Default: DevOps
    Description: Owner tag value
Mappings:
  EventSourceToBusName:
    CloudWatch:
      BusName: CloudWatch-sink-bus
    CloudFormation:
      BusName: CloudFormation-sink-bus
    CloudTrail:
      BusName: CloudTrail-sink-bus
    GuardDuty:
      BusName: GuardDuty-sink-bus
    Slack:
      BusName: Slack-sink-bus
    AutoScaling:
      BusName: AutoScaling-sink-bus
Resources:
  EventBridgeCloudWatchRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub EventBridge-CloudWatch-SinkRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PutEventsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: events:PutEvents
                Resource: !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/${EventSourceToBusName.CloudWatch.BusName}
      Tags:
        - Key: Environment
          Value: !Ref TagEnvironment
        - Key: Project
          Value: !Ref TagProject
        - Key: Owner
          Value: !Ref TagOwner
  EventBridgeCloudFormationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub EventBridge-CloudFormation-SinkRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PutEventsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: events:PutEvents
                Resource: !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/${EventSourceToBusName.CloudFormation.BusName}
      Tags:
        - Key: Environment
          Value: !Ref TagEnvironment
        - Key: Project
          Value: !Ref TagProject
        - Key: Owner
          Value: !Ref TagOwner
  EventBridgeCloudTrailRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub EventBridge-CloudTrail-SinkRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PutEventsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: events:PutEvents
                Resource: !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/${EventSourceToBusName.CloudTrail.BusName}
      Tags:
        - Key: Environment
          Value: !Ref TagEnvironment
        - Key: Project
          Value: !Ref TagProject
        - Key: Owner
          Value: !Ref TagOwner
  EventBridgeGuardDutyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub EventBridge-GuardDuty-SinkRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PutEventsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: events:PutEvents
                Resource: !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/${EventSourceToBusName.GuardDuty.BusName}
      Tags:
        - Key: Environment
          Value: !Ref TagEnvironment
        - Key: Project
          Value: !Ref TagProject
        - Key: Owner
          Value: !Ref TagOwner
  EventBridgeSlackRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub EventBridge-Slack-SinkRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PutEventsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: events:PutEvents
                Resource: !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/${EventSourceToBusName.Slack.BusName}
      Tags:
        - Key: Environment
          Value: !Ref TagEnvironment
        - Key: Project
          Value: !Ref TagProject
        - Key: Owner
          Value: !Ref TagOwner
  EventBridgeAutoScalingRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub EventBridge-AutoScaling-SinkRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PutEventsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: events:PutEvents
                Resource: !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/${EventSourceToBusName.AutoScaling.BusName}
      Tags:
        - Key: Environment
          Value: !Ref TagEnvironment
        - Key: Project
          Value: !Ref TagProject
        - Key: Owner
          Value: !Ref TagOwner
Outputs:
  CloudWatchRoleArn:
    Description: ARN of the CloudWatch EventBridge role
    Value: !GetAtt EventBridgeCloudWatchRole.Arn
  CloudFormationRoleArn:
    Description: ARN of the CloudFormation EventBridge role
    Value: !GetAtt EventBridgeCloudFormationRole.Arn
  CloudTrailRoleArn:
    Description: ARN of the CloudTrail EventBridge role
    Value: !GetAtt EventBridgeCloudTrailRole.Arn
  GuardDutyRoleArn:
    Description: ARN of the GuardDuty EventBridge role
    Value: !GetAtt EventBridgeGuardDutyRole.Arn
  SlackRoleArn:
    Description: ARN of the Slack EventBridge role
    Value: !GetAtt EventBridgeSlackRole.Arn
  AutoScalingRoleArn:
    Description: ARN of the Auto Scaling EventBridge role
    Value: !GetAtt EventBridgeAutoScalingRole.Arn