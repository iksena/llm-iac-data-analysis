AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  Route 53 records pointing a hostname at a load balancer, CloudFront
  distribution or API Gateway domain - as an alias where possible, with an
  optional health check for failover.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Naming
        Parameters:
          - NamePrefix
          - Environment
      - Label:
          default: Record
        Parameters:
          - HostedZoneId
          - RecordName
          - RecordType
      - Label:
          default: Alias target (leave empty for a plain record)
        Parameters:
          - AliasTargetDnsName
          - AliasTargetHostedZoneId
      - Label:
          default: Plain record value
        Parameters:
          - RecordValue
          - TtlSeconds
      - Label:
          default: Health check
        Parameters:
          - EnableHealthCheck
          - HealthCheckPath

Parameters:
  NamePrefix:
    Type: String
    Description: Prefix used in the health check's Name tag.
    AllowedPattern: "^[a-z][a-z0-9-]{1,30}[a-z0-9]$"
    ConstraintDescription: 3-32 lowercase characters, digits and hyphens.

  Environment:
    Type: String
    Description: Environment these records serve.
    Default: dev
    AllowedValues: [dev, staging, prod]

  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Hosted zone the record is created in.

  RecordName:
    Type: String
    Description: >-
      Fully qualified record name, e.g. api.example.com. Route 53 appends the
      zone name if you omit it, which is a common source of
      api.example.com.example.com.
    AllowedPattern: "^([a-z0-9*]([a-z0-9-]*[a-z0-9])?\\.)+[a-z]{2,}$"

  RecordType:
    Type: String
    Description: >-
      A for IPv4, AAAA for IPv6, CNAME for a name. Note a CNAME cannot exist at a
      zone apex - that is exactly what alias records are for.
    Default: A
    AllowedValues: [A, AAAA, CNAME, TXT]

  AliasTargetDnsName:
    Type: String
    Description: >-
      DNS name of an AWS resource to alias, e.g. an ALB's DNSName. Alias records
      are free to resolve, work at the zone apex where a CNAME cannot, and follow
      the target when its address changes. Leave empty for a plain record.
    Default: ""

  AliasTargetHostedZoneId:
    Type: String
    Description: >-
      The *target's* canonical hosted zone ID - not the zone the record lives in.
      Every AWS resource that can be aliased exposes one; using the wrong zone ID
      produces a record that resolves to nothing.
    Default: ""

  RecordValue:
    Type: String
    Description: Value for a plain (non-alias) record.
    Default: ""

  TtlSeconds:
    Type: Number
    Description: >-
      TTL for a plain record. Lower it well before a planned cutover - resolvers
      cache for the old TTL, so changing it on the day has no effect.
    Default: 300
    MinValue: 0
    MaxValue: 172800

  EnableHealthCheck:
    Type: String
    Description: >-
      Create a Route 53 health check against the record. Only useful as part of a
      failover or weighted routing setup; on a single record it observes without
      changing anything.
    Default: "false"
    AllowedValues: ["true", "false"]

  HealthCheckPath:
    Type: String
    Description: Path the health check requests over HTTPS.
    Default: /healthz

Conditions:
  IsAlias: !Not [!Equals [!Ref AliasTargetDnsName, ""]]
  IsPlainRecord: !Equals [!Ref AliasTargetDnsName, ""]
  ShouldCreateHealthCheck: !Equals [!Ref EnableHealthCheck, "true"]

Resources:
  HealthCheck:
    Type: AWS::Route53::HealthCheck
    Condition: ShouldCreateHealthCheck
    Properties:
      HealthCheckConfig:
        Type: HTTPS
        FullyQualifiedDomainName: !Ref RecordName
        ResourcePath: !Ref HealthCheckPath
        Port: 443
        RequestInterval: 30
        FailureThreshold: 3
        # Route 53 health checkers come from published AWS ranges worldwide. A
        # security group that only admits your own CIDRs marks the endpoint
        # unhealthy from every checker.
        MeasureLatency: false
      HealthCheckTags:
        - Key: Name
          Value: !Sub "${NamePrefix}-${Environment}"

  # Two resources rather than one with Fn::If. An alias record may not carry TTL
  # or ResourceRecords, and CloudFormation's schema enforces that structurally —
  # a single resource with all the properties present, even guarded by
  # conditions, is rejected before the conditions are evaluated.
  AliasRecord:
    Type: AWS::Route53::RecordSet
    Condition: IsAlias
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref RecordName
      Type: !Ref RecordType
      AliasTarget:
        DNSName: !Ref AliasTargetDnsName
        HostedZoneId: !Ref AliasTargetHostedZoneId
        # Only meaningful with a health check attached; harmless otherwise.
        EvaluateTargetHealth: true

  PlainRecord:
    Type: AWS::Route53::RecordSet
    Condition: IsPlainRecord
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref RecordName
      Type: !Ref RecordType
      TTL: !Ref TtlSeconds
      ResourceRecords: [!Ref RecordValue]

Outputs:
  RecordName:
    Description: Fully qualified name of the record created.
    Value: !If [IsAlias, !Ref AliasRecord, !Ref PlainRecord]

  HealthCheckId:
    Description: Health check ID, for use in a failover or weighted record set.
    Condition: ShouldCreateHealthCheck
    Value: !Ref HealthCheck