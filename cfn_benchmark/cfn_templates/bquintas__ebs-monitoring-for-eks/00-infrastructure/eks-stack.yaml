AWSTemplateFormatVersion: "2010-09-09"
Description: >
  EKS Cluster + Managed Node Group for EBS Monitoring PoC.
  Deploys a minimal EKS cluster with a node group using GP2 root volumes
  to demonstrate BurstBalance depletion and leading-indicator alerting.
  Imports VPC resources from the vpc-stack via cross-stack references.

Parameters:
  EnvironmentName:
    Type: String
    Default: ebs-eks-poc
    Description: Must match the EnvironmentName used in vpc-stack

  ClusterName:
    Type: String
    Default: ebs-monitoring-demo
    Description: EKS cluster name

  KubernetesVersion:
    Type: String
    Default: "1.32"
    AllowedValues: ["1.29", "1.30", "1.31", "1.32"]
    Description: Kubernetes version for the EKS cluster

  NodeInstanceType:
    Type: String
    Default: t3.medium
    Description: EC2 instance type for worker nodes
    AllowedValues:
      - t3.small
      - t3.medium
      - t3.large
      - m5.large

  NodeGroupDesiredSize:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 5
    Description: Desired number of worker nodes

  NodeGroupMinSize:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 3

  NodeGroupMaxSize:
    Type: Number
    Default: 4
    MinValue: 2
    MaxValue: 10

  NodeRootVolumeSize:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 100
    Description: >
      Root volume size in GiB (same for both GP2 and GP3 node groups).
      For GP2, baseline IOPS = size × 3. A 20 GiB volume has baseline 100 IOPS
      (minimum) and can burst to 3,000. Keeping this small makes BurstBalance
      depletion observable faster during the demo.

Resources:
  # --- EKS Cluster IAM Role ---
  EKSClusterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ClusterName}-cluster-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy
        - arn:aws:iam::aws:policy/AmazonEKSVPCResourceController
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  # --- EKS Node Group IAM Role ---
  NodeGroupRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ClusterName}-node-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  # --- Cluster Security Group ---
  ClusterSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: EKS cluster communication with worker nodes
      VpcId:
        Fn::ImportValue: !Sub "${EnvironmentName}-VpcId"
      Tags:
        - Key: Name
          Value: !Sub "${ClusterName}-cluster-sg"

  # --- EKS Cluster ---
  EKSCluster:
    Type: AWS::EKS::Cluster
    Properties:
      Name: !Ref ClusterName
      Version: !Ref KubernetesVersion
      RoleArn: !GetAtt EKSClusterRole.Arn
      ResourcesVpcConfig:
        SecurityGroupIds:
          - !Ref ClusterSecurityGroup
        SubnetIds:
          - Fn::ImportValue: !Sub "${EnvironmentName}-PrivateSubnet1Id"
          - Fn::ImportValue: !Sub "${EnvironmentName}-PrivateSubnet2Id"
          - Fn::ImportValue: !Sub "${EnvironmentName}-PublicSubnet1Id"
          - Fn::ImportValue: !Sub "${EnvironmentName}-PublicSubnet2Id"
        EndpointPublicAccess: true
        EndpointPrivateAccess: true
      Logging:
        ClusterLogging:
          EnabledTypes:
            - Type: api
            - Type: audit
            - Type: controllerManager
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Purpose
          Value: ebs-monitoring-poc

  # --- Launch Template (GP2 — for demonstrating BurstBalance depletion) ---
  NodeLaunchTemplateGP2:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "${ClusterName}-node-lt-gp2"
      LaunchTemplateData:
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: !Ref NodeRootVolumeSize
              VolumeType: gp2
              DeleteOnTermination: true
              Encrypted: true
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required  # IMDSv2
          HttpPutResponseHopLimit: 2
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub "${ClusterName}-node-gp2"
              - Key: Environment
                Value: !Ref EnvironmentName
              - Key: EKSCluster
                Value: !Ref ClusterName
              - Key: VolumeType
                Value: gp2
          - ResourceType: volume
            Tags:
              - Key: Name
                Value: !Sub "${ClusterName}-root-gp2"
              - Key: EKSCluster
                Value: !Ref ClusterName
              - Key: VolumeRole
                Value: node-root
              - Key: VolumeType
                Value: gp2
              - Key: Environment
                Value: !Ref EnvironmentName

  # --- Launch Template (GP3 — for demonstrating baseline ceiling behavior) ---
  NodeLaunchTemplateGP3:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "${ClusterName}-node-lt-gp3"
      LaunchTemplateData:
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: !Ref NodeRootVolumeSize
              VolumeType: gp3
              Iops: 3000
              Throughput: 125
              DeleteOnTermination: true
              Encrypted: true
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required  # IMDSv2
          HttpPutResponseHopLimit: 2
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub "${ClusterName}-node-gp3"
              - Key: Environment
                Value: !Ref EnvironmentName
              - Key: EKSCluster
                Value: !Ref ClusterName
              - Key: VolumeType
                Value: gp3
          - ResourceType: volume
            Tags:
              - Key: Name
                Value: !Sub "${ClusterName}-root-gp3"
              - Key: EKSCluster
                Value: !Ref ClusterName
              - Key: VolumeRole
                Value: node-root
              - Key: VolumeType
                Value: gp3
              - Key: Environment
                Value: !Ref EnvironmentName

  # --- Managed Node Group (GP2) ---
  NodeGroupGP2:
    Type: AWS::EKS::Nodegroup
    DependsOn: EKSCluster
    Properties:
      ClusterName: !Ref ClusterName
      NodegroupName: !Sub "${ClusterName}-workers-gp2"
      NodeRole: !GetAtt NodeGroupRole.Arn
      Subnets:
        - Fn::ImportValue: !Sub "${EnvironmentName}-PrivateSubnet1Id"
        - Fn::ImportValue: !Sub "${EnvironmentName}-PrivateSubnet2Id"
      InstanceTypes:
        - !Ref NodeInstanceType
      ScalingConfig:
        DesiredSize: !Ref NodeGroupDesiredSize
        MinSize: !Ref NodeGroupMinSize
        MaxSize: !Ref NodeGroupMaxSize
      LaunchTemplate:
        Id: !Ref NodeLaunchTemplateGP2
        Version: !GetAtt NodeLaunchTemplateGP2.LatestVersionNumber
      Labels:
        role: worker
        environment: poc
        volume-type: gp2
      Tags:
        Environment: !Ref EnvironmentName
        Purpose: ebs-monitoring-poc
        RootVolumeType: gp2

  # --- Managed Node Group (GP3) ---
  NodeGroupGP3:
    Type: AWS::EKS::Nodegroup
    DependsOn: EKSCluster
    Properties:
      ClusterName: !Ref ClusterName
      NodegroupName: !Sub "${ClusterName}-workers-gp3"
      NodeRole: !GetAtt NodeGroupRole.Arn
      Subnets:
        - Fn::ImportValue: !Sub "${EnvironmentName}-PrivateSubnet1Id"
        - Fn::ImportValue: !Sub "${EnvironmentName}-PrivateSubnet2Id"
      InstanceTypes:
        - !Ref NodeInstanceType
      ScalingConfig:
        DesiredSize: !Ref NodeGroupDesiredSize
        MinSize: !Ref NodeGroupMinSize
        MaxSize: !Ref NodeGroupMaxSize
      LaunchTemplate:
        Id: !Ref NodeLaunchTemplateGP3
        Version: !GetAtt NodeLaunchTemplateGP3.LatestVersionNumber
      Labels:
        role: worker
        environment: poc
        volume-type: gp3
      Tags:
        Environment: !Ref EnvironmentName
        Purpose: ebs-monitoring-poc
        RootVolumeType: gp3

  # --- Managed Node Group (Observability — for Grafana) ---
  # Single small node with a taint to keep stress pods off it.
  # Grafana's toleration allows it to schedule here exclusively.
  NodeGroupObservability:
    Type: AWS::EKS::Nodegroup
    DependsOn: EKSCluster
    Properties:
      ClusterName: !Ref ClusterName
      NodegroupName: !Sub "${ClusterName}-observability"
      NodeRole: !GetAtt NodeGroupRole.Arn
      Subnets:
        - Fn::ImportValue: !Sub "${EnvironmentName}-PrivateSubnet1Id"
      InstanceTypes:
        - t3.small
      ScalingConfig:
        DesiredSize: 1
        MinSize: 1
        MaxSize: 1
      Taints:
        - Key: dedicated
          Value: observability
          Effect: NO_SCHEDULE
      Labels:
        role: observability
        environment: poc
        dedicated: observability
        volume-type: observability
      Tags:
        Environment: !Ref EnvironmentName
        Purpose: grafana-observability

Outputs:
  ClusterName:
    Description: EKS Cluster name
    Value: !Ref EKSCluster
    Export:
      Name: !Sub "${EnvironmentName}-ClusterName"

  ClusterArn:
    Description: EKS Cluster ARN
    Value: !GetAtt EKSCluster.Arn

  ClusterEndpoint:
    Description: EKS API server endpoint
    Value: !GetAtt EKSCluster.Endpoint

  ClusterSecurityGroupId:
    Description: Cluster security group ID
    Value: !GetAtt EKSCluster.ClusterSecurityGroupId

  NodeGroupGP2Name:
    Description: GP2 managed node group name
    Value: !Sub "${ClusterName}-workers-gp2"

  NodeGroupGP3Name:
    Description: GP3 managed node group name
    Value: !Sub "${ClusterName}-workers-gp3"

  NodeInstanceType:
    Description: Node instance type
    Value: !Ref NodeInstanceType

  NodeRootVolumeSize:
    Description: Root volume size (both node groups)
    Value: !Sub "${NodeRootVolumeSize} GiB"

  GP2BaselineIOPS:
    Description: >
      GP2 node group: baseline IOPS and burst capacity.
    Value: !Sub >
      GP2: Baseline = max(100, ${NodeRootVolumeSize} × 3) IOPS. Burst to 3,000 IOPS (credit-based).

  GP3BaselineIOPS:
    Description: >
      GP3 node group: guaranteed baseline IOPS and throughput.
    Value: "GP3: Guaranteed 3,000 IOPS + 125 MiB/s baseline. No burst credits."

  KubeconfigCommand:
    Description: Command to configure kubectl
    Value: !Sub "aws eks update-kubeconfig --name ${ClusterName} --region ${AWS::Region}"

  NodeSelectors:
    Description: Use these node selectors to target specific node groups in K8s manifests
    Value: "GP2 nodes: nodeSelector volume-type=gp2 | GP3 nodes: nodeSelector volume-type=gp3"