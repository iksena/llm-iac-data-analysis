AWSTemplateFormatVersion: '2010-09-09'
Description: |
  KALIQ CI/CD OIDC Stack (Stack A)
  - GitHub Actions OIDC provider and roles for infrastructure deployment and ECR publishing
  - Least-privilege roles: infra deployer + ECR publisher
  - Trust policies restrict by repository and branch
  - Reference: docs/infrastructure/STACKS.md

Parameters:
  Project:
    Type: String
    Default: kaliq
    Description: Project name used in resource naming and tagging

  Env:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - qa
      - prod
    Description: Environment name (affects role naming and stack permissions)

  GitHubOrg:
    Type: String
    Description: GitHub organization name (e.g., your-org)
    NoEcho: false

  GitHubRepo:
    Type: String
    Description: GitHub repository name (e.g., kaliq)
    NoEcho: false

  GitHubBranch:
    Type: String
    Default: main
    Description: GitHub branch name for OIDC trust (e.g., main, dev)

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Stack Parameters"
        Parameters:
          - Project
          - Env
      - Label:
          default: "GitHub Configuration"
        Parameters:
          - GitHubOrg
          - GitHubRepo
          - GitHubBranch

Resources:
  # =============================================================================
  # GitHub Actions OIDC Provider
  # =============================================================================
  # Account-level resource; safe to create once even if already exists.
  # Subsequent stacks can reference it by ARN.

  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        # GitHub's OIDC token thumbprint (as of Jan 2026; verify if updating)
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  # =============================================================================
  # CloudFormation Execution Role
  # =============================================================================
  # This role is assumed by CloudFormation service to create AWS resources.
  # It has permissions to create S3, DynamoDB, IAM, ECR, EKS, VPC resources
  # scoped to KALIQ ${Env} environment.

  CfnExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Project}-cfn-execution-role-${Env}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: 'sts:AssumeRole'
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Env
          Value: !Ref Env
        - Key: Purpose
          Value: CloudFormation execution role

  # Inline policy: Permissions for CloudFormation to create KALIQ resources
  CfnExecutionPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: KALIQResourceCreation
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # S3: Account-level operations (list all buckets)
          - Sid: S3AccountLevelOperations
            Effect: Allow
            Action:
              - 's3:ListAllMyBuckets'
            Resource: '*'
          # S3: Bucket-specific operations for kaliq-*-${Env} buckets
          - Sid: S3BucketManagement
            Effect: Allow
            Action:
              # Bucket creation/deletion
              - 's3:CreateBucket'
              - 's3:DeleteBucket'
              - 's3:HeadBucket'
              # Versioning configuration
              - 's3:PutBucketVersioning'
              - 's3:GetBucketVersioning'
              # Public access block configuration
              - 's3:PutBucketPublicAccessBlock'
              - 's3:GetBucketPublicAccessBlock'
              # Encryption configuration (both action names for compatibility)
              - 's3:PutBucketEncryption'
              - 's3:PutEncryptionConfiguration'
              - 's3:GetBucketEncryption'
              - 's3:GetEncryptionConfiguration'
              # Bucket policy
              - 's3:PutBucketPolicy'
              - 's3:GetBucketPolicy'
              - 's3:DeleteBucketPolicy'
              # Lifecycle configuration (both action names for compatibility)
              - 's3:PutBucketLifecycleConfiguration'
              - 's3:PutLifecycleConfiguration'
              - 's3:GetBucketLifecycleConfiguration'
              - 's3:GetLifecycleConfiguration'
              - 's3:DeleteBucketLifecycleConfiguration'
              # Bucket tagging
              - 's3:PutBucketTagging'
              - 's3:GetBucketTagging'
              - 's3:DeleteBucketTagging'
              # Bucket location and listing
              - 's3:GetBucketLocation'
              - 's3:ListBucket'
            Resource:
              - !Sub 'arn:${AWS::Partition}:s3:::${Project}-*-${Env}'
              - !Sub 'arn:${AWS::Partition}:s3:::${Project}-*-${Env}/*'
          # DynamoDB: Create tables, indexes for kaliq-*-${Env} tables
          - Sid: DynamoDBTableManagement
            Effect: Allow
            Action:
              - 'dynamodb:CreateTable'
              - 'dynamodb:DeleteTable'
              - 'dynamodb:UpdateTable'
              - 'dynamodb:UpdateContinuousBackups'
              - 'dynamodb:DescribeTable'
              - 'dynamodb:DescribeContinuousBackups'
              - 'dynamodb:ListTables'
              - 'dynamodb:TagResource'
              - 'dynamodb:UntagResource'
              - 'dynamodb:ListTagsOfResource'
            Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Project}-*-${Env}'
          # IAM: Create roles and policies for IRSA and workload roles (kaliq-*-${Env})
          - Sid: IAMRoleManagement
            Effect: Allow
            Action:
              - 'iam:CreateRole'
              - 'iam:DeleteRole'
              - 'iam:UpdateRole'
              - 'iam:GetRole'
              - 'iam:ListRoles'
              - 'iam:AttachRolePolicy'
              - 'iam:DetachRolePolicy'
              - 'iam:PutRolePolicy'
              - 'iam:DeleteRolePolicy'
              - 'iam:GetRolePolicy'
              - 'iam:ListRolePolicies'
              - 'iam:ListAttachedRolePolicies'
              - 'iam:TagRole'
              - 'iam:UntagRole'
              - 'iam:ListRoleTags'
              - 'iam:CreatePolicy'
              - 'iam:DeletePolicy'
              - 'iam:GetPolicy'
              - 'iam:ListPolicies'
              - 'iam:TagPolicy'
              - 'iam:UntagPolicy'
              - 'iam:ListPolicyTags'
            Resource:
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${Project}-*-${Env}*'
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${Project}-${Env}-*'
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/${Project}-*-${Env}*'
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/${Project}-${Env}-*'
          - Sid: IAMPassRoleForEKS
            Effect: Allow
            Action:
              - 'iam:PassRole'
            Resource:
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${Project}-${Env}-eks-*'
            Condition:
              StringEquals:
                iam:PassedToService:
                  - eks.amazonaws.com
                  - ec2.amazonaws.com
          - Sid: IAMGetEKSServiceLinkedRoles
            Effect: Allow
            Action: 'iam:GetRole'
            Resource:
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/eks.amazonaws.com/*'
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/eks-nodegroup.amazonaws.com/*'
              # Flat ARNs needed when the SLR does not yet exist — IAM evaluates
              # GetRole auth against the path-less ARN for non-existent roles.
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/AWSServiceRoleForAmazonEKS'
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/AWSServiceRoleForAmazonEKSNodegroup'
          - Sid: IAMServiceLinkedRoleForEKSAndNodegroup
            Effect: Allow
            Action:
              - 'iam:CreateServiceLinkedRole'
              - 'iam:DeleteServiceLinkedRole'
              - 'iam:GetServiceLinkedRoleDeletionStatus'
            Resource: '*'
            Condition:
              StringEquals:
                iam:AWSServiceName:
                  - eks.amazonaws.com
                  - eks-nodegroup.amazonaws.com
          # IAM: Create OIDC provider (account-level, but needed for IRSA)
          - Sid: IAMOIDCProviderManagement
            Effect: Allow
            Action:
              - 'iam:CreateOpenIDConnectProvider'
              - 'iam:DeleteOpenIDConnectProvider'
              - 'iam:GetOpenIDConnectProvider'
              - 'iam:ListOpenIDConnectProviders'
              - 'iam:TagOpenIDConnectProvider'
              - 'iam:ListOpenIDConnectProviderTags'
            Resource: '*'
          # ECR: Create repositories for kaliq-* repos
          - Sid: ECRRepositoryManagement
            Effect: Allow
            Action:
              - 'ecr:CreateRepository'
              - 'ecr:DeleteRepository'
              - 'ecr:DescribeRepositories'
              - 'ecr:ListRepositories'
              - 'ecr:PutLifecyclePolicy'
              - 'ecr:GetLifecyclePolicy'
              - 'ecr:DeleteLifecyclePolicy'
              - 'ecr:PutImageTagMutability'
              - 'ecr:GetImageTagMutability'
              - 'ecr:PutImageScanningConfiguration'
              - 'ecr:GetImageScanningConfiguration'
              - 'ecr:TagResource'
              - 'ecr:UntagResource'
              - 'ecr:ListTagsForResource'
            Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${Project}-*'
          # EKS: Create clusters, node groups (broader permissions required, but scoped by tags)
          - Sid: EKSClusterManagement
            Effect: Allow
            Action:
              - 'eks:CreateCluster'
              - 'eks:DeleteCluster'
              - 'eks:UpdateClusterVersion'
              - 'eks:UpdateClusterConfig'
              - 'eks:DescribeCluster'
              - 'eks:DescribeUpdate'
              - 'eks:ListClusters'
              - 'eks:ListUpdates'
              - 'eks:TagResource'
              - 'eks:UntagResource'
              - 'eks:ListTagsForResource'
              - 'eks:CreateNodegroup'
              - 'eks:DeleteNodegroup'
              - 'eks:UpdateNodegroupVersion'
              - 'eks:UpdateNodegroupConfig'
              - 'eks:DescribeNodegroup'
              - 'eks:ListNodegroups'
              - 'eks:AssociateIdentityProviderConfig'
              - 'eks:DisassociateIdentityProviderConfig'
              - 'eks:ListIdentityProviderConfigs'
              - 'eks:CreateAccessEntry'
              - 'eks:DeleteAccessEntry'
              - 'eks:UpdateAccessEntry'
              - 'eks:DescribeAccessEntry'
              - 'eks:ListAccessEntries'
              - 'eks:AssociateAccessPolicy'
              - 'eks:DisassociateAccessPolicy'
              - 'eks:ListAccessPolicies'
              - 'eks:ListAssociatedAccessPolicies'
            Resource: '*'
          # VPC/EC2: Create VPC, subnets, NAT gateways, etc. (broader permissions required)
          - Sid: VPCAndEC2Management
            Effect: Allow
            Action:
              - 'ec2:CreateVpc'
              - 'ec2:DeleteVpc'
              - 'ec2:ModifyVpcAttribute'
              - 'ec2:DescribeVpcs'
              - 'ec2:CreateSubnet'
              - 'ec2:DeleteSubnet'
              - 'ec2:ModifySubnetAttribute'
              - 'ec2:DescribeSubnets'
              - 'ec2:CreateInternetGateway'
              - 'ec2:DeleteInternetGateway'
              - 'ec2:AttachInternetGateway'
              - 'ec2:DetachInternetGateway'
              - 'ec2:DescribeInternetGateways'
              - 'ec2:CreateNatGateway'
              - 'ec2:DeleteNatGateway'
              - 'ec2:DescribeNatGateways'
              - 'ec2:AllocateAddress'
              - 'ec2:ReleaseAddress'
              - 'ec2:DescribeAddresses'
              - 'ec2:CreateRouteTable'
              - 'ec2:DeleteRouteTable'
              - 'ec2:DescribeRouteTables'
              - 'ec2:CreateRoute'
              - 'ec2:DeleteRoute'
              - 'ec2:ReplaceRoute'
              - 'ec2:AssociateRouteTable'
              - 'ec2:DisassociateRouteTable'
              - 'ec2:CreateVpcEndpoint'
              - 'ec2:DeleteVpcEndpoints'
              - 'ec2:ModifyVpcEndpoint'
              - 'ec2:DescribeVpcEndpoints'
              - 'ec2:DescribeVpcEndpointServices'
              - 'ec2:DescribeVpcEndpointServiceConfigurations'
              - 'ec2:CreateSecurityGroup'
              - 'ec2:DeleteSecurityGroup'
              - 'ec2:ModifySecurityGroupRules'
              - 'ec2:DescribeSecurityGroups'
              - 'ec2:AuthorizeSecurityGroupIngress'
              - 'ec2:RevokeSecurityGroupIngress'
              - 'ec2:AuthorizeSecurityGroupEgress'
              - 'ec2:RevokeSecurityGroupEgress'
              - 'ec2:CreateTags'
              - 'ec2:DeleteTags'
              - 'ec2:DescribeTags'
              - 'ec2:DescribeAvailabilityZones'
              - 'ec2:DescribeAccountAttributes'
            Resource: '*'
          # CloudWatch Logs: Create log groups for /kaliq/${Env}/*
          - Sid: CloudWatchLogsManagement
            Effect: Allow
            Action:
              - 'logs:CreateLogGroup'
              - 'logs:DeleteLogGroup'
              - 'logs:DescribeLogGroups'
              - 'logs:PutRetentionPolicy'
              - 'logs:TagLogGroup'
            Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/${Project}/${Env}/*'
          # SSM Parameter Store: Create/update parameters for /kaliq/${Env}/*
          - Sid: SSMParameterManagement
            Effect: Allow
            Action:
              - 'ssm:PutParameter'
              - 'ssm:DeleteParameter'
              - 'ssm:GetParameter'
              - 'ssm:GetParameters'
              - 'ssm:DescribeParameters'
              - 'ssm:AddTagsToResource'
              - 'ssm:RemoveTagsFromResource'
              - 'ssm:ListTagsForResource'
            Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${Project}/${Env}/*'
      Roles:
        - !Ref CfnExecutionRole

  # =============================================================================
  # IAM Role 1: Infrastructure Deployer (CloudFormation)
  # =============================================================================
  # Permissions:
  # - CloudFormation stack operations (create/update/delete) for kaliq-${Env}-* only
  # - IAM PassRole for CfnExecutionRole only
  # - Read/describe permissions for dependency stacks

  InfraDeployerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Project}-gha-infra-deployer-${Env}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !GetAtt GitHubOIDCProvider.Arn
            Action: 'sts:AssumeRoleWithWebIdentity'
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
              StringLike:
                'token.actions.githubusercontent.com:sub': !Sub 'repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/${GitHubBranch}'
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Env
          Value: !Ref Env
        - Key: Purpose
          Value: CloudFormation deployments

  # Inline policy: CloudFormation stack management for kaliq-${Env}-* stacks
  InfraDeployerPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: CloudFormationStackManagement
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # CreateStack, UpdateStack, DeleteStack, DescribeStacks for kaliq-${Env}-* only
          - Sid: CloudFormationStackOperations
            Effect: Allow
            Action:
              - 'cloudformation:CreateStack'
              - 'cloudformation:UpdateStack'
              - 'cloudformation:CreateChangeSet'
              - 'cloudformation:ExecuteChangeSet'
              - 'cloudformation:DescribeChangeSet'
              - 'cloudformation:DeleteChangeSet'
              - 'cloudformation:DescribeStacks'
              - 'cloudformation:DescribeStackEvents'
              - 'cloudformation:DescribeStackResource'
              - 'cloudformation:DescribeStackResources'
              - 'cloudformation:ListStacks'
              - 'cloudformation:GetTemplate'
              - 'cloudformation:ValidateTemplate'
            Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${Project}-${Env}-*/*'
          - Effect: Allow
            Action:
              - 'cloudformation:DeleteStack'
            Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${Project}-dev-*/*'
          # PassRole permission for CloudFormation execution role only
          - Sid: PassRoleForCloudFormation
            Effect: Allow
            Action:
              - 'iam:PassRole'
            Resource: !GetAtt CfnExecutionRole.Arn
            Condition:
              StringEquals:
                'iam:PassedToService': cloudformation.amazonaws.com
          # DescribeStackEvents (for visibility during deployments)
          - Sid: DescribeStackEvents
            Effect: Allow
            Action:
              - 'cloudformation:GetStackPolicy'
              - 'cloudformation:GetTemplateSummary'
            Resource: '*'
      Roles:
        - !Ref InfraDeployerRole

  # =============================================================================
  # IAM Role 2: ECR Publisher (Docker image push)
  # =============================================================================
  # Permissions:
  # - ECR authentication (GetAuthorizationToken)
  # - ECR image push operations for kaliq-* repositories only

  EcrPublisherRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Project}-gha-ecr-publisher-${Env}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !GetAtt GitHubOIDCProvider.Arn
            Action: 'sts:AssumeRoleWithWebIdentity'
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
              StringLike:
                'token.actions.githubusercontent.com:sub': !Sub 'repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/${GitHubBranch}'
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Env
          Value: !Ref Env
        - Key: Purpose
          Value: ECR image publishing

  # Inline policy: ECR push for kaliq-* repositories only
  EcrPublisherPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: ECRImagePush
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # GetAuthorizationToken (required for `docker login`)
          - Sid: GetAuthorizationToken
            Effect: Allow
            Action:
              - 'ecr:GetAuthorizationToken'
            Resource: '*'
          # ECR push and describe actions for kaliq-* repositories
          - Sid: PushImageToKaliqRepos
            Effect: Allow
            Action:
              - 'ecr:PutImage'
              - 'ecr:InitiateLayerUpload'
              - 'ecr:UploadLayerPart'
              - 'ecr:CompleteLayerUpload'
              - 'ecr:DescribeImages'
              - 'ecr:DescribeRepositories'
              - 'ecr:BatchCheckLayerAvailability'
              - 'ecr:BatchGetImage'
              - 'ecr:GetDownloadUrlForLayer'
            Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${Project}-*'
          - Sid: DescribeEcrStack
            Effect: Allow
            Action:
              - 'cloudformation:DescribeStacks'
            Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${Project}-${Env}-ecr/*'
      Roles:
        - !Ref EcrPublisherRole

Outputs:
  # GitHub OIDC Provider ARN (for reference by other stacks or workflows)
  GitHubOIDCProviderArn:
    Description: ARN of the GitHub Actions OIDC provider
    Value: !GetAtt GitHubOIDCProvider.Arn
    Export:
      Name: !Sub '${Project}-${Env}-GitHubOIDCProviderArn'

  # Infrastructure Deployer Role ARN (used in GitHub Actions workflow)
  InfraDeployerRoleArn:
    Description: ARN of the infrastructure deployer role for GitHub Actions
    Value: !GetAtt InfraDeployerRole.Arn
    Export:
      Name: !Sub '${Project}-${Env}-InfraDeployerRoleArn'

  # ECR Publisher Role ARN (used in GitHub Actions workflow for image push)
  EcrPublisherRoleArn:
    Description: ARN of the ECR publisher role for GitHub Actions
    Value: !GetAtt EcrPublisherRole.Arn
    Export:
      Name: !Sub '${Project}-${Env}-EcrPublisherRoleArn'

  # CloudFormation Execution Role ARN (used in GitHub Actions workflow)
  CfnExecutionRoleArn:
    Description: ARN of the CloudFormation execution role
    Value: !GetAtt CfnExecutionRole.Arn
    Export:
      Name: !Sub '${Project}-${Env}-CfnExecutionRoleArn'