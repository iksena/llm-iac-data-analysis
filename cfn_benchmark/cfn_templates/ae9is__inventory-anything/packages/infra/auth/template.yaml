AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  anything-auth

# Make sure to enable IAM Identity Center in the AWS Console yourself first, and
#  to set the SAML metadata url in the $SAML_URL environment variable.

Parameters:
  stage:
    Type: String
    Default: dev-123
    Description: Deployment stage with unique key, like "dev-123"
  samlUrl:
    Type: String
    Description: SAML provider metadata url for Cognito user pool identity provider

Resources:
  apiRootArn:
    Type: AWS::SSM::Parameter
    Properties:
      Type: String
      Tier: Standard
      Value:
        Fn::ImportValue: !Sub "anything-${stage}-apiRootArn" # OK

  distributionDomainName:
    Type: AWS::SSM::Parameter
    Properties:
      Type: String
      Tier: Standard
      Value:
        Fn::ImportValue: !Sub "anything-${stage}-distributionDomainName" # OK

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "anything-${stage}-user-pool"
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: True
      MfaConfiguration: OPTIONAL
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      UsernameConfiguration:
        CaseSensitive: False
      AliasAttributes:
        - email

  # Needed for cognito hosted ui
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      # 1-63 chars. Lowercase letters, numbers, and hyphens. No hyphen for first or last character. Periods to separate subdomain names.
      # Pre-check availability from the console, pick something long and random to avoid collision, or use your own custom domain.
      Domain: !Sub "anything-${stage}"

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "anything-${stage}-user-pool-client"
      UserPoolId: !Ref UserPool
      # Disable for demo
      SupportedIdentityProviders:
        - !Ref UserPoolIdentityProvider
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
        - aws.cognito.signin.user.admin
      CallbackURLs:
        # Trailing slash (if present) should match client code exactly
        - http://localhost:3000/
        - !Sub "https://${distributionDomainName.Value}/"
      LogoutURLs:
        - http://localhost:3000/
        - !Sub "https://${distributionDomainName.Value}/"
      AllowedOAuthFlowsUserPoolClient: True
      GenerateSecret: False

  # Disable for demo
  UserPoolIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref UserPool
      # This provider name is button text in the Cognito Hosted UI
      ProviderName: !Sub "anything-${stage}-user-pool-idp"
      ProviderType: SAML
      ProviderDetails:
        MetadataURL: !Ref samlUrl
      AttributeMapping:
        # Cognito attributes to IAM Identity Center attributes.
        # Also need to manually configure and map attributes in a new custom SAML application in IAM Identity Center.
        # ref: https://docs.aws.amazon.com/cognito/latest/developerguide/user-pool-settings-attributes.html
        # ref: https://docs.aws.amazon.com/singlesignon/latest/userguide/attributemappingsconcept.html#supportedssoattributes
        #username: '\${user:subject}' # username = sub, don't map this in Cognito (only map Subject in IAM Identity Center)
        email: '\${user:email}'
        preferred_username: '\${user:preferredUsername}'

  IdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      AllowUnauthenticatedIdentities: True
      IdentityPoolName: !Sub "anything-${stage}-identity-pool"
      CognitoIdentityProviders:
        - ClientId: !Ref UserPoolClient
          ProviderName: !GetAtt UserPool.ProviderName

  IdentityPoolRoleAttachment:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Properties:
      IdentityPoolId: !Ref IdentityPool
      Roles:
        authenticated: !GetAtt WriteRole.Arn
        #authenticated: !GetAtt ReadRole.Arn # For demo
        unauthenticated: !GetAtt UnauthRole.Arn

  ReadRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "anything-${stage}-read-role"
      Path: '/anything/roles/' # becomes for ex: anything/roles/anything-api-dev-read-role
      Description: 'Read user role'
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Federated: "cognito-identity.amazonaws.com"
            Action:
              - "sts:AssumeRoleWithWebIdentity"
              - "sts:TagSession"
            Condition:
              StringEquals:
                "cognito-identity.amazonaws.com:aud": !Ref IdentityPool
              "ForAnyValue:StringEquals":
                "cognito-identity.amazonaws.com:amr": "authenticated"
          - Effect: "Allow"
            Principal:
              Service: "apigateway.amazonaws.com"
            Action:
              - "sts:AssumeRole"
      Policies:
        - PolicyName: !Sub "anything-${stage}-read-policy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Action:
                  - "cognito-identity:Get*"
                  - "cognito-identity:List*"
                Resource:
                - !Sub "arn:aws:cognito-identity:${AWS::Region}:${AWS::AccountId}:identitypool/${IdentityPool}"
              - Effect: "Allow"
                Action:
                  - "lambda:Get*"
                  - "lambda:List*"
                  - "lambda:Invoke*"
                Resource:
                - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:anything-api-${stage}-*"
              - Effect: "Allow"
                Action:
                  - "execute-api:Invoke"
                Resource:
                - !Sub "${apiRootArn.Value}/*/GET/healthz"
                - !Sub "${apiRootArn.Value}/*/GET/types"
                - !Sub "${apiRootArn.Value}/*/GET/types/*"
                - !Sub "${apiRootArn.Value}/*/GET/items/*"
                - !Sub "${apiRootArn.Value}/*/GET/collections/*"
                # (Need to post filter query parameters when searching items by type)
                - !Sub "${apiRootArn.Value}/*/POST/types/*"

  WriteRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "anything-${stage}-write-role"
      Path: '/anything/roles/' # becomes for ex: anything/roles/anything-api-dev-write-role
      Description: 'Write user role'
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Federated: "cognito-identity.amazonaws.com"
            Action:
              - "sts:AssumeRoleWithWebIdentity"
              - "sts:TagSession"
            Condition:
              StringEquals:
                "cognito-identity.amazonaws.com:aud": !Ref IdentityPool
              "ForAnyValue:StringEquals":
                "cognito-identity.amazonaws.com:amr": "authenticated"
          - Effect: "Allow"
            Principal:
              Service: "apigateway.amazonaws.com"
            Action:
              - "sts:AssumeRole"
      Policies:
        - PolicyName: !Sub "anything-${stage}-write-policy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Action:
                  - "cognito-identity:Get*"
                  - "cognito-identity:List*"
                Resource:
                - !Sub "arn:aws:cognito-identity:${AWS::Region}:${AWS::AccountId}:identitypool/${IdentityPool}"
              - Effect: "Allow"
                Action:
                  - "lambda:Get*"
                  - "lambda:List*"
                  - "lambda:Invoke*"
                Resource:
                - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:anything-api-${stage}-*"
              - Effect: "Allow"
                Action:
                  - "execute-api:Invoke"
                Resource:
                # ARN format for APIs: arn:partition:execute-api:region:account-id:api-id/stage/http-method/resource-path
                # ref: https://docs.aws.amazon.com/apigateway/latest/developerguide/arn-format-reference.html
                #
                # General ARN format: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference-arns.html
                - !Sub "${apiRootArn.Value}/*/GET/healthz"
                - !Sub "${apiRootArn.Value}/*/GET/types"
                - !Sub "${apiRootArn.Value}/*/GET/types/*"
                - !Sub "${apiRootArn.Value}/*/GET/items/*"
                - !Sub "${apiRootArn.Value}/*/GET/collections/*"
                - !Sub "${apiRootArn.Value}/*/POST/types/*"
                - !Sub "${apiRootArn.Value}/*/POST/items"
                - !Sub "${apiRootArn.Value}/*/POST/items/*"
                - !Sub "${apiRootArn.Value}/*/PUT/collections/*"
                - !Sub "${apiRootArn.Value}/*/DELETE/items/*"
                - !Sub "${apiRootArn.Value}/*/DELETE/collections/*"

  UnauthRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "anything-${stage}-unauth-role"
      Path: '/anything/roles/'
      Description: 'Unauthenticated user role'
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Federated: "cognito-identity.amazonaws.com"
            Action:
              - "sts:AssumeRoleWithWebIdentity"
              - "sts:TagSession"
            Condition:
              StringEquals:
                "cognito-identity.amazonaws.com:aud": !Ref IdentityPool
              "ForAnyValue:StringEquals":
                "cognito-identity.amazonaws.com:amr": "unauthenticated"
      Policies:
        - PolicyName: !Sub "anything-${stage}-unauth-policy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Action:
                  - "cognito-identity:Get*"
                  - "cognito-identity:List*"
                Resource:
                - !Sub "arn:aws:cognito-identity:${AWS::Region}:${AWS::AccountId}:identitypool/${IdentityPool}"