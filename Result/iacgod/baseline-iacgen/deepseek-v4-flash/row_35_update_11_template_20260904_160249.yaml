AWSTemplateFormatVersion: '2010-09-09'
Description: 'Cognito User Pool for JWT testing with AgentCore Gateway and MCP server'
Parameters:
  CallbackUrls:
    Type: CommaDelimitedList
    Description: Comma-delimited list of callback URLs for the web client
    Default: 'http://localhost:3000/callback'
  LogoutUrls:
    Type: CommaDelimitedList
    Description: Comma-delimited list of logout URLs for the web client
    Default: 'http://localhost:3000/logout'
  DomainPrefix:
    Type: String
    Description: Unique prefix for the hosted UI domain
    Default: 'mcp-test'
    AllowedPattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
    ConstraintDescription: 'Domain prefix must be lowercase alphanumeric with hyphens and not end with a hyphen'
Resources:
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: 'MCPTestUserPool'
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      EmailVerificationMessage: 'Your verification code is {####}.'
      EmailVerificationSubject: 'Verify your email for MCP Test'

  CertificateManagerCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Sub '${DomainPrefix}.auth.example.com'
      ValidationMethod: DNS

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Aliases:
          - !Sub '${DomainPrefix}.auth.example.com'
        Origins:
          - Id: CognitoOrigin
            DomainName: !Sub '${CognitoUserPool}.auth.${AWS::Region}.amazoncognito.com'
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
        DefaultCacheBehavior:
          TargetOriginId: CognitoOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          ForwardedValues:
            QueryString: true
            Cookies:
              Forward: none
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateManagerCertificate
          SslSupportMethod: sni-only

  CognitoUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref CognitoUserPool
      CloudFrontDistribution: !Ref CloudFrontDistribution
      CustomDomainConfig:
        CertificateArn: !Ref CertificateManagerCertificate

  CognitoResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      Identifier: 'api'
      Name: 'API Resource Server'
      UserPoolId: !Ref CognitoUserPool
      Scopes:
        - ScopeName: 'mcp'
          ScopeDescription: 'Access to MCP server'
        - ScopeName: 'gateway'
          ScopeDescription: 'Access to AgentCore Gateway'

  WebClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: 'WebClient'
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_CUSTOM_AUTH
      AllowedOAuthFlows:
        - code
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - email
        - openid
        - profile
        - api/mcp
        - api/gateway
      CallbackURLs: !Ref CallbackUrls
      LogoutURLs: !Ref LogoutUrls
      SupportedIdentityProviders:
        - COGNITO
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  MachineClientGateway:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: 'MachineClientGateway'
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: true
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
      AllowedOAuthFlows:
        - client_credentials
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - api/mcp
        - api/gateway
      SupportedIdentityProviders:
        - COGNITO
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 1
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  MachineClientMCP:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: 'MachineClientMCP'
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: true
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
      AllowedOAuthFlows:
        - client_credentials
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - api/mcp
        - api/gateway
      SupportedIdentityProviders:
        - COGNITO
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 1
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

Outputs:
  UserPoolId:
    Description: ID of the Cognito User Pool
    Value: !Ref CognitoUserPool
  UserPoolDomain:
    Description: Hosted UI domain
    Value: !Sub 'https://${DomainPrefix}.auth.example.com'
  WebClientId:
    Description: Client ID for the web application
    Value: !Ref WebClient
  MachineClientGatewayId:
    Description: Client ID for the Gateway machine client
    Value: !Ref MachineClientGateway
  MachineClientGatewaySecret:
    Description: Client secret for the Gateway machine client
    Value: !GetAtt MachineClientGateway.ClientSecret
  MachineClientMCPId:
    Description: Client ID for the MCP machine client
    Value: !Ref MachineClientMCP
  MachineClientMCPSecret:
    Description: Client secret for the MCP machine client
    Value: !GetAtt MachineClientMCP.ClientSecret