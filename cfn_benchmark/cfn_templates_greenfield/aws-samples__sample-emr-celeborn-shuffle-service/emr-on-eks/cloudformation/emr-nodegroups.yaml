AWSTemplateFormatVersion: "2010-09-09"
Description: >
  EKS managed node groups for EMR on EKS Spark workloads.
  Creates a general node group for system pods and a Spark node group
  for EMR executor pods, plus the EBS CSI driver addon.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: General Node Group
        Parameters:
          - GeneralInstanceType
          - GeneralMinSize
          - GeneralDesiredSize
          - GeneralMaxSize
      - Label:
          default: Spark Node Group
        Parameters:
          - SparkInstanceType
          - SparkMinSize
          - SparkDesiredSize
          - SparkMaxSize
      - Label:
          default: Configuration
        Parameters:
          - ProjectName

Parameters:
  ProjectName:
    Type: String
    Default: emr-celeborn-demo
    Description: Project name used to import exports and for tagging

  GeneralInstanceType:
    Type: String
    Default: m5.xlarge
    Description: EC2 instance type for general worker nodes

  GeneralMinSize:
    Type: Number
    Default: 2
    Description: Minimum number of general nodes

  GeneralDesiredSize:
    Type: Number
    Default: 2
    Description: Desired number of general nodes

  GeneralMaxSize:
    Type: Number
    Default: 3
    Description: Maximum number of general nodes

  SparkInstanceType:
    Type: String
    Default: r5.2xlarge
    Description: EC2 instance type for Spark executor nodes (memory-optimized)

  SparkMinSize:
    Type: Number
    Default: 3
    Description: Minimum number of Spark nodes

  SparkDesiredSize:
    Type: Number
    Default: 3
    Description: Desired number of Spark nodes

  SparkMaxSize:
    Type: Number
    Default: 6
    Description: Maximum number of Spark nodes

Resources:
  # This template used to be the "nodegroups" stack of a multi-stack EMR-on-EKS
  # reference architecture, importing an EKS cluster + subnets + security
  # groups (EmrClusterName/PrivateSubnet1Id/PrivateSubnet2Id/EmrClusterSgId/
  # EmrCelebornAccessSgId) from a sibling "shared-infra" stack this benchmark
  # never included. Made self-contained: builds its own VPC, 2 private
  # subnets (NAT for node internet access), and a minimal EKS cluster +
  # cluster IAM role inline. NOTE: unlike this benchmark's other fixes, EKS
  # cluster creation alone typically takes 10-15 minutes before nodegroups
  # can even start attaching, so a real-AWS deploy-check run on this specific
  # row needs a much longer timeout than the ~20 minute default used
  # elsewhere in this project.
  EksVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.40.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
  EksInternetGateway:
    Type: AWS::EC2::InternetGateway
  EksVpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref EksVpc
      InternetGatewayId: !Ref EksInternetGateway
  EksPublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref EksVpc
      CidrBlock: 10.40.0.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
  EksPrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref EksVpc
      CidrBlock: 10.40.2.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
  EksPrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref EksVpc
      CidrBlock: 10.40.3.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
  EksPublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref EksVpc
  EksPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: EksVpcGatewayAttachment
    Properties:
      RouteTableId: !Ref EksPublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref EksInternetGateway
  EksPublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref EksPublicSubnet
      RouteTableId: !Ref EksPublicRouteTable
  EksNatEip:
    Type: AWS::EC2::EIP
    DependsOn: EksVpcGatewayAttachment
    Properties:
      Domain: vpc
  EksNatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt EksNatEip.AllocationId
      SubnetId: !Ref EksPublicSubnet
  EksPrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref EksVpc
  EksPrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref EksPrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref EksNatGateway
  EksPrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref EksPrivateSubnet1
      RouteTableId: !Ref EksPrivateRouteTable
  EksPrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref EksPrivateSubnet2
      RouteTableId: !Ref EksPrivateRouteTable

  EmrClusterSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub '${ProjectName}-emr-cluster-sg'
      VpcId: !Ref EksVpc
      SecurityGroupIngress:
        - IpProtocol: '-1'
          CidrIp: 10.40.0.0/16
  EmrCelebornAccessSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub '${ProjectName}-emr-celeborn-access-sg'
      VpcId: !Ref EksVpc
      SecurityGroupIngress:
        - IpProtocol: '-1'
          CidrIp: 10.40.0.0/16

  EksClusterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-eks-cluster-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonEKSClusterPolicy'

  EksSecretsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub 'CMK for ${ProjectName} EKS secrets encryption'
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowAccountFullAccess
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'

  EksCluster:
    Type: AWS::EKS::Cluster
    Properties:
      Name: !Sub '${ProjectName}-eks'
      RoleArn: !GetAtt EksClusterRole.Arn
      ResourcesVpcConfig:
        EndpointPrivateAccess: true
        EndpointPublicAccess: false
        SubnetIds:
          - !Ref EksPrivateSubnet1
          - !Ref EksPrivateSubnet2
          - !Ref EksPublicSubnet
        SecurityGroupIds:
          - !Ref EmrClusterSg
      EncryptionConfig:
        - Resources:
            - secrets
          Provider:
            KeyArn: !GetAtt EksSecretsKey.Arn

  # --- Node Group IAM Role ---

  NodeGroupRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: "Explicit role name required for IRSA trust policy binding in the deploy script. This is a blog post demonstration — resource replacement constraints are not a concern."
    Properties:
      RoleName: !Sub "${ProjectName}-emr-node-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonEKSWorkerNodePolicy"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonEKS_CNI_Policy"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-emr-node-role"
        - Key: Project
          Value: !Ref ProjectName

  # --- EBS CSI Driver IAM Role (trust policy updated via deploy script for IRSA) ---

  EBSCSIDriverRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: "Explicit role name required for IRSA trust policy binding in the deploy script. This is a blog post demonstration — resource replacement constraints are not a concern."
    Properties:
      RoleName: !Sub "${ProjectName}-emr-ebs-csi-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonEBSCSIDriverPolicy"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-emr-ebs-csi-role"
        - Key: Project
          Value: !Ref ProjectName

  # --- Launch Template for Spark Nodes (attaches shared-infra EMR security group) ---

  SparkLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "${ProjectName}-emr-spark-nodes-lt"
      LaunchTemplateData:
        MetadataOptions:
          HttpTokens: required
          HttpPutResponseHopLimit: 2
        SecurityGroupIds:
          - !Ref EmrClusterSg
          - !Ref EmrCelebornAccessSg
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub "${ProjectName}-emr-spark-node"
              - Key: Project
                Value: !Ref ProjectName

  # --- General Node Group (system pods: CoreDNS, kube-proxy, etc.) ---

  GeneralNodeGroup:
    Type: AWS::EKS::Nodegroup
    DependsOn: EksCluster
    Properties:
      NodegroupName: !Sub "${ProjectName}-emr-general"
      ClusterName: !Ref EksCluster
      NodeRole: !GetAtt NodeGroupRole.Arn
      Subnets:
        - !Ref EksPrivateSubnet1
        - !Ref EksPrivateSubnet2
      InstanceTypes:
        - !Ref GeneralInstanceType
      ScalingConfig:
        MinSize: !Ref GeneralMinSize
        DesiredSize: !Ref GeneralDesiredSize
        MaxSize: !Ref GeneralMaxSize
      AmiType: AL2023_x86_64_STANDARD
      CapacityType: ON_DEMAND
      DiskSize: 50
      Labels:
        node-type: general
        node-lifecycle: on-demand
      Tags:
        Name: !Sub "${ProjectName}-emr-general-nodes"
        Project: !Ref ProjectName

  # --- Spark Node Group (EMR executor pods) ---

  SparkNodeGroup:
    Type: AWS::EKS::Nodegroup
    DependsOn: EksCluster
    Properties:
      NodegroupName: !Sub "${ProjectName}-emr-spark"
      ClusterName: !Ref EksCluster
      NodeRole: !GetAtt NodeGroupRole.Arn
      Subnets:
        - !Ref EksPrivateSubnet1
        - !Ref EksPrivateSubnet2
      LaunchTemplate:
        Id: !Ref SparkLaunchTemplate
        Version: !GetAtt SparkLaunchTemplate.LatestVersionNumber
      InstanceTypes:
        - !Ref SparkInstanceType
      ScalingConfig:
        MinSize: !Ref SparkMinSize
        DesiredSize: !Ref SparkDesiredSize
        MaxSize: !Ref SparkMaxSize
      AmiType: AL2023_x86_64_STANDARD
      CapacityType: ON_DEMAND
      Labels:
        node-type: spark
      Tags:
        Name: !Sub "${ProjectName}-emr-spark-nodes"
        Project: !Ref ProjectName

  # --- EBS CSI Driver Addon ---
  # NOTE: The aws-ebs-csi-driver addon is NOT deployed here because it requires
  # an IRSA trust policy on EBSCSIDriverRole. The OIDC provider is only available
  # after the EKS cluster stack deploys, so the trust policy cannot be set in
  # CloudFormation at stack-creation time. Without the correct trust policy, the
  # addon pods cannot assume the role, they crash-loop, and CloudFormation hangs
  # indefinitely in CREATE_IN_PROGRESS.
  # The addon is instead installed via CLI in deploy.sh after OIDC/IRSA setup.

Outputs:
  GeneralNodeGroupName:
    Description: Name of the general node group
    Value: !Ref GeneralNodeGroup
    Export:
      Name: !Sub "${ProjectName}-EmrGeneralNodeGroup"

  SparkNodeGroupName:
    Description: Name of the Spark node group
    Value: !Ref SparkNodeGroup
    Export:
      Name: !Sub "${ProjectName}-EmrSparkNodeGroup"

  EBSCSIDriverRoleName:
    Description: IAM role name for EBS CSI driver (trust policy updated by deploy script)
    Value: !Ref EBSCSIDriverRole
    Export:
      Name: !Sub "${ProjectName}-EmrEBSCSIRoleName"