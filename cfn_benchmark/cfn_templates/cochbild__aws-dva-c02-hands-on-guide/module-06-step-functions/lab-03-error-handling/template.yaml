AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Lab 6.3 — Step Functions Retry + Catch with named custom errors

Resources:
  WorkFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dva-lab-06-03-flaky
      Runtime: python3.12
      Handler: handler.work
      CodeUri: src/
      Timeout: 5

  SfnRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: states.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-lambda
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt WorkFunction.Arn

  StateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: dva-lab-06-03-error-handling
      StateMachineType: STANDARD
      RoleArn: !GetAtt SfnRole.Arn
      DefinitionSubstitutions:
        WorkFunctionArn: !GetAtt WorkFunction.Arn
      DefinitionString: |-
        {
          "Comment": "Demonstrates Retry + Catch with named errors",
          "StartAt": "DoWork",
          "States": {
            "DoWork": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${WorkFunctionArn}",
                "Payload.$": "$"
              },
              "ResultSelector": { "result.$": "$.Payload" },
              "ResultPath": "$.work",
              "Retry": [
                {
                  "ErrorEquals": [ "FlakyError", "Lambda.ServiceException", "Lambda.SdkClientException" ],
                  "IntervalSeconds": 2,
                  "MaxAttempts": 3,
                  "BackoffRate": 2.0,
                  "JitterStrategy": "FULL",
                  "MaxDelaySeconds": 30
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": [ "States.ALL" ],
                  "ResultPath": "$.error",
                  "Next": "HandleFailure"
                }
              ],
              "Next": "Succeed"
            },
            "HandleFailure": {
              "Type": "Pass",
              "Parameters": {
                "outcome": "failed",
                "originalInput.$": "$",
                "errorInfo.$": "$.error"
              },
              "End": true
            },
            "Succeed": {
              "Type": "Succeed"
            }
          }
        }

Outputs:
  StateMachineArn:
    Value: !Ref StateMachine
  WorkFunctionName:
    Value: !Ref WorkFunction