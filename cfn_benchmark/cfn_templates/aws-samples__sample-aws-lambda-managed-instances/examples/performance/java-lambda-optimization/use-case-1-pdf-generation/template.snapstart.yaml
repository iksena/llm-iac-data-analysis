AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  LMI Blog — Use Case 1: PDF Report Generation (SnapStart)

Parameters:
  MemorySize:
    Type: Number
    Default: 2048
    AllowedValues: [512, 1024, 2048, 3008]

Globals:
  Function:
    Tracing: Active
    CodeUri: target/pdf-generation-1.0.0-SNAPSHOT.jar
    Handler: org.springframework.cloud.function.adapter.aws.FunctionInvoker::handleRequest
    Runtime: java25
    Timeout: 60
    MemorySize: !Ref MemorySize
    Architectures:
      - x86_64
    AutoPublishAlias: live
    SnapStart:
      ApplyOn: PublishedVersions
    Environment:
      Variables:
        TRANSACTION_TABLE_NAME: !Ref TransactionsTable
        REPORT_BUCKET_NAME: !Ref ReportBucket
        MAIN_CLASS: com.aws.lmi.pdf.PdfGenerationApplication
        JAVA_TOOL_OPTIONS: >-
          -XX:+TieredCompilation
          -XX:+UseG1GC
          -Xlog:gc:stderr:time,tags

Resources:
  ReportApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Name: lmi-blog-pdf-snapstart

  GenerateReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      Environment:
        Variables:
          SPRING_CLOUD_FUNCTION_DEFINITION: pdfGeneratorFunction
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TransactionsTable
        - S3CrudPolicy:
            BucketName: !Ref ReportBucket
      Events:
        PostReport:
          Type: Api
          Properties:
            RestApiId: !Ref ReportApi
            Path: /reports
            Method: post

  GenerateReportFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${GenerateReportFunction}"
      RetentionInDays: 7

  TransactionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-transactions"
      AttributeDefinitions:
        - AttributeName: accountId
          AttributeType: S
        - AttributeName: transactionId
          AttributeType: S
      KeySchema:
        - AttributeName: accountId
          KeyType: HASH
        - AttributeName: transactionId
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST

  ReportBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-reports-${AWS::AccountId}"
      LifecycleConfiguration:
        Rules:
          - Id: CleanupOldReports
            Status: Enabled
            ExpirationInDays: 7

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${ReportApi}.execute-api.${AWS::Region}.amazonaws.com/prod/reports"
  TransactionsTableName:
    Value: !Ref TransactionsTable
  ReportBucketName:
    Value: !Ref ReportBucket