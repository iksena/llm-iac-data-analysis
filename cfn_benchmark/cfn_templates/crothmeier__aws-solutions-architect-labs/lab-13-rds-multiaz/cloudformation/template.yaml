AWSTemplateFormatVersion: '2010-09-09'
Description: 'Lab 13: RDS Multi-AZ with Read Replicas'

Parameters:
  EnvironmentName:
    Type: String
    Default: Lab13
    Description: Environment name prefix

  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: Database admin password (min 8 characters)

  DBInstanceClass:
    Type: String
    Default: db.t3.medium
    AllowedValues:
      - db.t3.micro
      - db.t3.small
      - db.t3.medium
      - db.t3.large
    Description: RDS instance type

  Engine:
    Type: String
    Default: mysql
    AllowedValues:
      - mysql
      - postgres
    Description: Database engine

Resources:
  # VPC and Networking
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-VPC'

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-Private-Subnet-1'

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-Private-Subnet-2'

  PrivateSubnet3:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: !Select [2, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-Private-Subnet-3'

  # DB Subnet Group
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupName: !Sub '${EnvironmentName}-db-subnet-group'
      DBSubnetGroupDescription: Subnet group for RDS
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
        - !Ref PrivateSubnet3
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-DB-Subnet-Group'

  # Security Group for RDS
  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${EnvironmentName}-DB-SG'
      GroupDescription: Security group for RDS database
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !If [IsMySQL, 3306, 5432]
          ToPort: !If [IsMySQL, 3306, 5432]
          CidrIp: 10.0.0.0/16
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-DB-SG'

  # KMS Key for RDS Encryption
  DBEncryptionKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS key for RDS encryption
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'

  DBEncryptionKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/${EnvironmentName}-rds-key'
      TargetKeyId: !Ref DBEncryptionKey

  # DB Parameter Group
  DBParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Family: !If [IsMySQL, 'mysql8.0', 'postgres14']
      Description: !Sub '${EnvironmentName} DB Parameter Group'
      Parameters:
        !If
          - IsMySQL
          - max_connections: '100'
            slow_query_log: '1'
            long_query_time: '2'
          - max_connections: '100'
            log_statement: 'all'
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-DB-ParamGroup'

  # Primary RDS Instance (Multi-AZ)
  PrimaryDB:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub '${EnvironmentName}-primary-db'
      DBInstanceClass: !Ref DBInstanceClass
      Engine: !Ref Engine
      EngineVersion: !If [IsMySQL, '8.0.35', '14.10']
      MasterUsername: admin
      MasterUserPassword: !Ref DBPassword
      AllocatedStorage: '100'
      StorageType: gp3
      StorageEncrypted: true
      KmsKeyId: !Ref DBEncryptionKey
      MultiAZ: true
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref DBSecurityGroup
      DBParameterGroupName: !Ref DBParameterGroup
      BackupRetentionPeriod: 7
      PreferredBackupWindow: '03:00-04:00'
      PreferredMaintenanceWindow: 'mon:04:00-mon:05:00'
      EnableCloudwatchLogsExports:
        !If
          - IsMySQL
          - - error
            - general
            - slowquery
          - - postgresql
      DeletionProtection: false
      EnableIAMDatabaseAuthentication: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-Primary-DB'

  # Read Replica 1
  ReadReplica1:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub '${EnvironmentName}-read-replica-1'
      SourceDBInstanceIdentifier: !Ref PrimaryDB
      DBInstanceClass: db.t3.small
      PubliclyAccessible: false
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-Read-Replica-1'

  # Read Replica 2
  ReadReplica2:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub '${EnvironmentName}-read-replica-2'
      SourceDBInstanceIdentifier: !Ref PrimaryDB
      DBInstanceClass: db.t3.small
      PubliclyAccessible: false
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-Read-Replica-2'

  # CloudWatch Alarms
  HighCPUAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${EnvironmentName}-RDS-High-CPU'
      AlarmDescription: Alert when CPU exceeds 80%
      MetricName: CPUUtilization
      Namespace: AWS/RDS
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref PrimaryDB

  HighConnectionsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${EnvironmentName}-RDS-High-Connections'
      AlarmDescription: Alert when connections exceed 80
      MetricName: DatabaseConnections
      Namespace: AWS/RDS
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref PrimaryDB

Conditions:
  IsMySQL: !Equals [!Ref Engine, 'mysql']

Outputs:
  DBEndpoint:
    Description: Primary database endpoint
    Value: !GetAtt PrimaryDB.Endpoint.Address
    Export:
      Name: !Sub '${AWS::StackName}-DBEndpoint'

  DBPort:
    Description: Database port
    Value: !GetAtt PrimaryDB.Endpoint.Port
    Export:
      Name: !Sub '${AWS::StackName}-DBPort'

  ReadReplica1Endpoint:
    Description: Read Replica 1 endpoint
    Value: !GetAtt ReadReplica1.Endpoint.Address
    Export:
      Name: !Sub '${AWS::StackName}-ReadReplica1'

  ReadReplica2Endpoint:
    Description: Read Replica 2 endpoint
    Value: !GetAtt ReadReplica2.Endpoint.Address
    Export:
      Name: !Sub '${AWS::StackName}-ReadReplica2'

  DBName:
    Description: Database name
    Value: !If [IsMySQL, 'mysql', 'postgres']

  ConnectionString:
    Description: Sample connection string
    Value: !Sub
      - '${Engine} -h ${Endpoint} -u admin -p'
      - Endpoint: !GetAtt PrimaryDB.Endpoint.Address