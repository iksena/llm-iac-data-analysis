AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Bedrock Governance Admin Portal — API Gateway + Lambda for admins to view usage,
  manage approvals, and audit access. Also provides the callback endpoint for
  Step Functions approval/deny actions.

Parameters:
  DeploymentBucket:
    Type: String
    Default: "{{DEPLOYMENT_BUCKET}}"
  AllowedApprovers:
    Type: String
    Default: "{{REVIEWER_EMAIL}}"
    Description: >
      Comma-separated list of email addresses or aliases allowed to approve/deny
      requests. If empty, any authenticated IAM principal can approve.

Resources:

  # ─────────────────────────────────────────────────────────
  # API Gateway
  # ─────────────────────────────────────────────────────────
  AdminApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: bedrock-governance-admin
      Description: Admin API for Bedrock governance — approvals, usage, audit

  # ─────────────────────────────────────────────────────────
  # Lambda: Admin Dashboard (list requests, usage, approvals)
  # ─────────────────────────────────────────────────────────
  AdminDashboardFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: bedrock-governance-admin-dashboard
      Runtime: python3.12
      Handler: admin_dashboard.handler
      Role: !GetAtt AdminLambdaRole.Arn
      Timeout: 30
      Code:
        S3Bucket: !Ref DeploymentBucket
        S3Key: lambda/admin_dashboard.zip
      Environment:
        Variables:
          REQUESTS_TABLE: bedrock-governance-requests
          PROJECTS_TABLE: bedrock-governance-projects
          STATE_MACHINE_ARN: !ImportValue BedrockGovernance-StateMachineArn

  # ─────────────────────────────────────────────────────────
  # Lambda: Approval callback (approve/deny from email link)
  # ─────────────────────────────────────────────────────────
  ApprovalCallbackFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: bedrock-governance-approval-callback
      Runtime: python3.12
      Handler: approval_callback.handler
      Role: !GetAtt AdminLambdaRole.Arn
      Timeout: 15
      Code:
        S3Bucket: !Ref DeploymentBucket
        S3Key: lambda/approval_callback.zip
      Environment:
        Variables:
          REQUESTS_TABLE: bedrock-governance-requests
          ALLOWED_APPROVERS: !Ref AllowedApprovers

  # ─────────────────────────────────────────────────────────
  # Lambda: Usage report (aggregated view from CUR/CloudWatch)
  # ─────────────────────────────────────────────────────────
  UsageReportFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: bedrock-governance-usage-report
      Runtime: python3.12
      Handler: usage_report.handler
      Role: !GetAtt AdminLambdaRole.Arn
      Timeout: 60
      Code:
        S3Bucket: !Ref DeploymentBucket
        S3Key: lambda/usage_report.zip
      Environment:
        Variables:
          ATHENA_WORKGROUP: bedrock-governance
          ATHENA_DATABASE: bedrock_cur
          RESULTS_BUCKET: !ImportValue "BedrockGovernance-AthenaResultsBucket"

  # ─────────────────────────────────────────────────────────
  # Lambda: Submit Request (developer-facing, starts approval workflow)
  # ─────────────────────────────────────────────────────────
  SubmitRequestFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: bedrock-governance-submit-request
      Runtime: python3.12
      Handler: submit_request.handler
      Role: !GetAtt SubmitRequestLambdaRole.Arn
      Timeout: 15
      Code:
        S3Bucket: !Ref DeploymentBucket
        S3Key: lambda/submit_request.zip
      Environment:
        Variables:
          STATE_MACHINE_ARN: !ImportValue BedrockGovernance-StateMachineArn
          MAX_REQUESTS_PER_DAY: "3"

  # ─────────────────────────────────────────────────────────
  # Lambda: Register Project (developer-facing, writes to projects table)
  # ─────────────────────────────────────────────────────────
  RegisterProjectFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: bedrock-governance-register-project
      Runtime: python3.12
      Handler: register_project.handler
      Role: !GetAtt RegisterProjectLambdaRole.Arn
      Timeout: 15
      Code:
        S3Bucket: !Ref DeploymentBucket
        S3Key: lambda/register_project.zip
      Environment:
        Variables:
          PROJECTS_TABLE: bedrock-governance-projects

  RegisterProjectLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: BedrockGovernance-RegisterProjectLambda
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RegisterProjectPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/bedrock-governance-projects"
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"

  SubmitRequestLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: BedrockGovernance-SubmitRequestLambda
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SubmitRequestPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !ImportValue BedrockGovernance-StateMachineArn
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"

  # ─────────────────────────────────────────────────────────
  # Admin Lambda Role
  # ─────────────────────────────────────────────────────────
  AdminLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: BedrockGovernance-AdminLambda
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AdminLambdaPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Scan
                  - dynamodb:Query
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource:
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/bedrock-governance-*"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/bedrock-governance-*/index/*"
              - Effect: Allow
                Action:
                  - states:SendTaskSuccess
                  - states:SendTaskFailure
                  - states:ListExecutions
                  - states:DescribeExecution
                Resource: !ImportValue BedrockGovernance-StateMachineArn
              - Effect: Allow
                Action:
                  - athena:StartQueryExecution
                  - athena:GetQueryExecution
                  - athena:GetQueryResults
                Resource: "*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub
                  - "arn:aws:s3:::${BucketName}/*"
                  - BucketName: !ImportValue BedrockGovernance-AthenaResultsBucket
              - Effect: Allow
                Action:
                  - iam:ListUserTags
                  - iam:ListRoleTags
                  - iam:ListUsers
                  - iam:ListRoles
                Resource: "*"
              - Effect: Allow
                Action:
                  - ce:GetCostAndUsage
                  - ce:GetCostAndUsageWithResources
                Resource: "*"
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"

  # ─────────────────────────────────────────────────────────
  # API Gateway Resources & Methods
  # ─────────────────────────────────────────────────────────
  ApproveResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AdminApi
      ParentId: !GetAtt AdminApi.RootResourceId
      PathPart: approve

  ApproveRequestIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AdminApi
      ParentId: !Ref ApproveResource
      PathPart: "{requestId}"

  ApproveMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AdminApi
      ResourceId: !Ref ApproveRequestIdResource
      HttpMethod: GET
      AuthorizationType: AWS_IAM
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApprovalCallbackFunction.Arn}/invocations"

  DenyResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AdminApi
      ParentId: !GetAtt AdminApi.RootResourceId
      PathPart: deny

  DenyRequestIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AdminApi
      ParentId: !Ref DenyResource
      PathPart: "{requestId}"

  DenyMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AdminApi
      ResourceId: !Ref DenyRequestIdResource
      HttpMethod: GET
      AuthorizationType: AWS_IAM
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApprovalCallbackFunction.Arn}/invocations"

  DashboardResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AdminApi
      ParentId: !GetAtt AdminApi.RootResourceId
      PathPart: dashboard

  DashboardMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AdminApi
      ResourceId: !Ref DashboardResource
      HttpMethod: GET
      AuthorizationType: AWS_IAM
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AdminDashboardFunction.Arn}/invocations"

  UsageResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AdminApi
      ParentId: !GetAtt AdminApi.RootResourceId
      PathPart: usage

  UsageMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AdminApi
      ResourceId: !Ref UsageResource
      HttpMethod: GET
      AuthorizationType: AWS_IAM
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UsageReportFunction.Arn}/invocations"

  # ─────────────────────────────────────────────────────────
  # Developer Submit Request Endpoint (POST /request)
  # ─────────────────────────────────────────────────────────
  RequestResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AdminApi
      ParentId: !GetAtt AdminApi.RootResourceId
      PathPart: request

  RequestMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AdminApi
      ResourceId: !Ref RequestResource
      HttpMethod: POST
      AuthorizationType: AWS_IAM
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SubmitRequestFunction.Arn}/invocations"

  # ─────────────────────────────────────────────────────────
  # Developer Register Project Endpoint (POST /register-project)
  # ─────────────────────────────────────────────────────────
  RegisterProjectResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AdminApi
      ParentId: !GetAtt AdminApi.RootResourceId
      PathPart: register-project

  RegisterProjectMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AdminApi
      ResourceId: !Ref RegisterProjectResource
      HttpMethod: POST
      AuthorizationType: AWS_IAM
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${RegisterProjectFunction.Arn}/invocations"

  # Lambda invoke permissions for API Gateway
  RegisterProjectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RegisterProjectFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${AdminApi}/*"

  SubmitRequestPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SubmitRequestFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${AdminApi}/*"

  ApprovalCallbackPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApprovalCallbackFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${AdminApi}/*"

  DashboardPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AdminDashboardFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${AdminApi}/*"

  UsageReportPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UsageReportFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${AdminApi}/*"

  # Deploy the API
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - ApproveMethod
      - DenyMethod
      - DashboardMethod
      - UsageMethod
      - RequestMethod
      - RegisterProjectMethod
    Properties:
      RestApiId: !Ref AdminApi
      StageName: prod

Outputs:
  AdminApiUrl:
    Value: !Sub "https://${AdminApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
    Description: Admin API base URL
    Export:
      Name: BedrockGovernance-AdminApiUrl

  ApproveEndpoint:
    Value: !Sub "https://${AdminApi}.execute-api.${AWS::Region}.amazonaws.com/prod/approve/{requestId}"
    Description: Approval callback URL pattern

  DashboardEndpoint:
    Value: !Sub "https://${AdminApi}.execute-api.${AWS::Region}.amazonaws.com/prod/dashboard"
    Description: Admin dashboard endpoint

  UsageEndpoint:
    Value: !Sub "https://${AdminApi}.execute-api.${AWS::Region}.amazonaws.com/prod/usage"
    Description: Usage report endpoint

  RequestEndpoint:
    Value: !Sub "https://${AdminApi}.execute-api.${AWS::Region}.amazonaws.com/prod/request"
    Description: Developer request submission endpoint (POST)
    Export:
      Name: BedrockGovernance-RequestEndpoint