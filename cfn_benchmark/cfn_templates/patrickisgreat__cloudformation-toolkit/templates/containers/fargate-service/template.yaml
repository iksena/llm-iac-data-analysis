AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  Fargate service with task definition, IAM roles, logging, optional load
  balancer attachment, and target-tracking autoscaling on CPU, memory and
  request count. The container archetype most server applications collapse into.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Naming
        Parameters:
          - NamePrefix
          - Environment
          - ServiceSuffix
      - Label:
          default: Placement
        Parameters:
          - ClusterName
          - VpcId
          - SubnetIds
          - AssignPublicIp
          - UseClusterCapacityProviderStrategy
      - Label:
          default: Container
        Parameters:
          - ImageUri
          - ContainerPort
          - Cpu
          - Memory
          - Command
          - StopTimeoutSeconds
      - Label:
          default: Container environment
        Parameters:
          - EnvVar1Name
          - EnvVar1Value
          - EnvVar2Name
          - EnvVar2Value
          - EnvVar3Name
          - EnvVar3Value
          - EnvVar4Name
          - EnvVar4Value
      - Label:
          default: Injected secrets
        Parameters:
          - Secret1Name
          - Secret1Arn
          - Secret1JsonKey
          - Secret2Name
          - Secret2Arn
          - Secret2JsonKey
      - Label:
          default: Load balancer attachment (leave ListenerArn empty for a worker)
        Parameters:
          - ListenerArn
          - LoadBalancerFullName
          - AlbSecurityGroupId
          - ListenerRulePriority
          - HostHeader
          - PathPattern
          - ProtocolVersion
          - DeregistrationDelaySeconds
      - Label:
          default: Health checks
        Parameters:
          - HealthCheckPath
          - HealthCheckMatcher
          - HealthCheckIntervalSeconds
          - HealthyThresholdCount
          - UnhealthyThresholdCount
          - HealthCheckGracePeriodSeconds
      - Label:
          default: Scaling
        Parameters:
          - DesiredCount
          - MinCapacity
          - MaxCapacity
          - TargetCpuUtilization
          - TargetMemoryUtilization
          - TargetRequestsPerTask
          - ScaleInCooldownSeconds
          - ScaleOutCooldownSeconds
      - Label:
          default: Operations
        Parameters:
          - LogRetentionDays
          - EnableExecuteCommand
          - TaskRoleManagedPolicyArn

Parameters:
  NamePrefix:
    Type: String
    Description: Prefix for every resource this stack names.
    AllowedPattern: "^[a-z][a-z0-9-]{1,30}[a-z0-9]$"
    ConstraintDescription: 3-32 lowercase characters, digits and hyphens.

  Environment:
    Type: String
    Description: Environment this service runs in. Injected as the ENVIRONMENT variable.
    Default: dev
    AllowedValues: [dev, staging, prod]

  ServiceSuffix:
    Type: String
    Description: Distinguishes services under one prefix, e.g. "api" or "worker".
    Default: app
    AllowedPattern: "^[a-z0-9][a-z0-9-]{0,30}$"

  ClusterName:
    Type: String
    Description: ECS cluster name, from containers/ecs-cluster.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC the tasks and target group live in.

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >-
      Subnets to place tasks in. Use private subnets; the load balancer is what
      lives in public ones.

  AssignPublicIp:
    Type: String
    Description: >-
      Give each task a public IP. Only needed when tasks run in public subnets
      with no NAT gateway - a task in a private subnet with no route out cannot
      pull its image, and this is the wrong fix for that.
    Default: DISABLED
    AllowedValues: [ENABLED, DISABLED]

  UseClusterCapacityProviderStrategy:
    Type: String
    Description: >-
      Inherit the cluster's Fargate/Spot mix. Set to false to pin this service to
      on-demand Fargate regardless of the cluster default - the right choice for
      a service that cannot tolerate a two-minute reclamation notice.
    Default: "true"
    AllowedValues: ["true", "false"]

  ImageUri:
    Type: String
    Description: >-
      Full image URI including tag or digest, e.g.
      123456789012.dkr.ecr.us-east-1.amazonaws.com/app/api:abc1234. Prefer a
      digest or a commit-SHA tag; ":latest" makes a deploy unreproducible.

  ContainerPort:
    Type: Number
    Description: Port the container listens on. Injected as the PORT variable.
    Default: 8080
    MinValue: 1
    MaxValue: 65535

  Cpu:
    Type: String
    Description: >-
      Fargate CPU units (1024 = 1 vCPU). Memory must be a legal pairing for the
      chosen CPU; the console rejects invalid combinations at deploy time.
    Default: "512"
    AllowedValues: ["256", "512", "1024", "2048", "4096", "8192", "16384"]

  Memory:
    Type: String
    Description: >-
      Memory in MiB. Legal ranges per CPU size: 256 -> 512-2048; 512 -> 1024-4096;
      1024 -> 2048-8192; 2048 -> 4096-16384; 4096 -> 8192-30720.
    Default: "1024"

  Command:
    Type: CommaDelimitedList
    Description: >-
      Override the image's CMD, as comma-separated arguments. Leave empty to use
      the image default.
    Default: ""

  StopTimeoutSeconds:
    Type: Number
    Description: >-
      Grace period between SIGTERM and SIGKILL. Must exceed your longest
      in-flight request, or a deploy cuts responses off mid-flight.
    Default: 30
    MinValue: 2
    MaxValue: 120

  EnvVar1Name:
    Type: String
    Description: Name of an additional environment variable. Leave empty to skip.
    Default: ""
  EnvVar1Value:
    Type: String
    Description: Value for EnvVar1Name. Never put a credential here - use the secret slots.
    Default: ""
  EnvVar2Name:
    Type: String
    Description: Name of an additional environment variable. Leave empty to skip.
    Default: ""
  EnvVar2Value:
    Type: String
    Description: Value for EnvVar2Name.
    Default: ""
  EnvVar3Name:
    Type: String
    Description: Name of an additional environment variable. Leave empty to skip.
    Default: ""
  EnvVar3Value:
    Type: String
    Description: Value for EnvVar3Name.
    Default: ""
  EnvVar4Name:
    Type: String
    Description: Name of an additional environment variable. Leave empty to skip.
    Default: ""
  EnvVar4Value:
    Type: String
    Description: Value for EnvVar4Name.
    Default: ""

  Secret1Name:
    Type: String
    Description: >-
      Environment variable name to inject a secret into. The value never appears
      in the task definition - ECS resolves it at task start, and it is not
      visible in describe-task-definition.
    Default: ""
  Secret1Arn:
    Type: String
    Description: >-
      Secrets Manager secret ARN or SSM Parameter ARN supplying Secret1Name. Pass
      the plain ARN; the JSON key goes in Secret1JsonKey. The execution role is
      granted read access to exactly this ARN.
    Default: ""
  Secret1JsonKey:
    Type: String
    Description: >-
      Key to extract when the secret holds JSON, e.g. "password" for a secret
      shaped {"username":...,"password":...}. Leave empty to inject the whole
      value.
    Default: ""
  Secret2Name:
    Type: String
    Description: Environment variable name for a second injected secret.
    Default: ""
  Secret2Arn:
    Type: String
    Description: Secrets Manager or SSM ARN supplying Secret2Name.
    Default: ""
  Secret2JsonKey:
    Type: String
    Description: Key to extract when the second secret holds JSON.
    Default: ""

  ListenerArn:
    Type: String
    Description: >-
      ALB listener to attach to, from containers/alb's ListenerArn output. Leave
      empty for a service with no inbound traffic - a queue consumer or scheduled
      worker - which skips the target group, rule, and health checks entirely.
    Default: ""

  LoadBalancerFullName:
    Type: String
    Description: >-
      The load balancer's full name (app/<name>/<id>), from containers/alb.
      Required for request-count autoscaling; leave empty to scale on CPU and
      memory only.
    Default: ""

  AlbSecurityGroupId:
    Type: String
    Description: >-
      Security group of the load balancer. The task security group admits traffic
      from this group only, so tasks are unreachable except through the ALB.
    Default: ""

  ListenerRulePriority:
    Type: Number
    Description: >-
      Priority of this service's listener rule. Must be unique per listener -
      two services sharing a priority is a deploy failure, so allocate them
      deliberately (100, 200, 300...).
    Default: 100
    MinValue: 1
    MaxValue: 50000

  HostHeader:
    Type: String
    Description: >-
      Host header this service answers for, e.g. api.example.com. Leave empty to
      match any host and route on path alone.
    Default: ""

  PathPattern:
    Type: String
    Description: Path pattern this service answers for.
    Default: "/*"

  ProtocolVersion:
    Type: String
    Description: >-
      Backend protocol. HTTP1 for a normal REST or GraphQL service, HTTP2 for
      h2c, GRPC for a gRPC service - which also switches health checking to gRPC
      status codes.
    Default: HTTP1
    AllowedValues: [HTTP1, HTTP2, GRPC]

  DeregistrationDelaySeconds:
    Type: Number
    Description: >-
      How long the ALB waits for in-flight requests before removing a target.
      The 300s default makes every deploy five minutes longer than it needs to
      be; 30s is right for a normal API.
    Default: 30
    MinValue: 0
    MaxValue: 3600

  HealthCheckPath:
    Type: String
    Description: >-
      Health check path. For GRPC this is a fully qualified method, e.g.
      /grpc.health.v1.Health/Check.
    Default: /healthz

  HealthCheckMatcher:
    Type: String
    Description: >-
      Success codes for HTTP health checks. Ignored for GRPC, which matches gRPC
      status 0.
    Default: "200"

  HealthCheckIntervalSeconds:
    Type: Number
    Description: Seconds between health checks.
    Default: 15
    MinValue: 5
    MaxValue: 300

  HealthyThresholdCount:
    Type: Number
    Description: Consecutive successes before a target receives traffic.
    Default: 2
    MinValue: 2
    MaxValue: 10

  UnhealthyThresholdCount:
    Type: Number
    Description: Consecutive failures before a target is removed.
    Default: 3
    MinValue: 2
    MaxValue: 10

  HealthCheckGracePeriodSeconds:
    Type: Number
    Description: >-
      How long after a task starts before ECS trusts the load balancer's health
      verdict. Set it above your worst-case cold start - a JVM or a model load
      can take minutes, and too short a grace period produces an infinite
      kill-and-restart loop that looks like a crash.
    Default: 60
    MinValue: 0
    MaxValue: 2147483647

  DesiredCount:
    Type: Number
    Description: >-
      Task count at deploy. Autoscaling takes over afterwards, so this is only
      the starting point.
    Default: 2
    MinValue: 0
    MaxValue: 5000

  MinCapacity:
    Type: Number
    Description: >-
      Floor for autoscaling. Two is the smallest number that survives a task
      replacement or an AZ event without dropping to zero capacity.
    Default: 2
    MinValue: 0
    MaxValue: 5000

  MaxCapacity:
    Type: Number
    Description: >-
      Ceiling for autoscaling. This is your cost cap and your blast-radius limit
      under a traffic spike or a retry storm.
    Default: 10
    MinValue: 1
    MaxValue: 5000

  TargetCpuUtilization:
    Type: Number
    Description: >-
      Average CPU percentage the scaler aims to hold. Lower reacts sooner and
      costs more; above about 80 there is no headroom left to absorb a spike
      while new tasks start.
    Default: 65
    MinValue: 10
    MaxValue: 90

  TargetMemoryUtilization:
    Type: Number
    Description: >-
      Average memory percentage to hold. Set to 0 to disable memory scaling,
      which is usually right for a runtime with a garbage collector - the JVM
      and Go both hold memory at a high-water mark that scaling out never
      reduces.
    Default: 0
    MinValue: 0
    MaxValue: 90

  TargetRequestsPerTask:
    Type: Number
    Description: >-
      Requests per task per minute to hold. This is the best signal for a
      latency-sensitive HTTP service, because it reacts to load rather than to
      the symptom of load. Requires ListenerArn and LoadBalancerFullName; set to
      0 to disable.
    Default: 0
    MinValue: 0
    MaxValue: 1000000

  ScaleOutCooldownSeconds:
    Type: Number
    Description: Seconds to wait after scaling out before scaling out again.
    Default: 60
    MinValue: 0
    MaxValue: 3600

  ScaleInCooldownSeconds:
    Type: Number
    Description: >-
      Seconds to wait after scaling in before scaling in again. Deliberately
      longer than the scale-out cooldown: scaling out too eagerly costs money,
      scaling in too eagerly costs availability.
    Default: 300
    MinValue: 0
    MaxValue: 3600

  LogRetentionDays:
    Type: Number
    Description: Retention for the container log group.
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1827, 3653]

  EnableExecuteCommand:
    Type: String
    Description: >-
      Allow ECS Exec into running tasks. Sessions are recorded when the cluster
      has exec logging on.
    Default: "true"
    AllowedValues: ["true", "false"]

  TaskRoleManagedPolicyArn:
    Type: String
    Description: >-
      Managed policy granting the application the AWS access it needs - its
      tables, buckets, queues. Leave empty for a service that calls no AWS APIs.
    Default: ""

Conditions:
  AttachedToLoadBalancer: !Not [!Equals [!Ref ListenerArn, ""]]
  IsGrpc: !Equals [!Ref ProtocolVersion, "GRPC"]
  HasHostHeader: !Not [!Equals [!Ref HostHeader, ""]]
  HasCommand: !Not [!Equals [!Join ["", !Ref Command], ""]]
  HasEnvVar1: !Not [!Equals [!Ref EnvVar1Name, ""]]
  HasEnvVar2: !Not [!Equals [!Ref EnvVar2Name, ""]]
  HasEnvVar3: !Not [!Equals [!Ref EnvVar3Name, ""]]
  HasEnvVar4: !Not [!Equals [!Ref EnvVar4Name, ""]]
  HasSecret1: !Not [!Equals [!Ref Secret1Name, ""]]
  HasSecret2: !Not [!Equals [!Ref Secret2Name, ""]]
  HasSecret1JsonKey: !Not [!Equals [!Ref Secret1JsonKey, ""]]
  HasSecret2JsonKey: !Not [!Equals [!Ref Secret2JsonKey, ""]]
  HasAnySecret: !Or [!Condition HasSecret1, !Condition HasSecret2]
  HasTaskPolicy: !Not [!Equals [!Ref TaskRoleManagedPolicyArn, ""]]
  UsesClusterStrategy: !Equals [!Ref UseClusterCapacityProviderStrategy, "true"]
  ScalesOnMemory: !Not [!Equals [!Ref TargetMemoryUtilization, 0]]
  ScalesOnRequests: !And
    - !Condition AttachedToLoadBalancer
    - !Not [!Equals [!Ref TargetRequestsPerTask, 0]]
    - !Not [!Equals [!Ref LoadBalancerFullName, ""]]

Resources:
  LogGroup:
    Type: AWS::Logs::LogGroup
    # Logs are what you read to understand why a deploy failed. Deleting them as
    # part of the rollback removes the evidence.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/${Environment}/${NamePrefix}/${ServiceSuffix}"
      RetentionInDays: !Ref LogRetentionDays

  # Two roles, deliberately. The execution role belongs to the ECS agent and is
  # used before the container starts (pull the image, fetch secrets, create log
  # streams). The task role belongs to the application. Merging them hands the
  # application the ability to read every secret the task definition references,
  # which is exactly what secret injection is meant to avoid.
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"
      Policies:
        - !If
          - HasAnySecret
          - PolicyName: read-injected-secrets
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - secretsmanager:GetSecretValue
                    - ssm:GetParameters
                  # Scoped to exactly the secrets this task definition injects,
                  # not to every secret in the account. This is why the ARN and
                  # the JSON key are separate parameters: the IAM resource is the
                  # secret ARN, while ValueFrom carries the ":key::" suffix, and
                  # granting on the suffixed string matches nothing.
                  Resource:
                    - !If [HasSecret1, !Ref Secret1Arn, !Ref "AWS::NoValue"]
                    - !If [HasSecret2, !Ref Secret2Arn, !Ref "AWS::NoValue"]
          - !Ref AWS::NoValue

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      ManagedPolicyArns:
        - !If [HasTaskPolicy, !Ref TaskRoleManagedPolicyArn, !Ref "AWS::NoValue"]
      Policies:
        - PolicyName: ecs-exec
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # ECS Exec runs over an SSM channel opened by the task itself, so
              # these live on the task role rather than the execution role.
              - Effect: Allow
                Action:
                  - ssmmessages:CreateControlChannel
                  - ssmmessages:CreateDataChannel
                  - ssmmessages:OpenControlChannel
                  - ssmmessages:OpenDataChannel
                Resource: "*"

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "Tasks for ${NamePrefix}-${ServiceSuffix} (${Environment})"
      VpcId: !Ref VpcId
      SecurityGroupIngress: !If
        - AttachedToLoadBalancer
        - - Description: Application traffic from the load balancer only
            IpProtocol: tcp
            FromPort: !Ref ContainerPort
            ToPort: !Ref ContainerPort
            SourceSecurityGroupId: !Ref AlbSecurityGroupId
        - !Ref AWS::NoValue
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-${ServiceSuffix}"

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${NamePrefix}-${ServiceSuffix}-${Environment}"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref Cpu
      Memory: !Ref Memory
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: !Ref ServiceSuffix
          Image: !Ref ImageUri
          Essential: true
          StopTimeout: !Ref StopTimeoutSeconds
          Command: !If [HasCommand, !Ref Command, !Ref "AWS::NoValue"]
          PortMappings:
            - Name: !Ref ServiceSuffix
              ContainerPort: !Ref ContainerPort
              Protocol: tcp
              AppProtocol: !If [IsGrpc, grpc, http]
          Environment:
            # Injected unconditionally so every service in the library reads its
            # environment and port the same way, whatever language it is in.
            - Name: ENVIRONMENT
              Value: !Ref Environment
            - Name: PORT
              Value: !Ref ContainerPort
            - !If [HasEnvVar1, {Name: !Ref EnvVar1Name, Value: !Ref EnvVar1Value}, !Ref "AWS::NoValue"]
            - !If [HasEnvVar2, {Name: !Ref EnvVar2Name, Value: !Ref EnvVar2Value}, !Ref "AWS::NoValue"]
            - !If [HasEnvVar3, {Name: !Ref EnvVar3Name, Value: !Ref EnvVar3Value}, !Ref "AWS::NoValue"]
            - !If [HasEnvVar4, {Name: !Ref EnvVar4Name, Value: !Ref EnvVar4Value}, !Ref "AWS::NoValue"]
          Secrets: !If
            - HasAnySecret
            - - !If
                - HasSecret1
                - Name: !Ref Secret1Name
                  ValueFrom: !If
                    - HasSecret1JsonKey
                    - !Sub "${Secret1Arn}:${Secret1JsonKey}::"
                    - !Ref Secret1Arn
                - !Ref AWS::NoValue
              - !If
                - HasSecret2
                - Name: !Ref Secret2Name
                  ValueFrom: !If
                    - HasSecret2JsonKey
                    - !Sub "${Secret2Arn}:${Secret2JsonKey}::"
                    - !Ref Secret2Arn
                - !Ref AWS::NoValue
            - !Ref AWS::NoValue
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
              # Without this the awslogs driver fails the task when it cannot
              # reach CloudWatch, turning a logging blip into an outage.
              mode: non-blocking
              max-buffer-size: 4m

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Condition: AttachedToLoadBalancer
    Properties:
      VpcId: !Ref VpcId
      Port: !Ref ContainerPort
      Protocol: HTTP
      ProtocolVersion: !Ref ProtocolVersion
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckPath: !Ref HealthCheckPath
      HealthCheckIntervalSeconds: !Ref HealthCheckIntervalSeconds
      HealthyThresholdCount: !Ref HealthyThresholdCount
      UnhealthyThresholdCount: !Ref UnhealthyThresholdCount
      # gRPC health checks match gRPC status codes, not HTTP ones. Leaving
      # HttpCode here on a GRPC target group is rejected at deploy time.
      Matcher: !If
        - IsGrpc
        - GrpcCode: "0"
        - HttpCode: !Ref HealthCheckMatcher
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: !Ref DeregistrationDelaySeconds

  ListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: AttachedToLoadBalancer
    Properties:
      ListenerArn: !Ref ListenerArn
      Priority: !Ref ListenerRulePriority
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values: [!Ref PathPattern]
        - !If
          - HasHostHeader
          - Field: host-header
            HostHeaderConfig:
              Values: [!Ref HostHeader]
          - !Ref AWS::NoValue
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  Service:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub "${NamePrefix}-${ServiceSuffix}"
      Cluster: !Ref ClusterName
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      PlatformVersion: LATEST
      EnableExecuteCommand: !Ref EnableExecuteCommand
      PropagateTags: SERVICE
      # ECS refuses to create a service whose target group is not yet attached
      # to a load balancer ("does not have an associated load balancer"), and the
      # listener rule is what attaches it. `DependsOn: ListenerRule` would be the
      # obvious fix, but DependsOn cannot be conditional and the rule does not
      # exist for a worker service — CloudFormation rejects the template.
      #
      # Referencing the rule from inside an Fn::If creates the same ordering
      # edge, and only on the branch where the rule exists. The tag is real
      # documentation rather than a hack marker: it records which rule routes to
      # this service.
      Tags:
        - Key: RoutingRule
          Value: !If [AttachedToLoadBalancer, !Ref ListenerRule, none]
      # Omitting both LaunchType and CapacityProviderStrategy makes the service
      # inherit the cluster's default strategy, which is how a cluster-level
      # Spot mix reaches its services.
      CapacityProviderStrategy: !If
        - UsesClusterStrategy
        - !Ref AWS::NoValue
        - - CapacityProvider: FARGATE
            Weight: 1
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: !Ref AssignPublicIp
          Subnets: !Ref SubnetIds
          SecurityGroups:
            - !Ref TaskSecurityGroup
      HealthCheckGracePeriodSeconds: !If
        - AttachedToLoadBalancer
        - !Ref HealthCheckGracePeriodSeconds
        - !Ref AWS::NoValue
      LoadBalancers: !If
        - AttachedToLoadBalancer
        - - ContainerName: !Ref ServiceSuffix
            ContainerPort: !Ref ContainerPort
            TargetGroupArn: !Ref TargetGroup
        - !Ref AWS::NoValue
      DeploymentConfiguration:
        # Without the circuit breaker a broken image rolls forward: ECS keeps
        # replacing tasks that crash on start, the deploy hangs for hours, and
        # capacity drains as old tasks are stopped.
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
        MinimumHealthyPercent: 100
        MaximumPercent: 200

  ScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub "service/${ClusterName}/${Service.Name}"
      MinCapacity: !Ref MinCapacity
      MaxCapacity: !Ref MaxCapacity
      RoleARN: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService"

  CpuScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub "${NamePrefix}-${ServiceSuffix}-cpu"
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: !Ref TargetCpuUtilization
        ScaleInCooldown: !Ref ScaleInCooldownSeconds
        ScaleOutCooldown: !Ref ScaleOutCooldownSeconds

  MemoryScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Condition: ScalesOnMemory
    Properties:
      PolicyName: !Sub "${NamePrefix}-${ServiceSuffix}-memory"
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageMemoryUtilization
        TargetValue: !Ref TargetMemoryUtilization
        ScaleInCooldown: !Ref ScaleInCooldownSeconds
        ScaleOutCooldown: !Ref ScaleOutCooldownSeconds

  RequestScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Condition: ScalesOnRequests
    Properties:
      PolicyName: !Sub "${NamePrefix}-${ServiceSuffix}-requests"
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ALBRequestCountPerTarget
          # The label is "<load-balancer-full-name>/<target-group-full-name>".
          # Neither half is derivable from an ARN, which is why the load
          # balancer's full name has to be passed in.
          ResourceLabel: !Sub "${LoadBalancerFullName}/${TargetGroup.TargetGroupFullName}"
        TargetValue: !Ref TargetRequestsPerTask
        ScaleInCooldown: !Ref ScaleInCooldownSeconds
        ScaleOutCooldown: !Ref ScaleOutCooldownSeconds

Outputs:
  ServiceName:
    Description: ECS service name.
    Value: !GetAtt Service.Name

  ServiceArn:
    Description: ECS service ARN.
    Value: !Ref Service

  TaskDefinitionArn:
    Description: ARN of the task definition revision this stack deployed.
    Value: !Ref TaskDefinition

  TaskRoleArn:
    Description: >-
      Task role ARN - the identity the application runs as. Grant access to
      tables, buckets and queues here.
    Value: !GetAtt TaskRole.Arn

  ExecutionRoleArn:
    Description: Execution role ARN, used by the ECS agent to pull images and fetch secrets.
    Value: !GetAtt ExecutionRole.Arn

  TaskSecurityGroupId:
    Description: >-
      Security group the tasks run with. Databases and caches should admit this
      group rather than a CIDR.
    Value: !Ref TaskSecurityGroup

  LogGroupName:
    Description: Log group the container writes to.
    Value: !Ref LogGroup

  TargetGroupArn:
    Description: Target group ARN, when attached to a load balancer.
    Condition: AttachedToLoadBalancer
    Value: !Ref TargetGroup

  TargetGroupFullName:
    Description: Target group full name, for autoscaling resource labels and alarms.
    Condition: AttachedToLoadBalancer
    Value: !GetAtt TargetGroup.TargetGroupFullName