AWSTemplateFormatVersion: "2010-09-09"
Description: "Provisions 5 EC2 instances and CloudWatch alarms for CPU utilization, system status checks, and EBS volume reachability."
Parameters:
  ImageId:
    Type: "AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>"
    Default: "/aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2"
    Description: "AMI ID for EC2 instances, resolved from SSM parameter by default."
  InstanceType:
    Type: "String"
    Default: "t2.micro"
    AllowedValues:
      - "t2.micro"
      - "t2.small"
      - "t2.medium"
    Description: "EC2 instance type."
  KeyName:
    Type: "AWS::EC2::KeyPair::KeyName"
    Default: ""
    Description: "Optional key pair for SSH access. Leave blank to disable."
  SSHLocation:
    Type: "String"
    Default: "0.0.0.0/0"
    Description: "CIDR range allowed SSH access."
Conditions:
  HasKeyName: !Not
    - !Equals
      - !Ref KeyName
      - ""
Resources:
  Vpc:
    Type: "AWS::EC2::VPC"
    Properties:
      CidrBlock: "10.0.0.0/16"
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: "Name"
          Value: "EC2AlarmsVPC"
  InternetGateway:
    Type: "AWS::EC2::InternetGateway"
    Properties:
      Tags:
        - Key: "Name"
          Value: "EC2AlarmsIGW"
  AttachGateway:
    Type: "AWS::EC2::VPCGatewayAttachment"
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway
  Subnet:
    Type: "AWS::EC2::Subnet"
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: "10.0.0.0/24"
      MapPublicIpOnLaunch: true
      Tags:
        - Key: "Name"
          Value: "EC2AlarmsSubnet"
  RouteTable:
    Type: "AWS::EC2::RouteTable"
    Properties:
      VpcId: !Ref Vpc
  DefaultRoute:
    Type: "AWS::EC2::Route"
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: "0.0.0.0/0"
      GatewayId: !Ref InternetGateway
  SubnetRouteTableAssociation:
    Type: "AWS::EC2::SubnetRouteTableAssociation"
    Properties:
      SubnetId: !Ref Subnet
      RouteTableId: !Ref RouteTable
  InstanceSecurityGroup:
    Type: "AWS::EC2::SecurityGroup"
    Properties:
      GroupDescription: "Security group for EC2 instances"
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: "tcp"
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SSHLocation
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: "0.0.0.0/0"
      Tags:
        - Key: "Name"
          Value: "EC2AlarmsSG"
  Instance1:
    Type: "AWS::EC2::Instance"
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref ImageId
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref "AWS::NoValue"]
      SubnetId: !Ref Subnet
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup
      Tags:
        - Key: "Name"
          Value: "EC2AlarmsInstance1"
  Instance2:
    Type: "AWS::EC2::Instance"
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref ImageId
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref "AWS::NoValue"]
      SubnetId: !Ref Subnet
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup
      Tags:
        - Key: "Name"
          Value: "EC2AlarmsInstance2"
  Instance3:
    Type: "AWS::EC2::Instance"
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref ImageId
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref "AWS::NoValue"]
      SubnetId: !Ref Subnet
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup
      Tags:
        - Key: "Name"
          Value: "EC2AlarmsInstance3"
  Instance4:
    Type: "AWS::EC2::Instance"
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref ImageId
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref "AWS::NoValue"]
      SubnetId: !Ref Subnet
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup
      Tags:
        - Key: "Name"
          Value: "EC2AlarmsInstance4"
  Instance5:
    Type: "AWS::EC2::Instance"
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref ImageId
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref "AWS::NoValue"]
      SubnetId: !Ref Subnet
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup
      Tags:
        - Key: "Name"
          Value: "EC2AlarmsInstance5"
  CPUAlarm1:
    Type: "AWS::CloudWatch::Alarm"
    Properties:
      AlarmName: !Sub "CPUUtilization-Alarm-${Instance1}"
      AlarmDescription: "Average CPU utilization exceeds 80% for 3 consecutive 300-second periods"
      Namespace: "AWS/EC2"
      MetricName: "CPUUtilization"
      Statistic: "Average"
      Period: 300
      EvaluationPeriods: 3
      Threshold: 80
      ComparisonOperator: "GreaterThanThreshold"
      Dimensions:
        - Name: "InstanceId"
          Value: !Ref Instance1
      ActionsEnabled: false
  CPUAlarm2:
    Type: "AWS::CloudWatch::Alarm"
    Properties:
      AlarmName: !Sub "CPUUtilization-Alarm-${Instance2}"
      AlarmDescription: "Average CPU utilization exceeds 80% for 3 consecutive 300-second periods"
      Namespace: "AWS/EC2"
      MetricName: "CPUUtilization"
      Statistic: "Average"
      Period: 300
      EvaluationPeriods: 3
      Threshold: 80
      ComparisonOperator: "GreaterThanThreshold"
      Dimensions:
        - Name: "InstanceId"
          Value: !Ref Instance2
      ActionsEnabled: false
  CPUAlarm3:
    Type: "AWS::CloudWatch::Alarm"
    Properties:
      AlarmName: !Sub "CPUUtilization-Alarm-${Instance3}"
      AlarmDescription: "Average CPU utilization exceeds 80% for 3 consecutive 300-second periods"
      Namespace: "AWS/EC2"
      MetricName: "CPUUtilization"
      Statistic: "Average"
      Period: 300
      EvaluationPeriods: 3
      Threshold: 80
      ComparisonOperator: "GreaterThanThreshold"
      Dimensions:
        - Name: "InstanceId"
          Value: !Ref Instance3
      ActionsEnabled: false
  CPUAlarm4:
    Type: "AWS::CloudWatch::Alarm"
    Properties:
      AlarmName: !Sub "CPUUtilization-Alarm-${Instance4}"
      AlarmDescription: "Average CPU utilization exceeds 80% for 3 consecutive 300-second periods"
      Namespace: "AWS/EC2"
      MetricName: "CPUUtilization"
      Statistic: "Average"
      Period: 300
      EvaluationPeriods: 3
      Threshold: 80
      ComparisonOperator: "GreaterThanThreshold"
      Dimensions:
        - Name: "InstanceId"
          Value: !Ref Instance4
      ActionsEnabled: false
  CPUAlarm5:
    Type: "AWS::CloudWatch::Alarm"
    Properties:
      AlarmName: !Sub "CPUUtilization-Alarm-${Instance5}"
      AlarmDescription: "Average CPU utilization exceeds 80% for 3 consecutive 300-second periods"
      Namespace: "AWS/EC2"
      MetricName: "CPUUtilization"
      Statistic: "Average"
      Period: 300
      EvaluationPeriods: 3
      Threshold: 80
      ComparisonOperator: "GreaterThanThreshold"
      Dimensions:
        - Name: "InstanceId"
          Value: !Ref Instance5
      ActionsEnabled: false
  StatusCheckAlarm1:
    Type: "AWS::CloudWatch::Alarm"
    Properties:
      AlarmName: !Sub "StatusCheckAlarm-${Instance1}"
      AlarmDescription: "Status check failure detected for 2 consecutive 300-second periods"
      Namespace: "AWS/EC2"
      MetricName: "StatusCheckFailed"
      Statistic: "Maximum"
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: "GreaterThanOrEqualToThreshold"
      Dimensions:
        - Name: "InstanceId"
          Value: !Ref Instance1
      ActionsEnabled: false
  StatusCheckAlarm2:
    Type: "AWS::CloudWatch::Alarm"
    Properties:
      AlarmName: !Sub "StatusCheckAlarm-${Instance2}"
      AlarmDescription: "Status check failure detected for 2 consecutive 300-second periods"
      Namespace: "AWS/EC2"
      MetricName: "StatusCheckFailed"
      Statistic: "Maximum"
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: "GreaterThanOrEqualToThreshold"
      Dimensions:
        - Name: "InstanceId"
          Value: !Ref Instance2
      ActionsEnabled: false
  StatusCheckAlarm3:
    Type: "AWS::CloudWatch::Alarm"
    Properties:
      AlarmName: !Sub "StatusCheckAlarm-${Instance3}"
      AlarmDescription: "Status check failure detected for 2 consecutive 300-second periods"
      Namespace: "AWS/EC2"
      MetricName: "StatusCheckFailed"
      Statistic: "Maximum"
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: "GreaterThanOrEqualToThreshold"
      Dimensions:
        - Name: "InstanceId"
          Value: !Ref Instance3
      ActionsEnabled: false
  EBSReachabilityAlarm1:
    Type: "AWS::CloudWatch::Alarm"
    Properties:
      AlarmName: !Sub "EBSReachabilityAlarm-${Instance1}"
      AlarmDescription: "EBS volume reachability check failure for 10 consecutive 60-second periods"
      Namespace: "AWS/EC2"
      MetricName: "StatusCheckFailed_AttachedEBS"
      Statistic: "Maximum"
      Period: 60
      EvaluationPeriods: 10
      Threshold: 1
      ComparisonOperator: "GreaterThanOrEqualToThreshold"
      Dimensions:
        - Name: "InstanceId"
          Value: !Ref Instance1
      ActionsEnabled: false
  EBSReachabilityAlarm2:
    Type: "AWS::CloudWatch::Alarm"
    Properties:
      AlarmName: !Sub "EBSReachabilityAlarm-${Instance2}"
      AlarmDescription: "EBS volume reachability check failure for 10 consecutive 60-second periods"
      Namespace: "AWS/EC2"
      MetricName: "StatusCheckFailed_AttachedEBS"
      Statistic: "Maximum"
      Period: 60
      EvaluationPeriods: 10
      Threshold: 1
      ComparisonOperator: "GreaterThanOrEqualToThreshold"
      Dimensions:
        - Name: "InstanceId"
          Value: !Ref Instance2
      ActionsEnabled: false
  EBSReachabilityAlarm3:
    Type: "AWS::CloudWatch::Alarm"
    Properties:
      AlarmName: !Sub "EBSReachabilityAlarm-${Instance3}"
      AlarmDescription: "EBS volume reachability check failure for 10 consecutive 60-second periods"
      Namespace: "AWS/EC2"
      MetricName: "StatusCheckFailed_AttachedEBS"
      Statistic: "Maximum"
      Period: 60
      EvaluationPeriods: 10
      Threshold: 1
      ComparisonOperator: "GreaterThanOrEqualToThreshold"
      Dimensions:
        - Name: "InstanceId"
          Value: !Ref Instance3
      ActionsEnabled: false
Outputs:
  InstanceIds:
    Description: "IDs of the provisioned EC2 instances"
    Value: !Join
      - ","
      - - !Ref Instance1
        - !Ref Instance2
        - !Ref Instance3
        - !Ref Instance4
        - !Ref Instance5
  AlarmNames:
    Description: "Names of all created CloudWatch alarms"
    Value: !Join
      - ","
      - - !Ref CPUAlarm1
        - !Ref CPUAlarm2
        - !Ref CPUAlarm3
        - !Ref CPUAlarm4
        - !Ref CPUAlarm5
        - !Ref StatusCheckAlarm1
        - !Ref StatusCheckAlarm2
        - !Ref StatusCheckAlarm3
        - !Ref EBSReachabilityAlarm1
        - !Ref EBSReachabilityAlarm2
        - !Ref EBSReachabilityAlarm3