AWSTemplateFormatVersion: "2010-09-09"

# Template description displayed in CloudFormation console
Description: >
  Creates an Amazon EFS using the selected VPC and subnets (provided by the user),
  with a Security Group allowing NFS (2049)

# ============================================================
# PARAMETERS
# These values must be provided when creating the stack
# ============================================================
Parameters:
  # VPC where the EFS and Security Group will be created
  DefaultVpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC where the EFS will be created

  # List of subnets where Mount Targets will be created
  # IMPORTANT: Must contain at least two subnets
  DefaultSubnets:
    Type: List<AWS::EC2::Subnet::Id>
    Description: List of VPC subnets where EFS mount targets will be created

# ============================================================
# RESOURCES
# ============================================================
Resources:
  # ------------------------------------------------------------
  # EFS Security Group
  # Controls network traffic to and from the EFS
  # ------------------------------------------------------------
  EFSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security Group for EFS (NFS)

      # Associates the Security Group with the provided VPC
      VpcId: !Ref DefaultVpcId

      # Outbound traffic rule
      # Allows ALL outbound traffic (common default behavior)
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

      Tags:
        - Key: Name
          Value: efs-sg-cloud-formation

  # Inbound rule for NFS (port 2049)
  # This allows EFS communication via NFS protocol
  EFSSecurityGroupIngressNFS:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref EFSSecurityGroup
      IpProtocol: tcp
      FromPort: 2049
      ToPort: 2049

      # IMPORTANT:
      # This allows traffic from resources that use the SAME Security Group.
      # Typically used when EC2 instances share this Security Group.
      SourceSecurityGroupId: !Ref EFSSecurityGroup

  # ------------------------------------------------------------
  # EFS File System
  # Main EFS resource
  # ------------------------------------------------------------
  EFSFileSystem:
    Type: AWS::EFS::FileSystem
    Properties:
      # Data encryption at rest (disabled in this template)
      Encrypted: false

      # Performance mode:
      # generalPurpose → suitable for most workloads
      PerformanceMode: generalPurpose

      # Throughput mode:
      # bursting → throughput scales automatically based on storage size
      ThroughputMode: bursting
      FileSystemTags:
        - Key: Name
          Value: primeiro-efs

  # ------------------------------------------------------------
  # Mount Targets (One per subnet)
  # Each Mount Target connects EFS to a subnet (AZ)
  # ------------------------------------------------------------

  # Mount Target in first subnet
  EFSMountTarget1:
    Type: AWS::EFS::MountTarget
    Properties:
      # Associates Mount Target with the EFS File System
      FileSystemId: !Ref EFSFileSystem

      # Selects the FIRST subnet from the provided subnet list
      SubnetId: !Select [0, !Ref DefaultSubnets]

      # Associates Security Group to control NFS traffic
      SecurityGroups:
        - !Ref EFSSecurityGroup

  # Mount Target in second subnet
  EFSMountTarget2:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref EFSFileSystem

      # Selects the SECOND subnet from the provided subnet list
      SubnetId: !Select [1, !Ref DefaultSubnets]
      SecurityGroups:
        - !Ref EFSSecurityGroup

# ============================================================
# OUTPUTS
# Values returned after stack creation
# ============================================================
Outputs:
  FileSystemId:
    Description: ID do EFS criado
    Value: !Ref EFSFileSystem

  EFSSecurityGroupId:
    Description: Security Group do EFS
    Value: !Ref EFSSecurityGroup