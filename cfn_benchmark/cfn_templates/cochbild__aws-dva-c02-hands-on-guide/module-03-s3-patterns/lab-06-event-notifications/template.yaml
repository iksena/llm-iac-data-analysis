AWSTemplateFormatVersion: "2010-09-09"
Description: |
  DVA-C02 Lab 3.6 — One bucket, 4 destinations: Lambda (direct), SQS (direct),
  SNS (direct), EventBridge (rule → another Lambda).

Resources:
  EventBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    DependsOn:
      - UploadsLambdaPermission
      - QueuePolicy
      - TopicPolicy
    Properties:
      BucketName: !Sub "dva-lab-03-06-${AWS::AccountId}-${AWS::Region}"
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt UploadsLambda.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt EventQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: archive/
        TopicConfigurations:
          - Event: s3:ObjectCreated:*
            Topic: !Ref EventTopic
            Filter:
              S3Key:
                Rules:
                  - Name: suffix
                    Value: .pdf

  # --- Lambda direct destination ---
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  UploadsLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: dva-lab-03-06-uploads-handler
      Runtime: python3.12
      Handler: handler.uploads_handler
      Role: !GetAtt LambdaRole.Arn
      Code: ./src
      Timeout: 10
      LoggingConfig:
        LogGroup: !Ref UploadsLogGroup
  UploadsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/dva-lab-03-06-uploads-handler
      RetentionInDays: 3

  UploadsLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UploadsLambda
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub "arn:aws:s3:::dva-lab-03-06-${AWS::AccountId}-${AWS::Region}"

  # --- SQS direct destination ---
  EventQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: dva-lab-03-06-archive-queue
      MessageRetentionPeriod: 86400  # 1 day

  QueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref EventQueue]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: s3.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt EventQueue.Arn
            Condition:
              ArnLike:
                aws:SourceArn: !Sub "arn:aws:s3:::dva-lab-03-06-${AWS::AccountId}-${AWS::Region}"

  # --- SNS direct destination ---
  EventTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: dva-lab-03-06-pdf-topic

  TopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref EventTopic]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: s3.amazonaws.com }
            Action: sns:Publish
            Resource: !Ref EventTopic
            Condition:
              ArnLike:
                aws:SourceArn: !Sub "arn:aws:s3:::dva-lab-03-06-${AWS::AccountId}-${AWS::Region}"

  # --- EventBridge → Lambda ---
  EventBridgeLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: dva-lab-03-06-eventbridge-handler
      Runtime: python3.12
      Handler: handler.eventbridge_handler
      Role: !GetAtt LambdaRole.Arn
      Code: ./src
      Timeout: 10
      LoggingConfig:
        LogGroup: !Ref EBLogGroup
  EBLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/dva-lab-03-06-eventbridge-handler
      RetentionInDays: 3

  EventBridgeRule:
    Type: AWS::Events::Rule
    Properties:
      Name: dva-lab-03-06-s3-rule
      EventPattern:
        source: [ "aws.s3" ]
        detail-type: [ "Object Created" ]
        detail:
          bucket:
            name: [ !Sub "dva-lab-03-06-${AWS::AccountId}-${AWS::Region}" ]
      Targets:
        - Arn: !GetAtt EventBridgeLambda.Arn
          Id: ToLambda

  EventBridgePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref EventBridgeLambda
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt EventBridgeRule.Arn

Outputs:
  BucketName:
    Value: !Ref EventBucket
  QueueUrl:
    Value: !Ref EventQueue
  TopicArn:
    Value: !Ref EventTopic