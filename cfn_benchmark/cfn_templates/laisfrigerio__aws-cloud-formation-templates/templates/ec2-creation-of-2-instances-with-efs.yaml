AWSTemplateFormatVersion: '2010-09-09' # CloudFormation template version (required field)

Description: >
  Template to recreate EC2 instances with EFS -
  ec2-with-efs-az-a and ec2-with-efs-az-b

# ------------------------------------------------------------
# Parameters
# ------------------------------------------------------------
Parameters:

  # Retrieves the latest Amazon Linux 2023 AMI dynamically from SSM Parameter Store
  LatestAmazonLinuxAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

  # Key Pair used for SSH access to EC2 instances
  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Default: ec2-remote-access
    Description: Name of the Key Pair for SSH access to the instances

  # Target VPC where the EC2 instances will be created
  VpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-03918708620f95507
    Description: ID of the VPC where the instances will be created

  # List of default subnets in the VPC
  # Used to distribute instances across different Availability Zones
  DefaultSubnets:
    Type: List<AWS::EC2::Subnet::Id>
    Description: List of default subnets in the VPC

  # Security Group associated with the EFS (must allow NFS - port 2049)
  EFSSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security Group of the EFS (NFS port 2049)

# ------------------------------------------------------------
# Resources
# ------------------------------------------------------------
Resources:

  # ------------------------------------------------------------
  # Security Group for EC2 instances
  # ------------------------------------------------------------
  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security Group for EC2 instances with EFS access
      VpcId: !Ref VpcId  # Associates the SG to the provided VPC
      Tags:
        - Key: Name
          Value: sg-ec2-with-efs

  # Inbound rule allowing HTTP traffic from anywhere
  EC2IngressHTTP:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref EC2SecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      CidrIp: 0.0.0.0/0  # Public internet access (HTTP)

  # ------------------------------------------------------------
  # EC2 Instance in Availability Zone A
  # ------------------------------------------------------------
  EC2InstanceAZa:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t2.micro  # Free-tier eligible instance type
      ImageId: !Ref LatestAmazonLinuxAmi
      SubnetId: !Select [0, !Ref DefaultSubnets]  # First subnet (AZ-A)
      KeyName: !Ref KeyPairName

      # Attach both:
      # - EC2 security group (HTTP access)
      # - EFS security group (NFS communication)
      SecurityGroupIds:
        - !Ref EC2SecurityGroup
        - !Ref EFSSecurityGroupId

      # Root volume configuration
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 8           # 8 GB root volume
            VolumeType: gp3         # General Purpose SSD
            DeleteOnTermination: true  # Deletes volume when instance is terminated

      Monitoring: false     # Detailed monitoring disabled (cost saving)
      EbsOptimized: false   # EBS optimization disabled

      # UserData script runs only at first boot
      UserData:
        Fn::Base64: |       # Must be Base64 encoded
          #!/bin/bash
          yum update -y
          yum install -y httpd
          systemctl start httpd
          systemctl enable httpd
          echo "<h1>Hello World from EC2 🚀</h1>" > /var/www/html/index.html

      Tags:
        - Key: Name
          Value: ec2-server-az-a

  # ------------------------------------------------------------
  # EC2 Instance in Availability Zone B
  # ------------------------------------------------------------
  EC2InstanceAZb:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t2.micro
      ImageId: !Ref LatestAmazonLinuxAmi
      SubnetId: !Select [1, !Ref DefaultSubnets]  # Second subnet (AZ-B)
      KeyName: !Ref KeyPairName

      SecurityGroupIds:
        - !Ref EC2SecurityGroup
        - !Ref EFSSecurityGroupId

      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 8
            VolumeType: gp3
            DeleteOnTermination: true

      Monitoring: false
      EbsOptimized: false

      UserData:
        Fn::Base64: |
          #!/bin/bash
          yum update -y
          yum install -y httpd
          systemctl start httpd
          systemctl enable httpd
          echo "<h1>Hello World from EC2 🚀</h1>" > /var/www/html/index.html

      Tags:
        - Key: Name
          Value: ec2-server-az-b

# ------------------------------------------------------------
# Outputs
# ------------------------------------------------------------
Outputs:

  # Public IP of EC2 instance in AZ-A
  InstancePublicIPAZa:
    Description: Public IP address of EC2 instance A
    Value: !GetAtt EC2InstanceAZa.PublicIp

  # Public IP of EC2 instance in AZ-B
  InstancePublicIPAZb:
    Description: Public IP address of EC2 instance B
    Value: !GetAtt EC2InstanceAZb.PublicIp