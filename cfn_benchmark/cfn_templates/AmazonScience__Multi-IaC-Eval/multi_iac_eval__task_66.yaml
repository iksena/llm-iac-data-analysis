Description: |
  Create a DynamoDB table using on demand billing and add an Amazon S3 bucket for data storage.

Resources:

  # A DynamoDB Table
  CustomerTable:
    Type: AWS::DynamoDB::Table
    Metadata:
      Comment: A simple table that passes security scanner checks
      checkov:
        skip:
          - id: "CKV_AWS_119"
            comment: "SSEType KMS stores the key in the customer account"
      guard:
        SuppressedRules:
          - DYNAMODB_TABLE_ENCRYPTED_KMS
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS

  # An S3 Bucket
  CustomerBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-customer-bucket"
      VersioningConfiguration:
        Status: Enabled
      # Add a bucket policy to restrict access
      BucketPolicy:
        Bucket: !Ref CustomerBucket
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Deny
              Principal: "*"
              Action: "s3:*"
              Resource: !Sub "${CustomerBucket.Arn}/*"
              Condition:
                Bool:
                  aws:SecureTransport: "false"