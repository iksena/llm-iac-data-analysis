AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  OpenClaw Web Stack - CloudFront, Cognito, Lambda@Edge auth, WAFv2.

Parameters:
  Environment:
    Type: String
    Default: dev
  ProjectName:
    Type: String
    Default: openclaw
  ALBDnsName:
    Type: String
    Description: ALB DNS name from Compute
  ALBHostedZoneId:
    Type: String
    Description: ALB hosted zone ID from Compute

Resources:
  # ============================================================================
  # Cognito User Pool + Domain + Client
  # ============================================================================
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${ProjectName}-${Environment}-users'
      UsernameAttributes:
        - email
      MfaConfiguration: OPTIONAL
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
      Schema:
        - Name: email
          Required: true
          Mutable: true
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      UserPoolTags:
        Name: !Sub '${ProjectName}-${Environment}-users'
        Environment: !Ref Environment

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub '${ProjectName}-${Environment}-auth-${AWS::AccountId}'
      UserPoolId: !Ref UserPool

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${ProjectName}-${Environment}-web-client'
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      AllowedOAuthFlowsUserPoolClient: true
      SupportedIdentityProviders:
        - COGNITO
      # CallbackURLs use a placeholder to break circular dependency:
      # UserPoolClient -> Distribution.DomainName -> AuthFunctionVersion -> UserPoolClient
      # deploy.sh must update these post-deployment with the actual CloudFront domain:
      #   CF_DOMAIN=$(aws cloudformation describe-stacks --stack-name $STACK \
      #     --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDomain'].OutputValue" --output text)
      #   aws cognito-idp update-user-pool-client --user-pool-id $POOL_ID --client-id $CLIENT_ID \
      #     --callback-urls "https://${CF_DOMAIN}/oauth2/callback" \
      #     --logout-urls "https://${CF_DOMAIN}/"
      CallbackURLs:
        - https://placeholder.cloudfront.net/oauth2/callback
      LogoutURLs:
        - https://placeholder.cloudfront.net/
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  # ============================================================================
  # Lambda@Edge Auth Function
  # ============================================================================
  AuthFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-edge-auth-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
                - edgelambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub '${ProjectName}-${Environment}-edge-auth-logs'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: 'arn:aws:logs:*:*:*'

  AuthFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-edge-auth'
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt AuthFunctionRole.Arn
      Code:
        ZipFile: !Sub |
          'use strict';
          const COGNITO_DOMAIN = '${ProjectName}-${Environment}-auth-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com';
          const CLIENT_ID = '${UserPoolClient}';

          exports.handler = async (event) => {
            const request = event.Records[0].cf.request;
            const headers = request.headers;
            const qs = request.querystring || '';

            // Pass through WebSocket upgrade requests — they cannot follow
            // HTTP 302 redirects, and the gateway authenticates WebSocket
            // connections itself using the gateway token (not Cognito).
            // CloudFront strips the 'Upgrade' header (restricted). Use Sec-WebSocket-Version
            // instead — this header is always present in WebSocket handshake requests and
            // is NOT restricted by CloudFront.
            if (headers['sec-websocket-version'] || headers['sec-websocket-key']) {
              return request;
            }

            // OAuth callback: redirect to root so the SPA loads with the
            // correct base path.  Preserve the query string (contains the
            // authorization code the SPA exchanges client-side).
            if (request.uri.startsWith('/oauth2/callback')) {
              const location = qs ? `/?${!qs}` : '/';
              return {
                status: '302',
                statusDescription: 'Found',
                headers: {
                  location: [{ key: 'Location', value: location }],
                  'cache-control': [{ key: 'Cache-Control', value: 'no-cache, no-store, must-revalidate' }]
                }
              };
            }

            // Allow other /oauth2/ paths through (e.g. /oauth2/logout)
            if (request.uri.startsWith('/oauth2/')) {
              return request;
            }

            // Allow static assets through without auth (SPA bundles, no sensitive data)
            const publicPaths = ['/assets/', '/favicon', '/__openclaw/'];
            if (publicPaths.some(p => request.uri.startsWith(p))) {
              return request;
            }

            // Check for valid session cookie
            const cookies = headers.cookie || [];
            const cookieString = cookies.map(c => c.value).join('; ');
            const hasSession = cookieString.includes('CognitoIdentityServiceProvider');

            if (hasSession) {
              return request;
            }

            // Allow through when an OAuth authorization code is present in
            // the query string — the SPA will exchange it client-side and
            // set session cookies.  Without this, the redirect from
            // /oauth2/callback -> /?code=... would loop back to Cognito.
            if (qs.includes('code=')) {
              return request;
            }

            // Redirect to Cognito hosted UI
            const redirectUri = `https://${!request.headers.host[0].value}/oauth2/callback`;
            const loginUrl = `https://${!COGNITO_DOMAIN}/login?response_type=code&client_id=${!CLIENT_ID}&redirect_uri=${!encodeURIComponent(redirectUri)}&scope=openid+email+profile`;

            return {
              status: '302',
              statusDescription: 'Found',
              headers: {
                location: [{ key: 'Location', value: loginUrl }],
                'cache-control': [{ key: 'Cache-Control', value: 'no-cache, no-store, must-revalidate' }]
              }
            };
          };

  AuthFunctionVersionV4:
    Type: AWS::Lambda::Version
    DeletionPolicy: Retain
    Properties:
      FunctionName: !Ref AuthFunction
      Description: 'Redirect OAuth callback to root for correct SPA base path'

  # ============================================================================
  # WAFv2 Web ACL
  # ============================================================================
  WebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-waf'
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub '${ProjectName}-${Environment}-waf'
      Rules:
        - Name: AWSManagedRulesCommonRuleSet
          Priority: 1
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          OverrideAction:
            None: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: CommonRuleSet
        - Name: AWSManagedRulesKnownBadInputsRuleSet
          Priority: 2
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          OverrideAction:
            None: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: KnownBadInputs
        - Name: AWSManagedRulesAmazonIpReputationList
          Priority: 3
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAmazonIpReputationList
          OverrideAction:
            None: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: IpReputationList
        - Name: RateLimitPerIP
          Priority: 4
          Statement:
            RateBasedStatement:
              Limit: 2000
              AggregateKeyType: IP
          Action:
            Block: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: RateLimitPerIP

  # ============================================================================
  # CloudFront Distribution + Access Logs Bucket
  # ============================================================================
  AccessLogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-${Environment}-cf-logs-${AWS::AccountId}'
      LifecycleConfiguration:
        Rules:
          - Id: ExpireAfter90Days
            Status: Enabled
            ExpirationInDays: 90
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  AccessLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AccessLogsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontLogs
            Effect: Allow
            Principal:
              Service: delivery.logs.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${AccessLogsBucket.Arn}/*'
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
          - Sid: AllowCloudFrontGetBucketAcl
            Effect: Allow
            Principal:
              Service: delivery.logs.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt AccessLogsBucket.Arn
          - Sid: DenyHTTP
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt AccessLogsBucket.Arn
              - !Sub '${AccessLogsBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${ProjectName}-${Environment} OpenClaw Gateway'
        HttpVersion: http2and3
        # Inert for ALB custom origin — added for security compliance
        DefaultRootObject: index.html
        DefaultCacheBehavior:
          TargetOriginId: alb-origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: '4135ea2d-6df8-44a3-9df3-4b5a84be39ad'
          OriginRequestPolicyId: '216adef6-5c7f-47e4-b989-5492eafa07d3'
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
            - PUT
            - POST
            - PATCH
            - DELETE
          LambdaFunctionAssociations:
            - EventType: viewer-request
              LambdaFunctionARN: !Ref AuthFunctionVersionV4
        Origins:
          - Id: alb-origin
            DomainName: !Ref ALBDnsName
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only
        WebACLId: !GetAtt WebACL.Arn
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
          MinimumProtocolVersion: TLSv1.2_2021
        Logging:
          Bucket: !GetAtt AccessLogsBucket.DomainName
          IncludeCookies: false
          Prefix: cloudfront/
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-distribution'

Outputs:
  CloudFrontDomain:
    Value: !GetAtt Distribution.DomainName
  CloudFrontDistributionId:
    Value: !Ref Distribution
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  CognitoDomain:
    Value: !Sub '${ProjectName}-${Environment}-auth-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com'