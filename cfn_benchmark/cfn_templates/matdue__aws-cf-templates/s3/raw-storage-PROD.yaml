AWSTemplateFormatVersion: '2010-09-09'
Description: 'S3 Bucket to store raw data'

Parameters:
  Project:
    Description: The project name.
    Type: String
  ReplicationDestinationBucket:
    Description: The name of the S3 bucket to replicate to
    Type: String
  EncryptionKeyStack:
    Description: The stack name containing the encryption key to enable server-side encryption.
    Type: String
    Default: ''

Conditions:
  EncryptionKeyProvided: !Not [!Equals [!Ref EncryptionKeyStack, '']]

Resources:
  Bucket:
    Type: 'AWS::S3::Bucket'
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              KMSMasterKeyID: !If [EncryptionKeyProvided, 'Fn::ImportValue': !Sub '${EncryptionKeyStack}-Alias', !Ref 'AWS::NoValue']
              SSEAlgorithm: aws:kms
      LifecycleConfiguration:
        Rules:
          #- Status: Enabled
          #  Transitions:
          #    - StorageClass: STANDARD_IA
          #      TransitionInDays: 30
          #    - StorageClass: GLACIER
          #      TransitionInDays: 90
          #    # - StorageClass: DEEP_ARCHIVE   Not yet available in CloudFormation templates (although documented...)
          #    #   TransitionInDays: 180
          - Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      ReplicationConfiguration:
        Role: !GetAtt ReplicationRole.Arn
        Rules:
          - Id: Replicate to INT account
            Priority: 0
            Status: Enabled
            DeleteMarkerReplication:
              Status: Enabled
            Destination:
              Account: 987654321098
              Bucket: !Sub 'arn:aws:s3:::${ReplicationDestinationBucket}'
              EncryptionConfiguration:
                ReplicaKmsKeyID: 'arn:aws:kms:eu-central-1:987654321098:key/6ab1b631-64d3-45ee-8667-d238a6ff22d7'  # Use key ID, not key alias, otherwise it won't work
              Metrics:
                Status: Enabled
            Filter:
              Prefix: xxx/yyy
            SourceSelectionCriteria:
              SseKmsEncryptedObjects:
                Status: Enabled
      Tags:
        - Key: Project
          Value: !Ref Project

  SslOnlyBucketPolicy:
    Type: 'AWS::S3::BucketPolicy'
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Action:
              - 's3:*'
            Effect: Deny
            Resource:
              - !Join
                - ''
                - - 'arn:aws:s3:::'
                  - !Ref Bucket
              - !Join
                - ''
                - - 'arn:aws:s3:::'
                  - !Ref Bucket
                  - /*
            Principal: '*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

  ReplicationRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action:
              - 'sts:AssumeRole'
            Effect: Allow
            Principal:
              Service:
                - s3.amazonaws.com

  ReplicationPolicy:
    Type: 'AWS::IAM::Policy'
    Properties:
      PolicyDocument:
        Statement:
          - Action:
              - 's3:ListBucket'
              - 's3:GetReplicationConfiguration'
              - 's3:GetObjectVersionForReplication'
              - 's3:GetObjectVersionAcl'
              - 's3:GetObjectVersionTagging'
              - 's3:GetObjectRetention'
              - 's3:GetObjectLegalHold'
            Effect: Allow
            Resource:
              - !Sub 'arn:aws:s3:::${Bucket}'
              - !Sub 'arn:aws:s3:::${Bucket}/*'
              - !Sub 'arn:aws:s3:::${ReplicationDestinationBucket}'
              - !Sub 'arn:aws:s3:::${ReplicationDestinationBucket}/*'
          - Action:
              - 's3:ReplicateObject'
              - 's3:ReplicateDelete'
              - 's3:ReplicateTags'
              - 's3:ObjectOwnerOverrideToBucketOwner'
            Effect: Allow
            Resource:
              - !Sub 'arn:aws:s3:::${Bucket}/*'
              - !Sub 'arn:aws:s3:::${ReplicationDestinationBucket}/*'
          - Action:
              - 'kms:Decrypt'
              - 'kms:GenerateDataKey'
            Effect: Allow
            Resource:
              - !If [EncryptionKeyProvided, !Join ['', [!Sub 'arn:aws:kms:${AWS::Region}:${AWS::AccountId}:', 'Fn::ImportValue': !Sub '${EncryptionKeyStack}-Alias']], !Ref 'AWS::NoValue']
              - !If [EncryptionKeyProvided, 'Fn::ImportValue': !Sub '${EncryptionKeyStack}-Arn', !Ref 'AWS::NoValue']
          - Action:
              - 'kms:Encrypt'
              - 'kms:GenerateDataKey'
            Effect: Allow
            Resource:
              - 'arn:aws:kms:eu-central-1:987654321098:alias/custom/s3'
              - 'arn:aws:kms:eu-central-1:987654321098:key/6ab1b631-64d3-45ee-8667-d238a6ff22d7'
      PolicyName: BucketReplicationPolicy
      Roles:
        - !Ref ReplicationRole

Outputs:
  BucketName:
    Value: !Ref Bucket
    Description: S3 Bucket to store raw data
    Export:
      Name: !Sub '${AWS::StackName}-BucketName'
  Arn:
    Value: !GetAtt Bucket.Arn
    Description: Arn
    Export:
      Name: !Sub '${AWS::StackName}-Arn'