AWSTemplateFormatVersion: '2010-09-09'
Description: 'Lab 22: Right-Sizing EC2 with AWS Compute Optimizer'

Parameters:
  EnvironmentName:
    Description: Environment name prefix
    Type: String
    Default: Lab22

  KeyPairName:
    Description: EC2 KeyPair for SSH access (optional - leave blank if not needed)
    Type: String
    Default: ''

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  # VPC
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-VPC

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-Public-Subnet

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-IGW

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-Public-RT

  DefaultPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet

  # Security Group
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${EnvironmentName}-Instance-SG
      GroupDescription: Security group for test instances
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  # IAM Role for EC2 instances
  EC2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${EnvironmentName}-EC2-Role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-EC2-Role

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub ${EnvironmentName}-EC2-Profile
      Roles:
        - !Ref EC2InstanceRole

  # Over-Provisioned Instance (will get downsize recommendation)
  OverProvisionedInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.large
      ImageId: !Ref LatestAmiId
      IamInstanceProfile: !Ref EC2InstanceProfile
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum update -y
          yum install -y amazon-cloudwatch-agent stress-ng httpd

          # Install CloudWatch agent
          cat > /opt/aws/amazon-cloudwatch-agent/etc/config.json << 'EOF'
          {
            "metrics": {
              "namespace": "Lab22/EC2",
              "metrics_collected": {
                "cpu": {
                  "measurement": [{"name": "cpu_usage_idle"}],
                  "metrics_collection_interval": 60
                },
                "mem": {
                  "measurement": [{"name": "mem_used_percent"}],
                  "metrics_collection_interval": 60
                }
              }
            }
          }
          EOF

          /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl \
            -a fetch-config -m ec2 -s \
            -c file:/opt/aws/amazon-cloudwatch-agent/etc/config.json

          # Light workload (5-10% CPU)
          systemctl start httpd
          systemctl enable httpd
          echo "<h1>Over-Provisioned Instance</h1>" > /var/www/html/index.html

          # Create light load script
          cat > /usr/local/bin/light-load.sh << 'SCRIPT'
          #!/bin/bash
          while true; do
            stress-ng --cpu 1 --timeout 10s --cpu-load 10
            sleep 50
          done
          SCRIPT
          chmod +x /usr/local/bin/light-load.sh

          # Start load in background
          nohup /usr/local/bin/light-load.sh > /var/log/light-load.log 2>&1 &
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-OverProvisioned
        - Key: Workload
          Value: Light
        - Key: Lab
          Value: Lab22

  # Under-Provisioned Instance (will get upsize recommendation)
  UnderProvisionedInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      ImageId: !Ref LatestAmiId
      IamInstanceProfile: !Ref EC2InstanceProfile
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum update -y
          yum install -y amazon-cloudwatch-agent stress-ng httpd

          # Install CloudWatch agent
          cat > /opt/aws/amazon-cloudwatch-agent/etc/config.json << 'EOF'
          {
            "metrics": {
              "namespace": "Lab22/EC2",
              "metrics_collected": {
                "cpu": {
                  "measurement": [{"name": "cpu_usage_idle"}],
                  "metrics_collection_interval": 60
                },
                "mem": {
                  "measurement": [{"name": "mem_used_percent"}],
                  "metrics_collection_interval": 60
                }
              }
            }
          }
          EOF

          /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl \
            -a fetch-config -m ec2 -s \
            -c file:/opt/aws/amazon-cloudwatch-agent/etc/config.json

          # Heavy workload (90%+ CPU)
          systemctl start httpd
          systemctl enable httpd
          echo "<h1>Under-Provisioned Instance</h1>" > /var/www/html/index.html

          # Create heavy load script
          cat > /usr/local/bin/heavy-load.sh << 'SCRIPT'
          #!/bin/bash
          while true; do
            stress-ng --cpu 2 --timeout 50s --cpu-load 95
            sleep 10
          done
          SCRIPT
          chmod +x /usr/local/bin/heavy-load.sh

          # Start load in background
          nohup /usr/local/bin/heavy-load.sh > /var/log/heavy-load.log 2>&1 &
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-UnderProvisioned
        - Key: Workload
          Value: Heavy
        - Key: Lab
          Value: Lab22

  # Right-Sized Instance (will get no change recommendation)
  RightSizedInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.medium
      ImageId: !Ref LatestAmiId
      IamInstanceProfile: !Ref EC2InstanceProfile
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum update -y
          yum install -y amazon-cloudwatch-agent stress-ng httpd

          # Install CloudWatch agent
          cat > /opt/aws/amazon-cloudwatch-agent/etc/config.json << 'EOF'
          {
            "metrics": {
              "namespace": "Lab22/EC2",
              "metrics_collected": {
                "cpu": {
                  "measurement": [{"name": "cpu_usage_idle"}],
                  "metrics_collection_interval": 60
                },
                "mem": {
                  "measurement": [{"name": "mem_used_percent"}],
                  "metrics_collection_interval": 60
                }
              }
            }
          }
          EOF

          /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl \
            -a fetch-config -m ec2 -s \
            -c file:/opt/aws/amazon-cloudwatch-agent/etc/config.json

          # Balanced workload (50-70% CPU)
          systemctl start httpd
          systemctl enable httpd
          echo "<h1>Right-Sized Instance</h1>" > /var/www/html/index.html

          # Create balanced load script
          cat > /usr/local/bin/balanced-load.sh << 'SCRIPT'
          #!/bin/bash
          while true; do
            stress-ng --cpu 1 --timeout 30s --cpu-load 60
            sleep 30
          done
          SCRIPT
          chmod +x /usr/local/bin/balanced-load.sh

          # Start load in background
          nohup /usr/local/bin/balanced-load.sh > /var/log/balanced-load.log 2>&1 &
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-RightSized
        - Key: Workload
          Value: Balanced
        - Key: Lab
          Value: Lab22

Outputs:
  VPCId:
    Value: !Ref VPC
  OverProvisionedInstanceId:
    Value: !Ref OverProvisionedInstance
    Description: Over-provisioned instance (t3.large with light load)
  UnderProvisionedInstanceId:
    Value: !Ref UnderProvisionedInstance
    Description: Under-provisioned instance (t3.micro with heavy load)
  RightSizedInstanceId:
    Value: !Ref RightSizedInstance
    Description: Right-sized instance (t3.medium with balanced load)
  NextSteps:
    Value: |
      1. Wait 14 days for Compute Optimizer to collect metrics
      2. Enable Compute Optimizer: aws compute-optimizer update-enrollment-status --status Active
      3. View recommendations: aws compute-optimizer get-ec2-instance-recommendations
      4. Run cost analysis: python3 cost-calculator/estimate.py