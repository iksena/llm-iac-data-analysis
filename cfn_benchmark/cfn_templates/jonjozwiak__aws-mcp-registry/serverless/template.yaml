AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Serverless MCP Registry API - API Gateway + Lambda + DynamoDB

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment environment

  LogLevel:
    Type: String
    Default: INFO
    AllowedValues:
      - DEBUG
      - INFO
      - WARN
      - ERROR
    Description: Lambda log level

  GitHubClientId:
    Type: String
    Default: ''
    Description: GitHub OAuth App Client ID (optional, can use Secrets Manager)

  JwtSecretArn:
    Type: String
    Default: ''
    Description: ARN of existing JWT secret in Secrets Manager (optional, creates new if empty)

  DeployMode:
    Type: String
    Default: readonly
    AllowedValues:
      - readonly
      - full
    Description: Deployment mode - readonly (servers API only) or full (includes auth and publish)

  ApiMode:
    Type: String
    Default: public
    AllowedValues:
      - public
      - private
    Description: API access mode - public (internet) or private (VPC-only)

  VpcId:
    Type: String
    Default: ''
    Description: VPC ID for private API mode (required when ApiMode=private)

  SubnetIds:
    Type: CommaDelimitedList
    Default: ''
    Description: Comma-separated subnet IDs for VPC endpoint (required when ApiMode=private)

  VpcEndpointSecurityGroupId:
    Type: String
    Default: ''
    Description: Security group ID for VPC endpoint (required when ApiMode=private)

Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 30
    MemorySize: 256
    Architectures:
      - x86_64
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        LOG_LEVEL: !Ref LogLevel
        SERVERS_TABLE: !Ref ServersTable
        AUTH_TABLE: !If [IsFullDeploy, !Ref AuthTable, '']
        JWT_SECRET_ARN: !If [CreateJwtSecret, !Ref JwtSecret, !Ref JwtSecretArn]
        GITHUB_SECRET_ARN: !If [IsFullDeploy, !Ref GitHubOAuthSecret, '']
    Tracing: Active

Conditions:
  CreateJwtSecret: !Equals [!Ref JwtSecretArn, '']
  IsProd: !Equals [!Ref Environment, 'prod']
  IsFullDeploy: !Equals [!Ref DeployMode, 'full']
  IsPrivateApi: !Equals [!Ref ApiMode, 'private']

Resources:
  #############################################
  # API Gateway
  #############################################

  RestApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Environment
      Description: MCP Registry API
      EndpointConfiguration:
        Type: !If [IsPrivateApi, 'PRIVATE', 'REGIONAL']
        VPCEndpointIds: !If
          - IsPrivateApi
          - [!Ref VpcEndpoint]
          - !Ref AWS::NoValue
      Cors:
        AllowOrigin: "'*'"
        AllowMethods: "'GET,POST,PUT,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key'"
        MaxAge: 600
      MethodSettings:
        - ResourcePath: /*
          HttpMethod: '*'
          ThrottlingBurstLimit: 100
          ThrottlingRateLimit: 50
      Policy: !If
        - IsPrivateApi
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal: '*'
              Action: execute-api:Invoke
              Resource: '*'
              Condition:
                StringEquals:
                  aws:SourceVpce: !Ref VpcEndpoint
        - !Ref AWS::NoValue

  VpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: IsPrivateApi
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.execute-api'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: !Ref SubnetIds
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroupId

  #############################################
  # DynamoDB Tables
  #############################################

  ServersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'mcp-registry-servers-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: mcp-registry

  AuthTable:
    Type: AWS::DynamoDB::Table
    Condition: IsFullDeploy
    Properties:
      TableName: !Sub 'mcp-registry-auth-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: mcp-registry

  #############################################
  # Secrets Manager
  #############################################

  JwtSecret:
    Type: AWS::SecretsManager::Secret
    Condition: CreateJwtSecret
    Properties:
      Name: !Sub 'mcp-registry/jwt-secret-${Environment}'
      Description: JWT signing key for MCP Registry
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: 'secret'
        PasswordLength: 64
        ExcludeCharacters: '"@/\'
      Tags:
        - Key: Environment
          Value: !Ref Environment

  GitHubOAuthSecret:
    Type: AWS::SecretsManager::Secret
    Condition: IsFullDeploy
    Properties:
      Name: !Sub 'mcp-registry/github-oauth-${Environment}'
      Description: GitHub OAuth credentials for MCP Registry
      SecretString: !Sub |
        {
          "clientId": "${GitHubClientId}",
          "clientSecret": ""
        }
      Tags:
        - Key: Environment
          Value: !Ref Environment

  #############################################
  # Lambda Functions
  #############################################

  # System Functions (ping, health, version)
  SystemFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'mcp-registry-system-${Environment}'
      Description: System endpoints (ping, health, version)
      CodeUri: src/
      Handler: handlers/system.handler
      Events:
        Ping:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /v0.1/ping
            Method: GET
        Health:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /v0.1/health
            Method: GET
        Version:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /v0.1/version
            Method: GET
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:DescribeTable
              Resource:
                - !GetAtt ServersTable.Arn
      Tags:
        Environment: !Ref Environment
        Application: mcp-registry

  # Servers Functions (list, get)
  ServersFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'mcp-registry-servers-${Environment}'
      Description: Server listing and retrieval endpoints
      CodeUri: src/
      Handler: handlers/servers.handler
      Events:
        ListServers:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /v0.1/servers
            Method: GET
        ListVersions:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /v0.1/servers/{name}/versions
            Method: GET
        GetVersion:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /v0.1/servers/{name}/versions/{version}
            Method: GET
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !GetAtt ServersTable.Arn
                - !Sub '${ServersTable.Arn}/index/*'
      Tags:
        Environment: !Ref Environment
        Application: mcp-registry

  # Auth Functions
  AuthFunction:
    Type: AWS::Serverless::Function
    Condition: IsFullDeploy
    Properties:
      FunctionName: !Sub 'mcp-registry-auth-${Environment}'
      Description: Authentication endpoints
      CodeUri: src/
      Handler: handlers/auth.handler
      Events:
        GitHubAT:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /v0.1/auth/github-at
            Method: POST
        GitHubOIDC:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /v0.1/auth/github-oidc
            Method: POST
        DnsChallenge:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /v0.1/auth/dns
            Method: POST
        HttpChallenge:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /v0.1/auth/http
            Method: POST
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
              Resource:
                - !GetAtt AuthTable.Arn
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !If [CreateJwtSecret, !Ref JwtSecret, !Ref JwtSecretArn]
                - !Ref GitHubOAuthSecret
      Tags:
        Environment: !Ref Environment
        Application: mcp-registry

  # Publish Function
  PublishFunction:
    Type: AWS::Serverless::Function
    Condition: IsFullDeploy
    Properties:
      FunctionName: !Sub 'mcp-registry-publish-${Environment}'
      Description: Server publishing and update endpoints
      CodeUri: src/
      Handler: handlers/publish.handler
      Events:
        Publish:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /v0.1/publish
            Method: POST
        UpdateVersion:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /v0.1/servers/{name}/versions/{version}
            Method: PUT
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:Query
              Resource:
                - !GetAtt ServersTable.Arn
                - !Sub '${ServersTable.Arn}/index/*'
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource:
                - !GetAtt AuthTable.Arn
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !If [CreateJwtSecret, !Ref JwtSecret, !Ref JwtSecretArn]
      Tags:
        Environment: !Ref Environment
        Application: mcp-registry

  #############################################
  # CloudWatch Log Groups
  #############################################

  SystemFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${SystemFunction}'
      RetentionInDays: !If [IsProd, 30, 7]

  ServersFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ServersFunction}'
      RetentionInDays: !If [IsProd, 30, 7]

  AuthFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: IsFullDeploy
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AuthFunction}'
      RetentionInDays: !If [IsProd, 30, 7]

  PublishFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: IsFullDeploy
    Properties:
      LogGroupName: !Sub '/aws/lambda/${PublishFunction}'
      RetentionInDays: !If [IsProd, 30, 7]

Outputs:
  DeployMode:
    Description: Deployment mode (readonly or full)
    Value: !Ref DeployMode
    Export:
      Name: !Sub '${AWS::StackName}-DeployMode'

  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
    Export:
      Name: !Sub '${AWS::StackName}-ApiEndpoint'

  ServersTableName:
    Description: DynamoDB Servers table name
    Value: !Ref ServersTable
    Export:
      Name: !Sub '${AWS::StackName}-ServersTable'

  AuthTableName:
    Description: DynamoDB Auth table name
    Condition: IsFullDeploy
    Value: !Ref AuthTable
    Export:
      Name: !Sub '${AWS::StackName}-AuthTable'

  JwtSecretArn:
    Description: JWT Secret ARN
    Condition: IsFullDeploy
    Value: !If [CreateJwtSecret, !Ref JwtSecret, !Ref JwtSecretArn]
    Export:
      Name: !Sub '${AWS::StackName}-JwtSecretArn'

  GitHubSecretArn:
    Description: GitHub OAuth Secret ARN
    Condition: IsFullDeploy
    Value: !Ref GitHubOAuthSecret
    Export:
      Name: !Sub '${AWS::StackName}-GitHubSecretArn'