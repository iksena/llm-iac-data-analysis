AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  MediFind - Cloud-native platform for finding medicines in pharmacies
  Serverless AWS application using Lambda, API Gateway, DynamoDB, and Cognito

# Global settings for all functions
Globals:
  Function:
    Timeout: 10
    MemorySize: 512
    Runtime: nodejs22.x
    Handler: index.handler
    Environment:
      Variables:
        NODE_OPTIONS: --enable-source-maps
        POWERTOOLS_SERVICE_NAME: medifind
        POWERTOOLS_METRICS_NAMESPACE: Medifind
        POWERTOOLS_LOG_LEVEL: INFO
    Tracing: Active
    # Note: For Node.js Lambda Powertools, we would include the layer or install dependencies.
    # For simplicity, we are including the dependencies in each function's package.json.

Parameters:
  # Environment parameters
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Environment name for resource naming

  # DynamoDB billing mode
  DynamoDbBillingMode:
    Type: String
    Default: PAY_PER_REQUEST
    AllowedValues:
      - PAY_PER_REQUEST
      - PROVISIONED
    Description: Billing mode for DynamoDB tables

  # Cognito configuration
  AdminEmail:
    Type: String
    Default: admin@medifind.com
    Description: Initial admin email for Cognito user pool

  AdminPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    Description: >-
      Initial temporary password for the bootstrap admin Cognito user. No default
      on purpose - pass this explicitly at deploy time (e.g. via --parameter-overrides
      or a secrets-manager-backed CI variable), never commit a real value.
      The user must change it on first login.

  # API Gateway settings
  ApiStageName:
    Type: String
    Default: prod
    Description: API Gateway stage name

  EnableApiCache:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Enable API Gateway caching for read-heavy endpoints

  ApiCacheTtlInSeconds:
    Type: Number
    Default: 300
    Description: TTL for API Gateway cache in seconds

  ApiCacheSize:
    Type: String
    Default: '0.5'
    AllowedValues:
      - '0.5'
      - '1.0'
      - '2.0'
      - '4.0'
      - '8.0'
      - '10.0'
    Description: API Gateway cache size in GB

Conditions:
  ApiCacheIsEnabled: !Equals [!Ref EnableApiCache, 'true']

Resources:
  # DynamoDB Tables
  PharmaciesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${EnvironmentName}-pharmacies'
      BillingMode: !Ref DynamoDbBillingMode
      AttributeDefinitions:
        - AttributeName: pharmacy_id
          AttributeType: S
        - AttributeName: name
          AttributeType: S
        - AttributeName: address
          AttributeType: S
      KeySchema:
        - AttributeName: pharmacy_id
          KeyType: HASH
      # Global Secondary Index for querying by name/location if needed
      GlobalSecondaryIndexes:
        - IndexName: GSI_Name_Address
          KeySchema:
            - AttributeName: name
              KeyType: HASH
            - AttributeName: address
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Application
          Value: MedicFind

  InventoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${EnvironmentName}-inventory'
      BillingMode: !Ref DynamoDbBillingMode
      AttributeDefinitions:
        - AttributeName: medicine_name
          AttributeType: S
        - AttributeName: pharmacy_id
          AttributeType: S
      KeySchema:
        - AttributeName: medicine_name
          KeyType: HASH
        - AttributeName: pharmacy_id
          KeyType: RANGE
      # Global Secondary Index for querying by pharmacy_id
      GlobalSecondaryIndexes:
        - IndexName: GSI_PharmacyId
          KeySchema:
            - AttributeName: pharmacy_id
              KeyType: HASH
            - AttributeName: medicine_name
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        # Global Secondary Index for querying by medicine_name (exact match)
        - IndexName: GSI_MedicineName
          KeySchema:
            - AttributeName: medicine_name
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Application
          Value: MedicFind

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${EnvironmentName}-users'
      BillingMode: !Ref DynamoDbBillingMode
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
      # GSI for querying by email (if needed for lookups)
      GlobalSecondaryIndexes:
        - IndexName: GSI_Email
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Application
          Value: MedicFind

  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${EnvironmentName}-orders'
      BillingMode: !Ref DynamoDbBillingMode
      AttributeDefinitions:
        - AttributeName: order_id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
        - AttributeName: status
          AttributeType: S
      KeySchema:
        - AttributeName: order_id
          KeyType: HASH
      # GSI for querying by user
      GlobalSecondaryIndexes:
        - IndexName: GSI_UserId
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        # GSI for querying by status
        - IndexName: GSI_Status
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Application
          Value: MedicFind

  # Amazon Cognito User Pool for authentication
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${EnvironmentName}-medifind-users'
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
      UsernameAttributes:
        - email
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: false
        - Name: name
          AttributeDataType: String
          Required: true
        - Name: role
          AttributeDataType: String
          Required: false
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
        InviteMessageTemplate:
          EmailSubject: Welcome to MediFind
          EmailMessage: 'Your username is {username} and temporary password is {####}.'
          SMSMessage: 'Your username is {username} and temporary password is {####}.'
      EmailVerificationSubject: Welcome to MediFind
      EmailVerificationMessage: 'Thanks for signing up to MediFind! Your verification code is {####}'
      UserPoolTags:
        Environment: !Ref EnvironmentName
        Application: MedicFind

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${EnvironmentName}-medifind-client'
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_CUSTOM_AUTH
      PreventUserExistenceErrors: ENABLED
      ReadAttributes:
        - email
        - name
        - custom:role
      WriteAttributes:
        - email
        - name
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      EnableTokenRevocation: true

  # Lambda Functions
  MedicineSearchFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${EnvironmentName}-medicine-search'
      Description: Search medicines in inventory
      CodeUri: ../backend/src/functions/medicine-search/
      Handler: index.handler
      Environment:
        Variables:
          INVENTORY_TABLE: !Ref InventoryTable
          PHARMACIES_TABLE: !Ref PharmaciesTable
          POWERTOOLS_SERVICE_NAME: medifind
          POWERTOOLS_METRICS_NAMESPACE: Medifind
          POWERTOOLS_LOG_LEVEL: INFO
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:GetItem
              Resource: !GetAtt InventoryTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt PharmaciesTable.Arn
      Events:
        SearchMedicines:
          Type: Api
          Properties:
            Path: /search
            Method: GET
            RestApiId: !Ref ApiGateway
            Auth:
              Authorizer: NONE
      Tracing: Active

  GetPharmaciesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${EnvironmentName}-get-pharmacies'
      Description: Get pharmacies with stock for a medicine
      CodeUri: ../backend/src/functions/get-pharmacies/
      Handler: index.handler
      Environment:
        Variables:
          INVENTORY_TABLE: !Ref InventoryTable
          PHARMACIES_TABLE: !Ref PharmaciesTable
          POWERTOOLS_SERVICE_NAME: medifind
          POWERTOOLS_METRICS_NAMESPACE: Medifind
          POWERTOOLS_LOG_LEVEL: INFO
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:GetItem
              Resource:
                - !GetAtt InventoryTable.Arn
                - !GetAtt PharmaciesTable.Arn
      Events:
        GetPharmacies:
          Type: Api
          Properties:
            Path: /pharmacies/{medicineName}
            Method: GET
            RestApiId: !Ref ApiGateway
            Auth:
              Authorizer: NONE
      Tracing: Active

  CreateOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${EnvironmentName}-create-order'
      Description: Create a new medicine order
      CodeUri: ../backend/src/functions/create-order/
      Handler: index.handler
      Environment:
        Variables:
          ORDERS_TABLE: !Ref OrdersTable
          USERS_TABLE: !Ref UsersTable
          INVENTORY_TABLE: !Ref InventoryTable
          PHARMACIES_TABLE: !Ref PharmaciesTable
          POWERTOOLS_SERVICE_NAME: medifind
          POWERTOOLS_METRICS_NAMESPACE: Medifind
          POWERTOOLS_LOG_LEVEL: INFO
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:Query
              Resource:
                - !GetAtt OrdersTable.Arn
                - !GetAtt UsersTable.Arn
                - !GetAtt InventoryTable.Arn
                - !GetAtt PharmaciesTable.Arn
      Events:
        CreateOrder:
          Type: Api
          Properties:
            Path: /orders
            Method: POST
            RestApiId: !Ref ApiGateway
            Auth:
              Authorizer: JwtAuthorizer
      Tracing: Active

  AdminPharmacyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${EnvironmentName}-admin-pharmacy'
      Description: Admin pharmacy management (CRUD)
      CodeUri: ../backend/src/functions/admin-pharmacy/
      Handler: index.handler
      Environment:
        Variables:
          PHARMACIES_TABLE: !Ref PharmaciesTable
          POWERTOOLS_SERVICE_NAME: medifind
          POWERTOOLS_METRICS_NAMESPACE: Medifind
          POWERTOOLS_LOG_LEVEL: INFO
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !GetAtt PharmaciesTable.Arn
      Events:
        AdminPharmacy:
          Type: Api
          Properties:
            Path: /admin/pharmacies
            Method: ANY
            RestApiId: !Ref ApiGateway
            Auth:
              Authorizer: JwtAuthorizer
      Tracing: Active

  AdminInventoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${EnvironmentName}-admin-inventory'
      Description: Admin inventory management
      CodeUri: ../backend/src/functions/admin-inventory/
      Handler: index.handler
      Environment:
        Variables:
          INVENTORY_TABLE: !Ref InventoryTable
          PHARMACIES_TABLE: !Ref PharmaciesTable
          POWERTOOLS_SERVICE_NAME: medifind
          POWERTOOLS_METRICS_NAMESPACE: Medifind
          POWERTOOLS_LOG_LEVEL: INFO
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !GetAtt InventoryTable.Arn
                - !GetAtt PharmaciesTable.Arn
      Events:
        AdminInventory:
          Type: Api
          Properties:
            Path: /admin/inventory
            Method: ANY
            RestApiId: !Ref ApiGateway
            Auth:
              Authorizer: JwtAuthorizer
      Tracing: Active

  JwtAuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${EnvironmentName}-jwt-authorizer'
      Description: JWT token authorizer for API Gateway
      CodeUri: ../backend/src/functions/jwt-authorizer/
      Handler: index.handler
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPool
          APP_CLIENT_ID: !Ref UserPoolClient
          POWERTOOLS_SERVICE_NAME: medifind
          POWERTOOLS_METRICS_NAMESPACE: Medifind
          POWERTOOLS_LOG_LEVEL: INFO
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:DescribeUserPool
                - cognito-idp:AdminGetUser
              Resource: !GetAtt UserPool.Arn
      Events:
        Authorizer:
          Type: Api
          Properties:
            Path: /authorize
            Method: POST
            RestApiId: !Ref ApiGateway
            Auth:
              Authorizer: NONE

  # API Gateway
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub '${EnvironmentName}-medifind-api'
      StageName: !Ref ApiStageName
      Cors:
        AllowOrigin: "'*'"  # In production, restrict to specific domains
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      EndpointConfiguration: REGIONAL
      Auth:
        DefaultAuthorizer: JwtAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          JwtAuthorizer:
            FunctionArn: !GetAtt JwtAuthorizerFunction.Arn
            FunctionPayloadType: REQUEST
            Identity:
              Headers:
                - Authorization
            AuthorizerResultTtlInSeconds: 300
      # Enable API caching if requested
      CacheClusterEnabled: !If [ApiCacheIsEnabled, true, false]
      CacheClusterSize: !Ref ApiCacheSize
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          LoggingLevel: INFO
          DataTraceEnabled: true
          MetricsEnabled: true
          CachingEnabled: !If [ApiCacheIsEnabled, true, false]
          CacheTtlInSeconds: !Ref ApiCacheTtlInSeconds
          CacheDataEncrypted: true
      # Add WAF if needed (would require additional resources)
      # TODO: Integrate with AWS WAF for production security
      Tags:
        Environment: !Ref EnvironmentName
        Application: MedicFind

  # Gateway Responses - without these, any request rejected by the
  # JwtAuthorizer (expired/invalid/missing token) or an unmatched route
  # returns a response with NO CORS headers. The browser then reports this
  # as an opaque "Failed to fetch" / CORS error, hiding the real 401/403/404
  # reason from both the console and the app's own error handling.
  UnauthorizedGatewayResponse:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref ApiGateway
      ResponseType: UNAUTHORIZED
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"

  AccessDeniedGatewayResponse:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref ApiGateway
      ResponseType: ACCESS_DENIED
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"

  Default4xxGatewayResponse:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref ApiGateway
      ResponseType: DEFAULT_4XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"

  Default5xxGatewayResponse:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref ApiGateway
      ResponseType: DEFAULT_5XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"

  # CloudWatch Log Groups for better retention
  MedicineSearchLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${MedicineSearchFunction}'
      RetentionInDays: 30

  GetPharmaciesLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${GetPharmaciesFunction}'
      RetentionInDays: 30

  CreateOrderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${CreateOrderFunction}'
      RetentionInDays: 30

  AdminPharmacyLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AdminPharmacyFunction}'
      RetentionInDays: 30

  AdminInventoryLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AdminInventoryFunction}'
      RetentionInDays: 30

  # Dead Letter Queues for async error handling (if using async invocations)
  MedicineSearchDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${EnvironmentName}-medicine-search-dlq'
      MessageRetentionPeriod: 1209600  # 14 days
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Application
          Value: MedicFind

  # CloudWatch Alarms for error rates and throttling
  MedicineSearchErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${EnvironmentName}-medicine-search-errors'
      AlarmDescription: Alarm if medicine search function has high error rate
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref MedicineSearchFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: []
      OKActions: []

  MedicineSearchThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${EnvironmentName}-medicine-search-throttles'
      AlarmDescription: Alarm if medicine search function is throttled
      MetricName: Throttles
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref MedicineSearchFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: []
      OKActions: []

  # API Gateway 5XX error alarm
  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${EnvironmentName}-api-5xx-errors'
      AlarmDescription: Alarm if API Gateway returns 5XX errors
      MetricName: 5XXError
      Namespace: AWS/ApiGateway
      Dimensions:
        - Name: ApiName
          Value: !Sub '${EnvironmentName}-medifind-api'
          # Note: For HttpApi, use HttpApiName; for RestApi, use ApiName
        - Name: Stage
          Value: !Ref ApiStageName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: []
      OKActions: []

Outputs:
  ApiUrl:
    Description: URL for the API Gateway endpoint
    Value: !Sub 'https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${ApiStageName}'
  ApiGatewayId:
    Description: API Gateway ID
    Value: !Ref ApiGateway
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient
  PharmaciesTableName:
    Description: Pharmacies DynamoDB table name
    Value: !Ref PharmaciesTable
  InventoryTableName:
    Description: Inventory DynamoDB table name
    Value: !Ref InventoryTable
  UsersTableName:
    Description: Users DynamoDB table name
    Value: !Ref UsersTable
  OrdersTableName:
    Description: Orders DynamoDB table name
    Value: !Ref OrdersTable
  EnvironmentName:
    Description: Environment name used for deployment
    Value: !Ref EnvironmentName