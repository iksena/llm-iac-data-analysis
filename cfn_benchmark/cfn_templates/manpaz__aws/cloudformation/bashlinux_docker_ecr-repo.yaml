---
# Bashlinux::Docker::ECR repository
#
#   Cloudformation template to create a private ECR repository
#
#   Manuel F Martinez
#   Bashlinux
#   Los Angeles, CA
#
AWSTemplateFormatVersion: "2010-09-09"
Description: ECR repository template

###############################################################################
Parameters:

  Environment:
    Description: Working environment
    Type: String
    MinLength: "1"
    MaxLength: "20"
    Default: staging
    AllowedValues: [ "prod", "staging" ]
    ConstraintDescription: >
      Environment name can only contain "prod" or "staging"

  Repository:
    Description: Name of the repository
    Type: String
    MinLength: "1"
    MaxLength: "32"
    Default: "bashlinux-"
    AllowedPattern: "[a-zA-Z0-9\\-]*"
    ConstraintDescription: >
      Name of the repository must contains only letters, numbers and hyphens

###############################################################################
Resources:

  # ECR Repository ------------------------------------------------------------
  DockerEcrRepository:
    Type: "AWS::ECR::Repository"
    Properties:
      RepositoryName: !Ref Repository
      EncryptionConfiguration:
        EncryptionType: KMS
        KmsKey: !Sub "alias/bashlinux/ecr/${Environment}"
      ImageScanningConfiguration:
        ScanOnPush: true
      Tags:
      - Key: Name
        Value: !Ref Repository
      - Key: bashlinux:application-id
        Value: !Ref AWS::StackName
      - Key: bashlinux:network-visibility
        Value: private
      - Key: bashlinux:registry-type
        Value: private
      - Key: bashlinux:can-delete
        Value: "false"

###############################################################################
Outputs:

  DockerEcrRepositoryUri:
    Value: !GetAtt [DockerEcrRepository, RepositoryUri]
    Description: ECR Repository URL