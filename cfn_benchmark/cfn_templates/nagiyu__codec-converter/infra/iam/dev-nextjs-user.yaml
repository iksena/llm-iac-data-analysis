AWSTemplateFormatVersion: '2010-09-09'
Description: >
  IAM user for local Next.js development.

  This template creates an IAM user for local developers to run the Next.js
  application locally with access to AWS resources.
  Access keys should be created manually via AWS Console and stored securely.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: デプロイ環境名

  NextjsPolicyArn:
    Type: String
    Description: >
      Next.js ポリシーの ARN
      (policies/nextjs-policy.yaml からエクスポートされた値を使用)

Resources:
  # ============================================================================
  # ローカル開発用 Next.js IAM ユーザー
  # ============================================================================
  DevNextjsUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Sub 'codec-converter-dev-nextjs-${Environment}'
      ManagedPolicyArns:
        - !Ref NextjsPolicyArn
      Tags:
        - Key: Application
          Value: codec-converter
        - Key: Environment
          Value: !Ref Environment
        - Key: Purpose
          Value: Local Next.js Development

Outputs:
  DevNextjsUserName:
    Description: ローカル開発用 Next.js ユーザーの名前
    Value: !Ref DevNextjsUser
    Export:
      Name: !Sub '${AWS::StackName}-DevNextjsUserName'

  DevNextjsUserArn:
    Description: ローカル開発用 Next.js ユーザーの ARN
    Value: !GetAtt DevNextjsUser.Arn
    Export:
      Name: !Sub '${AWS::StackName}-DevNextjsUserArn'