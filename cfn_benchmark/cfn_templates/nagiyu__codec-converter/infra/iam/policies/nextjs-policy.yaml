AWSTemplateFormatVersion: '2010-09-09'
Description: >
  IAM policy for Next.js application.

  This policy defines the minimum permissions required for Next.js API
  to generate S3 presigned URLs, access DynamoDB, and submit AWS Batch jobs.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: デプロイ環境名

Resources:
  # ============================================================================
  # Next.js アプリケーション用 IAM ポリシー
  # ============================================================================
  NextjsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub 'codec-converter-nextjs-policy-${Environment}'
      Description: Next.js アプリケーション用の最小権限ポリシー
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # S3 バケットへのアクセス権限（事前署名 URL 生成用）
          - Sid: AllowUploadBucketAccess
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
            Resource: '*'

          # 出力バケットへの読み取り権限（ダウンロード用 presigned URL 生成）
          - Sid: AllowOutputBucketRead
            Effect: Allow
            Action:
              - s3:GetObject
            Resource: '*'

          # バケット一覧取得権限
          - Sid: AllowBucketList
            Effect: Allow
            Action:
              - s3:ListBucket
            Resource: '*'

          # DynamoDB テーブルへの CRUD 権限
          - Sid: AllowDynamoDBAccess
            Effect: Allow
            Action:
              - dynamodb:PutItem
              - dynamodb:GetItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Query
            Resource: '*'

          # Batch ジョブの送信権限
          - Sid: AllowBatchSubmitJob
            Effect: Allow
            Action:
              - batch:SubmitJob
            Resource: '*'

          # Batch ジョブのステータス確認権限
          - Sid: AllowBatchDescribeJobs
            Effect: Allow
            Action:
              - batch:DescribeJobs
            Resource: '*'

Outputs:
  NextjsPolicyArn:
    Description: Next.js ポリシーの ARN
    Value: !Ref NextjsPolicy
    Export:
      Name: !Sub '${AWS::StackName}-NextjsPolicyArn'