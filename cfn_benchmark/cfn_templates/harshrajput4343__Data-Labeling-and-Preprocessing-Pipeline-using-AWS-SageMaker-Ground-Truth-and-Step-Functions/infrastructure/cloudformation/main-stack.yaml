AWSTemplateFormatVersion: '2010-09-09'
Description: 'Data Labeling and Preprocessing Pipeline - Matches Deployed AWS Resources'

# =============================================================================
# This template documents the exact AWS resources deployed for the pipeline.
# The resources were created manually in the AWS Console.
# This template can be used to recreate or document the infrastructure.
# =============================================================================

Parameters:
  Environment:
    Type: String
    Default: prod
    Description: Deployment environment

Metadata:
  AWS::CloudFormation::Interface:
    ParameterLabels:
      Environment:
        default: "Environment"

# Note: Using existing buckets - no bucket creation needed
# Existing Buckets:
#   - ml-labeling-raw-ap-south-1
#   - ml-labeling-labeled-ap-south-1
#   - ml-labeling-processed-ap-south-1

Resources:
  # ============================================
  # IAM ROLE: Lambda Preprocessing Role
  # ============================================
  LambdaPreprocessingRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: LambdaPreprocessingRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  # ============================================
  # IAM ROLE: Step Functions Execution Role
  # ============================================
  StepFunctionsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: StepFunctionsExecutionRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AllowInvokePreprocessLambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: arn:aws:lambda:ap-south-1:251941721464:function:preprocess-labeled-data

  # ============================================
  # LAMBDA: Preprocess Labeled Data
  # ============================================
  PreprocessLabeledDataLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: preprocess-labeled-data
      Runtime: python3.10
      Handler: handler.lambda_handler
      Role: !GetAtt LambdaPreprocessingRole.Arn
      Timeout: 60
      MemorySize: 256
      Code:
        ZipFile: |
          import json
          import boto3

          s3 = boto3.client("s3")

          SOURCE_BUCKET = "ml-labeling-labeled-ap-south-1"
          SOURCE_KEY = "labeled/output/image-classification-job-v1/manifests/intermediate/1/output.manifest"

          DEST_BUCKET = "ml-labeling-processed-ap-south-1"
          DEST_KEY = "processed/processed.manifest"

          def lambda_handler(event, context):
              response = s3.get_object(Bucket=SOURCE_BUCKET, Key=SOURCE_KEY)
              labeled_data = response["Body"].read().decode("utf-8").strip().split("\n")

              processed = []
              for line in labeled_data:
                  record = json.loads(line)
                  processed.append({
                      "image": record["source-ref"],
                      "label": record["image-classification-job-v1-metadata"]["class-name"]
                  })

              output = "\n".join(json.dumps(x) for x in processed)

              s3.put_object(
                  Bucket=DEST_BUCKET,
                  Key=DEST_KEY,
                  Body=output.encode("utf-8")
              )

              return {
                  "status": "SUCCESS",
                  "processed_records": len(processed)
              }

  # ============================================
  # STEP FUNCTIONS: Labeling Preprocessing Pipeline
  # ============================================
  LabelingPreprocessingPipeline:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: labeling-preprocessing-pipeline
      StateMachineType: STANDARD
      RoleArn: !GetAtt StepFunctionsExecutionRole.Arn
      DefinitionString: |
        {
          "Comment": "SageMaker Ground Truth → Lambda preprocessing pipeline",
          "StartAt": "PreprocessLabeledData",
          "States": {
            "PreprocessLabeledData": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "preprocess-labeled-data",
                "Payload": {}
              },
              "End": true
            }
          }
        }

Outputs:
  LambdaFunctionArn:
    Description: Preprocessing Lambda ARN
    Value: !GetAtt PreprocessLabeledDataLambda.Arn

  StateMachineArn:
    Description: Step Functions State Machine ARN
    Value: !Ref LabelingPreprocessingPipeline

  LambdaRoleArn:
    Description: Lambda Execution Role ARN
    Value: !GetAtt LambdaPreprocessingRole.Arn

  StepFunctionsRoleArn:
    Description: Step Functions Execution Role ARN
    Value: !GetAtt StepFunctionsExecutionRole.Arn

  # Resource Summary
  ResourceSummary:
    Description: Deployed AWS Resources
    Value: !Sub |
      Region: ap-south-1
      Account: 251941721464
      Lambda: preprocess-labeled-data
      State Machine: labeling-preprocessing-pipeline
      Raw Bucket: ml-labeling-raw-ap-south-1
      Labeled Bucket: ml-labeling-labeled-ap-south-1
      Processed Bucket: ml-labeling-processed-ap-south-1