AWSTemplateFormatVersion: '2010-09-09'
Description: 'Tables in dynamo for PEW Project'

Resources:
  DynamoDBTableTickers:
    Type: "AWS::DynamoDB::Table"
    DeletionPolicy: Delete
    Properties:
      TableName: "Tickers"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: "Ticker"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "Ticker"
          KeyType: "HASH"
  DynamoDBTableResults:
    Type: "AWS::DynamoDB::Table"
    DeletionPolicy: Delete
    Properties:
      TableName: "Results"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: "ModelID"
          AttributeType: "N"
        - AttributeName: "Timestamp"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "ModelID"
          KeyType: "HASH"
        - AttributeName: "Timestamp"
          KeyType: "RANGE"
  DynamoDBTableModels:
    Type: "AWS::DynamoDB::Table"
    DeletionPolicy: Delete
    Properties:
      TableName: "Models"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: "ModelID"
          AttributeType: "N"
        - AttributeName: "Status"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "ModelID"
          KeyType: "HASH"
        - AttributeName: "Status"
          KeyType: "RANGE"
      GlobalSecondaryIndexes:
        - IndexName: "Activity"
          KeySchema:
            - AttributeName: "Status"
              KeyType: "HASH"
          Projection:
            ProjectionType: "ALL"