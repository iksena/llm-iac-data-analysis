AWSTemplateFormatVersion: '2010-09-09'
Description: 'SAA Lab 01 - VPC multi-AZ com sub-redes publicas/privadas e NAT Gateway'

Parameters:
  ProjectName:
    Type: String
    Default: saa-lab-01
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9-]{2,30}$'
  NatGatewayMode:
    Type: String
    Default: Single
    AllowedValues: [Single, PerAZ]
    Description: Single reduz custo; PerAZ elimina dependencia entre AZs.

Conditions:
  UseNatPerAZ: !Equals [!Ref NatGatewayMode, PerAZ]

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.10.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-vpc'}
        - {Key: Project, Value: saa-c03-intensive}
        - {Key: Lab, Value: '01'}
        - {Key: ManagedBy, Value: CloudFormation}

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-igw'}
        - {Key: Project, Value: saa-c03-intensive}
        - {Key: Lab, Value: '01'}
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: {VpcId: !Ref VPC, InternetGatewayId: !Ref InternetGateway}

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.10.0.0/24
      MapPublicIpOnLaunch: true
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-public-a'}, {Key: Lab, Value: '01'}]
  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.10.1.0/24
      MapPublicIpOnLaunch: true
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-public-b'}, {Key: Lab, Value: '01'}]
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.10.10.0/24
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-private-a'}, {Key: Lab, Value: '01'}]
  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.10.11.0/24
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-private-b'}, {Key: Lab, Value: '01'}]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-public-rt'}, {Key: Lab, Value: '01'}]
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicSubnetA, RouteTableId: !Ref PublicRouteTable}
  PublicAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicSubnetB, RouteTableId: !Ref PublicRouteTable}

  NatEipA:
    Type: AWS::EC2::EIP
    DependsOn: GatewayAttachment
    Properties:
      Domain: vpc
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-nat-eip-a'}, {Key: Lab, Value: '01'}]
  NatGatewayA:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEipA.AllocationId
      SubnetId: !Ref PublicSubnetA
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-nat-a'}, {Key: Lab, Value: '01'}]
  NatEipB:
    Type: AWS::EC2::EIP
    Condition: UseNatPerAZ
    DependsOn: GatewayAttachment
    Properties:
      Domain: vpc
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-nat-eip-b'}, {Key: Lab, Value: '01'}]
  NatGatewayB:
    Type: AWS::EC2::NatGateway
    Condition: UseNatPerAZ
    Properties:
      AllocationId: !GetAtt NatEipB.AllocationId
      SubnetId: !Ref PublicSubnetB
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-nat-b'}, {Key: Lab, Value: '01'}]

  PrivateRouteTableA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-private-rt-a'}, {Key: Lab, Value: '01'}]
  PrivateRouteTableB:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-private-rt-b'}, {Key: Lab, Value: '01'}]
  PrivateDefaultRouteA:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTableA
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGatewayA
  PrivateDefaultRouteB:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTableB
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !If [UseNatPerAZ, !Ref NatGatewayB, !Ref NatGatewayA]
  PrivateAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PrivateSubnetA, RouteTableId: !Ref PrivateRouteTableA}
  PrivateAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PrivateSubnetB, RouteTableId: !Ref PrivateRouteTableB}

Outputs:
  VpcId: {Description: ID da VPC, Value: !Ref VPC}
  PublicSubnetIds: {Description: Sub-redes publicas, Value: !Join [',', [!Ref PublicSubnetA, !Ref PublicSubnetB]]}
  PrivateSubnetIds: {Description: Sub-redes privadas, Value: !Join [',', [!Ref PrivateSubnetA, !Ref PrivateSubnetB]]}
  NatGatewayIds:
    Description: Um ou dois NAT Gateways conforme o modo
    Value: !If [UseNatPerAZ, !Join [',', [!Ref NatGatewayA, !Ref NatGatewayB]], !Ref NatGatewayA]
  NatGatewayMode: {Description: Estrategia NAT aplicada, Value: !Ref NatGatewayMode}