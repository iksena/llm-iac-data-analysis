AWSTemplateFormatVersion: '2010-09-09'
Description: |
  KALIQ ECR Stack (Stack C)
  - Single private container registry for all KALIQ workloads
  - All services use image tags for organization (ingest, transform, index, ui, etc.)
  - Scan on push enabled; lifecycle policies for cost control
  - Reference: docs/infrastructure/STACKS.md

Parameters:
  Project:
    Type: String
    Default: kaliq
    Description: Project name used in resource naming and tagging

  Env:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - qa
      - prod
    Description: Environment name (affects repository naming)

  # Image retention policy
  ImageRetentionCount:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 100
    Description: Number of images to retain per tag (older images are deleted)

  # Flag to enable/disable image scanning on push
  EnableImageScan:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Enable ECR image scanning on push for vulnerability detection

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Stack Parameters"
        Parameters:
          - Project
          - Env
      - Label:
          default: "ECR Configuration"
        Parameters:
          - ImageRetentionCount
          - EnableImageScan

Conditions:
  EnableScanOnPush: !Equals [!Ref EnableImageScan, 'true']

Resources:
  # =============================================================================
  # ECR Repository: KALIQ (All Workloads)
  # =============================================================================
  # Single repository for all KALIQ workload images
  # Use tags to organize: ingest:v1.0, transform:v1.0, index:v1.0, ui:v1.0, etc.
  # Examples:
  #   docker tag myapp:latest <account>.dkr.ecr.us-east-1.amazonaws.com/kaliq:ingest-v1.0
  #   docker tag myapp:latest <account>.dkr.ecr.us-east-1.amazonaws.com/kaliq:transform-v1.0

  KaliqRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${Project}-${Env}'
      ImageScanningConfiguration:
        ScanOnPush: !If [EnableScanOnPush, true, false]
      LifecyclePolicy:
        LifecyclePolicyText: !Sub |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep last ${ImageRetentionCount} images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": ${ImageRetentionCount}
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Env
          Value: !Ref Env
        - Key: Purpose
          Value: KALIQ workload images - ingest transform index ui

Outputs:
  # Repository outputs
  RepositoryName:
    Description: ECR repository name (use with image tags like ingest:v1.0, transform:v1.0, etc.)
    Value: !Ref KaliqRepository
    Export:
      Name: !Sub '${Project}-${Env}-ecr-RepositoryName'

  RepositoryUri:
    Description: ECR repository URI (use for docker push/pull with tags)
    Value: !GetAtt KaliqRepository.RepositoryUri
    Export:
      Name: !Sub '${Project}-${Env}-ecr-RepositoryUri'

  # Example usage instructions
  RepositoryUrl:
    Description: ECR repository URL (same as RepositoryUri, for reference)
    Value: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${Project}-${Env}'
    Export:
      Name: !Sub '${Project}-${Env}-ecr-RepositoryUrl'