---
# Bashlinux::Public::EC2::Application Load Balancer
#
#   Cloudformation template to deploy a public ALB in front of the application
#   servers, in this case, the kubernetes workers
#
#   Manuel F Martinez
#   Bashlinux
#   Los Angeles, CA
#
AWSTemplateFormatVersion: "2010-09-09"
Description: EC2 Public ALB template

###############################################################################
Parameters:

  Environment:
    Description: Public ALB environment
    Type: String
    MinLength: "1"
    MaxLength: "20"
    Default: staging
    AllowedValues: [ "prod", "staging" ]
    ConstraintDescription: Environment name can only contain "prod" or "staging".

###############################################################################
Resources:

  PublicAlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "bashlinux-${Environment}-alb"
      Scheme: internet-facing
      SecurityGroups:
        - !ImportValue
          "Fn::Sub": "bashlinux-${Environment}-Ec2PublicAlbSecurityGroupId"
      Subnets: !Split
        - ","
        - !ImportValue
            "Fn::Sub": "bashlinux-${Environment}-VpcAlbPublicSubnetIds"
      IpAddressType: dualstack
      Tags:
      - Key: Name
        Value: !Sub "bashlinux-${Environment}-public-alb"
      - Key: bashlinux:environment-name
        Value: !Ref Environment
      - Key: bashlinux:application-id
        Value: !Ref AWS::StackName
      - Key: bashlinux:can-delete
        Value: "false"

  PublicAlbTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      HealthCheckPath: /healtz
      Port: 80
      Name: !Sub "bashlinux-${Environment}-targetgroup"
      Protocol: HTTP
      VpcId: !ImportValue
        "Fn::Sub": "bashlinux-${Environment}-VpcId"
      Tags:
      - Key: Name
        Value: !Sub "bashlinux-${Environment}-targetgroup"
      - Key: bashlinux:environment-name
        Value: !Ref Environment
      - Key: bashlinux:application-id
        Value: !Ref AWS::StackName
      - Key: bashlinux:can-delete
        Value: "false"

  PublicAlbListenerHTTP:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: "redirect"
          RedirectConfig:
            Protocol: "HTTPS"
            Port: 443
            Host: "#{host}"
            Path: "/#{path}"
            Query: "#{query}"
            StatusCode: "HTTP_301"
      LoadBalancerArn: !Ref PublicAlb
      Port: 80
      Protocol: "HTTP"

  PublicAlbListenerHTTPS:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      Certificates:
        - CertificateArn: !ImportValue
            "Fn::Sub": "bashlinux-${Environment}-SslCertificateArn"
      DefaultActions:
        - TargetGroupArn:
            !Ref PublicAlbTargetGroup
          Type: forward
      LoadBalancerArn: !Ref PublicAlb
      Port: 443
      Protocol: "HTTPS"
      SslPolicy: ELBSecurityPolicy-TLS-1-2-2017-01

  PublicAlbListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      Actions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: 200
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - "/healthz"
      ListenerArn: !Ref PublicAlbListenerHTTPS
      Priority: 1

###############################################################################
Outputs:

  PublicAlbArn:
    Description: "ALB: ARN"
    Value: !Ref PublicAlb
    Export:
      Name: !Sub "bashlinux-${Environment}-PublicAlbArn"

  PublicAlbURL:
    Description: "ALB: Public endpoint"
    Value:
      !Join
        - "."
        - - "dualstack"
          - !GetAtt PublicAlb.DNSName

  PublicAlbTargetGroupArn:
    Description: "TargetGroup: ARN of the target group"
    Value: !GetAtt PublicAlbTargetGroup.TargetGroupArn
    Export:
      Name: !Sub "bashlinux-${Environment}-PublicAlbTargetGroupArn"

  PublicAlbTargetGroupName:
    Description: "TargetGroup: Name of the target group"
    Value: !GetAtt PublicAlbTargetGroup.TargetGroupName

  PublicAlbTargetGroupFullName:
    Description: "TargetGroup: Full name of the target group"
    Value: !GetAtt PublicAlbTargetGroup.TargetGroupFullName

  PublicAlbListenerHTTPSArn:
    Description: "ALB HTTPS Listener: ARN of the HTTPS Listener"
    Value: !Ref PublicAlbListenerHTTPS
    Export:
      Name: !Sub "bashlinux-${Environment}-PublicAlbListenerHTTPSArn"