  NihReporterMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      ResourceId: !Ref NihReporterResource
      HttpMethod: POST
      AuthorizationType: COGNITO
      AuthorizerId: !Ref ApiAuthorizer
      Integration:
        Type: HTTP
        IntegrationHttpMethod: POST
        Uri: https://api.reporter.nih.gov
      MethodResponses:
        - StatusCode: 200
  NihReporterOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGatewayRestApi
      ResourceId: !Ref NihReporterResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
