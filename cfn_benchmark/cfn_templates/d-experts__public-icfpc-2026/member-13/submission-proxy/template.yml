AWSTemplateFormatVersion: "2010-09-09"
Description: ICFPC 2026 team submission proxy

Parameters:
  ArtifactBucket:
    Type: String
  ArtifactKey:
    Type: String
  UpstreamBaseUrl:
    Type: String
    Default: https://icfpcontest2026.com/api/v1

Resources:
  SubmissionTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: submissionId
          AttributeType: S
        - AttributeName: recordType
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: N
        - AttributeName: status
          AttributeType: S
        - AttributeName: updatedAt
          AttributeType: N
      KeySchema:
        - AttributeName: submissionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: byCreatedAt
          KeySchema:
            - AttributeName: recordType
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: byStatus
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: updatedAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  UpstreamApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Official ICFPC 2026 API key used only by the submission proxy
      GenerateSecretString:
        SecretStringTemplate: '{"apiKey":"REPLACE_ME"}'
        GenerateStringKey: bootstrapNonce
        PasswordLength: 32
        ExcludePunctuation: true

  TeamTokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Bearer token shared by ICFPC 2026 team members
      GenerateSecretString:
        SecretStringTemplate: "{}"
        GenerateStringKey: token
        PasswordLength: 48
        ExcludePunctuation: true

  ProxyRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ProxyData
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt SubmissionTable.Arn
                  - !Sub ${SubmissionTable.Arn}/index/*
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref UpstreamApiKeySecret
                  - !Ref TeamTokenSecret

  ProxyFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: icfpc2026-submission-proxy
      Runtime: python3.12
      Architectures: [arm64]
      Handler: app.handler
      Role: !GetAtt ProxyRole.Arn
      Timeout: 40
      MemorySize: 256
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref ArtifactKey
      Environment:
        Variables:
          TABLE_NAME: !Ref SubmissionTable
          UPSTREAM_SECRET_ARN: !Ref UpstreamApiKeySecret
          TEAM_SECRET_ARN: !Ref TeamTokenSecret
          UPSTREAM_BASE_URL: !Ref UpstreamBaseUrl

  ProxyUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt ProxyFunction.Arn
      AuthType: NONE
      InvokeMode: BUFFERED
      Cors:
        AllowOrigins: ["*"]
        AllowMethods: [GET, POST]
        AllowHeaders: [Authorization, Content-Type, Idempotency-Key]

  ProxyUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProxyFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  ProxyUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProxyFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  RefreshSchedule:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: rate(1 minute)
      State: ENABLED
      Targets:
        - Arn: !GetAtt ProxyFunction.Arn
          Id: ProxyRefresh

  RefreshPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProxyFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt RefreshSchedule.Arn

  LeaderSnapshotSchedule:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: rate(1 hour)
      State: ENABLED
      Targets:
        - Arn: !GetAtt ProxyFunction.Arn
          Id: LeaderSnapshot
          Input: '{"source":"aws.events","task":"capture_leader_scores"}'

  LeaderSnapshotPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProxyFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt LeaderSnapshotSchedule.Arn

Outputs:
  ProxyUrl:
    Value: !GetAtt ProxyUrl.FunctionUrl
  TeamTokenSecretArn:
    Value: !Ref TeamTokenSecret
  UpstreamApiKeySecretArn:
    Value: !Ref UpstreamApiKeySecret
  SubmissionTableName:
    Value: !Ref SubmissionTable