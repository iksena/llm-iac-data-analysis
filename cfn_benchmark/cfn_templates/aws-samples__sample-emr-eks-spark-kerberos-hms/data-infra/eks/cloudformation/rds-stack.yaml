AWSTemplateFormatVersion: "2010-09-09"
Description: "RDS Stack for Hive Metastore Infrastructure"
Parameters:
  ProjectName:
    Type: String
    Default: KerberosEMRonEKS
    Description: Environment name used for tagging and resource naming

  VPC:
    Type: AWS::EC2::VPC::Id
    Description: The VPC ID where the RDS instance will be created

  # Network
  VpcCIDR:
    Description: Please enter the IP range (CIDR notation) for this VPC
    Type: String
    Default: 10.0.1.0/24

  PrivateSubnets:
    Type: List<AWS::EC2::Subnet::Id>
    Description: List of private subnet IDs for the RDS instance

  DBIdentifier:
    Type: String
    Default: hivemetastoredb
    Description: Name of the database to be created in the RDS instance

  DBName:
    Type: String
    Default: hivemetastore
    Description: Name of the database to be created in the RDS instance

  DBInstanceClass:
    Type: String
    Default: db.r5.large
    Description: The compute and memory capacity class of the DB instance

  DBEngineVersion:
    Type: String
    Default: "16.4"
    Description: The version number of the database engine (PostgreSQL)

  EKSSecurityGroups:
    Type: List<AWS::EC2::SecurityGroup::Id>
    Description: List of EKS cluster security group IDs to allow access to RDS

Resources:
  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Hive Metastore RDS
      VpcId: !Ref VPC
      # Ingress and Egress rules for directly using the DBClusterEndpoint without DBProxy
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Select [0, !Ref EKSSecurityGroups]
          Description: !Sub EKS SG for ${DBIdentifier}-sg
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: !Ref VpcCIDR
          Description: "Allow PostgreSQL return traffic within VPC"

      Tags:
        - Key: ProjectName
          Value: !Ref ProjectName
        - Key: Name
          Value: !Sub ${DBIdentifier}-sg
        - Key: Description
          Value: "Security group for Hive Metastore RDS"

  DBSecretKMSKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Description: "KMS key for Hive Metastore DB Secret"
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: "Enable IAM User Permissions"
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"

  DBSecretKMSKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${ProjectName}-hive-metastore-secret-key"
      TargetKeyId: !Ref DBSecretKMSKey

  DBSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: /rds/aurora/hive-metastore/credentials
      KmsKeyId: !Ref DBSecretKMSKey
      GenerateSecretString:
        SecretStringTemplate: '{"username": "hive_metastore_user"}'
        GenerateStringKey: password
        PasswordLength: 20
        ExcludeCharacters: '"@/\'
        ExcludePunctuation: true
        IncludeSpace: false
        RequireEachIncludedType: true
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnet group for Hive Metastore Aurora PostgreSQL RDS
      SubnetIds: !Ref PrivateSubnets
      Tags:
        - Key: ProjectName
          Value: !Ref ProjectName

  DBCluster:
    Type: AWS::RDS::DBCluster
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_162
            comment: "IAM Authentication is not required in this Demo setup"
    Properties:
      Engine: aurora-postgresql
      EngineVersion: !Ref DBEngineVersion
      BackupRetentionPeriod: 1
      # Note: MasterUsername and MasterUserPassword are AWS CloudFormation API property names
      # that cannot be modified. AWS recommends using ManageMasterUserPassword with
      # AWS Secrets Manager integration for new deployments.
      # We opted this mechanism to maintain a static secret name value for demo purpose.
      MasterUsername: !Sub "{{resolve:secretsmanager:${DBSecret}:SecretString:username}}"
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DBSecret}:SecretString:password}}"
      DBSubnetGroupName: !Ref DBSubnetGroup
      DatabaseName: !Ref DBName
      StorageEncrypted: true
      KmsKeyId: !GetAtt DBSecretKMSKey.Arn
      Port: 5432
      VpcSecurityGroupIds:
        - !Ref DBSecurityGroup
      Tags:
        - Key: ProjectName
          Value: !Ref ProjectName
        - Key: Name
          Value: !Sub ${DBIdentifier}
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete

  DBInstance:
    Type: AWS::RDS::DBInstance
    #checkov:skip=CKV_AWS_118: "Enhanced monitoring is not required in this setup"
    Metadata:
      guard:
        SuppressedRules:
          - DB_INSTANCE_BACKUP_ENABLED: "Backups disabled for demo purposes. This is an Aurora cluster member; backups are managed at the cluster level."
          - RDS_AUTOMATIC_MINOR_VERSION_UPGRADE_ENABLED: "Auto minor version upgrade disabled for demo stability. Enable for production deployments."
          - RDS_ENHANCED_MONITORING_ENABLED: "Enhanced monitoring not required for demo purposes. Enable for production deployments."
          - RDS_INSTANCE_DELETION_PROTECTION_ENABLED: "Deletion protection disabled for demo cleanup. Enable for production deployments."
          - RDS_INSTANCE_LOGGING_ENABLED: "CloudWatch Logs export not required for demo purposes. Enable for production deployments."
          - RDS_MULTI_AZ_SUPPORT: "Multi-AZ not required for demo purposes. Aurora handles HA at cluster level. Enable for production deployments."
          - RDS_STORAGE_ENCRYPTED: "This is an Aurora cluster member; storage encryption is configured at the cluster level (StorageEncrypted: true on DBCluster)."
    Properties:
      PubliclyAccessible: false
      DBClusterIdentifier: !Ref DBCluster
      DBInstanceClass: !Ref DBInstanceClass
      Engine: aurora-postgresql
      Tags:
        - Key: ProjectName
          Value: !Ref ProjectName
        - Key: Name
          Value: !Sub ${DBIdentifier}-writer
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete

Outputs:
  DBClusterIdentifier:
    Description: Identifier of the DB Cluster
    Value: !Ref DBCluster

  DBClusterEndpoint:
    Description: Endpoint of the DB cluster
    Value: !GetAtt DBCluster.Endpoint.Address

  DBClusterReadEndpoint:
    Description: Read endpoint of the DB cluster
    Value: !GetAtt DBCluster.ReadEndpoint.Address

  DBSecretArn:
    Description: ARN of the secret containing database credentials
    Value: !Ref DBSecret

  DBSecurityGroup:
    Description: ID of the DB Security Group
    Value: !Ref DBSecurityGroup

  DBSecretKMSKeyArn:
    Description: ARN of the KMS key used for DB secret encryption
    Value: !GetAtt DBSecretKMSKey.Arn