AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Shared KMS key for encrypting all project resources including
  S3 buckets, CloudWatch Logs, EBS volumes, and EKS secrets.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Configuration
        Parameters:
          - ProjectName

Parameters:
  ProjectName:
    Type: String
    Default: emr-celeborn-demo
    Description: Project name prefixed to resource names

Resources:
  # --- Shared KMS Key ---

  ProjectKMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "${ProjectName} shared encryption key"
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowKeyAdministration
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action:
              - "kms:Create*"
              - "kms:Describe*"
              - "kms:Enable*"
              - "kms:List*"
              - "kms:Put*"
              - "kms:Update*"
              - "kms:Revoke*"
              - "kms:Disable*"
              - "kms:Get*"
              - "kms:Delete*"
              - "kms:TagResource"
              - "kms:UntagResource"
              - "kms:ScheduleKeyDeletion"
              - "kms:CancelKeyDeletion"
            Resource: "*"
          # Enables IAM policy delegation for encrypt/decrypt (required by EKS, EBS, etc.)
          - Sid: AllowKeyUsageDelegation
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action:
              - "kms:Encrypt"
              - "kms:Decrypt"
              - "kms:ReEncrypt*"
              - "kms:GenerateDataKey*"
              - "kms:DescribeKey"
              - "kms:CreateGrant"
            Resource: "*"
          # EMR requires direct KMS access for local disk encryption
          # (SecurityConfiguration with LocalDiskEncryptionConfiguration)
          - Sid: AllowEMRAccess
            Effect: Allow
            Principal:
              Service: elasticmapreduce.amazonaws.com
            Action:
              - "kms:Encrypt"
              - "kms:Decrypt"
              - "kms:ReEncrypt*"
              - "kms:GenerateDataKey*"
              - "kms:DescribeKey"
              - "kms:CreateGrant"
            Condition:
              Bool:
                "kms:GrantIsForAWSResource": "true"
            Resource: "*"
          - Sid: AllowCloudFormationAccess
            Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action:
              - "kms:Encrypt"
              - "kms:Decrypt"
              - "kms:ReEncrypt*"
              - "kms:GenerateDataKey*"
              - "kms:DescribeKey"
            Resource: "*"
          - Sid: AllowS3Access
            Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action:
              - "kms:Encrypt"
              - "kms:Decrypt"
              - "kms:ReEncrypt*"
              - "kms:GenerateDataKey*"
              - "kms:DescribeKey"
            Resource: "*"
          - Sid: AllowCloudWatchLogsAccess
            Effect: Allow
            Principal:
              Service: !Sub "logs.${AWS::Region}.amazonaws.com"
            Action:
              - "kms:Encrypt"
              - "kms:Decrypt"
              - "kms:ReEncrypt*"
              - "kms:GenerateDataKey*"
              - "kms:DescribeKey"
            Resource: "*"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-kms-key"
        - Key: Project
          Value: !Ref ProjectName
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

  ProjectKMSKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${ProjectName}-key"
      TargetKeyId: !Ref ProjectKMSKey

Outputs:
  KMSKeyId:
    Description: ID of the shared project KMS key
    Value: !Ref ProjectKMSKey
    Export:
      Name: !Sub "${ProjectName}-KMSKeyId"

  KMSKeyArn:
    Description: ARN of the shared project KMS key
    Value: !GetAtt ProjectKMSKey.Arn
    Export:
      Name: !Sub "${ProjectName}-KMSKeyArn"