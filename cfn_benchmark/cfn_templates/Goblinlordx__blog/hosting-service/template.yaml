AWSTemplateFormatVersion: 2010-09-09
Transform:
  - AWS::Serverless-2016-10-31

Parameters:
  DomainName:
    Type: String
    Description: 'The domain name of website'
  HostedZoneId:
    Type: String
    Description: 'The Route53 hosted zone ID used for the domain'
  AcmCertificateArn:
    Type: String
    Description: 'The certificate arn for the domain name provided'
  IndexDocument:
    Type: String
    Description: 'The index document'
    Default: 'index.html'
  ErrorDocument:
    Type: String
    Description: 'The error document, ignored in SPA mode'
    Default: '404.html'
  RewriteMode:
    Type: String
    Description: 'The request rewrite behaviour type'
    Default: 'STATIC'
    AllowedValues:
      - STATIC
      - SPA
  CloudFrontPriceClass:
    Type: String
    Description: 'The price class for CloudFront distribution'
    Default: 'PriceClass_200'
    AllowedValues:
      - PriceClass_100
      - PriceClass_200
      - PriceClass_All
  PipelineExecutionRole:
    Type: String
    Description: 'Pipeline execution role ARN'

Conditions:
  IsStaticMode: !Equals [!Ref RewriteMode, 'STATIC']
  IsSPAMode: !Equals [!Ref RewriteMode, 'SPA']

Resources:
  Bucket:
    Type: AWS::S3::Bucket

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Statement:
          - Effect: 'Allow'
            Action: 's3:GetObject'
            Resource: !Sub 'arn:aws:s3:::${Bucket}/*'
            Principal:
              AWS: !Sub 'arn:aws:iam::cloudfront:user/CloudFront Origin Access Identity ${OriginAccessIdentity}'

  OriginAccessIdentity:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: !Ref AWS::StackName

  RewriteRequestStaticFunction:
    Condition: IsStaticMode
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-req-static'
      AutoPublish: true
      FunctionCode: !Sub |
        function handler(event) {
          var request = event.request;
          var uri = request.uri
          if (uri.endsWith('/')) {
              request.uri += '${IndexDocument}';
          } else if (!uri.includes('.')) {
              request.uri += '/${IndexDocument}';
          }
          return request;
        }
      FunctionConfig:
        Comment: !Sub 'rewrite all paths to /${IndexDocument}'
        Runtime: cloudfront-js-1.0

  RewriteRequestSpaFunction:
    Condition: IsSPAMode
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-req-spa'
      AutoPublish: true
      FunctionCode: !Sub |
        function handler(event) {
          var request = event.request;
          var uri = request.uri
          if (uri.includes('.') && !uri.endsWith('.html')) {
              return request;
          }
          request.uri = '/${IndexDocument}';
          return request;
        }
      FunctionConfig:
        Comment: !Sub 'rewrite sub-directory path with trailing /${IndexDocument}'
        Runtime: cloudfront-js-1.0

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: 'true'
        Comment: !Ref AWS::StackName
        PriceClass: !Ref CloudFrontPriceClass
        HttpVersion: http2
        DefaultRootObject: !Ref IndexDocument
        Aliases:
          - !Ref DomainName
        Origins:
          - DomainName: !Sub '${Bucket}.s3.${AWS::Region}.amazonaws.com'
            Id: bucketOrigin
            S3OriginConfig:
              OriginAccessIdentity: !Sub origin-access-identity/cloudfront/${OriginAccessIdentity}
        CustomErrorResponses:
          - ErrorCachingMinTTL: 86400
            ErrorCode: 403 # object not found in bucket
            ResponseCode: !If [IsStaticMode, 404, 200]
            ResponsePagePath: !If [IsStaticMode, !Sub '/${ErrorDocument}', !Sub '/${IndexDocument}']
        DefaultCacheBehavior:
          Compress: 'true'
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          TargetOriginId: bucketOrigin
          ForwardedValues:
            QueryString: 'false'
            Cookies:
              Forward: none
          ViewerProtocolPolicy: redirect-to-https
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN:
                !If [
                  IsStaticMode,
                  !GetAtt RewriteRequestStaticFunction.FunctionMetadata.FunctionARN,
                  !GetAtt RewriteRequestSpaFunction.FunctionMetadata.FunctionARN,
                ]
        ViewerCertificate:
          AcmCertificateArn: !Ref AcmCertificateArn
          SslSupportMethod: sni-only

  DnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: 'Z2FDTNDATAQYW2' # CloudFront

  PipelineDeployementRolePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub ${AWS::StackName}-deploy
      Roles: [!Ref PipelineExecutionRole]
      PolicyDocument:
        Statement:
          - Effect: Allow
            Action: ['s3:*']
            Resource:
              - !GetAtt Bucket.Arn
              - !Sub '${Bucket.Arn}/*'
          - Effect: Allow
            Action: ['cloudfront:*']
            Resource: ['*']

Outputs:
  BucketName:
    Description: 'Bucket name'
    Value: !Ref Bucket
  DistributionId:
    Description: 'CloudFront distribution Id'
    Value: !GetAtt Distribution.Id
  DistributionURL:
    Description: 'Distribution URL'
    Value: !Ref DomainName