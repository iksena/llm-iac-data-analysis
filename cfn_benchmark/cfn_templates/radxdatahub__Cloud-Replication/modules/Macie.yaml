AWSTemplateFormatVersion: "2010-09-09"
Description: "Amazon Macie configuration for sensitive data discovery and protection"

Parameters:
  Environment:
    Type: String
    Description: The Project Environment
    AllowedValues:
      - dev
      - test
      - prod
      - shared
  ProjectName:
    Type: String
    Description: The Project name
    Default: radx
    AllowedValues:
      - radx
  FindingPublishingFrequency:
    Type: String
    Description: How often Macie publishes findings
    Default: FIFTEEN_MINUTES
    AllowedValues:
      - FIFTEEN_MINUTES
      - ONE_HOUR
      - SIX_HOURS

Conditions:
  DEV: !Equals [!Ref Environment, dev]
  TEST: !Equals [!Ref Environment, test]
  PROD: !Equals [!Ref Environment, prod]
  NOTDEV: !Not [!Equals [!Ref Environment, dev]]
  NOTPROD: !Not [!Equals [!Ref Environment, prod]]

Resources:
  MacieSession:
    Type: "AWS::Macie::Session"
    Properties:
      FindingPublishingFrequency: !Ref FindingPublishingFrequency
      Status: "ENABLED"

Outputs:
  MacieSessionStatus:
    Description: "Macie Session Status"
    Value: !GetAtt MacieSession.ServiceRole
    Export:
      Name: !Sub "${ProjectName}-Macie-${Environment}-SessionStatus"

  MacieServiceRole:
    Description: "Macie Service Role ARN"
    Value: !GetAtt MacieSession.ServiceRole
    Export:
      Name: !Sub "${ProjectName}-Macie-${Environment}-ServiceRole"