Resources:
  CodeBuildServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodeBuildServiceRolePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:GetBucketVersioning
                Resource: "*"

  Project1:
    Type: AWS::CodeBuild::Project
    Properties:
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:5.0
      Source:
        Location: codebuild-demo-test/0123ab9a371ebf0187b0fe5614fbb72c
        Type: S3
      Tags:
        - Key: Project
          Value: BadCodeBuildExample
        - Key: ProjectPart
          Value: !Ref AWS::StackName
        - Key: ProjectPartDetail
          Value: Project1

  Project2:
    Type: AWS::CodeBuild::Project
    Properties:
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:5.0
      Source:
        Location: codebuild-demo-test/0123ab9a371ebf0187b0fe5614fbb72c
        Type: S3
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
      Tags:
        - Key: Project
          Value: BadCodeBuildExample
        - Key: ProjectPart
          Value: !Ref AWS::StackName
        - Key: ProjectPartDetail
          Value: Project2

  Project3:
    Type: AWS::CodeBuild::Project
    Properties:
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:5.0
      Source:
        Location: codebuild-demo-test/0123ab9a371ebf0187b0fe5614fbb72c
        Type: S3
      LogsConfig:
        CloudWatchLogs:
          GroupName: log_group_name
          Status: ENABLED
      Tags:
        - Key: Project
          Value: BadCodeBuildExample
        - Key: ProjectPart
          Value: !Ref AWS::StackName
        - Key: ProjectPartDetail
          Value: Project3

  Project4LogGroup:
    Type: AWS::Logs::LogGroup
    UpdateReplacePolicy: Delete
    DeletionPolicy: Delete
    Properties:
      Tags:
        - Key: Project
          Value: BadCodeBuildExample
        - Key: ProjectPart
          Value: !Ref AWS::StackName
        - Key: ProjectPartDetail
          Value: Project4LogGroup

  Project4:
    Type: AWS::CodeBuild::Project
    Properties:
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:5.0
      Source:
        Location: codebuild-demo-test/0123ab9a371ebf0187b0fe5614fbb72c
        Type: S3
      LogsConfig:
        CloudWatchLogs:
          GroupName: !Sub "${Project4LogGroup}"
          Status: ENABLED
      Tags:
        - Key: Project
          Value: BadCodeBuildExample
        - Key: ProjectPart
          Value: !Ref AWS::StackName
        - Key: ProjectPartDetail
          Value: Project4
