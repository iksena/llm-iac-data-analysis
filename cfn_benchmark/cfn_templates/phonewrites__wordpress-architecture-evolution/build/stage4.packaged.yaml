AWSTemplateFormatVersion: 2010-09-09
Description: WordPress architecture evolution - Stage 4 nested root stack
  Application server with separate RDS database & EFS shared storage
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
    - Label:
        default: Stage 4 configuration
      Parameters:
      - LatestAmiId
      - SourceAmiId
      - CfnMetadataNonce
    ParameterLabels:
      LatestAmiId:
        default: Amazon Linux 2023 AMI
      SourceAmiId:
        default: Stage 3 source AMI ID
      CfnMetadataNonce:
        default: cfn-init refresh nonce
Parameters:
  LatestAmiId:
    Description: Latest Amazon Linux 2023 AMI for greenfield stage 4.
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.18-x86_64
  SourceAmiId:
    Type: String
    Default: ''
    AllowedPattern: ^$|^ami-[a-z0-9]+$
    Description: Optional AMI created from stage 3 before updating to stage 4.
      Use for same-stack upgrades to preserve wp-content files before EFS
      cutover.
  CfnMetadataNonce:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 2147483647
    Description: Increase on stack update so cfn-hup re-runs cfn-init.
Resources:
  NetworkStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL:
        https://s3.us-east-1.amazonaws.com/cf-templates-xunea76zqzgs-us-east-1/8ec44aebe8ef431e83e1e5cf6c7c66ee.template
  IamStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL:
        https://s3.us-east-1.amazonaws.com/cf-templates-xunea76zqzgs-us-east-1/af54ee4d651d23c5255102a6e7b05139.template
  AutomationStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL:
        https://s3.us-east-1.amazonaws.com/cf-templates-xunea76zqzgs-us-east-1/d2e6dbe144726b2485f82759638c6a4c.template
      Parameters:
        RootStackName:
          Ref: AWS::StackName
  DatabaseStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL:
        https://s3.us-east-1.amazonaws.com/cf-templates-xunea76zqzgs-us-east-1/d98982c7a944ca0421d6befb3ff4c33f.template
      Parameters:
        RootStackName:
          Ref: AWS::StackName
        VpcId:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.VpcId
        DbSubnetAId:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.DbSubnetAId
        DbSubnetBId:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.DbSubnetBId
        DbSubnetCId:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.DbSubnetCId
  ContentStorageStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL:
        https://s3.us-east-1.amazonaws.com/cf-templates-xunea76zqzgs-us-east-1/f40cb9dd2672012965a6f77bc6a8e44d.template
      Parameters:
        VpcId:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.VpcId
        AppSubnetAId:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.AppSubnetAId
        AppSubnetBId:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.AppSubnetBId
        AppSubnetCId:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.AppSubnetCId
  SharedSsmStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL:
        https://s3.us-east-1.amazonaws.com/cf-templates-xunea76zqzgs-us-east-1/e38468bdf61427428d7a60c7cad79df8.template
      Parameters:
        DBEndpointValue:
          Fn::GetAtt:
          - DatabaseStack
          - Outputs.DBEndpointAddress
        EFSfsidValue:
          Fn::GetAtt:
          - ContentStorageStack
          - Outputs.EfsId
  AppServerStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: SharedSsmStack
    Properties:
      TemplateURL:
        https://s3.us-east-1.amazonaws.com/cf-templates-xunea76zqzgs-us-east-1/ccc570bc74a1531681a3e4a6f1ef1461.template
      Parameters:
        LatestAmiId:
          Ref: LatestAmiId
        SourceAmiId:
          Ref: SourceAmiId
        CfnMetadataNonce:
          Ref: CfnMetadataNonce
        VpcId:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.VpcId
        PublicSubnetId:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.PublicSubnetAId
        InstanceProfileName:
          Fn::GetAtt:
          - IamStack
          - Outputs.InstanceProfileName
        EfsId:
          Fn::GetAtt:
          - ContentStorageStack
          - Outputs.EfsId
Outputs:
  WordpressURL:
    Description: Open this stable Elastic IP URL to verify WordPress.
    Value:
      Fn::GetAtt:
      - AppServerStack
      - Outputs.WordpressURL
  WordpressInstanceId:
    Description: Current WordPress EC2 instance ID.
    Value:
      Fn::GetAtt:
      - AppServerStack
      - Outputs.WordpressInstanceId
  WordpressInstanceAutoIP:
    Value:
      Fn::GetAtt:
      - AppServerStack
      - Outputs.WordpressInstanceAutoIP
  WordpressLaunchTemplateId:
    Value:
      Fn::GetAtt:
      - AppServerStack
      - Outputs.WordpressLaunchTemplateId
  EfsId:
    Value:
      Fn::GetAtt:
      - ContentStorageStack
      - Outputs.EfsId
  PreStageSnapshotDocumentName:
    Value:
      Fn::GetAtt:
      - AutomationStack
      - Outputs.PreStageSnapshotDocumentName
  AutomationRoleArn:
    Value:
      Fn::GetAtt:
      - AutomationStack
      - Outputs.AutomationRoleArn
  VpcId:
    Value:
      Fn::GetAtt:
      - NetworkStack
      - Outputs.VpcId