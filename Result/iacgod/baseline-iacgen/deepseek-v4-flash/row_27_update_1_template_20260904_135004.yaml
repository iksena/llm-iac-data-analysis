AWSTemplateFormatVersion: "2010-09-09"
Description: "Reusable nested stack that subscribes multiple endpoints to an SNS topic"

Parameters:
  TopicArn:
    Type: String
    Description: "ARN of the existing SNS topic to subscribe endpoints to"
  EmailAddress:
    Type: String
    Default: "example@example.com"
    Description: "Email address for email subscription (leave as default to skip)"
  SqsQueueArn:
    Type: String
    Default: "arn:aws:sqs:us-east-1:000000000000:placeholder-queue"
    Description: "ARN of the SQS queue for subscription (leave as default to skip)"
  LambdaFunctionArn:
    Type: String
    Default: "arn:aws:lambda:us-east-1:000000000000:function:placeholder"
    Description: "ARN of the Lambda function for subscription (leave as default to skip)"
  HttpsEndpointUrl:
    Type: String
    Default: "https://placeholder.example.com/endpoint"
    Description: "HTTPS endpoint URL for subscription (leave as default to skip)"

Conditions:
  CreateEmailSubscription: !Not [!Equals [!Ref EmailAddress, "example@example.com"]]
  CreateSqsSubscription: !Not [!Equals [!Ref SqsQueueArn, "arn:aws:sqs:us-east-1:000000000000:placeholder-queue"]]
  CreateLambdaSubscription: !Not [!Equals [!Ref LambdaFunctionArn, "arn:aws:lambda:us-east-1:000000000000:function:placeholder"]]
  CreateHttpsSubscription: !Not [!Equals [!Ref HttpsEndpointUrl, "https://placeholder.example.com/endpoint"]]

Resources:
  EmailSubscription:
    Type: "AWS::SNS::Subscription"
    Condition: CreateEmailSubscription
    Properties:
      Protocol: email
      TopicArn: !Ref TopicArn
      Endpoint: !Ref EmailAddress

  SqsSubscription:
    Type: "AWS::SNS::Subscription"
    Condition: CreateSqsSubscription
    Properties:
      Protocol: sqs
      TopicArn: !Ref TopicArn
      Endpoint: !Ref SqsQueueArn

  LambdaSubscription:
    Type: "AWS::SNS::Subscription"
    Condition: CreateLambdaSubscription
    Properties:
      Protocol: lambda
      TopicArn: !Ref TopicArn
      Endpoint: !Ref LambdaFunctionArn

  HttpsSubscription:
    Type: "AWS::SNS::Subscription"
    Condition: CreateHttpsSubscription
    Properties:
      Protocol: https
      TopicArn: !Ref TopicArn
      Endpoint: !Ref HttpsEndpointUrl
      DeliveryPolicy:
        healthyRetryPolicy:
          numRetries: 10
          minDelayTarget: 1
          maxDelayTarget: 60
          numMinDelayRetries: 3
          numMaxDelayRetries: 3
          backoffFunction: exponential
        requestPolicy:
          headerContentType: "text/plain"
        throttlePolicy:
          maxReceivesPerSecond: 10

Outputs:
  EmailSubscriptionArn:
    Condition: CreateEmailSubscription
    Value: !Ref EmailSubscription
    Description: "ARN of the email SNS subscription"
  SqsSubscriptionArn:
    Condition: CreateSqsSubscription
    Value: !Ref SqsSubscription
    Description: "ARN of the SQS SNS subscription"
  LambdaSubscriptionArn:
    Condition: CreateLambdaSubscription
    Value: !Ref LambdaSubscription
    Description: "ARN of the Lambda SNS subscription"
  HttpsSubscriptionArn:
    Condition: CreateHttpsSubscription
    Value: !Ref HttpsSubscription
    Description: "ARN of the HTTPS SNS subscription"
</iac_template>