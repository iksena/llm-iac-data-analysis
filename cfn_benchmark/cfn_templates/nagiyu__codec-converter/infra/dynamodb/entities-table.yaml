AWSTemplateFormatVersion: '2010-09-09'
Description: |
  DynamoDB single table design for Video Codec Converter.
  Stores VideoFile, ConversionJob, and Codec entities in a single table.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Environment name for resource naming

  TableName:
    Type: String
    Default: ''
    Description: Optional custom table name. If not provided, uses 'Entities-{Environment}'

Conditions:
  UseCustomTableName: !Not [!Equals [!Ref TableName, '']]

Resources:
  EntitiesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !If
        - UseCustomTableName
        - !Ref TableName
        - !Sub 'Codec-Converter-Entities-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: DataType
          AttributeType: S
        - AttributeName: id
          AttributeType: S
        - AttributeName: video_file_id
          AttributeType: S
        - AttributeName: submitted_at
          AttributeType: S
        - AttributeName: owner_id
          AttributeType: S
      KeySchema:
        - AttributeName: DataType
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI_VideoFileId
          KeySchema:
            - AttributeName: video_file_id
              KeyType: HASH
            - AttributeName: submitted_at
              KeyType: RANGE
          Projection:
            # ProjectionType: ALL is used because queries typically need full entity data
            # to avoid additional table fetches. Trade-off: higher storage cost for reduced read latency.
            ProjectionType: ALL
        - IndexName: GSI_OwnerId
          KeySchema:
            - AttributeName: owner_id
              KeyType: HASH
            - AttributeName: id
              KeyType: RANGE
          Projection:
            # ProjectionType: ALL is used because queries typically need full entity data
            # to avoid additional table fetches. Trade-off: higher storage cost for reduced read latency.
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: codec-converter
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

Outputs:
  TableName:
    Description: Name of the DynamoDB Entities table
    Value: !Ref EntitiesTable
    Export:
      Name: !Sub '${AWS::StackName}-TableName'

  TableArn:
    Description: ARN of the DynamoDB Entities table
    Value: !GetAtt EntitiesTable.Arn
    Export:
      Name: !Sub '${AWS::StackName}-TableArn'

  GSIVideoFileIdArn:
    Description: ARN of the GSI_VideoFileId index
    Value: !Sub '${EntitiesTable.Arn}/index/GSI_VideoFileId'
    Export:
      Name: !Sub '${AWS::StackName}-GSIVideoFileIdArn'

  GSIOwnerIdArn:
    Description: ARN of the GSI_OwnerId index
    Value: !Sub '${EntitiesTable.Arn}/index/GSI_OwnerId'
    Export:
      Name: !Sub '${AWS::StackName}-GSIOwnerIdArn'