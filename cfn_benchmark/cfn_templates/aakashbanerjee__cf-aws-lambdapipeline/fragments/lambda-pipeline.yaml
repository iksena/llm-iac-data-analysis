AWSTemplateFormatVersion: '2010-09-09'
Description: 'Lambda CodePipeline with GitHub integration, CodeBuild, and CloudFormation deployment'

Parameters:
  ProjectName:
    Type: String
    Description: Lambda Project Name

  ManagedBy:
    Type: String
    Description: Tag Managed By
    Default: CloudFormation

  VCS:
    Type: String
    Description: Tag VCS
    Default: GitHub

  VCSRepoURL:
    Type: String
    Description: Tag VCS Repo URL

  LambdaRepoName:
    Type: String
    Description: GitHub repository name (e.g., owner/repo)

  LambdaRepoBranchToTrack:
    Type: String
    Description: Branch to track for changes
    Default: main

  ConnectionArn:
    Type: String
    Description: ARN of the CodeStar connection to GitHub

  S3BucketName:
    Type: String
    Description: Name for the CodePipeline artifact bucket

  ComputeType:
    Type: String
    Description: CodeBuild compute type
    Default: BUILD_GENERAL1_SMALL
    AllowedValues:
      - BUILD_GENERAL1_SMALL
      - BUILD_GENERAL1_MEDIUM
      - BUILD_GENERAL1_LARGE

  CodeBuildImage:
    Type: String
    Description: CodeBuild container image
    Default: aws/codebuild/standard:7.0

  EnvType:
    Type: String
    Description: CodeBuild environment type
    Default: LINUX_CONTAINER
    AllowedValues:
      - LINUX_CONTAINER
      - LINUX_GPU_CONTAINER
      - ARM_CONTAINER
      - WINDOWS_CONTAINER

  S3Bucket:
    Type: String
    Description: S3 bucket for Lambda deployment

  CodePipelinePolicyDocument:
    Type: String
    Description: IAM Policy document for Codepipeline role

  CodeBuildPolicyDocument:
    Type: String
    Description: IAM Policy document for Codebuild role

  DeployCFPolicyDocument:
    Type: String
    Description: IAM Policy document for CloudFormation role

  CodeDeployPolicyDocument:
    Type: String
    Description: IAM Policy document for CodeDeploy role

  S3BucketPolicyDocument:
    Type: String
    Description: S3 Bucket Policy document

Resources:
  # IAM Roles
  LambdaCodePipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-CodePipelineRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - codepipeline.amazonaws.com
                - codedeploy.amazonaws.com
            Action: sts:AssumeRole
            Sid: '1'
      Tags:
        - Key: ManagedBy
          Value: !Ref ManagedBy
        - Key: VCS
          Value: !Ref VCS
        - Key: RepositoryURL
          Value: !Ref VCSRepoURL

  LambdaCodePipelinePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub ${ProjectName}-CodePipelinePolicy
      Roles:
        - !Ref LambdaCodePipelineRole
      PolicyDocument: !Ref CodePipelinePolicyDocument

  DeployCFRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-DeployCFRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
            Sid: '1'
      Tags:
        - Key: ManagedBy
          Value: !Ref ManagedBy
        - Key: VCS
          Value: !Ref VCS
        - Key: RepositoryURL
          Value: !Ref VCSRepoURL

  DeployCFPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub ${ProjectName}-DeployCFPolicy
      Roles:
        - !Ref DeployCFRole
      PolicyDocument: !Ref DeployCFPolicyDocument

  LambdaCodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-CodeBuildRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
            Sid: '1'
      Tags:
        - Key: ManagedBy
          Value: !Ref ManagedBy
        - Key: VCS
          Value: !Ref VCS
        - Key: RepositoryURL
          Value: !Ref VCSRepoURL

  LambdaCodeBuildPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub ${ProjectName}-CodeBuildPolicy
      Roles:
        - !Ref LambdaCodeBuildRole
      PolicyDocument: !Ref CodeBuildPolicyDocument

  LambdaCodeDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-CodeDeployRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codedeploy.amazonaws.com
            Action: sts:AssumeRole
            Sid: '1'
      Tags:
        - Key: ManagedBy
          Value: !Ref ManagedBy
        - Key: VCS
          Value: !Ref VCS
        - Key: RepositoryURL
          Value: !Ref VCSRepoURL

  LambdaCodeDeployPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub ${ProjectName}-CodeDeployPolicy
      Roles:
        - !Ref LambdaCodeDeployRole
      PolicyDocument: !Ref CodeDeployPolicyDocument

  # S3 Bucket for CodePipeline artifacts
  LambdaCodePipelineBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref S3BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      Tags:
        - Key: ManagedBy
          Value: !Ref ManagedBy
        - Key: VCS
          Value: !Ref VCS
        - Key: RepositoryURL
          Value: !Ref VCSRepoURL

  # S3 Bucket Policy (conditionally created if policy document is provided)
  LambdaCodePipelineBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: HasBucketPolicy
    Properties:
     Bucket: !Ref LambdaCodePipelineBucket
     PolicyDocument: !Ref S3BucketPolicyDocument

  # CodeBuild Project
  LambdaCodeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Ref ProjectName
      ServiceRole: !GetAtt LambdaCodeBuildRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec.yml
      Environment:
        Type: !Ref EnvType
        ComputeType: !Ref ComputeType
        Image: !Ref CodeBuildImage
        PrivilegedMode: true
        ImagePullCredentialsType: CODEBUILD
        EnvironmentVariables:
          - Name: AWS_DEFAULT_REGION
            Value: !Ref AWS::Region
          - Name: ACCOUNT_ID
            Value: !Ref AWS::AccountId
          - Name: PROJECT_ID
            Value: !Ref ProjectName
          - Name: S3_BUCKET
            Value: !Ref S3Bucket
      Tags:
        - Key: ManagedBy
          Value: !Ref ManagedBy
        - Key: VCS
          Value: !Ref VCS
        - Key: RepositoryURL
          Value: !Ref VCSRepoURL

  # CodePipeline
  LambdaCodePipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub ${ProjectName}-Pipeline
      RoleArn: !GetAtt LambdaCodePipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref LambdaCodePipelineBucket
      Stages:
        - Name: Source
          Actions:
            - Name: Source
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'
              Configuration:
                ConnectionArn: !Ref ConnectionArn
                FullRepositoryId: !Ref LambdaRepoName
                BranchName: !Ref LambdaRepoBranchToTrack
                OutputArtifactFormat: CODE_ZIP
              OutputArtifacts:
                - Name: source_output
        - Name: Build
          Actions:
            - Name: Build
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref LambdaCodeBuildProject
              InputArtifacts:
                - Name: source_output
              OutputArtifacts:
                - Name: build_output
        - Name: Deploy
          Actions:
            - Name: GenerateChangeSet
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: '1'
              Configuration:
                ActionMode: CHANGE_SET_REPLACE
                Capabilities: CAPABILITY_NAMED_IAM
                StackName: !Sub ${ProjectName}-stack
                TemplatePath: build_output::template-export.yml
                RoleArn: !GetAtt DeployCFRole.Arn
                ChangeSetName: !Sub ${ProjectName}-changeset
                ParameterOverrides: !Sub |
                  {
                    "ProjectName": "${ProjectName}",
                    "CodeDeployRole": "${LambdaCodeDeployRole.Arn}",
                    "AWSAccountNumber": "${AWS::AccountId}"
                  }
              InputArtifacts:
                - Name: build_output
              RunOrder: 1
            - Name: ExecuteChangeSet
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: '1'
              Configuration:
                ActionMode: CHANGE_SET_EXECUTE
                StackName: !Sub ${ProjectName}-stack
                ChangeSetName: !Sub ${ProjectName}-changeset
              RunOrder: 2

Conditions:
  HasBucketPolicy: !Not [!Equals [!Ref S3BucketPolicyDocument, ""]]