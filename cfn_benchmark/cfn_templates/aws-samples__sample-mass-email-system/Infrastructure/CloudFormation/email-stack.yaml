                      logger.error(f"Error processing SQS message: {str(e)}")

                      # Record failure if we have the required variables
                      if 'batch_id' in locals() and 'campaign_id' in locals() and 'email' in locals() and 'recipient_table' in locals() and 'batch_table' in locals():
                          try:
                              record_failure(batch_id, campaign_id, email, recipient_table, str(e), attempts + 1)
                              # Update batch failure count immediately
                              batch_table.update_item(
                                  Key={'BatchId': batch_id},
                                  UpdateExpression="ADD FailedCount :fail",
                                  ExpressionAttributeValues={':fail': 1}
