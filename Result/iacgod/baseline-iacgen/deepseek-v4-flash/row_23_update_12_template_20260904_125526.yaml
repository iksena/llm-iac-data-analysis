AWSTemplateFormatVersion: "2010-09-09"
Description: "Amazon Verified Permissions policy store for Bookstore application with Cedar-based access control"
Parameters:
  SchemaDefinition:
    Type: String
    Default: '{"Bookstore":{"entityTypes":{"Role":{"shape":{"type":"Record","attributes":{}}},"User":{"shape":{"type":"Record","attributes":{"yearsAsMember":{"type":"Long","required":false}}}},"Book":{"shape":{"type":"Record","attributes":{"owningUser":{"type":"Entity","required":true}}}}},"actions":{"View":{"appliesTo":{"principalTypes":["User"],"resourceTypes":["Book"]},"context":{"region":{"type":"String","required":true}}},"ViewWithPremiumOffers":{"appliesTo":{"principalTypes":["User"],"resourceTypes":["Book"]},"context":{"region":{"type":"String","required":true}}}}}}'
Resources:
  BookstorePolicyStore:
    Type: AWS::VerifiedPermissions::PolicyStore
    Properties:
      ValidationSettings:
        Mode: STRICT
      Description: "Policy store for Bookstore application with Role, User, and Book entities"

  SchemaLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SchemaLambdaPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - verifiedpermissions:PutSchema
                  - verifiedpermissions:GetSchema
                Resource: !Sub "arn:aws:verifiedpermissions::${AWS::AccountId}:policy-store/${BookstorePolicyStore}"
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"

  SchemaLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.handler
      Role: !GetAtt SchemaLambdaRole.Arn
      Runtime: python3.12
      Timeout: 120
      Code:
        ZipFile: |
          import json
          import boto3
          import cfnresponse
          import logging

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def handler(event, context):
              logger.info("Received event: %s", json.dumps(event))
              try:
                  client = boto3.client('verifiedpermissions')
                  policy_store_id = event['ResourceProperties']['PolicyStoreId']
                  schema_definition_str = event['ResourceProperties']['SchemaDefinition']
                  schema_definition = json.loads(schema_definition_str)
                  definition = {'cedarJson': json.dumps(schema_definition)}
                  if event['RequestType'] == 'Create':
                      client.put_schema(
                          policyStoreId=policy_store_id,
                          definition=definition
                      )
                  elif event['RequestType'] == 'Update':
                      client.put_schema(
                          policyStoreId=policy_store_id,
                          definition=definition
                      )
                  elif event['RequestType'] == 'Delete':
                      pass
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
              except Exception as e:
                  logger.error("Error: %s", str(e))
                  reason = str(e)
                  cfnresponse.send(event, context, cfnresponse.FAILED, {}, reason=reason)

  SchemaCustomResource:
    Type: Custom::Schema
    Properties:
      ServiceToken: !GetAtt SchemaLambdaFunction.Arn
      PolicyStoreId: !Ref BookstorePolicyStore
      SchemaDefinition: !Ref SchemaDefinition

  AdminViewAllPolicy:
    Type: AWS::VerifiedPermissions::Policy
    DependsOn: SchemaCustomResource
    Properties:
      PolicyStoreId: !Ref BookstorePolicyStore
      Definition:
        Static:
          Description: "Permit users in Admin role to view any book"
          Statement: |
            permit (principal in Bookstore::Role::"Admin", action == Bookstore::Action::"View", resource in Bookstore::Book::"*");

  ForbidAdminViewPolicy:
    Type: AWS::VerifiedPermissions::Policy
    DependsOn: SchemaCustomResource
    Properties:
      PolicyStoreId: !Ref BookstorePolicyStore
      Definition:
        Static:
          Description: "Explicitly forbid specific admin from viewing books"
          Statement: |
            forbid (principal == Bookstore::User::"admin1", action == Bookstore::Action::"View", resource in Bookstore::Book::"*");

  PublisherViewOwnPolicy:
    Type: AWS::VerifiedPermissions::Policy
    DependsOn: SchemaCustomResource
    Properties:
      PolicyStoreId: !Ref BookstorePolicyStore
      Definition:
        Static:
          Description: "Permit users in Publisher role to view only their own books"
          Statement: |
            permit (principal in Bookstore::Role::"Publisher", action == Bookstore::Action::"View", resource == Bookstore::Book::"*")
            when { resource.owningUser == principal };

  SpecificUserViewSpecificBookPolicy:
    Type: AWS::VerifiedPermissions::Policy
    DependsOn: SchemaCustomResource
    Properties:
      PolicyStoreId: !Ref BookstorePolicyStore
      Definition:
        Static:
          Description: "Permit specific user to view specific book"
          Statement: |
            permit (principal == Bookstore::User::"user1", action == Bookstore::Action::"View", resource == Bookstore::Book::"book1");

  CustomerViewPremiumOffersPolicy:
    Type: AWS::VerifiedPermissions::Policy
    DependsOn: SchemaCustomResource
    Properties:
      PolicyStoreId: !Ref BookstorePolicyStore
      Definition:
        Static:
          Description: "Permit Customer role with 2+ years membership to view premium offers"
          Statement: |
            permit (principal in Bookstore::Role::"Customer", action == Bookstore::Action::"ViewWithPremiumOffers", resource in Bookstore::Book::"*")
            when { principal.yearsAsMember >= 2 };

  ForbidCustomerPremiumOffersPolicy:
    Type: AWS::VerifiedPermissions::Policy
    DependsOn: SchemaCustomResource
    Properties:
      PolicyStoreId: !Ref BookstorePolicyStore
      Definition:
        Static:
          Description: "Forbid Customer role with less than 2 years membership from viewing premium offers"
          Statement: |
            forbid (principal in Bookstore::Role::"Customer", action == Bookstore::Action::"ViewWithPremiumOffers", resource in Bookstore::Book::"*")
            when { principal.yearsAsMember < 2 };

  ForbidNonUSRegionPolicy:
    Type: AWS::VerifiedPermissions::Policy
    DependsOn: SchemaCustomResource
    Properties:
      PolicyStoreId: !Ref BookstorePolicyStore
      Definition:
        Static:
          Description: "Forbid View and ViewWithPremiumOffers when region is not US"
          Statement: |
            forbid (principal in Bookstore::User::"*", action in [Bookstore::Action::"View", Bookstore::Action::"ViewWithPremiumOffers"], resource in Bookstore::Book::"*")
            when { context.region != "US" };

  PolicyStoreIdParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: "/bookstore/policy-store-id"
      Type: String
      Value: !Ref BookstorePolicyStore
      Description: "Policy store ID for Bookstore application"

Outputs:
  PolicyStoreId:
    Description: "ID of the Bookstore policy store"
    Value: !Ref BookstorePolicyStore
  PolicyStoreArn:
    Description: "ARN of the Bookstore policy store"
    Value: !GetAtt BookstorePolicyStore.Arn