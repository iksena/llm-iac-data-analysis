AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  SageMaker real-time or serverless inference endpoint with an execution role,
  optional data capture, autoscaling, and blue/green deployment guardrails.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Naming
        Parameters:
          - NamePrefix
          - Environment
          - EndpointSuffix
      - Label:
          default: Model
        Parameters:
          - InferenceImageUri
          - ModelDataUrl
          - HuggingFaceModelId
      - Label:
          default: Serving mode
        Parameters:
          - ServingMode
          - InstanceType
          - InitialInstanceCount
          - ServerlessMemoryMb
          - ServerlessMaxConcurrency
      - Label:
          default: Autoscaling (real-time only)
        Parameters:
          - MinInstanceCount
          - MaxInstanceCount
          - TargetInvocationsPerInstance
      - Label:
          default: Data capture
        Parameters:
          - DataCaptureS3Uri
          - DataCapturePercentage
      - Label:
          default: Access
        Parameters:
          - ModelArtifactBucketArn
          - KmsKeyArn

Parameters:
  NamePrefix:
    Type: String
    Description: Prefix for the model, config and endpoint names.
    AllowedPattern: "^[a-z][a-z0-9-]{1,30}[a-z0-9]$"
    ConstraintDescription: 3-32 lowercase characters, digits and hyphens.

  Environment:
    Type: String
    Description: Environment this endpoint serves.
    Default: dev
    AllowedValues: [dev, staging, prod]

  EndpointSuffix:
    Type: String
    Description: Distinguishes endpoints, e.g. "embeddings" or "ranker".
    Default: inference
    AllowedPattern: "^[a-z0-9][a-z0-9-]{0,30}$"

  InferenceImageUri:
    Type: String
    Description: >-
      Serving container image - a SageMaker Deep Learning Container, a Large
      Model Inference (LMI) image, or your own. It must implement /ping and
      /invocations; SageMaker health-checks the former before sending traffic.

  ModelDataUrl:
    Type: String
    Description: >-
      s3:// URI of model.tar.gz. Leave empty for images that download weights at
      startup (an LMI container pulling from Hugging Face, for instance) - though
      note that makes startup depend on an external service.
    Default: ""

  HuggingFaceModelId:
    Type: String
    Description: >-
      Model to download at container start, e.g. "sentence-transformers/all-
      MiniLM-L6-v2". Passed as HF_MODEL_ID, which the Hugging Face and Large
      Model Inference containers use to fetch weights from the Hub. Leave empty
      when the weights come from ModelDataUrl instead.
    Default: ""

  ServingMode:
    Type: String
    Description: >-
      REALTIME provisions instances that are billed continuously and respond in
      milliseconds. SERVERLESS scales to zero and bills per request, at the cost
      of a cold start of tens of seconds on the first request after idle - and it
      supports no GPU.
    Default: REALTIME
    AllowedValues: [REALTIME, SERVERLESS]

  InstanceType:
    Type: String
    Description: >-
      Instance type for REALTIME. ml.g5.xlarge is the usual entry point for a
      small GPU model; ml.c6i.xlarge for CPU inference.
    Default: ml.m5.large
    AllowedValues:
      - ml.t2.medium
      - ml.m5.large
      - ml.m5.xlarge
      - ml.c6i.xlarge
      - ml.c6i.2xlarge
      - ml.g5.xlarge
      - ml.g5.2xlarge
      - ml.g5.12xlarge
      - ml.inf2.xlarge

  InitialInstanceCount:
    Type: Number
    Description: >-
      Instances at creation. One instance means every deployment and every
      instance failure is an outage; two is the smallest number that is not.
    Default: 1
    MinValue: 1
    MaxValue: 100

  ServerlessMemoryMb:
    Type: Number
    Description: Memory for SERVERLESS mode. CPU scales with it, as on Lambda.
    Default: 2048
    AllowedValues: [1024, 2048, 3072, 4096, 5120, 6144]

  ServerlessMaxConcurrency:
    Type: Number
    Description: Concurrent invocations allowed in SERVERLESS mode.
    Default: 5
    MinValue: 1
    MaxValue: 200

  MinInstanceCount:
    Type: Number
    Description: Autoscaling floor for REALTIME endpoints.
    Default: 1
    MinValue: 1
    MaxValue: 100

  MaxInstanceCount:
    Type: Number
    Description: >-
      Autoscaling ceiling. On GPU instance types this is the parameter that
      decides whether a traffic spike costs tens or thousands of dollars.
    Default: 2
    MinValue: 1
    MaxValue: 100

  TargetInvocationsPerInstance:
    Type: Number
    Description: >-
      Invocations per minute per instance the scaler holds. Unlike CPU
      utilisation, this tracks the thing that actually saturates an inference
      server - GPU inference is often memory-bound with CPU near idle, so CPU
      scaling never fires.
    Default: 100
    MinValue: 1
    MaxValue: 1000000

  DataCaptureS3Uri:
    Type: String
    Description: >-
      s3:// prefix to record inputs and outputs to. This is what makes drift
      monitoring and offline evaluation possible later; without it those requests
      are gone. Leave empty to disable.
    Default: ""

  DataCapturePercentage:
    Type: Number
    Description: Percentage of requests captured.
    Default: 20
    MinValue: 1
    MaxValue: 100

  ModelArtifactBucketArn:
    Type: String
    Description: >-
      Bucket the execution role may read model artifacts from. Required unless
      the container downloads weights itself.
    Default: ""

  KmsKeyArn:
    Type: String
    Description: KMS key for endpoint storage volumes and captured data.
    Default: ""

Conditions:
  IsRealtime: !Equals [!Ref ServingMode, "REALTIME"]
  IsServerless: !Equals [!Ref ServingMode, "SERVERLESS"]
  HasModelData: !Not [!Equals [!Ref ModelDataUrl, ""]]
  HasHuggingFaceModel: !Not [!Equals [!Ref HuggingFaceModelId, ""]]
  HasDataCapture: !Not [!Equals [!Ref DataCaptureS3Uri, ""]]
  HasArtifactBucket: !Not [!Equals [!Ref ModelArtifactBucketArn, ""]]
  UsesKms: !Not [!Equals [!Ref KmsKeyArn, ""]]

Resources:
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: sagemaker.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: serve
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                # GetAuthorizationToken takes no resource; the others are
                # scoped by the repository policy on the image side.
                Resource: "*"
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/sagemaker/*"
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals:
                    cloudwatch:namespace: AWS/SageMaker
              - !If
                - HasArtifactBucket
                - Effect: Allow
                  Action:
                    - s3:GetObject
                    - s3:ListBucket
                  Resource:
                    - !Ref ModelArtifactBucketArn
                    - !Sub "${ModelArtifactBucketArn}/*"
                - !Ref AWS::NoValue

  Model:
    Type: AWS::SageMaker::Model
    Properties:
      ModelName: !Sub "${NamePrefix}-${Environment}-${EndpointSuffix}"
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      PrimaryContainer:
        Image: !Ref InferenceImageUri
        ModelDataUrl: !If [HasModelData, !Ref ModelDataUrl, !Ref "AWS::NoValue"]
        # Fn::If cannot add or remove a *key* in a map, only substitute a value,
        # so the whole map is swapped rather than the individual entry. This is
        # also why the container environment is a fixed set of well-known keys
        # rather than an arbitrary name/value pair.
        Environment: !If
          - HasHuggingFaceModel
          - SAGEMAKER_CONTAINER_LOG_LEVEL: "20"
            HF_MODEL_ID: !Ref HuggingFaceModelId
          - SAGEMAKER_CONTAINER_LOG_LEVEL: "20"

  EndpointConfig:
    Type: AWS::SageMaker::EndpointConfig
    Properties:
      ProductionVariants:
        - VariantName: primary
          ModelName: !GetAtt Model.ModelName
          InitialVariantWeight: 1
          InstanceType: !If [IsRealtime, !Ref InstanceType, !Ref "AWS::NoValue"]
          InitialInstanceCount: !If [IsRealtime, !Ref InitialInstanceCount, !Ref "AWS::NoValue"]
          ServerlessConfig: !If
            - IsServerless
            - MemorySizeInMB: !Ref ServerlessMemoryMb
              MaxConcurrency: !Ref ServerlessMaxConcurrency
            - !Ref AWS::NoValue
      KmsKeyId: !If [UsesKms, !Ref KmsKeyArn, !Ref "AWS::NoValue"]
      DataCaptureConfig: !If
        - HasDataCapture
        - EnableCapture: true
          InitialSamplingPercentage: !Ref DataCapturePercentage
          DestinationS3Uri: !Ref DataCaptureS3Uri
          CaptureOptions:
            - CaptureMode: Input
            - CaptureMode: Output
        - !Ref AWS::NoValue

  Endpoint:
    Type: AWS::SageMaker::Endpoint
    Properties:
      EndpointName: !Sub "${NamePrefix}-${Environment}-${EndpointSuffix}"
      EndpointConfigName: !GetAtt EndpointConfig.EndpointConfigName
      # Shift traffic to the new fleet in one step but hold the old one for 10
      # minutes with alarms watching. Without this, a model that loads but
      # answers badly has already replaced the working one.
      DeploymentConfig:
        BlueGreenUpdatePolicy:
          TrafficRoutingConfiguration:
            Type: ALL_AT_ONCE
            WaitIntervalInSeconds: 600
          TerminationWaitInSeconds: 600
          MaximumExecutionTimeoutInSeconds: 3600
        AutoRollbackConfiguration:
          Alarms:
            - AlarmName: !Ref InvocationErrorAlarm

  InvocationErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${NamePrefix}-${Environment}-${EndpointSuffix}-5xx"
      AlarmDescription: >-
        Model errors on the endpoint. Wired into the deployment's auto-rollback,
        so a bad model version is reverted rather than left serving.
      Namespace: AWS/SageMaker
      MetricName: Invocation5XXErrors
      Dimensions:
        - Name: EndpointName
          Value: !Sub "${NamePrefix}-${Environment}-${EndpointSuffix}"
        - Name: VariantName
          Value: primary
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  ScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Condition: IsRealtime
    Properties:
      ServiceNamespace: sagemaker
      ScalableDimension: "sagemaker:variant:DesiredInstanceCount"
      ResourceId: !Sub "endpoint/${Endpoint.EndpointName}/variant/primary"
      MinCapacity: !Ref MinInstanceCount
      MaxCapacity: !Ref MaxInstanceCount

  ScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Condition: IsRealtime
    Properties:
      PolicyName: !Sub "${NamePrefix}-${Environment}-${EndpointSuffix}-invocations"
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: SageMakerVariantInvocationsPerInstance
        TargetValue: !Ref TargetInvocationsPerInstance
        ScaleInCooldown: 300
        ScaleOutCooldown: 60

Outputs:
  EndpointName:
    Description: Endpoint name, for InvokeEndpoint and for alarm dimensions.
    Value: !GetAtt Endpoint.EndpointName

  EndpointArn:
    Description: Endpoint ARN, for IAM policies on the calling role.
    Value: !Ref Endpoint

  ModelName:
    Description: Model name registered with SageMaker.
    Value: !GetAtt Model.ModelName

  ExecutionRoleArn:
    Description: Role SageMaker assumes to pull the image and read model artifacts.
    Value: !GetAtt ExecutionRole.Arn

  ErrorAlarmName:
    Description: Alarm wired into deployment auto-rollback.
    Value: !Ref InvocationErrorAlarm