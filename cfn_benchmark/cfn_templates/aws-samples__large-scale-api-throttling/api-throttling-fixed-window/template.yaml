AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: |
  Large scale API throttling with a custom rate-limiter
  A Sample SAM Template

Globals:
  Function:
    Timeout: 3

Parameters:
  DomainPrefix:
    Description: Prefix string for the domain
    Type: String
    Default: large-scale-throttling-fixed-window

Resources:
  CreateUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: create_user_function/
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures:
        - x86_64
      Environment:
        Variables:
          USER_API_KEY_TABLE: !Ref UserApiKeyTable
          COGNITO_USER_POOL_ID: !Ref CognitoUserPool
          API_KEY_THROTTLE_TABLE: !Ref ApiKeyThrottleTable
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt UserApiKeyTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt ApiKeyThrottleTable.Arn
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminDeleteUser
                - cognito-idp:AdminGetUser
                - cognito-idp:AdminSetUserPassword
              Resource: !GetAtt CognitoUserPool.Arn

  AuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: authorizer_function/
      Handler: app.lambda_handler
      Runtime: python3.12
      Tracing: Disabled
      Architectures:
        - x86_64
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref CognitoUserPool
          COGNITO_USER_POOL_CLIENT_ID: !Ref CognitoUserPoolClient
          COGNITO_USER_POOL_CLIENT_NAME: !Ref CognitoUserPool
          COGNITO_USER_POOL_DOMAIN: !Sub https://${DomainPrefix}.auth.${AWS::Region}.amazoncognito.com/login
          USER_API_KEY_TABLE: !Ref UserApiKeyTable
          API_KEY_THROTTLE_TABLE: !Ref ApiKeyThrottleTable
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - cognito-idp:GetUser
              Resource: !GetAtt CognitoUserPool.Arn
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:DeleteItem
              Resource: !GetAtt UserApiKeyTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt ApiKeyThrottleTable.Arn

  RestApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      ApiKeySourceType: AUTHORIZER
      Auth:
        Authorizers:
          LambdaAuthorizer:
            FunctionArn: !GetAtt AuthorizerFunction.Arn
            Identity:
              ReauthorizeEvery: 0
        DefaultAuthorizer: LambdaAuthorizer

  HelloFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: hello_world/
      Handler: app.lambda_handler
      Runtime: python3.12
      Architectures:
        - x86_64
      Events:
        HelloWorld:
          Type: Api
          Properties:
            Path: /hello
            Method: get
            RestApiId: !Ref RestApi

  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: false
          RequireNumbers: false
          RequireSymbols: false
          RequireUppercase: false

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_PASSWORD_AUTH
      CallbackURLs:
        - http://localhost
      LogoutURLs:
        - http://localhost
      AllowedOAuthFlows:
        - code
        - implicit
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - phone
        - email
        - openid
        - profile
      SupportedIdentityProviders:
        - COGNITO

  CognitoUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref DomainPrefix
      UserPoolId: !Ref CognitoUserPool

  UserApiKeyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-user-api-keys
      BillingMode: PAY_PER_REQUEST # Using on-demand capacity
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true # Enables server-side encryption by default

  ApiKeyThrottleTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-api-key-throttle
      BillingMode: PAY_PER_REQUEST # Using on-demand capacity
      AttributeDefinitions:
        - AttributeName: api_key
          AttributeType: S
        - AttributeName: window
          AttributeType: N
      KeySchema:
        - AttributeName: api_key
          KeyType: HASH
        - AttributeName: window
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true # Enables server-side encryption by default
      TimeToLiveSpecification:
        Enabled: true
        AttributeName: ttl
Outputs:
  ClientID:
    Description: ClientID for the Cognito User Pool
    Value: !Ref CognitoUserPoolClient
  APIEndpoint:
    Description: The API Gateway endpoint
    Value: !Sub https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/prod
  TableName:
    Description: The name of the DynamoDB table
    Value: !Ref UserApiKeyTable
  CreateUserFunction:
    Description: The ARN of the CreateUserFunction
    Value: !GetAtt CreateUserFunction.Arn