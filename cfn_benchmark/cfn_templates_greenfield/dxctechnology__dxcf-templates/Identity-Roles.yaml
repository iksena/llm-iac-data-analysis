AWSTemplateFormatVersion: 2010-09-09
Description: Identity-Roles Template.
  This creates IAM Roles. These are not Application specific - Roles created here are for Federated Identity and Cross-Account Access. Roles should be kept in 1:1 sync with Groups, to insure IAM Users and Federated Users have the same permissions.
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Identity Provider Dependencies
        Parameters:
          - SamlProviderName
      - Label:
          default: Account Dependencies
        Parameters:
          - StackSetAdministratorAccount
    ParameterLabels:
      SamlProviderName:
        default: SAML Provider Name
      StackSetAdministratorAccount:
        default: StackSet Administrator Account
Parameters:
  SamlProviderName:
    Description: Name of the SAML Provider
    Type: String
    Default: ''
    AllowedPattern: (^$|^[-.a-zA-Z0-9]{2,64}$)
    ConstraintDescription: must begin with a letter and contain alphanumeric characters, dashes and periods, or blank.
  StackSetAdministratorAccount:
    Description: AWS Account ID of the StackSet Administrator Account
    Type: String
    Default: ''
    AllowedPattern: (^$|^[0-9]{12}$)
    ConstraintDescription: must be a valid AWS Account ID, or blank.
Rules:
  ValidateRegion:
    Assertions:
      - Assert: !Equals [ !Ref 'AWS::Region', us-east-1 ]
        AssertDescription: This Template can only be used in Region us-east-1.
Conditions:
  ConfigureSamlRoles: !Not [ !Equals [ !Ref SamlProviderName, '' ]]
  ConfigureCrossAccountRoles: !Not [ !Equals [ !Ref StackSetAdministratorAccount, '' ]]
Resources:
  UserSelfManagementAccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: UserSelfManagementAccess
      Description: Allows IAM Users to manage their own credentials and profile.
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - iam:ChangePassword
              - iam:CreateAccessKey
              - iam:CreateLoginProfile
              - iam:CreateVirtualMFADevice
              - iam:DeactivateMFADevice
              - iam:DeleteAccessKey
              - iam:DeleteLoginProfile
              - iam:DeleteSSHPublicKey
              - iam:DeleteSigningCertificate
              - iam:DeleteVirtualMFADevice
              - iam:EnableMFADevice
              - iam:GetAccessKeyLastUsed
              - iam:GetAccountPasswordPolicy
              - iam:GetLoginProfile
              - iam:GetSSHPublicKey
              - iam:GetUser
              - iam:ListAccessKeys
              - iam:ListMFADevices
              - iam:ListSSHPublicKeys
              - iam:ListServiceSpecificCredentials
              - iam:ListSigningCertificates
              - iam:ResyncMFADevice
              - iam:UpdateAccessKey
              - iam:UpdateLoginProfile
              - iam:UpdateSSHPublicKey
              - iam:UpdateSigningCertificate
              - iam:UpdateUser
              - iam:UploadSSHPublicKey
              - iam:UploadSigningCertificate
            Resource:
              - !Sub arn:aws:iam::${AWS::AccountId}:user/${!aws:username}
  UserFolderAccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: UserFolderAccess
      Description: Allows IAM Users to access an S3 folder matching their own username.
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - s3:ListBucket
            Resource:
              - !Sub arn:aws:s3:::${AWS::AccountId}-user-home
            Condition:
              StringLike:
                s3:prefix:
                  - !Sub ${!aws:username}/*
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
            Resource:
              - !Sub arn:aws:s3:::${AWS::AccountId}-user-home/${!aws:username}/*
  AdministratorsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: Administrators
      Path: /
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:saml-provider/${SamlProviderName}
            Action:
              - sts:AssumeRoleWithSAML
            Condition:
              StringEquals:
                SAML:aud: https://signin.aws.amazon.com/saml
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess
    Condition: ConfigureSamlRoles
  NetworkAdministratorsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: NetworkAdministrators
      Path: /
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:saml-provider/${SamlProviderName}
            Action:
              - sts:AssumeRoleWithSAML
            Condition:
              StringEquals:
                SAML:aud: https://signin.aws.amazon.com/saml
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/job-function/NetworkAdministrator
    Condition: ConfigureSamlRoles
  SystemAdministratorsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: SystemAdministrators
      Path: /
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:saml-provider/${SamlProviderName}
            Action:
              - sts:AssumeRoleWithSAML
            Condition:
              StringEquals:
                SAML:aud: https://signin.aws.amazon.com/saml
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/job-function/SystemAdministrator
    Condition: ConfigureSamlRoles
  DatabaseAdministratorsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: DatabaseAdministrators
      Path: /
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:saml-provider/${SamlProviderName}
            Action:
              - sts:AssumeRoleWithSAML
            Condition:
              StringEquals:
                SAML:aud: https://signin.aws.amazon.com/saml
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/job-function/DatabaseAdministrator
    Condition: ConfigureSamlRoles
  SecurityAdministratorsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: SecurityAdministrators
      Path: /
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:saml-provider/${SamlProviderName}
            Action:
              - sts:AssumeRoleWithSAML
            Condition:
              StringEquals:
                SAML:aud: https://signin.aws.amazon.com/saml
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/SecurityAudit
    Condition: ConfigureSamlRoles
  DevelopersRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: Developers
      Path: /
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:saml-provider/${SamlProviderName}
            Action:
              - sts:AssumeRoleWithSAML
            Condition:
              StringEquals:
                SAML:aud: https://signin.aws.amazon.com/saml
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/PowerUserAccess
        - !Ref UserSelfManagementAccessPolicy
        - !Ref UserFolderAccessPolicy
    Condition: ConfigureSamlRoles
  ManagersRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: Managers
      Path: /
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:saml-provider/${SamlProviderName}
            Action:
              - sts:AssumeRoleWithSAML
            Condition:
              StringEquals:
                SAML:aud: https://signin.aws.amazon.com/saml
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/ReadOnlyAccess
        - arn:aws:iam::aws:policy/AWSSupportAccess
        - !Ref UserSelfManagementAccessPolicy
        - !Ref UserFolderAccessPolicy
    Condition: ConfigureSamlRoles
  UsersRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: Users
      Path: /
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:saml-provider/${SamlProviderName}
            Action:
              - sts:AssumeRoleWithSAML
            Condition:
              StringEquals:
                SAML:aud: https://signin.aws.amazon.com/saml
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/ReadOnlyAccess
        - !Ref UserSelfManagementAccessPolicy
        - !Ref UserFolderAccessPolicy
    Condition: ConfigureSamlRoles
  AWSCloudFormationStackSetExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: AWSCloudFormationStackSetExecutionRole
      Path: /
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              AWS:
                - !Sub arn:aws:iam::${StackSetAdministratorAccount}:root
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess
    Condition: ConfigureCrossAccountRoles
Outputs:
  AdministratorsRole:
    Description: The AdministratorsRole Name
    Value: !Ref AdministratorsRole
    Export:
      Name: !Sub ${AWS::StackName}-AdministratorsRole
    Condition: ConfigureSamlRoles
  NetworkAdministratorsRole:
    Description: The NetworkAdministratorsRole Name
    Value: !Ref NetworkAdministratorsRole
    Export:
      Name: !Sub ${AWS::StackName}-NetworkAdministratorsRole
    Condition: ConfigureSamlRoles
  SystemAdministratorsRole:
    Description: The SystemAdministratorsRole Name
    Value: !Ref SystemAdministratorsRole
    Export:
      Name: !Sub ${AWS::StackName}-SystemAdministratorsRole
    Condition: ConfigureSamlRoles
  DatabaseAdministratorsRole:
    Description: The DatabaseAdministratorsRole Name
    Value: !Ref DatabaseAdministratorsRole
    Export:
      Name: !Sub ${AWS::StackName}-DatabaseAdministratorsRole
    Condition: ConfigureSamlRoles
  SecurityAdministratorsRole:
    Description: The SecurityAdministratorsRole Name
    Value: !Ref SecurityAdministratorsRole
    Export:
      Name: !Sub ${AWS::StackName}-SecurityAdministratorsRole
    Condition: ConfigureSamlRoles
  DevelopersRole:
    Description: The DevelopersRole Name
    Value: !Ref DevelopersRole
    Export:
      Name: !Sub ${AWS::StackName}-DevelopersRole
    Condition: ConfigureSamlRoles
  ManagersRole:
    Description: The ManagersRole Name
    Value: !Ref ManagersRole
    Export:
      Name: !Sub ${AWS::StackName}-ManagersRole
    Condition: ConfigureSamlRoles
  UsersRole:
    Description: The UsersRole Name
    Value: !Ref UsersRole
    Export:
      Name: !Sub ${AWS::StackName}-UsersRole
    Condition: ConfigureSamlRoles
  AWSCloudFormationStackSetExecutionRole:
    Description: The AWSCloudFormationStackSetExecutionRole Name
    Value: !Ref AWSCloudFormationStackSetExecutionRole
    Export:
      Name: !Sub ${AWS::StackName}-AWSCloudFormationStackSetExecutionRole
    Condition: ConfigureCrossAccountRoles
