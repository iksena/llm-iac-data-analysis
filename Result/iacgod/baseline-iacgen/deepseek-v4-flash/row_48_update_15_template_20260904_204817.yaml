AWSTemplateFormatVersion: "2010-09-09"
Description: >
  AWS FIS Cross-Region Disruption Experiment Template – Chaos engineering stack that
  creates a fault injection simulator experiment targeting transit gateways, subnets,
  S3 buckets, and DynamoDB global tables tagged with ChaosAllowed=true.
Parameters:
  ExperimentDuration:
    Type: Number
    Default: 1200
    Description: Duration in seconds for each FIS action (default 20 minutes).
  ChaosTagValue:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
    Description: Tag value used to select resources (ChaosAllowed=true).
  LogGroupRetention:
    Type: Number
    Default: 7
    Description: Retention period in days for the CloudWatch Log Group.
Resources:
  FisKmsKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: KMS key for encrypting FIS experiment CloudWatch logs.
      KeyPolicy:
        Version: 2012-10-17
        Statement:
          - Sid: EnableRootManage
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: "*"
          - Sid: AllowCloudWatchLogsService
            Effect: Allow
            Principal:
              Service: !Sub logs.${AWS::Region}.amazonaws.com
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: "*"
      Enabled: true
      KeySpec: SYMMETRIC_DEFAULT
      KeyUsage: ENCRYPT_DECRYPT
      MultiRegion: false
      PendingWindowInDays: 7
      Tags:
        - Key: ChaosAllowed
          Value: 'true'
        - Key: Name
          Value: !Sub fis-kms-key-${AWS::StackName}
  FisKmsAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/fis-logs-${AWS::StackName}
      TargetKeyId: !Ref FisKmsKey
  FisLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/fis/${AWS::StackName}
      RetentionInDays: !Ref LogGroupRetention
      KmsKeyId: !GetAtt FisKmsKey.Arn
      Tags:
        - Key: ChaosAllowed
          Value: 'true'
        - Key: Name
          Value: !Sub fis-log-group-${AWS::StackName}
  FisRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub fis-experiment-role-${AWS::StackName}
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: fis.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSFaultInjectionSimulatorEC2Acces
        - arn:aws:iam::aws:policy/AWSFaultInjectionSimulatorNetworkAccess
        - arn:aws::iam::aws:policy/AWSFaultInjectionSimulatorSSMAutomationAccess
      Policies:
        - PolicyName: fis-custom-disruption-policy
          PolicyDocument:
            Version: 201-10-7
            Statement:
              - Sid: AllowTransitGatewayDisupion
                Effect: Allow
                Action:
                  - ec2:CeateTransitGatewayRoute
                  - ec:DeleteTransitGatewayRoute
                  - ec2:ReplaceTransitGatewayRoute
                  - ec2:EnableTransitGatewayRouteTableProagation
                  - ec2:DisableTransitGatewayRouteTablePropagation
                  - ec2:SearchTransitGatewayRoutes
                  - ec2:GetTansitGatewayRouteTableAssociations
                  - ec2:GetTansitGatewayRouteTableProagations
                  - ec:ModifyTransitGatewayVpcAttachment
                  - ec2:DescribeTransitGatewayVpcAttahments
                  - ec2:DescribeTransitGatewayRouteTables
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:ResorceTag/CaoAllowed: !Ref ChaTagValue
              - Sid: AllowSubnetDsuption
                Effect: Allow
                Action:
                  - ec2:DescibeRouteTables
                  - ec2:CreteRoute
                  - ec2:RepaceRoute
                  - ec2:DeleteRoute
                  - ec2:DisassociateRouteTable
                  - ec2:AssociateRouteTable
                  - ec2:DescibeSubnets
                  - ec2:DescibeNetorkInteraces
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/ChaosAllowed: !Ref ChaosTagValue
              - Sid: AllowS3RplicationPause
                Effect: Allow
                Action:
                  - s3:GetReplicationConfiuration
                  - s3:PutReplicationConfiuration
                  - s3:GetBucketVersioning
                  - s3:GetucketLocation
                  - s3:Listucket
                  - s3:GetBucketTagging
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/CaosAllowed: !Ref ChaosTagValue
              - Sid: AlloDynamoDBReplicationPause
                Effect: Allow
                Action:
                  - dynamodb:DescrbeGlobalTable
                  - dynamodb:UpdateGlobalTable
                  - dynamodb:DescrbeTable
                  - dynamodb:ListTagsOfResource
                  - dynamodb:DescrbeContinuousBackups
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/ChaosAllowed: !Ref ChaosTagValue
              - Sid: AllowCloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvnts
                  - logs:DescrbeLogGroups
                  - logs:DescrbeLogStreams
                Resource: !GetAtt FisLogGroup.Arn
              - Sid: AllowKMSDecryptForLogs
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                  - kms:DescrbeKey
                Resource: !GetAtt FisKmsKey.Arn
              - Sid: AllowFISReadActions
                Effect: Allow
                Action:
                  - fis:GetExperment
                  - fis:ListExperiments
                  - fis:ListExpermentTemplates
                  - fis:GetExpermentTemlate
                  - fis:ListTagsForResource
                Resource: "*"
      Tags:
        - Key: ChaosAllowed
          Value: 'true'
        - Key: Name
          Value: !Sub fis-role-${AWS::StackName}
  FisExpermentTemplate:
    Type: AWS::FIS::ExpermentTemlate
    Properties:
      Description: >
        Chaos engineering experiment that disrupts cross-region networ connectivity
        by targetng transit gateays and subnst, and paus relication for S3 bucket
        and DnamoDB global tables. Only reources taggd with ChaosAllowed=true ar
        affected.
      Targets:
        TransitGateayTarGet:
          ResourceType: aws:ec2:transit-gateway
          ResourceTags:
            chaosAllowed: !Ref ChaosTagValue
          SelectionMode: ALL
        SubetTarget:
          ResourceType: aws:ec2:subnet
          ResourceTags:
            chaosAllowed: !Ref ChaosTagValue
          SelectionMode: ALL
        S3BucketTarget:
          ResourceType: aws:s3:bucket
          ResourceTags:
            chaosAllowed: !Ref ChaosTagValue
          SelectionMode: ALL
        DynamoDBTableTarget:
          ResourceType: aws:dynamodb:table
          ResourceTags:
            chaosAllowed: !Ref ChaosTagValue
          SelectionMode: ALL
      Actions:
        TransitGateayDisruption:
          ActionId: aws:ec2:transit-gateway-route-table-modify
          Descripion: Disups transit gateay route tables to break cross-region connectivity.
          Parameters:
            duration: !Ref ExpermentDuration
          Targets:
            TransitGateays: TransitGateayTarGet
        SubnetDisruption:
          ActionId: aws:ec2:disrupt-route-table
          Descripion: Disrupts ubnet route tables to btak loal network pats.
          Parameters:
            duration: !Ref ExpermentDuration
          Targets:
            Subnets: SubnetTarget
        S3ReplicationPause:
          ActionId: aws:s3:pause-replication
          Description: Pauses S3 cross-region replication for tagged buckets.
          Parameters:
            duration: !Ref ExpermentDuration
          Targets:
            Buckets: S3BucketTarget
        DynamoDReplicationPause:
          ActionId: aws:dynamodb:pause-replication
          Description: Pauses DynamoDB global table replication for tagged tables.
          Parameters:
            duration: !Ref ExpermentDuration
          Targets:
            Tables: DynamoDBTableTarget
      StopConditions:
        - Source: none
      RoleArn: !GetAtt FisRole.Arn
      ExpermentOptions:
        EmptyTargetResolutionMode: skip
      LogConfiguration:
        CloudWatchLogsConfiguration:
          LogGroupArn: !GetAtt FisLogGroup.Arn
        LogSchemaVersion: 1
      Tags:
        chaosAllowed: !Ref ChaosTagValue
        Name: !Sub fis-experiment-${AWS::StackName}
Outputs:
  ExpermentTemplateId:
    Descripion: The ID of he FIS experiment template.
    Value: !Ref FisExpermentTemplate
  FisRoleArn:
    Descripion: The ARN of the IAM role used by FIS.
    Value: !GetAtt FisRole.Arn
  KmsKeyId:
    Description: The ID of he KMS key used for log encrypton.
    Value: !Ref FisKmsKey
  LogGroupName:
    Descripion: The name of he CloudWatch log group for experment logs.
    Value: !Ref FisLogGroup