AWSTemplateFormatVersion: "2010-09-09"
Description: "CloudFormation template to create five Lambda functions for contract testing AWSSamples::LambdaFunctionInvoker::Hook, with independent UseCallbacks parameters and pre-created CloudWatch log groups."
Parameters:
  UseCallbacks1:
    Type: String
    AllowedValues:
      - "no"
      - "yes"
    Default: "no"
    Description: "Use callbacks for function 1."
  UseCallbacks2:
    Type: String
    AllowedValues:
      - "no"
      - "yes"
    Default: "no"
    Description: "Use callbacks for function 2."
  UseCallbacks3:
    Type: String
    AllowedValues:
      - "no"
      - "yes"
    Default: "no"
    Description: "Use callbacks for function 3."
  UseCallbacks4:
    Type: String
    AllowedValues:
      - "no"
      - "yes"
    Default: "no"
    Description: "Use callbacks for function 4."
  UseCallbacks5:
    Type: String
    AllowedValues:
      - "no"
      - "yes"
    Default: "no"
    Description: "Use callbacks for function 5."
  LogRetentionInDays:
    Type: Number
    AllowedValues:
      - 1
      - 3
      - 5
      - 7
      - 14
      - 30
      - 60
      - 90
      - 120
      - 150
      - 180
      - 365
      - 400
      - 545
      - 731
      - 1827
      - 3653
    Default: 7
    Description: "Retention period in days for CloudWatch log groups."
Mappings:
  FunctionNameMap:
    "1":
      Name: "LambdaFunctionInvokerHookTest1"
    "2":
      Name: "LambdaFunctionInvokerHookTest2"
    "3":
      Name: "LambdaFunctionInvokerHookTest3"
    "4":
      Name: "LambdaFunctionInvokerHookTest4"
    "5":
      Name: "LambdaFunctionInvokerHookTest5"
Resources:
  LambdaExecutionRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service: "lambda.amazonaws.com"
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Description: "Shared IAM role for Lambda functions with basic execution permissions."
  LogGroup1:
    Type: "AWS::Logs::LogGroup"
    Properties:
      LogGroupName:
        Fn::Sub: "/aws/lambda/${FunctionName1}"
      RetentionInDays: !Ref LogRetentionInDays
  FunctionName1:
    Type: "AWS::SSM::Parameter"
    Properties:
      Type: "String"
      Value: !FindInMap [FunctionNameMap, "1", Name]
      Name: "/lambda/functionname1"
  LambdaFunction1:
    Type: "AWS::Lambda::Function"
    DependsOn:
      - LambdaExecutionRole
      - LogGroup1
    Properties:
      FunctionName: !FindInMap [FunctionNameMap, "1", Name]
      Handler: "index.handler"
      Runtime: "python3.9"
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ZipFile: |
          import json
          import os
          import logging
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          def handler(event, context):
              use_callbacks = os.environ.get('USE_CALLBACKS', 'no')
              logger.info(f"Received event: {json.dumps(event)}")
              logger.info(f"USE_CALLBACKS: {use_callbacks}")
              return {
                  'statusCode': 200,
                  'body': json.dumps({'message': 'Success', 'use_callbacks': use_callbacks})
              }
      Environment:
        Variables:
          USE_CALLBACKS: !Ref UseCallbacks1
      MemorySize: 128
      Timeout: 30
  LogGroup2:
    Type: "AWS::Logs::LogGroup"
    Properties:
      LogGroupName:
        Fn::Sub: "/aws/lambda/${FunctionName2}"
      RetentionInDays: !Ref LogRetentionInDays
  FunctionName2:
    Type: "AWS::SSM::Parameter"
    Properties:
      Type: "String"
      Value: !FindInMap [FunctionNameMap, "2", Name]
      Name: "/lambda/functionname2"
  LambdaFunction2:
