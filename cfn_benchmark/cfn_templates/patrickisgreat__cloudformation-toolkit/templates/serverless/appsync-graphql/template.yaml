AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  AppSync GraphQL API with a schema, a Lambda data source, direct-Lambda
  resolvers, Cognito or API-key authentication, field-level logging and X-Ray.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Naming
        Parameters:
          - NamePrefix
          - Environment
          - ApiSuffix
      - Label:
          default: Schema
        Parameters:
          - SchemaS3Location
          - QueryFieldName
          - MutationFieldName
      - Label:
          default: Resolver data source
        Parameters:
          - LambdaFunctionArn
      - Label:
          default: Authentication
        Parameters:
          - AuthenticationType
          - UserPoolId
          - UserPoolRegion
          - OidcIssuer
      - Label:
          default: Observability
        Parameters:
          - FieldLogLevel
          - LogRetentionDays

Parameters:
  NamePrefix:
    Type: String
    Description: Prefix for the API name.
    AllowedPattern: "^[a-z][a-z0-9-]{1,30}[a-z0-9]$"
    ConstraintDescription: 3-32 lowercase characters, digits and hyphens.

  Environment:
    Type: String
    Description: Environment this API serves.
    Default: dev
    AllowedValues: [dev, staging, prod]

  ApiSuffix:
    Type: String
    Description: Distinguishes APIs under one prefix.
    Default: graphql
    AllowedPattern: "^[a-z0-9][a-z0-9-]{0,30}$"

  SchemaS3Location:
    Type: String
    Description: >-
      s3:// URI of the .graphql schema. The schema is loaded from S3 rather than
      taken as a parameter because CloudFormation parameters cap at 4096
      characters, which a real schema passes almost immediately. Upload it as
      part of your build and pass the versioned key.

  QueryFieldName:
    Type: String
    Description: >-
      Query field wired to the Lambda data source, e.g. "getOrder". It must exist
      in the schema; AppSync accepts a resolver on a field that does not exist
      and it simply never fires.
    Default: ""

  MutationFieldName:
    Type: String
    Description: Mutation field wired to the Lambda data source, e.g. "createOrder".
    Default: ""

  LambdaFunctionArn:
    Type: String
    Description: >-
      Lambda function backing the resolvers. Direct Lambda resolvers are used, so
      the function receives the raw AppSync event and returns the field value -
      no VTL mapping templates to maintain.
    Default: ""

  AuthenticationType:
    Type: String
    Description: >-
      API_KEY is for development only - the key is a bearer token with no user
      identity behind it. AMAZON_COGNITO_USER_POOLS gives you per-user identity
      in the resolver context, AWS_IAM suits service-to-service, OPENID_CONNECT
      an external IdP.
    Default: AMAZON_COGNITO_USER_POOLS
    AllowedValues: [API_KEY, AMAZON_COGNITO_USER_POOLS, AWS_IAM, OPENID_CONNECT]

  UserPoolId:
    Type: String
    Description: Cognito user pool ID, when AuthenticationType is AMAZON_COGNITO_USER_POOLS.
    Default: ""

  UserPoolRegion:
    Type: String
    Description: Region of the user pool. Defaults to this stack's region.
    Default: ""

  OidcIssuer:
    Type: String
    Description: OIDC issuer URL, when AuthenticationType is OPENID_CONNECT.
    Default: ""

  FieldLogLevel:
    Type: String
    Description: >-
      ERROR logs failing resolvers. ALL logs every request and response, which
      includes the field values - useful while developing a schema, expensive
      and PII-laden in production.
    Default: ERROR
    AllowedValues: [NONE, ERROR, INFO, DEBUG, ALL]

  LogRetentionDays:
    Type: Number
    Description: Retention for the AppSync log group.
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1827, 3653]

Conditions:
  UsesCognito: !Equals [!Ref AuthenticationType, "AMAZON_COGNITO_USER_POOLS"]
  UsesOidc: !Equals [!Ref AuthenticationType, "OPENID_CONNECT"]
  UsesApiKey: !Equals [!Ref AuthenticationType, "API_KEY"]
  HasCustomUserPoolRegion: !Not [!Equals [!Ref UserPoolRegion, ""]]
  HasDataSource: !Not [!Equals [!Ref LambdaFunctionArn, ""]]
  HasQueryResolver: !And [!Condition HasDataSource, !Not [!Equals [!Ref QueryFieldName, ""]]]
  HasMutationResolver: !And [!Condition HasDataSource, !Not [!Equals [!Ref MutationFieldName, ""]]]

Resources:
  LoggingRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: appsync.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSAppSyncPushToCloudWatchLogs"

  DataSourceRole:
    Type: AWS::IAM::Role
    Condition: HasDataSource
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: appsync.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: invoke-resolver-lambda
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Ref LambdaFunctionArn

  Api:
    Type: AWS::AppSync::GraphQLApi
    Properties:
      Name: !Sub "${NamePrefix}-${Environment}-${ApiSuffix}"
      AuthenticationType: !Ref AuthenticationType
      XrayEnabled: true
      UserPoolConfig: !If
        - UsesCognito
        - UserPoolId: !Ref UserPoolId
          AwsRegion: !If [HasCustomUserPoolRegion, !Ref UserPoolRegion, !Ref "AWS::Region"]
          # A request with a valid token for a field the schema does not
          # authorise is denied rather than passed through unauthenticated.
          DefaultAction: DENY
        - !Ref AWS::NoValue
      OpenIDConnectConfig: !If
        - UsesOidc
        - Issuer: !Ref OidcIssuer
        - !Ref AWS::NoValue
      LogConfig:
        CloudWatchLogsRoleArn: !GetAtt LoggingRole.Arn
        FieldLogLevel: !Ref FieldLogLevel
        ExcludeVerboseContent: true

  # AppSync writes to /aws/appsync/apis/<apiId> and nowhere else, so the group
  # can only be named once the API exists. Declaring it here (rather than letting
  # AppSync create it implicitly with infinite retention) is what bounds the cost
  # of FieldLogLevel: ALL. There is no circular dependency — the group depends on
  # the API, not the reverse.
  LogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/appsync/apis/${Api.ApiId}"
      RetentionInDays: !Ref LogRetentionDays

  Schema:
    Type: AWS::AppSync::GraphQLSchema
    Properties:
      ApiId: !GetAtt Api.ApiId
      DefinitionS3Location: !Ref SchemaS3Location

  ApiKey:
    Type: AWS::AppSync::ApiKey
    Condition: UsesApiKey
    Properties:
      ApiId: !GetAtt Api.ApiId
      Description: !Sub "${NamePrefix} ${ApiSuffix} development key"
      # `Expires` takes an absolute epoch second, and CloudFormation has no way
      # to compute "now + N days" — there is no date function. Exposing a
      # relative parameter would mean silently baking in the date of the first
      # deploy, so the AppSync default applies and rotation is an out-of-band
      # operation. See the README; this is one more reason API_KEY is dev-only.

  DataSource:
    Type: AWS::AppSync::DataSource
    Condition: HasDataSource
    Properties:
      ApiId: !GetAtt Api.ApiId
      Name: resolver_lambda
      Type: AWS_LAMBDA
      ServiceRoleArn: !GetAtt DataSourceRole.Arn
      LambdaConfig:
        LambdaFunctionArn: !Ref LambdaFunctionArn

  QueryResolver:
    Type: AWS::AppSync::Resolver
    Condition: HasQueryResolver
    # A resolver attached before the schema exists fails with "No field named X".
    DependsOn: Schema
    Properties:
      ApiId: !GetAtt Api.ApiId
      TypeName: Query
      FieldName: !Ref QueryFieldName
      DataSourceName: !GetAtt DataSource.Name
      # Direct Lambda resolution: the function receives the raw AppSync event and
      # returns the field value, with no VTL mapping templates to maintain.
      Kind: UNIT

  MutationResolver:
    Type: AWS::AppSync::Resolver
    Condition: HasMutationResolver
    DependsOn: Schema
    Properties:
      ApiId: !GetAtt Api.ApiId
      TypeName: Mutation
      FieldName: !Ref MutationFieldName
      DataSourceName: !GetAtt DataSource.Name
      Kind: UNIT

Outputs:
  ApiId:
    Description: AppSync API ID.
    Value: !GetAtt Api.ApiId

  GraphQlUrl:
    Description: GraphQL endpoint URL for queries and mutations.
    Value: !GetAtt Api.GraphQLUrl

  RealtimeUrl:
    Description: WebSocket endpoint for subscriptions.
    Value: !GetAtt Api.RealtimeUrl

  ApiKeyValue:
    Description: >-
      Generated API key, when AuthenticationType is API_KEY. Development only -
      it is a bearer token with no user identity behind it.
    Condition: UsesApiKey
    Value: !GetAtt ApiKey.ApiKey

  LogGroupName:
    Description: Log group for resolver logs.
    Value: !Ref LogGroup