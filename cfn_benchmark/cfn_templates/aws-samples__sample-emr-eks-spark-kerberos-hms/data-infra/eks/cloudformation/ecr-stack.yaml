AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  AWS CloudFormation Amazon ECR Stack for Hive Metastore Infrastructure.
  COST WARNING: Amazon ECR incurs storage charges. Delete this stack to stop charges.

Parameters:
  ProjectName:
    Description: An environment name that is prefixed to resource names
    Type: String
    Default: KerberosEMRonEKS

  ECRRepoName:
    Description: Name of the Amazon ECR repository for Hive Metastore
    Type: String
    Default: "hive-metastore"

  CommonKMSKeyArn:
    Description: ARN of the KMS key used for encryption
    Type: String

Resources:
  HiveMetastoreRepository:
    Type: AWS::ECR::Repository
    #checkov:skip=CKV_AWS_51: "Image tag mutability is required for educational purposes in this demo"
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: "Explicit name is required for ECR repository identification and integration with other systems"
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      RepositoryName: !Ref ECRRepoName
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: MUTABLE
      EncryptionConfiguration:
        EncryptionType: KMS
        KmsKey: !Ref CommonKMSKeyArn
      Tags:
        - Key: ProjectName
          Value: !Ref ProjectName

Outputs:
  HiveMetastoreRepositoryName:
    Description: Name of the Hive Metastore ECR repository
    Value: !Ref HiveMetastoreRepository

  HiveMetastoreRepositoryUri:
    Description: URI of the Hive Metastore ECR repository
    Value: !GetAtt HiveMetastoreRepository.RepositoryUri