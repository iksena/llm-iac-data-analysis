Transform: AWS::LanguageExtensions
Parameters:
  BedrockModelId:
    Type: String
    Description: The ID of the Foundation Model to use for the Agent
    Default: us.anthropic.claude-3-5-sonnet-20241022-v2:0
  RedshiftDatabaseName:
    Type: String
    Default: dev
  RedshiftUserName:
    Type: String
    Default: admin
  RedshiftPassword:
    Type: String
    NoEcho: true
    Description: STORE SECURELY - The password for the Redshift master user. Must
      be at least 8 characters long and contain at least one uppercase letter, one
      lowercase letter, and one number.
    MinLength: 8
    MaxLength: 64
    AllowedPattern: ^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)[a-zA-Z\d!@#$%^&*()_+\-=\[\]{};:'",.<>?]{8,64}$
    ConstraintDescription: Password must be between 8 and 64 characters, and contain
      at least one uppercase letter, one lowercase letter, and one number.
  GithubLink:
    Type: String
    Description: The link to the agent build cloudformation stack
    Default: https://github.com/PTP-PeakPlus/aws-hcls-agents-app.git
  GitBranch:
    Type: String
    Description: The github branch to clone
    Default: main
  ReactAppAllowedCidr:
    Type: String
    Description: Allowed CIDR block (X.X.X.X/X) for React App UI access
    AllowedPattern: ^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/([0-9]|[1-2][0-9]|3[0-2]))$
    ConstraintDescription: Must be a valid CIDR block in format x.x.x.x/x
  TavilyApiKey:
    Type: String
    NoEcho: true
    Description: Provide TavilyApiKey API Key to utilize /web_search path
    Default: ''
  USPTOApiKey:
    Type: String
    NoEcho: true
    Description: Provide USPTO API Key to utilize /search path
    Default: ''
  DeployApplication:
    Type: String
    Description: Select true to deploy the react application and agents. Select false
      to only build the agents.
    Default: 'true'
    AllowedValues:
    - 'true'
    - 'false'
  ExistingVpcId:
    Type: String
    Description: The VPC ID of an existing VPC in your AWS account and current region
    Default: ''
  ExistingPrivateSubnets:
    Type: CommaDelimitedList
    Description: A list of 2 private subnet IDs in your AWS account and AWS region
      from two different AZs are required.
    Default: ''
Conditions:
  HasVpcId:
    Fn::Not:
    - Fn::Equals:
      - Ref: ExistingVpcId
      - ''
  HasTwoPrivateSubnets:
    Fn::Equals:
    - Fn::Length:
        Ref: ExistingPrivateSubnets
    - 2
  CreateNetworking:
    Fn::Not:
    - Fn::And:
      - Condition: HasVpcId
      - Condition: HasTwoPrivateSubnets
  CreateWebSearchAgent:
    Fn::Not:
    - Fn::Equals:
      - Ref: TavilyApiKey
      - ''
  CreateUSPTOSearchAgent:
    Fn::Not:
    - Fn::Equals:
      - Ref: USPTOApiKey
      - ''
  CreateCompetitiveIntelAgent:
    Fn::Not:
    - Fn::Or:
      - Fn::Equals:
        - Ref: TavilyApiKey
        - ''
      - Fn::Equals:
        - Ref: USPTOApiKey
        - ''
  CreateReactApp:
    Fn::Equals:
    - Ref: DeployApplication
    - 'true'
Resources:
  Network:
    Type: AWS::CloudFormation::Stack
    Condition: CreateNetworking
    Properties:
      TemplateURL: https://s3.us-east-1.amazonaws.com/hcls-agents-templates/b9e7dcabff4168ea18d6775cb14d29d4.template
      TimeoutInMinutes: 10
      Tags:
      - Key: Project
        Value: hcls-agents-toolkit
  S3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        Fn::Sub: ${AWS::StackName}-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: AES256
      Tags:
      - Key: Project
        Value: hcls-agents-toolkit
  CodeRepo:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://s3.us-east-1.amazonaws.com/hcls-agents-templates/4ab0b7da021fb7c94b7806574f6c7714.template
      Parameters:
        GitHubUrl:
          Ref: GithubLink
        BranchName:
          Ref: GitBranch
        S3Bucket:
          Ref: S3Bucket
        S3KeyPrefix: repo
      TimeoutInMinutes: 5
      Tags:
      - Key: Project
        Value: hcls-agents-toolkit
  CodeBuild:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://s3.us-east-1.amazonaws.com/hcls-agents-templates/446b4d89eec12f7c60fbc27720c754a1.template
      Parameters:
        GithubLink:
          Ref: GithubLink
        GitBranch:
          Ref: GitBranch
        S3Bucket:
          Ref: S3Bucket
      TimeoutInMinutes: 10
      Tags:
      - Key: Project
        Value: hcls-agents-toolkit
  ReactAppEcsBuildNestedStack:
    Type: AWS::CloudFormation::Stack
    Condition: CreateReactApp
    Properties:
      TemplateURL: https://s3.us-east-1.amazonaws.com/hcls-agents-templates/93a20f47eebd0ff1956fd2b2ff1b6c72.template
      Parameters:
        AllowedCidr:
          Ref: ReactAppAllowedCidr
        VPCId:
          Fn::If:
          - CreateNetworking
          - Fn::GetAtt:
            - Network
            - Outputs.VPC
          - Ref: ExistingVpcId
        PrivateSubnet1:
          Fn::If:
          - CreateNetworking
          - Fn::GetAtt:
            - Network
            - Outputs.PrivateSubnet1
          - Fn::Select:
            - 0
            - Ref: ExistingPrivateSubnets
        PrivateSubnet2:
          Fn::If:
          - CreateNetworking
          - Fn::GetAtt:
            - Network
            - Outputs.PrivateSubnet2
          - Fn::Select:
            - 1
            - Ref: ExistingPrivateSubnets
        S3Bucket:
          Ref: S3Bucket
        S3CodeKey:
          Fn::GetAtt:
          - CodeRepo
          - Outputs.S3Key
      TimeoutInMinutes: 35
      Tags:
      - Key: Project
        Value: hcls-agents-toolkit
  AgentRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - bedrock.amazonaws.com
          Action:
          - sts:AssumeRole
      Policies:
      - PolicyName: BedrockInvokeModel
        PolicyDocument:
          Version: 2012-10-17
          Statement:
          - Effect: Allow
            Action:
            - bedrock:*
            Resource:
            - Fn::Sub: arn:${AWS::Partition}:bedrock:*::foundation-model/*
            - Fn::Sub: arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*
            - Fn::Sub: arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:agent-alias/*
            - Fn::Sub: arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:agent/*
            - Fn::Sub: arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*
            - Fn::Sub: arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:application-inference-profile/*
            - Fn::Sub: arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:guardrail/*
      Tags:
      - Key: Project
        Value: hcls-agents-toolkit
  BiomarkerDiscoverySupervisorAgent:
    Type: AWS::CloudFormation::Stack
    DependsOn:
    - CodeBuild
    Properties:
      TemplateURL: https://s3.us-east-1.amazonaws.com/hcls-agents-templates/27aecce16652469872b2db8c3d7ea6e5.template
      Parameters:
        BedrockModelId:
          Ref: BedrockModelId
        RedshiftDatabaseName:
          Ref: RedshiftDatabaseName
        RedshiftUserName:
          Ref: RedshiftUserName
        RedshiftPassword:
          Ref: RedshiftPassword
        MultiAgentDevMode: 'false'
        EnvironmentName: env1
        GitRepoURL:
          Ref: GithubLink
        GitBranch:
          Ref: GitBranch
        SubAgentS3Bucket:
          Ref: S3Bucket
        VPC:
          Fn::If:
          - CreateNetworking
          - Fn::GetAtt:
            - Network
            - Outputs.VPC
          - Ref: ExistingVpcId
        PrivateSubnet1:
          Fn::If:
          - CreateNetworking
          - Fn::GetAtt:
            - Network
            - Outputs.PrivateSubnet1
          - Fn::Select:
            - 0
            - Ref: ExistingPrivateSubnets
        PrivateSubnet2:
          Fn::If:
          - CreateNetworking
          - Fn::GetAtt:
            - Network
            - Outputs.PrivateSubnet2
          - Fn::Select:
            - 1
            - Ref: ExistingPrivateSubnets
        AgentRole:
          Fn::GetAtt:
          - AgentRole
          - Arn
      TimeoutInMinutes: 30
      Tags:
      - Key: Project
        Value: hcls-agents-toolkit
  ClinicalStudySearchAgent:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://s3.us-east-1.amazonaws.com/hcls-agents-templates/ea90e8945425d7cbebe16b61d95b9eeb.template
      Parameters:
        AgentIAMRoleArn:
          Fn::GetAtt:
          - AgentRole
          - Arn
        ChartImageBucketName:
          Ref: S3Bucket
      TimeoutInMinutes: 10
      Tags:
      - Key: Project
        Value: hcls-agents-toolkit
  ClinicalTrialProtocolGeneratorAgent:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://s3.us-east-1.amazonaws.com/hcls-agents-templates/93e71d24869b5d2197c422aa62ffa262.template
      Parameters:
        AgentIAMRoleArn:
          Fn::GetAtt:
          - AgentRole
          - Arn
      TimeoutInMinutes: 10
      Tags:
      - Key: Project
        Value: hcls-agents-toolkit
  ClinicalTrialProtocolSupervisorAgent:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://s3.us-east-1.amazonaws.com/hcls-agents-templates/22ba18b4dd66c4bd88c5008245de19d5.template
      Parameters:
        BedrockModelId:
          Ref: BedrockModelId
        AgentIAMRoleArn:
          Fn::GetAtt:
          - AgentRole
          - Arn
        ClinicalStudySearchAgentAliasArn:
          Fn::GetAtt:
          - ClinicalStudySearchAgent
          - Outputs.AgentAliasArn
        ClinicalTrialProtocolGeneratorAgentAliasArn:
          Fn::GetAtt:
          - ClinicalTrialProtocolGeneratorAgent
          - Outputs.AgentAliasArn
      TimeoutInMinutes: 10
      Tags:
      - Key: Project
        Value: hcls-agents-toolkit
  WebSearchAgent:
    Type: AWS::CloudFormation::Stack
    Condition: CreateWebSearchAgent
    Properties:
      TemplateURL: https://s3.us-east-1.amazonaws.com/hcls-agents-templates/166ca7233908c986c3c4ed15847ead76.template
      Parameters:
        AgentIAMRoleArn:
          Fn::GetAtt:
          - AgentRole
          - Arn
        TavilyApiKey:
          Ref: TavilyApiKey
      TimeoutInMinutes: 35
      Tags:
      - Key: Project
        Value: hcls-agents-toolkit
  SEC10kAgent:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://s3.us-east-1.amazonaws.com/hcls-agents-templates/131bc5445289a90326c51ad51df928f4.template
      Parameters:
        AgentIAMRoleArn:
          Fn::GetAtt:
          - AgentRole
          - Arn
        S3CodeBucket:
          Ref: S3Bucket
        S3CodeKey:
          Fn::GetAtt:
          - CodeRepo
          - Outputs.S3Key
      TimeoutInMinutes: 35
      Tags:
      - Key: Project
        Value: hcls-agents-toolkit
  USPTOSearchAgent:
    Type: AWS::CloudFormation::Stack
    Condition: CreateUSPTOSearchAgent
    Properties:
      TemplateURL: https://s3.us-east-1.amazonaws.com/hcls-agents-templates/1a1a18173c7ffb137fc6a61150f03c72.template
      Parameters:
        AgentIAMRoleArn:
          Fn::GetAtt:
          - AgentRole
          - Arn
        USPTOApiKey:
          Ref: USPTOApiKey
      TimeoutInMinutes: 35
      Tags:
      - Key: Project
        Value: hcls-agents-toolkit
  CompetitiveIntelligenceSupervisorAgent:
    Type: AWS::CloudFormation::Stack
    Condition: CreateCompetitiveIntelAgent
    Properties:
      TemplateURL: https://s3.us-east-1.amazonaws.com/hcls-agents-templates/6338b1746aaaf10974dc6ba946acd83b.template
      Parameters:
        BedrockModelId:
          Ref: BedrockModelId
        AgentIAMRoleArn:
          Fn::GetAtt:
          - AgentRole
          - Arn
        WebSearchAgentAliasArn:
          Fn::GetAtt:
          - WebSearchAgent
          - Outputs.AgentAliasArn
        SEC10kAgentAliasArn:
          Fn::GetAtt:
          - SEC10kAgent
          - Outputs.AgentAliasArn
        USPTOSearchAgentAliasArn:
          Fn::GetAtt:
          - USPTOSearchAgent
          - Outputs.AgentAliasArn
      TimeoutInMinutes: 10
      Tags:
      - Key: Project
        Value: hcls-agents-toolkit
  WileyOnlineSearchAgent:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://s3.us-east-1.amazonaws.com/hcls-agents-templates/d4c1e8eab8db665f958d7d0b15341f6e.template
      Parameters:
        AgentIAMRoleArn:
          Fn::GetAtt:
          - AgentRole
          - Arn
      TimeoutInMinutes: 10
      Tags:
      - Key: Project
        Value: hcls-agents-toolkit
  UniProtProteinSearchAgent:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://s3.us-east-1.amazonaws.com/hcls-agents-templates/cf05c6fe340179f838b1f0345aabfb69.template
      Parameters:
        BedrockModelId:
          Ref: BedrockModelId
        AgentIAMRoleArn:
          Fn::GetAtt:
          - AgentRole
          - Arn
      TimeoutInMinutes: 10
      Tags:
      - Key: Project
        Value: hcls-agents-toolkit
  InvivoStudySchedulerAgent:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://s3.us-east-1.amazonaws.com/hcls-agents-templates/168a893253a20800334125ed65ef6e6d.template
      Parameters:
        AgentIAMRoleArn:
          Fn::GetAtt:
          - AgentRole
          - Arn
        S3CodeBucket:
          Ref: S3Bucket
        S3CodeKey:
          Fn::GetAtt:
          - CodeRepo
          - Outputs.S3Key
      TimeoutInMinutes: 35
      Tags:
      - Key: Project
        Value: hcls-agents-toolkit
  SafetySignalDetectionAgent:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://s3.us-east-1.amazonaws.com/hcls-agents-templates/656e98da29753055f3521fc63506a605.template
      Parameters:
        BedrockModelId:
          Ref: BedrockModelId
        AgentIAMRoleArn:
          Fn::GetAtt:
          - AgentRole
          - Arn
      TimeoutInMinutes: 10
      Tags:
      - Key: Project
        Value: hcls-agents-toolkit
Outputs:
  ReactAppExternalURL:
    Condition: CreateReactApp
    Value:
      Fn::GetAtt:
      - ReactAppEcsBuildNestedStack
      - Outputs.ExternalUrl
    Description: ALB DNS for the React App
  AgentRole:
    Value:
      Fn::GetAtt:
      - AgentRole
      - Arn
    Description: Amazon Bedrock Service Role ARN