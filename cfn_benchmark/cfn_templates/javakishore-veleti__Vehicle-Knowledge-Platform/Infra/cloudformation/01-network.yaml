AWSTemplateFormatVersion: "2010-09-09"
Description: >
  VKP AWS_001 Network. Cost-optimized VPC for the VKP EKS cluster: 2 public subnets across 2 AZs,
  an Internet Gateway, NO NAT gateway (worker nodes run in public subnets to avoid ~$32/mo/NAT).
  If VpcId is provided the stack REUSES that VPC (only creating EKS-tagged subnets in it); otherwise
  it creates a new VPC. Re-running the stack is idempotent, so a created VPC is reused on later runs.

Parameters:
  VpcId:
    Type: String
    Default: ""
    Description: "Optional existing VPC to reuse. Empty = create a new VPC. If provided, the VPC must already have internet egress (an IGW on its main route table) and room for the subnet CIDRs below."
  VpcCidr:
    Type: String
    Default: "10.42.0.0/16"
    Description: "CIDR for the new VPC (ignored when VpcId is provided)."
  PublicSubnet1Cidr:
    Type: String
    Default: "10.42.0.0/20"
  PublicSubnet2Cidr:
    Type: String
    Default: "10.42.16.0/20"
  ClusterName:
    Type: String
    Default: "vkp"
    Description: "EKS cluster name (used to tag subnets for load-balancer discovery)."

Conditions:
  CreateVpc: !Equals [!Ref VpcId, ""]

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Condition: CreateVpc
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: vkp-vpc }
        - { Key: project, Value: vehicle-knowledge-platform }

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Condition: CreateVpc
    Properties:
      Tags:
        - { Key: Name, Value: vkp-igw }

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Condition: CreateVpc
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: CreateVpc
    Properties:
      VpcId: !Ref VPC
      Tags:
        - { Key: Name, Value: vkp-public-rt }

  DefaultPublicRoute:
    Type: AWS::EC2::Route
    Condition: CreateVpc
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: "0.0.0.0/0"
      GatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !If [CreateVpc, !Ref VPC, !Ref VpcId]
      CidrBlock: !Ref PublicSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: vkp-public-1 }
        - { Key: !Sub "kubernetes.io/cluster/${ClusterName}", Value: shared }
        - { Key: "kubernetes.io/role/elb", Value: "1" }

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !If [CreateVpc, !Ref VPC, !Ref VpcId]
      CidrBlock: !Ref PublicSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: vkp-public-2 }
        - { Key: !Sub "kubernetes.io/cluster/${ClusterName}", Value: shared }
        - { Key: "kubernetes.io/role/elb", Value: "1" }

  Subnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateVpc
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  Subnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateVpc
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

Outputs:
  VpcId:
    Description: "Effective VPC id (created or reused)."
    Value: !If [CreateVpc, !Ref VPC, !Ref VpcId]
  PublicSubnetIds:
    Description: "Comma-separated public subnet ids for the EKS stack."
    Value: !Join [",", [!Ref PublicSubnet1, !Ref PublicSubnet2]]
  PublicSubnet1Id:
    Value: !Ref PublicSubnet1
  PublicSubnet2Id:
    Value: !Ref PublicSubnet2