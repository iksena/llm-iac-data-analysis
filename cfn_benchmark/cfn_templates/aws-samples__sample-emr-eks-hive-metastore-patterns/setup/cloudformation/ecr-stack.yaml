AWSTemplateFormatVersion: "2010-09-09"
Description: "ECR Stack for Hive Metastore Infrastructure"

Parameters:
  ProjectName:
    Description: An environment name that is prefixed to resource names
    Type: String
    Default: HiveMetastoreDesignPatterns

  ECRRepoName:
    Description: Name of the ECR repository for Hive Metastore
    Type: String
    Default: "hive-metastore"

  CommonKMSKeyArn:
    Description: ARN of the KMS key used for encryption
    Type: String

Resources:
  HiveMetastoreRepository:
    Type: AWS::ECR::Repository
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: "Explicit name is required for ECR repository identification and integration with other systems"
      checkov:
        skip:
          - id: CKV_AWS_51
            comment: "Image tag mutability is required for the educational purposes for the blog post"
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      RepositoryName: !Ref ECRRepoName
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: MUTABLE
      EncryptionConfiguration:
        EncryptionType: KMS
        KmsKey: !Ref CommonKMSKeyArn
      Tags:
        - Key: ProjectName
          Value: !Ref ProjectName

Outputs:
  HiveMetastoreRepositoryName:
    Description: Name of the Hive Metastore ECR repository
    Value: !Ref HiveMetastoreRepository

  HiveMetastoreRepositoryUri:
    Description: URI of the Hive Metastore ECR repository
    Value: !GetAtt HiveMetastoreRepository.RepositoryUri