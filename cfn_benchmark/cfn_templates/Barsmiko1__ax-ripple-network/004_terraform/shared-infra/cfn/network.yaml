AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  AX Ripple Network — Network Stack
  VPC, Subnets, Internet Gateway, NAT Gateway, Route Tables, Security Groups

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment

  VpcCidr:
    Type: String
    Default: "10.0.0.0/16"
    Description: CIDR block for the VPC

Resources:
  # ===========================================================================
  # VPC
  # ===========================================================================
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "ax-ripple-${Environment}-vpc"
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: ax-ripple-network

  # ===========================================================================
  # Internet Gateway
  # ===========================================================================
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "ax-ripple-${Environment}-igw"

  IGWAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # ===========================================================================
  # Public Subnets
  # ===========================================================================
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: "10.0.1.0/24"
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "ax-ripple-${Environment}-public-1"
        - Key: Tier
          Value: public

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: "10.0.2.0/24"
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "ax-ripple-${Environment}-public-2"
        - Key: Tier
          Value: public

  # ===========================================================================
  # Private Subnets
  # ===========================================================================
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: "10.0.10.0/24"
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub "ax-ripple-${Environment}-private-1"
        - Key: Tier
          Value: private

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: "10.0.11.0/24"
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub "ax-ripple-${Environment}-private-2"
        - Key: Tier
          Value: private

  # ===========================================================================
  # NAT Gateway
  # ===========================================================================
  NATElasticIP:
    Type: AWS::EC2::EIP
    DependsOn: IGWAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "ax-ripple-${Environment}-nat-eip"

  NATGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NATElasticIP.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub "ax-ripple-${Environment}-nat"

  # ===========================================================================
  # Route Tables
  # ===========================================================================
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "ax-ripple-${Environment}-public-rt"

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: IGWAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: "0.0.0.0/0"
      GatewayId: !Ref InternetGateway

  PublicSubnet1RTAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RTAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "ax-ripple-${Environment}-private-rt"

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: "0.0.0.0/0"
      NatGatewayId: !Ref NATGateway

  PrivateSubnet1RTAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RTAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # ===========================================================================
  # Security Groups
  # ===========================================================================
  RippledPeerSG:
    Type: AWS::EC2::SecurityGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      GroupDescription: Rippled peer-to-peer traffic (port 51235)
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 51235
          ToPort: 51235
          CidrIp: !Ref VpcCidr
          Description: Rippled peer protocol (internal)
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: "0.0.0.0/0"
      Tags:
        - Key: Name
          Value: !Sub "ax-ripple-${Environment}-peer-sg"

  RippledAPISG:
    Type: AWS::EC2::SecurityGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      GroupDescription: Rippled API traffic (HTTP 51234, WS 6006)
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 51234
          ToPort: 51234
          CidrIp: !Ref VpcCidr
          Description: Rippled JSON-RPC (internal via HAProxy)
        - IpProtocol: tcp
          FromPort: 6006
          ToPort: 6006
          CidrIp: !Ref VpcCidr
          Description: Rippled WebSocket (internal via HAProxy)
        - IpProtocol: tcp
          FromPort: 5005
          ToPort: 5005
          CidrIp: !Ref VpcCidr
          Description: Rippled admin JSON-RPC (internal only)
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: "0.0.0.0/0"
      Tags:
        - Key: Name
          Value: !Sub "ax-ripple-${Environment}-api-sg"

  HAProxySG:
    Type: AWS::EC2::SecurityGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      GroupDescription: HAProxy public-facing traffic
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: "0.0.0.0/0"
          Description: HTTP (JSON-RPC proxy)
        - IpProtocol: tcp
          FromPort: 6006
          ToPort: 6006
          CidrIp: "0.0.0.0/0"
          Description: WebSocket (WS proxy)
        - IpProtocol: tcp
          FromPort: 8404
          ToPort: 8404
          CidrIp: "0.0.0.0/0"
          Description: HAProxy stats dashboard
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          CidrIp: "0.0.0.0/0"
          Description: Grafana UI (proxied via HAProxy)
        - IpProtocol: tcp
          FromPort: 9090
          ToPort: 9090
          CidrIp: "0.0.0.0/0"
          Description: Prometheus UI (proxied via HAProxy)
        - IpProtocol: tcp
          FromPort: 4141
          ToPort: 4141
          CidrIp: "0.0.0.0/0"
          Description: Atlantis UI + webhook (proxied via HAProxy)
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: "0.0.0.0/0"
      Tags:
        - Key: Name
          Value: !Sub "ax-ripple-${Environment}-haproxy-sg"

  PrometheusSG:
    Type: AWS::EC2::SecurityGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      GroupDescription: Prometheus and Grafana observability traffic
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 9090
          ToPort: 9090
          CidrIp: !Ref VpcCidr
          Description: Prometheus
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          CidrIp: !Ref VpcCidr
          Description: Grafana
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: "0.0.0.0/0"
      Tags:
        - Key: Name
          Value: !Sub "ax-ripple-${Environment}-prometheus-sg"

  AtlantisSG:
    Type: AWS::EC2::SecurityGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      GroupDescription: Atlantis server traffic
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 4141
          ToPort: 4141
          CidrIp: !Ref VpcCidr
          Description: Atlantis web UI + webhook (via HAProxy)
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: "0.0.0.0/0"
      Tags:
        - Key: Name
          Value: !Sub "ax-ripple-${Environment}-atlantis-sg"

Outputs:
  VpcId:
    Description: VPC ID
    Value: !Ref VPC
    Export:
      Name: !Sub "${AWS::StackName}-VpcId"

  PublicSubnetIds:
    Description: Comma-separated public subnet IDs
    Value: !Join [",", [!Ref PublicSubnet1, !Ref PublicSubnet2]]
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnetIds"

  PrivateSubnetIds:
    Description: Comma-separated private subnet IDs
    Value: !Join [",", [!Ref PrivateSubnet1, !Ref PrivateSubnet2]]
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnetIds"

  RippledPeerSGId:
    Description: Rippled peer security group ID
    Value: !Ref RippledPeerSG
    Export:
      Name: !Sub "${AWS::StackName}-RippledPeerSGId"

  RippledAPISGId:
    Description: Rippled API security group ID
    Value: !Ref RippledAPISG
    Export:
      Name: !Sub "${AWS::StackName}-RippledAPISGId"

  HAProxySGId:
    Description: HAProxy security group ID
    Value: !Ref HAProxySG
    Export:
      Name: !Sub "${AWS::StackName}-HAProxySGId"

  PrometheusSGId:
    Description: Prometheus/Grafana security group ID
    Value: !Ref PrometheusSG
    Export:
      Name: !Sub "${AWS::StackName}-PrometheusSGId"

  AtlantisSGId:
    Description: Atlantis security group ID
    Value: !Ref AtlantisSG
    Export:
      Name: !Sub "${AWS::StackName}-AtlantisSGId"