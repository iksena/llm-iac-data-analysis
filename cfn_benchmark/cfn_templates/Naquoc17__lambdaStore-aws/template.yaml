AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  LambdaStore — Serverless e-commerce backend
  DVA-C02 portfolio project covering all 8 exam stages

# ─────────────────────────────────────────────────────────────────────────────
# Parameters
# ─────────────────────────────────────────────────────────────────────────────
Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment

  ProjectName:
    Type: String
    Default: lambdastore

  # DVA S1: Build 19 — customer managed KMS key ARN (cross-account scenario)
  # Toggle these to enable nested stacks as each build stage is completed
  EnableAuth:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']

  EnableApi:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']

  EnableData:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']

  EnableMessaging:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']

  EnablePipeline:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']

  EnableObservability:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']

# ─────────────────────────────────────────────────────────────────────────────
# Conditions — enables incremental build (uncomment stacks as stages complete)
# ─────────────────────────────────────────────────────────────────────────────
Conditions:
  AuthEnabled:         !Equals [!Ref EnableAuth, 'true']
  ApiEnabled:          !Equals [!Ref EnableApi, 'true']
  DataEnabled:         !Equals [!Ref EnableData, 'true']
  MessagingEnabled:    !Equals [!Ref EnableMessaging, 'true']
  PipelineEnabled:     !Equals [!Ref EnablePipeline, 'true']
  ObservabilityEnabled: !Equals [!Ref EnableObservability, 'true']

# ─────────────────────────────────────────────────────────────────────────────
# Globals — apply to all Lambda functions
# DVA S2: Q168 — SDK init outside handler, not in Globals
# DVA S7: Tracing: Active enables X-Ray on all functions
# ─────────────────────────────────────────────────────────────────────────────
Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    Timeout: 30
    MemorySize: 256
    Tracing: Active                 # DVA S7: X-Ray tracing enabled globally
    LoggingConfig:
      LogFormat: JSON               # DVA S7: Structured logs for CloudWatch Logs Insights
      ApplicationLogLevel: INFO
      SystemLogLevel: WARN
    Environment:
      Variables:
        STAGE: !Ref Stage
        PROJECT_NAME: !Ref ProjectName
        POWERTOOLS_SERVICE_NAME: lambdastore
        POWERTOOLS_LOG_LEVEL: INFO
        AWS_LAMBDA_LOG_LEVEL: WARNING
    Tags:
      Project: !Ref ProjectName
      Stage: !Ref Stage
      ManagedBy: SAM

  Api:
    Cors:
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      AllowHeaders: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key'"
      AllowOrigin: "'*'"
    TracingEnabled: true            # DVA S7: X-Ray for API Gateway

# ─────────────────────────────────────────────────────────────────────────────
# Resources
# ─────────────────────────────────────────────────────────────────────────────
Resources:

  # ── Build Stage 1: Lambda Skeleton ──────────────────────────────────────────
  # DVA S2: Q168 — SDK initialization outside handler
  # DVA S2: Q122 — AWS Signature Version 4 signing pattern
  ProductsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${ProjectName}-${Stage}-products
      CodeUri: src/products/
      Handler: handler.lambda_handler
      Description: "DVA S4: Product catalog CRUD — DynamoDB GetItem/PutItem/Query"
      Environment:
        Variables:
          PRODUCTS_TABLE: !Sub ${ProjectName}-${Stage}-products
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub ${ProjectName}-${Stage}-products
      Events:
        ListProducts:
          Type: Api
          Properties:
            RestApiId: !Ref DevStoreApi
            Path: /products
            Method: GET
        GetProduct:
          Type: Api
          Properties:
            RestApiId: !Ref DevStoreApi
            Path: /products/{productId}
            Method: GET
        CreateProduct:
          Type: Api
          Properties:
            RestApiId: !Ref DevStoreApi
            Path: /products
            Method: POST

  CartFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${ProjectName}-${Stage}-cart
      CodeUri: src/cart/
      Handler: handler.lambda_handler
      Description: "DVA S4: Cart with ElastiCache Redis sessions — Q092"
      Timeout: 10
      Environment:
        Variables:
          CART_TABLE: !Sub ${ProjectName}-${Stage}-cart
          # DVA S4: Q092 — ElastiCache endpoint injected via SSM in Build 13
          REDIS_HOST: placeholder
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub ${ProjectName}-${Stage}-cart
      Events:
        GetCart:
          Type: Api
          Properties:
            RestApiId: !Ref DevStoreApi
            Path: /cart
            Method: GET
        AddToCart:
          Type: Api
          Properties:
            RestApiId: !Ref DevStoreApi
            Path: /cart/items
            Method: POST
        RemoveFromCart:
          Type: Api
          Properties:
            RestApiId: !Ref DevStoreApi
            Path: /cart/items/{itemId}
            Method: DELETE

  OrdersFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${ProjectName}-${Stage}-orders
      CodeUri: src/orders/
      Handler: handler.lambda_handler
      Description: "DVA S5: Orders → SQS FIFO FIFO MessageGroupId pattern"
      Environment:
        Variables:
          ORDERS_TABLE: !Sub ${ProjectName}-${Stage}-orders
          # DVA S5: SQS FIFO URL injected after Build 14
          ORDER_QUEUE_URL: placeholder
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub ${ProjectName}-${Stage}-orders
        - SQSSendMessagePolicy:
            QueueName: !Sub ${ProjectName}-${Stage}-orders.fifo
      Events:
        ListOrders:
          Type: Api
          Properties:
            RestApiId: !Ref DevStoreApi
            Path: /orders
            Method: GET
        GetOrder:
          Type: Api
          Properties:
            RestApiId: !Ref DevStoreApi
            Path: /orders/{orderId}
            Method: GET
        Checkout:
          Type: Api
          Properties:
            RestApiId: !Ref DevStoreApi
            Path: /cart/checkout
            Method: POST

  UploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${ProjectName}-${Stage}-upload
      CodeUri: src/upload/
      Handler: handler.lambda_handler
      Description: "DVA S4: S3 presigned URL — generate_presigned_url, SSE-KMS — Q031"
      Environment:
        Variables:
          UPLOAD_BUCKET: !Sub ${ProjectName}-${Stage}-uploads
      Policies:
        - S3WritePolicy:
            BucketName: !Sub ${ProjectName}-${Stage}-uploads
      Events:
        GetPresignedUrl:
          Type: Api
          Properties:
            RestApiId: !Ref DevStoreApi
            Path: /upload/presigned
            Method: POST

  SearchFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${ProjectName}-${Stage}-search
      CodeUri: src/search/
      Handler: handler.lambda_handler
      Description: "DVA S4: DynamoDB GSI query — KeyConditionExpression pattern"
      Environment:
        Variables:
          PRODUCTS_TABLE: !Sub ${ProjectName}-${Stage}-products
          PRODUCTS_GSI: category-price-index
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Sub ${ProjectName}-${Stage}-products
      Events:
        Search:
          Type: Api
          Properties:
            RestApiId: !Ref DevStoreApi
            Path: /search
            Method: GET

  # ── Build Stage 1: Minimal API Gateway ──────────────────────────────────────
  # DVA S3: Full API Gateway config in infrastructure/api.yaml (Build 11)
  DevStoreApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub ${ProjectName}-${Stage}
      StageName: !Ref Stage
      Description: LambdaStore REST API
      TracingEnabled: true
      # DVA S3: Q019 — API response caching for performance (Build 11)
      # CacheClusterEnabled: true
      # CacheClusterSize: '0.5'
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          MetricsEnabled: true
          DataTraceEnabled: false      # disable in prod — logs request body
          LoggingLevel: INFO
      Tags:
        Project: !Ref ProjectName
        Stage: !Ref Stage

  # ── Nested Stacks (enabled via Parameters as build stages complete) ──────────

  # Build Stage 5 — Enable: sam deploy --config-env dev --parameter-overrides EnableAuth=true
  AuthStack:
    Type: AWS::CloudFormation::Stack
    Condition: AuthEnabled
    Properties:
      TemplateURL: infrastructure/auth.yaml
      Parameters:
        Stage: !Ref Stage
        ProjectName: !Ref ProjectName

  # Build Stage 11 — Enable after completing API Gateway advanced config
  ApiStack:
    Type: AWS::CloudFormation::Stack
    Condition: ApiEnabled
    Properties:
      TemplateURL: infrastructure/api.yaml
      Parameters:
        Stage: !Ref Stage
        ProjectName: !Ref ProjectName

  # Build Stage 2 — Enable immediately (DynamoDB is needed from the start)
  DataStack:
    Type: AWS::CloudFormation::Stack
    Condition: DataEnabled
    Properties:
      TemplateURL: infrastructure/data.yaml
      Parameters:
        Stage: !Ref Stage
        ProjectName: !Ref ProjectName

  # Build Stage 14 — Enable after SQS/SNS implementation
  MessagingStack:
    Type: AWS::CloudFormation::Stack
    Condition: MessagingEnabled
    Properties:
      TemplateURL: infrastructure/messaging.yaml
      Parameters:
        Stage: !Ref Stage
        ProjectName: !Ref ProjectName

  # Build Stage 33 — Enable after CodeCommit setup
  PipelineStack:
    Type: AWS::CloudFormation::Stack
    Condition: PipelineEnabled
    Properties:
      TemplateURL: infrastructure/pipeline.yaml
      Parameters:
        Stage: !Ref Stage
        ProjectName: !Ref ProjectName

  # Build Stage 23 — Enable for X-Ray + CloudWatch dashboards
  ObservabilityStack:
    Type: AWS::CloudFormation::Stack
    Condition: ObservabilityEnabled
    Properties:
      TemplateURL: infrastructure/observability.yaml
      Parameters:
        Stage: !Ref Stage
        ProjectName: !Ref ProjectName

# ─────────────────────────────────────────────────────────────────────────────
# Outputs
# ─────────────────────────────────────────────────────────────────────────────
Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub https://${DevStoreApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
    Export:
      Name: !Sub ${ProjectName}-${Stage}-ApiUrl

  ProductsFunctionArn:
    Value: !GetAtt ProductsFunction.Arn
    Export:
      Name: !Sub ${ProjectName}-${Stage}-ProductsFunctionArn

  OrdersFunctionArn:
    Value: !GetAtt OrdersFunction.Arn
    Export:
      Name: !Sub ${ProjectName}-${Stage}-OrdersFunctionArn