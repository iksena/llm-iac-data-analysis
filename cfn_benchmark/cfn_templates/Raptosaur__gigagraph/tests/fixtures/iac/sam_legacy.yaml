AWSTemplateFormatVersion: '2010-09-09'
# Single-quoted Transform (common in older SAM templates).
Transform: 'AWS::Serverless-2016-10-31'

Resources:
  LegacyAnyFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/items.handler
      Runtime: nodejs12.x
      CodeUri: .
      Events:
        AllItems:
          Type: Api
          Properties:
            Path: /legacy/items
            Method: ANY

  LegacySwaggerApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      DefinitionBody:
        swagger: '2.0'
        info:
          title: legacy
        paths:
          /swagger/pets:
            get:
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri:
                  Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LegacyAnyFunction.Arn}/invocations
            post:
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LegacyAnyFunction.Arn}/invocations