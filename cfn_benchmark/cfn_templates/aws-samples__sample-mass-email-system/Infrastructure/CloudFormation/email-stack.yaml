                                  }
                              }

                              if html_content:
                                  content['Simple']['Body']['Html'] = {
                                      'Data': html_content,
                                      'Charset': 'UTF-8'
                                  }

                              if text_content:
                                  content['Simple']['Body']['Text'] = {
                                      'Data': text_content,
                                      'Charset': 'UTF-8'
                                  }

                              # Prepare email parameters for simple email
                              email_params = {
                                  'FromEmailAddress': f"{sender.get('name', 'Notification Service')} <{sender['email']}>",
                                  'Destination': {
                                      'ToAddresses': [email]
