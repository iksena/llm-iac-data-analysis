                  return {
                      'statusCode': 500,
                      'body': json.dumps({'error': 'EMAIL_QUEUE_URL environment variable not set'})
                  }

              # Get S3 bucket from environment variable
              s3_bucket = os.environ.get('S3_BUCKET')
              if not s3_bucket:
                  logger.error("S3_BUCKET environment variable not set")
                  return {
                      'statusCode': 500,
                      'body': json.dumps({'error': 'S3_BUCKET environment variable not set'})
                  }

              # Get AWS clients
              s3_client = boto3.client('s3')
              sqs_client = boto3.client('sqs')
              dynamodb = boto3.resource('dynamodb')

              # Use campaign-specific tables
              batch_table = dynamodb.Table(batch_table_name)

              try:
                  # Check if batch is already processed
                  batch_info = batch_table.get_item(Key={'BatchId': batch_id}).get('Item')
                  if batch_info and batch_info.get('Status') in ['COMPLETED', 'COMPLETED_WITH_ERRORS', 'QUEUED_FOR_SENDING']:
                      logger.info(f"Batch {batch_id} already processed with status {batch_info['Status']}. Skipping.")
                      return {
                          'statusCode': 200,
                          'body': json.dumps({
                              'message': f"Batch {batch_id} already processed",
                              'batchId': batch_id,
                              'status': batch_info['Status']
                          })
                      }

                  # Get the batch data from S3
                  logger.info(f"Loading batch data from s3://{s3_bucket}/{s3_key}")
                  response = s3_client.get_object(Bucket=s3_bucket, Key=s3_key)
                  batch_data = json.loads(response['Body'].read().decode('utf-8'))

                  # Update batch status to IN_PROCESSING
                  batch_table.update_item(
                      Key={'BatchId': batch_id},
                      UpdateExpression="SET #status = :status, ProcessingStartTime = :startTime",
                      ExpressionAttributeNames={'#status': 'Status'},
                      ExpressionAttributeValues={
                          ':status': 'IN_PROCESSING',
                          ':startTime': datetime.now().isoformat()
                      }
                  )

                  # Get destinations
                  destinations = batch_data.get('destinations', [])
                  if not destinations:
                      logger.warning("No recipients in batch")

                      # Mark batch as completed (empty)
                      batch_table.update_item(
                          Key={'BatchId': batch_id},
                          UpdateExpression="SET #status = :status, #endTime = :endTime, #count = :count",
                          ExpressionAttributeNames={
                              '#status': 'Status',
                              '#endTime': 'ProcessingEndTime',
                              '#count': 'RecipientCount'
                          },
                          ExpressionAttributeValues={
                              ':status': 'COMPLETED',
                              ':endTime': datetime.now().isoformat(),
                              ':count': 0
                          }
                      )

                      return {
                          'statusCode': 200,
                          'body': json.dumps({
                              'batchId': batch_id,
                              'message': 'No recipients to process',
                              'status': 'COMPLETED'
                          })
                      }

                  # Prepare common message attributes
                  sender = batch_data.get('sender', {})
                  template = batch_data.get('template', {})

                  # Queue up messages in SQS (one message per recipient)
                  messages_queued = 0

                  # SQS allows up to 10 messages in a batch send
                  sqs_batch_size = 10

                  for i in range(0, len(destinations), sqs_batch_size):
                      chunk = destinations[i:i + sqs_batch_size]
                      entries = []

                      for recipient in chunk:
                          email = recipient.get('email')
                          if not email:
                              logger.warning("Recipient missing email address, skipping")
                              continue

                          # Create a unique message ID
                          message_id = str(uuid.uuid4())

                          # Create the message body with campaign-specific table names
                          message = {
                              'batchId': batch_id,
                              'campaignId': campaign_id,
                              'recipientTrackingTable': recipient_table_name,
                              'batchTrackingTable': batch_table_name,
                              'recipient': recipient,
                              'sender': sender,
                              'template': template,
                              'attachments': batch_data.get('attachments', []),
                              'topicName': batch_data.get('topicName'),
                              'templateS3Key': batch_data.get('templateS3Key'),
                              'timestamp': datetime.now().isoformat(),
                              'attempts': 0,  # Track retry attempts
                              'messageId': message_id
                          }

                          # Add to batch entries
                          entries.append({
                              'Id': message_id,
                              'MessageBody': json.dumps(message)
                          })

                      if entries:
                          response = sqs_client.send_message_batch(
                              QueueUrl=sqs_url,
                              Entries=entries
                          )

                          # Check for any failed messages
                          if 'Failed' in response and response['Failed']:
                              for failed in response['Failed']:
                                  logger.error(f"Failed to queue message: {failed}")

                          messages_queued += len(entries) - len(response.get('Failed', []))

                  # Update batch status in DynamoDB
                  batch_table.update_item(
                      Key={'BatchId': batch_id},
                      UpdateExpression="SET #status = :status, QueuedTime = :queuedTime, QueuedCount = :count",
                      ExpressionAttributeNames={'#status': 'Status'},
                      ExpressionAttributeValues={
                          ':status': 'QUEUED_FOR_SENDING',
                          ':queuedTime': datetime.now().isoformat(),
                          ':count': messages_queued
                      }
                  )

                  # Start the monitoring state machine for this batch
                  step_functions = boto3.client('stepfunctions')
                  monitoring_state_machine_arn = os.environ.get('MONITORING_STATE_MACHINE_ARN')

                  if monitoring_state_machine_arn:
                      try:
                          response = step_functions.start_execution(
                              stateMachineArn=monitoring_state_machine_arn,
                              name=f"Monitor-{batch_id}-{int(datetime.now().timestamp())}",
                              input=json.dumps({
                                  'batchId': batch_id,
                                  'campaignId': campaign_id,
                                  'recipientTrackingTable': recipient_table_name,
                                  'batchTrackingTable': batch_table_name,
                                  'startTime': datetime.now().isoformat(),
                                  'totalMessages': messages_queued,
                                  'maxWaitMinutes': 600  # Maximum time to wait for completion
                              })
                          )

                          logger.info(f"Started monitoring state machine: {response['executionArn']}")
                      except Exception as e:
                          logger.error(f"Failed to start monitoring state machine: {str(e)}")

                  return {
                      'statusCode': 200,
                      'body': json.dumps({
                          'batchId': batch_id,
                          'messagesQueued': messages_queued,
                          'status': 'QUEUED_FOR_SENDING',
                          'monitoringStarted': bool(monitoring_state_machine_arn)
                      })
                  }

              except Exception as e:
                  logger.error(f"Error processing batch {batch_id}: {str(e)}")

                  # Mark batch as failed
                  try:
                      batch_table.update_item(
                          Key={'BatchId': batch_id},
                          UpdateExpression="SET #status = :status, #error = :error, #endTime = :endTime",
                          ExpressionAttributeNames={
                              '#status': 'Status',
                              '#error': 'ErrorMessage',
                              '#endTime': 'ProcessingEndTime'
                          },
                          ExpressionAttributeValues={
                              ':status': 'FAILED',
                              ':error': str(e),
                              ':endTime': datetime.now().isoformat()
                          }
                      )
                  except Exception as db_error:
                      logger.error(f"Failed to update batch status: {str(db_error)}")

                  return {
                      'statusCode': 500,
                      'body': json.dumps({
                          'error': str(e),
                          'batchId': batch_id
                      })
                  }
      Runtime: python3.13
      Timeout: 900  # 15 minutes
      MemorySize: 1024
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          S3_BUCKET: !Ref EmailBatchBucket
          EMAIL_QUEUE_URL: !GetAtt EmailQueue.QueueUrl
          MONITORING_STATE_MACHINE_ARN: !Sub arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${AWS::StackName}-EmailBatchMonitor-StateMachine
      KmsKeyArn: !Ref LambdaKMSKeyArn

  SESTemplateManagerLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-SESTemplateManager
      ReservedConcurrentExecutions: 5
      Handler: index.lambda_handler
      Role: !GetAtt LambdaSESRole.Arn
      Runtime: python3.13
      Timeout: 30
      MemorySize: 128
      DeadLetterConfig:
        TargetArn: !GetAtt LambdaDeadLetterQueue.Arn
      Code:
        ZipFile: |
          import json
          import os
          import boto3
          from botocore.exceptions import ClientError
          import logging

          # Configure logging
          logger = logging.getLogger()
          logger.setLevel(getattr(logging, os.environ.get('LOG_LEVEL', 'WARN').upper(), logging.WARNING))

          # Initialize SESv2 client
          sesv2_client = boto3.client('sesv2')

          CORS_ORIGIN = os.environ.get('ALLOWED_ORIGIN', 'NONE')

          def lambda_handler(event, context):
              # Log request metadata only. The event body carries user-submitted
              # template subject and HTML content.
              logger.info(
                  f"Template request: method={event.get('httpMethod')} "
                  f"requestId={getattr(context, 'aws_request_id', 'unknown')}"
              )

              # Extract HTTP method and path parameters
              http_method = event.get('httpMethod')
              path_parameters = event.get('pathParameters') or {}

              # CORS headers
              headers = {
                  'Content-Type': 'application/json',
                  'Access-Control-Allow-Origin': CORS_ORIGIN,
                  'Access-Control-Allow-Methods': 'GET, POST, PUT, DELETE, OPTIONS',
                  'Access-Control-Allow-Headers': 'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token',
                  'Access-Control-Allow-Credentials': 'true'
              }

              # Handle preflight OPTIONS request
              if http_method == 'OPTIONS':
                  return {
                      'statusCode': 200,
                      'headers': headers,
                      'body': json.dumps({'message': 'CORS preflight successful'})
                  }

              try:
                  if http_method == 'GET':
                      if path_parameters.get('templateName'):
                          # Get specific template
                          template_name = path_parameters['templateName']
                          logger.info(f"Fetching template: {template_name}")

                          try:
                              response = sesv2_client.get_email_template(
                                  TemplateName=template_name
                              )

                              return {
                                  'statusCode': 200,
                                  'headers': headers,
                                  'body': json.dumps({
                                      'template': {
                                          'TemplateName': response['TemplateName'],
                                          'SubjectPart': response.get('TemplateContent', {}).get('Subject'),
                                          'HtmlPart': response.get('TemplateContent', {}).get('Html'),
                                          'TextPart': response.get('TemplateContent', {}).get('Text')
                                      }
                                  })
                              }
                          except ClientError as e:
                              if e.response['Error']['Code'] == 'NotFoundException':
                                  return {
                                      'statusCode': 404,
                                      'headers': headers,
                                      'body': json.dumps({
                                          'message': f"Template '{template_name}' not found"
                                      })
                                  }
                              raise
                      else:
                          # List all templates
                          logger.info("Listing all templates")

                          try:
                              # SESv2 pages this response (10 per page by default), so a
                              # single call silently drops every template past the first
                              # page. Walk NextToken so the full list is returned.
                              all_templates = []
                              next_token = None
                              while True:
                                  page_kwargs = {'PageSize': 100}
                                  if next_token:
                                      page_kwargs['NextToken'] = next_token
                                  response = sesv2_client.list_email_templates(**page_kwargs)
                                  all_templates.extend(response.get('TemplatesMetadata', []))
                                  next_token = response.get('NextToken')
                                  if not next_token:
                                      break
                              templates_metadata = []

                              for template in all_templates:
                                  templates_metadata.append({
                                      'Name': template['TemplateName'],
                                      'CreatedTimestamp': template.get('CreatedTimestamp', '').isoformat() if template.get('CreatedTimestamp') else None
                                  })

                              return {
                                  'statusCode': 200,
                                  'headers': headers,
                                  'body': json.dumps({
                                      'templates': templates_metadata
                                  })
                              }
                          except Exception as e:
                              logger.error(f"Error listing templates: {str(e)}")
                              raise

                  elif http_method == 'POST':
                      # Create template
                      try:
                          if not event.get('body'):
                              return {
                                  'statusCode': 400,
                                  'headers': headers,
                                  'body': json.dumps({
                                      'message': 'Request body is missing'
                                  })
                              }

                          body = json.loads(event['body']) if isinstance(event['body'], str) else event['body']

                          if not body.get('templateName'):
                              return {
                                  'statusCode': 400,
                                  'headers': headers,
                                  'body': json.dumps({
                                      'message': 'templateName is required'
                                  })
                              }

                          if not body.get('subject'):
                              return {
                                  'statusCode': 400,
                                  'headers': headers,
                                  'body': json.dumps({
                                      'message': 'subject is required'
                                  })
                              }

                          template_name = body['templateName']
                          subject = body['subject']
                          html_content = body.get('htmlContent')
                          text_content = body.get('textContent')

                          logger.info(f"Creating template: {template_name}")

                          template_content = {
                              'Subject': subject
                          }

                          # Add unsubscribe functionality to HTML content
                          if html_content:
                              if '{{amazonSESUnsubscribeUrl}}' not in html_content:
                                  unsubscribe_html = '<p>To unsubscribe from this newsletter, <a href="{{amazonSESUnsubscribeUrl}}">click here</a>.</p>'

                                  # Add unsubscribe link to end of HTML content
                                  if '</body>' in html_content:
                                      html_content = html_content.replace('</body>', f'{unsubscribe_html}</body>')
                                  else:
                                      html_content += unsubscribe_html

                              template_content['Html'] = html_content

                          # Add unsubscribe functionality to text content
                          if text_content:
                              if '{{amazonSESUnsubscribeUrl}}' not in text_content:
                                  unsubscribe_text = '\n\nTo unsubscribe from this newsletter, visit: {{amazonSESUnsubscribeUrl}}'
                                  text_content += unsubscribe_text

                              template_content['Text'] = text_content

                          # Create template with unsubscribe headers
                          sesv2_client.create_email_template(
                              TemplateName=template_name,
                              TemplateContent=template_content
                          )

                          return {
                              'statusCode': 201,
                              'headers': headers,
                              'body': json.dumps({
                                  'message': 'Template created successfully',
                                  'templateName': template_name
                              })
                          }

                      except json.JSONDecodeError:
                          return {
                              'statusCode': 400,
                              'headers': headers,
                              'body': json.dumps({
                                  'message': 'Invalid JSON in request body'
                              })
                          }
                      except ClientError as e:
                          if e.response['Error']['Code'] == 'AlreadyExistsException':
                              return {
                                  'statusCode': 409,
                                  'headers': headers,
                                  'body': json.dumps({
                                      'message': f"Template '{template_name}' already exists"
                                  })
                              }
                          raise

                  elif http_method == 'PUT':
                      # Update template
                      if not path_parameters.get('templateName'):
                          return {
                              'statusCode': 400,
                              'headers': headers,
                              'body': json.dumps({
                                  'message': 'Template name is required'
                              })
                          }

                      try:
                          if not event.get('body'):
                              return {
                                  'statusCode': 400,
                                  'headers': headers,
                                  'body': json.dumps({
                                      'message': 'Request body is missing'
                                  })
                              }

                          body = json.loads(event['body']) if isinstance(event['body'], str) else event['body']
                          template_name = path_parameters['templateName']
                          subject = body.get('subject')
                          html_content = body.get('htmlContent')
                          text_content = body.get('textContent')

                          if not subject:
                              return {
                                  'statusCode': 400,
                                  'headers': headers,
                                  'body': json.dumps({
                                      'message': 'subject is required'
                                  })
                              }

                          logger.info(f"Updating template: {template_name}")

                          template_content = {
                              'Subject': subject
                          }

                          if html_content:
                              if '{{amazonSESUnsubscribeUrl}}' not in html_content:
                                  unsubscribe_html = '<p>To unsubscribe from this newsletter, <a href="{{amazonSESUnsubscribeUrl}}">click here</a>.</p>'
                                  if '</body>' in html_content:
                                      html_content = html_content.replace('</body>', f'{unsubscribe_html}</body>')
                                  else:
                                      html_content += unsubscribe_html
                              template_content['Html'] = html_content

                          if text_content:
                              if '{{amazonSESUnsubscribeUrl}}' not in text_content:
                                  unsubscribe_text = '\n\nTo unsubscribe from this newsletter, visit: {{amazonSESUnsubscribeUrl}}'
                                  text_content += unsubscribe_text
                              template_content['Text'] = text_content

                          sesv2_client.update_email_template(
                              TemplateName=template_name,
                              TemplateContent=template_content
                          )

                          return {
                              'statusCode': 200,
                              'headers': headers,
                              'body': json.dumps({
                                  'message': 'Template updated successfully',
                                  'templateName': template_name
                              })
                          }

                      except json.JSONDecodeError:
                          return {
                              'statusCode': 400,
                              'headers': headers,
                              'body': json.dumps({
                                  'message': 'Invalid JSON in request body'
                              })
                          }
                      except ClientError as e:
                          if e.response['Error']['Code'] == 'NotFoundException':
                              return {
                                  'statusCode': 404,
                                  'headers': headers,
                                  'body': json.dumps({
                                      'message': f"Template '{template_name}' not found"
                                  })
                              }
                          raise

                  elif http_method == 'DELETE':
                      # Delete template
                      if not path_parameters.get('templateName'):
                          return {
                              'statusCode': 400,
                              'headers': headers,
                              'body': json.dumps({
                                  'message': 'Template name is required'
                              })
                          }

                      template_name = path_parameters['templateName']
                      logger.info(f"Deleting template: {template_name}")

                      try:
                          sesv2_client.delete_email_template(
                              TemplateName=template_name
                          )

                          return {
                              'statusCode': 200,
                              'headers': headers,
                              'body': json.dumps({
                                  'message': 'Template deleted successfully',
                                  'templateName': template_name
                              })
                          }
                      except ClientError as e:
                          if e.response['Error']['Code'] == 'NotFoundException':
                              return {
                                  'statusCode': 404,
                                  'headers': headers,
                                  'body': json.dumps({
                                      'message': f"Template '{template_name}' not found"
                                  })
                              }
                          raise

                  else:
                      return {
                          'statusCode': 405,
                          'headers': headers,
                          'body': json.dumps({
                              'message': 'Method not allowed'
                          })
                      }

              except ClientError as e:
                  error_code = e.response['Error']['Code']
                  error_message = e.response['Error']['Message']

                  logger.error(f"AWS ClientError: {error_code} - {error_message}")

                  status_code = 500
                  if error_code in ['ValidationException', 'InvalidParameterException']:
                      status_code = 400
                  elif error_code == 'ResourceNotFoundException':
                      status_code = 404

                  return {
                      'statusCode': status_code,
                      'headers': headers,
                      'body': json.dumps({
                          'message': 'Error managing templates',
                          'errorCode': error_code,
                          'errorMessage': error_message
                      })
                  }
              except Exception as e:
                  logger.error(f"Unexpected error: {str(e)}")

                  return {
                      'statusCode': 500,
                      'headers': headers,
                      'body': json.dumps({
                          'message': 'Unexpected error occurred',
                          'error': str(e)
                      })
                  }
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          ALLOWED_ORIGIN: !Ref AllowedOrigin

