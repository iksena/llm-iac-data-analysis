AWSTemplateFormatVersion: '2010-09-09'
Description: SLO Monitoring for FSx for ONTAP event-driven pipeline with CloudWatch dashboard and alarms

Parameters:
  EnableFlag:
    Type: String
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'false'
    Description: Set to true to deploy monitoring resources
  ProjectPrefix:
    Type: String
    Default: fsxn-s3ap
    Description: Prefix for resource names and dashboard title
  MetricNamespace:
    Type: String
    Default: FSxN-S3AP-Patterns
    Description: CloudWatch namespace for SLO metrics
  CanaryMetricNamespace:
    Type: String
    Default: FSxN-S3AP-Patterns/Canary
    Description: CloudWatch namespace for synthetic canary metrics
  AlarmSNSTopicArn:
    Type: String
    Default: ''
    Description: Optional SNS topic ARN for alarm notifications
  EventIngestionLatencyThreshold:
    Type: Number
    Default: 5
    Description: P99 threshold in seconds for EventIngestionLatency
  ProcessingSuccessRateThreshold:
    Type: Number
    Default: 99.5
    Description: Average threshold percentage for ProcessingSuccessRate (0-100)
  FPolicyReconnectTimeThreshold:
    Type: Number
    Default: 30
    Description: Maximum threshold in seconds for FPolicyReconnectTime
  ReplayCompletionTimeThreshold:
    Type: Number
    Default: 300
    Description: Maximum threshold in seconds for ReplayCompletionTime

Conditions:
  EnableMonitoring: !Equals [!Ref EnableFlag, 'true']
  HasAlarmSNSTopic: !Not [!Equals [!Ref AlarmSNSTopicArn, '']]

Resources:
  EventIngestionLatencyAlarm:
    Condition: EnableMonitoring
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectPrefix}-EventIngestionLatency-Alarm
      AlarmDescription: Alarms when P99 Event Ingestion Latency exceeds threshold
      Namespace: !Ref MetricNamespace
      MetricName: EventIngestionLatency
      Statistic: p99
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: !Ref EventIngestionLatencyThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmSNSTopic, [!Ref AlarmSNSTopicArn], !Ref AWS::NoValue]
      OKActions: !If [HasAlarmSNSTopic, [!Ref AlarmSNSTopicArn], !Ref AWS::NoValue]

  ProcessingSuccessRateAlarm:
    Condition: EnableMonitoring
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectPrefix}-ProcessingSuccessRate-Alarm
      AlarmDescription: Alarms when Processing Success Rate falls below threshold
      Namespace: !Ref MetricNamespace
      MetricName: ProcessingSuccessRate
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: !Ref ProcessingSuccessRateThreshold
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmSNSTopic, [!Ref AlarmSNSTopicArn], !Ref AWS::NoValue]
      OKActions: !If [HasAlarmSNSTopic, [!Ref AlarmSNSTopicArn], !Ref AWS::NoValue]

  FPolicyReconnectTimeAlarm:
    Condition: EnableMonitoring
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectPrefix}-FPolicyReconnectTime-Alarm
      AlarmDescription: Alarms when FPolicy Reconnect Time exceeds threshold
      Namespace: !Ref MetricNamespace
      MetricName: FPolicyReconnectTime
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: !Ref FPolicyReconnectTimeThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmSNSTopic, [!Ref AlarmSNSTopicArn], !Ref AWS::NoValue]
      OKActions: !If [HasAlarmSNSTopic, [!Ref AlarmSNSTopicArn], !Ref AWS::NoValue]

  ReplayCompletionTimeAlarm:
    Condition: EnableMonitoring
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectPrefix}-ReplayCompletionTime-Alarm
      AlarmDescription: Alarms when Replay Completion Time exceeds threshold
      Namespace: !Ref MetricNamespace
      MetricName: ReplayCompletionTime
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: !Ref ReplayCompletionTimeThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmSNSTopic, [!Ref AlarmSNSTopicArn], !Ref AWS::NoValue]
      OKActions: !If [HasAlarmSNSTopic, [!Ref AlarmSNSTopicArn], !Ref AWS::NoValue]

  SloDashboard:
    Condition: EnableMonitoring
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub ${ProjectPrefix}-SLO-Dashboard
      DashboardBody:
        Fn::Sub:
          - |
            {
              "widgets": [
                {
                  "type": "metric",
                  "x": 0,
                  "y": 0,
                  "width": 12,
                  "height": 6,
                  "properties": {
                    "metrics": [
                      [
                        "${MetricNamespace}",
                        "EventIngestionLatency",
                        { "stat": "p99" }
                      ]
                    ],
                    "period": 300,
                    "stat": "p99",
                    "region": "${Region}",
                    "title": "Event Ingestion Latency (P99)",
                    "annotations": {
                      "horizontal": [
                        { "value": ${EventIngestionLatencyThreshold}, "label": "Threshold: ${EventIngestionLatencyThreshold}s", "fill": "above" }
                      ]
                    }
                  }
                },
                {
                  "type": "metric",
                  "x": 12,
                  "y": 0,
                  "width": 12,
                  "height": 6,
                  "properties": {
                    "metrics": [
                      [
                        "${MetricNamespace}",
                        "ProcessingSuccessRate",
                        { "stat": "Average" }
                      ]
                    ],
                    "period": 300,
                    "stat": "Average",
                    "region": "${Region}",
                    "title": "Processing Success Rate (%)",
                    "annotations": {
                      "horizontal": [
                        { "value": ${ProcessingSuccessRateThreshold}, "label": "Threshold: ${ProcessingSuccessRateThreshold}%", "fill": "below" }
                      ]
                    }
                  }
                },
                {
                  "type": "metric",
                  "x": 0,
                  "y": 6,
                  "width": 12,
                  "height": 6,
                  "properties": {
                    "metrics": [
                      [
                        "${MetricNamespace}",
                        "FPolicyReconnectTime",
                        { "stat": "Maximum" }
                      ]
                    ],
                    "period": 300,
                    "stat": "Maximum",
                    "region": "${Region}",
                    "title": "FPolicy Reconnect Time",
                    "annotations": {
                      "horizontal": [
                        { "value": ${FPolicyReconnectTimeThreshold}, "label": "Threshold: ${FPolicyReconnectTimeThreshold}s", "fill": "above" }
                      ]
                    }
                  }
                },
                {
                  "type": "metric",
                  "x": 12,
                  "y": 6,
                  "width": 12,
                  "height": 6,
                  "properties": {
                    "metrics": [
                      [
                        "${MetricNamespace}",
                        "ReplayCompletionTime",
                        { "stat": "Maximum" }
                      ]
                    ],
                    "period": 300,
                    "stat": "Maximum",
                    "region": "${Region}",
                    "title": "Replay Completion Time",
                    "annotations": {
                      "horizontal": [
                        { "value": ${ReplayCompletionTimeThreshold}, "label": "Threshold: ${ReplayCompletionTimeThreshold}s", "fill": "above" }
                      ]
                    }
                  }
                },
                {
                  "type": "metric",
                  "x": 0,
                  "y": 12,
                  "width": 12,
                  "height": 6,
                  "properties": {
                    "metrics": [
                      [ "${CanaryMetricNamespace}", "S3APListLatency" ],
                      [ "${CanaryMetricNamespace}", "S3APGetLatency" ]
                    ],
                    "period": 60,
                    "stat": "Average",
                    "region": "${Region}",
                    "title": "S3AP Latencies (Canary)"
                  }
                },
                {
                  "type": "metric",
                  "x": 12,
                  "y": 12,
                  "width": 12,
                  "height": 6,
                  "properties": {
                    "metrics": [
                      [
                        "${CanaryMetricNamespace}",
                        "ONTAPHealthCheck",
                        {
                          "stat": "Average"
                        }
                      ]
                    ],
                    "period": 60,
                    "stat": "Average",
                    "region": "${Region}",
                    "title": "ONTAP Health Check (Canary)"
                  }
                },
                {
                  "type": "alarm",
                  "x": 0,
                  "y": 18,
                  "width": 24,
                  "height": 6,
                  "properties": {
                    "alarms": [
                      "${EventIngestionLatencyAlarm}",
                      "${ProcessingSuccessRateAlarm}",
                      "${FPolicyReconnectTimeAlarm}",
                      "${ReplayCompletionTimeAlarm}"
                    ],
                    "title": "SLO Alarm Status"
                  }
                }
              ]
            }
          - Region: !Ref AWS::Region
            MetricNamespace: !Ref MetricNamespace
            CanaryMetricNamespace: !Ref CanaryMetricNamespace
            EventIngestionLatencyThreshold: !Ref EventIngestionLatencyThreshold
            ProcessingSuccessRateThreshold: !Ref ProcessingSuccessRateThreshold
            FPolicyReconnectTimeThreshold: !Ref FPolicyReconnectTimeThreshold
            ReplayCompletionTimeThreshold: !Ref ReplayCompletionTimeThreshold
            EventIngestionLatencyAlarm: !Ref EventIngestionLatencyAlarm
            ProcessingSuccessRateAlarm: !Ref ProcessingSuccessRateAlarm
            FPolicyReconnectTimeAlarm: !Ref FPolicyReconnectTimeAlarm
            ReplayCompletionTimeAlarm: !Ref ReplayCompletionTimeAlarm

Outputs:
  DashboardName:
    Description: Name of the CloudWatch dashboard
    Value: !If [EnableMonitoring, !Sub ${ProjectPrefix}-SLO-Dashboard, "Dashboard not created"]
  AlarmNames:
    Description: Names of the SLO alarms
    Value: !If
      - EnableMonitoring
      - !Join
        - ', '
        - - !Ref EventIngestionLatencyAlarm
          - !Ref ProcessingSuccessRateAlarm
          - !Ref FPolicyReconnectTimeAlarm
          - !Ref ReplayCompletionTimeAlarm
      - "Alarms not created"