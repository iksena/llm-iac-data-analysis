AWSTemplateFormatVersion: '2010-09-09'
Description: |
  Wysoko dostepne srodowisko webowe AWS - E-commerce (WordPress + WooCommerce)
  (Wersja zmodyfikowana dla kont osobistych, "usunięte" podatności)
  Author: Marcin Mitura.

Parameters:
  StackName:
    Type: String
    Default: EcommerceLabStack
    Description: Nazwa projektu/stacku (dodana dla porzadku, uzywana m.in. w tagach)
  DBName:
    Type: String
    Default: wordpress_db
    Description: Poczatkowa nazwa bazy danych
  DBUsername:
    Type: String
    Default: wp_admin
    Description: Nazwa uzytkownika bazy danych
  DBPassword:
    Type: String
    Default: HasloDoBazy123!
    NoEcho: true
    Description: Haslo do bazy danych (min. 8 znakow)
  DomainName:
    Type: String
    Description: 'Twoja domena (np. mojsklep.pl) do wygenerowania certyfikatu SSL'

Resources:
  # ==========================================
  # KROK 0: AUTOMATYCZNA STREFA DOMENOWA ROUTE 53
  # ==========================================
  MyHostedZone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: !Ref DomainName
      HostedZoneConfig:
        Comment: !Sub 'Master Hosted Zone dla projektu ${StackName}'

  # ==========================================
  # KMS Key for RDS Performance Insights & CloudWatch Logs
  # ==========================================
  PIKmsKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain #  I3011
    UpdateReplacePolicy: Retain #  I3011
    Properties:
      Description: 'KMS key for RDS Performance Insights and CloudWatch Logs'
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: 'Enable IAM User Permissions'
            Effect: 'Allow'
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: 'Allow CloudWatch Logs'
            Effect: 'Allow'
            Principal:
              Service: !Sub 'logs.${AWS::Region}.amazonaws.com'
            Action:
              - 'kms:Encrypt*'
              - 'kms:Decrypt*'
              - 'kms:ReEncrypt*'
              - 'kms:GenerateDataKey*'
              - 'kms:Describe*'
            Resource: '*'

  # ==========================================
  # KROK 1: VPC & SIECI
  # ==========================================
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Ref StackName

  VPCFlowLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain #  I3011
    UpdateReplacePolicy: Retain #  I3011
    Properties:
      RetentionInDays: 14
      KmsKeyId: !GetAtt PIKmsKey.Arn

  VPCFlowLogRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: vpc-flow-logs.amazonaws.com
            Action: sts:AssumeRole

  VPCFlowLogPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: flowlogs-policy
      Roles:
        - !Ref VPCFlowLogRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
              - logs:DescribeLogStreams
            Resource: !GetAtt VPCFlowLogGroup.Arn

  VPCFlowLog:
    Type: AWS::EC2::FlowLog
    Properties:
      ResourceType: VPC
      ResourceId: !Ref VPC
      TrafficType: ALL
      LogDestinationType: cloud-watch-logs
      LogDestination: !GetAtt VPCFlowLogGroup.Arn
      DeliverLogsPermissionArn: !GetAtt VPCFlowLogRole.Arn

  InternetGateway:
    Type: AWS::EC2::InternetGateway
  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # Podsieci Publiczne
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false

  # Podsieci Prywatne APP
  PrivateAppSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.10.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false #  SUBNET_AUTO_ASSIGN_PUBLIC_IP_DISABLED

  PrivateAppSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.11.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false #  SUBNET_AUTO_ASSIGN_PUBLIC_IP_DISABLED

  # Podsieci Prywatne DB
  PrivateDBSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.21.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false #  SUBNET_AUTO_ASSIGN_PUBLIC_IP_DISABLED

  PrivateDBSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.22.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false #  SUBNET_AUTO_ASSIGN_PUBLIC_IP_DISABLED

  # NAT Gateways i EIPs
  NatEipA:
    Type: AWS::EC2::EIP
    Properties: { Domain: vpc }
  NatGatewayA:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEipA.AllocationId
      SubnetId: !Ref PublicSubnetA
  NatEipB:
    Type: AWS::EC2::EIP
    Properties: { Domain: vpc }
  NatGatewayB:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEipB.AllocationId
      SubnetId: !Ref PublicSubnetB

  # Tabele routingu
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref VPC }

  PublicRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PubSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnetA, RouteTableId: !Ref PublicRouteTable }
  PubSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnetB, RouteTableId: !Ref PublicRouteTable }

  PrivateRouteTableA:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref VPC }
  PrivateRouteA:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTableA
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGatewayA
  PrivAppSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateAppSubnetA, RouteTableId: !Ref PrivateRouteTableA }

  PrivateRouteTableB:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref VPC }
  PrivateRouteB:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTableB
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGatewayB
  PrivAppSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateAppSubnetB, RouteTableId: !Ref PrivateRouteTableB }

  # ==========================================
  # KROK 2: SECURITY GROUPS
  # ==========================================
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Enable HTTP and HTTPS from Internet
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: 'Allow public HTTPS traffic to ALB'
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: 'Allow public HTTP traffic to ALB for secure redirection'

  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Enable HTTP from ALB
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !GetAtt ALBSecurityGroup.GroupId
          Description: 'Allow HTTP traffic from ALB to EC2'

  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Enable MySQL from EC2
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !GetAtt EC2SecurityGroup.GroupId
          Description: 'Allow MySQL traffic from EC2 to RDS'

  EFSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Enable NFS from EC2
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId: !GetAtt EC2SecurityGroup.GroupId
          Description: 'Allow NFS traffic from EC2 to EFS'

  # ==========================================
  # KROK 3: BAZA DANYCH (RDS)
  # ==========================================
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnet group for RDS
      SubnetIds:
        - !Ref PrivateDBSubnetA
        - !Ref PrivateDBSubnetB

  DBInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot #  I3011
    UpdateReplacePolicy: Snapshot #  I3011
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            - W1011 #  W1011: Safely suppress Secrets Manager warning for this lab parameter
    Properties:
      Engine: mysql
      DBInstanceClass: db.t3.medium
      AllocatedStorage: 20
      DBName: !Ref DBName
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      MultiAZ: true
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !GetAtt RDSSecurityGroup.GroupId
      PubliclyAccessible: false
      StorageEncrypted: true
      BackupRetentionPeriod: 7
      EnableIAMDatabaseAuthentication: true
      DeletionProtection: true
      EnablePerformanceInsights: true
      PerformanceInsightsKMSKeyId: !GetAtt PIKmsKey.Arn
      AutoMinorVersionUpgrade: true #  RDS_AUTOMATIC_MINOR_VERSION_UPGRADE_ENABLED

  # ==========================================
  # KROK 4: SYSTEM PLIKÓW (EFS)
  # ==========================================
  FileSystem:
    Type: AWS::EFS::FileSystem
    DeletionPolicy: Retain #  I3011
    UpdateReplacePolicy: Retain #  I3011
    Properties:
      PerformanceMode: generalPurpose
      Encrypted: true

  MountTargetA:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref FileSystem
      SubnetId: !Ref PrivateAppSubnetA
      SecurityGroups:
        - !GetAtt EFSSecurityGroup.GroupId

  MountTargetB:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref FileSystem
      SubnetId: !Ref PrivateAppSubnetB
      SecurityGroups:
        - !GetAtt EFSSecurityGroup.GroupId

  # ==========================================
  # KROK 5: IAM & LAUNCH TEMPLATE (EC2)
  # ==========================================
  LabRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  LabInstanceProfileDefinition:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref LabRole

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
        InstanceType: t3.medium
        IamInstanceProfile:
          Arn: !GetAtt LabInstanceProfileDefinition.Arn
        SecurityGroupIds:
          - !GetAtt EC2SecurityGroup.GroupId
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            dnf update -y
            dnf install -y httpd wget php-fpm php-mysqli php-json php php-devel php-xml php-gd php-mbstring php-intl amazon-efs-utils
            systemctl enable httpd php-fpm

            # Mount EFS to the ENTIRE html directory
            mount -t efs ${FileSystem}:/ /var/www/html/
            echo "${FileSystem}:/ /var/www/html/ efs _netdev,tls 0 0" >> /etc/fstab

            # Only download and extract WP if it is not already on the EFS drive
            if [ ! -f /var/www/html/wp-login.php ]; then
                cd /tmp
                wget https://wordpress.org/latest.tar.gz
                tar -xzf latest.tar.gz
                cp -r wordpress/* /var/www/html/

                # Apply the article's method inside core files
                if [ -f /var/www/html/wp-config-sample.php ]; then
                    sed -i "/<?php/a \\\n@ini_set( 'upload_max_size' , '512M' );\n@ini_set( 'post_max_size', '512M' );\n@ini_set( 'memory_limit', '512M' );\n@ini_set( 'max_execution_time', '600' );" /var/www/html/wp-config-sample.php
                fi

                chown -R apache:apache /var/www/html/
            fi

            # Handle dynamic configuration adjustments safely
            if [ -f /var/www/html/wp-config.php ] && ! grep -q "upload_max_size" /var/www/html/wp-config.php; then
                sed -i "/<?php/a \\\n@ini_set( 'upload_max_size' , '512M' );\n@ini_set( 'post_max_size', '512M' );\n@ini_set( 'memory_limit', '512M' );\n@ini_set( 'max_execution_time', '600' );" /var/www/html/wp-config.php
            fi

            systemctl start php-fpm
            systemctl start httpd

  # ==========================================
  # KROK 6: ACM, ALB I AUTO SCALING
  # ==========================================
  AutoACMCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref MyHostedZone

  # trivy:ignore:aws-0053
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      SecurityGroups:
        - !GetAtt ALBSecurityGroup.GroupId
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'

  ALBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VPC
      Port: 80
      Protocol: HTTP
      HealthCheckPath: /wp-admin/install.php
      TargetType: instance

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref AutoACMCertificate
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ALBTargetGroup

  ALBHttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: '443'
            StatusCode: HTTP_301

  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      VPCZoneIdentifier:
        - !Ref PrivateAppSubnetA
        - !Ref PrivateAppSubnetB
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      MinSize: '2'
      MaxSize: '4'
      DesiredCapacity: '2'
      TargetGroupARNs:
        - !Ref ALBTargetGroup
    DependsOn:
      - MountTargetA
      - MountTargetB

  ScalingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref AutoScalingGroup
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        TargetValue: 50.0

  # ==========================================
  # KROK 7: AUTOMATYZACJA DNS ROUTE 53
  # ==========================================
  RootDNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref MyHostedZone
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        HostedZoneId: !GetAtt ApplicationLoadBalancer.CanonicalHostedZoneID
        DNSName: !GetAtt ApplicationLoadBalancer.DNSName
        EvaluateTargetHealth: true

  WwwDNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref MyHostedZone
      Name: !Sub 'www.${DomainName}'
      Type: A
      AliasTarget:
        HostedZoneId: !GetAtt ApplicationLoadBalancer.CanonicalHostedZoneID
        DNSName: !GetAtt ApplicationLoadBalancer.DNSName
        EvaluateTargetHealth: true

Outputs:
  WebsiteURL:
    Description: Adres URL sklepu WordPress
    Value: !Sub 'https://${DomainName}'
  RDSEndpoint:
    Description: Endpoint bazy danych MySQL
    Value: !GetAtt DBInstance.Endpoint.Address
  DatabaseName:
    Description: Wygenerowana nazwa bazy danych
    Value: !Ref DBName
  NewHostedZoneID:
    Description: Wygenerowany identyfikator strefy Route 53
    Value: !Ref MyHostedZone
  HomePlNameServers:
    Description: Przepisz te 4 serwery nazw do swojego panelu hostingu!
    Value: !Join [", ", !GetAtt MyHostedZone.NameServers]