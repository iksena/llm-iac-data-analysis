    UserServiceTaskDefinition:
        Type: "AWS::ECS::TaskDefinition"
        Properties:
            ContainerDefinitions:
              -
                Cpu: 1024
                Environment:
                  -
                    Name: "SPRING_PROFILES_ACTIVE"
                    Value: !Ref Environment
                Essential: true
                HealthCheck:
                    Command:
                      - "CMD-SHELL"
                      - "curl -f http://localhost:8080/api/user/v1/actuator/health || exit 1"
                    Interval: 30
                    Timeout: 5
                    Retries: 3
                    StartPeriod: 300
                Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ProjectName}-user-service/${Environment}:latest"
                LogConfiguration:
                    LogDriver: "awslogs"
                    Options:
                        awslogs-group: !Sub "${ProjectName}-microservices-${Environment}"
                        awslogs-region: !Ref AWS::Region
                        awslogs-stream-prefix: "user-service"
                Memory: 2048
                Name: !Sub "${ProjectNameUpper}-UserService"
                PortMappings:
                  -
                    ContainerPort: 8080
                    HostPort: 8080
                    Protocol: "tcp"
            Family: !Sub "${ProjectName}-user-service-${Environment}"
            TaskRoleArn: !Ref ECSTaskRole
            ExecutionRoleArn: !Ref ECSExecutionRole
            NetworkMode: "awsvpc"
            RequiresCompatibilities:
              - "EC2"
              - "FARGATE"
            Cpu: "1024"
            Memory: "2048"

