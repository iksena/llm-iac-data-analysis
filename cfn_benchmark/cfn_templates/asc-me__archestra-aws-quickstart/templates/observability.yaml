AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Archestra Observability — Amazon Managed Prometheus (AMP) workspace,
  ADOT Collector configuration, and Amazon Managed Grafana (AMG) workspace.

Parameters:
  EnvironmentName:
    Type: String

Resources:
  # ---------- Amazon Managed Prometheus ----------
  PrometheusWorkspace:
    Type: AWS::APS::Workspace
    Properties:
      Alias: !Sub "${EnvironmentName}-metrics"
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-amp"

  # ---------- Amazon Managed Grafana ----------
  GrafanaWorkspace:
    Type: AWS::Grafana::Workspace
    Properties:
      Name: !Sub "${EnvironmentName}-dashboards"
      AccountAccessType: CURRENT_ACCOUNT
      AuthenticationProviders:
        - AWS_SSO
      PermissionType: SERVICE_MANAGED
      DataSources:
        - PROMETHEUS
      RoleArn: !GetAtt GrafanaRole.Arn
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-amg"

  GrafanaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-grafana"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: grafana.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: PrometheusRead
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - aps:QueryMetrics
                  - aps:GetSeries
                  - aps:GetLabels
                  - aps:GetMetricMetadata
                  - aps:ListWorkspaces
                  - aps:DescribeWorkspace
                Resource: "*"

  # ---------- ADOT Collector IAM Role (for IRSA) ----------
  AdotCollectorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-adot-collector"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PrometheusWrite
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - aps:RemoteWrite
                Resource: !Sub "${PrometheusWorkspace.Arn}"

Outputs:
  PrometheusWorkspaceId:
    Value: !Ref PrometheusWorkspace
    Export:
      Name: !Sub "${EnvironmentName}-PrometheusWorkspaceId"

  PrometheusEndpoint:
    Value: !GetAtt PrometheusWorkspace.PrometheusEndpoint
    Export:
      Name: !Sub "${EnvironmentName}-PrometheusEndpoint"

  GrafanaWorkspaceUrl:
    Value: !GetAtt GrafanaWorkspace.Endpoint
    Export:
      Name: !Sub "${EnvironmentName}-GrafanaUrl"

  AdotCollectorRoleArn:
    Value: !GetAtt AdotCollectorRole.Arn
    Export:
      Name: !Sub "${EnvironmentName}-AdotCollectorRoleArn"

  AdotCollectorEndpoint:
    Description: OTEL endpoint for Archestra to send traces/metrics to
    Value: !Sub "http://adot-collector.adot-system.svc.cluster.local:4318/v1/traces"
    Export:
      Name: !Sub "${EnvironmentName}-AdotCollectorEndpoint"