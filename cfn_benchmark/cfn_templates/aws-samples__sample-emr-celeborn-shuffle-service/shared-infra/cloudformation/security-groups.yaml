AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Security groups for inter-cluster traffic between EMR (EKS and EC2) and Celeborn
  within the shared VPC. EMR on EC2 managed SGs are auto-created by EMR at cluster launch.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Network Configuration
        Parameters:
          - ProjectName

Parameters:
  ProjectName:
    Type: String
    Default: emr-celeborn-demo
    Description: Project name used to import VPC exports and for tagging

Resources:
  # --- Celeborn Master Security Group ---

  CelebornMasterSg:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W27
            reason: "Port range 9097-9098 covers exactly two Celeborn ports (RPC and dashboard). Single-port rules are not feasible; both ports are required and the range is intentionally narrow."
          - id: W5
            reason: "HTTPS egress (port 443) to 0.0.0.0/0 is required for EKS API, ECR image pulls, and AWS service endpoints. Ingress is tightly restricted to specific security groups."
          - id: W29
            reason: "Port range 9097-9098 covers exactly the two required Celeborn ports (RPC and dashboard). Single-port rules are not feasible for this intentionally narrow two-port range."
      guard:
        SuppressedRules:
          - SECURITY_GROUP_MISSING_EGRESS_RULE: "Egress rules are defined as separate AWS::EC2::SecurityGroupEgress resources (CelebornMasterEgressToWorkers, CelebornMasterEgressHttps). Inline egress is not used to avoid circular dependency with CelebornWorkerSg."
          - SECURITY_GROUP_EGRESS_PORT_RANGE_RULE: "Port range 1024-65535 is required for control traffic to Celeborn workers on dynamic ports. The range cannot be narrowed further."
          - SECURITY_GROUP_INGRESS_PORT_RANGE_RULE: "Port range 9097-9098 is an intentionally narrow two-port range covering exactly the required Celeborn RPC and dashboard ports."
    Properties:
      GroupDescription: Security group for Celeborn master nodes - allows RPC and dashboard access from private subnets
      VpcId: !ImportValue
        Fn::Sub: "${ProjectName}-VpcId"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-celeborn-master-sg"
        - Key: Project
          Value: !Ref ProjectName

  CelebornMasterRpcFromEmr:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref CelebornMasterSg
      Description: Celeborn RPC from EMR nodes
      IpProtocol: tcp
      FromPort: 9097
      ToPort: 9097
      SourceSecurityGroupId: !Ref EmrCelebornAccessSg

  CelebornMasterRpcFromWorkers:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref CelebornMasterSg
      Description: Celeborn RPC from Celeborn workers
      IpProtocol: tcp
      FromPort: 9097
      ToPort: 9097
      SourceSecurityGroupId: !Ref CelebornWorkerSg

  CelebornMasterDashboardFromEmr:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref CelebornMasterSg
      Description: Celeborn dashboard from EMR nodes
      IpProtocol: tcp
      FromPort: 9098
      ToPort: 9098
      SourceSecurityGroupId: !Ref EmrCelebornAccessSg

  CelebornMasterDashboardFromWorkers:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref CelebornMasterSg
      Description: Celeborn dashboard from Celeborn workers
      IpProtocol: tcp
      FromPort: 9098
      ToPort: 9098
      SourceSecurityGroupId: !Ref CelebornWorkerSg

  # NLB health checks originate from NLB node IPs in the VPC private subnets.
  # These IPs do not carry any security group, so we must allow by VPC CIDR.
  CelebornMasterNlbHealthCheck:
    Type: AWS::EC2::SecurityGroupIngress
    Metadata:
      guard:
        SuppressedRules:
          - SECURITY_GROUP_INGRESS_PORT_RANGE_RULE: "Port range 9097-9098 is an intentionally narrow two-port range covering exactly the required Celeborn RPC and dashboard ports for NLB health checks."
    Properties:
      GroupId: !Ref CelebornMasterSg
      Description: NLB health checks and internal NLB traffic from VPC CIDR
      IpProtocol: tcp
      FromPort: 9097
      ToPort: 9098
      CidrIp: !ImportValue
        Fn::Sub: "${ProjectName}-VpcCidr"

  # --- Celeborn Worker Security Group ---

  CelebornWorkerSg:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W27
            reason: "Port range 1024-65535 is required for Celeborn's dynamic shuffle data ports. Celeborn workers bind on ephemeral ports in this range and the exact ports are not known at deploy time."
          - id: W29
            reason: "Port range 1024-65535 is required for Celeborn's dynamic shuffle data ports. Celeborn workers bind on ephemeral ports in this range and the exact ports are not known at deploy time."
          - id: W5
            reason: "HTTPS egress (port 443) to 0.0.0.0/0 is required for EKS API, ECR image pulls, and AWS service endpoints. Ingress is tightly restricted to specific security groups."
      guard:
        SuppressedRules:
          - SECURITY_GROUP_MISSING_EGRESS_RULE: "Egress rules are defined as separate AWS::EC2::SecurityGroupEgress resources (CelebornWorkerEgressToMaster, CelebornWorkerEgressToEmr, CelebornWorkerEgressSelf, CelebornWorkerEgressHttps). Inline egress is not used to avoid circular dependency."
          - SECURITY_GROUP_EGRESS_PORT_RANGE_RULE: "Port range 1024-65535 is required for Celeborn dynamic shuffle data ports. The range cannot be narrowed as exact ports are assigned at runtime."
          - SECURITY_GROUP_INGRESS_PORT_RANGE_RULE: "Port range 1024-65535 is required for Celeborn dynamic shuffle data ports from Spark executors. The range cannot be narrowed as exact ports are assigned at runtime."
    Properties:
      GroupDescription: Security group for Celeborn worker nodes - allows shuffle data traffic from EMR executors
      VpcId: !ImportValue
        Fn::Sub: "${ProjectName}-VpcId"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-celeborn-worker-sg"
        - Key: Project
          Value: !Ref ProjectName

  CelebornWorkerFromEmr:
    Type: AWS::EC2::SecurityGroupIngress
    Metadata:
      guard:
        SuppressedRules:
          - SECURITY_GROUP_INGRESS_PORT_RANGE_RULE: "Port range 1024-65535 is required for Celeborn dynamic shuffle data ports. Exact ports are assigned at runtime and cannot be known at deploy time."
    Properties:
      GroupId: !Ref CelebornWorkerSg
      Description: Shuffle data from EMR Spark executors
      IpProtocol: tcp
      FromPort: 1024
      ToPort: 65535
      SourceSecurityGroupId: !Ref EmrCelebornAccessSg

  CelebornWorkerFromMaster:
    Type: AWS::EC2::SecurityGroupIngress
    Metadata:
      guard:
        SuppressedRules:
          - SECURITY_GROUP_INGRESS_PORT_RANGE_RULE: "Port range 1024-65535 is required for Celeborn master-to-worker control traffic on dynamic ports. Exact ports are assigned at runtime."
    Properties:
      GroupId: !Ref CelebornWorkerSg
      Description: Control traffic from Celeborn master
      IpProtocol: tcp
      FromPort: 1024
      ToPort: 65535
      SourceSecurityGroupId: !Ref CelebornMasterSg

  CelebornWorkerSelfIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Metadata:
      guard:
        SuppressedRules:
          - SECURITY_GROUP_INGRESS_PORT_RANGE_RULE: "Port range 1024-65535 is required for Celeborn worker-to-worker communication on dynamic ports. Exact ports are assigned at runtime."
    Properties:
      GroupId: !Ref CelebornWorkerSg
      Description: Worker-to-worker communication
      IpProtocol: tcp
      FromPort: 1024
      ToPort: 65535
      SourceSecurityGroupId: !Ref CelebornWorkerSg

  # --- EMR Node Security Group ---

  EmrCelebornAccessSg:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W5
            reason: "Allow-all egress is required for EMR Spark executors to reach Celeborn workers on dynamically assigned shuffle ports. Ingress is strictly controlled by Celeborn security group rules. This is a blog post demonstration."
          - id: W27
            reason: "Port range 1024-65535 is required for Spark executor-to-executor and driver-to-executor communication on dynamic ports."
          - id: W40
            reason: "IpProtocol -1 (all traffic) egress is required for EMR Spark executors to reach Celeborn workers on dynamically assigned shuffle ports. Ingress is strictly controlled by Celeborn security group rules. This is a blog post demonstration."
      guard:
        SuppressedRules:
          - SECURITY_GROUP_MISSING_EGRESS_RULE: "Egress is defined as a separate AWS::EC2::SecurityGroupEgress resource (EmrCelebornAccessEgressAll) allowing all outbound traffic. Inline egress is not used to keep the resource definition clean."
          - SECURITY_GROUP_EGRESS_ALL_PROTOCOLS_RULE: "All-protocol egress (IpProtocol -1) is required for EMR Spark executors to reach Celeborn workers on dynamically assigned shuffle ports. Ingress is strictly controlled by Celeborn SG rules."
          - SECURITY_GROUP_EGRESS_PORT_RANGE_RULE: "Port range 1024-65535 on self-referencing ingress is required for Spark driver-executor communication on dynamic ports."
          - SECURITY_GROUP_INGRESS_PORT_RANGE_RULE: "Port range 1024-65535 is required for Spark executor-to-executor and Celeborn-worker-to-executor communication on dynamic ports."
    Properties:
      GroupDescription: Security group for EMR Spark driver and executor nodes - allows self-referencing and Celeborn access
      VpcId: !ImportValue
        Fn::Sub: "${ProjectName}-VpcId"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-emr-celeborn-access-sg"
        - Key: Project
          Value: !Ref ProjectName

  EmrCelebornAccessSelfIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Metadata:
      guard:
        SuppressedRules:
          - SECURITY_GROUP_INGRESS_PORT_RANGE_RULE: "Port range 1024-65535 is required for Spark driver-to-executor and executor-to-executor communication on dynamic ports. Exact ports are assigned at runtime."
    Properties:
      GroupId: !Ref EmrCelebornAccessSg
      Description: Spark driver to executor and executor to executor communication
      IpProtocol: tcp
      FromPort: 1024
      ToPort: 65535
      SourceSecurityGroupId: !Ref EmrCelebornAccessSg

  EmrCelebornAccessFromCelebornWorker:
    Type: AWS::EC2::SecurityGroupIngress
    Metadata:
      guard:
        SuppressedRules:
          - SECURITY_GROUP_INGRESS_PORT_RANGE_RULE: "Port range 1024-65535 is required for Celeborn worker shuffle data responses to EMR executors on dynamic ports. Exact ports are assigned at runtime."
    Properties:
      GroupId: !Ref EmrCelebornAccessSg
      Description: Shuffle data responses from Celeborn workers
      IpProtocol: tcp
      FromPort: 1024
      ToPort: 65535
      SourceSecurityGroupId: !Ref CelebornWorkerSg

  # --- Egress Rules ---
  # Explicit egress rules for inter-cluster traffic. Default allow-all egress
  # is removed when any explicit egress rule is added, so we also allow HTTPS
  # outbound for EKS API, ECR image pulls, and AWS service endpoints.

  CelebornMasterEgressToWorkers:
    Type: AWS::EC2::SecurityGroupEgress
    Metadata:
      guard:
        SuppressedRules:
          - SECURITY_GROUP_EGRESS_PORT_RANGE_RULE: "Port range 1024-65535 is required for Celeborn master control traffic to workers on dynamic ports. Exact ports are assigned at runtime."
    Properties:
      GroupId: !Ref CelebornMasterSg
      Description: Control traffic to Celeborn workers
      IpProtocol: tcp
      FromPort: 1024
      ToPort: 65535
      DestinationSecurityGroupId: !Ref CelebornWorkerSg

  CelebornMasterEgressHttps:
    Type: AWS::EC2::SecurityGroupEgress
    Metadata:
      guard:
        SuppressedRules:
          - EC2_SECURITY_GROUP_EGRESS_OPEN_TO_WORLD_RULE: "HTTPS (port 443) egress to 0.0.0.0/0 is required for EKS API, ECR image pulls, and AWS service endpoints. Traffic is limited to a single port (443)."
    Properties:
      GroupId: !Ref CelebornMasterSg
      Description: HTTPS outbound for AWS APIs and image pulls
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: "0.0.0.0/0"

  CelebornWorkerEgressToMaster:
    Type: AWS::EC2::SecurityGroupEgress
    Metadata:
      guard:
        SuppressedRules:
          - SECURITY_GROUP_EGRESS_PORT_RANGE_RULE: "Port range 9097-9098 is an intentionally narrow two-port range covering exactly the required Celeborn RPC and dashboard ports."
    Properties:
      GroupId: !Ref CelebornWorkerSg
      Description: RPC and dashboard to Celeborn master
      IpProtocol: tcp
      FromPort: 9097
      ToPort: 9098
      DestinationSecurityGroupId: !Ref CelebornMasterSg

  CelebornWorkerEgressToEmr:
    Type: AWS::EC2::SecurityGroupEgress
    Metadata:
      guard:
        SuppressedRules:
          - SECURITY_GROUP_EGRESS_PORT_RANGE_RULE: "Port range 1024-65535 is required for Celeborn shuffle data responses to EMR executors on dynamic ports. Exact ports are assigned at runtime."
    Properties:
      GroupId: !Ref CelebornWorkerSg
      Description: Shuffle data responses to EMR nodes
      IpProtocol: tcp
      FromPort: 1024
      ToPort: 65535
      DestinationSecurityGroupId: !Ref EmrCelebornAccessSg

  CelebornWorkerEgressSelf:
    Type: AWS::EC2::SecurityGroupEgress
    Metadata:
      guard:
        SuppressedRules:
          - SECURITY_GROUP_EGRESS_PORT_RANGE_RULE: "Port range 1024-65535 is required for Celeborn worker-to-worker communication on dynamic ports. Exact ports are assigned at runtime."
    Properties:
      GroupId: !Ref CelebornWorkerSg
      Description: Worker-to-worker communication
      IpProtocol: tcp
      FromPort: 1024
      ToPort: 65535
      DestinationSecurityGroupId: !Ref CelebornWorkerSg

  CelebornWorkerEgressHttps:
    Type: AWS::EC2::SecurityGroupEgress
    Metadata:
      guard:
        SuppressedRules:
          - EC2_SECURITY_GROUP_EGRESS_OPEN_TO_WORLD_RULE: "HTTPS (port 443) egress to 0.0.0.0/0 is required for EKS API, ECR image pulls, and AWS service endpoints. Traffic is limited to a single port (443)."
    Properties:
      GroupId: !Ref CelebornWorkerSg
      Description: HTTPS outbound for AWS APIs and image pulls
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: "0.0.0.0/0"

  EmrCelebornAccessEgressAll:
    Type: AWS::EC2::SecurityGroupEgress
    Metadata:
      guard:
        SuppressedRules:
          - EC2_SECURITY_GROUP_EGRESS_OPEN_TO_WORLD_RULE: "All-protocol egress to 0.0.0.0/0 is required for EMR Spark executors to reach Celeborn workers on dynamically assigned shuffle ports. Ingress is strictly controlled by Celeborn SG rules."
          - SECURITY_GROUP_EGRESS_ALL_PROTOCOLS_RULE: "IpProtocol -1 is required for EMR Spark executors to reach Celeborn workers on dynamically assigned shuffle ports. Ingress is strictly controlled by Celeborn SG rules."
    Properties:
      GroupId: !Ref EmrCelebornAccessSg
      Description: Allow all outbound traffic (ingress rules on Celeborn SGs control access)
      IpProtocol: "-1"
      CidrIp: "0.0.0.0/0"

  # --- EMR on EC2 Managed Security Groups ---
  # EMR auto-creates default managed SGs (ElasticMapReduce-Primary-Private,
  # ElasticMapReduce-Core-Private, ElasticMapReduce-ServiceAccess) with all
  # required intra-cluster and service access rules. We do NOT pre-create
  # these — EMR manages them entirely. Only EmrCelebornAccessSg (above) is
  # attached as an additional SG for Celeborn connectivity.

Outputs:
  CelebornMasterSgId:
    Description: Security group ID for Celeborn master nodes
    Value: !Ref CelebornMasterSg
    Export:
      Name: !Sub "${ProjectName}-CelebornMasterSgId"

  CelebornWorkerSgId:
    Description: Security group ID for Celeborn worker nodes
    Value: !Ref CelebornWorkerSg
    Export:
      Name: !Sub "${ProjectName}-CelebornWorkerSgId"

  EmrCelebornAccessSgId:
    Description: Security group ID for EMR Spark nodes
    Value: !Ref EmrCelebornAccessSg
    Export:
      Name: !Sub "${ProjectName}-EmrCelebornAccessSgId"