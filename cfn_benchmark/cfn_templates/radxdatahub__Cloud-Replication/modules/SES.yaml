# Should be rescanned on us-west-2
AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Last Modified: 2025/09/30 14:48:53
  "This template deploys the NIH RADx Data Hub SES Services."
Parameters:
  Environment:
    Type: String
    Description: The Project Environment
    AllowedValues:
      - dev
      - test
      - prod
      - shared
  ProjectName:
    Type: String
    Description: The Project name
    Default: radx
    AllowedValues:
      - radx

Conditions:
  DEV: !Equals [!Ref Environment, dev]
  TEST: !Equals [!Ref Environment, test]
  PROD: !Equals [!Ref Environment, prod]
  NOTDEV: !Not [!Equals [!Ref Environment, dev]]
  NOTPROD: !Not [!Equals [!Ref Environment, prod]]

Resources:
    RadxDataHubEmailIdentity:
        Type: "AWS::SES::EmailIdentity"
        Properties:
            EmailIdentity: "radx-datahub@nih.gov"
            DkimAttributes:
                SigningEnabled: true
            MailFromAttributes:
                BehaviorOnMxFailure: "USE_DEFAULT_VALUE"
            ConfigurationSetAttributes: {}
            FeedbackAttributes:
                EmailForwardingEnabled: true

    RadxDataHubDevEmailIdentity:
        Type: "AWS::SES::EmailIdentity"
        Properties:
            EmailIdentity: "radx.datahub.dev@gmail.com"
            DkimAttributes:
                SigningEnabled: false
            MailFromAttributes:
                BehaviorOnMxFailure: "USE_DEFAULT_VALUE"
            ConfigurationSetAttributes: {}
            FeedbackAttributes:
                EmailForwardingEnabled: true

    NihGovEmailIdentity:
        Type: "AWS::SES::EmailIdentity"
        Properties:
            EmailIdentity: "nih.gov"
            DkimAttributes:
                SigningEnabled: true
            MailFromAttributes:
                BehaviorOnMxFailure: "USE_DEFAULT_VALUE"
            ConfigurationSetAttributes: {}
            FeedbackAttributes:
                EmailForwardingEnabled: true