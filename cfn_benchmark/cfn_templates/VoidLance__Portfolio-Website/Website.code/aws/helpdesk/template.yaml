AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Portfolio website helpdesk backend powered by Lambda, API Gateway, DynamoDB and SES.

Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 15
    MemorySize: 512
    Architectures:
      - x86_64

Parameters:
  HelpdeskFromEmail:
    Type: String
    Description: Verified SES sender address used for outbound helpdesk emails.
  HelpdeskNotificationEmails:
    Type: String
    Default: ''
    Description: Comma-separated addresses that should receive new-ticket notifications.
  HelpdeskAppUrl:
    Type: String
    Default: https://alistairsweeting.online/#/helpdesk/admin
    Description: URL to the admin dashboard, included in notification emails.

Resources:
  HelpdeskTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  HelpdeskApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowOrigins:
          - '*'

  HelpdeskAdminUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: portfolio-helpdesk-admins
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: email
          Mutable: true
          Required: true
        - Name: name
          Mutable: true
          Required: false

  HelpdeskAdminUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: portfolio-helpdesk-admin-client
      UserPoolId: !Ref HelpdeskAdminUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED

  HelpdeskApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/api.handler
      Environment:
        Variables:
          HELP_DESK_TABLE_NAME: !Ref HelpdeskTable
          HELP_DESK_FROM_EMAIL: !Ref HelpdeskFromEmail
          HELP_DESK_NOTIFICATION_EMAILS: !Ref HelpdeskNotificationEmails
          HELP_DESK_APP_URL: !Ref HelpdeskAppUrl
          COGNITO_CLIENT_ID: !Ref HelpdeskAdminUserPoolClient
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref HelpdeskTable
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: '*'
            - Effect: Allow
              Action:
                - cognito-idp:InitiateAuth
                - cognito-idp:GetUser
                - cognito-idp:ChangePassword
              Resource: !GetAtt HelpdeskAdminUserPool.Arn
      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref HelpdeskApi
            Path: /
            Method: ANY
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HelpdeskApi
            Path: /{proxy+}
            Method: ANY

Outputs:
  HelpdeskApiUrl:
    Description: Base URL for the helpdesk frontend.
    Value: !Sub https://${HelpdeskApi}.execute-api.${AWS::Region}.amazonaws.com
  HelpdeskTableName:
    Description: DynamoDB table storing tickets and replies.
    Value: !Ref HelpdeskTable
  HelpdeskAdminUserPoolId:
    Description: Cognito User Pool ID for helpdesk admins.
    Value: !Ref HelpdeskAdminUserPool
  HelpdeskAdminUserPoolClientId:
    Description: Cognito App Client ID for helpdesk admin login.
    Value: !Ref HelpdeskAdminUserPoolClient