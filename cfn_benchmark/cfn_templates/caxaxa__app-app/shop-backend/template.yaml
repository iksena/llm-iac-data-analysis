AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Worker Appointment Scheduling – single-table, multi-tenant backend
# GitHub Actions test - 2025-08-14

##############################################################################
# Parameters – IDs of your already-existing Cognito pool + client
##############################################################################

Parameters:
  ExistingUserPoolId:
    Type: String
    Description: Your existing Cognito User Pool ID

  ExistingUserPoolClientId:
    Type: String
    Description: Your existing Cognito User Pool Client ID

  EvoBaseUrl:
    Type: String
    Description: Base URL of your Evolution-API cluster

  EvoApiKey:
    Type: String
    NoEcho: true
    Description: API key for Evolution-API

  CorsAllowedOrigins:
    Type: String
    Description: Comma-separated list of allowed CORS origins
    Default: "http://localhost:3000"

  OpenAiApiKey:
    Type: String
    NoEcho: true
    Description: OpenAI API key for chat functionality (optional)
    Default: ""

  GoogleClientId:
    Type: String
    Description: Google OAuth 2.0 Client ID for Calendar integration
    Default: ""

  GoogleClientSecret:
    Type: String
    NoEcho: true
    Description: Google OAuth 2.0 Client Secret for Calendar integration
    Default: ""

  GoogleRedirectUri:
    Type: String
    Description: Google OAuth 2.0 redirect URI
    Default: ""

  FrontendBaseUrl:
    Type: String
    Description: Frontend base URL for OAuth redirects
    Default: ""

  StripeSecretKey:
    Type: String
    NoEcho: true
    Description: Stripe secret key for payment processing
    Default: ""

  StripePublishableKey:
    Type: String
    Description: Stripe publishable key for frontend
    Default: ""

  StripeWebhookSecret:
    Type: String
    NoEcho: true
    Description: Stripe webhook endpoint secret (set after creating webhook in Stripe)
    Default: ""

  StripeMonthlyPriceId:
    Type: String
    Description: Stripe price ID for monthly subscription
    Default: ""

  StripeAnnualPriceId:
    Type: String
    Description: Stripe price ID for annual subscription
    Default: ""

##########################################################################
# Resources
##########################################################################

Resources:

##############################################################################
# 1)  Authenticated HTTP API (Cognito)  – existing admin / dashboard API
##############################################################################

  WorkerHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: Prod
      CorsConfiguration:
        AllowOrigins: !Split [",", !Ref CorsAllowedOrigins]
        AllowMethods: ["OPTIONS", "GET", "POST", "PUT", "DELETE"]
        AllowHeaders: ["*"]
      Auth:
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              Issuer:   !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${ExistingUserPoolId}"
              Audience: [!Ref ExistingUserPoolClientId]

##############################################################################
# 2)  Public REST API  (share-link + WhatsApp) – API-Key protected
##############################################################################

  AppPublicApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      EndpointConfiguration: REGIONAL
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,x-api-key,x-correlation-id'"
        AllowOrigin: "'*'"

  AppPublicApiKey:
    Type: AWS::ApiGateway::ApiKey
    DependsOn: AppPublicApiProdStage
    Properties:
      Enabled: true
      Name: !Sub "${AWS::StackName}-public-booking-key"
      StageKeys:
        - RestApiId: !Ref AppPublicApi
          StageName: Prod

  PublicApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: public.handler
      Runtime: python3.12
      MemorySize: 256
      Timeout: 15
      Environment:
        Variables:
          APPOINTMENTS_TABLE: !Ref AppointmentsTable
          WORKERS_TABLE:      !Ref WorkersTable
          CONFIGS_TABLE:      !Ref ConfigsTable
          CONTACTS_TABLE:     !Ref ContactsTable
          IDEMPOTENCY_KEYS_TABLE: !Ref IdempotencyKeysTable
          CORS_ALLOWED_ORIGINS: !Ref CorsAllowedOrigins
          OPENAI_API_KEY:     !Ref OpenAiApiKey
          GCAL_SHOP_SYNC_FUNCTION: !Ref GoogleCalendarShopSync
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref AppointmentsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref WorkersTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ConfigsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ContactsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref IdempotencyKeysTable }
        - Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !GetAtt GoogleCalendarShopSync.Arn
      Events:
        PublicConfig:
          Type: Api
          Properties:
            RestApiId: !Ref AppPublicApi
            Path:   /public/config
            Method: GET
        PublicWorkers:
          Type: Api
          Properties:
            RestApiId: !Ref AppPublicApi
            Path:   /public/workers
            Method: GET
        PublicAppointments:
          Type: Api
          Properties:
            RestApiId: !Ref AppPublicApi
            Path:   /public/appointments
            Method: GET
        PublicBook:
          Type: Api
          Properties:
            RestApiId: !Ref AppPublicApi
            Path:   /public/appointments/book
            Method: POST
        PublicAvailableSlots:
          Type: Api
          Properties:
            RestApiId: !Ref AppPublicApi
            Path:   /public/available-slots
            Method: GET
        PublicAvailableDates:
          Type: Api
          Properties:
            RestApiId: !Ref AppPublicApi
            Path:   /public/available-dates
            Method: GET
        PublicChat:
          Type: Api
          Properties:
            RestApiId: !Ref AppPublicApi
            Path:   /public/chat
            Method: POST

##############################################################################
# 3)  DynamoDB tables
##############################################################################

  AppointmentsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-Appointments"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: shop_id
          AttributeType: S
        - AttributeName: sort_key
          AttributeType: S
      KeySchema:
        - AttributeName: shop_id
          KeyType: HASH
        - AttributeName: sort_key
          KeyType: RANGE

  WorkersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-Workers"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: shop_id
          AttributeType: S
        - AttributeName: worker_id
          AttributeType: S
      KeySchema:
        - AttributeName: shop_id
          KeyType: HASH
        - AttributeName: worker_id
          KeyType: RANGE

  ConfigsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-Configs"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: shop_id
          AttributeType: S
      KeySchema:
        - AttributeName: shop_id
          KeyType: HASH

  ContactsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-Contacts"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: shop_id
          AttributeType: S
        - AttributeName: phone_number
          AttributeType: S
      KeySchema:
        - AttributeName: shop_id
          KeyType: HASH
        - AttributeName: phone_number
          KeyType: RANGE

  ConversationStateTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-ConversationState"
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH

  CalendarSyncTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-CalendarSync"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: shop_id
          AttributeType: S
        - AttributeName: appointment_sort_key
          AttributeType: S
      KeySchema:
        - AttributeName: shop_id
          KeyType: HASH
        - AttributeName: appointment_sort_key
          KeyType: RANGE

  GoogleTokensTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-GoogleTokens"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: shop_id
          AttributeType: S
      KeySchema:
        - AttributeName: shop_id
          KeyType: HASH

  SubscriptionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-Subscriptions"
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: shop_id
          AttributeType: S
      KeySchema:
        - AttributeName: shop_id
          KeyType: HASH

  IdempotencyKeysTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${AWS::StackName}-IdempotencyKeys"
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: idempotency_key
          AttributeType: S
      KeySchema:
        - AttributeName: idempotency_key
          KeyType: HASH

##############################################################################
# 4)  Authenticated Lambda (existing)
##############################################################################

  WorkerApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: app.lambda_handler
      Runtime: python3.12
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          APPOINTMENTS_TABLE: !Ref AppointmentsTable
          WORKERS_TABLE:      !Ref WorkersTable
          CONFIGS_TABLE:      !Ref ConfigsTable
          CONTACTS_TABLE:     !Ref ContactsTable
          CALENDAR_SYNC_TABLE: !Ref CalendarSyncTable
          GOOGLE_TOKENS_TABLE: !Ref GoogleTokensTable
          SUBSCRIPTIONS_TABLE: !Ref SubscriptionsTable
          IDEMPOTENCY_KEYS_TABLE: !Ref IdempotencyKeysTable
          CORS_ALLOWED_ORIGINS: !Ref CorsAllowedOrigins
          OPENAI_API_KEY:     !Ref OpenAiApiKey
          EVO_BASE_URL:       !Ref EvoBaseUrl
          EVO_API_KEY:        !Ref EvoApiKey
          GOOGLE_CLIENT_ID:   !Ref GoogleClientId
          GOOGLE_CLIENT_SECRET: !Ref GoogleClientSecret
          GOOGLE_REDIRECT_URI: !Ref GoogleRedirectUri
          GCAL_SHOP_SYNC_FUNCTION: !Ref GoogleCalendarShopSync
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref AppointmentsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref WorkersTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ConfigsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ContactsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref CalendarSyncTable }
        - DynamoDBCrudPolicy: { TableName: !Ref GoogleTokensTable }
        - DynamoDBCrudPolicy: { TableName: !Ref SubscriptionsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref IdempotencyKeysTable }
        - Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !GetAtt GoogleCalendarShopSync.Arn
      Events:
        ApiGet:
          Type: HttpApi
          Properties:
            ApiId:  !Ref WorkerHttpApi
            Path:   /{proxy+}
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
        ApiPost:
          Type: HttpApi
          Properties:
            ApiId:  !Ref WorkerHttpApi
            Path:   /{proxy+}
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
        ApiPut:
          Type: HttpApi
          Properties:
            ApiId:  !Ref WorkerHttpApi
            Path:   /{proxy+}
            Method: PUT
            Auth:
              Authorizer: CognitoAuthorizer
        ApiDelete:
          Type: HttpApi
          Properties:
            ApiId:  !Ref WorkerHttpApi
            Path:   /{proxy+}
            Method: DELETE
            Auth:
              Authorizer: CognitoAuthorizer
        ApiOptions:
          Type: HttpApi
          Properties:
            ApiId:  !Ref WorkerHttpApi
            Path:   /{proxy+}
            Method: OPTIONS

##############################################################################
# 5) Google Calendar API (Separate to avoid circular dependencies)
##############################################################################

  # Separate HttpApi for Google Calendar to avoid circular dependencies
  GoogleCalendarApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: Prod
      CorsConfiguration:
        AllowOrigins: !Split [",", !Ref CorsAllowedOrigins]
        AllowMethods: ["OPTIONS", "GET", "POST", "PUT", "DELETE"]
        AllowHeaders: ["*"]
      Auth:
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              Issuer:   !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${ExistingUserPoolId}"
              Audience: [!Ref ExistingUserPoolClientId]

##############################################################################
# 6) WhatsApp Integration (New Universal Implementation)
##############################################################################

  # HTTP API for WhatsApp webhook endpoints
  WhatsAppInApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: Prod
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: ["POST", "GET"]
        AllowHeaders: ["*"]

  # Universal webhook handler that supports all common formats
  UniversalWhatsAppWebhook:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: whatsapp_in
      Handler: index.handler
      Runtime: nodejs20.x
      Timeout: 30
      MemorySize: 512
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt WebhookDLQ.Arn
      Environment:
        Variables:
          EVO_BASE_URL: !Ref EvoBaseUrl
          EVO_API_KEY: !Ref EvoApiKey
          PUBLIC_API_URL: !Sub "https://${AppPublicApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
          PUBLIC_API_KEY: !Ref AppPublicApiKey
          SQS_QUEUE_URL: !Ref WhatsAppMainQueue
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - sqs:SendMessage
                - sqs:GetQueueAttributes
              Resource: !GetAtt WhatsAppMainQueue.Arn
      Events:
        # LEGACY WEBHOOK ROUTES (kept for backward compatibility)
        LegacyApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref WhatsAppInApi
            Path: /whatsapp-webhook
            Method: POST
        LegacyDiagnosticEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref WhatsAppInApi
            Path: /whatsapp-webhook
            Method: GET
        LegacyEventProxyRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref WhatsAppInApi
            Path: /whatsapp-webhook/{proxy+}
            Method: POST
        # ACTIVE CLEAN WEBHOOK ENDPOINTS (current production configuration)
        CleanWebhookEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref WhatsAppInApi
            Path: /ww
            Method: POST

  WhatsAppConnect:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Handler: whatsapp_admin.connect_handler
      CodeUri: .
      Timeout: 20
      Environment:
        Variables:
          EVO_BASE_URL:   !Ref EvoBaseUrl
          EVO_API_KEY:    !Ref EvoApiKey
          CONFIGS_TABLE:  !Ref ConfigsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConfigsTable
        - Statement:
            - Effect: Allow
              Action: "execute-api:Invoke"
              Resource: "*"
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref WorkerHttpApi
            Path:   /whatsapp/connect
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  WhatsAppStatus:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Handler: whatsapp_admin.status_handler
      CodeUri: .
      Timeout: 15
      Environment:
        Variables:
          EVO_BASE_URL:   !Ref EvoBaseUrl
          EVO_API_KEY:    !Ref EvoApiKey
          CONFIGS_TABLE:  !Ref ConfigsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConfigsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref WorkerHttpApi
            Path:   /whatsapp/status
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

  WhatsAppLists:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Handler: whatsapp_admin.lists_handler
      CodeUri: .
      Timeout: 10
      Environment:
        Variables:
          CONFIGS_TABLE: !Ref ConfigsTable
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref ConfigsTable }
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref WorkerHttpApi
            Path:   /whatsapp/lists
            Method: PATCH
            Auth:
              Authorizer: CognitoAuthorizer

  WhatsAppContacts:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Handler: whatsapp_admin.contacts_handler
      CodeUri: .
      Timeout: 15
      Environment:
        Variables:
          EVO_BASE_URL:   !Ref EvoBaseUrl
          EVO_API_KEY:    !Ref EvoApiKey
          CONFIGS_TABLE:  !Ref ConfigsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConfigsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref WorkerHttpApi
            Path:   /whatsapp/contacts
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  WhatsAppDisconnect:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Handler: whatsapp_admin.disconnect_handler
      CodeUri: .
      Timeout: 15
      Environment:
        Variables:
          EVO_BASE_URL:   !Ref EvoBaseUrl
          EVO_API_KEY:    !Ref EvoApiKey
          CONFIGS_TABLE:  !Ref ConfigsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConfigsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref WorkerHttpApi
            Path:   /whatsapp/disconnect
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  WhatsAppQr:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Handler: whatsapp_admin.qr_handler
      CodeUri: .
      Timeout: 30
      Environment:
        Variables:
          EVO_BASE_URL:   !Ref EvoBaseUrl
          EVO_API_KEY:    !Ref EvoApiKey
          CONFIGS_TABLE:  !Ref ConfigsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConfigsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref WorkerHttpApi
            Path:   /whatsapp/qr
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

  # Unified WhatsApp Connect (supports both QR and pairing code)
  WhatsAppUnifiedConnect:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Handler: whatsapp_admin.unified_connect_handler
      CodeUri: .
      Timeout: 30
      Environment:
        Variables:
          EVO_BASE_URL:   !Ref EvoBaseUrl
          EVO_API_KEY:    !Ref EvoApiKey
          CONFIGS_TABLE:  !Ref ConfigsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConfigsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref WorkerHttpApi
            Path:   /whatsapp/unified-connect
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

##############################################################################
# 6) Dead Letter Queues and Monitoring
##############################################################################

  # Main SQS FIFO Queue for WhatsApp messages
  WhatsAppMainQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-whatsapp-main.fifo"
      FifoQueue: true
      ContentBasedDeduplication: false  # We provide explicit deduplication IDs
      MessageRetentionPeriod: 1209600   # 14 days
      VisibilityTimeout: 180     # 3 minutes (2x Lambda timeout)
      ReceiveMessageWaitTimeSeconds: 20 # Long polling
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt WhatsAppDLQ.Arn
        maxReceiveCount: 3

  # Dead Letter Queue for failed WhatsApp messages (MUST be FIFO for FIFO source)
  WhatsAppDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-whatsapp-dlq.fifo"
      FifoQueue: true
      MessageRetentionPeriod: 1209600  # 14 days
      VisibilityTimeout: 300

  # Dead Letter Queue for failed Lambda invocations
  WebhookDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-webhook-dlq"
      MessageRetentionPeriod: 1209600  # 14 days
      VisibilityTimeout: 300

  # SNS Topic for critical alerts
  CriticalAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-critical-alerts"
      DisplayName: "WhatsApp Platform Critical Alerts"

  # CloudWatch Alarm: DLQ Messages > 0
  WhatsAppDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-WhatsApp-DLQ-Messages"
      AlarmDescription: "WhatsApp DLQ has messages indicating processing failures"
      MetricName: ApproximateNumberOfVisibleMessages
      Namespace: AWS/SQS
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: QueueName
          Value: !GetAtt WhatsAppDLQ.QueueName
      AlarmActions:
        - !Ref CriticalAlertsTopic
      TreatMissingData: notBreaching

  # CloudWatch Alarm: Webhook DLQ Messages > 0
  WebhookDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-Webhook-DLQ-Messages"
      AlarmDescription: "Webhook DLQ has messages indicating Lambda failures"
      MetricName: ApproximateNumberOfVisibleMessages
      Namespace: AWS/SQS
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: QueueName
          Value: !GetAtt WebhookDLQ.QueueName
      AlarmActions:
        - !Ref CriticalAlertsTopic
      TreatMissingData: notBreaching

  # CloudWatch Alarm: SQS Processor Error Rate > 1%
  SQSProcessorErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-SQS-Processor-Error-Rate"
      AlarmDescription: "SQS Processor error rate exceeds 1%"
      MetricName: ErrorRate
      Namespace: AWS/Lambda
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 0.01
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref WhatsAppSQSProcessor
      AlarmActions:
        - !Ref CriticalAlertsTopic
      TreatMissingData: notBreaching

  # CloudWatch Alarm: Webhook Error Rate > 1%
  WebhookErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-Webhook-Error-Rate"
      AlarmDescription: "WhatsApp webhook error rate exceeds 1%"
      MetricName: ErrorRate
      Namespace: AWS/Lambda
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 0.01
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref UniversalWhatsAppWebhook
      AlarmActions:
        - !Ref CriticalAlertsTopic
      TreatMissingData: notBreaching

##############################################################################
# 7) SQS Message Processing System
##############################################################################

  # SQS-based WhatsApp message processor (replaces webhook for message processing)
  WhatsAppSQSProcessor:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: whatsapp_sqs
      Handler: index.handler
      Runtime: nodejs20.x
      Timeout: 60
      MemorySize: 512
      # ReservedConcurrentExecutions removed - allow parallel processing
      Environment:
        Variables:
          EVO_BASE_URL: !Ref EvoBaseUrl
          EVO_API_KEY: !Ref EvoApiKey
          PUBLIC_API_URL: !Sub "https://${AppPublicApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
          PUBLIC_API_KEY: !Ref AppPublicApiKey
          SQS_QUEUE_URL: !Ref WhatsAppMainQueue
          CONTACTS_TABLE: !Ref ContactsTable
          CONVERSATION_STATE_TABLE: !Ref ConversationStateTable
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - "sqs:DeleteMessage"
                - "sqs:GetQueueAttributes"
                - "sqs:ReceiveMessage"
              Resource: !GetAtt WhatsAppMainQueue.Arn
            - Effect: Allow
              Action:
                - "dynamodb:Query"
              Resource: !GetAtt ContactsTable.Arn
            - Effect: Allow
              Action:
                - "dynamodb:GetItem"
                - "dynamodb:PutItem"
                - "dynamodb:UpdateItem"
                - "dynamodb:DeleteItem"
              Resource: !GetAtt ConversationStateTable.Arn
      Events:
        SQSEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt WhatsAppMainQueue.Arn
            BatchSize: 5  # Process up to 5 messages (duplicates removed, safe to batch)
            FunctionResponseTypes:
              - ReportBatchItemFailures  # Enable partial batch failure handling
            ScalingConfig:
              MaximumConcurrency: 10  # Allow up to 10 concurrent Lambda invocations

  # Automated Message Scheduler
  AutomatedMessageScheduler:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Handler: automated_messages.lambda_handler
      CodeUri: .
      Timeout: 300  # 5 minutes for processing multiple shops
      MemorySize: 512
      Environment:
        Variables:
          CONTACTS_TABLE: !Ref ContactsTable
          APPOINTMENTS_TABLE: !Ref AppointmentsTable
          CONFIGS_TABLE: !Ref ConfigsTable
          EVO_BASE_URL: !Ref EvoBaseUrl
          EVO_API_KEY: !Ref EvoApiKey
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref ContactsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref AppointmentsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ConfigsTable }
      Events:
        # Business hours schedule: Monday-Saturday 9 AM - 6 PM (UTC)
        # Note: Adjust timezone as needed for your business
        BusinessHoursSchedule:
          Type: Schedule
          Properties:
            Schedule: 'cron(0 9-18 ? * MON-SAT *)'  # Every hour 9 AM - 6 PM, Mon-Sat
            Description: 'Automated birthday and follow-up message scheduler during business hours'
            Enabled: true

  # Google Calendar Integration Functions
  GoogleCalendarAuth:
