AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: |
  DVA-C02 Lab 1.7 — VPC Lambda
  Minimal VPC + S3 gateway endpoint + Lambda in private subnets.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    LoggingConfig:
      LogFormat: JSON

Resources:
  # --- VPC scaffolding ---
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: dva-lab-01-07-vpc

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Sub '${AWS::Region}a'
      Tags:
        - Key: Name
          Value: dva-lab-01-07-private-a

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Sub '${AWS::Region}b'
      Tags:
        - Key: Name
          Value: dva-lab-01-07-private-b

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: dva-lab-01-07-private-rt

  PrivateSubnetAAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetBAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  # --- S3 Gateway VPC Endpoint (free) ---
  S3VpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable

  # --- Bucket the Lambda will list ---
  PrivateBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'dva-lab-01-07-${AWS::AccountId}-${AWS::Region}'

  # --- Lambda security group ---
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Lambda outbound only
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound (will be filtered by VPC endpoint routing)

  # --- The function ---
  VpcFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dva-lab-01-07-vpc-fn
      CodeUri: src/
      Handler: app.handler
      Environment:
        Variables:
          BUCKET_NAME: !Ref PrivateBucket
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnetA
          - !Ref PrivateSubnetB
      Policies:
        # AWSLambdaVPCAccessExecutionRole equivalent
        - VPCAccessPolicy: {}
        - S3ReadPolicy:
            BucketName: !Ref PrivateBucket

Outputs:
  FunctionName:
    Value: !Ref VpcFunction
  BucketName:
    Value: !Ref PrivateBucket
  VpcId:
    Value: !Ref Vpc
  LambdaSecurityGroupId:
    Value: !Ref LambdaSecurityGroup
  RouteTableId:
    Value: !Ref PrivateRouteTable
  S3VpcEndpointId:
    Value: !Ref S3VpcEndpoint