    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-GenerateUploadUrl
      ReservedConcurrentExecutions: 5
      Handler: index.lambda_handler
      Role: !GetAtt LambdaSESRole.Arn
      Runtime: python3.13
      Timeout: 10
      MemorySize: 128
      DeadLetterConfig:
        TargetArn: !GetAtt LambdaDeadLetterQueue.Arn
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          from datetime import datetime
          from botocore.exceptions import ClientError

          def lambda_handler(event, context):
              CORS_ORIGIN = os.environ.get('ALLOWED_ORIGIN', 'NONE')
              try:
                  s3_client = boto3.client('s3')
                  bucket_name = os.environ['RECIPIENTS_BUCKET']

                  # Get original filename from query parameters
                  query_params = event.get('queryStringParameters') or {}
                  original_filename = query_params.get('filename', 'recipients')

                  # Remove .csv extension if present
                  if original_filename.endswith('.csv'):
                      original_filename = original_filename[:-4]

                  # Generate unique filename with formatted timestamp
                  timestamp = datetime.now().strftime('%Y-%m-%d-%H-%M')
                  filename = f"{original_filename}-{timestamp}.csv"

                  # Generate presigned URL for PUT operation
                  presigned_url = s3_client.generate_presigned_url(
                      'put_object',
                      Params={
                          'Bucket': bucket_name,
                          'Key': filename,
                          'ContentType': 'text/csv'
                      },
                      ExpiresIn=300  # 5 minutes
                  )

                  return {
                      'statusCode': 200,
                      'headers': {
                          'Content-Type': 'application/json',
                          'Access-Control-Allow-Origin': CORS_ORIGIN,
                          'Access-Control-Allow-Headers': 'Content-Type,Authorization',
                          'Access-Control-Allow-Methods': 'GET,POST,OPTIONS'
                      },
                      'body': json.dumps({
                          'uploadUrl': presigned_url,
                          'filename': filename
                      })
                  }

              except ClientError as e:
                  print(f"Error generating presigned URL: {e}")
                  return {
                      'statusCode': 500,
                      'headers': {
                          'Content-Type': 'application/json',
                          'Access-Control-Allow-Origin': CORS_ORIGIN,
                      },
                      'body': json.dumps({
                          'error': 'Failed to generate upload URL'
                      })
                  }
              except Exception as e:
                  print(f"Unexpected error: {e}")
                  return {
                      'statusCode': 500,
                      'headers': {
                          'Content-Type': 'application/json',
                          'Access-Control-Allow-Origin': CORS_ORIGIN,
                      },
                      'body': json.dumps({
                          'error': 'Internal server error'
                      })
                  }
      Environment:
        Variables:
          RECIPIENTS_BUCKET: !Ref RecipientsBucket
          ALLOWED_ORIGIN: !Ref AllowedOrigin
      KmsKeyArn: !Ref LambdaKMSKeyArn

