AWSTemplateFormatVersion: '2010-09-09'
Description: 'AWS Transit Gateway Lab - Creates 4 VPCs with EC2 instances and Transit Gateway'

Parameters:
  KeyName:
    Description: Name of an existing EC2 KeyPair
    Type: AWS::EC2::KeyPair::KeyName
    ConstraintDescription: must be the name of an existing EC2 KeyPair.

  VpcCIDR1:
    Description: CIDR block for VPC1
    Type: String
    Default: 172.16.1.0/24

  VpcCIDR2:
    Description: CIDR block for VPC2
    Type: String
    Default: 172.16.2.0/24

  VpcCIDR3:
    Description: CIDR block for VPC3
    Type: String
    Default: 172.16.3.0/24

  VpcCIDR4:
    Description: CIDR block for VPC4
    Type: String
    Default: 172.16.4.0/24

Resources:
  # VPC1 Resources
  VPC1:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCIDR1
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: VPC1

  VPC1Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC1
      CidrBlock: !Ref VpcCIDR1
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: VPC1-Subnet

  VPC1InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: VPC1-IGW

  VPC1InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC1
      InternetGatewayId: !Ref VPC1InternetGateway

  VPC1RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC1
      Tags:
        - Key: Name
          Value: VPC1-RouteTable

  VPC1Route:
    Type: AWS::EC2::Route
    DependsOn: VPC1InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref VPC1RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref VPC1InternetGateway

  VPC1SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref VPC1Subnet
      RouteTableId: !Ref VPC1RouteTable

  VPC1SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Enable SSH access
      VpcId: !Ref VPC1
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: VPC1-SG

  VPC1EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: ami-0c7217cdde317cfec  # Amazon Linux 2023 AMI
      InstanceType: t3.nano
      KeyName: !Ref KeyName
      SubnetId: !Ref VPC1Subnet
      SecurityGroupIds:
        - !Ref VPC1SecurityGroup
      Tags:
        - Key: Name
          Value: First-EC2-Host

  # VPC2 Resources (Similar structure but without Internet Gateway)
  VPC2:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCIDR2
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: VPC2

  VPC2Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC2
      CidrBlock: !Ref VpcCIDR2
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: VPC2-Subnet

  VPC2RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC2
      Tags:
        - Key: Name
          Value: VPC2-RouteTable

  VPC2SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref VPC2Subnet
      RouteTableId: !Ref VPC2RouteTable

  VPC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Enable SSH access
      VpcId: !Ref VPC2
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: VPC2-SG

  VPC2EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: ami-0c7217cdde317cfec  # Amazon Linux 2023 AMI
      InstanceType: t3.nano
      KeyName: !Ref KeyName
      SubnetId: !Ref VPC2Subnet
      SecurityGroupIds:
        - !Ref VPC2SecurityGroup
      Tags:
        - Key: Name
          Value: Second-EC2-Host

  # VPC3 Resources (Similar to VPC1 with Internet Gateway)
  VPC3:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCIDR3
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: VPC3

  VPC3Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC3
      CidrBlock: !Ref VpcCIDR3
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: VPC3-Subnet

  VPC3InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: VPC3-IGW

  VPC3InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC3
      InternetGatewayId: !Ref VPC3InternetGateway

  VPC3RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC3
      Tags:
        - Key: Name
          Value: VPC3-RouteTable

  VPC3Route:
    Type: AWS::EC2::Route
    DependsOn: VPC3InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref VPC3RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref VPC3InternetGateway

  VPC3SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref VPC3Subnet
      RouteTableId: !Ref VPC3RouteTable

  VPC3SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Enable SSH access
      VpcId: !Ref VPC3
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: VPC3-SG

  VPC3EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: ami-0c7217cdde317cfec  # Amazon Linux 2023 AMI
      InstanceType: t3.nano
      KeyName: !Ref KeyName
      SubnetId: !Ref VPC3Subnet
      SecurityGroupIds:
        - !Ref VPC3SecurityGroup
      Tags:
        - Key: Name
          Value: Third-EC2-Host

  # VPC4 Resources (Similar to VPC2 without Internet Gateway)
  VPC4:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCIDR4
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: VPC4

  VPC4Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC4
      CidrBlock: !Ref VpcCIDR4
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: VPC4-Subnet

  VPC4RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC4
      Tags:
        - Key: Name
          Value: VPC4-RouteTable

  VPC4SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref VPC4Subnet
      RouteTableId: !Ref VPC4RouteTable

  VPC4SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Enable SSH access
      VpcId: !Ref VPC4
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: VPC4-SG

  VPC4EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: ami-0c7217cdde317cfec  # Amazon Linux 2023 AMI
      InstanceType: t3.nano
      KeyName: !Ref KeyName
      SubnetId: !Ref VPC4Subnet
      SecurityGroupIds:
        - !Ref VPC4SecurityGroup
      Tags:
        - Key: Name
          Value: Fourth-EC2-Host

  # Transit Gateway Resources
  TransitGateway:
    Type: AWS::EC2::TransitGateway
    Properties:
      Description: Transit Gateway for lab20
      AutoAcceptSharedAttachments: disable
      DefaultRouteTableAssociation: disable
      DefaultRouteTablePropagation: disable
      Tags:
        - Key: Name
          Value: lab20-tgw

  TransitGatewayAttachment1:
    Type: AWS::EC2::TransitGatewayAttachment
    Properties:
      TransitGatewayId: !Ref TransitGateway
      VpcId: !Ref VPC1
      SubnetIds:
        - !Ref VPC1Subnet
      Tags:
        - Key: Name
          Value: VPC1-Attachment

  TransitGatewayAttachment2:
    Type: AWS::EC2::TransitGatewayAttachment
    Properties:
      TransitGatewayId: !Ref TransitGateway
      VpcId: !Ref VPC2
      SubnetIds:
        - !Ref VPC2Subnet
      Tags:
        - Key: Name
          Value: VPC2-Attachment

  TransitGatewayAttachment3:
    Type: AWS::EC2::TransitGatewayAttachment
    Properties:
      TransitGatewayId: !Ref TransitGateway
      VpcId: !Ref VPC3
      SubnetIds:
        - !Ref VPC3Subnet
      Tags:
        - Key: Name
          Value: VPC3-Attachment

  TransitGatewayAttachment4:
    Type: AWS::EC2::TransitGatewayAttachment
    Properties:
      TransitGatewayId: !Ref TransitGateway
      VpcId: !Ref VPC4
      SubnetIds:
        - !Ref VPC4Subnet
      Tags:
        - Key: Name
          Value: VPC4-Attachment

  TransitGatewayRouteTable:
    Type: AWS::EC2::TransitGatewayRouteTable
    Properties:
      TransitGatewayId: !Ref TransitGateway
      Tags:
        - Key: Name
          Value: lab20-TGW-RT

Outputs:
  VPC1EC2PublicIP:
    Description: Public IP of EC2 instance in VPC1
    Value: !GetAtt VPC1EC2Instance.PublicIp

  VPC3EC2PublicIP:
    Description: Public IP of EC2 instance in VPC3
    Value: !GetAtt VPC3EC2Instance.PublicIp

  VPC1EC2PrivateIP:
    Description: Private IP of EC2 instance in VPC1
    Value: !GetAtt VPC1EC2Instance.PrivateIp

  VPC2EC2PrivateIP:
    Description: Private IP of EC2 instance in VPC2
    Value: !GetAtt VPC2EC2Instance.PrivateIp

  VPC3EC2PrivateIP:
    Description: Private IP of EC2 instance in VPC3
    Value: !GetAtt VPC3EC2Instance.PrivateIp

  VPC4EC2PrivateIP:
    Description: Private IP of EC2 instance in VPC4
    Value: !GetAtt VPC4EC2Instance.PrivateIp

  TransitGatewayId:
    Description: ID of the Transit Gateway
    Value: !Ref TransitGateway