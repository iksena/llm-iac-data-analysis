AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Esempio Elastic Beanstalk che esegue una singola immagine Docker (parametrica)
  esposta sulla porta 8042. Health check URL: /api/echo/status.

Parameters:
  ImageName:
    Type: String
    Default: pathsgames/pathsgames
    Description: Docker image name (puoi includere tag, es. path:tag)
  ApplicationName:
    Type: String
    Default: Esempio31ElasticBeanstalkApp
  EnvironmentName:
    Type: String
    Default: Esempio31ElasticBeanstalkEnv
  SolutionStackName:
    Type: String
    Default: ''
    Description: 'Solution stack name for Elastic Beanstalk (modifica se necessario per la regione)'
  PlatformArn:
    Type: String
    Default: ''
    Description: 'Optional: specific Platform ARN to use instead of SolutionStackName (es. arn:aws:elasticbeanstalk:...)'
  InstanceType:
    Type: String
    Default: t3.micro
  SourceBundleS3Bucket:
    Type: String
    Description: 'Bucket S3 contenente il source bundle (zip con Dockerrun.aws.json)'
  SourceBundleS3Key:
    Type: String
    Description: 'Key S3 del source bundle (es. myapp.zip)'

Conditions:
  UsePlatformArn: !Not [ !Equals [ !Ref PlatformArn, '' ] ]

Resources:
  # IAM Role per le istanze EC2
  EC2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSElasticBeanstalkWebTier
        - arn:aws:iam::aws:policy/AWSElasticBeanstalkWorkerTier
        - arn:aws:iam::aws:policy/AWSElasticBeanstalkMulticontainerDocker

  # Instance Profile per le istanze EC2
  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref EC2InstanceRole

  # Service Role per Elastic Beanstalk
  ServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: elasticbeanstalk.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSElasticBeanstalkEnhancedHealth
        - arn:aws:iam::aws:policy/service-role/AWSElasticBeanstalkService

  Application:
    Type: AWS::ElasticBeanstalk::Application
    Properties:
      ApplicationName: !Ref ApplicationName
      Description: Esempio Elastic Beanstalk single Docker container

  AppVersion:
    Type: AWS::ElasticBeanstalk::ApplicationVersion
    DependsOn: Application
    Properties:
      ApplicationName: !Ref Application
      Description: !Sub 'Version for ${ImageName}'
      SourceBundle:
        S3Bucket: !Ref SourceBundleS3Bucket
        S3Key: !Ref SourceBundleS3Key

  Environment:
    Type: AWS::ElasticBeanstalk::Environment
    DependsOn: AppVersion
    Properties:
      ApplicationName: !Ref Application
      EnvironmentName: !Ref EnvironmentName
      VersionLabel: !Ref AppVersion
      PlatformArn: !If [ UsePlatformArn, !Ref PlatformArn, !Ref "AWS::NoValue" ]
      SolutionStackName: !If [ UsePlatformArn, !Ref "AWS::NoValue", !Ref SolutionStackName ]
      OptionSettings:
        - Namespace: aws:autoscaling:launchconfiguration
          OptionName: IamInstanceProfile
          Value: !Ref EC2InstanceProfile
        - Namespace: aws:elasticbeanstalk:environment
          OptionName: ServiceRole
          Value: !Ref ServiceRole
        - Namespace: aws:autoscaling:launchconfiguration
          OptionName: InstanceType
          Value: !Ref InstanceType
        - Namespace: aws:elasticbeanstalk:environment
          OptionName: EnvironmentType
          Value: LoadBalanced
        - Namespace: aws:elasticbeanstalk:environment:proxy
          OptionName: ProxyServer
          Value: nginx
        - Namespace: aws:elasticbeanstalk:environment:process:default
          OptionName: Port
          Value: '8042'
        - Namespace: aws:elasticbeanstalk:environment:process:default
          OptionName: HealthCheckPath
          Value: /api/echo/status
        - Namespace: aws:elb:healthcheck
          OptionName: Target
          Value: 'HTTP:8042/api/echo/status'
        - Namespace: aws:elb:healthcheck
          OptionName: Interval
          Value: '30'
        - Namespace: aws:elb:healthcheck
          OptionName: Timeout
          Value: '5'
        - Namespace: aws:elb:healthcheck
          OptionName: HealthyThreshold
          Value: '2'
        - Namespace: aws:elb:healthcheck
          OptionName: UnhealthyThreshold
          Value: '5'

Outputs:
  ApplicationName:
    Description: Elastic Beanstalk Application name
    Value: !Ref ApplicationName
  EnvironmentURL:
    Description: URL dell'environment Elastic Beanstalk
    Value: !GetAtt Environment.EndpointURL