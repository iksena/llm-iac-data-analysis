AWSTemplateFormatVersion: "2010-09-09"
Description: >
  EBS Leading-Indicator Alarms for EKS Node Root Volumes.
  Deploys early-warning alarms for all GP2 and GP3 volumes in the cluster,
  so alarms fire regardless of which node a workload lands on.

Parameters:
  GP2VolumeId1:
    Type: String
    Description: First GP2 volume ID (e.g., vol-0abc123)
    Default: ""

  GP2VolumeId2:
    Type: String
    Description: Second GP2 volume ID (e.g., vol-0def456)
    Default: ""

  GP3VolumeId1:
    Type: String
    Description: First GP3 volume ID (e.g., vol-0ghi789)
    Default: ""

  GP3VolumeId2:
    Type: String
    Description: Second GP3 volume ID (e.g., vol-0jkl012)
    Default: ""

  NotificationEmail:
    Type: String
    Description: Email address to receive alarm notifications
    Default: ""

  EKSClusterName:
    Type: String
    Description: Name of the EKS cluster (used for alarm naming/tagging)
    Default: ebs-monitoring-demo

Conditions:
  HasGP2Vol1: !Not [!Equals [!Ref GP2VolumeId1, ""]]
  HasGP2Vol2: !Not [!Equals [!Ref GP2VolumeId2, ""]]
  HasGP3Vol1: !Not [!Equals [!Ref GP3VolumeId1, ""]]
  HasGP3Vol2: !Not [!Equals [!Ref GP3VolumeId2, ""]]
  HasEmail: !Not [!Equals [!Ref NotificationEmail, ""]]

Resources:
  # --- SNS Topic ---
  AlarmNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${EKSClusterName}-ebs-alarms"
      Tags:
        - Key: Purpose
          Value: EBS-IOPS-Monitoring
        - Key: EKSCluster
          Value: !Ref EKSClusterName

  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasEmail
    Properties:
      TopicArn: !Ref AlarmNotificationTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  # =============================================================
  # GP2 VOLUME 1 ALARMS
  # =============================================================

  GP2Vol1BurstBalanceEarlyWarning:
    Type: AWS::CloudWatch::Alarm
    Condition: HasGP2Vol1
    Properties:
      AlarmName: !Sub "${EKSClusterName}-gp2-burst-early-${GP2VolumeId1}"
      AlarmDescription: "LEADING: BurstBalance < 70%. 3-4 days lead time before depletion."
      Namespace: AWS/EBS
      MetricName: BurstBalance
      Dimensions:
        - Name: VolumeId
          Value: !Ref GP2VolumeId1
      Statistic: Average
      Period: 300
      EvaluationPeriods: 12
      Threshold: 70
      ComparisonOperator: LessThanThreshold
      TreatMissingData: missing
      AlarmActions:
        - !Ref AlarmNotificationTopic
      OKActions:
        - !Ref AlarmNotificationTopic
      Tags:
        - Key: IndicatorType
          Value: Leading
        - Key: VolumeType
          Value: GP2

  GP2Vol1BurstBalanceWarning:
    Type: AWS::CloudWatch::Alarm
    Condition: HasGP2Vol1
    Properties:
      AlarmName: !Sub "${EKSClusterName}-gp2-burst-warn-${GP2VolumeId1}"
      AlarmDescription: "LEADING: BurstBalance < 40%. 1-2 days before depletion."
      Namespace: AWS/EBS
      MetricName: BurstBalance
      Dimensions:
        - Name: VolumeId
          Value: !Ref GP2VolumeId1
      Statistic: Average
      Period: 300
      EvaluationPeriods: 6
      Threshold: 40
      ComparisonOperator: LessThanThreshold
      TreatMissingData: missing
      AlarmActions:
        - !Ref AlarmNotificationTopic
      Tags:
        - Key: IndicatorType
          Value: Leading
        - Key: VolumeType
          Value: GP2

  GP2Vol1BurstBalanceCritical:
    Type: AWS::CloudWatch::Alarm
    Condition: HasGP2Vol1
    Properties:
      AlarmName: !Sub "${EKSClusterName}-gp2-burst-crit-${GP2VolumeId1}"
      AlarmDescription: "LAGGING: BurstBalance < 20%. Hours before throttling."
      Namespace: AWS/EBS
      MetricName: BurstBalance
      Dimensions:
        - Name: VolumeId
          Value: !Ref GP2VolumeId1
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 20
      ComparisonOperator: LessThanThreshold
      TreatMissingData: missing
      AlarmActions:
        - !Ref AlarmNotificationTopic
      Tags:
        - Key: IndicatorType
          Value: Lagging
        - Key: VolumeType
          Value: GP2

  GP2Vol1QueueLength:
    Type: AWS::CloudWatch::Alarm
    Condition: HasGP2Vol1
    Properties:
      AlarmName: !Sub "${EKSClusterName}-gp2-queue-${GP2VolumeId1}"
      AlarmDescription: "LEADING: QueueLength > 2 for 15 min. I/O demand exceeding capacity."
      Namespace: AWS/EBS
      MetricName: VolumeQueueLength
      Dimensions:
        - Name: VolumeId
          Value: !Ref GP2VolumeId1
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 2
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: missing
      AlarmActions:
        - !Ref AlarmNotificationTopic
      Tags:
        - Key: IndicatorType
          Value: Leading
        - Key: VolumeType
          Value: GP2

  # =============================================================
  # GP2 VOLUME 2 ALARMS
  # =============================================================

  GP2Vol2BurstBalanceEarlyWarning:
    Type: AWS::CloudWatch::Alarm
    Condition: HasGP2Vol2
    Properties:
      AlarmName: !Sub "${EKSClusterName}-gp2-burst-early-${GP2VolumeId2}"
      AlarmDescription: "LEADING: BurstBalance < 70%. 3-4 days lead time before depletion."
      Namespace: AWS/EBS
      MetricName: BurstBalance
      Dimensions:
        - Name: VolumeId
          Value: !Ref GP2VolumeId2
      Statistic: Average
      Period: 300
      EvaluationPeriods: 12
      Threshold: 70
      ComparisonOperator: LessThanThreshold
      TreatMissingData: missing
      AlarmActions:
        - !Ref AlarmNotificationTopic
      OKActions:
        - !Ref AlarmNotificationTopic
      Tags:
        - Key: IndicatorType
          Value: Leading
        - Key: VolumeType
          Value: GP2

  GP2Vol2BurstBalanceWarning:
    Type: AWS::CloudWatch::Alarm
    Condition: HasGP2Vol2
    Properties:
      AlarmName: !Sub "${EKSClusterName}-gp2-burst-warn-${GP2VolumeId2}"
      AlarmDescription: "LEADING: BurstBalance < 40%. 1-2 days before depletion."
      Namespace: AWS/EBS
      MetricName: BurstBalance
      Dimensions:
        - Name: VolumeId
          Value: !Ref GP2VolumeId2
      Statistic: Average
      Period: 300
      EvaluationPeriods: 6
      Threshold: 40
      ComparisonOperator: LessThanThreshold
      TreatMissingData: missing
      AlarmActions:
        - !Ref AlarmNotificationTopic
      Tags:
        - Key: IndicatorType
          Value: Leading
        - Key: VolumeType
          Value: GP2

  GP2Vol2BurstBalanceCritical:
    Type: AWS::CloudWatch::Alarm
    Condition: HasGP2Vol2
    Properties:
      AlarmName: !Sub "${EKSClusterName}-gp2-burst-crit-${GP2VolumeId2}"
      AlarmDescription: "LAGGING: BurstBalance < 20%. Hours before throttling."
      Namespace: AWS/EBS
      MetricName: BurstBalance
      Dimensions:
        - Name: VolumeId
          Value: !Ref GP2VolumeId2
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 20
      ComparisonOperator: LessThanThreshold
      TreatMissingData: missing
      AlarmActions:
        - !Ref AlarmNotificationTopic
      Tags:
        - Key: IndicatorType
          Value: Lagging
        - Key: VolumeType
          Value: GP2

  GP2Vol2QueueLength:
    Type: AWS::CloudWatch::Alarm
    Condition: HasGP2Vol2
    Properties:
      AlarmName: !Sub "${EKSClusterName}-gp2-queue-${GP2VolumeId2}"
      AlarmDescription: "LEADING: QueueLength > 2 for 15 min. I/O demand exceeding capacity."
      Namespace: AWS/EBS
      MetricName: VolumeQueueLength
      Dimensions:
        - Name: VolumeId
          Value: !Ref GP2VolumeId2
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 2
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: missing
      AlarmActions:
        - !Ref AlarmNotificationTopic
      Tags:
        - Key: IndicatorType
          Value: Leading
        - Key: VolumeType
          Value: GP2

  # =============================================================
  # GP3 VOLUME 1 ALARMS
  # =============================================================

  GP3Vol1QueueLength:
    Type: AWS::CloudWatch::Alarm
    Condition: HasGP3Vol1
    Properties:
      AlarmName: !Sub "${EKSClusterName}-gp3-queue-${GP3VolumeId1}"
      AlarmDescription: "LEADING: QueueLength > 2 for 15 min. Hitting 3,000 IOPS ceiling."
      Namespace: AWS/EBS
      MetricName: VolumeQueueLength
      Dimensions:
        - Name: VolumeId
          Value: !Ref GP3VolumeId1
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 2
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: missing
      AlarmActions:
        - !Ref AlarmNotificationTopic
      Tags:
        - Key: IndicatorType
          Value: Leading
        - Key: VolumeType
          Value: GP3

  GP3Vol1IOPSSaturation:
    Type: AWS::CloudWatch::Alarm
    Condition: HasGP3Vol1
    Properties:
      AlarmName: !Sub "${EKSClusterName}-gp3-iops-sat-${GP3VolumeId1}"
      AlarmDescription: "LEADING: IOPS > 90% of 3,000 baseline. Approaching ceiling."
      Metrics:
        - Id: readOps
          MetricStat:
            Metric:
              Namespace: AWS/EBS
              MetricName: VolumeReadOps
              Dimensions:
                - Name: VolumeId
                  Value: !Ref GP3VolumeId1
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: writeOps
          MetricStat:
            Metric:
              Namespace: AWS/EBS
              MetricName: VolumeWriteOps
              Dimensions:
                - Name: VolumeId
                  Value: !Ref GP3VolumeId1
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: totalIops
          Expression: "(readOps + writeOps) / 300"
          Label: "Total IOPS"
          ReturnData: true
      EvaluationPeriods: 3
      Threshold: 2700
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: missing
      AlarmActions:
        - !Ref AlarmNotificationTopic
      Tags:
        - Key: IndicatorType
          Value: Leading
        - Key: VolumeType
          Value: GP3

  # =============================================================
  # GP3 VOLUME 2 ALARMS
  # =============================================================

  GP3Vol2QueueLength:
    Type: AWS::CloudWatch::Alarm
    Condition: HasGP3Vol2
    Properties:
      AlarmName: !Sub "${EKSClusterName}-gp3-queue-${GP3VolumeId2}"
      AlarmDescription: "LEADING: QueueLength > 2 for 15 min. Hitting 3,000 IOPS ceiling."
      Namespace: AWS/EBS
      MetricName: VolumeQueueLength
      Dimensions:
        - Name: VolumeId
          Value: !Ref GP3VolumeId2
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 2
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: missing
      AlarmActions:
        - !Ref AlarmNotificationTopic
      Tags:
        - Key: IndicatorType
          Value: Leading
        - Key: VolumeType
          Value: GP3

  GP3Vol2IOPSSaturation:
    Type: AWS::CloudWatch::Alarm
    Condition: HasGP3Vol2
    Properties:
      AlarmName: !Sub "${EKSClusterName}-gp3-iops-sat-${GP3VolumeId2}"
      AlarmDescription: "LEADING: IOPS > 90% of 3,000 baseline. Approaching ceiling."
      Metrics:
        - Id: readOps
          MetricStat:
            Metric:
              Namespace: AWS/EBS
              MetricName: VolumeReadOps
              Dimensions:
                - Name: VolumeId
                  Value: !Ref GP3VolumeId2
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: writeOps
          MetricStat:
            Metric:
              Namespace: AWS/EBS
              MetricName: VolumeWriteOps
              Dimensions:
                - Name: VolumeId
                  Value: !Ref GP3VolumeId2
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: totalIops
          Expression: "(readOps + writeOps) / 300"
          Label: "Total IOPS"
          ReturnData: true
      EvaluationPeriods: 3
      Threshold: 2700
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: missing
      AlarmActions:
        - !Ref AlarmNotificationTopic
      Tags:
        - Key: IndicatorType
          Value: Leading
        - Key: VolumeType
          Value: GP3

Outputs:
  SNSTopicArn:
    Description: ARN of the alarm notification SNS topic
    Value: !Ref AlarmNotificationTopic

  TotalAlarms:
    Description: Summary of alarms deployed
    Value: "GP2: 4 alarms per volume (BurstBalance early/warn/crit + QueueLength). GP3: 2 alarms per volume (QueueLength + IOPS saturation)."