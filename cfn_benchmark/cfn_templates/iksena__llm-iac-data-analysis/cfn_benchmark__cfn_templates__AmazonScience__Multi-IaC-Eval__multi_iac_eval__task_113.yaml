Description: |
  This stack creates SSM parameters of string
  and a list of strings and an Amazon EventBridge rule.

Resources:
  # A SSM parameter to store a string
  ParameterString:
    Type: AWS::SSM::Parameter
    Properties:
      Name: Key
      Description: SSM Parameter for storing a string
      Type: String
      Value: Value
      Tier: Standard

  # A SSM parameter for a list of strings
  ParameterList:
    Type: AWS::SSM::Parameter
    Properties:
      Name: KeyList
      Description: SSM Parameter for storing a list of strings
      Type: StringList
      Value: Value1,Value2
      Tier: Standard

  # An Amazon EventBridge rule to trigger on EC2 instance state changes
  EventBridgeRule:
    Type: AWS::Events::Rule
    Properties:
      Name: EC2InstanceStateChangeRule
      Description: Rule to trigger on EC2 instance state changes
      EventPattern:
        source:
          - aws.ec2
        detail-type:
          - EC2 Instance State-change Notification
      Targets:
        - Arn: !GetAtt MySNSTopic.Arn
          Id: MySNSTopicTarget

  # An Amazon SNS topic to notify on EC2 instance state changes
  MySNSTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: EC2InstanceStateChangeTopic