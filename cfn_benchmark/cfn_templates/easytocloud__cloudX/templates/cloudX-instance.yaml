Description: >
  This template creates an EC2 instance for use with cloudX.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: CloudX configuration
        Parameters:
          - UserName
          - EnvironmentName
          - SSHHostName
          - InstanceType
          - VolumeSize
          - ShutdownTimeout
      - Label:
          default: Optional software packages to install
        Parameters:
          - NVM
          - NvmVersion
          - DOCKER
          - PRIVPAGE
          - FORTOOLS
      - Label:
          default: Update behaviour
        Parameters:
          - UpdateMode
    ParameterLabels:
      UserName:
        default: CloudX User name (without prefix)
      EnvironmentName:
        default: CloudX Environment name
      SSHHostName:
        default: SSH Host Name (will be prefixed with cloudX-{Environment}-)
      InstanceType:
        default: EC2 Instance type
      VolumeSize:
        default: Root volume size (GiB)
      ShutdownTimeout:
        default: Minutes before idle shutdown
      NVM:
        default: Node Version Manager
      NvmVersion:
        default: NVM version to install (e.g. 0.40.3)
      UpdateMode:
        default: "Update mode: auto re-applies every 7 days; manual requires explicit trigger"
      DOCKER:
        default: Docker
      PRIVPAGE:
        default: AWS PAGER privpage
      FORTOOLS:
        default: for-tools (multi-account helpers)

Parameters:
  UserName:
    Type: String
    Description: Name of the CloudX user to create the instance for (without prefix).
    Default: ''

  EnvironmentName:
    Type: String
    Default: 'OTA'
    Description: 'Name of the CloudX environment'
    # CUSTOMIZATION_MARKER:EnvironmentName - Add AllowedValues or other constraints here

  SSHHostName:
    Type: String
    Default: ''
    Description: >-
      Short name for SSH access to this instance. The actual SSH hostname will be
      cloudX-{Environment}-{SSHHostName}. For example, if you enter "myserver" and the
      Environment is "Prod", you will connect using: ssh cloudX-Prod-myserver.
      This name will be picked up automatically by cloudX-proxy setup.

  InstanceType:
    Type: String
    Description: "The instance type to use. (recommended: 4 vCPU or more for best experience)"
    Default: t3.2xlarge
    AllowedValues:
      # CUSTOMIZATION_MARKER:InstanceType - Add or remove AllowedValues here. Ensure new types are added to InstanceArchMap.
      - 't3.xlarge'
      - 't3.2xlarge'
      - 't3a.xlarge'
      - 't3a.2xlarge'
      - 'm5.xlarge'
      - 'm5.2xlarge'
      - 't4g.xlarge'
      - 't4g.2xlarge'
      - 'm6g.xlarge'
      - 'm6g.2xlarge'

  LatestAmiIdX86:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: '/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-x86_64'
    Description: 'SSM Parameter for x86_64 AMI'

  LatestAmiIdArm:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: '/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-arm64'
    Description: 'SSM Parameter for arm64 AMI'

  VolumeSize:
    Type: Number
    Description: The size of the root volume in GB.
    Default: 80
    MinValue: 10
    MaxValue: 300

  ShutdownTimeout:
    Type: Number
    Description: Minutes of inactivity before the instance powers down automatically.
    Default: 10
    MinValue: 5
    MaxValue: 1440

  NVM:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']

  NvmVersion:
    Type: String
    Default: '0.40.3'
    Description: 'NVM version to install, e.g. 0.40.3. Bumping this value on an existing stack upgrades NVM in-place on next SSM run.'

  UpdateMode:
    Type: String
    Default: 'auto'
    AllowedValues: ['auto', 'manual']
    Description: >-
      auto: State Manager re-applies the setup document every 7 days (keeps instance converged).
      manual: Association only runs on initial launch or when explicitly triggered via start-associations-once.

  DOCKER:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']

  PRIVPAGE:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']

  FORTOOLS:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']

Mappings:
  InstanceArchMap:
    # x86_64 instances
    t3.xlarge:
      Arch: x86_64
    t3.2xlarge:
      Arch: x86_64
    t3a.xlarge:
      Arch: x86_64
    t3a.2xlarge:
      Arch: x86_64
    m5.xlarge:
      Arch: x86_64
    m5.2xlarge:
      Arch: x86_64
    # arm64 instances
    t4g.xlarge:
      Arch: arm64
    t4g.2xlarge:
      Arch: arm64
    m6g.xlarge:
      Arch: arm64
    m6g.2xlarge:
      Arch: arm64

Conditions:
  IsArm: !Equals [!FindInMap [InstanceArchMap, !Ref InstanceType, Arch], 'arm64']

Resources:
  EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !If [ IsArm, !Ref LatestAmiIdArm, !Ref LatestAmiIdX86 ]
      InstanceType: !Ref InstanceType
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref VolumeSize
            VolumeType: gp3
            DeleteOnTermination: true
      UserData:
        Fn::Base64: |
          #!/bin/bash
          # SSM Agent is pre-installed on AL2023 — ensure it is running before State Manager delivers the setup document.
          systemctl enable amazon-ssm-agent
          systemctl start amazon-ssm-agent
          touch /home/ec2-user/.install-running
          chown ec2-user:ec2-user /home/ec2-user/.install-running
      MetadataOptions:
        InstanceMetadataTags: enabled
        HttpTokens: required          # forces IMDSv2; custom SSM steps must use PUT token pattern
        HttpEndpoint: enabled
      SecurityGroupIds:
        - !Sub '{{resolve:ssm:/cloudX/${EnvironmentName}/SecurityGroup}}'
      IamInstanceProfile: !Sub '{{resolve:ssm:/cloudX/${EnvironmentName}/InstanceProfileName}}'
      SubnetId: !Sub '{{resolve:ssm:/cloudX/${EnvironmentName}/Subnet}}'
      Tags:
        - Key: Name
          Value: !Sub "cloudX-${EnvironmentName}-${SSHHostName} | ${UserName}"
        - Key: cloudX:environment
          Value: !Sub "${EnvironmentName}"
        - Key: !Sub '{{resolve:ssm:/cloudX/${EnvironmentName}/AbacTag}}'
          Value: !Sub "cloudX-${EnvironmentName}-${UserName}"
        - Key: cloudX:sso_domain
          Value: !Sub '{{resolve:ssm:/cloudX/${EnvironmentName}/SSODomain}}'
        - Key: cloudX:update
          Value: !Ref UpdateMode

  SetupAssociation:
    Type: AWS::SSM::Association
    Properties:
      Name: !Sub '{{resolve:ssm:/cloudX/${EnvironmentName}/SetupDocumentName}}'
      AssociationName: !Sub "cloudX-${EnvironmentName}-${SSHHostName}-setup"
      Targets:
        - Key: InstanceIds
          Values:
            - !Ref EC2Instance
      Parameters:
        InstallNvm:      [!Ref NVM]
        NvmVersion:      [!Ref NvmVersion]
        InstallDocker:   [!Ref DOCKER]
        InstallPrivpage: [!Ref PRIVPAGE]
        InstallFortools: [!Ref FORTOOLS]
        ShutdownTimeout: [!Ref ShutdownTimeout]
        EnvironmentName: [!Ref EnvironmentName]
      ApplyOnlyAtCronInterval: false
      SyncCompliance: AUTO