AWSTemplateFormatVersion: '2010-09-09'
Description: 'Evolution API v2 with DynamoDB integration using existing tables'

Parameters:
  ExistingAppointmentsTable:
    Type: String
    Default: worker-app-stack-Appointments
    Description: Existing DynamoDB Appointments table name

  ExistingWorkersTable:
    Type: String
    Default: worker-app-stack-Workers
    Description: Existing DynamoDB Workers table name

  ExistingConfigsTable:
    Type: String
    Default: worker-app-stack-Configs
    Description: Existing DynamoDB Configs table name

Resources:
  # VPC and Networking (reusing existing structure)
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: evolution-vpc

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetRouteTableAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # Security Groups
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for ALB
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for ECS
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref ALBSecurityGroup

  # Load Balancer
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: evolution-db-alb
      Scheme: internet-facing
      Type: application
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroups:
        - !Ref ALBSecurityGroup

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: evolution-db-tg
      Port: 8080
      Protocol: HTTP
      VpcId: !Ref VPC
      TargetType: ip
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 60
      HealthCheckTimeoutSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP

  # ECS Cluster
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: evolution-db-cluster

  # IAM Roles with DynamoDB access
  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ExistingAppointmentsTable}"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ExistingWorkersTable}"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ExistingConfigsTable}"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ExistingAppointmentsTable}/*"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ExistingWorkersTable}/*"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ExistingConfigsTable}/*"

  # DynamoDB table for Evolution API instances
  EvolutionInstancesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: evolution-instances
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: instanceName
          AttributeType: S
      KeySchema:
        - AttributeName: instanceName
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # CloudWatch Log Group
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/evolution-api-db
      RetentionInDays: 7

  # ECS Task Definition with DynamoDB configuration
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: evolution-api-db
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: 1024
      Memory: 2048
      ExecutionRoleArn: !Ref ECSTaskExecutionRole
      TaskRoleArn: !Ref ECSTaskRole
      ContainerDefinitions:
        - Name: evolution-api-instance
          Image: atendai/evolution-api:v2.1.1
          Essential: true
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          Environment:
            # Basic Configuration
            - Name: CONFIG_SESSION_PHONE_VERSION
              Value: "2.3000.1025075656"
            - Name: SERVER_TYPE
              Value: "http"
            - Name: SERVER_PORT
              Value: "8080"
            - Name: SERVER_URL
              Value: !Sub "http://${ApplicationLoadBalancer.DNSName}"

            # Authentication
            - Name: AUTHENTICATION_TYPE
              Value: "apikey"
            - Name: AUTHENTICATION_API_KEY
              Value: "***REMOVED_EVO_API_KEY***"
            - Name: AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES
              Value: "true"

            # CORS
            - Name: CORS_ORIGIN
              Value: "*"
            - Name: CORS_METHODS
              Value: "POST,GET,PUT,DELETE"
            - Name: CORS_CREDENTIALS
              Value: "true"

            # Database Configuration - Use DynamoDB through environment
            - Name: DATABASE_ENABLED
              Value: "true"
            - Name: DATABASE_PROVIDER
              Value: "dynamodb"
            - Name: DATABASE_CONNECTION_URI
              Value: !Sub "dynamodb://${AWS::Region}"
            - Name: DATABASE_CONNECTION_CLIENT_NAME
              Value: "evolution"
            - Name: DATABASE_SAVE_DATA_INSTANCE
              Value: "true"
            - Name: DATABASE_SAVE_DATA_NEW_MESSAGE
              Value: "true"
            - Name: DATABASE_SAVE_MESSAGE_UPDATE
              Value: "true"
            - Name: DATABASE_SAVE_DATA_CONTACTS
              Value: "true"
            - Name: DATABASE_SAVE_DATA_CHATS
              Value: "true"

            # Redis Configuration - Disabled for simplicity
            - Name: REDIS_ENABLED
              Value: "false"

            # Instance Management
            - Name: DEL_INSTANCE
              Value: "false"
            - Name: DEL_TEMP_INSTANCES
              Value: "true"

            # WhatsApp Configuration
            - Name: CONFIG_SESSION_PHONE_CLIENT
              Value: "Evolution API"
            - Name: CONFIG_SESSION_PHONE_NAME
              Value: "Chrome"

            # Webhook Configuration
            - Name: WEBHOOK_GLOBAL_ENABLED
              Value: "true"
            - Name: WEBHOOK_GLOBAL_URL
              Value: "https://is8ccrbye3.execute-api.us-east-2.amazonaws.com/Prod/whatsapp-webhook"
            - Name: WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS
              Value: "false"
            - Name: WEBHOOK_GLOBAL_WEBHOOK_BASE64
              Value: "false"
            - Name: WEBHOOK_GLOBAL_EVENTS
              Value: "APPLICATION_STARTUP,QRCODE_UPDATED,MESSAGES_SET,MESSAGES_UPSERT,MESSAGES_UPDATE,MESSAGES_DELETE,SEND_MESSAGE,CONTACTS_SET,CONTACTS_UPSERT,CONTACTS_UPDATE,PRESENCE_UPDATE,CHATS_SET,CHATS_UPSERT,CHATS_UPDATE,CHATS_DELETE,GROUPS_UPSERT,GROUP_UPDATE,GROUP_PARTICIPANTS_UPDATE,CONNECTION_UPDATE,LABELS_EDIT,LABELS_ASSOCIATION,CALL_UPSERT"

            # Logging
            - Name: LOG_LEVEL
              Value: "ERROR"
            - Name: LOG_COLOR
              Value: "false"
            - Name: LOG_BAILEYS
              Value: "false"

            # Store Configuration
            - Name: STORE_CLEANING_INTERVAL
              Value: "7200000"
            - Name: STORE_MESSAGE
              Value: "true"
            - Name: STORE_CONTACTS
              Value: "true"
            - Name: STORE_CHATS
              Value: "true"

            # AWS Configuration
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: AWS_DEFAULT_REGION
              Value: !Ref AWS::Region

  # ECS Service
  ECSService:
    Type: AWS::ECS::Service
    DependsOn: ALBListener
    Properties:
      ServiceName: evolution-db-service
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      DesiredCount: 1
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - !Ref PublicSubnet1
            - !Ref PublicSubnet2
          SecurityGroups:
            - !Ref ECSSecurityGroup
      LoadBalancers:
        - ContainerName: evolution-api-instance
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup
      HealthCheckGracePeriodSeconds: 600

Outputs:
  EvolutionApiUrl:
    Description: Evolution API Manager URL with DynamoDB
    Value: !Sub "http://${ApplicationLoadBalancer.DNSName}"
    Export:
      Name: !Sub "${AWS::StackName}-EvolutionApiUrl"

  ApiKey:
    Description: Evolution API Key
    Value: "***REMOVED_EVO_API_KEY***"
    Export:
      Name: !Sub "${AWS::StackName}-ApiKey"

  LoadBalancerDNS:
    Description: Load Balancer DNS
    Value: !GetAtt ApplicationLoadBalancer.DNSName
    Export:
      Name: !Sub "${AWS::StackName}-LoadBalancerDNS"

  InstancesTable:
    Description: DynamoDB table for Evolution instances
    Value: !Ref EvolutionInstancesTable
    Export:
      Name: !Sub "${AWS::StackName}-InstancesTable"