                                      s3_key = attachment.get('s3Key')
                                      filename = attachment.get('filename')
                                      content_type = attachment.get('contentType', 'application/octet-stream')

                                      logger.info(f"Downloading attachment {filename} from s3://{attachments_bucket}/{s3_key}")

                                      # Download from S3 with proper binary handling
                                      s3_response = s3_client.get_object(Bucket=attachments_bucket, Key=s3_key)
                                      file_data = s3_response['Body'].read()

                                      logger.info(f"Downloaded {len(file_data)} bytes for {filename}")

                                      attachment_list.append({
                                          'RawContent': file_data,
                                          'ContentDisposition': 'ATTACHMENT',
                                          'FileName': filename,
                                          'ContentType': content_type,
                                          'ContentTransferEncoding': 'BASE64'
                                      })
                                  else:
                                      # Embedded attachment with base64 content
                                      filename = attachment.get('filename')
                                      content = attachment.get('content')  # base64 encoded
                                      content_type = attachment.get('contentType', 'application/octet-stream')
                                      content_disposition = attachment.get('contentDisposition', 'INLINE')
                                      content_id = attachment.get('contentId')

                                      if filename and content:
