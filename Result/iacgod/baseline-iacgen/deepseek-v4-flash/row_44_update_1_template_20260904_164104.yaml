AWSTemplateFormatVersion: '2010-09-09'
Parameters:
  ScriptBucketName:
    Type: String
    Default: admin-console-cfn-dataprepare-code
    Description: Name of the S3 bucket to store Glue ETL scripts.
Resources:
  AdminS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'admin-suite-${AWS::AccountId}'
      AccessControl: Private
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  ScriptS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref ScriptBucketName
      AccessControl: Private
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  ConsolidatedIAMRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: QuickSightAdminPipelineRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - glue.amazonaws.com
                - firehose.amazonaws.com
                - cloudwatch.amazonaws.com
                - lambda.amazonaws.com
                - cloudformation.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: QuickSightAdminPipelinePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:*
                Resource:
                  - !Sub 'arn:aws:s3:::${AdminS3Bucket}'
                  - !Sub 'arn:aws:s3:::${AdminS3Bucket}/*'
                  - !Sub 'arn:aws:s3:::${ScriptS3Bucket}'
                  - !Sub 'arn:aws:s3:::${ScriptS3Bucket}/*'
              - Effect: Allow
                Action:
                  - glue:*
                Resource: '*'
              - Effect: Allow
                Action:
                  - quicksight:*
                Resource: '*'
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !GetAtt ConsolidatedIAMRole.Arn
              - Effect: Allow
                Action:
                  - cloudwatch:*
                Resource: '*'
              - Effect: Allow
                Action:
                  - logs:*
                Resource: '*'
              - Effect: Allow
                Action:
                  - firehose:*
                Resource: '*'
              - Effect: Allow
                Action:
                  - lambda:*
                Resource: '*'
  ScriptUploadLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: QuickSightScriptUploader
      Handler: index.lambda_handler
      Runtime: python3.9
      Role: !GetAtt ConsolidatedIAMRole.Arn
      Timeout: 300
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          import json

          def lambda_handler(event, context):
              try:
                  if event['RequestType'] == 'Create':
                      bucket = event['ResourceProperties']['BucketName']
                      s3 = boto3.client('s3')
                      scripts = {
                          'access_management.py': '''import sys
          from awsglue.transforms import *
          from awsglue.utils import getResolvedOptions
          from pyspark.context import SparkContext
          from awsglue.context import GlueContext
          from awsglue.job import Job
          import boto3
          import json
          from datetime import datetime

          args = getResolvedOptions(sys.argv, ['JOB_NAME', 'output_path'])
          sc = SparkContext()
          glueContext = GlueContext(sc)
          spark = glueContext.spark_session
          job = Job(glueContext)
          job.init(args['JOB_NAME'], args)

          # Placeholder: Fetch QuickSight access data and write to S3
          quicksight = boto3.client('quicksight')
          # Add logic to list users, groups, etc.
          output_path = args['output_path']
          # Write sample data
          df = spark.createDataFrame([{"user": "admin", "action": "login"}])
          df.write.mode("overwrite").json(output_path)

          job.commit()''',
                          'dataset_metadata.py': '''import sys
          from awsglue.transforms import *
          from awsglue.utils import getResolvedOptions
          from pyspark.context import SparkContext
          from awsglue.context import GlueContext
          from awsglue.job import Job
          import boto3
          import json

          args = getResolvedOptions(sys.argv, ['JOB_NAME', 'output_path'])
          sc = SparkContext()
          glueContext = GlueContext(sc)
          spark = glueContext.spark_session
          job = Job(glueContext)
          job.init(args['JOB_NAME'], args)

          # Placeholder: Fetch dataset metadata
          quicksight = boto3.client('quicksight')
          output_path = args['output_path']
          df = spark.createDataFrame([{"dataset": "sales", "size": 100}])
          df.write.mode("overwrite").json(output_path)

          job.commit()''',
                          'folder_assets.py': '''import sys
          from awsglue.transforms import *
          from awsglue.utils import getResolvedOptions
          from pyspark.context import SparkContext
          from awsglue.context import GlueContext
          from awsglue.job import Job
          import boto3
          import json

          args = getResolvedOptions(sys.argv, ['JOB_NAME', 'output_path'])
          sc = SparkContext()
          glueContext = GlueContext(sc)
          spark = glueContext.spark_session
          job = Job(glueContext)
          job.init(args['JOB_NAME'], args)

          # Placeholder: Fetch folder-asset relationships
          quicksight = boto3.client('quicksight')
          output_path = args['output_path']
          df = spark.createDataFrame([{"folder": "reports", "asset": "dashboard1"}])
          df.write.mode("overwrite").json(output_path)

          job.commit()''',
                          'q_metadata.py': '''import sys
          from awsglue.transforms import *
          from awsglue.utils import getResolvedOptions
          from pyspark.context import SparkContext
          from awsglue.context import GlueContext
          from awsglue.job import Job
          import boto3
          import json

          args = getResolvedOptions(sys.argv, ['JOB_NAME', 'output_path'])
          sc = SparkContext()
          glueContext = GlueContext(sc)
          spark = glueContext.spark_session
          job = Job(glueContext)
          job.init(args['JOB_NAME'], args)

          # Placeholder: Fetch Q search index metadata
          quicksight = boto3.client('quicksight')
          output_path = args['output_path']
          df = spark.createDataFrame([{"index": "main", "documents": 1000}])
          df.write.mode("overwrite").json(output_path)

          job.commit()''',
                          'datasource_properties.py': '''import sys
          from awsglue.transforms import *
          from awsglue.utils import getResolvedOptions
          from pyspark.context import SparkContext
          from awsglue.context import GlueContext
          from awsglue.job import Job
          import boto3
          import json

          args = getResolvedOptions(sys.argv, ['JOB_NAME', 'output_path'])
          sc = SparkContext()
          glueContext = GlueContext(sc)
          spark = glueContext.spark_session
          job = Job(glueContext)
          job.init(args['JOB_NAME'], args)

          # Placeholder: Fetch datasource properties
          quicksight = boto3.client('quicksight')
          output_path = args['output_path']
          df = spark.createDataFrame([{"datasource": "rds", "type": "mysql"}])
          df.write.mode("overwrite").json(output_path)

          job.commit()'''
                      }
                      for key, content in scripts.items():
                          s3.put_object(Bucket=bucket, Key=f'scripts/{key}', Body=content)
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
              except Exception as e:
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': str(e)})
      Description: Uploads Glue ETL scripts to the script bucket.
  ScriptUploadCustomResource:
    Type: Custom::ScriptUpload
    DependsOn:
      - ScriptS3Bucket
      - ScriptUploadLambda
    Properties:
      ServiceToken: !GetAtt ScriptUploadLambda.Arn
      BucketName: !Ref ScriptBucketName
  GlueJobAccessManagement:
    Type: AWS::Glue::Job
    DependsOn:
      - ScriptUploadCustomResource
      - ConsolidatedIAMRole
    Properties:
      Name: quickSight-access-management
      Role: !GetAtt ConsolidatedIAMRole.Arn
      Command:
        Name: glueetl
        ScriptLocation: !Sub 's3://${ScriptBucketName}/scripts/access_management.py'
        PythonVersion: 3
      GlueVersion: '5.0'
      WorkerType: G.2X
      NumberOfWorkers: 5
      Timeout: 360
      DefaultArguments:
        '--output_path': !Sub 's3://${AdminS3Bucket}/pipeline/access_management/'
  GlueJobDatasetMetadata:
    Type: AWS::Glue::Job
    DependsOn:
      - ScriptUploadCustomResource
      - ConsolidatedIAMRole
    Properties:
      Name: quickSight-dataset-metadata
      Role: !GetAtt ConsolidatedIAMRole.Arn
      Command:
        Name: glueetl
        ScriptLocation: !Sub 's3://${ScriptBucketName}/scripts/dataset_metadata.py'
        PythonVersion: 3
      GlueVersion: '5.0'
      WorkerType: G.1X
      NumberOfWorkers: 2
      Timeout: 240
      DefaultArguments:
        '--output_path': !Sub 's3://${AdminS3Bucket}/pipeline/dataset_metadata/'
  GlueJobFolderAssets:
    Type: AWS::Glue::Job
    DependsOn:
      - ScriptUploadCustomResource
      - ConsolidatedIAMRole
    Properties:
      Name: quickSight-folder-assets
      Role: !GetAtt ConsolidatedIAMRole.Arn
      Command:
        Name: glueetl
        ScriptLocation: !Sub 's3://${ScriptBucketName}/scripts/folder_assets.py'
        PythonVersion: 3
      GlueVersion: '5.0'
      WorkerType: G.1X
      NumberOfWorkers: 2
      Timeout: 240
      DefaultArguments:
        '--output_path': !Sub 's3://${AdminS3Bucket}/pipeline/folder_assets/'
  GlueJobQMetadata:
    Type: AWS::Glue::Job
    DependsOn:
      - ScriptUploadCustomResource
      - ConsolidatedIAMRole
    Properties:
      Name: quickSight-q-metadata
      Role: !GetAtt ConsolidatedIAMRole.Arn
      Command:
        Name: glueetl
        ScriptLocation: !Sub 's3://${ScriptBucketName}/scripts/q_metadata.py'
        PythonVersion: 3
      GlueVersion: '5.0'
      WorkerType: G.1X
      NumberOfWorkers: 2
      Timeout: 240
      DefaultArguments:
        '--output_path': !Sub 's3://${AdminS3Bucket}/pipeline/q_metadata/'
  GlueJobDatasourceProperties:
    Type: AWS::Glue::Job
    DependsOn:
      - ScriptUploadCustomResource
      - ConsolidatedIAMRole
    Properties:
      Name: quickSight-datasource-properties
      Role: !GetAtt ConsolidatedIAMRole.Arn
      Command:
        Name: glueetl
        ScriptLocation: !Sub 's3://${ScriptBucketName}/scripts/datasource_properties.py'
        PythonVersion: 3
      GlueVersion: '5.0'
      WorkerType: G.1X
      NumberOfWorkers: 2
      Timeout: 240
      DefaultArguments:
        '--output_path': !Sub 's3://${AdminS3Bucket}/pipeline/datasource_properties/'
  GlueTriggerAccessManagement:
    Type: AWS::Glue::Trigger
    DependsOn:
      - GlueJobAccessManagement
    Properties:
      Name: trigger-access-management
      Type: SCHEDULED
      Schedule: cron(0 2 * * ? *)
      Actions:
        - JobName: !Ref GlueJobAccessManagement
  GlueTriggerDatasetMetadata:
    Type: AWS::Glue::Trigger
    DependsOn:
      - GlueJobDatasetMetadata
    Properties:
      Name: trigger-dataset-metadata
      Type: SCHEDULED
      Schedule: cron(15 2 * * ? *)
      Actions:
        - JobName: !Ref GlueJobDatasetMetadata
  GlueTriggerFolderAssets:
    Type: AWS::Glue::Trigger
    DependsOn:
      - GlueJobFolderAssets
    Properties:
      Name: trigger-folder-assets
      Type: SCHEDULED
      Schedule: cron(30 2 * * ? *)
      Actions:
        - JobName: !Ref GlueJobFolderAssets
  GlueTriggerQMetadata:
    Type: AWS::Glue::Trigger
    DependsOn:
      - GlueJobQMetadata
    Properties:
      Name: trigger-q-metadata
      Type: SCHEDULED
      Schedule: cron(45 2 * * ? *)
      Actions:
        - JobName: !Ref GlueJobQMetadata
  GlueTriggerDatasourceProperties:
    Type: AWS::Glue::Trigger
    DependsOn:
      - GlueJobDatasourceProperties
    Properties:
      Name: trigger-datasource-properties
      Type: SCHEDULED
      Schedule: cron(0 3 * * ? *)
      Actions:
        - JobName: !Ref GlueJobDatasourceProperties
  FirehoseDeliveryStreamIngestion:
    Type: AWS::KinesisFirehose::DeliveryStream
    DependsOn:
      - AdminS3Bucket
      - ConsolidatedIAMRole
    Properties:
      DeliveryStreamName: quickSight-ingestion-metrics
      DeliveryStreamType: DirectPut
      S3DestinationConfiguration:
        BucketARN: !GetAtt AdminS3Bucket.Arn
        Prefix: cloudwatch/ingestion/
        BufferingHints:
          IntervalInSeconds: 60
          SizeInMBs: 5
        CompressionFormat: GZIP
        RoleARN: !GetAtt ConsolidatedIAMRole.Arn
  FirehoseDeliveryStreamDashboard:
    Type: AWS::KinesisFirehose::DeliveryStream
    DependsOn:
      - AdminS3Bucket
      - ConsolidatedIAMRole
    Properties:
      DeliveryStreamName: quickSight-dashboard-metrics
      DeliveryStreamType: DirectPut
      S3DestinationConfiguration:
        BucketARN: !GetAtt AdminS3Bucket.Arn
        Prefix: cloudwatch/dashboard/
        BufferingHints:
          IntervalInSeconds: 60
          SizeInMBs: 5
        CompressionFormat: GZIP
        RoleARN: !GetAtt ConsolidatedIAMRole.Arn
  FirehoseDeliveryStreamSpice:
    Type: AWS::KinesisFirehose::DeliveryStream
    DependsOn:
      - AdminS3Bucket
      - ConsolidatedIAMRole
    Properties:
      DeliveryStreamName: quickSight-spice-metrics
      DeliveryStreamType: DirectPut
      S3DestinationConfiguration:
        BucketARN: !GetAtt AdminS3Bucket.Arn
        Prefix: cloudwatch/spice/
        BufferingHints:
          IntervalInSeconds: 60
          SizeInMBs: 5
        CompressionFormat: GZIP
        RoleARN: !GetAtt ConsolidatedIAMRole.Arn
  FirehoseDeliveryStreamQIndex:
    Type: AWS::KinesisFirehose::DeliveryStream
    DependsOn:
      - AdminS3Bucket
      - ConsolidatedIAMRole
    Properties:
      DeliveryStreamName: quickSight-qindex-metrics
      DeliveryStreamType: DirectPut
      S3DestinationConfiguration:
        BucketARN: !GetAtt AdminS3Bucket.Arn
        Prefix: cloudwatch/qindex/
        BufferingHints:
          IntervalInSeconds: 60
          SizeInMBs: 5
        CompressionFormat: GZIP
        RoleARN: !GetAtt ConsolidatedIAMRole.Arn
  FirehoseDeliveryStreamQAction:
    Type: AWS::KinesisFirehose::DeliveryStream
    DependsOn:
      - AdminS3Bucket
      - ConsolidatedIAMRole
    Properties:
      DeliveryStreamName: quickSight-qaction-metrics
      DeliveryStreamType: DirectPut
      S3DestinationConfiguration:
        BucketARN: !GetAtt AdminS3Bucket.Arn
        Prefix: cloudwatch/qaction/
        BufferingHints:
          IntervalInSeconds: 60
          SizeInMBs: 5
        CompressionFormat: GZIP
        RoleARN: !GetAtt ConsolidatedIAMRole.Arn
  MetricStreamIngestion:
    Type: AWS::CloudWatch::MetricStream
    DependsOn:
      - FirehoseDeliveryStreamIngestion
      - ConsolidatedIAMRole
    Properties:
      Name: quickSight-ingestion-metric-stream
      FirehoseArn: !GetAtt FirehoseDeliveryStreamIngestion.Arn
      RoleArn: !GetAtt ConsolidatedIAMRole.Arn
      OutputFormat: json
      IncludeFilters:
        - Namespace: AWS/QuickSight
          MetricNames:
            - IngestionSuccess
            - IngestionFailure
            - IngestionLatency
            - DatasetCount
  MetricStreamDashboard:
    Type: AWS::CloudWatch::MetricStream
    DependsOn:
      - FirehoseDeliveryStreamDashboard
      - ConsolidatedIAMRole
    Properties:
      Name: quickSight-dashboard-metric-stream
      FirehoseArn: !GetAtt FirehoseDeliveryStreamDashboard.Arn
      RoleArn: !GetAtt ConsolidatedIAMRole.Arn
      OutputFormat: json
      IncludeFilters:
        - Namespace: AWS/QuickSight
          MetricNames:
            - DashboardCount
            - VisualCount
            - DashboardViewCount
            - DashboardErrorCount
  MetricStreamSpice:
    Type: AWS::CloudWatch::MetricStream
    DependsOn:
      - FirehoseDeliveryStreamSpice
      - ConsolidatedIAMRole
    Properties:
      Name: quickSight-spice-metric-stream
      FirehoseArn: !GetAtt FirehoseDeliveryStreamSpice.Arn
      RoleArn: !GetAtt ConsolidatedIAMRole.Arn
      OutputFormat: json
      IncludeFilters:
        - Namespace: AWS/QuickSight
          MetricNames:
            - SpiceCapacityUsed
            - SpiceCapacityRemaining
            - SpiceIngestionSuccess
            - SpiceIngestionFailure
  MetricStreamQIndex:
    Type: AWS::CloudWatch::MetricStream
    DependsOn:
      - FirehoseDeliveryStreamQIndex
      - ConsolidatedIAMRole
    Properties:
      Name: quickSight-qindex-metric-stream
      FirehoseArn: !GetAtt FirehoseDeliveryStreamQIndex.Arn
      RoleArn: !GetAtt ConsolidatedIAMRole.Arn
      OutputFormat: json
      IncludeFilters:
        - Namespace: AWS/QuickSight
          MetricNames:
            - QIndexDocumentCount
            - QIndexTextSize
            - QIndexUpdateSuccess
            - QIndexUpdateFailure
  MetricStreamQAction:
    Type: AWS::CloudWatch::MetricStream
    DependsOn:
      - FirehoseDeliveryStreamQAction
      - ConsolidatedIAMRole
    Properties:
      Name: quickSight-qaction-metric-stream
      FirehoseArn: !GetAtt FirehoseDeliveryStreamQAction.Arn
      RoleArn: !GetAtt ConsolidatedIAMRole.Arn
      OutputFormat: json
      IncludeFilters:
        - Namespace: AWS/QuickSight
          MetricNames:
            - QActionInvocationCount
            - QActionErrorCount
            - QActionLatency
Outputs:
  AdminBucketName:
    Description: Name of the admin S3 bucket
    Value: !Ref AdminS3Bucket
  ScriptBucketName:
    Description: Name of the script S3 bucket
    Value: !Ref ScriptS3Bucket
  ConsolidatedRoleArn:
    Description: ARN of the consolidated IAM role
    Value: !GetAtt ConsolidatedIAMRole.Arn
  GlueJobAccessManagementName:
    Description: Name of the access management Glue job
    Value: !Ref GlueJobAccessManagement
  GlueJobDatasetMetadataName:
    Description: Name of the dataset metadata Glue job
    Value: !Ref GlueJobDatasetMetadata
  GlueJobFolderAssetsName:
    Description: Name of the folder assets Glue job
    Value: !Ref GlueJobFolderAssets
  GlueJobQMetadataName:
    Description: Name of the Q metadata Glue job
    Value: !Ref GlueJobQMetadata
  GlueJobDatasourcePropertiesName:
    Description: