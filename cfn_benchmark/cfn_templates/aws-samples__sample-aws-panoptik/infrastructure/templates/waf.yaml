AWSTemplateFormatVersion: "2010-09-09"
Description: "Panoptik — WAF WebACL for CloudFront"

Parameters:
  EnvironmentName:
    Type: String
    Default: dev

Resources:
  WebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub "panoptik-${EnvironmentName}-waf"
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub "panoptik-${EnvironmentName}-waf"

      Rules:
        # Common Rule Set
        - Name: AWSManagedRulesCommonRuleSet
          Priority: 1
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "panoptik-${EnvironmentName}-common-rules"

        # Known Bad Inputs
        - Name: AWSManagedRulesKnownBadInputsRuleSet
          Priority: 2
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "panoptik-${EnvironmentName}-bad-inputs"

        # Rate Limiting
        - Name: RateLimit
          Priority: 3
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: 1000
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub "panoptik-${EnvironmentName}-rate-limit"

      Tags:
        - Key: Name
          Value: !Sub "panoptik-${EnvironmentName}-waf"

Outputs:
  WebACLArn:
    Value: !GetAtt WebACL.Arn
    Export:
      Name: !Sub "panoptik-${EnvironmentName}-waf-arn"
  WebACLId:
    Value: !GetAtt WebACL.Id