AWSTemplateFormatVersion: '2010-09-09'
Description: Amazon Bedrock AgentCore Runtime for Vespa Sales Agent

Parameters:
  ContainerImageUri:
    Type: String
    Description: Amazon ECR image URI for the agent container

  UserPoolId:
    Type: String
    Description: Amazon Cognito User Pool ID for authentication

  WebClientId:
    Type: String
    Description: Web client ID (Authorization Code flow)

  M2MClientId:
    Type: String
    Description: M2M client ID (Client Credentials flow)

  VespaUrl:
    Type: String
    Description: Vespa Cloud endpoint URL

  VespaCertSecretArn:
    Type: String
    Description: AWS Secrets Manager ARN for Vespa mTLS certificate

  VespaKeySecretArn:
    Type: String
    Description: AWS Secrets Manager ARN for Vespa mTLS private key

  AgentModelId:
    Type: String
    Default: global.anthropic.claude-haiku-4-5-20251001-v1:0
    Description: Amazon Bedrock model ID for the agent

Resources:
  RuntimeExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BedrockAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  # Foundation models (no region in ARN)
                  - 'arn:aws:bedrock:*::foundation-model/*'
                  # Cross-region inference profiles
                  - !Sub 'arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*'
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref VespaCertSecretArn
                  - !Ref VespaKeySecretArn
        - PolicyName: ECRAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # ecr:GetAuthorizationToken does not support resource-level permissions
              # and requires Resource: '*' per AWS documentation:
              # https://docs.aws.amazon.com/AmazonECR/latest/userguide/security_iam_id-based-policy-examples.html
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: !Sub 'arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/vespa-sales-agent'
        - PolicyName: CloudWatchLogsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/agentcore/*'

  AgentRuntime:
    Type: AWS::BedrockAgentCore::Runtime
    Properties:
      AgentRuntimeName: vespa_sales_agent
      AgentRuntimeArtifact:
        ContainerConfiguration:
          ContainerUri: !Ref ContainerImageUri
      ProtocolConfiguration: HTTP
      RoleArn: !GetAtt RuntimeExecutionRole.Arn
      NetworkConfiguration:
        NetworkMode: PUBLIC
      AuthorizerConfiguration:
        CustomJWTAuthorizer:
          DiscoveryUrl: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPoolId}/.well-known/openid-configuration'
          AllowedClients:
            - !Ref WebClientId
            - !Ref M2MClientId
      EnvironmentVariables:
        AWS_REGION: !Ref 'AWS::Region'
        VESPA_URL: !Ref VespaUrl
        VESPA_CERT_SECRET_ARN: !Ref VespaCertSecretArn
        VESPA_KEY_SECRET_ARN: !Ref VespaKeySecretArn
        AGENT_MODEL_ID: !Ref AgentModelId
        BEDROCK_REGION: !Ref 'AWS::Region'

Outputs:
  RuntimeArn:
    Description: Amazon Bedrock AgentCore Runtime ARN
    Value: !GetAtt AgentRuntime.AgentRuntimeArn