AWSTemplateFormatVersion: '2010-09-09'
Description: |
  KALIQ Data Stack (Stack B)
  - S3 buckets for raw data and artifacts
  - DynamoDB table for metadata + lineage (kaliq-meta-${Env})
  - Enforcement: block public access, enforce TLS, PAY_PER_REQUEST billing
  - Reference: docs/infrastructure/STACKS.md, docs/data/DYNAMODB_ACCESS_PATTERNS.md

Parameters:
  Project:
    Type: String
    Default: kaliq
    Description: Project name used in resource naming and tagging

  Env:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - qa
      - prod
    Description: Environment name (affects resource uniqueness and naming)

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Stack Parameters"
        Parameters:
          - Project
          - Env

Resources:
  # =============================================================================
  # S3 Buckets for Raw Data and Artifacts
  # =============================================================================

  RawBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${Project}-raw-${Env}'
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldObjects
            Status: Enabled
            ExpirationInDays: 90
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Env
          Value: !Ref Env
        - Key: Purpose
          Value: Raw data ingestion

  # Enforce TLS on raw bucket: deny non-SSL requests
  RawBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref RawBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyUnencryptedObjectUploads
            Effect: Deny
            Principal: '*'
            Action: 's3:PutObject'
            Resource: !Sub '${RawBucket.Arn}/*'
            Condition:
              StringNotEquals:
                's3:x-amz-server-side-encryption': 'AES256'
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt RawBucket.Arn
              - !Sub '${RawBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${Project}-artifacts-${Env}'
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldObjects
            Status: Enabled
            ExpirationInDays: 90
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Env
          Value: !Ref Env
        - Key: Purpose
          Value: Pipeline artifacts and outputs

  # Enforce TLS on artifacts bucket: deny non-SSL requests
  ArtifactsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyUnencryptedObjectUploads
            Effect: Deny
            Principal: '*'
            Action: 's3:PutObject'
            Resource: !Sub '${ArtifactsBucket.Arn}/*'
            Condition:
              StringNotEquals:
                's3:x-amz-server-side-encryption': 'AES256'
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt ArtifactsBucket.Arn
              - !Sub '${ArtifactsBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

  # =============================================================================
  # DynamoDB Table for Metadata + Lineage
  # =============================================================================
  # Schema Reference: docs/data/DYNAMODB_ACCESS_PATTERNS.md
  # - PK: Partition key (string)
  # - SK: Sort key (string)
  # - GSI1: Runs-by-pipeline index for latest success run queries

  MetadataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${Project}-meta-${Env}'
      AttributeDefinitions:
        # Main table attributes
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        # GSI1 attributes (runs-by-pipeline)
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        # Primary key: PK (partition) + SK (sort)
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
      # Point-in-time recovery recommended for data resilience
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      # GSI1: Runs-by-pipeline (latest success run queries)
      # Query pattern: PK=PIPE#<pipelineId>, sorted by status+timestamp
      GlobalSecondaryIndexes:
        - IndexName: GSI1-Runs-by-Pipeline
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Env
          Value: !Ref Env
        - Key: Purpose
          Value: Metadata and lineage

Outputs:
  # DynamoDB table name (used by workloads and IAM policies)
  TableName:
    Description: DynamoDB metadata table name
    Value: !Ref MetadataTable
    Export:
      Name: !Sub '${Project}-${Env}-MetadataTableName'

  # Raw bucket name (used by workloads and IAM policies)
  RawBucketName:
    Description: S3 raw data bucket name
    Value: !Ref RawBucket
    Export:
      Name: !Sub '${Project}-${Env}-RawBucketName'

  # Artifacts bucket name (used by workloads and IAM policies)
  ArtifactsBucketName:
    Description: S3 artifacts bucket name
    Value: !Ref ArtifactsBucket
    Export:
      Name: !Sub '${Project}-${Env}-ArtifactsBucketName'