      Name: LoanApplicationResourceServer
      Scopes:
        - ScopeName: access
          ScopeDescription: Access scope for LoanApplication
      UserPoolId:
        Ref: LoanApplicationUserPool

  LoanApplicationUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: LoanApplicationResourceServer
    Properties:
      ClientName: LoanApplicationClient
      UserPoolId:
        Ref: LoanApplicationUserPool
      GenerateSecret: true
      AllowedOAuthFlows:
        - client_credentials
      AllowedOAuthScopes:
        - Fn::Sub: https://loan-application-${AWS::AccountId}/access
      AllowedOAuthFlowsUserPoolClient: true
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      SupportedIdentityProviders:
        - COGNITO

Outputs:
  StudentServicesAgentExecutionRoleArn:
    Description: ARN of the StudentServicesAgent execution role
    Value:
      Fn::GetAtt: StudentServicesAgentExecutionRole.Arn
    Export:
      Name: StudentServicesAgentExecutionRoleArn

  StudentServicesGatewayUserPoolId:
    Description: User Pool ID for StudentServicesGateway
    Value:
      Ref: StudentServicesGatewayUserPool
    Export:
      Name: StudentServicesGatewayUserPoolId

  StudentServicesGatewayOIDCDiscoveryURL:
    Description: OIDC discovery URL for StudentServicesGateway
    Value:
      Fn::Sub: https://cognito-idp.${AWS::Region}.amazonaws.com/${StudentServicesGatewayUserPool}
    Export:
      Name: StudentServicesGatewayOIDCDiscoveryURL

  StudentServicesGatewayAppClientId:
    Description: App client ID for StudentServicesGateway
    Value:
      Ref: StudentServicesGatewayUserPoolClient
    Export:
      Name: StudentServicesGatewayAppClientId

  StudentServicesGatewayTokenEndpoint:
    Description: Token endpoint for StudentServicesGateway
    Value:
      Fn::Sub: https://student-gateway-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com/oauth2/token
    Export:
      Name: StudentServicesGatewayTokenEndpoint

  StudentServicesGatewayOAuthScope:
    Description: OAuth scope for StudentServicesGateway
    Value:
      Fn::Sub: https://student-gateway-${AWS::AccountId}/access
    Export:
      Name: StudentServicesGatewayOAuthScope

  CourseRegistrationExecutionRoleArn:
    Description: ARN of the CourseRegistration execution role
    Value:
      Fn::GetAtt: CourseRegistrationExecutionRole.Arn
    Export:
      Name: CourseRegistrationExecutionRoleArn

  CourseRegistrationUserPoolId:
    Description: User Pool ID for CourseRegistration
    Value:
      Ref: CourseRegistrationUserPool
    Export:
      Name: CourseRegistrationUserPoolId

  CourseRegistrationOIDCDiscoveryURL:
    Description: OIDC discovery URL for CourseRegistration
    Value:
      Fn::Sub: https://cognito-idp.${AWS::Region}.amazonaws.com/${CourseRegistrationUserPool}
    Export:
      Name: CourseRegistrationOIDCDiscoveryURL

  CourseRegistrationAppClientId:
    Description: App client ID for CourseRegistration
    Value:
      Ref: CourseRegistrationUserPoolClient
    Export:
      Name: CourseRegistrationAppClientId

  CourseRegistrationTokenEndpoint:
    Description: Token endpoint for CourseRegistration
    Value:
      Fn::Sub: https://course-registration-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com/oauth2/token
    Export:
      Name: CourseRegistrationTokenEndpoint

  CourseRegistrationOAuthScope:
    Description: OAuth scope for CourseRegistration
    Value:
      Fn::Sub: https://course-registration-${AWS::AccountId}/access
    Export:
      Name: CourseRegistrationOAuthScope

  CourseCatalogExecutionRoleArn:
