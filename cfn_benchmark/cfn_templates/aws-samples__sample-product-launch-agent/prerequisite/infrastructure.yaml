AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFormation template for Financial Product Launch System with DynamoDB tables, SSM parameters, and synthetic data'
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Lambda Code Configuration
        Parameters:
          - LambdaS3Bucket
          - LambdaS3Key

Parameters:

  LambdaS3Bucket:
    Description: The name of S3 bucket which contains lambda code
    Type: String
    MinLength: 1

  LambdaS3Key:
    Description: The S3 object key which contains customer support assistant code in zip format
    Type: String
    MinLength: 1

  LayerS3Key:
    Type: String
    Description: 'S3 key for the DDGS layer zip file'
    MinLength: 1

Resources:

  # KMS Key for DynamoDB Encryption
  DynamoDBKMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: CMK for DynamoDB table encryption
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: Allow DynamoDB to use the key
            Effect: Allow
            Principal:
              Service: dynamodb.amazonaws.com
            Action:
              - 'kms:Decrypt'
              - 'kms:DescribeKey'
              - 'kms:CreateGrant'
            Resource: '*'
            Condition:
              StringEquals:
                'kms:ViaService': !Sub 'dynamodb.${AWS::Region}.amazonaws.com'
      Tags:
        - Key: Application
          Value: ProductLaunch

  DynamoDBKMSKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/productlaunch-dynamodb
      TargetKeyId: !Ref DynamoDBKMSKey

  RuntimeAgentCoreRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - bedrock-agentcore.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: BedrockAgentPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ECRImageAccess
                Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource:
                  - !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/bedrock_agentcore-productlaunch*
              - Effect: Allow
                Action:
                  - logs:DescribeLogStreams
                  - logs:CreateLogGroup
                Resource:
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*
              - Effect: Allow
                Action:
                  - logs:DescribeLogGroups
                Resource:
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:*
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*:log-stream:*
              - Sid: ECRTokenAccess
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                  - xray:GetSamplingRules
                  - xray:GetSamplingTargets
                Resource: "*"
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals:
                    cloudwatch:namespace: bedrock-agentcore
              - Sid: GetAgentAccessToken
                Effect: Allow
                Action:
                  - bedrock-agentcore:GetWorkloadAccessToken
                  - bedrock-agentcore:GetWorkloadAccessTokenForJWT
                  - bedrock-agentcore:GetWorkloadAccessTokenForUserId
                Resource:
                  - !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default
                  - !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default/workload-identity/productlaunch*
              - Sid: ProvisionedThroughputModelInvocation
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - "arn:aws:bedrock:*::foundation-model/*"
                  - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:*
              - Sid: SSMGetparam
                Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/app/productlaunch/*
              - Sid: Identity
                Effect: Allow
                Action:
                  - bedrock-agentcore:GetResourceOauth2Token
                Resource:
                  - !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:token-vault/default/oauth2credentialprovider/productlaunch*
                  - !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default/workload-identity/productlaunch*
                  - !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default
                  - !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:token-vault/default
              - Sid: SecretManager
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:bedrock-agentcore-identity!default/oauth2/productlaunch*
              - Sid: AgentCoreMemory
                Effect: Allow
                Action:
                  - bedrock-agentcore:ListMemories
                  - bedrock-agentcore:ListMemoryRecords
                  - bedrock-agentcore:RetrieveMemoryRecords
                  - bedrock-agentcore:GetMemory
                  - bedrock-agentcore:GetMemoryRecord
                  - bedrock-agentcore:CreateEvent
                  - bedrock-agentcore:GetEvent
                Resource:
                  - !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:memory/productlaunch*

  GatewayAgentCoreRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - bedrock-agentcore.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: BedrockAgentPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: InvokeFunction
                Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt ProductLaunchLambda.Arn

  # DynamoDB Table for Compliance Information
  ComplianceTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: product_type
          AttributeType: S
        - AttributeName: region
          AttributeType: S
      KeySchema:
        - AttributeName: product_type
          KeyType: HASH
        - AttributeName: region
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref DynamoDBKMSKey
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: ProductLaunch
        - Key: CostCenter
          Value: ProductLaunch

  # DynamoDB Table for Product Performance Data
  ProductPerformanceTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: product_id
          AttributeType: S
      KeySchema:
        - AttributeName: product_id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref DynamoDBKMSKey
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Application
          Value: ProductLaunch
        - Key: CostCenter
          Value: ProductLaunch

  # Lambda function to populate synthetic data
  PopulateDataFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt PopulateDataRole.Arn
      Timeout: 120
      Code:
        ZipFile: |
          import boto3
          import json
          import cfnresponse
          from datetime import datetime, timedelta
          import random
          import uuid
          from decimal import Decimal

          def lambda_handler(event, context):
              try:
                  if event['RequestType'] == 'Create':
                      dynamodb = boto3.resource('dynamodb')
                      compliance_table_name = event['ResourceProperties']['ComplianceTableName']
                      performance_table_name = event['ResourceProperties']['PerformanceTableName']

                      compliance_table = dynamodb.Table(compliance_table_name)
                      performance_table = dynamodb.Table(performance_table_name)

                      # Compliance data
                      compliance_data = [
                          {
                              'product_type': 'auto_loan',
                              'region': 'US',
                              'federal_regulations': ['TILA', 'FCRA', 'ECOA'],
                              'state_regulations': ['State Lending License Required'],
                              'estimated_timeline': '6-9 months',
                              'compliance_status': 'Ready for Review'
                          },
                          {
                              'product_type': 'personal_loan',
                              'region': 'US',
                              'federal_regulations': ['TILA', 'FCRA'],
                              'state_regulations': ['Varies by state'],
                              'estimated_timeline': '4-6 months',
                              'compliance_status': 'In Progress'
                          },
                          {
                              'product_type': 'credit_card',
                              'region': 'US',
                              'federal_regulations': ['CARD Act', 'TILA', 'FCRA'],
                              'state_regulations': ['Minimal state requirements'],
                              'estimated_timeline': '8-12 months',
                              'compliance_status': 'Planning Phase'
                          }
                      ]

                      # Product performance data
                      performance_data = [
                          {
                              'product_id': 'AUTO_LOAN_2023',
                              'product_name': 'Auto Loan Premium 2023',
                              'launch_date': '2023-03-15',
                              'margin': '15.2%',
                              'market_share': '8.3%',
                              'customer_satisfaction': Decimal('4.2'),
                              'revenue_ytd': '$45.2M',
                              'active_accounts': 12450,
                              'default_rate': '2.1%'
                          },
                          {
                              'product_id': 'PERSONAL_LOAN_PRIME',
                              'product_name': 'Personal Loan Prime',
                              'launch_date': '2023-06-01',
                              'margin': '12.8%',
                              'market_share': '5.7%',
                              'customer_satisfaction': Decimal('4.0'),
                              'revenue_ytd': '$28.7M',
                              'active_accounts': 8920,
                              'default_rate': '3.2%'
                          },
                          {
                              'product_id': 'CREDIT_CARD_REWARDS',
                              'product_name': 'Rewards Credit Card',
                              'launch_date': '2023-09-10',
                              'margin': '18.5%',
                              'market_share': '3.2%',
                              'customer_satisfaction': Decimal('4.4'),
                              'revenue_ytd': '$22.1M',
                              'active_accounts': 15680,
                              'default_rate': '1.8%'
                          }
                      ]

                      # Insert compliance data
                      with compliance_table.batch_writer() as batch:
                          for item in compliance_data:
                              batch.put_item(Item=item)

                      # Insert performance data
                      with performance_table.batch_writer() as batch:
                          for item in performance_data:
                              batch.put_item(Item=item)

                      print(f"Successfully populated {len(compliance_data)} compliance records")
                      print(f"Successfully populated {len(performance_data)} performance records")
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})

                  else:
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})

              except Exception as e:
                  print(f"Error: {str(e)}")
                  cfnresponse.send(event, context, cfnresponse.FAILED, {})

  # IAM Role for Lambda function
  PopulateDataRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DynamoDBWritePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:BatchWriteItem
                Resource:
                  - !GetAtt ComplianceTable.Arn
                  - !GetAtt ProductPerformanceTable.Arn
        - PolicyName: KMSDecryptPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                  - kms:GenerateDataKey
                Resource:
                  - !GetAtt DynamoDBKMSKey.Arn
        - PolicyName: AllowBasicLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: arn:aws:logs:*:*:*
  # Custom resource to trigger Lambda function
  PopulateData:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt PopulateDataFunction.Arn
      ComplianceTableName: !Ref ComplianceTable
      PerformanceTableName: !Ref ProductPerformanceTable
    DependsOn:
      - ComplianceTable
      - ProductPerformanceTable

  # Lambda target
  ProductLaunchLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /service-role/
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
      Policies:
        - PolicyName: ComplianceAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AllowReadComplianceTableNameFromSSM
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ComplianceTableNameParameter}

              - Sid: AllowReadComplianceTable
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:DescribeTable
                Resource: !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ComplianceTable}

        - PolicyName: ProductPerformanceAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AllowReadPerformanceTableNameFromSSM
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ProductPerformanceTableNameParameter}

              - Sid: AllowReadPerformanceTable
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:DescribeTable
                Resource: !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProductPerformanceTable}

  DDGSLayer:
    Type: AWS::Lambda::LayerVersion
    Properties:
      LayerName: !Sub "${AWS::StackName}-ddgs-layer"
      Description: 'DDGS package for Lambda functions'
      Content:
        S3Bucket: !Ref  LambdaS3Bucket
        S3Key: !Ref LayerS3Key
      CompatibleRuntimes:
        - python3.12
      CompatibleArchitectures:
        - x86_64

  ProductLaunchLambda:
    Type: AWS::Lambda::Function
    Properties:
      Description: 'Lambda function for Product Launch Assistant'
      Handler: lambda_function.lambda_handler
      Code:
        S3Bucket: !Ref LambdaS3Bucket
        S3Key: !Ref LambdaS3Key
      Role: !GetAtt ProductLaunchLambdaRole.Arn
      Runtime: python3.12
      PackageType: Zip
      Architectures:
        - x86_64
      Layers:
        - !Ref DDGSLayer
      Environment:
        Variables:
          PYTHONPATH: /opt/python

# SSM Parameter to store compliance table name
  ComplianceTableNameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /app/productlaunch/dynamodb/compliance_table_name
      Type: String
      Value: !Ref ComplianceTable
      Description: DynamoDB table name for compliance information
      Tags:
        Application: ProductLaunch

  # SSM Parameter to store product performance table name
  ProductPerformanceTableNameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /app/productlaunch/dynamodb/performance_table_name
      Type: String
      Value: !Ref ProductPerformanceTable
      Description: DynamoDB table name for product performance data
      Tags:
        Application: ProductLaunch

  GatewayAgentcoreIAMRoleParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /app/productlaunch/agentcore/gateway_iam_role
      Type: String
      Value: !GetAtt GatewayAgentCoreRole.Arn
      Description: agentcore IAM role to assume
      Tags:
        Application: ProductLaunch

  RuntimeAgentcoreIAMRoleParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /app/productlaunch/agentcore/runtime_iam_role
      Type: String
      Value: !GetAtt RuntimeAgentCoreRole.Arn
      Description: agentcore IAM role to assume
      Tags:
        Application: ProductLaunch

  LambdaArnParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /app/productlaunch/agentcore/lambda_arn
      Type: String
      Value: !GetAtt ProductLaunchLambda.Arn
      Description: ARN of the lambda that integrates with agentcore
      Tags:
        Application: ProductLaunch