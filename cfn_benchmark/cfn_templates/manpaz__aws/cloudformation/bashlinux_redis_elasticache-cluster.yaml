---
# Bashlinux::Redis::Elasticache Cluster
#
#   Cloudformation template to deploy an Elasticache Redis cluster
#
#   Manuel F Martinez
#   Bashlinux
#   Los Angeles, CA
#
AWSTemplateFormatVersion: "2010-09-09"
Description: Elasticache Redis Cluster template

###############################################################################
Parameters:

  Environment:
    Description: Elasticache Redis cluster environment
    Type: String
    MinLength: "1"
    MaxLength: "20"
    Default: staging
    AllowedValues: [ "prod", "staging" ]
    ConstraintDescription: >
      Environment name can only contain "prod" or "staging".

  ElasticacheInstanceSize:
    Description: Elasticache instance size for Redis nodes
    Type: String
    MinLength: "1"
    MaxLength: "64"
    Default: cache.t4g.micro
    AllowedValues:
    - cache.t4g.micro
    - cache.t4g.small
    - cache.t4g.medium
    - cache.t4g.large
    - cache.m7g.medium
    - cache.m7g.large
    - cache.m7g.xlarge
    - cache.m7g.2xlarge
    - cache.r7g.medium
    - cache.r7g.large
    - cache.r7g.xlarge
    - cache.r7g.2xlarge
    ConstraintDescription: >
      EC2 instance size must be micro, small, medium, or large of the "t4g" type
      or medium, large, xlarge, or 2xlarge of the "m7g" or "r7g" type.

  ElasticacheFailover:
    Description: Enable Redis failover
    Type: String
    MinLength: "4"
    MaxLength: "5"
    Default: "false"
    AllowedValues: ["true", "false"]
    ConstraintDescription: The value can only be "true" or "false".

  ElasticacheNumNodes:
    Description: Number of nodes
    Type: Number
    MinValue: "0"
    MaxValue: "3"
    Default: "0"
    ConstraintDescription: >
      The number of read replicas must be less or equal than 3

  ElasticacheNumReplicas:
    Description: Number of read replicas
    Type: Number
    MinValue: "0"
    MaxValue: "3"
    Default: "0"
    ConstraintDescription: >
      The number of read replicas must be less or equal than 3

  ElasticacheRedisEngineVersion:
    Description: Elasticache Engine version for Redis
    Type: String
    MinLength: "1"
    MaxLength: "32"
    Default: "7.1"
    AllowedValues:
    - "7.1"
    - "7.0"
    - "6.2"
    - "6.0"
    - "5.0.6"
    ConstraintDescription: Elasticache Redis must be a valid version.

  Organization:
    Description: Organization or Customer name
    Type: String
    MinLength: "1"
    MaxLength: "32"
    Default: bashlinux
    AllowedPattern: "[a-zA-Z0-9\\-]*"
    ConstraintDescription: >
      Name of the organization must contains only letters, numbers and hyphens

###############################################################################
Resources:

  ElasticacheReplicationGroup:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      AutomaticFailoverEnabled: !Ref ElasticacheFailover
      CacheNodeType: !Ref ElasticacheInstanceSize
      CacheSubnetGroupName: !ImportValue
        "Fn::Sub": "${Organization}-${Environment}-ElasticacheSubnetGroupId"
      Engine: redis
      EngineVersion: !Ref ElasticacheRedisEngineVersion
      KmsKeyId: !Sub "alias/${Organization}/elasticache/${Environment}"
      NumNodeGroups: "1"
      ReplicasPerNodeGroup: !Ref ElasticacheNumReplicas
      PreferredMaintenanceWindow: "sun:05:00-sun:09:00"
      ReplicationGroupId: !Sub "cache01-${Organization}-${Environment}"
      ReplicationGroupDescription: !Sub "Redis cache instance for ${Organization} on ${Environment}"
      SecurityGroupIds:
        - !ImportValue
          "Fn::Sub": "${Organization}-${Environment}-ElasticacheRedisSecurityGroupId"
      SnapshotRetentionLimit: 5
      SnapshotWindow: "10:00-12:00"
      Tags:
      - Key: bashlinux:network-visibility
        Value: private
      - Key: bashlinux:organization-name
        Value: !Ref Organization
      - Key: bashlinux:environment-name
        Value: !Ref Environment
      - Key: bashlinux:can-delete
        Value: "false"
      - Key: bashlinux:application-id
        Value: !Ref AWS::StackName
      - Key: Name
        Value: !Sub "cache01-${Organization}-${Environment}"

###############################################################################
Outputs:

  ElasticacheRedisId:
    Description: "Elasticache: Redis cluster ID"
    Value: !Ref ElasticacheReplicationGroup

  ElasticacheRedisEndpoint:
    Description: "Elasticache: Redis cluster DNS address of the primary r/w cache node"
    Value: !GetAtt ElasticacheReplicationGroup.PrimaryEndPoint.Address