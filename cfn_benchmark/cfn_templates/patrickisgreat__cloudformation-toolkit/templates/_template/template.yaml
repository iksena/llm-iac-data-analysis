AWSTemplateFormatVersion: "2010-09-09"

# Scaffold for a new template. `./bin/cfn new <group>/<name>` copies this
# directory; replace the resources with the real ones and keep the shape.
#
# The shape is the point. Every template in this library:
#   * takes NamePrefix and Environment, and derives every physical name from them
#   * groups its parameters for the console (Metadata.AWS::CloudFormation::Interface)
#   * uses Conditions where Terraform would use `count` — optional resources
#     appear and disappear with a boolean parameter
#   * outputs the identifiers a caller needs to wire it to something else
#   * declares no provider config, no account ID, no region — those come from
#     the deploy, not the template
#
# Resource tagging is deliberately sparse: `bin/cfn deploy` applies stack-level
# tags, and CloudFormation propagates those to every resource type that supports
# tagging. Only tag in-template when a resource needs a tag the stack cannot
# supply (a Name tag, or a tag another service keys off).

Description: >-
  Scaffold template. Replace this description with one sentence saying what this
  template provisions and who it is for.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Naming
        Parameters:
          - NamePrefix
          - Environment
      - Label:
          default: Logging
        Parameters:
          - LogRetentionDays
      - Label:
          default: Optional features
        Parameters:
          - CreateAlarmTopic

Parameters:
  NamePrefix:
    Type: String
    Description: >-
      Prefix for every resource this stack names. Must be unique per account and
      region, since physical names collide across stacks.
    AllowedPattern: "^[a-z][a-z0-9-]{1,30}[a-z0-9]$"
    ConstraintDescription: >-
      3-32 characters, lowercase letters, digits and hyphens, starting with a
      letter and ending with a letter or digit.

  Environment:
    Type: String
    Description: Environment this stack belongs to. Used in names and tags.
    Default: dev
    AllowedValues: [dev, staging, prod]

  LogRetentionDays:
    Type: Number
    Description: >-
      How long to keep logs. CloudWatch keeps logs forever when unset, which
      bills forever.
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1827, 3653]

  CreateAlarmTopic:
    Type: String
    Description: >-
      Create an SNS topic for this component's alarms. Turn it off and pass an
      existing topic ARN in instead when the environment already has one.
    Default: "true"
    AllowedValues: ["true", "false"]

Conditions:
  ShouldCreateAlarmTopic: !Equals [!Ref CreateAlarmTopic, "true"]

Resources:
  LogGroup:
    Type: AWS::Logs::LogGroup
    # Logs outlive the stack that produced them during an incident; Retain keeps
    # them readable after a failed rollback deletes everything else.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/${Environment}/${NamePrefix}/example"
      RetentionInDays: !Ref LogRetentionDays

  AlarmTopic:
    Type: AWS::SNS::Topic
    Condition: ShouldCreateAlarmTopic
    Properties:
      TopicName: !Sub "${NamePrefix}-alarms"
      DisplayName: !Sub "${NamePrefix} alarms (${Environment})"
      # SNS has no managed-SSE toggle; the AWS-managed key is the cheapest way
      # to satisfy encryption-at-rest without provisioning a CMK.
      KmsMasterKeyId: alias/aws/sns

Outputs:
  LogGroupName:
    Description: Name of the log group this component writes to.
    Value: !Ref LogGroup

  LogGroupArn:
    Description: ARN of the log group, for granting write access to a task role.
    Value: !GetAtt LogGroup.Arn

  AlarmTopicArn:
    Description: ARN of the alarm topic, when this stack created one.
    Condition: ShouldCreateAlarmTopic
    Value: !Ref AlarmTopic