AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Creates a cluster on the MongoDB Atlas Cloud.

Parameters:
  IsPaid:
    Type: String
    Description: Determines if you want to create a free or paid cluster.
    Default: false
    AllowedValues:
      - true
      - false

  ProjectId:
    Type: String
    Description: Unique 24-hexadecimal digit string that identifies your project

  ClusterName:
    Type: String
    Description: Name to use for your Atlas Cluster

  ProfileName:
    Type: String
    Description: Secret Manager Profile that contains the Atlas Programmatic keys

  Region:
    Type: String
    Description: A valid region name for Mongo DB, Must be all uppercase, and separated by underscores
    Default: US_EAST_1

Conditions:
  IsPaidCondition: !Equals [ !Ref IsPaid, "true" ]

Resources:
  AtlasCluster:
    Type: MongoDB::Atlas::Cluster
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            - E3006
    Properties:
      ProjectId: !Ref ProjectId
      Name: !Ref ClusterName
      Profile: !Ref ProfileName
      ClusterType: "REPLICASET"
      MongoDBMajorVersion: !If
        - IsPaidCondition
        - "8.0"
        - !Ref AWS::NoValue
      VersionReleaseSystem: !If
        - IsPaidCondition
        - "LTS"
        - !Ref AWS::NoValue
      TerminationProtectionEnabled: !If
        - IsPaidCondition
        - "true"
        - !Ref AWS::NoValue
      BackupEnabled: !If
        - IsPaidCondition
        - "true"
        - !Ref AWS::NoValue
      ReplicationSpecs:
        - NumShards: '1'
          AdvancedRegionConfigs:
            - ElectableSpecs:
                EbsVolumeType: "STANDARD"
                NodeCount: "3"
                InstanceSize: !If
                  - IsPaidCondition
                  - "M10"
                  - "M0"
              Priority: "7"
              RegionName: !Ref Region
              ProviderName: !If
                - IsPaidCondition
                - "AWS"
                - "TENANT"
              BackingProviderName: !If
                - IsPaidCondition
                - !Ref AWS::NoValue
                - "AWS"
              AutoScaling: !If
                - IsPaidCondition
                - { DiskGB: { Enabled: true }, Compute: { Enabled: true, ScaleDownEnabled: true, MinInstanceSize: "M10", MaxInstanceSize: "M30" } }
                - !Ref AWS::NoValue

  MaintenanceWindow:
    Condition: IsPaidCondition
    Type: MongoDB::Atlas::MaintenanceWindow
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            - E3006
    Properties:
      Profile: !Ref ProfileName
      ProjectId: !Ref ProjectId
      DayOfWeek: 1
      HourOfDay: 7
      AutoDeferOnceEnabled: true

Outputs:
  MongoDBAtlasConnectionStrings:
    Description: Cluster connection strings
    Export:
      Name: !Sub '${AWS::StackName}-ConnectionStrings'
    Value: !GetAtt AtlasCluster.ConnectionStrings.Standard

  MongoDBAtlasClusterID:
    Description: Cluster Id
    Export:
      Name: !Sub '${AWS::StackName}-ID'
    Value: !GetAtt AtlasCluster.Id