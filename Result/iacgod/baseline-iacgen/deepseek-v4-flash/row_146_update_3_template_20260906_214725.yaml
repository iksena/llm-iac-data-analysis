AWSTemplateFormatVersion: '2010-09-09'
Description: 'Creates a Cognito user pool with password policy, API Gateway REST API with Cognito authorizer, and Lambda backend.'

Resources:
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: MySecureUserPool
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: MyAppClient
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      SupportedIdentityProviders:
        - COGNITO

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  LambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: CognitoProtectedApiHandler
      Handler: index.handler
      Runtime: nodejs24.x
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ZipFile: |
          exports.handler = async (event) => {
              const path = event.resource;
              if (path === '/me') {
                  const claims = event.requestContext.authorizer && event.requestContext.authorizer.claims;
                  if (!claims) {
                      return {
                          statusCode: 401,
                          headers: { 'Content-Type': 'application/json' },
                          body: JSON.stringify({ error: 'Unauthorized' })
                      };
                  }
                  return {
                      statusCode: 200,
                      headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify({ message: 'Authenticated', claims })
                  };
              } else if (path === '/open') {
                  return {
                      statusCode: 200,
                      headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify({ message: 'Open endpoint, no auth required', claims: null })
                  };
              } else {
                  return {
                      statusCode: 404,
                      headers: { 'Content-Type': 'application/json' },
                      body: JSON.stringify({ error: 'Not found' })
                  };
              }
          };

  AppApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: CognitoSecureApi
      Description: API with protected and open endpoints
      EndpointConfiguration:
        Types:
          - REGIONAL

  MeResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt AppApi.RootResourceId
      PathPart: me
      RestApiId: !Ref AppApi

  OpenResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt AppApi.RootResourceId
      PathPart: open
      RestApiId: !Ref AppApi

  ApiAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    DependsOn:
      - AppApi
      - CognitoUserPool
    Properties:
      Name: CognitoAuthorizer
      Type: COGNITO
      IdentitySource: method.request.header.Authorization
      ProviderARNs:
        - !GetAtt CognitoUserPool.Arn
      RestApiId: !Ref AppApi

  MeMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      HttpMethod: GET
      ResourceId: !Ref MeResource
      RestApiId: !Ref AppApi
      AuthorizationType: COGNITO
      AuthorizerId: !Ref ApiAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaFunction.Arn}/invocations

  OpenMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      HttpMethod: GET
      ResourceId: !Ref OpenResource
      RestApiId: !Ref AppApi
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaFunction.Arn}/invocations

  LambdaPermissionMe:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref LambdaFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${AppApi}/*/GET/me

  LambdaPermissionOpen:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref LambdaFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${AppApi}/*/GET/open

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - MeMethod
      - OpenMethod
    Properties:
      RestApiId: !Ref AppApi
      StageName: prod

Outputs:
  UserPoolId:
    Description: The ID of the Cognito User Pool
    Value: !Ref CognitoUserPool
  AppClientId:
    Description: The ID of the Cognito User Pool Client
    Value: !Ref CognitoUserPoolClient
  ApiEndpointUrl:
    Description: The base URL of the deployed API
    Value: !Sub https://${AppApi}.execute-api.${AWS::Region}.amazonaws.com/prod