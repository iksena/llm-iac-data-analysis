AWSTemplateFormatVersion: '2010-09-09'
Description: |
  DVA-C02 Lab 2.9 — Aurora Serverless v2 (MySQL-compatible) with RDS Data API enabled.
  Lambda calls Data API over HTTPS — no VPC config needed on the Lambda.
  Cluster has 1 writer instance, MinCapacity=0.5, MaxCapacity=1.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>

Resources:
  DBSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: dva-lab-02-09-db-secret
      GenerateSecretString:
        SecretStringTemplate: '{"username":"admin"}'
        GenerateStringKey: password
        PasswordLength: 24
        ExcludeCharacters: '"@/\'

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupName: dva-lab-02-09-subnet-group
      DBSubnetGroupDescription: DVA Lab 2.9 Aurora subnet group
      SubnetIds: !Ref SubnetIds

  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: dva-lab-02-09-db-sg
      GroupDescription: Aurora DB security group (Data API does not need ingress)
      VpcId: !Ref VpcId

  DBCluster:
    Type: AWS::RDS::DBCluster
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBClusterIdentifier: dva-lab-02-09-cluster
      Engine: aurora-mysql
      EngineVersion: '8.0.mysql_aurora.3.05.2'
      EngineMode: provisioned
      DatabaseName: appdb
      MasterUsername: !Sub '{{resolve:secretsmanager:${DBSecret}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DBSecret}:SecretString:password}}'
      DBSubnetGroupName: !Ref DBSubnetGroup
      VpcSecurityGroupIds:
        - !GetAtt DBSecurityGroup.GroupId
      ServerlessV2ScalingConfiguration:
        MinCapacity: 0.5
        MaxCapacity: 1
      EnableHttpEndpoint: true
      BackupRetentionPeriod: 1
      StorageEncrypted: true

  DBWriter:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: dva-lab-02-09-writer
      DBClusterIdentifier: !Ref DBCluster
      Engine: aurora-mysql
      DBInstanceClass: db.serverless

  SecretAttachment:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Properties:
      SecretId: !Ref DBSecret
      TargetId: !Ref DBCluster
      TargetType: AWS::RDS::DBCluster

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DataApiAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - rds-data:ExecuteStatement
                  - rds-data:BatchExecuteStatement
                  - rds-data:BeginTransaction
                  - rds-data:CommitTransaction
                  - rds-data:RollbackTransaction
                Resource: !Sub 'arn:aws:rds:${AWS::Region}:${AWS::AccountId}:cluster:dva-lab-02-09-cluster'
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DBSecret

  ConnectorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: dva-lab-02-09-connector
      Runtime: python3.12
      Handler: handler.handler
      Role: !GetAtt LambdaRole.Arn
      Code: ./src
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          CLUSTER_ARN: !Sub 'arn:aws:rds:${AWS::Region}:${AWS::AccountId}:cluster:dva-lab-02-09-cluster'
          SECRET_ARN: !Ref DBSecret
          DB_NAME: appdb

Outputs:
  FunctionName:
    Value: !Ref ConnectorFunction
  ClusterArn:
    Value: !Sub 'arn:aws:rds:${AWS::Region}:${AWS::AccountId}:cluster:dva-lab-02-09-cluster'
  SecretArn:
    Value: !Ref DBSecret