                  - 'iam:UpdateRoleDescription'
                  #- 'kms:*'
                  - 'kms:CreateAlias'
                  - 'kms:CreateKey'
                  - 'kms:Decrypt'
                  - 'kms:DeleteAlias'
                  - 'kms:DescribeKey'
                  - 'kms:Encrypt'
