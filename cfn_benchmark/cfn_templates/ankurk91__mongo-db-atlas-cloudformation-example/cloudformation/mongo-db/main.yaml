AWSTemplateFormatVersion: "2010-09-09"

Parameters:
  CloudFormationBucketURL:
    Type: String
    Description: The primary cloudformation bucket base endpoint including the bucket name
  ProfileName:
    Description: Secret Manager Profile that contains the Atlas Programmatic keys
    Type: String
    Default: "default"
  ProjectName:
    Description: Unique project name in your organization
    Type: String
    Default: "main-db"
  PublicKey:
    Description: Your MongoDB Atlas Public API Key
    Type: String
    NoEcho: true
  PrivateKey:
    Description: Your MongoDB Atlas Private API Key
    Type: String
    NoEcho: true
  OrganizationId:
    Type: String
    Description: Mongo DB Atlas Organization ID
  ClusterName:
    Type: String
    Description: Mongo DB Atlas Cluster name
    Default: main-cluster
  DBName:
    Type: String
    Description: Database Name
    Default: main-db
  NATGatewayPublicIP:
    Type: String
    Description: NAT Gateway Public IP
    Default: "127.0.0.1"
  DBUsername:
    Type: String
    Description: DB Username
    NoEcho: true
  DBPassword:
    Type: String
    Description: DB Password
    NoEcho: true

Resources:
  SecretProfileStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "${CloudFormationBucketURL}/mongo-db/secret-profile.yaml"
      Parameters:
        PublicKey: !Sub "${PublicKey}"
        PrivateKey: !Sub "${PrivateKey}"
        ProfileName: !Sub "${ProfileName}"

  ProjectStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: SecretProfileStack
    Properties:
      TemplateURL: !Sub "${CloudFormationBucketURL}/mongo-db/project.yaml"
      Parameters:
        ProfileName: !Sub "${ProfileName}"
        ProjectName: !Sub "${ProjectName}"
        OrganizationId: !Sub "${OrganizationId}"

  IPAddressStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "${CloudFormationBucketURL}/mongo-db/ip-address.yaml"
      Parameters:
        NATGatewayIP: !Sub "${NATGatewayPublicIP}"
        ProfileName: !Sub "${ProfileName}"
        ProjectId:
          Fn::GetAtt:
            - ProjectStack
            - Outputs.ProjectId

  ClusterStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "${CloudFormationBucketURL}/mongo-db/cluster.yaml"
      Parameters:
        ProjectId:
          Fn::GetAtt:
            - ProjectStack
            - Outputs.ProjectId
        ProfileName: !Sub "${ProfileName}"
        ClusterName: !Sub "${ClusterName}"

  DBUserStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: ClusterStack
    Properties:
      TemplateURL: !Sub "${CloudFormationBucketURL}/mongo-db/db-user.yaml"
      Parameters:
        ProjectId:
          Fn::GetAtt:
            - ProjectStack
            - Outputs.ProjectId
        ProfileName: !Sub "${ProfileName}"
        ClusterName: !Sub "${ClusterName}"
        DBUsername: !Sub "${DBUsername}"
        DBPassword: !Sub "${DBPassword}"
        DBName: !Sub "${DBName}"