AWSTemplateFormatVersion: "2010-09-09"
Description: The lambda function that produce the website zip

Resources:
  PewWebsiteLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: [lambda.amazonaws.com]
            Action: ['sts:AssumeRole']
      Policies:
        - PolicyName: S3WebsitePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::pew-report-${AWS::AccountId}"
                  - !Sub "arn:aws:s3:::pew-resources-${AWS::AccountId}"
                  - !Sub "arn:aws:s3:::pew-website-${AWS::AccountId}"
                  - !Sub "arn:aws:s3:::pew-report-${AWS::AccountId}/*"
                  - !Sub "arn:aws:s3:::pew-resources-${AWS::AccountId}/*"
                  - !Sub "arn:aws:s3:::pew-website-${AWS::AccountId}/*"
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "arn:aws:logs:*:*:*"

  PewServiceLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: Pew-Website
      Runtime: python3.11
      MemorySize: 512
      Timeout: 512
      TracingConfig:
        Mode: "PassThrough"
      Handler: pew_website_lambda.lambda_handler
      Role: !GetAtt PewWebsiteLambdaRole.Arn
      Code:
        S3Bucket: !Sub "pew-resources-${AWS::AccountId}"
        S3Key: pew_website_lambda.zip