AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFormation template for a self-contained SageMaker Domain in VPC Only mode with a test user profile and dedicated IAM role. Optionally accepts existing VPC, subnets, and security groups; otherwise creates them.'
Parameters:
  DomainName:
    Type: String
    Description: Name of the SageMaker Domain.
    Default: my-ml-domain
    AllowedPattern: '^[a-zA-Z0-9](-*[a-zA-Z0-9]){0,62}$'
    MaxLength: 63
  TestUserName:
    Type: String
    Description: Name of the test user profile.
    Default: data-scientist
    AllowedPattern: '^[a-zA-Z0-9](-*[a-zA-Z0-9]){0,62}$'
    MaxLength: 63
  DefaultS3BucketName:
    Type: String
    Description: Name (not ARN) of the default S3 bucket for the domain. Must exist.
    Default: my-sagemaker-artifacts
    AllowedPattern: '^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$'
  VpcId:
    Type: String
    Description: Optional VPC ID. If not provided, a new VPC will be created.
    Default: ''
  SubnetIds:
    Type: CommaDelimitedList
    Description: Optional comma-separated list of subnet IDs. If not provided, new subnets will be created.
    Default: ''
  SecurityGroupIds:
    Type: CommaDelimitedList
    Description: Optional comma-separated list of security group IDs. If not provided, a new security group will be created.
    Default: ''
Conditions:
  UseExistingVpc:
    Fn::Not:
      - Fn::Equals:
          - !Ref VpcId
          - ''
  UseExistingSubnets:
    Fn::Not:
      - Fn::Equals:
          - Fn::Join:
              - ''
              - !Ref SubnetIds
          - ''
  UseExistingSecurityGroups:
    Fn::Not:
      - Fn::Equals:
          - Fn::Join:
              - ''
              - !Ref SecurityGroupIds
          - ''
Resources:
  VPC:
    Type: AWS::EC2::VPC
    Condition: UseExistingVpc
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${DomainName}-vpc'
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Condition: UseExistingVpc
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: false
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${DomainName}-subnet-1'
  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Condition: UseExistingVpc
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      MapPublicIpOnLaunch: false
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${DomainName}-subnet-2'
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: UseExistingVpc
    Properties:
      GroupDescription: Security group for SageMaker Domain
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${DomainName}-sg'
  ResolvedVpcId:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/sagemaker/${DomainName}/resolved-vpc-id'
      Type: String
      Value:
        Fn::If:
          - UseExistingVpc
          - !Ref VpcId
          - !Ref VPC
  ResolvedSubnetIds:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/sagemaker/${DomainName}/resolved-subnet-ids'
      Type: String
      Value:
        Fn::If:
          - UseExistingSubnets
          - Fn::Join:
              - ','
              - !Ref SubnetIds
          - Fn::Join:
              - ','
              - - !Ref PublicSubnet1
                - !Ref PublicSubnet2
  ResolvedSecurityGroupIds:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/sagemaker/${DomainName}/resolved-sg-ids'
      Type: String
      Value:
        Fn::If:
          - UseExistingSecurityGroups
          - Fn::Join:
              - ','
              - !Ref SecurityGroupIds
          - !Ref SecurityGroup
  SageMakerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${DomainName}-execution-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: sagemaker.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSageMakerFullAccess
      Policies:
        - PolicyName: CustomS3AndPassRole
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - !Sub 'arn:aws:s3:::${DefaultS3BucketName}'
                  - !Sub 'arn:aws:s3:::${DefaultS3BucketName}/*'
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/${DomainName}-execution-role'
                Condition:
                  StringEquals:
                    iam:PassedToService: sagemaker.amazonaws.com
      Tags:
        - Key: Name
          Value: !Sub '${DomainName}-execution-role'
  SageMakerDomain:
    Type: AWS::SageMaker::Domain
    Properties:
      DomainName: !Ref DomainName
      AuthMode: IAM
      VpcId:
        Fn::If:
          - UseExistingVpc
          - !Ref VpcId
          - !Ref VPC
      SubnetIds:
        Fn::If:
          - UseExistingSubnets
          - !Ref SubnetIds
          - - !Ref PublicSubnet1
            - !Ref PublicSubnet2
      SecurityGroupIdForDomainBoundary:
        Fn::If:
          - UseExistingSecurityGroups
          - !Select [0, !Ref SecurityGroupIds]
          - !Ref SecurityGroup
      AppNetworkAccessType: VpcOnly
      DefaultUserSettings:
        ExecutionRole: !GetAtt SageMakerExecutionRole.Arn
      Tags:
        - Key: Name
          Value: !Ref DomainName
  SageMakerUserProfile:
    Type: AWS::SageMaker::UserProfile
    Properties:
      DomainId: !Ref SageMakerDomain
      UserProfileName: !Ref TestUserName
      UserSettings:
        ExecutionRole: !GetAtt SageMakerExecutionRole.Arn
      Tags:
        - Key: Name
          Value: !Ref TestUserName
Outputs:
  DomainId:
    Description: SageMaker Domain ID
    Value: !Ref SageMakerDomain
  ExecutionRoleName:
    Description: Name of the IAM execution role
    Value: !Ref SageMakerExecutionRole
  StudioConsoleUrl:
    Description: Direct URL to the SageMaker Studio console for the new domain
    Value:
      Fn::Join:
        - ''
        - - 'https://'
          - !Ref 'AWS::Region'
          - '.console.aws.amazon.com/sagemaker/home?region='
          - !Ref 'AWS::Region'
          - '#/studio/'
          - !Ref SageMakerDomain