AWSTemplateFormatVersion: "2010-09-09"

Parameters:
  AWSPrincipals:
    Type: CommaDelimitedList

  SubnetIDs:
    Type: CommaDelimitedList

Resources:

  # An internal network load balancer with cross zone load balancing enabled
  NetworkLoadBalancer:
    Type: AWS::ElasticLoadbalancingV2::LoadBalancer
    Properties:
      Type: network
      Scheme: internal
      Subnets: !Ref SubnetIDs
      LoadBalancerAttributes:
        - Key: load_balancing.cross_zone.enabled
          Value: true

  # Create a VPC endpoint service for the NLB
  VpcEndpointService:
    Type: AWS::EC2::VPCEndpointService
    Properties:
      AcceptanceRequired: true
      NetworkLoadBalancerArns:
        - !Ref NetworkLoadBalancer

  # Give permissions to AWS principals to access the endpoint
  VpcEndpointServicePermissions:
    Type: AWS::EC2::VPCEndpointServicePermissions
    Properties:
      AllowedPrincipals: !Ref AWSPrincipals
      ServiceId: !Ref VpcEndpointService

  # Create a CloudWatch Alarm that triggers when the Network Load Balancer has one or more unhealthy hosts
  UnhealthyHostAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: "Alarm when the Network Load Balancer has one or more unhealthy hosts"
      MetricName: UnHealthyHostCount
      Namespace: AWS/NetworkELB
      Statistic: Maximum
      Period: 120
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref SNSTopic
      Dimensions:
        - Name: LoadBalancer
          Value: !Ref NetworkLoadBalancer

  # SNS Topic for alarm notifications
  SNSTopic:
    Type: AWS::SNS::Topic
    Properties: {}