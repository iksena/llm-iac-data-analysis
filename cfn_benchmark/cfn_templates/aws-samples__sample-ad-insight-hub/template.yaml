AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
  VideoLabelingSQSTopic:
    Type: String
    Default: labeling-queue-adhub
    Description: SQS topic for video labeling queue (without .fifo suffix)
  AvailabilityZoneA:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: First availability zone
  AvailabilityZoneB:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: Second availability zone
  CosmosApiKey:
    Type: String
    Description: API key for COSMOS
  CosmosServerUrl:
    Type: String
    Description: Server URL for COSMOS
  EnhenceApiUrl:
    Type: String
    Description: Endpoint for COSMOS enhance api
  LibraryApiUrl:
    Type: String
    Description: Endpoint for COSMOS library api

Globals:
  Function:
    Runtime: python3.11
    MemorySize: 512
    Timeout: 29
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
    Architectures:
      - x86_64

  Api:
    Cors:
      AllowMethods: "'GET,POST,OPTIONS'"
      AllowHeaders: "'content-type,Authorization'"
      AllowOrigin: "'*'"
    Auth:
      DefaultAuthorizer: CognitoAuthorizer
      Authorizers:
        CognitoAuthorizer:
          UserPoolArn: !GetAtt UserPool.Arn
    BinaryMediaTypes:
      - 'image/jpeg'
      - 'image/png'
      - 'image/webp'
      - 'multipart/form-data'

Resources:
  # Lambda Functions
  AdhubLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Scan
                  - dynamodb:Query
                Resource:
                  - !GetAtt DatasetTable.Arn
                  - !GetAtt ModelTable.Arn
                  - !GetAtt LabelingTaskTable.Arn
                  - !Sub ${LabelingTaskTable.Arn}/index/*
                  - !GetAtt LabelingTaskResultsTable.Arn
                  - !Sub ${LabelingTaskResultsTable.Arn}/index/*
                  - !GetAtt EnhanceTaskTable.Arn
        - PolicyName: SQSAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource:
                  - !GetAtt EnhanceTaskQueue.Arn
                  - !GetAtt EnhanceTaskDLQ.Arn
        - PolicyName: BedrockAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock-runtime:InvokeModel
                Resource: '*'
        - PolicyName: S3AccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt DataBucket.Arn
                  - !Sub ${DataBucket.Arn}/*

  AdhubCosmosApiLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Scan
                  - dynamodb:Query
                Resource:
                  - !GetAtt EnhanceTaskTable.Arn
        - PolicyName: SQSAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource:
                  - !GetAtt EnhanceTaskQueue.Arn
                  - !GetAtt EnhanceTaskDLQ.Arn

  AdhubDatasetLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Scan
                  - dynamodb:Query
                Resource:
                  - !GetAtt DatasetTable.Arn
        - PolicyName: S3AccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt DataBucket.Arn
                  - !Sub ${DataBucket.Arn}/*

  AdhubModelLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Scan
                  - dynamodb:Query
                Resource:
                  - !GetAtt DatasetTable.Arn
                  - !GetAtt ModelTable.Arn
        - PolicyName: BedrockAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock-runtime:InvokeModel
                Resource: '*'

  AdhubLabelingTaskLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Scan
                  - dynamodb:Query
                Resource:
                  - !GetAtt DatasetTable.Arn
                  - !GetAtt ModelTable.Arn
                  - !GetAtt LabelingTaskTable.Arn
                  - !Sub ${LabelingTaskTable.Arn}/index/*
                  - !GetAtt LabelingTaskResultsTable.Arn
                  - !Sub ${LabelingTaskResultsTable.Arn}/index/*
                  - !GetAtt EnhanceTaskTable.Arn
        - PolicyName: SQSAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource:
                  - !GetAtt EnhanceTaskQueue.Arn
                  - !GetAtt EnhanceTaskDLQ.Arn
        - PolicyName: BedrockAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock-runtime:InvokeModel
                Resource: '*'
        - PolicyName: S3AccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt DataBucket.Arn
                  - !Sub ${DataBucket.Arn}/*

  AdhubNovaDetectionLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: BedrockAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock-runtime:InvokeModel
                Resource: '*'
        - PolicyName: S3AccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt DataBucket.Arn
                  - !Sub ${DataBucket.Arn}/*

  # Dataset API Function
  DatasetFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: source/lambda/dataset_api/
      Handler: app.lambda_handler
      Role: !GetAtt AdhubDatasetLambdaRole.Arn
      Events:
        ListDatasets:
          Type: Api
          Properties:
            Path: /api/datasets
            Method: get
            Auth:
              Authorizer: CognitoAuthorizer
        CreateDataset:
          Type: Api
          Properties:
            Path: /api/datasets
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer
        GetDataset:
          Type: Api
          Properties:
            Path: /api/datasets/{id}
            Method: get
            Auth:
              Authorizer: CognitoAuthorizer
        UpdateDataset:
          Type: Api
          Properties:
            Path: /api/datasets/{id}
            Method: put
            Auth:
              Authorizer: CognitoAuthorizer
        DeleteDataset:
          Type: Api
          Properties:
            Path: /api/datasets/{id}
            Method: delete
            Auth:
              Authorizer: CognitoAuthorizer

  # Model API Function
  ModelFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: source/lambda/model_api/
      Handler: app.lambda_handler
      Role: !GetAtt AdhubModelLambdaRole.Arn
      Events:
        ListModels:
          Type: Api
          Properties:
            Path: /api/models
            Method: get
            Auth:
              Authorizer: CognitoAuthorizer
        CreateModel:
          Type: Api
          Properties:
            Path: /api/models
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer
        GetModel:
          Type: Api
          Properties:
            Path: /api/models/{id}
            Method: get
            Auth:
              Authorizer: CognitoAuthorizer
        UpdateModel:
          Type: Api
          Properties:
            Path: /api/models/{id}
            Method: put
            Auth:
              Authorizer: CognitoAuthorizer
        DeleteModel:
          Type: Api
          Properties:
            Path: /api/models/{id}
            Method: delete
            Auth:
              Authorizer: CognitoAuthorizer
        TestModelConnection:
          Type: Api
          Properties:
            Path: /api/models/{id}/test-connection
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer

  # Labeling Task API Function
  LabelingTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: source/lambda/labeling_task_api/
      Handler: app.lambda_handler
      Timeout: 29
      Role: !GetAtt AdhubLabelingTaskLambdaRole.Arn
      Environment:
        Variables:
          UPLOAD_BUCKET: !Ref DataBucket
      Events:
        ListTasks:
          Type: Api
          Properties:
            Path: /api/tasks
            Method: get
            Auth:
              Authorizer: CognitoAuthorizer
        CreateTask:
          Type: Api
          Properties:
            Path: /api/tasks
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer
        GetTask:
          Type: Api
          Properties:
            Path: /api/tasks/{id}
            Method: get
            Auth:
              Authorizer: CognitoAuthorizer
        UpdateTask:
          Type: Api
          Properties:
            Path: /api/tasks/{id}
            Method: put
            Auth:
              Authorizer: CognitoAuthorizer
        DeleteTask:
          Type: Api
          Properties:
            Path: /api/tasks/{id}
            Method: delete
            Auth:
              Authorizer: CognitoAuthorizer
        ListTasksByDataset:
          Type: Api
          Properties:
            Path: /api/tasks/by-dataset/{datasetId}
            Method: get
            Auth:
              Authorizer: CognitoAuthorizer
        ListLabelingResults:
          Type: Api
          Properties:
            Path: /api/labeling-results
            Method: get
            Auth:
              Authorizer: CognitoAuthorizer
        GetTaskLabelingResults:
          Type: Api
          Properties:
            Path: /api/labeling-results/{id}
            Method: get
            Auth:
              Authorizer: CognitoAuthorizer
        GetJsonlContent:
          Type: Api
          Properties:
            Path: /api/labeling-task/jsonl-viewer
            Method: get
            Auth:
              Authorizer: CognitoAuthorizer
            TimeoutInMillis: 29000

  # DynamoDB table for async task status
  EnhanceTaskTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-enhance-tasks"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: task_id
          AttributeType: S
      KeySchema:
        - AttributeName: task_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # SQS Queue for async enhance processing
  EnhanceTaskQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-enhance-task-queue"
      VisibilityTimeout: 150  # 120s + buffer
      MessageRetentionPeriod: 1209600  # 14 days
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt EnhanceTaskDLQ.Arn
        maxReceiveCount: 3

  # Dead Letter Queue for failed tasks
  EnhanceTaskDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-enhance-task-dlq"
      MessageRetentionPeriod: 1209600  # 14 days

  # Async Enhance Processing Function
  EnhanceProcessFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: source/lambda/enhance_process/
      Handler: app.lambda_handler
      MemorySize: 1024
      Timeout: 120  # 2 minutes as requested
      Role: !GetAtt AdhubCosmosApiLambdaRole.Arn
      Environment:
        Variables:
          COSMOS_API_KEY: !Ref CosmosApiKey
          ENHENCE_API_URL: !Ref EnhenceApiUrl
          ENHANCE_TASK_TABLE: !Ref EnhanceTaskTable
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref SubnetAPrivate
          - !Ref SubnetBPrivate
      Events:
        SQSEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt EnhanceTaskQueue.Arn
            BatchSize: 1

  # Cosmos API Function
  CosmosApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: source/lambda/cosmos_api/
      Handler: app.lambda_handler
      MemorySize: 512
      Timeout: 29
      Role: !GetAtt AdhubCosmosApiLambdaRole.Arn
      Environment:
        Variables:
          COSMOS_API_KEY: !Ref CosmosApiKey
          COSMOS_SERVER_URL: !Ref CosmosServerUrl
          ENHENCE_API_URL: !Ref EnhenceApiUrl
          LIBRARY_API_URL: !Ref LibraryApiUrl
          ENHANCE_TASK_TABLE: !Ref EnhanceTaskTable
          ENHANCE_TASK_QUEUE: !Ref EnhanceTaskQueue
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref SubnetAPrivate
          - !Ref SubnetBPrivate
      Events:
        EnhanceScene:
          Type: Api
          Properties:
            Path: /api/cosmos/enhance
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer
        ListScenes:
          Type: Api
          Properties:
            Path: /api/cosmos/library
            Method: get
            Auth:
              Authorizer: CognitoAuthorizer
        GetScene:
          Type: Api
          Properties:
            Path: /api/cosmos/library/{uuid}
            Method: get
            Auth:
              Authorizer: CognitoAuthorizer
        GenerateVideo:
          Type: Api
          Properties:
            Path: /api/cosmos/generate
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer
        CheckStatus:
          Type: Api
          Properties:
            Path: /api/cosmos/status/{uuid}
            Method: get
            Auth:
              Authorizer: CognitoAuthorizer
        HealthCheck:
          Type: Api
          Properties:
            Path: /api/cosmos/health
            Method: get
            Auth:
              Authorizer: CognitoAuthorizer
        EnhanceTaskStatus:
          Type: Api
          Properties:
            Path: /api/cosmos/enhance-task/{task_id}
            Method: get
            Auth:
              Authorizer: CognitoAuthorizer

  # Nova Detection API Function
  NovaDetectionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: source/lambda/nova_detection_api/
      Handler: app.lambda_handler
      MemorySize: 1024
      Timeout: 29
      Role: !GetAtt AdhubNovaDetectionLambdaRole.Arn
      Environment:
        Variables:
          UPLOAD_BUCKET: !Ref DataBucket
      Events:
        DetectObjects:
          Type: Api
          Properties:
            Path: /api/nova-detection
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer
        DetectObjectsOptions:
          Type: Api
          Properties:
            Path: /api/nova-detection
            Method: options
            Auth:
              Authorizer: NONE

  # Image Upload API Function
  ImageUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: source/lambda/image_upload_api/
      Handler: app.lambda_handler
      MemorySize: 512
      Timeout: 29
      Role: !GetAtt AdhubNovaDetectionLambdaRole.Arn
      Environment:
        Variables:
          UPLOAD_BUCKET: !Ref DataBucket
      Events:
        UploadImage:
          Type: Api
          Properties:
            Path: /api/upload-image
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer
        UploadImageOptions:
          Type: Api
          Properties:
            Path: /api/upload-image
            Method: options
            Auth:
              Authorizer: NONE

  # Cognito Resources
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-user-pool
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub ${AWS::StackName}-client
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  IdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      IdentityPoolName: !Sub ${AWS::StackName}-identity-pool
      AllowUnauthenticatedIdentities: false
      CognitoIdentityProviders:
        - ClientId: !Ref UserPoolClient
          ProviderName: !GetAtt UserPool.ProviderName

  # S3 Log Bucket
  LogBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AWS::StackName}-logs-${AWS::AccountId}
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldLogs
            Status: Enabled
            ExpirationInDays: 90

  # Log Bucket Policy for Log Delivery
  LogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref LogBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub ${LogBucket.Arn}/*
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref AWS::AccountId
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub ${LogBucket.Arn}/cloudfront-logs/*

  # S3 Buckets
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AWS::StackName}-data-${AWS::AccountId}
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldFrames
            Status: Enabled
            Prefix: bbox_pics/
            ExpirationInDays: 30
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
              - HEAD
            AllowedOrigins:
              - '*'  # 生产环境建议限制为您的应用程序域名
            ExposedHeaders:
              - ETag
              - x-amz-meta-custom-header
            MaxAge: 3600
      LoggingConfiguration:
        DestinationBucketName: !Ref LogBucket
        LogFilePrefix: data-bucket-logs/

  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AWS::StackName}-website-${AWS::AccountId}
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      LoggingConfiguration:
        DestinationBucketName: !Ref LogBucket
        LogFilePrefix: website-bucket-logs/

  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              CanonicalUser: !GetAtt CloudFrontOriginAccessIdentity.S3CanonicalUserId
            Action: s3:GetObject
            Resource: !Sub ${WebsiteBucket.Arn}/*

  # CloudFront Distribution
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Origins:
          - DomainName: !GetAtt WebsiteBucket.RegionalDomainName
            Id: Website
            S3OriginConfig:
              OriginAccessIdentity: !Sub origin-access-identity/cloudfront/${CloudFrontOriginAccessIdentity}
          - DomainName: !Sub ${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com
            Id: API
            OriginPath: /Prod
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
        Enabled: true
        DefaultRootObject: index.html
        Logging:
          Bucket: !Sub "${AWS::StackName}-logs-${AWS::AccountId}.s3.amazonaws.com"
          Prefix: cloudfront-logs/
          IncludeCookies: true
        DefaultCacheBehavior:
          TargetOriginId: Website
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: API
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - POST
              - PATCH
              - DELETE
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            ForwardedValues:
              QueryString: true
              Headers:
                - Accept
                - Authorization
                - Content-Type
              Cookies:
                Forward: none

  CloudFrontOriginAccessIdentity:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: !Sub ${AWS::StackName} OAI

  # DynamoDB Tables
  DatasetTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ad_datasets
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  ModelTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ad_models
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  LabelingTaskTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ad_labeling_tasks
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: dataset_id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: DatasetIdIndex
          KeySchema:
            - AttributeName: dataset_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST

  LabelingTaskResultsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ad_labeling_tasks_results
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: task_id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: TaskIdIndex
          KeySchema:
            - AttributeName: task_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST

  # SQS Queue for video labeling progress
  VideoLabelingQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${VideoLabelingSQSTopic}.fifo
      FifoQueue: true
      ContentBasedDeduplication: true

  VideoLabelingProgressRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: InvokeLabelingTaskFunction
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt LabelingTaskFunction.Arn
        - PolicyName: ProcessSQSMessages
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt VideoLabelingQueue.Arn

  VideoLabelingProgressFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: source/lambda/video_labeling_progress/
      Handler: app.lambda_handler
      Role: !GetAtt VideoLabelingProgressRole.Arn
      Environment:
        Variables:
          LABELING_TASK_FUNCTION_NAME: !Ref LabelingTaskFunction
      Events:
        SQSEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt VideoLabelingQueue.Arn
            BatchSize: 1

  VideoLabelingMetricsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: VideoLabelingMetrics
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # AWS Batch Resources
  BatchServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: batch.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSBatchServiceRole

  BatchJobRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ECRAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: '*'
        - PolicyName: BatchJobPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                  - s3:DeleteObject
                  - s3:PutObjectAcl
                Resource:
                  - !GetAtt DataBucket.Arn
                  - !Sub ${DataBucket.Arn}/*
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource: !GetAtt VideoLabelingMetricsTable.Arn
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt VideoLabelingQueue.Arn
        - PolicyName: BedrockAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock-runtime:InvokeModel
                Resource: '*'

  BatchAPIRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BatchSubmitJobPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - batch:SubmitJob
                  - batch:DescribeJobs
                  - batch:ListJobs
                Resource: '*'
        - PolicyName: S3ListPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  - !GetAtt DataBucket.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub ${DataBucket.Arn}/*
        - PolicyName: InvokeLambdaFunctions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt LabelingTaskFunction.Arn
                  - !GetAtt DatasetFunction.Arn
                  - !GetAtt ModelFunction.Arn

  BatchInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
      Policies:
        - PolicyName: MountpointS3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  - !GetAtt DataBucket.Arn
                  - !Sub ${DataBucket.Arn}/*
        - PolicyName: DynamoDBMetricsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource: !GetAtt VideoLabelingMetricsTable.Arn

  BatchInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref BatchInstanceRole

  BatchComputeEnvironment:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      Type: MANAGED
      ComputeResources:
        Type: EC2
        MaxvCpus: 2
        InstanceTypes:
          - optimal
        Subnets:
          - !Ref SubnetA
          - !Ref SubnetB
        SecurityGroupIds:
          - !Ref BatchSecurityGroup
        InstanceRole: !GetAtt BatchInstanceProfile.Arn
        MinvCpus: 0
        DesiredvCpus: 0
        AllocationStrategy: BEST_FIT_PROGRESSIVE
        Ec2Configuration:
          - ImageType: ECS_AL2
      ServiceRole: !GetAtt BatchServiceRole.Arn
      State: ENABLED

  VideoLabelingJobQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      Priority: 1
      State: ENABLED
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment: !Ref BatchComputeEnvironment

  BatchAPIFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: source/lambda/batch_api/
      Handler: app.lambda_handler
      Role: !GetAtt BatchAPIRole.Arn
      Environment:
        Variables:
          VIDEO_LABELING_JOB_QUEUE: !Ref VideoLabelingJobQueue
          VIDEO_LABELING_JOB_DEFINITION: !Ref VideoLabelingJobDefinition
          UPLOAD_BUCKET: !Ref DataBucket
          VIDEO_LABELING_SQS_TOPIC: !Ref VideoLabelingSQSTopic
          LABELING_TASK_FUNCTION_NAME: !Ref LabelingTaskFunction
          DATASET_FUNCTION_NAME: !Ref DatasetFunction
          MODEL_FUNCTION_NAME: !Ref ModelFunction
      Events:
        StartVideoLabeling:
          Type: Api
          Properties:
            Path: /api/batch/video-labeling
            Method: post
            Auth:
              Authorizer: CognitoAuthorizer

  VideoLabelingJobDefinition:
    Type: AWS::Batch::JobDefinition
    Properties:
      Type: container
      ContainerProperties:
        Image: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/ad-insight-hub/video-labeling:latest
        ResourceRequirements:
          - Type: VCPU
            Value: '2'
          - Type: MEMORY
            Value: '4096'
        JobRoleArn: !GetAtt BatchJobRole.Arn
        ExecutionRoleArn: !GetAtt BatchJobRole.Arn
        Privileged: false
        LinuxParameters:
          Devices:
            - HostPath: /dev/fuse
              ContainerPath: /dev/fuse
              Permissions:
                - read
                - write
      PlatformCapabilities:
        - EC2
      RetryStrategy:
        Attempts: 3

  # VPC Resources
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-vpc

  # Internet Gateway
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-igw

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # Public Subnets
  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Ref AvailabilityZoneA
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-public-subnet-a

  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Ref AvailabilityZoneB
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-public-subnet-b

  # Private Subnets
  SubnetAPrivate:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: !Ref AvailabilityZoneA
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-private-subnet-a

  SubnetBPrivate:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.4.0/24
      AvailabilityZone: !Ref AvailabilityZoneB
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-private-subnet-b

  # NAT Gateway
  NatGatewayEIP:
    Type: AWS::EC2::EIP
    DependsOn: AttachGateway
    Properties:
      Domain: vpc

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatGatewayEIP.AllocationId
      SubnetId: !Ref SubnetA
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-natgw

  # Route Tables
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-public-rt

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetA
      RouteTableId: !Ref PublicRouteTable

  SubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetB
      RouteTableId: !Ref PublicRouteTable

  # Private Route Table
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-private-rt

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  SubnetAPrivateRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetAPrivate
      RouteTableId: !Ref PrivateRouteTable

  SubnetBPrivateRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetBPrivate
      RouteTableId: !Ref PrivateRouteTable

  # Security Groups
  BatchSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for AWS Batch compute environment
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: "-1"
          FromPort: -1
          ToPort: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-batch-sg

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Lambda functions with internet access
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: "-1"
          FromPort: -1
          ToPort: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-lambda-sg

Outputs:
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool

  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient

  IdentityPoolId:
    Description: Cognito Identity Pool ID
    Value: !Ref IdentityPool

  DataBucketName:
    Description: S3 bucket for storing data
    Value: !Ref DataBucket

  WebsiteBucketName:
    Description: S3 bucket for website hosting
    Value: !Ref WebsiteBucket

  CloudFrontDomain:
    Description: CloudFront distribution domain name
    Value: !GetAtt CloudFrontDistribution.DomainName

  CloudFrontDistributionId:
    Description: CloudFront distribution ID
    Value: !Ref CloudFrontDistribution

  VideoLabelingJobQueueArn:
    Description: Video labeling job queue ARN
    Value: !GetAtt VideoLabelingJobQueue.JobQueueArn