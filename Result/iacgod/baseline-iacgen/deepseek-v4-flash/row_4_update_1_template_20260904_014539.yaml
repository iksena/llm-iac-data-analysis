AWSTemplateFormatVersion: "2010-09-09"
Description: "Route53 hosted zone and DNS records for Ear Hustle production environment"
Parameters:
  DomainName:
    Type: String
    Default: earhustlesq.com
    Description: Primary domain name
  OldSubdomain:
    Type: String
    Default: earhustlesupercast.com
    Description: Old subdomain for MX records
  ACMValidationName:
    Type: String
    Default: ""
    Description: ACM certificate validation CNAME name
  ACMValidationTarget:
    Type: String
    Default: ""
    Description: ACM certificate validation CNAME target
Resources:
  EHHostedZone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: !Ref DomainName
      HostedZoneTags:
        - Key: prx:ops:environment
          Value: Production
        - Key: prx:dev:application
          Value: Ear Hustle
  RecordA0:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref EHHostedZone
      Name: !Sub "${DomainName}."
      Type: A
      TTL: 300
      ResourceRecords:
        - "198.185.159.144"
        - "198.185.159.145"
        - "198.49.23.144"
        - "198.49.23.145"
  RecordA1:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref EHHostedZone
      Name: !Sub "feeds.${DomainName}."
      Type: A
      TTL: 300
      ResourceRecords:
        - "198.185.159.144"
        - "198.185.159.145"
        - "198.49.23.144"
        - "198.49.23.145"
  RecordTXT1:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref EHHostedZone
      Name: !Sub "${DomainName}."
      Type: TXT
      TTL: 300
      ResourceRecords:
        - "\"v=spf1 include:_spf.google.com ~all\""
  RecordTXT2:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref EHHostedZone
      Name: !Sub "${DomainName}."
      Type: TXT
      TTL: 300
      ResourceRecords:
        - "\"google-site-verification=XXXXXXXXXXXXXXX\""
  RecordTXT3:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref EHHostedZone
      Name: !Sub "${DomainName}."
      Type: TXT
      TTL: 300
      ResourceRecords:
        - "\"zoom-wv=XXXXXXXXXXXXXXX\""
  RecordTXT4:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref EHHostedZone
      Name: !Sub "_dmarc.${DomainName}."
      Type: TXT
      TTL: 300
      ResourceRecords:
        - "\"v=DMARC1; p=quarantine; sp=quarantine; rua=mailto:dmarc@earhustlesq.com\""
  RecordTXT5:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref EHHostedZone
      Name: !Sub "${DomainName}."
      Type: TXT
      TTL: 300
      ResourceRecords:
        - "\"did=plc:XXXXXXXXXXXXXXX\""
  RecordTXT6:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref EHHostedZone
      Name: !Sub "_atproto.${DomainName}."
      Type: TXT
      TTL: 300
      ResourceRecords:
        - "\"did=plc:XXXXXXXXXXXXXXX\""
  RecordMX1:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref EHHostedZone
      Name: !Sub "${DomainName}."
      Type: MX
      TTL: 300
      ResourceRecords:
        - "1 ASPMX.L.GOOGLE.COM"
        - "5 ALT1.ASPMX.L.GOOGLE.COM"
        - "5 ALT2.ASPMX.L.GOOGLE.COM"
        - "10 ALT3.ASPMX.L.GOOGLE.COM"
        - "10 ALT4.ASPMX.L.GOOGLE.COM"
  RecordMX2:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref EHHostedZone
      Name: !Sub "${OldSubdomain}."
      Type: MX
      TTL: 300
      ResourceRecords:
        - "1 ASPMX.L.GOOGLE.COM"
        - "5 ALT1.ASPMX.L.GOOGLE.COM"
        - "5 ALT2.ASPMX.L.GOOGLE.COM"
        - "10 ALT3.ASPMX.L.GOOGLE.COM"
        - "10 ALT4.ASPMX.L.GOOGLE.COM"
  RecordCNAME1:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref EHHostedZone
      Name: !Sub "www.${DomainName}."
      Type: CNAME
      TTL: 300
      ResourceRecords:
        - "ext.squarespace.com"
  RecordCNAME2:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref EHHostedZone
      Name: !Sub "www.${DomainName}."
      Type: CNAME
      TTL: 300
      ResourceRecords:
        - "ext.squarespace.com"
  RecordCNAME3:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref EHHostedZone
      Name: !Sub "${DomainName}."
      Type: CNAME
      TTL: 300
      ResourceRecords:
        - "ext.squarespace.com"
  RecordCNAME4:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref EHHostedZone
      Name: !Sub "hsklytx7.${DomainName}."
      Type: CNAME
      TTL: 300
      ResourceRecords:
        - "verify.squarespace.com"
  RecordZendeskTXT:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref EHHostedZone
      Name: !Sub "zendeskverification.${DomainName}."
      Type: TXT
      TTL: 300
      ResourceRecords:
        - "\"zendesk=XXXXXXXXXXXXXXX\""
  RecordZendeskCNAME:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref EHHostedZone
      Name: !Sub "_zendesk.${DomainName}."
      Type: CNAME
      TTL: 300
      ResourceRecords:
        - "_zendesk.validate.zendesk.com"
  RecordZendeskDomainValidation:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref EHHostedZone
      Name: !Sub "_zfdomain.${DomainName}."
      Type: TXT
      TTL: 300
      ResourceRecords:
        - "\"zendesk=XXXXXXXXXXXXXXX\""
  RecordZendeskDKIM:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref EHHostedZone
      Name: !Sub "zendesk._domainkey.${DomainName}."
      Type: TXT
      TTL: 300
      ResourceRecords:
        - "\"v=DKIM1; k=rsa; p=XXXXXXXXXXXXXXX\""
  RecordCampaignMonitorDKIM:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref EHHostedZone
      Name: !Sub "scph0617._domainkey.${DomainName}."
      Type: TXT
      TTL: 300
      ResourceRecords:
        - "\"v=DKIM1; k=rsa; p=XXXXXXXXXXXXXXX\""
  RecordCampaignMonitorSPF:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref EHHostedZone
      Name: !Sub "${DomainName}."
      Type: TXT
      TTL: 300
      ResourceRecords:
        - "\"v=spf1 include:createsend.com ~all\""
  RecordCampaignMonitorMX:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref EHHostedZone
      Name: !Sub "${DomainName}."
      Type: MX
      TTL: 300
      ResourceRecords:
        - "10 mx1.createsend.com"
        - "10 mx2.createsend.com"
  RecordGoogleWorkspaceDKIM:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref EHHostedZone
      Name: !Sub "google._domainkey.${DomainName}."
      Type: TXT
      TTL: 300
      ResourceRecords:
        - "\"v=DKIM1; k=rsa; p=XXXXXXXXXXXXXXX\""
  RecordSupercastDKIM:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref EHHostedZone
      Name: !Sub "supercast._domainkey.${DomainName}."
      Type: TXT
      TTL: 300
      ResourceRecords:
        - "\"v=DKIM1; k=rsa; p=XXXXXXXXXXXXXXX\""
  RecordSupercastReturnPath:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref EHHostedZone
      Name: !Sub "bounces.${DomainName}."
      Type: CNAME
      TTL: 300
      ResourceRecords:
        - "returnpath.supercast.com"
  RecordACMValidation:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref EHHostedZone
      Name: !Sub "${ACMValidationName}.feeds.${DomainName}."
      Type: CNAME
      TTL: 60
      ResourceRecords:
        - !Sub "${ACMValidationTarget}."
Outputs:
  HostedZoneId:
    Description: "Route53 hosted zone ID"
    Value: !Ref EHHostedZone
  NameServers:
    Description: "Nameservers for the hosted zone"
    Value: !Join [ ",", !GetAtt EHHostedZone.NameServers ]