      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-build-sg'

  BuildInstanceRole:
    Type: AWS::IAM::Role
    Condition: NeedsBuild
    Properties:
      RoleName: !Sub '${EnvironmentName}-build-instance-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ECRPush
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                Resource: !GetAtt ECRRepository.Arn
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:DeleteObject
                Resource:
                  - !GetAtt DataBucket.Arn
                  - !Sub '${DataBucket.Arn}/*'
                  - !GetAtt FrontendBucket.Arn
                  - !Sub '${FrontendBucket.Arn}/*'
        - PolicyName: GlueAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - glue:CreateTable
                  - glue:UpdateTable
                  - glue:GetTable
                  - glue:GetTables
                  - glue:GetDatabase
                  - glue:CreateDatabase
                Resource:
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog'
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/${GlueDatabase}'
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/${GlueDatabase}/*'
        - PolicyName: ECSUpdateService
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecs:UpdateService
                  - ecs:DescribeServices
                Resource: !Sub 'arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:service/${ECSCluster}/${EnvironmentName}-api-service'
        - PolicyName: CloudFormationSignal
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:SignalResource
                Resource: !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*'
        - PolicyName: SelfTerminate
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:TerminateInstances
                Resource: '*'
                Condition:
                  StringEquals:
                    ec2:ResourceTag/Name: !Sub '${EnvironmentName}-build-instance'

  BuildInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Condition: NeedsBuild
    Properties:
      Roles:
        - !Ref BuildInstanceRole

  BuildInstance:
    Type: AWS::EC2::Instance
    Condition: NeedsBuild
    CreationPolicy:
      ResourceSignal:
        Timeout: PT30M
    DependsOn:
      - ECRRepository
      - DataBucket
      - FrontendBucket
      - GlueDatabase
      - CloudFrontDistribution
      - CognitoCallbackUpdate
      - ECSService
    Properties:
      InstanceType: t3.medium
      ImageId: !Sub '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
      SubnetId: !Ref PrivateSubnetA
      SecurityGroupIds:
        - !Ref BuildInstanceSecurityGroup
      IamInstanceProfile: !Ref BuildInstanceProfile
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-build-instance'
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          exec > /var/log/build-instance.log 2>&1

          STACK_NAME="${AWS::StackName}"
          REGION="${AWS::Region}"
          ACCOUNT_ID="${AWS::AccountId}"
          ECR_REPO="${ECRRepository.RepositoryUri}"
          DATA_BUCKET="${DataBucket}"
          FRONTEND_BUCKET="${FrontendBucket}"
          GLUE_DB="${GlueDatabase}"
          CF_DOMAIN="${CloudFrontDistribution.DomainName}"
          API_URL="http://${ALB.DNSName}"
          POOL_ID="${CognitoUserPool}"
          CLIENT_ID="${CognitoUserPoolClient}"
          COGNITO_DOMAIN="${EnvironmentName}-semantic-lakehouse-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com"
          REPO_URL="${SourceRepoUrl}"
          ECS_CLUSTER="${ECSCluster}"
          ECS_SERVICE="${EnvironmentName}-api-service"
          INSTANCE_ID=$(ec2-metadata -i | cut -d' ' -f2)

          signal_and_terminate() {
            local status=$1
            aws cloudformation signal-resource \
              --stack-name "$STACK_NAME" \
              --logical-resource-id BuildInstance \
              --unique-id "$INSTANCE_ID" \
              --status "$status" \
              --region "$REGION" || true
            # Self-terminate
            aws ec2 terminate-instances --instance-ids "$INSTANCE_ID" --region "$REGION" || true
          }

          trap 'signal_and_terminate FAILURE' ERR

          echo "=== Installing build tools ==="
          dnf install -y docker git nodejs20 python3.12 python3.12-pip
          systemctl start docker
          systemctl enable docker

          # Install uv
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"

          echo "=== Cloning repository ==="
          cd /tmp
          git clone "$REPO_URL" project
          cd project

          echo "=== Building and pushing API Docker image ==="
          aws ecr get-login-password --region "$REGION" | \
            docker login --username AWS --password-stdin "$ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com"
          docker build -t semantic-lakehouse-api ./api
          docker tag semantic-lakehouse-api:latest "$ECR_REPO:latest"
          docker push "$ECR_REPO:latest"

          echo "=== Force-deploying new ECS task ==="
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --desired-count 1 \
            --force-new-deployment \
            --region "$REGION"

          echo "=== Generating sample data ==="
          uv sync
          uv run python scripts/generate_data.py

          echo "=== Uploading data to S3 and registering Glue tables ==="
          uv run python scripts/upload_data.py \
            --bucket "$DATA_BUCKET" \
            --region "$REGION" \
            --database "$GLUE_DB"

          echo "=== Building frontend ==="
          cd frontend
          cat > .env.production << ENVEOF
          VITE_API_URL=$API_URL
          VITE_COGNITO_USER_POOL_ID=$POOL_ID
          VITE_COGNITO_APP_CLIENT_ID=$CLIENT_ID
          VITE_COGNITO_DOMAIN=$COGNITO_DOMAIN
          VITE_COGNITO_REDIRECT_URI=https://$CF_DOMAIN
          ENVEOF

          npm ci
          npm run build

          echo "=== Deploying frontend to S3 ==="
          aws s3 sync dist/ "s3://$FRONTEND_BUCKET/" --delete --region "$REGION"

          echo "=== Build complete ==="
          cd /tmp
          signal_and_terminate SUCCESS

  # ===========================================================================
  # ECR Repository for the API container image
  # ===========================================================================
  ECRRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${EnvironmentName}-semantic-lakehouse-api'
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: MUTABLE
      EncryptionConfiguration:
        EncryptionType: AES256

  # ===========================================================================
  # AgentCore Gateway IAM Role
  # ===========================================================================
  AgentCoreGatewayRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-agentcore-gateway-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3TablesAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt DataBucket.Arn
                  - !Sub '${DataBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - s3tables:GetTable
                  - s3tables:ListTables
                  - s3tables:GetTableData
                Resource:
                  - !Sub 'arn:aws:s3tables:${AWS::Region}:${AWS::AccountId}:bucket/*'
        - PolicyName: AthenaQueryAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - athena:StartQueryExecution
                  - athena:GetQueryExecution
                  - athena:GetQueryResults
                  - athena:StopQueryExecution
                Resource: !Sub 'arn:aws:athena:${AWS::Region}:${AWS::AccountId}:workgroup/*'
              - Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:PutObject
                Resource:
                  - !GetAtt DataBucket.Arn
                  - !Sub '${DataBucket.Arn}/athena_results/*'
        - PolicyName: GlueCatalogAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:GetDatabases
                  - glue:GetTable
                  - glue:GetTables
                  - glue:GetPartitions
                Resource:
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog'
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/${GlueDatabase}'
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/${GlueDatabase}/*'
        - PolicyName: NeptuneAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - neptune-db:connect
                  - neptune-db:ReadDataViaQuery
                  - neptune-db:WriteDataViaQuery
                Resource: !Sub 'arn:aws:neptune-db:${AWS::Region}:${AWS::AccountId}:${NeptuneCluster.ClusterResourceId}/*'
        - PolicyName: AgentCoreInvokeRuntime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock-agentcore:InvokeAgentRuntime
                Resource: !Sub 'arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/*'

# =============================================================================
# Outputs (Task 4.3)
# =============================================================================
Outputs:
  CloudFrontURL:
    Description: URL of the CloudFront distribution serving the frontend
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}'
    Export:
      Name: !Sub '${EnvironmentName}-CloudFrontURL'

  APIEndpointURL:
    Description: URL of the ALB endpoint for the API service
    Value: !Sub 'http://${ALB.DNSName}'
    Export:
      Name: !Sub '${EnvironmentName}-APIEndpointURL'

  CognitoUserPoolId:
    Description: Cognito User Pool ID for authentication configuration
    Value: !Ref CognitoUserPool
    Export:
      Name: !Sub '${EnvironmentName}-CognitoUserPoolId'

  CognitoAppClientId:
    Description: Cognito App Client ID for frontend authentication
    Value: !Ref CognitoUserPoolClient
    Export:
      Name: !Sub '${EnvironmentName}-CognitoAppClientId'

  NeptuneEndpoint:
    Description: Neptune cluster endpoint
    Value: !GetAtt NeptuneCluster.Endpoint

  NeptuneClusterResourceId:
    Description: >
      Neptune cluster resource ID (the `cluster-XXXXXXXXXXXX` form used as
      the resource portion of `arn:aws:neptune-db:...` IAM policies). Deploy
      scripts read this from stack outputs instead of calling
      `neptune:DescribeDBClusters`, which avoids a control-plane permission
      on every caller that wants to grant Neptune IAM access.
    Value: !GetAtt NeptuneCluster.ClusterResourceId

  DataBucketName:
    Description: S3 data bucket name
    Value: !Ref DataBucket

  GlueDatabaseName:
    Description: Glue database name for Iceberg table catalog
    Value: !Ref GlueDatabase

  VPCId:
    Description: VPC ID
    Value: !Ref VPC

  ECRRepositoryUri:
    Description: ECR repository URI for the API container image
    Value: !GetAtt ECRRepository.RepositoryUri

  CognitoDomain:
    Description: Cognito hosted UI domain
    Value: !Sub '${EnvironmentName}-semantic-lakehouse-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com'

  DemoUserCredentials:
    Description: Demo user login (if DemoUserEmail was provided)
    Value: !If
      - HasDemoUser
      - !Sub 'Email: ${DemoUserEmail} / Password: Demo1234!'
      - 'No demo user created (DemoUserEmail was empty)'

  AgentCoreGatewayRoleArn:
    Description: IAM role ARN for the AgentCore Gateway (use when creating the Gateway)
    Value: !GetAtt AgentCoreGatewayRole.Arn

  AgentCoreRuntimeAgentRoleArn:
    Description: IAM role ARN for AgentCore Runtime agent execution
    Value: !GetAtt AgentCoreRuntimeAgentRole.Arn

  CognitoGatewayClientId:
    Description: Cognito M2M client ID for AgentCore Gateway OAuth (client_credentials)
    Value: !Ref CognitoGatewayClient

  CognitoGatewayTokenEndpoint:
    Description: Cognito token endpoint for AgentCore Gateway OAuth
    Value: !Sub 'https://${EnvironmentName}-semantic-lakehouse-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com/oauth2/token'

  CognitoGatewayScope:
    Description: OAuth scope for AgentCore Gateway invocation
    Value: !Sub '${EnvironmentName}-gateway/invoke'

  PrivateSubnetAId:
    Description: Private subnet A ID (for AgentCore VPC mode)
    Value: !Ref PrivateSubnetA

  PrivateSubnetBId:
    Description: Private subnet B ID (for AgentCore VPC mode)
    Value: !Ref PrivateSubnetB

  AgentCoreSecurityGroupId:
    Description: Security group ID for AgentCore Runtime MCP servers (VPC mode)
    Value: !Ref AgentCoreSecurityGroup

  AdminInstanceId:
    Description: EC2 Instance ID for the admin instance (connect via Session Manager)
    Value: !Ref AdminInstance

  AdminInstanceSSMCommand:
    Description: AWS CLI command to connect to the admin instance via Session Manager
    Value: !Sub 'aws ssm start-session --target ${AdminInstance} --region ${AWS::Region}'

  # ===========================================================================
  # Lake Formation Identity Propagation outputs
  # See .kiro/specs/lakeformation-identity-propagation/design.md §Data Models
  # for the authoritative output list. These outputs are consumed by
  # scripts/lf_setup.py (role ARNs, database, data bucket) and by
  # scripts/infra.sh for printing the admin/BI passwords at deploy time.
  # ===========================================================================
  AdminRoleArn:
    Description: IAM role ARN assumed by the Lake Formation admin persona
    Value: !GetAtt AdminRole.Arn
    Export:
      Name: !Sub '${EnvironmentName}-AdminRoleArn'

  BiRoleArn:
    Description: IAM role ARN assumed by the Lake Formation BI persona
    Value: !GetAtt BiRole.Arn
    Export:
      Name: !Sub '${EnvironmentName}-BiRoleArn'

  # The Iceberg ETL Glue job's execution role. Once Lake Formation is
  # registered on the data bucket, this role needs an explicit LF grant
  # (issued by scripts/lf_setup.py::ensure_glue_job_role_permissions) to
  # create / alter / drop Iceberg tables — without the grant, Glue commits
  # fail with "Cannot commit glue_catalog.<db>.<table> because Glue cannot
  # access the requested resources".
  GlueJobRoleArn:
    Description: IAM role ARN used by the Iceberg ETL Glue job (LF writer principal)
    Value: !GetAtt GlueJobRole.Arn
    Export:
      Name: !Sub '${EnvironmentName}-GlueJobRoleArn'

  IdentityPoolId:
    Description: Cognito Identity Pool ID used to exchange User Pool JWTs for STS credentials
    Value: !Ref IdentityPool
    Export:
      Name: !Sub '${EnvironmentName}-IdentityPoolId'

  AdminUserPassword:
    Description: Randomly generated password for admin@unicornsells.com (surfaced by UserPasswordSetter)
    Value: !GetAtt UserPasswordSetter.AdminPassword

  BiUserPassword:
    Description: Randomly generated password for biuser@unicornsells.com (surfaced by UserPasswordSetter)
    Value: !GetAtt UserPasswordSetter.BiPassword

  # -------------------------------------------------------------------------
  # Lake Formation identity-propagation outputs
  # (see .kiro/specs/lakeformation-identity-propagation/design.md §Data Models)
  # -------------------------------------------------------------------------
  # (Outputs consolidated above — AdminRoleArn, BiRoleArn, IdentityPoolId,
  # AdminUserPassword, BiUserPassword are declared earlier in this Outputs
  # block. Duplicate declarations removed to satisfy the YAML "no duplicate
  # mapping keys" constraint that `cfn-lint`/`aws cloudformation validate-template`
  # both enforce.)