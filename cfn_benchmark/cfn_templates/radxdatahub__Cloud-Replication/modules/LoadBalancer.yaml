AWSTemplateFormatVersion: "2010-09-09"
Description:  >-
    Last Modified: 2025/10/16 17:06:37
    "RADx Load Balancer stack"

Parameters:
  Environment:
    Type: String
    Description: The Project Environment
    AllowedValues:
      - dev
      - test
      - prod
      - shared
  ProjectName:
    Type: String
    Description: The Project name
    Default: radx
    AllowedValues:
      - radx

Conditions:
  DEV: !Equals [!Ref Environment, dev]
  TEST: !Equals [!Ref Environment, test]
  PROD: !Equals [!Ref Environment, prod]
  NOTDEV: !Not [!Equals [!Ref Environment, dev]]
  NOTPROD: !Not [!Equals [!Ref Environment, prod]]

Resources:
    RADxDataHubPublicLoadBalancer:
        Type: "AWS::ElasticLoadBalancingV2::LoadBalancer"
        Properties:
            Name: !Sub "${ProjectName}-${Environment}"
            Scheme: "internet-facing"
            Type: "application"
            Subnets:
              - Fn::ImportValue: !Sub RADx-Networking-${Environment}-Public-Subnet-AZ1
              - Fn::ImportValue: !Sub RADx-Networking-${Environment}-Public-Subnet-AZ2
            SecurityGroups:
              - Fn::ImportValue: !Sub RADx-Networking-${Environment}-LoadBalancer-SecurityGroup
            IpAddressType: "ipv4"
            LoadBalancerAttributes:
              -
                Key: "access_logs.s3.enabled"
                Value: "false"
              -
                Key: "idle_timeout.timeout_seconds"
                Value: "60"
              -
                Key: "deletion_protection.enabled"
                Value: "false"
              -
                Key: "routing.http2.enabled"
                Value: "true"
              -
                Key: "routing.http.drop_invalid_header_fields.enabled"
                Value: "false"
              -
                Key: "routing.http.xff_client_port.enabled"
                Value: "false"
              -
                Key: "routing.http.preserve_host_header.enabled"
                Value: "false"
              -
                Key: "routing.http.xff_header_processing.mode"
                Value: "append"
              -
                Key: "load_balancing.cross_zone.enabled"
                Value: "true"
              -
                Key: "routing.http.desync_mitigation_mode"
                Value: "defensive"
              -
                Key: "client_keep_alive.seconds"
                Value: "3600"
              -
                Key: "waf.fail_open.enabled"
                Value: "false"
              -
                Key: "routing.http.x_amzn_tls_version_and_cipher_suite.enabled"
                Value: "false"
              -
                Key: "zonal_shift.config.enabled"
                Value: "false"
              -
                Key: "connection_logs.s3.enabled"
                Value: "false"

    HttpsLoadBalancerListener:
        Type: "AWS::ElasticLoadBalancingV2::Listener"
        Properties:
            LoadBalancerArn: !Ref RADxDataHubPublicLoadBalancer
            # Port: 443
            # Protocol: "HTTPS"
            Port: 80
            Protocol: "HTTP"
            # SslPolicy: "ELBSecurityPolicy-TLS13-1-2-FIPS-2023-04"
            # Certificates: # this is for a specific cert, we want to manage this outside of CF
              # -
                # CertificateArn: !Sub "arn:aws:acm:${AWS::Region}:${AWS::AccountId}:certificate/dd717196-88a0-4fc5-bd11-780195f03b88"
            DefaultActions:
              -
                Order: 1
                TargetGroupArn: !Ref UIServiceTargetGroup
                Type: "forward"

    # This is utilized to perform an HTTP to HTTPS redirect
    # HttpLoadBalancerListener:
    #     Type: "AWS::ElasticLoadBalancingV2::Listener"
    #     Properties:
    #         LoadBalancerArn: !Ref RADxDataHubPublicLoadBalancer
    #         Port: 80
    #         Protocol: "HTTP"
    #         DefaultActions:
    #           -
    #             Order: 1
    #             RedirectConfig:
    #                 Protocol: "HTTPS"
    #                 Port: "443"
    #                 Host: "#{host}"
    #                 Path: "/#{path}"
    #                 Query: "#{query}"
    #                 StatusCode: "HTTP_301"
    #             Type: "redirect"

    UserServiceListenerRule:
        Type: "AWS::ElasticLoadBalancingV2::ListenerRule"
        Properties:
            Priority: "20"
            ListenerArn: !Ref HttpsLoadBalancerListener
            Conditions:
              -
                Field: "path-pattern"
                PathPatternConfig:
                    Values:
                      - "/api/user/v1*"
            Actions:
              -
                Type: "forward"
                TargetGroupArn: !Ref UserServiceTargetGroup
                ForwardConfig:
                    TargetGroups:
                      -
                        TargetGroupArn: !Ref UserServiceTargetGroup
                        Weight: 1
                    TargetGroupStickinessConfig:
                        Enabled: false

    EntityServiceListenerRule:
        Type: "AWS::ElasticLoadBalancingV2::ListenerRule"
        Properties:
            Priority: "30"
            ListenerArn: !Ref HttpsLoadBalancerListener
            Conditions:
              -
                Field: "path-pattern"
                PathPatternConfig:
                    Values:
                      - "/api/entity/v1*"
            Actions:
              -
                Type: "forward"
                TargetGroupArn: !Ref EntityServiceTargetGroup
                ForwardConfig:
                    TargetGroups:
                      -
                        TargetGroupArn: !Ref EntityServiceTargetGroup
                        Weight: 1
                    TargetGroupStickinessConfig:
                        Enabled: false

    DownloadServiceListenerRule:
        Type: "AWS::ElasticLoadBalancingV2::ListenerRule"
