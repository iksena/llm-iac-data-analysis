AWSTemplateFormatVersion: '2010-09-09'
Description: >
  IAM policy and user for GitHub Actions CI/CD.

Resources:
  # ============================================================================
  # GitHub Actions 用 IAM ポリシー
  # ============================================================================
  GitHubActionsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: codec-converter-github-actions-policy
      Description: GitHub Actions CI/CD パイプライン用の最小権限ポリシー
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # CloudFormation スタック操作権限
          - Sid: AllowCloudFormationOperations
            Effect: Allow
            Action:
              - cloudformation:CreateStack
              - cloudformation:UpdateStack
              - cloudformation:DeleteStack
              - cloudformation:DescribeStacks
              - cloudformation:DescribeStackEvents
              - cloudformation:DescribeStackResources
              - cloudformation:GetTemplate
              - cloudformation:ValidateTemplate
              - cloudformation:CreateChangeSet
              - cloudformation:DescribeChangeSet
              - cloudformation:ExecuteChangeSet
              - cloudformation:DeleteChangeSet
              - cloudformation:GetTemplateSummary
            Resource: '*'

          # ECR リポジトリ操作権限
          - Sid: AllowECROperations
            Effect: Allow
            Action:
              - ecr:GetAuthorizationToken
            Resource: '*'

          - Sid: AllowECRRepositoryOperations
            Effect: Allow
            Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:GetDownloadUrlForLayer
              - ecr:BatchGetImage
              - ecr:PutImage
              - ecr:InitiateLayerUpload
              - ecr:UploadLayerPart
              - ecr:CompleteLayerUpload
              - ecr:DescribeRepositories
              - ecr:CreateRepository
              - ecr:TagResource
              - ecr:GetRepositoryPolicy
              - ecr:SetRepositoryPolicy
              - ecr:DeleteRepository
              - ecr:PutLifecyclePolicy
              - ecr:GetLifecyclePolicy
              - ecr:DeleteLifecyclePolicy
              - ecr:ListImages
            Resource: '*'

          # ECR リポジトリポリシー操作（必要に応じてリポジトリポリシーを設定）
          - Sid: AllowECRRepositoryPolicyOperations
            Effect: Allow
            Action:
              - ecr:GetRepositoryPolicy
              - ecr:SetRepositoryPolicy
            Resource: '*'

          # CloudWatch Logs 操作（スタックデプロイ時のログ出力補助）
          - Sid: AllowCloudWatchLogsOperations
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
              - logs:DescribeLogGroups
              - logs:DescribeLogStreams
              - logs:TagResource
              - logs:UntagResource
              - logs:DeleteLogGroup
              - logs:DeleteLogStream
              - logs:PutRetentionPolicy
            Resource: '*'

          # EC2 権限（VPC / セキュリティグループ / サブネット関連）
          - Sid: AllowEC2Operations
            Effect: Allow
            Action:
              - ec2:CreateSecurityGroup
              - ec2:DeleteSecurityGroup
              - ec2:AuthorizeSecurityGroupIngress
              - ec2:AuthorizeSecurityGroupEgress
              - ec2:RevokeSecurityGroupIngress
              - ec2:RevokeSecurityGroupEgress
              - ec2:DescribeVpcs
              - ec2:DescribeSubnets
              - ec2:DescribeSecurityGroups
              - ec2:CreateTags
            Resource: '*'

          # Batch 管理権限（Compute Environment / Job Queue の作成・更新・削除等）
          - Sid: AllowBatchManagement
            Effect: Allow
            Action:
              - batch:CreateComputeEnvironment
              - batch:DeleteComputeEnvironment
              - batch:UpdateComputeEnvironment
              - batch:CreateJobQueue
              - batch:DeleteJobQueue
              - batch:UpdateJobQueue
              - batch:RegisterJobDefinition
              - batch:DeregisterJobDefinition
              - batch:TagResource
              - batch:UntagResource
            Resource: '*'

          # サービスリンクドロール作成（Batch/ECS による自動作成を許可）
          - Sid: AllowCreateServiceLinkedRole
            Effect: Allow
            Action:
              - iam:CreateServiceLinkedRole
            Resource: '*'

          # S3 操作権限（バケット作成用）
          - Sid: AllowS3BucketCreation
            Effect: Allow
            Action:
              - s3:CreateBucket
              - s3:PutBucketPolicy
              - s3:PutBucketTagging
              - s3:DeleteBucket
              - s3:ListAllMyBuckets
              - s3:PutEncryptionConfiguration
              - s3:PutLifecycleConfiguration
              - s3:PutBucketCORS
              - s3:PutBucketPublicAccessBlock
              - s3:GetBucketLocation
              - s3:ListBucketMultipartUploads
              - s3:AbortMultipartUpload
            Resource: '*'

          # S3 バケット操作権限（CloudFormation テンプレートアップロード用）
          - Sid: AllowS3Operations
            Effect: Allow
            Action:
              - s3:PutObject
              - s3:GetObject
              - s3:DeleteObject
              - s3:ListBucket
            Resource: '*'

          # IAM 作成権限（Lambda/Batch 用ロール作成）
          - Sid: AllowIAMRoleCreation
            Effect: Allow
            Action:
              - iam:CreateRole
              - iam:AttachRolePolicy
              - iam:PutRolePolicy
              - iam:DeleteRole
              - iam:DetachRolePolicy
              - iam:DeleteRolePolicy
              - iam:CreatePolicy
              - iam:DeletePolicy
              - iam:ListAccessKeys
              - iam:CreateAccessKey
              - iam:DeleteAccessKey
              - iam:GetUser
              - iam:CreateUser
              - iam:DeleteUser
              - iam:AttachUserPolicy
              - iam:DetachUserPolicy
              - iam:PutUserPolicy
              - iam:TagUser
              - iam:GetRole
              - iam:GetPolicy
              - iam:GetPolicyVersion
              - iam:ListRolePolicies
              - iam:ListUserPolicies
              - iam:GetRolePolicy
              - iam:GetUserPolicy
              - iam:GetAccessKeyLastUsed
              - iam:ListUsers
              - iam:ListGroups
              - iam:GetGroup
              - iam:ListGroupPolicies
              - iam:GetGroupPolicy
              - iam:TagRole
            Resource: '*'

          # IAM ロール PassRole 権限（Lambda/Batch 用）
          - Sid: AllowPassRole
            Effect: Allow
            Action:
              - iam:PassRole
            Resource: '*'
            Condition:
              StringEquals:
                iam:PassedToService:
                  - lambda.amazonaws.com
                  - batch.amazonaws.com
                  - ecs-tasks.amazonaws.com

          # Lambda 関数更新権限
          - Sid: AllowLambdaOperations
            Effect: Allow
            Action:
              - lambda:CreateFunction
              - lambda:UpdateFunctionCode
              - lambda:UpdateFunctionConfiguration
              - lambda:GetFunction
              - lambda:DeleteFunction
              - lambda:PublishVersion
              - lambda:CreateAlias
              - lambda:UpdateAlias
              - lambda:GetAlias
              - lambda:ListVersionsByFunction
              - lambda:AddPermission
              - lambda:RemovePermission
            Resource: '*'

          # Batch ジョブ定義更新権限
          - Sid: AllowBatchOperations
            Effect: Allow
            Action:
              - batch:RegisterJobDefinition
              - batch:DeregisterJobDefinition
              - batch:DescribeJobDefinitions
              - batch:DescribeComputeEnvironments
              - batch:DescribeJobQueues
            Resource: '*'

          # DynamoDB 操作権限
          - Sid: AllowDynamoDBOperations
            Effect: Allow
            Action:
              - dynamodb:CreateTable
              - dynamodb:DeleteTable
              - dynamodb:UpdateTable
              - dynamodb:DescribeTable
              - dynamodb:ListTables
              - dynamodb:TagResource
              - dynamodb:UntagResource
              - dynamodb:UpdateTimeToLive
              - dynamodb:DescribeTimeToLive
              - dynamodb:UpdateContinuousBackups
              - dynamodb:DescribeContinuousBackups
            Resource: '*'

  # ============================================================================
  # GitHub Actions 用 IAM ユーザー
  # ============================================================================
  GitHubActionsUser:
    Type: AWS::IAM::User
    Properties:
      UserName: codec-converter-github-actions
      ManagedPolicyArns:
        - !Ref GitHubActionsPolicy
      Tags:
        - Key: Application
          Value: codec-converter
        - Key: Purpose
          Value: GitHub Actions CI/CD

Outputs:
  GitHubActionsUserName:
    Description: GitHub Actions ユーザーの名前
    Value: !Ref GitHubActionsUser
    Export:
      Name: !Sub '${AWS::StackName}-GitHubActionsUserName'

  GitHubActionsUserArn:
    Description: GitHub Actions ユーザーの ARN
    Value: !GetAtt GitHubActionsUser.Arn
    Export:
      Name: !Sub '${AWS::StackName}-GitHubActionsUserArn'