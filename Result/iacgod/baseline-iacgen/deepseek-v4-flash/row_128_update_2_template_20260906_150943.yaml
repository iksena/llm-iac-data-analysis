AWSTemplateFormatVersion: "2010-09-09"
Description: CloudFormation template for Cluster API Provider for AWS (CAPA) IAM resources

Parameters:
  EnvironmentName:
    Type: String
    Default: capa
    Description: Environment name used for resource naming
  MaxSessionDuration:
    Type: Number
    Default: 3600
    Description: Maximum session duration for IAM roles (in seconds)
  EksOidcProviderArn:
    Type: String
    Default: ""
    Description: ARN of the EKS OIDC provider (required for controllers role pod identity). Leave empty if not using pod identity.

Resources:
  # ========== TRUST POLICIES (embedded in roles) ==========

  # ========== MANAGED POLICIES FOR CAPA SPECIFIC PERMISSIONS ==========
  CAPAControlPlanePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${EnvironmentName}-capa-control-plane-policy"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - ec2:AssociateAddress
              - ec2:AttachVolume
              - ec2:AuthorizeSecurityGroupIngress
              - ec2:CreateRoute
              - ec2:CreateSecurityGroup
              - ec2:CreateTags
              - ec2:CreateVolume
              - ec2:CreateVpc
              - ec2:CreateVpcPeeringConnection
              - ec2:DeleteRoute
              - ec2:DeleteSecurityGroup
              - ec2:DeleteVolume
              - ec2:DeleteVpcPeeringConnection
              - ec2:Describe*
              - ec2:DetachVolume
              - ec2:DisassociateAddress
              - ec2:ModifyInstanceAttribute
              - ec2:ModifyNetworkInterfaceAttribute
              - ec2:RevokeSecurityGroupIngress
              - ec2:RunInstances
              - ec2:TerminateInstances
              - elasticloadbalancing:*
              - autoscaling:CreateAutoScalingGroup
              - autoscaling:DeleteAutoScalingGroup
              - autoscaling:DescribeAutoScalingGroups
              - autoscaling:UpdateAutoScalingGroup
              - autoscaling:SetDesiredCapacity
              - autoscaling:TerminateInstanceInAutoScalingGroup
              - eks:CreateCluster
              - eks:DeleteCluster
              - eks:DescribeCluster
              - eks:ListClusters
              - eks:CreateNodegroup
              - eks:DeleteNodegroup
              - eks:DescribeNodegroup
              - eks:ListNodegroups
              - eks:TagResource
              - eks:UntagResource
              - iam:CreateServiceLinkedRole
              - iam:GetInstanceProfile
              - iam:PassRole
            Resource: "*"

  CAPAControllersPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${EnvironmentName}-capa-controllers-policy"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - ec2:*
              - elasticloadbalancing:*
              - autoscaling:*
              - eks:*
              - iam:CreateServiceLinkedRole
              - iam:GetInstanceProfile
              - iam:ListInstanceProfiles
              - iam:PassRole
              - iam:GetRole
              - iam:ListRoles
              - iam:CreateRole
              - iam:DeleteRole
              - iam:PutRolePolicy
              - iam:DeleteRolePolicy
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
              - iam:CreateInstanceProfile
              - iam:DeleteInstanceProfile
              - iam:AddRoleToInstanceProfile
              - iam:RemoveRoleFromInstanceProfile
              - iam:TagRole
              - iam:UntagRole
              - iam:ListAttachedRolePolicies
              - iam:ListRolePolicies
              - iam:SimulatePrincipalPolicy
              - sts:AssumeRole
              - sts:GetCallerIdentity
            Resource: "*"
          - Effect: Allow
            Action:
              - ec2:Describe*
              - ec2:Get*
            Resource: "*"

  # ========== IAM ROLES ==========
  ControlPlaneRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-control-plane-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      MaxSessionDuration: !Ref MaxSessionDuration
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy
        - arn:aws:iam::aws:policy/AmazonEKSVPCResourceController
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/service-role/AmazonEC2RoleforAWSCodeDeploy
        - !Ref CAPAControlPlanePolicy
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-control-plane-role"

  ControllersRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-controllers-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
          - Fn::If:
              - HasOidcProvider
              - Effect: Allow
                Principal:
                  Federated: !Ref EksOidcProviderArn
                Action: sts:AssumeRoleWithWebIdentity
                Condition:
                  StringEquals:
                    !Sub "${EksOidcProviderArn}:sub": "system:serviceaccount:capasystem:capa-controller-manager"
              - !Ref AWS::NoValue
      MaxSessionDuration: !Ref MaxSessionDuration
      ManagedPolicyArns:
        - !Ref CAPAControllersPolicy
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-controllers-role"

  WorkerNodeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-worker-node-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      MaxSessionDuration: !Ref MaxSessionDuration
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/SecretsManagerReadWrite
        - arn:aws:iam::aws:policy/ElasticLoadBalancingReadOnly
        - arn:aws:iam::aws:policy/AutoScalingReadOnlyAccess
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-worker-node-role"

  EKSControlPlaneRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-eks-control-plane-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action: sts:AssumeRole
      MaxSessionDuration: !Ref MaxSessionDuration
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy
        - arn:aws:iam::aws:policy/AmazonEKSServicePolicy
        - arn:aws:iam::aws:policy/AmazonEKSVPCResourceController
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-eks-control-plane-role"

  # ========== INSTANCE PROFILES ==========
  ControlPlaneInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "${EnvironmentName}-control-plane-instance-profile"
      Roles:
        - !Ref ControlPlaneRole

  WorkerNodeInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "${EnvironmentName}-worker-node-instance-profile"
      Roles:
        - !Ref WorkerNodeRole

  # ========== IAM GROUP AND USER ==========
  BootstrapperGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: !Sub "${EnvironmentName}-bootstrapper-group"
      ManagedPolicyArns:
        - !Ref CAPAControllersPolicy
      Policies:
        - PolicyName: !Sub "${EnvironmentName}-bootstrapper-pass-role"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt ControlPlaneRole.Arn
                  - !GetAtt WorkerNodeRole.Arn
                  - !GetAtt EKSControlPlaneRole.Arn
                  - !GetAtt ControllersRole.Arn

  BootstrapperUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Sub "${EnvironmentName}-bootstrapper-user"
      Groups:
        - !Ref BootstrapperGroup
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-bootstrapper-user"

  BootstrapperAccessKey:
    Type: AWS::IAM::AccessKey
    Properties:
      UserName: !Ref BootstrapperUser
      Status: Active

Conditions:
  HasOidcProvider:
    Fn::Not:
      - Fn::Equals:
          - !Ref EksOidcProviderArn
          - ""

Outputs:
  ControlPlaneRoleArn:
    Description: ARN of the Control Plane IAM Role
    Value: !GetAtt ControlPlaneRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ControlPlaneRoleArn"

  ControllersRoleArn:
    Description: ARN of the Controllers IAM Role
    Value: !GetAtt ControllersRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ControllersRoleArn"

  WorkerNodeRoleArn:
    Description: ARN of the Worker Node IAM Role
    Value: !GetAtt WorkerNodeRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-WorkerNodeRoleArn"

  EKSControlPlaneRoleArn:
    Description: ARN of the EKS Control Plane IAM Role
    Value: !GetAtt EKSControlPlaneRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-EKSControlPlaneRoleArn"

  BootstrapperUserArn:
    Description: ARN of the Bootstrapper IAM User
    Value: !GetAtt BootstrapperUser.Arn
    Export:
      Name: !Sub "${AWS::StackName}-BootstrapperUserArn"

  BootstrapperAccessKeyId:
    Description: Access Key ID for the Bootstrapper User
    Value: !Ref BootstrapperAccessKey
    Export:
      Name: !Sub "${AWS::StackName}-BootstrapperAccessKeyId"

  BootstrapperSecretAccessKey:
    Description: Secret Access Key for the Bootstrapper User
    Value: !GetAtt BootstrapperAccessKey.SecretAccessKey
    Export:
      Name: !Sub "${AWS::StackName}-BootstrapperSecretAccessKey"

  ControlPlaneInstanceProfileName:
    Description: Name of the Control Plane Instance Profile
    Value: !Ref ControlPlaneInstanceProfile
    Export:
      Name: !Sub "${AWS::StackName}-ControlPlaneInstanceProfileName"

  WorkerNodeInstanceProfileName:
    Description: Name of the Worker Node Instance Profile
    Value: !Ref WorkerNodeInstanceProfile
    Export:
      Name: !Sub "${AWS::StackName}-WorkerNodeInstanceProfileName"