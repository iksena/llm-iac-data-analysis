AWSTemplateFormatVersion: '2010-09-09'
Description: 'Private VPC infrastructure for application deployment with optional NAT Gateway and KMS encrypted artifact bucket'

Parameters:
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    Description: CIDR block for the VPC
  AlbSubnet1Cidr:
    Type: String
    Default: 10.0.1.0/24
    Description: CIDR block for the first ALB private subnet
  AlbSubnet2Cidr:
    Type: String
    Default: 10.0.2.0/24
    Description: CIDR block for the second ALB private subnet
  LambdaSubnetCidr:
    Type: String
    Default: 10.0.3.0/24
    Description: CIDR block for the Lambda private subnet
  PublicSubnetCidr:
    Type: String
    Default: 10.0.254.0/24
    Description: CIDR block for the public subnet (NAT Gateway)
  Az1:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: !Select [0, !GetAZs '']
    Description: Availability Zone for the first ALB subnet and public subnet
  Az2:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: !Select [1, !GetAZs '']
    Description: Availability Zone for the second ALB subnet
  Az3:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: !Select [2, !GetAZs '']
    Description: Availability Zone for the Lambda subnet
  EnableNatGateway:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enable NAT Gateway for internet egress from private subnets
  ArtifactBucketName:
    Type: String
    Default: 'my-artifact-bucket'
    Description: Name for the artifact storage bucket (must be globally unique)

Conditions:
  HasNatGateway: !Equals [!Ref EnableNatGateway, 'true']

Mappings: {}

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-VPC'

  InternetGateway:
    Condition: HasNatGateway
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-IGW'

  VPCGatewayAttachment:
    Condition: HasNatGateway
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Condition: HasNatGateway
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnetCidr
      AvailabilityZone: !Ref Az1
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-PublicSubnet'

  NatGatewayEIP:
    Condition: HasNatGateway
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  NatGateway:
    Condition: HasNatGateway
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatGatewayEIP.AllocationId
      SubnetId: !Ref PublicSubnet
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-NAT'

  PublicRouteTable:
    Condition: HasNatGateway
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-PublicRT'

  PublicRouteDefault:
    Condition: HasNatGateway
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: '0.0.0.0/0'
      GatewayId: !Ref InternetGateway
    DependsOn: VPCGatewayAttachment

  PublicSubnetRouteTableAssociation:
    Condition: HasNatGateway
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-PrivateRT'

  PrivateRouteToNat:
    Condition: HasNatGateway
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: '0.0.0.0/0'
      NatGatewayId: !Ref NatGateway

  AlbSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref AlbSubnet1Cidr
      AvailabilityZone: !Ref Az1
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-AlbSubnet1'

  AlbSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref AlbSubnet2Cidr
      AvailabilityZone: !Ref Az2
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-AlbSubnet2'

  LambdaSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref LambdaSubnetCidr
      AvailabilityZone: !Ref Az3
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-LambdaSubnet'

  PrivateSubnetRouteTableAssociation1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AlbSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetRouteTableAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AlbSubnet2
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetRouteTableAssociation3:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref LambdaSubnet
      RouteTableId: !Ref PrivateRouteTable

  ArtifactKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    Properties:
      Description: 'KMS key for artifact bucket encryption'
      Enabled: true
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-ArtifactKey'

  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !Ref ArtifactBucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              KMSMasterKeyID: !Ref ArtifactKey
              SSEAlgorithm: 'aws:kms'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-ArtifactBucket'

Outputs:
  VpcId:
    Description: VPC ID
    Value: !Ref VPC
    Export:
      Name: !Sub '${AWS::StackName}-VpcId'

  AlbSubnet1Id:
    Description: Subnet ID for ALB Subnet 1
    Value: !Ref AlbSubnet1
    Export:
      Name: !Sub '${AWS::StackName}-AlbSubnet1'

  AlbSubnet2Id:
    Description: Subnet ID for ALB Subnet 2
    Value: !Ref AlbSubnet2
    Export:
      Name: !Sub '${AWS::StackName}-AlbSubnet2'

  LambdaSubnetId:
    Description: Subnet ID for Lambda Subnet
    Value: !Ref LambdaSubnet
    Export:
      Name: !Sub '${AWS::StackName}-LambdaSubnet'

  PublicSubnetId:
    Condition: HasNatGateway
    Description: Subnet ID for NAT Gateway public subnet
    Value: !Ref PublicSubnet
    Export:
      Name: !Sub '${AWS::StackName}-PublicSubnet'

  NatGatewayId:
    Condition: HasNatGateway
    Description: NAT Gateway ID
    Value: !Ref NatGateway
    Export:
      Name: !Sub '${AWS::StackName}-NatGateway'

  ArtifactBucketName:
    Description: Artifact bucket name
    Value: !Ref ArtifactBucket
    Export:
      Name: !Sub '${AWS::StackName}-ArtifactBucket'

  KmsKeyId:
    Description: KMS Key ID for artifact bucket encryption
    Value: !Ref ArtifactKey
    Export:
      Name: !Sub '${AWS::StackName}-KmsKeyId'