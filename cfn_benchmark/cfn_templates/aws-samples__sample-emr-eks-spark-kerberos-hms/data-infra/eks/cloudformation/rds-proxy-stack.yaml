AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  AWS CloudFormation template for Amazon RDS Proxy and Target Group.
  Creates an Amazon RDS Proxy for connection pooling to the Aurora PostgreSQL database.

  COST WARNING: RDS Proxy incurs hourly charges. Delete this stack to stop charges.

Parameters:
  ProjectName:
    Description: An environment name that is prefixed to resource names
    Type: String
    Default: KerberosEMRonEKS

  DBIdentifier:
    Type: String
    Description: Name of the database to be created in the RDS instance

  VPC:
    Type: AWS::EC2::VPC::Id
    Description: The VPC ID

  VpcCIDR:
    Description: Please enter the IP range (CIDR notation) for this VPC
    Type: String
    Default: 10.0.1.0/24

  PrivateSubnets:
    Type: List<AWS::EC2::Subnet::Id>
    Description: List of private subnet IDs

  EKSSecurityGroups:
    Type: List<AWS::EC2::SecurityGroup::Id>
    Description: List of EKS cluster security group IDs to allow access to RDS

  DBSecretArn:
    Type: String
    Description: ARN of the Secrets Manager secret containing RDS credentials

  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group ID of the RDS database

  DBSecretKMSKeyArn:
    Description: ARN of the KMS key used for DB secret encryption
    Type: String
    Default: ""

  DBClusterIdentifier:
    Type: String
    Description: Identifier of the Aurora DB cluster to register with the proxy
    Default: ""

Conditions:
  HasDBCluster: !Not [!Equals [!Ref DBClusterIdentifier, ""]]
  HasKMSKey: !Not [!Equals [!Ref DBSecretKMSKeyArn, ""]]

Resources:
  DBProxyRole:
    Type: AWS::IAM::Role
    Metadata:
      guard:
        SuppressedRules:
          - IAM_NO_INLINE_POLICY_CHECK: "Inline policy acceptable for demo purposes. For production, refactor to managed policies."
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: rds.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref DBSecretArn
        - !If
          - HasKMSKey
          - PolicyName: KMSAccess
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - kms:Decrypt
                  Resource: !Ref DBSecretKMSKeyArn
          - !Ref "AWS::NoValue"
      Tags:
        - Key: ProjectName
          Value: !Ref ProjectName

  DBProxySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for RDS Proxy
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Select [0, !Ref EKSSecurityGroups]
          Description: "Allow PostgreSQL access from EKS cluster security group 1"
      SecurityGroupEgress:
        # Allow outbound traffic to RDS instance
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          DestinationSecurityGroupId: !Ref DBSecurityGroup
          Description: "Allow outbound PostgreSQL traffic to RDS instance"
        # Allow DNS resolution (if needed)
        - IpProtocol: udp
          FromPort: 53
          ToPort: 53
          CidrIp: !Ref VpcCIDR
          Description: "Allow DNS resolution within VPC"
        - IpProtocol: tcp
          FromPort: 53
          ToPort: 53
          CidrIp: !Ref VpcCIDR
          Description: "Allow DNS resolution within VPC"
      Tags:
        - Key: ProjectName
          Value: !Ref ProjectName

  DBProxy:
    Type: AWS::RDS::DBProxy
    DeletionPolicy: Delete
    Properties:
      DBProxyName: !Sub ${DBIdentifier}-proxy
      EngineFamily: POSTGRESQL
      IdleClientTimeout: 1800
      RequireTLS: true
      RoleArn: !GetAtt DBProxyRole.Arn
      Auth:
        - AuthScheme: SECRETS
          SecretArn: !Ref DBSecretArn
          # IAMAuth disabled for demo. For production, consider IAMAuth: REQUIRED.
          IAMAuth: DISABLED
      VpcSubnetIds: !Ref PrivateSubnets
      VpcSecurityGroupIds:
        - !Ref DBProxySecurityGroup
      Tags:
        - Key: ProjectName
          Value: !Ref ProjectName

  DBProxyTargetGroup:
    Type: AWS::RDS::DBProxyTargetGroup
    Condition: HasDBCluster
    Properties:
      DBProxyName: !Ref DBProxy
      TargetGroupName: default
      DBClusterIdentifiers:
        - !Ref DBClusterIdentifier
      ConnectionPoolConfigurationInfo:
        MaxConnectionsPercent: 75
        MaxIdleConnectionsPercent: 25
        ConnectionBorrowTimeout: 120

  DBSecurityGroupIngressFromProxy:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DBSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref DBProxySecurityGroup
      Description: "Allow PostgreSQL access from RDS Proxy security group"

Outputs:
  DBProxyName:
    Description: The name of the created DB Proxy
    Value: !Ref DBProxy

  DBProxyEndpoint:
    Description: The endpoint of the created DB Proxy
    Value: !GetAtt DBProxy.Endpoint

  DBProxyArn:
    Description: The ARN of the created DB Proxy
    Value: !GetAtt DBProxy.DBProxyArn