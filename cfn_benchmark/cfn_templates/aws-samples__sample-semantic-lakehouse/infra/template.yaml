      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ECRAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                Resource: !GetAtt ECRRepository.Arn
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:DeleteObject
                Resource:
                  - !GetAtt DataBucket.Arn
                  - !Sub '${DataBucket.Arn}/*'
                  - !GetAtt FrontendBucket.Arn
                  - !Sub '${FrontendBucket.Arn}/*'
        - PolicyName: GlueAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - glue:CreateTable
                  - glue:UpdateTable
                  - glue:DeleteTable
                  - glue:GetTable
                  - glue:GetTables
                  - glue:GetDatabase
                  - glue:GetDatabases
                  - glue:CreateDatabase
                Resource:
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog'
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/${GlueDatabase}'
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/${GlueDatabase}/*'
        - PolicyName: ECSAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecs:UpdateService
                  - ecs:DescribeServices
                  - ecs:DescribeTaskDefinition
                  - ecs:RegisterTaskDefinition
                  - ecs:ListTasks
                  - ecs:DescribeTasks
                  - ecs:StopTask
                Resource: '*'
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !GetAtt FargateExecutionRole.Arn
                  - !GetAtt FargateTaskRole.Arn
                  - !GetAtt AgentCoreGatewayRole.Arn
                  - !GetAtt AgentCoreRuntimeAgentRole.Arn
        - PolicyName: NeptuneAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - neptune-db:connect
                  - neptune-db:ReadDataViaQuery
                  - neptune-db:WriteDataViaQuery
                  - neptune-db:DeleteDataViaQuery
                Resource: !Sub 'arn:aws:neptune-db:${AWS::Region}:${AWS::AccountId}:${NeptuneCluster.ClusterResourceId}/*'
              # Control-plane describe so deploy scripts can resolve the cluster resource ID
              - Effect: Allow
                Action:
                  - neptune:DescribeDBClusters
                Resource: '*'
        - PolicyName: BedrockAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                  - bedrock:ListFoundationModels
                Resource:
                  - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/anthropic.claude-*'
                  - !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-*'
              - Effect: Allow
                Action:
                  - bedrock-agentcore:*
                Resource: '*'
        - PolicyName: CloudFormationAndCDKBootstrap
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:*
                  - iam:*Role*
                  - iam:*Policy*
                  - iam:GetPolicy*
                  - iam:ListPolicy*
                  - ssm:PutParameter
                  - ssm:GetParameter
                  - ssm:DeleteParameter
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:*
                Resource: !Sub 'arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/cdk-*'
              - Effect: Allow
                Action:
                  - s3:*
                Resource:
                  - !Sub 'arn:aws:s3:::cdk-*-${AWS::AccountId}-${AWS::Region}'
                  - !Sub 'arn:aws:s3:::cdk-*-${AWS::AccountId}-${AWS::Region}/*'
        - PolicyName: CognitoReadSecrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:DescribeUserPool
                  - cognito-idp:DescribeUserPoolClient
                  - cognito-idp:ListUserPoolClients
                Resource: !GetAtt CognitoUserPool.Arn
        - PolicyName: CloudFrontInvalidate
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudfront:ListDistributions
                  - cloudfront:GetDistribution
                  - cloudfront:CreateInvalidation
                Resource: '*'
        - PolicyName: AthenaAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - athena:StartQueryExecution
                  - athena:GetQueryExecution
                  - athena:GetQueryResults
                  - athena:StopQueryExecution
                Resource: !Sub 'arn:aws:athena:${AWS::Region}:${AWS::AccountId}:workgroup/*'
              - Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:PutObject
                Resource:
                  - !GetAtt DataBucket.Arn
                  - !Sub '${DataBucket.Arn}/athena_results/*'
        # Admin EC2 runs scripts/lf_setup.py during deploy (invoked by
        # scripts/infra.sh via scripts/lf-setup.sh). Lake Formation
        # grant/revoke and data-cell-filter operations require
        # Resource: "*" because LF does not support resource-level IAM
        # scoping for data-catalog grants. See
        # .kiro/specs/lakeformation-identity-propagation/design.md
        # §Open Questions — "Does this feature require the Admin EC2's
        # inline policies to grow new lakeformation:* actions?" — and the
        # matching cfn-nag W11 suppression in infra/.cfn_nag_suppress.yaml.
        - PolicyName: LakeFormationSetup
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lakeformation:GetDataLakeSettings
                  - lakeformation:PutDataLakeSettings
                  - lakeformation:GrantPermissions
                  - lakeformation:RevokePermissions
                  - lakeformation:RegisterResource
                  - lakeformation:DeregisterResource
                  - lakeformation:CreateDataCellsFilter
                  - lakeformation:DeleteDataCellsFilter
                  - lakeformation:GetDataCellsFilter
                  - lakeformation:ListDataCellsFilters
                  - lakeformation:ListPermissions
                  - lakeformation:ListResources
                Resource: '*'
              # PutDataLakeSettings registers AdminRole / BiRole as LF
              # DataLakeAdmins; LF validates the caller can pass those
              # roles.
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt AdminRole.Arn
                  - !GetAtt BiRole.Arn

  AdminInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref AdminInstanceRole

  AdminInstance:
    Type: AWS::EC2::Instance
    DependsOn:
      - NatGateway
      - PrivateRoute
    Properties:
      InstanceType: t3.medium
      ImageId: !Sub '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
      SubnetId: !Ref PrivateSubnetA
      SecurityGroupIds:
        - !Ref AdminInstanceSecurityGroup
      IamInstanceProfile: !Ref AdminInstanceProfile
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
            Encrypted: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-admin-instance'
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail

          # Install essential tools
          dnf install -y docker git nodejs20 python3.12 python3.12-pip unzip
          systemctl start docker
          systemctl enable docker

          # Install uv (Python package manager)
          curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR="/usr/local/bin" sh

          # Install AgentCore CLI
          npm install -g @aws/agentcore

          # Create a welcome script with stack info
          cat > /etc/profile.d/semantic-lakehouse.sh << PROFILE
          echo "=============================================="
          echo "  Semantic Lakehouse Admin Instance"
          echo "  Region: ${AWS::Region}"
          echo "  Stack:  ${AWS::StackName}"
          echo "=============================================="
          echo ""
          echo "Tools installed: docker, git, node, python3.12, uv, agentcore"
          echo ""
          echo "NOTE: Session Manager lands you as 'ssm-user', which cannot"
          echo "      write to /usr/lib/nodejs*/lib/node_modules and will fail"
          echo "      npm install -g during deploy. Elevate to root first:"
          echo ""
          echo "  sudo -i"
          echo ""
          echo "Then download the project from S3 and deploy AgentCore:"
          echo "  DATA_BUCKET=\\\$(aws cloudformation describe-stacks \\\\"
          echo "    --stack-name ${AWS::StackName} --region ${AWS::Region} \\\\"
          echo "    --query \"Stacks[0].Outputs[?OutputKey=='DataBucketName'].OutputValue\" --output text)"
          echo "  aws s3 cp s3://\\\$DATA_BUCKET/bootstrap/project.zip ~/project.zip --region ${AWS::Region}"
          echo "  rm -rf ~/semantic-demo && mkdir ~/semantic-demo"
          echo "  unzip -oq ~/project.zip -d ~/semantic-demo"
          echo "  cd ~/semantic-demo"
          echo "  bash scripts/deploy.sh agentcore --region ${AWS::Region}"
          echo ""
          export AWS_REGION=${AWS::Region}
          export STACK_NAME=${AWS::StackName}
          PROFILE

  # ===========================================================================
  # Build Instance — ephemeral EC2 for building and deploying
  # ===========================================================================
  BuildInstanceSecurityGroup:
