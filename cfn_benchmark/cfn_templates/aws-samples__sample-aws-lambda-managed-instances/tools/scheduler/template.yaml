AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: LMI Scheduler - Manages Lambda Managed Instances capacity on user-defined schedules

Globals:
  Function:
    Runtime: python3.13
    Timeout: 300
    MemorySize: 256
    Architectures:
      - arm64
    Tracing: Active
    Environment:
      Variables:
        STATE_TABLE_NAME: !Ref StateTable
        POWERTOOLS_SERVICE_NAME: lmi-scheduler
        POWERTOOLS_LOG_LEVEL: INFO

Parameters:
  StageName:
    Type: String
    Default: prod

Resources:
  StateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub lmi-scheduler-${StageName}
      BillingMode:
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  ScheduleGroup:
    Type: AWS::Scheduler::ScheduleGroup
    Properties:
      Name: !Sub lmi-scheduler-${StageName}

  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub lmi-scheduler-dlq-${StageName}
      MessageRetentionPeriod: 1209600

  SchedulerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeExecutor
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt ExecutorFunction.Arn
        - PolicyName: SendToDLQ
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt DeadLetterQueue.Arn

  ManagementFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub lmi-scheduler-management-${StageName}
      Handler: scheduler.management.handler
      CodeUri: src/
      Environment:
        Variables:
          SCHEDULE_GROUP_NAME: !Ref ScheduleGroup
          EXECUTOR_FUNCTION_ARN: !GetAtt ExecutorFunction.Arn
          SCHEDULER_ROLE_ARN: !GetAtt SchedulerExecutionRole.Arn
          DLQ_ARN: !GetAtt DeadLetterQueue.Arn
      Events:
        PostRegistration:
          Type: HttpApi
          Properties:
            ApiId: !Ref SchedulerApi
            Path: /registrations
            Method: POST
        GetRegistrations:
          Type: HttpApi
          Properties:
            ApiId: !Ref SchedulerApi
            Path: /registrations
            Method: GET
        GetRegistration:
          Type: HttpApi
          Properties:
            ApiId: !Ref SchedulerApi
            Path: /registrations/{cpName}
            Method: GET
        PutRegistration:
          Type: HttpApi
          Properties:
            ApiId: !Ref SchedulerApi
            Path: /registrations/{cpName}
            Method: PUT
        DeleteRegistration:
          Type: HttpApi
          Properties:
            ApiId: !Ref SchedulerApi
            Path: /registrations/{cpName}
            Method: DELETE
        GetReport:
          Type: HttpApi
          Properties:
            ApiId: !Ref SchedulerApi
            Path: /reports/{cpName}
            Method: GET
        GetAggregateReport:
          Type: HttpApi
          Properties:
            ApiId: !Ref SchedulerApi
            Path: /reports
            Method: GET
        GetCapacityProviders:
          Type: HttpApi
          Properties:
            ApiId: !Ref SchedulerApi
            Path: /capacity-providers
            Method: GET
        ScaleDown:
          Type: HttpApi
          Properties:
            ApiId: !Ref SchedulerApi
            Path: /registrations/{cpName}/actions/scale-down
            Method: POST
        ScaleUp:
          Type: HttpApi
          Properties:
            ApiId: !Ref SchedulerApi
            Path: /registrations/{cpName}/actions/scale-up
            Method: POST
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref StateTable
        - Statement:
            - Effect: Allow
              Action:
                - scheduler:CreateSchedule
                - scheduler:UpdateSchedule
                - scheduler:DeleteSchedule
                - scheduler:GetSchedule
              Resource: !Sub arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/${ScheduleGroup}/*
        - Statement:
            - Effect: Allow
              Action: iam:PassRole
              Resource: !GetAtt SchedulerExecutionRole.Arn
        - Statement:
            - Effect: Allow
              Action:
                - lambda:GetCapacityProvider
                - lambda:ListCapacityProviders
              Resource: '*'
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt ExecutorFunction.Arn

  ExecutorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub lmi-scheduler-executor-${StageName}
      Handler: scheduler.executor.handler
      CodeUri: src/
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref StateTable
        - Statement:
            - Effect: Allow
              Action:
                - lambda:GetCapacityProvider
                - lambda:UpdateCapacityProvider
                - lambda:ListFunctionVersionsByCapacityProvider
              Resource: '*'
        - Statement:
            - Effect: Allow
              Action:
                - lambda:GetFunctionScalingConfig
                - lambda:PutFunctionScalingConfig
              Resource: '*'
        - Statement:
            - Effect: Allow
              Action: ec2:DescribeInstances
              Resource: '*'
        - Statement:
            - Effect: Allow
              Action: pricing:GetProducts
              Resource: '*'

  SchedulerApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref StageName
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub https://${SchedulerApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}
  ManagementFunctionArn:
    Description: Management Lambda ARN
    Value: !GetAtt ManagementFunction.Arn
  ExecutorFunctionArn:
    Description: Executor Lambda ARN
    Value: !GetAtt ExecutorFunction.Arn
  StateTableName:
    Description: DynamoDB table name
    Value: !Ref StateTable