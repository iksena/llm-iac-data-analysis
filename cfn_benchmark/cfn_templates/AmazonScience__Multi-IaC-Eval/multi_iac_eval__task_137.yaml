Parameters:
  PatchGroups:
    Type: CommaDelimitedList

Resources:

  # Patch 2019 Windows instances 7 days after the patches have been
  # released
  PatchBaseLineWindows2019:
    Type: AWS::SSM::PatchBaseline
    Properties:
      Description: Baseline containing all updates approved for Windows 2019 instances
      OperatingSystem: WINDOWS
      PatchGroups: !Ref PatchGroups
      ApprovalRules:
        PatchRules:
          - PatchFilterGroup:
              PatchFilters:
                - Values:
                    - Critical
                    - Important
                    - Moderate
                  Key: MSRC_SEVERITY
                - Values:
                    - SecurityUpdates
                    - CriticalUpdates
                  Key: CLASSIFICATION
                - Values:
                    - WindowsServer2019
                  Key: PRODUCT
            ApproveAfterDays: 7
            ComplianceLevel: CRITICAL

  # Patch Amazon Linux 2 instances 7 days after the patches have been
  # released
  PatchBaselineAmazonLinux2:
    Type: AWS::SSM::PatchBaseline
    Properties:
      Description: Baseline containing all updates approved for Amazon Linux 2
      OperatingSystem: AMAZON_LINUX_2
      PatchGroups: !Ref PatchGroups
      ApprovalRules:
        PatchRules:
          - PatchFilterGroup:
              PatchFilters:
                - Values:
                    - Critical
                    - Important
                    - Moderate
                  Key: MSRC_SEVERITY
                - Values:
                    - Security
                    - Enhancement
                  Key: CLASSIFICATION
                - Values:
                    - AmazonLinux2
                    - AmazonLinux2.0
                  Key: PRODUCT
            ApproveAfterDays: 7
            ComplianceLevel: CRITICAL
            EnableNonSecurity: false

  # New Resource: SNS Topic for notifications
  PatchingNotificationsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: PatchingNotificationsTopic
      Subscription:
        - Endpoint: example@example.com
          Protocol: email

  # New Resource: EventBridge Rule to trigger SNS notification
  PatchingNotificationRule:
    Type: AWS::Events::Rule
    Properties:
      Description: "Triggers when EC2 instances are patched"
      EventPattern:
        source:
          - "aws.ec2"
        detail-type:
          - "EC2 Instance Patch State Change"
      Targets:
        - Arn:
            Fn::GetAtt:
              - PatchingNotificationsTopic
              - TopicArn
          Id: "PatchingNotificationsTopic"