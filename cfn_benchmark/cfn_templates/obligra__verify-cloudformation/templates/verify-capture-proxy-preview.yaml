AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Obligra Verify Capture Proxy.
  Deploys a customer-owned serverless relay with a capture policy engine
  that controls what data leaves the customer account before forwarding
  to the Obligra Verify API.

Parameters:
  VerifyApiBaseUrl:
    Type: String
    Default: https://api.obligra.ai/api/v1
    Description: >
      Base URL of the Obligra Verify capture API.
      Example: https://api.obligra.ai/api/v1

  VerifyApiKey:
    Type: String
    NoEcho: true
    Description: Obligra Verify API key. Stored encrypted. Never logged.

  EnvironmentName:
    Type: String
    Default: sandbox
    AllowedValues:
      - sandbox
      - dev
      - staging
      - production
    Description: Environment label for tagging and logging context.

  CapturePolicyJson:
    Type: String
    Default: ''
    Description: >
      JSON capture policy controlling what data is forwarded to Verify.
      If empty, defaults to forward_all mode (pass-through).
      Must not contain secrets. See examples/capture-policy-basic.json.

  AllowedOrigins:
    Type: String
    Default: '*'
    Description: >
      Comma-separated list of allowed CORS origins.
      Use '*' for development only. Restrict in production.

  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90]
    Description: CloudWatch log retention in days.

Resources:

  # ─── Lambda Execution Role ───────────────────────────────────────────────────

  ProxyFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'verify-capture-proxy-${EnvironmentName}-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudWatchLogsOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/verify-capture-proxy-${EnvironmentName}:*'

  # ─── Lambda Function ─────────────────────────────────────────────────────────

  ProxyFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'verify-capture-proxy-${EnvironmentName}'
      Runtime: nodejs20.x
      Handler: index.handler
      MemorySize: 128
      Timeout: 15
      Role: !GetAtt ProxyFunctionRole.Arn
      Environment:
        Variables:
          VERIFY_API_BASE_URL: !Ref VerifyApiBaseUrl
          VERIFY_API_KEY: !Ref VerifyApiKey
          ENVIRONMENT_NAME: !Ref EnvironmentName
          ALLOWED_ORIGINS: !Ref AllowedOrigins
          CAPTURE_POLICY_JSON: !Ref CapturePolicyJson
      Code:
        ZipFile: |
          const https = require('https');

          const VERIFY_URL = process.env.VERIFY_API_BASE_URL;
          const API_KEY = process.env.VERIFY_API_KEY;
          const ALLOWED_ORIGINS = (process.env.ALLOWED_ORIGINS || '*').split(',').map(s => s.trim());

          // ─── Capture Policy Engine ───────────────────────────────────────────
          let POLICY = { mode: 'forward_all' };
          try {
            const raw = process.env.CAPTURE_POLICY_JSON;
            if (raw && raw.trim()) POLICY = JSON.parse(raw);
          } catch (e) {
            console.error(JSON.stringify({ service: 'verify-capture-proxy', event: 'policy_parse_error', message: e.message }));
          }

          function applyPolicy(body) {
            if (!POLICY || POLICY.mode === 'forward_all') return body;

            const cap = POLICY.capture || {};
            const sec = POLICY.security || {};
            const neverForward = new Set((sec.neverForward || []).map(k => k.toLowerCase()));

            // Start building filtered payload
            const result = { workflowId: body.workflowId };

            // intent_only: workflowId + model only
            if (POLICY.mode === 'intent_only') {
              if (body.model && cap.model !== false) {
                result.model = {};
                if (body.model.provider && (cap.model?.includeProvider !== false)) result.model.provider = body.model.provider;
                if (body.model.modelId && (cap.model?.includeModelId !== false)) result.model.modelId = body.model.modelId;
              }
              result.operationalContext = { captureMode: 'intent_only' };
              return result;
            }

            // policy mode: explicit field control
            const ctx = body.operationalContext || {};
            const filteredCtx = {};
            const ctxPolicy = cap.operationalContext || {};
            const allowedKeys = ctxPolicy.allowedKeys ? new Set(ctxPolicy.allowedKeys) : null;
            const redactedKeys = new Set((ctxPolicy.redactedKeys || []).map(k => k.toLowerCase()));
            const dropUnknown = ctxPolicy.dropUnknownKeys === true;
            const maxValueLen = ctxPolicy.maxValueLength || 1024;
            let droppedCount = 0;
            let redactedCount = 0;

            for (const [key, value] of Object.entries(ctx)) {
              const keyLower = key.toLowerCase();

              // Security: never forward
              if (neverForward.has(keyLower)) { droppedCount++; continue; }

              // Skip prompt/response here — handled separately
              if (key === 'prompt' || key === 'response') continue;

              // Redacted keys
              if (redactedKeys.has(keyLower)) { redactedCount++; continue; }

              // Allowed keys filter
              if (allowedKeys && !allowedKeys.has(key)) {
                if (dropUnknown) { droppedCount++; continue; }
              }

              // Truncate value
              const strVal = typeof value === 'string' ? value : JSON.stringify(value);
              filteredCtx[key] = strVal.slice(0, maxValueLen);
            }

            // Handle prompt
            const promptPolicy = cap.prompt || {};
            if (promptPolicy.allow !== false) {
              const promptVal = ctx.prompt || body.prompt || '';
              if (promptVal) {
                const maxLen = promptPolicy.maxLength || 512;
                filteredCtx.prompt = promptVal.slice(0, maxLen);
              }
            } else { droppedCount++; }

            // Handle response
            const responsePolicy = cap.response || {};
            if (responsePolicy.allow !== false) {
              const responseVal = ctx.response || body.response || '';
              if (responseVal) {
                const maxLen = responsePolicy.maxLength || 512;
                filteredCtx.response = responseVal.slice(0, maxLen);
              }
            } else { droppedCount++; }

            result.operationalContext = filteredCtx;

            // Model
            if (body.model) {
              result.model = {};
              const modelPolicy = cap.model || {};
              if (body.model.provider && modelPolicy.includeProvider !== false) result.model.provider = body.model.provider;
              if (body.model.modelId && modelPolicy.includeModelId !== false) result.model.modelId = body.model.modelId;
            }

            // Also strip neverForward from top-level
            for (const key of Object.keys(result)) {
              if (neverForward.has(key.toLowerCase()) && key !== 'workflowId') {
                delete result[key]; droppedCount++;
              }
            }

            // Log redaction metadata only (never values)
            if ((sec.logRedactions !== false) && (droppedCount > 0 || redactedCount > 0)) {
              log({ event: 'policy_applied', mode: POLICY.mode, droppedFields: droppedCount, redactedFields: redactedCount });
            }

            return result;
          }

          // ─── Handler ─────────────────────────────────────────────────────────

          exports.handler = async (event) => {
            const start = Date.now();
            const requestId = event.requestContext?.requestId || 'unknown';
            const method = event.requestContext?.http?.method || event.httpMethod;
            const origin = event.headers?.origin || event.headers?.Origin || '';

            if (method === 'OPTIONS') return corsResponse(204, '', origin);

            if (method !== 'POST') {
              log({ requestId, action: 'rejected', reason: 'method_not_allowed' });
              return corsResponse(405, JSON.stringify({ error: 'method_not_allowed' }), origin);
            }

            let body;
            try { body = JSON.parse(event.body || '{}'); } catch {
              log({ requestId, action: 'rejected', reason: 'invalid_json' });
              return corsResponse(400, JSON.stringify({ error: 'invalid_json' }), origin);
            }

            if (!body.workflowId) {
              log({ requestId, action: 'rejected', reason: 'missing_workflow_id' });
              return corsResponse(400, JSON.stringify({ error: 'missing_workflow_id', message: 'workflowId is required' }), origin);
            }

            // Apply capture policy
            const filteredBody = applyPolicy(body);

            try {
              const result = await forwardToVerify(JSON.stringify(filteredBody));
              const duration = Date.now() - start;
              log({ requestId, action: 'forwarded', workflowId: body.workflowId, policyMode: POLICY.mode, statusCode: result.statusCode, durationMs: duration });
              return corsResponse(result.statusCode, result.body, origin);
            } catch (err) {
              const duration = Date.now() - start;
              log({ requestId, action: 'error', workflowId: body.workflowId, errorCode: err.code || 'PROXY_ERROR', durationMs: duration });
              return corsResponse(502, JSON.stringify({ error: 'proxy_error', message: 'Failed to reach Verify API' }), origin);
            }
          };

          // ─── Forward ─────────────────────────────────────────────────────────

          function forwardToVerify(payload) {
            return new Promise((resolve, reject) => {
              const target = new URL(VERIFY_URL + '/decision-records');
              const options = {
                hostname: target.hostname,
                port: 443,
                path: target.pathname,
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'X-Verify-Api-Key': API_KEY,
                  'Content-Length': Buffer.byteLength(payload),
                },
                timeout: 10000,
              };
              const req = https.request(options, (res) => {
                let data = '';
                res.on('data', (chunk) => { data += chunk; });
                res.on('end', () => { resolve({ statusCode: res.statusCode, body: data }); });
              });
              req.on('error', reject);
              req.on('timeout', () => { req.destroy(); reject(new Error('TIMEOUT')); });
              req.write(payload);
              req.end();
            });
          }

          // ─── Utilities ───────────────────────────────────────────────────────

          function corsResponse(statusCode, body, origin) {
            const allowOrigin = ALLOWED_ORIGINS.includes('*') ? '*' : (ALLOWED_ORIGINS.includes(origin) ? origin : ALLOWED_ORIGINS[0]);
            return {
              statusCode,
              headers: { 'Content-Type': 'application/json', 'Access-Control-Allow-Origin': allowOrigin, 'Access-Control-Allow-Methods': 'POST, OPTIONS', 'Access-Control-Allow-Headers': 'Content-Type' },
              body: body || '',
            };
          }

          function log(fields) {
            // SECURITY: Never log payloads, API keys, prompts, responses, or customer data.
            console.log(JSON.stringify({ timestamp: new Date().toISOString(), service: 'verify-capture-proxy', ...fields }));
          }

  # ─── CloudWatch Log Group ────────────────────────────────────────────────────

  ProxyLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/verify-capture-proxy-${EnvironmentName}'
      RetentionInDays: !Ref LogRetentionDays

  # ─── API Gateway (HTTP API) ──────────────────────────────────────────────────

  ProxyHttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub 'verify-capture-proxy-${EnvironmentName}'
      ProtocolType: HTTP
      Description: Customer-owned Verify capture proxy with capture policy engine

  ProxyIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ProxyHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ProxyFunction.Arn
      PayloadFormatVersion: '2.0'

  ProxyRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ProxyHttpApi
      RouteKey: 'POST /decision-records'
      Target: !Sub 'integrations/${ProxyIntegration}'

  ProxyCorsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ProxyHttpApi
      RouteKey: 'OPTIONS /decision-records'
      Target: !Sub 'integrations/${ProxyIntegration}'

  ProxyStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref ProxyHttpApi
      StageName: '$default'
      AutoDeploy: true

  ProxyFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProxyFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ProxyHttpApi}/*'

Outputs:
  ProxyEndpoint:
    Description: Customer-owned capture proxy endpoint URL
    Value: !Sub 'https://${ProxyHttpApi}.execute-api.${AWS::Region}.amazonaws.com/decision-records'

  ProxyFunctionName:
    Description: Lambda function name
    Value: !Ref ProxyFunction

  ProxyFunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt ProxyFunction.Arn

  CaptureMode:
    Description: Active capture policy mode
    Value: !If
      - HasPolicy
      - policy
      - forward_all

Conditions:
  HasPolicy: !Not [!Equals [!Ref CapturePolicyJson, '']]