AWSTemplateFormatVersion: "2010-09-09"
Description: "Amazon Fraud Detector template for streaming data samples."

Parameters:
  FraudDetectorModelArn:
    Description: ARN of Amazon Fraud Detector model to be used in the detector
    Type: String
    Default: <Model ARN here>

Resources:
  # Event Type
  TransactionEventType:
    Type: AWS::FraudDetector::EventType
    Properties:
      Name: 'transaction_event'
      Description: 'Event type representing a transaction to be evaluated for fraud'
      EventVariables:
        - Name: 'transaction_amount'
          DataSource: 'EVENT'
          DataType: 'FLOAT'
          DefaultValue: '0.0'
      Labels:
        - Name: 'fraud'
        - Name: 'legit'
      EntityTypes:
        - Name: 'customer'

  # Outcomes
  BlockOutcome:
    Type: AWS::FraudDetector::Outcome
    Properties:
      Name: 'block'

  InvestigateOutcome:
    Type: AWS::FraudDetector::Outcome
    Properties:
      Name: 'investigate'

  ApproveOutcome:
    Type: AWS::FraudDetector::Outcome
    Properties:
      Name: 'approve'

  # Detector
  TransactionFraudDetector:
    Type: AWS::FraudDetector::Detector
    Properties:
      DetectorId: 'transaction_fraud_detector'
      DetectorVersionStatus: 'ACTIVE'
      RuleExecutionMode: 'FIRST_MATCHED'
      EventType:
        Inline: true
        Name: 'transaction_event'
        Arn: !GetAtt TransactionEventType.Arn
      AssociatedModels:
        - Arn: !Sub "${FraudDetectorModelArn}"
      Rules:
        - RuleId: 'decline_rule'
          DetectorId: 'transaction_fraud_detector'
          Expression: '$transaction_model_insightscore >= 950'
          Language: "DETECTORPL"
          Outcomes:
            - Inline: false
              Name: 'block'
              Arn: !GetAtt BlockOutcome.Arn
        - RuleId: 'friction_rule'
          DetectorId: 'transaction_fraud_detector'
          Expression: '$transaction_model_insightscore >= 855 and $transaction_model_insightscore < 950'
          Language: "DETECTORPL"
          Outcomes:
            - Inline: false
              Name: 'investigate'
              Arn: !GetAtt InvestigateOutcome.Arn
        - RuleId: 'approve_rule'
          DetectorId: 'transaction_fraud_detector'
          Expression: '$transaction_model_insightscore < 855'
          Language: "DETECTORPL"
          Outcomes:
            - Inline: false
              Name: 'approve'
              Arn: !GetAtt ApproveOutcome.Arn
