AWSTemplateFormatVersion: '2010-09-09'
Description: 'Resume Analyzer - Serverless application for resume analysis using AWS AI services'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Environment name for resource naming

Resources:
  # S3 Bucket for Resume Storage
  ResumeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'resume-analyzer-uploads-${AWS::AccountId}-${Environment}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldResumes
            Status: Enabled
            ExpirationInDays: 30
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  # DynamoDB Table for Analysis Results
  AnalysisTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'ResumeAnalysis-${Environment}'
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
      AttributeDefinitions:
        - AttributeName: resumeId
          AttributeType: S
      KeySchema:
        - AttributeName: resumeId
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # SQS Dead Letter Queue
  AnalysisDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'resume-analysis-dlq-${Environment}'
      MessageRetentionPeriod: 1209600  # 14 days
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # SQS Queue for Analysis Processing
  AnalysisQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'resume-analysis-queue-${Environment}'
      VisibilityTimeout: 300  # 5 minutes
      MessageRetentionPeriod: 345600  # 4 days
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AnalysisDLQ.Arn
        maxReceiveCount: 3
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # IAM Role for Upload Lambda
  UploadLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'ResumeAnalyzer-UploadLambda-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: UploadLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub '${ResumeBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt AnalysisQueue.Arn

  # IAM Role for Analysis Lambda
  AnalysisLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'ResumeAnalyzer-AnalysisLambda-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: AnalysisLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub '${ResumeBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - textract:DetectDocumentText
                  - textract:AnalyzeDocument
                Resource: '*'
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: '*'
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource: !GetAtt AnalysisTable.Arn
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt AnalysisQueue.Arn

  # IAM Role for Retrieve Lambda
  RetrieveLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'ResumeAnalyzer-RetrieveLambda-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: RetrieveLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                Resource: !GetAtt AnalysisTable.Arn

  # Upload Lambda Function
  UploadLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'ResumeAnalyzer-Upload-${Environment}'
      Runtime: python3.11
      Handler: handler.lambda_handler
      Role: !GetAtt UploadLambdaRole.Arn
      Code:
        ZipFile: |
          # Placeholder - deploy actual code separately
          def lambda_handler(event, context):
              return {'statusCode': 200, 'body': 'Upload Lambda'}
      Environment:
        Variables:
          S3_BUCKET_NAME: !Ref ResumeBucket
          SQS_QUEUE_URL: !Ref AnalysisQueue
          ENVIRONMENT: !Ref Environment
      Timeout: 30
      MemorySize: 512
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # Analysis Lambda Function
  AnalysisLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'ResumeAnalyzer-Analysis-${Environment}'
      Runtime: python3.11
      Handler: handler.lambda_handler
      Role: !GetAtt AnalysisLambdaRole.Arn
      Code:
        ZipFile: |
          # Placeholder - deploy actual code separately
          def lambda_handler(event, context):
              return {'statusCode': 200, 'body': 'Analysis Lambda'}
      Environment:
        Variables:
          S3_BUCKET_NAME: !Ref ResumeBucket
          DYNAMODB_TABLE_NAME: !Ref AnalysisTable
          BEDROCK_MODEL_ID: anthropic.claude-v2
          ENVIRONMENT: !Ref Environment
      Timeout: 300
      MemorySize: 1024
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # SQS Event Source Mapping for Analysis Lambda
  AnalysisLambdaEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt AnalysisQueue.Arn
      FunctionName: !Ref AnalysisLambda
      BatchSize: 1
      Enabled: true

  # Retrieve Lambda Function
  RetrieveLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'ResumeAnalyzer-Retrieve-${Environment}'
      Runtime: python3.11
      Handler: handler.lambda_handler
      Role: !GetAtt RetrieveLambdaRole.Arn
      Code:
        ZipFile: |
          # Placeholder - deploy actual code separately
          def lambda_handler(event, context):
              return {'statusCode': 200, 'body': 'Retrieve Lambda'}
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref AnalysisTable
          ENVIRONMENT: !Ref Environment
      Timeout: 30
      MemorySize: 256
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # API Gateway REST API
  ResumeAnalyzerAPI:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub 'ResumeAnalyzer-API-${Environment}'
      Description: API for Resume Analyzer application
      EndpointConfiguration:
        Types:
          - REGIONAL

  # API Gateway Resource: /upload-resume
  UploadResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ResumeAnalyzerAPI
      ParentId: !GetAtt ResumeAnalyzerAPI.RootResourceId
      PathPart: upload-resume

  # API Gateway Method: POST /upload-resume
  UploadMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ResumeAnalyzerAPI
      ResourceId: !Ref UploadResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UploadLambda.Arn}/invocations'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true

  # API Gateway Method: OPTIONS /upload-resume (CORS)
  UploadOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ResumeAnalyzerAPI
      ResourceId: !Ref UploadResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: ''
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  # API Gateway Resource: /analysis
  AnalysisResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ResumeAnalyzerAPI
      ParentId: !GetAtt ResumeAnalyzerAPI.RootResourceId
      PathPart: analysis

  # API Gateway Resource: /analysis/{resumeId}
  AnalysisIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref ResumeAnalyzerAPI
      ParentId: !Ref AnalysisResource
      PathPart: '{resumeId}'

  # API Gateway Method: GET /analysis/{resumeId}
  RetrieveMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ResumeAnalyzerAPI
      ResourceId: !Ref AnalysisIdResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${RetrieveLambda.Arn}/invocations'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true

  # API Gateway Method: OPTIONS /analysis/{resumeId} (CORS)
  RetrieveOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ResumeAnalyzerAPI
      ResourceId: !Ref AnalysisIdResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
              method.response.header.Access-Control-Allow-Methods: "'GET,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: ''
        RequestTemplates:
          application/json: '{"statusCode": 200}'
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true

  # Lambda Permission for API Gateway to invoke Upload Lambda
  UploadLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UploadLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ResumeAnalyzerAPI}/*/*'

  # Lambda Permission for API Gateway to invoke Retrieve Lambda
  RetrieveLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RetrieveLambda
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ResumeAnalyzerAPI}/*/*'

  # API Gateway Deployment
  APIDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - UploadMethod
      - UploadOptionsMethod
      - RetrieveMethod
      - RetrieveOptionsMethod
    Properties:
      RestApiId: !Ref ResumeAnalyzerAPI
      StageName: !Ref Environment

Outputs:
  APIEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${ResumeAnalyzerAPI}.execute-api.${AWS::Region}.amazonaws.com/${Environment}'
    Export:
      Name: !Sub '${AWS::StackName}-APIEndpoint'

  ResumeBucketName:
    Description: S3 bucket name for resume uploads
    Value: !Ref ResumeBucket
    Export:
      Name: !Sub '${AWS::StackName}-ResumeBucket'

  AnalysisTableName:
    Description: DynamoDB table name for analysis results
    Value: !Ref AnalysisTable
    Export:
      Name: !Sub '${AWS::StackName}-AnalysisTable'

  AnalysisQueueURL:
    Description: SQS queue URL for analysis processing
    Value: !Ref AnalysisQueue
    Export:
      Name: !Sub '${AWS::StackName}-AnalysisQueue'

  UploadLambdaArn:
    Description: Upload Lambda function ARN
    Value: !GetAtt UploadLambda.Arn
    Export:
      Name: !Sub '${AWS::StackName}-UploadLambda'

  AnalysisLambdaArn:
    Description: Analysis Lambda function ARN
    Value: !GetAtt AnalysisLambda.Arn
    Export:
      Name: !Sub '${AWS::StackName}-AnalysisLambda'

  RetrieveLambdaArn:
    Description: Retrieve Lambda function ARN
    Value: !GetAtt RetrieveLambda.Arn
    Export:
      Name: !Sub '${AWS::StackName}-RetrieveLambda'