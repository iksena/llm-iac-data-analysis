AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  LMI Example - Capacity Provider Stack (Platform Team)
  Provisions the LMI capacity provider and operator role.
  Subnet IDs and security group ID are passed as parameters from the network stack.

Parameters:
  Subnet1:
    Type: AWS::EC2::Subnet::Id
    Description: First subnet ID
  Subnet2:
    Type: String
    Default: ""
    Description: Second subnet ID (leave empty for single-subnet deployment)
  Subnet3:
    Type: String
    Default: ""
    Description: Third subnet ID (leave empty for 1 or 2 subnet deployment)
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group ID from the network stack
  CapacityProviderName:
    Type: String
    Default: lmi-example-cp

Conditions:
  HasSubnet2: !Not [!Equals [!Ref Subnet2, ""]]
  HasSubnet3: !Not [!Equals [!Ref Subnet3, ""]]
  Has1Subnet: !And
    - !Not [!Condition HasSubnet2]
    - !Not [!Condition HasSubnet3]
  Has2Subnets: !And
    - !Condition HasSubnet2
    - !Not [!Condition HasSubnet3]
  Has3Subnets: !And
    - !Condition HasSubnet2
    - !Condition HasSubnet3

Resources:
  OperatorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${CapacityProviderName}-operator-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSLambdaManagedEC2ResourceOperator

  CapacityProvider1Subnet:
    Type: AWS::Serverless::CapacityProvider
    Condition: Has1Subnet
    Properties:
      CapacityProviderName: !Ref CapacityProviderName
      OperatorRole: !GetAtt OperatorRole.Arn
      VpcConfig:
        SubnetIds:
          - !Ref Subnet1
        SecurityGroupIds:
          - !Ref SecurityGroupId
      InstanceRequirements:
        Architectures:
          - arm64
      Tags:
        Stack: lmi-example

  CapacityProvider2Subnets:
    Type: AWS::Serverless::CapacityProvider
    Condition: Has2Subnets
    Properties:
      CapacityProviderName: !Ref CapacityProviderName
      OperatorRole: !GetAtt OperatorRole.Arn
      VpcConfig:
        SubnetIds:
          - !Ref Subnet1
          - !Ref Subnet2
        SecurityGroupIds:
          - !Ref SecurityGroupId
      InstanceRequirements:
        Architectures:
          - arm64
      Tags:
        Stack: lmi-example

  CapacityProvider3Subnets:
    Type: AWS::Serverless::CapacityProvider
    Condition: Has3Subnets
    Properties:
      CapacityProviderName: !Ref CapacityProviderName
      OperatorRole: !GetAtt OperatorRole.Arn
      VpcConfig:
        SubnetIds:
          - !Ref Subnet1
          - !Ref Subnet2
          - !Ref Subnet3
        SecurityGroupIds:
          - !Ref SecurityGroupId
      InstanceRequirements:
        Architectures:
          - arm64
      Tags:
        Stack: lmi-example

Outputs:
  CapacityProviderName:
    Description: Capacity provider name
    Value: !Ref CapacityProviderName
    Export:
      Name: !Sub ${CapacityProviderName}-Name
  CapacityProviderArn:
    Description: Capacity provider ARN
    Value: !If
      - Has1Subnet
      - !GetAtt CapacityProvider1Subnet.Arn
      - !If
        - Has2Subnets
        - !GetAtt CapacityProvider2Subnets.Arn
        - !GetAtt CapacityProvider3Subnets.Arn
    Export:
      Name: !Sub ${CapacityProviderName}-Arn
  OperatorRoleArn:
    Description: Operator role ARN
    Value: !GetAtt OperatorRole.Arn