---
# Bashlinux::Postgres::RDS Security Group
#
#   Cloudformation template to deploy a security group
#   for an RDS cluster exposing the Postgres port
#   on the public subnet
#
#   Manuel F Martinez
#   Bashlinux
#   Los Angeles, CA
#
AWSTemplateFormatVersion: "2010-09-09"
Description: RDS Postgres Security Group template

###############################################################################
Parameters:

  Environment:
    Description: Postgres cluster environment
    Type: String
    MinLength: "1"
    MaxLength: "20"
    Default: staging
    AllowedValues: [ "prod", "staging" ]
    ConstraintDescription: >
      Environment name can only contain "prod" or "staging".

  Organization:
    Description: Organization or Customer name
    Type: String
    MinLength: "1"
    MaxLength: "32"
    Default: bashlinux
    AllowedPattern: "[a-zA-Z0-9\\-]*"
    ConstraintDescription: >
      Name of the organization must contains only letters, numbers and hyphens

###############################################################################
Resources:

  RdsPostgresSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Enable access to the Postgres cluster port
      VpcId: !ImportValue
        "Fn::Sub": "bashlinux-${Environment}-VpcId"
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: "5432"
        ToPort: "5432"
        SourceSecurityGroupId: !ImportValue
          "Fn::Sub": "bashlinux-${Environment}-Ec2BastionSecurityGroupId"
      SecurityGroupEgress:
      - IpProtocol: "-1"
        FromPort: "0"
        ToPort: "65535"
        CidrIp: 0.0.0.0/0
      Tags:
      - Key: Name
        Value: !Sub "${Organization}-${Environment}-postgres-sg"
      - Key: bashlinux:organization-name
        Value: !Ref Organization
      - Key: bashlinux:environment-name
        Value: !Ref Environment
      - Key: bashlinux:application-id
        Value: !Ref AWS::StackName
      - Key: bashlinux:can-delete
        Value: "false"

  ingressRdsProxy:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: "Postgres: Access from the RDS Proxy"
      GroupId: !GetAtt RdsPostgresSecurityGroup.GroupId
      SourceSecurityGroupId: !GetAtt RdsPostgresSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: "5432"
      ToPort: "5432"

###############################################################################
Outputs:

  RdsPostgresSecurityGroupId:
    Description: "SecurityGroup: RDS Postgres Security Group ID"
    Value: !GetAtt RdsPostgresSecurityGroup.GroupId
    Export:
      Name: !Sub "${Organization}-${Environment}-RdsPostgresSecurityGroupId"