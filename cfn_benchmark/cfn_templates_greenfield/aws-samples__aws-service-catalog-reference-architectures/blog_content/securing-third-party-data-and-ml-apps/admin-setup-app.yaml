AWSTemplateFormatVersion: '2010-09-09'
Description: Application stack(fdp-mlmp-adminapp)
Parameters:
  # AWS::EC2::AvailabilityZone::Name params are validated against the actual
  # deploy region -- us-east-2a/2b as defaults meant this always failed
  # immediately (before any resource creation, hence no FAILED resource
  # event) whenever deployed anywhere but us-east-2. This benchmark's own
  # real-AWS check always targets us-east-1 (AWS_REGION in both notebooks),
  # so default to that region's AZs instead.
  RegionAZ1Name:
    Description: Availability Zone 1 Name in Region
    Type: AWS::EC2::AvailabilityZone::Name
    Default: us-east-1a
  RegionAZ2Name:
    Description: Availability Zone 2 Name in Region
    Type: AWS::EC2::AvailabilityZone::Name
    Default: us-east-1b
  VPCCIDR:
    Description: CIDR block for the VPC
    Type: String
    Default: 10.229.0.0/16
    ConstraintDescription: CIDR block parameter must be in the form x.x.x.x/16-28
    AllowedPattern: >-
      ^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/(1[6-9]|2[0-8]))$
  SubnetAPrivateCIDR:
    Description: CIDR block for the private subnet in availability zone
    Type: String
    Default: 10.229.30.0/24
    ConstraintDescription: CIDR block parameter must be in the form x.x.x.x/16-28
    AllowedPattern: >-
      ^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/(1[6-9]|2[0-8]))$
  SubnetBPrivateCIDR:
    Description: CIDR block for the private subnet in availability zone
    Type: String
    Default: 10.229.40.0/24
    ConstraintDescription: CIDR block parameter must be in the form x.x.x.x/16-28
    AllowedPattern: >-
      ^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/(1[6-9]|2[0-8]))$
  EnableVPCFlowLogs:
    Description: Create a Flow logs for the VPC
    Type: String
    Default: true
    ConstraintDescription: ''
    AllowedValues:
      - true
      - false
  Suffix:
    Type: String
    Default: reinforce15
    Description: Unique string for resource naming suffix
Resources:
  # The two CloudFormationProvisionedProduct resources below ("S3 buckets,
  # KMS keys, and IAM roles" / "VPC") assume a Service Catalog portfolio
  # already exists with those exact products published at artifact "v2.1" --
  # normally set up by this same repo's sibling `portfolio.yaml`, deployed
  # as a separate stack in the original multi-stack workshop. Self-contained
  # fix: publish the same two products here, from the same real, public
  # S3 templates `portfolio.yaml` itself points at
  # (https://aws-service-catalog-reference-architectures.s3.amazonaws.com/...),
  # so this template needs no sibling stack and no manual Service Catalog
  # setup in the console.
  AdminPortfolio:
    Type: AWS::ServiceCatalog::Portfolio
    Properties:
      AcceptLanguage: en
      Description: Admin - ML Infrastructure stack
      DisplayName: !Sub 'Admin - ML Infrastructure stack (${Suffix})'
      ProviderName: CCOE
  VPCProductDef:
    Type: 'AWS::ServiceCatalog::CloudFormationProduct'
    Properties:
      Owner: MP Team
      Description: VPC with private subnets and endpoints
      Distributor: MP Team
      SupportEmail: awsmp@example.com
      AcceptLanguage: en
      SupportUrl: 'https://support.com'
      Name: VPC
      ProvisioningArtifactParameters:
        - Description: Base Version
          Info:
            LoadTemplateFromURL: https://aws-service-catalog-reference-architectures.s3.amazonaws.com/blog_content/securing-third-party-data-and-ml-apps/network.yaml
          Name: v2.1
  IAMProductDef:
    Type: 'AWS::ServiceCatalog::CloudFormationProduct'
    Properties:
      Owner: MP Team
      Description: IAM roles, KMS keys, S3 buckets
      Distributor: AWS MP Team
      SupportEmail: awsmp@example.com
      AcceptLanguage: en
      SupportUrl: 'https://support.com'
      Name: S3 buckets, KMS keys, and IAM roles
      ProvisioningArtifactParameters:
        - Description: Base Version
          Info:
            LoadTemplateFromURL: https://aws-service-catalog-reference-architectures.s3.amazonaws.com/blog_content/securing-third-party-data-and-ml-apps/s3_iam_kms.yaml
          Name: v2.1
  VPCLaunchRole:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: !Sub '${Suffix}-VPCLaunchRole'
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: servicecatalog.amazonaws.com
            Action: 'sts:AssumeRole'
      Path: /
      Policies:
        - PolicyName: VPCLaunchPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - ec2:*
                  - logs:*
                  - route53:AssociateVPCWithHostedZone
                Resource: '*'
              - Effect: Allow
                Action:
                  - iam:PassRole
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:TagRole
                  - iam:GetRole
                  - iam:UntagRole
                  - iam:PutRolePolicy
                  - iam:GetRolePolicy
                  - iam:DeleteRolePolicy
                Resource: "arn:aws:iam::*:role/SC*"
              - Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStacks
                  - cloudformation:SetStackPolicy
                  - cloudformation:ValidateTemplate
                  - cloudformation:UpdateStack
                  - cloudformation:GetTemplateSummary
                Resource: '*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: '*'
  IAMLaunchRole:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: !Sub '${Suffix}-IAMLaunchRole'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
        - arn:aws:iam::aws:policy/IAMReadOnlyAccess
        - arn:aws:iam::aws:policy/AWSKeyManagementServicePowerUser
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: servicecatalog.amazonaws.com
            Action: 'sts:AssumeRole'
      Path: /
      Policies:
        - PolicyName: ServiceActionsPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - 'iam:CreatePolicy'
                  - 'iam:DeletePolicy'
                  - 'iam:ModifyPolicy'
                  - 'iam:DeleteRolePolicy'
                  - 'iam:CreateRolePolicy'
                  - iam:DetachRolePolicy
                  - iam:AttachRolePolicy
                  - 'iam:PutRolePolicy'
                  - 'kms:PutKeyPolicy'
                  - 'kms:ScheduleKeyDeletion'
                  - 'kms:EnableKeyRotation'
                Resource: '*'
              - Effect: Allow
                Action:
                  - 'iam:CreateRole'
                  - 'iam:DeleteRole'
                  - 'iam:GetRole'
                  - 'iam:PassRole'
                Resource: "arn:aws:iam::*:role/MLWorkshop-*"
              - Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStacks
                  - cloudformation:SetStackPolicy
                  - cloudformation:ValidateTemplate
                  - cloudformation:UpdateStack
                  - cloudformation:GetTemplateSummary
                Resource: '*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: '*'
  AssociateVPCProduct:
    Type: 'AWS::ServiceCatalog::PortfolioProductAssociation'
    Properties:
      AcceptLanguage: en
      PortfolioId: !Ref AdminPortfolio
      ProductId: !Ref VPCProductDef
  VPCLaunchRoleConstraint:
    Type: 'AWS::ServiceCatalog::LaunchRoleConstraint'
    DependsOn: AssociateVPCProduct
    Properties:
      AcceptLanguage: en
      PortfolioId: !Ref AdminPortfolio
      ProductId: !Ref VPCProductDef
      RoleArn: !GetAtt VPCLaunchRole.Arn
  AssociateIAMProduct:
    Type: 'AWS::ServiceCatalog::PortfolioProductAssociation'
    Properties:
      AcceptLanguage: en
      PortfolioId: !Ref AdminPortfolio
      ProductId: !Ref IAMProductDef
  IAMLaunchRoleConstraint:
    Type: 'AWS::ServiceCatalog::LaunchRoleConstraint'
    DependsOn: AssociateIAMProduct
    Properties:
      AcceptLanguage: en
      PortfolioId: !Ref AdminPortfolio
      ProductId: !Ref IAMProductDef
      RoleArn: !GetAtt IAMLaunchRole.Arn
  SCAdminUser:
    Type: 'AWS::IAM::Role'
    Properties:
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AWSServiceCatalogEndUserFullAccess'
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub '${AWS::AccountId}'
            Action: 'sts:AssumeRole'
      RoleName: !Sub '${Suffix}-service_catalog_lead_end_user'
  AdminPortfolioPrincipalAssociation:
    Type: 'AWS::ServiceCatalog::PortfolioPrincipalAssociation'
    Properties:
      AcceptLanguage: en
      PortfolioId: !Ref AdminPortfolio
      PrincipalARN: !GetAtt SCAdminUser.Arn
      PrincipalType: IAM

  SuffixParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /MLWorkshop/Suffix
      Type: String
      Value: !Ref Suffix
  # ProductName/ProvisioningArtifactName (string lookup) failed with "Product
  # ... does not exist or access was denied" on real AWS even with DependsOn
  # on the LaunchRoleConstraint -- Service Catalog's own indexing of a
  # just-associated product isn't guaranteed to be immediately searchable by
  # name the instant the association API call returns. ProductId/
  # ProvisioningArtifactId reference the product/artifact directly by the ID
  # CloudFormation already resolved when creating them, sidestepping the
  # name-lookup/propagation race entirely.
  S3AndIAMRolesProduct:
    Type: AWS::ServiceCatalog::CloudFormationProvisionedProduct
    DependsOn:
      - IAMLaunchRoleConstraint
    Properties:
      ProductId: !Ref IAMProductDef
      ProvisioningArtifactId: !GetAtt IAMProductDef.ProvisioningArtifactIds
      ProvisioningParameters:
         -
            Key: S3PostfixUnique
            Value: !Ref Suffix
  VPCProduct:
    Type: AWS::ServiceCatalog::CloudFormationProvisionedProduct
    DependsOn:
      - S3AndIAMRolesProduct
      - VPCLaunchRoleConstraint
    Properties:
      ProductId: !Ref VPCProductDef
      ProvisioningArtifactId: !GetAtt VPCProductDef.ProvisioningArtifactIds
      ProvisioningParameters:
         -
            Key: Suffix
            Value: !Ref Suffix
         -
            Key: RegionAZ1Name
            Value: !Ref RegionAZ1Name
         -
            Key: RegionAZ2Name
            Value: !Ref RegionAZ2Name
         -
            Key: VPCCIDR
            Value: !Ref VPCCIDR
         -
            Key: SubnetAPrivateCIDR
            Value: !Ref SubnetAPrivateCIDR
         -
            Key: SubnetBPrivateCIDR
            Value: !Ref SubnetBPrivateCIDR
         -
            Key: EnableVPCFlowLogs
            Value: !Ref EnableVPCFlowLogs
  NotebookInstanceRoleParam:
    Type: AWS::SSM::Parameter
    DependsOn:
      - S3AndIAMRolesProduct
    Properties:
      Name: !Sub /MLWorkshop/NotebookInstanceRole/${Suffix}
      Type: String
      Value: !GetAtt [S3AndIAMRolesProduct, Outputs.NotebookInstanceRole]
  SageMakerRoleParam:
    Type: AWS::SSM::Parameter
    DependsOn:
      - S3AndIAMRolesProduct
    Properties:
      Name: !Sub /MLWorkshop/SageMakerRole/${Suffix}
      Type: String
      Value: !GetAtt [S3AndIAMRolesProduct, Outputs.SageMakerRole]
  GetNewRevisionRoleParam:
    Type: AWS::SSM::Parameter
    DependsOn:
      - S3AndIAMRolesProduct
    Properties:
      Name: !Sub /MLWorkshop/GetNewRevisionRole/${Suffix}
      Type: String
      Value: !GetAtt [S3AndIAMRolesProduct, Outputs.GetNewRevisionRole]
  SubnetAPrivateParam:
    Type: AWS::SSM::Parameter
    DependsOn:
      - VPCProduct
    Properties:
      Name: !Sub /MLWorkshop/SubnetAPrivate/${Suffix}
      Type: String
      Value: !GetAtt [VPCProduct, Outputs.SubnetAPrivate]
  SubnetBPrivateParam:
    Type: AWS::SSM::Parameter
    DependsOn:
      - VPCProduct
    Properties:
      Name: !Sub /MLWorkshop/SubnetBPrivate/${Suffix}
      Type: String
      Value: !GetAtt [VPCProduct, Outputs.SubnetBPrivate]
  S3BucketDataParam:
    Type: AWS::SSM::Parameter
    DependsOn:
      - S3AndIAMRolesProduct
    Properties:
      Name: !Sub /MLWorkshop/S3BucketData/${Suffix}
      Type: String
      Value: !GetAtt [S3AndIAMRolesProduct, Outputs.S3BucketData]
  S3DataCapturePathParam:
    Type: AWS::SSM::Parameter
    DependsOn:
      - S3AndIAMRolesProduct
    Properties:
      Name: !Sub /MLWorkshop/S3DataCapturePath/${Suffix}
      Type: String
      Value: !Join [ "", ['s3://',
        !GetAtt [S3AndIAMRolesProduct, Outputs.S3BucketInfra],
        'data_capture_logs' ]]
  S3BucketInfraParam:
    Type: AWS::SSM::Parameter
    DependsOn:
      - S3AndIAMRolesProduct
    Properties:
      Name: !Sub /MLWorkshop/S3BucketInfra/${Suffix}
      Type: String
      Value: !GetAtt [S3AndIAMRolesProduct, Outputs.S3BucketInfra]
  KMSKeyDataCaptureParam:
    Type: AWS::SSM::Parameter
    DependsOn:
      - S3AndIAMRolesProduct
    Properties:
      Name: !Sub /MLWorkshop/KMSKeyDataCapture/${Suffix}
      Type: String
      Value: !GetAtt [S3AndIAMRolesProduct, Outputs.KMSKeyDataCapture]
  KMSKeyMLStorageParam:
    Type: AWS::SSM::Parameter
    DependsOn:
      - S3AndIAMRolesProduct
    Properties:
      Name: !Sub /MLWorkshop/KMSKeyMLStorage/${Suffix}
      Type: String
      Value: !GetAtt [S3AndIAMRolesProduct, Outputs.KMSKeyMLStorage]
  NotebookSecurityGroupParam:
    Type: AWS::SSM::Parameter
    DependsOn:
      - VPCProduct
    Properties:
      Name: !Sub /MLWorkshop/NotebookSecurityGroup/${Suffix}
      Type: String
      Value: !GetAtt [VPCProduct, Outputs.NotebookInstanceSecurityGroup]
  ModelSecurityGroupParam:
    Type: AWS::SSM::Parameter
    DependsOn:
      - VPCProduct
    Properties:
      Name: !Sub /MLWorkshop/ModelSecurityGroup/${Suffix}
      Type: String
      Value: !GetAtt [VPCProduct, Outputs.ModelSecurityGroup]
Outputs:
  SubnetAPrivate:
    Value: !GetAtt [VPCProduct, Outputs.SubnetAPrivate]
  SubnetBPrivate:
    Value: !GetAtt [VPCProduct, Outputs.SubnetBPrivate]
  SageMakerRole:
    Value: !GetAtt [S3AndIAMRolesProduct, Outputs.SageMakerRole]
  NotebookInstanceRole:
    Value: !GetAtt [S3AndIAMRolesProduct, Outputs.NotebookInstanceRole]
  GetNewRevisionRole:
    Value: !GetAtt [S3AndIAMRolesProduct, Outputs.GetNewRevisionRole]
  S3BucketData:
    Value: !GetAtt [S3AndIAMRolesProduct, Outputs.S3BucketData]
  S3BucketInfra:
    Value: !GetAtt [S3AndIAMRolesProduct, Outputs.S3BucketInfra]
  KMSKeyMLStorage:
    Value: !GetAtt [S3AndIAMRolesProduct, Outputs.KMSKeyMLStorage]
  KMSKeyDataCapture:
    Value: !GetAtt [S3AndIAMRolesProduct, Outputs.KMSKeyDataCapture]