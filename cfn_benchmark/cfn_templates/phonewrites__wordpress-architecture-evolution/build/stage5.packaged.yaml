AWSTemplateFormatVersion: 2010-09-09
Description: WordPress architecture evolution - Stage 5 nested root stack ALB +
  ASG with RDS, EFS and optional Route 53 custom domain
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
    - Label:
        default: Stage 5 configuration
      Parameters:
      - LatestAmiId
    - Label:
        default: Optional custom domain
      Parameters:
      - HostedZoneName
      - HostedZoneId
      - CustomSubdomainName
    ParameterLabels:
      LatestAmiId:
        default: Amazon Linux 2023 AMI
      HostedZoneName:
        default: Route 53 hosted zone name
      HostedZoneId:
        default: Route 53 hosted zone ID
      CustomSubdomainName:
        default: WordPress subdomain
Parameters:
  LatestAmiId:
    Description: Latest Amazon Linux 2023 AMI for greenfield stage 5.
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.18-x86_64
  HostedZoneName:
    Description: Optional Route 53 hosted zone name, for example example.com.
      Leave blank to use the ALB DNS name.
    Type: String
    Default: ''
    AllowedPattern: ^$|^[A-Za-z0-9][A-Za-z0-9.-]*[A-Za-z0-9]$
  HostedZoneId:
    Description: Optional Route 53 hosted zone ID for HostedZoneName, for
      example Z1234567890ABC. Required when using a custom domain.
    Type: String
    Default: ''
    AllowedPattern: ^$|^[A-Z0-9]+$
  CustomSubdomainName:
    Description: Optional single DNS label for WordPress, for example wordpress.
      Leave blank to use the ALB DNS name.
    Type: String
    Default: ''
    AllowedPattern: ^$|^[A-Za-z0-9][A-Za-z0-9-]{0,62}$
Rules:
  CustomDomainAllOrNone:
    Assertions:
    - Assert:
        Fn::Or:
        - Fn::And:
          - Fn::Equals:
            - Ref: HostedZoneName
            - ''
          - Fn::Equals:
            - Ref: HostedZoneId
            - ''
          - Fn::Equals:
            - Ref: CustomSubdomainName
            - ''
        - Fn::And:
          - Fn::Not:
            - Fn::Equals:
              - Ref: HostedZoneName
              - ''
          - Fn::Not:
            - Fn::Equals:
              - Ref: HostedZoneId
              - ''
          - Fn::Not:
            - Fn::Equals:
              - Ref: CustomSubdomainName
              - ''
      AssertDescription: Enter HostedZoneName, HostedZoneId, and
        CustomSubdomainName together, or leave all three blank.
Resources:
  NetworkStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL:
        https://s3.us-east-1.amazonaws.com/cf-templates-xunea76zqzgs-us-east-1/8ec44aebe8ef431e83e1e5cf6c7c66ee.template
  IamStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL:
        https://s3.us-east-1.amazonaws.com/cf-templates-xunea76zqzgs-us-east-1/af54ee4d651d23c5255102a6e7b05139.template
  DatabaseStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL:
        https://s3.us-east-1.amazonaws.com/cf-templates-xunea76zqzgs-us-east-1/d98982c7a944ca0421d6befb3ff4c33f.template
      Parameters:
        RootStackName:
          Ref: AWS::StackName
        VpcId:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.VpcId
        DbSubnetAId:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.DbSubnetAId
        DbSubnetBId:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.DbSubnetBId
        DbSubnetCId:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.DbSubnetCId
  ContentStorageStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL:
        https://s3.us-east-1.amazonaws.com/cf-templates-xunea76zqzgs-us-east-1/f40cb9dd2672012965a6f77bc6a8e44d.template
      Parameters:
        VpcId:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.VpcId
        AppSubnetAId:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.AppSubnetAId
        AppSubnetBId:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.AppSubnetBId
        AppSubnetCId:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.AppSubnetCId
  SharedSsmStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL:
        https://s3.us-east-1.amazonaws.com/cf-templates-xunea76zqzgs-us-east-1/e38468bdf61427428d7a60c7cad79df8.template
      Parameters:
        DBEndpointValue:
          Fn::GetAtt:
          - DatabaseStack
          - Outputs.DBEndpointAddress
        EFSfsidValue:
          Fn::GetAtt:
          - ContentStorageStack
          - Outputs.EfsId
  AlbAsgStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: SharedSsmStack
    Properties:
      TemplateURL:
        https://s3.us-east-1.amazonaws.com/cf-templates-xunea76zqzgs-us-east-1/21796a21f6d0457d490330f4d410a308.template
      Parameters:
        LatestAmiId:
          Ref: LatestAmiId
        VpcId:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.VpcId
        PublicSubnetAId:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.PublicSubnetAId
        PublicSubnetBId:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.PublicSubnetBId
        PublicSubnetCId:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.PublicSubnetCId
        InstanceProfileName:
          Fn::GetAtt:
          - IamStack
          - Outputs.InstanceProfileName
        EfsId:
          Fn::GetAtt:
          - ContentStorageStack
          - Outputs.EfsId
        HostedZoneName:
          Ref: HostedZoneName
        HostedZoneId:
          Ref: HostedZoneId
        CustomSubdomainName:
          Ref: CustomSubdomainName
Outputs:
  WordpressURL:
    Description: Open this URL to verify WordPress.
    Value:
      Fn::GetAtt:
      - AlbAsgStack
      - Outputs.WordpressURL
  AlbDnsName:
    Value:
      Fn::GetAtt:
      - AlbAsgStack
      - Outputs.AlbDnsName
  EfsId:
    Value:
      Fn::GetAtt:
      - ContentStorageStack
      - Outputs.EfsId
  VpcId:
    Value:
      Fn::GetAtt:
      - NetworkStack
      - Outputs.VpcId