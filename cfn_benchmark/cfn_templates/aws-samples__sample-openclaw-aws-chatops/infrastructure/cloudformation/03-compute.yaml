              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: MCPGraphMemPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Security hardening: aws:ResourceAccount restricts to same-account resources only.
