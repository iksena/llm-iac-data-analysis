AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  LMI Blog — Use Case 2: Data Aggregation ETL (SnapStart)

Globals:
  Function:
    CodeUri: target/data-aggregation-1.0.0-SNAPSHOT.jar
    Handler: org.springframework.cloud.function.adapter.aws.FunctionInvoker::handleRequest
    Runtime: java25
    Timeout: 120
    MemorySize: 2048
    Architectures: [x86_64]
    AutoPublishAlias: live
    SnapStart:
      ApplyOn: PublishedVersions
    Environment:
      Variables:
        SENSOR_TABLE_NAME: !Ref SensorTable
        OUTPUT_BUCKET_NAME: !Ref OutputBucket
        MAIN_CLASS: com.aws.lmi.etl.DataAggregationApplication
        JAVA_TOOL_OPTIONS: "-XX:+UseG1GC -XX:MaxGCPauseMillis=100 -Xlog:gc:stderr:time,tags"

Resources:
  AggregationApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Name: lmi-blog-etl-snapstart

  AggregateDataFunction:
    Type: AWS::Serverless::Function
    Properties:
      Environment:
        Variables:
          SPRING_CLOUD_FUNCTION_DEFINITION: dataAggregatorFunction
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SensorTable
        - S3CrudPolicy:
            BucketName: !Ref OutputBucket
      Events:
        PostAggregate:
          Type: Api
          Properties:
            RestApiId: !Ref AggregationApi
            Path: /aggregate
            Method: post

  AggregateDataFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AggregateDataFunction}"
      RetentionInDays: 7

  SensorTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-sensors"
      AttributeDefinitions:
        - AttributeName: deviceId
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: deviceId
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST

  OutputBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-output-${AWS::AccountId}"
      LifecycleConfiguration:
        Rules:
          - Id: Cleanup
            Status: Enabled
            ExpirationInDays: 7

Outputs:
  ApiEndpoint:
    Value: !Sub "https://${AggregationApi}.execute-api.${AWS::Region}.amazonaws.com/prod/aggregate"
  SensorTableName:
    Value: !Ref SensorTable