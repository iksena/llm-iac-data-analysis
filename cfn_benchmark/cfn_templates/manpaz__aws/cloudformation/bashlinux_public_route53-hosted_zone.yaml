---
# Bashlinux::Public::Route53::Hosted Zone
#
#   Cloudformation template to deploy public hosted zone
#
#   Manuel F Martinez
#   Bashlinux
#   Los Angeles, CA
#
AWSTemplateFormatVersion: "2010-09-09"
Description: Route53 Public Hosted Zone template

###############################################################################
Parameters:

  Environment:
    Description: Working environment
    Type: String
    MinLength: "1"
    MaxLength: "20"
    Default: staging
    AllowedValues: [ "prod", "staging" ]
    ConstraintDescription: >
      Environment name can only contain "prod" or "staging"

###############################################################################
Mappings:

  Env2Domains:
    prod:
      Domain: bashlinux.it
    staging:
      Domain: stg.bashlinux.it

###############################################################################
Resources:

  EnvPublicHostedZone:
    Type: AWS::Route53::HostedZone
    Properties:
      HostedZoneConfig:
        Comment: !Sub "Domain in: ${Environment}"
      Name: !FindInMap [ Env2Domains, !Ref Environment, Domain ]
      HostedZoneTags:
      - Key: Name
        Value: !FindInMap [ Env2Domains, !Ref Environment, Domain ]
      - Key: bashlinux:environment-name
        Value: !Ref Environment
      - Key: bashlinux:application-id
        Value: !Ref AWS::StackName
      - Key: bashlinux:can-delete
        Value: "false"
      - Key: bashlinux:network-visibility
        Value: public

###############################################################################
Outputs:

  EnvPublicHostedZoneId:
    Description: "Route53: Hosted Zone ID"
    Value: !Ref EnvPublicHostedZone
    Export:
      Name: !Sub "bashlinux-${Environment}-PublicHostedZoneId"