Description: |
  This stack will create different event bus policies and a CloudWatch Alarm for monitoring events

Parameters:
  OrganizationId:
    Type: String

Resources:
  # An event bus policy that allows the organization to put events into the default bus
  OrganizationEventBusPolicy:
    Type: AWS::Events::EventBusPolicy
    Properties:
      StatementId: OrganizationalPut
      Statement:
        Effect: Allow
        Principal: "*"
        Action: events:PutEvents
        Resource: !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/default"
        Condition:
          StringEquals:
            "aws:PrincipalOrgID": !Ref OrganizationId

  # An event bus policy that allows the account to put events
  OneAccountEventBusPolicy:
    Type: AWS::Events::EventBusPolicy
    Properties:
      StatementId: OneAccountPut
      Statement:
        Effect: Allow
        Principal:
          AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
        Action: events:PutEvents
        Resource: !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/default"

  # Create a custom event bus
  CustomEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: OrganizationalEventBus

  # An event bus policy that allows the organization to put events into a custom event bus
  OrganizationEventBusPolicyCustomBus:
    Type: AWS::Events::EventBusPolicy
    Properties:
      EventBusName: !Ref CustomEventBus
      StatementId: OrganizationalPutCustomBus
      Statement:
        Effect: Allow
        Principal: "*"
        Action: events:PutEvents
        Resource: !GetAtt CustomEventBus.Arn
        Condition:
          StringEquals:
            "aws:PrincipalOrgID": !Ref OrganizationId

  # CloudWatch Alarm to monitor the number of events on the custom event bus
  CustomEventBusAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: CustomEventBusAlarm
      ComparisonOperator: GreaterThanOrEqualToThreshold
      EvaluationPeriods: 1
      MetricName: NumberOfEvents
      Namespace: AWS/Events
      Period: 300
      Statistic: Sum
      Threshold: 10
      ActionsEnabled: true
      AlarmActions:
        - !Ref AlarmTopic
      Dimensions:
        - Name: EventBusName
          Value: !Ref CustomEventBus

  # SNS Topic for alarm notifications
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties: {}