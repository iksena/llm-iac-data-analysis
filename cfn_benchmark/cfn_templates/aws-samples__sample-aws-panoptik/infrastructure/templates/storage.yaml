AWSTemplateFormatVersion: "2010-09-09"
Description: "Panoptik — ElastiCache Redis + DynamoDB accounts table"

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
  PrivateSubnetA:
    Type: String
  PrivateSubnetB:
    Type: String
  RedisSecurityGroupId:
    Type: String

Resources:
  # Redis Subnet Group
  RedisSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      CacheSubnetGroupName: !Sub "panoptik-${EnvironmentName}-redis"
      Description: "Redis subnet group for Panoptik"
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB

  # ElastiCache Redis (ReplicationGroup for TLS support)
  RedisReplicationGroup:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      ReplicationGroupId: !Sub "panoptik-${EnvironmentName}"
      ReplicationGroupDescription: !Sub "Panoptik ${EnvironmentName} Redis"
      Engine: redis
      EngineVersion: "7.1"
      CacheNodeType: cache.t3.micro
      NumCacheClusters: 1
      CacheSubnetGroupName: !Ref RedisSubnetGroup
      SecurityGroupIds:
        - !Ref RedisSecurityGroupId
      TransitEncryptionEnabled: true
      AtRestEncryptionEnabled: true
      AutomaticFailoverEnabled: false
      Tags:
        - Key: Name
          Value: !Sub "panoptik-${EnvironmentName}-redis"

  # DynamoDB Table
  AccountsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "panoptik-${EnvironmentName}-accounts"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: accountId
          AttributeType: S
      KeySchema:
        - AttributeName: accountId
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Name
          Value: !Sub "panoptik-${EnvironmentName}-accounts"

  AnnotationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub "panoptik-${EnvironmentName}-annotations"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: resourceArn
          AttributeType: S
        - AttributeName: sortKey
          AttributeType: S
      KeySchema:
        - AttributeName: resourceArn
          KeyType: HASH
        - AttributeName: sortKey
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Name
          Value: !Sub "panoptik-${EnvironmentName}-annotations"

  SavedViewsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub "panoptik-${EnvironmentName}-saved-views"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: viewId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: viewId
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Name
          Value: !Sub "panoptik-${EnvironmentName}-saved-views"

Outputs:
  RedisEndpoint:
    Value: !GetAtt RedisReplicationGroup.PrimaryEndPoint.Address
    Export:
      Name: !Sub "panoptik-${EnvironmentName}-redis-endpoint"
  RedisPort:
    Value: !GetAtt RedisReplicationGroup.PrimaryEndPoint.Port
  AccountsTableName:
    Value: !Ref AccountsTable
    Export:
      Name: !Sub "panoptik-${EnvironmentName}-accounts-table"
  AccountsTableArn:
    Value: !GetAtt AccountsTable.Arn
  AnnotationsTableName:
    Value: !Ref AnnotationsTable
  AnnotationsTableArn:
    Value: !GetAtt AnnotationsTable.Arn
  SavedViewsTableName:
    Value: !Ref SavedViewsTable
  SavedViewsTableArn:
    Value: !GetAtt SavedViewsTable.Arn