AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: |
  DVA-C02 Lab 1.1 — Hello SAM
  Single Lambda function deployed via SAM.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 256
    Tracing: Active
    Architectures:
      - x86_64
    LoggingConfig:
      LogFormat: JSON
      ApplicationLogLevel: INFO
      SystemLogLevel: WARN

Resources:
  HelloFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dva-lab-01-01-hello
      CodeUri: src/
      Handler: app.handler
      Description: First Lambda function — DVA-C02 lab 1.1
      Environment:
        Variables:
          GREETING: hello
      # Explicit log group so we control retention
      # Without this, Lambda creates one on first invoke with no retention (= forever, = $$)
      LoggingConfig:
        LogGroup: !Ref HelloFunctionLogGroup

  HelloFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/dva-lab-01-01-hello
      RetentionInDays: 7

Outputs:
  FunctionName:
    Description: Lambda function name
    Value: !Ref HelloFunction
    Export:
      Name: !Sub '${AWS::StackName}-FunctionName'
  FunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt HelloFunction.Arn
  FunctionRoleArn:
    Description: Auto-created execution role
    Value: !GetAtt HelloFunctionRole.Arn