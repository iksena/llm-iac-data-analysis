          GOOGLE_CLIENT_ID: !Ref GoogleClientId
          GOOGLE_CLIENT_SECRET: !Ref GoogleClientSecret
          GOOGLE_REDIRECT_URI: !Ref GoogleRedirectUri
          GOOGLE_TOKENS_TABLE: !Ref GoogleTokensTable
          FRONTEND_BASE_URL: !Ref FrontendBaseUrl
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref GoogleTokensTable }
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref GoogleCalendarApi
            Path: /calendar/callback
            Method: GET
            # Note: No Auth required - this is a Google OAuth callback

  GoogleCalendarSync:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Handler: google_calendar.sync_handler
      CodeUri: google_calendar_functions
      Timeout: 60
      Environment:
        Variables:
          APPOINTMENTS_TABLE: !Ref AppointmentsTable
          CALENDAR_SYNC_TABLE: !Ref CalendarSyncTable
          GOOGLE_TOKENS_TABLE: !Ref GoogleTokensTable
          GOOGLE_CLIENT_ID: !Ref GoogleClientId
          GOOGLE_CLIENT_SECRET: !Ref GoogleClientSecret
          GOOGLE_REDIRECT_URI: !Ref GoogleRedirectUri
          CONFIGS_TABLE: !Ref ConfigsTable
      Policies:
