# 6)  Stripe Payment Functions
##############################################################################

  StripeWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Handler: stripe_webhook.handler
      CodeUri: .
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          STRIPE_SECRET_KEY: !Ref StripeSecretKey
          STRIPE_WEBHOOK_SECRET: !Ref StripeWebhookSecret
          SUBSCRIPTIONS_TABLE: !Ref SubscriptionsTable
          CONFIGS_TABLE: !Ref ConfigsTable
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref SubscriptionsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ConfigsTable }
      Events:
        StripeWebhook:
          Type: Api
          Properties:
            RestApiId: !Ref AppPublicApi
            Path: /stripe/webhook
            Method: POST

  SubscriptionManagementFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Handler: subscription_management.handler
      CodeUri: .
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          STRIPE_SECRET_KEY: !Ref StripeSecretKey
          STRIPE_MONTHLY_PRICE_ID: !Ref StripeMonthlyPriceId
          STRIPE_ANNUAL_PRICE_ID: !Ref StripeAnnualPriceId
          SUBSCRIPTIONS_TABLE: !Ref SubscriptionsTable
          CONFIGS_TABLE: !Ref ConfigsTable
          FRONTEND_URL: !Ref FrontendBaseUrl
          COGNITO_USER_POOL_ID: !Ref ExistingUserPoolId
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref SubscriptionsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ConfigsTable }
      Events:
        CreateCheckout:
          Type: HttpApi
          Properties:
            ApiId: !Ref WorkerHttpApi
            Path: /api/subscription/create-checkout
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
        GetStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref WorkerHttpApi
            Path: /api/subscription/status
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
        CreatePortal:
          Type: HttpApi
          Properties:
            ApiId: !Ref WorkerHttpApi
            Path: /api/subscription/portal
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
        StartTrial:
          Type: HttpApi
          Properties:
            ApiId: !Ref WorkerHttpApi
            Path: /api/subscription/start-trial
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

##############################################################################
# 7)  Outputs
##############################################################################

  # Evolution API Auto-Restart Function
  EvolutionRestartFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Handler: evolution_restart.handler
      CodeUri: .
      Timeout: 30
      Environment:
        Variables:
          ECS_CLUSTER: evolution-postgres-cluster
          ECS_SERVICE: evolution-postgres-service-v2
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ecs:UpdateService
                - ecs:DescribeServices
              Resource: !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:service/evolution-postgres-cluster/evolution-postgres-service-v2"
      Events:
        ScheduledRestart:
          Type: Schedule
          Properties:
            Schedule: cron(0 6 * * ? *)
            Description: Restart Evolution API daily at 6 AM UTC to maintain stability
            Enabled: true

Outputs:
  AdminApiUrl:
    Description: Cognito-protected HTTP API
    Value: !Sub "https://${WorkerHttpApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"

  GoogleCalendarApiUrl:
    Description: Google Calendar API endpoint
    Value: !Sub "https://${GoogleCalendarApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"

  PublicApiUrl:
    Description: Public REST API (API-Key required)
    Value: !Sub "https://${AppPublicApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"

  PublicApiKey:
    Description: API key for /public/* endpoints
    Value: !Ref AppPublicApiKey

  WhatsAppWebhookUrl:
    Description: Clean WhatsApp webhook endpoint URL (ACTIVE)
    Value: !Sub "https://${WhatsAppInApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/ww"

  LegacyWhatsAppWebhookUrl:
    Description: Legacy WhatsApp webhook endpoint URL (backward compatibility)
    Value: !Sub "https://${WhatsAppInApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/whatsapp-webhook"

  SQSQueueUrl:
    Description: Global SQS FIFO queue URL for WhatsApp message processing
    Value: !Ref WhatsAppMainQueue

  SQSQueueArn:
    Description: Global SQS FIFO queue ARN for WhatsApp message processing
    Value: !GetAtt WhatsAppMainQueue.Arn