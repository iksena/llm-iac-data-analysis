AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Lab 7.2 — Parameter Store hierarchy + SecureString + Advanced tier

Resources:
  DbHost:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /dva/lab-07/database/host
      Type: String
      Value: db.example.internal
      Tier: Standard

  DbPort:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /dva/lab-07/database/port
      Type: String
      Value: "5432"
      Tier: Standard

  DbName:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /dva/lab-07/database/name
      Type: String
      Value: appdb
      Tier: Standard

  # SecureString — CloudFormation can't create SecureString directly.
  # Use a custom resource that calls ssm:PutParameter on stack create.
  # For lab simplicity, use a pre-shared SecureString set via aws CLI.
  # We'll create a placeholder String parameter here and document the
  # CLI step in the README. The reader Lambda treats both transparently.
  ApiKey:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /dva/lab-07/api-key
      Type: String
      Value: "REPLACE_VIA_CLI_PutParameter_TYPE_SecureString"
      Tier: Standard
      Description: Replace this with a SecureString via aws ssm put-parameter (see README Step 2)

  # Advanced tier — this one costs $0.05/month
  Version:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /dva/lab-07/version
      Type: String
      Value: "1.0.0"
      Tier: Advanced
      Description: Advanced tier parameter (supports policies, larger values)

  ReaderRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ReadParams
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/dva/lab-07/*
              # SecureString decryption with AWS-managed key
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !Sub arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/aws/ssm

  Reader:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dva-lab-07-02-reader
      Runtime: python3.12
      Handler: handler.handler
      Role: !GetAtt ReaderRole.Arn
      CodeUri: src/
      Timeout: 10

Outputs:
  ReaderFunctionName:
    Value: !Ref Reader