AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  A complete containerised web service - network, registry, cluster, load
  balancer, TLS, DNS, autoscaling service and alarms - from one parameter set.
  The 80% path for Go, Rust, Java, .NET, Node, Python, GraphQL and REST APIs.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Identity
        Parameters:
          - NamePrefix
          - Environment
      - Label:
          default: The application
        Parameters:
          - ImageUri
          - ContainerPort
          - HealthCheckPath
      - Label:
          default: Public address
        Parameters:
          - HostedZoneId
          - DomainName
      - Label:
          default: Sizing and scaling
        Parameters:
          - Cpu
          - Memory
          - MinCapacity
          - MaxCapacity
          - TargetRequestsPerTask
      - Label:
          default: Network
        Parameters:
          - VpcCidr
          - AvailabilityZoneCount
          - NatGatewayMode
      - Label:
          default: Operations
        Parameters:
          - AlarmEmail
          - LogRetentionDays

Parameters:
  NamePrefix:
    Type: String
    Description: >-
      Prefix for every resource in the stack. Must be unique per account and
      region.
    AllowedPattern: "^[a-z][a-z0-9-]{1,30}[a-z0-9]$"
    ConstraintDescription: 3-32 lowercase characters, digits and hyphens.

  Environment:
    Type: String
    Description: Environment this stack deploys.
    Default: dev
    AllowedValues: [dev, staging, prod]

  ImageUri:
    Type: String
    Description: >-
      Container image to run, tagged with a commit SHA. On the very first deploy
      the ECR repository this stack creates is empty, so point this at a public
      placeholder image, push your own, then update. See the README.

  ContainerPort:
    Type: Number
    Description: Port the application listens on. Injected as PORT.
    Default: 8080
    MinValue: 1
    MaxValue: 65535

  HealthCheckPath:
    Type: String
    Description: >-
      Path returning 200 when the application is ready to serve. It must not
      depend on a database - a health check that fails when a dependency is slow
      turns a degradation into an outage by removing every target.
    Default: /healthz

  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Route 53 zone for the certificate and the alias record.

  DomainName:
    Type: String
    Description: >-
      Public hostname, e.g. api.example.com. Must be inside HostedZoneId, or the
      certificate never validates and the deploy hangs.
    AllowedPattern: "^([a-z0-9]([a-z0-9-]*[a-z0-9])?\\.)+[a-z]{2,}$"

  Cpu:
    Type: String
    Description: Fargate CPU units per task (1024 = 1 vCPU).
    Default: "512"
    AllowedValues: ["256", "512", "1024", "2048", "4096"]

  Memory:
    Type: String
    Description: Memory per task in MiB. Must be a legal pairing with Cpu.
    Default: "1024"

  MinCapacity:
    Type: Number
    Description: Autoscaling floor. Two survives a task replacement without reaching zero.
    Default: 2
    MinValue: 1
    MaxValue: 100

  MaxCapacity:
    Type: Number
    Description: Autoscaling ceiling, and your cost cap under a traffic spike.
    Default: 10
    MinValue: 1
    MaxValue: 1000

  TargetRequestsPerTask:
    Type: Number
    Description: >-
      Requests per minute per task the scaler holds. This is the best signal for
      a latency-sensitive HTTP service. 0 falls back to CPU-only scaling.
    Default: 500
    MinValue: 0
    MaxValue: 1000000

  VpcCidr:
    Type: String
    Description: IPv4 range for the VPC this stack creates.
    Default: 10.0.0.0/16
    AllowedPattern: "^(\\d{1,3}\\.){3}\\d{1,3}/(1[6-9]|2[0-4])$"

  AvailabilityZoneCount:
    Type: String
    Description: AZs to spread across. Three in prod.
    Default: "2"
    AllowedValues: ["2", "3"]

  NatGatewayMode:
    Type: String
    Description: >-
      Egress posture for the private subnets. See foundation/vpc - this is the
      largest fixed cost in the stack.
    Default: single
    AllowedValues: [none, single, per-az]

  AlarmEmail:
    Type: String
    Description: >-
      Address that receives alarms. The subscription must be confirmed by
      clicking the link in the email; until then the alarms are silent.
    Default: ""

  LogRetentionDays:
    Type: Number
    Description: Retention for the application log group.
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1827, 3653]

Resources:
  # Every child is a template from templates/. Nothing is defined inline: a
  # resource that exists only inside a stack is one nobody can reuse, and it
  # escapes the per-template test suites entirely.
  Network:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../../templates/foundation/vpc/template.yaml
      Parameters:
        NamePrefix: !Ref NamePrefix
        Environment: !Ref Environment
        VpcCidr: !Ref VpcCidr
        AvailabilityZoneCount: !Ref AvailabilityZoneCount
        NatGatewayMode: !Ref NatGatewayMode

  Registry:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../../templates/containers/ecr-repository/template.yaml
      Parameters:
        NamePrefix: !Ref NamePrefix
        RepositorySuffix: app

  Cluster:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../../templates/containers/ecs-cluster/template.yaml
      Parameters:
        NamePrefix: !Ref NamePrefix
        Environment: !Ref Environment
        VpcId: !GetAtt Network.Outputs.VpcId

  Certificate:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../../templates/networking/acm-certificate/template.yaml
      Parameters:
        NamePrefix: !Ref NamePrefix
        Environment: !Ref Environment
        DomainName: !Ref DomainName
        HostedZoneId: !Ref HostedZoneId

  LoadBalancer:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../../templates/containers/alb/template.yaml
      Parameters:
        NamePrefix: !Ref NamePrefix
        Environment: !Ref Environment
        VpcId: !GetAtt Network.Outputs.VpcId
        SubnetIds: !GetAtt Network.Outputs.PublicSubnetIds
        CertificateArn: !GetAtt Certificate.Outputs.CertificateArn
        Scheme: internet-facing

  Service:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../../templates/containers/fargate-service/template.yaml
      Parameters:
        NamePrefix: !Ref NamePrefix
        Environment: !Ref Environment
        ServiceSuffix: app
        ClusterName: !GetAtt Cluster.Outputs.ClusterName
        VpcId: !GetAtt Network.Outputs.VpcId
        # Tasks run in private subnets; only the load balancer is public.
        SubnetIds: !GetAtt Network.Outputs.PrivateSubnetIds
        ImageUri: !Ref ImageUri
        ContainerPort: !Ref ContainerPort
        Cpu: !Ref Cpu
        Memory: !Ref Memory
        ListenerArn: !GetAtt LoadBalancer.Outputs.ListenerArn
        LoadBalancerFullName: !GetAtt LoadBalancer.Outputs.LoadBalancerFullName
        AlbSecurityGroupId: !GetAtt LoadBalancer.Outputs.SecurityGroupId
        HostHeader: !Ref DomainName
        HealthCheckPath: !Ref HealthCheckPath
        DesiredCount: !Ref MinCapacity
        MinCapacity: !Ref MinCapacity
        MaxCapacity: !Ref MaxCapacity
        TargetRequestsPerTask: !Ref TargetRequestsPerTask
        LogRetentionDays: !Ref LogRetentionDays

  Dns:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../../templates/networking/dns-records/template.yaml
      Parameters:
        NamePrefix: !Ref NamePrefix
        Environment: !Ref Environment
        HostedZoneId: !Ref HostedZoneId
        RecordName: !Ref DomainName
        RecordType: A
        AliasTargetDnsName: !GetAtt LoadBalancer.Outputs.LoadBalancerDnsName
        AliasTargetHostedZoneId: !GetAtt LoadBalancer.Outputs.LoadBalancerHostedZoneId

  AlarmTopic:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../../templates/messaging/sns-topic/template.yaml
      Parameters:
        NamePrefix: !Ref NamePrefix
        Environment: !Ref Environment
        TopicSuffix: alarms
        EmailEndpoint: !Ref AlarmEmail

  Alarms:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../../templates/observability/service-alarms/template.yaml
      Parameters:
        NamePrefix: !Ref NamePrefix
        Environment: !Ref Environment
        ServiceSuffix: app
        AlarmTopicArn: !GetAtt AlarmTopic.Outputs.TopicArn
        LoadBalancerFullName: !GetAtt LoadBalancer.Outputs.LoadBalancerFullName
        TargetGroupFullName: !GetAtt Service.Outputs.TargetGroupFullName
        EcsClusterName: !GetAtt Cluster.Outputs.ClusterName
        EcsServiceName: !GetAtt Service.Outputs.ServiceName

Outputs:
  ServiceUrl:
    Description: Public URL of the service.
    Value: !Sub "https://${DomainName}"

  RepositoryUri:
    Description: ECR repository to push the application image to.
    Value: !GetAtt Registry.Outputs.RepositoryUri

  ClusterName:
    Description: ECS cluster, for `aws ecs execute-command` and the console.
    Value: !GetAtt Cluster.Outputs.ClusterName

  ServiceName:
    Description: ECS service name.
    Value: !GetAtt Service.Outputs.ServiceName

  TaskRoleArn:
    Description: >-
      Task role - the identity the application runs as. Attach a managed policy
      here to give it access to tables, buckets and queues.
    Value: !GetAtt Service.Outputs.TaskRoleArn

  TaskSecurityGroupId:
    Description: >-
      Security group the tasks run with. Pass it to a database stack as the
      client security group.
    Value: !GetAtt Service.Outputs.TaskSecurityGroupId

  VpcId:
    Description: VPC created by this stack, for adding databases or caches.
    Value: !GetAtt Network.Outputs.VpcId

  PrivateSubnetIds:
    Description: Private subnets, for a database or cache stack.
    Value: !GetAtt Network.Outputs.PrivateSubnetIds

  LogGroupName:
    Description: Application log group.
    Value: !GetAtt Service.Outputs.LogGroupName

  AlarmTopicArn:
    Description: Topic the alarms notify.
    Value: !GetAtt AlarmTopic.Outputs.TopicArn