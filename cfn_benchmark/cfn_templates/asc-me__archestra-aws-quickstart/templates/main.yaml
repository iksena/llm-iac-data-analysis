AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Archestra AWS Quickstart — Root stack orchestrating VPC, EKS, RDS,
  and optional modules (Secrets Manager, Bedrock IAM, Observability).
  Deploys and configures the Archestra Helm chart automatically.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Deployment Configuration
        Parameters:
          - DeploymentSize
          - ArchestraVersion
          - DomainName
          - CertificateArn
      - Label:
          default: Admin Credentials
        Parameters:
          - AdminEmail
          - AdminPassword
      - Label:
          default: Optional Modules
        Parameters:
          - EnableSecretsManager
          - EnableBedrockAccess
          - EnableObservability
      - Label:
          default: Advanced
        Parameters:
          - KubernetesVersion
          - VpcCidr
          - TemplatesBucketUrl

Parameters:
  DeploymentSize:
    Type: String
    Default: Medium
    AllowedValues: [XSmall, Small, Medium, Large]
    Description: >
      XSmall (up to 10 users), Small (up to 50 users), Medium (50-500 users), Large (500+ users).
      Controls EKS node count/type, RDS instance class, and Archestra replica count.

  ArchestraVersion:
    Type: String
    Default: latest
    Description: Archestra platform version (Docker image tag / Helm chart version)

  DomainName:
    Type: String
    Description: Domain for Archestra frontend (e.g., archestra.corp.example.com)
    AllowedPattern: "^[a-zA-Z0-9][a-zA-Z0-9\\-.]+[a-zA-Z0-9]$"

  CertificateArn:
    Type: String
    Description: ACM certificate ARN for TLS on the ALB
    AllowedPattern: "^arn:aws:acm:.*"

  AdminEmail:
    Type: String
    Default: admin@localhost.ai
    Description: Initial administrator email address

  AdminPassword:
    Type: String
    NoEcho: true
    MinLength: 12
    Description: Initial administrator password (min 12 characters)

  EnableSecretsManager:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Provision AWS Secrets Manager for credential storage

  EnableBedrockAccess:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Provision IAM roles for Amazon Bedrock access via IRSA

  EnableObservability:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Provision Amazon Managed Prometheus, Grafana, and ADOT Collector

  KubernetesVersion:
    Type: String
    Default: "1.31"
    AllowedValues: ["1.29", "1.30", "1.31"]

  VpcCidr:
    Type: String
    Default: "10.0.0.0/16"

  TemplatesBucketUrl:
    Type: String
    Description: S3 URL where nested templates are stored (set by deploy.sh)

Conditions:
  CreateSecretsManager: !Equals [!Ref EnableSecretsManager, "true"]
  CreateBedrockIAM: !Equals [!Ref EnableBedrockAccess, "true"]
  CreateObservability: !Equals [!Ref EnableObservability, "true"]

Resources:
  # ---------- Core: VPC ----------
  VpcStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "${TemplatesBucketUrl}/vpc.yaml"
      Parameters:
        EnvironmentName: !Ref AWS::StackName
        DeploymentSize: !Ref DeploymentSize
        VpcCidr: !Ref VpcCidr

  # ---------- Core: RDS ----------
  RdsStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: VpcStack
    Properties:
      TemplateURL: !Sub "${TemplatesBucketUrl}/rds.yaml"
      Parameters:
        EnvironmentName: !Ref AWS::StackName
        DeploymentSize: !Ref DeploymentSize
        VpcId: !GetAtt VpcStack.Outputs.VpcId
        IsolatedSubnetIds: !GetAtt VpcStack.Outputs.IsolatedSubnetIds
        RdsSecurityGroupId: !GetAtt VpcStack.Outputs.RdsSecurityGroupId
        EksNodeSecurityGroupId: !GetAtt VpcStack.Outputs.EksNodeSecurityGroupId

  # ---------- Core: EKS ----------
  EksStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: VpcStack
    Properties:
      TemplateURL: !Sub "${TemplatesBucketUrl}/eks.yaml"
      Parameters:
        EnvironmentName: !Ref AWS::StackName
        DeploymentSize: !Ref DeploymentSize
        VpcId: !GetAtt VpcStack.Outputs.VpcId
        PrivateSubnetIds: !GetAtt VpcStack.Outputs.PrivateSubnetIds
        EksNodeSecurityGroupId: !GetAtt VpcStack.Outputs.EksNodeSecurityGroupId
        KubernetesVersion: !Ref KubernetesVersion

  # ---------- Optional: Secrets Manager ----------
  SecretsManagerStack:
    Type: AWS::CloudFormation::Stack
    Condition: CreateSecretsManager
    DependsOn: RdsStack
    Properties:
      TemplateURL: !Sub "${TemplatesBucketUrl}/secrets-manager.yaml"
      Parameters:
        EnvironmentName: !Ref AWS::StackName
        AdminEmail: !Ref AdminEmail
        AdminPassword: !Ref AdminPassword
        DatabaseUrlSecretArn: !GetAtt RdsStack.Outputs.DatabaseUrlSecretArn
        ArchestraServiceAccountRoleArn: !GetAtt EksStack.Outputs.ArchestraServiceAccountRoleArn

  # ---------- Optional: Bedrock IAM ----------
  BedrockIamStack:
    Type: AWS::CloudFormation::Stack
    Condition: CreateBedrockIAM
    DependsOn: EksStack
    Properties:
      TemplateURL: !Sub "${TemplatesBucketUrl}/bedrock-iam.yaml"
      Parameters:
        EnvironmentName: !Ref AWS::StackName
        ArchestraServiceAccountRoleArn: !GetAtt EksStack.Outputs.ArchestraServiceAccountRoleArn

  # ---------- Optional: Observability ----------
  ObservabilityStack:
    Type: AWS::CloudFormation::Stack
    Condition: CreateObservability
    DependsOn: EksStack
    Properties:
      TemplateURL: !Sub "${TemplatesBucketUrl}/observability.yaml"
      Parameters:
        EnvironmentName: !Ref AWS::StackName

  # ---------- Helm Installer ----------
  HelmInstallerStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - EksStack
      - RdsStack
    Properties:
      TemplateURL: !Sub "${TemplatesBucketUrl}/helm-installer.yaml"
      Parameters:
        EnvironmentName: !Ref AWS::StackName
        DeploymentSize: !Ref DeploymentSize
        ArchestraVersion: !Ref ArchestraVersion
        ClusterName: !GetAtt EksStack.Outputs.ClusterName
        DomainName: !Ref DomainName
        CertificateArn: !Ref CertificateArn
        AdminEmail: !Ref AdminEmail
        AdminPassword: !Ref AdminPassword
        DatabaseUrlSecretArn: !GetAtt RdsStack.Outputs.DatabaseUrlSecretArn
        ArchestraServiceAccountRoleArn: !GetAtt EksStack.Outputs.ArchestraServiceAccountRoleArn
        LbControllerRoleArn: !GetAtt EksStack.Outputs.LbControllerRoleArn
        VpcId: !GetAtt VpcStack.Outputs.VpcId
        PrivateSubnetIds: !GetAtt VpcStack.Outputs.PrivateSubnetIds
        EnableBedrockAccess: !Ref EnableBedrockAccess
        EnableObservability: !Ref EnableObservability
        OtelEndpoint: !If
          - CreateObservability
          - !GetAtt ObservabilityStack.Outputs.AdotCollectorEndpoint
          - ""

Outputs:
  FrontendUrl:
    Description: Archestra frontend URL
    Value: !Sub "https://${DomainName}"

  ApiUrl:
    Description: Archestra API URL
    Value: !Sub "https://${DomainName}/api"

  EksClusterName:
    Description: EKS cluster name
    Value: !GetAtt EksStack.Outputs.ClusterName

  KubeconfigCommand:
    Description: Command to configure kubectl
    Value: !GetAtt EksStack.Outputs.KubeconfigCommand

  RdsEndpoint:
    Description: RDS PostgreSQL endpoint
    Value: !GetAtt RdsStack.Outputs.RdsEndpoint

  DeploymentSize:
    Description: Selected deployment tier
    Value: !Ref DeploymentSize