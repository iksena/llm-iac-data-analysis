AWSTemplateFormatVersion: '2010-09-09'
Description: |
  KALIQ IAM Workloads Stack (Stack F)
  - IRSA roles for Kubernetes service accounts
  - Reference: docs/infrastructure/STACKS.md

Parameters:
  Project:
    Type: String
    Default: kaliq
    Description: Project name

  Env:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]
    Description: Environment name

  # Kubernetes namespace and service account for ingest workload
  Namespace:
    Type: String
    Default: kaliq
    Description: Kubernetes namespace for workload service accounts

  IngestServiceAccountName:
    Type: String
    Default: ingest
    Description: Kubernetes service account name for ingest jobs

  NormalizerServiceAccountName:
    Type: String
    Default: normalizer
    Description: Kubernetes service account name for normalizer jobs

  DatasetCardServiceAccountName:
    Type: String
    Default: dataset-card
    Description: Kubernetes service account name for dataset-card jobs

  IndexerServiceAccountName:
    Type: String
    Default: indexer
    Description: Kubernetes service account name for indexer jobs

  KaliqApiServiceAccountName:
    Type: String
    Default: kaliq-api
    Description: Kubernetes service account name for kaliq-api pods

  # EKS OIDC configuration (passed from deploy workflow)
  OidcProviderArn:
    Type: String
    Description: ARN of the EKS OIDC provider (from eks stack)

  OidcIssuerHostPath:
    Type: String
    Description: OIDC issuer host/path without https:// (from eks stack)

  BedrockEmbeddingModelId:
    Type: String
    Default: amazon.titan-embed-text-v2:0
    Description: Bedrock embedding model ID allowed for indexer and API

  BedrockGenerationModelId:
    Type: String
    Default: amazon.nova-lite-v1:0
    Description: Bedrock generation model ID allowed for API

Resources:
  # IRSA role for ingest workload
  # Runs as Kubernetes Job: fetches climate data, writes to S3 raw bucket, records metadata in DynamoDB
  IngestRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Project}-${Env}-irsa-ingest"
      AssumeRolePolicyDocument:
        Fn::Sub:
          - |
            {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Principal": {
                    "Federated": "${OidcProviderArn}"
                  },
                  "Action": "sts:AssumeRoleWithWebIdentity",
                  "Condition": {
                    "StringEquals": {
                      "${OidcHost}:sub": "system:serviceaccount:${Namespace}:${IngestServiceAccountName}",
                      "${OidcHost}:aud": "sts.amazonaws.com"
                    }
                  }
                }
              ]
            }
          - OidcHost: !Ref OidcIssuerHostPath
      Policies:
        - PolicyName: kaliq-ingest-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # DynamoDB metadata table: read/write for ingestion records
              - Sid: DynamoMetadataAccess
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource:
                  - !Sub
                    - "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}"
                    - TableName:
                        Fn::ImportValue: !Sub "${Project}-${Env}-MetadataTableName"
                  - !Sub
                    - "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}/index/*"
                    - TableName:
                        Fn::ImportValue: !Sub "${Project}-${Env}-MetadataTableName"

              # S3 raw bucket: read source data (if re-processing) and write ingested data
              - Sid: RawBucketList
                Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  Fn::Sub:
                    - "arn:aws:s3:::${BucketName}"
                    - BucketName:
                        Fn::ImportValue: !Sub "${Project}-${Env}-RawBucketName"

              - Sid: RawBucketObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  Fn::Sub:
                    - "arn:aws:s3:::${BucketName}/*"
                    - BucketName:
                        Fn::ImportValue: !Sub "${Project}-${Env}-RawBucketName"
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Env
          Value: !Ref Env

  # IRSA role for normalizer workload
  # Runs as Kubernetes Job: reads raw CSV from S3, writes normalized text to artifacts, records lineage in DynamoDB
  NormalizerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Project}-${Env}-irsa-normalizer"
      AssumeRolePolicyDocument:
        Fn::Sub:
          - |
            {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Principal": {
                    "Federated": "${OidcProviderArn}"
                  },
                  "Action": "sts:AssumeRoleWithWebIdentity",
                  "Condition": {
                    "StringEquals": {
                      "${OidcHost}:sub": "system:serviceaccount:${Namespace}:${NormalizerServiceAccountName}",
                      "${OidcHost}:aud": "sts.amazonaws.com"
                    }
                  }
                }
              ]
            }
          - OidcHost: !Ref OidcIssuerHostPath
      Policies:
        - PolicyName: kaliq-normalizer-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DynamoNormalizationAccess
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource:
                  - !Sub
                    - "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}"
                    - TableName:
                        Fn::ImportValue: !Sub "${Project}-${Env}-MetadataTableName"

              - Sid: RawBucketReadObject
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  Fn::Sub:
                    - "arn:${AWS::Partition}:s3:::${BucketName}/*"
                    - BucketName:
                        Fn::ImportValue: !Sub "${Project}-${Env}-RawBucketName"

              - Sid: ArtifactsBucketWriteObject
                Effect: Allow
                Action:
                  - s3:PutObject
                Resource:
                  Fn::Sub:
                    - "arn:${AWS::Partition}:s3:::${BucketName}/*"
                    - BucketName:
                        Fn::ImportValue: !Sub "${Project}-${Env}-ArtifactsBucketName"
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Env
          Value: !Ref Env

  # IRSA role for dataset-card workload
  # Runs as Kubernetes Job: reads raw/normalized artifacts, writes dataset card artifact, and records metadata in DynamoDB
  DatasetCardRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Project}-${Env}-irsa-dataset-card"
      AssumeRolePolicyDocument:
        Fn::Sub:
          - |
            {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Principal": {
                    "Federated": "${OidcProviderArn}"
                  },
                  "Action": "sts:AssumeRoleWithWebIdentity",
                  "Condition": {
                    "StringEquals": {
                      "${OidcHost}:sub": "system:serviceaccount:${Namespace}:${DatasetCardServiceAccountName}",
                      "${OidcHost}:aud": "sts.amazonaws.com"
                    }
                  }
                }
              ]
            }
          - OidcHost: !Ref OidcIssuerHostPath
      Policies:
        - PolicyName: kaliq-dataset-card-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DynamoDatasetCardAccess
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                Resource:
                  - !Sub
                    - "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}"
                    - TableName:
                        Fn::ImportValue: !Sub "${Project}-${Env}-MetadataTableName"

              - Sid: RawBucketReadObject
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  Fn::Sub:
                    - "arn:${AWS::Partition}:s3:::${BucketName}/*"
                    - BucketName:
                        Fn::ImportValue: !Sub "${Project}-${Env}-RawBucketName"

              - Sid: ArtifactsBucketReadWriteObject
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource:
                  Fn::Sub:
                    - "arn:${AWS::Partition}:s3:::${BucketName}/*"
                    - BucketName:
                        Fn::ImportValue: !Sub "${Project}-${Env}-ArtifactsBucketName"
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Env
          Value: !Ref Env

  # IRSA role for indexer workload
  # Runs as Kubernetes Job: reads dataset card artifact, generates embeddings, stores chunk rows in DynamoDB
  IndexerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Project}-${Env}-irsa-indexer"
      AssumeRolePolicyDocument:
        Fn::Sub:
          - |
            {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Principal": {
                    "Federated": "${OidcProviderArn}"
                  },
                  "Action": "sts:AssumeRoleWithWebIdentity",
                  "Condition": {
                    "StringEquals": {
                      "${OidcHost}:sub": "system:serviceaccount:${Namespace}:${IndexerServiceAccountName}",
                      "${OidcHost}:aud": "sts.amazonaws.com"
                    }
                  }
                }
              ]
            }
          - OidcHost: !Ref OidcIssuerHostPath
      Policies:
        - PolicyName: kaliq-indexer-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DynamoIndexerAccess
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                Resource:
                  - !Sub
                    - "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}"
                    - TableName:
                        Fn::ImportValue: !Sub "${Project}-${Env}-MetadataTableName"

              - Sid: ArtifactsBucketReadObject
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  Fn::Sub:
                    - "arn:${AWS::Partition}:s3:::${BucketName}/*"
                    - BucketName:
                        Fn::ImportValue: !Sub "${Project}-${Env}-ArtifactsBucketName"

              - Sid: BedrockEmbeddingAccess
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${BedrockEmbeddingModelId}"
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Env
          Value: !Ref Env

  # IRSA role for kaliq-api workload
  # Runs as Kubernetes Deployment: retrieves dataset-card embeddings from DynamoDB and calls Bedrock for chat responses
  KaliqApiRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Project}-${Env}-irsa-kaliq-api"
      AssumeRolePolicyDocument:
        Fn::Sub:
          - |
            {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Principal": {
                    "Federated": "${OidcProviderArn}"
                  },
                  "Action": "sts:AssumeRoleWithWebIdentity",
                  "Condition": {
                    "StringEquals": {
                      "${OidcHost}:sub": "system:serviceaccount:${Namespace}:${KaliqApiServiceAccountName}",
                      "${OidcHost}:aud": "sts.amazonaws.com"
                    }
                  }
                }
              ]
            }
          - OidcHost: !Ref OidcIssuerHostPath
      Policies:
        - PolicyName: kaliq-api-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DynamoChatAccess
                Effect: Allow
                Action:
                  - dynamodb:Query
                Resource:
                  - !Sub
                    - "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}"
                    - TableName:
                        Fn::ImportValue: !Sub "${Project}-${Env}-MetadataTableName"

              - Sid: BedrockChatAccess
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${BedrockEmbeddingModelId}"
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${BedrockGenerationModelId}"
      Tags:
        - Key: Project
          Value: !Ref Project
        - Key: Env
          Value: !Ref Env

Outputs:
  IngestRoleArn:
    Description: IAM role ARN for ingest service account
    Value: !GetAtt IngestRole.Arn
    Export:
      Name: !Sub "${Project}-${Env}-iam-workloads-IngestRoleArn"

  NormalizerRoleArn:
    Description: IAM role ARN for normalizer service account
    Value: !GetAtt NormalizerRole.Arn
    Export:
      Name: !Sub "${Project}-${Env}-iam-workloads-NormalizerRoleArn"

  DatasetCardRoleArn:
    Description: IAM role ARN for dataset-card service account
    Value: !GetAtt DatasetCardRole.Arn
    Export:
      Name: !Sub "${Project}-${Env}-iam-workloads-DatasetCardRoleArn"

  IndexerRoleArn:
    Description: IAM role ARN for indexer service account
    Value: !GetAtt IndexerRole.Arn
    Export:
      Name: !Sub "${Project}-${Env}-iam-workloads-IndexerRoleArn"

  KaliqApiRoleArn:
    Description: IAM role ARN for kaliq-api service account
    Value: !GetAtt KaliqApiRole.Arn
    Export:
      Name: !Sub "${Project}-${Env}-iam-workloads-KaliqApiRoleArn"

  Namespace:
    Description: Kubernetes namespace for workload service accounts
    Value: !Ref Namespace
    Export:
      Name: !Sub "${Project}-${Env}-iam-workloads-Namespace"

  IngestServiceAccountName:
    Description: Kubernetes service account name for ingest workload
    Value: !Ref IngestServiceAccountName
    Export:
      Name: !Sub "${Project}-${Env}-iam-workloads-IngestServiceAccountName"

  NormalizerServiceAccountName:
    Description: Kubernetes service account name for normalizer workload
    Value: !Ref NormalizerServiceAccountName
    Export:
      Name: !Sub "${Project}-${Env}-iam-workloads-NormalizerServiceAccountName"

  DatasetCardServiceAccountName:
    Description: Kubernetes service account name for dataset-card workload
    Value: !Ref DatasetCardServiceAccountName
    Export:
      Name: !Sub "${Project}-${Env}-iam-workloads-DatasetCardServiceAccountName"

  IndexerServiceAccountName:
    Description: Kubernetes service account name for indexer workload
    Value: !Ref IndexerServiceAccountName
    Export:
      Name: !Sub "${Project}-${Env}-iam-workloads-IndexerServiceAccountName"

  KaliqApiServiceAccountName:
    Description: Kubernetes service account name for kaliq-api workload
    Value: !Ref KaliqApiServiceAccountName
    Export:
      Name: !Sub "${Project}-${Env}-iam-workloads-KaliqApiServiceAccountName"