AWSTemplateFormatVersion: 2010-09-09
Description: CloudFormation template for a self-contained SageMaker Domain in VPC Only mode with a test user profile and dedicated IAM execution role.
Parameters:
  DomainName:
    Type: String
    Description: Name of the SageMaker Domain
    MinLength: 1
    MaxLength: 63
    AllowedPattern: ^[a-zA-Z0-9](-*[a-zA-Z0-9]){0,62}$
  TestUserName:
    Type: String
    Description: Name of the test user profile
    MinLength: 1
    MaxLength: 63
    AllowedPattern: ^[a-zA-Z0-9](-*[a-zA-Z0-9]){0,62}$
  DefaultS3BucketArn:
    Type: String
    Description: ARN of the default S3 bucket used by the SageMaker Domain
    AllowedPattern: ^arn:(aws|aws-cn|aws-us-gov):s3:::[a-z0-9.-]{3,63}$
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID for the SageMaker Domain
  SubnetIds:
    Type: CommaDelimitedList
    Description: Comma-separated list of subnet IDs for the SageMaker Domain
  SecurityGroupIds:
    Type: CommaDelimitedList
    Description: Comma-separated list of security group IDs for the SageMaker Domain
Resources:
  SageMakerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${DomainName}-execution-role
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - sagemaker.amazonaws.com
            Action:
              - sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSageMakerFullAccess
      Policies:
        - PolicyName: SageMakerCustomPermissions
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - sagemaker:AddTags
                  - sagemaker:AssociateTrialComponent
                  - sagemaker:BatchDescribeModelPackage
                  - sagemaker:CreateAction
                  - sagemaker:CreateAlgorithm
                  - sagemaker:CreateApp
                  - sagemaker:CreateAppImageConfig
                  - sagemaker:CreateArtifact
                  - sagemaker:CreateAutoMLJob
                  - sagemaker:CreateAutoMLJobV2
                  - sagemaker:CreateCodeRepository
                  - sagemaker:CreateCompilationJob
                  - sagemaker:CreateContext
                  - sagemaker:CreateDataQualityJobDefinition
                  - sagemaker:CreateDeviceFleet
                  - sagemaker:CreateDomain
                  - sagemaker:CreateEdgePackagingJob
                  - sagemaker:CreateEndpoint
                  - sagemaker:CreateEndpointConfig
                  - sagemaker:CreateExperiment
                  - sagemaker:CreateFeatureGroup
                  - sagemaker:CreateFlowDefinition
                  - sagemaker:CreateHub
                  - sagemaker:CreateHumanTaskUi
                  - sagemaker:CreateHyperParameterTuningJob
                  - sagemaker:CreateImage
