AWSTemplateFormatVersion: '2010-09-09'
Description: 'StackSet template for AccessKeyManagementRole in target accounts'

Parameters:
  ManagementAccountId:
    Type: String
    Description: 'AWS Account ID of the management account where Step Functions is deployed'
    AllowedPattern: '[0-9]{12}'
    ConstraintDescription: 'Must be a valid 12-digit AWS Account ID'

  StepFunctionsExecutionRoleName:
    Type: String
    Default: 'StepFunctionsAccessKeyManagementRole'
    Description: 'Name of the Step Functions execution role in the management account'

  AccessKeyManagementRoleName:
    Type: String
    Default: 'AccessKeyManagementRole'
    Description: 'Name for the AccessKeyManagementRole in target accounts'

  OrganizationId:
    Type: String
    Description: 'AWS Organization ID to restrict cross-account access (e.g., o-1234567890)'
    AllowedPattern: '^o-[a-z0-9]{10}$'
    ConstraintDescription: 'Must be a valid AWS Organization ID starting with o- followed by 10 alphanumeric characters'

Conditions:
  IsSameAccount: !Equals [!Ref 'AWS::AccountId', !Ref ManagementAccountId]

Resources:
  # Cross-account role for access key management
  AccessKeyManagementRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref AccessKeyManagementRoleName
      Description: 'Role for Step Functions to manage IAM access keys in target accounts'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: !If
          - IsSameAccount
          - - Effect: Allow
              Principal:
                AWS: !Sub 'arn:aws:iam::${ManagementAccountId}:role/${StepFunctionsExecutionRoleName}'
              Action: sts:AssumeRole
              Condition:
                StringEquals:
                  'aws:PrincipalOrgID': !Ref OrganizationId
            - Effect: Allow
              Principal:
                AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:role/${StepFunctionsExecutionRoleName}'
              Action: sts:AssumeRole
              Condition:
                StringEquals:
                  'aws:PrincipalOrgID': !Ref OrganizationId
          - - Effect: Allow
              Principal:
                AWS: !Sub 'arn:aws:iam::${ManagementAccountId}:role/${StepFunctionsExecutionRoleName}'
              Action: sts:AssumeRole
              Condition:
                StringEquals:
                  'aws:PrincipalOrgID': !Ref OrganizationId
      Policies:
        - PolicyName: AccessKeyManagementPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - iam:UpdateAccessKey
                  - iam:DeleteAccessKey
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:user/*'
              - Effect: Allow
                Action:
                  - iam:GetUser
                  - iam:ListAccessKeys
                Resource:
                  - !Sub 'arn:aws:iam::${AWS::AccountId}:user/*'
      Tags:
        - Key: Purpose
          Value: 'AccessKeyManagement'
        - Key: ManagedBy
          Value: 'StepFunctions'
        - Key: ManagementAccount
          Value: !Ref ManagementAccountId

Outputs:
  AccessKeyManagementRoleArn:
    Description: 'ARN of the AccessKeyManagementRole'
    Value: !GetAtt AccessKeyManagementRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-AccessKeyManagementRoleArn'

  AccessKeyManagementRoleName:
    Description: 'Name of the AccessKeyManagementRole'
    Value: !Ref AccessKeyManagementRoleName
    Export:
      Name: !Sub '${AWS::StackName}-AccessKeyManagementRoleName'

  TrustedPrincipal:
    Description: 'ARN of the trusted principal (Step Functions execution role)'
    Value: !Sub 'arn:aws:iam::${ManagementAccountId}:role/${StepFunctionsExecutionRoleName}'
    Export:
      Name: !Sub '${AWS::StackName}-TrustedPrincipal'