Parameters:
  HubAccountId:
    Type: String
    Description: The AWS Account ID that should be allowed to assume the cross-account role
  LLMProxyCrossAccountRoleName:
    Type: String
    Description: The name of the cross-account role to create for use by LLM Proxy
    Default: LLMProxyCrossAcctRole
  VPCCidr:
    Type: String
    Default: 10.1.0.0/16
    Description: CIDR block for the VPC
  PublicSubnet1CIDR:
    Type: String
    Default: "10.1.1.0/24"
  PublicSubnet2CIDR:
    Type: String
    Default: "10.1.2.0/24"
  PrivateSubnet1CIDR:
    Type: String
    Default: "10.1.3.0/24"
  PrivateSubnet2CIDR:
    Type: String
    Default: "10.1.4.0/24"
  AvailabilityZoneIds:
    Type: CommaDelimitedList
    Default: "use1-az2,use1-az4"
    Description: Must match Hub stack AZs

Resources:

## LLM Proxy Cross Account Role Resources ##
  CrossAccountRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref LLMProxyCrossAccountRoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS:
                !Sub 'arn:aws:iam::${HubAccountId}:root'
            Action:
              - 'sts:AssumeRole'
      ManagedPolicyArns:
        - !Ref CrossAccountRolePolicy

  CrossAccountRolePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - 'sagemaker:InvokeEndpoint'
            Resource: '*'

  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VPCCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      InstanceTenancy: default
      Tags:
        - Key: Name
          Value: Tenant2-VPC

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZoneId: !Select [0, !Ref AvailabilityZoneIds]
      CidrBlock: !Ref PublicSubnet1CIDR
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: PublicSubnet1

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZoneId: !Select [1, !Ref AvailabilityZoneIds]
      CidrBlock: !Ref PublicSubnet2CIDR
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: PublicSubnet2

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnet1CIDR
      AvailabilityZoneId: !Select [0, !Ref AvailabilityZoneIds]
      Tags:
        - Key: Name
          Value: PrivateSubnet1

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnet2CIDR
      AvailabilityZoneId: !Select [1, !Ref AvailabilityZoneIds]
      Tags:
        - Key: Name
          Value: PrivateSubnet2

  RouteTablePrivate:
    Type: 'AWS::EC2::RouteTable'
    Properties:
      VpcId: !Ref VPC
      Tags:
      - Key: Name
        Value: 'Private Subnet RT'

  RouteTableAssociation1Private:
    Type: 'AWS::EC2::SubnetRouteTableAssociation'
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref RouteTablePrivate

  RouteTableAssociation2Private:
    Type: 'AWS::EC2::SubnetRouteTableAssociation'
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref RouteTablePrivate

  NatGatewayEIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatGatewayEIP.AllocationId
      SubnetId: !Ref PublicSubnet1

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref RouteTablePrivate
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  RouteTablePublic:
    Type: 'AWS::EC2::RouteTable'
    Properties:
      VpcId: !Ref VPC
      Tags:
      - Key: Name
        Value: 'Public Subnet RT'

  RouteTableAssociation1Public:
    Type: 'AWS::EC2::SubnetRouteTableAssociation'
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref RouteTablePublic

  RouteTableAssociation2Public:
    Type: 'AWS::EC2::SubnetRouteTableAssociation'
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref RouteTablePublic

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: MyInternetGateway

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref VPC

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref RouteTablePublic
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

## VPC Endpoint Resources ##
  VPCEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: 'Security group for VPC Endpoint'
      VpcId: !Ref 'VPC'
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VPCCidr
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref VPCCidr

  # Enhanced IAM Role for SageMaker Notebook Instance
  SageMakerNotebookRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: sagemaker.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSageMakerFullAccess
        - arn:aws:iam::aws:policy/AWSCloudFormationReadOnlyAccess
      Policies:
        - PolicyName: JumpStartAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sagemaker:CreateModel
                  - sagemaker:CreateEndpointConfig
                  - sagemaker:CreateEndpoint
                  - sagemaker:DeleteModel
                  - sagemaker:DeleteEndpointConfig
                  - sagemaker:DeleteEndpoint
                  - sagemaker:DescribeModel
                  - sagemaker:DescribeEndpointConfig
                  - sagemaker:DescribeEndpoint
                Resource: !Sub 'arn:aws:sagemaker:${AWS::Region}:${AWS::AccountId}:*'
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource: '*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - 'arn:aws:s3:::jumpstart-cache-prod-*'
                  - 'arn:aws:s3:::sagemaker-*'

  # Additional VPC Endpoints needed for Git and model deployment
  GitVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      ServiceName: !Sub com.amazonaws.${AWS::Region}.git-codecommit
      VpcId: !Ref VPC
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup

  # Security Group for SageMaker Notebook Instance
  NotebookSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for SageMaker Notebook Instance
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VPCCidr
      Tags:
        - Key: Name
          Value: sagemaker-notebook-sg

  # Update the Notebook Instance configuration to include Git integration
  NotebookInstance:
    Type: AWS::SageMaker::NotebookInstance
    Properties:
      NotebookInstanceName: !Sub ${AWS::StackName}-notebook
      InstanceType: ml.t3.medium
      RoleArn: !GetAtt SageMakerNotebookRole.Arn
      SubnetId: !Ref PrivateSubnet1
      SecurityGroupIds:
        - !Ref NotebookSecurityGroup
      DirectInternetAccess: Disabled
      RootAccess: Enabled
      VolumeSizeInGB: 50
      #DefaultCodeRepository: https://github.com/nikhilpenmetsa/genai-secure-networking-arch-patterns  # Replace with your repository URL

Outputs:
  CrossAccountRoleArn:
    Value: !GetAtt CrossAccountRole.Arn
    Description: The ARN of the cross-account role for use by LLM Proxy

  CrossAccountRoleName:
    Value: !Ref LLMProxyCrossAccountRoleName
    Description: The Name of the cross-account role for use by LLM Proxy

  PrivateSubnet1Id:
    Description: "ID of Private Subnet 1"
    Value: !Ref PrivateSubnet1
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnet1Id"

  PrivateSubnet2Id:
    Description: "ID of Private Subnet 2"
    Value: !Ref PrivateSubnet2
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnet2Id"

  VpcId:
    Description: "ID of the VPC"
    Value: !Ref VPC
    Export:
      Name: !Sub "${AWS::StackName}-VpcId"

  VPCEndpointSecurityGroupId:
    Description: "ID of the VPC Endpoint Security Group"
    Value: !Ref VPCEndpointSecurityGroup
  # SSMSessionManagerURL:
  #   Description: Session Manager URL to connect to Client App EC2
  #   Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/systems-manager/session-manager/${ClientAppEC2Instance}?region=${AWS::Region}"