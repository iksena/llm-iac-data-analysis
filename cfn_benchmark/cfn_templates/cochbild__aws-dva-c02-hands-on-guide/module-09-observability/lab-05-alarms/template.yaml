AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Lab 9.5 — Lambda + CloudWatch metric alarm + composite alarm + SNS

Parameters:
  EmailAddress:
    Type: String
    Description: Email to receive alarm notifications

Resources:
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: dva-lab-09-05-alarms
      Subscription:
        - Endpoint: !Ref EmailAddress
          Protocol: email

  ErrorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  ErrorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dva-lab-09-05-error-source
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt ErrorRole.Arn
      Timeout: 5
      InlineCode: |
        def handler(event, context):
            if event.get("fail"):
                raise Exception("intentional error for alarm demo")
            return {"ok": True}

  HighErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: dva-lab-09-05-high-errors
      AlarmDescription: Lambda errors > 5 in 2 consecutive 60s windows
      Namespace: AWS/Lambda
      MetricName: Errors
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: FunctionName
          Value: !Ref ErrorFunction
      AlarmActions: [!Ref AlarmTopic]

  HighLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: dva-lab-09-05-high-latency
      AlarmDescription: Lambda p99 latency > 5000ms
      Namespace: AWS/Lambda
      MetricName: Duration
      ExtendedStatistic: p99
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 5000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: FunctionName
          Value: !Ref ErrorFunction
      AlarmActions: [!Ref AlarmTopic]

  CompositeIncidentAlarm:
    Type: AWS::CloudWatch::CompositeAlarm
    Properties:
      AlarmName: dva-lab-09-05-composite
      AlarmDescription: Both errors AND latency are high — likely a real incident
      AlarmRule: !Sub "(ALARM(${HighErrorsAlarm}) AND ALARM(${HighLatencyAlarm}))"
      AlarmActions: [!Ref AlarmTopic]

Outputs:
  FunctionName:
    Value: !Ref ErrorFunction
  TopicArn:
    Value: !Ref AlarmTopic