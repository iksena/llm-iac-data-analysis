AWSTemplateFormatVersion: "2010-09-09"
Description: "ECR Stack for Apache Yunikorn Image and Chart"

Parameters:
  ProjectName:
    Description: An environment name that is prefixed to resource names
    Type: String
    Default: yunikorn-emr-eks

  ECRRepoName:
    Description: Name of the ECR repository for Apache Yunikorn Image and Chart
    Type: String
    Default: "yunikorn"

  CommonKMSKeyArn:
    Description: ARN of the KMS key used for encryption
    Type: String

Resources:
  YunikornRepository:
    Type: AWS::ECR::Repository
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: "Explicit name is required for ECR repository identification and integration with other systems"
      checkov:
        skip:
          - id: CKV_AWS_51
            comment: "Image tag mutability is required for the educational purposes for the blog post"
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      RepositoryName: !Ref ECRRepoName
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: MUTABLE
      EncryptionConfiguration:
        EncryptionType: KMS
        KmsKey: !Ref CommonKMSKeyArn
      Tags:
        - Key: ProjectName
          Value: !Ref ProjectName

Outputs:
  YunikornRepositoryName:
    Description: Name of the ECR repository
    Value: !Ref YunikornRepository

  YunikornRepositoryUri:
    Description: URI of the Apache Yunikorn ECR repository
    Value: !GetAtt YunikornRepository.RepositoryUri