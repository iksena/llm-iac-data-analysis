AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Lab 5.4 — Source queue with DLQ; consumer Lambda with poison-message simulator

Resources:
  Dlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: dva-lab-05-04-dlq
      MessageRetentionPeriod: 1209600   # 14 days

  SourceQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: dva-lab-05-04-source
      VisibilityTimeout: 30
      MessageRetentionPeriod: 86400
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt Dlq.Arn
        maxReceiveCount: 3

  ConsumerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SqsConsume
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt SourceQueue.Arn

  Consumer:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dva-lab-05-04-consumer
      Runtime: python3.12
      Handler: handler.handler
      Role: !GetAtt ConsumerRole.Arn
      CodeUri: src/
      Timeout: 10

  Esm:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt SourceQueue.Arn
      FunctionName: !Ref Consumer
      BatchSize: 1
      Enabled: true

Outputs:
  SourceQueueUrl:
    Value: !Ref SourceQueue
  SourceQueueArn:
    Value: !GetAtt SourceQueue.Arn
  DlqUrl:
    Value: !Ref Dlq
  DlqArn:
    Value: !GetAtt Dlq.Arn