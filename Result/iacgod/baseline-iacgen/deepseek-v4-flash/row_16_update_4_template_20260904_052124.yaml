AWSTemplateFormatVersion: "2010-09-09"
Description: "StudyBuddy Cognito Authentication Infrastructure"

Parameters:
  FrontendDomainName:
    Type: String
    Description: "The domain name of the StudyBuddy frontend application"
    AllowedPattern: "^[a-zA-Z0-9.-]+$"
    Default: "studybuddytest.example.com"
  CognitoDomainPrefix:
    Type: String
    Description: "Globally unique prefix for the Cognito Hosted UI domain"
    AllowedPattern: "^[a-z0-9-]+$"
    Default: "studybuddytestprefix"

Resources:
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: LambdaUserPoolAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:AdminUpdateUserAttributes
                  - cognito-idp:AdminGetUser
                Resource: !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*"

  PostAuthFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ZipFile: |
          import json
          import logging
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          def handler(event, context):
              logger.info(f"Post authentication event: {json.dumps(event)}")
              return event
      Description: "StudyBuddy post-authentication trigger"
      Environment:
        Variables:
          FUNCTION_NAME: PostAuthFunction

  PostConfirmationFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ZipFile: |
          import json
          import logging
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          def handler(event, context):
              logger.info(f"Post confirmation event: {json.dumps(event)}")
              return event
      Description: "StudyBuddy post-confirmation trigger"
      Environment:
        Variables:
          FUNCTION_NAME: PostConfirmationFunction

  PreSignUpFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ZipFile: |
          import json
          import logging
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          def handler(event, context):
              logger.info(f"Pre sign-up event: {json.dumps(event)}")
              event['response']['autoConfirmUser'] = True
              event['response']['autoVerifyEmail'] = True
              return event
      Description: "StudyBuddy pre-sign-up trigger"
      Environment:
        Variables:
          FUNCTION_NAME: PreSignUpFunction

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: StudyBuddyUserPool
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Schema:
        - Name: email
          Required: true
          Mutable: true
          AttributeDataType: String
        - Name: given_name
          Required: true
          Mutable: true
          AttributeDataType: String
        - Name: family_name
          Required: true
          Mutable: true
          AttributeDataType: String
      LambdaConfig:
        PostAuthentication: !GetAtt PostAuthFunction.Arn
        PostConfirmation: !GetAtt PostConfirmationFunction.Arn
        PreSignUp: !GetAtt PreSignUpFunction.Arn
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true
          TemporaryPasswordValidityDays: 7
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      MfaConfiguration: "OFF"
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref UserPool

  GoogleClientIdSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: studybuddy-google-client-id
      Description: "Google OAuth client ID for StudyBuddy Cognito integration"
      GenerateSecretString:
        SecretStringTemplate: '{"google_client_id": "PLACEHOLDER_CLIENT_ID"}'
        GenerateStringKey: "random_string"
        ExcludePunctuation: true
      Tags:
        - Key: Application
          Value: StudyBuddy

  GoogleClientSecretSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: studybuddy-google-client-secret
      Description: "Google OAuth client secret for StudyBuddy Cognito integration"
      GenerateSecretString:
        SecretStringTemplate: '{"google_client_secret": "PLACEHOLDER_CLIENT_SECRET"}'
        GenerateStringKey: "random_string"
        ExcludePunctuation: true
      Tags:
        - Key: Application
          Value: StudyBuddy

  GoogleIdProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      ProviderName: Google
      ProviderType: Google
      UserPoolId: !Ref UserPool
      AttributeMapping:
        email: email
        given_name: given_name
        family_name: family_name
      ProviderDetails:
        client_id: !Sub "{{resolve:secretsmanager:${GoogleClientIdSecret}:SecretString:google_client_id}}"
        client_secret: !Sub "{{resolve:secretsmanager:${GoogleClientSecretSecret}:SecretString:google_client_secret}}"
        authorize_scopes: "profile email openid"

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: GoogleIdProvider
    Properties:
      ClientName: StudyBuddyFrontendClient
      GenerateSecret: false
      UserPoolId: !Ref UserPool
      AllowedOAuthFlows:
        - code
        - implicit
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - email
        - openid
        - profile
      CallbackURLs:
        - !Sub "https://${FrontendDomainName}/callback"
      LogoutURLs:
        - !Sub "https://${FrontendDomainName}/logout"
      RefreshTokenValidity: 30
      SupportedIdentityProviders:
        - COGNITO
        - Google

  PostAuthInvocationPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt PostAuthFunction.Arn
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  PostConfirmationInvocationPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt PostConfirmationFunction.Arn
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  PreSignUpInvocationPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt PreSignUpFunction.Arn
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

Outputs:
  UserPoolId:
    Description: "Cognito User Pool ID"
    Value: !Ref UserPool
  UserPoolClientId:
    Description: "Cognito User Pool Client ID"
    Value: !Ref UserPoolClient
  CognitoDomainName:
    Description: "Cognito Hosted UI Domain"
    Value: !Sub "${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"
  GoogleClientIdSecretArn:
    Description: "Secrets Manager ARN for Google Client ID"
    Value: !Ref GoogleClientIdSecret
  GoogleClientSecretSecretArn:
    Description: "Secrets Manager ARN for Google Client Secret"
    Value: !Ref GoogleClientSecretSecret
  LambdaRoleArn:
    Description: "IAM Role ARN for Lambda functions"
    Value: !GetAtt LambdaExecutionRole.Arn