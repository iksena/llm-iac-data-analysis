                Resource: !Sub 'arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${ProjectName}-${Environment}-*'
              - Sid: CloudWatchLogsWrite
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/openclaw/${Environment}/mcp-ops:*'
              - Sid: KMSForEncryptedResources
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                  - kms:DescribeKey
                Resource:
                  - !Ref KnowledgeKeyArn
                  - !Ref InfraLogsKeyArn
                  - !Ref EventsKeyArn
                  - !Ref OpenSearchKeyArn
              - Sid: NetworkDiagnostics
