AWSTemplateFormatVersion: "2010-09-09"
Description: Lab 8.2 — CodeBuild project that builds a Python app, runs tests, uploads artifact to S3

Resources:
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub "dva-lab-08-02-artifacts-${AWS::AccountId}-${AWS::Region}"
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  DeployBucketParam:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /dva-lab-08-02/deploy-bucket
      Type: String
      Value: !Ref ArtifactsBucket

  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BuildPerms
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: "*"
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:ListBucket]
                Resource:
                  - !GetAtt ArtifactsBucket.Arn
                  - !Sub "${ArtifactsBucket.Arn}/*"
              - Effect: Allow
                Action: ssm:GetParameters
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/dva-lab-08-02/*
              - Effect: Allow
                Action: codebuild:CreateReportGroup
                Resource: !Sub arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:report-group/dva-lab-08-02-*
              - Effect: Allow
                Action: [codebuild:CreateReport, codebuild:UpdateReport, codebuild:BatchPutTestCases, codebuild:BatchPutCodeCoverages]
                Resource: !Sub arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:report-group/dva-lab-08-02-*

  Project:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: dva-lab-08-02-build
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          env:
            variables:
              APP_NAME: dva-lab-08-02
            parameter-store:
              DEPLOY_BUCKET: /dva-lab-08-02/deploy-bucket
          phases:
            install:
              runtime-versions:
                python: 3.12
              commands:
                - echo "[install] python $(python --version)"
            pre_build:
              commands:
                - echo "[pre_build] commit=$CODEBUILD_RESOLVED_SOURCE_VERSION"
            build:
              commands:
                - mkdir -p src
                - |
                  cat > src/app.py <<'PY'
                  def add(a, b): return a + b
                  if __name__ == "__main__":
                    print("hello from", "$APP_NAME")
                  PY
                - mkdir -p test-reports
                - |
                  cat > test-app.py <<'PY'
                  def test_pass(): assert 1 + 1 == 2
                  PY
                - python -m pip install pytest pytest-html
                - python -m pytest test-app.py --junitxml=test-reports/junit.xml || true
                - zip -r app.zip src/
            post_build:
              commands:
                - aws s3 cp app.zip "s3://$DEPLOY_BUCKET/app-$CODEBUILD_BUILD_NUMBER.zip"
                - echo "[post_build] uploaded to s3://$DEPLOY_BUCKET/app-$CODEBUILD_BUILD_NUMBER.zip"
          reports:
            UnitTests:
              files: [test-reports/junit.xml]
              file-format: JUNITXML
          artifacts:
            files:
              - app.zip
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        ComputeType: BUILD_GENERAL1_SMALL

Outputs:
  ProjectName:
    Value: !Ref Project
  ArtifactsBucket:
    Value: !Ref ArtifactsBucket