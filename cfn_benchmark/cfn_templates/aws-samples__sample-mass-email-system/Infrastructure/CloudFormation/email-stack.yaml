              Lambda function to process a batch file and queue messages to SQS
              Uses campaign-specific DynamoDB tables
              """
              # Log identifying fields only, consistent with the rest of the system.
              logger.info(
                  f"Processing batch: batchId={event.get('batchId')} "
                  f"campaignId={event.get('campaignId')} objectKey={event.get('objectKey')}"
              )

              # Get batch information from the event
              batch_id = event.get('batchId')
              s3_key = event.get('objectKey')
              campaign_id = event.get('campaignId')
              recipient_table_name = event.get('recipientTrackingTable')
              batch_table_name = event.get('batchTrackingTable')

              # Validate required parameters
              if not batch_id or not s3_key or not campaign_id:
                  logger.error("Missing required batch parameters")
                  return {
                      'statusCode': 400,
                      'body': json.dumps({'error': 'Missing required batch parameters'})
                  }

              if not recipient_table_name or not batch_table_name:
                  logger.error("Missing required table names")
                  return {
                      'statusCode': 400,
                      'body': json.dumps({'error': 'Missing required table names'})
                  }

              # Get SQS URL
              sqs_url = os.environ.get('EMAIL_QUEUE_URL')
              if not sqs_url:
