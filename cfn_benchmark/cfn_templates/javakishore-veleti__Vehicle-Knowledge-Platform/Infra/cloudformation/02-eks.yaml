AWSTemplateFormatVersion: "2010-09-09"
Description: >
  VKP AWS_002 EKS. An EKS cluster + a single managed node group (SPOT by default for cost) in the
  public subnets from AWS_001. Uses EKS access-entry auth (API_AND_CONFIG_MAP) and grants the stack
  creator cluster-admin, so the CI principal can run kubectl in AWS_005 with no aws-auth editing.

Parameters:
  ClusterName:
    Type: String
    Default: "vkp"
  KubernetesVersion:
    Type: String
    Default: "1.30"
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: "Public subnet ids from the AWS_001 network stack outputs."
  NodeInstanceType:
    Type: String
    Default: "t3.medium"
  NodeCapacityType:
    Type: String
    Default: "SPOT"
    AllowedValues: ["SPOT", "ON_DEMAND"]
    Description: "SPOT is cheapest (may be interrupted); ON_DEMAND for stability."
  NodeDesiredSize:
    Type: Number
    Default: 2
  NodeMinSize:
    Type: Number
    Default: 1
  NodeMaxSize:
    Type: Number
    Default: 3
  NodeDiskSize:
    Type: Number
    Default: 20
  DeployerPrincipalArn:
    Type: String
    Default: ""
    Description: "Optional extra IAM principal (user/role ARN) to grant cluster-admin via an access entry."

Conditions:
  HasDeployer: !Not [!Equals [!Ref DeployerPrincipalArn, ""]]

Resources:
  ClusterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: eks.amazonaws.com }
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy

  Cluster:
    Type: AWS::EKS::Cluster
    Properties:
      Name: !Ref ClusterName
      Version: !Ref KubernetesVersion
      RoleArn: !GetAtt ClusterRole.Arn
      AccessConfig:
        AuthenticationMode: API_AND_CONFIG_MAP
        BootstrapClusterCreatorAdminPermissions: true
      ResourcesVpcConfig:
        SubnetIds: !Ref SubnetIds
        EndpointPublicAccess: true
        EndpointPrivateAccess: false

  NodeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly

  Nodegroup:
    Type: AWS::EKS::Nodegroup
    Properties:
      ClusterName: !Ref Cluster
      NodegroupName: vkp-nodes
      NodeRole: !GetAtt NodeRole.Arn
      Subnets: !Ref SubnetIds
      InstanceTypes: [!Ref NodeInstanceType]
      CapacityType: !Ref NodeCapacityType
      AmiType: AL2023_x86_64_STANDARD
      DiskSize: !Ref NodeDiskSize
      ScalingConfig:
        DesiredSize: !Ref NodeDesiredSize
        MinSize: !Ref NodeMinSize
        MaxSize: !Ref NodeMaxSize

  DeployerAccessEntry:
    Type: AWS::EKS::AccessEntry
    Condition: HasDeployer
    Properties:
      ClusterName: !Ref Cluster
      PrincipalArn: !Ref DeployerPrincipalArn
      Type: STANDARD
      AccessPolicies:
        - PolicyArn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
          AccessScope: { Type: cluster }

Outputs:
  ClusterName:
    Value: !Ref Cluster
  ClusterArn:
    Value: !GetAtt Cluster.Arn
  ClusterEndpoint:
    Value: !GetAtt Cluster.Endpoint
  OIDCIssuer:
    Value: !GetAtt Cluster.OpenIdConnectIssuerUrl