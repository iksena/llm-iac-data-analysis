AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 10

Resources:
  OrdersFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/orders.handler
      CodeUri: .
      Events:
        GetOrders:
          Type: Api
          Properties:
            Path: /orders
            Method: get

  EsbuildFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        EntryPoints:
          - src/app.ts
    Properties:
      Handler: app.handler
      CodeUri: .
      Events:
        PostOrder:
          Type: HttpApi
          Properties:
            Path: /orders/{id}
            Method: post

  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: report.lambda_handler
      Runtime: python3.12
      CodeUri: src/handlers
      Events:
        Nightly:
          Type: Schedule
          Properties:
            Schedule: rate(1 day)