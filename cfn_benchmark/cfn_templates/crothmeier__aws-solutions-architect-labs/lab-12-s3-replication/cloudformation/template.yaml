AWSTemplateFormatVersion: '2010-09-09'
Description: 'Lab 12: S3 Cross-Region Replication and Transfer Acceleration'

Parameters:
  EnvironmentName:
    Type: String
    Default: Lab12
    Description: Environment name prefix for resources

  DestinationRegion:
    Type: String
    Default: us-west-2
    Description: Destination region for cross-region replication
    AllowedValues:
      - us-west-2
      - us-west-1
      - eu-west-1
      - ap-southeast-1

Resources:
  # KMS Key for Source Bucket (us-east-1)
  SourceKMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS key for source S3 bucket encryption
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: Allow S3 to use the key
            Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action:
              - 'kms:Decrypt'
              - 'kms:GenerateDataKey'
            Resource: '*'
          - Sid: Allow Replication Role
            Effect: Allow
            Principal:
              AWS: !GetAtt S3ReplicationRole.Arn
            Action:
              - 'kms:Decrypt'
              - 'kms:DescribeKey'
            Resource: '*'

  SourceKMSKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/${EnvironmentName}-source-key'
      TargetKeyId: !Ref SourceKMSKey

  # Source S3 Bucket (us-east-1)
  SourceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${EnvironmentName}-source-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: 'aws:kms'
              KMSMasterKeyID: !GetAtt SourceKMSKey.Arn
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      AccelerateConfiguration:
        AccelerationStatus: Enabled
      ReplicationConfiguration:
        Role: !GetAtt S3ReplicationRole.Arn
        Rules:
          - Id: ReplicateAll
            Status: Enabled
            Priority: 1
            Filter: {}
            Destination:
              Bucket: !Sub 'arn:aws:s3:::${EnvironmentName}-destination-${AWS::AccountId}'
              ReplicationTime:
                Status: Enabled
                Time:
                  Minutes: 15
              Metrics:
                Status: Enabled
                EventThreshold:
                  Minutes: 15
              StorageClass: STANDARD_IA
              EncryptionConfiguration:
                ReplicaKmsKeyID: !Sub 'arn:aws:kms:${DestinationRegion}:${AWS::AccountId}:alias/${EnvironmentName}-dest-key'
            DeleteMarkerReplication:
              Status: Enabled
            SourceSelectionCriteria:
              SseKmsEncryptedObjects:
                Status: Enabled
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-Source-Bucket'
        - Key: Environment
          Value: !Ref EnvironmentName

  # Same-Region Replication Bucket for Compliance
  ComplianceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${EnvironmentName}-compliance-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      ObjectLockEnabled: true
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention:
            Mode: COMPLIANCE
            Years: 1
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-Compliance-Bucket'
        - Key: Environment
          Value: !Ref EnvironmentName

  # IAM Role for S3 Replication
  S3ReplicationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-S3-Replication-Role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: ReplicationPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: GetSourceObjectsAndVersions
                Effect: Allow
                Action:
                  - 's3:GetReplicationConfiguration'
                  - 's3:ListBucket'
                  - 's3:GetObjectVersionForReplication'
                  - 's3:GetObjectVersionAcl'
                  - 's3:GetObjectVersionTagging'
                Resource:
                  - !Sub 'arn:aws:s3:::${EnvironmentName}-source-${AWS::AccountId}'
                  - !Sub 'arn:aws:s3:::${EnvironmentName}-source-${AWS::AccountId}/*'
              - Sid: ReplicateObjects
                Effect: Allow
                Action:
                  - 's3:ReplicateObject'
                  - 's3:ReplicateDelete'
                  - 's3:ReplicateTags'
                  - 's3:GetObjectVersionTagging'
                  - 's3:ObjectOwnerOverrideToBucketOwner'
                Resource:
                  - !Sub 'arn:aws:s3:::${EnvironmentName}-destination-${AWS::AccountId}/*'
                  - !Sub 'arn:aws:s3:::${EnvironmentName}-compliance-${AWS::AccountId}/*'
              - Sid: KMSSourceDecrypt
                Effect: Allow
                Action:
                  - 'kms:Decrypt'
                  - 'kms:DescribeKey'
                Resource: !GetAtt SourceKMSKey.Arn
              - Sid: KMSDestinationEncrypt
                Effect: Allow
                Action:
                  - 'kms:Encrypt'
                  - 'kms:GenerateDataKey'
                Resource:
                  - !Sub 'arn:aws:kms:${DestinationRegion}:${AWS::AccountId}:alias/${EnvironmentName}-dest-key'
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-Replication-Role'

  # Bucket Policy for Transfer Acceleration
  SourceBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SourceBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt SourceBucket.Arn
              - !Sub '${SourceBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

Outputs:
  SourceBucketName:
    Description: Name of the source S3 bucket
    Value: !Ref SourceBucket
    Export:
      Name: !Sub '${AWS::StackName}-SourceBucket'

  SourceBucketArn:
    Description: ARN of the source S3 bucket
    Value: !GetAtt SourceBucket.Arn
    Export:
      Name: !Sub '${AWS::StackName}-SourceBucketArn'

  DestinationBucketName:
    Description: Name of the destination S3 bucket (must be created in destination region)
    Value: !Sub '${EnvironmentName}-destination-${AWS::AccountId}'
    Export:
      Name: !Sub '${AWS::StackName}-DestinationBucket'

  ComplianceBucketName:
    Description: Name of the compliance S3 bucket
    Value: !Ref ComplianceBucket
    Export:
      Name: !Sub '${AWS::StackName}-ComplianceBucket'

  TransferAccelerationEndpoint:
    Description: S3 Transfer Acceleration endpoint
    Value: !Sub '${SourceBucket}.s3-accelerate.amazonaws.com'
    Export:
      Name: !Sub '${AWS::StackName}-AccelerationEndpoint'

  ReplicationRoleArn:
    Description: ARN of the S3 replication role
    Value: !GetAtt S3ReplicationRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-ReplicationRole'

  SourceKMSKeyId:
    Description: KMS Key ID for source bucket
    Value: !Ref SourceKMSKey
    Export:
      Name: !Sub '${AWS::StackName}-SourceKMSKey'

  DestinationRegion:
    Description: Destination region for replication
    Value: !Ref DestinationRegion
    Export:
      Name: !Sub '${AWS::StackName}-DestinationRegion'

  TestCommands:
    Description: Commands to test replication
    Value: !Sub |
      # Upload a test file
      echo "Test content" > test.txt
      aws s3 cp test.txt s3://${SourceBucket}/documents/test.txt

      # Check replication status (wait 1-2 minutes)
      aws s3api head-object --bucket ${SourceBucket} --key documents/test.txt --query ReplicationStatus

      # Verify in destination bucket (after creating it in ${DestinationRegion})
      aws s3 ls s3://${EnvironmentName}-destination-${AWS::AccountId}/documents/ --region ${DestinationRegion}