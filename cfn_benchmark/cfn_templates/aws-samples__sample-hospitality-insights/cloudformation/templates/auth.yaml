AWSTemplateFormatVersion: '2010-09-09'
Description: 'Auth Stack - Cognito User Pool and groups for Hospitality Insights'

Parameters:
  Environment:
    Type: String
    Description: Environment name
    Default: prod

  ProjectName:
    Type: String
    Description: Project name
    Default: hospitality-insights

  ProjectTag:
    Type: String
    Description: Project tag for all resources
    Default: hospitality-insights

  SessionTimeoutHours:
    Type: Number
    Description: Session timeout in hours
    Default: 24

  LoginUrl:
    Type: String
    Description: URL users will use to log in (shown in invitation email)
    Default: ''

  SSOProvider:
    Type: String
    Description: Name of the federated identity provider configured in Cognito (leave empty to disable SSO)
    Default: ''

  CognitoDomainPrefix:
    Type: String
    Description: Cognito hosted UI domain prefix (leave empty to skip domain creation)
    Default: ''

Conditions:
  HasSSO: !And
    - !Not [!Equals [!Ref SSOProvider, '']]
    - !Not [!Equals [!Ref LoginUrl, '']]
    - !Not [!Equals [!Ref CognitoDomainPrefix, '']]

Resources:
  # Cognito User Pool
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${ProjectName}-user-pool-${Environment}'
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: false
        - Name: role
          AttributeDataType: String
          Mutable: true
        - Name: last_login
          AttributeDataType: String
          Mutable: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate:
          - email
      AdminCreateUserConfig:
        InviteMessageTemplate:
          EmailSubject: 'Your Hospitality Insights account'
          EmailMessage: !Sub |
            <p>Hello,</p>
            <p>You have been invited to <strong>Hospitality Insights</strong>.</p>
            <p>Your login details:</p>
            <ul>
              <li><strong>Username:</strong> {username}</li>
              <li><strong>Temporary password:</strong> {####}</li>
            </ul>
            <p>Sign in at: <a href="${LoginUrl}">${LoginUrl}</a></p>
            <p>You will be prompted to set a new password on first login.</p>
      LambdaConfig:
        PostAuthentication: !GetAtt PostAuthTriggerFunction.Arn
      UserPoolTags:
        Environment: !Ref Environment
        Project: !Ref ProjectTag

  # Cognito User Pool Client
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${ProjectName}-client-${Environment}'
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      PreventUserExistenceErrors: ENABLED
      RefreshTokenValidity: 30
      AccessTokenValidity: !Ref SessionTimeoutHours
      IdTokenValidity: !Ref SessionTimeoutHours
      TokenValidityUnits:
        RefreshToken: days
        AccessToken: hours
        IdToken: hours
      ReadAttributes:
        - email
        - given_name
        - name
        - nickname
        - custom:role
        - custom:last_login
      WriteAttributes:
        - email
        - given_name
        - name
        - nickname
        - custom:role
        - custom:last_login
      AllowedOAuthFlows: !If
        - HasSSO
        - - code
        - !Ref 'AWS::NoValue'
      AllowedOAuthFlowsUserPoolClient: !If
        - HasSSO
        - true
        - false
      AllowedOAuthScopes: !If
        - HasSSO
        - - openid
          - email
          - profile
          - aws.cognito.signin.user.admin
        - !Ref 'AWS::NoValue'
      CallbackURLs: !If
        - HasSSO
        - - !Ref LoginUrl
          - !Sub '${LoginUrl}/callback'
        - !Ref 'AWS::NoValue'
      LogoutURLs: !If
        - HasSSO
        - - !Ref LoginUrl
        - !Ref 'AWS::NoValue'
      SupportedIdentityProviders: !If
        - HasSSO
        - - COGNITO
          - !Ref SSOProvider
        - - COGNITO

  # Post Authentication Trigger Lambda
  PostAuthTriggerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-post-auth-trigger-${Environment}'
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt PostAuthTriggerRole.Arn
      Code:
        ZipFile: |
          import boto3
          from datetime import datetime, timezone
          cognito = boto3.client('cognito-idp')
          def lambda_handler(event, context):
              try:
                  cognito.admin_update_user_attributes(
                      UserPoolId=event['userPoolId'],
                      Username=event['userName'],
                      UserAttributes=[{'Name': 'custom:last_login', 'Value': datetime.now(timezone.utc).isoformat()}],
                  )
              except Exception as e:
                  print(f"post_auth_trigger: failed to update last_login: {e}")
              return event
      Timeout: 10

  PostAuthTriggerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-post-auth-trigger-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CognitoUpdateAttributes
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:AdminUpdateUserAttributes
                Resource: !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*'

  PostAuthTriggerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt PostAuthTriggerFunction.Arn
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*'

  # Cognito User Group - Admin
  AdminUserGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Admin
      Description: Administrator users with full access
      UserPoolId: !Ref UserPool
      Precedence: 1

  # Cognito User Group - RegularUser
  RegularUserGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: RegularUser
      Description: Regular users with read-only access
      UserPoolId: !Ref UserPool
      Precedence: 2

  # Cognito User Group - PowerUser
  PowerUserGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: PowerUser
      Description: Power users with read-only access to admin section
      UserPoolId: !Ref UserPool
      Precedence: 3

Outputs:
  UserPoolId:
    Description: ID of the Cognito User Pool
    Value: !Ref UserPool

  UserPoolArn:
    Description: ARN of the Cognito User Pool
    Value: !GetAtt UserPool.Arn

  UserPoolClientId:
    Description: ID of the Cognito User Pool Client
    Value: !Ref UserPoolClient

  AdminUserGroupName:
    Description: Name of the Admin user group
    Value: !Ref AdminUserGroup

  RegularUserGroupName:
    Description: Name of the RegularUser group
    Value: !Ref RegularUserGroup