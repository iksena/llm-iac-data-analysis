AWSTemplateFormatVersion: 2010-09-09
Description: The module will create a cross-account IAM role that allows Coralogix Notification Center to publish Cases to an EventBridge event bus through a global endpoint, granting events:PutEvents on the event bus in both the primary and the secondary Region.
Parameters:
  EventBusArn:
    Type: String
    Description: The ARN of the primary event bus that will receive events via the PutEvents method.
    AllowedPattern: '^arn:aws[\w-]*:events:[a-z]{2}-[a-z]+-[\w-]+:[0-9]{12}:event-bus\/[\.\-_A-Za-z0-9]+$'
    MaxLength: 2048
  SecondaryRegion:
    Type: String
    Description: The failover Region of the EventBridge global endpoint. The event bus in this Region has the same name and account as the primary one, so its ARN is derived automatically.
    AllowedPattern: '^[a-z]{2}-[a-z]+-[\w-]+$'
    MaxLength: 32
  RoleName:
    Type: String
    Description: Don't change it! It needs to match the one that was input on the Coralogix form. Corresponds to the name of the AWS IAM role that will be created.
    Default: cx_eventbridge_iam
    AllowedPattern: '^[a-zA-Z0-9_+=,.@-]+$'
    MaxLength: 64
  ExternalId:
    Type: String
    Description: The external ID generated by Coralogix for this integration. It is required as the sts:ExternalId condition on the role trust policy.
    AllowedPattern: '^[\w+=,.:\/@-]+$'
    MaxLength: 1224
  CoralogixRegionAlias:
    Type: String
    Description: The Alias for the Coralogix region, possible options are [us1, us2, eu1, eu2, ap1, ap2, ap3, custom]
    AllowedValues:
      - us1
      - us2
      - eu1
      - eu2
      - ap1
      - ap2
      - ap3
      - custom
  CustomCoralogixAccount:
    Type: String
    Description: In case you want to use a custom coralogix account, enter the aws account id that you want to use.
    Default: ''
  CustomCoralogixRole:
    Type: String
    Description: In case you want to use a custom coralogix role, enter the role name that you want to use.
    Default: ''
Conditions:
  IsRegionUs2: !Equals
    - Ref: CoralogixRegionAlias
    - us2
  IsRegionAP3: !Equals
    - Ref: CoralogixRegionAlias
    - ap3
  IsCustomAccount: !Not
    - !Equals
      - Ref: CustomCoralogixAccount
      - ''
  IsCustomCoralogixRole: !Not
    - !Equals
      - Ref: CustomCoralogixRole
      - ''
Resources:
  CoralogixEventBridgeIamRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Role for Coralogix Notification Center to send Cases events to an EventBridge event bus through a global endpoint.
      RoleName: !Ref RoleName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub
                - 'arn:aws:iam::${aws_account_id}:role/${role_name}'
                - aws_account_id: !If
                    - IsCustomAccount
                    - !Ref CustomCoralogixAccount
                    - !If
                      - IsRegionUs2
                      - '739076534691'
                      - !If
                        - IsRegionAP3
                        - '025066248247'
                        - '625240141681'
                  role_name: !If
                    - IsCustomCoralogixRole
                    - !Ref CustomCoralogixRole
                    - !Sub 'alerts-eventbus-${CoralogixRegionAlias}'
            Action:
              - sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      Policies:
        - PolicyName: CoralogixEventBridgeIamRolePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - events:PutEvents
                Resource:
                  - !Ref EventBusArn
                  - !Sub
                    - 'arn:${partition}:events:${SecondaryRegion}:${account}:event-bus/${bus_name}'
                    - partition: !Select [1, !Split [':', !Ref EventBusArn]]
                      account: !Select [4, !Split [':', !Ref EventBusArn]]
                      bus_name: !Select [1, !Split ['/', !Select [5, !Split [':', !Ref EventBusArn]]]]
Outputs:
  CoralogixEventBridgeIamRoleArn:
    Description: The ARN of the role that Coralogix Notification Center assumes to publish events.
    Value: !GetAtt CoralogixEventBridgeIamRole.Arn