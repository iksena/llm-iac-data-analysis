AWSTemplateFormatVersion: 2010-09-09
Description: Core-VPCPeeringConnections Template. This template creates VPCPeeringConnections and bidirectional routes using parameterized inputs for self-contained deployment.

Parameters:
  CoreVpcId:
    Type: String
    Description: ID of the Core VPC
  CoreVpcCidr:
    Type: String
    Description: CIDR block of the Core VPC
  CorePublicRouteTableId:
    Type: String
    Description: ID of the Core Public Route Table
  CorePrivateRouteTableAId:
    Type: String
    Description: ID of the Core Private Route Table A
  CorePrivateRouteTableBId:
    Type: String
    Description: ID of the Core Private Route Table B

  # --- Build Environment ---
  BuildVpcId:
    Type: String
    Default: ''
  BuildVpcCidr:
    Type: String
    Default: ''
  BuildPublicRouteTableId:
    Type: String
    Default: ''
  BuildPrivateRouteTableAId:
    Type: String
    Default: ''
  BuildPrivateRouteTableBId:
    Type: String
    Default: ''

  # --- Production Environment ---
  ProductionVpcId:
    Type: String
    Default: ''
  ProductionVpcCidr:
    Type: String
    Default: ''
  ProductionPublicRouteTableId:
    Type: String
    Default: ''
  ProductionPrivateRouteTableAId:
    Type: String
    Default: ''
  ProductionPrivateRouteTableBId:
    Type: String
    Default: ''

  # --- Staging Environment ---
  StagingVpcId:
    Type: String
    Default: ''
  StagingVpcCidr:
    Type: String
    Default: ''
  StagingPublicRouteTableId:
    Type: String
    Default: ''
  StagingPrivateRouteTableAId:
    Type: String
    Default: ''
  StagingPrivateRouteTableBId:
    Type: String
    Default: ''

  # --- UAT Environment ---
  UATVpcId:
    Type: String
    Default: ''
  UATVpcCidr:
    Type: String
    Default: ''
  UATPublicRouteTableId:
    Type: String
    Default: ''
  UATPrivateRouteTableAId:
    Type: String
    Default: ''
  UATPrivateRouteTableBId:
    Type: String
    Default: ''

  # --- Testing Environment ---
  TestingVpcId:
    Type: String
    Default: ''
  TestingVpcCidr:
    Type: String
    Default: ''
  TestingPublicRouteTableId:
    Type: String
    Default: ''
  TestingPrivateRouteTableAId:
    Type: String
    Default: ''
  TestingPrivateRouteTableBId:
    Type: String
    Default: ''

  # --- Development Environment ---
  DevelopmentVpcId:
    Type: String
    Default: ''
  DevelopmentVpcCidr:
    Type: String
    Default: ''
  DevelopmentPublicRouteTableId:
    Type: String
    Default: ''
  DevelopmentPrivateRouteTableAId:
    Type: String
    Default: ''
  DevelopmentPrivateRouteTableBId:
    Type: String
    Default: ''

Conditions:
  PeerToBuildVPC: !Not [ !Equals [ !Ref BuildVpcId, '' ]]
  PeerToProductionVPC: !Not [ !Equals [ !Ref ProductionVpcId, '' ]]
  PeerToStagingVPC: !Not [ !Equals [ !Ref StagingVpcId, '' ]]
  PeerToUATVPC: !Not [ !Equals [ !Ref UATVpcId, '' ]]
  PeerToTestingVPC: !Not [ !Equals [ !Ref TestingVpcId, '' ]]
  PeerToDevelopmentVPC: !Not [ !Equals [ !Ref DevelopmentVpcId, '' ]]

Resources:
  # =======================================================
  # Build Peering & Routes
  # =======================================================
  BuildVPCPeeringConnection:
    Type: AWS::EC2::VPCPeeringConnection
    Condition: PeerToBuildVPC
    Properties:
      VpcId: !Ref CoreVpcId
      PeerVpcId: !Ref BuildVpcId
      Tags:
        - Key: Name
          Value: Core-BuildVPCPeeringConnection

  PublicCoreToBuildRoute:
    Type: AWS::EC2::Route
    Condition: PeerToBuildVPC
    Properties:
      DestinationCidrBlock: !Ref BuildVpcCidr
      RouteTableId: !Ref CorePublicRouteTableId
      VpcPeeringConnectionId: !Ref BuildVPCPeeringConnection

  PublicBuildToCoreRoute:
    Type: AWS::EC2::Route
    Condition: PeerToBuildVPC
    Properties:
      DestinationCidrBlock: !Ref CoreVpcCidr
      RouteTableId: !Ref BuildPublicRouteTableId
      VpcPeeringConnectionId: !Ref BuildVPCPeeringConnection

  PrivateCoreToBuildRouteA:
    Type: AWS::EC2::Route
    Condition: PeerToBuildVPC
    Properties:
      DestinationCidrBlock: !Ref BuildVpcCidr
      RouteTableId: !Ref CorePrivateRouteTableAId
      VpcPeeringConnectionId: !Ref BuildVPCPeeringConnection

  PrivateBuildToCoreRouteA:
    Type: AWS::EC2::Route
    Condition: PeerToBuildVPC
    Properties:
      DestinationCidrBlock: !Ref CoreVpcCidr
      RouteTableId: !Ref BuildPrivateRouteTableAId
      VpcPeeringConnectionId: !Ref BuildVPCPeeringConnection

  PrivateCoreToBuildRouteB:
    Type: AWS::EC2::Route
    Condition: PeerToBuildVPC
    Properties:
      DestinationCidrBlock: !Ref BuildVpcCidr
      RouteTableId: !Ref CorePrivateRouteTableBId
      VpcPeeringConnectionId: !Ref BuildVPCPeeringConnection

  PrivateBuildToCoreRouteB:
    Type: AWS::EC2::Route
    Condition: PeerToBuildVPC
    Properties:
      DestinationCidrBlock: !Ref CoreVpcCidr
      RouteTableId: !Ref BuildPrivateRouteTableBId
      VpcPeeringConnectionId: !Ref BuildVPCPeeringConnection

  # =======================================================
  # Production Peering & Routes
  # =======================================================
  ProductionVPCPeeringConnection:
    Type: AWS::EC2::VPCPeeringConnection
    Condition: PeerToProductionVPC
    Properties:
      VpcId: !Ref CoreVpcId
      PeerVpcId: !Ref ProductionVpcId
      Tags:
        - Key: Name
          Value: Core-ProductionVPCPeeringConnection

  PublicCoreToProductionRoute:
    Type: AWS::EC2::Route
    Condition: PeerToProductionVPC
    Properties:
      DestinationCidrBlock: !Ref ProductionVpcCidr
      RouteTableId: !Ref CorePublicRouteTableId
      VpcPeeringConnectionId: !Ref ProductionVPCPeeringConnection

  PublicProductionToCoreRoute:
    Type: AWS::EC2::Route
    Condition: PeerToProductionVPC
    Properties:
      DestinationCidrBlock: !Ref CoreVpcCidr
      RouteTableId: !Ref ProductionPublicRouteTableId
      VpcPeeringConnectionId: !Ref ProductionVPCPeeringConnection

  PrivateCoreToProductionRouteA:
    Type: AWS::EC2::Route
    Condition: PeerToProductionVPC
    Properties:
      DestinationCidrBlock: !Ref ProductionVpcCidr
      RouteTableId: !Ref CorePrivateRouteTableAId
      VpcPeeringConnectionId: !Ref ProductionVPCPeeringConnection

  PrivateProductionToCoreRouteA:
    Type: AWS::EC2::Route
    Condition: PeerToProductionVPC
    Properties:
      DestinationCidrBlock: !Ref CoreVpcCidr
      RouteTableId: !Ref ProductionPrivateRouteTableAId
      VpcPeeringConnectionId: !Ref ProductionVPCPeeringConnection

  PrivateCoreToProductionRouteB:
    Type: AWS::EC2::Route
    Condition: PeerToProductionVPC
    Properties:
      DestinationCidrBlock: !Ref ProductionVpcCidr
      RouteTableId: !Ref CorePrivateRouteTableBId
      VpcPeeringConnectionId: !Ref ProductionVPCPeeringConnection

  PrivateProductionToCoreRouteB:
    Type: AWS::EC2::Route
    Condition: PeerToProductionVPC
    Properties:
      DestinationCidrBlock: !Ref CoreVpcCidr
      RouteTableId: !Ref ProductionPrivateRouteTableBId
      VpcPeeringConnectionId: !Ref ProductionVPCPeeringConnection

  # =======================================================
  # Staging Peering & Routes
  # =======================================================
  StagingVPCPeeringConnection:
    Type: AWS::EC2::VPCPeeringConnection
    Condition: PeerToStagingVPC
    Properties:
      VpcId: !Ref CoreVpcId
      PeerVpcId: !Ref StagingVpcId
      Tags:
        - Key: Name
          Value: Core-StagingVPCPeeringConnection

  PublicCoreToStagingRoute:
    Type: AWS::EC2::Route
    Condition: PeerToStagingVPC
    Properties:
      DestinationCidrBlock: !Ref StagingVpcCidr
      RouteTableId: !Ref CorePublicRouteTableId
      VpcPeeringConnectionId: !Ref StagingVPCPeeringConnection

  PublicStagingToCoreRoute:
    Type: AWS::EC2::Route
    Condition: PeerToStagingVPC
    Properties:
      DestinationCidrBlock: !Ref CoreVpcCidr
      RouteTableId: !Ref StagingPublicRouteTableId
      VpcPeeringConnectionId: !Ref StagingVPCPeeringConnection

  PrivateCoreToStagingRouteA:
    Type: AWS::EC2::Route
    Condition: PeerToStagingVPC
    Properties:
      DestinationCidrBlock: !Ref StagingVpcCidr
      RouteTableId: !Ref CorePrivateRouteTableAId
      VpcPeeringConnectionId: !Ref StagingVPCPeeringConnection

  PrivateStagingToCoreRouteA:
    Type: AWS::EC2::Route
    Condition: PeerToStagingVPC
    Properties:
      DestinationCidrBlock: !Ref CoreVpcCidr
      RouteTableId: !Ref StagingPrivateRouteTableAId
      VpcPeeringConnectionId: !Ref StagingVPCPeeringConnection

  PrivateCoreToStagingRouteB:
    Type: AWS::EC2::Route
    Condition: PeerToStagingVPC
    Properties:
      DestinationCidrBlock: !Ref StagingVpcCidr
      RouteTableId: !Ref CorePrivateRouteTableBId
      VpcPeeringConnectionId: !Ref StagingVPCPeeringConnection

  PrivateStagingToCoreRouteB:
    Type: AWS::EC2::Route
    Condition: PeerToStagingVPC
    Properties:
      DestinationCidrBlock: !Ref CoreVpcCidr
      RouteTableId: !Ref StagingPrivateRouteTableBId
      VpcPeeringConnectionId: !Ref StagingVPCPeeringConnection

  # =======================================================
  # UAT Peering & Routes
  # =======================================================
  UATVPCPeeringConnection:
    Type: AWS::EC2::VPCPeeringConnection
    Condition: PeerToUATVPC
    Properties:
      VpcId: !Ref CoreVpcId
      PeerVpcId: !Ref UATVpcId
      Tags:
        - Key: Name
          Value: Core-UATVPCPeeringConnection

  PublicCoreToUATRoute:
    Type: AWS::EC2::Route
    Condition: PeerToUATVPC
    Properties:
      DestinationCidrBlock: !Ref UATVpcCidr
      RouteTableId: !Ref CorePublicRouteTableId
      VpcPeeringConnectionId: !Ref UATVPCPeeringConnection

  PublicUATToCoreRoute:
    Type: AWS::EC2::Route
    Condition: PeerToUATVPC
    Properties:
      DestinationCidrBlock: !Ref CoreVpcCidr
      RouteTableId: !Ref UATPublicRouteTableId
      VpcPeeringConnectionId: !Ref UATVPCPeeringConnection

  PrivateCoreToUATRouteA:
    Type: AWS::EC2::Route
    Condition: PeerToUATVPC
    Properties:
      DestinationCidrBlock: !Ref UATVpcCidr
      RouteTableId: !Ref CorePrivateRouteTableAId
      VpcPeeringConnectionId: !Ref UATVPCPeeringConnection

  PrivateUATToCoreRouteA:
    Type: AWS::EC2::Route
    Condition: PeerToUATVPC
    Properties:
      DestinationCidrBlock: !Ref CoreVpcCidr
      RouteTableId: !Ref UATPrivateRouteTableAId
      VpcPeeringConnectionId: !Ref UATVPCPeeringConnection

  PrivateCoreToUATRouteB:
    Type: AWS::EC2::Route
    Condition: PeerToUATVPC
    Properties:
      DestinationCidrBlock: !Ref UATVpcCidr
      RouteTableId: !Ref CorePrivateRouteTableBId
      VpcPeeringConnectionId: !Ref UATVPCPeeringConnection

  PrivateUATToCoreRouteB:
    Type: AWS::EC2::Route
    Condition: PeerToUATVPC
    Properties:
      DestinationCidrBlock: !Ref CoreVpcCidr
      RouteTableId: !Ref UATPrivateRouteTableBId
      VpcPeeringConnectionId: !Ref UATVPCPeeringConnection

  # =======================================================
  # Testing Peering & Routes
  # =======================================================
  TestingVPCPeeringConnection:
    Type: AWS::EC2::VPCPeeringConnection
    Condition: PeerToTestingVPC
    Properties:
      VpcId: !Ref CoreVpcId
      PeerVpcId: !Ref TestingVpcId
      Tags:
        - Key: Name
          Value: Core-TestingVPCPeeringConnection

  PublicCoreToTestingRoute:
    Type: AWS::EC2::Route
    Condition: PeerToTestingVPC
    Properties:
      DestinationCidrBlock: !Ref TestingVpcCidr
      RouteTableId: !Ref CorePublicRouteTableId
      VpcPeeringConnectionId: !Ref TestingVPCPeeringConnection

  PublicTestingToCoreRoute:
    Type: AWS::EC2::Route
    Condition: PeerToTestingVPC
    Properties:
      DestinationCidrBlock: !Ref CoreVpcCidr
      RouteTableId: !Ref TestingPublicRouteTableId
      VpcPeeringConnectionId: !Ref TestingVPCPeeringConnection

  PrivateCoreToTestingRouteA:
    Type: AWS::EC2::Route
    Condition: PeerToTestingVPC
    Properties:
      DestinationCidrBlock: !Ref TestingVpcCidr
      RouteTableId: !Ref CorePrivateRouteTableAId
      VpcPeeringConnectionId: !Ref TestingVPCPeeringConnection

  PrivateTestingToCoreRouteA:
    Type: AWS::EC2::Route
    Condition: PeerToTestingVPC
    Properties:
      DestinationCidrBlock: !Ref CoreVpcCidr
      RouteTableId: !Ref TestingPrivateRouteTableAId
      VpcPeeringConnectionId: !Ref TestingVPCPeeringConnection

  PrivateCoreToTestingRouteB:
    Type: AWS::EC2::Route
    Condition: PeerToTestingVPC
    Properties:
      DestinationCidrBlock: !Ref TestingVpcCidr
      RouteTableId: !Ref CorePrivateRouteTableBId
      VpcPeeringConnectionId: !Ref TestingVPCPeeringConnection

  PrivateTestingToCoreRouteB:
    Type: AWS::EC2::Route
    Condition: PeerToTestingVPC
    Properties:
      DestinationCidrBlock: !Ref CoreVpcCidr
      RouteTableId: !Ref TestingPrivateRouteTableBId
      VpcPeeringConnectionId: !Ref TestingVPCPeeringConnection

  # =======================================================
  # Development Peering & Routes
  # =======================================================
  DevelopmentVPCPeeringConnection:
    Type: AWS::EC2::VPCPeeringConnection
    Condition: PeerToDevelopmentVPC
    Properties:
      VpcId: !Ref CoreVpcId
      PeerVpcId: !Ref DevelopmentVpcId
      Tags:
        - Key: Name
          Value: Core-DevelopmentVPCPeeringConnection

  PublicCoreToDevelopmentRoute:
    Type: AWS::EC2::Route
    Condition: PeerToDevelopmentVPC
    Properties:
      DestinationCidrBlock: !Ref DevelopmentVpcCidr
      RouteTableId: !Ref CorePublicRouteTableId
      VpcPeeringConnectionId: !Ref DevelopmentVPCPeeringConnection

  PublicDevelopmentToCoreRoute:
    Type: AWS::EC2::Route
    Condition: PeerToDevelopmentVPC
    Properties:
      DestinationCidrBlock: !Ref CoreVpcCidr
      RouteTableId: !Ref DevelopmentPublicRouteTableId
      VpcPeeringConnectionId: !Ref DevelopmentVPCPeeringConnection

  PrivateCoreToDevelopmentRouteA:
    Type: AWS::EC2::Route
    Condition: PeerToDevelopmentVPC
    Properties:
      DestinationCidrBlock: !Ref DevelopmentVpcCidr
      RouteTableId: !Ref CorePrivateRouteTableAId
      VpcPeeringConnectionId: !Ref DevelopmentVPCPeeringConnection

  PrivateDevelopmentToCoreRouteA:
    Type: AWS::EC2::Route
    Condition: PeerToDevelopmentVPC
    Properties:
      DestinationCidrBlock: !Ref CoreVpcCidr
      RouteTableId: !Ref DevelopmentPrivateRouteTableAId
      VpcPeeringConnectionId: !Ref DevelopmentVPCPeeringConnection

  PrivateCoreToDevelopmentRouteB:
    Type: AWS::EC2::Route
    Condition: PeerToDevelopmentVPC
    Properties:
      DestinationCidrBlock: !Ref DevelopmentVpcCidr
      RouteTableId: !Ref CorePrivateRouteTableBId
      VpcPeeringConnectionId: !Ref DevelopmentVPCPeeringConnection

  PrivateDevelopmentToCoreRouteB:
    Type: AWS::EC2::Route
    Condition: PeerToDevelopmentVPC
    Properties:
      DestinationCidrBlock: !Ref CoreVpcCidr
      RouteTableId: !Ref DevelopmentPrivateRouteTableBId
      VpcPeeringConnectionId: !Ref DevelopmentVPCPeeringConnection