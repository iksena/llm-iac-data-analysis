AWSTemplateFormatVersion: 2010-09-09
Description: >-
  WordPress architecture evolution - Stage 2 nested root stack
  Standalone server using Launch Template
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Stage 2 configuration
        Parameters:
          - LatestAmiId
          - SourceAmiId
          - CfnMetadataNonce
    ParameterLabels:
      LatestAmiId:
        default: Amazon Linux 2023 AMI
      SourceAmiId:
        default: Stage 1 source AMI ID
      CfnMetadataNonce:
        default: cfn-init refresh nonce

Parameters:
  LatestAmiId:
    Description: Latest Amazon Linux 2023 AMI for greenfield stage 2.
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.18-x86_64
  SourceAmiId:
    Type: String
    Default: ''
    AllowedPattern: '^$|^ami-[a-z0-9]+$'
    Description: Optional AMI created from the stage 1 instance before updating this same stack to stage 2. Leave empty for greenfield.
  CfnMetadataNonce:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 2147483647
    Description: Increase on stack update so stage 2 cfn-hup re-runs cfn-init.

Resources:
  NetworkStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../nested/network.yaml

  SharedSsmStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../nested/shared-ssm.yaml

  IamStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../nested/iam.yaml

  AutomationStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../nested/automation.yaml
      Parameters:
        RootStackName: !Ref AWS::StackName

  SingleServerStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: SharedSsmStack
    Properties:
      TemplateURL: ../nested/single-server-lt.yaml
      Parameters:
        LatestAmiId: !Ref LatestAmiId
        SourceAmiId: !Ref SourceAmiId
        CfnMetadataNonce: !Ref CfnMetadataNonce
        VpcId: !GetAtt NetworkStack.Outputs.VpcId
        PublicSubnetId: !GetAtt NetworkStack.Outputs.PublicSubnetAId
        InstanceProfileName: !GetAtt IamStack.Outputs.InstanceProfileName

Outputs:
  WordpressURL:
    Description: Open this URL to complete WordPress setup or verify preserved content after upgrade.
    Value: !GetAtt SingleServerStack.Outputs.WordpressURL
  WordpressInstanceId:
    Description: Stage 2 EC2 instance ID. Use this for later SSM Automation upgrade runbooks.
    Value: !GetAtt SingleServerStack.Outputs.WordpressInstanceId
  WordpressInstanceAutoIP:
    Description: Ephemeral public IPv4 assigned while the instance is running.
    Value: !GetAtt SingleServerStack.Outputs.WordpressInstanceAutoIP
  WordpressLaunchTemplateId:
    Value: !GetAtt SingleServerStack.Outputs.WordpressLaunchTemplateId
  PreStageSnapshotDocumentName:
    Description: SSM Automation document that creates a pre-upgrade AMI.
    Value: !GetAtt AutomationStack.Outputs.PreStageSnapshotDocumentName
  AutomationRoleArn:
    Description: Role used by the SSM Automation documents.
    Value: !GetAtt AutomationStack.Outputs.AutomationRoleArn
  VpcId:
    Value: !GetAtt NetworkStack.Outputs.VpcId