AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Infracost AWS Integration - sets up a read-only cross-account IAM role for
  Infracost Cloud, with optional BCM Data Exports, S3 Storage Lens, and Cost
  Anomaly Detection provisioning.

Parameters:
  InfracostExternalId:
    Type: String
    NoEcho: true
    MinLength: 2
    MaxLength: 1224
    AllowedPattern: '^[\w+=,.@:/-]*$'
    Description: Your Infracost External ID, copied from the Infracost UI.

  InfracostAccountId:
    Type: String
    Default: '237144093413'
    AllowedPattern: '^\d{12}$'
    Description: >-
      The Infracost AWS account ID which is granted permission to assume the
      cross-account role. Do not change this unless instructed by Infracost.

  IsManagementAccount:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      Whether this is the AWS Organizations management account. If true,
      this sets up access to recommendations, cost, usage and pricing data.
      Otherwise, this sets up read-only access to a limited set of resources.

  RoleSuffix:
    Type: String
    Default: ''
    MaxLength: 26
    AllowedPattern: '^[\w+=,.@-]{0,26}$'
    Description: >-
      Optional suffix appended to all role/policy names this stack creates.
      Useful for creating multiple roles in the same account for testing
      purposes. Limited to 26 characters because the longest generated
      policy name (infracost-management-account-readonly) must stay within
      IAM's 64-character name limit.

  ExtraS3BucketArn1:
    Type: String
    Default: ''
    Description: >-
      (Optional) ARN of an extra S3 bucket to grant Infracost read access to,
      e.g. a Cost and Usage Report bucket you already manage yourself. Up to
      3 extra buckets are supported (ExtraS3BucketArn1/2/3); contact
      Infracost if you need more.

  ExtraS3BucketArn2:
    Type: String
    Default: ''
    Description: (Optional) ARN of a second extra S3 bucket to grant Infracost read access to.

  ExtraS3BucketArn3:
    Type: String
    Default: ''
    Description: (Optional) ARN of a third extra S3 bucket to grant Infracost read access to.

  EnableDataExports:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      Whether to enable BCM Data Exports and S3 Storage Lens provisioning.
      Can only be true when IsManagementAccount is true. Requires
      OrganizationArn and TrustedServicePrincipals to also be set.

  EnableAnomalyMonitors:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      Whether to enable Cost Anomaly Detection monitor provisioning. Can
      only be true when IsManagementAccount is true.

  ExistingAnomalyMonitorArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws[a-zA-Z-]*:ce::\d{12}:anomalymonitor/[a-zA-Z0-9-]+$'
    Description: >-
      (Optional) ARN of an existing SERVICE-dimension, DIMENSIONAL-type Cost
      Anomaly Detection monitor. AWS allows only one such monitor per
      account, so if your account already has one (many do, via the Cost
      Explorer console default), this stack can't create a second - set
      EnableAnomalyMonitors=true and pass its ARN here instead, and this
      stack will use it as-is rather than creating a new one. Run: aws ce
      get-anomaly-monitors --query "AnomalyMonitors[?MonitorType=='DIMENSIONAL'
      && MonitorDimension=='SERVICE'].MonitorArn" --output text
      to check. Leave blank to have this stack create one.

  KmsKeyArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws[a-zA-Z-]*:kms:[a-z0-9-]+:\d{12}:key/[a-zA-Z0-9-]+$'
    Description: >-
      (Optional) ARN of a customer-managed KMS key (not an alias) to use for
      server-side encryption of the data export S3 buckets. Leave blank to
      use SSE-S3 (AES-256).

  OrganizationArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws[a-zA-Z-]*:organizations::\d{12}:organization/o-[a-z0-9]{10,32}$'
    Description: >-
      Required when EnableDataExports is true. Run:
      aws organizations describe-organization --query 'Organization.Arn' --output text

  TrustedServicePrincipals:
    Type: CommaDelimitedList
    Default: ''
    Description: >-
      Required when EnableDataExports is true. Run:
      aws organizations list-aws-service-access-for-organization --query
      'EnabledServicePrincipals[].ServicePrincipal' --output text
      and pass the result here as a comma-separated list. Must include
      storage-lens.s3.amazonaws.com.

Rules:
  DataExportsRequiresManagementAccount:
    RuleCondition: !Equals [!Ref EnableDataExports, 'true']
    Assertions:
      - Assert: !Equals [!Ref IsManagementAccount, 'true']
        AssertDescription: >-
          EnableDataExports can only be true when IsManagementAccount is true.

  AnomalyMonitorsRequiresManagementAccount:
    RuleCondition: !Equals [!Ref EnableAnomalyMonitors, 'true']
    Assertions:
      - Assert: !Equals [!Ref IsManagementAccount, 'true']
        AssertDescription: >-
          EnableAnomalyMonitors can only be true when IsManagementAccount is true.

  AnomalyMonitorArnRequiresEnableAnomalyMonitors:
    RuleCondition: !Not [!Equals [!Ref ExistingAnomalyMonitorArn, '']]
    Assertions:
      - Assert: !Equals [!Ref EnableAnomalyMonitors, 'true']
        AssertDescription: >-
          ExistingAnomalyMonitorArn has no effect unless EnableAnomalyMonitors
          is also true.

  DataExportsRequiresOrganizationArn:
    RuleCondition: !Equals [!Ref EnableDataExports, 'true']
    Assertions:
      - Assert: !Not [!Equals [!Ref OrganizationArn, '']]
        AssertDescription: >-
          OrganizationArn must be set when EnableDataExports is true. Run:
          aws organizations describe-organization --query 'Organization.Arn' --output text

  # AWS Data Exports (bcm-data-exports) has exactly one service endpoint, in us-east-1 - see
  # https://docs.aws.amazon.com/general/latest/gr/billing.html#billing-data-export. Deploying
  # this stack with EnableDataExports=true in any other region will fail on
  # BcmDataExportsServiceLinkedRole/BcmDaily*Export, so this fails fast instead. The exported
  # cost/usage data itself still covers every AWS region - this only restricts where the
  # Export resources themselves can be created.
  DataExportsRequiresUsEast1Region:
    RuleCondition: !Equals [!Ref EnableDataExports, 'true']
    Assertions:
      - Assert: !Equals [!Ref 'AWS::Region', 'us-east-1']
        AssertDescription: >-
          EnableDataExports requires deploying this stack in us-east-1. AWS Data Exports
          (BCM Data Exports) is a us-east-1-only service - see
          https://docs.aws.amazon.com/general/latest/gr/billing.html

  StorageLensRequiresTrustedAccess:
    RuleCondition: !Equals [!Ref EnableDataExports, 'true']
    Assertions:
      - Assert:
          Fn::Contains: [!Ref TrustedServicePrincipals, 'storage-lens.s3.amazonaws.com']
        AssertDescription: >-
          S3 Storage Lens must have trusted access configured for cross-account
          visibility. TrustedServicePrincipals must include
          storage-lens.s3.amazonaws.com. See:
          https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage_lens_with_organizations_enabling_trusted_access.html

Mappings:
  ModuleInfo:
    Version:
      Value: '0.1.0' # x-release-please-version

Conditions:
  IsManagementAccount: !Equals [!Ref IsManagementAccount, 'true']
  IsMemberAccount: !Not [!Condition IsManagementAccount]
  EnableDataExports: !Equals [!Ref EnableDataExports, 'true']
  EnableAnomalyMonitors: !Equals [!Ref EnableAnomalyMonitors, 'true']
  HasExistingAnomalyMonitorArn: !Not [!Equals [!Ref ExistingAnomalyMonitorArn, '']]
  CreateAnomalyMonitor: !And
    - !Condition EnableAnomalyMonitors
    - !Not [!Condition HasExistingAnomalyMonitorArn]
  HasKmsKey: !Not [!Equals [!Ref KmsKeyArn, '']]
  ApplyKmsDecryptPolicy: !And [!Condition IsManagementAccount, !Condition HasKmsKey]
  UseKmsForExportBuckets: !And [!Condition EnableDataExports, !Condition HasKmsKey]
  HasExtraS3BucketArn1: !Not [!Equals [!Ref ExtraS3BucketArn1, '']]
  HasExtraS3BucketArn2: !Not [!Equals [!Ref ExtraS3BucketArn2, '']]
  HasExtraS3BucketArn3: !Not [!Equals [!Ref ExtraS3BucketArn3, '']]
  HasExtraS3Buckets: !Or
    - !Condition HasExtraS3BucketArn1
    - !Condition HasExtraS3BucketArn2
    - !Condition HasExtraS3BucketArn3
  HasAnyS3BucketAccess: !Or [!Condition HasExtraS3Buckets, !Condition EnableDataExports]

Resources:
  # ---------------------------------------------------------------------
  # Cross-account role
  # ---------------------------------------------------------------------

  CrossAccountRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "infracost-readonly${RoleSuffix}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${InfracostAccountId}:root"
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref InfracostExternalId
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/job-function/ViewOnlyAccess"
      Tags:
        - Key: InfracostModuleVersion
          Value: !FindInMap [ModuleInfo, Version, Value]

  # Management-account and member-account readonly policies are mutually
  # exclusive (gated on complementary Conditions), matching the Terraform
  # module's complementary `count` expressions on the same two resources.
  ManagementAccountReadOnlyPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: IsManagementAccount
    Properties:
      ManagedPolicyName: !Sub "infracost-management-account-readonly${RoleSuffix}"
      Path: /
      Description: Infracost management account read-only policy
      Roles: [!Ref CrossAccountRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: InfracostManagementAccountReadOnly
            Effect: Allow
            Resource: '*'
            Action:
              - acm:ListTagsForCertificate
              - amplify:ListApps
              - amplify:ListTagsForResource
              - apigateway:GET
              - apprunner:ListServices
              - apprunner:ListTagsForResource
              - bcm-data-exports:Get*
              - bcm-data-exports:List*
              - ce:Describe*
              - ce:Get*
              - ce:List*
              - compute-optimizer:Get*
              - cost-optimization-hub:Get*
              - cost-optimization-hub:List*
              - ec2:DescribeClientVpnEndpoints
              - ec2:DescribeLaunchTemplates
              - ec2:DescribeTransitGatewayAttachments
              - ecr:ListTagsForResource
              - globalaccelerator:ListTagsForResource
              - macie2:ListTagsForResource
              - organizations:DescribeOrganization
              - pricing:Describe*
              - pricing:Get*
              - pricing:List*
              - rds:ListTagsForResource
              - s3:GetBucketLocation
              - s3:GetBucketTagging
              - s3:GetStorageLensConfiguration
              - s3:GetStorageLensConfigurationTagging
              - s3:GetStorageLensDashboard
              - s3:ListStorageLensConfigurations
              - savingsplans:ListTagsForResource
              - scheduler:ListTagsForResource
              - tag:GetResources
              - trustedadvisor:Get*
              - trustedadvisor:List*

  MemberAccountReadOnlyPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: IsMemberAccount
    Properties:
      ManagedPolicyName: !Sub "infracost-member-account-readonly${RoleSuffix}"
      Path: /
      Description: Infracost member account read-only policy
      Roles: [!Ref CrossAccountRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: InfracostMemberAccountReadOnly
            Effect: Allow
            Resource: '*'
            Action:
              - acm:ListTagsForCertificate
              - amplify:ListApps
              - amplify:ListTagsForResource
              - apigateway:GET
              - apprunner:ListServices
              - apprunner:ListTagsForResource
              - ec2:DescribeClientVpnEndpoints
              - ec2:DescribeLaunchTemplates
              - ec2:DescribeTransitGatewayAttachments
              - ecr:ListTagsForResource
              - globalaccelerator:ListTagsForResource
              - macie2:ListTagsForResource
              - rds:ListTagsForResource
              - s3:GetBucketLocation
              - s3:GetBucketTagging
              - savingsplans:ListTagsForResource
              - scheduler:ListTagsForResource
              - tag:GetResources

  RoleIntrospectionPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "infracost-role-introspection${RoleSuffix}"
      Path: /
      Description: >-
        Allows the Infracost cross-account role to read and simulate its own
        permissions for feature detection
      Roles: [!Ref CrossAccountRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: InspectRole
            Effect: Allow
            Action:
              - iam:GetRole
              - iam:ListRolePolicies
              - iam:GetRolePolicy
              - iam:ListAttachedRolePolicies
              - iam:SimulatePrincipalPolicy
            Resource: !GetAtt CrossAccountRole.Arn
          - Sid: InspectAttachedPolicies
            Effect: Allow
            Action:
              - iam:GetPolicy
              - iam:GetPolicyVersion
            Resource: '*'

  KmsDecryptPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: ApplyKmsDecryptPolicy
    Properties:
      ManagedPolicyName: !Sub "infracost-kms-decrypt${RoleSuffix}"
      Path: /
      Description: >-
        Allows the Infracost cross-account role to decrypt S3 export objects
        using the customer-managed KMS key
      Roles: [!Ref CrossAccountRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: InfracostKMSDecrypt
            Effect: Allow
            Action:
              - kms:Decrypt
              - kms:DescribeKey
            Resource: !Ref KmsKeyArn

  # Modeled as up to 4 independent statement pairs (one per extra bucket
  # slot, plus one for the pair of auto-created export buckets) rather than
  # one merged Resource array per access level - CFN has no clean way to
  # splice a variable-length list of ARNs together, and IAM evaluates
  # multiple Allow statements as a union, so this is functionally identical
  # to the Terraform module's single concatenated list.
  S3AccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: HasAnyS3BucketAccess
    Properties:
      ManagedPolicyName: !Sub "infracost-s3-access${RoleSuffix}"
      Path: /
      Description: Infracost S3 read-only policy
      Roles: [!Ref CrossAccountRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - !If
            - HasExtraS3BucketArn1
            - Sid: InfracostS3BucketAccessExtra1
              Effect: Allow
              Action: [s3:GetBucketLocation, s3:ListBucket]
              Resource: !Ref ExtraS3BucketArn1
            - !Ref AWS::NoValue
          - !If
            - HasExtraS3BucketArn1
            - Sid: InfracostS3ObjectAccessExtra1
              Effect: Allow
              Action: [s3:GetObject]
              Resource: !Sub "${ExtraS3BucketArn1}/*"
            - !Ref AWS::NoValue
          - !If
            - HasExtraS3BucketArn2
            - Sid: InfracostS3BucketAccessExtra2
              Effect: Allow
              Action: [s3:GetBucketLocation, s3:ListBucket]
              Resource: !Ref ExtraS3BucketArn2
            - !Ref AWS::NoValue
          - !If
            - HasExtraS3BucketArn2
            - Sid: InfracostS3ObjectAccessExtra2
              Effect: Allow
              Action: [s3:GetObject]
              Resource: !Sub "${ExtraS3BucketArn2}/*"
            - !Ref AWS::NoValue
          - !If
            - HasExtraS3BucketArn3
            - Sid: InfracostS3BucketAccessExtra3
              Effect: Allow
              Action: [s3:GetBucketLocation, s3:ListBucket]
              Resource: !Ref ExtraS3BucketArn3
            - !Ref AWS::NoValue
          - !If
            - HasExtraS3BucketArn3
            - Sid: InfracostS3ObjectAccessExtra3
              Effect: Allow
              Action: [s3:GetObject]
              Resource: !Sub "${ExtraS3BucketArn3}/*"
            - !Ref AWS::NoValue
          - !If
            - EnableDataExports
            - Sid: InfracostS3BucketAccessExports
              Effect: Allow
              Action: [s3:GetBucketLocation, s3:ListBucket]
              Resource:
                - !GetAtt BcmDataExportsBucket.Arn
                - !GetAtt StorageLensDataExportsBucket.Arn
            - !Ref AWS::NoValue
          - !If
            - EnableDataExports
            - Sid: InfracostS3ObjectAccessExports
              Effect: Allow
              Action: [s3:GetObject]
              Resource:
                - !Sub "${BcmDataExportsBucket.Arn}/*"
                - !Sub "${StorageLensDataExportsBucket.Arn}/*"
            - !Ref AWS::NoValue

  # ---------------------------------------------------------------------
  # BCM Data Exports (billing-and-cost-management)
  # ---------------------------------------------------------------------

  # A customer's account may already have this service-linked role from a
  # prior, unrelated setup - CFN's SLR creation (unlike the CLI) fails with
  # an already-exists error in that case. Retain on delete/replace since
  # SLRs are commonly shared across a service's features, not owned by any
  # one consumer. See README for the manual workaround if creation fails.
  BcmDataExportsServiceLinkedRole:
    Type: AWS::IAM::ServiceLinkedRole
    Condition: EnableDataExports
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AWSServiceName: bcm-data-exports.amazonaws.com

  BcmDataExportsBucket:
    Type: AWS::S3::Bucket
    Condition: EnableDataExports
    Properties:
      BucketName: !Sub "infracost-bcm-exports-${AWS::AccountId}"
      BucketEncryption: !If
        - UseKmsForExportBuckets
        - ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: aws:kms
                KMSMasterKeyID: !Ref KmsKeyArn
              BucketKeyEnabled: true
        - !Ref AWS::NoValue
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: intelligent-tiering
            Status: Enabled
            Transitions:
              - TransitionInDays: 0
                StorageClass: INTELLIGENT_TIERING
            ExpirationInDays: 365
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: InfracostModuleVersion
          Value: !FindInMap [ModuleInfo, Version, Value]

  BcmDataExportsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: EnableDataExports
    Properties:
      Bucket: !Ref BcmDataExportsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowBCMDataExportsWrite
            Effect: Allow
            Principal:
              Service:
                - bcm-data-exports.amazonaws.com
                - billingreports.amazonaws.com
            Action: [s3:GetBucketPolicy, s3:PutObject]
            Resource:
              - !GetAtt BcmDataExportsBucket.Arn
              - !Sub "${BcmDataExportsBucket.Arn}/*"
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
          - Sid: DenyNonSSLRequests
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt BcmDataExportsBucket.Arn
              - !Sub "${BcmDataExportsBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # Query column lists (FOCUS 1.2 and Cost Optimization Hub) are copied
  # verbatim from terraform-aws-integration/modules/billing-and-cost-management/main.tf
  BcmDailyCostOptimizationExport:
    Type: AWS::BCMDataExports::Export
    Condition: EnableDataExports
    DependsOn: BcmDataExportsServiceLinkedRole
    Properties:
      Export:
        Name: InfracostDailyCostOptimizationExport
        DataQuery:
          QueryStatement: >-
            SELECT account_id, account_name, recommendation_id, resource_arn,
            region, current_resource_type, recommended_resource_type,
            action_type, current_resource_summary, recommended_resource_summary,
            estimated_monthly_cost_before_discount, estimated_monthly_cost_after_discount,
            estimated_monthly_savings_before_discount, estimated_monthly_savings_after_discount,
            estimated_savings_percentage_before_discount, estimated_savings_percentage_after_discount,
            currency_code, restart_needed, rollback_possible, implementation_effort,
            tags, current_resource_details, recommended_resource_details,
            recommendation_source, recommendation_lookback_period_in_days,
            last_refresh_timestamp FROM COST_OPTIMIZATION_RECOMMENDATIONS
          TableConfigurations:
            COST_OPTIMIZATION_RECOMMENDATIONS:
              INCLUDE_ALL_RECOMMENDATIONS: 'TRUE'
              FILTER: '{}'
        DestinationConfigurations:
          S3Destination:
            S3Region: !Ref AWS::Region
            S3Bucket: !Ref BcmDataExportsBucket
            S3Prefix: ''
            S3OutputConfigurations:
              Overwrite: OVERWRITE_REPORT
              Format: PARQUET
              Compression: PARQUET
              OutputType: CUSTOM
        RefreshCadence:
          Frequency: SYNCHRONOUS
      Tags:
        - Key: InfracostModuleVersion
          Value: !FindInMap [ModuleInfo, Version, Value]

  BcmDailyFocusExport:
    Type: AWS::BCMDataExports::Export
    Condition: EnableDataExports
    DependsOn: BcmDataExportsServiceLinkedRole
    Properties:
      Export:
        Name: InfracostDailyFocusExport
        DataQuery:
          QueryStatement: >-
            SELECT AvailabilityZone, BilledCost, BillingAccountId, BillingAccountName,
            BillingAccountType, BillingCurrency, BillingPeriodEnd, BillingPeriodStart,
            CapacityReservationId, CapacityReservationStatus, ChargeCategory, ChargeClass,
            ChargeDescription, ChargeFrequency, ChargePeriodEnd, ChargePeriodStart,
            CommitmentDiscountCategory, CommitmentDiscountId, CommitmentDiscountName,
            CommitmentDiscountQuantity, CommitmentDiscountType, CommitmentDiscountStatus,
            CommitmentDiscountUnit, ConsumedQuantity, ConsumedUnit, ContractedCost,
            ContractedUnitPrice, EffectiveCost, InvoiceId, InvoiceIssuerName, ListCost,
            ListUnitPrice, PricingCategory, PricingCurrency, PricingCurrencyContractedUnitPrice,
            PricingCurrencyEffectiveCost, PricingCurrencyListUnitPrice, PricingQuantity,
            PricingUnit, ProviderName, PublisherName, RegionId, RegionName, ResourceId,
            ResourceName, ResourceType, ServiceCategory, ServiceName, ServiceSubcategory,
            SkuId, SkuPriceDetails, SkuPriceId, SkuMeter, SubAccountId, SubAccountName,
            SubAccountType, Tags, x_Discounts, x_Operation, x_ServiceCode FROM FOCUS_1_2_AWS
          TableConfigurations:
            FOCUS_1_2_AWS:
              TIME_GRANULARITY: DAILY
        DestinationConfigurations:
          S3Destination:
            S3Region: !Ref AWS::Region
            S3Bucket: !Ref BcmDataExportsBucket
            S3Prefix: ''
            S3OutputConfigurations:
              Overwrite: OVERWRITE_REPORT
              Format: PARQUET
              Compression: PARQUET
              OutputType: CUSTOM
        RefreshCadence:
          Frequency: SYNCHRONOUS
      Tags:
        - Key: InfracostModuleVersion
          Value: !FindInMap [ModuleInfo, Version, Value]

  # ---------------------------------------------------------------------
  # S3 Storage Lens (s3-storage-lens)
  # ---------------------------------------------------------------------

  StorageLensDataExportsBucket:
    Type: AWS::S3::Bucket
    Condition: EnableDataExports
    Properties:
      BucketName: !Sub "infracost-storagelens-exports-${AWS::AccountId}"
      BucketEncryption: !If
        - UseKmsForExportBuckets
        - ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: aws:kms
                KMSMasterKeyID: !Ref KmsKeyArn
              BucketKeyEnabled: true
        - !Ref AWS::NoValue
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: intelligent-tiering
            Status: Enabled
            Transitions:
              - TransitionInDays: 0
                StorageClass: INTELLIGENT_TIERING
            ExpirationInDays: 365
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: InfracostModuleVersion
          Value: !FindInMap [ModuleInfo, Version, Value]

  StorageLensDataExportsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: EnableDataExports
    Properties:
      Bucket: !Ref StorageLensDataExportsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowStorageLensDataExportsWrite
            Effect: Allow
            Principal:
              Service: storage-lens.s3.amazonaws.com
            Action: [s3:PutObject, s3:PutObjectAcl]
            Resource:
              - !GetAtt StorageLensDataExportsBucket.Arn
              - !Sub "${StorageLensDataExportsBucket.Arn}/*"
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
          - Sid: DenyNonSSLRequests
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt StorageLensDataExportsBucket.Arn
              - !Sub "${StorageLensDataExportsBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # The Terraform module's `validate_trusted_access` precondition (requires
  # storage-lens.s3.amazonaws.com in aws_trusted_principals) is ported as
  # the StorageLensRequiresTrustedAccess Rule above, not a Condition here -
  # it's a hard validation failure, not a feature toggle.
  S3StorageLensConfig:
    Type: AWS::S3::StorageLens
    Condition: EnableDataExports
    DependsOn: StorageLensDataExportsBucketPolicy
    Properties:
      StorageLensConfiguration:
        Id: InfracostStorageLensExport
        IsEnabled: true
        AccountLevel:
          ActivityMetrics:
            IsEnabled: true
          AdvancedCostOptimizationMetrics:
            IsEnabled: true
          BucketLevel:
            ActivityMetrics:
              IsEnabled: true
            AdvancedCostOptimizationMetrics:
              IsEnabled: true
        AwsOrg:
          Arn: !Ref OrganizationArn
        DataExport:
          S3BucketDestination:
            AccountId: !Ref AWS::AccountId
            Arn: !GetAtt StorageLensDataExportsBucket.Arn
            Format: Parquet
            OutputSchemaVersion: V_1
      Tags:
        - Key: InfracostModuleVersion
          Value: !FindInMap [ModuleInfo, Version, Value]

  # ---------------------------------------------------------------------
  # Cost Anomaly Detection (cost-anomaly-detection)
  # ---------------------------------------------------------------------

  # Only created when the account doesn't already have a SERVICE-dimension
  # monitor - AWS caps that at one per account (see ExistingAnomalyMonitorArn
  # above), so accounts that already have one (their own, or another tool's)
  # would otherwise fail here with HandlerErrorCode: AlreadyExists.
  CostAnomalyServicesMonitor:
    Type: AWS::CE::AnomalyMonitor
    Condition: CreateAnomalyMonitor
    Properties:
      MonitorName: InfracostServicesMonitor
      MonitorType: DIMENSIONAL
      MonitorDimension: SERVICE
      ResourceTags:
        - Key: InfracostModuleVersion
          Value: !FindInMap [ModuleInfo, Version, Value]

Outputs:
  AccountId:
    Description: The AWS account ID where the stack was provisioned.
    Value: !Ref AWS::AccountId

  RoleArn:
    Description: >-
      The ARN of the Cross-Account Role with IAM read-only permissions.
      Provide this to Infracost.
    Value: !GetAtt CrossAccountRole.Arn

  BillingAndCostManagementExportArn:
    Description: The ARN of the BCM Data Exports export.
    Condition: EnableDataExports
    Value: !GetAtt BcmDailyFocusExport.ExportArn

  BillingAndCostManagementBucketArn:
    Description: The ARN of the S3 bucket used for BCM Data Exports.
    Condition: EnableDataExports
    Value: !GetAtt BcmDataExportsBucket.Arn

  S3StorageLensConfigurationArn:
    Description: The ARN of the S3 Storage Lens configuration.
    Condition: EnableDataExports
    Value: !GetAtt S3StorageLensConfig.StorageLensConfiguration.StorageLensArn

  S3StorageLensBucketArn:
    Description: The ARN of the S3 bucket used for S3 Storage Lens exports.
    Condition: EnableDataExports
    Value: !GetAtt StorageLensDataExportsBucket.Arn

  CostAnomalyDetectionServicesMonitorArn:
    Description: >-
      The ARN of the Cost Anomaly Detection SERVICES monitor - either newly
      created by this stack, or the pre-existing one passed via
      ExistingAnomalyMonitorArn.
    Condition: EnableAnomalyMonitors
    Value: !If
      - CreateAnomalyMonitor
      - !GetAtt CostAnomalyServicesMonitor.MonitorArn
      - !Ref ExistingAnomalyMonitorArn