AWSTemplateFormatVersion: "2010-09-09"
Description: "Session Rating Application"

Parameters:
  ProjectName:
    Type: String
    Default: "session-rating"
    Description: "Name of the project for resource naming"

  DomainName:
    Type: String
    Default: "surveys.awscommunity.eu"
    Description: "Domain name for CORS Allow-Origin header (e.g., https://example.com)"
    AllowedPattern: "^[a-zA-Z0-9][a-zA-Z0-9.-]{0,61}[a-zA-Z0-9]$"
    ConstraintDescription: "Must be a valid domain name (e.g., surveys.awscommunity.eu)"

  LambdaCodeBucket:
    Type: String
    Description: "S3 bucket containing Lambda function zip files"

Resources:
  SessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-sessions"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: sessionId
          AttributeType: S
      KeySchema:
        - AttributeName: sessionId
          KeyType: HASH
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  RatingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-ratings"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: sessionId
          AttributeType: S
        - AttributeName: ratingId
          AttributeType: S
      KeySchema:
        - AttributeName: sessionId
          KeyType: HASH
        - AttributeName: ratingId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: SessionRatingsIndex
          KeySchema:
            - AttributeName: sessionId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  SpeakerTicketsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-speaker-tickets"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ticketId
          AttributeType: S
      KeySchema:
        - AttributeName: ticketId
          KeyType: HASH
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref DomainName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Domain
          Value: !Ref DomainName

  LambdaCodeS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-lambda-code-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-lambda-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: "sts:AssumeRole"
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "dynamodb:GetItem"
                  - "dynamodb:PutItem"
                  - "dynamodb:Query"
                  - "dynamodb:Scan"
                  - "dynamodb:UpdateItem"
                  - "dynamodb:DeleteItem"
                Resource:
                  - !GetAtt SessionsTable.Arn
                  - !GetAtt RatingsTable.Arn
                  - !GetAtt SpeakerTicketsTable.Arn
                  - !Sub "${RatingsTable.Arn}/index/*"
        - PolicyName: S3Access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "s3:GetObject"
                Resource:
                  - !Sub "${LambdaCodeS3Bucket.Arn}/*"
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  GetSessionFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-get-session"
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          SESSIONS_TABLE: !Ref SessionsTable
          ALLOWED_ORIGIN: !Sub "https://${DomainName}"
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: "get-session.zip"
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  SubmitRatingFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-submit-rating"
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          RATINGS_TABLE: !Ref RatingsTable
          ALLOWED_ORIGIN: !Sub "https://${DomainName}"
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: "submit-rating.zip"
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  GetRatingsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-get-ratings"
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          RATINGS_TABLE: !Ref RatingsTable
          SPEAKER_TICKETS_TABLE: !Ref SpeakerTicketsTable
          ALLOWED_ORIGIN: !Sub "https://${DomainName}"
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: "get-ratings.zip"
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  RestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "${ProjectName}-api"
      Description: "Session Rating Application API"
      EndpointConfiguration:
        Types:
          - REGIONAL

  SessionsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: sessions

  SessionResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref SessionsResource
      PathPart: "{sessionId}"

  RateResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: rate

  RatingsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref SessionResource
      PathPart: ratings

  GetSessionMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref SessionResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetSessionFunction.Arn}/invocations"

  SubmitRatingMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref RateResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SubmitRatingFunction.Arn}/invocations"

  GetRatingsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref RatingsResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetRatingsFunction.Arn}/invocations"

  SessionOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref SessionResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          "application/json": '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              "method.response.header.Access-Control-Allow-Headers": "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
              "method.response.header.Access-Control-Allow-Methods": "'GET,OPTIONS'"
              "method.response.header.Access-Control-Allow-Origin": !Sub "'https://${DomainName}'"
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            "method.response.header.Access-Control-Allow-Headers": true
            "method.response.header.Access-Control-Allow-Methods": true
            "method.response.header.Access-Control-Allow-Origin": true

  RateOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref RateResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          "application/json": '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              "method.response.header.Access-Control-Allow-Headers": "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
              "method.response.header.Access-Control-Allow-Methods": "'POST,OPTIONS'"
              "method.response.header.Access-Control-Allow-Origin": !Sub "'https://${DomainName}'"
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            "method.response.header.Access-Control-Allow-Headers": true
            "method.response.header.Access-Control-Allow-Methods": true
            "method.response.header.Access-Control-Allow-Origin": true

  RatingsOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref RatingsResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          "application/json": '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              "method.response.header.Access-Control-Allow-Headers": "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
              "method.response.header.Access-Control-Allow-Methods": "'GET,OPTIONS'"
              "method.response.header.Access-Control-Allow-Origin": !Sub "'https://${DomainName}'"
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            "method.response.header.Access-Control-Allow-Headers": true
            "method.response.header.Access-Control-Allow-Methods": true
            "method.response.header.Access-Control-Allow-Origin": true

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - GetSessionMethod
      - SubmitRatingMethod
      - GetRatingsMethod
      - SessionOptionsMethod
      - RateOptionsMethod
      - RatingsOptionsMethod
    Properties:
      RestApiId: !Ref RestApi
      StageName: prod

  GetSessionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GetSessionFunction
      Action: "lambda:InvokeFunction"
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/*"

  SubmitRatingPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SubmitRatingFunction
      Action: "lambda:InvokeFunction"
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/*"

  GetRatingsPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GetRatingsFunction
      Action: "lambda:InvokeFunction"
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/*"

Outputs:
  WebsiteURL:
    Description: "S3 Website URL"
    Value: !Sub "http://${WebsiteBucket}.s3-website-${AWS::Region}.amazonaws.com"
    Export:
      Name: !Sub "${ProjectName}-website-url"

  CustomDomainURL:
    Description: "Custom Domain URL (configure DNS to point to S3 website)"
    Value: !Sub "https://${DomainName}"
    Export:
      Name: !Sub "${ProjectName}-custom-domain"

  APIEndpoint:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
    Export:
      Name: !Sub "${ProjectName}-api-endpoint"

  AllowedOrigin:
    Description: "Allowed CORS origin domain"
    Value: !Sub "https://${DomainName}"
    Export:
      Name: !Sub "${ProjectName}-allowed-origin"

  SessionsTableName:
    Description: "DynamoDB Sessions Table Name"
    Value: !Ref SessionsTable
    Export:
      Name: !Sub "${ProjectName}-sessions-table"

  RatingsTableName:
    Description: "DynamoDB Ratings Table Name"
    Value: !Ref RatingsTable
    Export:
      Name: !Sub "${ProjectName}-ratings-table"

  SpeakerTicketsTableName:
    Description: "DynamoDB Speaker Tickets Table Name"
    Value: !Ref SpeakerTicketsTable
    Export:
      Name: !Sub "${ProjectName}-speaker-tickets-table"

  WebsiteBucketName:
    Description: "S3 Website Bucket Name"
    Value: !Ref WebsiteBucket
    Export:
      Name: !Sub "${ProjectName}-website-bucket"

  LambdaCodeBucketName:
    Description: "S3 Lambda Code Bucket Name"
    Value: !Ref LambdaCodeS3Bucket
    Export:
      Name: !Sub "${ProjectName}-lambda-code-bucket"

  APIEndpoints:
    Description: "Available API endpoints"
    Value: !Sub |
      GET    https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/prod/sessions/{sessionId}
      POST   https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/prod/rate
      GET    https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/prod/sessions/{sessionId}/ratings?ticketId={ticketId}
      OPTIONS methods are available for all endpoints for CORS preflight requests