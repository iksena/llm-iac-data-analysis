AWSTemplateFormatVersion: '2010-09-09'
Description: EKS-FAIL-DEMO - Parent stack orchestrating VPC + EKS + FIS + RDS + Ec2Postgres

Parameters:
  ProjectName:
    Type: String
    Default: devops-agent-demo
  TemplateBucket:
    Type: String
    Description: S3 bucket containing nested templates (vpc.yaml, eks.yaml, fis.yaml, rds.yaml, ec2-postgres.yaml)
  TemplatePrefix:
    Type: String
    Default: devops-agent-demo
    Description: S3 key prefix where nested templates live
  KubernetesVersion:
    Type: String
    Default: '1.35'
  NodeInstanceType:
    Type: String
    Default: t3.medium
  CreateEcrPullThroughCache:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: |
      Set to 'false' if an ecr-public pull-through cache rule already exists.
      deploy.sh detects this automatically.
  Ec2PostgresInstanceType:
    Type: String
    Default: m5.large
  Ec2PostgresDataVolumeIops:
    Type: Number
    Default: 6000
  Ec2PostgresDataVolumeThroughput:
    Type: Number
    Default: 250

Resources:
  VpcStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub https://${TemplateBucket}.s3.amazonaws.com/${TemplatePrefix}/vpc.yaml
      Parameters:
        ProjectName: !Ref ProjectName

  EksStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: VpcStack
    Properties:
      TemplateURL: !Sub https://${TemplateBucket}.s3.amazonaws.com/${TemplatePrefix}/eks.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        KubernetesVersion: !Ref KubernetesVersion
        NodeInstanceType: !Ref NodeInstanceType
        CreateEcrPullThroughCache: !Ref CreateEcrPullThroughCache
        VpcId: !GetAtt VpcStack.Outputs.VpcId
        PrivateSubnetIds: !GetAtt VpcStack.Outputs.PrivateSubnetIds

  FisStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: EksStack
    Properties:
      TemplateURL: !Sub https://${TemplateBucket}.s3.amazonaws.com/${TemplatePrefix}/fis.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        ClusterName: !GetAtt EksStack.Outputs.ClusterName
        ClusterArn: !GetAtt EksStack.Outputs.ClusterArn
        PrivateSubnetA: !GetAtt VpcStack.Outputs.PrivateSubnetA
        EbsCsiRoleArn: !GetAtt EksStack.Outputs.EbsCsiRoleArn
        EbsCsiRoleName: !GetAtt EksStack.Outputs.EbsCsiRoleName
        AwsAccountId: !Ref AWS::AccountId

  RdsStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: VpcStack
    Properties:
      TemplateURL: !Sub https://${TemplateBucket}.s3.amazonaws.com/${TemplatePrefix}/rds.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        VpcId: !GetAtt VpcStack.Outputs.VpcId
        VpcCidr: !GetAtt VpcStack.Outputs.VpcCidr
        PrivateSubnetIds: !GetAtt VpcStack.Outputs.PrivateSubnetIds

  Ec2PostgresStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: VpcStack
    Properties:
      TemplateURL: !Sub https://${TemplateBucket}.s3.amazonaws.com/${TemplatePrefix}/ec2-postgres.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        VpcId: !GetAtt VpcStack.Outputs.VpcId
        VpcCidr: !GetAtt VpcStack.Outputs.VpcCidr
        PrivateSubnetA: !GetAtt VpcStack.Outputs.PrivateSubnetA
        InstanceType: !Ref Ec2PostgresInstanceType
        DataVolumeIops: !Ref Ec2PostgresDataVolumeIops
        DataVolumeThroughput: !Ref Ec2PostgresDataVolumeThroughput

  # Unified CloudWatch dashboard for the API path (EKS pods -> RDS).
  # Depends on Eks + Rds so both dimensions (ClusterName, DBInstanceId)
  # exist as CFN outputs before the dashboard resource is created.
  DashboardStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: [EksStack, RdsStack]
    Properties:
      TemplateURL: !Sub https://${TemplateBucket}.s3.amazonaws.com/${TemplatePrefix}/dashboard.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        ClusterName: !GetAtt EksStack.Outputs.ClusterName
        RdsInstanceId: !GetAtt RdsStack.Outputs.RdsInstanceId

Outputs:
  ClusterName:
    Value: !GetAtt EksStack.Outputs.ClusterName
  ClusterEndpoint:
    Value: !GetAtt EksStack.Outputs.ClusterEndpoint
  PrivateSubnetA:
    Value: !GetAtt VpcStack.Outputs.PrivateSubnetA
  PrivateSubnetB:
    Value: !GetAtt VpcStack.Outputs.PrivateSubnetB
  PrivateSubnetC:
    Value: !GetAtt VpcStack.Outputs.PrivateSubnetC
  VpcCidr:
    Value: !GetAtt VpcStack.Outputs.VpcCidr
  AzDisruptExperimentId:
    Value: !GetAtt FisStack.Outputs.AzDisruptId
  PodKillExperimentId:
    Value: !GetAtt FisStack.Outputs.PodKillId
  EbsPauseIoExperimentId:
    Value: !GetAtt FisStack.Outputs.EbsPauseIoId
  EbsAttachHangExperimentId:
    Value: !GetAtt FisStack.Outputs.EbsAttachHangId
  RdsEndpoint:
    Value: !GetAtt RdsStack.Outputs.RdsEndpoint
  RdsPort:
    Value: !GetAtt RdsStack.Outputs.RdsPort
  RdsSecurityGroupId:
    Value: !GetAtt RdsStack.Outputs.RdsSecurityGroupId
  RdsInstanceId:
    Value: !GetAtt RdsStack.Outputs.RdsInstanceId
  Ec2PostgresInstanceId:
    Value: !GetAtt Ec2PostgresStack.Outputs.Ec2InstanceId
  Ec2PostgresPrivateIp:
    Value: !GetAtt Ec2PostgresStack.Outputs.Ec2PrivateIp
  Ec2PostgresDataVolumeId:
    Value: !GetAtt Ec2PostgresStack.Outputs.DataVolumeId
  Ec2PostgresDashboardUrl:
    Value: !GetAtt Ec2PostgresStack.Outputs.DashboardUrl
  Ec2PgLoadgenRoleArn:
    Value: !GetAtt EksStack.Outputs.Ec2PgLoadgenRoleArn
  ApiRdsDashboardUrl:
    Value: !GetAtt DashboardStack.Outputs.DashboardUrl