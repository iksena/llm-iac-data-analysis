AWSTemplateFormatVersion: "2010-09-09"
Parameters:
  StageName:
    Type: String
    Default: dev
    Description: Name of the API Gateway stage.
  ApiKeyName:
    Type: String
    Default: email-apikey
    Description: Name for the API key.
Resources:
  EmailApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: EmailSubmissionApi
      Description: REST API to submit emails via SES
  EmailModel:
    Type: AWS::ApiGateway::Model
    Properties:
      RestApiId: !Ref EmailApi
      ContentType: application/json
      Name: EmailSubmissionModel
      Schema:
        type: object
        required:
          - to
          - from
          - html
          - text
        properties:
          to:
            type: array
            items:
              type: string
            minItems: 1
          from:
            type: string
            format: email
          subject:
            type: string
          html:
            type: string
          text:
            type: string
          cc:
            type: array
            items:
              type: string
          bcc:
            type: array
            items:
              type: string
  EmailRequestValidator:
    Type: AWS::ApiGateway::RequestValidator
    Properties:
      RestApiId: !Ref EmailApi
      Name: EmailBodyValidator
      ValidateRequestBody: true
      ValidateRequestParameters: false
  EmailResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref EmailApi
      ParentId: !GetAtt EmailApi.RootResourceId
      PathPart: email
  ApiGatewaySESRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ApiGatewaySESSendEmail
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: "*"
  EmailMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref EmailApi
      ResourceId: !Ref EmailResource
      HttpMethod: POST
      AuthorizationType: NONE
      ApiKeyRequired: true
      RequestValidatorId: !Ref EmailRequestValidator
      RequestModels:
        application/json: !Ref EmailModel
      Integration:
        Type: AWS
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:ses:action/SendEmail"
        Credentials: !GetAtt ApiGatewaySESRole.Arn
        RequestTemplates:
          application/json: |
            Action=SendEmail&Source=$util.urlEncode($input.path('from'))
            #foreach($addr in $input.path('to'))
            &Destination.ToAddresses.member.$foreach.count=$util.urlEncode($addr)
            #end
            #if($input.path('cc') && $input.path('cc').size() > 0)
              #foreach($addr in $input.path('cc'))
              &Destination.CcAddresses.member.$foreach.count=$util.urlEncode($addr)
              #end
            #end
            #if($input.path('bcc') && $input.path('bcc').size() > 0)
              #foreach($addr in $input.path('bcc'))
              &Destination.BccAddresses.member.$foreach.count=$util.urlEncode($addr)
              #end
            #end
            #if($input.path('subject') && $input.path('subject') != "")
            &Message.Subject.Data=$util.urlEncode($input.path('subject'))
            #end
            &Message.Body.Html.Data=$util.urlEncode($input.path('html'))
            &Message.Body.Text.Data=$util.urlEncode($input.path('text'))
        IntegrationResponses:
          - StatusCode: 200
            SelectionPattern: ""
            ResponseTemplates:
              application/json: '{"message":"Email sent successfully"}'
      MethodResponses:
        - StatusCode: 200
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - EmailMethod
      - EmailModel
      - EmailRequestValidator
    Properties:
      RestApiId: !Ref EmailApi
  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      StageName: !Ref StageName
      RestApiId: !Ref EmailApi
      DeploymentId: !Ref ApiDeployment
  UsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn:
      - ApiStage
    Properties:
      ApiStages:
        - ApiId: !Ref EmailApi
          Stage: !Ref StageName
      Throttle:
        BurstLimit: 1000
        RateLimit: 500
      Quota:
        Limit: 10000
        Period: MONTH
  ApiKey:
    Type: AWS::ApiGateway::ApiKey
    DependsOn:
      - ApiStage
    Properties:
      Name: !Ref ApiKeyName
      Enabled: true
      StageKeys:
        - RestApiId: !Ref EmailApi
          StageName: !Ref StageName
  UsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref ApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref UsagePlan
Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${EmailApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/email"
  ApiKeyId:
    Description: ID of the created API key
    Value: !Ref ApiKey
  UsagePlanId:
    Description: ID of the usage plan
    Value: !Ref UsagePlan