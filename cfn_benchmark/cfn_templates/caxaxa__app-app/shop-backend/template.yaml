        - DynamoDBCrudPolicy: { TableName: !Ref ConfigsTable }
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref GoogleCalendarApi
            Path: /calendar/status
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

  GoogleCalendarRead:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
