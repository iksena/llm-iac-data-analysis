AWSTemplateFormatVersion: '2010-09-09'
Description: 'SAA Lab 02 - Application Load Balancer e Auto Scaling Group em duas AZs'

Parameters:
  ProjectName:
    Type: String
    Default: saa-lab-02
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small]
  DesiredCapacity:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 4
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-vpc'}, {Key: Project, Value: saa-c03-intensive}, {Key: Lab, Value: '02'}, {Key: ManagedBy, Value: CloudFormation}]
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-igw'}, {Key: Lab, Value: '02'}]
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: {VpcId: !Ref VPC, InternetGatewayId: !Ref InternetGateway}
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.20.0.0/24
      MapPublicIpOnLaunch: true
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-public-a'}, {Key: Lab, Value: '02'}]
  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.20.1.0/24
      MapPublicIpOnLaunch: true
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-public-b'}, {Key: Lab, Value: '02'}]
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-public-rt'}, {Key: Lab, Value: '02'}]
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties: {RouteTableId: !Ref PublicRouteTable, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref InternetGateway}
  RouteAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicSubnetA, RouteTableId: !Ref PublicRouteTable}
  RouteAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicSubnetB, RouteTableId: !Ref PublicRouteTable}

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTP publico para o ALB
      VpcId: !Ref VPC
      SecurityGroupIngress: [{IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: HTTP demo}]
      SecurityGroupEgress: [{IpProtocol: '-1', CidrIp: 0.0.0.0/0}]
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-alb-sg'}, {Key: Lab, Value: '02'}]
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTP somente a partir do ALB
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
          Description: ALB para instancias
      SecurityGroupEgress: [{IpProtocol: '-1', CidrIp: 0.0.0.0/0}]
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-instance-sg'}, {Key: Lab, Value: '02'}]

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-alb'}, {Key: Lab, Value: '02'}]
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VPC
      Port: 80
      Protocol: HTTP
      TargetType: instance
      HealthCheckPath: /health
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      HealthCheckIntervalSeconds: 15
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-tg'}, {Key: Lab, Value: '02'}]
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions: [{Type: forward, TargetGroupArn: !Ref TargetGroup}]

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref InstanceType
        SecurityGroupIds: [!Ref InstanceSecurityGroup]
        MetadataOptions: {HttpEndpoint: enabled, HttpTokens: required}
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs: {VolumeSize: 8, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true}
        UserData:
          Fn::Base64: |
            #!/bin/bash
            set -euxo pipefail
            dnf install -y nginx
            INSTANCE_ID=$(TOKEN=$(curl -sS -X PUT -H 'X-aws-ec2-metadata-token-ttl-seconds: 60' http://169.254.169.254/latest/api/token); curl -sS -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-id)
            echo "<h1>SAA Lab 02</h1><p>Instancia: $INSTANCE_ID</p>" > /usr/share/nginx/html/index.html
            echo ok > /usr/share/nginx/html/health
            systemctl enable --now nginx
        TagSpecifications:
          - ResourceType: instance
            Tags: [{Key: Name, Value: !Sub '${ProjectName}-web'}, {Key: Project, Value: saa-c03-intensive}, {Key: Lab, Value: '02'}, {Key: ManagedBy, Value: CloudFormation}]
          - ResourceType: volume
            Tags: [{Key: Project, Value: saa-c03-intensive}, {Key: Lab, Value: '02'}]
  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn: Listener
    Properties:
      VPCZoneIdentifier: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      MinSize: '2'
      MaxSize: '4'
      DesiredCapacity: !Ref DesiredCapacity
      HealthCheckType: ELB
      HealthCheckGracePeriod: 180
      TargetGroupARNs: [!Ref TargetGroup]
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      Tags:
        - {Key: Project, Value: saa-c03-intensive, PropagateAtLaunch: true}
        - {Key: Lab, Value: '02', PropagateAtLaunch: true}
  CpuTargetTrackingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref AutoScalingGroup
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification: {PredefinedMetricType: ASGAverageCPUUtilization}
        TargetValue: 60

Outputs:
  ApplicationUrl: {Description: URL HTTP do ALB, Value: !Sub 'http://${LoadBalancer.DNSName}'}
  LoadBalancerDnsName: {Value: !GetAtt LoadBalancer.DNSName}
  AutoScalingGroupName: {Value: !Ref AutoScalingGroup}
  TargetGroupArn: {Value: !Ref TargetGroup}