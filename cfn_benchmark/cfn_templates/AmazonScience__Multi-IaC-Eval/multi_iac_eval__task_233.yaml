AWSTemplateFormatVersion: "2010-09-09"

Description: Demonstrate using the Fn::ForEach function to create multiple buckets and outputs for each one, and add CloudWatch alarms for each bucket

Transform: AWS::LanguageExtensions

Resources:
  Fn::ForEach::Buckets:
    - Identifier
    - - A
      - B
      - C
    - S3Bucket${Identifier}:
        Type: AWS::S3::Bucket
        Properties:
          BucketEncryption:
            ServerSideEncryptionConfiguration:
              - ServerSideEncryptionByDefault:
                  SSEAlgorithm: AES256
          PublicAccessBlockConfiguration:
            BlockPublicAcls: true
            BlockPublicPolicy: true
            IgnorePublicAcls: true
            RestrictPublicBuckets: true
        DeletionPolicy: Retain
        UpdateReplacePolicy: Retain

  Fn::ForEach::Alarms:
    - Identifier
    - - A
      - B
      - C
    - S3BucketAlarm${Identifier}:
        Type: AWS::CloudWatch::Alarm
        Properties:
          AlarmDescription: Alarm for when the bucket ${Identifier} has more than 1000 objects
          MetricName: NumberOfObjects
          Namespace: AWS/S3
          Statistic: Maximum
          Dimensions:
            - Name: BucketName
              Value: !Ref S3Bucket${Identifier}
          Period: 300
          EvaluationPeriods: 1
          Threshold: 1000
          ComparisonOperator: GreaterThanThreshold
          AlarmActions:
            - !Ref SomeSNSTopic # Assuming an SNS topic is defined elsewhere

Outputs:
  Fn::ForEach::BucketOutputs:
    - Identifier
    - - A
      - B
      - C
    - Fn::ForEach::GetAttLoop:
        - Property
        - - Arn
        - S3Bucket${Identifier}${Property}:
            Value: !GetAtt
              - !Sub S3Bucket${Identifier}
              - !Ref Property