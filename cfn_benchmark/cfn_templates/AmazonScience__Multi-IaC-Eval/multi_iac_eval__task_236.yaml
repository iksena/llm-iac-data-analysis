Description: |
  Create a CloudTrail trail to log events to a specified bucket and enable CloudWatch alarms for specific events

Parameters:
  BucketName:
    Type: String

Resources:

  # A CloudTrail trail
  Trail:
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_35
      guard:
        SuppressedRules:
          - CLOUD_TRAIL_ENCRYPTION_ENABLED
          - CLOUD_TRAIL_CLOUD_WATCH_LOGS_ENABLED
          - CLOUDTRAIL_S3_DATAEVENTS_ENABLED
    Type: AWS::CloudTrail::Trail
    Properties:
      S3BucketName: !Ref BucketName
      IsLogging: true
      IsMultiRegionTrail: true
      EnableLogFileValidation: true
      # New property for CloudWatch alarms
      CloudWatchLogsLogGroupArn: !GetAtt CloudWatchLogsLogGroup.Arn
      CloudWatchLogsRoleArn: !GetAtt CloudWatchLogsRole.Arn

  # A CloudWatch Logs Log Group
  CloudWatchLogsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: {}

  # A role that CloudTrail can assume to write to the CloudWatch Logs log group
  CloudWatchLogsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: cloudwatch-logs-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt CloudWatchLogsLogGroup.Arn

Outputs:
  ARN:
    Description: The trail ARN
    Value: !GetAtt Trail.Arn