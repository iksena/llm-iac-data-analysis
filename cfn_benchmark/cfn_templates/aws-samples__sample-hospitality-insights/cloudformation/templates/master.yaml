AWSTemplateFormatVersion: '2010-09-09'
Description: 'Master Stack - Hospitality Insights - Deploys all nested stacks'

Parameters:
  Environment:
    Type: String
    Default: prod
    Description: Environment name

  ProjectName:
    Type: String
    Default: hospitality-insights
    Description: Project name

  ProjectTag:
    Type: String
    Default: hospitality-insights
    Description: Project tag for all resources

  DataRetentionDays:
    Type: Number
    Default: 90
    Description: Data retention in days

  SessionTimeoutHours:
    Type: Number
    Default: 24
    Description: User session timeout in hours

  TemplatesBucketName:
    Type: String
    Description: S3 bucket containing nested CloudFormation templates

  TemplatesBucketPrefix:
    Type: String
    Default: templates
    Description: S3 prefix for templates

  TargetCompany:
    Type: String
    Default: AnyCompany
    Description: Replacement company name for demo data scrubbing

  LoginUrl:
    Type: String
    Default: ''
    Description: Login URL shown in Cognito invitation emails (defaults to CloudFront domain if blank)

  SSOProvider:
    Type: String
    Default: ''
    Description: Name of the federated identity provider in Cognito (leave empty to disable SSO)

  CognitoDomainPrefix:
    Type: String
    Default: ''
    Description: Cognito hosted UI domain prefix (leave empty to skip)

Resources:
  VPCStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${TemplatesBucketName}.s3.amazonaws.com/${TemplatesBucketPrefix}/vpc.yaml'
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        ProjectTag: !Ref ProjectTag
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref Environment

  FoundationStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${TemplatesBucketName}.s3.amazonaws.com/${TemplatesBucketPrefix}/foundation.yaml'
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        ProjectTag: !Ref ProjectTag
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref Environment

  DataStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: FoundationStack
    Properties:
      TemplateURL: !Sub 'https://${TemplatesBucketName}.s3.amazonaws.com/${TemplatesBucketPrefix}/data.yaml'
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        ProjectTag: !Ref ProjectTag
        DataRetentionDays: !Ref DataRetentionDays
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref Environment

  AuthStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: FoundationStack
    Properties:
      TemplateURL: !Sub 'https://${TemplatesBucketName}.s3.amazonaws.com/${TemplatesBucketPrefix}/auth.yaml'
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        ProjectTag: !Ref ProjectTag
        SessionTimeoutHours: !Ref SessionTimeoutHours
        LoginUrl: !Ref LoginUrl
        SSOProvider: !Ref SSOProvider
        CognitoDomainPrefix: !Ref CognitoDomainPrefix
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref Environment

  BackendStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - FoundationStack
      - DataStack
      - AuthStack
    Properties:
      TemplateURL: !Sub 'https://${TemplatesBucketName}.s3.amazonaws.com/${TemplatesBucketPrefix}/backend.yaml'
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        ProjectTag: !Ref ProjectTag
        UserPoolId: !GetAtt AuthStack.Outputs.UserPoolId
        UserPoolClientId: !GetAtt AuthStack.Outputs.UserPoolClientId
        RawPostsStreamArn: !GetAtt DataStack.Outputs.RawPostsTableStreamArn
        AnalysisResultsStreamArn: !GetAtt DataStack.Outputs.AnalysisResultsTableStreamArn
        TargetCompany: !Ref TargetCompany
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref Environment

  FrontendStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: BackendStack
    Properties:
      TemplateURL: !Sub 'https://${TemplatesBucketName}.s3.amazonaws.com/${TemplatesBucketPrefix}/frontend.yaml'
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        ProjectTag: !Ref ProjectTag
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref Environment

  MonitoringStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: BackendStack
    Properties:
      TemplateURL: !Sub 'https://${TemplatesBucketName}.s3.amazonaws.com/${TemplatesBucketPrefix}/monitoring.yaml'
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        ProjectTag: !Ref ProjectTag
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref Environment

Outputs:
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !GetAtt AuthStack.Outputs.UserPoolId

  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !GetAtt AuthStack.Outputs.UserPoolClientId

  RestAPIEndpoint:
    Description: API Gateway URL
    Value: !GetAtt BackendStack.Outputs.RestAPIEndpoint

  FrontendBucketName:
    Description: S3 bucket for frontend
    Value: !GetAtt FrontendStack.Outputs.FrontendBucketName

  CloudFrontDistributionId:
    Description: CloudFront distribution ID
    Value: !GetAtt FrontendStack.Outputs.CloudFrontDistributionId

  CloudFrontDomainName:
    Description: CloudFront domain name
    Value: !GetAtt FrontendStack.Outputs.CloudFrontDistributionDomainName

  WebsiteURL:
    Description: Website URL
    Value: !GetAtt FrontendStack.Outputs.WebsiteURL