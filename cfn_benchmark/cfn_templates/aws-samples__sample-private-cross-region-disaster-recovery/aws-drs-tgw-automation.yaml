  StartExecution:
    Type: AWS::Lambda::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "VPC not required"
    Properties:
      FunctionName: start-automation
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt StartAutomationRole.Arn
      Timeout: 300
      MemorySize: 128
      ReservedConcurrentExecutions: 5
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref StepFunction
      Code:
        ZipFile: |
          import boto3
          import json
          import os
          import time
          import urllib3

          http = urllib3.PoolManager()
          sfn = boto3.client("stepfunctions")
          SF_ARN = os.environ["STATE_MACHINE_ARN"]

          def send_cfn_response(event, context, status, data):
              response_body = {
                  "Status": status,
                  "Reason": f"See CloudWatch Log Stream: {context.log_stream_name}",
                  "PhysicalResourceId": context.log_stream_name,
                  "StackId": event["StackId"],
                  "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"],
                  "Data": data,
              }
              encoded = json.dumps(response_body).encode("utf-8")
              headers = {"Content-Type": "", "Content-Length": str(len(encoded))}
              http.request("PUT", event["ResponseURL"], body=encoded, headers=headers)

          def lambda_handler(event, context):
              print("CFN event:", json.dumps(event))
              req = event.get("RequestType")
              if req not in ("Create", "Update", "Delete"):
                  return send_cfn_response(event, context, "SUCCESS", {})

              try:
                  # start the state machine
                  resp = sfn.start_execution(
                      stateMachineArn=SF_ARN,
                      input=json.dumps({"RequestType": req})
                  )
                  exe_arn = resp["executionArn"]

                  # poll until done
                  while True:
                      desc = sfn.describe_execution(executionArn=exe_arn)
                      status = desc["status"]
                      print("SF status:", status)
                      if status in ("SUCCEEDED", "FAILED", "TIMED_OUT", "ABORTED"):
                          break
                      time.sleep(15)

                  if status == "SUCCEEDED":
                      send_cfn_response(event, context, "SUCCESS", {"Message": "Done"})
                  else:
                      send_cfn_response(event, context, "FAILED", {"Message": f"Ended {status}"})

              except Exception as e:
                  print("Error:", e)
                  send_cfn_response(event, context, "FAILED", {"Error": str(e)})

  StartAutomation:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt StartExecution.Arn

Outputs:
  StateMachineArn:
    Description: ARN of the automation Step Function
    Value: !Ref StepFunction