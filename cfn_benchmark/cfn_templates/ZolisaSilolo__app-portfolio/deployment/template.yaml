AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Portfolio React Application Backend - Secure & Cost-Optimized

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Environment name

  NvidiaSecretName:
    Type: String
    Default: portfolio-nvidia-api-key
    Description: Name of the secret in AWS Secrets Manager containing the NVIDIA API key

Globals:
  Function:
    Timeout: 30
    Runtime: python3.12
    MemorySize: 256
    Environment:
      Variables:
        NVIDIA_SECRET_NAME: !Ref NvidiaSecretName
        ENVIRONMENT: !Ref Environment
        SESSIONS_TABLE: !Ref SessionsTable
        USER_POOL_ID: !Ref UserPool
        USER_POOL_CLIENT_ID: !Ref UserPoolClient
    Tags:
      Project: Portfolio
      Environment: !Ref Environment

Resources:
  # Cognito User Pool for lightweight authentication
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub portfolio-users-${Environment}
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: false
          RequireLowercase: false
          RequireNumbers: false
          RequireSymbols: false
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
      UserPoolTags:
        Project: Portfolio
        Environment: !Ref Environment

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub portfolio-client-${Environment}
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30

  # DynamoDB table for session management and rate limiting
  SessionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub portfolio-sessions-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: sessionId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: sessionId
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      GlobalSecondaryIndexes:
        - IndexName: SessionIndex
          KeySchema:
            - AttributeName: sessionId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: Portfolio
        - Key: Environment
          Value: !Ref Environment

  # API Gateway with Cognito authorizer and security headers
  PortfolioApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Environment
      TracingEnabled: true
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingRateLimit: 50
          ThrottlingBurstLimit: 100
      AccessLogSetting:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","caller":"$context.identity.caller","user":"$context.identity.user","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","resourcePath":"$context.resourcePath","status":"$context.status","protocol":"$context.protocol","responseLength":"$context.responseLength"}'
      Cors:
        AllowMethods: '''GET,POST,OPTIONS'''
        AllowHeaders: '''Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'''
        AllowOrigin: '''*'''
      Auth:
        Authorizers:
          CognitoAuth:
            UserPoolArn: !GetAtt UserPool.Arn
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              X-Content-Type-Options: '''nosniff'''
              X-Frame-Options: '''DENY'''
              X-XSS-Protection: '''1; mode=block'''
              Strict-Transport-Security: '''max-age=31536000; includeSubDomains'''
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              X-Content-Type-Options: '''nosniff'''
              X-Frame-Options: '''DENY'''
              X-XSS-Protection: '''1; mode=block'''
              Strict-Transport-Security: '''max-age=31536000; includeSubDomains'''

  # Auth Function for guest access
  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/session-manager/
      Handler: lambda_function.lambda_handler
      MemorySize: 128
      Timeout: 10
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminSetUserPassword
                - cognito-idp:AdminInitiateAuth
              Resource: !GetAtt UserPool.Arn
      Events:
        GuestAuth:
          Type: Api
          Properties:
            RestApiId: !Ref PortfolioApi
            Path: /auth/guest
            Method: post
        OptionsAuth:
          Type: Api
          Properties:
            RestApiId: !Ref PortfolioApi
            Path: /auth/guest
            Method: options

  # Portfolio Data Function - Cost Optimized
  PortfolioFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/portfolio-api/
      Handler: lambda_function.lambda_handler
      MemorySize: 128
      Timeout: 10
      Events:
        GetProjects:
          Type: Api
          Properties:
            RestApiId: !Ref PortfolioApi
            Path: /portfolio
            Method: get
        OptionsProjects:
          Type: Api
          Properties:
            RestApiId: !Ref PortfolioApi
            Path: /portfolio
            Method: options

  # Chatbot Function - Secure & Optimized with Auth
  ChatbotFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/chatbot-api/
      Handler: lambda_function.lambda_handler
      MemorySize: 512
      Timeout: 30
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Sub arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${NvidiaSecretName}*
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
      Events:
        PostChat:
          Type: Api
          Properties:
            RestApiId: !Ref PortfolioApi
            Path: /chat
            Method: post
        OptionsChat:
          Type: Api
          Properties:
            RestApiId: !Ref PortfolioApi
            Path: /chat
            Method: options

  # Session Manager Function for DynamoDB session management and analytics
  SessionManagerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/session-manager/
      Handler: lambda_function.lambda_handler
      MemorySize: 256
      Timeout: 30
      Environment:
        Variables:
          SESSION_TABLE: !Ref SessionsTable
          ANALYTICS_TABLE: !Ref AnalyticsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SessionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AnalyticsTable
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*
      Events:
        SessionApi:
          Type: Api
          Properties:
            RestApiId: !Ref PortfolioApi
            Path: /session/{proxy+}
            Method: ANY

  # Analytics Table for user behavior tracking
  AnalyticsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${AWS::StackName}-analytics
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UserIdTimestampIndex
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: Portfolio
        - Key: Environment
          Value: !Ref Environment

  # CloudWatch Log Groups with retention for cost control
  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/${AWS::StackName}-api-access-logs
      RetentionInDays: 14

  AuthFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AuthFunction}
      RetentionInDays: 7

  PortfolioFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${PortfolioFunction}
      RetentionInDays: 7

  ChatbotFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ChatbotFunction}
      RetentionInDays: 14

Outputs:
  PortfolioApiUrl:
    Description: API Gateway endpoint URL for Portfolio API
    Value: !Sub https://${PortfolioApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/
    Export:
      Name: !Sub ${AWS::StackName}-ApiUrl

  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
    Export:
      Name: !Sub ${AWS::StackName}-UserPoolId

  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient
    Export:
      Name: !Sub ${AWS::StackName}-UserPoolClientId

  SessionsTableName:
    Description: DynamoDB Sessions Table Name
    Value: !Ref SessionsTable
    Export:
      Name: !Sub ${AWS::StackName}-SessionsTable

  PortfolioFunction:
    Description: Portfolio Lambda Function ARN
    Value: !GetAtt PortfolioFunction.Arn

  ChatbotFunction:
    Description: Chatbot Lambda Function ARN
    Value: !GetAtt ChatbotFunction.Arn

  AuthFunction:
    Description: Auth Lambda Function ARN
    Value: !GetAtt AuthFunction.Arn

  ApiGatewayId:
    Description: API Gateway ID
    Value: !Ref PortfolioApi
    Export:
      Name: !Sub ${AWS::StackName}-ApiId