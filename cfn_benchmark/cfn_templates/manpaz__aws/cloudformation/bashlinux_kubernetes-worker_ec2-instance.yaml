---
# Bashlinux::Kubernetes Worker::EC2 Instance
#
#   Cloudformation template to deploy a Kubernetes worker on an EC2 instance
#   in a private VPC.
#
#   Manuel F Martinez
#   Bashlinux
#   Los Angeles, CA
#
AWSTemplateFormatVersion: "2010-09-09"
Description: EC2 Kubernetes Worker instance template

###############################################################################
Parameters:

  AWSKubernetesAMI:
    Description: Automatically select the lates AL2023 AMI using the SSM parameter
    Type: "AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>"
    Default: "/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64"

  Environment:
    Description: Kubernetes Worker environment
    Type: String
    MinLength: "1"
    MaxLength: "20"
    Default: staging
    AllowedValues: [ "prod", "staging" ]
    ConstraintDescription: Environment name can only contain "prod" or "staging".

  EC2KubernetesWorkerAlbRulePriority:
    Type: Number
    MinValue: "02"
    MaxValue: "200"
    Description: Unique priority for this listener rule
    ConstraintDescription: >
      The rule number must be an integer value in between 2 to 200

  EC2KubernetesWorkerCount:
    Description: EC2 Kubernetes number of workers
    Type: Number
    MinValue: "01"
    MaxValue: "16"
    ConstraintDescription: >
      EC2 Kubernetes workers count must be an integer value in between 1 to 16

  EC2KubernetesWorkerInstanceSize:
    Description: EC2 Kubernetes Worker instance size for Kubernetes node
    Type: String
    MinLength: "1"
    MaxLength: "32"
    Default: t3a.small
    AllowedValues:
    - t3a.micro
    - t3a.small
    - t3a.medium
    - t3a.large
    - c6a.large
    - c6a.xlarge
    - c6a.2xlarge
    - c6a.4xlarge
    - m6a.large
    - m6a.xlarge
    - m6a.2xlarge
    - m6a.4xlarge
    - r6a.large
    - r6a.xlarge
    - r6a.2xlarge
    - r6a.4xlarge
    ConstraintDescription: >
      EC2 instance size must be micro, small, medium, or large of the "t3a"
      type or large, xlarge, 2xlarge, or 4xlarge of the "c6a", "m6a", or "r6a" type.

  EC2KubernetesWorkerVolumeSize:
    Description: EC2 Kubernetes Worker volume size in GBs for Kubernetes storage
    Type: Number
    MinValue: "1"
    MaxValue: "4000"
    Default: "20"
    ConstraintDescription: >
      EC2 Kubernetes volume size must be an integer value in between 1 to 4000

  KubernetesVersion:
    Description: Kubernetes Version
    Type: String
    MinLength: "3"
    MaxLength: "5"
    Default: "1.32"
    AllowedValues:
      - "1.33"
      - "1.32"
      - "1.31"

  Organization:
    Description: Organization or Customer name
    Type: String
    MinLength: "1"
    MaxLength: "32"
    Default: bashlinux
    AllowedPattern: "[a-zA-Z0-9\\-]*"
    ConstraintDescription: >
      Name of the organization must contains only letters, numbers and hyphens

###############################################################################
Resources:

  Ec2KubernetesAlbTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      HealthCheckPath: /healtz
      Port: 80
      Name: !Sub "${Organization}-${Environment}-targetgroup"
      Protocol: HTTP
      VpcId: !ImportValue
        "Fn::Sub": "bashlinux-${Environment}-VpcId"
      Tags:
      - Key: Name
        Value: !Sub "${Organization}-${Environment}-targetgroup"
      - Key: bashlinux:organization-name
        Value: !Ref Organization
      - Key: bashlinux:environment-name
        Value: !Ref Environment
      - Key: bashlinux:application-id
        Value: !Ref AWS::StackName
      - Key: bashlinux:can-delete
        Value: "false"

  Ec2KubernetesAsgLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "${Organization}-${Environment}-kubernetes-worker"
      LaunchTemplateData:
        BlockDeviceMappings:
        - DeviceName: "/dev/xvda"
          Ebs:
            VolumeSize: !Ref EC2KubernetesWorkerVolumeSize
            DeleteOnTermination: true
            VolumeType: gp3
            Encrypted: true
            KmsKeyId: !Sub "alias/${Organization}/ec2/${Environment}"
        CreditSpecification:
          CpuCredits: Unlimited
        IamInstanceProfile:
          Arn: !ImportValue
            "Fn::Sub": "${Organization}-${Environment}-worker-KubernetesEc2InstanceProfileArn"
        ImageId: !Ref AWSKubernetesAMI
        InstanceType: !Ref EC2KubernetesWorkerInstanceSize
        KeyName: !Sub "bashlinux-${Environment}"
        Monitoring:
          Enabled: false
        NetworkInterfaces:
        - AssociatePublicIpAddress: false
          DeviceIndex: "0"
          Groups:
            - !ImportValue
              "Fn::Sub": "${Organization}-${Environment}-worker-Ec2KubernetesSecurityGroupId"
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -xe

            # Set kubelet defaults
            cat <<EOF > /etc/default/kubelet
            KUBELET_EXTRA_ARGS=--node-ip=$(hostname -I | awk '{print $1}') --resolv-conf=/run/systemd/resolve/resolv.conf
            EOF

            # Setup kubernetes repository
            cat <<EOF > /etc/yum.repos.d/kubernetes.repo
            [kubernetes]
            name=Kubernetes
            baseurl=https://pkgs.k8s.io/core:/stable:/v${KubernetesVersion}/rpm/
            enabled=1
            gpgcheck=1
            gpgkey=https://pkgs.k8s.io/core:/stable:/v${KubernetesVersion}/rpm/repodata/repomd.xml.key
            EOF

            # Setup CRI-O repository
            cat <<EOF > /etc/yum.repos.d/cri-o.repo
            [cri-o]
            name=CRI-O
            baseurl=https://download.opensuse.org/repositories/isv:/cri-o:/stable:/v${KubernetesVersion}/rpm/
            enabled=1
            gpgcheck=1
            gpgkey=https://download.opensuse.org/repositories/isv:/cri-o:/stable:/v${KubernetesVersion}/rpm/repodata/repomd.xml.key
            EOF

            # Install dependencies
            dnf -y install container-selinux

            # Install kubeadm
            dnf -y install cri-o kubelet kubeadm

            # Enable and start services
            systemctl enable sshd kubelet crio
            systemctl start sshd kubelet crio

            # Bootstrap preparation
            swapoff -a
            modprobe br_netfilter
            sysctl -w net.ipv4.ip_forward=1

            # Join the cluster
            JOIN_CMD=$(aws ssm get-parameter \
                        --name "/${Organization}/${Environment}/kubernetes/join-command" \
                        --region ${AWS::Region} \
                        --query Parameter.Value \
                        --output text)
            $JOIN_CMD --cri-socket /var/run/crio/crio.sock
      TagSpecifications:
        - ResourceType: launch-template
          Tags:
          - Key: Name
            Value: !Sub "${Organization}-${Environment}-kubernetes-worker"
          - Key: bashlinux:network-visibility
            Value: private
          - Key: bashlinux:organization-name
            Value: !Ref Organization
          - Key: bashlinux:environment-name
            Value: !Ref Environment
          - Key: bashlinux:application-role
            Value: kubernetes-worker
          - Key: bashlinux:application-id
            Value: !Ref AWS::StackName

  Ec2KubernetesAsg:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref Ec2KubernetesAsgLaunchTemplate
        Version: !GetAtt Ec2KubernetesAsgLaunchTemplate.LatestVersionNumber
      MaxSize: !Ref EC2KubernetesWorkerCount
      MinSize: !Ref EC2KubernetesWorkerCount
      TargetGroupARNs:
        - !Ref Ec2KubernetesAlbTargetGroup
      VPCZoneIdentifier: !Split
        - ","
        - !ImportValue
            "Fn::Sub": "${Organization}-${Environment}-VpcOrgAppSubnetId"
      Tags:
        - Key: bashlinux:network-visibility
          Value: private
          PropagateAtLaunch: true
        - Key: bashlinux:organization-name
          Value: !Ref Organization
          PropagateAtLaunch: true
        - Key: bashlinux:environment-name
          Value: !Ref Environment
          PropagateAtLaunch: true
        - Key: bashlinux:application-role
          Value: kubernetes-worker
          PropagateAtLaunch: true
        - Key: bashlinux:application-id
          Value: !Ref AWS::StackName
          PropagateAtLaunch: true
        - Key: Name
          Value: !Sub "${Organization}-${Environment}-kubernetes-worker"
          PropagateAtLaunch: true

  Ec2KubernetesAlbListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      Actions:
        - Type: forward
          TargetGroupArn: !Ref Ec2KubernetesAlbTargetGroup
      Conditions:
        - Field: host-header
          HostHeaderConfig:
            Values:
              - !Join
                - ""
                - - "*."
                  - !ImportValue
                      "Fn::Sub": "${Organization}-${Environment}-DomainName"
      ListenerArn: !ImportValue
        "Fn::Sub": "bashlinux-${Environment}-PublicAlbListenerHTTPSArn"
      Priority: !Ref EC2KubernetesWorkerAlbRulePriority

###############################################################################
Outputs:

  Ec2KubernetesAlbTargetGroupArn:
    Description: "TargetGroup: ARN of the target group"
    Value: !Ref Ec2KubernetesAlbTargetGroup
    Export:
      Name: !Sub "${Organization}-${Environment}-Ec2KubernetesAlbTargetGroupArn"

  Ec2KubernetesAsgLaunchTemplateId:
    Description: "LaunchTemplate: ID of the launch template"
    Value: !Ref Ec2KubernetesAsgLaunchTemplate
    Export:
      Name: !Sub "${Organization}-${Environment}-Ec2KubernetesAsgLaunchTemplateId"

  Ec2KubernetesAsgArn:
    Description: "AutoScalingGroup: The ARN of the Auto Scaling group"
    Value: !GetAtt Ec2KubernetesAsg.AutoScalingGroupARN
    Export:
      Name: !Sub "${Organization}-${Environment}-Ec2KubernetesAsgArn"