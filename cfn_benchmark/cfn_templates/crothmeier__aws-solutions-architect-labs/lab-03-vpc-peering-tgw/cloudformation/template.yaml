AWSTemplateFormatVersion: '2010-09-09'
Description: 'Lab 03: VPC Peering and Transit Gateway - Demonstrates both connectivity options'

Parameters:
  EnvironmentName:
    Description: Environment name prefix
    Type: String
    Default: Lab03

  DeploymentType:
    Description: Type of deployment - VPC Peering or Transit Gateway
    Type: String
    Default: Both
    AllowedValues:
      - VPCPeering
      - TransitGateway
      - Both

  InstanceType:
    Description: EC2 instance type
    Type: String
    Default: t3.micro

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Conditions:
  DeployVPCPeering: !Or
    - !Equals [!Ref DeploymentType, VPCPeering]
    - !Equals [!Ref DeploymentType, Both]

  DeployTransitGateway: !Or
    - !Equals [!Ref DeploymentType, TransitGateway]
    - !Equals [!Ref DeploymentType, Both]

Resources:
  # ============================================================================
  # VPC A (Development)
  # ============================================================================
  VPCA:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.1.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-VPC-A-Dev
        - Key: Lab
          Value: Lab03

  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPCA
      CidrBlock: 10.1.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-Subnet-A

  IGWA:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-IGW-A

  AttachGatewayA:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPCA
      InternetGatewayId: !Ref IGWA

  RouteTableA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPCA
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-RT-A

  RouteA:
    Type: AWS::EC2::Route
    DependsOn: AttachGatewayA
    Properties:
      RouteTableId: !Ref RouteTableA
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref IGWA

  SubnetRouteTableAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetA
      RouteTableId: !Ref RouteTableA

  SecurityGroupA:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${EnvironmentName}-SG-A
      GroupDescription: Security group for VPC A
      VpcId: !Ref VPCA
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: icmp
          FromPort: -1
          ToPort: -1
          CidrIp: 10.0.0.0/8
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-SG-A

  InstanceA:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      SubnetId: !Ref SubnetA
      SecurityGroupIds:
        - !Ref SecurityGroupA
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-Instance-A
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum update -y
          echo "VPC A - Development Environment" > /etc/motd
          hostnamectl set-hostname vpc-a-dev

  # ============================================================================
  # VPC B (Production)
  # ============================================================================
  VPCB:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.2.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-VPC-B-Prod
        - Key: Lab
          Value: Lab03

  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPCB
      CidrBlock: 10.2.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-Subnet-B

  IGWB:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-IGW-B

  AttachGatewayB:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPCB
      InternetGatewayId: !Ref IGWB

  RouteTableB:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPCB
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-RT-B

  RouteB:
    Type: AWS::EC2::Route
    DependsOn: AttachGatewayB
    Properties:
      RouteTableId: !Ref RouteTableB
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref IGWB

  SubnetRouteTableAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetB
      RouteTableId: !Ref RouteTableB

  SecurityGroupB:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${EnvironmentName}-SG-B
      GroupDescription: Security group for VPC B
      VpcId: !Ref VPCB
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: icmp
          FromPort: -1
          ToPort: -1
          CidrIp: 10.0.0.0/8
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-SG-B

  InstanceB:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      SubnetId: !Ref SubnetB
      SecurityGroupIds:
        - !Ref SecurityGroupB
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-Instance-B
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum update -y
          echo "VPC B - Production Environment" > /etc/motd
          hostnamectl set-hostname vpc-b-prod

  # ============================================================================
  # VPC C (Shared Services)
  # ============================================================================
  VPCC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.3.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-VPC-C-Shared
        - Key: Lab
          Value: Lab03

  SubnetC:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPCC
      CidrBlock: 10.3.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-Subnet-C

  IGWC:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-IGW-C

  AttachGatewayC:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPCC
      InternetGatewayId: !Ref IGWC

  RouteTableC:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPCC
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-RT-C

  RouteC:
    Type: AWS::EC2::Route
    DependsOn: AttachGatewayC
    Properties:
      RouteTableId: !Ref RouteTableC
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref IGWC

  SubnetRouteTableAssociationC:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetC
      RouteTableId: !Ref RouteTableC

  SecurityGroupC:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${EnvironmentName}-SG-C
      GroupDescription: Security group for VPC C
      VpcId: !Ref VPCC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: icmp
          FromPort: -1
          ToPort: -1
          CidrIp: 10.0.0.0/8
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-SG-C

  InstanceC:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      SubnetId: !Ref SubnetC
      SecurityGroupIds:
        - !Ref SecurityGroupC
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-Instance-C
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum update -y
          echo "VPC C - Shared Services" > /etc/motd
          hostnamectl set-hostname vpc-c-shared

  # ============================================================================
  # VPC Peering Connections (Conditional)
  # ============================================================================
  PeeringAB:
    Type: AWS::EC2::VPCPeeringConnection
    Condition: DeployVPCPeering
    Properties:
      VpcId: !Ref VPCA
      PeerVpcId: !Ref VPCB
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-Peering-A-B

  PeeringAC:
    Type: AWS::EC2::VPCPeeringConnection
    Condition: DeployVPCPeering
    Properties:
      VpcId: !Ref VPCA
      PeerVpcId: !Ref VPCC
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-Peering-A-C

  PeeringBC:
    Type: AWS::EC2::VPCPeeringConnection
    Condition: DeployVPCPeering
    Properties:
      VpcId: !Ref VPCB
      PeerVpcId: !Ref VPCC
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-Peering-B-C

  # Routes for VPC Peering
  RoutePeeringAtoB:
    Type: AWS::EC2::Route
    Condition: DeployVPCPeering
    Properties:
      RouteTableId: !Ref RouteTableA
      DestinationCidrBlock: 10.2.0.0/16
      VpcPeeringConnectionId: !Ref PeeringAB

  RoutePeeringAtoC:
    Type: AWS::EC2::Route
    Condition: DeployVPCPeering
    Properties:
      RouteTableId: !Ref RouteTableA
      DestinationCidrBlock: 10.3.0.0/16
      VpcPeeringConnectionId: !Ref PeeringAC

  RoutePeeringBtoA:
    Type: AWS::EC2::Route
    Condition: DeployVPCPeering
    Properties:
      RouteTableId: !Ref RouteTableB
      DestinationCidrBlock: 10.1.0.0/16
      VpcPeeringConnectionId: !Ref PeeringAB

  RoutePeeringBtoC:
    Type: AWS::EC2::Route
    Condition: DeployVPCPeering
    Properties:
      RouteTableId: !Ref RouteTableB
      DestinationCidrBlock: 10.3.0.0/16
      VpcPeeringConnectionId: !Ref PeeringBC

  RoutePeeringCtoA:
    Type: AWS::EC2::Route
    Condition: DeployVPCPeering
    Properties:
      RouteTableId: !Ref RouteTableC
      DestinationCidrBlock: 10.1.0.0/16
      VpcPeeringConnectionId: !Ref PeeringAC

  RoutePeeringCtoB:
    Type: AWS::EC2::Route
    Condition: DeployVPCPeering
    Properties:
      RouteTableId: !Ref RouteTableC
      DestinationCidrBlock: 10.2.0.0/16
      VpcPeeringConnectionId: !Ref PeeringBC

  # ============================================================================
  # Transit Gateway (Conditional)
  # ============================================================================
  TransitGateway:
    Type: AWS::EC2::TransitGateway
    Condition: DeployTransitGateway
    Properties:
      Description: !Sub ${EnvironmentName} Transit Gateway
      DefaultRouteTableAssociation: enable
      DefaultRouteTablePropagation: enable
      DnsSupport: enable
      VpnEcnSupport: enable
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-TGW
        - Key: Lab
          Value: Lab03

  TGWAttachmentA:
    Type: AWS::EC2::TransitGatewayAttachment
    Condition: DeployTransitGateway
    Properties:
      TransitGatewayId: !Ref TransitGateway
      VpcId: !Ref VPCA
      SubnetIds:
        - !Ref SubnetA
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-TGW-Attach-A

  TGWAttachmentB:
    Type: AWS::EC2::TransitGatewayAttachment
    Condition: DeployTransitGateway
    Properties:
      TransitGatewayId: !Ref TransitGateway
      VpcId: !Ref VPCB
      SubnetIds:
        - !Ref SubnetB
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-TGW-Attach-B

  TGWAttachmentC:
    Type: AWS::EC2::TransitGatewayAttachment
    Condition: DeployTransitGateway
    Properties:
      TransitGatewayId: !Ref TransitGateway
      VpcId: !Ref VPCC
      SubnetIds:
        - !Ref SubnetC
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-TGW-Attach-C

  # Routes for Transit Gateway
  RouteTGWAtoOthers:
    Type: AWS::EC2::Route
    Condition: DeployTransitGateway
    DependsOn: TGWAttachmentA
    Properties:
      RouteTableId: !Ref RouteTableA
      DestinationCidrBlock: 10.0.0.0/8
      TransitGatewayId: !Ref TransitGateway

  RouteTGWBtoOthers:
    Type: AWS::EC2::Route
    Condition: DeployTransitGateway
    DependsOn: TGWAttachmentB
    Properties:
      RouteTableId: !Ref RouteTableB
      DestinationCidrBlock: 10.0.0.0/8
      TransitGatewayId: !Ref TransitGateway

  RouteTGWCtoOthers:
    Type: AWS::EC2::Route
    Condition: DeployTransitGateway
    DependsOn: TGWAttachmentC
    Properties:
      RouteTableId: !Ref RouteTableC
      DestinationCidrBlock: 10.0.0.0/8
      TransitGatewayId: !Ref TransitGateway

Outputs:
  VPCAId:
    Description: VPC A ID
    Value: !Ref VPCA

  VPCBId:
    Description: VPC B ID
    Value: !Ref VPCB

  VPCCId:
    Description: VPC C ID
    Value: !Ref VPCC

  InstanceAIP:
    Description: Instance A Public IP
    Value: !GetAtt InstanceA.PublicIp

  InstanceBIP:
    Description: Instance B Public IP
    Value: !GetAtt InstanceB.PublicIp

  InstanceCIP:
    Description: Instance C Public IP
    Value: !GetAtt InstanceC.PublicIp

  InstanceAPrivateIP:
    Description: Instance A Private IP
    Value: !GetAtt InstanceA.PrivateIp

  InstanceBPrivateIP:
    Description: Instance B Private IP
    Value: !GetAtt InstanceB.PrivateIp

  InstanceCPrivateIP:
    Description: Instance C Private IP
    Value: !GetAtt InstanceC.PrivateIp

  PeeringConnectionAB:
    Condition: DeployVPCPeering
    Description: VPC Peering Connection A-B
    Value: !Ref PeeringAB

  PeeringConnectionAC:
    Condition: DeployVPCPeering
    Description: VPC Peering Connection A-C
    Value: !Ref PeeringAC

  PeeringConnectionBC:
    Condition: DeployVPCPeering
    Description: VPC Peering Connection B-C
    Value: !Ref PeeringBC

  TransitGatewayId:
    Condition: DeployTransitGateway
    Description: Transit Gateway ID
    Value: !Ref TransitGateway