AWSTemplateFormatVersion: '2010-09-09'
Description: 'Lab 18: Step Functions for Workflow Orchestration - Order processing with parallel tasks and human approval'

Parameters:
  EnvironmentName:
    Type: String
    Default: Lab18

Resources:
  # DynamoDB Table for Orders
  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${EnvironmentName}-Orders
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: orderId
          AttributeType: S
      KeySchema:
        - AttributeName: orderId
          KeyType: HASH
      Tags:
        - Key: Lab
          Value: Lab18

  # SNS Topic for Notifications
  NotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${EnvironmentName}-Notifications

  # Lambda Functions
  ValidateOrderFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${EnvironmentName}-ValidateOrder
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ZipFile: |
          import json
          def lambda_handler(event, context):
              order = event
              if 'orderId' not in order or 'total' not in order:
                  raise ValueError('Invalid order format')
              if order['total'] <= 0:
                  raise ValueError('Invalid total amount')
              order['validatedAt'] = context.request_id
              return order

  ProcessPaymentFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${EnvironmentName}-ProcessPayment
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ZipFile: |
          import json
          import time
          def lambda_handler(event, context):
              order = event
              # Simulate payment processing
              time.sleep(2)
              order['paymentStatus'] = 'completed'
              order['transactionId'] = f"TXN-{context.request_id[:8]}"
              return order

  CheckInventoryFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${EnvironmentName}-CheckInventory
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ZipFile: |
          import json
          def lambda_handler(event, context):
              order = event
              # Simulate inventory check
              order['inventoryStatus'] = 'available'
              return order

  UpdateDynamoDBFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${EnvironmentName}-UpdateDynamoDB
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref OrdersTable
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          from datetime import datetime
          dynamodb = boto3.resource('dynamodb')
          table = dynamodb.Table(os.environ['TABLE_NAME'])
          def lambda_handler(event, context):
              order = event
              order['updatedAt'] = datetime.utcnow().isoformat()
              table.put_item(Item=order)
              return order

  ShipOrderFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${EnvironmentName}-ShipOrder
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ZipFile: |
          import json
          def lambda_handler(event, context):
              order = event
              order['shippingStatus'] = 'shipped'
              order['trackingNumber'] = f"TRACK-{context.request_id[:12]}"
              return order

  # IAM Role for Lambda
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt OrdersTable.Arn

  # IAM Role for Step Functions
  StateMachineExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StepFunctionsExecutionPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt ValidateOrderFunction.Arn
                  - !GetAtt ProcessPaymentFunction.Arn
                  - !GetAtt CheckInventoryFunction.Arn
                  - !GetAtt UpdateDynamoDBFunction.Arn
                  - !GetAtt ShipOrderFunction.Arn
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref NotificationTopic
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

  # Step Functions State Machine
  OrderProcessingStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub ${EnvironmentName}-OrderProcessing
      RoleArn: !GetAtt StateMachineExecutionRole.Arn
      DefinitionString: !Sub |
        {
          "Comment": "Order processing workflow with parallel tasks",
          "StartAt": "ValidateOrder",
          "States": {
            "ValidateOrder": {
              "Type": "Task",
              "Resource": "${ValidateOrderFunction.Arn}",
              "Retry": [
                {
                  "ErrorEquals": ["States.TaskFailed"],
                  "IntervalSeconds": 2,
                  "MaxAttempts": 3,
                  "BackoffRate": 2.0
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": ["States.ALL"],
                  "Next": "OrderValidationFailed"
                }
              ],
              "Next": "ParallelProcessing"
            },
            "ParallelProcessing": {
              "Type": "Parallel",
              "Branches": [
                {
                  "StartAt": "ProcessPayment",
                  "States": {
                    "ProcessPayment": {
                      "Type": "Task",
                      "Resource": "${ProcessPaymentFunction.Arn}",
                      "Retry": [
                        {
                          "ErrorEquals": ["States.TaskFailed"],
                          "IntervalSeconds": 1,
                          "MaxAttempts": 2,
                          "BackoffRate": 2.0
                        }
                      ],
                      "End": true
                    }
                  }
                },
                {
                  "StartAt": "CheckInventory",
                  "States": {
                    "CheckInventory": {
                      "Type": "Task",
                      "Resource": "${CheckInventoryFunction.Arn}",
                      "End": true
                    }
                  }
                }
              ],
              "ResultSelector": {
                "payment.$": "$[0]",
                "inventory.$": "$[1]"
              },
              "ResultPath": "$.parallelResults",
              "Next": "MergeResults"
            },
            "MergeResults": {
              "Type": "Pass",
              "Parameters": {
                "orderId.$": "$.orderId",
                "total.$": "$.total",
                "items.$": "$.items",
                "validatedAt.$": "$.validatedAt",
                "paymentStatus.$": "$.parallelResults.payment.paymentStatus",
                "transactionId.$": "$.parallelResults.payment.transactionId",
                "inventoryStatus.$": "$.parallelResults.inventory.inventoryStatus"
              },
              "Next": "UpdateDynamoDB"
            },
            "UpdateDynamoDB": {
              "Type": "Task",
              "Resource": "${UpdateDynamoDBFunction.Arn}",
              "Next": "CheckOrderValue"
            },
            "CheckOrderValue": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.total",
                  "NumericGreaterThan": 1000,
                  "Next": "ApprovalRequired"
                }
              ],
              "Default": "ShipOrder"
            },
            "ApprovalRequired": {
              "Type": "Task",
              "Resource": "arn:aws:states:::sns:publish.waitForTaskToken",
              "Parameters": {
                "TopicArn": "${NotificationTopic}",
                "Message": {
                  "orderId.$": "$.orderId",
                  "total.$": "$.total",
                  "taskToken.$": "$$.Task.Token",
                  "message": "Order requires approval. Total exceeds $1000."
                }
              },
              "TimeoutSeconds": 3600,
              "Next": "ShipOrder"
            },
            "ShipOrder": {
              "Type": "Task",
              "Resource": "${ShipOrderFunction.Arn}",
              "Next": "SendNotification"
            },
            "SendNotification": {
              "Type": "Task",
              "Resource": "arn:aws:states:::sns:publish",
              "Parameters": {
                "TopicArn": "${NotificationTopic}",
                "Message.$": "$",
                "Subject": "Order Shipped Successfully"
              },
              "Next": "OrderComplete"
            },
            "OrderComplete": {
              "Type": "Succeed"
            },
            "OrderValidationFailed": {
              "Type": "Task",
              "Resource": "arn:aws:states:::sns:publish",
              "Parameters": {
                "TopicArn": "${NotificationTopic}",
                "Message": "Order validation failed",
                "Subject": "Order Processing Error"
              },
              "Next": "OrderFailed"
            },
            "OrderFailed": {
              "Type": "Fail",
              "Error": "OrderProcessingError",
              "Cause": "Order validation or processing failed"
            }
          }
        }

Outputs:
  StateMachineArn:
    Description: Order Processing State Machine ARN
    Value: !Ref OrderProcessingStateMachine
    Export:
      Name: !Sub ${EnvironmentName}-StateMachine-ARN

  TableName:
    Description: Orders DynamoDB table name
    Value: !Ref OrdersTable

  NotificationTopicArn:
    Description: SNS Topic ARN
    Value: !Ref NotificationTopic

  StartExecutionCommand:
    Description: Command to start execution
    Value: !Sub |
      aws stepfunctions start-execution \
        --state-machine-arn ${OrderProcessingStateMachine} \
        --input '{"orderId":"ORDER-001","items":[{"id":"A","qty":2}],"total":1500}'