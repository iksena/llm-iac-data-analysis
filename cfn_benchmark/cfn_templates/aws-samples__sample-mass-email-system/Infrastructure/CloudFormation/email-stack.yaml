  CreateRecipientsTableLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-CreateRecipientsTable
      ReservedConcurrentExecutions: 5
      Handler: index.lambda_handler
      Role: !GetAtt CSVProcessorRole.Arn
      Runtime: python3.13
      Timeout: 60
      MemorySize: 256
      DeadLetterConfig:
        TargetArn: !GetAtt LambdaDeadLetterQueue.Arn
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          from datetime import datetime
          from botocore.exceptions import ClientError

          def lambda_handler(event, context):
              CORS_ORIGIN = os.environ.get('ALLOWED_ORIGIN', 'NONE')
              try:
                  # Parse request body
                  if 'body' in event:
                      if isinstance(event['body'], str):
                          body = json.loads(event['body'])
                      else:
                          body = event['body']
                  else:
                      body = event

                  # Extract recipients and table name
                  recipients = body.get('recipients', [])
                  table_name_base = body.get('tableName', 'manual-recipients')

                  if not recipients:
                      return {
                          'statusCode': 400,
                          'headers': {
                              'Content-Type': 'application/json',
                              'Access-Control-Allow-Origin': CORS_ORIGIN,
                          },
                          'body': json.dumps({
                              'error': 'No recipients provided'
                          })
                      }

                  # Generate unique table name with timestamp
                  timestamp = datetime.now().strftime('%Y-%m-%d-%H-%M')
                  table_name = f"recipients-{table_name_base}-{timestamp}"

                  # Initialize DynamoDB
                  dynamodb = boto3.resource('dynamodb')

                  # Create DynamoDB table
                  table = dynamodb.create_table(
                      TableName=table_name,
                      KeySchema=[
                          {
                              'AttributeName': 'EmailAddress',
                              'KeyType': 'HASH'
                          }
                      ],
                      AttributeDefinitions=[
                          {
                              'AttributeName': 'EmailAddress',
                              'AttributeType': 'S'
                          }
                      ],
                      BillingMode='PAY_PER_REQUEST',
                      SSESpecification={
                          'Enabled': True,
                          'KMSMasterKeyId': os.environ['DYNAMODB_KMS_KEY_ID'],
                          'SSEType': 'KMS'
                      }
                  )

                  # Wait for table to be active
                  table.wait_until_exists()

                  # Register table in registry
                  registry_table = dynamodb.Table(os.environ['REGISTRY_TABLE'])
                  registry_table.put_item(
                      Item={
                          'TableName': table_name,
                          'OriginalFilename': f"{table_name_base}-manual-entry.csv",
                          'CreatedAt': datetime.now().isoformat(),
                          'S3Key': 'manual-entry',
                          'RecipientListTable': table_name,
                          'Source': 'manual'
                      }
                  )

                  # Process recipients and add to table
                  processed_count = 0
                  for recipient in recipients:
                      email = recipient.get('email', '').strip()
                      first_name = recipient.get('firstName', '').strip()
                      last_name = recipient.get('lastName', '').strip()
                      topics = recipient.get('topics', [])

                      if email and '@' in email:
                          table.put_item(
                              Item={
                                  'EmailAddress': email,
                                  'FirstName': first_name,
                                  'LastName': last_name,
                                  'Topics': topics if isinstance(topics, list) else [],
                                  'CreatedAt': datetime.now().isoformat()
                              }
                          )
                          processed_count += 1

                  return {
                      'statusCode': 201,
                      'headers': {
                          'Content-Type': 'application/json',
                          'Access-Control-Allow-Origin': CORS_ORIGIN,
                      },
                      'body': json.dumps({
                          'message': 'Recipients table created successfully',
                          'tableName': table_name,
                          'processedCount': processed_count,
                          'totalProvided': len(recipients)
                      })
                  }

              except ClientError as e:
                  return {
                      'statusCode': 500,
                      'headers': {
                          'Content-Type': 'application/json',
                          'Access-Control-Allow-Origin': CORS_ORIGIN,
                      },
                      'body': json.dumps({
                          'error': f'AWS error: {str(e)}'
                      })
                  }
              except Exception as e:
                  return {
                      'statusCode': 500,
                      'headers': {
                          'Content-Type': 'application/json',
                          'Access-Control-Allow-Origin': CORS_ORIGIN,
                      },
                      'body': json.dumps({
                          'error': f'Internal server error: {str(e)}'
                      })
                  }
      Environment:
        Variables:
          REGISTRY_TABLE: !Ref RecipientTablesRegistry
          DYNAMODB_KMS_KEY_ID: !Ref DynamoDBKMSKey
          ALLOWED_ORIGIN: !Ref AllowedOrigin
      KmsKeyArn: !Ref LambdaKMSKeyArn

