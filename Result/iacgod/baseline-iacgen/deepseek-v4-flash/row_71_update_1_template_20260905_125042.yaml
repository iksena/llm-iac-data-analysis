AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFormation template for a DynamoDB table with configurable keys, billing, encryption, and optional alarms.'

Parameters:
  TableName:
    Description: Name of the DynamoDB table.
    Type: String
    Default: MyDynamoDBTable

  PartitionKeyName:
    Description: Name of the partition key attribute.
    Type: String
    Default: id

  PartitionKeyType:
    Description: Type of the partition key attribute.
    Type: String
    Default: S
    AllowedValues:
      - S
      - N
      - B

  SortKeyEnabled:
    Description: Enable sort key.
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

  SortKeyName:
    Description: Name of the sort key attribute (if enabled).
    Type: String
    Default: sort

  SortKeyType:
    Description: Type of the sort key attribute (if enabled).
    Type: String
    Default: N
    AllowedValues:
      - S
      - N
      - B

  BillingMode:
    Description: Billing mode for the table.
    Type: String
    Default: PROVISIONED
    AllowedValues:
      - PROVISIONED
      - PAY_PER_REQUEST

  ReadCapacityUnits:
    Description: Provisioned read capacity units (for PROVISIONED mode).
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 1000

  WriteCapacityUnits:
    Description: Provisioned write capacity units (for PROVISIONED mode).
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 1000

  PointInTimeRecoveryEnabled:
    Description: Enable point-in-time recovery.
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'

  SSESpecificationEnabled:
    Description: Enable server-side encryption with KMS.
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

  KMSMasterKeyId:
    Description: ARN or alias of the KMS master key for encryption (optional, only if SSE enabled).
    Type: String
    Default: ''

  AlarmsEnabled:
    Description: Enable CloudWatch alarms for throttling and errors.
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'

  SnsTopicArn:
    Description: ARN of the SNS topic to receive alarm notifications (required if AlarmsEnabled is true).
    Type: String
    Default: ''

  ThrottleAlarmThreshold:
    Description: Number of throttled requests (sum read+write) in 5 minutes to trigger alarm.
    Type: Number
    Default: 10
    MinValue: 1

  ErrorAlarmThreshold:
    Description: Number of user errors in 5 minutes to trigger alarm.
    Type: Number
    Default: 5
    MinValue: 1

  EvaluationPeriods:
    Description: Number of evaluation periods for alarms.
    Type: Number
    Default: 1
    MinValue: 1

Conditions:
  IsPROVISIONED: !Equals [!Ref BillingMode, 'PROVISIONED']
  IsSortKeyEnabled: !Equals [!Ref SortKeyEnabled, 'true']
  IsSSEEnabled: !Equals [!Ref SSESpecificationEnabled, 'true']
  IsAlarmsEnabled: !Equals [!Ref AlarmsEnabled, 'true']
  HasSnsTopic: !Not [!Equals [!Ref SnsTopicArn, '']]

Resources:
  DynamoDBTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      AttributeDefinitions:
        - AttributeName: !Ref PartitionKeyName
          AttributeType: !Ref PartitionKeyType
        - !If
          - IsSortKeyEnabled
          - AttributeName: !Ref SortKeyName
            AttributeType: !Ref SortKeyType
          - !Ref 'AWS::NoValue'
      KeySchema:
        - AttributeName: !Ref PartitionKeyName
          KeyType: HASH
        - !If
          - IsSortKeyEnabled
          - AttributeName: !Ref SortKeyName
            KeyType: RANGE
          - !Ref 'AWS::NoValue'
      BillingMode: !Ref BillingMode
      ProvisionedThroughput:
        !If
          - IsPROVISIONED
          - ReadCapacityUnits: !Ref ReadCapacityUnits
            WriteCapacityUnits: !Ref WriteCapacityUnits
          - !Ref 'AWS::NoValue'
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !Ref PointInTimeRecoveryEnabled
      SSESpecification:
        !If
          - IsSSEEnabled
          - SSEEnabled: true
            SSEType: KMS
            KMSMasterKeyId: !If
              - !Equals [!Ref KMSMasterKeyId, '']
              - !Ref 'AWS::NoValue'
              - !Ref KMSMasterKeyId
          - !Ref 'AWS::NoValue'
      TimeToLiveSpecification: !Ref 'AWS::NoValue'  # Not required, default disabled
      Tags:
        - Key: Name
          Value: !Ref TableName

  AlarmThrottling:
    Type: AWS::CloudWatch::Alarm
    Condition: IsAlarmsEnabled
    Properties:
      AlarmName: !Sub '${TableName}-ThrottleAlarm'
      AlarmDescription: !Sub 'Alarm when DynamoDB table ${TableName} throttles requests'
      Namespace: AWS/DynamoDB
      MetricName: ThrottledRequests
      Dimensions:
        - Name: TableName
          Value: !Ref TableName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: !Ref EvaluationPeriods
      Threshold: !Ref ThrottleAlarmThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !If
          - HasSnsTopic
          - !Ref SnsTopicArn
          - !Ref 'AWS::NoValue'
      OKActions:
        - !If
          - HasSnsTopic
          - !Ref SnsTopicArn
          - !Ref 'AWS::NoValue'
      InsufficientDataActions:
        - !If
          - HasSnsTopic
          - !Ref SnsTopicArn
          - !Ref 'AWS::NoValue'

  AlarmUserErrors:
    Type: AWS::CloudWatch::Alarm
    Condition: IsAlarmsEnabled
    Properties:
      AlarmName: !Sub '${TableName}-UserErrorsAlarm'
      AlarmDescription: !Sub 'Alarm when DynamoDB table ${TableName} has user errors'
      Namespace: AWS/DynamoDB
      MetricName: UserErrors
      Dimensions:
        - Name: TableName
          Value: !Ref TableName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: !Ref EvaluationPeriods
      Threshold: !Ref ErrorAlarmThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !If
          - HasSnsTopic
          - !Ref SnsTopicArn
          - !Ref 'AWS::NoValue'
      OKActions:
        - !If
          - HasSnsTopic
          - !Ref SnsTopicArn
          - !Ref 'AWS::NoValue'
      InsufficientDataActions:
        - !If
          - HasSnsTopic
          - !Ref SnsTopicArn
          - !Ref 'AWS::NoValue'

Outputs:
  TableName:
    Description: Name of the DynamoDB table.
    Value: !Ref DynamoDBTable

  TableArn:
    Description: ARN of the DynamoDB table.
    Value: !GetAtt DynamoDBTable.Arn

  AlarmThrottlingName:
    Description: Name of the throttling alarm (if created).
    Value: !If [IsAlarmsEnabled, !Ref AlarmThrottling, 'N/A']

  AlarmUserErrorsName:
    Description: Name of the user errors alarm (if created).
    Value: !If [IsAlarmsEnabled, !Ref AlarmUserErrors, 'N/A']