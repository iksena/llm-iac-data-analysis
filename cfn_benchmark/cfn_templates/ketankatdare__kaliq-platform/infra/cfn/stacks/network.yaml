AWSTemplateFormatVersion: '2010-09-09'
Description: |
  KALIQ Network Stack (Stack D)
  - VPC, subnets, routing, and VPC endpoints for EKS and workloads
  - Dev: no NAT Gateway; uses VPC endpoints for AWS service access
  - Reference: docs/infrastructure/STACKS.md

Parameters:
  Project:
    Type: String
    Default: kaliq
    Description: Project name used in resource naming and tagging

  Env:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - qa
      - prod
    Description: Environment name (affects resource uniqueness and naming)

  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    Description: CIDR block for the VPC

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Stack Parameters"
        Parameters:
          - Project
          - Env
      - Label:
          default: "Network Configuration"
        Parameters:
          - VpcCidr

Resources:
  # =============================================================================
  # VPC
  # =============================================================================

  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub '${Project}-${Env}-vpc'
        - Key: Project
          Value: !Ref Project
        - Key: Env
          Value: !Ref Env

  # =============================================================================
  # Internet Gateway
  # =============================================================================

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${Project}-${Env}-igw'
        - Key: Project
          Value: !Ref Project
        - Key: Env
          Value: !Ref Env

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref VPC

  # =============================================================================
  # Public Subnets (2 AZs)
  # =============================================================================
  # Uses Fn::GetAZs to select first two availability zones

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 4, 8]]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${Project}-${Env}-public-subnet-1'
        - Key: Project
          Value: !Ref Project
        - Key: Env
          Value: !Ref Env
        - Key: Type
          Value: Public

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 4, 8]]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${Project}-${Env}-public-subnet-2'
        - Key: Project
          Value: !Ref Project
        - Key: Env
          Value: !Ref Env
        - Key: Type
          Value: Public

  # =============================================================================
  # Private Subnets (2 AZs, no NAT Gateway)
  # =============================================================================

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidr, 4, 8]]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${Project}-${Env}-private-subnet-1'
        - Key: Project
          Value: !Ref Project
        - Key: Env
          Value: !Ref Env
        - Key: Type
          Value: Private

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: !Select [3, !Cidr [!Ref VpcCidr, 4, 8]]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${Project}-${Env}-private-subnet-2'
        - Key: Project
          Value: !Ref Project
        - Key: Env
          Value: !Ref Env
        - Key: Type
          Value: Private

  # =============================================================================
  # Route Tables
  # =============================================================================

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${Project}-${Env}-public-rt'
        - Key: Project
          Value: !Ref Project
        - Key: Env
          Value: !Ref Env

  DefaultPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable1:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${Project}-${Env}-private-rt-1'
        - Key: Project
          Value: !Ref Project
        - Key: Env
          Value: !Ref Env

  PrivateRouteTable2:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${Project}-${Env}-private-rt-2'
        - Key: Project
          Value: !Ref Project
        - Key: Env
          Value: !Ref Env

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable1

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable2

  # =============================================================================
  # Security Group for VPC Endpoints
  # =============================================================================

  VpcEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${Project}-${Env}-vpc-endpoint-sg'
      GroupDescription: Security group for VPC interface endpoints
      VpcId: !Ref VPC
      SecurityGroupIngress:
        # Allow HTTPS from private subnets (for interface endpoints)
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Select [2, !Cidr [!Ref VpcCidr, 4, 8]]
          Description: HTTPS from private subnet 1
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Select [3, !Cidr [!Ref VpcCidr, 4, 8]]
          Description: HTTPS from private subnet 2
      Tags:
        - Key: Name
          Value: !Sub '${Project}-${Env}-vpc-endpoint-sg'
        - Key: Project
          Value: !Ref Project
        - Key: Env
          Value: !Ref Env

  # =============================================================================
  # VPC Gateway Endpoints (S3, DynamoDB)
  # =============================================================================
  # These are free and provide private connectivity to S3 and DynamoDB
  # without requiring NAT Gateway or internet gateway.

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      RouteTableIds:
        - !Ref PrivateRouteTable1
        - !Ref PrivateRouteTable2
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: '*'
            Action:
              - 's3:*'
            Resource: '*'
      Tags:
        - Key: Name
          Value: !Sub '${Project}-${Env}-s3-gateway-endpoint'
        - Key: Project
          Value: !Ref Project
        - Key: Env
          Value: !Ref Env

  DynamoDBGatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.dynamodb'
      RouteTableIds:
        - !Ref PrivateRouteTable1
        - !Ref PrivateRouteTable2
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: '*'
            Action:
              - 'dynamodb:*'
            Resource: '*'
      Tags:
        - Key: Name
          Value: !Sub '${Project}-${Env}-dynamodb-gateway-endpoint'
        - Key: Project
          Value: !Ref Project
        - Key: Env
          Value: !Ref Env

  # =============================================================================
  # VPC Interface Endpoints (ECR, CloudWatch Logs, STS, EC2)
  # =============================================================================
  # These provide private connectivity to AWS services that require
  # interface endpoints (not supported by gateway endpoints).
  # Private DNS enabled allows using standard service endpoints.

  EcrApiEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ecr.api'
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup
      PrivateDnsEnabled: true
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: '*'
            Action:
              - 'ecr:*'
            Resource: '*'
      Tags:
        - Key: Name
          Value: !Sub '${Project}-${Env}-ecr-api-endpoint'
        - Key: Project
          Value: !Ref Project
        - Key: Env
          Value: !Ref Env

  EcrDkrEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ecr.dkr'
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup
      PrivateDnsEnabled: true
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: '*'
            Action:
              - 'ecr:*'
            Resource: '*'
      Tags:
        - Key: Name
          Value: !Sub '${Project}-${Env}-ecr-dkr-endpoint'
        - Key: Project
          Value: !Ref Project
        - Key: Env
          Value: !Ref Env

  CloudWatchLogsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.logs'
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup
      PrivateDnsEnabled: true
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: '*'
            Action:
              - 'logs:*'
            Resource: '*'
      Tags:
        - Key: Name
          Value: !Sub '${Project}-${Env}-cloudwatch-logs-endpoint'
        - Key: Project
          Value: !Ref Project
        - Key: Env
          Value: !Ref Env

  StsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.sts'
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup
      PrivateDnsEnabled: true
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: '*'
            Action:
              - 'sts:*'
            Resource: '*'
      Tags:
        - Key: Name
          Value: !Sub '${Project}-${Env}-sts-endpoint'
        - Key: Project
          Value: !Ref Project
        - Key: Env
          Value: !Ref Env

  Ec2Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ec2'
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup
      PrivateDnsEnabled: true
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: '*'
            Action:
              - 'ec2:*'
            Resource: '*'
      Tags:
        - Key: Name
          Value: !Sub '${Project}-${Env}-ec2-endpoint'
        - Key: Project
          Value: !Ref Project
        - Key: Env
          Value: !Ref Env

  BedrockRuntimeEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.bedrock-runtime'
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup
      PrivateDnsEnabled: true
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: '*'
            Action:
              - 'bedrock:InvokeModel'
            Resource: '*'
      Tags:
        - Key: Name
          Value: !Sub '${Project}-${Env}-bedrock-runtime-endpoint'
        - Key: Project
          Value: !Ref Project
        - Key: Env
          Value: !Ref Env

Outputs:
  # VPC ID (used by EKS stack)
  VpcId:
    Description: VPC ID
    Value: !Ref VPC
    Export:
      Name: !Sub '${Project}-${Env}-VpcId'

  # Public Subnet IDs (list, used by EKS for load balancers)
  PublicSubnetIds:
    Description: List of public subnet IDs
    Value: !Join
      - ','
      - - !Ref PublicSubnet1
        - !Ref PublicSubnet2
    Export:
      Name: !Sub '${Project}-${Env}-PublicSubnetIds'

  # Private Subnet IDs (list, used by EKS for nodes)
  PrivateSubnetIds:
    Description: List of private subnet IDs
    Value: !Join
      - ','
      - - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
    Export:
      Name: !Sub '${Project}-${Env}-PrivateSubnetIds'

  # VPC Endpoint Security Group ID (used by EKS or future stacks)
  EndpointSecurityGroupId:
    Description: Security group ID for VPC interface endpoints
    Value: !Ref VpcEndpointSecurityGroup
    Export:
      Name: !Sub '${Project}-${Env}-EndpointSecurityGroupId'

  # Private Route Table IDs (optional, for reference)
  PrivateRouteTable1Id:
    Description: Private route table ID for subnet 1
    Value: !Ref PrivateRouteTable1
    Export:
      Name: !Sub '${Project}-${Env}-PrivateRouteTable1Id'

  PrivateRouteTable2Id:
    Description: Private route table ID for subnet 2
    Value: !Ref PrivateRouteTable2
    Export:
      Name: !Sub '${Project}-${Env}-PrivateRouteTable2Id'

  PublicRouteTableId:
    Description: Public route table ID
    Value: !Ref PublicRouteTable
    Export:
      Name: !Sub '${Project}-${Env}-PublicRouteTableId'