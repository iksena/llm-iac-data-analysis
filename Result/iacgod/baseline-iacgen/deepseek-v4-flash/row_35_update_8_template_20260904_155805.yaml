AWSTemplateFormatVersion: '2010-09-09'
Description: 'Cognito User Pool for JWT testing with AgentCore Gateway and MCP server'
Parameters:
  CallbackUrls:
    Type: CommaDelimitedList
    Description: Comma-delimited list of callback URLs for the web client
    Default: 'http://localhost:3000/callback'
  LogoutUrls:
    Type: CommaDelimitedList
    Description: Comma-delimited list of logout URLs for the web client
    Default: 'http://localhost:3000/logout'
  CustomDomainName:
    Type: String
    Description: Custom domain for Cognito hosted UI (e.g., auth.example.com)
    Default: 'auth.mcp-test.example.com'
    AllowedPattern: '^[a-z0-9](?:[a-z0-9\-]*[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9\-]*[a-z0-9])?)+$'
    ConstraintDescription: 'Must be a valid domain name'
Resources:
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: 'MCPTestUserPool'
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      EmailVerificationMessage: 'Your verification code is {####}.'
      EmailVerificationSubject: 'Verify your email for MCP Test'
  CertificateManagerCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref CustomDomainName
      ValidationMethod: DNS
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Aliases:
          - !Ref CustomDomainName
        DefaultCacheBehavior:
          TargetOriginId: CognitoOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          ForwardedValues:
            QueryString: true
            Cookies:
              Forward: none
        Enabled: true
        Origins:
          - Id: CognitoOrigin
            DomainName: !Sub '${CognitoUserPool}.auth.${AWS::Region}.amazoncognito.com'
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateManagerCertificate
          SslSupportMethod: sni-only
  CognitoUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      CustomDomainConfig:
        CertificateArn: !Ref CertificateManagerCertificate
      CloudFrontDistribution: !Ref CloudFrontDistribution
      Domain: !Ref CustomDomainName
      UserPoolId: !Ref CognitoUserPool
  CognitoResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      Identifier: 'api'
      Name: 'API Resource Server'
      UserPoolId: !Ref CognitoUserPool
      Scopes:
        - ScopeName: 'mcp'
          ScopeDescription: 'Access to MCP server'
        - ScopeName: 'gateway'
          ScopeDescription: 'Access to AgentCore Gateway'
  WebClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: 'WebClient'
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_CUSTOM_AUTH
      AllowedOAuthFlows:
        - code
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - email
        - openid
        - profile
        - api/mcp
        - api/gateway
      CallbackURLs: !Ref CallbackUrls
      LogoutURLs: !Ref LogoutUrls
      SupportedIdentityProviders:
        - COGNITO
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
  MachineClientGateway:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: 'MachineClientGateway'
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: true
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
      AllowedOAuthFlows:
        - client_credentials
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - api/mcp
        - api/gateway
      SupportedIdentityProviders:
        - COGNITO
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 1
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
  MachineClientMCP:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: 'MachineClientMCP'
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: true
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
      AllowedOAuthFlows:
        - client_credentials
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - api/mcp
        - api/gateway
      SupportedIdentityProviders:
        - COGNITO
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 1
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
Outputs:
  UserPoolId:
    Description: ID of the Cognito User Pool
    Value: !Ref CognitoUserPool
  UserPoolDomain:
    Description: Custom domain for the hosted UI
    Value: !Sub 'https://${CustomDomainName}'
  WebClientId:
    Description: Client ID for the web application
    Value: !Ref WebClient
  MachineClientGatewayId:
    Description: Client ID for the Gateway machine client
    Value: !Ref MachineClientGateway
  MachineClientGatewaySecret:
    Description: Client secret for the Gateway machine client
    Value: !GetAtt MachineClientGateway.ClientSecret
  MachineClientMCPId:
    Description: Client ID for the MCP machine client
    Value: !Ref MachineClientMCP
  MachineClientMCPSecret:
    Description: Client secret for the MCP machine client
    Value: !GetAtt MachineClientMCP.ClientSecret