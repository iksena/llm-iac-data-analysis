  DataAnalysisStepFunctionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: co-intelligence-data-analysis-sfn-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: data-analysis-sfn
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt DataAnalysisValidateFunction.Arn
                  - !GetAtt DataAnalysisCatalogFunction.Arn
                  - !GetAtt DataAnalysisFinalizeFunction.Arn
              - Effect: Allow
                Action:
                  - glue:StartJobRun
                  - glue:GetJobRun
                  - glue:GetJobRuns
                Resource: "*"

  DataAnalysisStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: co-intelligence-data-analysis
      RoleArn: !GetAtt DataAnalysisStepFunctionsRole.Arn
      DefinitionString: !Sub |
        {
          "Comment": "Co-Intelligence Data Analysis pipeline",
          "StartAt": "Validate",
          "States": {
            "Validate": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${DataAnalysisValidateFunction.Arn}",
                "Payload.$": "$"
              },
              "OutputPath": "$.Payload",
              "Next": "ChooseJob"
            },
            "ChooseJob": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.source.type",
                  "StringEquals": "postgres",
                  "Next": "GlueETLPostgres"
                }
              ],
              "Default": "GlueETLS3"
            },
            "GlueETLS3": {
              "Type": "Task",
              "Resource": "arn:aws:states:::glue:startJobRun.sync",
              "Parameters": {
                "JobName": "${DataAnalysisGlueJobS3}",
                "Arguments": {
                  "--spec_s3_uri.$": "$.spec_s3_uri",
                  "--curated_s3_uri.$": "$.curated_s3_uri",
                  "--schema_s3_uri.$": "$.schema_s3_uri",
                  "--user_id.$": "States.Format('{}', $.user_id)",
                  "--pepper_secret_id": "${DataAnalysisPepperSecret}",
                  "--jdbc_url": "jdbc:postgresql://${RDSInstance.Endpoint.Address}:5432/postgres",
                  "--jdbc_secret_id": "co-intelligence-secrets"
                }
              },
              "ResultPath": "$.glue_job",
              "Next": "Catalog"
            },
            "GlueETLPostgres": {
              "Type": "Task",
              "Resource": "arn:aws:states:::glue:startJobRun.sync",
              "Parameters": {
                "JobName": "${DataAnalysisGlueJobPostgres}",
                "Arguments": {
                  "--spec_s3_uri.$": "$.spec_s3_uri",
                  "--curated_s3_uri.$": "$.curated_s3_uri",
                  "--schema_s3_uri.$": "$.schema_s3_uri",
                  "--user_id.$": "States.Format('{}', $.user_id)",
                  "--pepper_secret_id": "${DataAnalysisPepperSecret}",
                  "--jdbc_url": "jdbc:postgresql://${RDSInstance.Endpoint.Address}:5432/postgres",
                  "--jdbc_secret_id": "co-intelligence-secrets"
                }
              },
              "ResultPath": "$.glue_job",
              "Next": "Catalog"
            },
            "Catalog": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${DataAnalysisCatalogFunction.Arn}",
                "Payload": {
                  "schema_s3_uri.$": "$.schema_s3_uri",
                  "curated_s3_uri.$": "$.curated_s3_uri",
                  "glue_database.$": "$.glue_database",
                  "glue_table.$": "$.glue_table"
                }
              },
              "OutputPath": "$.Payload",
              "Next": "Finalize"
            },
            "Finalize": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${DataAnalysisFinalizeFunction.Arn}",
                "Payload.$": "$"
              },
              "OutputPath": "$.Payload",
              "End": true
            }
          }
        }

  IRSAIamRole:
    Type: AWS::IAM::Role
    Condition: CreateIRSA
    Properties:
      RoleName: co-intelligence-backend-irsa
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref IRSAOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "${IRSAOidcProviderUrl}:sub": "system:serviceaccount:default:backend"
                "${IRSAOidcProviderUrl}:aud": "sts.amazonaws.com"
      Policies:
        - PolicyName: irsa-backend-basic
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub arn:aws:s3:::${S3Bucket}
                  - !Sub arn:aws:s3:::${S3Bucket}/*
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt CodeExecutorLambda.Arn
              - Effect: Allow
                Action:
                  - states:StartExecution
                  - states:DescribeExecution
                  - states:GetExecutionHistory
                Resource: !GetAtt DataAnalysisStateMachine.Arn
              - Effect: Allow
                Action:
                  - athena:StartQueryExecution
                  - athena:GetQueryExecution
                  - athena:GetQueryResults
                Resource: "*"
              - Effect: Allow
                Action:
                  - glue:GetTable
                  - glue:GetDatabase
                Resource: "*"
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref DataAnalysisPepperSecret

