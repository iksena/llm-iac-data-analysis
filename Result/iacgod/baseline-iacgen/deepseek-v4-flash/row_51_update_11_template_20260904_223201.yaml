AWSTemplateFormatVersion: "2010-09-09"

Parameters:
  ScriptBucketName:
    Type: String
    Description: Name of the existing S3 bucket where Glue job scripts are stored.
    Default: your-script-bucket
  ScriptKeyPrefix:
    Type: String
    Description: Prefix (path) for Glue scripts inside the script bucket (e.g., scripts/).
    Default: scripts/
  GroupMembershipScriptKey:
    Type: String
    Default: group_membership.py
  ObjectAccessScriptKey:
    Type: String
    Default: object_access.py
  FolderAssetsScriptKey:
    Type: String
    Default: folder_assets.py
  FolderLookupScriptKey:
    Type: String
    Default: folder_lookup.py
  FolderPathScriptKey:
    Type: String
    Default: folder_path.py
  GlueDatabaseName:
    Type: String
    Default: quicksight_admin_db
  CloudTrailLogTableName:
    Type: String
    Default: cloudtrail_logs
  CloudTrailLogS3Location:
    Type: String
    Default: s3://your-cloudtrail-bucket/AWSLogs/

Resources:
  AdminRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "quicksight-admin-role-${AWS::AccountId}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - glue.amazonaws.com
                - cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: QuicksightAdminFullAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: iam:*
                Resource: "*"
              - Effect: Allow
                Action: quicksight:*
                Resource: "*"
              - Effect: Allow
                Action: glue:*
                Resource: "*"
              - Effect: Allow
                Action: s3:*
                Resourc: "*"
              - Effect: Allow
                Action: cloudwatch:*
                Resource: "*"
              - Effect: Allow
                Action: logs:*
                Resource: "*"

  AdminS3Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "quicksight-admin-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Ref GlueDatabaseName
        Description: Glue database for QuickSight admin console data preparation.

  CloudTrailLogTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      TableInput:
        Name: !Ref CloudTrailLogTableName
        Description: Table for CloudTrail logs ingested for QuickSight analysis.        TableType: EXTERNAL_TABLE        Parameters:          classification: cloudtrail          typeOfData: file        StorageDescriptor:          Location: !Ref CloudTrailLogS3Location          InputFormat: org.apache.hadoop.mapred.TextInputFormat          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat          SerdeInfo:            SerializationLibrary: org.openx.data.jsonserde.JsonSerDe          Columns:            - Name: eventversion              Type: string            - Name: useridentity              Type: string            - Name: eventtime              Type: string            - Name: eventsource              Type: string            - Name: eventname              Type: string            - Name: awsregion              Type: string            - Name: sourceipaddress              Type: string            - Name: useragent              Type: string            - Name: errorcode              Type: string            - Name: errormessage              Type: string            - Name: requestparameters              Type: string            - Name: responseelements              Type: string            - Name: additionaleventData              Type: string            - Name: requestid              Type: string            - Name: eventid              Type: string            - Name: resources              Type: string            - Name: eventtype              Type: string            - Name: apiVersion              Type: string            - Name: readonly              Type: string            - Name: recipientAccountId              Type: string            - Name: serviceEventDetails              Type: string            - Name: sharedEventId              Type: string            - Name: vpcendpointid              Type: string        PartitionKeys: []

  GroupMembershipJob:
    Type: AWS::Glue::Job
    Properties:
      Name: !Sub "group-membership-job-${AWS::AccountId}"
      Role: !GetAtt AdminRole.Arn
      Command:
        Name: pythonshell
        ScriptLocation: !Sub "s3://${ScriptBucketName}/${ScriptKeyPrefix}${GroupMembershipScriptKey}"
        PythonVersion: "3.9"
      GlueVersion: "3.0"
      MaxRetries: 0
      Timeout: 30
      MaxCapacity: 0.0625

  ObjectAccessJob:
    Type: AWS::Glue::Job
    Properties:
      Name: !Sub "object-access-job-${AWS::AccountId}"
      Role: !GetAtt AdminRole.Arn
      Command:
        Name: pythonshell
        ScriptLocation: !Sub "s3://${ScriptBucketName}/${ScriptKeyPrefix}${ObjectAccessScriptKey}"
        PythonVersion: "3.9"
      GlueVersion: "3.0"
      MaxRetries: 0
      Timeout: 30
      MaxCapacity: 0.0625

  FolderAssetsJob:
    Type: AWS::Glue::Job
    Properties:
      Name: !Sub "folder-assets-job-${AWS::AccountId}"
      Role: !GetAtt AdminRole.Arn
      Command:
        Name: pythonshell
        ScriptLocation: !Sub "s3://${ScriptBucketName}/${ScriptKeyPrefix}${FolderAssetsScriptKey}"
        PythonVersion: "3.9"
      GlueVersion: "3.0"
      MaxRetries: 0
      Timeout: 30
      MaxCapacity: 0.0625

  FolderLookupJob:
    Type: AWS::Glue::Job
    Properties:
      Name: !Sub "folder-lookup-job-${AWS::AccountId}"
      Role: !GetAtt AdminRole.Arn
      Command:
        Name: glueetl
        ScriptLocation: !Sub "s3://${ScriptBucketName}/${ScriptKeyPrefix}${FolderLookupScriptKey}"
      GlueVersion: "5.0"
      WorkerType: G.1X
      NumberOfWorkers: 2
      MaxRetries: 0
      Timeout: 60

  FolderPathJob:
    Type: AWS::Glue::Job
    Properties:
      Name: !Sub "folder-path-job-${AWS::AccountId}"
      Role: !GetAtt AdminRole.Arn
      Command:
        Name: glueetl
        ScriptLocation: !Sub "s3://${ScriptBucketName}/${ScriptKeyPrefix}${FolderPathScriptKey}"
      GlueVersion: "5.0"
      WorkerType: G.1X
      NumberOfWorkers: 2
      MaxRetries: 0
      Timeout: 60

  GroupMembershipTrigger:
    Type: AWS::Glue::Trigger
    Properties:
      Name: !Sub "group-membership-trigger-${AWS::AccountId}"
      Type: SCHEDULED
      Schedule: cron(0 */3 * * ? *)
      Actions:
        - JobName: !Ref GroupMembershipJob
      StartOnCreation: true

  ObjectAccessTrigger:
    Type: AWS::Glue::Trigger
    Properties:
      Name: !Sub "object-access-trigger-${AWS::AccountId}"
      Type: SCHEDULED
      Schedule: cron(0 */3 * * ? *)
      Actions:
        - JobName: !Ref ObjectAccessJob
      StartOnCreation: true

  FolderAssetsTrigger:
    Type: AWS::Glue::Trigger
    Properties:
      Name: !Sub "folder-assets-trigger-${AWS::AccountId}"
      Type: SCHEDULED
      Schedule: cron(0 */3 * * ? *)
      Actions:
        - JobName: !Ref FolderAssetsJob
      StartOnCreation: true

  FolderLookupTrigger:
    Type: AWS::Glue::Trigger
    Properties:
      Name: !Sub "folder-lookup-trigger-${AWS::AccountId}"
      Type: SCHEDULED
      Schedule: cron(0 */3 * * ? *)
      Actions:
        - JobName: !Ref FolderLookupJob
      StartOnCreation: true

  FolderPathTrigger:
    Type: AWS::Glue::Trigger
    Properties:
      Name: !Sub "folder-path-trigger-${AWS::AccountId}"
      Type: SCHEDULED
      Schedule: cron(0 */3 * * ? *)
      Actions:
        - JobName: !Ref FolderPathJob
      StartOnCreation: true

Outputs:
  GroupMembershipS3Path:
    Description: S3 path for group membership data outputs.
    Value: !Sub "s3://${AdminS3Bucket}/outputs/group_membership/"
  ObjectAccessS3Path:
    Description: S3 path for object access data outputs.
    Value: !Sub "s3://${AdminS3Bucket}/outputs/object_access/"
  FolderAssetsS3Path:
    Description: S3 path for folder assets data outputs.
    Value: !Sub "s3://${AdminS3Bucket}/outputs/folder_assets/"
  FolderLookupS3Path:
    Description: S3 path for folder lookup data outputs.
    Value: !Sub "s3://${AdminS3Bucket}/outputs/folder_lookup/"
  FolderPathS3Path:
    Description: S3 path for folder path data outputs.
    Value: !Sub "s3://${AdminS3Bucket}/outputs/folder_path/"
  CloudTrailLogTableName:
    Description: Name of the Glue table for CloudTrail logs.
    Value: !Ref CloudTrailLogTable
  CloudTrailLogS3Location:
    Description: S3 location where CloudTrail logs are stored.
    Value: !Ref CloudTrailLogS3Location