AWSTemplateFormatVersion: '2010-09-09'
Description: >
  EMR Data Lineage Demo with Amazon DataZone Integration - Deploys an EMR cluster with OpenLineage
  configured to capture and send data lineage events to SageMaker Unified Studio (DataZone).
  Demonstrates end-to-end lineage tracking from CSV sources through Spark transformations to Iceberg tables.
  Users must upload sample data and scripts to an S3 bucket before deploying this template.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Source Data Configuration"
        Parameters:
          - SourceS3BucketName
          - SourceCSVPrefix
          - SourceScriptsPrefix
      - Label:
          default: "Glue Database Configuration"
        Parameters:
          - GlueDatabaseName
      - Label:
          default: "SageMaker Unified Studio Configuration"
        Parameters:
          - DataZoneDomainId
      - Label:
          default: "Network Configuration"
        Parameters:
          - SubnetId
      - Label:
          default: "EMR Cluster Configuration"
        Parameters:
          - EMRReleaseLabel
          - MasterInstanceType
          - CoreInstanceType
          - CoreInstanceCount

Parameters:
  SourceS3BucketName:
    Type: String
    Description: 'S3 bucket containing CSV files and Spark scripts (e.g., my-data-bucket)'
    AllowedPattern: '^[a-z0-9][a-z0-9.\-]{1,61}[a-z0-9]$'
    ConstraintDescription: 'Must be a valid S3 bucket name'

  SourceCSVPrefix:
    Type: String
    Default: 'data/'
    Description: 'S3 prefix for CSV files (e.g., data/)'

  SourceScriptsPrefix:
    Type: String
    Default: 'scripts/'
    Description: 'S3 prefix for Spark job scripts (e.g., scripts/)'

  GlueDatabaseName:
    Type: String
    Description: 'Existing Glue database name for Iceberg tables'

  DataZoneDomainId:
    Type: String
    Description: 'SageMaker Unified Studio (DataZone) Domain ID (format: dzd_xxxxxxxx)'
    AllowedPattern: '^dzd[_-][a-z0-9]+'
    ConstraintDescription: 'Must be a valid DataZone domain ID starting with dzd_ or dzd-'

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: 'Subnet ID for EMR cluster (must have internet access)'

  EMRReleaseLabel:
    Type: String
    Default: 'emr-7.12.0'
    Description: 'EMR release version (7.5.0+ required for OpenLineage support)'
    AllowedValues:
      - 'emr-7.11.0'
      - 'emr-7.12.0'

  MasterInstanceType:
    Type: String
    Default: 'm5.xlarge'
    AllowedValues:
      - 'm5.xlarge'
      - 'm5.2xlarge'
      - 'm5.4xlarge'

  CoreInstanceType:
    Type: String
    Default: 'm5.xlarge'
    AllowedValues:
      - 'm5.xlarge'
      - 'm5.2xlarge'
      - 'm5.4xlarge'

  CoreInstanceCount:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 10

Resources:
  # Destination S3 Bucket (for Iceberg tables and EMR logs)
  DestinationBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub
        - 'emr-lineage-dest-${AWS::AccountId}-${StackSuffix}'
        - StackSuffix: !Select [0, !Split ['-', !Select [2, !Split ['/', !Ref 'AWS::StackId']]]]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Purpose
          Value: EMR-Lineage-Demo

  # DataZone Lineage Policy for EMR EC2 Role
  DataZoneLineagePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub 'DataZone-Lineage-Policy-${AWS::StackName}'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - 'datazone:PostLineageEvent'
            Resource: !Sub 'arn:aws:datazone:${AWS::Region}:${AWS::AccountId}:domain/${DataZoneDomainId}'
      Roles:
        - EMR_EC2_DefaultRole

  # Lake Formation Permissions on user-provided database
  LakeFormationPermissions:
    Type: AWS::LakeFormation::Permissions
    Properties:
      DataLakePrincipal:
        DataLakePrincipalIdentifier: !Sub 'arn:aws:iam::${AWS::AccountId}:role/EMR_EC2_DefaultRole'
      Permissions:
        - CREATE_TABLE
        - ALTER
        - DROP
      Resource:
        DatabaseResource:
          Name: !Ref GlueDatabaseName

  # Lake Formation Permissions on default database (required for Spark initialization)
  LakeFormationPermissionsDefault:
    Type: AWS::LakeFormation::Permissions
    Properties:
      DataLakePrincipal:
        DataLakePrincipalIdentifier: !Sub 'arn:aws:iam::${AWS::AccountId}:role/EMR_EC2_DefaultRole'
      Permissions:
        - DESCRIBE
      Resource:
        DatabaseResource:
          Name: 'default'

  # EMR Cluster
  EMRCluster:
    Type: AWS::EMR::Cluster
    Properties:
      Name: !Sub 'EMR-Lineage-Demo-${AWS::StackName}'
      ReleaseLabel: !Ref EMRReleaseLabel
      Applications:
        - Name: Spark
        - Name: Hadoop
      Configurations:
        - Classification: iceberg-defaults
          ConfigurationProperties:
            iceberg.enabled: 'true'
      Instances:
        MasterInstanceGroup:
          Name: Master
          InstanceCount: 1
          InstanceType: !Ref MasterInstanceType
          Market: ON_DEMAND
        CoreInstanceGroup:
          Name: Core
          InstanceCount: !Ref CoreInstanceCount
          InstanceType: !Ref CoreInstanceType
          Market: ON_DEMAND
        Ec2SubnetId: !Ref SubnetId
      ServiceRole: EMR_DefaultRole
      JobFlowRole: EMR_EC2_DefaultRole
      LogUri: !Sub 's3://${DestinationBucket}/logs/'
      VisibleToAllUsers: true
      Tags:
        - Key: Name
          Value: EMR-Lineage-Demo
        - Key: Purpose
          Value: Data-Lineage-Demonstration

Outputs:
  DestinationBucketName:
    Description: 'S3 bucket for Iceberg tables and EMR logs'
    Value: !Ref DestinationBucket

  GlueDatabaseName:
    Description: 'Glue database name'
    Value: !Ref GlueDatabaseName

  EMRClusterId:
    Description: 'EMR Cluster ID'
    Value: !Ref EMRCluster

  EMRMasterPublicDNS:
    Description: 'EMR Master Node Public DNS'
    Value: !GetAtt EMRCluster.MasterPublicDNS

  DataZoneDomainId:
    Description: 'DataZone Domain ID'
    Value: !Ref DataZoneDomainId

  Job1SubmitCommand:
    Description: 'Command to submit first Spark job (Employee Attendance)'
    Value: !Sub 'aws emr add-steps --cluster-id ${EMRCluster} --steps "Type=Spark,Name=EMR-Lineage-Demo-Job,ActionOnFailure=CONTINUE,Args=[--conf,spark.hadoop.hive.metastore.client.factory.class=com.amazonaws.glue.catalog.metastore.AWSGlueDataCatalogHiveClientFactory,--conf,spark.jars=/usr/share/aws/datazone-openlineage-spark/lib/DataZoneOpenLineageSpark-1.0.jar,--conf,spark.extraListeners=io.openlineage.spark.agent.OpenLineageSparkListener,--conf,spark.openlineage.transport.type=amazon_datazone_api,--conf,spark.openlineage.transport.domainId=${DataZoneDomainId},--conf,spark.glue.accountId=${AWS::AccountId},s3://${SourceS3BucketName}/${SourceScriptsPrefix}emr-lineage-spark-job.py,${SourceS3BucketName},${DestinationBucket},${GlueDatabaseName},employee_attendance]"'

  Job2SubmitCommand:
    Description: 'Command to submit second Spark job (Employee Compensation)'
    Value: !Sub 'aws emr add-steps --cluster-id ${EMRCluster} --steps "Type=Spark,Name=EMR-Lineage-Compensation-Job,ActionOnFailure=CONTINUE,Args=[--conf,spark.hadoop.hive.metastore.client.factory.class=com.amazonaws.glue.catalog.metastore.AWSGlueDataCatalogHiveClientFactory,--conf,spark.jars=/usr/share/aws/datazone-openlineage-spark/lib/DataZoneOpenLineageSpark-1.0.jar,--conf,spark.extraListeners=io.openlineage.spark.agent.OpenLineageSparkListener,--conf,spark.openlineage.transport.type=amazon_datazone_api,--conf,spark.openlineage.transport.domainId=${DataZoneDomainId},--conf,spark.glue.accountId=${AWS::AccountId},s3://${SourceS3BucketName}/${SourceScriptsPrefix}emr-lineage-compensation-job.py,${SourceS3BucketName},${DestinationBucket},${GlueDatabaseName},employee_attendance,employee_compensation]"'

  S3Prefixes:
    Description: 'S3 bucket structure'
    Value: !Sub |
      Source Bucket: ${SourceS3BucketName}
      - ${SourceCSVPrefix}    (CSV files: employees.csv, attendance.csv, etc.)
      - ${SourceScriptsPrefix} (Spark scripts: emr-lineage-spark-job.py, etc.)

      Destination Bucket: ${DestinationBucket}
      - iceberg/        (Iceberg table data)
      - logs/           (EMR logs)