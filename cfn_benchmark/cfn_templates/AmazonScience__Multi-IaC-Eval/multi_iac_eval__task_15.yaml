Description: |
  This stack automates the creation of EC2 DHCP options and an additional S3 bucket

Conditions:
  IsUsEast1: !Equals [!Ref AWS::Region, "us-east-1"]

Resources:

  # DHCP options using Amazon provided DNS
  IamRole:
    Type: AWS::EC2::DHCPOptions
    Properties:
      DomainName: !If [IsUsEast1, "ec2.internal", !Sub "${AWS::Region}.compute.internal"]
      DomainNameServers:
        - AmazonProvidedDNS
      NetbiosNodeType: 2

  # S3 bucket for storing logs
  LogBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub
        - "${AWS::StackName}-logs-${AWS::Region}"
        - {}
      VersioningConfiguration:
        Status: Enabled
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
              - POST
            AllowedOrigins:
              - "*"
            MaxAgeSeconds: 3000
      LifecycleConfiguration:
        Rules:
          - Id: "MoveToGlacier"
            Status: Enabled
            Transitions:
              - StorageClass: GLACIER
                TransitionInDays: 30
            ExpirationInDays: 365
      Tags:
        - Key: "Name"
          Value: !Sub "${AWS::StackName}-logs"