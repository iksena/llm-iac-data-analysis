# Bashlinux::Kubernetes Worker::EKS::IAM Role
#
#   Cloudformation template to deploy the IAM role
#   for the Kubernetes worker on EKS
#
#   Manuel F Martinez
#   Bashlinux
#   Los Angeles, CA
#
AWSTemplateFormatVersion: "2010-09-09"
Description: EKS Kubernetes Worker IAM role template

###############################################################################
Parameters:

  Environment:
    Description: Environment this IAM role is deployed to
    Type: String
    MinLength: "1"
    MaxLength: "20"
    Default: staging
    AllowedValues: [ "prod", "staging" ]
    ConstraintDescription: Environment name can only contain "prod" or "staging".

  Organization:
    Description: Organization or Customer name
    Type: String
    MinLength: "1"
    MaxLength: "32"
    Default: bashlinux
    AllowedPattern: "[a-zA-Z0-9\\-]*"
    ConstraintDescription: >
      Name of the organization must contains only letters, numbers and hyphens.

###############################################################################
Resources:

  KubernetesWorkerEksRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      RoleName: !Sub "${Organization}-${Environment}-kubernetes-worker-eks-role"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
      Tags:
      - Key: Name
        Value: !Sub "${Organization}-${Environment}-kubernetes-worker-eks-role"
      - Key: bashlinux:network-visibility
        Value: private
      - Key: bashlinux:organization-name
        Value: !Ref Organization
      - Key: bashlinux:environment-name
        Value: !Ref Environment
      - Key: bashlinux:application-role
        Value: kubernetes-worker
      - Key: bashlinux:application-id
        Value: !Ref AWS::StackName

  KubernetesWorkerEksInstanceProfile:
    Type: "AWS::IAM::InstanceProfile"
    DependsOn: KubernetesWorkerEksRole
    Properties:
      InstanceProfileName: !Sub "${Organization}-${Environment}-kubernetes-worker-eks-role"
      Path: "/"
      Roles:
        - !Sub "${Organization}-${Environment}-kubernetes-worker-eks-role"

  # IAM Policies --------------------------------------------------------------
  AlbIngressControllerPolicy:
    Type: "AWS::IAM::Policy"
    Properties:
      PolicyName: !Sub "${Organization}-${Environment}-alb-ingress-controller-policy"
      PolicyDocument:
        "Fn::Transform":
          Name: AWS::Include
          Parameters:
            Location: "s3://bashlinux-devops/iam-policies/iam_policy_bashlinux_alb_ingress_contoller.json"
      Roles: [ !Ref KubernetesWorkerEksRole ]

###############################################################################
Outputs:

  KubernetesWorkerEksRoleArn:
    Description: The ARN of the role to use for Kubernetes worker servers
    Value: !GetAtt KubernetesWorkerEksRole.Arn
    Export:
      Name: !Sub "${Organization}-${Environment}-worker-KubernetesEksRoleArn"

  KubernetesWorkerEksRoleId:
    Description: The ID of the IAM role to use for Kubernetes worker servers
    Value: !GetAtt KubernetesWorkerEksRole.RoleId
    Export:
      Name: !Sub "${Organization}-${Environment}-worker-KubernetesEksRoleId"

  KubernetesWorkerEksRoleName:
    Description: The IAM role to use for Kubernetes worker servers
    Value: !Ref KubernetesWorkerEksRole
    Export:
      Name: !Sub "${Organization}-${Environment}-worker-KubernetesEksRoleName"

  KubernetesWorkerEc2InstanceProfileArn:
    Description: The ARN of the instance profile for Kubernetes worker servers
    Value: !GetAtt KubernetesWorkerEksInstanceProfile.Arn
    Export:
      Name: !Sub "${Organization}-${Environment}-worker-KubernetesWorkerEksInstanceProfileArn"