AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Lambda-backed custom resource that installs the Archestra Helm chart
  on the EKS cluster. Handles Create, Update, and Delete lifecycle events.

Parameters:
  EnvironmentName:
    Type: String

  DeploymentSize:
    Type: String
    AllowedValues: [XSmall, Small, Medium, Large]

  ArchestraVersion:
    Type: String

  ClusterName:
    Type: String

  DomainName:
    Type: String

  CertificateArn:
    Type: String

  AdminEmail:
    Type: String

  AdminPassword:
    Type: String
    NoEcho: true

  DatabaseUrlSecretArn:
    Type: String

  ArchestraServiceAccountRoleArn:
    Type: String

  LbControllerRoleArn:
    Type: String

  VpcId:
    Type: String

  PrivateSubnetIds:
    Type: String

  EnableBedrockAccess:
    Type: String
    Default: "false"

  EnableObservability:
    Type: String
    Default: "false"

  OtelEndpoint:
    Type: String
    Default: ""

Resources:
  # ---------- Lambda Execution Role ----------
  HelmInstallerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-helm-installer"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: EksAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - eks:DescribeCluster
                  - eks:ListClusters
                Resource: !Sub "arn:aws:eks:${AWS::Region}:${AWS::AccountId}:cluster/${ClusterName}"
        - PolicyName: SecretsAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref DatabaseUrlSecretArn
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${EnvironmentName}/*"
        - PolicyName: StsAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sts:GetCallerIdentity
                Resource: "*"

  # ---------- Lambda Function ----------
  HelmInstallerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${EnvironmentName}-helm-installer"
      PackageType: Image
      Code:
        ImageUri: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${EnvironmentName}-helm-installer:latest"
      Role: !GetAtt HelmInstallerRole.Arn
      Timeout: 900
      MemorySize: 512
      Environment:
        Variables:
          AWS_REGION: !Ref AWS::Region
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-helm-installer"

  # ---------- Custom Resource: Helm Install ----------
  ArchestraHelmRelease:
    Type: Custom::HelmInstall
    Properties:
      ServiceToken: !GetAtt HelmInstallerFunction.Arn
      # Pass all values needed for Helm values generation
      ClusterName: !Ref ClusterName
      DeploymentSize: !Ref DeploymentSize
      ArchestraVersion: !Ref ArchestraVersion
      DomainName: !Ref DomainName
      CertificateArn: !Ref CertificateArn
      AdminEmail: !Ref AdminEmail
      AdminPassword: !Ref AdminPassword
      DatabaseUrlSecretArn: !Ref DatabaseUrlSecretArn
      ArchestraServiceAccountRoleArn: !Ref ArchestraServiceAccountRoleArn
      LbControllerRoleArn: !Ref LbControllerRoleArn
      VpcId: !Ref VpcId
      EnableBedrockAccess: !Ref EnableBedrockAccess
      OtelEndpoint: !Ref OtelEndpoint
      # Force update on version change
      Version: !Ref ArchestraVersion

  # ---------- ECR Repository for Lambda Image ----------
  HelmInstallerEcrRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${EnvironmentName}-helm-installer"
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep only 5 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 5
                },
                "action": { "type": "expire" }
              }
            ]
          }

Outputs:
  HelmInstallerFunctionArn:
    Value: !GetAtt HelmInstallerFunction.Arn

  EcrRepositoryUri:
    Value: !GetAtt HelmInstallerEcrRepo.RepositoryUri
    Description: Push the helm-installer Docker image here before deploying