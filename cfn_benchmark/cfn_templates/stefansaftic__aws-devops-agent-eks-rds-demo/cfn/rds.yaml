AWSTemplateFormatVersion: '2010-09-09'
Description: EKS-FAIL-DEMO - RDS Postgres instance for API backend

Parameters:
  ProjectName:
    Type: String
    Default: devops-agent-demo
  VpcId:
    Type: String
  VpcCidr:
    Type: String
  PrivateSubnetIds:
    Type: CommaDelimitedList
  DbInstanceClass:
    Type: String
    Default: db.t3.micro
  DbAllocatedStorage:
    Type: Number
    Default: 20
  DbMasterUsername:
    Type: String
    Default: demoadmin
  DbMasterPassword:
    Type: String
    Default: DemoPass2026!
    NoEcho: true

Resources:
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub ${ProjectName} RDS subnet group
      SubnetIds: !Ref PrivateSubnetIds
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-db-subnet-group'}
        - {Key: auto-delete, Value: never}

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow Postgres from VPC
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: !Ref VpcCidr
          Description: Postgres from EKS pods
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-rds-sg'}
        - {Key: auto-delete, Value: never}

  RdsInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub ${ProjectName}-api-db
      Engine: postgres
      EngineVersion: '16.4'
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: !Ref DbAllocatedStorage
      StorageType: gp3
      MasterUsername: !Ref DbMasterUsername
      MasterUserPassword: !Ref DbMasterPassword
      DBName: apidemo
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups:
        - !Ref DbSecurityGroup
      MultiAZ: false
      PubliclyAccessible: false
      BackupRetentionPeriod: 0
      DeletionProtection: false
      EnablePerformanceInsights: true
      MonitoringInterval: 60
      MonitoringRoleArn: !GetAtt RdsMonitoringRole.Arn
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-api-db
        - Key: auto-delete
          Value: never

  RdsMonitoringRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-rds-monitoring
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: monitoring.rds.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonRDSEnhancedMonitoringRole
      Tags:
        - {Key: auto-delete, Value: never}

Outputs:
  RdsEndpoint:
    Value: !GetAtt RdsInstance.Endpoint.Address
  RdsPort:
    Value: !GetAtt RdsInstance.Endpoint.Port
  RdsSecurityGroupId:
    Value: !Ref DbSecurityGroup
  RdsInstanceId:
    Value: !Ref RdsInstance