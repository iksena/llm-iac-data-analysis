AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: tasktracker backend
Globals:
  Function:
    Runtime: nodejs20.x
    Architectures:
    - x86_64
    MemorySize: 128
    Timeout: 30
    Tracing: Active
    LoggingConfig:
      LogFormat: JSON
  Api:
    TracingEnabled: true
Resources:
  TaskApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Cors:
        AllowMethods: '''GET,POST,PATCH,DELETE,OPTIONS'''
        AllowHeaders: '''Content-Type,Authorization'''
        AllowOrigin: '''http://localhost:5173'''
      Auth:
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: arn:aws:cognito-idp:us-east-2:786830913882:userpool/us-east-2_7n0JvpVsf
  TasksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Tasks
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: userId
        AttributeType: S
      - AttributeName: taskId
        AttributeType: S
      KeySchema:
      - AttributeName: userId
        KeyType: HASH
      - AttributeName: taskId
        KeyType: RANGE
  HabitsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Habits
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: userId
        AttributeType: S
      - AttributeName: habitId
        AttributeType: S
      KeySchema:
      - AttributeName: userId
        KeyType: HASH
      - AttributeName: habitId
        KeyType: RANGE
  GetTasksFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/get-tasks.handler
      Description: Get all tasks for the authenticated user
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: TasksTable
      Environment:
        Variables:
          TASKS_TABLE:
            Ref: TasksTable
      Events:
        GetTasks:
          Type: Api
          Properties:
            RestApiId:
              Ref: TaskApi
            Path: /tasks
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
      CodeUri: GetTasksFunction
    Metadata:
      SamResourceId: GetTasksFunction
  CreateTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/create-task.handler
      Description: Create a task for the authenticated user
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: TasksTable
      Environment:
        Variables:
          TASKS_TABLE:
            Ref: TasksTable
      Events:
        CreateTask:
          Type: Api
          Properties:
            RestApiId:
              Ref: TaskApi
            Path: /tasks
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
      CodeUri: CreateTaskFunction
    Metadata:
      SamResourceId: CreateTaskFunction
  DeleteTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/delete-task.handler
      Description: Delete a task for the authenticated user
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: TasksTable
      Environment:
        Variables:
          TASKS_TABLE:
            Ref: TasksTable
      Events:
        DeleteTask:
          Type: Api
          Properties:
            RestApiId:
              Ref: TaskApi
            Path: /tasks/{taskId}
            Method: DELETE
            Auth:
              Authorizer: CognitoAuthorizer
      CodeUri: DeleteTaskFunction
    Metadata:
      SamResourceId: DeleteTaskFunction
  CompleteTaskFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/complete-task.handler
      Description: Mark a task as completed for the authenticated user
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: TasksTable
      Environment:
        Variables:
          TASKS_TABLE:
            Ref: TasksTable
      Events:
        CompleteTask:
          Type: Api
          Properties:
            RestApiId:
              Ref: TaskApi
            Path: /tasks/{taskId}/complete
            Method: PATCH
            Auth:
              Authorizer: CognitoAuthorizer
      CodeUri: CompleteTaskFunction
    Metadata:
      SamResourceId: CompleteTaskFunction
  GetHabitsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/get-habits.handler
      Description: Get all habits for the authenticated user
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: HabitsTable
      Environment:
        Variables:
          HABITS_TABLE:
            Ref: HabitsTable
      Events:
        GetHabits:
          Type: Api
          Properties:
            RestApiId:
              Ref: TaskApi
            Path: /habits
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
      CodeUri: GetHabitsFunction
    Metadata:
      SamResourceId: GetHabitsFunction
  CreateHabitFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/create-habit.handler
      Description: Create a habit for the authenticated user
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: HabitsTable
      Environment:
        Variables:
          HABITS_TABLE:
            Ref: HabitsTable
      Events:
        CreateHabit:
          Type: Api
          Properties:
            RestApiId:
              Ref: TaskApi
            Path: /habits
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
      CodeUri: CreateHabitFunction
    Metadata:
      SamResourceId: CreateHabitFunction
  CompleteHabitFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/complete-habit.handler
      Description: Mark a habit as completed for a specific date
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: HabitsTable
      Environment:
        Variables:
          HABITS_TABLE:
            Ref: HabitsTable
      Events:
        CompleteHabit:
          Type: Api
          Properties:
            RestApiId:
              Ref: TaskApi
            Path: /habits/{habitId}/complete
            Method: PATCH
            Auth:
              Authorizer: CognitoAuthorizer
      CodeUri: CompleteHabitFunction
    Metadata:
      SamResourceId: CompleteHabitFunction
  TaskApiDefault4xx:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId:
        Ref: TaskApi
      ResponseType: DEFAULT_4XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: '''http://localhost:5173'''
        gatewayresponse.header.Access-Control-Allow-Headers: '''Content-Type,Authorization'''
        gatewayresponse.header.Access-Control-Allow-Methods: '''GET,POST,PATCH,DELETE,OPTIONS'''
  TaskApiDefault5xx:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId:
        Ref: TaskApi
      ResponseType: DEFAULT_5XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: '''http://localhost:5173'''
        gatewayresponse.header.Access-Control-Allow-Headers: '''Content-Type,Authorization'''
        gatewayresponse.header.Access-Control-Allow-Methods: '''GET,POST,PATCH,DELETE,OPTIONS'''
  TaskApiUnauthorized:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId:
        Ref: TaskApi
      ResponseType: UNAUTHORIZED
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: '''http://localhost:5173'''
        gatewayresponse.header.Access-Control-Allow-Headers: '''Content-Type,Authorization'''
        gatewayresponse.header.Access-Control-Allow-Methods: '''GET,POST,PATCH,DELETE,OPTIONS'''
  TaskApiAccessDenied:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId:
        Ref: TaskApi
      ResponseType: ACCESS_DENIED
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: '''http://localhost:5173'''
        gatewayresponse.header.Access-Control-Allow-Headers: '''Content-Type,Authorization'''
        gatewayresponse.header.Access-Control-Allow-Methods: '''GET,POST,PATCH,DELETE,OPTIONS'''
Outputs:
  WebEndpoint:
    Description: API Gateway endpoint URL for Prod stage
    Value:
      Fn::Sub: https://${TaskApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod