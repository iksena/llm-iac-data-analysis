AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  GitHub Actions本番release用のOIDC role、CloudFormation実行role、ECR、SAM artifact bucket。
  管理者が一度だけ明示承認して作成する。

Parameters:
  GitHubOidcProviderArn:
    Type: String
    Description: 対象accountに既存のtoken.actions.githubusercontent.com OIDC provider ARN
    AllowedPattern: "arn:(aws|aws-us-gov|aws-cn):iam::[0-9]{12}:oidc-provider/token.actions.githubusercontent.com"
  GitHubOwner:
    Type: String
    AllowedPattern: "[A-Za-z0-9_.-]+"
  GitHubOwnerId:
    Type: String
    Description: GitHub OIDCのimmutable subjectに含まれるrepository owner ID
    AllowedPattern: "[0-9]+"
  GitHubRepository:
    Type: String
    AllowedPattern: "[A-Za-z0-9_.-]+"
  GitHubRepositoryId:
    Type: String
    Description: GitHub OIDCのimmutable subjectに含まれるrepository ID
    AllowedPattern: "[0-9]+"
  ProductionStackName:
    Type: String
    Default: football-scheduler-production
    AllowedPattern: "[A-Za-z][A-Za-z0-9-]{0,127}"

Resources:
  SolverRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: IMMUTABLE
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: >-
          {"rules":[{"rulePriority":1,"description":"直近10個のrelease imageを保持","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}
      RepositoryPolicyText:
        Version: "2012-10-17"
        Statement:
          - Sid: LambdaECRImageRetrievalPolicy
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
            Condition:
              ArnLike:
                aws:SourceArn: !Sub >-
                  arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProductionStackName}-*
          - Sid: DenyNonTLS
            Effect: Deny
            Principal: "*"
            Action: ecr:*
            Condition:
              Bool:
                aws:SecureTransport: "false"
      Tags:
        - Key: Project
          Value: football-scheduler

  SamArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldArtifacts
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Project
          Value: football-scheduler

  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ManageFootballSchedulerStackServices
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ManageScopedServices
                Effect: Allow
                Action:
                  - apigateway:*
                  - budgets:*
                  - cloudwatch:*
                  - logs:*
                  - lambda:*
                  - s3:*
                  - sns:*
                  - xray:*
                Resource: "*"
              - Sid: ExpandServerlessTransform
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub "arn:${AWS::Partition}:cloudformation:us-east-1:aws:transform/Serverless-2016-10-31"
              - Sid: ManageStackRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:PutRolePolicy
                  - iam:GetRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PassRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProductionStackName}-*"
              - Sid: CreateApiGatewayServiceLinkedRole
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: !Sub >-
                  arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/ops.apigateway.amazonaws.com/AWSServiceRoleForAPIGateway
                Condition:
                  StringEquals:
                    iam:AWSServiceName: ops.apigateway.amazonaws.com

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepository}@${GitHubRepositoryId}:environment:production"
      MaxSessionDuration: 3600
      Policies:
        - PolicyName: DeployFootballScheduler
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CloudFormationDeployment
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:CreateStack
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DetectStackDrift
                  - cloudformation:DetectStackResourceDrift
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:DescribeStacks
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListChangeSets
                  - cloudformation:UpdateStack
                Resource: !Sub "arn:${AWS::Partition}:cloudformation:us-east-1:${AWS::AccountId}:stack/${ProductionStackName}/*"
              - Sid: ReadProductionStackDriftStatus
                Effect: Allow
                Action:
                  - cloudformation:BatchDescribeTypeConfigurations
                  - cloudformation:DescribeStackDriftDetectionStatus
                Resource: "*"
              - Sid: PassExecutionRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
              - Sid: PushSolverImages
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:ListImages
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt SolverRepository.Arn
              - Sid: EcrLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: SamArtifacts
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !GetAtt SamArtifactBucket.Arn
                  - !Sub "${SamArtifactBucket.Arn}/*"
              - Sid: LambdaReleaseChecksAndRollback
                Effect: Allow
                Action:
                  - lambda:GetAlias
                  - lambda:InvokeFunction
                  - lambda:ListVersionsByFunction
                  - lambda:UpdateAlias
                Resource: "*"
              - Sid: ReadProductionAlarms
                Effect: Allow
                Action: cloudwatch:DescribeAlarms
                Resource: "*"
              - Sid: AccountPrerequisiteChecks
                Effect: Allow
                Action:
                  - freetier:GetAccountPlanState
                  - lambda:GetAccountSettings
                  - sts:GetCallerIdentity
                Resource: "*"

Outputs:
  GitHubDeployRoleArn:
    Value: !GetAtt GitHubDeployRole.Arn
  CloudFormationExecutionRoleArn:
    Value: !GetAtt CloudFormationExecutionRole.Arn
  EcrRepositoryUri:
    Value: !GetAtt SolverRepository.RepositoryUri
  SamArtifactBucketName:
    Value: !Ref SamArtifactBucket