AWSTemplateFormatVersion: "2010-09-09"
Description: "Creation of parameters and buckets"

Parameters:
  URLString:
    Type: String
    Default: https://api.marketstack.com/v2/eod
  SecretName:
    Type: String
    Default: DataProviderAPIKey
  SecretKey:
    Type: String
    Default: Key

Resources:
  ParameterMarketDataBucket:
    Type: AWS::SSM::Parameter
    Properties:
      Name: "/pew/DATA_BUCKET"
      Value: !Sub "pew-marketdata-${AWS::AccountId}"
      Type: "String"
  ParameterOutputBucket:
    Type: AWS::SSM::Parameter
    Properties:
      Name: "/pew/OUT_BUCKET"
      Value: !Sub "pew-report-${AWS::AccountId}"
      Type: "String"
  ParameterModelTable:
    Type: AWS::SSM::Parameter
    Properties:
      Name: "/pew/MODELS_TABLE"
      Value: "Models"
      Type: "String"
  ParameterTickerTable:
    Type: AWS::SSM::Parameter
    Properties:
      Name: "/pew/TICKERS_TABLE"
      Value: "Tickers"
      Type: "String"
  ParameterResultTable:
    Type: AWS::SSM::Parameter
    Properties:
      Name: "/pew/RESULTS_TABLE"
      Value: "Results"
      Type: "String"
  ParameterMarketDataAPIURL:
    Type: AWS::SSM::Parameter
    Properties:
      Name: "/pew/URL_BASE"
      Value: !Sub ${URLString}
      Type: "String"
  ParameterSecretName:
    Type: AWS::SSM::Parameter
    Properties:
      Name: "/pew/SECRET_NAME"
      Value: !Sub ${SecretName}
      Type: "String"
  ParameterSecretField:
    Type: AWS::SSM::Parameter
    Properties:
      Name: "/pew/SECRET_KEY"
      Value: !Sub ${SecretKey}
      Type: "String"
  MarketDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "pew-marketdata-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Suspended
  OutputDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "pew-report-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Suspended
  ServiceDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "pew-resources-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Suspended
  WebsiteDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "pew-website-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Suspended
  AmplifyBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteDataBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "AllowAmplifyToReadObjects"
            Effect: "Allow"
            Principal:
              Service: "amplify.amazonaws.com"
            Action:
              - "s3:GetObject"
              - "s3:GetObjectAcl"
            Resource: !Sub "arn:aws:s3:::${WebsiteDataBucket}/*"
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref "AWS::AccountId"