AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Last Modified: 2025/10/28 14:19:13
  "This template deploys the NIH RADx Data Hub SQS Queues."
Parameters:
  Environment:
    Type: String
    Description: The Project Environment
    AllowedValues:
      - dev
      - test
      - prod
      - shared
  ProjectName:
    Type: String
    Description: The Project name
    Default: radx
    AllowedValues:
      - radx

Conditions:
  DEV: !Equals [!Ref Environment, dev]
  TEST: !Equals [!Ref Environment, test]
  PROD: !Equals [!Ref Environment, prod]
  NOTDEV: !Not [!Equals [!Ref Environment, dev]]
  NOTPROD: !Not [!Equals [!Ref Environment, prod]]

Resources:

    PiiSqsQueueDlq:
        Type: "AWS::SQS::Queue"
        Properties:
            DelaySeconds: "0"
            MaximumMessageSize: "262144"
            MessageRetentionPeriod: "345600"
            ReceiveMessageWaitTimeSeconds: "0"
            VisibilityTimeout: "30"
            QueueName: !Sub "${ProjectName}-pii-sqs-queue-dlq-${Environment}"

    PiiSqsQueue:
        Type: "AWS::SQS::Queue"
        Properties:
            DelaySeconds: "0"
            MaximumMessageSize: "262144"
            MessageRetentionPeriod: "345600"
            ReceiveMessageWaitTimeSeconds: "0"
            VisibilityTimeout: "30"
            QueueName: !Sub "${ProjectName}-pii-sqs-queue-${Environment}"
            RedrivePolicy:
              deadLetterTargetArn: !GetAtt PiiSqsQueueDlq.Arn
              maxReceiveCount: 10

    EmailQueue:
        Type: "AWS::SQS::Queue"
        Properties:
            DelaySeconds: "0"
            MaximumMessageSize: "262144"
            MessageRetentionPeriod: "345600"
            ReceiveMessageWaitTimeSeconds: "0"
            VisibilityTimeout: "30"
            QueueName: !Sub "${ProjectName}-email-queue-${Environment}"

    SftpQueue:
        Type: "AWS::SQS::Queue"
        Properties:
            DelaySeconds: "0"
            MaximumMessageSize: "262144"
            MessageRetentionPeriod: "345600"
            ReceiveMessageWaitTimeSeconds: "0"
            VisibilityTimeout: "30"
            QueueName: !Sub "${ProjectName}-sftp-queue-${Environment}"
            RedrivePolicy:
              deadLetterTargetArn: !GetAtt SftpQueueDlq.Arn
              maxReceiveCount: 10

    SftpQueueDlq:
        Type: "AWS::SQS::Queue"
        Properties:
            DelaySeconds: "0"
            MaximumMessageSize: "262144"
            MessageRetentionPeriod: "345600"
            ReceiveMessageWaitTimeSeconds: "0"
            VisibilityTimeout: "30"
            QueueName: !Sub "${ProjectName}-sftp-queue-dlq-${Environment}"

    PiiSqsQueuePolicy:
        Type: "AWS::SQS::QueuePolicy"
        Properties:
            PolicyDocument: !Sub "{\"Version\":\"2012-10-17\",\"Id\":\"__default_policy_ID\",\"Statement\":[{\"Sid\":\"__owner_statement\",\"Effect\":\"Allow\",\"Principal\":{\"AWS\":\"arn:aws:iam::${AWS::AccountId}:root\"},\"Action\":\"SQS:*\",\"Resource\":\"${PiiSqsQueueDlq}\"}]}"
            Queues:
              - !Sub "https://sqs.${AWS::Region}.amazonaws.com/${AWS::AccountId}/${PiiSqsQueueDlq.QueueName}"

    EmailQueuePolicy:
        Type: "AWS::SQS::QueuePolicy"
        Properties:
            PolicyDocument: !Sub "{\"Version\":\"2012-10-17\",\"Id\":\"__default_policy_ID\",\"Statement\":[{\"Sid\":\"__owner_statement\",\"Effect\":\"Allow\",\"Principal\":{\"AWS\":\"arn:aws:iam::${AWS::AccountId}:root\"},\"Action\":\"SQS:*\",\"Resource\":\"${EmailQueue}\"}]}"
            Queues:
              - !Sub "https://sqs.${AWS::Region}.amazonaws.com/${AWS::AccountId}/${EmailQueue.QueueName}"

    SftpQueuePolicy:
        Type: "AWS::SQS::QueuePolicy"
        Properties:
            PolicyDocument: !Sub "{\"Version\":\"2012-10-17\",\"Id\":\"__default_policy_ID\",\"Statement\":[{\"Sid\":\"__owner_statement\",\"Effect\":\"Allow\",\"Principal\":{\"AWS\":\"arn:aws:iam::${AWS::AccountId}:root\"},\"Action\":\"SQS:*\",\"Resource\":\"${SftpQueue}\"},{\"Sid\":\"AWSEvents_sftp-${Environment}\",\"Effect\":\"Allow\",\"Principal\":{\"Service\":\"events.amazonaws.com\"},\"Action\":\"sqs:SendMessage\",\"Resource\":\"${SftpQueue}\",\"Condition\":{\"ArnEquals\":{\"aws:SourceArn\":\"arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/${ProjectName}-sftp-${Environment}\"}}},{\"Sid\":\"SendMessageFromSNSTopic\",\"Effect\":\"Allow\",\"Principal\":{\"AWS\":\"*\"},\"Action\":\"sqs:SendMessage\",\"Resource\":\"${SftpQueue}\",\"Condition\":{\"ArnEquals\":{\"aws:SourceArn\":\"arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${ProjectName}-sftp-object-upload-topic-${Environment}\"}}},{\"Sid\":\"AWSEvents_sftp-${Environment}\",\"Effect\":\"Allow\",\"Principal\":{\"Service\":\"events.amazonaws.com\"},\"Action\":\"sqs:SendMessage\",\"Resource\":\"${SftpQueue}\",\"Condition\":{\"ArnEquals\":{\"aws:SourceArn\":\"arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/${ProjectName}-sftp-${Environment}\"}}}]}"
            Queues:
              - !Sub "https://sqs.${AWS::Region}.amazonaws.com/${AWS::AccountId}/${SftpQueue.QueueName}"

    SftpQueueDlqPolicy:
        Type: "AWS::SQS::QueuePolicy"
        Properties:
            PolicyDocument: !Sub "{\"Version\":\"2012-10-17\",\"Id\":\"__default_policy_ID\",\"Statement\":[{\"Sid\":\"__owner_statement\",\"Effect\":\"Allow\",\"Principal\":{\"AWS\":\"arn:aws:iam::${AWS::AccountId}:root\"},\"Action\":\"SQS:*\",\"Resource\":\"${SftpQueueDlq}\"},{\"Sid\":\"AWSEvents_sftp-dlq-${Environment}\",\"Effect\":\"Allow\",\"Principal\":{\"Service\":\"events.amazonaws.com\"},\"Action\":\"sqs:SendMessage\",\"Resource\":\"${SftpQueueDlq}\",\"Condition\":{\"ArnEquals\":{\"aws:SourceArn\":\"arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/${ProjectName}-sftp-${Environment}\"}}}]}"
            Queues:
              - !Sub "https://sqs.${AWS::Region}.amazonaws.com/${AWS::AccountId}/${SftpQueueDlq.QueueName}"

Outputs:
  PiiSqsQueueArn:
    Description: "PII SQS Queue ARN"
    Value: !GetAtt PiiSqsQueue.Arn
    Export:
      Name: !Sub "RADx-SQS-PiiSqsQueue-${Environment}"

  PiiSqsQueueDlqArn:
    Description: "PII SQS Queue DLQ ARN"
    Value: !GetAtt PiiSqsQueueDlq.Arn
    Export:
      Name: !Sub "RADx-SQS-PiiSqsQueueDlq-${Environment}"

  EmailQueueArn:
    Description: "Email Queue ARN"
    Value: !GetAtt EmailQueue.Arn
    Export:
      Name: !Sub "RADx-SQS-EmailQueue-${Environment}"

  SftpQueueArn:
    Description: "SFTP Queue ARN"
    Value: !GetAtt SftpQueue.Arn
    Export:
      Name: !Sub "RADx-SQS-SftpQueue-${Environment}"

  SftpQueueDlqArn:
    Description: "SFTP Queue DLQ ARN"
    Value: !GetAtt SftpQueueDlq.Arn
    Export:
      Name: !Sub "RADx-SQS-SftpQueueDlq-${Environment}"