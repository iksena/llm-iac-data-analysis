AWSTemplateFormatVersion: 2010-09-09
Description: Core-VPCPeeringConnections Template.
  This template creates all VPCs, route tables, and VPCPeeringConnections.
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Stack Dependencies
        Parameters:
          - CoreVPCStackName
          - BuildVPCStackName
          - ProductionVPCStackName
          - StagingVPCStackName
          - UATVPCStackName
          - TestingVPCStackName
          - DevelopmentVPCStackName
    ParameterLabels:
      CoreVPCStackName:
        default: Core VPC Stack Name
      BuildVPCStackName:
        default: Build VPC Stack Name
      ProductionVPCStackName:
        default: Production VPC Stack Name
      StagingVPCStackName:
        default: Staging VPC Stack Name
      UATVPCStackName:
        default: UAT VPC Stack Name
      TestingVPCStackName:
        default: Testing VPC Stack Name
      DevelopmentVPCStackName:
        default: Development VPC Stack Name
Parameters:
  CoreVPCStackName:
    Description: Name of the CloudFormation Stack containing the Core VPC
    Type: String
    MinLength: 8
    MaxLength: 64
    Default: Core-VPC
    AllowedPattern: ^[A-Z][-a-zA-Z0-9]*$
    ConstraintDescription: must begin with an upper case letter and contain alphanumeric characters and dashes.
  BuildVPCStackName:
    Description: Name of the CloudFormation Stack containing the Build VPC
    Type: String
    MaxLength: 64
    Default: ''
    AllowedPattern: (^$|^[A-Z][-a-zA-Z0-9]*$)
    ConstraintDescription: must begin with an upper case letter and contain alphanumeric characters and dashes.
  ProductionVPCStackName:
    Description: Name of the CloudFormation Stack containing the Production VPC
    Type: String
    MaxLength: 64
    Default: ''
    AllowedPattern: (^$|^[A-Z][-a-zA-Z0-9]*$)
    ConstraintDescription: must begin with an upper case letter and contain alphanumeric characters and dashes.
  StagingVPCStackName:
    Description: Name of the CloudFormation Stack containing the Staging VPC
    Type: String
    MaxLength: 64
    Default: ''
    AllowedPattern: (^$|^[A-Z][-a-zA-Z0-9]*$)
    ConstraintDescription: must begin with an upper case letter and contain alphanumeric characters and dashes.
  UATVPCStackName:
    Description: Name of the CloudFormation Stack containing the UAT VPC
    Type: String
    MaxLength: 64
    Default: ''
    AllowedPattern: (^$|^[A-Z][-a-zA-Z0-9]*$)
    ConstraintDescription: must begin with an upper case letter and contain alphanumeric characters and dashes.
  TestingVPCStackName:
    Description: Name of the CloudFormation Stack containing the Testing VPC
    Type: String
    MaxLength: 64
    Default: ''
    AllowedPattern: (^$|^[A-Z][-a-zA-Z0-9]*$)
    ConstraintDescription: must begin with an upper case letter and contain alphanumeric characters and dashes.
  DevelopmentVPCStackName:
    Description: Name of the CloudFormation Stack containing the Development VPC
    Type: String
    MaxLength: 64
    Default: ''
    AllowedPattern: (^$|^[A-Z][-a-zA-Z0-9]*$)
    ConstraintDescription: must begin with an upper case letter and contain alphanumeric characters and dashes.
Conditions:
  PeerToBuildVPC: !Not [ !Equals [ !Ref BuildVPCStackName, '' ]]
  PeerToProductionVPC: !Not [ !Equals [ !Ref ProductionVPCStackName, '' ]]
  PeerToStagingVPC: !Not [ !Equals [ !Ref StagingVPCStackName, '' ]]
  PeerToUATVPC: !Not [ !Equals [ !Ref UATVPCStackName, '' ]]
  PeerToTestingVPC: !Not [ !Equals [ !Ref TestingVPCStackName, '' ]]
  PeerToDevelopmentVPC: !Not [ !Equals [ !Ref DevelopmentVPCStackName, '' ]]
Resources:
  CoreVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub ${CoreVPCStackName}-VPC
  CorePublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref CoreVPC
      Tags:
        - Key: Name
          Value: !Sub ${CoreVPCStackName}-PublicRouteTable
  CorePrivateRouteTableA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref CoreVPC
      Tags:
        - Key: Name
          Value: !Sub ${CoreVPCStackName}-PrivateRouteTableA
  CorePrivateRouteTableB:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref CoreVPC
      Tags:
        - Key: Name
          Value: !Sub ${CoreVPCStackName}-PrivateRouteTableB
  BuildVPC:
    Type: AWS::EC2::VPC
    Condition: PeerToBuildVPC
    Properties:
      CidrBlock: 10.1.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub ${BuildVPCStackName}-VPC
  BuildPublicRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: PeerToBuildVPC
    Properties:
      VpcId: !Ref BuildVPC
      Tags:
        - Key: Name
          Value: !Sub ${BuildVPCStackName}-PublicRouteTable
  BuildPrivateRouteTableA:
    Type: AWS::EC2::RouteTable
    Condition: PeerToBuildVPC
    Properties:
      VpcId: !Ref BuildVPC
      Tags:
        - Key: Name
          Value: !Sub ${BuildVPCStackName}-PrivateRouteTableA
  BuildPrivateRouteTableB:
    Type: AWS::EC2::RouteTable
    Condition: PeerToBuildVPC
    Properties:
      VpcId: !Ref BuildVPC
      Tags:
        - Key: Name
          Value: !Sub ${BuildVPCStackName}-PrivateRouteTableB
  ProductionVPC:
    Type: AWS::EC2::VPC
    Condition: PeerToProductionVPC
    Properties:
      CidrBlock: 10.2.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub ${ProductionVPCStackName}-VPC
  ProductionPublicRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: PeerToProductionVPC
    Properties:
      VpcId: !Ref ProductionVPC
      Tags:
        - Key: Name
          Value: !Sub ${ProductionVPCStackName}-PublicRouteTable
  ProductionPrivateRouteTableA:
    Type: AWS::EC2::RouteTable
    Condition: PeerToProductionVPC
    Properties:
      VpcId: !Ref ProductionVPC
      Tags:
        - Key: Name
          Value: !Sub ${ProductionVPCStackName}-PrivateRouteTableA
  ProductionPrivateRouteTableB:
    Type: AWS::EC2::RouteTable
    Condition: PeerToProductionVPC
    Properties:
      VpcId: !Ref ProductionVPC
      Tags:
        - Key: Name
          Value: !Sub ${ProductionVPCStackName}-PrivateRouteTableB
  StagingVPC:
    Type: AWS::EC2::VPC
    Condition: PeerToStagingVPC
    Properties:
      CidrBlock: 10.3.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub ${StagingVPCStackName}-VPC
  StagingPublicRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: PeerToStagingVPC
    Properties:
      VpcId: !Ref StagingVPC
      Tags:
        - Key: Name
          Value: !Sub ${StagingVPCStackName}-PublicRouteTable
  StagingPrivateRouteTableA:
    Type: AWS::EC2::RouteTable
    Condition: PeerToStagingVPC
    Properties:
      VpcId: !Ref StagingVPC
      Tags:
        - Key: Name
          Value: !Sub ${StagingVPCStackName}-PrivateRouteTableA
  StagingPrivateRouteTableB:
    Type: AWS::EC2::RouteTable
    Condition: PeerToStagingVPC
    Properties:
      VpcId: !Ref StagingVPC
      Tags:
        - Key: Name
          Value: !Sub ${StagingVPCStackName}-PrivateRouteTableB
  UATVPC:
    Type: AWS::EC2::VPC
    Condition: PeerToUATVPC
    Properties:
      CidrBlock: 10.4.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub ${UATVPCStackName}-VPC
  UATPublicRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: PeerToUATVPC
    Properties:
      VpcId: !Ref UATVPC
      Tags:
        - Key: Name
          Value: !Sub ${UATVPCStackName}-PublicRouteTable
  UATPrivateRouteTableA:
    Type: AWS::EC2::RouteTable
    Condition: PeerToUATVPC
    Properties:
      VpcId: !Ref UATVPC
      Tags:
        - Key: Name
          Value: !Sub ${UATVPCStackName}-PrivateRouteTableA
  UATPrivateRouteTableB:
    Type: AWS::EC2::RouteTable
    Condition: PeerToUATVPC
    Properties:
      VpcId: !Ref UATVPC
      Tags:
        - Key: Name
          Value: !Sub ${UATVPCStackName}-PrivateRouteTableB
  TestingVPC:
    Type: AWS::EC2::VPC
    Condition: PeerToTestingVPC
    Properties:
      CidrBlock: 10.5.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub ${TestingVPCStackName}-VPC
  TestingPublicRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: PeerToTestingVPC
    Properties:
      VpcId: !Ref TestingVPC
      Tags:
        - Key: Name
          Value: !Sub ${TestingVPCStackName}-PublicRouteTable
  TestingPrivateRouteTableA:
    Type: AWS::EC2::RouteTable
    Condition: PeerToTestingVPC
    Properties:
      VpcId: !Ref TestingVPC
      Tags:
        - Key: Name
          Value: !Sub ${TestingVPCStackName}-PrivateRouteTableA
  TestingPrivateRouteTableB:
    Type: AWS::EC2::RouteTable
    Condition: PeerToTestingVPC
    Properties:
      VpcId: !Ref TestingVPC
      Tags:
        - Key: Name
          Value: !Sub ${TestingVPCStackName}-PrivateRouteTableB
  DevelopmentVPC:
    Type: AWS::EC2::VPC
    Condition: PeerToDevelopmentVPC
    Properties:
      CidrBlock: 10.6.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub ${DevelopmentVPCStackName}-VPC
  DevelopmentPublicRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: PeerToDevelopmentVPC
    Properties:
      VpcId: !Ref DevelopmentVPC
      Tags:
        - Key: Name
          Value: !Sub ${DevelopmentVPCStackName}-PublicRouteTable
  DevelopmentPrivateRouteTableA:
    Type: AWS::EC2::RouteTable
    Condition: PeerToDevelopmentVPC
    Properties:
      VpcId: !Ref DevelopmentVPC
      Tags:
        - Key: Name
          Value: !Sub ${DevelopmentVPCStackName}-PrivateRouteTableA
  DevelopmentPrivateRouteTableB:
    Type: AWS::EC2::RouteTable
    Condition: PeerToDevelopmentVPC
    Properties:
      VpcId: !Ref DevelopmentVPC
      Tags:
        - Key: Name
          Value: !Sub ${DevelopmentVPCStackName}-PrivateRouteTableB
  BuildVPCPeeringConnection:
    Type: AWS::EC2::VPCPeeringConnection
    Properties:
      VpcId: !Ref CoreVPC
      PeerVpcId: !Ref BuildVPC
      Tags:
        - Key: Name
          Value: !Sub Core-BuildVPCPeeringConnection
    Condition: PeerToBuildVPC
  PublicCoreToBuildRoute:
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: !GetAtt BuildVPC.CidrBlock
      RouteTableId: !Ref CorePublicRouteTable
      VpcPeeringConnectionId: !Ref BuildVPCPeeringConnection
    Condition: PeerToBuildVPC
  PublicBuildToCoreRoute:
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: !GetAtt CoreVPC.CidrBlock
      RouteTableId: !Ref BuildPublicRouteTable
      VpcPeeringConnectionId: !Ref BuildVPCPeeringConnection
    Condition: PeerToBuildVPC
  PrivateCoreToBuildRouteA:
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: !GetAtt BuildVPC.CidrBlock
      RouteTableId: !Ref CorePrivateRouteTableA
      VpcPeeringConnectionId: !Ref BuildVPCPeeringConnection
    Condition: PeerToBuildVPC
  PrivateBuildToCoreRouteA:
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: !GetAtt CoreVPC.CidrBlock
      RouteTableId: !Ref BuildPrivateRouteTableA
      VpcPeeringConnectionId: !Ref BuildVPCPeeringConnection
    Condition: PeerToBuildVPC
  PrivateCoreToBuildRouteB:
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: !GetAtt BuildVPC.CidrBlock
      RouteTableId: !Ref CorePrivateRouteTableB
      VpcPeeringConnectionId: !Ref BuildVPCPeeringConnection
    Condition: PeerToBuildVPC
  PrivateBuildToCoreRouteB:
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: !GetAtt CoreVPC.CidrBlock
      RouteTableId: !Ref BuildPrivateRouteTableB
      VpcPeeringConnectionId: !Ref BuildVPCPeeringConnection
    Condition: PeerToBuildVPC
  ProductionVPCPeeringConnection:
    Type: AWS::EC2::VPCPeeringConnection
    Properties:
      VpcId: !Ref CoreVPC
      PeerVpcId: !Ref ProductionVPC
      Tags:
        - Key: Name
          Value: !Sub Core-ProductionVPCPeeringConnection
    Condition: PeerToProductionVPC
  PublicCoreToProductionRoute:
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: !GetAtt ProductionVPC.CidrBlock
      RouteTableId: !Ref CorePublicRouteTable
      VpcPeeringConnectionId: !Ref ProductionVPCPeeringConnection
    Condition: PeerToProductionVPC
  PublicProductionToCoreRoute:
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: !GetAtt CoreVPC.CidrBlock
      RouteTableId: !Ref ProductionPublicRouteTable
      VpcPeeringConnectionId: !Ref ProductionVPCPeeringConnection
    Condition: PeerToProductionVPC
  PrivateCoreToProductionRouteA:
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: !GetAtt ProductionVPC.CidrBlock
      RouteTableId: !Ref CorePrivateRouteTableA
      VpcPeeringConnectionId: !Ref ProductionVPCPeeringConnection
    Condition: PeerToProductionVPC
  PrivateProductionToCoreRouteA:
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: !GetAtt CoreVPC.CidrBlock
      RouteTableId: !Ref ProductionPrivateRouteTableA
      VpcPeeringConnectionId: !Ref ProductionVPCPeeringConnection
    Condition: PeerToProductionVPC
  PrivateCoreToProductionRouteB:
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: !GetAtt ProductionVPC.CidrBlock
      RouteTableId: !Ref CorePrivateRouteTableB
      VpcPeeringConnectionId: !Ref ProductionVPCPeeringConnection
    Condition: PeerToProductionVPC
  PrivateProductionToCoreRouteB:
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: !GetAtt CoreVPC.CidrBlock
      RouteTableId: !Ref ProductionPrivateRouteTableB
      VpcPeeringConnectionId: !Ref ProductionVPCPeeringConnection
    Condition: PeerToProductionVPC
  StagingVPCPeeringConnection:
    Type: AWS::EC2::VPCPeeringConnection
    Properties:
      VpcId: !Ref CoreVPC
      PeerVpcId: !Ref StagingVPC
      Tags:
        - Key: Name
          Value: !Sub Core-StagingVPCPeeringConnection
    Condition: PeerToStagingVPC
  PublicCoreToStagingRoute:
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: !GetAtt StagingVPC.CidrBlock
      RouteTableId: !Ref CorePublicRouteTable
      VpcPeeringConnectionId: !Ref StagingVPCPeeringConnection
    Condition: PeerToStagingVPC
  PublicStagingToCoreRoute:
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: !GetAtt CoreVPC.CidrBlock
      RouteTableId: !Ref StagingPublicRouteTable
      VpcPeeringConnectionId: !Ref StagingVPCPeeringConnection
    Condition: PeerToStagingVPC
  PrivateCoreToStagingRouteA:
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: !GetAtt StagingVPC.CidrBlock
      RouteTableId: !Ref CorePrivateRouteTableA
      VpcPeeringConnectionId: !Ref StagingVPCPeeringConnection
    Condition: PeerToStagingVPC
  PrivateStagingToCoreRouteA:
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: !GetAtt CoreVPC.CidrBlock
      RouteTableId: !Ref StagingPrivateRouteTableA
      VpcPeeringConnectionId: !Ref StagingVPCPeeringConnection
    Condition: PeerToStagingVPC
  PrivateCoreToStagingRouteB:
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: !GetAtt StagingVPC.CidrBlock
      RouteTableId: !Ref CorePrivateRouteTableB
      VpcPeeringConnectionId: !Ref StagingVPCPeeringConnection
    Condition: PeerToStagingVPC
  PrivateStagingToCoreRouteB:
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: !GetAtt CoreVPC.CidrBlock
      RouteTableId: !Ref StagingPrivateRouteTableB
      VpcPeeringConnectionId: !Ref StagingVPCPeeringConnection
    Condition: PeerToStagingVPC
  UATVPCPeeringConnection:
    Type: AWS::EC2::VPCPeeringConnection
    Properties:
      VpcId: !Ref CoreVPC
      PeerVpcId: !Ref UATVPC
      Tags:
        - Key: Name
          Value: !Sub Core-UATVPCPeeringConnection
    Condition: PeerToUATVPC
  PublicCoreToUATRoute:
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: !GetAtt UATVPC.CidrBlock
      RouteTableId: !Ref CorePublicRouteTable
      VpcPeeringConnectionId: !Ref UATVPCPeeringConnection
    Condition: PeerToUATVPC
  PublicUATToCoreRoute:
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: !GetAtt CoreVPC.CidrBlock
      RouteTableId: !Ref UATPublicRouteTable
      VpcPeeringConnectionId: !Ref UATVPCPeeringConnection
    Condition: PeerToUATVPC
  PrivateCoreToUATRouteA:
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: !GetAtt UATVPC.CidrBlock
      RouteTableId: !Ref CorePrivateRouteTableA
      VpcPeeringConnectionId: !Ref UATVPCPeeringConnection
    Condition: PeerToUATVPC
  PrivateUATToCoreRouteA:
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: !GetAtt CoreVPC.CidrBlock
      RouteTableId: !Ref UATPrivateRouteTableA
      VpcPeeringConnectionId: !Ref UATVPCPeeringConnection
    Condition: PeerToUATVPC
  PrivateCoreToUATRouteB:
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: !GetAtt UATVPC.CidrBlock
      RouteTableId: !Ref CorePrivateRouteTableB
      VpcPeeringConnectionId: !Ref UATVPCPeeringConnection
    Condition: PeerToUATVPC
  PrivateUATToCoreRouteB:
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: !GetAtt CoreVPC.CidrBlock
      RouteTableId: !Ref UATPrivateRouteTableB
      VpcPeeringConnectionId: !Ref UATVPCPeeringConnection
    Condition: PeerToUATVPC
  TestingVPCPeeringConnection:
    Type: AWS::EC2::VPCPeeringConnection
    Properties:
      VpcId: !Ref CoreVPC
      PeerVpcId: !Ref TestingVPC
      Tags:
        - Key: Name
          Value: !Sub Core-TestingVPCPeeringConnection
    Condition: PeerToTestingVPC
  PublicCoreToTestingRoute:
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: !GetAtt TestingVPC.CidrBlock
      RouteTableId: !Ref CorePublicRouteTable
      VpcPeeringConnectionId: !Ref TestingVPCPeeringConnection
    Condition: PeerToTestingVPC
  PublicTestingToCoreRoute:
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: !GetAtt CoreVPC.CidrBlock
      RouteTableId: !Ref TestingPublicRouteTable
      VpcPeeringConnectionId: !Ref TestingVPCPeeringConnection
    Condition: PeerToTestingVPC
  PrivateCoreToTestingRouteA:
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: !GetAtt TestingVPC.CidrBlock
      RouteTableId: !Ref CorePrivateRouteTableA
      VpcPeeringConnectionId: !Ref TestingVPCPeeringConnection
    Condition: PeerToTestingVPC
  PrivateTestingToCoreRouteA:
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: !GetAtt CoreVPC.CidrBlock
      RouteTableId: !Ref TestingPrivateRouteTableA
      VpcPeeringConnectionId: !Ref TestingVPCPeeringConnection
    Condition: PeerToTestingVPC
  PrivateCoreToTestingRouteB:
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: !GetAtt TestingVPC.CidrBlock
      RouteTableId: !Ref CorePrivateRouteTableB
      VpcPeeringConnectionId: !Ref TestingVPCPeeringConnection
    Condition: PeerToTestingVPC
  PrivateTestingToCoreRouteB:
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: !GetAtt CoreVPC.CidrBlock
      RouteTableId: !Ref TestingPrivateRouteTableB
      VpcPeeringConnectionId: !Ref TestingVPCPeeringConnection
    Condition: PeerToTestingVPC
  DevelopmentVPCPeeringConnection:
    Type: AWS::EC2::VPCPeeringConnection
    Properties:
      VpcId: !Ref CoreVPC
      PeerVpcId: !Ref DevelopmentVPC
      Tags:
        - Key: Name
          Value: !Sub Core-DevelopmentVPCPeeringConnection
    Condition: PeerToDevelopmentVPC
  PublicCoreToDevelopmentRoute:
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: !GetAtt DevelopmentVPC.CidrBlock
      RouteTableId: !Ref CorePublicRouteTable
      VpcPeeringConnectionId: !Ref DevelopmentVPCPeeringConnection
    Condition: PeerToDevelopmentVPC
  PublicDevelopmentToCoreRoute:
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: !GetAtt CoreVPC.CidrBlock
      RouteTableId: !Ref DevelopmentPublicRouteTable
      VpcPeeringConnectionId: !Ref DevelopmentVPCPeeringConnection
    Condition: PeerToDevelopmentVPC
  PrivateCoreToDevelopmentRouteA:
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: !GetAtt DevelopmentVPC.CidrBlock
      RouteTableId: !Ref CorePrivateRouteTableA
      VpcPeeringConnectionId: !Ref DevelopmentVPCPeeringConnection
    Condition: PeerToDevelopmentVPC
  PrivateDevelopmentToCoreRouteA:
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: !GetAtt CoreVPC.CidrBlock
      RouteTableId: !Ref DevelopmentPrivateRouteTableA
      VpcPeeringConnectionId: !Ref DevelopmentVPCPeeringConnection
    Condition: PeerToDevelopmentVPC
  PrivateCoreToDevelopmentRouteB:
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: !GetAtt DevelopmentVPC.CidrBlock
      RouteTableId: !Ref CorePrivateRouteTableB
      VpcPeeringConnectionId: !Ref DevelopmentVPCPeeringConnection
    Condition: PeerToDevelopmentVPC
  PrivateDevelopmentToCoreRouteB:
    Type: AWS::EC2::Route
    Properties:
      DestinationCidrBlock: !GetAtt CoreVPC.CidrBlock
      RouteTableId: !Ref DevelopmentPrivateRouteTableB
      VpcPeeringConnectionId: !Ref DevelopmentVPCPeeringConnection
    Condition: PeerToDevelopmentVPC
