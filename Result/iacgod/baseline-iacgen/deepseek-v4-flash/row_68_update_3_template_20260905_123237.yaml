AWSTemplateFormatVersion: 2010-09-09
Description: MediaPackage live channel with HLS and DASH origin endpoints and optional VOD workflows
Parameters:
  ArchiveBucket:
    Type: String
    Default: ''
    Description: Existing S3 bucket name used for live-to-VOD storage. When supplied, origin endpoints use Origination=DENY.
  VodSourceBucket:
    Type: String
    Default: ''
    Description: Existing S3 bucket name that contains VOD source content. When supplied, VOD packaging resources are provisioned.
  OutputType:
    Type: String
    Default: APPLE_HLS
    AllowedValues:
      - APPLE_HLS
      - ISO_DASH
      - ALL
    Description: VOD packaging output type to provision.
  ManifestName:
    Type: String
    Default: index
    Description: Base manifest name for HLS and DASH endpoints/packaging configurations.
  HlsSegmentDurationSeconds:
    Type: Number
    Default: 4
    MinValue: 1
    MaxValue: 15
    Description: Segment duration in seconds for HLS endpoints.
  StartoverWindowSeconds:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 604800
    Description: Startover window in seconds for live origin endpoints.
  NamePrefix:
    Type: String
    Default: mediapackage
    Description: Logical prefix used when creating resource names.
  Environment:
    Type: String
    Default: dev
    Description: Environment tag value applied to all created resources.
  CustomTagKey:
    Type: String
    Default: ''
    Description: Optional custom tag key.
  CustomTagValue:
    Type: String
    Default: ''
    Description: Optional custom tag value.
Conditions:
  HasArchiveBucket: !Not [!Equals [!Ref ArchiveBucket, '']]
  HasVodSourceBucket: !Not [!Equals [!Ref VodSourceBucket, '']]
  IsAppleHls: !Equals [!Ref OutputType, 'APPLE_HLS']
  IsIsoDash: !Equals [!Ref OutputType, 'ISO_DASH']
  IsAll: !Equals [!Ref OutputType, 'ALL']
  HasCustomTag: !And [!Not [!Equals [!Ref CustomTagKey, '']], !Not [!Equals [!Ref CustomTagValue, '']]]
  CreateHlsPackagingConfig: !And [HasVodSourceBucket, !Or [IsAppleHls, IsAll]]
  CreateDashPackagingConfig: !And [HasVodSourceBucket, !Or [IsIsoDash, IsAll]]
Resources:
  MediaPackageChannel:
    Type: AWS::MediaPackage::Channel
    Properties:
      Id: !Sub '${NamePrefix}-channel'
      Description: !Sub 'MediaPackage live channel for ${NamePrefix}'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - !If [HasCustomTag, {Key: !Ref CustomTagKey, Value: !Ref CustomTagValue}, !Ref 'AWS::NoValue']
  HlsOriginEndpoint:
    Type: AWS::MediaPackage::OriginEndpoint
    Properties:
      Id: !Sub '${NamePrefix}-hls-endpoint'
      ChannelId: !Ref MediaPackageChannel
      Description: !Sub 'HLS origin endpoint for ${NamePrefix}'
      ManifestName: !Ref ManifestName
      StartoverWindowSeconds: !Ref StartoverWindowSeconds
      Origination: !If [HasArchiveBucket, 'DENY', 'ALLOW']
      HlsPackage:
        SegmentDurationSeconds: !Ref HlsSegmentDurationSeconds
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - !If [HasCustomTag, {Key: !Ref CustomTagKey, Value: !Ref CustomTagValue}, !Ref 'AWS::NoValue']
  DashOriginEndpoint:
    Type: AWS::MediaPackage::OriginEndpoint
    Properties:
      Id: !Sub '${NamePrefix}-dash-endpoint'
      ChannelId: !Ref MediaPackageChannel
      Description: !Sub 'DASH origin endpoint for ${NamePrefix}'
      ManifestName: !Ref ManifestName
      StartoverWindowSeconds: !Ref StartoverWindowSeconds
      Origination: !If [HasArchiveBucket, 'DENY', 'ALLOW']
      DashPackage:
        SegmentDurationSeconds: 2
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - !If [HasCustomTag, {Key: !Ref CustomTagKey, Value: !Ref CustomTagValue}, !Ref 'AWS::NoValue']
  VodPackagingGroup:
    Type: AWS::MediaPackage::PackagingGroup
    Condition: HasVodSourceBucket
    Properties:
      Id: !Sub '${NamePrefix}-vod-packaging-group'
      Description: !Sub 'VOD packaging group for ${NamePrefix}'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - !If [HasCustomTag, {Key: !Ref CustomTagKey, Value: !Ref CustomTagValue}, !Ref 'AWS::NoValue']
  MediaPackageVodRole:
    Type: AWS::IAM::Role
    Condition: HasVodSourceBucket
    Properties:
      RoleName: !Sub '${NamePrefix}-mediapackage-vod-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: mediapackage.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: MediaPackageVODAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:aws:s3:::${VodSourceBucket}'
                  - !Sub 'arn:aws:s3:::${VodSourceBucket}/*'
              - !If
                - HasArchiveBucket
                - Effect: Allow
                  Action:
                    - s3:GetObject
                    - s3:PutObject
                    - s3:GetBucketLocation
                    - s3:ListBucket
                  Resource:
                    - !Sub 'arn:aws:s3:::${ArchiveBucket}'
                    - !Sub 'arn:aws:s3:::${ArchiveBucket}/*'
                - !Ref 'AWS::NoValue'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - !If [HasCustomTag, {Key: !Ref CustomTagKey, Value: !Ref CustomTagValue}, !Ref 'AWS::NoValue']
  HlsVodPackagingConfiguration:
    Type: AWS::MediaPackage::PackagingConfiguration
    Condition: CreateHlsPackagingConfig
    Properties:
      Id: !Sub '${NamePrefix}-hls-vod-packaging-config'
      PackagingGroupId: !Ref VodPackagingGroup
      HlsPackage:
        HlsManifest:
          ManifestName: !Ref ManifestName
        SegmentDurationSeconds: !Ref HlsSegmentDurationSeconds
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - !If [HasCustomTag, {Key: !Ref CustomTagKey, Value: !Ref CustomTagValue}, !Ref 'AWS::NoValue']
  DashVodPackagingConfiguration:
    Type: AWS::MediaPackage::PackagingConfiguration
    Condition: CreateDashPackagingConfig
    Properties:
      Id: !Sub '${NamePrefix}-dash-vod-packaging-config'
      PackagingGroupId: !Ref VodPackagingGroup
      DashPackage:
        DashManifest:
          ManifestName: !Ref ManifestName
        SegmentDurationSeconds: 2
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - !If [HasCustomTag, {Key: !Ref CustomTagKey, Value: !Ref CustomTagValue}, !Ref 'AWS::NoValue']
Outputs:
  ChannelId:
    Value: !Ref MediaPackageChannel
  ChannelArn:
    Value: !GetAtt MediaPackageChannel.Arn
  HlsEndpointUrl:
    Value: !GetAtt HlsOriginEndpoint.Url
  DashEndpointUrl:
    Value: !GetAtt DashOriginEndpoint.Url
  VodPackagingGroupId:
    Condition: HasVodSourceBucket
    Value: !Ref VodPackagingGroup
  VodPackagingGroupArn:
    Condition: HasVodSourceBucket
    Value: !GetAtt VodPackagingGroup.Arn
  MediaPackageVodRoleArn:
    Condition: HasVodSourceBucket
    Value: !GetAtt MediaPackageVodRole.Arn
  HlsVodPackagingConfigurationId:
    Condition: CreateHlsPackagingConfig
    Value: !Ref HlsVodPackagingConfiguration
  DashVodPackagingConfigurationId:
    Condition: CreateDashPackagingConfig
    Value: !Ref DashVodPackagingConfiguration