          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /types/{id}/collections
            Method: get
      Environment:
        Variables:
          PRODUCTION_APP_URL: !Ref productionAppUrl
          NAMESPACE: !Sub "anything-${stage}"
          AWS_NODEJS_CONNECTION_REUSE_ENABLED: 1
#          NODE_OPTIONS: --enable-source-maps
    Metadata:
      Fn::Transform:
        Name: 'AWS::Include'
        Parameters: { Location: template.metadata.yaml }
