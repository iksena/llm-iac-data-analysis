Rules:
  LicenseAgreementRule:
    Assertions:
    - Assert:
        Fn::Contains:
        - - I agree
        - Ref: LicenseAgreement
      AssertDescription: User must agree to the terms of the license agreement.

  SubnetsInVPC:
    Assertions:
      - Assert: !EachMemberIn
          - !ValueOfAll
            - AWS::EC2::Subnet::Id
            - VpcId
          - !RefAll 'AWS::EC2::VPC::Id'
        AssertDescription: All subnets must in the VPC

Conditions:
  3AZCondition: !Equals [!Ref NumberOfAZs, 3]
  AcceptLicense: !Equals [!Ref LicenseAgreement, 'I agree']
  OCSCondition: !Equals [!Ref StorageType, 'ocs']
  NfsCondition: !Equals [!Ref StorageType, 'aws-elastic']

Resources:
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AmazonEC2RoleforSSM
      Path: /
      Policies:
        - PolicyName: lambda-cleanUpLambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:SendCommand
                  - ssm:PutParameter
                  - ssm:GetParameter
                  - ssm:DeleteParameter
                Resource:
                  - '*'
              - Effect: Allow
                Action:
                  - logs:FilterLogEvents
                Resource:
                  - '*'

  BootNodeIamRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
        - Effect: "Allow"
          Principal:
            Service:
            - "ec2.amazonaws.com"
          Action:
          - "sts:AssumeRole"
        - Effect: "Allow"
          Principal:
            AWS:
            - Ref: AWS::AccountId
          Action:
          - "sts:AssumeRole"
      MaxSessionDuration: 43200
      Path: "/"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2RoleforSSM
        - arn:aws:iam::aws:policy/AWSCloudFormationReadOnlyAccess
        - arn:aws:iam::aws:policy/AdministratorAccess
      Policies:
      - PolicyName: bootnode-policy
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
          - Effect: "Allow"
            Action: "ec2:Describe*"
            Resource: "*"
          - Effect: "Allow"
            Action: "ec2:AttachVolume"
            Resource: "*"
          - Effect: "Allow"
            Action: "ec2:DetachVolume"
            Resource: "*"
          - Effect: "Allow"
            Action: "route53:*"
            Resource: "*"
          - Effect: "Allow"
            Action:
            - "secretsmanager:GetSecretValue"
            - "secretsmanager:UpdateSecret"
            - "secretsmanager:CreateSecret"
            Resource: "*"
          - Effect: "Allow"
            Action: "s3:ListBucket"
            Resource: !Sub arn:aws:s3:::${ICPDDeploymentLogsBucketName}
          - Effect: "Allow"
            Action: "s3:PutObject"
            Resource: !Sub arn:aws:s3:::${ICPDDeploymentLogsBucketName}/*
          - Effect: Allow
            Action:
            - ssm:SendCommand
            - ssm:PutParameter
            - ssm:GetParameter
            Resource:
            - '*'

  BootnodeInstanceProfile:
    Type: "AWS::IAM::InstanceProfile"
    Properties:
      Path: "/"
      Roles:
      - Ref: "BootNodeIamRole"

  BootnodeSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Cluster Bootnode Security Group
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 22
        ToPort: 22
        CidrIp: !Ref BootNodeAccessCIDR
      VpcId: !Ref VPCID

  BootnodeInstance:
    Type: AWS::EC2::Instance
    Metadata:
      AWS::CloudFormation::Init:
        configSets:
          Required:
            - StackPropertiesFile
        StackPropertiesFile:
          files:
            /root/mystack.props:
              content: !Sub |
                AWS_REGION=${AWS::Region}
                AWS_STACKID="${AWS::StackId}"
                AWS_STACKNAME="${AWS::StackName}"
              mode: '000644'
              owner: root
              group: root
            /home/ec2-user/destroy.sh:
              content: !Sub |
                echo "$1 - Destroying"
                export HOME=/home/ec2-user
                unset AWS_SESSION_TOKEN AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY
                out=$(aws sts assume-role --role-arn ${BootNodeIamRole.Arn} --role-session-name OCPInstall)
                export AWS_ACCESS_KEY_ID=$(echo "$out" | jq -r '.Credentials.AccessKeyId')
                echo $AWS_ACCESS_KEY_ID
                export AWS_SECRET_ACCESS_KEY=$(echo "$out" | jq -r '.Credentials.SecretAccessKey')
                echo $AWS_SECRET_ACCESS_KEY
                export AWS_SESSION_TOKEN=$(echo "$out" | jq -r '.Credentials.SessionToken')
                echo $AWS_SESSION_TOKEN
                export STATUS_DIR=$HOME/cpd-status
                export CONFIG_DIR=$HOME/cpd-config
                export CP_ENTITLEMENT_KEY=${APIKey}
                export ROSA_LOGIN_TOKEN=${RosaToken}
                cd $HOME/cloud-pak-deployer
                /bin/bash ./cp-deploy.sh build
                /bin/bash ./cp-deploy.sh vault set --vault-secret aws-access-key --vault-secret-value $(echo "$out" | jq -r '.Credentials.AccessKeyId')
                /bin/bash ./cp-deploy.sh vault set --vault-secret aws-secret-access-key --vault-secret-value $(echo "$out" | jq -r '.Credentials.SecretAccessKey')
                /bin/bash ./cp-deploy.sh vault set --vault-secret aws-session-token --vault-secret-value $(echo "$out" | jq -r '.Credentials.SessionToken')
                /bin/bash ./cp-deploy.sh env destroy -e env_id=${ClusterName} --confirm-destroy
                aws ssm put-parameter --name "$1_CleanupStatus" --type "String" --value "READY" --overwrite
                echo "Destroy completed"
              mode: '000755'
              owner: root
              group: root
            /root/.aws/config:
              content: !Sub |
                [default]
                region=${AWS::Region}
              mode: '000600'
              owner: root
              group: root
    Properties:
      KeyName: !Ref 'KeyPairName'
      ImageId: !FindInMap [AWSAMIRegionMap, !Ref "AWS::Region", BootNodeAmiId]
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 50
            VolumeType: gp2
      IamInstanceProfile: !Ref BootnodeInstanceProfile
      Tags:
        - Key: Name
          Value:
            !Sub
            - "${ClusterName}-bootnode"
            - ClusterName: !Ref ClusterName
      InstanceType: t3.large
      NetworkInterfaces:
      - GroupSet:
        - !Ref BootnodeSecurityGroup
        AssociatePublicIpAddress: true
        DeviceIndex: '0'
        DeleteOnTermination: true
        SubnetId: !Ref PublicSubnet1ID
      UserData:
        Fn::Base64:
          !Sub
          - |
            #!/bin/bash -x

            #Added the next 5 lines to include required tools for the installation of CP4D
            yum update -y
            yum install -y yum-utils wget git jq podman httpd-tools unzip curl python39
            podman version

            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip awscliv2.zip
            ./aws/install &> /var/log/userdata.awscli_install.log

            git clone https://github.com/aws-quickstart/quickstart-linux-utilities.git
            sed -i "s/aws-cfn-bootstrap-latest.tar.gz/aws-cfn-bootstrap-py3-latest.tar.gz/g" /quickstart-linux-utilities/quickstart-cfn-tools.source
            export P=/quickstart-linux-utilities/quickstart-cfn-tools.source
            source $P

            qs_bootstrap_pip || qs_err " pip bootstrap failed "
            qs_aws-cfn-bootstrap || qs_err "cfn bootstrap failed"

            #pip3 install awscli  &> /var/log/userdata.awscli_install.log || qs_err " awscli install failed "
            /usr/local/bin/cfn-init -v --stack ${AWS::StackName} --resource BootnodeInstance --configsets Required --region ${AWS::Region}
            sudo cp /usr/local/bin/aws /usr/bin/aws

            cd /tmp
            qs_retry_command 10 wget https://s3-us-west-1.amazonaws.com/amazon-ssm-us-west-1/latest/linux_amd64/amazon-ssm-agent.rpm
            qs_retry_command 10 yum install -y ./amazon-ssm-agent.rpm
            systemctl start amazon-ssm-agent
            systemctl enable amazon-ssm-agent
            rm -f ./amazon-ssm-agent.rpm

            wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
            chmod a+x /usr/local/bin/yq

            wget https://mirror.openshift.com/pub/openshift-v4/x86_64/clients/ocp/${OpenshiftVersion}/openshift-client-linux-${OpenshiftVersion}.tar.gz
            tar -xvzf openshift-client-linux-${OpenshiftVersion}.tar.gz
            sudo cp oc /usr/local/bin/
            sudo cp oc /usr/bin/
            sudo cp kubectl /usr/local/bin/
            sudo cp kubectl /usr/bin/

            wget https://mirror.openshift.com/pub/openshift-v4/clients/rosa/latest/rosa-linux.tar.gz
            tar -xvzf rosa-linux.tar.gz
            sudo cp rosa /usr/local/bin/
            sudo cp rosa /usr/bin/

            export ICPDInstallationCompletedURL='${ICPDInstallationCompletedHandle}'
            export AWS_REGION=${AWS::Region}
            export AWS_STACKID=${AWS::StackId}
            export AWS_STACKNAME=${AWS::StackName}

            export HOME=/home/ec2-user

            chmod +x $HOME/destroy.sh

            # generate public key
            ssh-keygen -t rsa -b 4096 -f $HOME/.ssh/id_rsa -q -N ""

            # Installing Cloud pak Deployer
            export HOME=/home/ec2-user
            cd $HOME

            git clone https://github.com/IBM/cloud-pak-deployer.git

            mkdir -p $HOME/cpd-config/config
            #sudo chown -R ec2-user:ec2-user $HOME/cpd-config/

            cd ./cloud-pak-deployer

            # copy openshift and CP4D config file to config dir
            wget https://ibm-aws-immersion-day.s3.us-east-2.amazonaws.com/cloudformation/config/cp4d-48x.yaml
            cp ./cp4d-473.yaml $HOME/cpd-config/config/

            # replace parameters in CPD
            sed -i 's/|CA|/'${CA}'/g' $HOME/cpd-config/config/cp4d-480yaml
            sed -i 's/|CDE|/'${CDE}'/g' $HOME/cpd-config/config/cp4d-480yaml
            sed -i 's/|DB2|/'${DB2}'/g' $HOME/cpd-config/config/cp4d-480yaml
            sed -i 's/|DB2U|/'${DB2U}'/g' $HOME/cpd-config/config/cp4d-480yaml
            sed -i 's/|DMC|/'${DMC}'/g' $HOME/cpd-config/config/cp4d-480yaml
            sed -i 's/|DV|/'${DV}'/g' $HOME/cpd-config/config/cp4d-480yaml
            sed -i 's/|FACTSHEET|/'${FACTSHEET}'/g' $HOME/cpd-config/config/cp4d-480yaml
            sed -i 's/|WATSONASSISTANT|/'${WatsonAssistant}'/g' $HOME/cpd-config/config/cp4d-480yaml
            sed -i 's/|WATSONDISCOVERY|/'${WatsonDiscovery}'/g' $HOME/cpd-config/config/cp4d-480yaml
            sed -i 's/|WATSONKNOWLEDGESTUDIO|/'${WatsonKnowledgeStudio}'/g' $HOME/cpd-config/config/cp4d-480yaml
            sed -i 's/|WATSONOPENSCALE|/'${OpenScale}'/g' $HOME/cpd-config/config/cp4d-480yaml
            sed -i 's/|WATSONSPEECH|/'${WatsonSpeech}'/g' $HOME/cpd-config/config/cp4d-480yaml
            sed -i 's/|WKC|/'${WKC}'/g' $HOME/cpd-config/config/cp4d-480yaml
            sed -i 's/|WML|/'${WML}'/g' $HOME/cpd-config/config/cp4d-480yaml
            sed -i 's/|WSL|/'${WSL}'/g' $HOME/cpd-config/config/cp4d-480yaml
            sed -i 's/|WSP|/'${WSP}'/g' $HOME/cpd-config/config/cp4d-480yaml
            sed -i 's/|RSTUDIO|/'${RSTUDIO}'/g' $HOME/cpd-config/config/cp4d-480yaml
            sed -i 's/|OPENPAGES|/'${OPENPAGES}'/g' $HOME/cpd-config/config/cp4d-480yaml
            sed -i 's/|WATSONXDATA|/'${WatsonxData}'/g' $HOME/cpd-config/config/cp4d-480.yaml

            # watsonx AI
            sed -i 's/|WATSONXAI|/'${WatsonxAI}'/g' $HOME/cpd-config/config/cp4d-480.yaml
            sed -i 's/|GOOGLEFLANT5XXL|/'${GoogleFlanT5Xxl}'/g' $HOME/cpd-config/config/cp4d-480.yaml
            sed -i 's/|GOOGLEFLANUL2|/'${GoogleFlanUl2}'/g' $HOME/cpd-config/config/cp4d-480.yaml
            sed -i 's/|ELEUTHERAIGPTNEOX20B|/'${EleutheraiGptNeox20b}'/g' $HOME/cpd-config/config/cp4d-480.yaml
            sed -i 's/|IBMGRANITE13BCHATV1|/'${IBMGranite13bChatV1}'/g' $HOME/cpd-config/config/cp4d-480.yaml
            sed -i 's/|IBMGRANITE13BINSTRUCTV1|/'${IBMGranite13bInstructV1}'/g' $HOME/cpd-config/config/cp4d-480.yaml
            sed -i 's/|METALLAMALLAMA270BCHAT|/'${MetaLlamaLlamaTwo70bChat}'/g' $HOME/cpd-config/config/cp4d-480.yaml
            sed -i 's/|IBMMPT7BINSTRUCT2|/'${IBMMpt7bInstruct2}'/g' $HOME/cpd-config/config/cp4d-480.yaml
            sed -i 's/|BIGSCIENCEMT0XXL|/'${BigscienceMt0Xxl}'/g' $HOME/cpd-config/config/cp4d-480.yaml
            sed -i 's/|BIGCODESTARCODER|/'${BigcodeStarcoder}'/g' $HOME/cpd-config/config/cp4d-480.yaml

            #if [ "${MultiAZ}" == "True" ]; then
            #  wget https://ibm-aws-immersion-day.s3.us-east-2.amazonaws.com/cloudformation/config/ocp-aws-rosa-elastic.yaml
            #  cp ./ocp-aws-rosa-elastic.yaml $HOME/cpd-config/config/ocp-aws-rosa-elastic.yaml
            #else
            #  wget https://ibm-aws-immersion-day.s3.us-east-2.amazonaws.com/cloudformation/config/ocp-aws-rosa-elastic-1az.yaml
            #  cp ./ocp-aws-rosa-elastic-1az.yaml $HOME/cpd-config/config/ocp-aws-rosa-elastic.yaml
            #fi

            echo "---" > $HOME/cpd-config/config/ocp-aws-rosa-elastic.yaml
            yq -i ".global_config.environment_name = \"${ClusterName}\"" $HOME/cpd-config/config/ocp-aws-rosa-elastic.yaml
            yq -i '.global_config.cloud_platform = "aws"' $HOME/cpd-config/config/ocp-aws-rosa-elastic.yaml
            yq -i ".global_config.aws_region = \"${AWS::Region}\"" $HOME/cpd-config/config/ocp-aws-rosa-elastic.yaml
            yq -i ".global_config.env_id = \"${ClusterName}\"" $HOME/cpd-config/config/ocp-aws-rosa-elastic.yaml
            yq -i ".global_config.confirm_destroy = False" $HOME/cpd-config/config/ocp-aws-rosa-elastic.yaml

            yq -i ".nfs_server[0].name = \"{{ env_id }}-elastic\"" $HOME/cpd-config/config/ocp-aws-rosa-elastic.yaml
            yq -i ".nfs_server[0].infrastructure.aws_region = \"{{ aws_region }}\"" $HOME/cpd-config/config/ocp-aws-rosa-elastic.yaml

            yq -i ".openshift[0].name = \"{{ env_id }}\"" $HOME/cpd-config/config/ocp-aws-rosa-elastic.yaml
            yq -i ".openshift[0].ocp_version = \"${OpenshiftVersion}\"" $HOME/cpd-config/config/ocp-aws-rosa-elastic.yaml
            yq -i ".openshift[0].compute_flavour = \"${ComputeInstanceType}\"" $HOME/cpd-config/config/ocp-aws-rosa-elastic.yaml
            yq -i ".openshift[0].compute_nodes = \"${NumberOfCompute}\"" $HOME/cpd-config/config/ocp-aws-rosa-elastic.yaml
            yq -i ".openshift[0].infrastructure.type = \"rosa\"" $HOME/cpd-config/config/ocp-aws-rosa-elastic.yaml
            yq -i ".openshift[0].infrastructure.aws_region = \"{{ aws_region }}\"" $HOME/cpd-config/config/ocp-aws-rosa-elastic.yaml
            yq -i ".openshift[0].infrastructure.use_sts = True" $HOME/cpd-config/config/ocp-aws-rosa-elastic.yaml

            if [ "${MultiAZ}" == "True" ]; then
              yq -i ".openshift[0].infrastructure.multi_zone = True" $HOME/cpd-config/config/ocp-aws-rosa-elastic.yaml
              yq -i ".openshift[0].infrastructure.subnet_ids += [ \"${PrivateSubnet1ID}\",\"${PrivateSubnet2ID}\",\"${PrivateSubnet3ID}\",\"${PublicSubnet1ID}\",\"${PublicSubnet2ID}\",\"${PublicSubnet3ID}\" ]" $HOME/cpd-config/config/ocp-aws-rosa-elastic.yaml
            else
              yq -i ".openshift[0].infrastructure.multi_zone = False" $HOME/cpd-config/config/ocp-aws-rosa-elastic.yaml
              yq -i ".openshift[0].infrastructure.subnet_ids += [ \"${PrivateSubnet1ID}\",\"${PublicSubnet1ID}\" ]" $HOME/cpd-config/config/ocp-aws-rosa-elastic.yaml
            fi

            if [ "${StorageType}" == "aws-elastic" ]; then
              yq -i ".openshift[0].openshift_storage[0].storage_name = \"{{ env_id }}-elastic\"" $HOME/cpd-config/config/ocp-aws-rosa-elastic.yaml
              yq -i ".openshift[0].openshift_storage[0].storage_type = \"${StorageType}\"" $HOME/cpd-config/config/ocp-aws-rosa-elastic.yaml
            fi

            if [ "${StorageType}" == "ocs" ]; then
              yq -i ".openshift[0].openshift_storage[0].storage_name = \"ocs-storage\"" $HOME/cpd-config/config/ocp-aws-rosa-elastic.yaml
              yq -i ".openshift[0].openshift_storage[0].storage_type = \"${StorageType}\"" $HOME/cpd-config/config/ocp-aws-rosa-elastic.yaml
              yq -i ".openshift[0].openshift_storage[0].ocs_storage_label = \"ocs\"" $HOME/cpd-config/config/ocp-aws-rosa-elastic.yaml
              yq -i ".openshift[0].openshift_storage[0].ocs_storage_size_gb = 512" $HOME/cpd-config/config/ocp-aws-rosa-elastic.yaml
            fi

            if [ "${WatsonxAI}" == "installed" ]; then
              yq -i ".openshift[0].gpu.install = True"  $HOME/cpd-config/config/ocp-aws-rosa-elastic.yaml
            else
              yq -i ".openshift[0].gpu.install = False"  $HOME/cpd-config/config/ocp-aws-rosa-elastic.yaml
            fi

            if [[ ${WatsonAssistant} == "installed" ||  ${WatsonDiscovery} == "installed" ]]; then
              yq -i ".openshift[0].mcg.install = True" $HOME/cpd-config/config/ocp-aws-rosa-elastic.yaml
            else
              yq -i ".openshift[0].mcg.install = False" $HOME/cpd-config/config/ocp-aws-rosa-elastic.yaml
            fi

            yq -i ".openshift[0].mcg.storage_type = \"storage-class\"" $HOME/cpd-config/config/ocp-aws-rosa-elastic.yaml
            yq -i ".openshift[0].mcg.storage_class = \"gp3-csi\"" $HOME/cpd-config/config/ocp-aws-rosa-elastic.yaml

            cd $HOME/cloud-pak-deployer
            export CPDEPLOYER=$HOME/cloud-pak-deployer

            # build the deployer
            /bin/bash $CPDEPLOYER/cp-deploy.sh build

            # check images
            podman images

            # rosa login
            rosa login --token ${RosaToken}

            # Create ROSA IAM role
            OCM_ROLE=$(rosa create ocm-role --region "${AWS::Region}" --mode auto –yes)
            echo 'OCM_ROLE ..' $OCM_ROLE

            USER_ROLE=$(rosa create user-role --region "${AWS::Region}" --mode auto –yes)
            echo 'USER_ROLE  ..' $USER_ROLE

            export OCM_ROLE_ARN=$(rosa list ocm-role --region "${AWS::Region}" | tail -1 | awk '{print $2}')
            echo 'OCM_ROLE_ARN .. ' $OCM_ROLE_ARN
            rosa link ocm-role --role-arn $OCM_ROLE_ARN –-yes

            export USER_ROLE_ARN=rosa list user-role --region "${AWS::Region}" | tail -1 | awk '{print $2}'
            echo 'USER_ROLE_ARN .. ' $USER_ROLE_ARN
            rosa link user-role --role-arn $USER_ROLE_ARN --yes

            rosa create oidc-config --mode=auto --yes

            # set environment variables
            export STATUS_DIR=$HOME/cpd-status
            export CONFIG_DIR=$HOME/cpd-config
            export CP_ENTITLEMENT_KEY=${APIKey}
            export ROSA_LOGIN_TOKEN=${RosaToken}

            out=$(aws sts assume-role --role-arn ${BootNodeIamRole.Arn} --role-session-name OCPInstall)
            /bin/bash $CPDEPLOYER/cp-deploy.sh vault set --vault-secret aws-access-key --vault-secret-value $(echo "$out" | jq -r '.Credentials.AccessKeyId')
            /bin/bash $CPDEPLOYER/cp-deploy.sh vault set --vault-secret aws-secret-access-key --vault-secret-value $(echo "$out" | jq -r '.Credentials.SecretAccessKey')
            /bin/bash $CPDEPLOYER/cp-deploy.sh vault set --vault-secret aws-session-token --vault-secret-value $(echo "$out" | jq -r '.Credentials.SessionToken')

            # create secrets in terraform vault
            /bin/bash $CPDEPLOYER/cp-deploy.sh vault set --vault-secret ocp-ssh-pub-key --vault-secret-file ~/.ssh/id_rsa.pub

            # refresh sts-token periodically
            wget https://ibm-aws-immersion-day.s3.us-east-2.amazonaws.com/cloudformation/config/refresh-sts-cron.sh
            mv ./refresh-sts-cron.sh /home/ec2-user/refresh-sts.sh
            chmod +x /home/ec2-user/refresh-sts.sh

            #sudo chown -R ec2-user:ec2-user /home/ec2-user/

            # add cronjob
            crontab -l >> crontablist
            echo "*/33 * * * * /home/ec2-user/refresh-sts.sh /home/ec2-user/cloud-pak-deployer ${BootNodeIamRole.Arn} /home/ec2-user/refresh-sts-cron.log >> /home/ec2-user/refresh-sts-cron.log 2>&1" >> crontablist
            crontab crontablist -u ec2-user
            rm crontablist

            sudo chown -R ec2-user:ec2-user /home/ec2-user/

            # verify all configuration
            #/bin/bash $CPDEPLOYER/cp-deploy.sh env apply -e env_id=${ClusterName} --check-only [--accept-all-licenses]
            /bin/bash $CPDEPLOYER/cp-deploy.sh env apply -e env_id=${ClusterName} [--accept-all-licenses]
            ecode=$?
            /usr/local/bin/cfn-signal --exit-code $ecode --id $AWS_STACKID  --data "See logs at ${ICPDDeploymentLogsBucketName}/cpd-bootstrap.log" $ICPDInstallationCompletedURL
          -
            AMI_ID: !FindInMap [AWSAMIRegionMap, !Ref "AWS::Region", COREOSAmiId]
            LicenseAgreement: !If [ AcceptLicense, 'accept', 'reject']
            MultiAZ: !If [ 3AZCondition , 'True', 'False']
            AvailabilityZone1: !Select [0, !Ref AvailabilityZones]
            AvailabilityZone2: !If [ 3AZCondition, !Select [1, !Ref AvailabilityZones], ""]
            AvailabilityZone3: !If [ 3AZCondition, !Select [2, !Ref AvailabilityZones], ""]
            EnableOCS: !If [ OCSCondition, 'True', 'False' ]
            EnableNfs: !If [ NfsCondition, 'True', 'False' ]

  CleanUpLambda:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        ZipFile: |
          import boto3
          import json
          import cfnresponse
          import os
          import traceback
          import time
          def handler(event, context):
              responseData = {}
              try:
                  print("event_obj:",json.dumps(event))
                  print(event['RequestType'])
                  if event['RequestType'] == 'Delete':
                    print("Run unsubscribe script")
                    ssm = boto3.client('ssm',region_name=os.environ['Region'])
                    instanceID = os.environ['BootNode']
                    storage = os.environ['Storage']
                    stackname = os.environ['StackName']
                    print(instanceID)
                    response = ssm.send_command(Targets=[{"Key":"instanceids","Values":[instanceID]}],
                            DocumentName="AWS-RunShellScript",
                            Parameters={"commands":["/home/ec2-user/destroy.sh %s >> /home/ec2-user/destroy.log" %(stackname)],
                                        "executionTimeout":["1200"],
                                        "workingDirectory":["/home/ec2-user"]},
                            Comment="Execute script in uninstall openshift",
                            TimeoutSeconds=120)
                    print(response)
                    current_status = "WAIT"
                    final_status = "READY"
                    parameterName = stackname+"_CleanupStatus"
                    response = ssm.put_parameter(Name=parameterName,
                           Description="Waiting for CleanupStatus to be READY",
                           Value=current_status,
                           Type='String',
                           Overwrite=True)
                    print(response)
                    while(current_status!=final_status):
                      time.sleep(30)
                      response = ssm.get_parameter(Name=parameterName)
                      parameter = response.get('Parameter')
                      current_status = parameter.get('Value')
                      print(current_status)
                    ssm.delete_parameter(Name=parameterName)
              except Exception as e:
                print(e)
                traceback.print_exc()
              cfnresponse.send(event, context, cfnresponse.SUCCESS, {}, '')
      Environment:
        Variables:
          Region: !Ref AWS::Region
          BootNode: !Ref BootnodeInstance
          Storage: !Ref StorageType
          StackName: !Ref AWS::StackName
      Handler: index.handler
      Role: !GetAtt 'LambdaExecutionRole.Arn'
      Runtime: python3.8
      Timeout: 600

  Cleanup :
    Type: Custom::Cleanup
    Properties:
      DependsOn: BootnodeInstance
      ServiceToken: !GetAtt 'CleanUpLambda.Arn'

  ICPDInstallationCompletedHandle:
    Type: AWS::CloudFormation::WaitConditionHandle

  ICPDInstallationCompleted:
    Type: AWS::CloudFormation::WaitCondition
    Properties:
      Count: 1
      Handle: !Ref ICPDInstallationCompletedHandle
      Timeout: '40000'

Outputs:
  BootnodeInstanceId:
    Description: Bootnode Instance ID.
    Value: !Ref BootnodeInstance

  BootnodePublicIp:
    Description: The boot node public IP address.
    Value: !GetAtt BootnodeInstance.PublicIp