AWSTemplateFormatVersion: '2010-09-09'
Description: Inline-code lambdas (Code.ZipFile) — the source lives in the
  template itself, so routes stay High with the handler honestly None, and
  the function declaration is still surfaced.

Resources:
  InlineApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: inline-http
      ProtocolType: HTTP

  InlineRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref InlineApi
      RouteKey: GET /inline
      Target: !Join ['/', ['integrations', !Ref InlineIntegration]]

  InlineIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref InlineApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${InlineFn.Arn}/invocations

  InlineFn:
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.handler
      Runtime: python3.12
      Code:
        ZipFile: |
          def handler(event, context):
              return {"statusCode": 200}

  OrphanZip:
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.handler
      Runtime: nodejs20.x
      Code:
        ZipFile: "exports.handler = async () => ({ ok: true });"