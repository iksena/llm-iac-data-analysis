AWSTemplateFormatVersion: '2010-09-09'
Description: 'Mass Email System for millions of recipients using Lambda, Step Functions, SQS, and SES'

# =============================================================================
# PERSONAL DATA AND COMPLIANCE
#
# This stack processes personal data and sends bulk commercial email. It stores
# recipient email addresses, names and topic subscriptions in the recipient list
# tables and the recipients S3 bucket, and per-recipient delivery, bounce,
# complaint, open and click records in the per-campaign tracking tables.
#
# Under the AWS shared responsibility model AWS secures the infrastructure; how
# this data is collected, used, retained and deleted is the deployer's
# responsibility. Deploying this stack does not by itself make your sending
# compliant with CAN-SPAM, GDPR/ePrivacy, UK GDPR/PECR, CASL, the Australian
# Spam Act, or any sector rules that apply to your content. Establish a lawful
# basis before sending, honour opt-outs promptly, keep sender identification
# accurate, and be able to service data subject requests across every store
# listed above.
#
# Retention is controlled by the TrackingDataRetentionDays parameter below,
# which sets the DynamoDB TTL on per-recipient tracking items. The default is
# 400 days and 0 disables expiry entirely, keeping the data indefinitely - set
# it to match your retention policy rather than accepting the default. Note that
# campaign summaries in the campaign registry are deliberately kept indefinitely
# and are NOT covered by that TTL, so an erasure request or a retention review
# has to account for the registry separately.
#
# Unsubscribe handling depends on ContactListName and TopicName being set: the
# sender lambdas attach SES ListManagementOptions, and templates must carry the
# {{amazonSESUnsubscribeUrl}} placeholder for one-click unsubscribe to work.
# Templates missing that placeholder are logged as warnings at send time.
#
# See https://aws.amazon.com/compliance/ and
# https://docs.aws.amazon.com/ses/latest/dg/sending-policies.html
# =============================================================================

Parameters:
  BatchSize:
    Type: Number
    Description: Number of email recipients per S3 batch file
    Default: 1000

  EmailRateLimit:
    Type: Number
    Description: Maximum emails per second to send
    Default: 50

  CognitoUserPoolId:
    Type: String
    Description: Cognito User Pool ID for API Gateway authorizer

  ApiGatewayStageName:
    Type: String
    Description: API Gateway stage name for the Email Distribution API
    Default: prod

  ApiGatewayEndpointType:
    Type: String
    Description: API Gateway endpoint type for the Email Distribution API
    Default: REGIONAL
    AllowedValues:
      - REGIONAL
      - PRIVATE

  ContactListName:
    Type: String
    Description: SES Contact List name for subscription management

  TopicName:
    Type: String
    Description: SES Topic name for subscription management (use NONE to disable)
    Default: "NONE"

  LambdaKMSKeyArn:
    Type: String
    Description: ARN of the KMS key for Lambda environment variable encryption

  CloudWatchLogsKMSKeyArn:
    Type: String
    Description: ARN of the KMS key for CloudWatch Logs encryption

  SESConfigurationSetName:
    Type: String
    Description: SES Configuration Set name for event tracking (leave empty to disable)
    Default: ""

  TokenGeneratorFunctionArn:
    Type: String
    Description: ARN of the Please-Reply Token Generator Lambda for tokenized Reply-To addresses (leave empty to disable)
    Default: ""

  InsightsRuntimeArn:
    Type: String
    Description: ARN of the SES Insights AgentCore Runtime for AI sending analytics (leave empty to disable)
    Default: ""

  AllowedOrigin:
    Type: String
    Description: 'Allowed CORS origin for API responses (set to frontend URL after frontend stack deploys)'
    Default: 'NONE'

  UniqueSuffix:
    Type: String
    Description: 'Deterministic hash suffix for S3 bucket names (avoids exposing AWS account ID)'
    AllowedPattern: '[a-f0-9]{8}'
    ConstraintDescription: 'Must be an 8-character lowercase hex string'
    Default: '00000000'

  LogLevel:
    Type: String
    Description: 'Python logging level for all Lambda functions. Defaults to WARN to limit log volume; raise to INFO or DEBUG for troubleshooting.'
    AllowedValues:
      - DEBUG
      - INFO
      - WARNING
      - WARN
      - ERROR
      - CRITICAL
    Default: 'WARN'

  TrackingDataRetentionDays:
    Type: Number
    Description: 'Days to retain per-campaign recipient and batch tracking items before DynamoDB TTL removes them. Campaign summaries in the campaign registry are kept indefinitely and are unaffected by this value. Set to 0 to disable expiry entirely.'
    MinValue: 0
    MaxValue: 3650
    Default: 400

Conditions:
  HasTopic: !Not [!Equals [!Ref TopicName, "NONE"]]
  HasConfigSet: !Not [!Equals [!Ref SESConfigurationSetName, ""]]
  HasTokenGenerator: !Not [!Equals [!Ref TokenGeneratorFunctionArn, ""]]
  HasInsightsRuntime: !Not [!Equals [!Ref InsightsRuntimeArn, ""]]

Resources:

  ###############################
  # IAM Policies
  ###############################
  BatchStatusCheckerDynamoDBPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:UpdateItem
            # Dynamic campaign-specific table names require wildcard pattern
            Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/*email-*-tracking*
            Condition:
              StringEquals:
                aws:ResourceTag/ManagedBy: "MassEmailSystem"

  BatchStatusCheckerDLQPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - sqs:SendMessage
            Resource: !GetAtt LambdaDeadLetterQueue.Arn

  BatchStatusCheckerKMSPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - kms:Decrypt
              - kms:DescribeKey
            Resource:
              - !Ref LambdaKMSKeyArn
              - !GetAtt DynamoDBKMSKey.Arn

  CampaignSetupDynamoDBPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:CreateTable
            Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/*email-*-tracking*
          - Effect: Allow
            Action:
              - dynamodb:DeleteTable
              - dynamodb:DescribeTable
              - dynamodb:UpdateTimeToLive
              - dynamodb:TagResource
            # Dynamic campaign-specific table names require wildcard pattern
            Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/*email-*-tracking*
            Condition:
              StringEquals:
                aws:ResourceTag/ManagedBy: "MassEmailSystem"

  CampaignSetupDLQPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - sqs:SendMessage
            Resource: !GetAtt LambdaDeadLetterQueue.Arn

  CampaignSetupKMSPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - kms:Decrypt
              - kms:DescribeKey
            Resource: !Ref LambdaKMSKeyArn
          - Effect: Allow
            Action:
              - kms:Decrypt
              - kms:DescribeKey
              - kms:Encrypt
              - kms:GenerateDataKey
              - kms:CreateGrant
            Resource: !GetAtt DynamoDBKMSKey.Arn

  # Writes are scoped to this deployment's own registry table.
  CampaignRegistryWritePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Allows recording campaign summaries in this stack's campaign registry
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:GetItem
            Resource: !GetAtt CampaignRegistry.Arn

  # Reads span registries from earlier deployments so campaign history survives a
  # redeployment under a new stack name, hence the wildcard.
  CampaignRegistryReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Allows reading campaign registries from this and previous deployments
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:Scan
              - dynamodb:GetItem
              - dynamodb:DescribeTable
            Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/email-campaign-registry-*

  # Renaming a campaign writes only the DisplayName attribute, but the campaign may live
  # in a registry created by an earlier deployment, hence the same wildcard the read
  # policy above uses. UpdateItem is granted without PutItem or DeleteItem so this role
  # can amend a campaign row but never replace or remove one.
  CampaignRegistryNameWritePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Allows updating the user-supplied name on campaigns in any registry
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:UpdateItem
            Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/email-campaign-registry-*

  LambdaExecutionPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - s3:PutObject
              - s3:GetObject
              - s3:ListBucket
            Resource:
              - !GetAtt EmailBatchBucket.Arn
              - !Join
                - ""
                - - !GetAtt EmailBatchBucket.Arn
                  - "/*"
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:ListBucket
            Resource:
              - !GetAtt RecipientsBucket.Arn
              - !Join
                - ""
                - - !GetAtt RecipientsBucket.Arn
                  - "/*"
          - Effect: Allow
            Action:
              - dynamodb:PutItem
              - dynamodb:GetItem
              - dynamodb:UpdateItem
              - dynamodb:Query
            Resource:
              - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/*email-*-tracking*
            Condition:
              StringEquals:
                aws:ResourceTag/ManagedBy: "MassEmailSystem"
          - Effect: Allow
            Action:
              - dynamodb:Scan
              - dynamodb:GetItem
            # Recipient list tables are dynamically named with recipients- prefix
            Resource:
              - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/recipients-*
              - !GetAtt RecipientTablesRegistry.Arn
          - Effect: Allow
            Action:
              - sqs:SendMessage
            Resource: !GetAtt LambdaDeadLetterQueue.Arn
          - Effect: Allow
            Action:
              - kms:Decrypt
              - kms:DescribeKey
            Resource: !Ref LambdaKMSKeyArn
          - Effect: Allow
            Action:
              - kms:Decrypt
              - kms:DescribeKey
              - kms:Encrypt
              - kms:GenerateDataKey
            Resource: !GetAtt DynamoDBKMSKey.Arn
          - Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            # Lambda log group names are dynamic based on nested stack name
            Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/*

  LambdaSESPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - ses:ListEmailTemplates
              - ses:ListEmailIdentities
            # SES List* actions do not support resource-level permissions
            Resource: '*'
          - Effect: Allow
            Action:
              - ses:GetEmailTemplate
              - ses:CreateEmailTemplate
              - ses:UpdateEmailTemplate
              - ses:DeleteEmailTemplate
              - ses:SendTemplatedEmail
              - ses:SendRawEmail
            Resource: !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:template/*
          - Effect: Allow
            Action:
              - ses:GetEmailIdentity
              - ses:SendEmail
              - ses:SendTemplatedEmail
              - ses:SendRawEmail
            Resource: !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/*
          - Effect: Allow
            Action:
              - ses:SendEmail
              - ses:SendTemplatedEmail
              - ses:SendRawEmail
            Resource: !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/*
          - Effect: Allow
            Action:
              - ses:SendEmail
              - ses:SendTemplatedEmail
              - ses:SendRawEmail
              - ses:GetContactList
            Resource: !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:contact-list/${ContactListName}
          - Effect: Allow
            Action:
              - s3:PutObject
              - s3:GetObject
              - s3:ListBucket
            Resource:
              - !GetAtt EmailBatchBucket.Arn
              - !Join
                - ""
                - - !GetAtt EmailBatchBucket.Arn
                  - "/*"
              - !GetAtt EmailAttachmentsBucket.Arn
              - !Join
                - ""
                - - !GetAtt EmailAttachmentsBucket.Arn
                  - "/*"
              - !GetAtt RecipientsBucket.Arn
              - !Join
                - ""
                - - !GetAtt RecipientsBucket.Arn
                  - "/*"
          - Effect: Allow
            Action:
              - sqs:SendMessage
              - sqs:ReceiveMessage
              - sqs:DeleteMessage
              - sqs:GetQueueAttributes
            Resource:
              - !GetAtt EmailQueue.Arn
              - !GetAtt EmailDeadLetterQueue.Arn
              - !GetAtt LambdaDeadLetterQueue.Arn
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:Query
              - dynamodb:Scan
            # Dynamic campaign-specific table names require wildcard pattern
            Resource: !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/*email-*-tracking*
            Condition:
              StringEquals:
                aws:ResourceTag/ManagedBy: "MassEmailSystem"
          - Effect: Allow
            Action:
              - states:StartExecution
            Resource: !Sub arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${AWS::StackName}-EmailBatchMonitor-StateMachine
          - Effect: Allow
            Action:
              - kms:Decrypt
              - kms:DescribeKey
              - kms:Encrypt
              - kms:GenerateDataKey
            Resource: !Ref LambdaKMSKeyArn
          - Effect: Allow
            Action:
              - kms:Decrypt
              - kms:DescribeKey
              - kms:Encrypt
              - kms:GenerateDataKey
            Resource: !GetAtt DynamoDBKMSKey.Arn

  EmailCampaignInitiatorStepFunctionsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - states:StartExecution
            Resource: !Sub arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${AWS::StackName}-EmailCampaignProcessor-StateMachine

  EmailCampaignInitiatorDLQPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - sqs:SendMessage
            Resource: !GetAtt LambdaDeadLetterQueue.Arn

  EmailCampaignInitiatorKMSPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - kms:Decrypt
              - kms:DescribeKey
            Resource: !Ref LambdaKMSKeyArn

  EventBridgeStepFunctionsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - states:StartExecution
            Resource:
              - !Ref CampaignInitiatorStateMachine
              - !Ref BatchMonitorStateMachine

  BatchMonitorPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - lambda:InvokeFunction
            Resource:
              - !GetAtt BatchStatusCheckerLambda.Arn

  CampaignStateMachinePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - lambda:InvokeFunction
            Resource:
              - !GetAtt DataExtractorLambda.Arn
              - !GetAtt BatchProcessorLambda.Arn
              - !GetAtt CampaignSetupLambda.Arn
              - !GetAtt CampaignStatusCheckerLambda.Arn
          - Effect: Allow
            Action:
              - states:StartExecution
            Resource: !Sub arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${AWS::StackName}-EmailCampaignProcessor-StateMachine
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:ListBucket
            Resource:
              - !GetAtt EmailBatchBucket.Arn
              - !Sub "${EmailBatchBucket.Arn}/*"

  ###############################
  # IAM Roles
  ###############################
  BatchStatusCheckerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - !Ref BatchStatusCheckerDynamoDBPolicy
        - !Ref BatchStatusCheckerDLQPolicy
        - !Ref BatchStatusCheckerKMSPolicy

  CampaignSetupRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - !Ref CampaignSetupDynamoDBPolicy
        - !Ref CampaignSetupDLQPolicy
        - !Ref CampaignSetupKMSPolicy
        - !Ref CampaignRegistryWritePolicy

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - !Ref LambdaExecutionPolicy

  CampaignStateMachineExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref CampaignStateMachinePolicy

  BatchMonitorStateMachineExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref BatchMonitorPolicy

  LambdaSESRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - !Ref LambdaSESPolicy

  # Attach Token Generator invoke policy to LambdaSESRole when integration is enabled
  TokenGeneratorPolicyAttachment:
    Type: AWS::IAM::Policy
    Condition: HasTokenGenerator
    Properties:
      PolicyName: !Sub ${AWS::StackName}-TokenGeneratorInvokePolicy
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - lambda:InvokeFunction
            Resource: !Ref TokenGeneratorFunctionArn
      Roles:
        - !Ref LambdaSESRole

  LambdaLoggingPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub ${AWS::StackName}-LambdaLoggingPolicy
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            # CloudWatch Logs CreateLogGroup does not support resource-level permissions
            Action: logs:CreateLogGroup
            Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*
          - Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${SESTemplateManagerLambda}:*
              - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ListVerifiedEmailsLambda}:*
              - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${EmailSenderLambda}:*
              - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AdhocEmailSenderLambda}:*
      Roles:
        - !Ref LambdaSESRole

  ###############################
  # KMS Keys
  ###############################
  DynamoDBKMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS key for DynamoDB table encryption
      EnableKeyRotation: true
      # Note on the wildcards below, which security scanners commonly flag:
      #
      # A key policy is attached to exactly one key, so 'Resource: *' here means
      # THIS key. It is not account-wide, and there is no narrower value to use -
      # referencing the key's own ARN from inside its KeyPolicy is a CloudFormation
      # circular dependency.
      #
      # 'arn:...:root' is the account principal, not the root user. It grants no
      # principal any access on its own; it is what permits IAM policies in this
      # account to govern the key at all. Removing or narrowing this statement makes
      # every IAM grant on this key ineffective, which would break DynamoDB access
      # for all Lambdas in this stack, and risks leaving the key unmanageable.
      # See https://docs.aws.amazon.com/kms/latest/developerguide/key-policy-default.html
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: 'kms:*'
            Resource: '*'
          # Lets DynamoDB encrypt and decrypt table data with this key on behalf of
          # callers that IAM already authorises. Actions are the minimum set DynamoDB
          # needs for SSE-KMS; 'Resource: *' again means this key only.
          - Sid: Allow DynamoDB Service
            Effect: Allow
            Principal:
              Service: dynamodb.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:DescribeKey
              - kms:Encrypt
              - kms:GenerateDataKey
              - kms:ReEncrypt*
            Resource: '*'

  DynamoDBKMSKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/${AWS::StackName}-dynamodb
      TargetKeyId: !Ref DynamoDBKMSKey

  ###############################
  # Storage Resources
  ###############################
  AccessLogsBucket:
    Type: AWS::S3::Bucket
    Metadata:
      Comment: >-
        This bucket is itself the S3 server access log destination for the other
        buckets in this stack. Enabling access logging on a log destination bucket
        makes log writes generate further log records, so it is omitted by design.
      checkov:
        skip:
          - id: CKV_AWS_18
            comment: Log destination bucket; self-logging would recurse.
      guard:
        SuppressedRules:
          - S3_BUCKET_LOGGING_ENABLED
    Properties:
      BucketName: !Sub '${AWS::StackName}-access-logs-${UniqueSuffix}'
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      ObjectLockEnabled: true
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention:
            Mode: GOVERNANCE
            Days: 1
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  AccessLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AccessLogsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Security control, not an access grant. This is the AWS-recommended way to
          # require TLS on a bucket, and is what the s3-bucket-ssl-requests-only check
          # looks for. 'Principal: *' with 'Effect: Deny' denies only the caller making
          # a non-TLS request; it cannot be used to deny access to anyone else, so there
          # is no denial-of-service path here. Removing it would weaken the bucket.
          - Sid: DenyNonSSLRequests
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !Sub 'arn:${AWS::Partition}:s3:::${AccessLogsBucket}'
              - !Sub 'arn:${AWS::Partition}:s3:::${AccessLogsBucket}/*'
            Condition:
              Bool:
                aws:SecureTransport: false

  EmailBatchLoggingBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-batch-logs-${UniqueSuffix}'
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      ObjectLockEnabled: true
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention:
            Mode: GOVERNANCE
            Days: 1
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LoggingConfiguration:
        DestinationBucketName: !Ref AccessLogsBucket
        LogFilePrefix: batch-logs/

  EmailBatchLoggingBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref EmailBatchLoggingBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Security control, not an access grant. This is the AWS-recommended way to
