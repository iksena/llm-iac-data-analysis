AWSTemplateFormatVersion: 2010-09-09
Description: WordPress architecture evolution - Stage 1 nested root stack
  Standalone server with direct configuration
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
    - Label:
        default: Stage 1 configuration
      Parameters:
      - LatestAmiId
      - CfnMetadataNonce
    ParameterLabels:
      LatestAmiId:
        default: Amazon Linux 2023 AMI
      CfnMetadataNonce:
        default: cfn-init refresh nonce
Parameters:
  LatestAmiId:
    Description: Latest Amazon Linux 2023 AMI.
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.18-x86_64
  CfnMetadataNonce:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 2147483647
    Description: Increase on stack update so stage 1 cfn-hup re-runs cfn-init.
Resources:
  NetworkStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL:
        https://s3.us-east-1.amazonaws.com/cf-templates-xunea76zqzgs-us-east-1/8ec44aebe8ef431e83e1e5cf6c7c66ee.template
  SharedSsmStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL:
        https://s3.us-east-1.amazonaws.com/cf-templates-xunea76zqzgs-us-east-1/e38468bdf61427428d7a60c7cad79df8.template
  IamStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL:
        https://s3.us-east-1.amazonaws.com/cf-templates-xunea76zqzgs-us-east-1/af54ee4d651d23c5255102a6e7b05139.template
  AutomationStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL:
        https://s3.us-east-1.amazonaws.com/cf-templates-xunea76zqzgs-us-east-1/d2e6dbe144726b2485f82759638c6a4c.template
      Parameters:
        RootStackName:
          Ref: AWS::StackName
  SingleServerStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: SharedSsmStack
    Properties:
      TemplateURL:
        https://s3.us-east-1.amazonaws.com/cf-templates-xunea76zqzgs-us-east-1/1def99781a7e6ef36c3d893b6ee4f1a4.template
      Parameters:
        LatestAmiId:
          Ref: LatestAmiId
        CfnMetadataNonce:
          Ref: CfnMetadataNonce
        VpcId:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.VpcId
        PublicSubnetId:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.PublicSubnetAId
        InstanceProfileName:
          Fn::GetAtt:
          - IamStack
          - Outputs.InstanceProfileName
Outputs:
  WordpressURL:
    Description: Open this URL to complete WordPress setup.
    Value:
      Fn::GetAtt:
      - SingleServerStack
      - Outputs.WordpressURL
  WordpressInstanceId:
    Description: Stage 1 EC2 instance ID. Use this for SSM Automation upgrade
      runbooks.
    Value:
      Fn::GetAtt:
      - SingleServerStack
      - Outputs.WordpressInstanceId
  WordpressInstanceAutoIP:
    Description: Ephemeral public IPv4 assigned while the instance is running.
    Value:
      Fn::GetAtt:
      - SingleServerStack
      - Outputs.WordpressInstanceAutoIP
  PreStageSnapshotDocumentName:
    Description: SSM Automation document that creates a pre-upgrade AMI.
    Value:
      Fn::GetAtt:
      - AutomationStack
      - Outputs.PreStageSnapshotDocumentName
  AutomationRoleArn:
    Description: Role used by the SSM Automation documents.
    Value:
      Fn::GetAtt:
      - AutomationStack
      - Outputs.AutomationRoleArn
  VpcId:
    Value:
      Fn::GetAtt:
      - NetworkStack
      - Outputs.VpcId