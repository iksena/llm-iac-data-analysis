AWSTemplateFormatVersion: "2010-09-09"
Description: "S3 Stack for Apache Yunikorn and Amazon EMR on EKS Infrastructure"

Parameters:
  ProjectName:
    Description: An environment name that is prefixed to resource names
    Type: String
    Default: yunikorn-emr-eks

  BucketName:
    Description: Name of the existing S3 bucket containing all project artifacts
    Type: String

Resources:
  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BucketName
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyNonSSLRequests
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !Sub "arn:${AWS::Partition}:s3:::${BucketName}"
              - !Sub "arn:${AWS::Partition}:s3:::${BucketName}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  # cdk-nag AwsSolutions-IAM5: Wildcard permissions needed for S3 object operations
  BucketManagedPolicy:
    Type: "AWS::IAM::ManagedPolicy"
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: "Explicit name is required for policy identification and integration with other systems"
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-IAM5
            reason: "Wildcard permissions are required for S3 object operations as we need to access objects with different keys"
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - "s3:ListBucket"
              - "s3:GetBucketLocation"
            Resource: !Sub "arn:${AWS::Partition}:s3:::${BucketName}"
          - Effect: Allow
            Action:
              - "s3:PutObject"
              - "s3:GetObject"
              - "s3:DeleteObject"
            Resource: !Sub "arn:${AWS::Partition}:s3:::${BucketName}/*"

Outputs:
  BucketName:
    Description: Name of the existing S3 bucket
    Value: !Ref BucketName

  BucketArn:
    Description: ARN of the existing S3 bucket
    Value: !Sub "arn:${AWS::Partition}:s3:::${BucketName}"

  BucketManagedPolicyArn:  # ADD THIS OUTPUT
    Description: ARN of the created IAM policy for S3 access
    Value: !Ref BucketManagedPolicy