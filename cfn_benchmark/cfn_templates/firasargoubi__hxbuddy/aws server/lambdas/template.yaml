AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  codeML

  Sample SAM Template for codeML

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 900 # 15 minutes, maximum allowed value
    Handler: app.lambda_handler
    Runtime: python3.9
    Tracing: Active
    Architectures:
      - x86_64

Parameters:
  Env:
    Type: String
    Description: The environment of the stack. One of [dev, stage, prod].
  SubmissionTableArn:
    Type: String
  TeamTableArn:
    Type: String
  PrivateDatasetsBucketArn:
    Type: String
  PredictionsBucketArn:
    Type: String
  ModelBucketArn:
    Type: String
  PredictionsBucketName:
    Type: String
  ModelBucketName:
    Type: String
  PrivateDatasetsBucketName:
    Type: String
  SubmissionTableStreamArn:
    Type: String

Resources:
  setFinalSubmissionLambdaFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Env}-setFinalSubmissionLambdaFunctionRole"
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: read-write-submission-team-tables
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - "dynamodb:BatchGetItem"
                  - "dynamodb:BatchWriteItem"
                  - "dynamodb:UpdateItem"
                Resource:
                  - !Ref SubmissionTableArn
                  - !Ref TeamTableArn
        - PolicyName: AccessParameterStore
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - "ssm:GetParameter"
                  - "ssm:GetParameters"
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${Env}-*
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
  setFinalSubmissionLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${Env}-setFinalSubmission"
      CodeUri: ./setFinalSubmission
      Role: !GetAtt setFinalSubmissionLambdaFunctionRole.Arn
      Environment:
        Variables:
          SUBMISSION_TABLE_NAME:
            !Select [1, !Split ["/", !Ref SubmissionTableArn]]
          TEAM_TABLE_NAME: !Select [1, !Split ["/", !Ref TeamTableArn]]
          ENV: !Ref Env
  EvaluationEngineLambdaFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Env}-EvaluationEngineLambdaFunctionRole"
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: AllowS3-privateDatasets
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: "*"
                Resource:
                  - !Ref PrivateDatasetsBucketArn
                  - !Sub "${PrivateDatasetsBucketArn}/*"
        - PolicyName: putItem-SubmissionTable
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - "dynamodb:BatchWriteItem"
                Resource:
                  - !Ref SubmissionTableArn
        - PolicyName: stream-SubmissionTable
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - "dynamodb:GetRecords"
                  - "dynamodb:GetShardIterator"
                  - "dynamodb:DescribeStream"
                  - "dynamodb:ListStreams"
                Resource:
                  - !Sub "${SubmissionTableArn}/stream/*"
        - PolicyName: AllowModelBucket
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: "*"
                Resource:
                  - !Ref ModelBucketArn
                  - !Sub "${ModelBucketArn}/*"
        - PolicyName: AllowPredictionsBucket
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: "*"
                Resource:
                  - !Ref PredictionsBucketArn
                  - !Sub "${PredictionsBucketArn}/*"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
  createSubmissionInputValidationLambdaFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Env}-createSubmissionInputValidationLambdaFunctionRole"
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: putItem-SubmissionTable
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - "dynamodb:BatchWriteItem"
                  - "dynamodb:Query"
                Resource:
                  - !Ref SubmissionTableArn
                  - !Sub "${SubmissionTableArn}/*"
        - PolicyName: AllowModelBucket
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: "*"
                Resource:
                  - !Ref ModelBucketArn
                  - !Sub "${ModelBucketArn}/*"
        - PolicyName: AllowPredictionsBucket
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: "*"
                Resource:
                  - !Ref PredictionsBucketArn
                  - !Sub "${PredictionsBucketArn}/*"
        - PolicyName: AccessParameterStore
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - "ssm:GetParameter"
                  - "ssm:GetParameters"
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${Env}-*
        - PolicyName: AllowS3-privateDatasets
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: "*"
                Resource:
                  - !Ref PrivateDatasetsBucketArn
                  - !Sub "${PrivateDatasetsBucketArn}/*"

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  getSubmissionLinkLambdaFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Env}-getSubmissionLinkLambdaFunctionRole"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: AllowModelBucket
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: "*"
                Resource:
                  - !Ref ModelBucketArn
                  - !Sub "${ModelBucketArn}/*"
        - PolicyName: AllowPredictionsBucket
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: "*"
                Resource:
                  - !Ref PredictionsBucketArn
                  - !Sub "${PredictionsBucketArn}/*"
        - PolicyName: AccessParameterStore
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - "ssm:GetParameter"
                  - "ssm:GetParameters"
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${Env}-*
  EvaluationEngineLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${Env}-evaluation_engine"
      CodeUri: ./evaluation_engine
      Role: !GetAtt EvaluationEngineLambdaFunctionRole.Arn
      # Maximum memory size to avoid issues
      MemorySize: 10240
      Environment:
        Variables:
          MODEL_BUCKET_NAME: !Ref ModelBucketName
          SUBMISSION_TABLE_NAME:
            !Select [1, !Split ["/", !Ref SubmissionTableArn]]
          PREDICTIONS_BUCKET_NAME: !Ref PredictionsBucketName
          PRIVATE_DATASETS_BUCKET_NAME: !Ref PrivateDatasetsBucketName
      Events:
        Stream:
          Type: DynamoDB
          Properties:
            Stream: !Ref SubmissionTableStreamArn
            BatchSize: 100
            StartingPosition: LATEST
            MaximumRetryAttempts: 1
  createSubmissionInputValidationLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${Env}-createSubmissionInputValidation"
      CodeUri: ./createSubmissionInputValidation
      Role: !GetAtt createSubmissionInputValidationLambdaFunctionRole.Arn
      MemorySize: 10240
      Environment:
        Variables:
          MODEL_BUCKET_NAME: !Ref ModelBucketName
          SUBMISSION_TABLE_NAME:
            !Select [1, !Split ["/", !Ref SubmissionTableArn]]
          PREDICTIONS_BUCKET_NAME: !Ref PredictionsBucketName
          PRIVATE_DATASETS_BUCKET_NAME: !Ref PrivateDatasetsBucketName
          ENV: !Ref Env
  getSubmissionLinkLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${Env}-getSubmissionLink"
      CodeUri: ./get_submission_link
      Role: !GetAtt getSubmissionLinkLambdaFunctionRole.Arn
      Environment:
        Variables:
          MODEL_BUCKET_NAME: !Ref ModelBucketName
          PREDICTIONS_BUCKET_NAME: !Ref PredictionsBucketName
          ENV: !Ref Env

  authorizationLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${Env}-authorization-lambda"
      CodeUri: ./authorization_lambda

  authorizationLambdaFunctionPolicy:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt authorizationLambdaFunction.Arn
      Action: lambda:InvokeFunction
      Principal: "appsync.amazonaws.com"

  getHiddenPerformancesLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${Env}-getHiddenPerformancesLambdaFunction"
      CodeUri: ./get_hidden_performance
      Role: !GetAtt getHiddenPerformancesLambdaFunctionRole.Arn
      Environment:
        Variables:
          SUBMISSION_TABLE_NAME:
            !Select [1, !Split ["/", !Ref SubmissionTableArn]]
          ENV: !Ref Env
  getHiddenPerformancesLambdaFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Env}-getHiddenPerformancesLambdaFunctionRole"
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: read-write-submission-team-tables
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - "dynamodb:BatchGetItem"
                Resource:
                  - !Ref SubmissionTableArn
                  - !Ref TeamTableArn
        - PolicyName: AccessParameterStore
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - "ssm:GetParameter"
                  - "ssm:GetParameters"
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${Env}-*
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

Outputs:
  setFinalSubmissionLambdaFunctionArn:
    Description: "setFinalSubmissionLambdaFunction arn"
    Value: !GetAtt setFinalSubmissionLambdaFunction.Arn
  createSubmissionInputValidationLambdaFunctionArn:
    Description: Arn of the lambda function that validates submisssion creation requests on the API.
    Value: !GetAtt createSubmissionInputValidationLambdaFunction.Arn
  getSubmissionLinkLambdaFunctionArn:
    Description: Arn of the lambda function that returns submission links.
    Value: !GetAtt getSubmissionLinkLambdaFunction.Arn
  authorizationLambdaFunctionArn:
    Description: Arn of the lambda function that validates tokens on the API.
    Value: !GetAtt authorizationLambdaFunction.Arn
  getHiddenPerformancesLambdaFunctionArn:
    Description: Arn of the lambda function that fetches hidden performances.
    Value: !GetAtt getHiddenPerformancesLambdaFunction.Arn