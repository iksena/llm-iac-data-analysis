AWSTemplateFormatVersion: "2010-09-09"
Description: Amplify infrastructure for project PEW

Parameters:
  AdminUser:
    Type: String
    Default: admin
  AdminPassword:
    Type: String
    NoEcho: true
    Description: 'Password per accedere al sito'

Resources:
  AmplifyRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: amplify.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AmplifyS3Access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "arn:aws:s3:::pew-website-${AWS::AccountId}/*"
  AmplifyApp:
    Type: AWS::Amplify::App
    Properties:
      Name: pew-website-app
      IAMServiceRole: !GetAtt AmplifyRole.Arn
      #BasicAuthConfig:
      #  EnableBasicAuth: true
      #  Username: !Ref AdminUser
      #  Password: !Ref AdminPassword
      # Only on branch according to documentation
      CustomRules:
        - Source: '/<*>'
          Target: '/index.html'
          Status: '404-200'
      CacheConfig:
        Type: "AMPLIFY_MANAGED_NO_COOKIES"
      JobConfig:
        BuildComputeType: "STANDARD_8GB"
  AmplifyBranch:
    Type: AWS::Amplify::Branch
    Properties:
      AppId: !GetAtt AmplifyApp.AppId
      BranchName: 'main'
      Stage: "PRODUCTION"
      Description: 'MainBranch'
      BasicAuthConfig:
        EnableBasicAuth: true
        Username: !Ref AdminUser
        Password: !Ref AdminPassword

Outputs:
  AmplifyAppId:
    Value: !GetAtt AmplifyApp.AppId
    Description: Amplify App ID
    Export:
      Name: AMPLIFY-APP-ID
  DefaultDomain:
    Value: !GetAtt AmplifyApp.DefaultDomain