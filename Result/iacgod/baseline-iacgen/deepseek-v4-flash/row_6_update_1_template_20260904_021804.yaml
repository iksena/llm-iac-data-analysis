AWSTemplateFormatVersion: "2010-09-09"
Description: CloudFormation template to create a Kinesis data stream with Cognito unauthenticated access for testing.

Resources:
  KinesisStream:
    Type: AWS::Kinesis::Stream
    Properties:
      Name: my-stream-kinesis
      ShardCount: 1
      RetentionPeriodHours: 24

  CognitoIdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      AllowUnauthenticatedIdentities: true
      IdentityPoolName: my-stream-kinesis-pool

  IAMRoleForUnauthCognito:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                cognito-identity.amazonaws.com:aud:
                  Ref: CognitoIdentityPool
              ForAnyValue:StringLike:
                cognito-identity.amazonaws.com:amr: unauthenticated
      Path: /
      Policies:
        - PolicyName: CognitoKinesisPutPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - kinesis:PutRecord
                  - kinesis:PutRecords
                Resource:
                  - !GetAtt KinesisStream.Arn

  CognitoIdentityPoolRoleAttachment:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Properties:
      IdentityPoolId:
        Ref: CognitoIdentityPool
      Roles:
        unauthenticated:
          - !GetAtt IAMRoleForUnauthCognito.Arn

Outputs:
  IdentityPoolId:
    Description: ID of the Cognito Identity Pool
    Value:
      Ref: CognitoIdentityPool
  StreamName:
    Description: Name of the Kinesis Data Stream
    Value:
      Ref: KinesisStream
  StreamArn:
    Description: ARN of the Kinesis Data Stream
    Value:
      !GetAtt KinesisStream.Arn