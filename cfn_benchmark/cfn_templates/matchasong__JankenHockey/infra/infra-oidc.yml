AWSTemplateFormatVersion: "2010-09-09"
Description: IAM OIDC Identity Provider and Role for GitHub Actions authentication for JankenHockey

Parameters:
  GitHubRepositoryName:
    Type: String
    Description: GitHub repository name in the format 'owner/repo' (e.g., 'matchasong/JankenHockey')
    AllowedPattern: "^[a-zA-Z0-9._-]+/[a-zA-Z0-9._-]+$"
    ConstraintDescription: Must be in the format 'owner/repo' (e.g., 'matchasong/JankenHockey')

Resources:
  # GitHub OIDC Identity Provider for GitHub Actions
  JankenHockeyGitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
      Tags:
        - Key: Project
          Value: JankenHockey

  # IAM Role for GitHub Actions to assume via OIDC
  JankenHockeyGitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: JankenHockeyGitHubActionsRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref JankenHockeyGitHubOIDCProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub "repo:${GitHubRepositoryName}:ref:refs/heads/main"
                  - !Sub "repo:${GitHubRepositoryName}:ref:refs/heads/master"
      Policies:
        - PolicyName: JankenHockeyDeploymentPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # CloudFormation permissions
              - Effect: Allow
                Action:
                  - cloudformation:*
                Resource: "*"
              # S3 permissions for Lambda deployment and website hosting
              - Effect: Allow
                Action:
                  - s3:*
                Resource: "*"
              # Lambda permissions
              - Effect: Allow
                Action:
                  - lambda:*
                Resource: "*"
              # IAM permissions for creating/updating roles and policies
              - Effect: Allow
                Action:
                  - iam:*
                Resource: "*"
              # API Gateway permissions
              - Effect: Allow
                Action:
                  - apigateway:*
                Resource: "*"
              # DynamoDB permissions
              - Effect: Allow
                Action:
                  - dynamodb:*
                Resource: "*"
              # CloudFront permissions
              - Effect: Allow
                Action:
                  - cloudfront:*
                Resource: "*"
              # CloudWatch permissions
              - Effect: Allow
                Action:
                  - cloudwatch:*
                  - logs:*
                Resource: "*"
              # SNS permissions
              - Effect: Allow
                Action:
                  - sns:*
                Resource: "*"
              # cognito-idp permissions
              - Effect: Allow
                Action:
                  - cognito-idp:*
                Resource: "*"
              # budgets permissions
              - Effect: Allow
                Action:
                  - budgets:*
                Resource: "*"
      Tags:
        - Key: Project
          Value: JankenHockey

Outputs:
  JankenHockeyGitHubActionsRoleArn:
    Description: "ARN of the IAM role for GitHub Actions OIDC authentication"
    Value: !GetAtt JankenHockeyGitHubActionsRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-JankenHockeyGitHubActionsRole"