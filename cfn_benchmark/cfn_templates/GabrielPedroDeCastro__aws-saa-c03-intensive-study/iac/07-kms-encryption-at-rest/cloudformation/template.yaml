AWSTemplateFormatVersion: '2010-09-09'
Description: 'SAA Lab 07 - KMS customer managed key protegendo S3, DynamoDB e SQS em repouso'

Parameters:
  ProjectName:
    Type: String
    Default: saa-lab-07

Resources:
  DataKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Description: !Sub '${ProjectName} - chave de dados do lab'
      EnableKeyRotation: true
      PendingWindowInDays: 7
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableAccountPermissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: AllowSupportedServicesViaAccount
            Effect: Allow
            Principal:
              Service: [s3.amazonaws.com, dynamodb.amazonaws.com, sqs.amazonaws.com]
            Action:
              - kms:Decrypt
              - kms:DescribeKey
              - kms:Encrypt
              - kms:GenerateDataKey
              - kms:ReEncryptFrom
              - kms:ReEncryptTo
            Resource: '*'
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref 'AWS::AccountId'
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-data-key'}
        - {Key: Project, Value: saa-c03-intensive}
        - {Key: Lab, Value: '07'}
        - {Key: ManagedBy, Value: CloudFormation}
  DataKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/${ProjectName}'
      TargetKeyId: !Ref DataKey

  EncryptedBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt DataKey.Arn
      VersioningConfiguration: {Status: Enabled}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-encrypted'}, {Key: Project, Value: saa-c03-intensive}, {Key: Lab, Value: '07'}, {Key: ManagedBy, Value: CloudFormation}]

  EncryptedTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub '${ProjectName}-secrets'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: id, AttributeType: S}]
      KeySchema: [{AttributeName: id, KeyType: HASH}]
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !GetAtt DataKey.Arn
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-secrets'}, {Key: Project, Value: saa-c03-intensive}, {Key: Lab, Value: '07'}, {Key: ManagedBy, Value: CloudFormation}]

  EncryptedQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${ProjectName}-encrypted'
      KmsMasterKeyId: !GetAtt DataKey.Arn
      KmsDataKeyReusePeriodSeconds: 300
      MessageRetentionPeriod: 3600
      Tags:
        - {Key: Project, Value: saa-c03-intensive}
        - {Key: Lab, Value: '07'}
        - {Key: ManagedBy, Value: CloudFormation}

Outputs:
  KmsKeyArn: {Value: !GetAtt DataKey.Arn}
  KmsAlias: {Value: !Ref DataKeyAlias}
  BucketName: {Value: !Ref EncryptedBucket}
  TableName: {Value: !Ref EncryptedTable}
  QueueUrl: {Value: !Ref EncryptedQueue}