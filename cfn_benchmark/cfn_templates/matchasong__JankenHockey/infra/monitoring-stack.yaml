AWSTemplateFormatVersion: "2010-09-09"
Description: Monitoring resources for JankenHockey (CloudWatch Alarms, SNS)

Parameters:
  OperatorMailAddress:
    Type: String
    Description: mail address for operator.
  ConnectFunctionName:
    Type: String
    Description: Connect Lambda Function Name
  DefaultFunctionName:
    Type: String
    Description: Default Lambda Function Name
  DisconnectFunctionName:
    Type: String
    Description: Disconnect Lambda Function Name
  LoginFunctionName:
    Type: String
    Description: Login Lambda Function Name
  GameTimeoutFunctionName:
    Type: String
    Description: GameTimeout Lambda Function Name
  GetRoomsFunctionName:
    Type: String
    Description: GetRooms Lambda Function Name
  CreateRoomFunctionName:
    Type: String
    Description: CreateRoom Lambda Function Name
  JoinRoomFunctionName:
    Type: String
    Description: JoinRoom Lambda Function Name
  SaveCpuBattleHistoryFunctionName:
    Type: String
    Description: SaveCpuBattleHistory Lambda Function Name
  SaveGuestCpuBattleHistoryFunctionName:
    Type: String
    Description: SaveGuestCpuBattleHistory Lambda Function Name
  AuthorizerFunctionName:
    Type: String
    Description: Authorizer Lambda Function Name
  GameHistoryTableName:
    Type: String
    Description: GameHistory DynamoDB Table Name
  ConnectionTableName:
    Type: String
    Description: Connection DynamoDB Table Name
  RoomTableName:
    Type: String
    Description: Room DynamoDB Table Name
  WebSocketApiId:
    Type: String
    Description: WebSocket API ID

Resources:
  # SNS Topic And Subscription（API Throttling）
  JankenHockeyTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: JankenHockeyTopic
      Tags:
        - Key: Project
          Value: JankenHockey

  JankenHockeySubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref JankenHockeyTopic
      Protocol: email
      Endpoint: !Ref OperatorMailAddress

  # Lambda execution count（Connect）
  JankenHockeyConnectLambdaInvocationsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: JankenHockeyConnectLambdaInvocationsAlarm
      AlarmDescription: "Connect Lambdaの実行回数が多い場合に通知"
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Ref ConnectFunctionName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref JankenHockeyTopic
      Tags:
        - Key: Project
          Value: JankenHockey

  # Lambda execution count（Default）
  JankenHockeyDefaultLambdaInvocationsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: JankenHockeyDefaultLambdaInvocationsAlarm
      AlarmDescription: "Default Lambdaの実行回数が多い場合に通知"
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Ref DefaultFunctionName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 7000
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref JankenHockeyTopic
      Tags:
        - Key: Project
          Value: JankenHockey

  # Lambda execution count（Disconnect）
  JankenHockeyDisconnectLambdaInvocationsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: JankenHockeyDisconnectLambdaInvocationsAlarm
      AlarmDescription: "Disconnect Lambdaの実行回数が多い場合に通知"
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Ref DisconnectFunctionName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref JankenHockeyTopic
      Tags:
        - Key: Project
          Value: JankenHockey

  # DynamoDB write alerm（GameHistory）
  JankenHockeyGameHistoryWriteAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: JankenHockeyGameHistoryWriteAlarm
      AlarmDescription: "GameHistory Write Alerm"
      Namespace: AWS/DynamoDB
      MetricName: ConsumedWriteCapacityUnits
      Dimensions:
        - Name: TableName
          Value: !Ref GameHistoryTableName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref JankenHockeyTopic
      Tags:
        - Key: Project
          Value: JankenHockey

  # DynamoDB write alerm（Connection）
  JankenHockeyConnectionWriteAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: JankenHockeyConnectionWriteAlarm
      AlarmDescription: "Connection Write Alerm"
      Namespace: AWS/DynamoDB
      MetricName: ConsumedWriteCapacityUnits
      Dimensions:
        - Name: TableName
          Value: !Ref ConnectionTableName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 20
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref JankenHockeyTopic
      Tags:
        - Key: Project
          Value: JankenHockey

  # DynamoDB write alerm（Room）
  JankenHockeyRoomWriteAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: JankenHockeyRoomWriteAlarm
      AlarmDescription: "Room Write Alerm"
      Namespace: AWS/DynamoDB
      MetricName: ConsumedWriteCapacityUnits
      Dimensions:
        - Name: TableName
          Value: !Ref RoomTableName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 20
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref JankenHockeyTopic
      Tags:
        - Key: Project
          Value: JankenHockey

  # API Gateway 呼び出し回数アラーム（REST API）
  JankenHockeyRestApiCallCountAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: JankenHockeyRestApiCallCountAlarm
      AlarmDescription: "REST API呼び出し回数が30000回/5分を超過"
      Namespace: AWS/ApiGateway
      MetricName: Count
      Dimensions:
        - Name: ApiName
          Value: JankenHockeyRestAPI
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 200
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref JankenHockeyTopic
      Tags:
        - Key: Project
          Value: JankenHockey

  # API Gateway 呼び出し回数アラーム（WebSocket API）
  JankenHockeyWebSocketApiCallCountAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: JankenHockeyWebSocketApiCallCountAlarm
      AlarmDescription: "WebSocket API呼び出し回数が30000回/5分を超過"
      Namespace: AWS/ApiGateway
      MetricName: MessageCount
      Dimensions:
        - Name: Stage
          Value: prod
        - Name: ApiId
          Value: !Ref WebSocketApiId
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 30000
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref JankenHockeyTopic
      Tags:
        - Key: Project
          Value: JankenHockey

  # AWS Budgets（費用上限設定）
  JankenHockeyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: JankenHockeyMonthlyBudget
        BudgetLimit:
          Amount: 10
          Unit: USD
        TimeUnit: MONTHLY
        BudgetType: COST
        CostFilters:
          TagKeyValue:
            - "Project$JankenHockey"
        CostTypes:
          IncludeCredit: false
          IncludeDiscount: true
          IncludeOtherSubscription: true
          IncludeRecurring: true
          IncludeRefund: false
          IncludeSubscription: true
          IncludeSupport: true
          IncludeTax: true
          IncludeUpfront: true
          UseBlended: false
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref OperatorMailAddress
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref OperatorMailAddress
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref OperatorMailAddress

  #############################
  # CloudWatch Logs Metric Filters for ERROR logs
  #############################
  # Metric Filter for Connect Function
  ConnectFunctionErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      FilterPattern: "ERROR"
      LogGroupName: !Sub "/aws/lambda/${ConnectFunctionName}"
      MetricTransformations:
        - MetricName: ConnectFunctionErrors
          MetricNamespace: JankenHockey/Errors
          MetricValue: 1
          DefaultValue: 0

  # Metric Filter for Default Function
  DefaultFunctionErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      FilterPattern: "ERROR"
      LogGroupName: !Sub "/aws/lambda/${DefaultFunctionName}"
      MetricTransformations:
        - MetricName: DefaultFunctionErrors
          MetricNamespace: JankenHockey/Errors
          MetricValue: 1
          DefaultValue: 0

  # Metric Filter for Disconnect Function
  DisconnectFunctionErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      FilterPattern: "ERROR"
      LogGroupName: !Sub "/aws/lambda/${DisconnectFunctionName}"
      MetricTransformations:
        - MetricName: DisconnectFunctionErrors
          MetricNamespace: JankenHockey/Errors
          MetricValue: 1
          DefaultValue: 0

  # Metric Filter for Login Function
  LoginFunctionErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      FilterPattern: "ERROR"
      LogGroupName: !Sub "/aws/lambda/${LoginFunctionName}"
      MetricTransformations:
        - MetricName: LoginFunctionErrors
          MetricNamespace: JankenHockey/Errors
          MetricValue: 1
          DefaultValue: 0

  # Metric Filter for GameTimeout Function
  GameTimeoutFunctionErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      FilterPattern: "ERROR"
      LogGroupName: !Sub "/aws/lambda/${GameTimeoutFunctionName}"
      MetricTransformations:
        - MetricName: GameTimeoutFunctionErrors
          MetricNamespace: JankenHockey/Errors
          MetricValue: 1
          DefaultValue: 0

  # Metric Filter for GetRooms Function
  GetRoomsFunctionErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      FilterPattern: "ERROR"
      LogGroupName: !Sub "/aws/lambda/${GetRoomsFunctionName}"
      MetricTransformations:
        - MetricName: GetRoomsFunctionErrors
          MetricNamespace: JankenHockey/Errors
          MetricValue: 1
          DefaultValue: 0

  # Metric Filter for CreateRoom Function
  CreateRoomFunctionErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      FilterPattern: "ERROR"
      LogGroupName: !Sub "/aws/lambda/${CreateRoomFunctionName}"
      MetricTransformations:
        - MetricName: CreateRoomFunctionErrors
          MetricNamespace: JankenHockey/Errors
          MetricValue: 1
          DefaultValue: 0

  # Metric Filter for JoinRoom Function
  JoinRoomFunctionErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      FilterPattern: "ERROR"
      LogGroupName: !Sub "/aws/lambda/${JoinRoomFunctionName}"
      MetricTransformations:
        - MetricName: JoinRoomFunctionErrors
          MetricNamespace: JankenHockey/Errors
          MetricValue: 1
          DefaultValue: 0

  # Metric Filter for SaveCpuBattleHistory Function
  SaveCpuBattleHistoryFunctionErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      FilterPattern: "ERROR"
      LogGroupName: !Sub "/aws/lambda/${SaveCpuBattleHistoryFunctionName}"
      MetricTransformations:
        - MetricName: SaveCpuBattleHistoryFunctionErrors
          MetricNamespace: JankenHockey/Errors
          MetricValue: 1
          DefaultValue: 0

  # Metric Filter for SaveGuestCpuBattleHistory Function
  SaveGuestCpuBattleHistoryFunctionErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      FilterPattern: "ERROR"
      LogGroupName: !Sub "/aws/lambda/${SaveGuestCpuBattleHistoryFunctionName}"
      MetricTransformations:
        - MetricName: SaveGuestCpuBattleHistoryFunctionErrors
          MetricNamespace: JankenHockey/Errors
          MetricValue: 1
          DefaultValue: 0

  # Metric Filter for Authorizer Function
  AuthorizerFunctionErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      FilterPattern: "ERROR"
      LogGroupName: !Sub "/aws/lambda/${AuthorizerFunctionName}"
      MetricTransformations:
        - MetricName: AuthorizerFunctionErrors
          MetricNamespace: JankenHockey/Errors
          MetricValue: 1
          DefaultValue: 0

  #############################
  # CloudWatch Alarm for ERROR logs
  #############################
  JankenHockeyRestApiErrorLogAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: JankenHockeyRestApiErrorLogAlarm
      AlarmDescription: "Lambda Error(REST API)"
      Metrics:
        - Id: e1
          Expression: "SUM(METRICS())"
          Label: "Total Error Logs"
        - Id: m1
          MetricStat:
            Metric:
              Namespace: JankenHockey/Errors
              MetricName: LoginFunctionErrors
            Period: 60
            Stat: Sum
          ReturnData: false
        - Id: m2
          MetricStat:
            Metric:
              Namespace: JankenHockey/Errors
              MetricName: GetRoomsFunctionErrors
            Period: 60
            Stat: Sum
          ReturnData: false
        - Id: m3
          MetricStat:
            Metric:
              Namespace: JankenHockey/Errors
              MetricName: CreateRoomFunctionErrors
            Period: 60
            Stat: Sum
          ReturnData: false
        - Id: m4
          MetricStat:
            Metric:
              Namespace: JankenHockey/Errors
              MetricName: JoinRoomFunctionErrors
            Period: 60
            Stat: Sum
          ReturnData: false
        - Id: m5
          MetricStat:
            Metric:
              Namespace: JankenHockey/Errors
              MetricName: SaveCpuBattleHistoryFunctionErrors
            Period: 60
            Stat: Sum
          ReturnData: false
        - Id: m6
          MetricStat:
            Metric:
              Namespace: JankenHockey/Errors
              MetricName: SaveGuestCpuBattleHistoryFunctionErrors
            Period: 60
            Stat: Sum
          ReturnData: false
        - Id: m7
          MetricStat:
            Metric:
              Namespace: JankenHockey/Errors
              MetricName: AuthorizerFunctionErrors
            Period: 60
            Stat: Sum
          ReturnData: false
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref JankenHockeyTopic
      Tags:
        - Key: Project
          Value: JankenHockey

  JankenHockeyWebSocketApiErrorLogAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: JankenHockeyWebSocketApiErrorLogAlarm
      AlarmDescription: "Lambda Error(WebSocket API)"
      Metrics:
        - Id: e1
          Expression: "SUM(METRICS())"
          Label: "Total Error Logs"
        - Id: m1
          MetricStat:
            Metric:
              Namespace: JankenHockey/Errors
              MetricName: ConnectFunctionErrors
            Period: 60
            Stat: Sum
          ReturnData: false
        - Id: m2
          MetricStat:
            Metric:
              Namespace: JankenHockey/Errors
              MetricName: DefaultFunctionErrors
            Period: 60
            Stat: Sum
          ReturnData: false
        - Id: m3
          MetricStat:
            Metric:
              Namespace: JankenHockey/Errors
              MetricName: DisconnectFunctionErrors
            Period: 60
            Stat: Sum
          ReturnData: false
        - Id: m4
          MetricStat:
            Metric:
              Namespace: JankenHockey/Errors
              MetricName: GameTimeoutFunctionErrors
            Period: 60
            Stat: Sum
          ReturnData: false
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref JankenHockeyTopic
      Tags:
        - Key: Project
          Value: JankenHockey

Outputs:
  AlarmTopicArn:
    Description: SNS Topic ARN for Alarms
    Value: !Ref JankenHockeyTopic
    Export:
      Name: !Sub "${AWS::StackName}-AlarmTopicArn"