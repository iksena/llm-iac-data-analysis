AWSTemplateFormatVersion: '2010-09-09'
Description: 'SAA Lab 08 - duas VPCs conectadas por peering (barato) ou Transit Gateway (opcional)'

Parameters:
  ProjectName:
    Type: String
    Default: saa-lab-08
  ConnectivityMode:
    Type: String
    Default: Peering
    AllowedValues: [Peering, TransitGateway]
    Description: Peering não cobra por hora; Transit Gateway gera cobrança por anexo/hora e dados.

Conditions:
  UsePeering: !Equals [!Ref ConnectivityMode, Peering]
  UseTransitGateway: !Equals [!Ref ConnectivityMode, TransitGateway]

Resources:
  VpcA:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.81.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-vpc-a'}, {Key: Project, Value: saa-c03-intensive}, {Key: Lab, Value: '08'}, {Key: ManagedBy, Value: CloudFormation}]
  VpcB:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.82.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-vpc-b'}, {Key: Project, Value: saa-c03-intensive}, {Key: Lab, Value: '08'}, {Key: ManagedBy, Value: CloudFormation}]
  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcA
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.81.1.0/24
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-subnet-a'}, {Key: Lab, Value: '08'}]
  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcB
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.82.1.0/24
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-subnet-b'}, {Key: Lab, Value: '08'}]
  RouteTableA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VpcA
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-rt-a'}, {Key: Lab, Value: '08'}]
  RouteTableB:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VpcB
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-rt-b'}, {Key: Lab, Value: '08'}]
  AssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref SubnetA, RouteTableId: !Ref RouteTableA}
  AssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref SubnetB, RouteTableId: !Ref RouteTableB}

  VpcPeering:
    Type: AWS::EC2::VPCPeeringConnection
    Condition: UsePeering
    Properties:
      VpcId: !Ref VpcA
      PeerVpcId: !Ref VpcB
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-a-b'}, {Key: Project, Value: saa-c03-intensive}, {Key: Lab, Value: '08'}]
  PeeringRouteAtoB:
    Type: AWS::EC2::Route
    Condition: UsePeering
    Properties:
      RouteTableId: !Ref RouteTableA
      DestinationCidrBlock: 10.82.0.0/16
      VpcPeeringConnectionId: !Ref VpcPeering
  PeeringRouteBtoA:
    Type: AWS::EC2::Route
    Condition: UsePeering
    Properties:
      RouteTableId: !Ref RouteTableB
      DestinationCidrBlock: 10.81.0.0/16
      VpcPeeringConnectionId: !Ref VpcPeering

  TransitGateway:
    Type: AWS::EC2::TransitGateway
    Condition: UseTransitGateway
    Properties:
      Description: !Sub '${ProjectName} hub de rede'
      AmazonSideAsn: 64512
      AutoAcceptSharedAttachments: enable
      DefaultRouteTableAssociation: enable
      DefaultRouteTablePropagation: enable
      DnsSupport: enable
      VpnEcmpSupport: enable
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-tgw'}, {Key: Project, Value: saa-c03-intensive}, {Key: Lab, Value: '08'}, {Key: ManagedBy, Value: CloudFormation}]
  TgwAttachmentA:
    Type: AWS::EC2::TransitGatewayAttachment
    Condition: UseTransitGateway
    Properties:
      TransitGatewayId: !Ref TransitGateway
      VpcId: !Ref VpcA
      SubnetIds: [!Ref SubnetA]
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-attach-a'}, {Key: Lab, Value: '08'}]
  TgwAttachmentB:
    Type: AWS::EC2::TransitGatewayAttachment
    Condition: UseTransitGateway
    Properties:
      TransitGatewayId: !Ref TransitGateway
      VpcId: !Ref VpcB
      SubnetIds: [!Ref SubnetB]
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-attach-b'}, {Key: Lab, Value: '08'}]
  TgwRouteAtoB:
    Type: AWS::EC2::Route
    Condition: UseTransitGateway
    DependsOn: TgwAttachmentA
    Properties:
      RouteTableId: !Ref RouteTableA
      DestinationCidrBlock: 10.82.0.0/16
      TransitGatewayId: !Ref TransitGateway
  TgwRouteBtoA:
    Type: AWS::EC2::Route
    Condition: UseTransitGateway
    DependsOn: TgwAttachmentB
    Properties:
      RouteTableId: !Ref RouteTableB
      DestinationCidrBlock: 10.81.0.0/16
      TransitGatewayId: !Ref TransitGateway

Outputs:
  ConnectivityMode: {Value: !Ref ConnectivityMode}
  VpcAId: {Value: !Ref VpcA}
  VpcBId: {Value: !Ref VpcB}
  PeeringConnectionId: {Value: !If [UsePeering, !Ref VpcPeering, disabled]}
  TransitGatewayId: {Value: !If [UseTransitGateway, !Ref TransitGateway, disabled]}
  RouteTableAId: {Value: !Ref RouteTableA}
  RouteTableBId: {Value: !Ref RouteTableB}