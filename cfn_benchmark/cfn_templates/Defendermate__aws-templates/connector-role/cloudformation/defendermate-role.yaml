AWSTemplateFormatVersion: "2010-09-09"
# Trust policy shape (v1): primary guard is the per-connection ExternalId.
# An aws:PrincipalArn defense-in-depth condition is intentionally omitted
# for v1 — it would require customers to know Defendermate's internal IAM
# topology, which differs between on-prem and SaaS deployments. Re-added
# in v2 once dm-core has a stable `dm-core-platform` service role.
#
# Policy actions duplicated from ../../connector/readOnlyPolicy.json and
# ../../connector/reachabilityPolicy.json — keep in sync.
Description: >
  Defendermate cross-account read-only IAM role. Trusts the Defendermate
  platform AWS account to call sts:AssumeRole, conditioned on a
  per-connection External ID (confused-deputy prevention).

Parameters:
  ExternalId:
    Type: String
    MinLength: 1
    NoEcho: false
    Description: >
      The External ID shown in the Defendermate provider wizard. Not a secret —
      it's a per-connection token the role's trust policy requires to prevent
      the confused-deputy problem.

  DefendermateAccountId:
    Type: String
    MinLength: 12
    MaxLength: 12
    AllowedPattern: "[0-9]{12}"
    Description: >
      Defendermate's own AWS account ID. Environment-specific — the wizard
      shows the correct value for your Defendermate tenant (dev / staging /
      prod). The trust policy's Principal references this account's root.
      No default; customers supply it via the wizard or by editing this
      file.

  RoleName:
    Type: String
    Default: "DefendermateRole"
    Description: >
      Override the role name if your organization has an IAM naming policy.

Resources:
  DefendermateRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      # Matches the dm-streams runtime AssumeRole duration. Without this,
      # customers with org-wide reduced defaults (some enterprises set
      # 1800s) would hit ValidationError at scan time.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${DefendermateAccountId}:root"
            Action: "sts:AssumeRole"
            Condition:
              StringEquals:
                "sts:ExternalId": !Ref ExternalId
      Tags:
        - Key: Service
          Value: defendermate.com
        - Key: Support
          Value: support@defendermate.com

  DefendermateReadOnlyPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "${RoleName}-read-only"
      Roles:
        - !Ref DefendermateRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: Identity
            Effect: Allow
            Action:
              - "sts:GetCallerIdentity"
            Resource: "*"
          - Sid: EC2Network
            Effect: Allow
            Action:
              - "ec2:DescribeRegions"
              - "ec2:DescribeInstances"
              - "ec2:DescribeVpcs"
              - "ec2:DescribeSubnets"
              - "ec2:DescribeRouteTables"
              - "ec2:DescribeNetworkAcls"
              - "ec2:DescribeSecurityGroups"
              - "ec2:DescribeAddresses"
              - "ec2:DescribeNetworkInterfaces"
              - "ec2:DescribeInternetGateways"
              - "ec2:DescribeNatGateways"
            Resource: "*"
          - Sid: IAMRead
            Effect: Allow
            Action:
              - "iam:ListUsers"
              - "iam:ListRoles"
              - "iam:ListGroups"
              - "iam:ListInstanceProfiles"
              - "iam:ListMFADevices"
              - "iam:ListAccessKeys"
              - "iam:ListAttachedUserPolicies"
              - "iam:ListAttachedRolePolicies"
              - "iam:ListAttachedGroupPolicies"
              - "iam:ListUserPolicies"
              - "iam:ListRolePolicies"
              - "iam:ListGroupPolicies"
              - "iam:ListGroupsForUser"
              - "iam:GetUser"
              - "iam:GetRole"
              - "iam:GetGroup"
              - "iam:GetUserPolicy"
              - "iam:GetRolePolicy"
              - "iam:GetGroupPolicy"
              - "iam:GetPolicy"
              - "iam:GetPolicyVersion"
            Resource: "*"
          - Sid: Lambda
            Effect: Allow
            Action:
              - "lambda:ListFunctions"
              - "lambda:GetPolicy"
            Resource: "*"
          - Sid: EKS
            Effect: Allow
            Action:
              - "eks:ListClusters"
              - "eks:DescribeCluster"
            Resource: "*"
          - Sid: ELBv2
            Effect: Allow
            Action:
              - "elasticloadbalancing:DescribeLoadBalancers"
              - "elasticloadbalancing:DescribeListeners"
              - "elasticloadbalancing:DescribeTargetGroups"
              - "elasticloadbalancing:DescribeTargetHealth"
            Resource: "*"
          - Sid: S3
            Effect: Allow
            Action:
              - "s3:ListAllMyBuckets"
              - "s3:GetBucketLocation"
              - "s3:GetBucketPublicAccessBlock"
              - "s3:GetEncryptionConfiguration"
              - "s3:GetBucketPolicy"
            Resource: "*"
          - Sid: RDS
            Effect: Allow
            Action:
              - "rds:DescribeDBInstances"
            Resource: "*"
          - Sid: SecretsManager
            Effect: Allow
            Action:
              - "secretsmanager:ListSecrets"
              - "secretsmanager:GetResourcePolicy"
            Resource: "*"
          - Sid: KMS
            Effect: Allow
            Action:
              - "kms:ListKeys"
              - "kms:DescribeKey"
              - "kms:GetKeyRotationStatus"
              - "kms:GetKeyPolicy"
            Resource: "*"
          - Sid: Inspector2
            Effect: Allow
            Action:
              - "inspector2:ListFindings"
            Resource: "*"
          - Sid: AutoScaling
            Effect: Allow
            Action:
              - "autoscaling:DescribeAutoScalingGroups"
            Resource: "*"
          - Sid: ECS
            Effect: Allow
            Action:
              - "ecs:ListClusters"
              - "ecs:ListTasks"
              - "ecs:DescribeTasks"
              - "ecs:DescribeTaskDefinition"
            Resource: "*"
          - Sid: ECR
            Effect: Allow
            Action:
              - "ecr:BatchGetImage"
            Resource: "*"
          - Sid: Organizations
            Effect: Allow
            Action:
              - "organizations:DescribeOrganization"
              - "organizations:ListParents"
              - "organizations:ListPolicies"
              - "organizations:ListTargetsForPolicy"
              - "organizations:DescribePolicy"
            Resource: "*"
          - Sid: DmStreamsWafv2Ingestion
            Effect: Allow
            Action:
              - "wafv2:ListWebACLs"
              - "wafv2:GetWebACL"
              - "wafv2:ListResourcesForWebACL"
            Resource: "*"
          - Sid: GuardDuty
            Effect: Allow
            Action:
              - "guardduty:ListDetectors"
              - "guardduty:GetDetector"
              - "guardduty:ListCoverage"
            Resource: "*"

  DefendermateReachabilityPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "${RoleName}-reachability"
      Roles:
        - !Ref DefendermateRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: SSMExecution
            Effect: Allow
            Action:
              - "ssm:SendCommand"
              - "ssm:GetCommandInvocation"
              - "ssm:TerminateSession"
            Resource: "*"
          - Sid: ECSExec
            Effect: Allow
            Action:
              - "ecs:ExecuteCommand"
            Resource: "*"

Outputs:
  RoleArn:
    Description: ARN of the created role. Paste this into the Defendermate wizard.
    Value: !GetAtt DefendermateRole.Arn
  RoleName:
    Description: Name of the created role.
    Value: !Ref DefendermateRole