AWSTemplateFormatVersion: "2010-09-09"
Description: "EKS Stack for Apache Yunikorn on EMR in EKS Infrastructure"

Parameters:
  ProjectName:
    Description: An environment name that is prefixed to resource names
    Type: String
    Default: yunikorn-emr-eks

  VPC:
    Description: The VPC ID where EKS cluster will be created
    Type: AWS::EC2::VPC::Id

  PrivateSubnets:
    Description: List of private subnet IDs for EKS cluster
    Type: List<AWS::EC2::Subnet::Id>

  InstanceType:
    Description: EC2 instance type for EKS node groups
    Type: String
    Default: m5.2xlarge

  EMROnEKSClusterName:
    Description: Name of the EMR on EKS cluster
    Type: String
    Default: emr-on-eks-cluster

  ClusterVersion:
    Description: Kubernetes version for EKS clusters
    Type: String
    Default: "1.33"

  BastionHostSecurityGroupParam:
    Description: Security Group ID for the Bastion Host
    Type: AWS::EC2::SecurityGroup::Id

  BastionHostRoleArn:
    Description: ARN of the Bastion Host IAM Role
    Type: String

Resources:
  EKSClusterRole:
    Type: AWS::IAM::Role
    Metadata:
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-IAM4
            reason: "AWS managed policies are required for EKS cluster role to function properly"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy

  EKSNodeRole:
    Type: AWS::IAM::Role
    Metadata:
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-IAM4
            reason: "AWS managed policies are required for EKS node role to function properly"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly

  EKSKMSKey:
    Type: AWS::KMS::Key
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_111
            reason: "KMS key policy requires wildcard resource for proper EKS integration"
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-IAM5
            reason: "Wildcard permissions are required for KMS key policy to allow proper EKS integration"
    Properties:
      Description: KMS key for EKS cluster secrets encryption
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          - Sid: Allow EKS to use the key
            Effect: Allow
            Principal:
              AWS: !GetAtt EKSClusterRole.Arn
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: "*"
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete

  ######### EMR on EKS Cluster #########
  EMROnEKSCluster:
    Type: AWS::EKS::Cluster
    Properties:
      Name: !Ref EMROnEKSClusterName
      Version: !Ref ClusterVersion
      RoleArn: !GetAtt EKSClusterRole.Arn
      AccessConfig:
        AuthenticationMode: API_AND_CONFIG_MAP
        BootstrapClusterCreatorAdminPermissions: true
      ResourcesVpcConfig:
        EndpointPrivateAccess: true
        EndpointPublicAccess: false
        SubnetIds: !Ref PrivateSubnets
      EncryptionConfig:
        - Provider:
            KeyArn: !GetAtt EKSKMSKey.Arn
          Resources:
            - secrets
      # https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-properties-eks-cluster-loggingtypeconfig.html
      Logging:
        ClusterLogging:
          EnabledTypes:
            - Type: api
            - Type: audit
            - Type: authenticator
            - Type: controllerManager
            - Type: scheduler
      Tags:
        - Key: ProjectName
          Value: !Ref ProjectName

  EMROnEKSNodeGroup:
    Type: AWS::EKS::Nodegroup
    DeletionPolicy: Delete
    UpdatePolicy:
      UpdateReplacePolicy: Retain
    Properties:
      ClusterName: !Ref EMROnEKSCluster
      NodeRole: !GetAtt EKSNodeRole.Arn
      ScalingConfig:
        MinSize: 4
        DesiredSize: 4
        MaxSize: 4
      InstanceTypes:
        - !Ref InstanceType
      DiskSize: 20
      AmiType: AL2023_x86_64_STANDARD
      Subnets: !Ref PrivateSubnets

  # EKS Access Entry for Bastion Host
  BastionHostAccessEntry:
    Type: AWS::EKS::AccessEntry
    Properties:
      ClusterName: !Ref EMROnEKSCluster
      PrincipalArn: !Ref BastionHostRoleArn
      Type: STANDARD
      AccessPolicies:
        - PolicyArn: arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy
          AccessScope:
            Type: cluster

Outputs:
  EMROnEKSClusterName:
    Description: Name of the EMR on EKS cluster
    Value: !Ref EMROnEKSCluster

  EMROnEKSClusterEndpoint:
    Description: Endpoint for the EMR On EKS cluster
    Value: !GetAtt EMROnEKSCluster.Endpoint

  EMROnEKSSecurityGroups:
    Description: Security Groups for the EKS clusters
    Value:
      !Join [
        ",",
        [
          !GetAtt EMROnEKSCluster.ClusterSecurityGroupId
        ],
      ]

  EMROnEKSClusterSecurityGroup:
    Description: ID of the first EKS Security Group
    Value: !GetAtt EMROnEKSCluster.ClusterSecurityGroupId

  EMROnEKSClusterOidcProviderUrl:
    Value:
      !Select [
        1,
        !Split [
          "https://",
          !GetAtt EMROnEKSCluster.OpenIdConnectIssuerUrl,
        ],
      ]