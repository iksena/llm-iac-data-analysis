AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  Lambda function from an S3 zip or a container image, with an execution role,
  a retained log group, optional VPC attachment, a failure destination, and
  concurrency controls.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Naming
        Parameters:
          - NamePrefix
          - Environment
          - FunctionSuffix
      - Label:
          default: Code
        Parameters:
          - PackageType
          - ImageUri
          - CodeS3Bucket
          - CodeS3Key
          - Runtime
          - Handler
          - Architecture
      - Label:
          default: Execution
        Parameters:
          - MemorySize
          - TimeoutSeconds
          - EphemeralStorageMb
      - Label:
          default: Concurrency
        Parameters:
          - ReservedConcurrency
          - ProvisionedConcurrency
      - Label:
          default: Environment variables
        Parameters:
          - EnvVar1Name
          - EnvVar1Value
          - EnvVar2Name
          - EnvVar2Value
      - Label:
          default: Networking
        Parameters:
          - SubnetIds
          - SecurityGroupIds
      - Label:
          default: Operations
        Parameters:
          - LogRetentionDays
          - TracingMode
          - FailureDestinationArn
          - ManagedPolicyArn

Parameters:
  NamePrefix:
    Type: String
    Description: Prefix for the function name.
    AllowedPattern: "^[a-z][a-z0-9-]{1,30}[a-z0-9]$"
    ConstraintDescription: 3-32 lowercase characters, digits and hyphens.

  Environment:
    Type: String
    Description: Environment this function runs in. Injected as ENVIRONMENT.
    Default: dev
    AllowedValues: [dev, staging, prod]

  FunctionSuffix:
    Type: String
    Description: What this function does, e.g. "resize" or "webhook".
    Default: handler
    AllowedPattern: "^[a-z0-9][a-z0-9-]{0,40}$"

  PackageType:
    Type: String
    Description: >-
      Zip takes CodeS3Bucket/CodeS3Key and a managed runtime. Image takes
      ImageUri from ECR and lets you ship any runtime - Rust, a compiled Go
      binary with system libraries, or a Python function with heavy native deps
      that will not fit in a 250 MB unzipped layer.
    Default: Zip
    AllowedValues: [Zip, Image]

  ImageUri:
    Type: String
    Description: ECR image URI, used when PackageType is Image.
    Default: ""

  CodeS3Bucket:
    Type: String
    Description: Bucket holding the deployment zip, used when PackageType is Zip.
    Default: ""

  CodeS3Key:
    Type: String
    Description: >-
      Key of the deployment zip. Include a version or commit SHA in the key -
      Lambda caches by bucket and key, so overwriting the same key does not
      reliably update the function.
    Default: ""

  Runtime:
    Type: String
    Description: >-
      Managed runtime, for Zip packages. provided.al2023 is the one to use for
      Rust, Go, and anything else that compiles to a static binary.
    Default: python3.12
    AllowedValues:
      - python3.12
      - python3.11
      - nodejs20.x
      - nodejs22.x
      - java21
      - dotnet8
      - ruby3.3
      - provided.al2023

  Handler:
    Type: String
    Description: Entry point, for Zip packages, e.g. "app.handler" or "bootstrap".
    Default: app.handler

  Architecture:
    Type: String
    Description: >-
      arm64 (Graviton) is roughly 20% cheaper per GB-second and usually faster.
      Use x86_64 only when a dependency has no arm64 build.
    Default: arm64
    AllowedValues: [arm64, x86_64]

  MemorySize:
    Type: Number
    Description: >-
      Memory in MB. This is also the CPU dial - Lambda allocates CPU in
      proportion, so a CPU-bound function is often *cheaper* at higher memory
      because it finishes proportionally faster.
    Default: 512
    MinValue: 128
    MaxValue: 10240

  TimeoutSeconds:
    Type: Number
    Description: >-
      Maximum run time. Keep it close to the real worst case: a function that
      hangs bills for the full timeout on every stuck invocation.
    Default: 30
    MinValue: 1
    MaxValue: 900

  EphemeralStorageMb:
    Type: Number
    Description: Size of /tmp. Raise it for functions that download models or large files.
    Default: 512
    MinValue: 512
    MaxValue: 10240

  ReservedConcurrency:
    Type: Number
    Description: >-
      Cap on simultaneous executions, and the only protection a downstream
      database has against a Lambda scaling to a thousand connections. -1 leaves
      it unreserved (shares the account pool); 0 disables the function entirely.
    Default: -1
    MinValue: -1
    MaxValue: 10000

  ProvisionedConcurrency:
    Type: Number
    Description: >-
      Pre-initialised execution environments, which removes cold starts and bills
      whether or not they are used. 0 disables. Only meaningful on an alias or
      version, so this template publishes a version when it is non-zero.
    Default: 0
    MinValue: 0
    MaxValue: 10000

  EnvVar1Name:
    Type: String
    Description: Name of an additional environment variable. Leave empty to skip.
    Default: ""
  EnvVar1Value:
    Type: String
    Description: Value for EnvVar1Name. Not for credentials - read those from Secrets Manager at runtime.
    Default: ""
  EnvVar2Name:
    Type: String
    Description: Name of a second additional environment variable.
    Default: ""
  EnvVar2Value:
    Type: String
    Description: Value for EnvVar2Name.
    Default: ""

  SubnetIds:
    Type: CommaDelimitedList
    Description: >-
      Private subnets to attach to, for reaching an RDS instance or an
      ElastiCache cluster. Leave empty to run outside the VPC - which is faster
      to scale and is the right default, since a VPC-attached function reaches
      AWS APIs only through NAT or an endpoint.
    Default: ""

  SecurityGroupIds:
    Type: CommaDelimitedList
    Description: Security groups for VPC attachment. Required when SubnetIds is set.
    Default: ""

  LogRetentionDays:
    Type: Number
    Description: >-
      Retention for the log group. Declared here rather than left to Lambda,
      which creates the group implicitly with infinite retention.
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1827, 3653]

  TracingMode:
    Type: String
    Description: X-Ray tracing. Active samples traces; PassThrough only continues an existing trace.
    Default: Active
    AllowedValues: [Active, PassThrough]

  FailureDestinationArn:
    Type: String
    Description: >-
      SQS queue or SNS topic receiving the payload of asynchronous invocations
      that exhaust their retries. Without one, a failed async invocation is gone -
      the log line is all that is left of the event.
    Default: ""

  ManagedPolicyArn:
    Type: String
    Description: >-
      Managed policy granting the function the AWS access it needs, beyond
      logging and X-Ray. Leave empty for a function that calls no AWS APIs.
    Default: ""

Conditions:
  IsImagePackage: !Equals [!Ref PackageType, "Image"]
  HasVpcConfig: !Not [!Equals [!Join ["", !Ref SubnetIds], ""]]
  HasReservedConcurrency: !Not [!Equals [!Ref ReservedConcurrency, -1]]
  HasProvisionedConcurrency: !Not [!Equals [!Ref ProvisionedConcurrency, 0]]
  HasFailureDestination: !Not [!Equals [!Ref FailureDestinationArn, ""]]
  HasManagedPolicy: !Not [!Equals [!Ref ManagedPolicyArn, ""]]
  HasEnvVar1: !Not [!Equals [!Ref EnvVar1Name, ""]]
  HasEnvVar2: !Not [!Equals [!Ref EnvVar2Name, ""]]

Resources:
  # Declared explicitly so retention is bounded. Lambda otherwise creates this
  # group on first invocation with infinite retention, and because the implicit
  # group is not owned by the stack, a later attempt to declare it fails with
  # "log group already exists".
  LogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${NamePrefix}-${Environment}-${FunctionSuffix}"
      RetentionInDays: !Ref LogRetentionDays

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !If
          - HasVpcConfig
          # Adds the ENI management permissions a VPC-attached function needs;
          # without them the function fails to create its network interface and
          # every invocation times out with no log output at all.
          - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole"
          - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
        - !If [HasManagedPolicy, !Ref ManagedPolicyArn, !Ref "AWS::NoValue"]
      Policies:
        - PolicyName: tracing-and-destinations
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                # Neither action takes a resource; IAM documents them as
                # "resource type: not applicable".
                Resource: "*"
              - !If
                - HasFailureDestination
                - Effect: Allow
                  Action:
                    - sqs:SendMessage
                    - sns:Publish
                  Resource: !Ref FailureDestinationArn
                - !Ref AWS::NoValue

  Function:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${NamePrefix}-${Environment}-${FunctionSuffix}"
      Description: !Sub "${FunctionSuffix} (${Environment})"
      Role: !GetAtt ExecutionRole.Arn
      PackageType: !Ref PackageType
      Architectures: [!Ref Architecture]
      Runtime: !If [IsImagePackage, !Ref "AWS::NoValue", !Ref Runtime]
      Handler: !If [IsImagePackage, !Ref "AWS::NoValue", !Ref Handler]
      Code: !If
        - IsImagePackage
        - ImageUri: !Ref ImageUri
        - S3Bucket: !Ref CodeS3Bucket
          S3Key: !Ref CodeS3Key
      MemorySize: !Ref MemorySize
      Timeout: !Ref TimeoutSeconds
      EphemeralStorage:
        Size: !Ref EphemeralStorageMb
      ReservedConcurrentExecutions: !If
        - HasReservedConcurrency
        - !Ref ReservedConcurrency
        - !Ref AWS::NoValue
      TracingConfig:
        Mode: !Ref TracingMode
      VpcConfig: !If
        - HasVpcConfig
        - SubnetIds: !Ref SubnetIds
          SecurityGroupIds: !Ref SecurityGroupIds
        - !Ref AWS::NoValue
      # Points the function at the group declared above. The Ref is also what
      # orders creation: the group exists before the function can be invoked, so
      # Lambda never creates an unmanaged one with infinite retention that this
      # stack would then collide with. (An explicit DependsOn here would be
      # redundant — cfn-lint W3005 flags it.)
      LoggingConfig:
        LogGroup: !Ref LogGroup
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          # Fn::If cannot add or remove a *key* in a map, only a value, so unused
          # slots resolve to an empty string rather than disappearing. This is a
          # genuine CloudFormation limitation, not an oversight.
          EnvVar1: !If [HasEnvVar1, !Ref EnvVar1Value, ""]
          EnvVar2: !If [HasEnvVar2, !Ref EnvVar2Value, ""]

  AsyncConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Condition: HasFailureDestination
    Properties:
      FunctionName: !Ref Function
      Qualifier: $LATEST
      MaximumRetryAttempts: 2
      DestinationConfig:
        OnFailure:
          Destination: !Ref FailureDestinationArn

  Version:
    Type: AWS::Lambda::Version
    Condition: HasProvisionedConcurrency
    Properties:
      FunctionName: !Ref Function
      ProvisionedConcurrencyConfig:
        ProvisionedConcurrentExecutions: !Ref ProvisionedConcurrency

Outputs:
  FunctionArn:
    Description: Function ARN, for event source mappings and API integrations.
    Value: !GetAtt Function.Arn

  FunctionName:
    Description: Function name, for the CLI and CloudWatch alarm dimensions.
    Value: !Ref Function

  ExecutionRoleArn:
    Description: Execution role ARN - the identity the function runs as.
    Value: !GetAtt ExecutionRole.Arn

  LogGroupName:
    Description: Log group the function writes to.
    Value: !Ref LogGroup