AWSTemplateFormatVersion: "2010-09-09"
Description: >
  AWS Database Migration Service (AWS DMS) and AWS Schema Conversion Tool (AWS SCT)
  infrastructure for Oracle to Amazon Aurora PostgreSQL migration.
  PREREQUISITES: AWS account with Amazon VPC, Amazon RDS, AWS DMS, AWS KMS, AWS IAM, Amazon S3, AWS Secrets Manager
  permissions. AWS CLI configured. Oracle and PostgreSQL familiarity required.
  COST WARNING: Creates billable resources (Amazon RDS, Amazon Aurora, AWS DMS,
  NAT Gateway, VPC Endpoints). Cost varies by instance size.
  WARNING: Cleanup permanently deletes S3 objects and schedules KMS key deletion.RDS and Aurora databases will be permanently deleted.
  CLEANUP: 1) Empty main bucket: aws s3 rm s3://<prefix>-<acct>-<region> --recursive.
  2) Empty logs bucket: aws s3 rm s3://<prefix>-access-logs-<acct>-<region> --recursive.
  Note: Object Lock may require --bypass-governance-retention.
  3) Delete stack: aws cloudformation delete-stack --stack-name <stack-name>.
  4) Verify deletion: aws cloudformation describe-stacks returns StackNotFoundException when complete.

Parameters:
  S3BucketPrefix:
    Type: String
    Description: "Prefix for the S3 bucket name (will be appended with account number and region) - Only used if creating new bucket"
    Default: "dms-sct-reports"
    AllowedPattern: "^[a-z0-9][a-z0-9-]*$"
    ConstraintDescription: "Bucket prefix must contain only lowercase letters, numbers, and hyphens, and must start with a letter or number"
    MinLength: 3
    MaxLength: 20

  DeployOracleRDS:
    Type: String
    Default: "no"
    Description: "Do you want to deploy Oracle RDS instance?"
    AllowedValues:
      - "yes"
      - "no"

  VPCCIDRBlock:
    Type: String
    Default: 10.0.0.0/16
    AllowedPattern: '[a-zA-Z0-9]+\..+'
    Description: "CIDR (Classless Inter-Domain Routing) block for VPC (such as 10.0.0.0/16)"
  VPCSubnet1:
    Description: CIDR Block for subnet 1
    Type: String
    Default: 10.0.0.0/24
    AllowedPattern: '[a-zA-Z0-9]+\..+'
  VPCSubnet2:
    Description: CIDR Block for subnet 2
    Type: String
    Default: 10.0.1.0/24
    AllowedPattern: '[a-zA-Z0-9]+\..+'
  MyIP:
    Description: "Public IP address of your machine. Open a new browser tab and search for What's my IP. Copy the IP address and paste it here, such as x.x.x.x/32"
    Type: String
    AllowedPattern: '[a-zA-Z0-9]+\..+'
  DMSVPCRoleExists:
    Default: "no"
    Description: "Does dms-vpc-role already exist in your account? Note if the role already exists, ensure to select 'yes', otherwise the stack will fail. Check in the IAM console: https://console.aws.amazon.com/iamv2/home#/roles/details/dms-vpc-role"
    Type: String
    AllowedValues:
      - "yes"
      - "no"
  DMSInstanceClass:
    Description: "Enter DMS Instance Class (default dms.t3.large)"
    Default: dms.t3.large
    Type: String

  OracleEdition:
    Description: "Select Oracle Database Edition (default: Standard Edition 2)"
    Type: String
    Default: oracle-se2
    AllowedValues:
      - oracle-se2
      - oracle-ee
  OracleDBUsername:
    Default: admin
    NoEcho: "false"
    Description: "Enter database Admin username for RDS Oracle (default username: admin)"
    Type: String
    MinLength: "4"
    MaxLength: "16"
    AllowedPattern: "[a-zA-Z][a-zA-Z0-9]*"
    ConstraintDescription: must begin with a letter and contain a minimum of 4 alphanumeric characters.
  OracleRDSDBInstanceClass:
    Description: "Enter Oracle RDS DBInstance Class (default db.r6i.large)"
    Default: db.r6i.large
    Type: String
  ExistingOracleHost:
    Type: String
    Description: "Enter existing Oracle host endpoint (only if not deploying new Oracle RDS)"
    Default: ""
  ExistingOraclePort:
    Type: Number
    MinValue: 1
    MaxValue: 65535
    Default: 1521
    Description: "Enter the port number for existing Oracle database (1-65535)"
  ExistingOracleSID:
    Type: String
    Description: "Enter the Oracle SID (System Identifier)"
  ExistingOracleUsername:
    Type: String
    Description: "Enter existing Oracle username"
    Default: ""
  ExistingOraclePassword:
    Type: String
    Description: "Enter existing Oracle password"
    Default: ""
    NoEcho: true

  AuroraDBName:
    Default: hrdata
    Description: "Enter Aurora PostgreSQL database name (default database: hrdata)"
    Type: String
    MinLength: "1"
    MaxLength: "63"
    AllowedPattern: "[a-zA-Z][a-zA-Z0-9_]*"
  AuroraDBUsername:
    Default: auradmin
    NoEcho: "false"
    Description: "Enter database Admin username for RDS Aurora PostgreSQL (default username: auradmin)"
    Type: String
    MinLength: "4"
    MaxLength: "16"
    AllowedPattern: "[a-zA-Z][a-zA-Z0-9]*"
  AuroraDBInstanceClass:
    Description: "Enter Aurora RDS DBInstance Class (default db.r6g.large)"
    Default: db.r6g.large
    Type: String

  OracleMultiAZ:
    Type: String
    Default: "true"
    Description: "Enable Multi-AZ deployment for Oracle RDS instance"
    AllowedValues:
      - "true"
      - "false"

  AuroraMultiAZ:
    Type: String
    Default: "true"
    Description: "Enable Multi-AZ deployment for Aurora PostgreSQL instance"
    AllowedValues:
      - "true"
      - "false"

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "S3 Configuration"
        Parameters:
          - S3BucketPrefix
      - Label:
          default: "Network Configuration"
        Parameters:
          - VPCCIDRBlock
          - VPCSubnet1
          - VPCSubnet2
          - MyIP
      - Label:
          default: "Oracle Database Configuration"
        Parameters:
          - DeployOracleRDS
      - Label:
          default: "New Oracle RDS Configuration"
        Parameters:
          - OracleEdition
          - OracleDBUsername
          - OracleRDSDBInstanceClass
          - OracleMultiAZ
      - Label:
          default: "Existing Oracle Configuration"
        Parameters:
          - ExistingOracleHost
          - ExistingOraclePort
          - ExistingOracleSID
          - ExistingOracleUsername
          - ExistingOraclePassword

      - Label:
          default: "Aurora Database Configuration"
        Parameters:
          - AuroraDBName
          - AuroraDBUsername
          - AuroraDBInstanceClass
          - AuroraMultiAZ
      - Label:
          default: "DMS Configuration"
        Parameters:
          - DMSInstanceClass
          - DMSVPCRoleExists
    ParameterLabels:
      S3BucketPrefix:
        default: "S3 Bucket Prefix"
Rules:
  NewOracleRDSRule:
    RuleCondition: !Equals
      - !Ref DeployOracleRDS
      - "yes"
    Assertions:
      - Assert: !Not
          - !Equals
            - !Ref OracleDBUsername
            - ""
        AssertDescription: "Oracle DB Username is required when deploying new RDS instance"

  ExistingOracleRule:
    RuleCondition: !Equals
      - !Ref DeployOracleRDS
      - "no"
    Assertions:
      - Assert: !Not
          - !Equals
            - !Ref ExistingOracleHost
            - ""
        AssertDescription: "Existing Oracle Host is required when not deploying new RDS instance"
      - Assert: !Not
          - !Equals
            - !Ref ExistingOracleUsername
            - ""
        AssertDescription: "Existing Oracle Username is required when not deploying new RDS instance"

Conditions:
  DMSVPCRoleExistsCondition: !Equals
    - !Ref DMSVPCRoleExists
    - "no"
  DeployOracleRDSCondition: !Equals
    - !Ref DeployOracleRDS
    - "yes"
  OracleByolCondition: !Equals
    - !Ref OracleEdition
    - "oracle-ee"
  UseExistingOracleCondition: !Equals
    - !Ref DeployOracleRDS
    - "no"
  AuroraMultiAZCondition: !Equals
    - !Ref AuroraMultiAZ
    - "true"

Resources:
  DMSSCTAccessLogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${S3BucketPrefix}-access-logs-${AWS::AccountId}-${AWS::Region}"
      ObjectLockEnabled: true
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention:
            Mode: GOVERNANCE
            Days: 90
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        DestinationBucketName: !Sub "${S3BucketPrefix}-access-logs-${AWS::AccountId}-${AWS::Region}"
        LogFilePrefix: "self-access-logs/"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteAccessLogsAfter90Days
            Status: Enabled
            ExpirationInDays: 90
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-sct-access-logs"
        - Key: Project
          Value: !Ref AWS::StackName
  DMSSCTAccessLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DMSSCTAccessLogsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureConnections
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !Sub "arn:aws:s3:::${DMSSCTAccessLogsBucket}"
              - !Sub "arn:aws:s3:::${DMSSCTAccessLogsBucket}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  # These files in DMSSCTBucket can be regenerated from AWS SCT
  DMSSCTBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      BucketName: !Sub "${S3BucketPrefix}-${AWS::AccountId}-${AWS::Region}"
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        DestinationBucketName: !Ref DMSSCTAccessLogsBucket
        LogFilePrefix: "access-logs/"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-sct-reports"
        - Key: Project
          Value: !Ref AWS::StackName

  DMSSCTBucketPolicy:
    Type: AWS::S3::BucketPolicy
    DependsOn: DMSSCTBucket
    Properties:
      Bucket: !Ref DMSSCTBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowDMSAccess
            Effect: Allow
            Principal:
              Service: dms.amazonaws.com
            Action:
              - s3:PutObject
              - s3:GetObject
              - s3:DeleteObject
              - s3:ListBucket
              - s3:GetBucketLocation
            Resource:
              - !Sub "arn:aws:s3:::${DMSSCTBucket}"
              - !Sub "arn:aws:s3:::${DMSSCTBucket}/*"
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref "AWS::AccountId"
          - Sid: AllowDMSServiceRoleAccess
            Effect: Allow
            Principal: "*"
            Action:
              - s3:PutObject
              - s3:GetObject
              - s3:DeleteObject
              - s3:ListBucket
              - s3:GetBucketLocation
            Resource:
              - !Sub "arn:aws:s3:::${DMSSCTBucket}"
              - !Sub "arn:aws:s3:::${DMSSCTBucket}/*"
            Condition:
              StringLike:
                "aws:PrincipalArn": !Sub "arn:aws:iam::${AWS::AccountId}:role/service-role/DMSS3AccessRole-*"
          - Sid: DenyInsecureConnections
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !Sub "arn:aws:s3:::${DMSSCTBucket}"
              - !Sub "arn:aws:s3:::${DMSSCTBucket}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VPCCIDRBlock
      EnableDnsSupport: "true"
      EnableDnsHostnames: "true"
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-VPC
        - Key: Project
          Value: !Ref AWS::StackName

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.3.0/24
      MapPublicIpOnLaunch: false
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-Private-Subnet-1
        - Key: Project
          Value: !Ref AWS::StackName

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.4.0/24
      MapPublicIpOnLaunch: false
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-Private-Subnet-2
        - Key: Project
          Value: !Ref AWS::StackName

  PrivateSubnet3:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.5.0/24
      MapPublicIpOnLaunch: false
      AvailabilityZone: !Select [2, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-Private-Subnet-3
        - Key: Project
          Value: !Ref AWS::StackName

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-Private-RT
        - Key: Project
          Value: !Ref AWS::StackName

  PrivateSubnetRouteTableAssociation1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetRouteTableAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetRouteTableAssociation3:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet3
      RouteTableId: !Ref PrivateRouteTable

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref VPCSubnet1
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-Public-Subnet-1
        - Key: Project
          Value: !Ref AWS::StackName

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref VPCSubnet2
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-Public-Subnet-2
        - Key: Project
          Value: !Ref AWS::StackName

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-IGW
        - Key: Project
          Value: !Ref AWS::StackName

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-Public-RT
        - Key: Project
          Value: !Ref AWS::StackName

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: !Ref MyIP
      # Route restricted to user's IP for bastion host access
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetRouteTableAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  NATGatewayEIP:
    Type: AWS::EC2::EIP
    DependsOn: AttachGateway
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-NAT-EIP
        - Key: Project
          Value: !Ref AWS::StackName

  NATGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NATGatewayEIP.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-NAT-Gateway
        - Key: Project
          Value: !Ref AWS::StackName

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NATGateway

  BastionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for bastion host
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref MyIP
          Description: "SSH access from your IP"
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 1521
          ToPort: 1521
          CidrIp: !Ref VPCCIDRBlock
          Description: "Oracle access within VPC"
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: !Ref VPCCIDRBlock
          Description: "PostgreSQL access within VPC"
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VPCCIDRBlock
          Description: "HTTPS for SSM and updates within VPC"
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-Bastion-SG
        - Key: Project
          Value: !Ref AWS::StackName

  BastionKeyPair:
    Type: AWS::EC2::KeyPair
    Properties:
      KeyName: !Sub "${AWS::StackName}-bastion-keypair"
      KeyType: rsa
      KeyFormat: pem
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-bastion-keypair"
        - Key: Project
          Value: !Ref AWS::StackName

  BastionHost:
    Type: AWS::EC2::Instance
    Properties:
      #ImageId: ami-0c02fb55956c7d316
      ImageId: !Sub "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2}}"
      EbsOptimized: true
      InstanceType: t3.micro
      KeyName: !Ref BastionKeyPair
      SubnetId: !Ref PublicSubnet1
      SecurityGroupIds:
      - !Ref BastionSecurityGroup
      IamInstanceProfile: !Ref BastionInstanceProfile
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum update -y
          yum install -y postgresql mysql
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-Bastion-Host
        - Key: Project
          Value: !Ref AWS::StackName

  BastionEIP:
    Type: AWS::EC2::EIP
    DependsOn: AttachGateway
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-Bastion-EIP"
        - Key: Project
          Value: !Ref AWS::StackName

  BastionEIPAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt BastionEIP.AllocationId
      InstanceId: !Ref BastionHost

  BastionInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref BastionRole

  BastionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-Bastion-Role
        - Key: Project
          Value: !Ref AWS::StackName

  OracleRDSSecurity:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Oracle access
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: "1521"
          ToPort: "1521"
          SourceSecurityGroupId: !Ref BastionSecurityGroup
          Description: "Allow Oracle access from bastion host"
        - IpProtocol: tcp
          FromPort: "1521"
          ToPort: "1521"
          SourceSecurityGroupId: !Ref DMSSecurityGroup
          Description: "Allow inbound access from DMS Security group"
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-Oracle-SG
        - Key: Project
          Value: !Ref AWS::StackName

  AuroraSecurity:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Aurora PostgreSQL
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: "5432"
          ToPort: "5432"
          SourceSecurityGroupId: !Ref BastionSecurityGroup
          Description: "Allow PostgreSQL access from bastion host"
        - IpProtocol: tcp
          FromPort: "5432"
          ToPort: "5432"
          SourceSecurityGroupId: !Ref DMSSecurityGroup
          Description: "Allow inbound access from DMS Security group"
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-Aurora-SG
        - Key: Project
          Value: !Ref AWS::StackName

  MyDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnet group for RDS instances
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
        - !Ref PrivateSubnet3
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-DB-Subnet-Group
        - Key: Project
          Value: !Ref AWS::StackName

  OracleRDSInstance:
    Type: AWS::RDS::DBInstance
    Condition: DeployOracleRDSCondition
    DependsOn: OracleSecret
    Properties:
      DBName: ORCL
      Engine: !Ref OracleEdition
      MasterUsername: !Sub "{{resolve:secretsmanager:${OracleSecret}:SecretString:username}}"
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${OracleSecret}:SecretString:password}}"
      DBInstanceClass: !Ref OracleRDSDBInstanceClass
      AllocatedStorage: "20"
      StorageType: gp3
     # LicenseModel: bring-your-own-license
      LicenseModel: !If
        - OracleByolCondition
        - bring-your-own-license
        - license-included
      PubliclyAccessible: false
      MultiAZ: !Ref OracleMultiAZ
      DBSubnetGroupName: !Ref MyDBSubnetGroup
      VPCSecurityGroups:
        - !Ref OracleRDSSecurity
      #AvailabilityZone: !GetAtt PublicSubnet1.AvailabilityZone
      MonitoringInterval: 60
      MonitoringRoleArn: !GetAtt EnhancedMonitoringRole.Arn
      BackupRetentionPeriod: 7
      StorageEncrypted: true
      EnableCloudwatchLogsExports:
      - alert
      - audit
      - trace
      - listener
      AutoMinorVersionUpgrade: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-Oracle-RDS
        - Key: Project
          Value: !Ref AWS::StackName

  AuroraCluster:
    Type: AWS::RDS::DBCluster
    DependsOn: AuroraSecret
    Properties:
      DatabaseName: !Ref AuroraDBName
      Engine: aurora-postgresql
      Port: 5432
      MasterUsername: !Sub "{{resolve:secretsmanager:${AuroraSecret}:SecretString:username}}"
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${AuroraSecret}:SecretString:password}}"
      DBSubnetGroupName: !Ref MyDBSubnetGroup
      VpcSecurityGroupIds:
        - !Ref AuroraSecurity
      EnableIAMDatabaseAuthentication: true
      StorageEncrypted: true
      BackupRetentionPeriod: 7
      AutoMinorVersionUpgrade: true
      EnableCloudwatchLogsExports:
      - postgresql
      AvailabilityZones:
        - !GetAtt PublicSubnet1.AvailabilityZone
        - !GetAtt PublicSubnet2.AvailabilityZone
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-Aurora-Cluster
        - Key: Project
          Value: !Ref AWS::StackName

  AuroraInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: aurora-postgresql
      DBClusterIdentifier: !Ref AuroraCluster
      DBInstanceClass: !Ref AuroraDBInstanceClass
      PubliclyAccessible: false
      DBSubnetGroupName: !Ref MyDBSubnetGroup
      MonitoringInterval: 60
      StorageEncrypted: true
      MonitoringRoleArn: !GetAtt EnhancedMonitoringRole.Arn
      AutoMinorVersionUpgrade: true
      AvailabilityZone: !GetAtt PrivateSubnet1.AvailabilityZone
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-Aurora-Instance-1
        - Key: Project
          Value: !Ref AWS::StackName

  AuroraInstanceReplica:
    Type: AWS::RDS::DBInstance
    Condition: AuroraMultiAZCondition
    Properties:
      Engine: aurora-postgresql
      DBClusterIdentifier: !Ref AuroraCluster
      DBInstanceClass: !Ref AuroraDBInstanceClass
      PubliclyAccessible: false
      DBSubnetGroupName: !Ref MyDBSubnetGroup
      MonitoringInterval: 60
      StorageEncrypted: true
      MonitoringRoleArn: !GetAtt EnhancedMonitoringRole.Arn
      AutoMinorVersionUpgrade: true
      AvailabilityZone: !GetAtt PrivateSubnet2.AvailabilityZone
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-Aurora-Instance-2
        - Key: Project
          Value: !Ref AWS::StackName

  EnhancedMonitoringRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: monitoring.rds.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonRDSEnhancedMonitoringRole
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-Enhanced-Monitoring-Role
        - Key: Project
          Value: !Ref AWS::StackName

  DMSVPCRole:
    Type: AWS::IAM::Role
    Condition: DMSVPCRoleExistsCondition
    Properties:
      RoleName: dms-vpc-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: dms.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonDMSVPCManagementRole

  DMSSecretsManagerPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${AWS::StackName}-DMS-Secrets-Policy"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:DescribeSecret
            Resource:
              - !If
                - DeployOracleRDSCondition
                - !Ref OracleSecret
                - !Ref OracleExistingSecret
              - !Ref AuroraSecret
          - Effect: Allow
            Action:
              - kms:Decrypt
              - kms:DescribeKey
            Resource: !GetAtt SecretsKMSKey.Arn

  DMSSecretsManagerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: !Sub dms.${AWS::Region}.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref DMSSecretsManagerPolicy
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-DMS-Secrets-Role
        - Key: Project
          Value: !Ref AWS::StackName

  SecretsKMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub "KMS key for ${AWS::StackName} Secrets Manager encryption"
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action:
              - kms:CreateAlias
              - kms:DeleteAlias
              - kms:Decrypt
              - kms:Encrypt
              - kms:GenerateDataKey
              - kms:ReEncrypt
              - kms:ReEncryptTo
              - kms:ReEncryptFrom
              - kms:CreateGrant
              - kms:DescribeKey
              - kms:EnableKeyRotation
              - kms:ListAliases
              - kms:ListGrants
              - kms:ListKeyPolicies
              - kms:ListKeys
              - kms:PutKeyPolicy
              - kms:UpdateAlias
              - kms:UpdateKeyDescription
              - kms:RevokeGrant
              - kms:DisableKeyRotation
              - kms:GetKeyPolicy
              - kms:GetKeyRotationStatus
              - kms:ScheduleKeyDeletion
              - kms:CancelKeyDeletion
              - kms:TagResource
              - kms:UntagResource
            Resource: "*"
          - Sid: Allow Secrets Manager Service
            Effect: Allow
            Principal:
              Service: secretsmanager.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:DescribeKey
              - kms:GenerateDataKey
              - kms:CreateGrant
            Resource: "*"
            Condition:
              StringEquals:
                "kms:CallerAccount": !Ref "AWS::AccountId"
                "kms:ViaService": !Sub "secretsmanager.${AWS::Region}.amazonaws.com"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-secrets-kms-key"
        - Key: Project
          Value: !Ref AWS::StackName

  SecretsKMSKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${AWS::StackName}-secrets-key"
      TargetKeyId: !Ref SecretsKMSKey

  OracleSecret:
    Type: AWS::SecretsManager::Secret
    Condition: DeployOracleRDSCondition
    Properties:
      Name: !Sub "${AWS::StackName}-oracle-secret"
      KmsKeyId: !Ref SecretsKMSKey
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username":"${OracleDBUsername}"}'
        GenerateStringKey: "password"
        PasswordLength: 28
        ExcludePunctuation: true
        RequireEachIncludedType: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-oracle-secret"
        - Key: Project
          Value: !Ref AWS::StackName

  OracleExistingSecret:
    Type: AWS::SecretsManager::Secret
    Condition: UseExistingOracleCondition
    Properties:
      Name: !Sub "${AWS::StackName}-oracle-secret"
      KmsKeyId: !Ref SecretsKMSKey
      SecretString: !Sub '{"username":"${ExistingOracleUsername}","password":"${ExistingOraclePassword}","host":"${ExistingOracleHost}","port":${ExistingOraclePort},"dbname":"${ExistingOracleSID}"}'
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-oracle-secret"
        - Key: Project
          Value: !Ref AWS::StackName

  OracleSecretTargetAttachment:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Condition: DeployOracleRDSCondition
    Properties:
      SecretId: !Ref OracleSecret
      TargetId: !Ref OracleRDSInstance
      TargetType: AWS::RDS::DBInstance

  AuroraSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AWS::StackName}-aurora-secret"
      KmsKeyId: !Ref SecretsKMSKey
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username":"${AuroraDBUsername}"}'
        GenerateStringKey: "password"
        PasswordLength: 28
        ExcludePunctuation: true
        RequireEachIncludedType: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-aurora-secret"
        - Key: Project
          Value: !Ref AWS::StackName

  AuroraSecretTargetAttachment:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Properties:
      SecretId: !Ref AuroraSecret
      TargetId: !Ref AuroraCluster
      TargetType: AWS::RDS::DBCluster

  ReplicationSubnetGroup:
    Type: AWS::DMS::ReplicationSubnetGroup
    Properties:
      ReplicationSubnetGroupIdentifier: !Sub ${AWS::StackName}-subnet-group
      ReplicationSubnetGroupDescription: DMS subnet group
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
        - !Ref PrivateSubnet3
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-DMS-Subnet-Group
        - Key: Project
          Value: !Ref AWS::StackName

  DMSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for DMS Replication Instance
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 1521
          ToPort: 1521
          CidrIp: !Ref VPCCIDRBlock
          Description: "Allow Oracle database access from VPC"
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: !Ref VPCCIDRBlock
          Description: "Allow PostgreSQL database access from VPC"
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VPCCIDRBlock
          Description: "Allow HTTPS from VPC for AWS service endpoints"
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 1521
          ToPort: 1521
          CidrIp: !Ref VPCCIDRBlock
          Description: "Oracle access within VPC"
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: !Ref VPCCIDRBlock
          Description: "PostgreSQL access within VPC"
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VPCCIDRBlock
          Description: "HTTPS for SSM and updates within VPC"
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-DMS-SG
        - Key: Project
          Value: !Ref AWS::StackName

  ReplicationInstance:
    Type: AWS::DMS::ReplicationInstance
    DependsOn:
      - ReplicationSubnetGroup
      - AuroraSecurity
      - DMSSecurityGroup
    Properties:
      ReplicationInstanceClass: !Ref DMSInstanceClass
      AllocatedStorage: 500
      ReplicationInstanceIdentifier: !Ref AWS::StackName
      ReplicationSubnetGroupIdentifier: !Ref ReplicationSubnetGroup
      PubliclyAccessible: false
      VpcSecurityGroupIds:
        - !Ref DMSSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-DMS-Instance
        - Key: Project
          Value: !Ref AWS::StackName

  S3VPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
              - s3:ListBucket
              - s3:GetBucketLocation
              - s3:ListBucketMultipartUploads
              - s3:AbortMultipartUpload
              - s3:ListMultipartUploadParts
            Resource:
              - !Sub "arn:aws:s3:::${DMSSCTBucket}"
              - !Sub "arn:aws:s3:::${DMSSCTBucket}/*"
              - !Sub "arn:aws:s3:::${AWS::StackName}-glue-data-*"
              - !Sub "arn:aws:s3:::${AWS::StackName}-glue-data-*/*"
              - !Sub "arn:aws:s3:::*aws-glue-*/*"
              - !Sub "arn:aws:s3:::*aws-glue-*"
      RouteTableIds:
        - !Ref PrivateRouteTable
        - !Ref PublicRouteTable
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-S3-Endpoint
        - Key: Project
          Value: !Ref AWS::StackName

  # VPC Endpoints for AWS Glue
  GlueEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for AWS service VPC endpoints (AWS Glue, Amazon CloudWatch Logs, AWS Security Token Service)
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VPCCIDRBlock
          Description: "Allow HTTPS from VPC for AWS services"
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 1521
          ToPort: 1521
          CidrIp: !Ref VPCCIDRBlock
          Description: "Oracle access within VPC"
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: !Ref VPCCIDRBlock
          Description: "PostgreSQL access within VPC"
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VPCCIDRBlock
          Description: "HTTPS for SSM and updates within VPC"
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-Glue-Endpoint-SG
        - Key: Project
          Value: !Ref AWS::StackName

  GlueVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.glue'
      VpcId: !Ref VPC
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
        - !Ref PrivateSubnet3
      SecurityGroupIds:
        - !Ref GlueEndpointSecurityGroup
        - !Ref DMSSecurityGroup
      PrivateDnsEnabled: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-Glue-Endpoint
        - Key: Project
          Value: !Ref AWS::StackName

  LogsVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.logs'
      VpcId: !Ref VPC
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
        - !Ref PrivateSubnet3
      SecurityGroupIds:
        - !Ref GlueEndpointSecurityGroup
        - !Ref DMSSecurityGroup
      PrivateDnsEnabled: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-Logs-Endpoint
        - Key: Project
          Value: !Ref AWS::StackName

  STSVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.sts'
      VpcId: !Ref VPC
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
        - !Ref PrivateSubnet3
      SecurityGroupIds:
        - !Ref GlueEndpointSecurityGroup
        - !Ref DMSSecurityGroup
      PrivateDnsEnabled: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-STS-Endpoint
        - Key: Project
          Value: !Ref AWS::StackName

  SecretsManagerVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.secretsmanager'
      VpcId: !Ref VPC
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
        - !Ref PrivateSubnet3
      SecurityGroupIds:
        - !Ref GlueEndpointSecurityGroup
        - !Ref DMSSecurityGroup
      PrivateDnsEnabled: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-SecretsManager-Endpoint
        - Key: Project
          Value: !Ref AWS::StackName

  SourceEndpoint:
    Type: AWS::DMS::Endpoint
    DependsOn: ReplicationInstance
    Properties:
      EndpointIdentifier: !Sub "${AWS::StackName}-oracle-source"
      EndpointType: source
      EngineName: oracle
      DatabaseName: !If
        - DeployOracleRDSCondition
        - ORCL
        - !Ref ExistingOracleSID
      OracleSettings:
        SecretsManagerSecretId: !If
          - DeployOracleRDSCondition
          - !Ref OracleSecret
          - !Ref OracleExistingSecret
        SecretsManagerAccessRoleArn: !GetAtt DMSSecretsManagerRole.Arn
      ExtraConnectionAttributes: "addSupplementalLogging=Y;archivedLogDestId=1"
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-Source-Endpoint
        - Key: Project
          Value: !Ref AWS::StackName

  TargetEndpoint:
    Type: AWS::DMS::Endpoint
    DependsOn:
      - AuroraInstance
      - ReplicationInstance
    Properties:
      EndpointIdentifier: !Sub "${AWS::StackName}-aurora-target"
      EndpointType: target
      EngineName: aurora-postgresql
      DatabaseName: !Ref AuroraDBName
      SslMode: require
      PostgreSqlSettings:
        SecretsManagerSecretId: !Ref AuroraSecret
        SecretsManagerAccessRoleArn: !GetAtt DMSSecretsManagerRole.Arn
      ExtraConnectionAttributes: >-
        afterConnectScript=SET session_replication_role = replica;
        captureDdls=Y;
        heartbeatEnable=Y;
        heartbeatFrequency=1;
        heartbeatSchema=dms_heartbeat;
        maxFileSize=32768
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-Target-Endpoint
        - Key: Project
          Value: !Ref AWS::StackName

  DMSSchemaConversionInstanceProfile:
    Type: AWS::DMS::InstanceProfile
    DependsOn: ReplicationSubnetGroup
    Properties:
      InstanceProfileName: !Sub "${AWS::StackName}-sc-profile"
      InstanceProfileIdentifier: !Sub "${AWS::StackName}-sc-profile"
      NetworkType: IPV4
      SubnetGroupIdentifier: !Ref ReplicationSubnetGroup
      VpcSecurityGroups:
        - !Ref AuroraSecurity
        - !Ref OracleRDSSecurity
        - !Ref DMSSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-SC-Profile
        - Key: Project
          Value: !Ref AWS::StackName

  SourceDataProvider:
    Type: AWS::DMS::DataProvider
    Properties:
      DataProviderName: !Sub "${AWS::StackName}-oracle-provider"
      DataProviderIdentifier: !Sub "${AWS::StackName}-oracle-provider"
      Description: "Oracle source data provider"
      Engine: oracle
      Settings:
        OracleSettings:
          ServerName: !If
            - DeployOracleRDSCondition
            - !GetAtt OracleRDSInstance.Endpoint.Address
            - !Ref ExistingOracleHost
          Port: !If
            - DeployOracleRDSCondition
            - 1521
            - !Ref ExistingOraclePort
          DatabaseName: !If
            - DeployOracleRDSCondition
            - ORCL
            - !Ref ExistingOracleSID
          SslMode: none
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-Oracle-Provider
        - Key: Project
          Value: !Ref AWS::StackName

  TargetDataProvider:
    Type: AWS::DMS::DataProvider
    Properties:
      DataProviderName: !Sub "${AWS::StackName}-aurora-provider"
      DataProviderIdentifier: !Sub "${AWS::StackName}-aurora-provider"
      Description: "Aurora PostgreSQL target data provider"
      Engine: aurora_postgresql
      Settings:
        PostgreSqlSettings:
          ServerName: !GetAtt AuroraCluster.Endpoint.Address
          Port: 5432
          DatabaseName: !Ref AuroraDBName
          SslMode: require
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-Aurora-Provider
        - Key: Project
          Value: !Ref AWS::StackName

Outputs:
  # VPC Outputs
  VPCId:
    Description: VPC ID
    Value: !Ref VPC
    Export:
      Name: !Sub ${AWS::StackName}-VPC-ID

  VPCCIDRBlock:
    Description: VPC CIDR Block
    Value: !Ref VPCCIDRBlock
    Export:
      Name: !Sub ${AWS::StackName}-VPC-CIDR

  # Public Subnet Outputs
  PublicSubnet1ID:
    Description: Public Subnet 1 ID
    Value: !Ref PublicSubnet1
    Export:
      Name: !Sub ${AWS::StackName}-PublicSubnet1ID

  PublicSubnet2ID:
    Description: Public Subnet 2 ID
    Value: !Ref PublicSubnet2
    Export:
      Name: !Sub ${AWS::StackName}-PublicSubnet2ID

  # Private Subnet Outputs (Required for AWS Glue)
  PrivateSubnet1ID:
    Description: Private Subnet 1 ID for AWS Glue deployment
    Value: !Ref PrivateSubnet1
    Export:
      Name: !Sub ${AWS::StackName}-PrivateSubnet1ID

  PrivateSubnet2ID:
    Description: Private Subnet 2 ID for AWS Glue deployment
    Value: !Ref PrivateSubnet2
    Export:
      Name: !Sub ${AWS::StackName}-PrivateSubnet2ID

  PrivateSubnet1AZ:
    Description: Availability Zone of Private Subnet 1
    Value: !GetAtt PrivateSubnet1.AvailabilityZone
    Export:
      Name: !Sub ${AWS::StackName}-PrivateSubnet1AZ

  PrivateSubnet2AZ:
    Description: Availability Zone of Private Subnet 2
    Value: !GetAtt PrivateSubnet2.AvailabilityZone
    Export:
      Name: !Sub ${AWS::StackName}-PrivateSubnet2AZ

  PrivateSubnet3ID:
    Description: Private Subnet 3 ID for additional AZ coverage
    Value: !Ref PrivateSubnet3
    Export:
      Name: !Sub ${AWS::StackName}-PrivateSubnet3ID

  PrivateSubnet3AZ:
    Description: Availability Zone of Private Subnet 3
    Value: !GetAtt PrivateSubnet3.AvailabilityZone
    Export:
      Name: !Sub ${AWS::StackName}-PrivateSubnet3AZ

  # S3 Outputs
  S3BucketName:
    Description: "Name of the S3 bucket for DMS/SCT reports"
    Value: !Ref DMSSCTBucket
    Export:
      Name: !Sub "${AWS::StackName}-s3-bucket-name"

  S3BucketARN:
    Description: "ARN of the S3 bucket"
    Value: !GetAtt DMSSCTBucket.Arn
    Export:
      Name: !Sub "${AWS::StackName}-s3-bucket-arn"

  S3AccessLogsBucketName:
    Description: "Name of the S3 access logs bucket"
    Value: !Ref DMSSCTAccessLogsBucket
    Export:
      Name: !Sub "${AWS::StackName}-s3-access-logs-bucket-name"

  # Oracle Database Outputs
  OracleEndpoint:
    Condition: DeployOracleRDSCondition
    Description: Oracle RDS Endpoint
    Value: !GetAtt OracleRDSInstance.Endpoint.Address
    Export:
      Name: !Sub ${AWS::StackName}-Oracle-Endpoint

  OraclePort:
    Condition: DeployOracleRDSCondition
    Description: Oracle RDS Port
    Value: 1521
    Export:
      Name: !Sub ${AWS::StackName}-Oracle-Port

  OracleSecretARN:
    Description: Oracle Secret ARN in Secrets Manager
    Value: !If
      - DeployOracleRDSCondition
      - !Ref OracleSecret
      - !Ref OracleExistingSecret
    Export:
      Name: !Sub ${AWS::StackName}-Oracle-Secret-ARN

  # Aurora Database Outputs
  AuroraEndpoint:
    Description: Aurora Cluster Endpoint
    Value: !GetAtt AuroraCluster.Endpoint.Address
    Export:
      Name: !Sub ${AWS::StackName}-Aurora-Endpoint

  AuroraPort:
    Description: Aurora Cluster Port
    Value: 5432
    Export:
      Name: !Sub ${AWS::StackName}-Aurora-Port

  AuroraSecretARN:
    Description: Aurora Secret ARN in Secrets Manager
    Value: !Ref AuroraSecret
    Export:
      Name: !Sub ${AWS::StackName}-Aurora-Secret-ARN

  AuroraSecurityGroupID:
    Description: Aurora Security Group ID
    Value: !Ref AuroraSecurity
    Export:
      Name: !Sub ${AWS::StackName}-AuroraSecurityGroupID

  AuroraClusterUserName:
    Description: Aurora Cluster Admin Username
    Value: !Ref AuroraDBUsername
    Export:
      Name: !Sub ${AWS::StackName}-AuroraClusterUserName

  AuroraSubnetAZ:
    Description: "Aurora PostgreSQL Availability Zone"
    Value: !GetAtt PublicSubnet1.AvailabilityZone
    Export:
      Name: !Sub "${AWS::StackName}-AuroraSubnetAZ1"

  AuroraSubnetID:
    Description: Aurora Subnet ID (Public Subnet 1)
    Value: !Ref PublicSubnet1
    Export:
      Name: !Sub ${AWS::StackName}-AuroraSubnetID

  AuroraJDBCConnectionString:
    Description: Aurora Cluster JDBC Connection String
    Value: !Sub "jdbc:postgresql://${AuroraCluster.Endpoint.Address}:5432/${AuroraDBName}"
    Export:
      Name: !Sub ${AWS::StackName}-AuroraJDBCConnectionString

  AuroraDBName:
    Description: Aurora Database Name
    Value: !Ref AuroraDBName
    Export:
      Name: !Sub ${AWS::StackName}-AuroraDBName

  # DMS Outputs
  DMSReplicationInstanceARN:
    Description: DMS Replication Instance ARN
    Value: !Ref ReplicationInstance
    Export:
      Name: !Sub ${AWS::StackName}-DMS-Instance-ARN

  SourceEndpointArn:
    Description: Source Endpoint ARN
    Value: !Ref SourceEndpoint
    Export:
      Name: !Sub ${AWS::StackName}-Source-Endpoint-ARN

  TargetEndpointArn:
    Description: Target Endpoint ARN
    Value: !Ref TargetEndpoint
    Export:
      Name: !Sub ${AWS::StackName}-Target-Endpoint-ARN

  DMSSecurityGroupID:
    Description: DMS Security Group ID
    Value: !Ref DMSSecurityGroup
    Export:
      Name: !Sub ${AWS::StackName}-DMS-SecurityGroup-ID

  # Bastion Host Outputs
  BastionKeyPairParameterPath:
    Description: "Parameter Store path for bastion private key"
    Value: !Sub "/ec2/keypair/${BastionKeyPair.KeyPairId}"
    Export:
      Name: !Sub "${AWS::StackName}-bastion-key-parameter"

  BastionHostPublicDNS:
    Description: "Bastion Host Public DNS Name"
    Value: !GetAtt BastionHost.PublicDnsName
    Export:
      Name: !Sub "${AWS::StackName}-bastion-public-dns"

  BastionHostPublicIP:
    Description: "Bastion Host Public IP Address"
    Value: !Ref BastionEIP
    Export:
      Name: !Sub "${AWS::StackName}-bastion-public-ip"

  BastionSecurityGroupID:
    Description: Bastion Host Security Group ID
    Value: !Ref BastionSecurityGroup
    Export:
      Name: !Sub ${AWS::StackName}-Bastion-SG-ID

  # SSH Tunnel Commands
  SSHTunnelCommands:
    Condition: DeployOracleRDSCondition
    Description: "SSH tunnel commands for database access"
    Value: !Sub |
      Oracle: ssh -i ${BastionKeyPair}.pem -L 1521:${OracleRDSInstance.Endpoint.Address}:1521 ec2-user@${BastionEIP}
      Aurora: ssh -i ${BastionKeyPair}.pem -L 5432:${AuroraCluster.Endpoint.Address}:5432 ec2-user@${BastionEIP}

  # VPC Endpoint Outputs
  S3VPCEndpointId:
    Description: ID of the S3 VPC Endpoint
    Value: !Ref S3VPCEndpoint
    Export:
      Name: !Sub ${AWS::StackName}-S3VPCEndpoint

  GlueVPCEndpointId:
    Description: ID of the AWS Glue VPC Endpoint
    Value: !Ref GlueVPCEndpoint
    Export:
      Name: !Sub ${AWS::StackName}-GlueVPCEndpoint

  LogsVPCEndpointId:
    Description: ID of the CloudWatch Logs VPC Endpoint
    Value: !Ref LogsVPCEndpoint
    Export:
      Name: !Sub ${AWS::StackName}-LogsVPCEndpoint

  STSVPCEndpointId:
    Description: ID of the STS VPC Endpoint
    Value: !Ref STSVPCEndpoint
    Export:
      Name: !Sub ${AWS::StackName}-STSVPCEndpoint

  SecretsManagerVPCEndpointId:
    Description: ID of the Secrets Manager VPC Endpoint
    Value: !Ref SecretsManagerVPCEndpoint
    Export:
      Name: !Sub ${AWS::StackName}-SecretsManagerVPCEndpoint

  GlueEndpointSecurityGroupID:
    Description: Security Group ID for AWS service endpoints
    Value: !Ref GlueEndpointSecurityGroup
    Export:
      Name: !Sub ${AWS::StackName}-GlueEndpoint-SG-ID

  # KMS Key Outputs
  SecretsKMSKeyId:
    Description: KMS Key ID for Secrets Manager
    Value: !Ref SecretsKMSKey
    Export:
      Name: !Sub ${AWS::StackName}-Secrets-KMS-Key-ID

  SecretsKMSKeyArn:
    Description: KMS Key ARN for Secrets Manager
    Value: !GetAtt SecretsKMSKey.Arn
    Export:
      Name: !Sub ${AWS::StackName}-Secrets-KMS-Key-ARN

  # NAT Gateway Output
  NATGatewayId:
    Description: NAT Gateway ID
    Value: !Ref NATGateway
    Export:
      Name: !Sub ${AWS::StackName}-NAT-Gateway-ID

  NATGatewayEIP:
    Description: NAT Gateway Elastic IP
    Value: !Ref NATGatewayEIP
    Export:
      Name: !Sub ${AWS::StackName}-NAT-Gateway-EIP