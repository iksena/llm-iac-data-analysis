AWSTemplateFormatVersion: "2010-09-09"
Description: "CloudFormation template for SageMaker project template IAM roles"
Parameters:
  CreateExecutionRole:
    Type: String
    AllowedValues: ["YES", "NO"]
    Default: "YES"
  CreateLaunchRole:
    Type: String
    AllowedValues: ["YES", "NO"]
    Default: "NO"
  CreateUseRole:
    Type: String
    AllowedValues: ["YES", "NO"]
    Default: "NO"
  CreateCloudFormationRole:
    Type: String
    AllowedValues: ["YES", "NO"]
    Default: "YES"
  CreateCodeBuildRole:
    Type: String
    AllowedValues: ["YES", "NO"]
    Default: "YES"
  CreateCodePipelineRole:
    Type: String
    AllowedValues: ["YES", "NO"]
    Default: "YES"
  CreateEventsRole:
    Type: String
    AllowedValues: ["YES", "NO"]
    Default: "YES"
  CreateAPIGatewayRole:
    Type: String
    AllowedValues: ["YES", "NO"]
    Default: "YES"
  CreateFirehoseRole:
    Type: String
    AllowedValues: ["YES", "NO"]
    Default: "YES"
  CreateGlueRole:
    Type: String
    AllowedValues: ["YES", "NO"]
    Default: "YES"
  CreateLambdaRole:
    Type: String
    AllowedValues: ["YES", "NO"]
    Default: "YES"
Conditions:
  ShouldCreateExecutionRole: !Equals [!Ref CreateExecutionRole, "YES"]
  ShouldCreateLaunchRole: !Equals [!Ref CreateLaunchRole, "YES"]
  ShouldCreateUseRole: !Equals [!Ref CreateUseRole, "YES"]
  ShouldCreateCloudFormationRole: !Equals [!Ref CreateCloudFormationRole, "YES"]
  ShouldCreateCodeBuildRole: !Equals [!Ref CreateCodeBuildRole, "YES"]
  ShouldCreateCodePipelineRole: !Equals [!Ref CreateCodePipelineRole, "YES"]
  ShouldCreateEventsRole: !Equals [!Ref CreateEventsRole, "YES"]
  ShouldCreateAPIGatewayRole: !Equals [!Ref CreateAPIGatewayRole, "YES"]
  ShouldCreateFirehoseRole: !Equals [!Ref CreateFirehoseRole, "YES"]
  ShouldCreateGlueRole: !Equals [!Ref CreateGlueRole, "YES"]
  ShouldCreateLambdaRole: !Equals [!Ref CreateLambdaRole, "YES"]
Resources:
  SageMakerExecutionRole:
    Condition: ShouldCreateExecutionRole
    Type: AWS::IAM::Role
    Properties:
      RoleName: AmazonSageMakerServiceCatalogProductsExecutionRole
      Path: "/service-role/"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: [sagemaker.amazonaws.com, servicecatalog.amazonaws.com]
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSageMakerFullAccess
  SageMakerLaunchRole:
    Condition: ShouldCreateLaunchRole
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RoleName: AmazonSageMakerServiceCatalogProductsLaunchRole
      Path: "/service-role/"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: [sagemaker.amazonaws.com, servicecatalog.amazonaws.com]
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSageMakerAdmin-ServiceCatalogProductsServiceRolePolicy
  SageMakerUseRole:
    Condition: ShouldCreateUseRole
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RoleName: AmazonSageMakerServiceCatalogProductsUseRole
      Path: "/service-role/"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: [sagemaker.amazonaws.com, servicecatalog.amazonaws.com]
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEC2ReadOnlyAccess
      Policies:
        - PolicyName: SageMakerUseRoleInlinePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: SageMakerPermissions
                Effect: Allow
                Action:
                  - sagemaker:ListActions
                  - sagemaker:ListApps
                  - sagemaker:ListArtifacts
                  - sagemaker:ListAssociations
