AWSTemplateFormatVersion: "2010-09-09"
Description: |
  This S3 bucket will store CloudFormation templates
Parameters:
  CloudformationBucketName:
    Type: String
    Default: cloudformation-templates

  IAMRoleARN:
    Type: String
    Description: Github OIDC Integration Role ARN

Resources:
  CloudformationBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref CloudformationBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  CloudformationBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CloudformationBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Action:
              - 's3:GetObject'
            Effect: 'Allow'
            Resource: !Sub "${CloudformationBucket.Arn}/*"
            Principal:
              AWS: !Ref IAMRoleARN