AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Baseline IAM groups, roles, instance profiles, and managed policies for common
  operational personas: System Administrator, IAM Administrator, Instance Operations,
  Read-Only Administrator, and Read-Only Billing.
Resources:
  PolicySystemAdmin:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: SystemAdministratorPolicy
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: '*'
            Resource: '*'
            Condition:
              Bool:
                aws:MultiFactorAuthPresent: 'true'
          - Effect: Deny
            Action:
              - iam:*
              - organizations:*
            Resource: '*'
          - Effect: Deny
            Action:
              - aws-portal:*
              - awsbillingconsole:*
            Resource: '*'
          - Effect: Deny
            Action:
              - kms:DisableKey
              - kms:ScheduleKeyDeletion
              - kms:DeleteAlias
              - kms:PutKeyPolicy
              - kms:RevokeGrant
              - kms:CreateGrant
              - kms:DisableKeyRotation
            Resource: '*'
            Condition:
              StringEquals:
                aws:ResourceTag/Purpose: Logging

  PolicyIAMAdmin:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: IAMAdministratorPolicy
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: iam:*
            Resource: '*'
            Condition:
              Bool:
                aws:MultiFactorAuthPresent: 'true'
          - Effect: Deny
            Action:
              - aws-portal:*
              - awsbillingconsole:*
            Resource: '*'
          - Effect: Deny
            Action:
              - kms:DisableKey
              - kms:ScheduleKeyDeletion
              - kms:DeleteAlias
              - kms:PutKeyPolicy
              - kms:RevokeGrant
              - kms:CreateGrant
              - kms:DisableKeyRotation
            Resource: '*'
            Condition:
              StringEquals:
                aws:ResourceTag/Purpose: Logging

  PolicyInstanceOperations:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: InstanceOperationsPolicy
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - ec2:*
              - elasticloadbalancing:*
              - cloudwatch:*
              - autoscaling:*
            Resource: '*'
            Condition:
              Bool:
                aws:MultiFactorAuthPresent: 'true'
          - Effect: Deny
            Action:
              - ec2:CreateVpc
              - ec2:DeleteVpc
              - ec2:ModifyVpcAttribute
              - ec2:CreateSubnet
              - ec2:DeleteSubnet
              - ec2:ModifySubnetAttribute
              - ec2:CreateRouteTable
              - ec2:DeleteRouteTable
              - ec2:CreateRoute
              - ec2:DeleteRoute
              - ec2:CreateInternetGateway
              - ec2:DeleteInternetGateway
              - ec2:AttachInternetGateway
              - ec2:DetachInternetGateway
              - ec2:CreateNatGateway
              - ec2:DeleteNatGateway
              - ec2:CreateVpcPeeringConnection
              - ec2:DeleteVpcPeeringConnection
              - ec2:CreateVpnGateway
              - ec2:DeleteVpnGateway
              - ec2:CreateCustomerGateway
              - ec2:DeleteCustomerGateway
              - ec2:CreateVpnConnection
              - ec2:DeleteVpnConnection
            Resource: '*'
          - Effect: Deny
            Action:
              - aws-portal:*
              - awsbillingconsole:*
            Resource: '*'
          - Effect: Deny
            Action:
              - kms:DisableKey
              - kms:ScheduleKeyDeletion
              - kms:DeleteAlias
              - kms:PutKeyPolicy
              - kms:RevokeGrant
              - kms:CreateGrant
              - kms:DisableKeyRotation
            Resource: '*'
            Condition:
              StringEquals:
                aws:ResourceTag/Purpose: Logging

  PolicyReadOnlyAdmin:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: ReadOnlyAdministratorPolicy
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - ec2:Describe*
              - ec2:Get*
              - elasticloadbalancing:Describe*
              - cloudwatch:Describe*
              - cloudwatch:Get*
              - cloudwatch:List*
              - autoscaling:Describe*
              - s3:List*
              - s3:Get*
              - rds:Describe*
              - rds:List*
              - dynamodb:Describe*
              - dynamodb:Get*
              - dynamodb:List*
              - lambda:Get*
              - lambda:List*
              - kms:Describe*
              - kms:Get*
              - kms:List*
              - logs:Describe*
              - logs:Get*
              - logs:List*
              - cloudformation:Describe*
              - cloudformation:Get*
              - cloudformation:List*
              - iam:Get*
              - iam:List*
              - iam:Simulate*
            Resource: '*'
            Condition:
              Bool:
                aws:MultiFactorAuthPresent: 'true'
          - Effect: Deny
            Action:
              - aws-portal:*
              - awsbillingconsole:*
            Resource: '*'
          - Effect: Deny
            Action:
              - kms:DisableKey
              - kms:ScheduleKeyDeletion
              - kms:DeleteAlias
              - kms:PutKeyPolicy
              - kms:RevokeGrant
              - kms:CreateGrant
              - kms:DisableKeyRotation
            Resource: '*'
            Condition:
              StringEquals:
                aws:ResourceTag/Purpose: Logging

  PolicyBilling:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: BillingReadOnlyPolicy
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - aws-portal:View*
              - awsbillingconsole:View*
              - ce:Get*
              - ce:List*
              - budgets:View*
              - consolidatedbilling:Get*
              - consolidatedbilling:List*
            Resource: '*'

  GroupSystemAdministrators:
    Type: AWS::IAM::Group
    Properties:
      GroupName: SystemAdministrators
      ManagedPolicyArns:
        - !Ref PolicySystemAdmin

  GroupIAMAdministrators:
    Type: AWS::IAM::Group
    Properties:
      GroupName: IAMAdministrators
      ManagedPolicyArns:
        - !Ref PolicyIAMAdmin

  GroupInstanceOperations:
    Type: AWS::IAM::Group
    Properties:
      GroupName: InstanceOperations
      ManagedPolicyArns:
        - !Ref PolicyInstanceOperations

  GroupReadOnlyAdministrators:
    Type: AWS::IAM::Group
    Properties:
      GroupName: ReadOnlyAdministrators
      ManagedPolicyArns:
        - !Ref PolicyReadOnlyAdmin

  GroupReadOnlyBilling:
    Type: AWS::IAM::Group
    Properties:
      GroupName: ReadOnlyBilling
      ManagedPolicyArns:
        - !Ref PolicyBilling

  RoleSystemAdmin:
    Type: AWS::IAM::Role
    Properties:
      RoleName: SystemAdminRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref PolicySystemAdmin

  RoleIAMAdmin:
    Type: AWS::IAM::Role
    Properties:
      RoleName: IAMAdminRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: sts:AssumeRole
            Condition:
              Bool:
                aws:MultiFactorAuthPresent: 'true'
      ManagedPolicyArns:
        - !Ref PolicyIAMAdmin

  RoleInstanceOperations:
    Type: AWS::IAM::Role
    Properties:
      RoleName: InstanceOperationsRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref PolicyInstanceOperations

  RoleReadOnlyAdmin:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ReadOnlyAdminRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref PolicyReadOnlyAdmin

  RoleReadOnlyBilling:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ReadOnlyBillingRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: sts:AssumeRole
            Condition:
              Bool:
                aws:MultiFactorAuthPresent: 'true'
      ManagedPolicyArns:
        - !Ref PolicyBilling

  InstanceProfileSystemAdmin:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: SystemAdminInstanceProfile
      Roles:
        - !Ref RoleSystemAdmin

  InstanceProfileInstanceOperations:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: InstanceOperationsInstanceProfile
      Roles:
        - !Ref RoleInstanceOperations

  InstanceProfileReadOnlyAdmin:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: ReadOnlyAdminInstanceProfile
      Roles:
        - !Ref RoleReadOnlyAdmin

Outputs:
  GroupSystemAdministratorsId:
    Description: ID of the System Administrators group
    Value: !Ref GroupSystemAdministrators
  GroupIAMAdministratorsId:
    Description: ID of the IAM Administrators group
    Value: !Ref GroupIAMAdministrators
  GroupInstanceOperationsId:
    Description: ID of the Instance Operations group
    Value: !Ref GroupInstanceOperations
  GroupReadOnlyAdministratorsId:
    Description: ID of the Read-Only Administrators group
    Value: !Ref GroupReadOnlyAdministrators
  GroupReadOnlyBillingId:
    Description: ID of the Read-Only Billing group
    Value: !Ref GroupReadOnlyBilling