          import json
          import os
          import boto3
          import logging
          from datetime import datetime

          # Configure logging
          logger = logging.getLogger()
          logger.setLevel(getattr(logging, os.environ.get('LOG_LEVEL', 'WARN').upper(), logging.WARNING))

          def lambda_handler(event, context):
              """
              Lambda function to check if all batches in a campaign have completed processing
              """
              # Log identifying fields only, consistent with the rest of the system.
              logger.info(
                  f"Checking campaign status: campaignId={event.get('campaignId')} "
                  f"batchCount={len(event.get('batches', []))}"
              )

              campaign_id = event.get('campaignId')
              batch_table_name = event.get('batchTrackingTable')
              batches = event.get('batches', [])

              if not campaign_id or not batch_table_name:
                  logger.error("Missing required campaign ID or table name")
                  return {
                      'statusCode': 400,
                      'error': 'Missing required campaign ID or table name',
                      'allComplete': False
                  }

              dynamodb = boto3.resource('dynamodb')
              batch_table = dynamodb.Table(batch_table_name)

              try:
                  completed_batches = 0
                  total_batches = len(batches)

                  for batch in batches:
                      batch_id = batch.get('batchId')
                      if not batch_id:
                          continue

                      # Get batch status
                      batch_info = batch_table.get_item(Key={'BatchId': batch_id}).get('Item')
                      if batch_info:
                          status = batch_info.get('Status')
                          if status in ['COMPLETED', 'COMPLETED_WITH_ERRORS']:
                              completed_batches += 1

                  all_complete = completed_batches == total_batches

                  logger.info(f"Campaign {campaign_id}: {completed_batches}/{total_batches} batches completed")

                  return {
                      'statusCode': 200,
                      'campaignId': campaign_id,
                      'completedBatches': completed_batches,
                      'totalBatches': total_batches,
                      'allComplete': all_complete,
                      'progress': f"{(completed_batches * 100) // total_batches if total_batches > 0 else 0}%"
                  }

              except Exception as e:
                  logger.error(f"Error checking campaign batches: {str(e)}")
                  return {
                      'statusCode': 500,
                      'error': str(e),
                      'allComplete': False
                  }
