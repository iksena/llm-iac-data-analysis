          ReadonlyRootFilesystem: true
          LinuxParameters:
            Capabilities:
              Drop:
                - ALL
            Tmpfs:
              - ContainerPath: /tmp
                Size: 64
                MountOptions:
                  - noexec
                  - nosuid
          PortMappings:
            - ContainerPort: 8003
              Protocol: tcp
          Environment:
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: PORT
              Value: '8003'
            - Name: GRAPH_FILE
              Value: /data/graphmem/graph.json
          HealthCheck:
            Command: [CMD-SHELL, 'curl -sf http://localhost:8003/health || exit 1']
            Interval: 15
            Timeout: 3
            Retries: 3
            StartPeriod: 30
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref MCPGraphMemLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: fargate
          MountPoints:
            - SourceVolume: openclaw-state
              ContainerPath: /data
      Volumes:
        - Name: openclaw-state
          EFSVolumeConfiguration:
            FilesystemId: !Ref EfsId
            TransitEncryption: ENABLED
            AuthorizationConfig:
              AccessPointId: !Ref EfsAccessPointId
              IAM: ENABLED

  MCPGraphMemService:
    Type: AWS::ECS::Service
    Condition: GraphMemEnabled
    Properties:
      ServiceName: !Sub '${ProjectName}-mcp-graphmem'
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref MCPGraphMemTaskDefinition
      DesiredCount: 0
      LaunchType: FARGATE
      EnableExecuteCommand: false
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets:
            - !Ref PublicSubnet1Id
            - !Ref PublicSubnet2Id
          SecurityGroups:
            - !Ref MCPGraphMemSG
          AssignPublicIp: ENABLED
      ServiceRegistries:
        - RegistryArn: !GetAtt MCPGraphMemDiscoveryService.Arn
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true

  # ============================================================================
  # CodeBuild Project for Container Image Builds
  # ============================================================================
  CodeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-image-builder'
      Description: Builds ARM64 container images and pushes to ECR
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      EncryptionKey: !Ref InfraLogsKeyArn
      TimeoutInMinutes: 30
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: ARM_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux-aarch64-standard:3.0
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: AWS_ACCOUNT_ID
            Value: !Ref 'AWS::AccountId'
          - Name: AWS_DEFAULT_REGION
            Value: !Ref 'AWS::Region'
      Source:
        Type: S3
        Location: !Sub '${TemplateBucketName}/builds/placeholder.zip'
        BuildSpec: |
          version: 0.2
          phases:
            pre_build:
              commands:
                - echo "Default buildspec - overridden at start-build time"
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref CodeBuildLogGroup
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-image-builder'
        - Key: Environment
          Value: !Ref Environment

  CodeBuildLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/openclaw/${Environment}/codebuild'
      RetentionInDays: 365
      KmsKeyId: !Ref InfraLogsKeyArn

  CodeBuildServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-codebuild-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub '${ProjectName}-${Environment}-codebuild-policy'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ECRAuth
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: ECRPush
                Effect: Allow
                Action:
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:BatchCheckLayerAvailability
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                Resource:
                  - !GetAtt ECRRepository.Arn
                  - !GetAtt MCPKnowledgeECRRepository.Arn
                  - !GetAtt MCPOpsECRRepository.Arn
                  - !If
                    - GraphMemEnabled
                    - !GetAtt MCPGraphMemECRRepository.Arn
                    - !Ref AWS::NoValue
              - Sid: S3ReadSource
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:GetBucketLocation
                Resource:
                  - !Sub 'arn:aws:s3:::${TemplateBucketName}'
                  - !Sub 'arn:aws:s3:::${TemplateBucketName}/*'
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/openclaw/${Environment}/codebuild:*'
              - Sid: KMSDecrypt
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                  - kms:DescribeKey
                Resource:
                  - !Ref KnowledgeKeyArn
                  - !Ref InfraLogsKeyArn

Outputs:
  ECRRepositoryUri:
    Value: !GetAtt ECRRepository.RepositoryUri
  ECSClusterArn:
    Value: !GetAtt ECSCluster.Arn
  ECSClusterName:
    Value: !Ref ECSCluster
  ECSServiceName:
    Value: !GetAtt FargateService.Name
  TaskRoleArn:
    Value: !GetAtt TaskRole.Arn
  ALBDnsName:
    Value: !GetAtt ALB.DNSName
  ALBHostedZoneId:
    Value: !GetAtt ALB.CanonicalHostedZoneID
  ALBArn:
    Value: !Ref ALB
  GatewayTokenParameterName:
    Value: !Ref GatewayTokenParameter
  McporterServersParameterName:
    Value: !Ref McporterServersParameter
  CognitoUsernameParameterName:
    Value: !Ref CognitoUsernameParameter
  CognitoPasswordParameterName:
    Value: !Ref CognitoPasswordParameter
  MCPKnowledgeECRRepositoryUri:
    Value: !GetAtt MCPKnowledgeECRRepository.RepositoryUri
  MCPKnowledgeServiceName:
    Value: !GetAtt MCPKnowledgeService.Name
  MCPOpsECRRepositoryUri:
    Value: !GetAtt MCPOpsECRRepository.RepositoryUri
  MCPOpsServiceName:
    Value: !GetAtt MCPOpsService.Name
  CodeBuildProjectName:
    Value: !Ref CodeBuildProject
  MCPGraphMemECRRepositoryUri:
    Value: !If [GraphMemEnabled, !GetAtt MCPGraphMemECRRepository.RepositoryUri, '']
  MCPGraphMemServiceName:
    Value: !If [GraphMemEnabled, !GetAtt MCPGraphMemService.Name, '']
  GraphMemEnabled:
    Value: !If [GraphMemEnabled, 'true', 'false']