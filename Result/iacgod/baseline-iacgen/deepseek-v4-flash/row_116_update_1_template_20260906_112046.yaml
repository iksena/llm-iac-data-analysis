AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFormation template for CAPA IAM identities and policies for EKS clusters'

Parameters:
  EnvironmentName:
    Type: String
    Default: production
    Description: Environment name for resource tagging
  ControlPlaneRoleName:
    Type: String
    Default: CAPA-ControlPlane-Role
    Description: Name for the control plane IAM role
  NodesRoleName:
    Type: String
    Default: CAPA-Nodes-Role
    Description: Name for the nodes IAM role
  ControllersRoleName:
    Type: String
    Default: CAPA-Controllers-Role
    Description: Name for the controllers IAM role
  EKSControlPlaneRoleName:
    Type: String
    Default: CAPA-EKS-ControlPlane-Role
    Description: Name for the EKS control plane IAM role
  ReadOnlyPolicyName:
    Type: String
    Default: CAPA-EKS-ReadOnly-Policy
    Description: Name for the read-only EKS policy

Resources:
  # Customer Managed Policies
  InTreeCloudProviderPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub '${EnvironmentName}-in-tree-cloud-provider-policy'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - ec2:DescribeInstances
              - ec2:DescribeSecurityGroups
              - ec2:DescribeSubnets
              - ec2:DescribeVpcs
              - ec2:DescribeVolumes
              - ec2:AttachVolume
              - ec2:DetachVolume
              - ec2:CreateVolume
              - ec2:DeleteVolume
              - ec2:CreateTags
              - ec2:DeleteTags
              - autoscaling:DescribeAutoScalingGroups
              - autoscaling:DescribeAutoScalingInstances
              - autoscaling:SetDesiredCapacity
              - autoscaling:TerminateInstanceInAutoScalingGroup
              - autoscaling:UpdateAutoScalingGroup
              - elasticloadbalancing:DescribeLoadBalancers
              - elasticloadbalancing:RegisterInstancesWithLoadBalancer
              - elasticloadbalancing:DeregisterInstancesFromLoadBalancer
              - elasticloadbalancing:CreateLoadBalancer
              - elasticloadbalancing:DeleteLoadBalancer
              - elasticloadbalancing:DescribeTargetGroups
              - elasticloadbalancing:RegisterTargets
              - elasticloadbalancing:DeregisterTargets
              - elasticloadbalancing:CreateTargetGroup
              - elasticloadbalancing:DeleteTargetGroup
              - kms:Decrypt
              - kms:Encrypt
              - kms:GenerateDataKey
              - kms:DescribeKey
            Resource: '*'
      Roles:
        - !Ref ControlPlaneRole

  NodeRegistrationPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub '${EnvironmentName}-node-registration-policy'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - ec2:DescribeInstances
              - ec2:DescribeTags
              - ecr:GetAuthorizationToken
              - ecr:BatchCheckLayerAvailability
              - ecr:GetDownloadUrlForLayer
              - ecr:GetRepositoryPolicy
              - ecr:DescribeRepositories
              - ecr:ListImages
              - ecr:BatchGetImage
              - secretsmanager:GetSecretValue
              - ssm:GetParameter
              - ssm:GetParameters
              - ssm:DescribeParameters
            Resource: '*'
      Roles:
        - !Ref ControlPlaneRole
        - !Ref NodesRole

  ClusterAPIControllerInfrastructurePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub '${EnvironmentName}-cluster-api-controller-infra-policy'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - ec2:*
              - autoscaling:*
              - elasticloadbalancing:*
              - ec2:CreateLaunchTemplate
              - ec2:CreateLaunchTemplateVersion
              - ec2:DeleteLaunchTemplate
              - ec2:DeleteLaunchTemplateVersions
              - ec2:DescribeLaunchTemplates
              - ec2:DescribeLaunchTemplateVersions
              - ec2:ModifyLaunchTemplate
              - iam:CreateServiceLinkedRole
              - iam:GetServiceLinkedRoleDeletionStatus
            Resource: '*'
      Roles:
        - !Ref ControllersRole
        - !Ref ControlPlaneRole

  EKSSpecificPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub '${EnvironmentName}-eks-specific-policy'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - eks:*
              - iam:PassRole
              - iam:GetRole
              - iam:CreateRole
              - iam:DeleteRole
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
              - iam:ListAttachedRolePolicies
              - iam:ListRolePolicies
              - iam:GetPolicy
              - iam:CreatePolicy
              - iam:DeletePolicy
              - kms:CreateKey
              - kms:DescribeKey
              - kms:ScheduleKeyDeletion
              - kms:ListKeys
              - kms:ListAliases
              - kms:CreateAlias
              - kms:DeleteAlias
            Resource: '*'
      Roles:
        - !Ref ControllersRole
        - !Ref ControlPlaneRole

  ReadOnlyEKSPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${EnvironmentName}-${ReadOnlyPolicyName}'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - eks:DescribeCluster
              - eks:ListClusters
              - eks:DescribeNodegroup
              - eks:ListNodegroups
              - eks:DescribeAddon
              - eks:ListAddons
              - eks:DescribeFargateProfile
              - eks:ListFargateProfiles
              - eks:ListUpdates
              - eks:DescribeUpdate
              - eks:AccessKubernetesApi
              - eks:ListIdentityProviderConfigs
              - eks:DescribeIdentityProviderConfig
              - eks:ListAssociatedAccessPolicies
              - eks:DescribeAccessEntry
              - eks:ListAccessEntries
              - eks:ListAccessPolicies
              - eks:DescribePodIdentityAssociation
              - eks:ListPodIdentityAssociations
              - eks:ListTagsForResource
              - eks:DescribeInsight
              - eks:ListInsights
              - eks:ListEksAnywhereSubscriptions
              - eks:DescribeEksAnywhereSubscription
              - iam:ListRoles
              - iam:GetRole
              - iam:ListInstanceProfiles
              - iam:GetInstanceProfile
              - ec2:DescribeInstances
              - ec2:DescribeSecurityGroups
              - ec2:DescribeSubnets
              - ec2:DescribeVpcs
              - ec2:DescribeVolumes
              - ec2:DescribeNetworkInterfaces
              - autoscaling:DescribeAutoScalingGroups
              - autoscaling:DescribeAutoScalingInstances
              - elasticloadbalancing:DescribeLoadBalancers
              - elasticloadbalancing:DescribeTargetGroups
              - kms:DescribeKey
              - kms:ListKeys
              - kms:ListAliases
            Resource: '*'
      Description: 'Read-only policy for EKS clusters, node groups, and workloads'

  # IAM Roles
  ControlPlaneRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref ControlPlaneRoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Service
          Value: CAPA

  NodesRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref NodesRoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Service
          Value: CAPA

  ControllersRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref ControllersRoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/oidc.eks.${AWS::Region}.amazonaws.com/id/*'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                oidc.eks.${AWS::Region}.amazonaws.com/id/*:sub: 'system:serviceaccount:cluster-api-provider-aws:*'
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Service
          Value: CAPA

  EKSControlPlaneRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref EKSControlPlaneRoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Service
          Value: CAPA

  # Instance Profiles
  ControlPlaneInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub '${ControlPlaneRoleName}-InstanceProfile'
      Roles:
        - !Ref ControlPlaneRole
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Service
          Value: CAPA

  NodesInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub '${NodesRoleName}-InstanceProfile'
      Roles:
        - !Ref NodesRole
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Service
          Value: CAPA

  ControllersInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub '${ControllersRoleName}-InstanceProfile'
      Roles:
        - !Ref ControllersRole
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Service
          Value: CAPA

Outputs:
  ControlPlaneRoleArn:
    Description: ARN of the control plane IAM role
    Value: !GetAtt ControlPlaneRole.Arn
  NodesRoleArn:
    Description: ARN of the nodes IAM role
    Value: !GetAtt NodesRole.Arn
  ControllersRoleArn:
    Description: ARN of the controllers IAM role
    Value: !GetAtt ControllersRole.Arn
  EKSControlPlaneRoleArn:
    Description: ARN of the EKS control plane IAM role
    Value: !GetAtt EKSControlPlaneRole.Arn
  ControlPlaneInstanceProfileName:
    Description: Name of the control plane instance profile
    Value: !Ref ControlPlaneInstanceProfile
  NodesInstanceProfileName:
    Description: Name of the nodes instance profile
    Value: !Ref NodesInstanceProfile
  ControllersInstanceProfileName:
    Description: Name of the controllers instance profile
    Value: !Ref ControllersInstanceProfile
  ReadOnlyPolicyArn:
    Description: ARN of the read-only EKS policy
    Value: !GetAtt ReadOnlyEKSPolicy.Arn