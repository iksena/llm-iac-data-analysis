AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Lab 7.5 — Reuses Lab 7.4's CMK; demonstrates IAM + key policy + grants

Resources:
  GrantTestRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      # Intentionally NO kms:* permissions — we'll grant via KMS grant
      Policies: []

  GrantTestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dva-lab-07-05-grant-test
      Runtime: python3.12
      Handler: handler.handler
      Role: !GetAtt GrantTestRole.Arn
      CodeUri: src/
      Timeout: 10
      Environment:
        Variables:
          KEY_ARN: !ImportValue dva-lab-07-04-key-arn

Outputs:
  FunctionName:
    Value: !Ref GrantTestFunction
  RoleArn:
    Value: !GetAtt GrantTestRole.Arn