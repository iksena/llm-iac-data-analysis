AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Real-time CloudWatch dashboard for Claude Code hybrid observability.
  Pulls from ClaudeCode/GenAI namespace via OTEL collector EMF metrics.
  Claude Code emits claude_code.* metric names (not gen_ai.*).
  Stack name: claude-code-dashboard-{OrgName}-{Environment}

Parameters:
  OrgName:
    Type: String
    Default: my-org
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, staging, prod]
  DashboardName:
    Type: String
    Default: ''
    Description: Override dashboard name (default auto-generated)

Conditions:
  UseDefaultName: !Equals [!Ref DashboardName, '']

Resources:
  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !If
        - UseDefaultName
        - !Sub 'ClaudeCode-${OrgName}-${Environment}'
        - !Ref DashboardName
      DashboardBody: !Sub |
        {
          "widgets": [
            {"type": "text", "x": 0, "y": 0, "width": 24, "height": 1,
             "properties": {"markdown": "# Claude Code Observability — ${OrgName} (${Environment})"}},

            {"type": "text", "x": 0, "y": 1, "width": 24, "height": 1,
             "properties": {"markdown": "## Token Usage (OTEL — Real-Time)"}},
            {"type": "metric", "x": 0, "y": 2, "width": 12, "height": 6,
             "properties": {"title": "Token Throughput (All Types, stacked)", "view": "timeSeries", "stacked": true, "region": "${AWS::Region}", "period": 300,
              "metrics": [
                ["ClaudeCode/GenAI", "claude_code.token.usage", "type", "cacheRead", "organization", "${OrgName}", {"stat": "Sum", "period": 300, "label": "Cache Read"}],
                ["ClaudeCode/GenAI", "claude_code.token.usage", "type", "cacheCreation", "organization", "${OrgName}", {"stat": "Sum", "period": 300, "label": "Cache Write"}],
                ["ClaudeCode/GenAI", "claude_code.token.usage", "type", "input", "organization", "${OrgName}", {"stat": "Sum", "period": 300, "label": "Input (uncached)"}],
                ["ClaudeCode/GenAI", "claude_code.token.usage", "type", "output", "organization", "${OrgName}", {"stat": "Sum", "period": 300, "label": "Output"}]]}},
            {"type": "metric", "x": 12, "y": 2, "width": 12, "height": 6,
             "properties": {"title": "Uncached Input vs Output", "view": "timeSeries", "stacked": false, "region": "${AWS::Region}", "period": 300,
              "metrics": [
                ["ClaudeCode/GenAI", "claude_code.token.usage", "type", "input", "organization", "${OrgName}", {"stat": "Sum", "period": 300, "label": "Input (uncached)"}],
                ["ClaudeCode/GenAI", "claude_code.token.usage", "type", "output", "organization", "${OrgName}", {"stat": "Sum", "period": 300, "label": "Output"}]]}},

            {"type": "text", "x": 0, "y": 8, "width": 24, "height": 1,
             "properties": {"markdown": "## Sessions & Cost"}},
            {"type": "metric", "x": 0, "y": 9, "width": 8, "height": 6,
             "properties": {"title": "Sessions", "view": "timeSeries", "stacked": false, "region": "${AWS::Region}", "period": 3600,
              "metrics": [["ClaudeCode/GenAI", "claude_code.session.count", "organization", "${OrgName}", {"stat": "Sum", "period": 3600, "label": "Sessions"}]]}},
            {"type": "metric", "x": 8, "y": 9, "width": 8, "height": 6,
             "properties": {"title": "Estimated Cost ($)", "view": "timeSeries", "stacked": false, "region": "${AWS::Region}", "period": 3600,
              "metrics": [["ClaudeCode/GenAI", "claude_code.cost.usage", "organization", "${OrgName}", {"stat": "Sum", "period": 3600, "label": "Cost ($)"}]]}},
            {"type": "metric", "x": 16, "y": 9, "width": 8, "height": 6,
             "properties": {"title": "Active Time (seconds)", "view": "timeSeries", "stacked": true, "region": "${AWS::Region}", "period": 3600,
              "metrics": [
                ["ClaudeCode/GenAI", "claude_code.active_time.total", "type", "cli", "organization", "${OrgName}", {"stat": "Sum", "period": 3600, "label": "Processing"}],
                ["ClaudeCode/GenAI", "claude_code.active_time.total", "type", "user", "organization", "${OrgName}", {"stat": "Sum", "period": 3600, "label": "User Interaction"}]]}},

            {"type": "text", "x": 0, "y": 15, "width": 24, "height": 1,
             "properties": {"markdown": "## Token Breakdown"}},
            {"type": "metric", "x": 0, "y": 16, "width": 12, "height": 6,
             "properties": {"title": "Tokens by Type", "view": "timeSeries", "stacked": true, "region": "${AWS::Region}", "period": 3600,
              "metrics": [
                ["ClaudeCode/GenAI", "claude_code.token.usage", "type", "input", "organization", "${OrgName}", {"stat": "Sum", "period": 3600, "label": "Input"}],
                ["ClaudeCode/GenAI", "claude_code.token.usage", "type", "output", "organization", "${OrgName}", {"stat": "Sum", "period": 3600, "label": "Output"}],
                ["ClaudeCode/GenAI", "claude_code.token.usage", "type", "cacheRead", "organization", "${OrgName}", {"stat": "Sum", "period": 3600, "label": "Cache Read"}],
                ["ClaudeCode/GenAI", "claude_code.token.usage", "type", "cacheCreation", "organization", "${OrgName}", {"stat": "Sum", "period": 3600, "label": "Cache Write"}]]}},
            {"type": "metric", "x": 12, "y": 16, "width": 12, "height": 6,
             "properties": {"title": "Input Tokens by Model", "view": "timeSeries", "stacked": true, "region": "${AWS::Region}", "period": 3600,
              "metrics": [
                ["ClaudeCode/GenAI", "claude_code.token.usage", "model", "us.anthropic.claude-opus-4-6-v1[1m]", "type", "input", {"stat": "Sum", "period": 3600, "label": "Opus"}],
                ["ClaudeCode/GenAI", "claude_code.token.usage", "model", "us.anthropic.claude-sonnet-4-5-20250929-v1:0[1m]", "type", "input", {"stat": "Sum", "period": 3600, "label": "Sonnet"}],
                ["ClaudeCode/GenAI", "claude_code.token.usage", "model", "us.anthropic.claude-haiku-4-5-20251001-v1:0", "type", "input", {"stat": "Sum", "period": 3600, "label": "Haiku"}]]}},

            {"type": "text", "x": 0, "y": 22, "width": 24, "height": 1,
             "properties": {"markdown": "## Code Metrics"}},
            {"type": "metric", "x": 0, "y": 23, "width": 12, "height": 6,
             "properties": {"title": "Lines Added / Removed", "view": "timeSeries", "stacked": false, "region": "${AWS::Region}", "period": 3600,
              "metrics": [
                ["ClaudeCode/GenAI", "claude_code.lines_of_code.count", "type", "added", {"stat": "Sum", "period": 3600, "label": "Lines Added"}],
                ["ClaudeCode/GenAI", "claude_code.lines_of_code.count", "type", "removed", {"stat": "Sum", "period": 3600, "label": "Lines Removed"}]]}},

            {"type": "text", "x": 12, "y": 22, "width": 12, "height": 1,
             "properties": {"markdown": "## Cost Summary"}},
            {"type": "metric", "x": 12, "y": 23, "width": 6, "height": 3,
             "properties": {"title": "Today's Estimated Cost", "view": "singleValue", "region": "${AWS::Region}", "period": 86400,
              "metrics": [["ClaudeCode/GenAI", "claude_code.cost.usage", "organization", "${OrgName}", {"stat": "Sum", "period": 86400, "label": "Cost ($)"}]]}},
            {"type": "metric", "x": 18, "y": 23, "width": 6, "height": 3,
             "properties": {"title": "This Week's Cost", "view": "singleValue", "region": "${AWS::Region}", "period": 604800,
              "metrics": [["ClaudeCode/GenAI", "claude_code.cost.usage", "organization", "${OrgName}", {"stat": "Sum", "period": 604800, "label": "Cost ($)"}]]}},
            {"type": "metric", "x": 12, "y": 26, "width": 12, "height": 3,
             "properties": {"title": "Daily Cost Trend", "view": "timeSeries", "stacked": false, "region": "${AWS::Region}", "period": 86400,
              "metrics": [["ClaudeCode/GenAI", "claude_code.cost.usage", "organization", "${OrgName}", {"stat": "Sum", "period": 86400, "label": "Daily Cost ($)"}]]}},

            {"type": "text", "x": 0, "y": 29, "width": 24, "height": 1,
             "properties": {"markdown": "## CLI vs Co-work"}},
            {"type": "metric", "x": 0, "y": 30, "width": 8, "height": 6,
             "properties": {"title": "Sessions — CLI vs Co-work", "view": "timeSeries", "stacked": true, "region": "${AWS::Region}", "period": 3600,
              "metrics": [
                ["ClaudeCode/GenAI", "claude_code.derived.api_calls", "client_type", "claude_code_cli", "organization", "${OrgName}", {"stat": "Sum", "period": 3600, "label": "CLI"}],
                ["ClaudeCode/GenAI", "claude_code.derived.api_calls", "client_type", "cowork_3p", "organization", "${OrgName}", {"stat": "Sum", "period": 3600, "label": "Co-work"}]]}},
            {"type": "metric", "x": 8, "y": 30, "width": 8, "height": 6,
             "properties": {"title": "Tokens — CLI vs Co-work", "view": "timeSeries", "stacked": true, "region": "${AWS::Region}", "period": 3600,
              "metrics": [
                ["ClaudeCode/GenAI", "claude_code.derived.input_tokens", "client_type", "claude_code_cli", "organization", "${OrgName}", {"stat": "Sum", "period": 3600, "label": "CLI Input"}],
                ["ClaudeCode/GenAI", "claude_code.derived.input_tokens", "client_type", "cowork_3p", "organization", "${OrgName}", {"stat": "Sum", "period": 3600, "label": "Co-work Input"}],
                ["ClaudeCode/GenAI", "claude_code.derived.output_tokens", "client_type", "claude_code_cli", "organization", "${OrgName}", {"stat": "Sum", "period": 3600, "label": "CLI Output"}],
                ["ClaudeCode/GenAI", "claude_code.derived.output_tokens", "client_type", "cowork_3p", "organization", "${OrgName}", {"stat": "Sum", "period": 3600, "label": "Co-work Output"}]]}},
            {"type": "metric", "x": 16, "y": 30, "width": 8, "height": 6,
             "properties": {"title": "Cost — CLI vs Co-work", "view": "timeSeries", "stacked": true, "region": "${AWS::Region}", "period": 3600,
              "metrics": [
                ["ClaudeCode/GenAI", "claude_code.derived.cost_usd", "client_type", "claude_code_cli", "organization", "${OrgName}", {"stat": "Sum", "period": 3600, "label": "CLI ($)"}],
                ["ClaudeCode/GenAI", "claude_code.derived.cost_usd", "client_type", "cowork_3p", "organization", "${OrgName}", {"stat": "Sum", "period": 3600, "label": "Co-work ($)"}]]}},

            {"type": "text", "x": 0, "y": 36, "width": 24, "height": 1,
             "properties": {"markdown": "## Cache Performance"}},
            {"type": "metric", "x": 0, "y": 37, "width": 12, "height": 6,
             "properties": {"title": "Cache Read vs Cache Write Tokens", "view": "timeSeries", "stacked": false, "region": "${AWS::Region}", "period": 3600,
              "metrics": [
                ["ClaudeCode/GenAI", "claude_code.token.usage", "type", "cacheRead", "organization", "${OrgName}", {"stat": "Sum", "period": 3600, "label": "Cache Read"}],
                ["ClaudeCode/GenAI", "claude_code.token.usage", "type", "cacheCreation", "organization", "${OrgName}", {"stat": "Sum", "period": 3600, "label": "Cache Write"}]]}},
            {"type": "metric", "x": 12, "y": 37, "width": 12, "height": 6,
             "properties": {"title": "Input vs Output Token Ratio", "view": "timeSeries", "stacked": false, "region": "${AWS::Region}", "period": 3600,
              "metrics": [
                ["ClaudeCode/GenAI", "claude_code.token.usage", "type", "input", "organization", "${OrgName}", {"stat": "Sum", "period": 3600, "label": "Input"}],
                ["ClaudeCode/GenAI", "claude_code.token.usage", "type", "output", "organization", "${OrgName}", {"stat": "Sum", "period": 3600, "label": "Output"}]]}},

            {"type": "text", "x": 0, "y": 43, "width": 24, "height": 1,
             "properties": {"markdown": "## Top Token Consumers"}},
            {"type": "metric", "x": 0, "y": 44, "width": 12, "height": 8,
             "properties": {"title": "Token Usage by User (by Model)", "view": "bar", "stacked": true, "region": "${AWS::Region}", "period": 3600,
              "metrics": [[{"expression": "SEARCH('{ClaudeCode/GenAI, user_email, model} MetricName=\"claude_code.derived.input_tokens\"', 'Sum', 3600)", "id": "e1", "label": ""}]]}},
            {"type": "metric", "x": 12, "y": 44, "width": 12, "height": 8,
             "properties": {"title": "Total Cost by User", "view": "bar", "stacked": false, "region": "${AWS::Region}", "period": 3600,
              "metrics": [[{"expression": "SEARCH('{ClaudeCode/GenAI, user_email, organization} MetricName=\"claude_code.derived.cost_usd\"', 'Sum', 3600)", "id": "e1", "label": ""}]]}},
            {"type": "metric", "x": 0, "y": 52, "width": 12, "height": 6,
             "properties": {"title": "Token Usage by Organization", "view": "bar", "stacked": true, "region": "${AWS::Region}", "period": 3600,
              "metrics": [[{"expression": "SEARCH('{ClaudeCode/GenAI, model, organization} MetricName=\"claude_code.derived.input_tokens\"', 'Sum', 3600)", "id": "e1", "label": ""}]]}},
            {"type": "metric", "x": 12, "y": 52, "width": 12, "height": 6,
             "properties": {"title": "Cost by Organization", "view": "bar", "stacked": false, "region": "${AWS::Region}", "period": 3600,
              "metrics": [[{"expression": "SEARCH('{ClaudeCode/GenAI, organization} MetricName=\"claude_code.derived.cost_usd\"', 'Sum', 3600)", "id": "e1", "label": ""}]]}}
          ]
        }

Outputs:
  DashboardName:
    Value: !If
      - UseDefaultName
      - !Sub 'ClaudeCode-${OrgName}-${Environment}'
      - !Ref DashboardName
  DashboardUrl:
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${Dashboard}'