AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  PRM phone-home receiver, IAM-gated (deploy in the PARTNER's own AWS account, not
  the customer's). Creates a DynamoDB table plus a cross-account IAM role that only
  explicitly allow-listed customer AWS accounts may assume (and only with the shared
  external id). The customer's PRM tagging Lambda assumes this role and writes a
  small status beacon directly to the table. There is no public endpoint: an account
  that is not in the trust policy cannot write anything. To onboard a customer, add
  their account id to AllowedAccountIds and update the stack.

Parameters:
  TableName:
    Type: String
    Default: prm-phone-home
    Description: DynamoDB table to store beacons.
  AllowedAccountIds:
    Type: CommaDelimitedList
    Description: >-
      Customer AWS account ids allowed to send beacons (assume the role). Add ids
      here as you onboard customers, then update the stack.
  ExternalId:
    Type: String
    Default: jacobian-prm
    Description: >-
      Shared external id the customer must present when assuming the role. Hand this
      to customers along with the role ARN. Belt-and-suspenders on top of the
      account allow-list.

Resources:
  BeaconTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }

  BeaconWriterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: prm-beacon-writer
      Description: Assumed cross-account by allow-listed customers to write PRM beacons.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref AllowedAccountIds
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      Policies:
        - PolicyName: put-beacon
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt BeaconTable.Arn

Outputs:
  BeaconRoleArn:
    Description: Give this to customers as the tagging template's BeaconRoleArn.
    Value: !GetAtt BeaconWriterRole.Arn
  BeaconExternalId:
    Description: Give this to customers as BeaconExternalId (kept NoEcho on input).
    Value: !Ref ExternalId
  BeaconTable:
    Description: DynamoDB table holding the beacons.
    Value: !Ref TableName
  BeaconRegion:
    Description: Region of the table (use as BeaconRegion in the tagging template).
    Value: !Ref AWS::Region