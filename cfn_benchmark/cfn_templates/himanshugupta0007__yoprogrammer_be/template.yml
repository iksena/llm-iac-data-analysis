AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: YoProgrammer Backend

Parameters:
  Stage:
    Type: String
    AllowedValues:
      - dev
      - prod
    Default: dev

  BedrockModelId:
    Type: String
    Default: amazon.titan-embed-text-v2:0

Globals:
  Function:
    Runtime: python3.12
    Architectures:
      - x86_64
    Timeout: 29
    MemorySize: 512
    Environment:
      Variables:
        USER_POOL_CLIENT_ID: !Ref UserPoolClient
        USER_POOL_ID: !Ref UserPool
        STAGE: !Ref Stage
        POWERTOOLS_SERVICE_NAME: !Sub "${AWS::StackName}"
        POWERTOOLS_METRICS_NAMESPACE: YoProgrammer
        LOG_LEVEL: INFO

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "yoprogrammer-user-pool-${Stage}"
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: false
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: false
        - Name: name
          AttributeDataType: String
          Required: false
          Mutable: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      UserPoolTags:
        Stage: !Ref Stage

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "yoprogrammer-client-${Stage}"
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - implicit
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      SupportedIdentityProviders:
        - COGNITO
      CallbackURLs:
        - http://localhost:3000/callback
      LogoutURLs:
        - http://localhost:3000
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      PreventUserExistenceErrors: ENABLED

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "yoprogrammer-${Stage}"
      UserPoolId: !Ref UserPool

  SnippetsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "yoprogrammer-snippets-${Stage}"
      BillingMode: PAY_PER_REQUEST
      StreamSpecification:
        StreamViewType: NEW_IMAGE
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: snippetId
          AttributeType: S
        - AttributeName: language
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: snippetId
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: ByLanguage
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: language
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: ByCreatedAt
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  EmbeddingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "yoprogrammer-embeddings-${Stage}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: snippetId
          AttributeType: S
      KeySchema:
        - AttributeName: snippetId
          KeyType: HASH

  YoProgrammerApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Stage
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Authorization,Content-Type'"
        AllowMethods: "'*'"
      Auth:
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn
      DefinitionBody:
        openapi: "3.0.1"
        info:
          title: !Sub "yoprogrammer-api-${Stage}"
          version: "1.0"
        paths:
          /health:
            get:
              summary: Health check
              x-amazon-apigateway-integration:
                type: mock
                requestTemplates:
                  application/json: '{"statusCode": 200}'
                responses:
                  default:
                    statusCode: "200"
                    responseTemplates:
                      application/json: '{"status":"ok"}'
              responses:
                "200":
                  description: OK
          /auth/signup:
            post:
              summary: Register a new user
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthSignUpFunction.Arn}/invocations"
              responses:
                "200":
                  description: OK
          /auth/confirm:
            post:
              summary: Confirm email address
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthConfirmFunction.Arn}/invocations"
              responses:
                "200":
                  description: OK
          /auth/signin:
            post:
              summary: Sign in
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthSignInFunction.Arn}/invocations"
              responses:
                "200":
                  description: OK
          /auth/forgot-password:
            post:
              summary: Request password reset code
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthForgotPasswordFunction.Arn}/invocations"
              responses:
                "200":
                  description: OK
          /auth/reset-password:
            post:
              summary: Reset password with code
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthResetPasswordFunction.Arn}/invocations"
              responses:
                "200":
                  description: OK
          /snippets:
            post:
              summary: Create a code snippet
              security:
                - CognitoAuthorizer: []
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CreateSnippetFunction.Arn}/invocations"
              responses:
                "201":
                  description: Created
            get:
              summary: List snippets for the authenticated user
              security:
                - CognitoAuthorizer: []
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ListSnippetsFunction.Arn}/invocations"
              responses:
                "200":
                  description: OK
          /search:
            post:
              summary: Semantic search over snippets
              security:
                - CognitoAuthorizer: []
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SearchFunction.Arn}/invocations"
              responses:
                "200":
                  description: OK
          /snippets/{snippetId}:
            get:
              summary: Get a snippet by ID
              security:
                - CognitoAuthorizer: []
              parameters:
                - name: snippetId
                  in: path
                  required: true
                  schema:
                    type: string
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetSnippetFunction.Arn}/invocations"
              responses:
                "200":
                  description: OK
            delete:
              summary: Soft delete a snippet
              security:
                - CognitoAuthorizer: []
              parameters:
                - name: snippetId
                  in: path
                  required: true
                  schema:
                    type: string
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DeleteSnippetFunction.Arn}/invocations"
              responses:
                "204":
                  description: No Content
        components:
          securitySchemes:
            CognitoAuthorizer:
              type: apiKey
              name: Authorization
              in: header
              x-amazon-apigateway-authtype: cognito_user_pools
              x-amazon-apigateway-authorizer:
                providerARNs:
                  - !GetAtt UserPool.Arn
                type: cognito_user_pools

  EmbeddingDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "yoprogrammer-embedding-dlq-${Stage}"

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "yoprogrammer-lambda-role-${Stage}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SnippetsTableAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:BatchGetItem
                Resource:
                  - !GetAtt SnippetsTable.Arn
                  - !Sub "${SnippetsTable.Arn}/index/*"
        - PolicyName: EmbeddingsTableAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt EmbeddingsTable.Arn
                  - !Sub "${EmbeddingsTable.Arn}/index/*"
        - PolicyName: EmbeddingQueueAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt EmbeddingQueue.Arn
        - PolicyName: CognitoAdminAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminSetUserPassword
                  - cognito-idp:AdminConfirmSignUp
                Resource: !GetAtt UserPool.Arn
        - PolicyName: BedrockInvokeAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0"

  EmbeddingQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "yoprogrammer-embedding-queue-${Stage}"
      VisibilityTimeout: 1800
      MessageRetentionPeriod: 86400
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt EmbeddingDLQ.Arn
        maxReceiveCount: 3

  AuthSignUpLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/yoprogrammer-auth-signup-${Stage}"
      RetentionInDays: 7

  AuthConfirmLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/yoprogrammer-auth-confirm-${Stage}"
      RetentionInDays: 7

  AuthSignInLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/yoprogrammer-auth-signin-${Stage}"
      RetentionInDays: 7

  AuthForgotPasswordLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/yoprogrammer-auth-forgot-password-${Stage}"
      RetentionInDays: 7

  AuthResetPasswordLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/yoprogrammer-auth-reset-password-${Stage}"
      RetentionInDays: 7

  AuthSignUpFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "yoprogrammer-auth-signup-${Stage}"
      CodeUri: .
      Handler: src.handlers.auth.sign_up.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        SignUp:
          Type: Api
          Properties:
            RestApiId: !Ref YoProgrammerApi
            Path: /auth/signup
            Method: POST
            Auth:
              Authorizer: NONE

  AuthConfirmFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "yoprogrammer-auth-confirm-${Stage}"
      CodeUri: .
      Handler: src.handlers.auth.confirm_sign_up.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        ConfirmSignUp:
          Type: Api
          Properties:
            RestApiId: !Ref YoProgrammerApi
            Path: /auth/confirm
            Method: POST
            Auth:
              Authorizer: NONE

  AuthSignInFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "yoprogrammer-auth-signin-${Stage}"
      CodeUri: .
      Handler: src.handlers.auth.sign_in.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        SignIn:
          Type: Api
          Properties:
            RestApiId: !Ref YoProgrammerApi
            Path: /auth/signin
            Method: POST
            Auth:
              Authorizer: NONE

  AuthForgotPasswordFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "yoprogrammer-auth-forgot-password-${Stage}"
      CodeUri: .
      Handler: src.handlers.auth.forgot_password.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        ForgotPassword:
          Type: Api
          Properties:
            RestApiId: !Ref YoProgrammerApi
            Path: /auth/forgot-password
            Method: POST
            Auth:
              Authorizer: NONE

  AuthResetPasswordFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "yoprogrammer-auth-reset-password-${Stage}"
      CodeUri: .
      Handler: src.handlers.auth.reset_password.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        ResetPassword:
          Type: Api
          Properties:
            RestApiId: !Ref YoProgrammerApi
            Path: /auth/reset-password
            Method: POST
            Auth:
              Authorizer: NONE

  GetSnippetLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/yoprogrammer-get-snippet-${Stage}"
      RetentionInDays: 7

  GetSnippetFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "yoprogrammer-get-snippet-${Stage}"
      CodeUri: .
      Handler: src.handlers.snippets.get_snippet.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          SNIPPETS_TABLE_NAME: !Ref SnippetsTable
      Events:
        GetSnippet:
          Type: Api
          Properties:
            RestApiId: !Ref YoProgrammerApi
            Path: /snippets/{snippetId}
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

  DeleteSnippetLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/yoprogrammer-delete-snippet-${Stage}"
      RetentionInDays: 7

  DeleteSnippetFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "yoprogrammer-delete-snippet-${Stage}"
      CodeUri: .
      Handler: src.handlers.snippets.delete_snippet.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          SNIPPETS_TABLE_NAME: !Ref SnippetsTable
      Events:
        DeleteSnippet:
          Type: Api
          Properties:
            RestApiId: !Ref YoProgrammerApi
            Path: /snippets/{snippetId}
            Method: DELETE
            Auth:
              Authorizer: CognitoAuthorizer

  ListSnippetsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/yoprogrammer-list-snippets-${Stage}"
      RetentionInDays: 7

  ListSnippetsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "yoprogrammer-list-snippets-${Stage}"
      CodeUri: .
      Handler: src.handlers.snippets.list_snippets.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          SNIPPETS_TABLE_NAME: !Ref SnippetsTable
      Events:
        ListSnippets:
          Type: Api
          Properties:
            RestApiId: !Ref YoProgrammerApi
            Path: /snippets
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

  CreateSnippetLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/yoprogrammer-create-snippet-${Stage}"
      RetentionInDays: 7

  CreateSnippetFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "yoprogrammer-create-snippet-${Stage}"
      CodeUri: .
      Handler: src.handlers.snippets.create_snippet.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          SNIPPETS_TABLE_NAME: !Ref SnippetsTable
          EMBEDDING_QUEUE_URL: !Ref EmbeddingQueue
      Events:
        CreateSnippet:
          Type: Api
          Properties:
            RestApiId: !Ref YoProgrammerApi
            Path: /snippets
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  GenerateEmbeddingLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/yoprogrammer-generate-embedding-${Stage}"
      RetentionInDays: 7

  GenerateEmbeddingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "yoprogrammer-generate-embedding-${Stage}"
      CodeUri: .
      Handler: src.handlers.generateEmbedding.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 300
      Environment:
        Variables:
          EMBEDDINGS_TABLE_NAME: !Ref EmbeddingsTable
          BEDROCK_MODEL_ID: !Ref BedrockModelId
      Events:
        EmbeddingQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt EmbeddingQueue.Arn
            BatchSize: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures

  SearchLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/yoprogrammer-search-${Stage}"
      RetentionInDays: 7

  SearchFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "yoprogrammer-search-${Stage}"
      CodeUri: .
      Handler: src.handlers.search.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 60
      Environment:
        Variables:
          EMBEDDINGS_TABLE_NAME: !Ref EmbeddingsTable
          SNIPPETS_TABLE_NAME: !Ref SnippetsTable
          BEDROCK_MODEL_ID: !Ref BedrockModelId
      Events:
        Search:
          Type: Api
          Properties:
            RestApiId: !Ref YoProgrammerApi
            Path: /search
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  EmbeddingDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-embedding-dlq-depth"
      AlarmDescription: Messages in the embedding DLQ indicate failed processing
      MetricName: ApproximateNumberOfMessagesVisible
      Namespace: AWS/SQS
      Dimensions:
        - Name: QueueName
          Value: !GetAtt EmbeddingDLQ.QueueName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  UserPoolId:
    Value: !Ref UserPool
    Export:
      Name: !Sub "${AWS::StackName}-UserPoolId"

  UserPoolClientId:
    Value: !Ref UserPoolClient
    Export:
      Name: !Sub "${AWS::StackName}-UserPoolClientId"

  UserPoolArn:
    Value: !GetAtt UserPool.Arn
    Export:
      Name: !Sub "${AWS::StackName}-UserPoolArn"

  UserPoolDomain:
    Value: !Sub "yoprogrammer-${Stage}"
    Export:
      Name: !Sub "${AWS::StackName}-UserPoolDomain"

  SnippetsTableName:
    Value: !Ref SnippetsTable
    Export:
      Name: !Sub "${AWS::StackName}-SnippetsTableName"

  SnippetsTableArn:
    Value: !GetAtt SnippetsTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-SnippetsTableArn"

  SnippetsTableStreamArn:
    Value: !GetAtt SnippetsTable.StreamArn
    Export:
      Name: !Sub "${AWS::StackName}-SnippetsTableStreamArn"

  EmbeddingsTableName:
    Value: !Ref EmbeddingsTable
    Export:
      Name: !Sub "${AWS::StackName}-EmbeddingsTableName"

  EmbeddingsTableArn:
    Value: !GetAtt EmbeddingsTable.Arn
    Export:
      Name: !Sub "${AWS::StackName}-EmbeddingsTableArn"

  EmbeddingQueueUrl:
    Value: !Ref EmbeddingQueue
    Export:
      Name: !Sub "${AWS::StackName}-EmbeddingQueueUrl"

  EmbeddingQueueArn:
    Value: !GetAtt EmbeddingQueue.Arn
    Export:
      Name: !Sub "${AWS::StackName}-EmbeddingQueueArn"

  ApiGatewayUrl:
    Value: !Sub "https://${YoProgrammerApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
    Export:
      Name: !Sub "${AWS::StackName}-ApiGatewayUrl"