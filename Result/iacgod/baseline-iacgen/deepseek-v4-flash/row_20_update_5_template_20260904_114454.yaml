AWSTemplateFormatVersion: '2010-09-09'
Description: "CloudFormation template for bac-mcp-tool Lambda function and associated IAM roles for Bedrock AgentCore Gateway"

Parameters:
  LambdaCodeBucket:
    Type: String
    Description: "S3 bucket containing the Lambda function code"
  LambdaCodeKey:
    Type: String
    Description: "S3 key for the Lambda function code zip"
    Default: "lambda-function.zip"
  LambdaFunctionName:
    Type: String
    Default: "bac-mcp-tool"
    Description: "Name of the Lambda function"

Resources:
  # Lambda execution role
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaExecutionPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${LambdaFunctionName}:*"
              - Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: "*"
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: "*"
              - Effect: Allow
                Action:
                  - ce:GetCostAndUsage
                  - ce:GetCostForecast
                  - ce:GetDimensionValues
                  - ce:GetTags
                  - ce:GetReservationUtilization
                  - ce:GetSavingsPlansUtilization
                Resource: "*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource: "*"

  # CloudWatch Log Group for Lambda with 14-day retention
  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${LambdaFunctionName}"
      RetentionInDays: 14

  # Lambda function (standard CloudFormation resource to avoid SAM transform capability requirement)
  BacMCPToolFunction:
    Type: AWS::Lambda::Function
    DependsOn: LambdaLogGroup
    Properties:
      FunctionName: !Ref LambdaFunctionName
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
      Handler: index.handler
      Runtime: python3.12
      Timeout: 900
      MemorySize: 2048
      TracingConfig:
        Mode: Active
      Role: !GetAtt LambdaExecutionRole.Arn

  # IAM role for Bedrock AgentCore Gateway to assume
  BedrockAgentGatewayRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: "BedrockAgentGatewayRole"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref "AWS::AccountId"
      Policies:
        - PolicyName: BedrockAgentGatewayPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt BacMCPToolFunction.Arn
              - Effect: Allow
                Action:
                  - bedrock:CreateAgent
                  - bedrock:UpdateAgent
                  - bedrock:DeleteAgent
                  - bedrock:GetAgent
                  - bedrock:ListAgents
                  - bedrock:CreateAgentAlias
                  - bedrock:UpdateAgentAlias
                  - bedrock:DeleteAgentAlias
                  - bedrock:GetAgentAlias
                  - bedrock:ListAgentAliases
                  - bedrock:InvokeAgent
                  - bedrock:CreateKnowledgeBase
                  - bedrock:UpdateKnowledgeBase
                  - bedrock:DeleteKnowledgeBase
                  - bedrock:GetKnowledgeBase
                  - bedrock:ListKnowledgeBases
                  - bedrock:AssociateAgentKnowledgeBase
                  - bedrock:DisassociateAgentKnowledgeBase
                  - bedrock:GetAgentKnowledgeBase
                  - bedrock:ListAgentKnowledgeBases
                Resource: "*"
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !GetAtt LambdaExecutionRole.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource: "*"
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"

Outputs:
  LambdaFunctionArn:
    Description: "ARN of the bac-mcp-tool Lambda function"
    Value: !GetAtt BacMCPToolFunction.Arn
  BedrockAgentGatewayRoleArn:
    Description: "ARN of the IAM role for Bedrock AgentCore Gateway"
    Value: !GetAtt BedrockAgentGatewayRole.Arn