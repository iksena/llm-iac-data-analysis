AWSTemplateFormatVersion: "2010-09-09"
Description: "Security Hub Automation Rules to suppress accepted findings across the organization"
Parameters:
  ExcludedIAMUsers:
    Type: CommaDelimitedList
    Default: "user1,user2"
    Description: "List of IAM user names to exclude from IAM finding suppression"
  SubAccountId:
    Type: String
    Default: "111111111111"
    Description: "AWS account ID for CIS benchmark suppression scope"
  PublicBucketNames:
    Type: CommaDelimitedList
    Default: "bucket1,bucket2"
    Description: "List of S3 bucket names that are intentionally public"
  EBSEncryptionAccountId:
    Type: String
    Default: "222222222222"
    Description: "AWS account ID for EBS default encryption suppression"
  UnusedCredentialAccounts:
    Type: CommaDelimitedList
    Default: "333333333333,444444444444"
    Description: "List of AWS account IDs for unused credential and access key rotation suppression"
  GuardDutyFindingType:
    Type: String
    Default: "GuardDuty/UnauthorizedAccess:EC2/SSHBruteForce"
    Description: "GuardDuty finding type to suppress"
Resources:
  IAMSuppressionRule:
    Type: "AWS::SecurityHub::AutomationRule"
    Properties:
      RuleStatus: ENABLED
      RuleOrder: 1
      Criteria:
        Type:
          - Comparison: PREFIX
            Value:
              - "Software and Configuration Checks/IAM"
              - "IAM Policy Monitoring"
              - "IAM Access Analyzer"
        ResourceId:
          - Comparison: NOT_CONTAINS
            Value: !Ref ExcludedIAMUsers
      Actions:
        - Type: FINDING_UPDATE
          FindingUpdate:
            Workflow:
              Status: SUPPRESSED
            Note:
              Text: "Suppressed as reviewed and accepted IAM findings, excluding specific users."
              UpdatedBy: "AutomationRule"
  CISSubAccountRule:
    Type: "AWS::SecurityHub::AutomationRule"
    Properties:
      RuleStatus: ENABLED
      RuleOrder: 2
      Criteria:
        Type:
          - Comparison: PREFIX
            Value:
              - "CIS AWS Foundations Benchmark"
        AwsAccountId:
          - Comparison: EQUALS
            Value:
              - !Ref SubAccountId
      Actions:
        - Type: FINDING_UPDATE
          FindingUpdate:
            Workflow:
              Status: SUPPRESSED
            Note:
              Text: "Suppressed CIS benchmark findings for sub-account as reviewed."
              UpdatedBy: "AutomationRule"
  BroadFrameworkSuppressionRule:
    Type: "AWS::SecurityHub::AutomationRule"
    Properties:
      RuleStatus: ENABLED
      RuleOrder: 3
      Criteria:
        Type:
          - Comparison: PREFIX
            Value:
              - "CIS AWS Foundations Benchmark"
              - "AWS Foundational Security Best Practices"
      Actions:
        - Type: FINDING_UPDATE
          FindingUpdate:
            Workflow:
              Status: SUPPRESSED
            Note:
              Text: "Suppressed accepted CIS and AWS Foundational Security Best Practices findings, including security group admin ports, S3 public/HTTP access, and AWS Config coverage."
              UpdatedBy: "AutomationRule"
  PublicBucketSuppressionRule:
    Type: "AWS::SecurityHub::AutomationRule"
    Properties:
      RuleStatus: ENABLED
      RuleOrder: 4
      Criteria:
        ResourceId:
          - Comparison: CONTAINS
            Value: !Ref PublicBucketNames
        Type:
          - Comparison: PREFIX
            Value:
              - "S3 Bucket"
      Actions:
        - Type: FINDING_UPDATE
          FindingUpdate:
            Workflow:
              Status: SUPPRESSED
            Note:
              Text: "Suppressed public-access findings for known intentionally public buckets."
              UpdatedBy: "AutomationRule"
  EBSEncryptionSuppressionRule:
    Type: "AWS::SecurityHub::AutomationRule"
    Properties:
      RuleStatus: ENABLED
      RuleOrder: 5
      Criteria:
        Type:
          - Comparison: PREFIX
            Value:
              - "Software and Configuration Checks/EC2/EBS"
        AwsAccountId:
          - Comparison: EQUALS
            Value:
              - !Ref EBSEncryptionAccountId
      Actions:
        - Type: FINDING_UPDATE
          FindingUpdate:
            Workflow:
              Status: SUPPRESSED
            Note:
              Text: "Suppressed EBS default encryption finding for the specified account."
              UpdatedBy: "AutomationRule"
  UnusedCredentialSuppressionRule:
    Type: "AWS::SecurityHub::AutomationRule"
    Properties:
      RuleStatus: ENABLED
      RuleOrder: 6
      Criteria:
        Type:
          - Comparison: PREFIX
            Value:
              - "UnusedCredential"
              - "AccessKeyRotation"
        AwsAccountId:
          - Comparison: EQUALS
            Value: !Ref UnusedCredentialAccounts
      Actions:
        - Type: FINDING_UPDATE
          FindingUpdate:
            Workflow:
              Status: SUPPRESSED
            Note:
              Text: "Suppressed unused credential and access key rotation findings for infrequent automation accounts."
              UpdatedBy: "AutomationRule"
  GuardDutySuppressionRule:
    Type: "AWS::SecurityHub::AutomationRule"
    Properties:
      RuleStatus: ENABLED
      RuleOrder: 7
      Criteria:
        Type:
          - Comparison: EQUALS
            Value:
              - !Ref GuardDutyFindingType
      Actions:
        - Type: FINDING_UPDATE
          FindingUpdate:
            Workflow:
              Status: SUPPRESSED
            Note:
              Text: "Suppressed GuardDuty finding type related to expected cross-account Bedrock API activity."
              UpdatedBy: "AutomationRule"