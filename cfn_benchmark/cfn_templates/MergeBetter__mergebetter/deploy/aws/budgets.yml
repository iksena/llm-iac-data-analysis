AWSTemplateFormatVersion: '2010-09-09'
Description: AWS Budgets for monthly actual and forecasted cost with SNS notifications

Parameters:
  MonthlyActualLimitUSD:
    Type: Number
    Default: 100
  MonthlyForecastLimitUSD:
    Type: Number
    Default: 100
  NotificationTopicArn:
    Type: String
    Description: SNS topic ARN for budget alerts

Resources:
  MonthlyActualBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: mergebetter-monthly-actual
        BudgetLimit:
          Amount: !Ref MonthlyActualLimitUSD
          Unit: USD
        BudgetType: COST
        TimeUnit: MONTHLY
        CostFilters: {}
        CostTypes:
          IncludeCredit: true
          IncludeDiscount: true
          IncludeOtherSubscription: true
          IncludeRecurring: true
          IncludeRefund: true
          IncludeSubscription: true
          IncludeSupport: true
          IncludeTax: true
          IncludeUpfront: true
          UseAmortized: false
          UseBlended: false
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref NotificationTopicArn

  MonthlyForecastBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: mergebetter-monthly-forecast
        BudgetLimit:
          Amount: !Ref MonthlyForecastLimitUSD
          Unit: USD
        BudgetType: COST
        TimeUnit: MONTHLY
        CostFilters: {}
        CostTypes:
          IncludeCredit: true
          IncludeDiscount: true
          IncludeOtherSubscription: true
          IncludeRecurring: true
          IncludeRefund: true
          IncludeSubscription: true
          IncludeSupport: true
          IncludeTax: true
          IncludeUpfront: true
          UseAmortized: false
          UseBlended: false
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address: !Ref NotificationTopicArn