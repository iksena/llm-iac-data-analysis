AWSTemplateFormatVersion: '2010-09-09'
Parameters:
  ScriptBucketName:
    Type: String
    Default: admin-console-cfn-dataprepare-code
    Description: Name of the S3 bucket to store Glue ETL scripts.
Resources:
  AdminS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'admin-suite-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  AdminS3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AdminS3Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !Sub 'arn:aws:s3:::${AdminS3Bucket}'
              - !Sub 'arn:aws:s3:::${AdminS3Bucket}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'
  ScriptS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref ScriptBucketName
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  ScriptS3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ScriptS3Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !Sub 'arn:aws:s3:::${ScriptS3Bucket}'
              - !Sub 'arn:aws:s3:::${ScriptS3Bucket}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'
  ConsolidatedIAMRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: QuickSightAdminPipelineRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - glue.amazonaws.com
                - firehose.amazonaws.com
                - cloudwatch.amazonaws.com
                - lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: QuickSightAdminPipelinePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:aws:s3:::${AdminS3Bucket}'
                  - !Sub 'arn:aws:s3:::${AdminS3Bucket}/*'
                  - !Sub 'arn:aws:s3:::${ScriptS3Bucket}'
                  - !Sub 'arn:aws:s3:::${ScriptS3Bucket}/*'
              - Effect: Allow
                Action:
                  - glue:CreateJob
                  - glue:StartJobRun
                  - glue:GetJob
                  - glue:UpdateJob
                  - glue:DeleteJob
                Resource: '*'
              - Effect: Allow
                Action:
                  - quicksight:ListUsers
                  - quicksight:ListGroups
                  - quicksight:ListDataSets
                  - quicksight:ListDataSources
                  - quicksight:ListFolders
                  - quicksight:ListDashboardVersions
                  - quicksight:SearchDirectoryGroups
                  - quicksight:DescribeDataSet
                  - quicksight:DescribeDataSource
                  - quicksight:DescribeFolder
                  - quicksight:DescribeAccountSettings
                Resource: '*'
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource: '*'
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricStream
                  - cloudwatch:ListMetricStreams
                  - cloudwatch:DeleteMetricStream
                Resource: '*'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
              - Effect: Allow
                Action:
                  - firehose:CreateDeliveryStream
                  - firehose:PutRecord
                  - firehose:DeleteDeliveryStream
                  - firehose:DescribeDeliveryStream
                Resource: '*'
              - Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:InvokeFunction
                  - lambda:DeleteFunction
                  - lambda:UpdateFunctionCode
                Resource: '*'
  ScriptUploadLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: QuickSightScriptUploader
      Handler: index.lambda_handler
      Runtime: python3.12
      Role: !GetAtt ConsolidatedIAMRole.Arn
      Timeout: 300
      Code:
        ZipFile: |
          import boto3, cfnresponse, json
          def lambda_handler(event, context):
              try:
                  if event['RequestType'] == 'Create':
                      bucket = event['ResourceProperties']['BucketName']
                      s3 = boto3.client('s3')
                      scripts = {
                          'access_management.py': 'import sys\nfrom awsglue.job import Job\nfrom awsglue.utils import getResolvedOptions\nfrom pyspark.context import SparkContext\nfrom awsglue.context import GlueContext\nargs = getResolvedOptions(sys.argv, ["JOB_NAME","output_path"])\ngc = GlueContext(SparkContext())\nspark = gc.spark_session\njob = Job(gc)\njob.init(args["JOB_NAME"], args)\nspark.createDataFrame([{"user":"admin"}]).write.mode("overwrite").json(args["output_path"])\njob.commit()',
                          'dataset_metadata.py': 'import sys\nfrom awsglue.job import Job\nfrom awsglue.utils import getResolvedOptions\nfrom pyspark.context import SparkContext\nfrom awsglue.context import GlueContext\nargs = getResolvedOptions(sys.argv, ["JOB_NAME","output_path"])\ngc = GlueContext(SparkContext())\nspark = gc.spark_session\njob = Job(gc)\njob.init(args["JOB_NAME"], args)\nspark.createDataFrame([{"dataset":"sales"}]).write.mode("overwrite").json(args["output_path"])\njob.commit()',
                          'folder_assets.py': 'import sys\nfrom awsglue.job import Job\nfrom awsglue.utils import getResolvedOptions\nfrom pyspark.context import SparkContext\nfrom awsglue.context import GlueContext\nargs = getResolvedOptions(sys.argv, ["JOB_NAME","output_path"])\ngc = GlueContext(SparkContext())\nspark = gc.spark_session\njob = Job(gc)\njob.init(args["JOB_NAME"], args)\nspark.createDataFrame([{"folder":"reports","asset":"dashboard"}]).write.mode("overwrite").json(args["output_path"])\njob.commit()',
                          'q_metadata.py': 'import sys\nfrom awsglue.job import Job\nfrom awsglue.utils import getResolvedOptions\nfrom pyspark.context import SparkContext\nfrom awsglue.context import GlueContext\nargs = getResolvedOptions(sys.argv, ["JOB_NAME","output_path"])\ngc = GlueContext(SparkContext())\nspark = gc.spark_session\njob = Job(gc)\njob.init(args["JOB_NAME"], args)\nspark.createDataFrame([{"index":"main","documents":1000}]).write.mode("overwrite").json(args["output_path"])\njob.commit()',
                          'datasource_properties.py': 'import sys\nfrom awsglue.job import Job\nfrom awsglue.utils import getResolvedOptions\nfrom pyspark.context import SparkContext\nfrom awsglue.context import GlueContext\nargs = getResolvedOptions(sys.argv, ["JOB_NAME","output_path"])\ngc = GlueContext(SparkContext())\nspark = gc.spark_session\njob = Job(gc)\njob.init(args["JOB_NAME"], args)\nspark.createDataFrame([{"datasource":"rds","type":"mysql"}]).write.mode("overwrite").json(args["output_path"])\njob.commit()'
                      }
                      for key, content in scripts.items():
                          s3.put_object(Bucket=bucket, Key='scripts/' + key, Body=content)
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
              except Exception as e:
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': str(e)})
      Description: Uploads Glue ETL scripts to the script bucket.
  ScriptUploadCustomResource:
    Type: Custom::ScriptUpload
    Properties:
      ServiceToken: !GetAtt ScriptUploadLambda.Arn
      BucketName: !Ref ScriptBucketName
  GlueJobAccessManagement:
    Type: AWS::Glue::Job
    DependsOn:
      - ScriptUploadCustomResource
    Properties:
      Name: quickSight-access-management
      Role: !GetAtt ConsolidatedIAMRole.Arn
      Command:
        Name: glueetl
        ScriptLocation: !Sub 's3://${ScriptBucketName}/scripts/access_management.py'
        PythonVersion: 3
      GlueVersion: '5.0'
      WorkerType: G.2X
      NumberOfWorkers: 5
      Timeout: 360
      DefaultArguments:
        '--output_path': !Sub 's3://${AdminS3Bucket}/pipeline/access_management/'
  GlueJobDatasetMetadata:
    Type: AWS::Glue::Job
    DependsOn:
      - ScriptUploadCustomResource
    Properties:
      Name: quickSight-dataset-metadata
      Role: !GetAtt ConsolidatedIAMRole.Arn
      Command:
        Name: glueetl
        ScriptLocation: !Sub 's3://${ScriptBucketName}/scripts/dataset_metadata.py'
        PythonVersion: 3
      GlueVersion: '5.0'
      WorkerType: G.1X
      NumberOfWorkers: 2
      Timeout: 240
      DefaultArguments:
        '--output_path': !Sub 's3://${AdminS3Bucket}/pipeline/dataset_metadata/'
  GlueJobFolderAssets:
    Type: AWS::Glue::Job
    DependsOn:
      - ScriptUploadCustomResource
    Properties: