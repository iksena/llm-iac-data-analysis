AWSTemplateFormatVersion: '2010-09-09'
Description: 'SAA Lab 04 - PostgreSQL RDS Multi-AZ e read replica gerenciada pelo Secrets Manager'

Parameters:
  ProjectName:
    Type: String
    Default: saa-lab-04
  DBInstanceClass:
    Type: String
    Default: db.t3.micro
    AllowedValues: [db.t3.micro, db.t4g.micro]
  CreateReadReplica:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Use false para praticar somente Multi-AZ e reduzir custo.

Conditions:
  WithReadReplica: !Equals [!Ref CreateReadReplica, 'true']

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.40.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-vpc'}, {Key: Project, Value: saa-c03-intensive}, {Key: Lab, Value: '04'}, {Key: ManagedBy, Value: CloudFormation}]
  DatabaseSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.40.10.0/24
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-db-a'}, {Key: Lab, Value: '04'}]
  DatabaseSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.40.11.0/24
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-db-b'}, {Key: Lab, Value: '04'}]
  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Sub-redes privadas em duas AZs
      SubnetIds: [!Ref DatabaseSubnetA, !Ref DatabaseSubnetB]
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-db-subnets'}, {Key: Lab, Value: '04'}]
  ClientSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Anexe somente ao cliente autorizado do banco
      VpcId: !Ref VPC
      SecurityGroupEgress: [{IpProtocol: '-1', CidrIp: 0.0.0.0/0}]
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-client-sg'}, {Key: Lab, Value: '04'}]
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL somente a partir do client SG
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref ClientSecurityGroup
          Description: Cliente autorizado
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-db-sg'}, {Key: Lab, Value: '04'}]

  PrimaryDatabase:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub '${ProjectName}-primary'
      Engine: postgres
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: 20
      MaxAllocatedStorage: 40
      StorageType: gp3
      StorageEncrypted: true
      MultiAZ: true
      PubliclyAccessible: false
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
      MasterUsername: labadmin
      ManageMasterUserPassword: true
      BackupRetentionPeriod: 1
      PreferredBackupWindow: '03:00-03:30'
      PreferredMaintenanceWindow: 'sun:04:00-sun:04:30'
      AutoMinorVersionUpgrade: true
      DeletionProtection: false
      DeleteAutomatedBackups: true
      CopyTagsToSnapshot: true
      EnablePerformanceInsights: false
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-primary'}
        - {Key: Project, Value: saa-c03-intensive}
        - {Key: Lab, Value: '04'}
        - {Key: ManagedBy, Value: CloudFormation}

  ReadReplica:
    Type: AWS::RDS::DBInstance
    Condition: WithReadReplica
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub '${ProjectName}-replica'
      SourceDBInstanceIdentifier: !Ref PrimaryDatabase
      DBInstanceClass: !Ref DBInstanceClass
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
      PubliclyAccessible: false
      MultiAZ: false
      AutoMinorVersionUpgrade: true
      DeleteAutomatedBackups: true
      EnablePerformanceInsights: false
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-replica'}
        - {Key: Project, Value: saa-c03-intensive}
        - {Key: Lab, Value: '04'}
        - {Key: ManagedBy, Value: CloudFormation}

Outputs:
  PrimaryEndpoint: {Description: Endpoint de escrita, Value: !GetAtt PrimaryDatabase.Endpoint.Address}
  PrimaryPort: {Value: !GetAtt PrimaryDatabase.Endpoint.Port}
  ReadReplicaEndpoint:
    Description: Endpoint de leitura ou disabled
    Value: !If [WithReadReplica, !GetAtt ReadReplica.Endpoint.Address, disabled]
  MasterSecretArn: {Description: Leia somente com permissao explícita, Value: !GetAtt PrimaryDatabase.MasterUserSecret.SecretArn}
  ClientSecurityGroupId: {Value: !Ref ClientSecurityGroup}