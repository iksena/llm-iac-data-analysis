AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Weekly analytics report for Claude Code. Queries Athena, generates
  AI insights via Bedrock, and sends the report via SNS.

Parameters:
  OrgName:
    Type: String
    Description: Organization name

  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, staging, prod]

  SNSTopicArn:
    Type: String
    Description: SNS topic ARN for reports (reuse the usage-alerts topic or a separate one)

  AthenaDatabase:
    Type: String
    Description: Glue database name (from glue-athena stack outputs)

  AthenaWorkgroup:
    Type: String
    Description: Athena workgroup name (from glue-athena stack outputs)

  ReportBucket:
    Type: String
    Description: S3 bucket to archive reports (typically the processed logs bucket)

  ReportSchedule:
    Type: String
    Default: 'cron(0 16 ? * MON *)'
    Description: When to generate the report (default Monday 16:00 UTC = 9am PT)

  BedrockModelId:
    Type: String
    Default: 'us.anthropic.claude-sonnet-4-6'
    Description: Bedrock model ID for generating AI insights

  KMSKeyArn:
    Type: String
    Default: ''
    Description: KMS key ARN for S3 bucket encryption (from bedrock-logging outputs)

  PermissionsBoundaryArn:
    Type: String
    Default: ''
    Description: IAM Permissions Boundary ARN (required for accounts with restrictive SCPs)

Conditions:
  HasPermissionsBoundary: !Not [!Equals [!Ref PermissionsBoundaryArn, '']]
  HasKMSKey: !Not [!Equals [!Ref KMSKeyArn, '']]

Resources:

  # =========================================================================
  # Weekly Report Lambda
  # =========================================================================
  # checkov:skip=CKV_AWS_117:Lambdas call AWS APIs only — VPC adds NAT Gateway cost with no benefit
  # checkov:skip=CKV_AWS_116:Synchronous invocation — DLQ not applicable
  # checkov:skip=CKV_AWS_173:Environment variables contain config (table names, ARNs), not secrets
  WeeklyReportFunction:
    Type: AWS::Lambda::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Lambda calls AWS APIs only — VPC adds cost with no benefit"
          - id: W92
            reason: "ReservedConcurrentExecutions set on function"
    Properties:
      FunctionName: !Sub 'claude-code-weekly-report-${OrgName}-${Environment}'
      Runtime: python3.12
      Handler: index.handler
      Timeout: 300
      MemorySize: 512
      ReservedConcurrentExecutions: 5
      Role: !GetAtt WeeklyReportRole.Arn
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref SNSTopicArn
          ORG_NAME: !Ref OrgName
          ATHENA_DATABASE: !Ref AthenaDatabase
          ATHENA_WORKGROUP: !Ref AthenaWorkgroup
          REPORT_BUCKET: !Ref ReportBucket
          BEDROCK_MODEL_ID: !Ref BedrockModelId
      Code:
        # Stub — full implementation in lambda/weekly_report/index.py
        ZipFile: |
          def handler(event, context):
              print("Deploy the full weekly report from lambda/weekly_report/")
              return {"statusCode": 200}
      Tags:
        - Key: Project
          Value: claude-code

  WeeklyReportRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: "Explicit name required for deploy.sh cross-stack references"
    Properties:
      RoleName: !Sub 'claude-code-weekly-report-role-${OrgName}-${Environment}'
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: AthenaQuery
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - athena:StartQueryExecution
                  - athena:GetQueryExecution
                  - athena:GetQueryResults
                Resource:
                  - !Sub 'arn:aws:athena:${AWS::Region}:${AWS::AccountId}:workgroup/${AthenaWorkgroup}'
              - Effect: Allow
                Action:
                  - glue:GetTable
                  - glue:GetPartitions
                  - glue:GetDatabase
                Resource:
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog'
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/${AthenaDatabase}'
                  - !Sub 'arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/${AthenaDatabase}/*'
        - PolicyName: S3ReadWrite
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:aws:s3:::${ReportBucket}'
                  - !Sub 'arn:aws:s3:::${ReportBucket}/*'
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource:
                  - !Sub 'arn:aws:s3:::${ReportBucket}/reports/*'
                  - !Sub 'arn:aws:s3:::${ReportBucket}/athena-results/*'
        - PolicyName: SNSPublish
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref SNSTopicArn
        - PolicyName: BedrockInvoke
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  - 'arn:aws:bedrock:*::foundation-model/*'
                  - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*'
                  - !Sub 'arn:aws:bedrock:us:${AWS::AccountId}:inference-profile/*'
        - !If
          - HasKMSKey
          - PolicyName: KMSAccess
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - kms:Decrypt
                    - kms:GenerateDataKey
                  Resource: !Ref KMSKeyArn
          - !Ref AWS::NoValue

  # =========================================================================
  # EventBridge Schedule
  # =========================================================================
  WeeklyReportSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub 'claude-code-weekly-report-${OrgName}'
      Description: Weekly analytics report for Claude Code
      ScheduleExpression: !Ref ReportSchedule
      State: ENABLED
      Targets:
        - Id: WeeklyReportLambda
          Arn: !GetAtt WeeklyReportFunction.Arn

  WeeklyReportSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt WeeklyReportFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt WeeklyReportSchedule.Arn

  # =========================================================================
  # Log Group
  # =========================================================================
  # checkov:skip=CKV_AWS_158:Sample uses default encryption — production deployments should add KMS
  WeeklyReportLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W84
            reason: "Sample uses default encryption — production deployments should add KMS"
    Properties:
      LogGroupName: !Sub '/aws/lambda/claude-code-weekly-report-${OrgName}-${Environment}'
      RetentionInDays: 90

Outputs:
  WeeklyReportFunctionName:
    Description: Weekly report Lambda function name
    Value: !Ref WeeklyReportFunction

  ReportSchedule:
    Description: Report schedule expression
    Value: !Ref ReportSchedule