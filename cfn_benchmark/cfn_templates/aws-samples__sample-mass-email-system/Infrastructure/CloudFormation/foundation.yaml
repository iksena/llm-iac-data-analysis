AWSTemplateFormatVersion: '2010-09-09'
Description: 'Foundation Stack - KMS keys, logging buckets, and code bucket for Mass Email System'

Parameters:
  UniqueSuffix:
    Type: String
    Description: 'Deterministic hash suffix for S3 bucket names (avoids exposing AWS account ID)'
    AllowedPattern: '[a-f0-9]{8}'
    ConstraintDescription: 'Must be an 8-character lowercase hex string'

Resources:
  # ============================================================================
  # KMS Keys
  # ============================================================================

  LambdaKMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS key for Lambda environment variable encryption
      EnableKeyRotation: true
      # Note on the wildcards below, which security scanners commonly flag:
      #
      # A key policy is attached to exactly one key, so 'Resource: *' means THIS key,
      # not every key in the account. Referencing the key's own ARN from inside its
      # KeyPolicy is a CloudFormation circular dependency, so there is no narrower value.
      #
      # 'arn:...:root' is the account principal, not the root user. It grants no
      # principal access by itself; it is what allows IAM policies in this account to
      # govern the key. Narrowing 'kms:*' here would break IAM-delegated administration
      # of the key, including CloudFormation's ability to update or delete it. If you
      # need tighter control in production, restrict which IAM principals may use the
      # key through their identity policies rather than by editing this statement.
      #
      # Do not copy 'kms:*' into an identity policy for an application principal. Grant
      # those only the actions they need, such as kms:Decrypt and kms:GenerateDataKey.
      # See https://docs.aws.amazon.com/kms/latest/developerguide/key-policy-default.html
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: 'kms:*'
            Resource: '*'

  LambdaKMSKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/${AWS::StackName}-lambda-env-vars
      TargetKeyId: !Ref LambdaKMSKey

  CloudWatchLogsKMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS key for CloudWatch Logs encryption
      EnableKeyRotation: true
      # Note on the wildcards below, which security scanners commonly flag:
      #
      # A key policy is attached to exactly one key, so 'Resource: *' means THIS key,
      # not every key in the account. Referencing the key's own ARN from inside its
      # KeyPolicy is a CloudFormation circular dependency, so there is no narrower value.
      #
      # 'arn:...:root' is the account principal, not the root user. It grants no
      # principal access by itself; it is what allows IAM policies in this account to
      # govern the key. Narrowing 'kms:*' here would break IAM-delegated administration
      # of the key, including CloudFormation's ability to update or delete it. If you
      # need tighter control in production, restrict which IAM principals may use the
      # key through their identity policies rather than by editing this statement.
      #
      # Contrast the 'Allow CloudWatch Logs' statement below, which grants the log
      # service only the specific actions it needs. That is the pattern to copy for
      # application principals; do not copy 'kms:*' into an identity policy.
      # See https://docs.aws.amazon.com/kms/latest/developerguide/key-policy-default.html
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: 'kms:*'
            Resource: '*'
          - Sid: Allow CloudWatch Logs
            Effect: Allow
            Principal:
              Service: !Sub logs.${AWS::Region}.amazonaws.com
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: '*'

  # ============================================================================
  # S3 Access Logs Bucket (for logging other buckets)
  # ============================================================================

  S3AccessLogsBucket:
    Type: AWS::S3::Bucket
    Metadata:
      Comment: >-
        This bucket is the access log destination for every other bucket in this
        stack. Enabling access logging on a log destination bucket makes log
        writes generate further log records, so it is omitted by design. Object
        Lock is also omitted so that expired logs can be lifecycled out.
      checkov:
        skip:
          - id: CKV_AWS_18
            comment: Log destination bucket; self-logging would recurse.
      guard:
        SuppressedRules:
          - S3_BUCKET_LOGGING_ENABLED
          - S3_BUCKET_DEFAULT_LOCK_ENABLED
    Properties:
      BucketName: !Sub '${AWS::StackName}-s3-access-logs-${UniqueSuffix}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldLogs
            Status: Enabled
            ExpirationInDays: 90
            NoncurrentVersionExpirationInDays: 30
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred

  S3AccessLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref S3AccessLogsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt S3AccessLogsBucket.Arn
              - !Sub '${S3AccessLogsBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': false
          - Sid: S3ServerAccessLogsPolicy
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: 's3:PutObject'
            Resource: !Sub '${S3AccessLogsBucket.Arn}/*'
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref AWS::AccountId

  # ============================================================================
  # React Code Bucket (source code zip for CI/CD pipeline)
  # ============================================================================

  ReactCodeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-react-code-${UniqueSuffix}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        DestinationBucketName: !Ref S3AccessLogsBucket
        LogFilePrefix: react-code-bucket/
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 30

  ReactCodeBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ReactCodeBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt ReactCodeBucket.Arn
              - !Sub '${ReactCodeBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': false

# ============================================================================
# Outputs
# ============================================================================

Outputs:
  LambdaKMSKeyArn:
    Description: ARN of the KMS key for Lambda environment variable encryption
    Value: !GetAtt LambdaKMSKey.Arn
  CloudWatchLogsKMSKeyArn:
    Description: ARN of the KMS key for CloudWatch Logs encryption
    Value: !GetAtt CloudWatchLogsKMSKey.Arn
  S3AccessLogsBucket:
    Description: S3 bucket for access logs
    Value: !Ref S3AccessLogsBucket
  ReactCodeBucket:
    Description: S3 bucket for React application source code
    Value: !Ref ReactCodeBucket