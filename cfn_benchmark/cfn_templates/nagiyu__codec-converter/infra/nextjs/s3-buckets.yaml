AWSTemplateFormatVersion: '2010-09-09'
Description: >
  S3 buckets for Codec Converter - Upload bucket for source videos and Output bucket for converted videos.
  T006: CloudFormation template for upload/output S3 buckets.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Environment name (dev, staging, prod)

  UploadExpirationDays:
    Type: Number
    Default: 7
    Description: Number of days to retain uploaded files before automatic deletion

  OutputExpirationDays:
    Type: Number
    Default: 30
    Description: Number of days to retain output files before automatic deletion

  LambdaExecutionRoleArn:
    Type: String
    Default: ''
    Description: ARN of the Lambda execution role (leave empty if not yet created)

  BatchExecutionRoleArn:
    Type: String
    Default: ''
    Description: ARN of the Batch execution role (leave empty if not yet created)

  AllowedOrigins:
    Type: CommaDelimitedList
    Default: '*'
    Description: Comma-separated list of allowed origins for CORS (e.g., https://example.com,https://app.example.com)

Conditions:
  HasLambdaRole: !Not [!Equals [!Ref LambdaExecutionRoleArn, '']]
  HasBatchRole: !Not [!Equals [!Ref BatchExecutionRoleArn, '']]
  HasAnyRole: !Or [!Condition HasLambdaRole, !Condition HasBatchRole]

Resources:
  # Upload Bucket - stores source video files uploaded by users
  UploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'codec-converter-uploads-${Environment}-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - PUT
              - POST
            AllowedOrigins: !Ref AllowedOrigins
            ExposedHeaders:
              - ETag
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          - Id: DeleteUploadedFilesAfterExpiration
            Status: Enabled
            ExpirationInDays: !Ref UploadExpirationDays
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      VersioningConfiguration:
        Status: Suspended
      Tags:
        - Key: Project
          Value: CodecConverter
        - Key: Environment
          Value: !Ref Environment
        - Key: Purpose
          Value: UploadStorage

  # Output Bucket - stores converted video files
  OutputBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'codec-converter-outputs-${Environment}-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOutputFilesAfterExpiration
            Status: Enabled
            ExpirationInDays: !Ref OutputExpirationDays
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      VersioningConfiguration:
        Status: Suspended
      Tags:
        - Key: Project
          Value: CodecConverter
        - Key: Environment
          Value: !Ref Environment
        - Key: Purpose
          Value: OutputStorage

  # Bucket Policy for Upload Bucket - restrict access to Lambda and Batch roles only
  UploadBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: HasAnyRole
    Properties:
      Bucket: !Ref UploadBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyPublicAccess
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt UploadBucket.Arn
              - !Sub '${UploadBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'
          - !If
            - HasLambdaRole
            - Sid: AllowLambdaAccess
              Effect: Allow
              Principal:
                AWS: !Ref LambdaExecutionRoleArn
              Action:
                - 's3:GetObject'
                - 's3:PutObject'
                - 's3:DeleteObject'
                - 's3:ListBucket'
              Resource:
                - !GetAtt UploadBucket.Arn
                - !Sub '${UploadBucket.Arn}/*'
            - !Ref 'AWS::NoValue'
          - !If
            - HasBatchRole
            - Sid: AllowBatchAccess
              Effect: Allow
              Principal:
                AWS: !Ref BatchExecutionRoleArn
              Action:
                - 's3:GetObject'
                - 's3:ListBucket'
              Resource:
                - !GetAtt UploadBucket.Arn
                - !Sub '${UploadBucket.Arn}/*'
            - !Ref 'AWS::NoValue'

  # Bucket Policy for Output Bucket - restrict access to Lambda and Batch roles only
  OutputBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: HasAnyRole
    Properties:
      Bucket: !Ref OutputBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt OutputBucket.Arn
              - !Sub '${OutputBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'
          - !If
            - HasLambdaRole
            - Sid: AllowLambdaAccess
              Effect: Allow
              Principal:
                AWS: !Ref LambdaExecutionRoleArn
              Action:
                - 's3:GetObject'
                - 's3:ListBucket'
              Resource:
                - !GetAtt OutputBucket.Arn
                - !Sub '${OutputBucket.Arn}/*'
            - !Ref 'AWS::NoValue'
          - !If
            - HasBatchRole
            - Sid: AllowBatchAccess
              Effect: Allow
              Principal:
                AWS: !Ref BatchExecutionRoleArn
              Action:
                - 's3:GetObject'
                - 's3:PutObject'
                - 's3:DeleteObject'
                - 's3:ListBucket'
              Resource:
                - !GetAtt OutputBucket.Arn
                - !Sub '${OutputBucket.Arn}/*'
            - !Ref 'AWS::NoValue'

Outputs:
  UploadBucketName:
    Description: Name of the S3 bucket for video uploads
    Value: !Ref UploadBucket
    Export:
      Name: !Sub '${AWS::StackName}-UploadBucketName'

  UploadBucketArn:
    Description: ARN of the S3 bucket for video uploads
    Value: !GetAtt UploadBucket.Arn
    Export:
      Name: !Sub '${AWS::StackName}-UploadBucketArn'

  OutputBucketName:
    Description: Name of the S3 bucket for converted video outputs
    Value: !Ref OutputBucket
    Export:
      Name: !Sub '${AWS::StackName}-OutputBucketName'

  OutputBucketArn:
    Description: ARN of the S3 bucket for converted video outputs
    Value: !GetAtt OutputBucket.Arn
    Export:
      Name: !Sub '${AWS::StackName}-OutputBucketArn'