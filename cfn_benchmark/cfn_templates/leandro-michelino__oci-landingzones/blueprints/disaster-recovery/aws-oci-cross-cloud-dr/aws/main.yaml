AWSTemplateFormatVersion: '2010-09-09'
Description: AWS standby deployment for OCI-primary cross-cloud DR blueprint.

Parameters:
  VpcCidr:
    Type: String
    Default: 10.82.0.0/16
  StandbySubnetCidr:
    Type: String
    Default: 10.82.10.0/24
  InstanceType:
    Type: String
    Default: t3.micro
  AllowedIngressCidr:
    Type: String
    Default: 10.0.0.0/8
  AllowedEgressCidr:
    Type: String
    Default: 10.0.0.0/8

Resources:
  StandbyVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-vpc-dr-standby'

  StandbyLogKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub '${AWS::StackName} VPC flow log encryption key'
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableAccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: kms:*
            Resource: '*'
          - Sid: AllowCloudWatchLogsUse
            Effect: Allow
            Principal:
              Service: !Sub 'logs.${AWS::Region}.amazonaws.com'
            Action:
              - kms:Decrypt
              - kms:DescribeKey
              - kms:Encrypt
              - kms:GenerateDataKey
              - kms:ReEncrypt*
            Resource: '*'

  StandbyFlowLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      KmsKeyId: !GetAtt StandbyLogKey.Arn
      RetentionInDays: 30

  StandbyFlowLogRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: vpc-flow-logs.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: write-vpc-flow-logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                  - logs:PutLogEvents
                Resource: !Sub '${StandbyFlowLogGroup.Arn}:*'

  StandbyVpcFlowLog:
    Type: AWS::EC2::FlowLog
    Properties:
      DeliverLogsPermissionArn: !GetAtt StandbyFlowLogRole.Arn
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Ref StandbyFlowLogGroup
      ResourceId: !Ref StandbyVpc
      ResourceType: VPC
      TrafficType: ALL

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-igw-dr-standby'

  VpcIgwAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref StandbyVpc
      InternetGatewayId: !Ref InternetGateway

  StandbyRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref StandbyVpc
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-rt-dr-standby'

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcIgwAttachment
    Properties:
      RouteTableId: !Ref StandbyRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  StandbySubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref StandbyVpc
      CidrBlock: !Ref StandbySubnetCidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-sn-dr-standby'

  SubnetRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref StandbySubnet
      RouteTableId: !Ref StandbyRouteTable

  StandbySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP and HTTPS ingress to DR standby endpoint.
      VpcId: !Ref StandbyVpc
      SecurityGroupIngress:
        - Description: Allow approved HTTP ingress to the standby endpoint.
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AllowedIngressCidr
        - Description: Allow approved HTTPS ingress to the standby endpoint.
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref AllowedIngressCidr
      SecurityGroupEgress:
        - Description: Allow HTTPS egress to approved package, SSM, or managed endpoint ranges.
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref AllowedEgressCidr
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-sg-dr-standby'

  StandbyInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  StandbyInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref StandbyInstanceRole

  StandbyLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub '${AWS::StackName}-lt-dr-standby'
      LaunchTemplateData:
        ImageId: !Sub '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Name: !Ref StandbyInstanceProfile
        MetadataOptions:
          HttpEndpoint: "enabled"
          HttpPutResponseHopLimit: 1
          HttpTokens: "required"
          InstanceMetadataTags: "disabled"
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              Encrypted: true
              VolumeSize: 8
              VolumeType: gp3
        NetworkInterfaces:
          - AssociatePublicIpAddress: true
            DeviceIndex: 0
            Groups:
              - !Ref StandbySecurityGroup
            SubnetId: !Ref StandbySubnet
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -e
            dnf install -y python3
            cat > /home/ec2-user/index.html <<'HTML'
            <!doctype html>
            <html lang="en">
            <head>
              <meta charset="utf-8" />
              <title>AWS Standby - OCI Primary DR</title>
            </head>
            <body>
              <h1>Hello from AWS Standby</h1>
              <p>Blueprint: aws-oci-cross-cloud-dr</p>
              <p>Role: AWS standby</p>
              <p>Primary cloud: OCI</p>
            </body>
            </html>
            HTML
            nohup python3 -m http.server 80 --directory /home/ec2-user >/var/log/standby-http.log 2>&1 &

  StandbyInstance:
    Type: AWS::EC2::Instance
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref StandbyLaunchTemplate
        Version: !GetAtt StandbyLaunchTemplate.LatestVersionNumber
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            Encrypted: true
            VolumeSize: 8
            VolumeType: gp3
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-inst-dr-standby'

  StandbyElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  StandbyElasticIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt StandbyElasticIp.AllocationId
      InstanceId: !Ref StandbyInstance

Outputs:
  AwsStandbyEndpoint:
    Description: Standby endpoint URL for DNS failover contract.
    Value: !Sub 'http://${StandbyElasticIp}'
  AwsStandbyInstanceId:
    Description: EC2 instance ID for standby service.
    Value: !Ref StandbyInstance
  AwsStandbyVpcId:
    Description: Standby VPC ID.
    Value: !Ref StandbyVpc
  AwsStandbySubnetId:
    Description: Standby subnet ID.
    Value: !Ref StandbySubnet
  AwsStandbyRouteTableId:
    Description: Standby route table ID.
    Value: !Ref StandbyRouteTable
  AwsStandbySecurityGroupId:
    Description: Standby security group ID.
    Value: !Ref StandbySecurityGroup