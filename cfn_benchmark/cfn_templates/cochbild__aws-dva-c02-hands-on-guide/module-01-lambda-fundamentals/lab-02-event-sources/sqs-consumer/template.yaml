AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: |
  DVA-C02 Lab 1.2A — SQS event source mapping with partial batch responses

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    LoggingConfig:
      LogFormat: JSON
      ApplicationLogLevel: INFO
      SystemLogLevel: WARN

Resources:
  # The DLQ -- messages land here after maxReceiveCount fails
  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: dva-lab-01-02-sqs-dlq
      MessageRetentionPeriod: 1209600   # 14 days, the max

  # The source queue -- function reads from here
  SourceQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: dva-lab-01-02-sqs-source
      # Visibility timeout >= function timeout * 6 (AWS recommendation)
      VisibilityTimeout: 180
      MessageRetentionPeriod: 345600    # 4 days
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 3              # after 3 failed deliveries, send to DLQ

  SqsConsumer:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dva-lab-01-02-sqs-consumer
      CodeUri: src/
      Handler: app.handler
      Events:
        SqsTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt SourceQueue.Arn
            BatchSize: 10
            # Process even partially-full batches after this window
            MaximumBatchingWindowInSeconds: 5
            # CRITICAL: enables partial batch reporting
            # Function returns {"batchItemFailures": [{"itemIdentifier": "msg-id"}, ...]}
            FunctionResponseTypes:
              - ReportBatchItemFailures

Outputs:
  QueueUrl:
    Value: !Ref SourceQueue
  QueueArn:
    Value: !GetAtt SourceQueue.Arn
  DlqUrl:
    Value: !Ref DeadLetterQueue
  FunctionName:
    Value: !Ref SqsConsumer