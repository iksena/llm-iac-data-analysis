AWSTemplateFormatVersion: "2010-09-09"
Description: "Lambda functions for data processing, automation, and integrations"
Parameters:
  Environment:
    Type: String
    AllowedValues:
      - dev
      - test
      - prod
      - shared

Resources:

    LambdaExecutionRole:
        Type: AWS::IAM::Role
        Properties:
            RoleName: !Sub "RADx-Lambda-ExecutionRole-${Environment}"
            AssumeRolePolicyDocument:
                Version: '2012-10-17'
                Statement:
                    - Effect: Allow
                      Principal:
                          Service: lambda.amazonaws.com
                      Action: sts:AssumeRole
            ManagedPolicyArns:
                - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
                - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
            Policies:
                - PolicyName: LambdaSecretsAccess
                  PolicyDocument:
                      Version: '2012-10-17'
                      Statement:
                          - Effect: Allow
                            Action:
                                - secretsmanager:GetSecretValue
                            Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:*"
                - PolicyName: LambdaS3Access
                  PolicyDocument:
                      Version: '2012-10-17'
                      Statement:
                          - Effect: Allow
                            Action:
                                - s3:GetObject
                                - s3:PutObject
                            Resource: "arn:aws:s3:::*/*"

    VariablesReportLambda:
        Type: "AWS::Lambda::Function"
        Properties:
            FunctionName: "variables-report"
            Description: "Variables Report Lambda Function"
            Environment:
                Variables:
                    CORE_VARIABLES_UPLOAD_PATH: "variables-explorer/core_variables_data_model.json"
                    VARIABLE_REPORT_PATH: "variables-explorer/Complete-Data-Variable-Report.xlsx"
                    BUCKET: "radxdatahub.nih.gov"
                    ALL_VARS_UPLOAD_PATH: "variables-explorer/all_variables_data_model.json"
                    SECRET_NAME: "application_prod"
                    REPORT_NAME: "Complete-Data-Variable-Report.xlsx"
                    TEMPLATE_REPORT_PATH: "variables-report/Template Variable Report.xlsx"
                    REGION: !Ref AWS::Region

            Handler: "lambda_function.lambda_handler"
            Architectures:
              - "x86_64"
            Code:
                ZipFile: |
                    import json
                    def lambda_handler(event, context):
                        return {
                            'statusCode': 200,
                            'body': json.dumps('Hello from Variables Report Lambda!')
                        }
            MemorySize: 512
            Role: !GetAtt LambdaExecutionRole.Arn
            Runtime: "python3.11"
            Timeout: 60
            TracingConfig:
                Mode: "PassThrough"
            VpcConfig:
                SubnetIds:
                  - Fn::ImportValue: !Sub "RADx-Networking-${Environment}-Private-Subnet-AZ1"
                  - Fn::ImportValue: !Sub "RADx-Networking-${Environment}-Private-Subnet-AZ2"
                SecurityGroupIds:
                  - Fn::ImportValue: !Sub "RADx-Networking-${Environment}-ECS-Host-SecurityGroup"
            # Layers:
            #   - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:layer:psycopg2-custom:1"
            #   - !Sub "arn:aws:lambda:${AWS::Region}:336392948345:layer:AWSSDKPandas-Python311:16"
            EphemeralStorage:
                Size: 512

    MacieJobStatusCheckerLambda:
        Type: "AWS::Lambda::Function"
        Properties:
            Description: "Macie Job Status Checker Lambda Function"
            FunctionName: "check-macie-job-status"
            Handler: "lambda_function.lambda_handler"
            Architectures:
              - "arm64"
            Code:
                ZipFile: |
                    import json
                    def lambda_handler(event, context):
                        return {
                            'statusCode': 200,
                            'body': json.dumps('Hello from Macie Job Status Checker!')
                        }
            MemorySize: 128
            Role: !GetAtt LambdaExecutionRole.Arn
            Runtime: "python3.12"
            Timeout: 10
            TracingConfig:
                Mode: "PassThrough"
            VpcConfig:
                SubnetIds:
                  - Fn::ImportValue: !Sub "RADx-Networking-${Environment}-Private-Subnet-AZ1"
                  - Fn::ImportValue: !Sub "RADx-Networking-${Environment}-Private-Subnet-AZ2"
                SecurityGroupIds:
                  - Fn::ImportValue: !Sub "RADx-Networking-${Environment}-ECS-Host-SecurityGroup"
            EphemeralStorage:
                Size: 512

    SageMakerCanvasAutoShutdownLambda:
        Type: "AWS::Lambda::Function"
        Properties:
            Description: "SageMaker Canvas Auto Shutdown Lambda Function"
            Environment:
                Variables:
                    TIMEOUT_THRESHOLD: "900"
                    ALARM_PERIOD: "600"
            FunctionName: "sagemaker-canvas-auto-shutdown-on-idle-DeleteCanvasAppFunction"
            Handler: "index.lambda_handler"
            Architectures:
              - "x86_64"
            Code:
                ZipFile: |
                    import json
                    def lambda_handler(event, context):
                        return {
                            'statusCode': 200,
                            'body': json.dumps('Hello from SageMaker Canvas Auto Shutdown!')
                        }
            MemorySize: 128
            Role: !GetAtt LambdaExecutionRole.Arn
            Runtime: "python3.11"
            Timeout: 30
            TracingConfig:
                Mode: "PassThrough"
            EphemeralStorage:
                Size: 512

    RADxEmailServiceLambda:
        Type: "AWS::Lambda::Function"
        Properties:
            Description: "RADx Email Service Lambda Function"
            Environment:
                Variables:
                    SPRING_PROFILES_ACTIVE: "test"
            FunctionName: "RADx-EmailService"
            Handler: "index.lambda_handler"
            Architectures:
              - "x86_64"
            Code:
                ZipFile: |
                    import json
                    def lambda_handler(event, context):
                        return {
                            'statusCode': 200,
                            'body': json.dumps('Hello from RADx Email Service! Replace with Java deployment package.')
                        }
            MemorySize: 2048
            Role: !GetAtt LambdaExecutionRole.Arn
            Runtime: "python3.11"
            Timeout: 60
            TracingConfig:
                Mode: "PassThrough"
            VpcConfig:
                SubnetIds:
                  - Fn::ImportValue: !Sub "RADx-Networking-${Environment}-Private-Subnet-AZ1"
                  - Fn::ImportValue: !Sub "RADx-Networking-${Environment}-Private-Subnet-AZ2"
                SecurityGroupIds:
                  - Fn::ImportValue: !Sub "RADx-Networking-${Environment}-ECS-Host-SecurityGroup"
            EphemeralStorage:
                Size: 512

    RADxOpenSearchRefreshLambda:
        Type: "AWS::Lambda::Function"
        Properties:
            Description: "RADx OpenSearch Refresh Lambda Function"
            Environment:
                Variables:
                    REGION_NAME: "us-east-1"
                    SECRET_NAME: "application_prod"
                    ALIAS_NAME: "study_search"
                    INDEX_NAME: "study_v101"
            FunctionName: "RADx-OpenSearchRefresh"
            Handler: "lambda_function.lambda_handler"
            Architectures:
              - "arm64"
            Code:
                ZipFile: |
                    import json
                    def lambda_handler(event, context):
                        return {
                            'statusCode': 200,
                            'body': json.dumps('Hello from OpenSearch Refresh!')
                        }
            MemorySize: 1024
            Role: !GetAtt LambdaExecutionRole.Arn
            Runtime: "python3.12"
            Timeout: 900
            TracingConfig:
                Mode: "PassThrough"
            VpcConfig:
                SubnetIds:
                  - Fn::ImportValue: !Sub "RADx-Networking-${Environment}-Private-Subnet-AZ1"
                  - Fn::ImportValue: !Sub "RADx-Networking-${Environment}-Private-Subnet-AZ2"
                SecurityGroupIds:
                  - Fn::ImportValue: !Sub "RADx-Networking-${Environment}-ECS-Host-SecurityGroup"
            EphemeralStorage:
                Size: 512
                Size: 512

    VariablesReportLambdaPermission:
        Type: "AWS::Lambda::Permission"
        Properties:
            Action: "lambda:InvokeFunction"
            FunctionName: !GetAtt VariablesReportLambda.Arn
            Principal: "events.amazonaws.com"
            SourceArn: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/VARIABLES-REPORT"

    SageMakerCanvasAutoShutdownLambdaPermission:
        Type: "AWS::Lambda::Permission"
        Properties:
            Action: "lambda:InvokeFunction"
            FunctionName: !GetAtt SageMakerCanvasAutoShutdownLambda.Arn
            Principal: "events.amazonaws.com"
            SourceArn: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/sagemaker-canvas-auto-shutdown-on-idle-CanvasAutoShutdownRule"
    # PsycoPG2CustomLayer:
    #     Type: "AWS::Lambda::LayerVersion"
    #     Properties:
    #         Description: "Python 3.11 psycopg2 layer - https://stackoverflow.com/questions/71493439/unable-to-import-module-lambda-function-no-module-named-psycopg2-psycopg-aw/77012246#7701224"
    #         CompatibleRuntimes:
    #           - "python3.11"
    #         LayerName: "psycopg2-custom"
    #         Content:
    #             S3Bucket: "prod-iad-c1-djusa-layers"
    #             S3Key: !Sub "/snapshots/${AWS::AccountId}/psycopg2-custom-abce5ae8-3c12-4862-aef1-414d9c11c7ee"

    # EmailServiceSQSEventSourceMapping:
    #     Type: "AWS::Lambda::EventSourceMapping"
    #     Properties:
    #         BatchSize: 10
    #         EventSourceArn: !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:testEmailQueue"
    #         FunctionName: !GetAtt RADxEmailServiceLambda.Arn
    #         Enabled: true
    #         MaximumBatchingWindowInSeconds: 0

Outputs:
  VariablesReportLambda:
    Description: "Variables Report Lambda ARN"
    Value: !GetAtt VariablesReportLambda.Arn
    Export:
      Name: !Sub "RADx-Lambda-VariablesReportLambda-${Environment}"

  MacieJobStatusCheckerLambda:
    Description: "Macie Job Status Checker Lambda ARN"
    Value: !GetAtt MacieJobStatusCheckerLambda.Arn
    Export:
      Name: !Sub "RADx-Lambda-MacieJobStatusCheckerLambda-${Environment}"

  RADxReporterTestLambda:
    Description: "RADx Reporter Test Lambda ARN"
    Value: !GetAtt RADxReporterTestLambda.Arn
    Export:
      Name: !Sub "RADx-Lambda-RADxReporterTestLambda-${Environment}"

  SageMakerCanvasAutoShutdownLambda:
    Description: "SageMaker Canvas Auto Shutdown Lambda ARN"
    Value: !GetAtt SageMakerCanvasAutoShutdownLambda.Arn
    Export:
      Name: !Sub "RADx-Lambda-SageMakerCanvasAutoShutdownLambda-${Environment}"

  RADxEmailServiceLambda:
    Description: "RADx Email Service Lambda ARN"
    Value: !GetAtt RADxEmailServiceLambda.Arn
    Export:
      Name: !Sub "RADx-Lambda-RADxEmailServiceLambda-${Environment}"

  RADxOpenSearchRefreshLambda:
    Description: "RADx OpenSearch Refresh Lambda ARN"
    Value: !GetAtt RADxOpenSearchRefreshLambda.Arn
    Export:
      Name: !Sub "RADx-Lambda-RADxOpenSearchRefreshLambda-${Environment}"