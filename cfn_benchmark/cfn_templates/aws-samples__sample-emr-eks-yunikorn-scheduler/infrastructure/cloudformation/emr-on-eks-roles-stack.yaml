AWSTemplateFormatVersion: "2010-09-09"
Description: "CloudFormation template for IAM Roles, Policies, OIDC Providers, and EMR on EKS Virtual Clusters"

Parameters:
  ProjectName:
    Description: An environment name that is prefixed to resource names
    Type: String
    Default: yunikorn-emr-eks

  CreateEMRContainersServiceLinkedRole:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Set to true if the AWSServiceRoleForAmazonEMRContainers doesn't exists. It is usually already present.

  CommonKMSKeyArn:
    Description: ARN of the KMS key used for CloudWatch Logs encryption
    Type: String

  BucketName:
    Description: Name of the existing S3 bucket containing all project artifacts
    Type: String

Conditions:
  ShouldCreateEMRContainersServiceLinkedRole: !Equals
    - !Ref CreateEMRContainersServiceLinkedRole
    - "true"

Resources:
  # Single IAM Role for both Spark job clusters
  # cdk-nag AwsSolutions-IAM5: Wildcard permissions needed for dynamic EMR log groups
  EMRContainersJobRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: "Explicit name required for EMR job execution role as it needs to be referenced consistently across the application"
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-IAM5
            reason: "Wildcard permissions are required for CloudWatch Logs as the specific log groups are created dynamically by EMR services"
    Properties:
      RoleName: EMRContainers-JobExecutionRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Note: OIDC provider trust relationship for EKS service account is added post-deployment via update_role_trust_policy() in
          # /infrastructure/setup-infra.sh script.
          # This approach is taken because CloudFormation has limitations with complex condition blocks in trust policies,
          # particularly when using dynamic OIDC provider URLs with multiple conditions. Separating this concern ensures
          # reliable stack deployment while maintaining the required security configuration.
          - Effect: Allow
            Principal:
              Service: elasticmapreduce.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: EMRContainersJobPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "logs:CreateLogGroup"
                  - "logs:CreateLogStream"
                  - "logs:PutLogEvents"
                  - "logs:DescribeLogGroups"
                  - "logs:DescribeLogStreams"
                Resource: "arn:aws:logs:*:*:*"
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource: !Ref CommonKMSKeyArn
              # S3 permissions
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${BucketName}"
                  - !Sub "arn:${AWS::Partition}:s3:::${BucketName}/*"

      Tags:
        - Key: ProjectName
          Value: !Ref ProjectName

  # AWSServiceRoleForAmazonEMRContainers
  # cdk-nag AwsSolutions-IAM5: Wildcard permissions needed for service-linked role
  # cdk-nag AwsSolutions-IAM4: AWS managed policy required for service-linked role
  AWSServiceRoleForEMRContainers:
    Type: AWS::IAM::Role
    Condition: ShouldCreateEMRContainersServiceLinkedRole
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: "Explicit name required as this is a service-linked role with a specific required name"
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-IAM5
            reason: "This is a service-linked role that uses AWS managed policies with predefined permissions"
          - id: AwsSolutions-IAM4
            reason: "This is a service-linked role that requires the AWS managed policy AmazonEMRContainersServiceRolePolicy"
    Properties:
      RoleName: AWSServiceRoleForAmazonEMRContainers
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: emr-containers.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/aws-service-role/AmazonEMRContainersServiceRolePolicy
      Policies:
        - PolicyName: KMSAccessForLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource: !Ref CommonKMSKeyArn
      Tags:
        - Key: ProjectName
          Value: !Ref ProjectName

Outputs:
  EMRContainersJobRoleArn:
    Description: ARN of the IAM Role for EMR Containers jobs
    Value: !GetAtt EMRContainersJobRole.Arn