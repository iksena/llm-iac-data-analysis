AWSTemplateFormatVersion: "2010-09-09"
Description: Webhosting resources for JankenHockey (S3 Bucket, CloudFront)

Parameters:
  RestApiId:
    Type: String
    Description: ApiId for JankenHockeyRestAPI

Resources:
  ## S3
  # S3 Bucket
  JankenHockeyBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: RetainExceptOnCreate
    Properties:
      BucketName: janken-hockey-website-bucket
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: error.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: JankenHockey

  # S3 Bucket Policy
  JankenHockeyBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref JankenHockeyBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontAccess
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action:
              - s3:GetObject
            Resource: !Sub "arn:aws:s3:::${JankenHockeyBucket}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${JankenHockeyCloudFrontDistribution}"

  ## CloudFront
  # Origin Access Control
  JankenHockeyOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    DeletionPolicy: RetainExceptOnCreate
    Properties:
      OriginAccessControlConfig:
        Name: JankenHockeyOAC
        OriginAccessControlOriginType: s3
        SigningProtocol: sigv4
        SigningBehavior: always

  # CloudFront Distribution
  JankenHockeyCloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    DeletionPolicy: RetainExceptOnCreate
    Properties:
      DistributionConfig:
        Enabled: true
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt JankenHockeyBucket.DomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !Ref JankenHockeyOriginAccessControl
          - Id: ApiOrigin
            DomainName: !Sub "${RestApiId}.execute-api.${AWS::Region}.amazonaws.com"
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        CacheBehaviors:
          - PathPattern: /apiprod/*
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - POST
              - PATCH
              - DELETE
            CachedMethods:
              - GET
              - HEAD
              - OPTIONS
            ForwardedValues:
              QueryString: true
              Headers:
                - Authorization
                - Content-Type
                - Accept
                - X-Api-Key
              Cookies:
                Forward: all
            MinTTL: 0
            DefaultTTL: 0
            MaxTTL: 0
        CustomErrorResponses:
          - ErrorCode: 403
            ResponsePagePath: /index.html
            ResponseCode: 200
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponsePagePath: /index.html
            ResponseCode: 200
            ErrorCachingMinTTL: 0
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
        DefaultRootObject: index.html
      Tags:
        - Key: Project
          Value: JankenHockey

Outputs:
  JankenHockeyBucketName:
    Description: The name of the S3 bucket for JankenHockey website
    Value: !Ref JankenHockeyBucket

  JankenHockeyCloudFrontDistributionId:
    Description: The ID of the CloudFront distribution for JankenHockey website
    Value: !Ref JankenHockeyCloudFrontDistribution

  JankenHockeyCloudFrontOriginUrl:
    Description: The origin URL of the CloudFront distribution for JankenHockey website
    Value: !Sub "https://${JankenHockeyCloudFrontDistribution.DomainName}"