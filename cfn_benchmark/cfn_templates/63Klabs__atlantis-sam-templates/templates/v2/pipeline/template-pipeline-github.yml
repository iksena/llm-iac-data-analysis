AWSTemplateFormatVersion: "2010-09-09"
Description: "CodePipeline for Automated Deployments from GitHub repository - Deployed using SAM"

# Atlantis for AWS SAM Deployments
# Pipeline Infrastructure Template
# Author: Chad Kluck - 63klabs.net
# Version: v2.0.3/2026-03-26

# Documentation, Issues/Feature Requests, Latest Updates, and Security Reports on GitHub:
# https://github.com/63Klabs/atlantis-sam-templates/

# Creates an AWS CodePipeline that is triggered when a watched branch
# receives a new commit. Uses CodeBuild and then CloudFormation to deploy.

# USE WITH:
# - Application Infrastructure (API Gateway, Event Bridge, Lambda, Step Functions, S3, DynamoDB, etc)
# - OPTIONAL: Route53 and CloudFront for custom domains

# =============================================================================
# META DATA
# -----------------------------------------------------------------------------
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-cloudformation-interface.html
#

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      -
        Label:
          default: "Application Resource Naming"
        Parameters:
          - Prefix
          - ProjectId
          - StageId
          - S3BucketNameOrgPrefix
          - RolePath
          - PermissionsBoundaryArn
      -
        Label:
          default: "Deployment Environment Information"
        Parameters:
          - DeployEnvironment
          - S3ArtifactsBucket
          - S3StaticHostBucket
          - BuildSpec
      -
        Label:
          default: "Post Deploy Environment Information"
        Parameters:
          - PostDeployStageEnabled
          - PostDeployS3StaticHostBucket
          - PostDeployBuildSpec
      -
        Label:
          default: "External Resources"
        Parameters:
          - ParameterStoreHierarchy
          - AlarmNotificationEmail
          - CodeBuildSvcRoleIncludeManagedPolicyArns
          - CloudFormationSvcRoleIncludeManagedPolicyArns
          - PostDeploySvcRoleIncludeManagedPolicyArns
      -
        Label:
          default: "Code Repository"
        Parameters:
          - Repository
          - RepositoryBranch
          - GitHubConnectionArn

# =============================================================================
# PARAMETERS
# -----------------------------------------------------------------------------
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/parameters-section-structure.html
#

Parameters:

  # ---------------------------------------------------------------------------
  # Application Resource Naming
  #
  # General Practice:
  # - Prefix max 8 characters
  # - ProjectId max 20 characters
  # - StageId max 8 characters
  # - Hyphen between Prefix, ProjectId, StageId, ResourceId is 3 characters
  # This adds up to 39 characters leaving 24 characters for the resource identifier (Used at end of resource name such as *-SalesData or *-CfnSvcRole).
  # For buckets without S3 Org Prefixes, the length of the bucket resource identifier is limited to 2 (Region + Acct takes up ~22 on their own).
  # Try to keep the length of the S3 bucket prefix and resource identifier to a minimum for bucket names.

  Prefix:
    Type: String
    Description: "Prefix pre-pended to all resources. This can be thought of as a Name Space used to identify ownership/access for teams, departments, etc. For example, resources named ws-* could belong to the web service team and could have IAM permissions to allow access to other ws-* resources. The Prefix must have a corresponding CloudFormation Service Role. Short, descriptive 2-6 character values work best. Due to resource naming length restrictions, length of Prefix + Project ID should not exceed 28 characters. Resources are named <Prefix>-<ProjectId>-<StageId>-<ResourceId>"
    Default: "acme"
    AllowedPattern: "^[a-z][a-z0-9-]{0,6}[a-z0-9]$"
    MinLength: 2
    MaxLength: 8
    ConstraintDescription: "2 to 8 characters. Lower case alphanumeric and dashes. Must start with a letter and end with a letter or number. Length of Prefix + Project ID should not exceed 28 characters."

  ProjectId:
    Type: String
    Description: "This is the Project or Application Identifier. If you receive 'S3 bucket name too long' errors during stack creation, then you must shorten the Project ID or use an S3 Org Prefix. Due to resource naming length restrictions, length of Prefix + Project ID should not exceed 28 characters. Resources are named <Prefix>-<ProjectId>-<StageId>-<ResourceId>"
    AllowedPattern: "^[a-z][a-z0-9-]{0,24}[a-z0-9]$"
    MinLength: 2
    MaxLength: 26
    ConstraintDescription: "Minimum of 2 characters (suggested maximum of 20). Lower case alphanumeric and dashes. Must start with a letter and end with a letter or number. Length of Prefix + Project ID should not exceed 28 characters."

  StageId:
    Type: String
    Description: "This is an alias for the branch. It does not need to match RepositoryBranch or DeployEnvironment. Due to resource naming restrictions you can use this to provide shorter names without special characters that are allowed in branch names. For example if you have a 'test/feature-98' branch, you could use 'tf98' as the StageId. Resources are named <Prefix>-<ProjectId>-<StageId>-<ResourceId>"
    AllowedPattern: "^[a-z][a-z0-9-]{0,6}[a-z0-9]$"
    MinLength: 2
    MaxLength: 8
    ConstraintDescription: "2 to 8 characters. Lower case alphanumeric and dashes. Must start with a letter and end with a letter or number."

  S3BucketNameOrgPrefix:
    Type: String
    Description: "By default, to enforce uniqueness, buckets include account and region in the bucket name. However, due to character limits, you can specify your own S3 prefix (like an org code). This will be used in addition to the Prefix entered above. Note that this length is shared with the recommended length of 20 characters for Resource Identifiers. So if you have a 10 character S3BucketNameOrgPrefix, you are limited to 10 characters for your bucket name identifier in your templates. Buckets are named <Prefix>-<Region>-<AccountId>-<ProjectId>-<StageId>-<ResourceId> or <S3OrgPrefix>-<Prefix>-<ProjectId>-<StageId>-<ResourceId>"
    Default: ""
    AllowedPattern: "^[a-z0-9][a-z0-9-]{0,18}[a-z0-9]$|^$"
    ConstraintDescription: "May be empty or 2 to 20 characters (8 or less recommended). Lower case alphanumeric and dashes. Must start and end with a letter or number."

  RolePath:
    Type: String
    Description: "Path to use for IAM Roles and Policies. You may wish to separate out your applications from users, or create seperate paths per prefix or application. Specific paths may required by permission boundaries. Ex: /ws-hello-world-test/ or /app_role/"
    Default: "/"
    AllowedPattern: "^\\/([a-zA-Z0-9-_]+[\\/])+$|^\\/$"
    ConstraintDescription: "May only contain alphanumeric characters, forward slashes, underscores, and dashes. Must begin and end with a slash."

  PermissionsBoundaryArn:
    Type: String
    Description: "Permissions Boundary is a policy attached to a role to further restrict the permissions of the role. Your organization may or may not require boundaries. If left empty, no permissions boundary will be used."
    Default: ""
    AllowedPattern: "^$|^arn:aws:iam::\\d{12}:policy\\/[\\w+=,.@\\-\\/]*[\\w+=,.@\\-]+$"
    ConstraintDescription: "Must be empty or a valid IAM Policy ARN in the format: arn:aws:iam::{account_id}:policy/{policy_name}"

  # ---------------------------------------------------------------------------
  # Deployment Environment Identification

  DeployEnvironment:
    Type: String
    Description: "What deploy/testing environment will this run under? An environment can contain multiple stages (for example 'test' and 't98' would be in 'TEST' environment, and 'beta' and 'prod' stages would deploy to 'PROD'). Utilize this environment variable to determine your tests, app logging levels, and conditionals in the template. For example, PROD will use gradual deployment while DEV and TEST is AllAtOnce. Other resources, such as dashboards and alarms  (which cost money) could be created in PROD and not DEV or TEST. Suggested use: DEV for local SAM deployment, TEST for test/QA deployments, PROD for stage, beta, and main/prod deployments."
    Default: "PROD"
    AllowedValues: ["DEV", "TEST", "PROD"]
    ConstraintDescription: "Must specify DEV, TEST, or PROD."

  S3ArtifactsBucket:
    Type: String
    Description: "An already existing S3 bucket name to save build artifacts to. Must be in the same AWS account and region as the stack. When you first use SAM deploy it typically creates one for you in the format of cf-templates-something-us-east-1. You can use a different bucket as well."
    AllowedPattern: "^[a-z0-9][a-z0-9-]{0,62}[a-z0-9]$"
    ConstraintDescription: "May only contain alphanumeric characters, dashes, and must begin and end with a letter or number."

  S3StaticHostBucket:
    Type: String
    Description: "An already existing S3 bucket name the build and deploy stage will copy files to. Passed as S3_STATIC_HOST_BUCKET to CodeBuild. Can be left blank if CodeBuild will programmatically construct the bucket name, or doesn't need a S3_STATIC_HOST_BUCKET value."
    Default: ""
    AllowedPattern: "^[a-z0-9][a-z0-9-]{0,62}[a-z0-9]$|^$"
    ConstraintDescription: "May only contain alphanumeric characters, dashes, and must begin and end with a letter or number."

  BuildSpec:
    Type: String
    Description: "The local or S3 URI of the CodeBuild buildspec.yml file. For example, 'buildspec.yml', 'application-infrastructure/buildspec.yml' or 's3://mybucket/buildspec.yml'. Best practice is to have a single buildspec file for all deployments. This option exists if you cannot store your buildspec file with your source code OR wish to use a central buildspec for a group of deployments. This is not for managing multiple buildspecs on a single repo. Default is buildspec.yml, and blank will use the default buildspec.yml in the root of the repository. Though Source.BuildSpec uses an ARN for S3 locations, an S3 url is requested to make it easier to parse for permissions and other uses."
    Default: "application-infrastructure/buildspec.yml"
    AllowedPattern: "^s3:\\/\\/[a-zA-Z0-9][a-zA-Z0-9\\-]{1,61}[a-zA-Z0-9]\\/.*$|^([a-zA-Z0-9][a-zA-Z0-9_\\-\\/]*)?(buildspec\\.yml)$|^$"
    ConstraintDescription: "Must be a valid S3 URI or a local path ending with 'buildspec.yml'. For example, 'buildspec.yml', 'application-infrastructure/buildspec.yml' or 's3://mybucket/buildspec.yml'. May not be empty."

  # ---------------------------------------------------------------------------
  # Post Deployment Environment

  PostDeployStageEnabled:
    Type: String
    Description: "Controls whether the PostDeploy stage is created and included in the pipeline. When enabled, creates a final stage to run integration tests, configuration checks, or export configurations (such as export OpenAPI specifications from API Gateway to an external bucket for static documentation generation). This should only be used for tasks that require a deployment first. Pre-deploy tasks should be done in the Build stage. Setting to 'true' creates PostDeployServiceRole, PostDeployProject, PostDeployLogGroup, and adds the PostDeploy stage to the pipeline."
    Default: "false"
    AllowedValues: ["true", "false"]
    ConstraintDescription: "Must specify true or false."

  PostDeployS3StaticHostBucket:
    Type: String
    Description: "An already existing S3 bucket name the PostDeploy stage will copy files to. Passed as POST_DEPLOY_S3_STATIC_HOST_BUCKET environment variable to the PostDeploy CodeBuild project. Can be left blank if CodeBuild will programmatically construct the bucket name, or doesn't need this environment variable. Used primarily to store artifacts that will be picked up by another process such as static API specification documentation or exported configuration files."
    Default: ""
    AllowedPattern: "^[a-z0-9][a-z0-9-]{0,62}[a-z0-9]$|^$"
    ConstraintDescription: "May only contain alphanumeric characters, dashes, and must begin and end with a letter or number."

  PostDeployBuildSpec:
    Type: String
    Description: "The local or S3 URI of the buildspec file for the PostDeploy stage. For example, 'application-infrastructure/buildspec-postdeploy.yml', 'buildspec-postdeploy.yml' or 's3://mybucket/buildspec-postdeploy.yml'. Best practice is to have a single file for all instances of an application. This option exists if you cannot store your buildspec-postdeploy file with your source code OR wish to use a central buildspec-postdeploy for a group of deployments. Default is 'application-infrastructure/buildspec-postdeploy.yml', and leaving blank will use the SAM default buildspec-postdeploy.yml in the root of the repository. For S3 use an S3 URL (S3://) rather than an ARN."
    Default: "application-infrastructure/buildspec-postdeploy.yml"
    AllowedPattern: "^s3:\\/\\/[a-zA-Z0-9][a-zA-Z0-9\\-]{1,61}[a-zA-Z0-9]\\/.*$|^([a-zA-Z0-9][a-zA-Z0-9_\\-\\/]*)?(buildspec-postdeploy\\.yml)$|^$"
    ConstraintDescription: "Must be a valid S3 URI or a local path ending with 'buildspec-postdeploy.yml'. For example, 'buildspec-postdeploy.yml', 'application-infrastructure/buildspec-postdeploy.yml' or 's3://mybucket/buildspec-postdeploy.yml'. May not be empty."

  # ---------------------------------------------------------------------------
  # External Resources and Alarm Notifications

  ParameterStoreHierarchy:
    Type: String
    Description: "Parameters specific to the application may be organized within a hierarchy based on your organizational or operations structure. For example, /Finance/ops/ for this value would then generate /Finance/ops/<DeployEnvironment>/<Prefix>-<ProjectId>-<StageId>/<parameterName>. Must either be a single '/' or begin and end with a '/'."
    Default: "/"
    AllowedPattern: "^\\/([a-zA-Z0-9_.\\-]*[\\/])*$|^$"
    ConstraintDescription: "Must only contain alpha-numeric, dashes, underscores, or slashes. Must be a single slash or begin and end with a slash. (/Finance/, /Finance/ops/, or /)"

  AlarmNotificationEmail:
    Type: String
    Description: "Email address to send notifications to when alarms are triggered. Be sure to check the inbox as you will need to confirm the subscription."
    AllowedPattern: "^[\\w\\-\\.]+@([\\w\\-]+\\.)+[\\w\\-]{2,4}$"
    ConstraintDescription: "A valid email address"

  CloudFormationSvcRoleIncludeManagedPolicyArns:
    Type: CommaDelimitedList
    Description: "List of IAM Managed Policy ARNs to add to the CloudFormation Service Role. Use when external resources provide policies to interact with them."
    Default: ""
    AllowedPattern: "^$|^arn:aws:iam::\\d{12}:policy\\/[a-zA-Z0-9_\\-]+(?:\\/[a-zA-Z0-9_\\-]+)*$"
    ConstraintDescription: "Must be an empty string or comma delimited valid IAM Policy ARNs in the format: arn:aws:iam::{account_id}:policy/{policy_name}"

  CodeBuildSvcRoleIncludeManagedPolicyArns:
    Type: CommaDelimitedList
    Description: "List of IAM Managed Policy ARNs to add to the CodeBuild Service Role. Use when external resources provide policies to interact with them."
    Default: ""
    AllowedPattern: "^$|^arn:aws:iam::\\d{12}:policy\\/[a-zA-Z0-9_\\-]+(?:\\/[a-zA-Z0-9_\\-]+)*$"
    ConstraintDescription: "Must be an empty string or comma delimited valid IAM Policy ARNs in the format: arn:aws:iam::{account_id}:policy/{policy_name}"

  PostDeploySvcRoleIncludeManagedPolicyArns:
    Type: CommaDelimitedList
    Description: "List of IAM Managed Policy ARNs to add to the Post Deploy Stage Service Role. Use when external resources provide policies to interact with them."
    Default: ""
    AllowedPattern: "^$|^arn:aws:iam::\\d{12}:policy\\/[a-zA-Z0-9_\\-]+(?:\\/[a-zA-Z0-9_\\-]+)*$"
    ConstraintDescription: "Must be an empty string or comma delimited valid IAM Policy ARNs in the format: arn:aws:iam::{account_id}:policy/{policy_name}"

  # ---------------------------------------------------------------------------
  # Code Repository
  # Used only by this template-pipeline and not passed on to application infrastructure stack except as tags

  Repository:
    Type: String
    Description: "For GitHub: owner/repository (e.g., 'username/my-repo')"
    MinLength: 2
    AllowedPattern: "^[a-zA-Z0-9][a-zA-Z0-9_\\-]{0,62}[a-zA-Z0-9]\\/[a-zA-Z0-9][a-zA-Z0-9_\\-]{0,62}[a-zA-Z0-9]$"
    ConstraintDescription: "Must be a valid owner/repository format for GitHub"

  RepositoryBranch:
    Type: String
    Description: What branch of CodeCommit will be used? Typically this is the same name as the stage, but may be different if there are multiple deploys operating off the same branch.
    Default: "main"
    AllowedPattern: "^[a-zA-Z0-9][a-zA-Z0-9_\\-\\/]{0,14}[a-zA-Z0-9]$"
    ConstraintDescription: "Must be a valid CodeCommit branch name"

  GitHubConnectionArn:
    Type: String
    Description: "The ARN of the GitHub connection to use for the repository. If you don't have a GitHub connection, you must create one first. The ARN is in the GitHub connection details page."
    AllowedPattern: "^arn:aws:codeconnections:\\S+:\\d{12}:connection\\/\\S+$"
    ConstraintDescription: "A valid ARN for a GitHub connection."

# =============================================================================
# MAPPINGS
# -----------------------------------------------------------------------------
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/mappings-section-structure.html
#
Mappings:
  LambdaInsightsAccountId:
    us-east-1:
      AccountId: "580247275435"
    us-east-2:
      AccountId: "580247275435"
    us-west-1:
      AccountId: "580247275435"
    us-west-2:
      AccountId: "580247275435"
    af-south-1:
      AccountId: "012438385374"
    # Add more regions as needed
    # https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/Lambda-Insights-extension-versions.html

  LambdaParamSecretsAccountId:
    us-east-1:
      AccountId: "177933569100"
    us-east-2:
      AccountId: "590474943231"
    us-west-1:
      AccountId: "997803712105"
    us-west-2:
      AccountId: "345057560386"
    af-south-1:
      AccountId: "317013901791"
    # Add more regions as needed
    # https://docs.aws.amazon.com/systems-manager/latest/userguide/ps-integration-lambda-extensions.html#ps-integration-lambda-extensions-add

# =============================================================================
# CONDITIONS
# -----------------------------------------------------------------------------
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/intrinsic-function-reference-conditions.html
#

Conditions:
  IsNotDevelopment: !Not [!Equals [!Ref DeployEnvironment, "DEV"]]
  # IsDevelopment: !Equals [!Ref DeployEnvironment, "DEV"] # currently unused - uncomment if you have a use for it
  UseS3BucketNameOrgPrefix: !Not [!Equals [!Ref S3BucketNameOrgPrefix, ""]]
  HasPermissionsBoundaryArn: !Not [!Equals [!Ref PermissionsBoundaryArn, ""]]

  HasS3StaticHostBucket: !Not [!Equals [!Ref S3StaticHostBucket, ""]]
  HasS3BuildSpecLocation: !And
    - !Not [!Equals [!Ref BuildSpec, ""]]
    - !Equals [!Select [0, !Split [":", !Ref BuildSpec]], "s3"]
  UseDefaultBuildSpecLocation: !Equals [!Ref BuildSpec, ""]
  HasManagedPoliciesForCodeBuildSvcRole: !Not [!Equals [!Join [",", !Ref CodeBuildSvcRoleIncludeManagedPolicyArns], ""]]

  # PostDeploy Conditional Logic
  # These conditions control when PostDeploy resources are created and the stage is included in the pipeline
  IsPostDeployEnabled: !Equals [!Ref PostDeployStageEnabled, "true"]
  HasPostDeployS3StaticHostBucket: !Not [!Equals [!Ref PostDeployS3StaticHostBucket, ""]]
  HasPostDeployBuildSpecS3Location: !And
    - !Condition IsPostDeployEnabled
    - !Not [!Equals [!Ref PostDeployBuildSpec, ""]]
    - !Equals [!Select [0, !Split [":", !Ref PostDeployBuildSpec]], "s3"]
  UseDefaultPostDeployBuildSpecLocation: !Equals [!Ref PostDeployBuildSpec, ""]
  HasManagedPoliciesForPostDeploySvcRole: !Not [!Equals [!Join [",", !Ref PostDeploySvcRoleIncludeManagedPolicyArns], ""]]

  HasManagedPoliciesForCloudFormationSvcRole: !Not [!Equals [!Join [",", !Ref CloudFormationSvcRoleIncludeManagedPolicyArns], ""]]

  # Combined conditions for resource creation
  IsPostDeployEnabledAndNotDev: !And [!Condition IsNotDevelopment, !Condition IsPostDeployEnabled]

# =============================================================================
# RESOURCES
# -----------------------------------------------------------------------------
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/resources-section-structure.html
#

Resources:

  # ---------------------------------------------------------------------------
  # -- IAM Service Roles and Policies --
  # --
  # AWS CodePipeline and its resources require permissions perform operations
  # --
  # Practice The Principle of Least Privilege
  # IAM policies should be scoped down to give only necessary actions on
  # resources specific to this deployment.
  # --

  # -- SourceEventServiceRole --

  SourceEventServiceRole:
    Type: AWS::IAM::Role
    Condition: IsNotDevelopment
    Properties:
      Path: !Ref RolePath
      RoleName: !Sub "${Prefix}-Worker-${ProjectId}-${StageId}-SourceEventServiceRole"
      Description: "Service Role to allow Events to trigger AWS CodePipeline execution"
      PermissionsBoundary: !If [HasPermissionsBoundaryArn, !Ref PermissionsBoundaryArn, !Ref 'AWS::NoValue' ]
      AssumeRolePolicyDocument:
        Statement:
        - Sid: "EventTrustPolicy"
          Effect: Allow
          Action: sts:AssumeRole
          Principal:
            Service:
            - events.amazonaws.com
      Policies:
      - PolicyName: !Sub "${Prefix}-Worker-${ProjectId}-${StageId}-SourceEventServicePolicy"
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
          - Action:
            - codepipeline:StartPipelineExecution
            Effect: Allow
            Resource:
            - !Sub "arn:aws:codepipeline:${AWS::Region}:${AWS::AccountId}:${Prefix}-${ProjectId}-${StageId}-Pipeline"

  # -- CodePipeline Service Role --

  CodePipelineServiceRole:
    Type: AWS::IAM::Role
    Condition: IsNotDevelopment
    Properties:
      Path: !Ref RolePath
      RoleName: !Sub "${Prefix}-Worker-${ProjectId}-${StageId}-CodePipelineServiceRole"
      Description: "Service Role to access resources during execution of AWS CodePipeline to get, build, and deploy application infrastructure"
      PermissionsBoundary: !If [HasPermissionsBoundaryArn, !Ref PermissionsBoundaryArn, !Ref 'AWS::NoValue' ]
      AssumeRolePolicyDocument:
        Statement:
        - Sid: "CodePipelineTrustPolicy"
          Effect: Allow
          Action: sts:AssumeRole
          Principal:
            Service:
            - codepipeline.amazonaws.com
      Policies:
      - PolicyName: !Sub "${Prefix}-Worker-${ProjectId}-${StageId}-CodePipelineServicePolicy"
        PolicyDocument:
          Version: "2012-10-17"
          Statement:

          - Sid: BuildPhase
            Action:
            - codebuild:*
            Effect: Allow
            Resource:
            - !Sub "arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:project/${Prefix}-${ProjectId}-${StageId}-Build"
            - !Sub "arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:project/${Prefix}-${ProjectId}-${StageId}-PostDeploy"

          - Sid: CodeBuildReportGroup
            Action:
            - codebuild:*
            Effect: Allow
            Resource:
            - !Sub "arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:report-group/*"
            Condition:
              StringEquals:
                "aws:ResourceTag/atlantis:ApplicationDeploymentId": !Sub "${Prefix}-${ProjectId}-${StageId}"

          - Sid: DeployPhaseCloudFormation
            Action:
            - cloudformation:*
            Effect: Allow
            Resource:
            - !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${Prefix}-${ProjectId}-${StageId}-application/*"
            - !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stackset/${Prefix}-${ProjectId}-${StageId}-application:*"

          - Sid: ManageArtifactsInS3
            Action:
            - s3:Get*
            - s3:List*
            - s3:PutObject
            Effect: Allow
            Resource:
            - !Sub "arn:aws:s3:::${S3ArtifactsBucket}"
            - !Sub "arn:aws:s3:::${S3ArtifactsBucket}/*"

          - Sid: PassRole
            Action:
            - iam:PassRole
            Effect: Allow
            Resource:
            - !GetAtt 'CloudFormationSvcRole.Arn'

          - Sid: CodeConnectionsAccess
            Effect: Allow
            Action:
            - codeconnections:UseConnection
            - codestar-connections:UseConnection # deprecated, but the Pipeline Source Stage only works if using CodeStar
            Resource: !Ref GitHubConnectionArn

  # -- CodeBuild Service Role --

  CodeBuildServiceRole:
    Type: AWS::IAM::Role
    Condition: IsNotDevelopment
    Properties:
      Path: !Ref RolePath
      RoleName: !Sub "${Prefix}-Worker-${ProjectId}-${StageId}-CodeBuildServiceRole"
      Description: "Service Role to access resources during the application infrastructure build phase of AWS CodePipeline"
      PermissionsBoundary: !If [HasPermissionsBoundaryArn, !Ref PermissionsBoundaryArn, !Ref 'AWS::NoValue' ]
      ManagedPolicyArns: !If [HasManagedPoliciesForCodeBuildSvcRole, !Ref CodeBuildSvcRoleIncludeManagedPolicyArns, !Ref 'AWS::NoValue' ]
      AssumeRolePolicyDocument:
        Statement:
        - Sid: "CodeBuildTrustPolicy"
          Effect: Allow
          Action: sts:AssumeRole
          Principal:
            Service: codebuild.amazonaws.com
      Policies:
      - PolicyName: !Sub "${Prefix}-Worker-${ProjectId}-${StageId}-CodeBuildServicePolicy"
        PolicyDocument:
          Version: "2012-10-17"
          Statement:

          - Sid: "AllowCodeBuildToManageItsLogs"
            Effect: Allow
            Action:
            - logs:*
            Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${Prefix}-${ProjectId}-${StageId}-Build:*"

          - Sid: "AllowCodeBuildToManageItsArtifacts"
            Effect: Allow
            Action:
            - s3:Get*
            - s3:List*
            - s3:PutObject
            Resource:
            - !Sub "arn:aws:s3:::${S3ArtifactsBucket}"
            - !Sub "arn:aws:s3:::${S3ArtifactsBucket}/*"

          - Sid: "SsmAccessDuringCodeBuild"
            Action:
            - ssm:PutParameter # for generating tokens and keys
            - ssm:AddTagsToResource
            - ssm:GetParameters
            - ssm:GetParameter
            - ssm:GetParametersByPath
            - ssm:ListTagsForResource
            Effect: Allow
            Resource:
              !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParameterStoreHierarchy}${DeployEnvironment}/${Prefix}-${ProjectId}-${StageId}/*"

          # == SSM AWS Service Public Parameters (Read-Only) ==
          - Sid: "SsmAwsPublicParameterReadOnly"
            Action:
            - ssm:GetParameter
            - ssm:GetParameters
            Effect: Allow
            Resource:
              !Sub "arn:aws:ssm:${AWS::Region}::parameter/aws/service/*"

          # We have 4 permissions sets that will allow us to copy objects (such as static assets) over to S3.

          - Sid: "AllowListBuckets"
            Effect: Allow
            Action:
            - s3:ListBucket
            Resource:
            - "arn:aws:s3:::*"

          # General buckets for many application projects with paths devoted to applications
          - Sid: CopyAssetsToS3DuringBuildByPath
            Action:
            - s3:PutObject
            - s3:Get*
            - s3:List*
            - s3:DeleteObject
            Effect: Allow
            Resource:
            - !Sub "arn:aws:s3:::*/${Prefix}-${ProjectId}/${StageId}/*"
            - !Sub "arn:aws:s3:::*/${Prefix}-${ProjectId}-${StageId}/*"
            - !Sub "arn:aws:s3:::*/${Prefix}/${ProjectId}/${StageId}/*"

          # A bucket devoted to the application project shared among all deployments of the application
          - Sid: CopyAssetsToS3DuringBuildByBucketApplicationTag
            Action:
            - s3:PutObject
            - s3:Get*
            - s3:List*
            - s3:DeleteObject
            Effect: Allow
            Resource: !Sub
              - "arn:aws:s3:::${OrgPrefix}${Prefix}-${ProjectId}-*/${StageId}/*"
              - OrgPrefix: !If [UseS3BucketNameOrgPrefix, !Sub "${S3BucketNameOrgPrefix}-", ""]

          # A bucket devoted to the specific application deployment
          - Sid: CopyAssetsToS3DuringBuildByBucketApplicationDeploymentTag
            Action:
            - s3:PutObject
            - s3:Get*
            - s3:List*
            - s3:DeleteObject
            Effect: Allow
            Resource: !Sub
              - "arn:aws:s3:::${OrgPrefix}${Prefix}-${ProjectId}-${StageId}-*/*"
              - OrgPrefix: !If [UseS3BucketNameOrgPrefix, !Sub "${S3BucketNameOrgPrefix}-", ""]

          # A S3StaticHostBucket if HasS3StaticHostBucket condition is met
          # create a policy statement if HasS3StaticHostBucket condition is met
          - !If
            - HasS3StaticHostBucket
            - Sid: CopyAssetsToS3HostBucketDuringBuild
              Action:
              - s3:PutObject
              - s3:Get*
              - s3:List*
              - s3:DeleteObject
              Effect: Allow
              Resource:
                - !Sub "arn:aws:s3:::${S3StaticHostBucket}"
                - !Sub "arn:aws:s3:::${S3StaticHostBucket}/*"
            - !Ref 'AWS::NoValue'

          # Copy and read from a remote bucket containing the buildspec.yml file
          - !If
            - HasS3BuildSpecLocation
            - Sid: CopyBuildSpecFromS3ForBuild
              Action:
              - s3:Get*
              - s3:List*
              Effect: Allow
              Resource:
                - !Join
                  - ""
                  - - "arn:aws:s3:::"
                    - !Select [0, !Split ["/", !Select [1, !Split ["s3://", !Ref BuildSpec]]]]
                # Specific file permission - exact path to the buildspec file
                - !Join
                  - ""
                  - - "arn:aws:s3:::"
                    - !Select [1, !Split ["s3://", !Ref BuildSpec]]

            - !Ref 'AWS::NoValue'

  # -- PostDeploy Service Role --
  #
  # CONDITIONAL RESOURCE: Only created when PostDeployStageEnabled="true"
  # This IAM role provides the PostDeploy CodeBuild project with permissions to:
  # - Manage its CloudWatch logs
  # - Access S3 artifacts bucket for input/output artifacts
  # - Access SSM Parameter Store for application configuration
  # - Copy assets to various S3 buckets (similar to Build stage permissions)
  # - Access S3 buildspec file when using remote buildspec location
  #
  # The permissions mirror the CodeBuildServiceRole to ensure consistent capabilities
  # between Build and PostDeploy stages.

  PostDeployServiceRole:
    Type: AWS::IAM::Role
    Condition: IsPostDeployEnabledAndNotDev
    Properties:
      Path: !Ref RolePath
      RoleName: !Sub "${Prefix}-Worker-${ProjectId}-${StageId}-PostDeployServiceRole"
      Description: "Service Role to access resources during the application infrastructure PostDeploy phase of AWS CodePipeline. Only created when PostDeployStageEnabled is true. Provides similar permissions to CodeBuildServiceRole for consistent execution environment."
      PermissionsBoundary: !If [HasPermissionsBoundaryArn, !Ref PermissionsBoundaryArn, !Ref 'AWS::NoValue' ]
      ManagedPolicyArns: !If [HasManagedPoliciesForPostDeploySvcRole, !Ref PostDeploySvcRoleIncludeManagedPolicyArns, !Ref 'AWS::NoValue' ]
      AssumeRolePolicyDocument:
        Statement:
        - Sid: "PostDeployTrustPolicy"
          Effect: Allow
          Action: sts:AssumeRole
          Principal:
            Service: codebuild.amazonaws.com
      Policies:
      - PolicyName: !Sub "${Prefix}-Worker-${ProjectId}-${StageId}-PostDeployServicePolicy"
        PolicyDocument:
          Version: "2012-10-17"
          Statement:

          - Sid: "AllowPostDeployToManageItsLogs"
            Effect: Allow
            Action:
            - logs:*
            Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${Prefix}-${ProjectId}-${StageId}-PostDeploy:*"

          - Sid: "AllowPostDeployToManageItsArtifacts"
            Effect: Allow
            Action:
            - s3:Get*
            - s3:List*
            - s3:PutObject
            Resource:
            - !Sub "arn:aws:s3:::${S3ArtifactsBucket}"
            - !Sub "arn:aws:s3:::${S3ArtifactsBucket}/*"

          - Sid: "SsmAccessDuringPostDeploy"
            Action:
            - ssm:PutParameter # for generating tokens and keys
            - ssm:AddTagsToResource
            - ssm:GetParameters
            - ssm:GetParameter
            - ssm:GetParametersByPath
            - ssm:ListTagsForResource
            Effect: Allow
            Resource:
              !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParameterStoreHierarchy}${DeployEnvironment}/${Prefix}-${ProjectId}-${StageId}/*"

          # == SSM AWS Service Public Parameters (Read-Only) ==
          - Sid: "SsmAwsPublicParameterReadOnly"
            Action:
            - ssm:GetParameter
            - ssm:GetParameters
            Effect: Allow
            Resource:
              !Sub "arn:aws:ssm:${AWS::Region}::parameter/aws/service/*"

          # We have 4 permissions sets that will allow us to copy objects (such as static assets) over to S3.

          - Sid: "AllowListBuckets"
            Effect: Allow
            Action:
            - s3:ListBucket
            Resource:
            - "arn:aws:s3:::*"

          # General buckets for many application projects with paths devoted to applications
          - Sid: CopyAssetsToS3DuringPostDeployByPath
            Action:
            - s3:PutObject
            - s3:Get*
            - s3:List*
            - s3:DeleteObject
            Effect: Allow
            Resource:
            - !Sub "arn:aws:s3:::*/${Prefix}-${ProjectId}/${StageId}/*"
            - !Sub "arn:aws:s3:::*/${Prefix}-${ProjectId}-${StageId}/*"
            - !Sub "arn:aws:s3:::*/${Prefix}/${ProjectId}/${StageId}/*"

          # A bucket devoted to the application project shared among all deployments of the application
          - Sid: CopyAssetsToS3DuringPostDeployByBucketApplicationTag
            Action:
            - s3:PutObject
            - s3:Get*
            - s3:List*
            - s3:DeleteObject
            Effect: Allow
            Resource: !Sub
              - "arn:aws:s3:::${OrgPrefix}${Prefix}-${ProjectId}-*/${StageId}/*"
              - OrgPrefix: !If [UseS3BucketNameOrgPrefix, !Sub "${S3BucketNameOrgPrefix}-", ""]

          # A bucket devoted to the specific application deployment
          - Sid: CopyAssetsToS3DuringPostDeployByBucketApplicationDeploymentTag
            Action:
            - s3:PutObject
            - s3:Get*
            - s3:List*
            - s3:DeleteObject
            Effect: Allow
            Resource: !Sub
              - "arn:aws:s3:::${OrgPrefix}${Prefix}-${ProjectId}-${StageId}-*/*"
              - OrgPrefix: !If [UseS3BucketNameOrgPrefix, !Sub "${S3BucketNameOrgPrefix}-", ""]

          # A S3StaticHostBucket if HasS3StaticHostBucket condition is met
          # create a policy statement if HasS3StaticHostBucket condition is met
          - !If
            - HasPostDeployS3StaticHostBucket
            - Sid: CopyAssetsToS3HostBucketDuringPostDeploy
              Action:
              - s3:PutObject
              - s3:Get*
              - s3:List*
              - s3:DeleteObject
              Effect: Allow
              Resource:
                - !Sub "arn:aws:s3:::${PostDeployS3StaticHostBucket}"
                - !Sub "arn:aws:s3:::${PostDeployS3StaticHostBucket}/*"
            - !Ref 'AWS::NoValue'

          # Copy and read from a remote bucket containing the buildspec.yml file
          - !If
            - HasPostDeployBuildSpecS3Location
            - Sid: CopyPostDeploySpecFromS3ForBuild
              Action:
              - s3:Get*
              - s3:List*
              Effect: Allow
              Resource:
                - !Join
                  - ""
                  - - "arn:aws:s3:::"
                    - !Select [0, !Split ["/", !Select [1, !Split ["s3://", !Ref PostDeployBuildSpec]]]]
                # Specific file permission - exact path to the buildspec file
                - !Join
                  - ""
                  - - "arn:aws:s3:::"
                    - !Select [1, !Split ["s3://", !Ref PostDeployBuildSpec]]
            - !Ref 'AWS::NoValue'

          # Read stack information - common after deployment to get resource identifiers and outputs
          # This does not grant any access to the resources created.
          # For that you will need to supply your own managed policy via PostDeploySvcRoleIncludeManagedPolicyArns
          # However, Since API Gateway is common, it is included as well
          - Sid: "ReadStackDetailsAfterDeployment"
            Action:
            - cloudformation:Describe*
            - cloudformation:Get*
            - cloudformation:List*
            Effect: Allow
            Resource:
            - !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${Prefix}-${ProjectId}-${StageId}-application/*"

          # Read Access to API Gateway to export API specs
          - Sid: "ReadApiGatewayInfoForExport"
            Action:
            - apigateway:Get*
            - apigateway:List*
            Effect: Allow
            Resource:
            - !Sub "arn:aws:apigateway:${AWS::Region}::/restapis/*"
            - !Sub "arn:aws:apigateway:${AWS::Region}::/restapis/*/stages/*"
            - !Sub "arn:aws:apigateway:${AWS::Region}::/restapis/*/deployments/*"
            Condition:
              StringEquals:
                "aws:ResourceTag/atlantis:ApplicationDeploymentId": !Sub "${Prefix}-${ProjectId}-${StageId}"

  # -- CodeDeploy Service Role --

  CodeDeployServiceRole:
    Type: AWS::IAM::Role
    Properties:
      Path: !Ref RolePath
      RoleName: !Sub "${Prefix}-Worker-${ProjectId}-${StageId}-CodeDeployServiceRole"
      Description: "Service Role passed to application infrastructure to deploy a Lambda function"
      PermissionsBoundary: !If [HasPermissionsBoundaryArn, !Ref PermissionsBoundaryArn, !Ref 'AWS::NoValue' ]
      AssumeRolePolicyDocument:
        Statement:
        - Sid: "CodeDeployTrustPolicy"
          Action: sts:AssumeRole
          Effect: Allow
          Principal:
            Service:
            - codedeploy.amazonaws.com
      ManagedPolicyArns: # TODO: Scope Down
      - 'arn:aws:iam::aws:policy/service-role/AWSCodeDeployRoleForLambda'

  # -- CloudFormation Application Infrastructure Stack Service Role --
  # --
  # These permissions dictate resources AWS CloudFormation can create and manage in your application's infrastructure stack.
  # As you add functionality and resource types (such as DynamoDb, Event Bridge, Step Functions, etc) you will need to add additional permissions.
  # This portion along with the parameters in the pipeline deploy process and environment variables in the build process will differ the most between your applications.
  # --

  CloudFormationSvcRole:
    Type: AWS::IAM::Role
    Properties:
      Path: !Ref RolePath
      RoleName: !Sub "${Prefix}-Worker-${ProjectId}-${StageId}-CloudFormationSvcRole"
      Description: Creating service role in IAM for AWS CloudFormation
      PermissionsBoundary: !If [HasPermissionsBoundaryArn, !Ref PermissionsBoundaryArn, !Ref 'AWS::NoValue' ]
      ManagedPolicyArns: !If [HasManagedPoliciesForCloudFormationSvcRole, !Ref CloudFormationSvcRoleIncludeManagedPolicyArns, !Ref 'AWS::NoValue' ]
      AssumeRolePolicyDocument:
        Statement:
        - Sid: "CloudFormationTrustPolicy"
          Effect: Allow
          Action: sts:AssumeRole
          Principal:
            Service:
            - cloudformation.amazonaws.com
      Policies:
      - PolicyName: CloudFormationRolePolicy
        PolicyDocument:
          Version: "2012-10-17"
          Statement:

          - Sid: "IAMCRUDWorkerThisDeploymentOnly"
            Action:
            - iam:*
            Effect: Allow
            Resource:
            - !Sub "arn:aws:iam::${AWS::AccountId}:role${RolePath}${Prefix}-Worker-${ProjectId}-${StageId}-*"
            - !Sub "arn:aws:iam::${AWS::AccountId}:role${RolePath}${Prefix}-${ProjectId}-${StageId}-*"
            - !Sub "arn:aws:iam::${AWS::AccountId}:policy${RolePath}${Prefix}-Worker-${ProjectId}-${StageId}-*"
            - !Sub "arn:aws:iam::${AWS::AccountId}:policy${RolePath}${Prefix}-${ProjectId}-${StageId}-*"

          - Sid: "IAMGetAndListReadOnlyAll"
            Action:
            - iam:Get*
            - iam:List*
            Effect: Allow
            Resource:
            - !Sub "arn:aws:iam::${AWS::AccountId}:role/*"
            - !Sub "arn:aws:iam::${AWS::AccountId}:policy/*"

          - Sid: "CloudFormationCRUD"
            Action:
            - cloudformation:*
            Effect: Allow
            Resource:
            - !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${Prefix}-${ProjectId}-${StageId}-application/*"

          - Sid: "AllowTransformOperations"
            Action:
            - cloudformation:CreateChangeSet
            - cloudformation:ExecuteChangeSet
            - cloudformation:GetTemplateSummary
            - cloudformation:DescribeChangeSet
            - cloudformation:DescribeStacks
            - cloudformation:DescribeStackEvents
            Effect: Allow
            Resource:
            - "arn:aws:cloudformation:*:aws:transform/Serverless-2016-10-31"
            - "arn:aws:cloudformation:*:aws:transform/LanguageExtensions"
            - "arn:aws:cloudformation:*:aws:transform/Include"

          - Sid: "CodeDeployCRUDThisDeploymentOnly"
            Action:
            - codedeploy:*
            Effect: Allow
            Resource:
              - !Sub 'arn:aws:codedeploy:${AWS::Region}:${AWS::AccountId}:application:${Prefix}-${ProjectId}-${StageId}-application-*'
              - !Sub 'arn:aws:codedeploy:${AWS::Region}:${AWS::AccountId}:application:${Prefix}-${ProjectId}-${StageId}-*'
              - !Sub 'arn:aws:codedeploy:${AWS::Region}:${AWS::AccountId}:deploymentgroup:${Prefix}-${ProjectId}-${StageId}-*'
              - !Sub 'arn:aws:codedeploy:${AWS::Region}:${AWS::AccountId}:deployment:*'

          - Sid: "CodeDeployGetAndListReadOnlyAll"
            Action:
            - codedeploy:Get*
            - codedeploy:List*
            Effect: Allow
            Resource: !Sub "arn:aws:codedeploy:${AWS::Region}:${AWS::AccountId}:deploymentconfig:*"

          - Sid: ManageArtifactsInS3
            Action:
            - s3:Get*
            - s3:List*
            - s3:PutObject
            Effect: Allow
            Resource:
            - !Sub "arn:aws:s3:::${S3ArtifactsBucket}"
            - !Sub "arn:aws:s3:::${S3ArtifactsBucket}/*"

          # ===================================================================
          # CRUD permissions for application resources
          # ===================================================================

          # == API Gateway ==
          - Sid: "APIGateWayCRUD"
            Action:
            - apigateway:*
            Effect: Allow
            Resource: "*" # We can't use the resource ARN because it is a random id so we will use a conditional against tags
            Condition:
              StringEquals:
                "aws:ResourceTag/atlantis:ApplicationDeploymentId": !Sub "${Prefix}-${ProjectId}-${StageId}"

          # Fallback for API Gateway resources that SAM may not tag properly
          - Sid: "APIGatewayFallbackForUntaggedResources"
            Action:
            - apigateway:GET
            - apigateway:POST
            - apigateway:PUT
            - apigateway:PATCH
            - apigateway:DELETE
            Effect: Allow
            Resource:
            - !Sub "arn:aws:apigateway:${AWS::Region}::/restapis/*/deployments/*"
            - !Sub "arn:aws:apigateway:${AWS::Region}::/restapis/*/stages/*"
            - !Sub "arn:aws:apigateway:${AWS::Region}::/restapis/*/models/*"
            - !Sub "arn:aws:apigateway:${AWS::Region}::/restapis/*/requestvalidators/*"
            - !Sub "arn:aws:apigateway:${AWS::Region}::/restapis/*/documentation/*"
            Condition:
              StringLike:
                "aws:ResourceTag/aws:cloudformation:stack-name": !Sub "${Prefix}-${ProjectId}-${StageId}-*"

          # Fallback for API Gateway tagging
          - Sid: "APIGatewayFallbackForTags"
            Action:
            - apigateway:GET
            - apigateway:POST
            - apigateway:PUT
            - apigateway:PATCH
            - apigateway:DELETE
            Effect: Allow
            Resource:
            - !Sub "arn:aws:apigateway:${AWS::Region}::/tags/*"

          - Sid: AllowCreateServiceLinkedRoleForAPIGateway
            Effect: Allow
            Action:
            - iam:CreateServiceLinkedRole
            Resource: "arn:aws:iam::*:role/aws-service-role/ops.apigateway.amazonaws.com/AWSServiceRoleForAPIGateway"
            Condition:
              StringEquals:
                "iam:AWSServiceName": "ops.apigateway.amazonaws.com"

          # == Event Bridge ==
          - Sid: "EventsCRUDThisDeploymentOnly"
            Action:
            - events:*
            Effect: Allow
            Resource:
            - !Sub 'arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/${Prefix}-${ProjectId}-${StageId}-*'

          # == EventBridge Scheduler ==
          - Sid: "EventBridgeSchedulerCRUDThisDeploymentOnly"
            Action:
            - scheduler:*
            Effect: Allow
            Resource:
            - !Sub 'arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/${Prefix}-${ProjectId}-${StageId}-*'
            - !Sub 'arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule-group/${Prefix}-${ProjectId}-${StageId}-*'
            - !Sub 'arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/${Prefix}-${ProjectId}-${StageId}-*'

          # == SQS ==
          - Sid: "SQSCRUDThisDeploymentOnly"
            Action:
            - sqs:*
            Effect: Allow
            Resource:
            - !Sub 'arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${Prefix}-${ProjectId}-${StageId}-*'

          # == SNS ==
          - Sid: "SNSCRUDThisDeploymentOnly"
            Action:
            - sns:*
            Effect: Allow
            Resource:
            - !Sub 'arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${Prefix}-${ProjectId}-${StageId}-*'

          # == State Machines / Step Functions ==
          - Sid: "StateMachineCRUDThisDeploymentOnly"
            Action:
            - states:*
            Effect: Allow
            Resource:
              - !Sub 'arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${Prefix}-${ProjectId}-${StageId}-*'

          # == S3 Buckets ==
          - Sid: "S3CRUDThisDeploymentOnly"
            Action:
            - s3:*
            Effect: Allow
            Resource:
              - !Sub
                - "arn:aws:s3:::${OrgPrefix}${Prefix}-${ProjectId}-${StageId}"
                - OrgPrefix: !If [UseS3BucketNameOrgPrefix, !Sub "${S3BucketNameOrgPrefix}-", ""]
              - !Sub
                - "arn:aws:s3:::${OrgPrefix}${Prefix}-${ProjectId}-${StageId}/*"
                - OrgPrefix: !If [UseS3BucketNameOrgPrefix, !Sub "${S3BucketNameOrgPrefix}-", ""]
              - !Sub
                - "arn:aws:s3:::${OrgPrefix}${Prefix}-${ProjectId}-${StageId}-*"
                - OrgPrefix: !If [UseS3BucketNameOrgPrefix, !Sub "${S3BucketNameOrgPrefix}-", ""]
              - !Sub
                - "arn:aws:s3:::${OrgPrefix}${Prefix}-${ProjectId}-${StageId}-*/*"
                - OrgPrefix: !If [UseS3BucketNameOrgPrefix, !Sub "${S3BucketNameOrgPrefix}-", ""]

          # == Lambda Function ==
          - Sid: "LambdaCRUDThisDeploymentOnly"
            Action:
            - lambda:*
            Effect: Allow
            Resource:
            - !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${Prefix}-${ProjectId}-${StageId}-*'
            - !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${Prefix}-${ProjectId}-${StageId}-*:*'
            - !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:layer:${Prefix}-${ProjectId}-${StageId}*'
            - !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:event-source-mapping:*'

          # == DynamoDb ==
          - Sid: "DynamoDbCRUDThisDeploymentOnly"
            Action:
            - dynamodb:*
            Effect: Allow
            Resource:
              - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${Prefix}-${ProjectId}-${StageId}-*'

          # == SSM Parameters ==
          - Sid: "SsmParameterCRUDThisDeploymentOnly"
            Action:
            - ssm:PutParameter
            - ssm:DeleteParameter
            - ssm:AddTagsToResource
            - ssm:RemoveTagsFromResource
            - ssm:GetParameters
            - ssm:GetParameter
            - ssm:GetParametersByPath
            - ssm:ListTagsForResource
            Effect: Allow
            Resource:
              !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParameterStoreHierarchy}${DeployEnvironment}/${Prefix}-${ProjectId}-${StageId}/app-stack/*" # app-stack/ sub-path is CRUD for application templates

          # ===================================================================
          # Limited CRUD permissions for application resources
          # ===================================================================

          # == CloudWatch Dashboard ==
          - Sid: "CloudWatchDashboardLimitedCRUDThisDeploymentOnly"
            Action:
            - cloudwatch:GetDashboard
            - cloudwatch:DeleteDashboards
            - cloudwatch:PutDashboard
            - cloudwatch:TagResource
            - cloudwatch:UntagResource
            Effect: Allow
            Resource:
            - !Sub 'arn:aws:cloudwatch::${AWS::AccountId}:dashboard/${Prefix}-${ProjectId}-${StageId}-*'

          # == CloudWatch Alarms ==
          - Sid: "CloudWatchAlarmsLimitedCRUDThisDeploymentOnly"
            Action:
            - cloudwatch:PutMetricAlarm
            - cloudwatch:DeleteAlarm*
            - cloudwatch:TagResource
            - cloudwatch:UntagResource
            - cloudwatch:DescribeAlarms
            Effect: Allow
            Resource:
              - !Sub 'arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${Prefix}-${ProjectId}-${StageId}-*'

          # == CloudWatch Logs ==
          - Sid: "LogGroupsLimitedCRUDThisDeploymentOnly"
            Action:
            - logs:DeleteLogGroup
            - logs:DeleteRetentionPolicy
            - logs:PutRetentionPolicy
            - logs:CreateLogGroup
            - logs:TagLogGroup # AWS is phasing out, replacing with TagResource
            - logs:UntagLogGroup # AWS is phasing out, replacing with UntagResource
            - logs:TagResource
            - logs:UntagResource
            - logs:ListTagsForResource
            - logs:DescribeLogGroups
            Effect: Allow
            Resource:
            - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${Prefix}-${ProjectId}-${StageId}-*'
            - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/apigateway/${Prefix}-${ProjectId}-${StageId}-*'
            - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:API-Gateway-Execution-Logs_*' # TODO: Scope down

          # ===================================================================
          # Read-only permissions (typically for resources created by other stacks)
          # ===================================================================

          - Sid: "LogGroupsListAll"
            Action:
            - logs:DescribeLogGroups
            - logs:ListTagsLogGroup
            - logs:ListTagsForResource
            Effect: Allow
            Resource:
            - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:*' # cannot scope down to resource as this is a List, but actions are limited

          # == SSM Parameter Store (Read-Only) ==
          - Sid: "SSMParameterStoreReadThisDeploymentOnly"
            Action:
            - ssm:GetParameters
            - ssm:GetParameter
            - ssm:GetParametersByPath
            - ssm:ListTagsForResource
            Effect: Allow
            Resource:
              !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParameterStoreHierarchy}${DeployEnvironment}/${Prefix}-${ProjectId}-${StageId}/*"

          # == SSM AWS Service Public Parameters (Read-Only) ==
          - Sid: "SsmAwsPublicParameterReadOnly"
            Action:
            - ssm:GetParameter
            - ssm:GetParameters
            Effect: Allow
            Resource:
              !Sub "arn:aws:ssm:${AWS::Region}::parameter/aws/service/*"

          # == Lambda Insights == for tracing and troubleshooting
          - Sid: "LambdaLayersGetLayerForLambdaInsightsFromAWS"
            Action:
            - lambda:GetLayerVersion
            Effect: Allow
            Resource:
              - !Sub
                - 'arn:aws:lambda:${AWS::Region}:${AccountId}:layer:LambdaInsightsExtension:*'
                - AccountId: !FindInMap [LambdaInsightsAccountId, !Ref "AWS::Region", AccountId]
              - !Sub
                - 'arn:aws:lambda:${AWS::Region}:${AccountId}:layer:LambdaInsightsExtension-Arm64:*'
                - AccountId: !FindInMap [LambdaInsightsAccountId, !Ref "AWS::Region", AccountId]
            # https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/Lambda-Insights-extension-versions.html
            # These accounts are owned by AWS so they can be trusted

          # == AWS Parameters and Secrets Lambda Extension ==
          - Sid: "LambdaLayersGetLayerForParametersAndSecretsFromAWS"
            Action:
            - lambda:GetLayerVersion
            Effect: Allow
            Resource:
              - !Sub
                - 'arn:aws:lambda:${AWS::Region}:${AccountId}:layer:AWS-Parameters-and-Secrets-Lambda-Extension:*'
                - AccountId: !FindInMap [LambdaParamSecretsAccountId, !Ref "AWS::Region", AccountId]
              - !Sub
                - 'arn:aws:lambda:${AWS::Region}:${AccountId}:layer:AWS-Parameters-and-Secrets-Lambda-Extension-Arm64:*'
                - AccountId: !FindInMap [LambdaParamSecretsAccountId, !Ref "AWS::Region", AccountId]
            # https://docs.aws.amazon.com/systems-manager/latest/userguide/ps-integration-lambda-extensions.html#ps-integration-lambda-extensions-add
            # These accounts are owned by AWS so they can be trusted

  # ---------------------------------------------------------------------------
  # -- AWS CodePipeline Resources --
  # --
  # AWS CodePipeline is a continuous delivery service that automates the release process for your software.
  # An event rule monitors changes to your source code repository and triggers a pipeline to build your application.
  # The pipeline runs your build, tests, and deploys your application infrastructure via CloudFormation
  # Resources include S3 buckets to store artifacts, CodeBuild projects to build your application, and Code Deploy and CloudFormation to deploy.

  # -- CodeBuild Project --

  CodeBuildProject:
    Type: AWS::CodeBuild::Project
    # DependsOn:
    # - CodeBuildServiceRole
    Condition: IsNotDevelopment
    Properties:
      Name: !Sub '${Prefix}-${ProjectId}-${StageId}-Build'
      Description: !Sub "CodeBuild Project for ${Prefix}-${ProjectId}-${StageId}"
      ServiceRole: !GetAtt 'CodeBuildServiceRole.Arn'
      Artifacts:
        Packaging: ZIP
        Type: CODEPIPELINE
      Cache:
        Type: LOCAL
        Modes:
          - LOCAL_CUSTOM_CACHE
      Environment:
        # ComputeType, Type, Image and the Build Runtime versions all rely on each other
        # ComputeType and Environment Type: https://docs.aws.amazon.com/codebuild/latest/userguide/build-env-ref-compute-types.html
        # Build runtime versions: https://docs.aws.amazon.com/codebuild/latest/userguide/runtime-versions.html
        #                         https://docs.aws.amazon.com/codebuild/latest/userguide/ec2-compute-images.html
        #                         https://docs.aws.amazon.com/codebuild/latest/userguide/available-runtimes.html
        ComputeType: BUILD_GENERAL1_SMALL
        Type: LINUX_CONTAINER
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0 # Node 20 / Python 3.12
        # Image: aws/codebuild/java:openjdk-11 # java

        # BUILD ENVIRONMENT VARIABLES : You can specify any other environment variables your buildspec.yml is looking for.
        EnvironmentVariables:
        - Name: AWS_PARTITION
          Value: !Ref 'AWS::Partition'
        - Name: AWS_REGION
          Value: !Ref 'AWS::Region'
        - Name: AWS_ACCOUNT
          Value: !Ref 'AWS::AccountId'
        - Name: S3_ARTIFACTS_BUCKET # informs AWS CodeBuild where it can retrieve your code artifact.
          Value: !Ref S3ArtifactsBucket
        - Name: PREFIX
          Value: !Ref 'Prefix'
        - Name: PROJECT_ID
          Value: !Ref 'ProjectId'
        - Name: STAGE_ID
          Value: !Ref 'StageId'
        - Name: S3_BUCKET_NAME_ORG_PREFIX
          Value: !If [UseS3BucketNameOrgPrefix, !Sub "${S3BucketNameOrgPrefix}-", "" ]
        - Name: REPOSITORY
          Value: !Ref 'Repository'
        - Name: REPOSITORY_BRANCH
          Value: !Ref 'RepositoryBranch'
        - Name: PARAM_STORE_HIERARCHY
          Value: !Sub '${ParameterStoreHierarchy}${DeployEnvironment}/${Prefix}-${ProjectId}-${StageId}/'
        - Name: DEPLOY_ENVIRONMENT
          Value: !Ref 'DeployEnvironment'
        - Name: ALARM_NOTIFICATION_EMAIL
          Value: !Ref 'AlarmNotificationEmail'
        - Name: S3_STATIC_HOST_BUCKET
          Value: !Ref 'S3StaticHostBucket'
        - Name: ROLE_PATH
          Value: !Ref 'RolePath'
        - Name: PERMISSIONS_BOUNDARY_ARN
          Value: !Ref 'PermissionsBoundaryArn'
        - Name: NODE_ENV
          Value: "production" # We do not need dev dependencies deployed to Lambda as they are for local development. IF you needed to run tests during build, then temporarily set in buildspec but be sure final deploy is based on production dependencies. (Build twice)
      Source:
        Type: CODEPIPELINE
        BuildSpec: !If
          - HasS3BuildSpecLocation
          - !Join
            - ""
            - - "arn:aws:s3:::"
              - !Select [1, !Split ["s3://", !Ref BuildSpec]]
          - !If
            - UseDefaultBuildSpecLocation
            - "buildspec.yml"
            - !Ref BuildSpec

  # ---------------------------------------------------------------------------
  # -- Log Group for CodeBuild Project --
  # -- (Just so we can add a retention policy)

  CodeBuildLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: IsNotDevelopment
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/codebuild/${Prefix}-${ProjectId}-${StageId}-Build"
      RetentionInDays: 90 # Set to your own retention policy - how long do you want to keep build logs?

  # -- PostDeploy CodeBuild Project --
  #
  # CONDITIONAL RESOURCE: Only created when PostDeployStageEnabled="true"
  # This CodeBuild project runs post-deployment tasks such as:
  # - Integration tests against the deployed application
  # - Configuration validation and health checks
  # - Exporting configurations (e.g., OpenAPI specs from API Gateway)
  # - Post-deployment data migration or setup tasks
  #
  # CONFIGURATION CONSISTENCY:
  # - Uses same compute environment as Build stage (BUILD_GENERAL1_SMALL, LINUX_CONTAINER)
  # - Uses same container image as Build stage for consistency
  # - Receives same core environment variables as Build stage
  # - Additional POST_DEPLOY_S3_STATIC_HOST_BUCKET environment variable for PostDeploy-specific tasks
  #
  # BUILDSPEC HANDLING:
  # - Supports local buildspec files (default: buildspec-postdeploy.yml)
  # - Supports S3-hosted buildspec files with automatic IAM permissions
  # - Uses conditional logic to determine buildspec source and format

  PostDeployProject:
    Type: AWS::CodeBuild::Project
    # DependsOn:
    # - PostDeployServiceRole
    Condition: IsPostDeployEnabledAndNotDev
    Properties:
      Name: !Sub '${Prefix}-${ProjectId}-${StageId}-PostDeploy'
      Description: !Sub "PostDeploy CodeBuild Project for ${Prefix}-${ProjectId}-${StageId}. Runs post-deployment tasks such as integration tests, configuration validation, and artifact export. Only created when PostDeployStageEnabled is true."
      ServiceRole: !GetAtt 'PostDeployServiceRole.Arn'
      Artifacts:
        Packaging: ZIP
        Type: CODEPIPELINE
      Cache:
        Type: LOCAL
        Modes:
          - LOCAL_CUSTOM_CACHE
      Environment:
        # ComputeType, Type, Image and the Build Runtime versions all rely on each other
        # ComputeType and Environment Type: https://docs.aws.amazon.com/codebuild/latest/userguide/build-env-ref-compute-types.html
        # Build runtime versions: https://docs.aws.amazon.com/codebuild/latest/userguide/runtime-versions.html
        #                         https://docs.aws.amazon.com/codebuild/latest/userguide/ec2-compute-images.html
        #                         https://docs.aws.amazon.com/codebuild/latest/userguide/available-runtimes.html
        ComputeType: BUILD_GENERAL1_SMALL
        Type: LINUX_CONTAINER
        Image: aws/codebuild/amazonlinux-x86_64-standard:5.0 # Node 22 / Python 3.13 / Java corretto21

        # BUILD ENVIRONMENT VARIABLES : You can specify any other environment variables your buildspec.yml is looking for.
        EnvironmentVariables:
        - Name: AWS_PARTITION
          Value: !Ref 'AWS::Partition'
        - Name: AWS_REGION
          Value: !Ref 'AWS::Region'
        - Name: AWS_ACCOUNT
          Value: !Ref 'AWS::AccountId'
        - Name: S3_ARTIFACTS_BUCKET # informs AWS CodeBuild where it can retrieve your code artifact.
          Value: !Ref S3ArtifactsBucket
        - Name: PREFIX
          Value: !Ref 'Prefix'
        - Name: PROJECT_ID
          Value: !Ref 'ProjectId'
        - Name: STAGE_ID
          Value: !Ref 'StageId'
        - Name: S3_BUCKET_NAME_ORG_PREFIX
          Value: !If [UseS3BucketNameOrgPrefix, !Sub "${S3BucketNameOrgPrefix}-", "" ]
        - Name: REPOSITORY
          Value: !Ref 'Repository'
        - Name: REPOSITORY_BRANCH
          Value: !Ref 'RepositoryBranch'
        - Name: PARAM_STORE_HIERARCHY
          Value: !Sub '${ParameterStoreHierarchy}${DeployEnvironment}/${Prefix}-${ProjectId}-${StageId}/'
        - Name: DEPLOY_ENVIRONMENT
          Value: !Ref 'DeployEnvironment'
        - Name: ALARM_NOTIFICATION_EMAIL
          Value: !Ref 'AlarmNotificationEmail'
        - Name: S3_STATIC_HOST_BUCKET
          Value: !Ref 'PostDeployS3StaticHostBucket'
        - Name: ROLE_PATH
          Value: !Ref 'RolePath'
        - Name: PERMISSIONS_BOUNDARY_ARN
          Value: !Ref 'PermissionsBoundaryArn'
        - Name: NODE_ENV
          Value: "production" # We do not need dev dependencies deployed to Lambda as they are for local development. IF you needed to run tests during build, then temporarily set in buildspec but be sure final deploy is based on production dependencies. (Build twice)
      Source:
        Type: CODEPIPELINE
        BuildSpec: !If
          - HasPostDeployBuildSpecS3Location
          - !Join
            - ""
            - - "arn:aws:s3:::"
              - !Select [1, !Split ["s3://", !Ref PostDeployBuildSpec]]
          - !If
            - UseDefaultPostDeployBuildSpecLocation
            - "buildspec-postdeploy.yml"
            - !Ref PostDeployBuildSpec

  # ---------------------------------------------------------------------------
  # -- PostDeploy Log Group --
  #
  # CONDITIONAL RESOURCE: Only created when PostDeployStageEnabled="true"
  # Creates a dedicated CloudWatch log group for PostDeploy CodeBuild project logs.
  # Provides log retention policy to manage storage costs and compliance requirements.
  # Matches the retention policy of the main Build stage for consistency.

  PostDeployLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: IsPostDeployEnabledAndNotDev
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/codebuild/${Prefix}-${ProjectId}-${StageId}-PostDeploy"
      RetentionInDays: 90 # Matches Build stage retention policy - adjust based on your log retention requirements

  # ---------------------------------------------------------------------------
  # -- ProjectPipeline --
  # Using the resources defined above, the pipeline and it's parts is what
  # moves things along

  # This pipeline contains three Stages: Source, Build, and Deploy.
  # - Source stage contains a single action that picks up changes from your repository.
  # - Build stage executes your AWS CodeBuild project.
  # - Deploy stage contains two actions:
  #   - The first action either creates a new stack / changeset containing your runtime resources.
  #   - The second action executes the changeset made in the previous action.

  ProjectPipeline:
    # The pipeline should only be created once all the resources it links to have been created.
    # This includes the AWS CodePipeline service role, the artifact bucket, the AWS CodeBuild build projectTemplateId,
    # and the role it will pass to AWS CloudFormation to create stacks.
    Type: AWS::CodePipeline::Pipeline
    DependsOn:
    - CodeBuildProject
    Condition: IsNotDevelopment
    Properties:
      Name: !Sub '${Prefix}-${ProjectId}-${StageId}-Pipeline'
      ArtifactStore:
        Location: !Ref S3ArtifactsBucket
        Type: S3
      RoleArn: !GetAtt 'CodePipelineServiceRole.Arn'
      Stages:
      -
        Name: Source
        Actions:
        -
          Name: ApplicationSource
          ActionTypeId:
            Category: Source
            Owner: AWS
            Provider: CodeStarSourceConnection # Deprecated, but CodeConnections throws error
            Version: 1
          Configuration:
            ConnectionArn: !Ref GitHubConnectionArn
            FullRepositoryId: !Ref Repository
            BranchName: !Ref RepositoryBranch
          OutputArtifacts:
          - Name: !Sub "${ProjectId}-${StageId}-SourceArtifact"
          RunOrder: 1
      -
        Name: Build
        Actions:
        -
          Name: PackageExport
          ActionTypeId:
            Category: Build
            Owner: AWS
            Provider: CodeBuild
            Version: 1
          Configuration:
            ProjectName: !Sub '${Prefix}-${ProjectId}-${StageId}-Build'
          InputArtifacts:
          - Name: !Sub "${ProjectId}-${StageId}-SourceArtifact"
          OutputArtifacts:
          - Name: !Sub "${ProjectId}-${StageId}-BuildArtifact"
          RunOrder: 1
      -
        Name: Deploy
        Actions:
        -
          Name: GenerateChangeSet
          ActionTypeId:
            Category: Deploy
            Owner: AWS
            Provider: CloudFormation
            Version: 1
          Configuration:
            StackName: !Sub "${Prefix}-${ProjectId}-${StageId}-application"
            ActionMode: CHANGE_SET_REPLACE
            Capabilities: CAPABILITY_NAMED_IAM
            ChangeSetName: pipeline-changeset
            RoleArn: !GetAtt 'CloudFormationSvcRole.Arn'
            # These are the parameters that will be set in your AWS CloudFormation stack.
            ParameterOverrides: !Sub '{
              "Prefix": "${Prefix}",
              "ProjectId": "${ProjectId}",
              "StageId": "${StageId}",
              "S3BucketNameOrgPrefix": "${S3BucketNameOrgPrefix}",
              "RolePath": "${RolePath}",
              "DeployEnvironment": "${DeployEnvironment}",
              "ParameterStoreHierarchy": "${ParameterStoreHierarchy}${DeployEnvironment}/${Prefix}-${ProjectId}-${StageId}/",
              "DeployRole": "${CodeDeployServiceRole.Arn}",
              "AlarmNotificationEmail": "${AlarmNotificationEmail}",
              "PermissionsBoundaryArn": "${PermissionsBoundaryArn}"
            }'
            TemplateConfiguration: !Sub '${ProjectId}-${StageId}-BuildArtifact::application-infrastructure/template-configuration.json'
            TemplatePath: !Sub "${ProjectId}-${StageId}-BuildArtifact::application-infrastructure/template-export.yml"
          InputArtifacts:
          - Name: !Sub "${ProjectId}-${StageId}-BuildArtifact"
          OutputArtifacts: []
          RunOrder: 1
        -
          Name: ExecuteChangeSet
          ActionTypeId:
            Category: Deploy
            Owner: AWS
            Provider: CloudFormation
            Version: 1
          Configuration:
            ActionMode: CHANGE_SET_EXECUTE
            ChangeSetName: pipeline-changeset
            StackName: !Sub "${Prefix}-${ProjectId}-${StageId}-application"
          InputArtifacts: []
          OutputArtifacts: []
          RunOrder: 2
      - !If
        - IsPostDeployEnabled
        - Name: PostDeploy
          Actions:
          - Name: PackageExport
            ActionTypeId:
              Category: Build
              Owner: AWS
              Provider: CodeBuild
              Version: 1
            Configuration:
              ProjectName: !Sub '${Prefix}-${ProjectId}-${StageId}-PostDeploy'
            InputArtifacts:
            - Name: !Sub "${ProjectId}-${StageId}-SourceArtifact"
            OutputArtifacts:
            - Name: !Sub "${ProjectId}-${StageId}-PostDeployArtifact"
            RunOrder: 1
        - !Ref 'AWS::NoValue'

  # ---------------------------------------------------------------------------
  # -- Pipeline Notifications --
  # Using the AlarmNotificationEmail parameter, send pipeline execution updates

  # Create SNS Topic for Pipeline notifications
  PipelineNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${AWS::StackName}-pipeline-notifications
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlarmNotificationEmail

  # EventBridge Rule for Pipeline Started events
  PipelineStartedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${Prefix}-${ProjectId}-${StageId}-pipeline-started"
      Description: "Rule for CodePipeline execution started events"
      EventPattern:
        source:
          - "aws.codepipeline"
        detail-type:
          - "CodePipeline Pipeline Execution State Change"
        detail:
          state:
            - "STARTED"
          pipeline:
            - !Sub "${Prefix}-${ProjectId}-${StageId}-Pipeline"
      State: ENABLED
      Targets:
        - Arn: !Ref PipelineNotificationTopic
          Id: "PipelineStartedTarget"
          InputTransformer:
            InputPathsMap:
              "pipeline": "$.detail.pipeline"
              "state": "$.detail.state"
              "executionId": "$.detail.execution-id"
              "time": "$.time"
            InputTemplate: !Sub >-
              {
                "Subject": "Pipeline <pipeline> Started",
                "Message": "Pipeline Execution - STARTED\n\nStatus: STARTED\nPipeline: <pipeline>\nExecution ID: <executionId>\nTime: <time>\n\nConsole Link: https://${AWS::Region}.console.aws.amazon.com/codesuite/codepipeline/pipelines/${Prefix}-${ProjectId}-${StageId}-Pipeline/view?region=${AWS::Region}"
              }

  # EventBridge Rule for Pipeline Succeeded events
  PipelineSucceededRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${Prefix}-${ProjectId}-${StageId}-pipeline-succeeded"
      Description: "Rule for CodePipeline execution succeeded events"
      EventPattern:
        source:
          - "aws.codepipeline"
        detail-type:
          - "CodePipeline Pipeline Execution State Change"
        detail:
          state:
            - "SUCCEEDED"
          pipeline:
            - !Sub "${Prefix}-${ProjectId}-${StageId}-Pipeline"
      State: ENABLED
      Targets:
        - Arn: !Ref PipelineNotificationTopic
          Id: "PipelineSucceededTarget"
          InputTransformer:
            InputPathsMap:
              "pipeline": "$.detail.pipeline"
              "state": "$.detail.state"
              "executionId": "$.detail.execution-id"
              "time": "$.time"
            InputTemplate: !Sub >-
              {
                "Subject": "Pipeline <pipeline> Succeeded",
                "Message": "Pipeline Execution - SUCCEEDED\n\nStatus: SUCCEEDED\nPipeline: <pipeline>\nExecution ID: <executionId>\nTime: <time>\n\nConsole Link: https://${AWS::Region}.console.aws.amazon.com/codesuite/codepipeline/pipelines/${Prefix}-${ProjectId}-${StageId}-Pipeline/view?region=${AWS::Region}"
              }

  # EventBridge Rule for Pipeline Failed events
  PipelineFailedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${Prefix}-${ProjectId}-${StageId}-pipeline-failed"
      Description: "Rule for CodePipeline execution failed events"
      EventPattern:
        source:
          - "aws.codepipeline"
        detail-type:
          - "CodePipeline Pipeline Execution State Change"
        detail:
          state:
            - "FAILED"
          pipeline:
            - !Sub "${Prefix}-${ProjectId}-${StageId}-Pipeline"
      State: ENABLED
      Targets:
        - Arn: !Ref PipelineNotificationTopic
          Id: "PipelineFailedTarget"
          InputTransformer:
            InputPathsMap:
              "pipeline": "$.detail.pipeline"
              "state": "$.detail.state"
              "executionId": "$.detail.execution-id"
              "time": "$.time"
            InputTemplate: !Sub >-
              {
                "Subject": "ALERT: Pipeline <pipeline> Failed",
                "Message": "Pipeline Execution - FAILED\n\nStatus: FAILED\nPipeline: <pipeline>\nExecution ID: <executionId>\nTime: <time>\n\nPlease check the pipeline for errors.\nConsole Link: https://${AWS::Region}.console.aws.amazon.com/codesuite/codepipeline/pipelines/${Prefix}-${ProjectId}-${StageId}-Pipeline/view?region=${AWS::Region}"
              }

  # Add required SNS topic policy to allow EventBridge to publish
  PipelineNotificationTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowEventBridgeToPublishEvents
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref PipelineNotificationTopic
      Topics:
        - !Ref PipelineNotificationTopic

# =============================================================================
# OUTPUTS
# -----------------------------------------------------------------------------
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/outputs-section-structure.html
#
# Place anything interesting that you would like to quickly refer to in
# your cloudformation OUTPUT section. Test URLs, direct links to resources, etc
#

Outputs:
  ProjectPipeline:
    Description: "CodePipeline"
    Condition: IsNotDevelopment
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/codesuite/codepipeline/pipelines/${Prefix}-${ProjectId}-${StageId}-Pipeline/view?region=${AWS::Region}"
  Repository:
    Description: "Repository"
    Value: !Sub "https://github.com/${Repository}"