AWSTemplateFormatVersion: "2010-09-09"
Description: Webhosting resources for JankenHockey (S3 Bucket, CloudFront)

Parameters:
  LambdaBucket:
    Type: String
    Description: S3 Bucket name where Lambda code is stored.
  LambdaZipFile:
    Type: String
    Description: S3 Key for the Lambda zip file.
  JankenHockeyFunctionRoleArn:
    Type: String
    Description: ARN of the IAM Role for JankenHockey Lambda functions.
  JankenHockeyGameHistoryFunctionRoleArn:
    Type: String
    Description: ARN of the IAM Role for JankenHockey Game History Lambda function.

Resources:
  DummyLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: RetainExceptOnCreate
    Properties:
      LogGroupName: /aws/lambda/dummy-log-group-for-retain-policy
      RetentionInDays: 14

  #######################
  # REST API
  #######################
  JankenHockeyRestAPI:
    Type: AWS::ApiGateway::RestApi
    DeletionPolicy: RetainExceptOnCreate
    Properties:
      Name: JankenHockeyRestAPI

  #######################
  # Lambda
  #######################
  # Lambda /rooms/ GET
  JankenHockeyGetRoomsFunction:
    DeletionPolicy: RetainExceptOnCreate
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: JankenHockeyGetRoomsFunction
      Handler: get_rooms.handler
      Role: !Ref JankenHockeyFunctionRoleArn
      Code:
        S3Bucket: !Ref LambdaBucket
        S3Key: !Ref LambdaZipFile
      Runtime: python3.12
      Timeout: 5
      Environment:
        Variables:
          ROOM_TABLE: !Sub arn:aws:dynamodb:ap-northeast-1:${AWS::AccountId}:table/Room
      Tags:
        - Key: Project
          Value: JankenHockey

  # Lambda /rooms/create POST
  JankenHockeyCreateRoomFunction:
    DeletionPolicy: RetainExceptOnCreate
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: JankenHockeyCreateRoomFunction
      Handler: create_room.handler
      Role: !Ref JankenHockeyFunctionRoleArn
      Code:
        S3Bucket: !Ref LambdaBucket
        S3Key: !Ref LambdaZipFile
      Runtime: python3.12
      Timeout: 5
      Environment:
        Variables:
          ROOM_TABLE: !Sub arn:aws:dynamodb:ap-northeast-1:${AWS::AccountId}:table/Room
      Tags:
        - Key: Project
          Value: JankenHockey

  # Lambda /rooms/join/ POST
  JankenHockeyJoinRoomFunction:
    DeletionPolicy: RetainExceptOnCreate
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: JankenHockeyJoinRoomFunction
      Handler: join_room.handler
      Role: !Ref JankenHockeyFunctionRoleArn
      Code:
        S3Bucket: !Ref LambdaBucket
        S3Key: !Ref LambdaZipFile
      Runtime: python3.12
      Timeout: 5
      Environment:
        Variables:
          ROOM_TABLE: !Sub arn:aws:dynamodb:ap-northeast-1:${AWS::AccountId}:table/Room
      Tags:
        - Key: Project
          Value: JankenHockey

  # Lambda /cpu-battle/history POST
  JankenHockeySaveCpuBattleHistoryFunction:
    DeletionPolicy: RetainExceptOnCreate
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: JankenHockeySaveCpuBattleHistoryFunction
      Handler: save_cpu_battle_history.handler
      Role: !Ref JankenHockeyGameHistoryFunctionRoleArn
      Code:
        S3Bucket: !Ref LambdaBucket
        S3Key: !Ref LambdaZipFile
      Runtime: python3.12
      Timeout: 5
      Environment:
        Variables:
          GAME_HISTORY_TABLE: !Sub arn:aws:dynamodb:ap-northeast-1:${AWS::AccountId}:table/GameHistory
      Tags:
        - Key: Project
          Value: JankenHockey

  # Lambda /cpu-battle/guest-history POST
  JankenHockeySaveGuestCpuBattleHistoryFunction:
    DeletionPolicy: RetainExceptOnCreate
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: JankenHockeySaveGuestCpuBattleHistoryFunction
      Handler: save_guest_cpu_battle_history.handler
      Role: !Ref JankenHockeyGameHistoryFunctionRoleArn
      Code:
        S3Bucket: !Ref LambdaBucket
        S3Key: !Ref LambdaZipFile
      Runtime: python3.12
      Timeout: 5
      Environment:
        Variables:
          GAME_HISTORY_TABLE: !Sub arn:aws:dynamodb:ap-northeast-1:${AWS::AccountId}:table/GameHistory
      Tags:
        - Key: Project
          Value: JankenHockey

  # # REST API Cognito Authorizer
  JankenHockeyRestAPICognitoAuthorizer:
    DeletionPolicy: RetainExceptOnCreate
    Type: AWS::ApiGateway::Authorizer
    Properties:
      RestApiId: !Ref JankenHockeyRestAPI
      Name: JankenHockeyRestAPICognitoAuthorizer
      Type: COGNITO_USER_POOLS
      ProviderARNs:
        - !Sub arn:aws:cognito-idp:ap-northeast-1:${AWS::AccountId}:userpool/ap-northeast-1_j1neeUokJ
      IdentitySource: method.request.header.Authorization

  #######################
  # API Gateway - Resources
  #######################
  JankenHockeyRestAPIResourceRooms:
    DeletionPolicy: RetainExceptOnCreate
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt JankenHockeyRestAPI.RootResourceId
      PathPart: rooms
      RestApiId: !Ref JankenHockeyRestAPI

  JankenHockeyRestAPIResourceRoomsCreate:
    DeletionPolicy: RetainExceptOnCreate
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !Ref JankenHockeyRestAPIResourceRooms
      PathPart: create
      RestApiId: !Ref JankenHockeyRestAPI

  JankenHockeyRestAPIResourceRoomsJoin:
    DeletionPolicy: RetainExceptOnCreate
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !Ref JankenHockeyRestAPIResourceRooms
      PathPart: join
      RestApiId: !Ref JankenHockeyRestAPI

  JankenHockeyRestAPIResourceRoomsDelete:
    DeletionPolicy: RetainExceptOnCreate
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !Ref JankenHockeyRestAPIResourceRooms
      PathPart: delete
      RestApiId: !Ref JankenHockeyRestAPI

  # Auth resource for login/signup
  JankenHockeyRestAPIResourceAuth:
    DeletionPolicy: RetainExceptOnCreate
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt JankenHockeyRestAPI.RootResourceId
      PathPart: auth
      RestApiId: !Ref JankenHockeyRestAPI

  # CPU battle resources
  JankenHockeyRestAPIResourceCpuBattle:
    DeletionPolicy: RetainExceptOnCreate
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt JankenHockeyRestAPI.RootResourceId
      PathPart: cpu-battle
      RestApiId: !Ref JankenHockeyRestAPI

  JankenHockeyRestAPIResourceCpuBattleHistory:
    DeletionPolicy: RetainExceptOnCreate
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !Ref JankenHockeyRestAPIResourceCpuBattle
      PathPart: history
      RestApiId: !Ref JankenHockeyRestAPI

  JankenHockeyRestAPIResourceCpuBattleGuestHistory:
    DeletionPolicy: RetainExceptOnCreate
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !Ref JankenHockeyRestAPIResourceCpuBattle
      PathPart: guest-history
      RestApiId: !Ref JankenHockeyRestAPI

  #######################
  # API Gateway - Methods
  #######################
  # /rooms GET
  JankenHockeyRestAPIMethodRoomsGet:
    DeletionPolicy: RetainExceptOnCreate
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref JankenHockeyRestAPI
      ResourceId: !Ref JankenHockeyRestAPIResourceRooms
      HttpMethod: GET
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref JankenHockeyRestAPICognitoAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${JankenHockeyGetRoomsFunction.Arn}/invocations

  # /rooms/create POST
  JankenHockeyRestAPIMethodRoomsCreatePost:
    DeletionPolicy: RetainExceptOnCreate
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref JankenHockeyRestAPI
      ResourceId: !Ref JankenHockeyRestAPIResourceRoomsCreate
      HttpMethod: POST
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref JankenHockeyRestAPICognitoAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${JankenHockeyCreateRoomFunction.Arn}/invocations

  # /rooms/join POST
  JankenHockeyRestAPIMethodRoomsJoinPost:
    DeletionPolicy: RetainExceptOnCreate
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref JankenHockeyRestAPI
      ResourceId: !Ref JankenHockeyRestAPIResourceRoomsJoin
      HttpMethod: POST
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref JankenHockeyRestAPICognitoAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${JankenHockeyJoinRoomFunction.Arn}/invocations

  # /auth POST (for login/signup)
  JankenHockeyRestAPIMethodAuthPost:
    DeletionPolicy: RetainExceptOnCreate
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref JankenHockeyRestAPI
      ResourceId: !Ref JankenHockeyRestAPIResourceAuth
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/arn:aws:lambda:ap-northeast-1:${AWS::AccountId}:function:JankenHockeyLoginFunction/invocations

  # /cpu-battle/history POST
  JankenHockeyRestAPIMethodCpuBattleHistoryPost:
    DeletionPolicy: RetainExceptOnCreate
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref JankenHockeyRestAPI
      ResourceId: !Ref JankenHockeyRestAPIResourceCpuBattleHistory
      HttpMethod: POST
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref JankenHockeyRestAPICognitoAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${JankenHockeySaveCpuBattleHistoryFunction.Arn}/invocations

  # /cpu-battle/guest-history POST
  JankenHockeyRestAPIMethodCpuBattleGuestHistoryPost:
    DeletionPolicy: RetainExceptOnCreate
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref JankenHockeyRestAPI
      ResourceId: !Ref JankenHockeyRestAPIResourceCpuBattleGuestHistory
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${JankenHockeySaveGuestCpuBattleHistoryFunction.Arn}/invocations

  # /rooms OPTIONS
  JankenHockeyRestAPIMethodRoomsOptions:
    DeletionPolicy: RetainExceptOnCreate
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref JankenHockeyRestAPI
      ResourceId: !Ref JankenHockeyRestAPIResourceRooms
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationHttpMethod: OPTIONS
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
              method.response.header.Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
            ResponseTemplates:
              application/json: ""
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Headers: true

  # /rooms/create OPTIONS
  JankenHockeyRestAPIMethodRoomsCreateOptions:
    DeletionPolicy: RetainExceptOnCreate
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref JankenHockeyRestAPI
      ResourceId: !Ref JankenHockeyRestAPIResourceRoomsCreate
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationHttpMethod: OPTIONS
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
            ResponseTemplates:
              application/json: ""
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Headers: true

  # /rooms/join OPTIONS
  JankenHockeyRestAPIMethodRoomsJoinOptions:
    DeletionPolicy: RetainExceptOnCreate
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref JankenHockeyRestAPI
      ResourceId: !Ref JankenHockeyRestAPIResourceRoomsJoin
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationHttpMethod: OPTIONS
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
            ResponseTemplates:
              application/json: ""
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Headers: true

  # /auth OPTIONS
  JankenHockeyRestAPIMethodAuthOptions:
    DeletionPolicy: RetainExceptOnCreate
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref JankenHockeyRestAPI
      ResourceId: !Ref JankenHockeyRestAPIResourceAuth
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationHttpMethod: OPTIONS
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'https://d118vty6hgdzm2.cloudfront.net'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
            ResponseTemplates:
              application/json: ""
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Headers: true

  # /cpu-battle/history OPTIONS
  JankenHockeyRestAPIMethodCpuBattleHistoryOptions:
    DeletionPolicy: RetainExceptOnCreate
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref JankenHockeyRestAPI
      ResourceId: !Ref JankenHockeyRestAPIResourceCpuBattleHistory
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationHttpMethod: OPTIONS
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'https://d118vty6hgdzm2.cloudfront.net'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
            ResponseTemplates:
              application/json: ""
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Headers: true

  # /cpu-battle/guest-history OPTIONS
  JankenHockeyRestAPIMethodCpuBattleGuestHistoryOptions:
    DeletionPolicy: RetainExceptOnCreate
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref JankenHockeyRestAPI
      ResourceId: !Ref JankenHockeyRestAPIResourceCpuBattleGuestHistory
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        IntegrationHttpMethod: OPTIONS
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
            ResponseTemplates:
              application/json: ""
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Headers: true

  #######################
  # Lambda Permissions
  #######################
  # # Lambda Permission /rooms GET
  JankenHockeyGetRoomsPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt JankenHockeyGetRoomsFunction.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${JankenHockeyRestAPI}/*/GET/rooms

  # Lambda Permission　/rooms/create POST
  JankenHockeyCreateRoomPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt JankenHockeyCreateRoomFunction.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${JankenHockeyRestAPI}/*/POST/rooms/create

  # Lambda Permission /rooms/join POST
  JankenHockeyJoinRoomPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt JankenHockeyJoinRoomFunction.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${JankenHockeyRestAPI}/*/POST/rooms/join

  # Lambda Permission /auth POST
  JankenHockeyAuthPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:JankenHockeyLoginFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${JankenHockeyRestAPI}/*/POST/auth

  # Lambda Permission /cpu-battle/history POST
  JankenHockeyCpuBattleHistoryPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt JankenHockeySaveCpuBattleHistoryFunction.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${JankenHockeyRestAPI}/*/POST/cpu-battle/history

  # Lambda Permission /cpu-battle/guest-history POST
  JankenHockeyGuestCpuBattleHistoryPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt JankenHockeySaveGuestCpuBattleHistoryFunction.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${JankenHockeyRestAPI}/*/POST/cpu-battle/guest-history

  #######################
  # REST API Deployment
  #######################
  JankenHockeyRestAPIDeployment:
    DeletionPolicy: RetainExceptOnCreate
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - JankenHockeyRestAPIMethodRoomsGet
      - JankenHockeyRestAPIMethodRoomsCreatePost
      - JankenHockeyRestAPIMethodRoomsJoinPost
      - JankenHockeyRestAPIMethodAuthPost
      - JankenHockeyRestAPIMethodCpuBattleHistoryPost
      - JankenHockeyRestAPIMethodCpuBattleGuestHistoryPost
      - JankenHockeyRestAPIMethodRoomsOptions
      - JankenHockeyRestAPIMethodRoomsCreateOptions
      - JankenHockeyRestAPIMethodRoomsJoinOptions
      - JankenHockeyRestAPIMethodAuthOptions
      - JankenHockeyRestAPIMethodCpuBattleHistoryOptions
      - JankenHockeyRestAPIMethodCpuBattleGuestHistoryOptions
    Properties:
      RestApiId: !Ref JankenHockeyRestAPI
      Description: !Sub "Deployment triggered by Lambda package: ${LambdaZipFile}"

  #######################
  # REST API Stage
  #######################
  JankenHockeyRestAPIStage:
    DeletionPolicy: RetainExceptOnCreate
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref JankenHockeyRestAPI
      DeploymentId: !Ref JankenHockeyRestAPIDeployment
      StageName: apiprod
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          MetricsEnabled: true
          DataTraceEnabled: false
          LoggingLevel: INFO
          ThrottlingBurstLimit: 200
          ThrottlingRateLimit: 100

  #######################
  # Rest API Gateway Responses
  #######################
  # Gateway Responses for CORS support on error responses
  JankenHockeyRestAPIGatewayResponse4XX:
    DeletionPolicy: RetainExceptOnCreate
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref JankenHockeyRestAPI
      ResponseType: DEFAULT_4XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
      ResponseTemplates:
        application/json: '{"error":"Bad Request","code":"400"}'

  JankenHockeyRestAPIGatewayResponse5XX:
    DeletionPolicy: RetainExceptOnCreate
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref JankenHockeyRestAPI
      ResponseType: DEFAULT_5XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
      ResponseTemplates:
        application/json: '{"error":"Internal Server Error","code":"500"}'

  JankenHockeyRestAPIGatewayResponseUnauthorized:
    DeletionPolicy: RetainExceptOnCreate
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref JankenHockeyRestAPI
      ResponseType: UNAUTHORIZED
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
      ResponseTemplates:
        application/json: '{"error":"Unauthorized","code":"401"}'

  JankenHockeyRestAPIGatewayResponseAccessDenied:
    DeletionPolicy: RetainExceptOnCreate
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref JankenHockeyRestAPI
      ResponseType: ACCESS_DENIED
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
      ResponseTemplates:
        application/json: '{"error":"Access Denied","code":"403"}'

Outputs:
  JankenHockeyRestAPIId:
    Description: REST API ID for JankenHockey
    Value: !Ref JankenHockeyRestAPI
    Export:
      Name: JankenHockeyRestAPIId

  JankenHockeyRestAPIEndpoint:
    Description: REST API Endpoint for JankenHockey
    Value: !Sub https://${JankenHockeyRestAPI}.execute-api.${AWS::Region}.amazonaws.com/apiprod/
    Export:
      Name: JankenHockeyRestAPIEndpoint

  JankenHockeyGetRoomsFunctionName:
    Description: Lambda Function Name for JankenHockey GetRooms
    Value: !Ref JankenHockeyGetRoomsFunction
    Export:
      Name: JankenHockeyGetRoomsFunctionName

  JankenHockeyCreateRoomFunctionName:
    Description: Lambda Function Name for JankenHockey CreateRoom
    Value: !Ref JankenHockeyCreateRoomFunction
