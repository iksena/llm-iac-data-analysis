  ###############################
  # CSV Processor Lambda
  ###############################
  CSVProcessorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - !Ref CSVProcessorPolicy

  CSVProcessorLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-CSVProcessor
      ReservedConcurrentExecutions: 5
      Handler: index.lambda_handler
      Role: !GetAtt CSVProcessorRole.Arn
      Runtime: python3.13
      Timeout: 300
      MemorySize: 512
      DeadLetterConfig:
        TargetArn: !GetAtt LambdaDeadLetterQueue.Arn
      Code:
        ZipFile: |
          import json
          import boto3
          import csv
          import io
          import os
          import re
          from datetime import datetime
          from urllib.parse import unquote_plus

          def lambda_handler(event, context):
              s3_client = boto3.client('s3')
              dynamodb = boto3.resource('dynamodb')

              # Handle EventBridge event format
              if 'Records' in event:
                  # Direct S3 event
                  records = event['Records']
              else:
                  # EventBridge event - extract S3 details from detail
                  bucket = event['detail']['bucket']['name']
                  key = event['detail']['object']['key']
                  records = [{'s3': {'bucket': {'name': bucket}, 'object': {'key': key}}}]

              # Get S3 event details
              for record in records:
                  bucket = record['s3']['bucket']['name']
                  key = unquote_plus(record['s3']['object']['key'])

                  # Extract filename from S3 key
                  filename = key.split('/')[-1]

                  # Get the CSV file from S3
                  response = s3_client.get_object(Bucket=bucket, Key=key)
                  csv_content = response['Body'].read().decode('utf-8')

                  # Parse CSV - handle both with and without headers
                  csv_file = io.StringIO(csv_content)
                  csv_reader = csv.reader(csv_file)

                  # Create table name from filename (remove .csv extension)
                  base_name = filename.replace('.csv', '')
                  table_name = f"recipients-{base_name}"

                  # Create DynamoDB table
                  try:
                      table = dynamodb.create_table(
                          TableName=table_name,
                          KeySchema=[
                              {
                                  'AttributeName': 'EmailAddress',
                                  'KeyType': 'HASH'
                              }
                          ],
                          AttributeDefinitions=[
                              {
                                  'AttributeName': 'EmailAddress',
                                  'AttributeType': 'S'
                              }
                          ],
                          BillingMode='PAY_PER_REQUEST',
                          SSESpecification={
                              'Enabled': True,
                              'KMSMasterKeyId': os.environ['DYNAMODB_KMS_KEY_ID'],
                              'SSEType': 'KMS'
                          }
                      )

                      # Wait for table to be active
                      table.wait_until_exists()

                      # Register table in registry
                      registry_table = dynamodb.Table(os.environ['REGISTRY_TABLE'])
                      registry_table.put_item(
                          Item={
                              'TableName': table_name,
                              'OriginalFilename': filename,
                              'CreatedAt': datetime.now().isoformat(),
                              'S3Key': key,
                              'RecipientListTable': table_name
                          }
                      )

                      # Process CSV rows
                      first_row = True
                      email_idx = 0
                      first_name_idx = None
                      last_name_idx = None
                      topics_idx = None

                      for row in csv_reader:
                          if not row:
                              continue

                          # Check if first row is header
                          if first_row:
                              if any(cell.lower() in ['email', 'first_name', 'last_name', 'topics'] for cell in row):
                                  # This is a header row, find column indices
                                  for i, header in enumerate(row):
                                      header_lower = header.lower()
                                      if header_lower in ['email', 'emailaddress']:
                                          email_idx = i
                                      elif header_lower in ['first_name', 'firstname', 'fname']:
                                          first_name_idx = i
                                      elif header_lower in ['last_name', 'lastname', 'lname']:
                                          last_name_idx = i
                                      elif header_lower in ['topics', 'topic']:
                                          topics_idx = i
                                  first_row = False
                                  continue
                              first_row = False

                          # Extract data from row
                          email = row[email_idx].strip() if len(row) > email_idx else ''
                          first_name = row[first_name_idx].strip() if first_name_idx is not None and len(row) > first_name_idx else ''
                          last_name = row[last_name_idx].strip() if last_name_idx is not None and len(row) > last_name_idx else ''
                          topics = row[topics_idx].strip() if topics_idx is not None and len(row) > topics_idx else ''

                          if email and '@' in email:
                              # Parse topics (comma-separated)
                              topic_list = [t.strip() for t in topics.split(',') if t.strip()] if topics else []

                              table.put_item(
                                  Item={
                                      'EmailAddress': email,
                                      'FirstName': first_name,
                                      'LastName': last_name,
                                      'Topics': topic_list,
                                      'CreatedAt': datetime.now().isoformat()
                                  }
                              )

                      print(f"Successfully processed {filename} into table {table_name}")

                  except Exception as e:
                      print(f"Error processing {filename}: {str(e)}")
                      raise

              return {'statusCode': 200, 'body': 'CSV processed successfully'}
      Environment:
        Variables:
          REGISTRY_TABLE: !Ref RecipientTablesRegistry
          DYNAMODB_KMS_KEY_ID: !Ref DynamoDBKMSKey
      KmsKeyArn: !Ref LambdaKMSKeyArn

