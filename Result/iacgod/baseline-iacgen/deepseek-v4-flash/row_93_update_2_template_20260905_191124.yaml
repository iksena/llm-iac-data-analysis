AWSTemplateFormatVersion: "2010-09-09"
Description: "CIS AWS Foundations Benchmark Section 3 - Log Monitoring Controls"
Parameters:
  LogGroupName:
    Type: String
    Default: "/aws/cloudtrail/management-events"
    Description: "Name of the CloudWatch Logs log group for CloudTrail management events"
  KMSKeyAlias:
    Type: String
    Default: "CISBenchmarkKey"
    Description: "Alias for the KMS customer managed key"
  SNSTopicName:
    Type: String
    Default: "CISBenchmarkAlarms"
    Description: "Name of the SNS topic for alarm notifications"
  AlarmEmail:
    Type: String
    Default: ""
    Description: "Optional email address to subscribe to the SNS topic"
  LogGroupRetentionInDays:
    Type: Number
    Default: 365
    Description: "Retention period for the log group in days"
Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]
Resources:
  KMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: "KMS key for encrypting SNS topic and CloudWatch Logs"
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: "Enable IAM User Permissions"
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          - Sid: "Allow CloudWatch Logs to use the key"
            Effect: Allow
            Principal:
              Service: "logs.amazonaws.com"
            Action:
              - "kms:Encrypt"
              - "kms:Decrypt"
              - "kms:ReEncrypt*"
              - "kms:GenerateDataKey*"
              - "kms:DescribeKey"
            Resource: "*"
          - Sid: "Allow SNS to use the key"
            Effect: Allow
            Principal:
              Service: "sns.amazonaws.com"
            Action:
              - "kms:Decrypt"
              - "kms:GenerateDataKey"
            Resource: "*"
      KeySpec: SYMMETRIC_DEFAULT
      KeyUsage: ENCRYPT_DECRYPT
      Enabled: true
  KMSKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${KMSKeyAlias}"
      TargetKeyId: !Ref KMSKey
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Ref LogGroupName
      RetentionInDays: !Ref LogGroupRetentionInDays
      KmsKeyId: !GetAtt KMSKey.Arn
  SNSTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Ref SNSTopicName
      KmsMasterKeyId: !Ref KMSKey
  SNSSubscription:
    Condition: HasAlarmEmail
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: email
      Endpoint: !Ref AlarmEmail
      TopicArn: !Ref SNSTopic
  # Metric Filters and Alarms
  UnauthorizedAPICallsMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: '{ ($.errorCode = "*UnauthorizedOperation") || ($.errorCode = "AccessDenied*") }'
      MetricTransformations:
        - MetricValue: "1"
          MetricNamespace: "CISBenchmark"
          MetricName: "UnauthorizedAPICalls"
  UnauthorizedAPICallsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: "UnauthorizedAPICallsAlarm"
      AlarmDescription: "Alarm when unauthorized API calls are detected"
      MetricName: "UnauthorizedAPICalls"
      Namespace: "CISBenchmark"
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SNSTopic
  ConsoleSignInWithoutMFAMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: '{ ($.eventName = "ConsoleLogin") && ($.additionalEventData.MFAUsed != "Yes") }'
      MetricTransformations:
        - MetricValue: "1"
          MetricNamespace: "CISBenchmark"
          MetricName: "ConsoleSignInWithoutMFA"
  ConsoleSignInWithoutMFAAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: "ConsoleSignInWithoutMFAAlarm"
      AlarmDescription: "Alarm when console sign-in occurs without MFA"
      MetricName: "ConsoleSignInWithoutMFA"
      Namespace: "CISBenchmark"
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SNSTopic
  RootAccountUsageMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: '{ $.userIdentity.type = "Root" && $.userIdentity.invokedBy NOT EXISTS && $.eventType != "AwsServiceEvent" }'
      MetricTransformations:
        - MetricValue: "1"
          MetricNamespace: "CISBenchmark"
          MetricName: "RootAccountUsage"
  RootAccountUsageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: "RootAccountUsageAlarm"
      AlarmDescription: "Alarm when root account is used"
      MetricName: "RootAccountUsage"
      Namespace: "CISBenchmark"
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SNSTopic
  IAMPolicyChangesMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: '{ ($.eventSource = "iam.amazonaws.com") && (($.eventName = "DeleteGroupPolicy") || ($.eventName = "DeleteRolePolicy") || ($.eventName = "DeleteUserPolicy") || ($.eventName = "PutGroupPolicy") || ($.eventName = "PutRolePolicy") || ($.eventName = "PutUserPolicy") || ($.eventName = "CreatePolicy") || ($.eventName = "DeletePolicy") || ($.eventName = "CreatePolicyVersion") || ($.eventName = "DeletePolicyVersion") || ($.eventName = "AttachRolePolicy") || ($.eventName = "DetachRolePolicy") || ($.eventName = "AttachUserPolicy") || ($.eventName = "DetachUserPolicy") || ($.eventName = "AttachGroupPolicy") || ($.eventName = "DetachGroupPolicy")) }'
      MetricTransformations:
        - MetricValue: "1"
          MetricNamespace: "CISBenchmark"
          MetricName: "IAMPolicyChanges"
  IAMPolicyChangesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: "IAMPolicyChangesAlarm"
      AlarmDescription: "Alarm when IAM policy changes are detected"
      MetricName: "IAMPolicyChanges"
      Namespace: "CISBenchmark"
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SNSTopic
  CloudTrailConfigurationChangesMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: '{ ($.eventName = "CreateTrail") || ($.eventName = "UpdateTrail") || ($.eventName = "DeleteTrail") || ($.eventName = "StartLogging") || ($.eventName = "StopLogging") || ($.eventName = "PutEventSelectors") || ($.eventName = "PutInsightSelectors") }'
      MetricTransformations:
        - MetricValue: "1"
          MetricNamespace: "CISBenchmark"
          MetricName: "CloudTrailConfigurationChanges"
  CloudTrailConfigurationChangesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: "CloudTrailConfigurationChangesAlarm"
      AlarmDescription: "Alarm when CloudTrail configuration changes are detected"
      MetricName: "CloudTrailConfigurationChanges"
      Namespace: "CISBenchmark"
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SNSTopic
  ConsoleLoginFailuresMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: '{ ($.eventName = "ConsoleLogin") && ($.additionalEventData.LoginTo = "https://console.aws.amazon.com") && ($.responseElements.ConsoleLogin = "Failure") }'
      MetricTransformations:
        - MetricValue: "1"
          MetricNamespace: "CISBenchmark"
          MetricName: "ConsoleLoginFailures"
  ConsoleLoginFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: "ConsoleLoginFailuresAlarm"
      AlarmDescription: "Alarm when console login failures occur"
      MetricName: "ConsoleLoginFailures"
      Namespace: "CISBenchmark"
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SNSTopic
  KMSKeyDisablingOrDeletionMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: '{ ($.eventSource = "kms.amazonaws.com") && (($.eventName = "DisableKey") || ($.eventName = "ScheduleKeyDeletion")) }'
      MetricTransformations:
        - MetricValue: "1"
          MetricNamespace: "CISBenchmark"
          MetricName: "KMSKeyDisablingOrDeletion"
  KMSKeyDisablingOrDeletionAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: "KMSKeyDisablingOrDeletionAlarm"
      AlarmDescription: "Alarm when KMS key disabling or deletion is scheduled"
      MetricName: "KMSKeyDisablingOrDeletion"
      Namespace: "CISBenchmark"
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SNSTopic
  S3BucketPolicyChangesMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: '{ ($.eventSource = "s3.amazonaws.com") && (($.eventName = "PutBucketPolicy") || ($.eventName = "DeleteBucketPolicy") || ($.eventName = "PutBucketAcl") || ($.eventName = "PutBucketCors") || ($.eventName = "PutBucketLogging") || ($.eventName = "PutBucketNotification") || ($.eventName = "PutBucketTagging") || ($.eventName = "PutBucketVersioning") || ($.eventName = "PutBucketWebsite") || ($.eventName = "PutBucketLifecycle") || ($.eventName = "PutBucketReplication") || ($.eventName = "PutBucketEncryption") || ($.eventName = "PutBucketPublicAccessBlock")) }'
      MetricTransformations:
        - MetricValue: "1"
          MetricNamespace: "CISBenchmark"
          MetricName: "S3BucketPolicyChanges"
  S3BucketPolicyChangesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: "S3BucketPolicyChangesAlarm"
      AlarmDescription: "Alarm when S3 bucket policy changes are detected"
      MetricName: "S3BucketPolicyChanges"
      Namespace: "CISBenchmark"
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SNSTopic
  ConfigConfigurationChangesMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: '{ ($.eventSource = "config.amazonaws.com") && (($.eventName = "PutConfigurationRecorder") || ($.eventName = "StopConfigurationRecorder") || ($.eventName = "DeleteConfigurationRecorder") || ($.eventName = "PutDeliveryChannel") || ($.eventName = "DeleteDeliveryChannel") || ($.eventName = "PutConfigRule") || ($.eventName = "DeleteConfigRule") || ($.eventName = "PutConfigAggregator") || ($.eventName = "DeleteConfigAggregator")) }'
      MetricTransformations:
        - MetricValue: "1"
          MetricNamespace: "CISBenchmark"
          MetricName: "ConfigConfigurationChanges"
  ConfigConfigurationChangesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: "ConfigConfigurationChangesAlarm"
      AlarmDescription: "Alarm when AWS Config configuration changes are detected"
      MetricName: "ConfigConfigurationChanges"
      Namespace: "CISBenchmark"
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SNSTopic
  SecurityGroupChangesMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: '{ ($.eventSource = "ec2.amazonaws.com") && (($.eventName = "AuthorizeSecurityGroupIngress") || ($.eventName = "AuthorizeSecurityGroupEgress") || ($.eventName = "RevokeSecurityGroupIngress") || ($.eventName = "RevokeSecurityGroupEgress") || ($.eventName = "CreateSecurityGroup") || ($.eventName = "DeleteSecurityGroup")) }'
      MetricTransformations:
        - MetricValue: "1"
          MetricNamespace: "CISBenchmark"
          MetricName: "SecurityGroupChanges"
  SecurityGroupChangesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: "SecurityGroupChangesAlarm"
      AlarmDescription: "Alarm when security group changes are detected"
      MetricName: "SecurityGroupChanges"
      Namespace: "CISBenchmark"
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SNSTopic
  NetworkACLChangesMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: '{ ($.eventSource = "ec2.amazonaws.com") && (($.eventName = "CreateNetworkAcl") || ($.eventName = "DeleteNetworkAcl") || ($.eventName = "CreateNetworkAclEntry") || ($.eventName = "DeleteNetworkAclEntry") || ($.eventName = "ReplaceNetworkAclEntry") || ($.eventName = "ReplaceNetworkAclAssociation")) }'
      MetricTransformations:
        - MetricValue: "1"
          MetricNamespace: "CISBenchmark"
          MetricName: "NetworkACLChanges"
  NetworkACLChangesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: "NetworkACLChangesAlarm"
      AlarmDescription: "Alarm when network ACL changes are detected"
      MetricName: "NetworkACLChanges"
      Namespace: "CISBenchmark"
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SNSTopic
  NetworkGatewayChangesMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: '{ ($.eventSource = "ec2.amazonaws.com") && (($.eventName = "CreateInternetGateway") || ($.eventName = "DeleteInternetGateway") || ($.eventName = "AttachInternetGateway") || ($.eventName = "DetachInternetGateway") || ($.eventName = "CreateEgressOnlyInternetGateway") || ($.eventName = "DeleteEgressOnlyInternetGateway") || ($.eventName = "AttachEgressOnlyInternetGateway") || ($.eventName = "DetachEgressOnlyInternetGateway") || ($.eventName = "CreateNatGateway") || ($.eventName = "DeleteNatGateway")) }'
      MetricTransformations:
        - MetricValue: "1"
          MetricNamespace: "CISBenchmark"
          MetricName: "NetworkGatewayChanges"
  NetworkGatewayChangesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: "NetworkGatewayChangesAlarm"
      AlarmDescription: "Alarm when network gateway changes are detected"
      MetricName: "NetworkGatewayChanges"
      Namespace: "CISBenchmark"
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SNSTopic
  RouteTableChangesMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: '{ ($.eventSource = "ec2.amazonaws.com") && (($.eventName = "CreateRoute") || ($.eventName = "DeleteRoute") || ($.eventName = "ReplaceRoute") || ($.eventName = "CreateRouteTable") || ($.eventName = "DeleteRouteTable") || ($.eventName = "AssociateRouteTable") || ($.eventName = "DisassociateRouteTable") || ($.eventName = "ReplaceRouteTableAssociation")) }'
      MetricTransformations:
        - MetricValue: "1"
          MetricNamespace: "CISBenchmark"
          MetricName: "RouteTableChanges"
  RouteTableChangesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: "RouteTableChangesAlarm"
      AlarmDescription: "Alarm when route table changes are detected"
      MetricName: "RouteTableChanges"
      Namespace: "CISBenchmark"
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SNSTopic
  VPCChangesMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: '{ ($.eventSource = "ec2.amazonaws.com") && (($.eventName = "CreateVpc") || ($.eventName = "DeleteVpc") || ($.eventName = "ModifyVpcAttribute") || ($.eventName = "AcceptVpcPeeringConnection") || ($.eventName = "CreateVpcPeeringConnection") || ($.eventName = "DeleteVpcPeeringConnection") || ($.eventName = "RejectVpcPeeringConnection") || ($.eventName = "CreateVpcEndpoint") || ($.eventName = "DeleteVpcEndpoint") || ($.eventName = "ModifyVpcEndpoint")) }'
      MetricTransformations:
        - MetricValue: "1"
          MetricNamespace: "CISBenchmark"
          MetricName: "VPCChanges"
  VPCChangesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: "VPCChangesAlarm"
      AlarmDescription: "Alarm when VPC changes are detected"
      MetricName: "VPCChanges"
      Namespace: "CISBenchmark"
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref SNSTopic
  # Logs Insights Query Definitions
  UnauthorizedAPICallsQueryDefinition:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: "UnauthorizedAPICallsQuery"
      QueryString: "fields @timestamp, @message | filter ($.errorCode = \"*UnauthorizedOperation\") or ($.errorCode = \"AccessDenied*\") | sort @timestamp desc | limit 20"
      LogGroupNames:
        - !Ref LogGroup
  ConsoleSignInWithoutMFAQueryDefinition:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: "ConsoleSignInWithoutMFAQuery"
      QueryString: "fields @timestamp, @message | filter ($.eventName = \"ConsoleLogin\") and ($.additionalEventData.MFAUsed != \"Yes\") | sort @timestamp desc | limit 20"
      LogGroupNames:
        - !Ref LogGroup
  RootAccountUsageQueryDefinition:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: "RootAccountUsageQuery"
      QueryString: "fields @timestamp, @message | filter ($.userIdentity.type = \"Root\") and ($.userIdentity.invokedBy not exists) and ($.eventType != \"AwsServiceEvent\") | sort @timestamp desc | limit 20"
      LogGroupNames:
        - !Ref LogGroup
  IAMPolicyChangesQueryDefinition:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: "IAMPolicyChangesQuery"
      QueryString: "fields @timestamp, @message | filter ($.eventSource = \"iam.amazonaws.com\") and (($.eventName = \"DeleteGroupPolicy\") or ($.eventName = \"DeleteRolePolicy\") or ($.eventName = \"DeleteUserPolicy\") or ($.eventName = \"PutGroupPolicy\") or ($.eventName = \"PutRolePolicy\") or ($.eventName = \"PutUserPolicy\") or ($.eventName = \"CreatePolicy\") or ($.eventName = \"DeletePolicy\") or ($.eventName = \"CreatePolicyVersion\") or ($.eventName = \"DeletePolicyVersion\") or ($.eventName = \"AttachRolePolicy\") or ($.eventName = \"DetachRolePolicy\") or ($.eventName = \"AttachUserPolicy\") or ($.eventName = \"DetachUserPolicy\") or ($.eventName = \"AttachGroupPolicy\") or ($.eventName = \"DetachGroupPolicy\")) | sort @timestamp desc | limit 20"
      LogGroupNames:
        - !Ref LogGroup
  CloudTrailConfigurationChangesQueryDefinition:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: "CloudTrailConfigurationChangesQuery"
      QueryString: "fields @timestamp, @message | filter ($.eventName = \"CreateTrail\") or ($.eventName = \"UpdateTrail\") or ($.eventName = \"DeleteTrail\") or ($.eventName = \"StartLogging\") or ($.eventName = \"StopLogging\") or ($.eventName = \"PutEventSelectors\") or ($.eventName = \"PutInsightSelectors\") | sort @timestamp desc | limit 20"
      LogGroupNames:
        - !Ref LogGroup
  ConsoleLoginFailuresQueryDefinition:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: "ConsoleLoginFailuresQuery"
      QueryString: "fields @timestamp, @message | filter ($.eventName = \"ConsoleLogin\") and ($.additionalEventData.LoginTo = \"https://console.aws.amazon.com\") and ($.responseElements.ConsoleLogin = \"Failure\") | sort @timestamp desc | limit 20"
      LogGroupNames:
        - !Ref LogGroup
  KMSKeyDisablingOrDeletionQueryDefinition:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: "KMSKeyDisablingOrDeletionQuery"
      QueryString: "fields @timestamp, @message | filter ($.eventSource = \"kms.amazonaws.com\") and (($.eventName = \"DisableKey\") or ($.eventName = \"ScheduleKeyDeletion\")) | sort @timestamp desc | limit 20"
      LogGroupNames:
        - !Ref LogGroup
  S3BucketPolicyChangesQueryDefinition:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: "S3BucketPolicyChangesQuery"
      QueryString: "fields @timestamp, @message | filter ($.eventSource = \"s3.amazonaws.com\") and (($.eventName = \"PutBucketPolicy\") or ($.eventName = \"DeleteBucketPolicy\") or ($.eventName = \"PutBucketAcl\") or ($.eventName = \"PutBucketCors\") or ($.eventName = \"PutBucketLogging\") or ($.eventName = \"PutBucketNotification\") or ($.eventName = \"PutBucketTagging\") or ($.eventName = \"PutBucketVersioning\") or ($.eventName = \"PutBucketWebsite\") or ($.eventName = \"PutBucketLifecycle\") or ($.eventName = \"PutBucketReplication\") or ($.eventName = \"PutBucketEncryption\") or ($.eventName = \"PutBucketPublicAccessBlock\")) | sort @timestamp desc | limit 20"
      LogGroupNames:
        - !Ref LogGroup
  ConfigConfigurationChangesQueryDefinition:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: "ConfigConfigurationChangesQuery"
      QueryString: "fields @timestamp, @message | filter ($.eventSource = \"config.amazonaws.com\") and (($.eventName = \"PutConfigurationRecorder\") or ($.eventName = \"StopConfigurationRecorder\") or ($.eventName = \"DeleteConfigurationRecorder\") or ($.eventName = \"PutDeliveryChannel\") or ($.eventName = \"DeleteDeliveryChannel\") or ($.eventName = \"PutConfigRule\") or ($.eventName = \"DeleteConfigRule\") or ($.eventName = \"PutConfigAggregator\") or ($.eventName = \"DeleteConfigAggregator\")) | sort @timestamp desc | limit 20"
      LogGroupNames:
        - !Ref LogGroup
  SecurityGroupChangesQueryDefinition:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: "SecurityGroupChangesQuery"
      QueryString: "fields @timestamp, @message | filter ($.eventSource = \"ec2.amazonaws.com\") and (($.eventName = \"AuthorizeSecurityGroupIngress\") or ($.eventName = \"AuthorizeSecurityGroupEgress\") or ($.eventName = \"RevokeSecurityGroupIngress\") or ($.eventName = \"RevokeSecurityGroupEgress\") or ($.eventName = \"CreateSecurityGroup\") or ($.eventName = \"DeleteSecurityGroup\")) | sort @timestamp desc | limit 20"
      LogGroupNames:
        - !Ref LogGroup
  NetworkACLChangesQueryDefinition:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: "NetworkACLChangesQuery"
      QueryString: "fields @timestamp, @message | filter ($.eventSource = \"ec2.amazonaws.com\") and (($.eventName = \"CreateNetworkAcl\") or ($.eventName = \"DeleteNetworkAcl\") or ($.eventName = \"CreateNetworkAclEntry\") or ($.eventName = \"DeleteNetworkAclEntry\") or ($.eventName = \"ReplaceNetworkAclEntry\") or ($.eventName = \"ReplaceNetworkAclAssociation\")) | sort @timestamp desc | limit 20"
      LogGroupNames:
        - !Ref LogGroup
  NetworkGatewayChangesQueryDefinition:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: "NetworkGatewayChangesQuery"
      QueryString: "fields @timestamp, @message | filter ($.eventSource = \"ec2.amazonaws.com\") and (($.eventName = \"CreateInternetGateway\") or ($.eventName = \"DeleteInternetGateway\") or ($.eventName = \"AttachInternetGateway\") or ($.eventName = \"DetachInternetGateway\") or ($.eventName = \"CreateEgressOnlyInternetGateway\") or ($.eventName = \"DeleteEgressOnlyInternetGateway\") or ($.eventName = \"AttachEgressOnlyInternetGateway\") or ($.eventName = \"DetachEgressOnlyInternetGateway\") or ($.eventName = \"CreateNatGateway\") or ($.eventName = \"DeleteNatGateway\")) | sort @timestamp desc | limit 20"
      LogGroupNames:
        - !Ref LogGroup
  RouteTableChangesQueryDefinition:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: "RouteTableChangesQuery"
      QueryString: "fields @timestamp, @message | filter ($.eventSource = \"ec2.amazonaws.com\") and (($.eventName = \"CreateRoute\") or ($.eventName = \"DeleteRoute\") or ($.eventName = \"ReplaceRoute\") or ($.eventName = \"CreateRouteTable\") or ($.eventName = \"DeleteRouteTable\") or ($.eventName = \"AssociateRouteTable\") or ($.eventName = \"DisassociateRouteTable\") or ($.eventName = \"ReplaceRouteTableAssociation\")) | sort @timestamp desc | limit 20"
      LogGroupNames:
        - !Ref LogGroup
  VPCChangesQueryDefinition:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: "VPCChangesQuery"
      QueryString: "fields @timestamp, @message | filter ($.eventSource = \"ec2.amazonaws.com\") and (($.eventName = \"CreateVpc\") or ($.eventName = \"DeleteVpc\") or ($.eventName = \"ModifyVpcAttribute\") or ($.eventName = \"AcceptVpcPeeringConnection\") or ($.eventName = \"CreateVpcPeeringConnection\") or ($.eventName = \"DeleteVpcPeeringConnection\") or ($.eventName = \"RejectVpcPeeringConnection\") or ($.eventName = \"CreateVpcEndpoint\") or ($.eventName = \"DeleteVpcEndpoint\") or ($.eventName = \"ModifyVpcEndpoint\")) | sort @timestamp desc | limit 20"
      LogGroupNames:
        - !Ref LogGroup
Outputs:
  LogGroupName:
    Description: "CloudWatch Logs log group name"
    Value: !Ref LogGroup
  SNSTopicArn:
    Description: "SNS topic ARN for alarm notifications"
    Value: !Ref SNSTopic
  KMSKeyArn:
    Description: "KMS key ARN"
    Value: !GetAtt KMSKey.Arn