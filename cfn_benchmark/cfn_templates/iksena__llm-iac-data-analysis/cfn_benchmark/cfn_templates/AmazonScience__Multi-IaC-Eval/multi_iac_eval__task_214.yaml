Description: |
  Create a DynamoDB table using on demand billing and add an Amazon S3 bucket with versioning and secure transport.

Resources:

  # A DynamoDB Table
  CustomerTable:
    Type: AWS::DynamoDB::Table
    Metadata:
      Comment: A simple table that passes security scanner checks
      checkov:
        skip:
          - id: "CKV_AWS_119"
            comment: "SSEType KMS stores the key in the customer account"
      guard:
        SuppressedRules:
          - DYNAMODB_TABLE_ENCRYPTED_KMS
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS

  # An Amazon S3 Bucket
  CustomerBucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration:
       Status: Enabled
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
            AllowedMethods: ["GET", "POST", "PUT", "DELETE", "HEAD"]
            AllowedOrigins: ["*"]
            ExposedHeaders: ["ETag"]
            MaxAgeSeconds: 3000
            AllowedHeaders: ["Authorization"]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

  # Enforce HTTPS for S3 Bucket
  CustomerBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CustomerBucket
      PolicyDocument:
        Statement:
          - Sid: EnforceSSL
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !Sub "arn:aws:s3:::${CustomerBucket}/*"
              - !Sub "arn:aws:s3:::${CustomerBucket}"
            Condition:
              Bool:
                "aws:SecureTransport": "false"