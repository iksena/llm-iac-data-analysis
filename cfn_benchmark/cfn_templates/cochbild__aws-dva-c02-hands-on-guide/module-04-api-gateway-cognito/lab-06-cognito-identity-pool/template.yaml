AWSTemplateFormatVersion: "2010-09-09"
Description: |
  DVA-C02 Lab 4.6 — Cognito Identity Pool federating with Lab 4.5 User Pool.
  Authenticated users get scoped S3 access via STS-issued temporary credentials.

Resources:

  # Private S3 bucket only the auth role can reach
  PrivateBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub "dva-lab-04-06-${AWS::AccountId}-${AWS::Region}"
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  IdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      IdentityPoolName: dva_lab_04_06_idpool
      AllowUnauthenticatedIdentities: false
      CognitoIdentityProviders:
        - ClientId: !ImportValue dva-lab-04-05-client-id
          ProviderName: !Sub
            - cognito-idp.${AWS::Region}.amazonaws.com/${PoolId}
            - PoolId: !ImportValue dva-lab-04-05-user-pool-id

  # Authenticated role — assumed by users who signed in via the User Pool
  AuthRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dva-lab-04-06-auth-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "cognito-identity.amazonaws.com:aud": !Ref IdentityPool
              "ForAnyValue:StringLike":
                "cognito-identity.amazonaws.com:amr": authenticated
      Policies:
        - PolicyName: ScopedS3Access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt PrivateBucket.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub "${PrivateBucket.Arn}/*"

  IdentityPoolRoleAttachment:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Properties:
      IdentityPoolId: !Ref IdentityPool
      Roles:
        authenticated: !GetAtt AuthRole.Arn

Outputs:
  IdentityPoolId:
    Value: !Ref IdentityPool
  AuthRoleArn:
    Value: !GetAtt AuthRole.Arn
  BucketName:
    Value: !Ref PrivateBucket