AWSTemplateFormatVersion: '2010-09-09'
Resources:
  NestedStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: nested/child-local.yaml
  RemoteNested:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL:
        Fn::Sub: https://example.com/${AWS::StackName}.yaml