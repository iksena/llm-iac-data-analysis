AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Resources:
  PaymentsApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      EndpointConfiguration:
        Types:
          - PRIVATE
      DefinitionBody:
        openapi: 3.0.3
        info:
          title: Payments API
          version: 1.0.0
        paths:
          /payments:
            get:
              operationId: listPayments
              responses:
                '200':
                  description: OK