AWSTemplateFormatVersion: '2010-09-09'
Description: E-commerce order processing stack - intentionally insecure for review testing

Resources:
  OrdersBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: ecommerce-orders-raw

  PaymentQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: payment-processing-queue
      VisibilityTimeout: 30

  OrderProcessorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: order-processor
      Runtime: python3.11
      Handler: index.handler
      MemorySize: 128
      Code:
        ZipFile: |
          def handler(event, context):
            return {"statusCode": 200}
      Role: !GetAtt OrderProcessorRole.Arn

  OrderProcessorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: FullAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: '*'
                Resource: '*'

  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: orders
      AttributeDefinitions:
        - AttributeName: orderId
          AttributeType: S
      KeySchema:
        - AttributeName: orderId
          KeyType: HASH

  PaymentApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: payment-api
      Description: Handles payment processing requests

  CustomerDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: customer-pii-data