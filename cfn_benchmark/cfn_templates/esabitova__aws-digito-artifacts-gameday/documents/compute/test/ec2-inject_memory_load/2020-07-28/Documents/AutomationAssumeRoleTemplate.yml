---
AWSTemplateFormatVersion: 2010-09-09
Description: Role for SSM Asg High Memory Simulation
Outputs:
  DigitoSimulateHighMemoryLoadInEc2AssumeRole:
    Description: DigitoSimulateHighMemoryLoadInEc2 Automation Assume Role ARN
    Value:
      Fn::GetAtt: DigitoSimulateHighMemoryLoadInEc2AssumeRole.Arn
Resources:
  DigitoSimulateHighMemoryLoadInEc2AssumeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ssm.amazonaws.com
            Action:
              - sts:AssumeRole
  DigitoSimulateHighMemoryLoadInEc2AssumePolicy:
    Type: 'AWS::IAM::Policy'
    Properties:
      PolicyName: "DigitoSimulateHighMemoryLoadInEc2AssumePolicy"
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Resource: '*'
            Action:
              - 'ssm:SendCommand'
              - 'ssm:ListCommands'
              - 'ssm:ListCommandInvocations'
              - 'ssm:DescribeInstanceInformation'
              - 'ssm:GetAutomationExecution'
              - 'ssm:CancelCommand'
              - 'ssm:StartAutomationExecution'
              - 'cloudwatch:DescribeAlarmHistory'
              - 'cloudwatch:DescribeAlarms'
              - 'cloudwatch:GetMetricStatistics'
          - Effect: Allow
            Resource:
              - Fn::GetAtt: DigitoSimulateHighMemoryLoadInEc2AssumeRole.Arn
            Action:
              - iam:PassRole
      Roles:
        - Ref: DigitoSimulateHighMemoryLoadInEc2AssumeRole