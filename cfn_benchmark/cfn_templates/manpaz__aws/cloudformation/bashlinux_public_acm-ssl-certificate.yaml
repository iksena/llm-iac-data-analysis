---
# Bashlinux::Public::ACM::SSL Certificate
#
#   Cloudformation template to request an SSL certificate
#
#   Manuel F Martinez
#   Bashlinux
#   Los Angeles, CA
#
AWSTemplateFormatVersion: "2010-09-09"
Description: ACM Public SSL Certificate template

###############################################################################
Parameters:

  Environment:
    Description: Environment this domain name belongs to
    Type: String
    MinLength: "1"
    MaxLength: "20"
    Default: staging
    AllowedValues: [ "prod", "staging" ]
    ConstraintDescription: Can only contain "prod" or "staging".

  FQDN:
    Description: The fully qualified domain name for the requested certificate
    Type: String
    MinLength: "1"
    MaxLength: "64"
    Default: bashlinux.it

  NetworkVisibility:
    Description: Where the certificate is intended to be used
    Type: String
    MinLength: "6"
    MaxLength: "7"
    Default: Private
    AllowedValues: [ "Public", "Private" ]
    ConstraintDescription: Can only contain "Public" or "Private".

  Organization:
    Description: Organization or Customer name
    Type: String
    MinLength: "1"
    MaxLength: "32"
    Default: bashlinux
    AllowedPattern: "[a-zA-Z0-9\\-]*"
    ConstraintDescription: >
      Name of the organization must contains only letters, numbers and hyphens

###############################################################################
Conditions:

  IsNotDefault: !Not [!Equals [!Ref Organization, "bashlinux"]]

###############################################################################
Resources:

  # SSL Certificate -----------------------------------------------------------
  SslCertificate:
    Type: "AWS::CertificateManager::Certificate"
    Properties:
      DomainName: !Ref FQDN
      DomainValidationOptions:
        - DomainName: !Ref FQDN
          HostedZoneId: !ImportValue
            "Fn::Sub": "bashlinux-${Environment}-${NetworkVisibility}HostedZoneId"
      SubjectAlternativeNames:
        - !Sub "*.${FQDN}"
      ValidationMethod: DNS
      Tags:
      - Key: Name
        Value: !Ref FQDN
      - Key: bashlinux:organization-name
        Value: !Ref Organization
      - Key: bashlinux:environment-name
        Value: !Ref Environment
      - Key: bashlinux:application-id
        Value: !Ref AWS::StackName
      - Key: bashlinux:network-visibility
        Value: public
      - Key: bashlinux:can-delete
        Value: "false"

  ListenerCertificateForSubdomain:
    Type: AWS::ElasticLoadBalancingV2::ListenerCertificate
    Condition: IsNotDefault
    Properties:
      ListenerArn: !ImportValue
        "Fn::Sub": "bashlinux-${Environment}-PublicAlbListenerHTTPSArn"
      Certificates:
        - CertificateArn: !Ref SslCertificate

###############################################################################
Outputs:

  SslCertificateArn:
    Description: ARN of the SSL Certificate
    Value: !Ref SslCertificate
    Export:
      Name: !Sub "${Organization}-${Environment}-SslCertificateArn"

  DomainName:
    Description: Domain Names registered
    Value: !Ref FQDN
    Export:
      Name: !Sub "${Organization}-${Environment}-DomainName"