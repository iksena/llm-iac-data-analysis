AWSTemplateFormatVersion: '2010-09-09'
Description: 'Configurable Multi-Tier VPC with Flow Logs and NAT Gateway Options'

Parameters:
  VpcCidr:
    Type: String
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$
    ConstraintDescription: Must be a valid IPv4 CIDR notation
    Description: CIDR block for the VPC
    Default: '10.0.0.0/16'

  NumberOfAZs:
    Type: String
    AllowedValues:
      - '1'
      - '2'
      - '3'
    Default: '2'
    Description: Number of Availability Zones to use (1-3)

  EnableTier1:
    Type: String
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'true'
    Description: Enable the first tier (typically public)

  Tier1Name:
    Type: String
    Default: Public
    Description: Name for the first tier

  Tier1Cidr:
    Type: CommaDelimitedList
    Description: Comma-separated list of CIDR blocks for Tier 1 subnets (one per AZ)
    Default: '10.0.1.0/24,10.0.2.0/24,10.0.3.0/24'

  EnableTier2:
    Type: String
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'true'
    Description: Enable the second tier

  Tier2Name:
    Type: String
    Default: Private
    Description: Name for the second tier

  Tier2Cidr:
    Type: CommaDelimitedList
    Description: Comma-separated list of CIDR blocks for Tier 2 subnets (one per AZ)
    Default: '10.0.10.0/24,10.0.11.0/24,10.0.12.0/24'

  EnableTier3:
    Type: String
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'false'
    Description: Enable the third tier

  Tier3Name:
    Type: String
    Default: Restricted
    Description: Name for the third tier

  Tier3Cidr:
    Type: CommaDelimitedList
    Description: Comma-separated list of CIDR blocks for Tier 3 subnets (one per AZ)
    Default: '10.0.20.0/24,10.0.21.0/24,10.0.22.0/24'

  CreateInternetGateway:
    Type: String
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'true'
    Description: Create an Internet Gateway for tier 1

  NatGatewayType:
    Type: String
    AllowedValues:
      - None
      - Single
      - PerAz
    Default: None
    Description: Configure NAT Gateways (None, Single shared, or one per AZ)

  EnableFlowLogs:
    Type: String
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'true'
    Description: Enable VPC Flow Logs

  PermissionsBoundaryArn:
    Type: String
    Default: ''
    Description: Optional IAM permissions boundary ARN for Flow Logs role

Conditions:
  HasTier1: !Equals [!Ref EnableTier1, 'true']
  HasTier2: !Equals [!Ref EnableTier2, 'true']
  HasTier3: !Equals [!Ref EnableTier3, 'true']
  CreateIGW: !And [!Equals [!Ref CreateInternetGateway, 'true'], !Ref HasTier1]
  CreateFlowLogs: !Equals [!Ref EnableFlowLogs, 'true']
  UsePermissionsBoundary: !Not [!Equals [!Ref PermissionsBoundaryArn, '']]
  NatSingle: !Equals [!Ref NatGatewayType, 'Single']
  NatPerAz: !Equals [!Ref NatGatewayType, 'PerAz']

Mappings:
  AzCountMap:
    '1':
      Count: 1
    '2':
      Count: 2
    '3':
      Count: 3

  SubnetIndexMap:
    '0':
      Index: 0
    '1':
      Index: 1
    '2':
      Index: 2

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-VPC'

  # Flow Logs Resources
  FlowLogsLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: CreateFlowLogs
    Properties:
      RetentionInDays: 14
      LogGroupName: !Sub '/aws/vpc/flowlogs/${AWS::StackName}'

  FlowLogsRole:
    Type: AWS::IAM::Role
    Condition: CreateFlowLogs
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: vpc-flow-logs.amazonaws.com
            Action: sts:AssumeRole
      Path: '/'
      PermissionsBoundary: !If [UsePermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref 'AWS::NoValue']
      Policies:
        - PolicyName: flow-logs-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                Resource: !GetAtt FlowLogsLogGroup.Arn

  FlowLog:
    Type: AWS::EC2::FlowLog
    Condition: CreateFlowLogs
    Properties:
      DeliverLogsPermissionArn: !GetAtt FlowLogsRole.Arn
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Ref FlowLogsLogGroup
      ResourceType: VPC
      ResourceId: !Ref VPC
      TrafficType: ALL

  # Internet Gateway Resources
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Condition: CreateIGW
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-IGW'

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Condition: CreateIGW
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # Subnet Resources - Iterate over AZ indices 0,1,2
  # Tier 1 Subnets
  Tier1Subnet0:
    Type: AWS::EC2::Subnet
    Condition: HasTier1
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [0, !Ref Tier1Cidr]
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${Tier1Name}-${AWS::StackName}-0'

  Tier1Subnet1:
    Type: AWS::EC2::Subnet
    Condition: !And [!Ref HasTier1, !Not [!Equals [!Ref NumberOfAZs, '1']]]
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [1, !Ref Tier1Cidr]
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${Tier1Name}-${AWS::StackName}-1'

  Tier1Subnet2:
    Type: AWS::EC2::Subnet
    Condition: !And [!Ref HasTier1, !Equals [!Ref NumberOfAZs, '3']]
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [2, !Ref Tier1Cidr]
      AvailabilityZone: !Select [2, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${Tier1Name}-${AWS::StackName}-2'

  # Tier 2 Subnets
  Tier2Subnet0:
    Type: AWS::EC2::Subnet
    Condition: HasTier2
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [0, !Ref Tier2Cidr]
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${Tier2Name}-${AWS::StackName}-0'

  Tier2Subnet1:
    Type: AWS::EC2::Subnet
    Condition: !And [!Ref HasTier2, !Not [!Equals [!Ref NumberOfAZs, '1']]]
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [1, !Ref Tier2Cidr]
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${Tier2Name}-${AWS::StackName}-1'

  Tier2Subnet2:
    Type: AWS::EC2::Subnet
    Condition: !And [!Ref HasTier2, !Equals [!Ref NumberOfAZs, '3']]
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [2, !Ref Tier2Cidr]
      AvailabilityZone: !Select [2, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${Tier2Name}-${AWS::StackName}-2'

  # Tier 3 Subnets
  Tier3Subnet0:
    Type: AWS::EC2::Subnet
    Condition: HasTier3
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [0, !Ref Tier3Cidr]
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${Tier3Name}-${AWS::StackName}-0'

  Tier3Subnet1:
    Type: AWS::EC2::Subnet
    Condition: !And [!Ref HasTier3, !Not [!Equals [!Ref NumberOfAZs, '1']]]
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [1, !Ref Tier3Cidr]
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${Tier3Name}-${AWS::StackName}-1'

  Tier3Subnet2:
    Type: AWS::EC2::Subnet
    Condition: !And [!Ref HasTier3, !Equals [!Ref NumberOfAZs, '3']]
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [2, !Ref Tier3Cidr]
      AvailabilityZone: !Select [2, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${Tier3Name}-${AWS::StackName}-2'

  # Route Tables
  RouteTableTier1:
    Type: AWS::EC2::RouteTable
    Condition: HasTier1
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${Tier1Name}-${AWS::StackName}'

  RouteTableTier2:
    Type: AWS::EC2::RouteTable
    Condition: HasTier2
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${Tier2Name}-${AWS::StackName}'

  RouteTableTier3:
    Type: AWS::EC2::RouteTable
    Condition: HasTier3
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${Tier3Name}-${AWS::StackName}'

  # Route to Internet Gateway for Tier 1
  RouteIGW:
    Type: AWS::EC2::Route
    Condition: CreateIGW
    Properties:
      RouteTableId: !Ref RouteTableTier1
      DestinationCidrBlock: '0.0.0.0/0'
      GatewayId: !Ref InternetGateway

  # NAT Gateway Resources
  NatEIPShared:
    Type: AWS::EC2::EIP
    Condition: NatSingle
    Properties:
      Domain: vpc

  NatGatewayShared:
    Type: AWS::EC2::NatGateway
    Condition: NatSingle
    Properties:
      AllocationId: !GetAtt NatEIPShared.AllocationId
      SubnetId: !If [HasTier1, !Ref Tier1Subnet0, !Ref 'AWS::NoValue']

  NatEIP0:
    Type: AWS::EC2::EIP
    Condition: NatPerAz
    Properties:
      Domain: vpc

  NatGateway0:
    Type: AWS::EC2::NatGateway
    Condition: NatPerAz
    Properties:
      AllocationId: !GetAtt NatEIP0.AllocationId
      SubnetId: !If [HasTier1, !Ref Tier1Subnet0, !Ref 'AWS::NoValue']

  NatEIP1:
    Type: AWS::EC2::EIP
    Condition: !And [!Ref NatPerAz, !Not [!Equals [!Ref NumberOfAZs, '1']]]
    Properties:
      Domain: vpc

  NatGateway1:
    Type: AWS::EC2::NatGateway
    Condition: !And [!Ref NatPerAz, !Not [!Equals [!Ref NumberOfAZs, '1']]]
    Properties:
      AllocationId: !GetAtt NatEIP1.AllocationId
      SubnetId: !If [HasTier1, !Ref Tier1Subnet1, !Ref 'AWS::NoValue']

  NatEIP2:
    Type: AWS::EC2::EIP
    Condition: !And [!Ref NatPerAz, !Equals [!Ref NumberOfAZs, '3']]
    Properties:
      Domain: vpc

  NatGateway2:
    Type: AWS::EC2::NatGateway
    Condition: !And [!Ref NatPerAz, !Equals [!Ref NumberOfAZs, '3']]
    Properties:
      AllocationId: !GetAtt NatEIP2.AllocationId
      SubnetId: !If [HasTier1, !Ref Tier1Subnet2, !Ref 'AWS::NoValue']

  # Routes to NAT Gateways for Tier 2 and Tier 3
  RouteTier2ToNat:
    Type: AWS::EC2::Route
    Condition: !And [!Ref HasTier2, !Or [!Ref NatSingle, !Ref NatPerAz]]
    Properties:
      RouteTableId: !Ref RouteTableTier2
      DestinationCidrBlock: '0.0.0.0/0'
      NatGatewayId: !If [NatSingle, !Ref NatGatewayShared, !If [NatPerAz, !Ref NatGateway0, !Ref 'AWS::NoValue']]

  RouteTier3ToNat:
    Type: AWS::EC2::Route
    Condition: !And [!Ref HasTier3, !Or [!Ref NatSingle, !Ref NatPerAz]]
    Properties:
      RouteTableId: !Ref RouteTableTier3
      DestinationCidrBlock: '0.0.0.0/0'
      NatGatewayId: !If [NatSingle, !Ref NatGatewayShared, !If [NatPerAz, !Ref NatGateway0, !Ref 'AWS::NoValue']]

  # Subnet to Route Table Associations - Tier 1
  SubnetRouteAssocTier1_0:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: HasTier1
    Properties:
      SubnetId: !Ref Tier1Subnet0
      RouteTableId: !Ref RouteTableTier1

  SubnetRouteAssocTier1_1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: !And [!Ref HasTier1, !Not [!Equals [!Ref NumberOfAZs, '1']]]
    Properties:
      SubnetId: !Ref Tier1Subnet1
      RouteTableId: !Ref RouteTableTier1

  SubnetRouteAssocTier1_2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: !And [!Ref HasTier1, !Equals [!Ref NumberOfAZs, '3']]
    Properties:
      SubnetId: !Ref Tier1Subnet2
      RouteTableId: !Ref RouteTableTier1

  # Subnet to Route Table Associations - Tier 2
  SubnetRouteAssocTier2_0:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: HasTier2
    Properties:
      SubnetId: !Ref Tier2Subnet0
      RouteTableId: !Ref RouteTableTier2

  SubnetRouteAssocTier2_1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: !And [!Ref HasTier2, !Not [!Equals [!Ref NumberOfAZs, '1']]]
    Properties:
      SubnetId: !Ref Tier2Subnet1
      RouteTableId: !Ref RouteTableTier2

  SubnetRouteAssocTier2_2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: !And [!Ref HasTier2, !Equals [!Ref NumberOfAZs, '3']]
    Properties:
      SubnetId: !Ref Tier2Subnet2
      RouteTableId: !Ref RouteTableTier2

  # Subnet to Route Table Associations - Tier 3
  SubnetRouteAssocTier3_0:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: HasTier3
    Properties:
      SubnetId: !Ref Tier3Subnet0
      RouteTableId: !Ref RouteTableTier3

  SubnetRouteAssocTier3_1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: !And [!Ref HasTier3, !Not [!Equals [!Ref NumberOfAZs, '1']]]
    Properties:
      SubnetId: !Ref Tier3Subnet1
      RouteTableId: !Ref RouteTableTier3

  SubnetRouteAssocTier3_2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: !And [!Ref HasTier3, !Equals [!Ref NumberOfAZs, '3']]
    Properties:
      SubnetId: !Ref Tier3Subnet2
      RouteTableId: !Ref RouteTableTier3

Outputs:
  VPCId:
    Description: ID of the VPC
    Value: !Ref VPC
    Export:
      Name: !Sub '${AWS::StackName}-VPCId'

  Tier1SubnetIds:
    Description: Subnet IDs for Tier 1
    Value: !If
      - HasTier1
      - !Join [',', [!Ref Tier1Subnet0, !If [!Not [!Equals [!Ref NumberOfAZs, '1']], !Ref Tier1Subnet1, !Ref 'AWS::NoValue'], !If [!Equals [!Ref NumberOfAZs, '3'], !Ref Tier1Subnet2, !Ref 'AWS::NoValue']]]
      - ''
    Export:
      Name: !Sub '${AWS::StackName}-Tier1SubnetIds'

  Tier2SubnetIds:
    Description: Subnet IDs for Tier 2
    Value: !If
      - HasTier2
      - !Join [',', [!Ref Tier2Subnet0, !If [!Not [!Equals [!Ref NumberOfAZs, '1']], !Ref Tier2Subnet1, !Ref 'AWS::NoValue'], !If [!Equals [!Ref NumberOfAZs, '3'], !Ref Tier2Subnet2, !Ref 'AWS::NoValue']]]
      - ''
    Export:
      Name: !Sub '${AWS::StackName}-Tier2SubnetIds'

  Tier3SubnetIds:
    Description: Subnet IDs for Tier 3
    Value: !If
      - HasTier3
      - !Join [',', [!Ref Tier3Subnet0, !If [!Not [!Equals [!Ref NumberOfAZs, '1']], !Ref Tier3Subnet1, !Ref 'AWS::NoValue'], !If [!Equals [!Ref NumberOfAZs, '3'], !Ref Tier3Subnet2, !Ref 'AWS::NoValue']]]
      - ''
    Export:
      Name: !Sub '${AWS::StackName}-Tier3SubnetIds'

  AllSubnetIds:
    Description: All subnet IDs
    Value: !If
      - HasTier1
      - !Join [',', [!If [HasTier1, !Ref Tier1Subnet0, ''], !If [!And [HasTier1, !Not [!Equals [!Ref NumberOfAZs, '1']]], !Ref Tier1Subnet1, ''], !If [!And [HasTier1, !Equals [!Ref NumberOfAZs, '3']], !Ref Tier1Subnet2, ''], !If [HasTier2, !Ref Tier2Subnet0, ''], !If [!And [HasTier2, !Not [!Equals [!Ref NumberOfAZs, '1']]], !Ref Tier2Subnet1, ''], !If [!And [HasTier2, !Equals [!Ref NumberOfAZs, '3']], !Ref Tier2Subnet2, ''], !If [HasTier3, !Ref Tier3Subnet0, ''], !If [!And [HasTier3, !Not [!Equals [!Ref NumberOfAZs, '1']]], !Ref Tier3Subnet1, ''], !If [!And [HasTier3, !Equals [!Ref NumberOfAZs, '3']], !Ref Tier3Subnet2, '']]]
      - ''

  NatGatewayIds:
    Description: NAT Gateway IDs
    Value: !If
      - NatSingle
      - !Ref NatGatewayShared
      - !If
        - NatPerAz
        - !Join [',', [!Ref NatGateway0, !If [!Not [!Equals [!Ref NumberOfAZs, '1']], !Ref NatGateway1, ''], !If [!Equals [!Ref NumberOfAZs, '3']], !Ref NatGateway2, '']]
        - 'None'