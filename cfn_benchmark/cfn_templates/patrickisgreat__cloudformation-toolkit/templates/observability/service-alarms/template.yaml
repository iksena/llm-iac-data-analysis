AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  The alarm set for a load-balanced container service - 5xx rate, target health,
  latency, saturation, and a dead-letter queue depth - all routed to one SNS
  topic.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Naming
        Parameters:
          - NamePrefix
          - Environment
          - ServiceSuffix
      - Label:
          default: Notification
        Parameters:
          - AlarmTopicArn
      - Label:
          default: Targets to watch
        Parameters:
          - LoadBalancerFullName
          - TargetGroupFullName
          - EcsClusterName
          - EcsServiceName
          - DeadLetterQueueName
      - Label:
          default: Thresholds
        Parameters:
          - Http5xxThreshold
          - LatencyThresholdSeconds
          - CpuThresholdPercent
          - MemoryThresholdPercent
          - DeadLetterMessageThreshold

Parameters:
  NamePrefix:
    Type: String
    Description: Prefix for alarm names.
    AllowedPattern: "^[a-z][a-z0-9-]{1,30}[a-z0-9]$"
    ConstraintDescription: 3-32 lowercase characters, digits and hyphens.

  Environment:
    Type: String
    Description: Environment being monitored.
    Default: dev
    AllowedValues: [dev, staging, prod]

  ServiceSuffix:
    Type: String
    Description: Service these alarms belong to.
    Default: app
    AllowedPattern: "^[a-z0-9][a-z0-9-]{0,30}$"

  AlarmTopicArn:
    Type: String
    Description: >-
      SNS topic every alarm notifies, from messaging/sns-topic. Verify the
      subscription is confirmed - an unconfirmed email subscription makes the
      whole alarm set silent while looking healthy.

  LoadBalancerFullName:
    Type: String
    Description: >-
      Load balancer full name (app/<name>/<id>) from containers/alb. Leave empty
      to skip the load balancer alarms.
    Default: ""

  TargetGroupFullName:
    Type: String
    Description: Target group full name from containers/fargate-service. Required with the load balancer.
    Default: ""

  EcsClusterName:
    Type: String
    Description: ECS cluster name. Leave empty to skip the saturation alarms.
    Default: ""

  EcsServiceName:
    Type: String
    Description: ECS service name. Required with the cluster name.
    Default: ""

  DeadLetterQueueName:
    Type: String
    Description: >-
      Dead-letter queue name from messaging/sqs-queue. A non-zero DLQ is the
      single most useful signal a queue-backed system produces. Leave empty to
      skip.
    Default: ""

  Http5xxThreshold:
    Type: Number
    Description: >-
      5xx responses in a minute before alarming. Counts responses generated by
      the targets, not by the load balancer - a target that is down produces 5xx
      from the ALB itself and shows up in the target-health alarm instead.
    Default: 10
    MinValue: 1
    MaxValue: 1000000

  LatencyThresholdSeconds:
    Type: Number
    Description: >-
      p99 target response time, in seconds, sustained before alarming. p99 rather
      than average: an average hides the tail, and the tail is what users notice.
    Default: 2
    MinValue: 1
    MaxValue: 300

  CpuThresholdPercent:
    Type: Number
    Description: >-
      Service CPU utilisation before alarming. Set it above the autoscaling
      target - alarming at the level the scaler is aiming to hold pages you every
      time scaling works correctly.
    Default: 85
    MinValue: 1
    MaxValue: 100

  MemoryThresholdPercent:
    Type: Number
    Description: Service memory utilisation before alarming.
    Default: 85
    MinValue: 1
    MaxValue: 100

  DeadLetterMessageThreshold:
    Type: Number
    Description: Messages in the dead-letter queue before alarming.
    Default: 1
    MinValue: 1
    MaxValue: 1000000

Conditions:
  WatchesLoadBalancer: !And
    - !Not [!Equals [!Ref LoadBalancerFullName, ""]]
    - !Not [!Equals [!Ref TargetGroupFullName, ""]]
  WatchesEcsService: !And
    - !Not [!Equals [!Ref EcsClusterName, ""]]
    - !Not [!Equals [!Ref EcsServiceName, ""]]
  WatchesDeadLetterQueue: !Not [!Equals [!Ref DeadLetterQueueName, ""]]

Resources:
  Http5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: WatchesLoadBalancer
    Properties:
      AlarmName: !Sub "${NamePrefix}-${Environment}-${ServiceSuffix}-5xx"
      AlarmDescription: >-
        Targets are returning server errors. Check the service log group first;
        if the errors started at a deploy, roll back.
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - Name: LoadBalancer
          Value: !Ref LoadBalancerFullName
        - Name: TargetGroup
          Value: !Ref TargetGroupFullName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 2
      Threshold: !Ref Http5xxThreshold
      ComparisonOperator: GreaterThanThreshold
      # A service with no traffic emits no datapoints. Breaching on missing data
      # pages every night at 3am for a dev environment.
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopicArn]
      OKActions: [!Ref AlarmTopicArn]

  UnhealthyTargetsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: WatchesLoadBalancer
    Properties:
      AlarmName: !Sub "${NamePrefix}-${Environment}-${ServiceSuffix}-unhealthy-targets"
      AlarmDescription: >-
        Targets are failing their health check. Most often a failed deploy, a
        health check path that moved, or a grace period shorter than startup.
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - Name: LoadBalancer
          Value: !Ref LoadBalancerFullName
        - Name: TargetGroup
          Value: !Ref TargetGroupFullName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      # Unlike the 5xx alarm, missing data here means the target group is not
      # reporting at all, which is itself a problem worth knowing about.
      TreatMissingData: breaching
      AlarmActions: [!Ref AlarmTopicArn]
      OKActions: [!Ref AlarmTopicArn]

  LatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: WatchesLoadBalancer
    Properties:
      AlarmName: !Sub "${NamePrefix}-${Environment}-${ServiceSuffix}-latency"
      AlarmDescription: >-
        p99 response time is above the threshold. Check whether the service is
        saturated or a downstream dependency has slowed.
      Namespace: AWS/ApplicationELB
      MetricName: TargetResponseTime
      Dimensions:
        - Name: LoadBalancer
          Value: !Ref LoadBalancerFullName
        - Name: TargetGroup
          Value: !Ref TargetGroupFullName
      # p99, not Average. An average hides the tail, and the tail is what users
      # experience as "the site is slow".
      ExtendedStatistic: p99
      Period: 60
      EvaluationPeriods: 5
      Threshold: !Ref LatencyThresholdSeconds
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopicArn]
      OKActions: [!Ref AlarmTopicArn]

  CpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: WatchesEcsService
    Properties:
      AlarmName: !Sub "${NamePrefix}-${Environment}-${ServiceSuffix}-cpu"
      AlarmDescription: >-
        Service CPU is above the threshold for five minutes. If autoscaling is
        configured, this means it has hit its ceiling.
      Namespace: AWS/ECS
      MetricName: CPUUtilization
      Dimensions:
        - Name: ClusterName
          Value: !Ref EcsClusterName
        - Name: ServiceName
          Value: !Ref EcsServiceName
      Statistic: Average
      Period: 60
      EvaluationPeriods: 5
      Threshold: !Ref CpuThresholdPercent
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopicArn]
      OKActions: [!Ref AlarmTopicArn]

  MemoryAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: WatchesEcsService
    Properties:
      AlarmName: !Sub "${NamePrefix}-${Environment}-${ServiceSuffix}-memory"
      AlarmDescription: >-
        Service memory is above the threshold. On a JVM or Go service this often
        precedes an OOM kill rather than following one.
      Namespace: AWS/ECS
      MetricName: MemoryUtilization
      Dimensions:
        - Name: ClusterName
          Value: !Ref EcsClusterName
        - Name: ServiceName
          Value: !Ref EcsServiceName
      Statistic: Average
      Period: 60
      EvaluationPeriods: 5
      Threshold: !Ref MemoryThresholdPercent
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopicArn]
      OKActions: [!Ref AlarmTopicArn]

  DeadLetterQueueAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: WatchesDeadLetterQueue
    Properties:
      AlarmName: !Sub "${NamePrefix}-${Environment}-${ServiceSuffix}-dlq"
      AlarmDescription: >-
        Messages have landed in the dead-letter queue. Inspect them before
        redriving - whatever rejected them will reject them again.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !Ref DeadLetterQueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref DeadLetterMessageThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      # SQS publishes this metric continuously, including zeros, so missing data
      # means the queue itself has gone.
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopicArn]
      OKActions: [!Ref AlarmTopicArn]

Outputs:
  AlarmNames:
    Description: >-
      Comma-separated names of the alarms created, for a composite alarm or a
      dashboard.
    Value: !Join
      - ","
      - - !If [WatchesLoadBalancer, !Ref Http5xxAlarm, "-"]
        - !If [WatchesLoadBalancer, !Ref UnhealthyTargetsAlarm, "-"]
        - !If [WatchesLoadBalancer, !Ref LatencyAlarm, "-"]
        - !If [WatchesEcsService, !Ref CpuAlarm, "-"]
        - !If [WatchesEcsService, !Ref MemoryAlarm, "-"]
        - !If [WatchesDeadLetterQueue, !Ref DeadLetterQueueAlarm, "-"]

  AlarmTopicArn:
    Description: Topic the alarms notify, echoed for runbooks.
    Value: !Ref AlarmTopicArn