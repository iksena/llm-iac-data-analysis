AWSTemplateFormatVersion: '2010-09-09'
Description: CloudFormation template for Plot Palette DynamoDB tables
Parameters:
  EnvironmentName:
    Type: String
    AllowedValues:
      - development
      - staging
      - production
    Default: production
    Description: Environment name for table naming
Resources:
  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub plot-palette-Jobs-${EnvironmentName}
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: created_at
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: user-id-index
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
            - AttributeName: created_at
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
  QueueTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub plot-palette-Queue-${EnvironmentName}
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: status
          AttributeType: S
        - AttributeName: job_id_timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: status
          KeyType: HASH
        - AttributeName: job_id_timestamp
          KeyType: RANGE
  TemplatesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub plot-palette-Templates-${EnvironmentName}
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: template_id
          AttributeType: S
        - AttributeName: version
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: template_id
          KeyType: HASH
        - AttributeName: version
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: user-id-index
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
  CostTrackingTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub plot-palette-CostTracking-${EnvironmentName}
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
        - AttributeName: ttl
          AttributeType: N
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
Outputs:
  JobsTableName:
    Description: Jobs table name
    Value: !Ref JobsTable
    Export:
      Name: !Sub ${AWS::StackName}-JobsTableName
  JobsTableArn:
    Description: Jobs table ARN
    Value: !GetAtt JobsTable.Arn
    Export:
      Name: !Sub ${AWS::StackName}-JobsTableArn
  JobsUseridIndex:
    Description: Jobs GSI name user-id-index
    Value: user-id-index
    Export:
      Name: !Sub ${AWS::StackName}-JobsUseridIndex
  QueueTableName:
    Description: Queue table name
    Value: !Ref QueueTable
    Export:
      Name: !Sub ${AWS::StackName}-QueueTableName
  QueueTableArn:
    Description: Queue table ARN
    Value: !GetAtt QueueTable.Arn
    Export:
      Name: !Sub ${AWS::StackName}-QueueTableArn
  TemplatesTableName:
    Description: Templates table name
    Value: !Ref TemplatesTable
    Export:
      Name: !Sub ${AWS::StackName}-TemplatesTableName
  TemplatesTableArn:
    Description: Templates table ARN
    Value: !GetAtt TemplatesTable.Arn
    Export:
      Name: !Sub ${AWS::StackName}-TemplatesTableArn
  TemplatesUseridIndex:
    Description: Templates GSI name user-id-index
    Value: user-id-index
    Export:
      Name: !Sub ${AWS::StackName}-TemplatesUseridIndex
  CostTrackingTableName:
    Description: CostTracking table name
    Value: !Ref CostTrackingTable
    Export:
      Name: !Sub ${AWS::StackName}-CostTrackingTableName
  CostTrackingTableArn:
    Description: CostTracking table ARN
    Value: !GetAtt CostTrackingTable.Arn
    Export:
      Name: !Sub ${AWS::StackName}-CostTrackingTableArn