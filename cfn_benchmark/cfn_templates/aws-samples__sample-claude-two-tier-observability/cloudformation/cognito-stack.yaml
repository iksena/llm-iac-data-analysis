AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Cognito User Pool + Identity Pool for Claude Code authentication.
  Provides OIDC-based identity for telemetry API (JWT auth) and
  optional federated AWS credentials for Bedrock access.

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, staging, prod]

  OrgName:
    Type: String
    Default: my-org
    Description: Organization identifier used in resource naming and as a default custom attribute.

  CognitoDomainPrefix:
    Type: String
    Description: >
      Unique prefix for the Cognito hosted UI domain.
      The full domain will be https://<prefix>.auth.<region>.amazoncognito.com
    AllowedPattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$

  CallbackURLs:
    Type: CommaDelimitedList
    Default: http://localhost:8080/callback
    Description: OAuth callback URLs (comma-separated). Add your app's callback URL.

  LogoutURLs:
    Type: CommaDelimitedList
    Default: http://localhost:8080/logout
    Description: OAuth logout URLs (comma-separated).

  AdminEmail:
    Type: String
    Default: ''
    Description: Optional admin email for initial user creation. Leave blank to skip.

  EnableIdentityPool:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      Create a Cognito Identity Pool for exchanging JWT tokens to temporary
      AWS credentials (needed if developers will use Cognito for Bedrock access).

  BedrockModelAccess:
    Type: String
    Default: 'anthropic.claude-*'
    Description: >
      Bedrock model ID pattern for the authenticated role policy.
      Use * for all models or a specific pattern like anthropic.claude-*.

  PermissionsBoundaryArn:
    Type: String
    Default: ''
    Description: >
      ARN of an IAM Permissions Boundary policy to attach to all IAM roles.
      Required in accounts with restrictive SCPs.

Conditions:
  CreateIdentityPool: !Equals [!Ref EnableIdentityPool, 'true']
  CreateAdminUser: !Not [!Equals [!Ref AdminEmail, '']]
  HasPermissionsBoundary: !Not [!Equals [!Ref PermissionsBoundaryArn, '']]

Resources:
  # ---------------------------------------------------------------------------
  # Cognito User Pool
  # ---------------------------------------------------------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    # DeletionPolicy: Retain — re-enable after first successful deploy
    # UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub 'claude-code-${OrgName}-${Environment}'
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      UsernameConfiguration:
        CaseSensitive: false
      MfaConfiguration: 'ON'
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      UserPoolAddOns:
        AdvancedSecurityMode: ENFORCED
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7
      Schema:
        - Name: email
          Required: true
          Mutable: true
          AttributeDataType: String
        - Name: org_name
          Mutable: true
          AttributeDataType: String
          StringAttributeConstraints:
            MaxLength: '128'
        - Name: department
          Mutable: true
          AttributeDataType: String
          StringAttributeConstraints:
            MaxLength: '128'
        - Name: team_id
          Mutable: true
          AttributeDataType: String
          StringAttributeConstraints:
            MaxLength: '128'
        - Name: cost_center
          Mutable: true
          AttributeDataType: String
          StringAttributeConstraints:
            MaxLength: '64'
        - Name: location
          Mutable: true
          AttributeDataType: String
          StringAttributeConstraints:
            MaxLength: '128'
        - Name: role
          Mutable: true
          AttributeDataType: String
          StringAttributeConstraints:
            MaxLength: '128'
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
        InviteMessageTemplate:
          EmailSubject: 'Your Claude Code access credentials'
          EmailMessage: >
            Welcome to Claude Code! Your username is {username} and
            temporary password is {####}. Please sign in and change
            your password.
      UserPoolTags:
        Project: claude-code
        Environment: !Ref Environment
        Organization: !Ref OrgName

  # ---------------------------------------------------------------------------
  # User Pool Domain (hosted UI for OAuth flows)
  # ---------------------------------------------------------------------------
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref UserPool

  # ---------------------------------------------------------------------------
  # Resource Server (custom scopes for telemetry APIs)
  # ---------------------------------------------------------------------------
  ResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      Identifier: claude-code
      Name: Claude Code API
      UserPoolId: !Ref UserPool
      Scopes:
        - ScopeName: telemetry.write
          ScopeDescription: Write telemetry data (hooks, session metrics)
        - ScopeName: telemetry.read
          ScopeDescription: Read telemetry data (dashboards, queries)

  # ---------------------------------------------------------------------------
  # App Client — CLI (Device Authorization Grant for headless auth)
  # ---------------------------------------------------------------------------
  CLIAppClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: ResourceServer
    Properties:
      ClientName: !Sub 'claude-code-cli-${OrgName}'
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_AUTH
      SupportedIdentityProviders:
        - COGNITO
      AllowedOAuthFlows:
        - code
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - openid
        - email
        - profile
        - claude-code/telemetry.write
        - claude-code/telemetry.read
      CallbackURLs: !Ref CallbackURLs
      LogoutURLs: !Ref LogoutURLs
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 12
      IdTokenValidity: 12
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  # ---------------------------------------------------------------------------
  # App Client — Server-to-Server (client credentials for backend services)
  # ---------------------------------------------------------------------------
  ServerAppClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: ResourceServer
    Properties:
      ClientName: !Sub 'claude-code-server-${OrgName}'
      UserPoolId: !Ref UserPool
      GenerateSecret: true
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
      SupportedIdentityProviders:
        - COGNITO
      AllowedOAuthFlows:
        - client_credentials
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - claude-code/telemetry.write
        - claude-code/telemetry.read
        - claude-code/telemetry.read
      PreventUserExistenceErrors: ENABLED

  # ---------------------------------------------------------------------------
  # User Pool Groups (map to teams/roles)
  # ---------------------------------------------------------------------------
  DevelopersGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: developers
      Description: Claude Code developers with standard access
      UserPoolId: !Ref UserPool
      Precedence: 10
      RoleArn: !If
        - CreateIdentityPool
        - !GetAtt AuthenticatedRole.Arn
        - !Ref AWS::NoValue

  AdminsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admins
      Description: Administrators with full access to telemetry management
      UserPoolId: !Ref UserPool
      Precedence: 1
      RoleArn: !If
        - CreateIdentityPool
        - !GetAtt AdminRole.Arn
        - !Ref AWS::NoValue

  # ---------------------------------------------------------------------------
  # DynamoDB table — caches Cognito user attributes for the invocation
  # processor so it can enrich Bedrock log records with org/team/cost_center
  # without calling Cognito APIs at processing time.
  # ---------------------------------------------------------------------------
  # checkov:skip=CKV_AWS_119:AWS managed SSE enabled — CMK optional for production
  UserAttributeTable:
    Type: AWS::DynamoDB::Table
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: "Explicit name required for deploy.sh cross-stack references"
          - id: W78
            reason: "AWS managed SSE enabled — CMK optional for production"
    Properties:
      TableName: !Sub 'claude-code-user-attrs-${OrgName}-${Environment}'
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: claude-code
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------------------------
  # Pre Token Generation Lambda (injects custom claims + caches to DynamoDB)
  # ---------------------------------------------------------------------------
  # checkov:skip=CKV_AWS_117:Lambdas call AWS APIs only — VPC adds NAT Gateway cost with no benefit
  # checkov:skip=CKV_AWS_116:Synchronous invocation — DLQ not applicable
  # checkov:skip=CKV_AWS_173:Environment variables contain config (table names, ARNs), not secrets
  # checkov:skip=CKV_SECRET_6:Inline Lambda source code, not a secret
  PreTokenGenerationFunction:
    Type: AWS::Lambda::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Lambda calls AWS APIs only — VPC adds cost with no benefit"
          - id: W92
            reason: "ReservedConcurrentExecutions set on function"
    Properties:
      FunctionName: !Sub 'claude-code-pre-token-${OrgName}-${Environment}'
      Runtime: python3.12
      Handler: index.handler
      Timeout: 10
      MemorySize: 128
      ReservedConcurrentExecutions: 5
      Role: !GetAtt PreTokenGenerationRole.Arn
      Environment:
        Variables:
          USER_ATTR_TABLE: !Ref UserAttributeTable
      Code:
        ZipFile: |
          """
          Pre Token Generation Lambda trigger.
          1. Injects org metadata from user custom attributes into the JWT.
          2. Caches attributes in DynamoDB so the invocation processor can
             look up org/team/cost_center without calling Cognito APIs.
          """
          import os, time, boto3
          ddb = boto3.resource("dynamodb")
          TABLE = os.environ.get("USER_ATTR_TABLE", "")
          TTL_SECONDS = 7 * 24 * 3600  # 7 days

          def handler(event, context):
              user_attrs = event.get("request", {}).get("userAttributes", {})
              claims = {}
              attr_map = {
                  "custom:org_name": "org_name",
                  "custom:department": "department",
                  "custom:team_id": "team_id",
                  "custom:cost_center": "cost_center",
                  "custom:location": "location",
                  "custom:role": "user_role",
              }
              enriched = {}
              for cognito_attr, claim_name in attr_map.items():
                  val = user_attrs.get(cognito_attr, "")
                  if val:
                      claims[claim_name] = val
                      enriched[claim_name] = val
              groups = event.get("request", {}).get("groupConfiguration", {}).get("groupsToOverride", [])
              claims["groups"] = ",".join(groups) if groups else ""
              enriched["groups"] = claims["groups"]
              # Build AWS session tags for CUR cost attribution (flattened format).
              # STS reads these from the JWT during AssumeRoleWithWebIdentity and
              # applies them as session tags that flow into CUR 2.0 and Cost Explorer.
              email = user_attrs.get("email", "")
              tag_prefix = "https://aws.amazon.com/tags"
              tag_claims = {}
              if email:
                  tag_claims[f"{tag_prefix}/principal_tags/UserEmail"] = email
              for cognito_attr, tag_name in [
                  ("custom:department", "Department"),
                  ("custom:team_id", "TeamId"),
                  ("custom:cost_center", "CostCenter"),
                  ("custom:org_name", "OrgName"),
              ]:
                  val = user_attrs.get(cognito_attr, "")
                  if val:
                      tag_claims[f"{tag_prefix}/principal_tags/{tag_name}"] = val
              transitive_keys = [k.split("/")[-1] for k in tag_claims if "/principal_tags/" in k]
              if transitive_keys:
                  tag_claims[f"{tag_prefix}/transitive_tag_keys"] = transitive_keys
              claims.update(tag_claims)
              # Inject claims into ID and access tokens
              event["response"] = {
                  "claimsAndScopeOverrideDetails": {
                      "idTokenGeneration": {"claimsToAddOrOverride": claims},
                      "accessTokenGeneration": {"claimsToAddOrOverride": claims},
                  }
              }
              # Cache user attributes in DynamoDB for the invocation processor.
              # Write two records: one keyed by full email, one by email prefix
              # (OS username) so the processor can look up by either.
              if TABLE and enriched:
                  email = user_attrs.get("email", "")
                  now = int(time.time())
                  ttl_val = now + TTL_SECONDS
                  table = ddb.Table(TABLE)
                  item = {**enriched, "email": email, "updated_at": now, "ttl": ttl_val}
                  try:
                      if email:
                          table.put_item(Item={"user_id": email, **item})
                          prefix = email.split("@")[0]
                          if prefix:
                              table.put_item(Item={"user_id": prefix, **item})
                  except Exception as e:
                      print(f"DynamoDB cache write failed (non-fatal): {e}")
              return event

  PreTokenGenerationRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: "Explicit name required for deploy.sh cross-stack references"
    Properties:
      RoleName: !Sub 'claude-code-pre-token-role-${OrgName}-${Environment}'
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBWrite
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource: !GetAtt UserAttributeTable.Arn

  PreTokenGenerationPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt PreTokenGenerationFunction.Arn
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  # Attach the Pre Token Generation trigger via custom resource
  # (CloudFormation can't modify LambdaConfig on an existing UserPool directly)
  # checkov:skip=CKV_AWS_117:Lambdas call AWS APIs only — VPC adds NAT Gateway cost with no benefit
  # checkov:skip=CKV_AWS_116:Synchronous invocation — DLQ not applicable
  # checkov:skip=CKV_AWS_173:Environment variables contain config (table names, ARNs), not secrets
  AttachLambdaTriggerFunction:
    Type: AWS::Lambda::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "Lambda calls AWS APIs only — VPC adds cost with no benefit"
          - id: W92
            reason: "ReservedConcurrentExecutions set on function"
    Properties:
      FunctionName: !Sub 'claude-code-attach-trigger-${OrgName}-${Environment}'
      Runtime: python3.12
      Handler: index.handler
      Timeout: 30
      MemorySize: 128
      ReservedConcurrentExecutions: 5
      Role: !GetAtt AttachTriggerRole.Arn
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          def handler(event, context):
              if event["RequestType"] == "Delete":
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                  return
              try:
                  client = boto3.client("cognito-idp")
                  user_pool_id = event["ResourceProperties"]["UserPoolId"]
                  lambda_arn = event["ResourceProperties"]["LambdaArn"]
                  # Get current pool config
                  pool = client.describe_user_pool(UserPoolId=user_pool_id)["UserPool"]
                  lambda_config = pool.get("LambdaConfig", {})
                  lambda_config["PreTokenGeneration"] = lambda_arn
                  client.update_user_pool(
                      UserPoolId=user_pool_id,
                      LambdaConfig=lambda_config,
                      AutoVerifiedAttributes=pool.get("AutoVerifiedAttributes", []),
                  )
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
              except Exception as e:
                  cfnresponse.send(event, context, cfnresponse.FAILED, {"Error": str(e)})

  AttachTriggerRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CognitoUpdatePool
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:DescribeUserPool
                  - cognito-idp:UpdateUserPool
                Resource: !GetAtt UserPool.Arn

  AttachLambdaTrigger:
    Type: Custom::AttachLambdaTrigger
    DependsOn:
      - PreTokenGenerationPermission
    Properties:
      ServiceToken: !GetAtt AttachLambdaTriggerFunction.Arn
      UserPoolId: !Ref UserPool
      LambdaArn: !GetAtt PreTokenGenerationFunction.Arn

  # ---------------------------------------------------------------------------
  # Optional admin user
  # ---------------------------------------------------------------------------
  AdminUser:
    Type: AWS::Cognito::UserPoolUser
    Condition: CreateAdminUser
    Properties:
      UserPoolId: !Ref UserPool
      Username: !Ref AdminEmail
      UserAttributes:
        - Name: email
          Value: !Ref AdminEmail
        - Name: email_verified
          Value: 'true'
        - Name: 'custom:org_name'
          Value: !Ref OrgName
        - Name: 'custom:role'
          Value: admin
      DesiredDeliveryMediums:
        - EMAIL

  AdminUserGroupAttachment:
    Type: AWS::Cognito::UserPoolUserToGroupAttachment
    Condition: CreateAdminUser
    DependsOn:
      - AdminUser
      - AdminsGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: admins
      Username: !Ref AdminEmail

  # ---------------------------------------------------------------------------
  # IAM OIDC Provider for AssumeRoleWithWebIdentity (12-hour sessions)
  # ---------------------------------------------------------------------------
  # This enables developers to call sts:AssumeRoleWithWebIdentity with their
  # Cognito ID token and get STS credentials valid up to 12 hours, bypassing
  # the 1-hour hard limit of Cognito Identity Pool get-credentials-for-identity.
  CognitoOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
      ClientIdList:
        - !Ref CLIAppClient
      # Cognito-managed TLS — thumbprint is validated by IAM automatically
      ThumbprintList:
        - '0000000000000000000000000000000000000000'
      Tags:
        - Key: Project
          Value: claude-code

  BedrockDirectAccessRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: "Explicit name required for deploy.sh cross-stack references"
          - id: W11
            reason: "Bedrock discovery APIs (ListInferenceProfiles, ListFoundationModels) require Resource: '*'"
    Properties:
      RoleName: !Sub 'claude-code-bedrock-${OrgName}-${Environment}'
      MaxSessionDuration: 43200  # 12 hours
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue
      AssumeRolePolicyDocument:
        Fn::Sub:
          - |
            {
              "Version": "2012-10-17",
              "Statement": [{
                "Effect": "Allow",
                "Principal": {"Federated": "${OIDCProviderArn}"},
                "Action": ["sts:AssumeRoleWithWebIdentity", "sts:TagSession"],
                "Condition": {
                  "StringEquals": {
                    "cognito-idp.${AWS::Region}.amazonaws.com/${UserPoolId}:aud": "${ClientId}"
                  }
                }
              }]
            }
          - OIDCProviderArn: !Ref CognitoOIDCProvider
            UserPoolId: !Ref UserPool
            ClientId: !Ref CLIAppClient
      Policies:
        - PolicyName: BedrockInvokeAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockModelAccess}'
                  - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.${BedrockModelAccess}'
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/${BedrockModelAccess}'
              - Effect: Allow
                Action:
                  - bedrock:ListInferenceProfiles
                  - bedrock:GetInferenceProfile
                  - bedrock:ListFoundationModels
                  - bedrock:GetFoundationModel
                Resource: '*'
      Tags:
        - Key: Project
          Value: claude-code
        - Key: Organization
          Value: !Ref OrgName
        - Key: CostCenter
          Value: !Sub 'bedrock-${OrgName}'
        - Key: Service
          Value: bedrock-claude-code
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------------------------
  # Cognito Identity Pool (optional — for Bedrock AWS credential exchange)
  # NOTE: Identity Pool credentials expire after 1 hour (AWS hard limit).
  # Prefer BedrockDirectAccessRole with AssumeRoleWithWebIdentity for 12-hour sessions.
  # ---------------------------------------------------------------------------
  IdentityPool:
    Type: AWS::Cognito::IdentityPool
    Condition: CreateIdentityPool
    Properties:
      IdentityPoolName: !Sub 'claude_code_${OrgName}_${Environment}'
      AllowUnauthenticatedIdentities: false
      CognitoIdentityProviders:
        - ClientId: !Ref CLIAppClient
          ProviderName: !GetAtt UserPool.ProviderName
          ServerSideTokenCheck: true

  # Identity Pool role mapping:
  # - Type: Token — Cognito resolves the IAM role from the user's group membership
  # - "developers" group (precedence 10) → AuthenticatedRole (all models)
  # - "admins" group (precedence 1) → AdminRole (all models + telemetry read)
  # - AmbiguousRoleResolution: AuthenticatedRole — fallback for users not in any group
  IdentityPoolRoleAttachment:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Condition: CreateIdentityPool
    Properties:
      IdentityPoolId: !Ref IdentityPool
      Roles:
        authenticated: !GetAtt AuthenticatedRole.Arn
      RoleMappings:
        cognitoProvider:
          IdentityProvider: !Sub
            - '${ProviderName}:${ClientId}'
            - ProviderName: !GetAtt UserPool.ProviderName
              ClientId: !Ref CLIAppClient
          Type: Token
          AmbiguousRoleResolution: AuthenticatedRole

  # ---------------------------------------------------------------------------
  # IAM Roles for Identity Pool
  # ---------------------------------------------------------------------------
  AuthenticatedRole:
    Type: AWS::IAM::Role
    Condition: CreateIdentityPool
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: "Explicit name required for deploy.sh cross-stack references"
          - id: W11
            reason: "Bedrock discovery APIs (ListInferenceProfiles, ListFoundationModels) require Resource: '*'"
    Properties:
      RoleName: !Sub 'claude-code-authenticated-${OrgName}-${Environment}'
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'cognito-identity.amazonaws.com:aud': !Ref IdentityPool
              ForAnyValue:StringLike:
                'cognito-identity.amazonaws.com:amr': authenticated
      Policies:
        - PolicyName: BedrockInvokeAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockModelAccess}'
                  - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.${BedrockModelAccess}'
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/${BedrockModelAccess}'
              - Effect: Allow
                Action:
                  - bedrock:ListInferenceProfiles
                  - bedrock:GetInferenceProfile
                  - bedrock:ListFoundationModels
                  - bedrock:GetFoundationModel
                Resource: '*'

  AdminRole:
    Type: AWS::IAM::Role
    Condition: CreateIdentityPool
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: "Explicit name required for deploy.sh cross-stack references"
          - id: W11
            reason: "Bedrock discovery APIs (ListInferenceProfiles, ListFoundationModels) require Resource: '*'"
    Properties:
      RoleName: !Sub 'claude-code-admin-${OrgName}-${Environment}'
      PermissionsBoundary: !If
        - HasPermissionsBoundary
        - !Ref PermissionsBoundaryArn
        - !Ref AWS::NoValue
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'cognito-identity.amazonaws.com:aud': !Ref IdentityPool
              ForAnyValue:StringLike:
                'cognito-identity.amazonaws.com:amr': authenticated
      Policies:
        - PolicyName: BedrockInvokeAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${BedrockModelAccess}'
                  - !Sub 'arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/us.${BedrockModelAccess}'
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: !Sub 'arn:aws:bedrock:${AWS::Region}::foundation-model/${BedrockModelAccess}'
              - Effect: Allow
                Action:
                  - bedrock:ListInferenceProfiles
                  - bedrock:GetInferenceProfile
                  - bedrock:ListFoundationModels
                  - bedrock:GetFoundationModel
                Resource: '*'
        - PolicyName: TelemetryReadAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:aws:s3:::claude-code-logs-${OrgName}-${Environment}'
                  - !Sub 'arn:aws:s3:::claude-code-logs-${OrgName}-${Environment}/*'
              - Effect: Allow
                Action:
                  - athena:StartQueryExecution
                  - athena:GetQueryExecution
                  - athena:GetQueryResults
                Resource:
                  - !Sub 'arn:aws:athena:${AWS::Region}:${AWS::AccountId}:workgroup/claude-code-*'

Outputs:
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
    Export:
      Name: !Sub '${AWS::StackName}-UserPoolId'

  UserPoolArn:
    Description: Cognito User Pool ARN
    Value: !GetAtt UserPool.Arn
    Export:
      Name: !Sub '${AWS::StackName}-UserPoolArn'

  UserPoolProviderName:
    Description: Cognito User Pool Provider Name
    Value: !GetAtt UserPool.ProviderName
    Export:
      Name: !Sub '${AWS::StackName}-ProviderName'

  CLIAppClientId:
    Description: App Client ID for CLI authentication
    Value: !Ref CLIAppClient
    Export:
      Name: !Sub '${AWS::StackName}-CLIClientId'

  ServerAppClientId:
    Description: App Client ID for server-to-server authentication
    Value: !Ref ServerAppClient
    Export:
      Name: !Sub '${AWS::StackName}-ServerClientId'

  CognitoDomain:
    Description: Cognito hosted UI domain
    Value: !Sub 'https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com'
    Export:
      Name: !Sub '${AWS::StackName}-CognitoDomain'

  IdentityPoolId:
    Condition: CreateIdentityPool
    Description: Cognito Identity Pool ID (for AWS credential exchange)
    Value: !Ref IdentityPool
    Export:
      Name: !Sub '${AWS::StackName}-IdentityPoolId'

  TokenEndpoint:
    Description: OAuth2 token endpoint
    Value: !Sub 'https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com/oauth2/token'

  AuthorizeEndpoint:
    Description: OAuth2 authorize endpoint
    Value: !Sub 'https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com/oauth2/authorize'

  JWKSUri:
    Description: JSON Web Key Set URI for token validation
    Value: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}/.well-known/jwks.json'

  BedrockDirectAccessRoleArn:
    Description: IAM role ARN for AssumeRoleWithWebIdentity (12-hour sessions)
    Value: !GetAtt BedrockDirectAccessRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-BedrockDirectAccessRoleArn'

  OIDCProviderArn:
    Description: IAM OIDC Provider ARN for Cognito User Pool
    Value: !Ref CognitoOIDCProvider
    Export:
      Name: !Sub '${AWS::StackName}-OIDCProviderArn'

  UserAttributeTableName:
    Description: DynamoDB table for cached user attributes
    Value: !Ref UserAttributeTable
    Export:
      Name: !Sub '${AWS::StackName}-UserAttributeTable'

  UserAttributeTableArn:
    Description: DynamoDB table ARN for IAM policies
    Value: !GetAtt UserAttributeTable.Arn
    Export:
      Name: !Sub '${AWS::StackName}-UserAttributeTableArn'