AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFormation template to deploy a Lambda CI/CD pipeline using the Lambda Pipeline module'

Parameters:
  ProjectName:
    Type: String
    Description: Name of your Lambda project
    Default: MyLambdaProject

  VCSRepoURL:
    Type: String
    Description: URL of the GitHub repository
    Default: https://github.com/myorg/my-lambda-repo

  LambdaRepoName:
    Type: String
    Description: GitHub repository name (e.g., owner/repo)
    Default: myorg/my-lambda-repo

  LambdaRepoBranchToTrack:
    Type: String
    Description: Branch to track for changes, a pipeline in prod account can track main, and a pipeline in dev can track associated dev branch
    Default: main

  ConnectionArn:
    Type: String
    Description: ARN of the CodeStar connection to GitHub
    Default: Create a code connection in your AWS account with your github org repo

  S3BucketName:
    Type: String
    Description: Name for the CodePipeline artifact bucket
    Default: Unique bucket name

  S3Bucket:
    Type: String
    Description: S3 bucket for Lambda deployment
    Default: Same as S3BucketName

  ManagedBy:
    Type: String
    Description: Tag for resource management
    Default: CloudFormation

  ComputeType:
    Type: String
    Description: CodeBuild compute type
    Default: BUILD_GENERAL1_SMALL
    AllowedValues:
      - BUILD_GENERAL1_SMALL
      - BUILD_GENERAL1_MEDIUM
      - BUILD_GENERAL1_LARGE

  CodeBuildImage:
    Type: String
    Description: CodeBuild container image
    Default: aws/codebuild/amazonlinux-aarch64-standard:3.0
    AllowedValues:
      - aws/codebuild/amazonlinux-aarch64-standard:3.0
      - aws/codebuild/standard:7.0

  EnvType:
    Type: String
    Description: CodeBuild environment type
    Default: ARM_CONTAINER
    AllowedValues:
      - LINUX_CONTAINER
      - WINDOWS_CONTAINER
      - ARM_CONTAINER

Resources:
  LambdaPipeline:
    Type: AB::LambdaPipeline::CodePipeline::MODULE
    Properties:
      ProjectName: !Ref ProjectName
      VCSRepoURL: !Ref VCSRepoURL
      LambdaRepoName: !Ref LambdaRepoName
      LambdaRepoBranchToTrack: !Ref LambdaRepoBranchToTrack
      ConnectionArn: !Ref ConnectionArn
      S3BucketName: !Ref S3BucketName
      S3Bucket: !Ref S3Bucket
      ManagedBy: !Ref ManagedBy
      ComputeType: !Ref ComputeType
      CodeBuildImage: !Ref CodeBuildImage
      EnvType: !Ref EnvType
      CodePipelinePolicyDocument: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": [
                "s3:GetObject",
                "s3:GetObjectVersion",
                "s3:PutObject",
                "s3:GetBucketVersioning"
              ],
              "Resource": [
                "arn:aws:s3:::${S3BucketName}",
                "arn:aws:s3:::${S3BucketName}/*"
              ]
            },
            {
              "Effect": "Allow",
              "Action": [
                "codebuild:BatchGetBuilds",
                "codebuild:StartBuild"
              ],
              "Resource": "*"
            },
            {
              "Effect": "Allow",
              "Action": [
                "cloudformation:CreateStack",
                "cloudformation:DeleteStack",
                "cloudformation:DescribeStacks",
                "cloudformation:UpdateStack",
                "cloudformation:CreateChangeSet",
                "cloudformation:DeleteChangeSet",
                "cloudformation:DescribeChangeSet",
                "cloudformation:ExecuteChangeSet",
                "cloudformation:SetStackPolicy",
                "cloudformation:ValidateTemplate",
                "iam:PassRole"
              ],
              "Resource": "*"
            },
            {
              "Effect": "Allow",
              "Action": [
                "codestar-connections:UseConnection"
              ],
              "Resource": "${ConnectionArn}"
            }
          ]
        }
      CodeBuildPolicyDocument: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": [
                "logs:CreateLogGroup",
                "logs:CreateLogStream",
                "logs:PutLogEvents"
              ],
              "Resource": "*"
            },
            {
              "Effect": "Allow",
              "Action": [
                "s3:GetObject",
                "s3:GetObjectVersion",
                "s3:PutObject"
              ],
              "Resource": [
                "arn:aws:s3:::${S3BucketName}",
                "arn:aws:s3:::${S3BucketName}/*",
                "arn:aws:s3:::${S3Bucket}",
                "arn:aws:s3:::${S3Bucket}/*"
              ]
            }
          ]
        }
      DeployCFPolicyDocument: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": [
                "cloudformation:CreateChangeSet",
                "cloudformation:DescribeChangeSet",
                "cloudformation:ExecuteChangeSet",
                "cloudformation:DeleteChangeSet",
                "cloudformation:CreateStack",
                "cloudformation:UpdateStack",
                "cloudformation:DescribeStacks",
                "cloudformation:SetStackPolicy",
                "cloudformation:ValidateTemplate",
                "lambda:*",
                "iam:PassRole",
                "iam:Tag*",
                "s3:GetObject",
                "s3:PutObject",
                "codedeploy:Get*",
                "codedeploy:CreateApplication",
                "codedeploy:DeleteApplication",
                "codedeploy:TagResource",
                "codedeploy:CreateDeploymentGroup",
                "codedeploy:CreateDeployment",
                "codedeploy:GetDeploymentConfig",
                "codedeploy:DeleteDeploymentGroup",
                "codedeploy:RegisterApplicationRevision"
              ],
              "Resource": "*"
            },
            {
              "Effect": "Allow",
              "Action": [
                "iam:CreateRole",
                "iam:UpdateRole",
                "iam:DeleteRole",
                "iam:AttachRolePolicy",
                "iam:DetachRolePolicy",
                "iam:PutRolePolicy",
                "iam:DeleteRolePolicy",
                "iam:GetRole",
                "iam:TagRole"
              ],
              "Resource": "arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-*"
            }
          ]
        }
      CodeDeployPolicyDocument: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": [
                "lambda:UpdateFunctionCode",
                "lambda:GetFunction",
                "lambda:CreateAlias",
                "lambda:UpdateAlias",
                "lambda:DeleteAlias",
                "lambda:GetAlias",
                "lambda:PublishVersion"
              ],
              "Resource": "*"
            }
          ]
        }
      S3BucketPolicyDocument: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "DenyNonSSLRequests",
              "Effect": "Deny",
              "Principal": "*",
              "Action": "s3:*",
              "Resource": [
                "arn:aws:s3:::${S3BucketName}",
                "arn:aws:s3:::${S3BucketName}/*"
              ],
              "Condition": {
                "Bool": {
                  "aws:SecureTransport": "false"
                }
              }
            }
          ]
        }