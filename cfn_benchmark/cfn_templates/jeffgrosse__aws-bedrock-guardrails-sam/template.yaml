AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  Minimal, fully-parameterized AWS SAM template that deploys a single Amazon
  Bedrock Guardrail with a content policy, a topic policy, a sensitive
  information policy, and a word policy. See README.md for the 200-character
  YAML folded-scalar gotcha this repo exists to document, and
  docs/FOLDED-SCALAR-GOTCHA.md for the full writeup.

Parameters:
  GuardrailName:
    Type: String
    Default: example-guardrail
    AllowedPattern: '[0-9a-zA-Z-_]+'
    MaxLength: 50
    Description: >-
      Name for the guardrail. Bedrock allows only alphanumeric characters,
      hyphens, and underscores, max 50 characters.

  GuardrailDescription:
    Type: String
    Default: Example guardrail demonstrating content, topic, PII, and word policies.
    MaxLength: 200
    Description: >-
      Human-readable description of the guardrail. Bedrock caps this at 200
      characters - see the folded-scalar gotcha in the README before writing
      this as a multi-line YAML value.

  BlockedInputMessage:
    Type: String
    Default: "Sorry, I can't help with that request."
    MaxLength: 500
    Description: Message returned to the caller when a blocked input is detected.

  BlockedOutputMessage:
    Type: String
    Default: "Sorry, I can't provide that response."
    MaxLength: 500
    Description: Message returned to the caller when a blocked model response is detected.

Resources:

  # ---------------------------------------------------------------------------
  # Bedrock Guardrail - content, topic, sensitive information, and word policies
  # ---------------------------------------------------------------------------

  ExampleGuardrail:
    Type: AWS::Bedrock::Guardrail
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Ref GuardrailName
      Description: !Ref GuardrailDescription
      BlockedInputMessaging: !Ref BlockedInputMessage
      BlockedOutputsMessaging: !Ref BlockedOutputMessage

      # Content filters: detect harmful content by category. Strength is
      # tuned per category per direction (input = user prompt, output = model
      # response) - NONE disables a category for that direction entirely.
      ContentPolicyConfig:
        FiltersConfig:
          - Type: VIOLENCE
            InputStrength: HIGH
            OutputStrength: HIGH
          - Type: HATE
            InputStrength: HIGH
            OutputStrength: HIGH
          - Type: SEXUAL
            InputStrength: HIGH
            OutputStrength: HIGH
          - Type: INSULTS
            InputStrength: MEDIUM
            OutputStrength: MEDIUM
          - Type: MISCONDUCT
            InputStrength: HIGH
            OutputStrength: HIGH
          # PROMPT_ATTACK has no output-side equivalent (it classifies the
          # user's input for injection/jailbreak attempts) - OutputStrength
          # is required by the schema but has no effect here, so it's NONE.
          - Type: PROMPT_ATTACK
            InputStrength: HIGH
            OutputStrength: NONE

      # Denied topics: free-text definitions the model uses to classify
      # intent. `Definition` is capped at 200 characters POST-YAML-FOLDING,
      # not 200 characters of source text - see docs/FOLDED-SCALAR-GOTCHA.md.
      # Written as a single-line quoted string here specifically to avoid
      # that trap.
      TopicPolicyConfig:
        TopicsConfig:
          - Name: FinancialAdvice
            Type: DENY
            Definition: "Requests for specific investment, tax, or financial planning advice, including stock picks, portfolio allocation, or personal tax strategy."
            Examples:
              - "Should I buy index funds or individual stocks?"
              - "What's the best way to minimize my taxes this year?"
              - "How should I allocate my 401k?"

      # Sensitive information: probabilistic PII detection (piiEntitiesConfig)
      # plus a custom regex for identifiers Bedrock has no built-in entity
      # for (regexesConfig).
      SensitiveInformationPolicyConfig:
        PiiEntitiesConfig:
          - Type: EMAIL
            Action: ANONYMIZE
          - Type: PHONE
            Action: ANONYMIZE
          - Type: US_SOCIAL_SECURITY_NUMBER
            Action: BLOCK
          - Type: CREDIT_DEBIT_CARD_NUMBER
            Action: BLOCK
        RegexesConfig:
          - Name: InternalTicketId
            Description: Internal support ticket identifiers, e.g. TICKET-12345
            Pattern: 'TICKET-[0-9]{4,8}'
            Action: ANONYMIZE

      # Word filters: exact-match blocklist. The managed PROFANITY list
      # covers common profanity for free; WordsConfig adds custom terms
      # (competitor names, internal codenames, etc).
      WordPolicyConfig:
        ManagedWordListsConfig:
          - Type: PROFANITY
        WordsConfig:
          - Text: competitor-product-x
          - Text: internal-codename-x

  # A guardrail resource alone has no callable version - ApplyGuardrail and
  # InvokeModel's guardrail parameter both require a numbered version (or
  # DRAFT). This creates version "1" so the guardrail is immediately usable.
  ExampleGuardrailVersion:
    Type: AWS::Bedrock::GuardrailVersion
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      GuardrailIdentifier: !GetAtt ExampleGuardrail.GuardrailId
      Description: v1

Outputs:
  GuardrailId:
    Description: Guardrail ID (use with --guardrail-identifier in the AWS CLI).
    Value: !GetAtt ExampleGuardrail.GuardrailId

  GuardrailArn:
    Description: Guardrail ARN (use to scope an IAM bedrock:ApplyGuardrail policy).
    Value: !GetAtt ExampleGuardrail.GuardrailArn

  GuardrailVersion:
    Description: Numbered guardrail version created alongside the guardrail.
    Value: !GetAtt ExampleGuardrailVersion.Version