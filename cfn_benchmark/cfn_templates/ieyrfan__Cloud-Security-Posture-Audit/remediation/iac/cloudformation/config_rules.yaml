AWSTemplateFormatVersion: '2010-09-09'
Description: 'AWS Config Rules for Security Compliance - Managed Rules'

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues:
      - development
      - staging
      - production
    Description: Environment name

  ConfigDeliveryFrequency:
    Type: String
    Default: One_Hour
    AllowedValues:
      - One_Hour
      - Three_Hours
      - Six_Hours
      - Twelve_Hours
      - TwentyFour_Hours
    Description: Frequency of configuration snapshots

  ConfigS3BucketName:
    Type: String
    Description: Name of the S3 bucket for Config snapshots
    Default: ''

  SnsTopicArn:
    Type: String
    Description: ARN of SNS topic for Config notifications
    Default: ''

Conditions:
  HasCustomBucket: !Not [!Equals [!Ref ConfigS3BucketName, '']]
  HasSnsTopic: !Not [!Equals [!Ref SnsTopicArn, '']]

Resources:
  ConfigBucket:
    Type: 'AWS::S3::Bucket'
    Condition: HasCustomBucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !If [HasCustomBucket, !Ref ConfigS3BucketName, !Ref 'AWS::NoValue']
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: cloudformation

  ConfigBucketPolicy:
    Type: 'AWS::S3::BucketPolicy'
    Condition: HasCustomBucket
    Properties:
      Bucket: !Ref ConfigBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: config.amazonaws.com
            Action:
              - 's3:GetBucketAcl'
              - 's3:PutObject'
            Resource:
              - !GetAtt ConfigBucket.Arn
              - !Sub '\/AWSLogs/\/*'

  ConfigRecorderRole:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: !Sub '\-config-recorder-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: config.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - !Sub 'arn:\:iam::aws:policy/service-role/AWS_ConfigRole'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: cloudformation

  ConfigRecorder:
    Type: 'AWS::Config::ConfigurationRecorder'
    Properties:
      Name: !Sub '\-recorder'
      RoleARN: !GetAtt ConfigRecorderRole.Arn
      RecordingGroup:
        AllSupported: true
        IncludeGlobalResourceTypes: true

  ConfigDeliveryChannel:
    Type: 'AWS::Config::DeliveryChannel'
    Properties:
      Name: !Sub '\-channel'
      S3BucketName: !If [HasCustomBucket, !Ref ConfigBucket, !Ref 'AWS::NoValue']
      ConfigSnapshotDeliveryProperties:
        DeliveryFrequency: !Ref ConfigDeliveryFrequency
      SnsTopicARN: !If [HasSnsTopic, !Ref SnsTopicArn, !Ref 'AWS::NoValue']

  # ---------------------------------------------------------------------------
  # Managed Config Rules
  # ---------------------------------------------------------------------------

  S3PublicAccessRule:
    Type: 'AWS::Config::ConfigRule'
    Properties:
      ConfigRuleName: s3-bucket-public-read-prohibited
      Description: 'Checks that S3 buckets do not allow public read access'
      Source:
        Owner: AWS
        SourceIdentifier: S3_BUCKET_PUBLIC_READ_PROHIBITED
      Scope:
        ComplianceResourceTypes:
          - 'AWS::S3::Bucket'
      Tags:
        - Key: Environment
          Value: !Ref Environment

  S3PublicWriteRule:
    Type: 'AWS::Config::ConfigRule'
    Properties:
      ConfigRuleName: s3-bucket-public-write-prohibited
      Description: 'Checks that S3 buckets do not allow public write access'
      Source:
        Owner: AWS
        SourceIdentifier: S3_BUCKET_PUBLIC_WRITE_PROHIBITED
      Scope:
        ComplianceResourceTypes:
          - 'AWS::S3::Bucket'
      Tags:
        - Key: Environment
          Value: !Ref Environment

  RDSSnapshotEncrypted:
    Type: 'AWS::Config::ConfigRule'
    Properties:
      ConfigRuleName: rds-snapshots-public-prohibited
      Description: 'Checks that RDS snapshots are not public'
      Source:
        Owner: AWS
        SourceIdentifier: RDS_SNAPSHOTS_PUBLIC_PROHIBITED
      Scope:
        ComplianceResourceTypes:
          - 'AWS::RDS::DBInstance'
          - 'AWS::RDS::DBCluster'
          - 'AWS::RDS::DBSnapshot'
      Tags:
        - Key: Environment
          Value: !Ref Environment

  RDSEncryptionRule:
    Type: 'AWS::Config::ConfigRule'
    Properties:
      ConfigRuleName: rds-storage-encrypted
      Description: 'Checks that storage encryption is enabled for RDS instances'
      Source:
        Owner: AWS
        SourceIdentifier: RDS_STORAGE_ENCRYPTED
      Scope:
        ComplianceResourceTypes:
          - 'AWS::RDS::DBInstance'
      Tags:
        - Key: Environment
          Value: !Ref Environment

  CloudTrailEnabledRule:
    Type: 'AWS::Config::ConfigRule'
    Properties:
      ConfigRuleName: cloud-trail-enabled
      Description: 'Checks that CloudTrail is enabled'
      Source:
        Owner: AWS
        SourceIdentifier: CLOUD_TRAIL_ENABLED
      InputParameters:
        s3BucketName: !If [HasCustomBucket, !Ref ConfigBucket, '']
      Tags:
        - Key: Environment
          Value: !Ref Environment

  EC2EncryptedVolumesRule:
    Type: 'AWS::Config::ConfigRule'
    Properties:
      ConfigRuleName: ec2-volume-inuse-encryption
      Description: 'Checks that EBS volumes attached to EC2 instances are encrypted'
      Source:
        Owner: AWS
        SourceIdentifier: ENCRYPTED_VOLUMES
      Tags:
        - Key: Environment
          Value: !Ref Environment

  IAMPasswordPolicyRule:
    Type: 'AWS::Config::ConfigRule'
    Properties:
      ConfigRuleName: iam-password-policy
      Description: 'Checks IAM password policy meets minimum requirements'
      Source:
        Owner: AWS
        SourceIdentifier: IAM_PASSWORD_POLICY
      Tags:
        - Key: Environment
          Value: !Ref Environment

  RootMfaRule:
    Type: 'AWS::Config::ConfigRule'
    Properties:
      ConfigRuleName: root-account-mfa-enabled
      Description: 'Checks that root account has MFA enabled'
      Source:
        Owner: AWS
        SourceIdentifier: ROOT_ACCOUNT_MFA_ENABLED
      Tags:
        - Key: Environment
          Value: !Ref Environment

Outputs:
  ConfigRecorderName:
    Description: Name of the AWS Config Recorder
    Value: !Ref ConfigRecorder
  ConfigBucketName:
    Description: S3 bucket for AWS Config snapshots
    Value: !Ref ConfigBucket
  ConfigRoleArn:
    Description: ARN of the Config recorder IAM role
    Value: !GetAtt ConfigRecorderRole.Arn