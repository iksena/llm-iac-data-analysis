AWSTemplateFormatVersion: "2010-09-09"
Description: "VPC with public and private subnets across three Availability Zones, with IPv4 and IPv6 support."
Parameters:
  VpcIdentifier:
    Type: String
    Default: "MyVPC"
    Description: "Identifier for the VPC (used in Name tag)."
  VpcCidr:
    Type: String
    Default: "10.0.0.0/16"
    Description: "IPv4 CIDR block for the VPC."
  EnablePublicSubnets:
    Type: String
    AllowedValues:
      - "true"
      - "false"
    Default: "true"
    Description: "Whether to create public subnets, Internet Gateway, and public route table."
Conditions:
  HasPublicSubnets: !Equals [!Ref EnablePublicSubnets, "true"]
Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Ref VpcIdentifier
  VpcIpv6CidrBlock:
    Type: AWS::EC2::VPCCidrBlock
    Properties:
      VpcId: !Ref VPC
      AmazonProvidedIpv6CidrBlock: true
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Condition: HasPublicSubnets
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${VpcIdentifier}-IGW"
  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Condition: HasPublicSubnets
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: HasPublicSubnets
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${VpcIdentifier}-Public-RT"
  PublicRouteIPv4:
    Type: AWS::EC2::Route
    Condition: HasPublicSubnets
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: "0.0.0.0/0"
      GatewayId: !Ref InternetGateway
  PublicRouteIPv6:
    Type: AWS::EC2::Route
    Condition: HasPublicSubnets
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationIpv6CidrBlock: "::/0"
      GatewayId: !Ref InternetGateway
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${VpcIdentifier}-Private-RT"
  # Private subnets (always created)
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    DependsOn: VpcIpv6CidrBlock
    Properties:
      VpcId: !Ref VPC
      CidrBlock:
        Fn::Select:
          - 0
          - Fn::Cidr:
              - !Ref VpcCidr
              - 6
              - 24
      Ipv6CidrBlock:
        Fn::Select:
          - 0
          - Fn::Cidr:
              - Fn::Select:
                  - 0
                  - Fn::GetAtt:
                      - VPC
                      - Ipv6CidrBlocks
              - 6
              - 64
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub "${VpcIdentifier}-Private-Subnet-1"
  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    DependsOn: VpcIpv6CidrBlock
    Properties:
      VpcId: !Ref VPC
      CidrBlock:
        Fn::Select:
          - 1
          - Fn::Cidr:
              - !Ref VpcCidr
              - 6
              - 24
      Ipv6CidrBlock:
        Fn::Select:
          - 1
          - Fn::Cidr:
              - Fn::Select:
                  - 0
                  - Fn::GetAtt:
                      - VPC
                      - Ipv6CidrBlocks
              - 6
              - 64
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub "${VpcIdentifier}-Private-Subnet-2"
  PrivateSubnet3:
    Type: AWS::EC2::Subnet
    DependsOn: VpcIpv6CidrBlock
    Properties:
      VpcId: !Ref VPC
      CidrBlock:
        Fn::Select:
          - 2
          - Fn::Cidr:
              - !Ref VpcCidr
              - 6
              - 24
      Ipv6CidrBlock:
        Fn::Select:
          - 2
          - Fn::Cidr:
              - Fn::Select:
                  - 0
                  - Fn::GetAtt:
                      - VPC
                      - Ipv6CidrBlocks
              - 6
              - 64
      AvailabilityZone: !Select [2, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub "${VpcIdentifier}-Private-Subnet-3"
  # Public subnets (conditional)
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Condition: HasPublicSubnets
    DependsOn: VpcIpv6CidrBlock
    Properties:
      VpcId: !Ref VPC
      CidrBlock:
        Fn::Select:
          - 3
          - Fn::Cidr:
              - !Ref VpcCidr
              - 6
              - 24
      Ipv6CidrBlock:
        Fn::Select:
          - 3
          - Fn::Cidr:
              - Fn::Select:
                  - 0
                  - Fn::GetAtt:
                      - VPC
                      - Ipv6CidrBlocks
              - 6
              - 64
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub "${VpcIdentifier}-Public-Subnet-1"
  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Condition: HasPublicSubnets
    DependsOn: VpcIpv6CidrBlock
    Properties:
      VpcId: