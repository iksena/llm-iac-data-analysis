AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFormation template for a self-contained SageMaker Domain in VPC Only mode with a test user profile and dedicated IAM role.'
Parameters:
  DomainName:
    Type: String
    Description: Name of the SageMaker Domain.
    Default: my-ml-domain
    AllowedPattern: '^[a-zA-Z0-9](-*[a-zA-Z0-9]){0,62}$'
    MaxLength: 63
  TestUserName:
    Type: String
    Description: Name of the test user profile.
    Default: data-scientist
    AllowedPattern: '^[a-zA-Z0-9](-*[a-zA-Z0-9]){0,62}$'
    MaxLength: 63
  DefaultS3BucketName:
    Type: String
    Description: Name (not ARN) of the default S3 bucket for the domain. Must exist and be versioned.
    Default: my-sagemaker-artifacts
    AllowedPattern: '^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$'
  VpcId:
    Type: String
    Description: VPC ID for the SageMaker Domain. Must be a valid existing VPC.
    Default: vpc-xxxxxxxx
    AllowedPattern: '^vpc-[0-9a-f]{8,17}$'
  SubnetIds:
    Type: String
    Description: Comma-separated list of subnet IDs (at least 1, at most 10). Must be valid existing subnets in the VPC.
    Default: subnet-xxxxxxxx,subnet-yyyyyyyy
    AllowedPattern: '^(subnet-[0-9a-f]{8,17})(,subnet-[0-9a-f]{8,17}){0,9}$'
  SecurityGroupIds:
    Type: String
    Description: Comma-separated list of security group IDs (at least 1, at most 10). First one used for domain boundary.
    Default: sg-xxxxxxxx
    AllowedPattern: '^(sg-[0-9a-f]{8,17})(,sg-[0-9a-f]{8,17}){0,9}$'
Conditions:
  HasMultipleSubnets:
    Fn::Not:
      - Fn::Equals:
          - !Select [1, !Split [',', !Ref SubnetIds]]
          - ''
  HasMultipleSecurityGroups:
    Fn::Not:
      - Fn::Equals:
          - !Select [1, !Split [',', !Ref SecurityGroupIds]]
          - ''
Resources:
  DefaultS3BucketArn:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/sagemaker/${DomainName}/default-bucket-arn'
      Type: String
      Value: !Sub 'arn:aws:s3:::${DefaultS3BucketName}'
      Description: ARN of the default S3 bucket for the SageMaker domain.
  SageMakerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${DomainName}-execution-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: sagemaker.amazonaws.com
            Action: sts:AssumeRole
      Path: /
      Policies:
        - PolicyName: SageMakerFullAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sagemaker:CreateTrainingJob
                  - sagemaker:StopTrainingJob
                  - sagemaker:DescribeTrainingJob
                  - sagemaker:ListTrainingJobs
                  - sagemaker:CreateTransformJob
                  - sagemaker:StopTransformJob
                  - sagemaker:DescribeTransformJob
                  - sagemaker:ListTransformJobs
                  - sagemaker:CreateProcessingJob
                  - sagemaker:StopProcessingJob
                  - sagemaker:DescribeProcessingJob
                  - sagemaker:ListProcessingJobs
                  - sagemaker:CreateAutoMLJob
                  - sagemaker:StopAutoMLJob
                  - sagemaker:DescribeAutoMLJob
                  - sagemaker:ListAutoMLJobs
                  - sagemaker:CreateHyperParameterTuningJob
                  - sagemaker:StopHyperParameterTuningJob
                  - sagemaker:DescribeHyperParameterTuningJob
                  - sagemaker:ListHyperParameterTuningJobs
                  - sagemaker:CreateExperiment
                  - sagemaker:UpdateExperiment
                  - sagemaker:DescribeExperiment
                  - sagemaker:ListExperiments
                  - sagemaker:CreateTrial
                  - sagemaker:UpdateTrial
                  - sagemaker:DescribeTrial
                  - sagemaker:ListTrials
                  - sagemaker:CreateTrialComponent
                  - sagemaker:UpdateTrialComponent
                  - sagemaker:DescribeTrialComponent
                  - sagemaker:ListTrialComponents
                  - sagemaker:AssociateTrialComponent
                  - sagemaker:DisassociateTrialComponent
                  - sagemaker:CreateArtifact
                  - sagemaker:UpdateArtifact
                  - sagemaker:DescribeArtifact
                  - sagemaker:ListArtifacts
                  - sagemaker:CreateContext
                  - sagemaker:UpdateContext
                  - sagemaker:DescribeContext
                  - sagemaker:ListContexts
                  - sagemaker:CreateAction
                  - sagemaker:UpdateAction
                  - sagemaker:DescribeAction
                  - sagemaker:ListActions
                  - sagemaker:AddAssociation
                  - sagemaker:DeleteAssociation
                  - sagemaker:CreateModelPackage
                  - sagemaker:UpdateModelPackage
                  - sagemaker:DescribeModelPackage
                  - sagemaker:ListModelPackages
                  - sagemaker:DeleteModelPackage
                  - sagemaker:CreateModelPackageGroup
                  - sagemaker:DescribeModelPackageGroup
                  - sagemaker:ListModelPackageGroups
                  - sagemaker