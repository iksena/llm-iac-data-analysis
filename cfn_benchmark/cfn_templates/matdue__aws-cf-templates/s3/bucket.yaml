AWSTemplateFormatVersion: '2010-09-09'
Description: 'S3 Bucket to store data'

Parameters:
  Project:
    Description: The project name.
    Type: String
  EncryptionKeyStack:
    Description: The stack name containing the encryption key to enable server-side encryption.
    Type: String
    Default: ''

Conditions:
  EncryptionKeyProvided: !Not [!Equals [!Ref EncryptionKeyStack, '']]

Resources:
  Bucket:
    Type: 'AWS::S3::Bucket'
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              KMSMasterKeyID: !If [EncryptionKeyProvided, 'Fn::ImportValue': !Sub '${EncryptionKeyStack}-Alias', !Ref 'AWS::NoValue']
              SSEAlgorithm: aws:kms
      LifecycleConfiguration:
        Rules:
          #- Status: Enabled
          #  Transitions:
          #    - StorageClass: STANDARD_IA
          #      TransitionInDays: 30
          #    - StorageClass: GLACIER
          #      TransitionInDays: 90
          #    # - StorageClass: DEEP_ARCHIVE   Not yet available in CloudFormation templates (although documented...)
          #    #   TransitionInDays: 180
          - Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Project
          Value: !Ref Project

Outputs:
  BucketName:
    Value: !Ref Bucket
    Description: S3 Bucket to store data
    Export:
      Name: !Sub '${AWS::StackName}-BucketName'
  Arn:
    Value: !GetAtt Bucket.Arn
    Description: Arn
    Export:
      Name: !Sub '${AWS::StackName}-Arn'