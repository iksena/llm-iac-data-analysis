---
# Bashlinux::RabbitMQ::MQ Subnet Group
#
#   Cloudformation template to deploy an MQ Subnet Group
#   for a RabbitMQ cluster on a private subnet
#
#   Manuel F Martinez
#   Bashlinux
#   Los Angeles, CA
#
AWSTemplateFormatVersion: "2010-09-09"
Description: MQ Subnet Group template

###############################################################################
Parameters:

  Environment:
    Description: RabbitMQ cluster environment
    Type: String
    MinLength: "1"
    MaxLength: "20"
    Default: staging
    AllowedValues: [ "prod", "staging" ]
    ConstraintDescription: >
      Environment name can only contain "prod" or "staging".

  MQPrivateSubnets:
    Description: Private subnets 01A where the cluster is deployed
    Type: List<AWS::EC2::Subnet::Id>
    MinLength: "1"
    MaxLength: "96"

  Organization:
    Description: Organization or Customer name
    Type: String
    MinLength: "1"
    MaxLength: "32"
    Default: bashlinux
    AllowedPattern: "[a-zA-Z0-9\\-]*"
    ConstraintDescription: >
      Name of the organization must contains only letters, numbers and hyphens

###############################################################################
Resources:

  MqSubnetGroup:
    Type: AWS::AmazonMQ::SubnetGroup
    Properties:
      Description: RabbitMQ Subnet Group
      SubnetIds: !Ref MQPrivateSubnets
      Tags:
      - Key: bashlinux:network-visibility
        Value: private
      - Key: bashlinux:organization-name
        Value: !Ref Organization
      - Key: bashlinux:environment-name
        Value: !Ref Environment
      - Key: bashlinux:can-delete
        Value: "false"
      - Key: bashlinux:application-id
        Value: !Ref AWS::StackName
      - Key: Name
        Value: !Sub "${Organization}-rabbitmq-${Environment}"

###############################################################################
Outputs:

  MqSubnetGroupId:
    Description: "SubnetGroup: MQ RabbitMQ SubnetGroup"
    Value: !Ref MqSubnetGroup
    Export:
      Name: !Sub "${Organization}-${Environmnet}-MqSubnetGroupId"