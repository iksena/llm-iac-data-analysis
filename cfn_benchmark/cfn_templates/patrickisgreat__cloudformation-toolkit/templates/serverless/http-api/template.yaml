AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  API Gateway HTTP API fronting a Lambda function, with access logging, request
  throttling, CORS, an optional JWT authorizer, and an optional custom domain.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Naming
        Parameters:
          - NamePrefix
          - Environment
          - ApiSuffix
      - Label:
          default: Integration
        Parameters:
          - LambdaFunctionArn
          - PayloadFormatVersion
          - IntegrationTimeoutMillis
      - Label:
          default: Throttling (this is your cost and abuse cap)
        Parameters:
          - ThrottlingRateLimit
          - ThrottlingBurstLimit
      - Label:
          default: CORS
        Parameters:
          - CorsAllowOrigin
          - CorsAllowHeaders
      - Label:
          default: JWT authorizer
        Parameters:
          - JwtIssuer
          - JwtAudience
      - Label:
          default: Custom domain
        Parameters:
          - DomainName
          - CertificateArn
      - Label:
          default: Logging
        Parameters:
          - LogRetentionDays

Parameters:
  NamePrefix:
    Type: String
    Description: Prefix for the API name.
    AllowedPattern: "^[a-z][a-z0-9-]{1,30}[a-z0-9]$"
    ConstraintDescription: 3-32 lowercase characters, digits and hyphens.

  Environment:
    Type: String
    Description: Environment this API serves.
    Default: dev
    AllowedValues: [dev, staging, prod]

  ApiSuffix:
    Type: String
    Description: Distinguishes APIs under one prefix, e.g. "public" or "admin".
    Default: api
    AllowedPattern: "^[a-z0-9][a-z0-9-]{0,30}$"

  LambdaFunctionArn:
    Type: String
    Description: >-
      ARN of the Lambda function handling every route. The API uses a catch-all
      $default route, so routing happens inside the function - which is how
      almost every framework (FastAPI, Express, Gin, Axum) expects to be run
      behind API Gateway.

  PayloadFormatVersion:
    Type: String
    Description: >-
      Event shape passed to the function. 2.0 is the HTTP API native format and
      the right choice for new code; 1.0 matches REST API / ALB events, for
      handlers written against those.
    Default: "2.0"
    AllowedValues: ["1.0", "2.0"]

  IntegrationTimeoutMillis:
    Type: Number
    Description: >-
      How long API Gateway waits for the function. Must be at least as long as
      the function timeout, or the client gets a 504 while the function is still
      running and still billing.
    Default: 30000
    MinValue: 50
    MaxValue: 30000

  ThrottlingRateLimit:
    Type: Number
    Description: >-
      Steady-state requests per second across the whole stage. An HTTP API with
      no throttle will happily forward a scraper's traffic to your function and
      bill you for every invocation - this is the cap that makes a runaway client
      a 429 instead of an invoice.
    Default: 100
    MinValue: 1
    MaxValue: 100000

  ThrottlingBurstLimit:
    Type: Number
    Description: Bucket size for short spikes above the rate limit.
    Default: 200
    MinValue: 1
    MaxValue: 100000

  CorsAllowOrigin:
    Type: String
    Description: >-
      Origin allowed to call this API from a browser, e.g.
      https://app.example.com. Leave empty for no CORS (correct for a
      server-to-server API). "*" disables credentialed requests in every browser.
    Default: ""

  CorsAllowHeaders:
    Type: CommaDelimitedList
    Description: Request headers a browser may send.
    Default: "content-type,authorization"

  JwtIssuer:
    Type: String
    Description: >-
      OIDC issuer URL, e.g. a Cognito user pool
      (https://cognito-idp.<region>.amazonaws.com/<pool-id>) or an Auth0 domain.
      Leave empty for an unauthenticated API - which means every route is public.
    Default: ""

  JwtAudience:
    Type: CommaDelimitedList
    Description: >-
      Accepted `aud` claims (the client IDs). Required when JwtIssuer is set: a
      JWT authorizer that validates the issuer but not the audience accepts any
      token that issuer ever minted, for any application.
    Default: ""

  DomainName:
    Type: String
    Description: Custom domain, e.g. api.example.com. Leave empty to use the generated URL.
    Default: ""

  CertificateArn:
    Type: String
    Description: >-
      ACM certificate for DomainName. Must be in this API's region (unlike
      CloudFront, which requires us-east-1).
    Default: ""

  LogRetentionDays:
    Type: Number
    Description: Retention for the access log group.
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1827, 3653]

Conditions:
  HasCors: !Not [!Equals [!Ref CorsAllowOrigin, ""]]
  HasJwtAuthorizer: !Not [!Equals [!Ref JwtIssuer, ""]]
  HasCustomDomain: !Not [!Equals [!Ref DomainName, ""]]

Resources:
  AccessLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/${Environment}/${NamePrefix}/${ApiSuffix}/access"
      RetentionInDays: !Ref LogRetentionDays

  Api:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${NamePrefix}-${Environment}-${ApiSuffix}"
      Description: !Sub "${ApiSuffix} HTTP API (${Environment})"
      ProtocolType: HTTP
      CorsConfiguration: !If
        - HasCors
        - AllowOrigins: [!Ref CorsAllowOrigin]
          AllowHeaders: !Ref CorsAllowHeaders
          AllowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
          # Only meaningful with a concrete origin — browsers reject credentialed
          # requests against a wildcard, so this pairs with a real origin only.
          AllowCredentials: true
          MaxAge: 600
        - !Ref AWS::NoValue

  Integration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: AWS_PROXY
      IntegrationUri: !Ref LambdaFunctionArn
      PayloadFormatVersion: !Ref PayloadFormatVersion
      TimeoutInMillis: !Ref IntegrationTimeoutMillis

  Authorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Condition: HasJwtAuthorizer
    Properties:
      ApiId: !Ref Api
      Name: jwt
      AuthorizerType: JWT
      IdentitySource: ["$request.header.Authorization"]
      JwtConfiguration:
        Issuer: !Ref JwtIssuer
        Audience: !Ref JwtAudience

  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: $default
      Target: !Sub "integrations/${Integration}"
      AuthorizationType: !If [HasJwtAuthorizer, JWT, NONE]
      AuthorizerId: !If [HasJwtAuthorizer, !Ref Authorizer, !Ref "AWS::NoValue"]

  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref Api
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingRateLimit: !Ref ThrottlingRateLimit
        ThrottlingBurstLimit: !Ref ThrottlingBurstLimit
        DetailedMetricsEnabled: true
      AccessLogSettings:
        DestinationArn: !GetAtt AccessLogGroup.Arn
        # Includes the integration error and latency fields, which are what
        # distinguish "the function failed" from "the gateway could not reach it".
        Format: >-
          {"requestId":"$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","routeKey":"$context.routeKey","status":"$context.status","protocol":"$context.protocol","responseLength":"$context.responseLength","integrationStatus":"$context.integrationStatus","integrationError":"$context.integrationErrorMessage","responseLatency":"$context.responseLatency"}

  # Without this, every request returns 500 with an "Internal Server Error" and
  # nothing in the function's logs, because API Gateway was never allowed to
  # invoke it. It is the single most common HTTP API misconfiguration.
  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LambdaFunctionArn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*"

  Domain:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: HasCustomDomain
    Properties:
      DomainName: !Ref DomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref CertificateArn
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2

  DomainMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: HasCustomDomain
    Properties:
      ApiId: !Ref Api
      DomainName: !Ref Domain
      Stage: !Ref Stage

Outputs:
  ApiId:
    Description: API ID.
    Value: !Ref Api

  ApiEndpoint:
    Description: Generated endpoint URL (https://<id>.execute-api.<region>.amazonaws.com).
    Value: !GetAtt Api.ApiEndpoint

  CustomDomainTarget:
    Description: >-
      Regional domain name to point a Route 53 alias at, when a custom domain
      was configured.
    Condition: HasCustomDomain
    Value: !GetAtt Domain.RegionalDomainName

  CustomDomainHostedZoneId:
    Description: Hosted zone ID for the alias record target.
    Condition: HasCustomDomain
    Value: !GetAtt Domain.RegionalHostedZoneId

  AccessLogGroupName:
    Description: Log group holding access logs.
    Value: !Ref AccessLogGroup