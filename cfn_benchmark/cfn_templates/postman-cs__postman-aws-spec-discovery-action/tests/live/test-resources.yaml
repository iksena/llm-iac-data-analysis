AWSTemplateFormatVersion: '2010-09-09'
Description: Temporary test resources for multi-provider spec discovery validation

Resources:
  # 1. REST API Gateway with embedded OpenAPI spec
  TestRestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: spec-discovery-test-rest
      Description: Test REST API for spec discovery
      Body:
        openapi: '3.0.1'
        info:
          title: spec-discovery-test-rest
          version: '1.0.0'
        paths:
          /health:
            get:
              summary: Health check
              responses:
                '200':
                  description: OK
                  content:
                    application/json:
                      schema:
                        type: object
                        properties:
                          status:
                            type: string
              x-amazon-apigateway-integration:
                type: MOCK
                requestTemplates:
                  application/json: '{"statusCode": 200}'
                responses:
                  default:
                    statusCode: '200'
                    responseTemplates:
                      application/json: '{"status":"ok"}'
          /no-content:
            get:
              responses:
                '204':
                  description: No content
              x-amazon-apigateway-integration:
                type: MOCK
                requestTemplates:
                  application/json: '{"statusCode": 204}'
                responses:
                  default:
                    statusCode: '204'
                    responseTemplates:
                      application/json: ''
          /no-content-with-body:
            get:
              responses:
                '204':
                  description: No content
              x-amazon-apigateway-integration:
                type: MOCK
                requestTemplates:
                  application/json: '{"statusCode": 204}'
                responses:
                  default:
                    statusCode: '204'
                    responseTemplates:
                      application/json: '{"unexpected":true}'
          /schema-valid:
            get:
              responses:
                '200':
                  description: Valid schema response
                  content:
                    application/json:
                      schema:
                        type: object
                        required:
                          - status
                        properties:
                          status:
                            type: string
                        additionalProperties: false
              x-amazon-apigateway-integration:
                type: MOCK
                requestTemplates:
                  application/json: '{"statusCode": 200}'
                responses:
                  default:
                    statusCode: '200'
                    responseTemplates:
                      application/json: '{"status":"valid"}'
          /schema-invalid:
            get:
              responses:
                '200':
                  description: Invalid schema response
                  content:
                    application/json:
                      schema:
                        type: object
                        required:
                          - status
                        properties:
                          status:
                            type: string
                        additionalProperties: false
              x-amazon-apigateway-integration:
                type: MOCK
                requestTemplates:
                  application/json: '{"statusCode": 200}'
                responses:
                  default:
                    statusCode: '200'
                    responseTemplates:
                      application/json: '{"status":42}'
          /unknown-length:
            get:
              responses:
                '200':
                  description: Unknown body with matching length
              x-amazon-apigateway-integration:
                type: MOCK
                requestTemplates:
                  application/json: '{"statusCode": 200}'
                responses:
                  default:
                    statusCode: '200'
                    responseTemplates:
                      application/json: '{"status":"length"}'
          /unknown-length-mismatch:
            get:
              responses:
                '200':
                  description: Unknown body with controlled mismatched length
                  headers:
                    Content-Length:
                      schema:
                        type: integer
              x-amazon-apigateway-integration:
                type: MOCK
                requestTemplates:
                  application/json: '{"statusCode": 200}'
                responses:
                  default:
                    statusCode: '200'
                    responseParameters:
                      method.response.header.Content-Length: "'1'"
                    responseTemplates:
                      application/json: '{"status":"length-mismatch"}'
      Tags:
        - Key: postman:project-name
          Value: spec-discovery-test
        - Key: env
          Value: test

  TestRestDeploymentContractControlsV2:
    Type: AWS::ApiGateway::Deployment
    DependsOn: TestRestApi
    Properties:
      RestApiId: !Ref TestRestApi

  TestRestStageProd:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref TestRestApi
      DeploymentId: !Ref TestRestDeploymentModeledV3
      StageName: prod

  # 2. HTTP API Gateway
  TestRestOrdersResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref TestRestApi
      ParentId: !GetAtt TestRestApi.RootResourceId
      PathPart: orders

  TestRestCreateOrderModel:
    Type: AWS::ApiGateway::Model
    Properties:
      RestApiId: !Ref TestRestApi
      Name: CreateOrder
      ContentType: application/json
      Schema:
        type: object
        required:
          - sku
        properties:
          sku:
            type: string
          quantity:
            type: integer

  TestRestBodyValidator:
    Type: AWS::ApiGateway::RequestValidator
    Properties:
      RestApiId: !Ref TestRestApi
      Name: body-only
      ValidateRequestBody: true
      ValidateRequestParameters: false

  TestRestOrdersPostMethod:
    Type: AWS::ApiGateway::Method
    DependsOn: TestRestCreateOrderModel
    Properties:
      RestApiId: !Ref TestRestApi
      ResourceId: !Ref TestRestOrdersResource
      HttpMethod: POST
      AuthorizationType: NONE
      RequestModels:
        application/json: CreateOrder
      RequestValidatorId: !Ref TestRestBodyValidator
      MethodResponses:
        - StatusCode: '200'
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: '200'
            ResponseTemplates:
              application/json: '{"status":"created"}'

  TestRestDeploymentModeledV3:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - TestRestApi
      - TestRestOrdersPostMethod
    Properties:
      RestApiId: !Ref TestRestApi

  TestHttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: spec-discovery-test-http
      ProtocolType: HTTP
      Description: Test HTTP API for spec discovery
      Tags:
        postman:project-name: spec-discovery-test-http

  TestHttpStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref TestHttpApi
      StageName: '$default'
      AutoDeploy: true

  # 3. WebSocket API Gateway
  TestWebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: spec-discovery-test-websocket
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: $request.body.action
      Description: Test WebSocket API for spec discovery
      Tags:
        postman:project-name: spec-discovery-test-ws

  TestWebSocketOrderModel:
    Type: AWS::ApiGatewayV2::Model
    Properties:
      ApiId: !Ref TestWebSocketApi
      Name: OrderMessage
      ContentType: application/json
      Schema:
        type: object
        required:
          - orderId
        properties:
          action:
            type: string
          messageType:
            type: string
          orderId:
            type: string

  TestWebSocketAckModel:
    Type: AWS::ApiGatewayV2::Model
    Properties:
      ApiId: !Ref TestWebSocketApi
      Name: OrderAck
      ContentType: application/json
      Schema:
        type: object
        properties:
          accepted:
            type: boolean

  TestWebSocketIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref TestWebSocketApi
      IntegrationType: HTTP
      IntegrationMethod: POST
      IntegrationUri: https://example.com/websocket-validation
      RequestTemplates:
        application/json: '{"statusCode": 200}'
      TemplateSelectionExpression: $request.body.template
      TimeoutInMillis: 29000

  TestWebSocketRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn:
      - TestWebSocketOrderModel
      - TestWebSocketIntegration
    Properties:
      ApiId: !Ref TestWebSocketApi
      RouteKey: sendMessage
      AuthorizationType: NONE
      OperationName: sendOrderMessage
      ModelSelectionExpression: $request.body.messageType
      RequestModels:
        application/json: OrderMessage
      RouteResponseSelectionExpression: $default
      Target: !Sub integrations/${TestWebSocketIntegration}

  TestWebSocketRouteResponse:
    Type: AWS::ApiGatewayV2::RouteResponse
    DependsOn:
      - TestWebSocketAckModel
      - TestWebSocketRoute
    Properties:
      ApiId: !Ref TestWebSocketApi
      RouteId: !Ref TestWebSocketRoute
      RouteResponseKey: '$default'
      ModelSelectionExpression: $request.body.messageType
      ResponseModels:
        application/json: OrderAck

  # 4. AppSync GraphQL API
  TestGraphqlApi:
    Type: AWS::AppSync::GraphQLApi
    Properties:
      Name: spec-discovery-test-graphql
      AuthenticationType: API_KEY
      Tags:
        - Key: postman:project-name
          Value: spec-discovery-test-graphql

  TestGraphqlSchema:
    Type: AWS::AppSync::GraphQLSchema
    Properties:
      ApiId: !GetAtt TestGraphqlApi.ApiId
      Definition: |
        type Query {
          getItem(id: ID!): Item
          listItems: [Item]
        }
        type Mutation {
          createItem(input: CreateItemInput!): Item
        }
        type Item {
          id: ID!
          name: String!
          description: String
          createdAt: String
        }
        input CreateItemInput {
          name: String!
          description: String
        }

  # 5. EventBridge Schema Registry with custom schema
  TestSchemaRegistry:
    Type: AWS::EventSchemas::Registry
    Properties:
      RegistryName: spec-discovery-test-registry
      Description: Test registry for spec discovery
      Tags:
        - Key: env
          Value: test

  TestEventSchema:
    Type: AWS::EventSchemas::Schema
    Properties:
      RegistryName: !GetAtt TestSchemaRegistry.RegistryName
      SchemaName: spec-discovery-test.OrderCreated
      Type: OpenApi3
      Description: Test event schema
      Content: >
        {"openapi":"3.0.0","info":{"title":"OrderCreated","version":"1.0.0"},"paths":{},"components":{"schemas":{"OrderCreated":{"type":"object","properties":{"orderId":{"type":"string"},"customerId":{"type":"string"},"amount":{"type":"number"},"createdAt":{"type":"string","format":"date-time"}},"required":["orderId","customerId","amount"]}}}}

  # 6. Glue Schema Registry with Avro schema
  TestGlueRegistry:
    Type: AWS::Glue::Registry
    Properties:
      Name: spec-discovery-test-glue-registry
      Description: Test Glue registry for spec discovery

  TestGlueSchema:
    Type: AWS::Glue::Schema
    Properties:
      Registry:
        Name: spec-discovery-test-glue-registry
      Name: spec-discovery-test-user-event
      DataFormat: AVRO
      Compatibility: NONE
      SchemaDefinition: >
        {"type":"record","name":"UserEvent","namespace":"com.example.test","fields":[{"name":"userId","type":"string"},{"name":"action","type":"string"},{"name":"timestamp","type":"long"}]}

  # 7. SNS standard topic
  SpecDiscoveryTestTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: SpecDiscoveryTestTopic

  # 8. SNS tagged topic
  SpecDiscoveryTaggedTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: SpecDiscoveryTaggedTopic
      Tags:
        - Key: postman:project-name
          Value: test-service

  # 9. SNS FIFO topic
  SpecDiscoveryFifoTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: SpecDiscoveryTestTopic.fifo
      FifoTopic: true
      ContentBasedDeduplication: true

  # 10. SNS topic with SQS subscription
  SpecDiscoverySubscriptionTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: SpecDiscoverySubscribedTopic

  SpecDiscoverySnsConfirmRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: confirm-sns-subscriptions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sns:ConfirmSubscription
                Resource: !Ref SpecDiscoverySubscriptionTopic

  SpecDiscoverySnsConfirmFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: spec-discovery-sns-confirm
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt SpecDiscoverySnsConfirmRole.Arn
      Timeout: 10
      Code:
        ZipFile: |
          import base64
          import json
          import boto3

          sns = boto3.client("sns")

          def handler(event, context):
              body = event.get("body") or "{}"
              if event.get("isBase64Encoded"):
                  body = base64.b64decode(body).decode("utf-8")
              try:
                  message = json.loads(body)
              except Exception:
                  message = {}
              if message.get("Type") == "SubscriptionConfirmation":
                  sns.confirm_subscription(
                      TopicArn=message["TopicArn"],
                      Token=message["Token"],
                      AuthenticateOnUnsubscribe="false"
                  )
              return {"statusCode": 200, "body": "ok"}

  SpecDiscoverySnsConfirmHttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: spec-discovery-sns-confirm
      ProtocolType: HTTP

  SpecDiscoverySnsConfirmIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref SpecDiscoverySnsConfirmHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt SpecDiscoverySnsConfirmFunction.Arn
      PayloadFormatVersion: '2.0'

  SpecDiscoverySnsConfirmRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref SpecDiscoverySnsConfirmHttpApi
      RouteKey: 'POST /sns-confirm'
      Target: !Sub integrations/${SpecDiscoverySnsConfirmIntegration}

  SpecDiscoverySnsConfirmStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref SpecDiscoverySnsConfirmHttpApi
      StageName: '$default'
      AutoDeploy: true

  SpecDiscoverySnsConfirmInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SpecDiscoverySnsConfirmFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${SpecDiscoverySnsConfirmHttpApi}/*/POST/sns-confirm

  SpecDiscoveryUrlTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: SpecDiscoveryUrlTopic

  SpecDiscoverySubscriptionQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: SpecDiscoverySubscriptionQueue

  SpecDiscoveryQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref SpecDiscoverySubscriptionQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowSnsPublish
            Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt SpecDiscoverySubscriptionQueue.Arn
            Condition:
              ArnEquals:
                'aws:SourceArn': !Ref SpecDiscoverySubscriptionTopic

  SpecDiscoverySqsSubscription:
    Type: AWS::SNS::Subscription
    DependsOn: SpecDiscoveryQueuePolicy
    Properties:
      TopicArn: !Ref SpecDiscoverySubscriptionTopic
      Protocol: sqs
      Endpoint: !GetAtt SpecDiscoverySubscriptionQueue.Arn

  SpecDiscoveryRawSubscriptionQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: SpecDiscoveryRawSubscriptionQueue

  SpecDiscoveryRawQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref SpecDiscoveryRawSubscriptionQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowSnsPublishRaw
            Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt SpecDiscoveryRawSubscriptionQueue.Arn
            Condition:
              ArnEquals:
                'aws:SourceArn': !Ref SpecDiscoverySubscriptionTopic

  SpecDiscoveryRawSqsSubscription:
    Type: AWS::SNS::Subscription
    DependsOn: SpecDiscoveryRawQueuePolicy
    Properties:
      TopicArn: !Ref SpecDiscoverySubscriptionTopic
      Protocol: sqs
      Endpoint: !GetAtt SpecDiscoveryRawSubscriptionQueue.Arn
      RawMessageDelivery: true

  SpecDiscoveryHttpsSubscriptionDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: SpecDiscoveryHttpsSubscriptionDlq

  SpecDiscoveryHttpsSubscriptionDlqPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref SpecDiscoveryHttpsSubscriptionDlq
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowSnsPublishHttpsDlq
            Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt SpecDiscoveryHttpsSubscriptionDlq.Arn
            Condition:
              ArnEquals:
                'aws:SourceArn': !Ref SpecDiscoverySubscriptionTopic

  SpecDiscoveryHttpsSubscription:
    Type: AWS::SNS::Subscription
    DependsOn:
      - SpecDiscoveryHttpsSubscriptionDlqPolicy
      - SpecDiscoverySnsConfirmInvokePermission
      - SpecDiscoverySnsConfirmStage
    Properties:
      TopicArn: !Ref SpecDiscoverySubscriptionTopic
      Protocol: https
      Endpoint: !Sub https://${SpecDiscoverySnsConfirmHttpApi}.execute-api.${AWS::Region}.amazonaws.com/sns-confirm
      FilterPolicy:
        eventType:
          - order.created
      FilterPolicyScope: MessageBody
      DeliveryPolicy:
        healthyRetryPolicy:
          minDelayTarget: 1
          maxDelayTarget: 2
          numRetries: 3
          numMaxDelayRetries: 1
          numMinDelayRetries: 1
          numNoDelayRetries: 0
          backoffFunction: linear
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt SpecDiscoveryHttpsSubscriptionDlq.Arn

  # 11. SSM contract pointers for SNS resolution
  SpecDiscoveryTopicContractFormat:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /postman/specs/spec-discovery-test-topic/format
      Type: String
      Value: asyncapi-yaml

  SpecDiscoveryTopicContractContent:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /postman/specs/spec-discovery-test-topic/content
      Type: String
      Value: |
        asyncapi: 2.6.0
        info:
          title: Spec Discovery Test Topic Contract
          version: 1.0.0
        channels:
          spec-discovery-test-topic:
            description: Sample contract for SNS live testing
            subscribe:
              message:
                contentType: application/json
                payload:
                  type: object
                  required:
                    - eventType
                    - message
                  properties:
                    eventType:
                      type: string
                    message:
                      type: string

  SpecDiscoveryUrlTopicContractUrl:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /postman/specs/spec-discovery-url-topic/spec-url
      Type: String
      Value: https://json.schemastore.org/package

  SpecDiscoveryUrlTopicContractFormat:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /postman/specs/spec-discovery-url-topic/spec-format
      Type: String
      Value: json-schema

Outputs:
  RestApiId:
    Value: !Ref TestRestApi
  HttpApiId:
    Value: !Ref TestHttpApi
  WebSocketApiId:
    Value: !Ref TestWebSocketApi
  GraphqlApiId:
    Value: !GetAtt TestGraphqlApi.ApiId
  SchemaRegistryName:
    Value: !GetAtt TestSchemaRegistry.RegistryName
  GlueRegistryName:
    Value: !Ref TestGlueRegistry
  SnsTestTopicArn:
    Value: !Ref SpecDiscoveryTestTopic
  SnsTaggedTopicArn:
    Value: !Ref SpecDiscoveryTaggedTopic
  SnsFifoTopicArn:
    Value: !Ref SpecDiscoveryFifoTopic
  SnsSubscriptionTopicArn:
    Value: !Ref SpecDiscoverySubscriptionTopic
  SnsUrlTopicArn:
    Value: !Ref SpecDiscoveryUrlTopic