AWSTemplateFormatVersion: '2010-09-09'

Description: 'CloudFormation Template for VPC with AutoScalingGroup'

Resources:

# My VPC

  MyVPC:

    Type: 'AWS::EC2::VPC'

    Properties:

      CidrBlock: '172.16.0.0/16'

      EnableDnsSupport: true

      EnableDnsHostnames: true

      Tags:

        - Key: Name

          Value: MyVPC

# Public Subnet in AZ1

  PublicSubnet1A:

    Type: 'AWS::EC2::Subnet'

    Properties:

      VpcId: !Ref MyVPC

      CidrBlock: '172.16.1.0/24'

      AvailabilityZone: !Select [0, !GetAZs '']

      MapPublicIpOnLaunch: true

      Tags:

        - Key: Name

          Value: PublicSubnet1A

# App Private Subnet in AZ1

  AppPrivateSubnet1A:

    Type: 'AWS::EC2::Subnet'

    Properties:

      VpcId: !Ref MyVPC

      CidrBlock: '172.16.2.0/24'

      AvailabilityZone: !Select [0, !GetAZs '']

      Tags:

        - Key: Name

          Value: AppPrivateSubnet1A

# Data Private Subnet in AZ1

  DataPrivateSubnet1A:

    Type: 'AWS::EC2::Subnet'

    Properties:

      VpcId: !Ref MyVPC

      CidrBlock: '172.16.3.0/24'

      AvailabilityZone: !Select [0, !GetAZs '']

      Tags:

        - Key: Name

          Value: DataPrivateSubnet1A

# Public Subnet in AZ2

  PublicSubnet2B:

    Type: 'AWS::EC2::Subnet'

    Properties:

      VpcId: !Ref MyVPC

      CidrBlock: '172.16.4.0/24'

      AvailabilityZone: !Select [1, !GetAZs '']

      MapPublicIpOnLaunch: true

      Tags:

        - Key: Name

          Value: PublicSubnet2B

# App Private Subnet in AZ2

  AppPrivateSubnet2B:

    Type: 'AWS::EC2::Subnet'

    Properties:

      VpcId: !Ref MyVPC

      CidrBlock: '172.16.5.0/24'

      AvailabilityZone: !Select [1, !GetAZs '']

      Tags:

        - Key: Name

          Value: AppPrivateSubnet2B

# Data Private Subnet in AZ2

  DataPrivateSubnet2B:

    Type: 'AWS::EC2::Subnet'

    Properties:

      VpcId: !Ref MyVPC

      CidrBlock: '172.16.6.0/24'

      AvailabilityZone: !Select [1, !GetAZs '']

      Tags:

        - Key: Name

          Value: DataPrivateSubnet2B

# Internet Gateway IGW

  InternetGateway:

    Type: 'AWS::EC2::InternetGateway'

    Properties:

      Tags:

        - Key: Name

          Value: MyVPC-IGW

# Attach Gateway

  AttachGateway:

    Type: 'AWS::EC2::VPCGatewayAttachment'

    Properties:

      VpcId: !Ref MyVPC

      InternetGatewayId: !Ref InternetGateway

# Route Table

  PublicRouteTable:

    Type: 'AWS::EC2::RouteTable'

    Properties:

      VpcId: !Ref MyVPC

      Tags:

        - Key: Name

          Value: PublicRouteTable

# Public Route

  PublicRoute:

    Type: 'AWS::EC2::Route'

    DependsOn: AttachGateway

    Properties:

      RouteTableId: !Ref PublicRouteTable

      DestinationCidrBlock: '0.0.0.0/0'

      GatewayId: !Ref InternetGateway

# Route Table Association 1A

  PublicSubnet1ARouteTableAssociation:

    Type: 'AWS::EC2::SubnetRouteTableAssociation'

    Properties:

      SubnetId: !Ref PublicSubnet1A

      RouteTableId: !Ref PublicRouteTable

# Route Table Association 2B

  PublicSubnet2BRouteTableAssociation:

    Type: 'AWS::EC2::SubnetRouteTableAssociation'

    Properties:

      SubnetId: !Ref PublicSubnet2B

      RouteTableId: !Ref PublicRouteTable

# Web Server Security Group

  WebServerSecurityGroup:

    Type: 'AWS::EC2::SecurityGroup'

    Properties:

      GroupDescription: 'Enable HTTP Access'

      VpcId: !Ref MyVPC

      SecurityGroupIngress:

        - IpProtocol: tcp

          FromPort: 80

          ToPort: 80

          CidrIp: '0.0.0.0/0'

# Launch Config

  MyLaunchConfiguration:

    Type: 'AWS::EC2::LaunchTemplate'

    Properties:

      LaunchTemplateData:

        ImageId: !Sub '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2}}'

        InstanceType: 't2.micro'

        NetworkInterfaces:

          - DeviceIndex: 0

            SubnetId: !Ref PublicSubnet1A

            Groups:

              - !Ref WebServerSecurityGroup

        UserData:

          Fn::Base64: !Sub  |

            #!/bin/bash

            yum install -y httpd

            systemctl start httpd

            systemctl enable httpd

            echo "Hello from Auto Scaling Instance" > /var/www/html/index.html

# ASG

  MyAutoScalingGroup:

    Type: 'AWS::AutoScaling::AutoScalingGroup'

    Properties:

      LaunchTemplate:

        LaunchTemplateId: !Ref MyLaunchConfiguration

        Version: !GetAtt MyLaunchConfiguration.LatestVersionNumber

      MinSize: '1'

      MaxSize: '3'

      DesiredCapacity: '2'

      VPCZoneIdentifier:

        - !Ref PublicSubnet1A

        - !Ref PublicSubnet2B

      HealthCheckType: ELB

      HealthCheckGracePeriod: 300

      Tags:

        - Key: Environment

          Value: Production

          PropagateAtLaunch: true

# Alarm

  HighCPUAlarm:

    Type: 'AWS::CloudWatch::Alarm'

    Properties:

      AlarmDescription: 'Alarm when CPU exceeds 70%'

      MetricName: 'CPUUtilization'

      Namespace: 'AWS/EC2'

      Statistic: Average

      Period: '300'

      EvaluationPeriods: '1'

      Threshold: '70'

      ComparisonOperator: GreaterThanThreshold

      Dimensions:

        - Name: AutoScalingGroupName

          Value: !Ref MyAutoScalingGroup

      AlarmActions:

        - !Ref ScaleOutPolicy

# Scale Out Policy

  ScaleOutPolicy:

    Type: 'AWS::AutoScaling::ScalingPolicy'

    Properties:

      AutoScalingGroupName: !Ref MyAutoScalingGroup

      PolicyType: SimpleScaling

      ScalingAdjustment: '1'

      Cooldown: '300'

      AdjustmentType: ChangeInCapacity