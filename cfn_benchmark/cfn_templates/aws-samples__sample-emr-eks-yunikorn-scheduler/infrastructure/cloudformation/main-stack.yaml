AWSTemplateFormatVersion: "2010-09-09"
Description: "Main Stack for demonstrating Apache Yunikorn on EMR in EKS clusters."

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Project Artifacts"
        Parameters:
          - BucketName
      - Label:
          default: "Environment Configuration"
        Parameters:
          - ProjectName
      - Label:
          default: "Network Configuration"
        Parameters:
          - VpcCIDR
          - PublicSubnet1CIDR
          - PublicSubnet2CIDR
          - PrivateSubnet1CIDR
          - PrivateSubnet2CIDR
      - Label:
          default: "ECR Configuration"
        Parameters:
          - ECRRepoName
      - Label:
          default: "EKS Configuration"
        Parameters:
          - EMROnEKSClusterName
          - ClusterVersion
          - InstanceType

Parameters:
  # Bucket to project artifacts
  BucketName:
    Description: Name of the S3 bucket containing all project artifacts
    Type: String

  # Resource Tag
  ProjectName:
    Description: An environment name that is prefixed to resource names
    Type: String
    Default: "yunikorn-emr-eks"

  # Network
  VpcCIDR:
    Description: Please enter the IP range (CIDR notation) for this VPC
    Type: String
    Default: 10.192.0.0/16

  PublicSubnet1CIDR:
    Description: Please enter the IP range (CIDR notation) for the public subnet in the first Availability Zone
    Type: String
    Default: 10.192.10.0/24

  PublicSubnet2CIDR:
    Description: Please enter the IP range (CIDR notation) for the public subnet in the second Availability Zone
    Type: String
    Default: 10.192.11.0/24

  PrivateSubnet1CIDR:
    Description: Please enter the IP range (CIDR notation) for the private subnet in the first Availability Zone
    Type: String
    Default: 10.192.20.0/24

  PrivateSubnet2CIDR:
    Description: Please enter the IP range (CIDR notation) for the private subnet in the second Availability Zone
    Type: String
    Default: 10.192.21.0/24

  # ECR
  ECRRepoName:
    Type: String
    Default: "yunikorn"
    Description: Name of the ECR repository for Apache Yunikorn

  # EKS
  EMROnEKSClusterName:
    Description: Name of the EKS cluster
    Type: String
    Default: emr-on-eks-cluster

  ClusterVersion:
    Description: Kubernetes version for EKS clusters
    Type: String
    Default: "1.33"

  InstanceType:
    Description: EC2 instance type for the EKS worker nodes
    Type: String
    Default: m5.2xlarge

Resources:
  # Security Group for Bastion Host - Created here to avoid circular dependencies
  BastionHostSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W5
            reason: "Limited egress rules are defined for specific services needed by the bastion host"
    Properties:
      GroupDescription: Security group for Bastion Host (SSM access only)
      VpcId: !GetAtt NetworkStack.Outputs.VPC
      SecurityGroupIngress: []  # No inbound rules needed for SSM access
      SecurityGroupEgress:
        - Description: Allow HTTPS outbound to AWS services
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0  # AWS services
        - Description: Allow HTTP outbound for package repositories
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0  # Package repositories
        - Description: Allow DNS resolution
          IpProtocol: udp
          FromPort: 53
          ToPort: 53
          CidrIp: 0.0.0.0/0
        - Description: Allow NTP for time synchronization
          IpProtocol: udp
          FromPort: 123
          ToPort: 123
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-bastion-host-sg

  # IAM Role for Bastion Host - Created here to avoid circular dependencies
  BastionHostRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W11
            reason: "Wildcard resource is required for EKS cluster access across all clusters"
      cdk_nag:
        rules_to_suppress:
          - id: AwsSolutions-IAM4
            reason: "AWS managed policies are required for bastion host to access SSM and EKS"
          - id: AwsSolutions-IAM5
            reason: "Limited wildcard permissions are required for the eks:ListClusters action which doesn't support resource-level permissions"
      checkov:
        skip:
          - id: CKV_AWS_111
            reason: "Write access to EKS cluster configuration is required for the bastion host to manage EKS clusters"
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy
        - arn:aws:iam::aws:policy/AmazonEKSServicePolicy
        - arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess
      Policies:
        - PolicyName: EKSClusterAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Allow access to the specific EKS cluster
              - Effect: Allow
                Action:
                  - eks:DescribeCluster
                  - eks:UpdateClusterConfig
                  - eks:AccessKubernetesApi
                  - eks:ListAccessEntries
                  - eks:DescribeAccessEntry
                  - eks:TagResource
                  - eks:UntagResource
                  - eks:ListTagsForResource
                Resource: !Sub "arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:cluster/${EMROnEKSClusterName}"
              # Global EKS operations that require wildcard resource
              - Effect: Allow
                Action:
                  - eks:ListClusters
                  - eks:DescribeClusterVersions
                  - eks:DescribeAddonVersions
                  - eks:ListAddons
                  - eks:DescribeAddon
                Resource: "*"
        - PolicyName: IAMServiceLinkedRoleAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Allow creating service-linked roles for EMR Containers
              - Effect: Allow
                Action:
                  - iam:CreateServiceLinkedRole
                Resource: "arn:aws:iam::*:role/aws-service-role/emr-containers.amazonaws.com/AWSServiceRoleForAmazonEMRContainers"
                Condition:
                  StringEquals:
                    "iam:AWSServiceName": "emr-containers.amazonaws.com"
              # Allow getting IAM roles for verification
              - Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:CreateRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:TagRole
                  - iam:PassRole
                Resource:
                  - "arn:aws:iam::*:role/aws-service-role/emr-containers.amazonaws.com/AWSServiceRoleForAmazonEMRContainers"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/${ProjectName}-*"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/EMRContainers-JobExecutionRole"
        - PolicyName: CloudFormationAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Allow CloudFormation operations for eksctl IRSA management
              - Effect: Allow
                Action:
                  - cloudformation:ListStacks
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackResources
                  - cloudformation:DescribeStackEvents
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:GetTemplate
                Resource:
                  - !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/eksctl-${EMROnEKSClusterName}-*/*"
                  - !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/eksctl-*/*"
              # ListStacks requires wildcard resource
              - Effect: Allow
                Action:
                  - cloudformation:ListStacks
                Resource: "*"
        - PolicyName: ECRAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Allow ECR operations for Spark Operator container images
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:DescribeRepositories
                  - ecr:ListImages
                  - ecr:DescribeImages
                Resource: "*"
        - PolicyName: EMRContainersAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Allow EMR Containers virtual cluster operations
              - Effect: Allow
                Action:
                  - emr-containers:CreateVirtualCluster
                  - emr-containers:DescribeVirtualCluster
                  - emr-containers:ListVirtualClusters
                  - emr-containers:DeleteVirtualCluster
                  - emr-containers:TagResource
                  - emr-containers:UntagResource
                  - emr-containers:ListTagsForResource
                Resource:
                  - !Sub "arn:aws:emr-containers:${AWS::Region}:${AWS::AccountId}:/virtualclusters/*"
                  - !Sub "arn:aws:emr-containers:${AWS::Region}:${AWS::AccountId}:virtualCluster/*"
              # Allow OIDC provider operations for EKS
              - Effect: Allow
                Action:
                  - iam:GetOpenIDConnectProvider
                  - iam:CreateOpenIDConnectProvider
                  - iam:TagOpenIDConnectProvider
                  - iam:ListOpenIDConnectProviders
                Resource:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/oidc.eks.${AWS::Region}.amazonaws.com/*"
      Path: /
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-bastion-host-role

  # Instance Profile for Bastion Host
  BastionHostInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: /
      Roles:
        - !Ref BastionHostRole

  NetworkStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub https://${BucketName}.s3.${AWS::Region}.amazonaws.com/cloudformation/network-stack.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        VpcCIDR: !Ref VpcCIDR
        PublicSubnet1CIDR: !Ref PublicSubnet1CIDR
        PublicSubnet2CIDR: !Ref PublicSubnet2CIDR
        PrivateSubnet1CIDR: !Ref PrivateSubnet1CIDR
        PrivateSubnet2CIDR: !Ref PrivateSubnet2CIDR
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete

  ECRStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub https://${BucketName}.s3.${AWS::Region}.amazonaws.com/cloudformation/ecr-stack.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        ECRRepoName: !Ref ECRRepoName
        CommonKMSKeyArn: !GetAtt NetworkStack.Outputs.CommonKMSKeyArn
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete

  EKSStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - S3Stack # NetworkStack - Dependency already enforced
    Properties:
      TemplateURL: !Sub https://${BucketName}.s3.${AWS::Region}.amazonaws.com/cloudformation/eks-stack.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        VPC: !GetAtt NetworkStack.Outputs.VPC
        PrivateSubnets: !GetAtt NetworkStack.Outputs.PrivateSubnets
        InstanceType: !Ref InstanceType
        EMROnEKSClusterName: !Ref EMROnEKSClusterName
        ClusterVersion: !Ref ClusterVersion
        BastionHostSecurityGroupParam: !Ref BastionHostSecurityGroup
        BastionHostRoleArn: !GetAtt BastionHostRole.Arn
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete

  S3Stack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub https://${BucketName}.s3.${AWS::Region}.amazonaws.com/cloudformation/s3-stack.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        BucketName: !Ref BucketName
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete

  EMROnEKSRolesStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - S3Stack # EKSStack - Dependency already enforced
    Properties:
      TemplateURL: !Sub https://${BucketName}.s3.${AWS::Region}.amazonaws.com/cloudformation/emr-on-eks-roles-stack.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        CreateEMRContainersServiceLinkedRole: "false"
        CommonKMSKeyArn: !GetAtt NetworkStack.Outputs.CommonKMSKeyArn
        BucketName: !Ref BucketName
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete

  BastionHostStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub https://${BucketName}.s3.${AWS::Region}.amazonaws.com/cloudformation/ec2-stack.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        VPC: !GetAtt NetworkStack.Outputs.VPC
        PrivateSubnet: !Select [0, !Split [",", !GetAtt NetworkStack.Outputs.PrivateSubnets]]
        BastionInstanceType: t3.micro
        EKSClusterName: !Ref EMROnEKSClusterName
        EKSSecurityGroup: !GetAtt EKSStack.Outputs.EMROnEKSClusterSecurityGroup
        VPCEndpointSecurityGroup: !GetAtt NetworkStack.Outputs.VPCEndpointSecurityGroup
        BastionHostSecurityGroupId: !Ref BastionHostSecurityGroup
        BastionHostInstanceProfile: !Ref BastionHostInstanceProfile
        BucketName: !Ref BucketName
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete

Outputs:
  VPC:
    Description: A reference to the created VPC
    Value: !GetAtt NetworkStack.Outputs.VPC

  PublicSubnets:
    Description: A list of the public subnets
    Value: !GetAtt NetworkStack.Outputs.PublicSubnets

  PrivateSubnets:
    Description: A list of the private subnets
    Value: !GetAtt NetworkStack.Outputs.PrivateSubnets

  ECRRepositoryName:
    Description: Name of the ECR repository for Apache Yunikorn Image
    Value: !GetAtt ECRStack.Outputs.YunikornRepositoryName

  ECRRepositoryUri:
    Description: URI of the ECR repository for Apache Yunikorn Image
    Value: !GetAtt ECRStack.Outputs.YunikornRepositoryUri

  BucketName:
    Description: Name of the S3 bucket for Apache Yunikorn and EMR on EKS files
    Value: !GetAtt S3Stack.Outputs.BucketName

  BucketArn:
    Description: ARN of the S3 bucket for Apache Yunikorn and EMR on EKS files
    Value: !GetAtt S3Stack.Outputs.BucketArn

  EMROnEKSClusterName:
    Description: Name of the EMR On EKS cluster
    Value: !GetAtt EKSStack.Outputs.EMROnEKSClusterName

  EMROnEKSClusterEndpoint:
    Description: API server endpoint of the EMR On EKS cluster
    Value: !GetAtt EKSStack.Outputs.EMROnEKSClusterEndpoint

  EMROnEKClusterSecurityGroup:
    Description: Security Group ID for the EMR on EKS cluster
    Value: !GetAtt EKSStack.Outputs.EMROnEKSClusterSecurityGroup

  BastionHostSecurityGroupId:
    Description: Security Group ID for the Bastion Host
    Value: !Ref BastionHostSecurityGroup

  BastionHostRoleArn:
    Description: ARN of the Bastion Host IAM Role
    Value: !GetAtt BastionHostRole.Arn

  BastionHostId:
    Description: ID of the Bastion Host
    Value: !GetAtt BastionHostStack.Outputs.BastionHostId

  BastionHostPrivateIP:
    Description: Private IP address of the Bastion Host
    Value: !GetAtt BastionHostStack.Outputs.BastionHostPrivateIP

  SSMConnectionCommand:
    Description: Command to connect to the Bastion Host using SSM
    Value: !GetAtt BastionHostStack.Outputs.SSMConnectionCommand

  EKSAccessCommand:
    Description: Command to verify EKS cluster access from the Bastion Host
    Value: !GetAtt BastionHostStack.Outputs.EKSAccessCommand