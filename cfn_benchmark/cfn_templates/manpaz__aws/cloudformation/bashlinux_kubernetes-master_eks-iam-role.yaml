---
# Bashlinux::Kubernetes Master::EKS::IAM Role
#
#   Cloudformation template to deploy the IAM role
#   for the Kubernetes master on EKS
#
#   Manuel F Martinez
#   Bashlinux
#   Los Angeles, CA
#
AWSTemplateFormatVersion: "2010-09-09"
Description: EKS Kubernetes Master IAM roles template

###############################################################################
Parameters:

  Environment:
    Description: Environment this IAM role is deployed to
    Type: String
    MinLength: "1"
    MaxLength: "20"
    Default: staging
    AllowedValues: [ "prod", "staging" ]
    ConstraintDescription: Environment name can only contain "prod" or "staging".

  Organization:
    Description: Organization or Customer name
    Type: String
    MinLength: "1"
    MaxLength: "32"
    Default: bashlinux
    AllowedPattern: "[a-zA-Z0-9\\-]*"
    ConstraintDescription: >
      Name of the organization must contains only letters, numbers and hyphens.

###############################################################################
Resources:

  KubernetesMasterEksRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - eks.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      RoleName: !Sub "${Organization}-${Environment}-kubernetes-master-eks-role"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy
        - arn:aws:iam::aws:policy/AmazonEKSServicePolicy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
      Tags:
      - Key: Name
        Value: !Sub "${Organization}-${Environment}-kubernetes-master-eks-role"
      - Key: bashlinux:network-visibility
        Value: private
      - Key: bashlinux:organization-name
        Value: !Ref Organization
      - Key: bashlinux:environment-name
        Value: !Ref Environment
      - Key: bashlinux:application-role
        Value: kubernetes-master
      - Key: bashlinux:application-id
        Value: !Ref AWS::StackName

  KubernetesMasterEksInstanceProfile:
    Type: "AWS::IAM::InstanceProfile"
    DependsOn: KubernetesMasterEksRole
    Properties:
      InstanceProfileName: !Sub "${Organization}-${Environment}-kubernetes-master-eks-role"
      Path: "/"
      Roles:
        - !Sub "${Organization}-${Environment}-kubernetes-master-eks-role"

  # IAM Policies --------------------------------------------------------------
  AlbIngressControllerPolicy:
    Type: "AWS::IAM::Policy"
    Properties:
      PolicyName: !Sub "${Organization}-${Environment}-alb-ingress-controller-policy"
      PolicyDocument:
        "Fn::Transform":
          Name: AWS::Include
          Parameters:
            Location: "s3://bashlinux-devops/iam-policies/iam_policy_bashlinux_alb_ingress_contoller.json"
      Roles: [ !Ref KubernetesMasterEksRole ]

###############################################################################
Outputs:

  KubernetesMasterEksRoleArn:
    Description: The ARN of the role to use for Kubernetes master servers
    Value: !GetAtt KubernetesMasterEksRole.Arn
    Export:
      Name: !Sub "${Organization}-${Environment}-master-KubernetesEksRoleArn"

  KubernetesMasterEksRoleId:
    Description: The ID of the IAM role to use for Kubernetes master servers
    Value: !GetAtt KubernetesMasterEksRole.RoleId
    Export:
      Name: !Sub "${Organization}-${Environment}-master-KubernetesEksRoleId"

  KubernetesMasterEksRoleName:
    Description: The IAM role to use for Kubernetes master servers
    Value: !Ref KubernetesMasterEksRole
    Export:
      Name: !Sub "${Organization}-${Environment}-master-KubernetesEksRoleName"

  KubernetesMasterEksInstanceProfileArn:
    Description: The ARN of the instance profile for Kubernetes master servers
    Value: !GetAtt KubernetesMasterEksInstanceProfile.Arn
    Export:
      Name: !Sub "${Organization}-${Environment}-master-KubernetesMasterEksInstanceProfileArn"