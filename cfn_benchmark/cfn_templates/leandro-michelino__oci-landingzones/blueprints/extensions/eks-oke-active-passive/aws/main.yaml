AWSTemplateFormatVersion: '2010-09-09'
Description: AWS EKS secondary cluster for OCI-primary EKS + OKE active-passive blueprint.

Parameters:
  EKSClusterName:
    Type: String
    Default: eks-oci-secondary
  NodeGroupName:
    Type: String
    Default: system
  KubernetesVersion:
    Type: String
    Default: '1.36'
  NodeInstanceType:
    Type: String
    Default: t3.medium
  NodeCount:
    Type: Number
    Default: 2
  VpcCidr:
    Type: String
    Default: 10.64.0.0/16
  SubnetOneCidr:
    Type: String
    Default: 10.64.10.0/24
  SubnetTwoCidr:
    Type: String
    Default: 10.64.20.0/24
  AllowedIngressCidr:
    Type: String
    Default: 10.0.0.0/8

Resources:
  EksVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-vpc-eks-secondary'

  EksFlowLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      KmsKeyId: !GetAtt EksSecretsKey.Arn
      RetentionInDays: 30

  EksFlowLogRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: vpc-flow-logs.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: write-vpc-flow-logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                  - logs:PutLogEvents
                Resource: !Sub '${EksFlowLogGroup.Arn}:*'

  EksVpcFlowLog:
    Type: AWS::EC2::FlowLog
    Properties:
      DeliverLogsPermissionArn: !GetAtt EksFlowLogRole.Arn
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Ref EksFlowLogGroup
      ResourceId: !Ref EksVpc
      ResourceType: VPC
      TrafficType: ALL

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-igw-eks-secondary'

  VpcIgwAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref EksVpc
      InternetGatewayId: !Ref InternetGateway

  EksRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref EksVpc
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-rt-eks-secondary'

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcIgwAttachment
    Properties:
      RouteTableId: !Ref EksRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  EksSubnetOne:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref EksVpc
      CidrBlock: !Ref SubnetOneCidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-sn-eks-secondary-a'

  EksSubnetTwo:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref EksVpc
      CidrBlock: !Ref SubnetTwoCidr
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-sn-eks-secondary-b'

  EksSubnetRouteAssociationOne:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref EksSubnetOne
      RouteTableId: !Ref EksRouteTable

  EksSubnetRouteAssociationTwo:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref EksSubnetTwo
      RouteTableId: !Ref EksRouteTable

  EksSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for EKS secondary cluster traffic.
      VpcId: !Ref EksVpc
      SecurityGroupIngress:
        - Description: Allow Kubernetes API access from the approved ingress CIDR.
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref AllowedIngressCidr
      SecurityGroupEgress:
        - Description: Allow HTTPS egress to private platform endpoints inside the VPC.
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCidr
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-sg-eks-secondary'

  EksSecretsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub '${AWS::StackName} EKS secret encryption key'
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableAccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: kms:*
            Resource: '*'
          - Sid: AllowCloudWatchLogsUse
            Effect: Allow
            Principal:
              Service: !Sub 'logs.${AWS::Region}.amazonaws.com'
            Action:
              - kms:Decrypt
              - kms:DescribeKey
              - kms:Encrypt
              - kms:GenerateDataKey
              - kms:ReEncrypt*
            Resource: '*'

  EksClusterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy

  EksNodeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly

  EksCluster:
    Type: AWS::EKS::Cluster
    Properties:
      Name: !Ref EKSClusterName
      Version: !Ref KubernetesVersion
      RoleArn: !GetAtt EksClusterRole.Arn
      ResourcesVpcConfig:
        EndpointPublicAccess: false
        EndpointPrivateAccess: true
        SecurityGroupIds:
          - !Ref EksSecurityGroup
        SubnetIds:
          - !Ref EksSubnetOne
          - !Ref EksSubnetTwo
      EncryptionConfig:
        - Provider:
            KeyArn: !GetAtt EksSecretsKey.Arn
          Resources:
            - secrets
      Logging:
        ClusterLogging:
          EnabledTypes:
            - Type: api
            - Type: audit
            - Type: authenticator
            - Type: controllerManager
            - Type: scheduler

  EksNodeGroup:
    Type: AWS::EKS::Nodegroup
    DependsOn: EksCluster
    Properties:
      ClusterName: !Ref EKSClusterName
      NodegroupName: !Ref NodeGroupName
      NodeRole: !GetAtt EksNodeRole.Arn
      Subnets:
        - !Ref EksSubnetOne
        - !Ref EksSubnetTwo
      AmiType: AL2023_x86_64_STANDARD
      CapacityType: ON_DEMAND
      InstanceTypes:
        - !Ref NodeInstanceType
      ScalingConfig:
        DesiredSize: !Ref NodeCount
        MinSize: 1
        MaxSize: 4

Outputs:
  EksClusterArn:
    Description: EKS cluster ARN.
    Value: !GetAtt EksCluster.Arn
  EksClusterName:
    Description: EKS cluster name.
    Value: !Ref EKSClusterName
  EksClusterEndpoint:
    Description: EKS API endpoint URL.
    Value: !GetAtt EksCluster.Endpoint
  EksNodeGroupArn:
    Description: EKS node group ARN.
    Value: !GetAtt EksNodeGroup.Arn
  EksVpcId:
    Description: EKS VPC ID.
    Value: !Ref EksVpc
  EksSubnetOneId:
    Description: EKS subnet A ID.
    Value: !Ref EksSubnetOne
  EksSubnetTwoId:
    Description: EKS subnet B ID.
    Value: !Ref EksSubnetTwo
  EksRouteTableId:
    Description: EKS route table ID.
    Value: !Ref EksRouteTable
  EksSecurityGroupId:
    Description: EKS security group ID.
    Value: !Ref EksSecurityGroup