Description: Gateway Endpoint para as Camadas de Usuarios e Nevoa

# Original template had three independent self-containment bugs:
#  1. S3GatewayEndpointUsers hardcoded a VPC/route-table ID belonging to the
#     original author's own account (vpc-0dc525f431142fe3f), unreachable
#     from any other account.
#  2. S3GatewayEndpointUsers2/S3GatewayEndpointFog and all 6 Interface
#     endpoints imported VpcId/VpcUId/rtPrivId/rtPrivUId via Fn::ImportValue
#     from sibling "Users"/"Fog" VPC stacks that were never part of this
#     scenario.
#  3. All 6 Interface-type VPCEndpoints were missing the required
#     SubnetIds property entirely (CFN accepts this at template-validation
#     time but CreateVpcEndpoint itself rejects it).
# Fixed by creating two small self-contained VPCs (Users, Fog) with their
# own subnet/route table, and wiring every endpoint at a local resource
# instead of a hardcoded ID or a cross-stack import. The original
# S3GatewayEndpointUsers (hardcoded VPC) was dropped rather than also
# pointed at UsersVpc: AWS only allows one Gateway endpoint per service per
# VPC, and S3GatewayEndpointUsers2 already provides the S3 gateway endpoint
# for the Users VPC.
Resources:
  UsersVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.50.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
  UsersSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref UsersVpc
      CidrBlock: 10.50.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
  UsersRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref UsersVpc
  UsersSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref UsersSubnet
      RouteTableId: !Ref UsersRouteTable

  FogVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.60.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
  FogSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref FogVpc
      CidrBlock: 10.60.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
  FogRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref FogVpc
  FogSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref FogSubnet
      RouteTableId: !Ref FogRouteTable

  S3GatewayEndpointUsers2:
    Type: 'AWS::EC2::VPCEndpoint'
    Properties:
      VpcEndpointType: 'Gateway'
      VpcId: !Ref UsersVpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal: '*'
            Action:
              - 's3:*'
            Resource:
              - "*"
      RouteTableIds:
        - !Ref UsersRouteTable

  S3GatewayEndpointFog:
    Type: 'AWS::EC2::VPCEndpoint'
    Properties:
      VpcEndpointType: 'Gateway'
      VpcId: !Ref FogVpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal: '*'
            Action:
              - 's3:*'
            Resource:
              - "*"
      RouteTableIds:
        - !Ref FogRouteTable

  SecretsManagerGatewayEndpointFog:
    Type: 'AWS::EC2::VPCEndpoint'
    Properties:
      VpcEndpointType: 'Interface'
      VpcId: !Ref FogVpc
      SubnetIds:
        - !Ref FogSubnet
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.secretsmanager'
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal: '*'
            Action:
              - 'secretsmanager:*'
            Resource:
              - "*"

  KmsGatewayEndpointUsers:
    Type: 'AWS::EC2::VPCEndpoint'
    Properties:
      VpcEndpointType: 'Interface'
      VpcId: !Ref UsersVpc
      SubnetIds:
        - !Ref UsersSubnet
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.kms'
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal: '*'
            Action:
              - 'kms:GenerateDataKey'
            Resource:
              - "*"

  KmsGatewayEndpointFog:
    Type: 'AWS::EC2::VPCEndpoint'
    Properties:
      VpcEndpointType: 'Interface'
      VpcId: !Ref FogVpc
      SubnetIds:
        - !Ref FogSubnet
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.kms'
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal: '*'
            Action:
              - 'kms:GenerateDataKey'
              - 'kafka:ListScramSecrets'
            Resource:
              - "*"

  EventsGatewayEndpointFog:
    Type: 'AWS::EC2::VPCEndpoint'
    Properties:
      VpcEndpointType: 'Interface'
      VpcId: !Ref FogVpc
      SubnetIds:
        - !Ref FogSubnet
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.events'
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal: '*'
            Action:
              - 'events:*'
              - 'pipes:*'
            Resource:
              - "*"

  StsGatewayEndpointFog:
    Type: 'AWS::EC2::VPCEndpoint'
    Properties:
      VpcEndpointType: 'Interface'
      VpcId: !Ref FogVpc
      SubnetIds:
        - !Ref FogSubnet
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.sts'
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal: '*'
            Action:
              - '*'
            Resource:
              - "*"
  LambdaGatewayEndpointFog:
    Type: 'AWS::EC2::VPCEndpoint'
    Properties:
      VpcEndpointType: 'Interface'
      VpcId: !Ref FogVpc
      SubnetIds:
        - !Ref FogSubnet
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.lambda'
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal: '*'
            Action:
              - '*'
            Resource:
              - "*"
