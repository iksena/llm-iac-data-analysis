AWSTemplateFormatVersion: '2010-09-09'
Description: |
  S3 bucket definitions for Video Codec Converter.
  Includes Upload bucket for source videos and Output bucket for converted videos.
  T011: S3 bucket definitions for Phase 2 setup.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Environment name for resource naming

  UploadBucketName:
    Type: String
    Default: ''
    Description: Optional custom upload bucket name. If not provided, uses 'codec-converter-uploads-{Environment}-{AccountId}'

  OutputBucketName:
    Type: String
    Default: ''
    Description: Optional custom output bucket name. If not provided, uses 'codec-converter-outputs-{Environment}-{AccountId}'

  UploadExpirationDays:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 365
    Description: Number of days before uploaded files expire

  OutputExpirationDays:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 365
    Description: Number of days before output files expire

Conditions:
  UseCustomUploadBucketName: !Not [!Equals [!Ref UploadBucketName, '']]
  UseCustomOutputBucketName: !Not [!Equals [!Ref OutputBucketName, '']]

Resources:
  # ============================================================================
  # Upload Bucket - stores source video files uploaded by users
  # ============================================================================
  UploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !If
        - UseCustomUploadBucketName
        - !Ref UploadBucketName
        - !Sub 'codec-converter-uploads-${Environment}-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - PUT
              - POST
            AllowedOrigins:
              - '*'
            ExposedHeaders:
              - ETag
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          - Id: DeleteUploadedFilesAfterExpiration
            Status: Enabled
            ExpirationInDays: !Ref UploadExpirationDays
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      Tags:
        - Key: Project
          Value: codec-converter
        - Key: Environment
          Value: !Ref Environment
        - Key: Purpose
          Value: UploadStorage
        - Key: ManagedBy
          Value: CloudFormation

  # ============================================================================
  # Output Bucket - stores converted video files
  # ============================================================================
  OutputBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !If
        - UseCustomOutputBucketName
        - !Ref OutputBucketName
        - !Sub 'codec-converter-outputs-${Environment}-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOutputFilesAfterExpiration
            Status: Enabled
            ExpirationInDays: !Ref OutputExpirationDays
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      Tags:
        - Key: Project
          Value: codec-converter
        - Key: Environment
          Value: !Ref Environment
        - Key: Purpose
          Value: OutputStorage
        - Key: ManagedBy
          Value: CloudFormation

Outputs:
  UploadBucketName:
    Description: Name of the S3 bucket for video uploads
    Value: !Ref UploadBucket
    Export:
      Name: !Sub '${AWS::StackName}-UploadBucketName'

  UploadBucketArn:
    Description: ARN of the S3 bucket for video uploads
    Value: !GetAtt UploadBucket.Arn
    Export:
      Name: !Sub '${AWS::StackName}-UploadBucketArn'

  UploadBucketDomainName:
    Description: Domain name of the S3 bucket for video uploads
    Value: !GetAtt UploadBucket.DomainName
    Export:
      Name: !Sub '${AWS::StackName}-UploadBucketDomainName'

  OutputBucketName:
    Description: Name of the S3 bucket for converted video outputs
    Value: !Ref OutputBucket
    Export:
      Name: !Sub '${AWS::StackName}-OutputBucketName'

  OutputBucketArn:
    Description: ARN of the S3 bucket for converted video outputs
    Value: !GetAtt OutputBucket.Arn
    Export:
      Name: !Sub '${AWS::StackName}-OutputBucketArn'

  OutputBucketDomainName:
    Description: Domain name of the S3 bucket for converted video outputs
    Value: !GetAtt OutputBucket.DomainName
    Export:
      Name: !Sub '${AWS::StackName}-OutputBucketDomainName'