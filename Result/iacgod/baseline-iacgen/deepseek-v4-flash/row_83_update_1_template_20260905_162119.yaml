AWSTemplateFormatVersion: "2010-09-09"
Description: "CloudFormation template for Cognito authentication layer with Lex bot integration"
Parameters:
  IdentityPoolName:
    Type: String
    Default: "identity pool"
    Description: "Name for the Cognito identity pool"
  LexV1BotName:
    Type: String
    Default: "OrderFlowers"
    Description: "Name of the Lex V1 bot"
  LexV2BotId:
    Type: String
    Default: ""
    Description: "ID of the Lex V2 bot (leave empty to use Lex V1)"
  LexV2BotAliasId:
    Type: String
    Default: ""
    Description: "Alias ID of the Lex V2 bot (required if LexV2BotId is provided)"
  ForceCognitoLogin:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "When true, denies unauthenticated Lex and API actions"
  ShouldEnableLiveChat:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "When true, adds execute-api:Invoke permission for live chat"
  LiveChatApiEndpointArn:
    Type: String
    Default: ""
    Description: "ARN of the live chat API Gateway endpoint (e.g., arn:aws:execute-api:region:account:api-id)"
Conditions:
  HasLexV2BotId: !Not
    - !Equals
      - !Ref LexV2BotId
      - ""
  HasLexV2BotAliasId: !Not
    - !Equals
      - !Ref LexV2BotAliasId
      - ""
  LexV2Mode: !And
    - !Condition HasLexV2BotId
    - !Condition HasLexV2BotAliasId
  LexV1Mode: !Not
    - !Condition HasLexV2BotId
  ForceLogin: !Equals
    - !Ref ForceCognitoLogin
    - "true"
  NotForceLogin: !Equals
    - !Ref ForceCognitoLogin
    - "false"
  EnableLiveChat: !And
    - !Equals
      - !Ref ShouldEnableLiveChat
      - "true"
    - !Not
      - !Equals
        - !Ref LiveChatApiEndpointArn
        - ""
  LexV2ModeAndNotForceLogin: !And
    - !Condition LexV2Mode
    - !Condition NotForceLogin
  LexV1ModeAndNotForceLogin: !And
    - !Condition LexV1Mode
    - !Condition NotForceLogin
  LiveChatAndNotForceLogin: !And
    - !Condition EnableLiveChat
    - !Condition NotForceLogin
  ForceLoginAndLiveChat: !And
    - !Condition ForceLogin
    - !Condition EnableLiveChat
Resources:
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-user-pool"
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: given_name
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: family_name
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: preferred_username
          AttributeDataType: String
          Required: true
          Mutable: true
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${AWS::StackName}-user-pool-client"
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      SupportedIdentityProviders:
        - COGNITO
  CognitoIdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      IdentityPoolName: !Ref IdentityPoolName
      AllowUnauthenticatedIdentities: true
      AllowClassicFlow: true
      CognitoIdentityProviders:
        - ProviderName: !Sub "cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}"
          ClientId: !Ref CognitoUserPoolClient
          ServerSideTokenCheck: true
  AuthenticatedRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-authenticated-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "cognito-identity.amazonaws.com:aud": !Ref CognitoIdentityPool
      Policies:
        - PolicyName: !Sub "${AWS::StackName}-authenticated-policy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - !If
                - LexV2Mode
                - Effect: Allow
                  Action:
                    - lex:RecognizeText
                    - lex:RecognizeUtterance
                  Resource: !Sub "arn:aws:lex:${AWS::Region}:${AWS::AccountId}:bot-alias/${LexV2BotId}/${LexV2BotAliasId}"
                - Effect: Allow
                  Action:
                    - lex:PostText
                    - lex:PostContent
                  Resource: !Sub "arn:aws:lex:${AWS::Region}:${AWS::AccountId}:bot:${LexV1BotName}:*"
              - Effect: Allow
                Action: polly:SynthesizeSpeech
                Resource: "*"
              - !If
                - EnableLiveChat
                - Effect: Allow
                  Action: execute-api:Invoke
                  Resource: !Sub "${LiveChatApiEndpointArn}/*/*/*"
                - !Ref "AWS::NoValue"
  UnauthenticatedRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-unauthenticated-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "cognito-identity.amazonaws.com:aud": !Ref CognitoIdentityPool
      Policies:
        - PolicyName: !Sub "${AWS::StackName}-unauthenticated-policy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - !If
                - ForceLogin
                - Effect: Deny
                  Action:
                    - lex:PostText
                    - lex:PostContent
                    - lex:RecognizeText
                    - lex:RecognizeUtterance
                  Resource: "*"
                - !Ref "AWS::NoValue"
              - !If
                - ForceLoginAndLiveChat
                - Effect: Deny
                  Action: execute-api