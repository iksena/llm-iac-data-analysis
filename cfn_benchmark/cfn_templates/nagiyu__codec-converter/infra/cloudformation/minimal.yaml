AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Minimal CloudFormation template for Video Codec Converter.
  Includes S3 buckets for uploads/outputs and DynamoDB table for entity storage.
  T008: Minimal resources for Phase 1 setup.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Environment name for resource naming

Resources:
  # ============================================================================
  # S3 Buckets
  # ============================================================================

  # Upload Bucket - stores source video files uploaded by users
  UploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'codec-converter-uploads-${Environment}-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - PUT
              - POST
            AllowedOrigins:
              - '*'
            ExposedHeaders:
              - ETag
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          - Id: DeleteUploadedFilesAfterExpiration
            Status: Enabled
            ExpirationInDays: 7
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      Tags:
        - Key: Project
          Value: CodecConverter
        - Key: Environment
          Value: !Ref Environment
        - Key: Purpose
          Value: UploadStorage

  # Output Bucket - stores converted video files
  OutputBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'codec-converter-outputs-${Environment}-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOutputFilesAfterExpiration
            Status: Enabled
            ExpirationInDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      Tags:
        - Key: Project
          Value: CodecConverter
        - Key: Environment
          Value: !Ref Environment
        - Key: Purpose
          Value: OutputStorage

  # ============================================================================
  # DynamoDB Table
  # ============================================================================

  # Entities Table - single table design for VideoFile, ConversionJob, and Codec
  EntitiesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'Codec-Converter-Entities-${Environment}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: DataType
          AttributeType: S
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: DataType
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: codec-converter
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

Outputs:
  UploadBucketName:
    Description: Name of the S3 bucket for video uploads
    Value: !Ref UploadBucket
    Export:
      Name: !Sub '${AWS::StackName}-UploadBucketName'

  UploadBucketArn:
    Description: ARN of the S3 bucket for video uploads
    Value: !GetAtt UploadBucket.Arn
    Export:
      Name: !Sub '${AWS::StackName}-UploadBucketArn'

  OutputBucketName:
    Description: Name of the S3 bucket for converted video outputs
    Value: !Ref OutputBucket
    Export:
      Name: !Sub '${AWS::StackName}-OutputBucketName'

  OutputBucketArn:
    Description: ARN of the S3 bucket for converted video outputs
    Value: !GetAtt OutputBucket.Arn
    Export:
      Name: !Sub '${AWS::StackName}-OutputBucketArn'

  EntitiesTableName:
    Description: Name of the DynamoDB Entities table
    Value: !Ref EntitiesTable
    Export:
      Name: !Sub '${AWS::StackName}-EntitiesTableName'

  EntitiesTableArn:
    Description: ARN of the DynamoDB Entities table
    Value: !GetAtt EntitiesTable.Arn
    Export:
      Name: !Sub '${AWS::StackName}-EntitiesTableArn'