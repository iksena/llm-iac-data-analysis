  ###############################
  # Event Bridge IAM Role
  ###############################
  EmailApiGatewayS3Policy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - s3:ListBucket
            Resource:
              - !GetAtt RecipientsBucket.Arn
              - !Sub "${RecipientsBucket.Arn}/*"

  CSVProcessorPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:DeleteObject
            Resource: !Sub "${RecipientsBucket.Arn}/*"
          - Effect: Allow
            Action:
              - dynamodb:CreateTable
              - dynamodb:DeleteTable
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DescribeTable
            # Recipient tables are dynamically named with recipients- prefix
            Resource:
              - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/recipients-*"
          - Effect: Allow
            Action:
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:Scan
            Resource: !GetAtt RecipientTablesRegistry.Arn
          - Effect: Allow
            Action:
              - sqs:SendMessage
            Resource: !GetAtt LambdaDeadLetterQueue.Arn
          - Effect: Allow
            Action:
              - kms:Decrypt
              - kms:DescribeKey
              - kms:Encrypt
              - kms:GenerateDataKey
              - kms:CreateGrant
            Resource: !GetAtt DynamoDBKMSKey.Arn

  EventBridgeToStepFunctionsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref EventBridgeStepFunctionsPolicy

  EmailApiGatewayS3Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref EmailApiGatewayS3Policy

  # Email Queue for email messages
  EmailQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-email-queue
      VisibilityTimeout: 45
      KmsMasterKeyId: !Ref LambdaKMSKeyArn
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt EmailDeadLetterQueue.Arn
        maxReceiveCount: 5

  # Dead Letter Queue for failed email messages
  EmailDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-email-dlq
      KmsMasterKeyId: !Ref LambdaKMSKeyArn
      MessageRetentionPeriod: 1209600  # 14 days

  # Lambda Dead Letter Queue for invocation failures
  LambdaDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-lambda-dlq
      KmsMasterKeyId: !Ref LambdaKMSKeyArn
      MessageRetentionPeriod: 1209600  # 14 days

  ###############################
  # DynamoDB Tables
  ###############################
  RecipientTablesRegistry:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: TableName
          AttributeType: S
      KeySchema:
        - AttributeName: TableName
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        KMSMasterKeyId: !Ref DynamoDBKMSKey
        SSEType: KMS

  ###############################
  # Campaign Registry
  #
  # Durable record of every campaign that has ever run. This exists because
  # Step Functions only retains execution history for 90 days, and because a
  # redeployment under a new stack name creates a new state machine whose
  # history starts empty - both of which make past campaigns disappear from the
  # monitor when Step Functions is the only source of truth.
  #
  # The table name is prefixed rather than stack-scoped so that the campaign
  # list can discover registries belonging to previous deployments through the
  # same ListTables pass it already performs. Retain policies keep the history
  # even if the stack is torn down.
  ###############################
  CampaignRegistry:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub email-campaign-registry-${AWS::StackName}
      AttributeDefinitions:
        - AttributeName: CampaignId
          AttributeType: S
      KeySchema:
        - AttributeName: CampaignId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        KMSMasterKeyId: !Ref DynamoDBKMSKey
        SSEType: KMS
      Tags:
        - Key: ManagedBy
          Value: MassEmailSystem

  ###############################
  # Campaign Registry Updater
  #
  # Records execution status changes in the registry while the execution is still
  # visible to Step Functions. Without this the registry would only ever hold the
  # RUNNING status written at setup time, and the real outcome would be lost once
  # the 90 day execution history expired.
  #
  # Driven by EventBridge rather than polled, so it costs one invocation per state
  # transition instead of one per monitor refresh.
  ###############################
  CampaignRegistryUpdaterPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Lets the campaign registry updater use its DLQ and the DynamoDB CMK
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - sqs:SendMessage
            Resource: !GetAtt LambdaDeadLetterQueue.Arn
          - Effect: Allow
            Action:
              - kms:Decrypt
              - kms:DescribeKey
            Resource: !Ref LambdaKMSKeyArn
          - Effect: Allow
            Action:
              - kms:Decrypt
              - kms:DescribeKey
              - kms:Encrypt
              - kms:GenerateDataKey
            Resource: !GetAtt DynamoDBKMSKey.Arn

  CampaignRegistryUpdaterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - !Ref CampaignRegistryWritePolicy
        - !Ref CampaignRegistryUpdaterPolicy

  CampaignRegistryUpdaterLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-CampaignRegistryUpdater
      RetentionInDays: 14
      KmsKeyId: !Ref CloudWatchLogsKMSKeyArn

  CampaignRegistryUpdaterLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-CampaignRegistryUpdater
      Runtime: python3.13
      Handler: index.lambda_handler
      Role: !GetAtt CampaignRegistryUpdaterRole.Arn
      Timeout: 30
      MemorySize: 128
      ReservedConcurrentExecutions: 5
      KmsKeyArn: !Ref LambdaKMSKeyArn
      DeadLetterConfig:
        TargetArn: !GetAtt LambdaDeadLetterQueue.Arn
      Environment:
        Variables:
          LOG_LEVEL: !Ref LogLevel
          CAMPAIGN_REGISTRY_TABLE: !Ref CampaignRegistry
      Code:
        ZipFile: |
          import json
          import logging
          import os
          from datetime import datetime, timezone

          import boto3

          logger = logging.getLogger()
          logger.setLevel(getattr(logging, os.environ.get('LOG_LEVEL', 'WARN').upper(), logging.WARNING))

          REGISTRY_TABLE = os.environ.get('CAMPAIGN_REGISTRY_TABLE', '')
          NAME_PREFIX = 'Campaign-'

          def lambda_handler(event, context):
              """Apply a Step Functions execution status change to the campaign registry."""
              detail = event.get('detail') or {}
              name = detail.get('name') or ''
              status = detail.get('status') or ''

              campaign_id = name[len(NAME_PREFIX):] if name.startswith(NAME_PREFIX) else name
              if not campaign_id:
                  logger.warning('Execution name missing from event; nothing to update')
                  return {'updated': False}
              if not REGISTRY_TABLE:
                  logger.warning('CAMPAIGN_REGISTRY_TABLE is not set; nothing to update')
                  return {'updated': False}

              now = datetime.now(timezone.utc).isoformat()

              # Always reflect the newest transition.
              latest = {'Status': status, 'LastStatusChange': now}
              end_time = _iso_utc(detail.get('stopDate'))
              if end_time:
                  latest['EndTime'] = end_time
              if detail.get('executionArn'):
                  latest['ExecutionArn'] = detail['executionArn']
              total_recipients = _total_recipients(detail)
              if total_recipients:
                  latest['TotalRecipients'] = total_recipients

              # Only used to backfill a campaign that was never registered, so a good
              # registration is never overwritten with weaker data from the event.
              input_data = _as_dict(detail.get('input'))
              fallback = {
                  'CampaignName': input_data.get('campaignName') or campaign_id,
                  'TemplateName': input_data.get('templateName') or '',
                  'SenderEmail': input_data.get('senderEmail') or '',
                  'StartTime': _iso_utc(detail.get('startDate')) or now,
              }

              # The user-supplied campaign name is editable from the monitor, so it is only
              # ever backfilled, never set. if_not_exists already guarantees that; it is
              # added only when the sender actually supplied one so that an unnamed campaign
              # is not given an empty DisplayName it would then have to be edited out of.
              display_name = str(input_data.get('displayName') or '').strip()
              if display_name:
                  fallback['DisplayName'] = display_name

              expressions = []
              names = {}
              values = {}
              for i, (key, value) in enumerate(latest.items()):
                  names[f'#l{i}'] = key
                  values[f':l{i}'] = value
                  expressions.append(f'#l{i} = :l{i}')
              for i, (key, value) in enumerate(fallback.items()):
                  names[f'#f{i}'] = key
                  values[f':f{i}'] = value
                  expressions.append(f'#f{i} = if_not_exists(#f{i}, :f{i})')

              # UpdateItem creates the row when absent, so a campaign whose registration
              # failed at setup time still ends up in the registry.
              boto3.resource('dynamodb').Table(REGISTRY_TABLE).update_item(
                  Key={'CampaignId': campaign_id},
                  UpdateExpression='SET ' + ', '.join(expressions),
                  ExpressionAttributeNames=names,
                  ExpressionAttributeValues=values,
              )
              logger.info(f'Registry updated: {campaign_id} -> {status}')
              return {'updated': True, 'campaignId': campaign_id, 'status': status}

          def _as_dict(raw):
              """Parse an execution input/output payload, which may be a JSON string."""
              if not raw:
                  return {}
              if isinstance(raw, dict):
                  return raw
              try:
                  parsed = json.loads(raw)
              except (ValueError, TypeError):
                  return {}
              return parsed if isinstance(parsed, dict) else {}

          def _total_recipients(detail):
              """Recipient count from the execution output, 0 if not yet known."""
              extraction = _as_dict(_as_dict(detail.get('output')).get('extractionResult'))
              try:
                  return int(extraction.get('processedRecipients')
                             or extraction.get('totalRecipients') or 0)
              except (TypeError, ValueError):
                  return 0

          def _iso_utc(value):
              """Normalise a timestamp to an ISO 8601 UTC string.

              EventBridge delivers Step Functions timestamps as epoch milliseconds, while
              the rest of the system stores ISO strings. Campaigns are ordered by comparing
              these strings, so they must all use the same representation.
              """
              if value in (None, ''):
                  return ''
              if isinstance(value, bool):
                  return ''
              if isinstance(value, (int, float)):
                  try:
                      return datetime.fromtimestamp(value / 1000, tz=timezone.utc).isoformat()
                  except (ValueError, OSError, OverflowError):
                      return ''
              return str(value)

