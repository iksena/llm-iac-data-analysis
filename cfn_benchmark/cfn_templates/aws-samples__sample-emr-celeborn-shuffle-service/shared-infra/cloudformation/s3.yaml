AWSTemplateFormatVersion: "2010-09-09"
Description: >
  S3 bucket for Spark job artifacts, sample data, and job output.
  Encrypted with the shared KMS key. Used by EMR on EKS job submissions.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Configuration
        Parameters:
          - ProjectName

Parameters:
  ProjectName:
    Type: String
    Default: emr-celeborn-demo
    Description: Project name used to import exports and for tagging

Resources:
  # --- S3 Bucket ---

  SparkDataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W35
            reason: "S3 access logging is not required for this blog post demonstration. In production, enable access logging for audit and compliance."
      checkov:
        skip:
          - id: CKV_AWS_18
            comment: "S3 access logging is not required for this blog post demonstration. In production, enable access logging for audit and compliance."
      guard:
        SuppressedRules:
          - S3_BUCKET_DEFAULT_LOCK_ENABLED: "Object lock not required for Spark job artifacts and temporary data. This is a blog post demonstration."
          - S3_BUCKET_NO_PUBLIC_RW_ACL: "PublicAccessBlockConfiguration blocks all ACLs and public access — no public RW ACL is possible. OwnershipControls enforces BucketOwnerEnforced which disables ACLs entirely."
          - S3_BUCKET_REPLICATION_ENABLED: "Cross-region replication not required for this blog post demonstration. Data is reproducible from source."
    Properties:
      BucketName: !Sub "${ProjectName}-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: "aws:kms"
              KMSMasterKeyID: !ImportValue
                Fn::Sub: "${ProjectName}-KMSKeyArn"
            BucketKeyEnabled: true
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-spark-data"
        - Key: Project
          Value: !Ref ProjectName

  # --- Bucket Policy ---
  # Deny non-SSL access and restrict to the account
  SparkDataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Metadata:
      guard:
        SuppressedRules:
          - S3_BUCKET_SSL_REQUESTS_ONLY: "DenyInsecureTransport statement explicitly denies all s3:* actions when aws:SecureTransport is false. The guard rule does not detect the string-encoded condition value used here."
    Properties:
      Bucket: !Ref SparkDataBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt SparkDataBucket.Arn
              - !Sub "${SparkDataBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

Outputs:
  BucketName:
    Description: Name of the S3 bucket for Spark job artifacts and data
    Value: !Ref SparkDataBucket
    Export:
      Name: !Sub "${ProjectName}-S3BucketName"

  BucketArn:
    Description: ARN of the S3 bucket
    Value: !GetAtt SparkDataBucket.Arn
    Export:
      Name: !Sub "${ProjectName}-S3BucketArn"