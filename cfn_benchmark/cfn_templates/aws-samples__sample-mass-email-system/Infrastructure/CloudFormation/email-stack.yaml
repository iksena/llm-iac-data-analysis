  ###############################
  # Step Functions State Machine
  ###############################
  CampaignInitiatorStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub ${AWS::StackName}-EmailCampaignProcessor-StateMachine
      RoleArn: !GetAtt CampaignStateMachineExecutionRole.Arn
      Definition:
        Comment: "Process email campaign batches with campaign-specific tables"
        StartAt: SetupCampaignResources
        States:
          SetupCampaignResources:
            Type: Task
            Resource: !GetAtt CampaignSetupLambda.Arn
            ResultPath: "$.campaignResources"
            Next: ExtractDataFromDB
            Retry:
              - ErrorEquals:
                  - States.ALL
                IntervalSeconds: 3
                MaxAttempts: 3
                BackoffRate: 2
          ExtractDataFromDB:
            Type: Task
            Resource: !GetAtt DataExtractorLambda.Arn
            Parameters:
              campaignName.$: "$.campaignName"
              templateName.$: "$.templateName"
              groupId.$: "$.groupId"
              recipientListFile.$: "$.recipientListFile"
              campaignId.$: "$.campaignResources.campaignId"
              recipientTrackingTable.$: "$.campaignResources.recipientTrackingTable"
              batchTrackingTable.$: "$.campaignResources.batchTrackingTable"
              senderEmail.$: "$.campaignResources.senderEmail"
              senderName.$: "$.campaignResources.senderName"
              attachments.$: "$.campaignResources.attachments"
              topicName.$: "$.campaignResources.topicName"
              templateS3Key.$: "$.campaignResources.templateS3Key"
            ResultPath: "$.extractionResult"
            Next: ProcessBatches
          ProcessBatches:
            Type: Map
            ItemsPath: "$.extractionResult.batches"
            Parameters:
              batchId.$: "$$.Map.Item.Value.batchId"
              objectKey.$: "$$.Map.Item.Value.objectKey"
              recipientCount.$: "$$.Map.Item.Value.recipientCount"
              campaignId.$: "$.campaignResources.campaignId"
              recipientTrackingTable.$: "$$.Map.Item.Value.recipientTrackingTable"
              batchTrackingTable.$: "$$.Map.Item.Value.batchTrackingTable"
              attachments.$: "$.campaignResources.attachments"
            MaxConcurrency: 100
            Iterator:
              StartAt: ProcessSingleBatch
              States:
                ProcessSingleBatch:
                  Type: Task
                  Resource: !GetAtt BatchProcessorLambda.Arn
                  ResultPath: "$.batchProcessResult"
                  End: true
                  Retry:
                    - ErrorEquals:
                        - States.ALL
                      IntervalSeconds: 3
                      MaxAttempts: 3
                      BackoffRate: 2
            ResultPath: "$.batchResults"
            Next: WaitForCompletion
          WaitForCompletion:
            Type: Wait
            Seconds: 60
            Next: CheckAllBatchesStatus
          CheckAllBatchesStatus:
            Type: Task
            Resource: !GetAtt CampaignStatusCheckerLambda.Arn
            Parameters:
              campaignId.$: "$.campaignResources.campaignId"
              batchTrackingTable.$: "$.campaignResources.batchTrackingTable"
              batches.$: "$.extractionResult.batches"
            ResultPath: "$.statusCheck"
            Next: EvaluateStatus
          EvaluateStatus:
            Type: Choice
            Choices:
              - Variable: "$.statusCheck.allComplete"
                BooleanEquals: true
                Next: CampaignComplete
            Default: WaitForCompletion
          CampaignComplete:
            Type: Succeed

  BatchMonitorStateMachine:
    Type: 'AWS::StepFunctions::StateMachine'
    Properties:
      StateMachineName: !Sub ${AWS::StackName}-EmailBatchMonitor-StateMachine
      Definition:
        Comment: "Monitor email batch processing"
        StartAt: CheckBatchStatus
        States:
          CheckBatchStatus:
            Type: Task
            Resource: !GetAtt BatchStatusCheckerLambda.Arn
            ResultPath: "$"
            Next: IsBatchComplete
            Retry:
              - ErrorEquals:
                  - States.ALL
                IntervalSeconds: 3
                MaxAttempts: 3
                BackoffRate: 2
          IsBatchComplete:
            Type: Choice
            Choices:
              - Variable: "$.isComplete"
                BooleanEquals: true
                Next: BatchCompleted
              - Variable: "$.shouldContinue"
                BooleanEquals: false
                Next: BatchFailed
            Default: Wait
          Wait:
            Type: Wait
            Seconds: 60
            Next: CheckBatchStatus
          BatchCompleted:
            Type: Succeed
          BatchFailed:
            Type: Fail
            Error: BatchProcessingFailed
            Cause: "Batch processing did not complete successfully"
      RoleArn: !GetAtt BatchMonitorStateMachineExecutionRole.Arn
      StateMachineType: STANDARD

  ###############################
  # S3 Event Notification
  ###############################
  ManifestCreatedRule:
    Type: AWS::Events::Rule
    Properties:
      Description: "Triggers the state machine when a manifest file is created in S3"
      EventPattern:
        source:
          - aws.s3
        detail-type:
          - "Object Created"
        detail:
          bucket:
            name:
              - !Ref EmailBatchBucket
          object:
            key:
              - prefix: "batches/"
              - suffix: "/manifest.json"
      State: ENABLED
      Targets:
        - Arn: !Ref CampaignInitiatorStateMachine
          Id: "ProcessManifest"
          RoleArn: !GetAtt EventBridgeToStepFunctionsRole.Arn
          InputTransformer:
            InputPathsMap:
              bucket: "$.detail.bucket.name"
              key: "$.detail.object.key"
            InputTemplate: |
              {
                "manifestS3Bucket": <bucket>,
                "manifestS3Key": <key>
              }

