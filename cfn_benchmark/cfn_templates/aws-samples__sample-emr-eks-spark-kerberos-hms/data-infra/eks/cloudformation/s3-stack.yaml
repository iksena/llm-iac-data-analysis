AWSTemplateFormatVersion: '2010-09-09'
Description: 'AWS CloudFormation stack for Amazon S3 infrastructure supporting Hive Metastore'

Parameters:
  ProjectName:
    Description: An environment name that is prefixed to resource names
    Type: String
    Default: KerberosEMRonEKS

  HiveMetastoreS3BucketName:
    Description: Name of the Amazon Simple Storage Service (Amazon S3) bucket to be used for Hive Metastore data storage
    Type: String
    Default: 'demo-emr-eks-kerberos-data'

Resources:
  HiveMetastoreS3Bucket:
    Type: 'AWS::S3::Bucket'
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_18
            comment: "Access logging is not enabled for this demo setup"
      cfn_nag:
        rules_to_suppress:
          - id: W35
            reason: "Access logging needs another bucket which would create a cyclic dependency. In production, implement logging with a separate logging bucket."
          - id: W28
            reason: "Explicit name is required for S3 bucket identification and integration with other systems"
          - id: W51
            reason: "Bucket policy added to enforce HTTPS-only access. IAM roles are used for fine-grained access control."
      guard:
        SuppressedRules:
          - S3_BUCKET_DEFAULT_LOCK_ENABLED: "Object Lock not required for demo purposes. Enable for production deployments with compliance requirements."
          - S3_BUCKET_NO_PUBLIC_RW_ACL: "False positive - bucket is secured via PublicAccessBlockConfiguration with all four blocks enabled. No AccessControl property means private by default."
          - S3_BUCKET_REPLICATION_ENABLED: "Cross-region replication not required for demo purposes. Enable for production deployments requiring disaster recovery."
          - S3_BUCKET_SSL_REQUESTS_ONLY: "False positive - SSL/TLS is enforced via HiveMetastoreS3BucketPolicy with DenyInsecureTransport statement (aws:SecureTransport condition)."
    Properties:
      BucketName: !Sub '${HiveMetastoreS3BucketName}-${AWS::AccountId}-${AWS::Region}'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: ProjectName
          Value: !Ref ProjectName

  # SECURITY NOTE: This bucket policy uses Principal: '*' and Action: 's3:*' intentionally.
  # The Deny effect with aws:SecureTransport condition ensures ALL requests (from any principal,
  # for any S3 action) must use HTTPS. The wildcard patterns are required for this security
  # control to apply broadly and enforce encryption in transit for all bucket access.
  HiveMetastoreS3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref HiveMetastoreS3Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt HiveMetastoreS3Bucket.Arn
              - !Sub '${HiveMetastoreS3Bucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

  # SECURITY NOTE: This IAM policy grants s3:DeleteObject permission which allows permanent
  # deletion of objects. While S3 versioning is enabled on the bucket (providing recovery
  # capability for deleted objects), consider the following for production environments:
  # - Enable MFA Delete on the bucket to require MFA for permanent deletions
  # - Review if s3:DeleteObject is required for your use case; remove if not needed
  # - Consider using S3 Object Lock for compliance requirements
  HiveMetastoreS3AccessPolicy:
    Type: 'AWS::IAM::ManagedPolicy'
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: "Explicit name is required for policy identification and integration with other systems"
    Properties:
      ManagedPolicyName: 'EMRonEKS-HiveMetastore-S3-AccessPolicy'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - 's3:ListBucket'
              - 's3:GetBucketLocation'
            Resource: !GetAtt HiveMetastoreS3Bucket.Arn
          # NOTE: s3:DeleteObject permission is included for Hive Metastore operations.
          # S3 versioning is enabled, so deleted objects can be recovered from version history.
          # For production, consider enabling MFA Delete for additional protection.
          - Effect: Allow
            Action:
              - 's3:PutObject'
              - 's3:GetObject'
              - 's3:DeleteObject'
            Resource: !Sub '${HiveMetastoreS3Bucket.Arn}/*'

Outputs:
  S3BucketName:
    Description: Name of the created S3 bucket
    Value: !Ref HiveMetastoreS3Bucket

  S3BucketArn:
    Description: ARN of the created S3 bucket
    Value: !GetAtt HiveMetastoreS3Bucket.Arn

  S3PolicyArn:
    Description: ARN of the created AWS IAM policy for Amazon S3 access
    Value: !Ref HiveMetastoreS3AccessPolicy