AWSTemplateFormatVersion: '2010-09-09'
Description: |
  **WARNING** This template creates a VPC, subnets, a Transit Gateway and attachments, security groups, IAM roles, instance profiles,
  and related resources in the DR region. You will be billed for the AWS resources used if you create a stack from this template.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Recovery Area Network"
        Parameters:
          - RecoveryVpcCidrParam
          - RecoveryPrivateSubnetCidrParam
      - Label:
          default: "Staging Area Network"
        Parameters:
          - RecoveryStagingVpcCidrParam
          - RecoveryStagingPrivateSubnetCidrParam
      - Label:
          default: "Primary Source Info"
        Parameters:
          - PrimarySourceVpcCidrParam

Parameters:
  # -----------------------
  # Recovery‐side values (fetched from /dr/recovery/... in SSM)
  # -----------------------
  RecoveryVpcCidrParam:
    Type: AWS::SSM::Parameter::Value<String>
    Default: "/dr/recovery/vpcCidr"
    Description: "CIDR block for the Recovery VPC (from SSM)"

  RecoveryStagingVpcCidrParam:
    Type: AWS::SSM::Parameter::Value<String>
    Default: "/dr/recovery/stagingVpcCidr"
    Description: "CIDR block for the Staging VPC in the recovery region (from SSM)"

  RecoveryPrivateSubnetCidrParam:
    Type: AWS::SSM::Parameter::Value<String>
    Default: "/dr/recovery/privateSubnetCidr"
    Description: "CIDR block for the Recovery private subnet (from SSM)"

  RecoveryStagingPrivateSubnetCidrParam:
    Type: AWS::SSM::Parameter::Value<String>
    Default: "/dr/recovery/stagingPrivateSubnetCidr"
    Description: "CIDR block for the Staging private subnet in the recovery region (from SSM)"

  # -----------------------
  # Primary‐source value (fetched from /dr/primary/... in SSM)
  # -----------------------
  PrimarySourceVpcCidrParam:
    Type: AWS::SSM::Parameter::Value<String>
    Default: "/dr/primary/sourceVpcCidr"
    Description: "CIDR block for the source VPC in your primary region (from SSM)"

Resources:

  ### Recovery VPC, Subnet & Route Table ###
  RecoveryVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref RecoveryVpcCidrParam
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: "recovery-vpc"
        - Key: staging
          Value: "false"
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W60
            reason: "VPC flow logs not required for this demo"

  RecoveryPrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref RecoveryVpc
      CidrBlock: !Ref RecoveryPrivateSubnetCidrParam
      AvailabilityZone:
        Fn::Select:
          - 0
          - Fn::GetAZs: !Ref "AWS::Region"
      Tags:
        - Key: Name
          Value: "recovery-private-subnet"

  RecoveryPrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref RecoveryVpc
      Tags:
        - Key: Name
          Value: "recovery-private-routetable"
        - Key: staging
          Value: "false"

  RecoveryPrivateSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref RecoveryPrivateSubnet
      RouteTableId: !Ref RecoveryPrivateRouteTable

  RecoveryServerRole:
    Type: AWS::IAM::Role
    Properties:
      Description: "IAM role for the recovery server instance"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: [ ec2.amazonaws.com ]
            Action: [ "sts:AssumeRole" ]
      Path: "/"
      Policies:
        - PolicyName: "Recovery-Server-Policy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ "s3:GetObject" ]
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::aws-elastic-disaster-recovery-${AWS::Region}/*"
                  - !Sub "arn:${AWS::Partition}:s3:::aws-elastic-disaster-recovery-hashes-${AWS::Region}/*"
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSElasticDisasterRecoveryRecoveryInstancePolicy"

  RecoveryServerInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: "/"
      Roles:
        - !Ref RecoveryServerRole

  ### Single Transit Gateway & Attachments ###
  RecoveryTransitGateway:
    Type: AWS::EC2::TransitGateway
    Properties:
      Description: "Transit Gateway for Recovery & Staging VPCs"
      DefaultRouteTableAssociation: enable
      DefaultRouteTablePropagation: enable
      AutoAcceptSharedAttachments: enable
      DnsSupport: enable
      VpnEcmpSupport: enable
      Tags:
        - Key: Name
          Value: "recovery-transit-gateway"
        - Key: staging
          Value: "false"

  # Attach Recovery VPC
  RecoveryTransitGatewayAttachment:
    Type: AWS::EC2::TransitGatewayVpcAttachment
    Properties:
      TransitGatewayId: !Ref RecoveryTransitGateway
      VpcId: !Ref RecoveryVpc
      SubnetIds:
        - !Ref RecoveryPrivateSubnet
      Tags:
        - Key: Name
          Value: "recovery-vpc-attachment"

  # Attach Staging VPC (defined later)
  StagingTransitGatewayAttachment:
    Type: AWS::EC2::TransitGatewayVpcAttachment
    Properties:
      TransitGatewayId: !Ref RecoveryTransitGateway
      VpcId: !Ref StagingVpc
      SubnetIds:
        - !Ref StagingPrivateSubnet
      Tags:
        - Key: Name
          Value: "recovery-staging-vpc-attachment"

  ### Routes via the single TGW ###
  # Recovery -> Staging
  RecoveryToStagingRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref RecoveryPrivateRouteTable
      DestinationCidrBlock: !Ref RecoveryStagingVpcCidrParam
      TransitGatewayId: !Ref RecoveryTransitGateway
    DependsOn: RecoveryTransitGatewayAttachment

  # Staging -> Recovery
  StagingToRecoveryRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref StagingPrivateRouteTable
      DestinationCidrBlock: !Ref RecoveryVpcCidrParam
      TransitGatewayId: !Ref RecoveryTransitGateway
    DependsOn: StagingTransitGatewayAttachment

  ### VPC Endpoints & SG ###
  RecoveryVPCEndpointSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Security group for VPC endpoints"
      VpcId: !Ref RecoveryVpc
      Tags:
        - Key: Name
          Value: "recovery-vpc-endpoint-sg"
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W5
            reason: "open to world only for outbound traffic"
          - id: W40
            reason: "All protocol only for outbound traffic"

  VPCEndpointIngress1:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RecoveryVPCEndpointSG
      Description: Allow HTTPS from Recovery VPC
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: !Ref RecoveryVpcCidrParam

  VPCEndpointIngress2:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RecoveryVPCEndpointSG
      Description: Allow HTTPS from Staging VPC
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: !Ref RecoveryStagingVpcCidrParam

  VPCEndpointEgress1:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref RecoveryVPCEndpointSG
      Description: Allow all traffic to VPC endpoints
      IpProtocol: "-1"
      CidrIp: "0.0.0.0/0"

  DRSEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      VpcId: !Ref RecoveryVpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.drs"
      SubnetIds:
        - !Ref RecoveryPrivateSubnet
      SecurityGroupIds:
        - !Ref RecoveryVPCEndpointSG
      PrivateDnsEnabled: true

  ### Staging VPC, Subnet & Route Table ###
  StagingVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref RecoveryStagingVpcCidrParam
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: "recovery-staging-vpc"
        - Key: staging
          Value: "true"
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W60
            reason: "VPC flow logs not required for this demo"

  StagingPrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref StagingVpc
      CidrBlock: !Ref RecoveryStagingPrivateSubnetCidrParam
      AvailabilityZone:
        Fn::Select:
          - 0
          - Fn::GetAZs: !Ref "AWS::Region"
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: "recovery-staging-private-subnet"

  StagingPrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref StagingVpc
      Tags:
        - Key: Name
          Value: "recovery-staging-private-route-table"
        - Key: staging
          Value: "true"

  StagingSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref StagingPrivateSubnet
      RouteTableId: !Ref StagingPrivateRouteTable

  ### Staging VPC Endpoints & SG ###
  StagingVPCEndpointSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Security group for VPC endpoints"
      VpcId: !Ref StagingVpc
      Tags:
        - Key: Name
          Value: "recovery-staging-vpc-endpoint-sg"
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W5
            reason: "open to world only for outbound traffic"
          - id: W40
            reason: "All protocol only for outbound traffic"

  StagingVPCEndpointIngressFromPrimary:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref StagingVPCEndpointSG
      Description: Allow HTTPS from primary-region source VPC
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: !Ref PrimarySourceVpcCidrParam

  StagingVPCEndpointIngress1:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref StagingVPCEndpointSG
      Description: Allow HTTPS from Recovery VPC
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: !Ref RecoveryVpcCidrParam

  StagingVPCEndpointIngress2:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref StagingVPCEndpointSG
      Description: Allow HTTPS from Staging VPC
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: !Ref RecoveryStagingVpcCidrParam

  StagingVPCEndpointIngress3:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref StagingVPCEndpointSG
      Description: Allow TCP/1500 from Recovery VPC
      IpProtocol: tcp
      FromPort: 1500
      ToPort: 1500
      CidrIp: !Ref RecoveryVpcCidrParam

  StagingVPCEndpointIngress4:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref StagingVPCEndpointSG
      Description: Allow UDP/53 from Recovery VPC
      IpProtocol: udp
      FromPort: 53
      ToPort: 53
      CidrIp: !Ref RecoveryVpcCidrParam

  StagingVPCEndpointIngress5:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref StagingVPCEndpointSG
      Description: Allow UDP/53 from Staging VPC
      IpProtocol: udp
      FromPort: 53
      ToPort: 53
      CidrIp: !Ref RecoveryStagingVpcCidrParam

  StagingVPCEndpointEgress1:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref StagingVPCEndpointSG
      Description: Allow all traffic to VPC endpoints
      IpProtocol: "-1"
      CidrIp: "0.0.0.0/0"

  StagingS3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Gateway
      VpcId: !Ref StagingVpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      RouteTableIds:
        - !Ref StagingPrivateRouteTable

  StagingS3InterfaceEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      VpcId: !Ref StagingVpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      SubnetIds:
        - !Ref StagingPrivateSubnet
      SecurityGroupIds:
        - !Ref StagingVPCEndpointSG

  StagingDRSEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.drs"
      VpcId: !Ref StagingVpc
      SubnetIds:
        - !Ref StagingPrivateSubnet
      SecurityGroupIds:
        - !Ref StagingVPCEndpointSG
      PrivateDnsEnabled: true

  StagingEC2Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Interface
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ec2"
      VpcId: !Ref StagingVpc
      SubnetIds:
        - !Ref StagingPrivateSubnet
      SecurityGroupIds:
        - !Ref StagingVPCEndpointSG
      PrivateDnsEnabled: true

  ### Replication Server SG ###
  ReplicationServerSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Security group for replication server"
      VpcId: !Ref StagingVpc
      Tags:
        - Key: Name
          Value: "recovery-replication-server-sg"
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W5
            reason: "open to world only for outbound traffic"
          - id: W40
            reason: "All protocol only for outbound traffic"

  ReplicationServerSgIngress1:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ReplicationServerSg
      Description: Allow TCP/1500 from Staging VPC
      IpProtocol: tcp
      FromPort: 1500
      ToPort: 1500
      CidrIp: !Ref RecoveryVpcCidrParam

  ReplicationServerSgIngress2:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ReplicationServerSg
      Description: Allow HTTPS from Recovery VPC
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: !Ref RecoveryVpcCidrParam

  ReplicationServerSgIngress3:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ReplicationServerSg
      Description: Allow HTTPS from Staging VPC
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: !Ref RecoveryStagingVpcCidrParam

  ReplicationServerSgEgress1:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref ReplicationServerSg
      Description: Allow all traffic
      IpProtocol: "-1"
      CidrIp: "0.0.0.0/0"

Outputs:
  RecoveryTransitGatewayId:
    Description: "DR-region TGW ID"
    Value: !Ref RecoveryTransitGateway
    Export:
      Name: RecoveryTransitGatewayId

  RecoveryPrivateRouteTableId:
    Description: "DR-region private subnet route table"
    Value: !Ref RecoveryPrivateRouteTable
    Export:
      Name: RecoveryPrivateRouteTableId

  RecoveryStagingPrivateRouteTableId:
    Description: "DR-region staging private subnet route table"
    Value: !Ref StagingPrivateRouteTable
    Export:
      Name: RecoveryStagingPrivateRouteTableId

  RecoveryVpcId:
    Description: "DR-region Recovery VPC ID"
    Value: !Ref RecoveryVpc
    Export:
      Name: RecoveryVpcId

  RecoveryStagingVpcId:
    Description: "DR-region Staging VPC ID"
    Value: !Ref StagingVpc
    Export:
      Name: RecoveryStagingVpcId

  StagingS3InterfaceEndpointId:
    Description: S3 Interface Endpoint
    Value: !Join
      - ""
      - - "bucket"
        - !Select
          - 1
          - !Split
            - "*"
            - !Select
              - 0
              - !GetAtt StagingS3InterfaceEndpoint.DnsEntries