AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  ACM certificate validated through DNS in a Route 53 hosted zone, with optional
  subject alternative names and a wildcard.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Naming
        Parameters:
          - NamePrefix
          - Environment
      - Label:
          default: Certificate
        Parameters:
          - DomainName
          - HostedZoneId
          - IncludeWildcard
          - AdditionalDomainName

Parameters:
  NamePrefix:
    Type: String
    Description: Prefix used in the certificate's Name tag.
    AllowedPattern: "^[a-z][a-z0-9-]{1,30}[a-z0-9]$"
    ConstraintDescription: 3-32 lowercase characters, digits and hyphens.

  Environment:
    Type: String
    Description: Environment this certificate serves.
    Default: dev
    AllowedValues: [dev, staging, prod]

  DomainName:
    Type: String
    Description: >-
      Primary domain, e.g. api.example.com. For CloudFront the certificate must
      be in us-east-1 regardless of where the distribution serves from; for an
      ALB it must be in the load balancer's own region.
    AllowedPattern: "^(\\*\\.)?([a-z0-9]([a-z0-9-]*[a-z0-9])?\\.)+[a-z]{2,}$"
    ConstraintDescription: A lowercase DNS name, e.g. api.example.com.

  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: >-
      Route 53 zone holding DomainName. CloudFormation writes the validation
      record into it and waits - the stack sits in CREATE_IN_PROGRESS until the
      record resolves, so a zone that is not authoritative for this domain hangs
      the deploy until it times out.

  IncludeWildcard:
    Type: String
    Description: >-
      Also cover *.<DomainName>. Note a wildcard matches one label only:
      *.example.com covers api.example.com but not a.b.example.com.
    Default: "false"
    AllowedValues: ["true", "false"]

  AdditionalDomainName:
    Type: String
    Description: >-
      One extra subject alternative name, e.g. www.example.com. It must be
      validated in the same hosted zone. Leave empty for none.
    Default: ""

Conditions:
  HasWildcard: !Equals [!Ref IncludeWildcard, "true"]
  HasAdditionalDomain: !Not [!Equals [!Ref AdditionalDomainName, ""]]

Resources:
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      # DNS validation, not EMAIL. Email validation requires a human to click a
      # link every 13 months or the certificate silently expires; a DNS-validated
      # certificate renews itself as long as the record stays in place.
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
        - !If
          - HasWildcard
          - DomainName: !Sub "*.${DomainName}"
            HostedZoneId: !Ref HostedZoneId
          - !Ref AWS::NoValue
        - !If
          - HasAdditionalDomain
          - DomainName: !Ref AdditionalDomainName
            HostedZoneId: !Ref HostedZoneId
          - !Ref AWS::NoValue
      SubjectAlternativeNames:
        - !If [HasWildcard, !Sub "*.${DomainName}", !Ref "AWS::NoValue"]
        - !If [HasAdditionalDomain, !Ref AdditionalDomainName, !Ref "AWS::NoValue"]
      KeyAlgorithm: RSA_2048
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-${Environment}"

Outputs:
  CertificateArn:
    Description: >-
      Certificate ARN, for an ALB HTTPS listener, an API Gateway custom domain,
      or a CloudFront distribution.
    Value: !Ref Certificate

  DomainName:
    Description: Primary domain the certificate covers.
    Value: !Ref DomainName