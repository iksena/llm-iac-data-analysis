AWSTemplateFormatVersion: '2010-09-09'
Description: |
  DVA-C02 Lab 2.8 — RDS MySQL db.t3.micro single-AZ in default VPC.
  Master password generated and stored in Secrets Manager.
  Lambda function in same VPC reads the secret and connects.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Default VPC ID (use describe-vpcs to find it)
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least 2 subnets in different AZs (default subnets work)

Resources:
  DBSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: dva-lab-02-08-db-secret
      Description: RDS master credentials for Lab 2.8
      GenerateSecretString:
        SecretStringTemplate: '{"username":"admin"}'
        GenerateStringKey: password
        PasswordLength: 24
        ExcludeCharacters: '"@/\'

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupName: dva-lab-02-08-subnet-group
      DBSubnetGroupDescription: DVA Lab 2.8 RDS subnet group
      SubnetIds: !Ref SubnetIds

  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: dva-lab-02-08-db-sg
      GroupDescription: Allow inbound MySQL from Lambda SG
      VpcId: !Ref VpcId

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: dva-lab-02-08-lambda-sg
      GroupDescription: Outbound only — Lambda to RDS
      VpcId: !Ref VpcId

  DBIngressFromLambda:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DBSecurityGroup
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      SourceSecurityGroupId: !Ref LambdaSecurityGroup

  DBInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: dva-lab-02-08-mysql
      Engine: mysql
      EngineVersion: '8.0.35'
      DBInstanceClass: db.t3.micro
      AllocatedStorage: 20
      StorageType: gp3
      MasterUsername: !Sub '{{resolve:secretsmanager:${DBSecret}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DBSecret}:SecretString:password}}'
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref DBSecurityGroup
      BackupRetentionPeriod: 1
      MultiAZ: false
      PubliclyAccessible: false
      DeletionProtection: false
      StorageEncrypted: true

  SecretAttachment:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Properties:
      SecretId: !Ref DBSecret
      TargetId: !Ref DBInstance
      TargetType: AWS::RDS::DBInstance

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: ReadSecret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DBSecret

  ConnectorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: dva-lab-02-08-connector
      Runtime: python3.12
      Handler: handler.handler
      Role: !GetAtt LambdaRole.Arn
      Code: ./src
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          SECRET_ARN: !Ref DBSecret
          DB_HOST: !GetAtt DBInstance.Endpoint.Address
          DB_PORT: !GetAtt DBInstance.Endpoint.Port
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds: !Ref SubnetIds

Outputs:
  FunctionName:
    Value: !Ref ConnectorFunction
  DBEndpoint:
    Value: !GetAtt DBInstance.Endpoint.Address
  DBPort:
    Value: !GetAtt DBInstance.Endpoint.Port
  SecretArn:
    Value: !Ref DBSecret