AWSTemplateFormatVersion: '2010-09-09'
Description: 'Part 1: IAM Role & Instance Profile for n8n'

Parameters:
  ProjectName:
    Description: Prefix for resources (Must match the Main stack)
    Type: String
    Default: "n8n-youtube-bot"

Resources:
  # -------------------------------------------------------------------------
  # IAM Role
  # -------------------------------------------------------------------------
  N8nInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Policies:
        - PolicyName: N8nSpecificAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: "*"
              - Effect: Allow
                Action: ec2:StopInstances
                Resource: "*"
                Condition:
                  StringEquals:
                    "aws:ResourceTag/Project": !Ref ProjectName
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                # We construct the ARN manually to allow segregation
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/ec2/${ProjectName}:*"

  # -------------------------------------------------------------------------
  # Instance Profile (The bridge between Role and EC2)
  # -------------------------------------------------------------------------
  N8nInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "${ProjectName}-profile"
      Roles: [ !Ref N8nInstanceRole ]

Outputs:
  InstanceProfileName:
    Description: Copy this value and paste it into the Main Stack parameters
    Value: !Ref N8nInstanceProfile