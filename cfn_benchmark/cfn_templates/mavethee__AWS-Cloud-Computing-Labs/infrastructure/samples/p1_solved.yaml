AWSTemplateFormatVersion: '2010-09-09'
Description: Podatny S3 Bucket i Polityka IAM (Hardened for Trivy)
Resources:
  # AWS-0078: KMS Key for Performance Insights encryption
  PIKmsKey:
    Type: 'AWS::KMS::Key'
    Properties:
      Description: 'KMS key for RDS Performance Insights'
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: 'Enable IAM User Permissions'
            Effect: 'Allow'
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'

  MyDatabase:
    Type: AWS::RDS::DBInstance
    Properties:
      DBName: ecommerce_db
      Engine: mysql
      MasterUsername: admin
      MasterUserPassword: Password123! # Kept hardcoded per lab constraints
      AllocatedStorage: '20'
      DBInstanceClass: db.t3.micro

      # AWS-0180: Block public exposure to the internet
      PubliclyAccessible: false

      # AWS-0080: Secure data at rest
      StorageEncrypted: true

      # AWS-0077: Increase from default 1-day retention for better disaster recovery
      BackupRetentionPeriod: 7

      # AWS-0176: Allow managing database access via IAM roles
      EnableIAMDatabaseAuthentication: true

      # AWS-0177: Prevent accidental deletion of the database resource
      DeletionProtection: true

      # AWS-0133: Enable deeper database load monitoring
      EnablePerformanceInsights: true
      PerformanceInsightsKMSKeyId: !GetAtt PIKmsKey.Arn