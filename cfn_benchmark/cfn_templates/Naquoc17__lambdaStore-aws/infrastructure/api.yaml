AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  LambdaStore — API Layer Stack
  DVA-C02 Stage S3: API Gateway REST + WebSocket, throttling, caching, CORS

# DVA S3 Questions mapped to this stack:
#   Q003 — Cognito Identity Pool policy for S3 access
#   Q012 — Cognito + S3 presigned URL (least overhead)
#   Q019 — API caching for responsiveness
#   Q021 — Development stage for API versioning
#   Q028 — CORS configuration for cross-origin requests
#   Q031 — x-amz-server-side-encryption header in presigned URL
#   Q078 — ALB X-Forwarded-For for client IP
#   Q085 — Lambda alias versioning + stage deployment
#   Q092 — ElastiCache for session state (connected via API)

Parameters:
  Stage:
    Type: String
  ProjectName:
    Type: String
    Default: lambdastore
  UserPoolArn:
    Type: String
    Default: ''
    Description: Cognito User Pool ARN for JWT authorizer (from AuthStack output)
  UserPoolClientId:
    Type: String
    Default: ''
    Description: Cognito User Pool Client ID

Resources:

  # ── REST API ─────────────────────────────────────────────────────────────────
  # DVA S3: API Gateway REST API (vs HTTP API — REST has caching, usage plans, WAF)
  # DVA S3 Exam: REST API = more features; HTTP API = cheaper, faster, simpler
  RestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub ${ProjectName}-${Stage}
      Description: LambdaStore REST API
      EndpointConfiguration:
        Types: [REGIONAL]
      Tags:
        Project: !Ref ProjectName
        Stage: !Ref Stage

  # DVA S3: Q019 — API caching reduces Lambda invocations + improves latency
  # Cache TTL=300s by default; invalidated via Cache-Control: max-age=0
  DeploymentStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref RestApi
      StageName: !Ref Stage
      Description: !Sub ${Stage} deployment
      TracingEnabled: true   # DVA S7: X-Ray on API Gateway
      # DVA S3: Q019 — response caching (enable in prod/staging, keep off in dev)
      CacheClusterEnabled: false   # Build Stage 11: set to true
      # CacheClusterSize: '0.5'    # 0.5GB — cheapest cache tier
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          MetricsEnabled: true
          DataTraceEnabled: false   # PROD: false — logs request/response body
          LoggingLevel: INFO
          # DVA S3: Q019 — per-method caching (Build Stage 11)
          # CachingEnabled: true
          # CacheTtlInSeconds: 300

  # DVA S3: Q021 — separate "development" stage for testing (different config)
  DevelopmentStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref RestApi
      StageName: development
      Description: Development stage for API testing (higher rate limits, logging enabled)
      TracingEnabled: true
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          MetricsEnabled: true
          DataTraceEnabled: true    # dev only — log request body for debugging
          LoggingLevel: INFO

  # ── Cognito JWT Authorizer ────────────────────────────────────────────────────
  # DVA S3: Q — Cognito User Pool Authorizer validates JWT tokens
  # DVA S3 Exam Trap: Lambda authorizer = custom logic; Cognito authorizer = JWT validation only
  CognitoAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: !Sub ${ProjectName}-${Stage}-cognito
      RestApiId: !Ref RestApi
      Type: COGNITO_USER_POOLS
      IdentitySource: method.request.header.Authorization
      ProviderARNs:
        - !Ref UserPoolArn
      AuthorizerResultTtlInSeconds: 300   # cache authorization for 5 min

  # ── Usage Plan + API Key (throttling) ────────────────────────────────────────
  # DVA S3: Q — Usage plans throttle API consumers (per-key rate limiting)
  # DVA S3 Exam: throttle = token bucket (burst + rate); quota = monthly cap
  UsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    Properties:
      UsagePlanName: !Sub ${ProjectName}-${Stage}-standard
      Description: Standard API usage plan
      Throttle:
        RateLimit: 100    # 100 req/s sustained
        BurstLimit: 200   # 200 req burst
      Quota:
        Limit: 1000000    # 1M requests/month
        Period: MONTH
      ApiStages:
        - ApiId: !Ref RestApi
          Stage: !Ref Stage

  # ── WebSocket API (Build Stage 22) ───────────────────────────────────────────
  # DVA S3: WebSocket API for real-time order status updates
  # DVA S3 Exam: WebSocket = bidirectional; REST = request/response only
  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub ${ProjectName}-${Stage}-ws
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: '$request.body.action'
      Tags:
        Project: !Ref ProjectName

  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WebSocketApi
      StageName: !Ref Stage
      AutoDeploy: true

  # Default route — connection management
  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $connect
      AuthorizationType: NONE   # TODO Build Stage 22: add Cognito/Lambda authorizer

  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $disconnect
      AuthorizationType: NONE

Outputs:
  RestApiId:
    Value: !Ref RestApi
    Export:
      Name: !Sub ${ProjectName}-${Stage}-RestApiId

  RestApiUrl:
    Value: !Sub https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
    Export:
      Name: !Sub ${ProjectName}-${Stage}-RestApiUrl

  WebSocketApiId:
    Value: !Ref WebSocketApi
    Export:
      Name: !Sub ${ProjectName}-${Stage}-WebSocketApiId

  WebSocketUrl:
    Value: !Sub wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
    Export:
      Name: !Sub ${ProjectName}-${Stage}-WebSocketUrl

  CognitoAuthorizerId:
    Value: !Ref CognitoAuthorizer
    Export:
      Name: !Sub ${ProjectName}-${Stage}-CognitoAuthorizerId