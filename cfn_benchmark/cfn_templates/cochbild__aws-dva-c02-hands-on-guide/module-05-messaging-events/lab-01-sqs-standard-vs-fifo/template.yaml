AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: DVA Lab 5.1 — SQS Standard vs FIFO with consumer Lambdas, DLQ, and ESM.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 256
    LoggingConfig:
      LogFormat: JSON

Resources:

  # ----- Standard queue + DLQ -----

  StandardDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: dva-lab-05-01-standard-dlq
      MessageRetentionPeriod: 1209600  # 14 days

  StandardQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: dva-lab-05-01-standard
      VisibilityTimeout: 60            # 6x Lambda timeout (10s)
      ReceiveMessageWaitTimeSeconds: 20 # long polling
      MessageRetentionPeriod: 345600   # 4 days
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt StandardDlq.Arn
        maxReceiveCount: 3

  # ----- FIFO queue (no DLQ in this lab; kept simple) -----

  FifoQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: dva-lab-05-01-orders.fifo
      FifoQueue: true
      ContentBasedDeduplication: true
      VisibilityTimeout: 60
      ReceiveMessageWaitTimeSeconds: 20
      DeduplicationScope: messageGroup
      FifoThroughputLimit: perMessageGroupId

  # ----- Consumer Lambda for Standard -----

  StandardConsumer:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dva-lab-05-01-standard-consumer
      CodeUri: src/
      Handler: handler.standard_handler
      Policies:
        - SQSPollerPolicy:
            QueueName: !GetAtt StandardQueue.QueueName
      Events:
        SqsTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt StandardQueue.Arn
            BatchSize: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures

  # ----- Consumer Lambda for FIFO -----

  FifoConsumer:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dva-lab-05-01-fifo-consumer
      CodeUri: src/
      Handler: handler.fifo_handler
      Policies:
        - SQSPollerPolicy:
            QueueName: !GetAtt FifoQueue.QueueName
      Events:
        SqsTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt FifoQueue.Arn
            BatchSize: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures

Outputs:
  StandardQueueUrl:
    Description: URL of the Standard queue
    Value: !Ref StandardQueue
  StandardQueueArn:
    Value: !GetAtt StandardQueue.Arn
  StandardDlqUrl:
    Description: URL of the Standard DLQ
    Value: !Ref StandardDlq
  StandardDlqArn:
    Value: !GetAtt StandardDlq.Arn
  FifoQueueUrl:
    Description: URL of the FIFO queue
    Value: !Ref FifoQueue
  FifoQueueArn:
    Value: !GetAtt FifoQueue.Arn
  StandardFunctionName:
    Value: !Ref StandardConsumer
  FifoFunctionName:
    Value: !Ref FifoConsumer