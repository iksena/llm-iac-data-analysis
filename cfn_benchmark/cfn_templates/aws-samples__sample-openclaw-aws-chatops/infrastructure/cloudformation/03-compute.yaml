                  StringEquals:
                    aws:ResourceAccount: !Ref AWS::AccountId
              - Sid: CloudTrailRead
                Effect: Allow
                Action:
                  - cloudtrail:LookupEvents
                  - cloudtrail:GetTrailStatus
                  - cloudtrail:DescribeTrails
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:ResourceAccount: !Ref AWS::AccountId
              - Sid: SSMRunbook
                Effect: Allow
                Action:
                  - ssm:ListDocuments
                  - ssm:DescribeDocument
                  - ssm:GetCommandInvocation
                  - ssm:ListCommandInvocations
                  - ssm:StartAutomationExecution
                  - ssm:GetAutomationExecution
                  - ssm:DescribeAutomationExecutions
                  - ssm:StopAutomationExecution
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:ResourceAccount: !Ref AWS::AccountId
              - Sid: FlowLogsQuery
                Effect: Allow
                Action:
                  - logs:StartQuery
                  - logs:GetQueryResults
                  - logs:DescribeLogGroups
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:ResourceAccount: !Ref AWS::AccountId

  MCPOpsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-mcp-ops-exec-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: MCPOpsExecutionPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ECRPull
                Effect: Allow
                Action:
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:BatchCheckLayerAvailability
                Resource: !GetAtt MCPOpsECRRepository.Arn
              - Sid: ECRAuth
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/openclaw/${Environment}/mcp-ops:*'

  # ── MCP Task Definitions ───────────────────────────────────────────────────
  MCPKnowledgeTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-${Environment}-mcp-knowledge'
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt MCPKnowledgeExecutionRole.Arn
      TaskRoleArn: !Ref MCPKnowledgeTaskRoleArn
      ContainerDefinitions:
        - Name: mcp-knowledge
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ProjectName}-${Environment}-mcp-knowledge:${ImageTag}'
          Essential: true
          PortMappings:
            - ContainerPort: 8001
              Protocol: tcp
          Environment:
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: OPENSEARCH_ENDPOINT
              Value: !Sub 'https://${OpenSearchEndpoint}'
            - Name: PORT
              Value: '8001'
          HealthCheck:
            Command:
              - CMD-SHELL
              - curl -sf http://localhost:8001/health || exit 1
            Interval: 15
            Timeout: 3
            Retries: 3
            StartPeriod: 30
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref MCPKnowledgeLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: fargate

  MCPOpsTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-${Environment}-mcp-ops'
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt MCPOpsExecutionRole.Arn
      TaskRoleArn: !GetAtt MCPOpsTaskRole.Arn
      ContainerDefinitions:
        - Name: mcp-ops
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ProjectName}-${Environment}-mcp-ops:${ImageTag}'
          Essential: true
          ReadonlyRootFilesystem: true
          LinuxParameters:
            Capabilities:
              Drop:
                - ALL
            Tmpfs:
              - ContainerPath: /tmp
                Size: 64
                MountOptions:
                  - noexec
                  - nosuid
          PortMappings:
            - ContainerPort: 8002
              Protocol: tcp
          Environment:
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: PORT
              Value: '8002'
          HealthCheck:
            Command:
              - CMD-SHELL
              - curl -sf http://localhost:8002/health || exit 1
            Interval: 15
            Timeout: 3
            Retries: 3
            StartPeriod: 30
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref MCPOpsLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: fargate

  # ── MCP ECS Services ───────────────────────────────────────────────────────
  MCPKnowledgeService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub '${ProjectName}-mcp-knowledge'
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref MCPKnowledgeTaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      EnableExecuteCommand: false
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets:
            - !Ref ComputeSubnet1Id
            - !Ref ComputeSubnet2Id
          SecurityGroups:
            - !Ref MCPServicesSG
          AssignPublicIp: DISABLED
      ServiceRegistries:
        - RegistryArn: !GetAtt MCPKnowledgeDiscoveryService.Arn
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true

  MCPOpsService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub '${ProjectName}-mcp-ops'
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref MCPOpsTaskDefinition
      DesiredCount: 0  # Always 0 via CFN; deploy-mcp.sh sets to 1 after image push
      LaunchType: FARGATE
      EnableExecuteCommand: false
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets:
            - !Ref PublicSubnet1Id
            - !Ref PublicSubnet2Id
          SecurityGroups:
            - !Ref MCPOpsSG
          AssignPublicIp: ENABLED
      ServiceRegistries:
        - RegistryArn: !GetAtt MCPOpsDiscoveryService.Arn
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true

  # ============================================================================
  # MCP GraphMem — Conditional resources (opt-in via EnableGraphMem=true)
  # ============================================================================

  MCPGraphMemECRRepository:
    Type: AWS::ECR::Repository
    Condition: GraphMemEnabled
    Properties:
      RepositoryName: !Sub '${ProjectName}-${Environment}-mcp-graphmem'
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: KMS
        KmsKey: !Ref KnowledgeKeyArn
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules": [{"rulePriority": 1, "description": "Keep last 10 images",
           "selection": {"tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 10},
           "action": {"type": "expire"}}]}
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-mcp-graphmem'

  MCPGraphMemLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: GraphMemEnabled
    Properties:
      LogGroupName: !Sub '/openclaw/${Environment}/mcp-graphmem'
      RetentionInDays: 365
      KmsKeyId: !Ref InfraLogsKeyArn

  MCPGraphMemDiscoveryService:
    Type: AWS::ServiceDiscovery::Service
    Condition: GraphMemEnabled
    Properties:
      Name: graphmem
      NamespaceId: !Ref CloudMapNamespace
      DnsConfig:
        DnsRecords:
          - Type: A
            TTL: 10
      HealthCheckCustomConfig:
        FailureThreshold: 1

  MCPGraphMemSG:
    Type: AWS::EC2::SecurityGroup
    Condition: GraphMemEnabled
    Properties:
      GroupDescription: !Sub '${ProjectName}-${Environment} MCP GraphMem (public, internet access for AWS APIs)'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8003
          ToPort: 8003
          SourceSecurityGroupId: !Ref ComputeSGId
          Description: MCP HTTP from OpenClaw gateway
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS to AWS APIs via internet
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-mcp-graphmem-sg'

  # NFS egress from GraphMem to EFS (Architect Condition 1e)
  MCPGraphMemSGEgressToEFS:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: GraphMemEnabled
    Properties:
      GroupId: !Ref MCPGraphMemSG
      IpProtocol: tcp
      FromPort: 2049
      ToPort: 2049
      DestinationSecurityGroupId: !Ref EFSSecurityGroupId
      Description: NFS to EFS

  # NFS ingress to EFS from GraphMem (Architect Condition 1d)
  EFSIngressFromGraphMem:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: GraphMemEnabled
    Properties:
      GroupId: !Ref EFSSecurityGroupId
      IpProtocol: tcp
      FromPort: 2049
      ToPort: 2049
      SourceSecurityGroupId: !Ref MCPGraphMemSG
      Description: NFS from GraphMem service

  ComputeSGEgressToMCPGraphMem:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: GraphMemEnabled
    Properties:
      GroupId: !Ref ComputeSGId
      IpProtocol: tcp
      FromPort: 8003
      ToPort: 8003
      DestinationSecurityGroupId: !Ref MCPGraphMemSG
      Description: MCP HTTP to GraphMem service

  MCPGraphMemTaskRole:
    Type: AWS::IAM::Role
    Condition: GraphMemEnabled
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-mcp-graphmem-task-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
