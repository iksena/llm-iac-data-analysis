---
# Bashlinux::Redis::Elasticache Security Group
#
#   Cloudformation template to deploy a security group
#   for an Elasticache cluster exposing the Redis port
#   on a private subnet
#
#   Manuel F Martinez
#   Bashlinux
#   Los Angeles, CA
#
AWSTemplateFormatVersion: "2010-09-09"
Description: Elasticache Redis Security Group template

###############################################################################
Parameters:

  Environment:
    Description: Redis cluster environment
    Type: String
    MinLength: "1"
    MaxLength: "20"
    Default: staging
    AllowedValues: [ "prod", "staging" ]
    ConstraintDescription: >
      Environment name can only contain "prod" or "staging".

  Organization:
    Description: Organization or Customer name
    Type: String
    MinLength: "1"
    MaxLength: "32"
    Default: bashlinux
    AllowedPattern: "[a-zA-Z0-9\\-]*"
    ConstraintDescription: >
      Name of the organization must contains only letters, numbers and hyphens

###############################################################################
Resources:

  ElasticacheRedisSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Enable access to the Redis cluster port
      VpcId: !ImportValue
        "Fn::Sub": "bashlinux-${Environment}-VpcId"
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: "6379"
        ToPort: "6379"
        SourceSecurityGroupId: !ImportValue
          "Fn::Sub": "bashlinux-${Environment}-Ec2BastionSecurityGroupId"
      SecurityGroupEgress:
      - IpProtocol: "-1"
        FromPort: "0"
        ToPort: "65535"
        CidrIp: 0.0.0.0/0
      Tags:
      - Key: Name
        Value: !Sub "${Organization}-${Environment}-redis-sg"
      - Key: bashlinux:organization-name
        Value: !Ref Organization
      - Key: bashlinux:environment-name
        Value: !Ref Environment
      - Key: bashlinux:application-id
        Value: !Ref AWS::StackName
      - Key: bashlinux:can-delete
        Value: "false"

  ingressElasticacheReplica:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: "Redis: Access from the Elasticache replica"
      GroupId: !GetAtt ElasticacheRedisSecurityGroup.GroupId
      SourceSecurityGroupId: !GetAtt ElasticacheRedisSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: "6379"
      ToPort: "6379"

###############################################################################
Outputs:

  ElasticacheRedisSecurityGroupId:
    Description: "SecurityGroup: Elasticache Redis Security Group Id"
    Value: !GetAtt ElasticacheRedisSecurityGroup.GroupId
    Export:
      Name: !Sub "${Organization}-${Environment}-ElasticacheRedisSecurityGroupId"