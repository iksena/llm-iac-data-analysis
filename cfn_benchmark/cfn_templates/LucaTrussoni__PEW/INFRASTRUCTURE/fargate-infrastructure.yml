AWSTemplateFormatVersion: "2010-09-09"
Description: Fargate infrastructure (Cluster, Task Definition and Roles)
Parameters:
  ModelTable:
    Type: String
    Default: "Models"
  TickerTable:
    Type: String
    Default: "Tickers"
  ResultTable:
    Type: String
    Default: "Results"
  RepoName:
    Type: String
    Default: "pew-task"
  ImgTag:
    Type: String
    Default: "latest"
Resources:
  FargateExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: PEW-FargateExecutionRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
  PEWAppRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: PEW-AppRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PEWTaskPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadMarketDataFromS3
                Effect: Allow
                Action: "s3:GetObject"
                Resource:
                  - !Sub "arn:aws:s3:::pew-marketdata-${AWS::AccountId}"
                  - !Sub "arn:aws:s3:::pew-marketdata-${AWS::AccountId}/*"
              - Sid: WriteReportToS3
                Effect: Allow
                Action: "s3:PutObject"
                Resource:
                  - !Sub "arn:aws:s3:::pew-report-${AWS::AccountId}"
                  - !Sub "arn:aws:s3:::pew-report-${AWS::AccountId}/*"
              - Sid: GetItemFromTable
                Effect: Allow
                Action: "dynamodb:GetItem"
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TickerTable}"
              - Sid: PutItemInTable
                Effect: Allow
                Action: "dynamodb:PutItem"
                Resource:
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TickerTable}"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ResultTable}"
              - Sid: QueryTable
                Effect: Allow
                Action: "dynamodb:Query"
                Resource:
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ModelTable}"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ModelTable}/index/Activity"
              - Sid: ParametersRetrieval
                Effect: Allow
                Action:
                  - "ssm:GetParametersByPath"
                  - "ssm:GetParameters"
                  - "ssm:GetParameter"
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/pew/*"
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: PEW-Fargate-Cluster
      CapacityProviders:
        - FARGATE
        - FARGATE_SPOT
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1
      ClusterSettings:
      - Value: "disabled"
        Name: "containerInsights"
      Configuration:
        ExecuteCommandConfiguration:
          Logging: "DEFAULT"
  FargateLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/pew-fargate-tasks
      RetentionInDays: 7
  FargateTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: pew-task-family
      Cpu: "1024"
      Memory: "3072"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      TaskRoleArn: !GetAtt PEWAppRole.Arn
      ExecutionRoleArn: !GetAtt FargateExecutionRole.Arn
      RuntimePlatform:
        OperatingSystemFamily: "LINUX"
        CpuArchitecture: "X86_64"
      ContainerDefinitions:
        - Name: pew-app-container
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${RepoName}:${ImgTag}"
          Essential: true
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref FargateLogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: ecs

Outputs:
  ClusterName:
    Value: !Ref ECSCluster
    Export:
      Name: PEW-CLUSTER-ID

  TaskDefinitionArn:
    Value: !Ref FargateTaskDefinition
    Export:
      Name: PEW-TASK-DEF-ID