AWSTemplateFormatVersion: '2010-09-09'
Description: Service Catalog Test - Networks
Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 172.16.0.0/16
      EnableDnsSupport: 'true'
      EnableDnsHostnames: 'true'
      Tags:
        - Key: Env
          Value: test
        - Key: Name
          Value: sc-test-vpc

  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone:
        Fn::Select:
          - 0
          - Fn::GetAZs: ""
      CidrBlock: 172.16.1.0/24
      VpcId: !Ref VPC
      Tags:
        - Key: Env
          Value: test
        - Key: Name
          Value: sc-test-subnet-1

  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone:
        Fn::Select:
          - 1
          - Fn::GetAZs: ""
      CidrBlock: 172.16.2.0/24
      VpcId: !Ref VPC
      Tags:
        - Key: Env
          Value: test
        - Key: Name
          Value: sc-test-subnet-2

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SC Test Security Group
      GroupName: sc-lab-test-sg
      VpcId: !Ref VPC
      Tags:
        - Key: Env
          Value: test
        - Key: Name
          Value: sc-test-sg

  KMSKey:
    Type: AWS::KMS::Key
    # Without an explicit DependsOn, CFN has no dependency edge on these
    # roles (they're referenced by hardcoded ARN string, not Ref/GetAtt), so
    # the key can be created before the roles exist -- surfaced on the real
    # AWS check as "Policy contains a statement with one or more invalid
    # principals" (LocalStack doesn't validate KMS principals at all).
    DependsOn:
      - ScAlbProductRole
      - ScAutoscalingProductRole
      - ScAlbListenerProductRole
      - ScAlbTargetProductRole
      - ScDmsEndpointProductRole
      - ScDmsInstanceProductRole
      - ScDynamodbProductRole
      - ScEbsProductRole
      - ScEfsProductRole
      - ScElasticacheProductRole
      - ScElasticsearchProductRole
      - ScFsxProductRole
      - ScKinesisProductRole
      - ScSnsProductRole
      - ScSqsProductRole
      - ScSagemakerProductRole
      - ScS3ProductRole
    Properties:
      Description: "Test KMS Key"
      KeyPolicy:
        Version: "2012-10-17"
        Id: "key-default-1"
        Statement:
         -
            Sid: "Enable IAM User Permissions"
            Effect: "Allow"
            Principal:
              AWS:
                - !Sub 'arn:aws:iam::${AWS::AccountId}:root'
                - !Sub 'arn:aws:iam::${AWS::AccountId}:role/sc-alb-product-role'
                - !Sub 'arn:aws:iam::${AWS::AccountId}:role/sc-autoscaling-product-role'
                - !Sub 'arn:aws:iam::${AWS::AccountId}:role/sc-alb-listener-product-role'
                - !Sub 'arn:aws:iam::${AWS::AccountId}:role/sc-alb-target-product-role'
                - !Sub 'arn:aws:iam::${AWS::AccountId}:role/sc-dms-endpoint-product-role'
                - !Sub 'arn:aws:iam::${AWS::AccountId}:role/sc-dms-instance-product-role'
                - !Sub 'arn:aws:iam::${AWS::AccountId}:role/sc-dynamodb-product-role'
                - !Sub 'arn:aws:iam::${AWS::AccountId}:role/sc-ebs-product-role'
                - !Sub 'arn:aws:iam::${AWS::AccountId}:role/sc-efs-product-role'
                - !Sub 'arn:aws:iam::${AWS::AccountId}:role/sc-elasticache-product-role'
                - !Sub 'arn:aws:iam::${AWS::AccountId}:role/sc-elasticsearch-product-role'
                - !Sub 'arn:aws:iam::${AWS::AccountId}:role/sc-fsx-product-role'
                - !Sub 'arn:aws:iam::${AWS::AccountId}:role/sc-kinesis-product-role'
                - !Sub 'arn:aws:iam::${AWS::AccountId}:role/sc-sns-product-role'
                - !Sub 'arn:aws:iam::${AWS::AccountId}:role/sc-sqs-product-role'
                - !Sub 'arn:aws:iam::${AWS::AccountId}:role/sc-sagemaker-product-role'
                - !Sub 'arn:aws:iam::${AWS::AccountId}:role/sc-s3-product-role'
            Action: "kms:*"
            Resource: "*"

  # AWS::DMS::ReplicationSubnetGroup requires an IAM role literally named
  # "dms-vpc-role" (with the AmazonDMSVPCManagementRole managed policy) to
  # already exist in the account -- DMS does not create it automatically,
  # and its absence fails subnet-group creation with "The IAM Role ...
  # dms-vpc-role is not configured properly." Create it here rather than
  # assuming it as an account prerequisite.
  DMSVpcRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dms-vpc-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: dms.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonDMSVPCManagementRole

  DMSReplicationSubnetGroup:
    Type: AWS::DMS::ReplicationSubnetGroup
    DependsOn: DMSVpcRole
    Properties:
      ReplicationSubnetGroupIdentifier: "dmstestreplicationgroup"
      ReplicationSubnetGroupDescription: "Test DMS Replication Group"
      SubnetIds:
        - !Ref SubnetA
        - !Ref SubnetB

  ECSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      Description: "Cache Subnet Group"
      CacheSubnetGroupName: ec-test-subnet-group
      SubnetIds:
        - !Ref SubnetA
        - !Ref SubnetB

  ECSecurityGroup:
    Type: AWS::ElastiCache::SecurityGroup
    Properties:
      Description: ec-test-security-group

  SageMakerRole:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: sc-test-sagemaker-role
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - sagemaker.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSageMakerFullAccess

  # The KMS key policy below grants access to these AWS Service Catalog
  # product-launch roles, which the original template referenced by ARN but
  # never created itself (self-containment gap -- see CLAUDE.md's manual-fix
  # conventions). Minimal stub roles, matching the naming/trust pattern of
  # roles Service Catalog would actually provision per launched product type.
  ScAlbProductRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sc-alb-product-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - servicecatalog.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Path: /
  ScAutoscalingProductRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sc-autoscaling-product-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - servicecatalog.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Path: /
  ScAlbListenerProductRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: sc-alb-listener-product-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
