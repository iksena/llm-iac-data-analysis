AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  LMI Blog — Use Case 2: Data Aggregation ETL (Standard Lambda)
  Memory-intensive workload — GC tuning and heap management comparison.

Parameters:
  MemorySize:
    Type: Number
    Default: 2048
    AllowedValues: [512, 1024, 2048, 3008]
    Description: Lambda memory in MB. Higher = more CPU + heap for aggregation.
  GarbageCollector:
    Type: String
    Default: G1
    AllowedValues: [G1, Parallel, Shenandoah]
    Description: JVM garbage collector. G1=default, Parallel=throughput, Shenandoah=low-pause.

Mappings:
  GcFlags:
    G1:
      Flag: "-XX:+UseG1GC -XX:MaxGCPauseMillis=100"
    Parallel:
      Flag: "-XX:+UseParallelGC"
    Shenandoah:
      Flag: "-XX:+UseShenandoahGC"

Globals:
  Function:
    Tracing: Active
    CodeUri: target/data-aggregation-1.0.0-SNAPSHOT.jar
    Handler: org.springframework.cloud.function.adapter.aws.FunctionInvoker::handleRequest
    Runtime: java25
    Timeout: 120
    MemorySize: !Ref MemorySize
    Architectures: [x86_64]
    Environment:
      Variables:
        SENSOR_TABLE_NAME: !Ref SensorTable
        OUTPUT_BUCKET_NAME: !Ref OutputBucket
        MAIN_CLASS: com.aws.lmi.etl.DataAggregationApplication
        JAVA_TOOL_OPTIONS: !Sub
          - "${GcFlag} -Xlog:gc:stderr:time,tags"
          - GcFlag: !FindInMap [GcFlags, !Ref GarbageCollector, Flag]

Resources:
  AggregationApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Name: lmi-blog-etl-standard

  AggregateDataFunction:
    Type: AWS::Serverless::Function
    Properties:
      Environment:
        Variables:
          SPRING_CLOUD_FUNCTION_DEFINITION: dataAggregatorFunction
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SensorTable
        - S3CrudPolicy:
            BucketName: !Ref OutputBucket
      Events:
        PostAggregate:
          Type: Api
          Properties:
            RestApiId: !Ref AggregationApi
            Path: /aggregate
            Method: post

  AggregateDataFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AggregateDataFunction}"
      RetentionInDays: 7

  SensorTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-sensors"
      AttributeDefinitions:
        - AttributeName: deviceId
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: deviceId
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST

  OutputBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-output-${AWS::AccountId}"
      LifecycleConfiguration:
        Rules:
          - Id: Cleanup
            Status: Enabled
            ExpirationInDays: 7

Outputs:
  ApiEndpoint:
    Value: !Sub "https://${AggregationApi}.execute-api.${AWS::Region}.amazonaws.com/prod/aggregate"
  SensorTableName:
    Value: !Ref SensorTable
  OutputBucketName:
    Value: !Ref OutputBucket