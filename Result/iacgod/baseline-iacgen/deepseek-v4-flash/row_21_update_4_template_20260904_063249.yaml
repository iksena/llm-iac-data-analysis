AWSTemplateFormatVersion: "2010-09-09"
Description: "CloudFormation template for EC2 Image Builder pipeline to create a CIS-hardened Amazon Linux 2023 ARM AMI pre-configured for Elastic Beanstalk, with daily builds, vulnerability scanning, 50GB root volume, cross-account sharing, and 6-month lifecycle policy."

Parameters:
  ParentImageArn:
    Type: String
    Description: "ARN of the CIS hardened Amazon Linux 2023 ARM parent image (e.g., arn:aws:imagebuilder:us-east-1:123456789012:image/cis-hardened-image-level-1-on-amazon-linux-2023-arm-r5sqt5uxgygqi/1.0.0/1)"
  OrganizationId:
    Type: String
    Description: "AWS Organization ID to share the AMI with (e.g., o-abcdefghij)"
  DevAccountId:
    Type: String
    Description: "AWS account ID for the dev environment"
    AllowedPattern: "^[0-9]{12}$"
  ProdAccountId:
    Type: String
    Description: "AWS account ID for the prod environment"
    AllowedPattern: "^[0-9]{12}$"
  ImageNamePrefix:
    Type: String
    Description: "Prefix for the AMI name"
    Default: "cis-eb-ami"

Resources:
  ImageBuilderServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: imagebuilder.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/EC2ImageBuilderServiceRolePolicy
      Policies:
        - PolicyName: ImageBuilderCustomPermissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:CreateTags
                  - ec2:ModifyImageAttribute
                  - ec2:ModifySnapshotAttribute
                  - ec2:CopyImage
                  - ec2:RegisterImage
                  - ec2:DescribeImages
                  - ec2:DescribeSnapshots
                  - ec2:DescribeTags
                  - ec2:RunInstances
                  - ec2:TerminateInstances
                  - ec2:StopInstances
                  - ec2:StartInstances
                  - ec2:CreateSnapshot
                  - ec2:DeleteSnapshot
                  - ec2:CreateVolume
                  - ec2:DeleteVolume
                  - ec2:AttachVolume
                  - ec2:DetachVolume
                  - ec2:CreateKeyPair
                  - ec2:DeleteKeyPair
                  - ec2:ImportKeyPair
                  - ec2:DescribeKeyPairs
                  - ec2:CreateSecurityGroup
                  - ec2:DeleteSecurityGroup
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:RevokeSecurityGroupEgress
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSubnets
                  - ec2:DescribeVpcs
                  - ec2:DescribeNetworkInterfaces
                  - ec2:CreateNetworkInterface
                  - ec2:DeleteNetworkInterface
                  - ec2:AttachNetworkInterface
                  - ec2:DetachNetworkInterface
                  - ec2:DescribeAvailabilityZones
                  - ec2:DescribeAccountAttributes
                  - ec2:DescribeInstanceTypeOfferings
