AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: |
  DVA-C02 Lab 1.6 — Destinations and DLQ
  Both OnSuccess and OnFailure destinations + a DLQ on the same function.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 5
    MemorySize: 128
    LoggingConfig:
      LogFormat: JSON

Resources:
  SuccessQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: dva-lab-01-06-success

  FailureQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: dva-lab-01-06-failure

  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: dva-lab-01-06-dlq

  FailingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dva-lab-01-06-fn
      CodeUri: src/
      Handler: app.handler
      # Legacy DLQ (still supported but Destinations is the modern choice)
      DeadLetterQueue:
        Type: SQS
        TargetArn: !GetAtt DeadLetterQueue.Arn
      EventInvokeConfig:
        MaximumRetryAttempts: 2
        MaximumEventAgeInSeconds: 600
        DestinationConfig:
          OnSuccess:
            Type: SQS
            Destination: !GetAtt SuccessQueue.Arn
          OnFailure:
            Type: SQS
            Destination: !GetAtt FailureQueue.Arn
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt SuccessQueue.QueueName
        - SQSSendMessagePolicy:
            QueueName: !GetAtt FailureQueue.QueueName
        - SQSSendMessagePolicy:
            QueueName: !GetAtt DeadLetterQueue.QueueName

Outputs:
  FunctionName:
    Value: !Ref FailingFunction
  SuccessQueueUrl:
    Value: !Ref SuccessQueue
  FailureQueueUrl:
    Value: !Ref FailureQueue
  DlqUrl:
    Value: !Ref DeadLetterQueue