AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Lab 5.5 — Kinesis Data Stream + Lambda consumer with on-failure DLQ

Resources:
  Stream:
    Type: AWS::Kinesis::Stream
    Properties:
      Name: dva-lab-05-05-stream
      StreamModeDetails:
        StreamMode: ON_DEMAND
      RetentionPeriodHours: 24

  FailedBatchDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: dva-lab-05-05-failed-batches

  ConsumerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaKinesisExecutionRole
      Policies:
        - PolicyName: SendToDlq
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt FailedBatchDlq.Arn

  Consumer:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dva-lab-05-05-consumer
      Runtime: python3.12
      Handler: handler.handler
      Role: !GetAtt ConsumerRole.Arn
      CodeUri: src/
      Timeout: 30

  Esm:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt Stream.Arn
      FunctionName: !Ref Consumer
      StartingPosition: LATEST
      BatchSize: 100
      MaximumBatchingWindowInSeconds: 5
      ParallelizationFactor: 2
      BisectBatchOnFunctionError: true
      MaximumRetryAttempts: 3
      MaximumRecordAgeInSeconds: 3600
      DestinationConfig:
        OnFailure:
          Destination: !GetAtt FailedBatchDlq.Arn

Outputs:
  StreamName:
    Value: !Ref Stream
  StreamArn:
    Value: !GetAtt Stream.Arn
  DlqUrl:
    Value: !Ref FailedBatchDlq