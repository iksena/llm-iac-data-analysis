AWSTemplateFormatVersion: "2010-09-09"
Description: "EC2 Image Builder pipeline for Amazon Linux 2023 AMIs (x86 and arm64) with Docker, Python packages, and public/organization sharing."

Parameters:
  ImageVersion:
    Type: String
    Default: "1.0.0"
    Description: "Version tag for the AMI (e.g., 1.0.0)"
  RootVolumeSize:
    Type: Number
    Default: 32
    MinValue: 8
    MaxValue: 500
    Description: "Size of the root volume in GB"
  OrganizationArn:
    Type: String
    Default: "arn:aws:organizations::123456789012:organization/o-xxxxxxxxxx"
    Description: "ARN of the AWS Organization to share AMIs with (e.g., arn:aws:organizations::<management-account-id>:organization/o-<org-id>)"
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: "VPC ID for the build instance"
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: "Subnet ID for the build instance"
  SecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
    Description: "Security group IDs for the build instance"

Resources:
  # IAM Role for Image Builder Service (pipeline orchestration)
  ImageBuilderServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: imagebuilder.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSImageBuilderServiceRolePolicy
      Path: "/"

  # IAM Role for the build instance (EC2 instance profile)
  BuildInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ImageBuilderBuildInstancePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource: "*"
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
      Path: "/"

  BuildInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref BuildInstanceRole
      Path: "/"

  # Infrastructure Configuration (shared)
  InfrastructureConfiguration:
    Type: AWS::ImageBuilder::InfrastructureConfiguration
    Properties:
      Name: !Sub "${AWS::StackName}-infra-config"
      Description: "Shared infrastructure configuration for Image Builder"
      InstanceProfileName: !Ref BuildInstanceProfile
      SecurityGroupIds: !Ref SecurityGroupIds
      SubnetId: !Ref SubnetId
      Logging:
        S3Logs:
          S3BucketName: !Sub "imagebuilder-logs-${AWS::AccountId}-${AWS::Region}"
          S3KeyPrefix: !Sub "${AWS::StackName}/"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-infra"

  # S3 Bucket for logs (auto-created)
  ImageBuilderLogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "imagebuilder-logs-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-logs"

  # Custom Component for software installation and testing
  SoftwareComponent:
    Type: AWS::ImageBuilder::Component
    Properties:
      Name: !Sub "${AWS::StackName}-software-component"
      Description: "Installs Docker, Docker Compose, Python packages, enables SSM user sudo, and runs tests"
      Platform: "Linux"
      Version: "1.0.0"
      Data: |
        name: SoftwareInstallAndTest
        schemaVersion: 1.0
        phases:
          - phase: build
            steps:
              - action: ExecuteBash
                name: InstallDocker
                inputs:
                  commands:
                    - dnf install -y docker
                    - systemctl enable docker
                    - systemctl start docker
              - action: ExecuteBash
                name: InstallDockerCompose
                inputs:
                  commands:
                    - curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
                    - chmod +x /usr/local/bin/docker-compose
              - action: ExecuteBash
                name: InstallPythonPackages
                inputs:
                  commands:
                    - pip3 install synapseclient pandas pysftp
              - action: ExecuteBash
                name: EnableSSMUserSudo
                inputs:
                  commands:
                    - echo "ssm-user ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers.d/ssm-user
                    - chmod 440 /etc/sudoers.d/ssm-user
          - phase: test
            steps:
              - action: ExecuteBash
                name: TestDockerCompose
                inputs:
                  commands:
                    - docker-compose --version
              - action: ExecuteBash
                name: TestPythonImports
                inputs:
                  commands:
                    - python3 -c "import synapseclient; import pandas; import pysftp; print('All imports successful')"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-component"

  # Image Recipe for x86
  ImageRecipeX86:
    Type: AWS::ImageBuilder::ImageRecipe
    Properties:
      Name: !Sub "${AWS::StackName}-recipe-x86"
      Description: "Amazon Linux 2023 x86 with Docker and Python packages"
      Version: !Ref ImageVersion
      ParentImage: !Sub "arn:aws:imagebuilder:${AWS::Region}:aws:image/amazon-linux-2023-x86-latest/x.x.x"
      Components:
        - ComponentArn: !Ref SoftwareComponent
      BlockDeviceMappings:
        - DeviceName: "/dev/xvda"
          Ebs:
            VolumeSize: !Ref RootVolumeSize
            VolumeType: gp3
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-recipe-x86"

  # Image Recipe for arm64
  ImageRecipeArm64:
    Type: AWS::ImageBuilder::ImageRecipe
    Properties:
      Name: !Sub "${AWS::StackName}-recipe-arm64"
      Description: "Amazon Linux 2023 arm64 with Docker and Python packages"
      Version: !Ref ImageVersion
      ParentImage: !Sub "arn:aws:imagebuilder:${AWS::Region}:aws:image/amazon-linux-2023-arm64-latest/x.x.x"
      Components:
        - ComponentArn: !Ref SoftwareComponent
      BlockDeviceMappings:
        - DeviceName: "/dev/xvda"
          Ebs:
            VolumeSize: !Ref RootVolumeSize
            VolumeType: gp3
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-recipe-arm64"

  # Distribution Configuration (shared)
  DistributionConfiguration:
    Type: AWS::ImageBuilder::DistributionConfiguration
    Properties:
      Name: !Sub "${AWS::StackName}-dist-config"
      Description: "Distributes AMIs publicly and shares with organization"
      Distributions:
        - Region: !Ref AWS::Region
          AmiDistributionConfiguration:
            Name: !Sub "custom-amzn2023-${ImageVersion}-{{ imagebuilder:buildDate }}"
            Description: !Sub "Amazon Linux 2023 AMI with Docker and Python packages, version ${ImageVersion}"
            LaunchPermissionConfiguration:
              UserGroups:
                - "all"
              OrganizationArns:
                - !Ref OrganizationArn
            AmiTags:
              StackName: !Ref AWS::StackName
            KmsKeyId: ""  # Optional, leave empty for default
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-dist"

  # Image Pipeline for x86
  ImagePipelineX86:
    Type: AWS::ImageBuilder::ImagePipeline
    Properties:
      Name: !Sub "${AWS::StackName}-pipeline-x86"
      Description: "Builds x86 AMI"
      ImageRecipeArn: !Ref ImageRecipeX86
      InfrastructureConfigurationArn: !Ref InfrastructureConfiguration
      DistributionConfigurationArn: !Ref DistributionConfiguration
      ImageTestsConfiguration:
        ImageTestsEnabled: true
        TimeoutMinutes: 60
      Schedule:
        ScheduleExpression: ""  # Manual trigger only
        PipelineExecutionStartCondition: "EXPRESSION_MATCH_AND_DEPENDENCY_UPDATES_AVAILABLE"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-pipeline-x86"

  # Image Pipeline for arm64
  ImagePipelineArm64:
    Type: AWS::ImageBuilder::ImagePipeline
    Properties:
      Name: !Sub "${AWS::StackName}-pipeline-arm64"
      Description: "Builds arm64 AMI"
      ImageRecipeArn: !Ref ImageRecipeArm64
      InfrastructureConfigurationArn: !Ref InfrastructureConfiguration
      DistributionConfigurationArn: !Ref DistributionConfiguration
      ImageTestsConfiguration:
        ImageTestsEnabled: true
        TimeoutMinutes: 60
      Schedule:
        ScheduleExpression: ""  # Manual trigger only
        PipelineExecutionStartCondition: "EXPRESSION_MATCH_AND_DEPENDENCY_UPDATES_AVAILABLE"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-pipeline-arm64"

Outputs:
  PipelineX86Arn:
    Description: "ARN of the x86 Image Builder pipeline"
    Value: !Ref ImagePipelineX86
  PipelineArm64Arn:
    Description: "ARN of the arm64 Image Builder pipeline"
    Value: !Ref ImagePipelineArm64
  RecipeX86Arn:
    Description: "ARN of the x86 image recipe"
    Value: !Ref ImageRecipeX86
  RecipeArm64Arn:
    Description: "ARN of the arm64 image recipe"
    Value: !Ref ImageRecipeArm64
  DistributionConfigurationArn:
    Description: "ARN of the distribution configuration"
    Value: !Ref DistributionConfiguration
  InfrastructureConfigurationArn:
    Description: "ARN of the infrastructure configuration"
    Value: !Ref InfrastructureConfiguration