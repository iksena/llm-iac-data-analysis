AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  LambdaStore — Observability Stack
  DVA-C02 Stage S7: X-Ray, CloudWatch Logs, Metrics, Alarms, Dashboard

Parameters:
  Stage:
    Type: String
  ProjectName:
    Type: String
    Default: lambdastore
  AlertEmail:
    Type: String
    Default: ''

Resources:

  # ── X-Ray Sampling Rule ──────────────────────────────────────────────────────
  XRaySamplingRule:
    Type: AWS::XRay::SamplingRule
    Properties:
      SamplingRule:
        RuleName: !Sub ${ProjectName}-${Stage}
        Priority: 1000
        ReservoirSize: 5
        FixedRate: 0.05       # sample 5% of requests in prod
        ServiceName: lambdastore
        ServiceType: '*'
        Host: '*'
        HTTPMethod: '*'
        URLPath: '*'
        ResourceARN: '*'
        Version: 1

  # ── CloudWatch Log Groups ────────────────────────────────────────────────────
  ProductsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ProjectName}-${Stage}-products
      RetentionInDays: 14

  CartLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ProjectName}-${Stage}-cart
      RetentionInDays: 14

  OrdersLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ProjectName}-${Stage}-orders
      RetentionInDays: 14

  # ── SNS Alert Topic ──────────────────────────────────────────────────────────
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${ProjectName}-${Stage}-alerts
      Subscriptions:
        - !If
          - HasAlertEmail
          - Protocol: email
            Endpoint: !Ref AlertEmail
          - !Ref AWS::NoValue

  # ── CloudWatch Alarms ────────────────────────────────────────────────────────
  ProductsErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectName}-${Stage}-products-errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Sub ${ProjectName}-${Stage}-products
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  OrdersErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectName}-${Stage}-orders-errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Sub ${ProjectName}-${Stage}-orders
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  # ── CloudWatch Dashboard ─────────────────────────────────────────────────────
  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub ${ProjectName}-${Stage}
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "properties": {
                "title": "Lambda Invocations",
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "${ProjectName}-${Stage}-products"],
                  [".", ".", ".", "${ProjectName}-${Stage}-orders"],
                  [".", ".", ".", "${ProjectName}-${Stage}-cart"]
                ],
                "period": 60,
                "stat": "Sum",
                "view": "timeSeries"
              }
            },
            {
              "type": "metric",
              "properties": {
                "title": "Lambda Errors",
                "metrics": [
                  ["AWS/Lambda", "Errors", "FunctionName", "${ProjectName}-${Stage}-products"],
                  [".", ".", ".", "${ProjectName}-${Stage}-orders"]
                ],
                "period": 60,
                "stat": "Sum",
                "view": "timeSeries"
              }
            },
            {
              "type": "metric",
              "properties": {
                "title": "Lambda Duration (p99)",
                "metrics": [
                  ["AWS/Lambda", "Duration", "FunctionName", "${ProjectName}-${Stage}-products", {"stat": "p99"}],
                  [".", ".", ".", "${ProjectName}-${Stage}-orders", {"stat": "p99"}]
                ],
                "period": 60,
                "view": "timeSeries"
              }
            }
          ]
        }

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]

Outputs:
  AlertTopicArn:
    Value: !Ref AlertTopic
    Export:
      Name: !Sub ${ProjectName}-${Stage}-AlertTopicArn

  DashboardUrl:
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home#dashboards:name=${ProjectName}-${Stage}
    Export:
      Name: !Sub ${ProjectName}-${Stage}-DashboardUrl