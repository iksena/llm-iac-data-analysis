AWSTemplateFormatVersion: "2010-09-09"
Description: "Security Hub Automation Rules to suppress accepted findings across the organization"
Parameters:
  ExcludedIAMUser:
    Type: String
    Default: "example-user"
    Description: "Single IAM user name to exclude from IAM finding suppression (use empty string to exclude none)"
  SubAccountId:
    Type: String
    Default: "111111111111"
    Description: "AWS account ID for CIS benchmark suppression scope"
  PublicBucketName:
    Type: String
    Default: "my-public-bucket"
    Description: "Single S3 bucket name that is intentionally public"
  EBSEncryptionAccountId:
    Type: String
    Default: "222222222222"
    Description: "AWS account ID for EBS default encryption suppression"
  UnusedCredentialAccount:
    Type: String
    Default: "333333333333"
    Description: "Single AWS account ID for unused credential and access key rotation suppression"
  GuardDutyFindingType:
    Type: String
    Default: "GuardDuty/UnauthorizedAccess:EC2/SSHBruteForce"
    Description: "GuardDuty finding type to suppress"
Resources:
  IAMSuppressionRule:
    Type: "AWS::SecurityHub::AutomationRule"
    Properties:
      RuleName: "IAMSuppressionRule"
      Description: "Suppresses accepted IAM-related findings across the organization, excluding a specific user"
      RuleStatus: ENABLED
      RuleOrder: 1
      Criteria:
        Type:
          - Comparison: PREFIX
            Value: "Software and Configuration Checks/IAM"
          - Comparison: PREFIX
            Value: "IAM Policy Monitoring"
          - Comparison: PREFIX
            Value: "IAM Access Analyzer"
        ResourceId:
          - Comparison: NOT_CONTAINS
            Value: !Ref ExcludedIAMUser
      Actions:
        - Type: FINDING_FIELDS_UPDATE
          FindingFieldsUpdate:
            Workflow:
              Status: SUPPRESSED
            Note:
              Text: "Suppressed as reviewed and accepted IAM findings, excluding specific user."
              UpdatedBy: "AutomationRule"
  CISSubAccountRule:
    Type: "AWS::SecurityHub::AutomationRule"
    Properties:
      RuleName: "CISSubAccountRule"
      Description: "Suppresses CIS benchmark findings for a designated sub-account"
      RuleStatus: ENABLED
      RuleOrder: 2
      Criteria:
        Type:
          - Comparison: PREFIX
            Value: "CIS AWS Foundations Benchmark"
        AwsAccountId:
          - Comparison: EQUALS
            Value: !Ref SubAccountId
      Actions:
        - Type: FINDING_FIELDS_UPDATE
          FindingFieldsUpdate:
            Workflow:
              Status: SUPPRESSED
            Note:
              Text: "Suppressed CIS benchmark findings for sub-account as reviewed."
              UpdatedBy: "AutomationRule"
  BroadFrameworkSuppressionRule:
    Type: "AWS::SecurityHub::AutomationRule"
    Properties:
      RuleName: "BroadFrameworkSuppressionRule"
      Description: "Suppresses CIS and AWS Foundational Security Best Practices findings including admin ports, S3 public access, and Config coverage"
      RuleStatus: ENABLED
      RuleOrder: 3
      Criteria:
        Type:
          - Comparison: PREFIX
            Value: "CIS AWS Foundations Benchmark"
          - Comparison: PREFIX
            Value: "AWS Foundational Security Best Practices"
      Actions:
        - Type: FINDING_FIELDS_UPDATE
          FindingFieldsUpdate:
            Workflow:
              Status: SUPPRESSED
            Note:
              Text: "Suppressed accepted CIS and AWS Foundational Security Best Practices findings, including security group admin ports, S3 public/HTTP access, and AWS Config coverage."
              UpdatedBy: "AutomationRule"
  PublicBucketSuppressionRule:
    Type: "AWS::SecurityHub::AutomationRule"
    Properties:
      RuleName: "PublicBucketSuppressionRule"
      Description: "Suppresses public-access findings for a known intentionally public bucket"
      RuleStatus: ENABLED
      RuleOrder: 4
      Criteria:
        ResourceId:
          - Comparison: CONTAINS
            Value: !Ref PublicBucketName
        Type:
          - Comparison: PREFIX
            Value: "S3 Bucket"
      Actions:
        - Type: FINDING_FIELDS_UPDATE
          FindingFieldsUpdate:
            Workflow:
              Status: SUPPRESSED
            Note:
              Text: "Suppressed public-access findings for known intentionally public bucket."
              UpdatedBy: "AutomationRule"
  EBSEncryptionSuppressionRule:
    Type: "AWS::SecurityHub::AutomationRule"
    Properties:
      RuleName: "EBSEncryptionSuppressionRule"
      Description: "Suppresses EBS default encryption finding for one specific account"
      RuleStatus: ENABLED
      RuleOrder: 5
      Criteria:
        Type:
          - Comparison: PREFIX
            Value: "Software and Configuration Checks/EC2/EBS"
        AwsAccountId:
          - Comparison: EQUALS
            Value: !Ref EBSEncryptionAccountId
      Actions:
        - Type: FINDING_FIELDS_UPDATE
          FindingFieldsUpdate:
            Workflow:
              Status: SUPPRESSED
            Note:
              Text: "Suppressed EBS default encryption finding for the specified account."
              UpdatedBy: "AutomationRule"
  UnusedCredentialSuppressionRule:
    Type: "AWS::SecurityHub::AutomationRule"
    Properties:
      RuleName: "UnusedCredentialSuppressionRule"
      Description: "Suppresses unused-credential and access-key-rotation findings for one specific account"
      RuleStatus: ENABLED
      RuleOrder: 6
      Criteria:
        Type:
          - Comparison: PREFIX
            Value: "UnusedCredential"
          - Comparison: PREFIX
            Value: "AccessKeyRotation"
        AwsAccountId:
          - Comparison: EQUALS
            Value: !Ref UnusedCredentialAccount
      Actions:
        - Type: FINDING_FIELDS_UPDATE
          FindingFieldsUpdate:
            Workflow:
              Status: SUPPRESSED
            Note:
              Text: "Suppressed unused credential and access key rotation findings for infrequent automation account."
              UpdatedBy: "AutomationRule"
  GuardDutySuppressionRule:
    Type: "AWS::SecurityHub::AutomationRule"
    Properties:
      RuleName: "GuardDutySuppressionRule"
      Description: "Suppresses one specific GuardDuty finding type related to expected cross-account activity"
      RuleStatus: ENABLED
      RuleOrder: 7
      Criteria:
        Type:
          - Comparison: EQUALS
            Value: !Ref GuardDutyFindingType
      Actions:
        - Type: FINDING_FIELDS_UPDATE
          FindingFieldsUpdate:
            Workflow:
              Status: SUPPRESSED
            Note:
              Text: "Suppressed GuardDuty finding type related to expected cross-account Bedrock API activity."
              UpdatedBy: "AutomationRule"