                          response = ses_client.send_email(**email_params)

                          # Record success in campaign-specific DynamoDB table
                          sent_item = {
                              'EmailAddress': email,
                              'BatchId': batch_id,
                              'CampaignId': campaign_id,
                              'Status': 'SENT',
                              'SentTimestamp': datetime.now(timezone.utc).isoformat(),
                              'MessageId': response.get('MessageId', ''),
                              'Attempts': attempts + 1
                          }
                          expiration_time = tracking_expiration()
                          if expiration_time is not None:
                              sent_item['ExpirationTime'] = expiration_time
