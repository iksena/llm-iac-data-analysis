AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  anything-api

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 3
    MemorySize: 128
#    Layers:
#      - !Ref DepsLayer

Parameters:
  stage:
    Type: String
    Default: dev-123
    Description: Deployment stage with unique key, like "dev-123"
  productionAppUrl:
    Type: String
    Default: ''
    Description: Url for deployed web app, for CORS

Resources:
  streamArn:
    Type: AWS::SSM::Parameter
    Properties:
      Type: String
      Tier: Standard
      Value:
        Fn::ImportValue: !Sub "anything-${stage}-streamArn" # OK

  Api:
    Type: AWS::Serverless::Api
    Properties:
      StageName: v1
      Auth:
        DefaultAuthorizer: AWS_IAM
      OpenApiVersion: 3.0.1

#  DepsLayer:
#    Type: AWS::Serverless::LayerVersion
#    Metadata:
#      BuildMethod: makefile
#    Properties:
#      ContentUri: ./
#      CompatibleRuntimes:
#        - nodejs20.x
#      RetentionPolicy: Retain

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "anything-api-${stage}-lambda-role"
      Path: '/anything/roles/'
      Description: 'Execution role for api lambdas'
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub "anything-api-${stage}-lambda-policy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Clone of basic lambda permissions
              # ref: https://docs.aws.amazon.com/aws-managed-policy/latest/reference/AWSLambdaBasicExecutionRole.html
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
              # Database permissions
              - Effect: Allow
                Action:
                  # ref: https://docs.aws.amazon.com/service-authorization/latest/reference/list_amazondynamodb.html
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
#                  - dynamodb:CreateTable
#                  - dynamodb:UpdateTable
#                  - dynamodb:ListStreams
#                  - dynamodb:DescribeStream
#                  - dynamodb:GetShardIterator
#                  - dynamodb:GetRecords
                Resource:
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/anything-${stage}-main"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/anything-${stage}-main/index/*"
#                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/anything-${stage}-main/stream/*"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/anything-${stage}-types"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/anything-${stage}-types/index/*"
              - Effect: Allow
                Action:
                  - 'dynamodb:DescribeStream'
                  - 'dynamodb:GetRecords'
                  - 'dynamodb:GetShardIterator'
                  - 'dynamodb:ListStreams'
                Resource:
                  - !GetAtt streamArn.Value

  # Use basic lambda role explicitly to avoid role creation duplicates
  LambdaCorsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "anything-api-${stage}-lambda-cors-role"
      Path: '/anything/roles/'
      Description: 'Execution role for api lambdas that handle CORS preflight requests'
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub "anything-api-${stage}-lambda-cors-policy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Clone of basic lambda permissions
              # ref: https://docs.aws.amazon.com/aws-managed-policy/latest/reference/AWSLambdaBasicExecutionRole.html
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"

  # Ideally would break out api modules into separate files, but the workaround for that is ugly
  #  and not really worth it here since we're below the CloudFormation resource limit:
  # ref: https://github.com/aws/serverless-application-model/issues/1337
  # ref: https://github.com/aws/serverless-application-model/discussions/2734
  #
  #collectionApi:
  #  Type: AWS::Serverless::Application
  #  Properties:
  #    Location: ./src/modules/collection/template.yaml
  #  ...
  #
  # Instead, just dump all lambdas below:

  # collection
