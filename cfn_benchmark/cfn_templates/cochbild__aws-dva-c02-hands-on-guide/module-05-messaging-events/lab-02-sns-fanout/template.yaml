AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Lab 5.2 — SNS topic with SQS + Lambda fanout, demonstrating filter policies

Parameters:
  EnableFifo:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]

Conditions:
  WithFifo: !Equals [!Ref EnableFifo, "true"]

Resources:

  # ─────────────── Standard topic ───────────────
  Topic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: dva-lab-05-02-orders-topic

  Queue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: dva-lab-05-02-orders-queue
      MessageRetentionPeriod: 86400

  QueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref Queue]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: sns.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt Queue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref Topic

  QueueSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref Topic
      Endpoint: !GetAtt Queue.Arn
      Protocol: sqs
      RawMessageDelivery: true
      FilterPolicy:
        amount:
          - numeric: [">", 50]

  SubscriberRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  SubscriberFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dva-lab-05-02-subscriber
      Runtime: python3.12
      Handler: handler.handler
      Role: !GetAtt SubscriberRole.Arn
      CodeUri: src/

  LambdaSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref Topic
      Endpoint: !GetAtt SubscriberFunction.Arn
      Protocol: lambda

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SubscriberFunction
      Action: lambda:InvokeFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref Topic

  # ─────────────── Optional FIFO ───────────────
  FifoTopic:
    Type: AWS::SNS::Topic
    Condition: WithFifo
    Properties:
      TopicName: dva-lab-05-02-orders-topic.fifo
      FifoTopic: true
      ContentBasedDeduplication: true

  FifoQueue:
    Type: AWS::SQS::Queue
    Condition: WithFifo
    Properties:
      QueueName: dva-lab-05-02-orders-queue.fifo
      FifoQueue: true
      ContentBasedDeduplication: true

  FifoQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Condition: WithFifo
    Properties:
      Queues: [!Ref FifoQueue]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: sns.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt FifoQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref FifoTopic

  FifoSubscription:
    Type: AWS::SNS::Subscription
    Condition: WithFifo
    Properties:
      TopicArn: !Ref FifoTopic
      Endpoint: !GetAtt FifoQueue.Arn
      Protocol: sqs
      RawMessageDelivery: true

Outputs:
  TopicArn:
    Value: !Ref Topic
  QueueUrl:
    Value: !Ref Queue
  FifoTopicArn:
    Condition: WithFifo
    Value: !Ref FifoTopic
  FifoQueueUrl:
    Condition: WithFifo
    Value: !Ref FifoQueue