AWSTemplateFormatVersion: "2010-09-09"

Description: |
  This stack creates a SQS queue using KMS encryption

Parameters:
  KmsKey:
    Description: The KMS key master ID
    Type: String

Resources:
  # An SQS queue
  Queue:
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Type: AWS::SQS::Queue
    Properties:
      DelaySeconds: 0
      FifoQueue: false
      KmsDataKeyReusePeriodSeconds: 300
      KmsMasterKeyId: !Ref KmsKey
      MaximumMessageSize: 262144
      MessageRetentionPeriod: 345600
      ReceiveMessageWaitTimeSeconds: 0
      VisibilityTimeout: 30

  # An SQS fifo queue
  FifoQueue:
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Type: AWS::SQS::Queue
    Properties:
      ContentBasedDeduplication: true
      DelaySeconds: 0
      FifoQueue: True
      KmsDataKeyReusePeriodSeconds: 300
      KmsMasterKeyId: !Ref KmsKey
      MaximumMessageSize: 262144
      MessageRetentionPeriod: 345600
      ReceiveMessageWaitTimeSeconds: 0
      VisibilityTimeout: 30

  # An SNS topic for notifications
  NotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: "SQSNotificationTopic"
      TopicName: "SQSNotificationTopic"

  # A subscription to the SNS topic
  QueueSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: "sqs"
      Endpoint: !GetAtt Queue.Arn
      TopicArn: !Ref NotificationTopic