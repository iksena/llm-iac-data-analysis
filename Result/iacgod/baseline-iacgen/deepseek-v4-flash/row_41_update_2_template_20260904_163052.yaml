AWSTemplateFormatVersion: "2010-09-09"
Parameters:
  ProjectName:
    Type: String
    Default: ambassador
  Environment:
    Type: String
    Default: lab
  Author:
    Type: String
    Default: rdevera@tenable.com
  Version:
    Type: String
    Default: v1
Resources:
  IAMGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: !Sub "${ProjectName}-${Environment}-group"
  IAMPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ProjectName}-${Environment}-readonly-policy"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Resource: "*"
          - Effect: Allow
            Action: s3:Get*
            Resource: "*"
      Groups:
        - !Ref IAMGroup
  OHcnappUser001:
    Type: AWS::IAM::User
    Properties:
      UserName: OHcnappUser001
  OHcnappUser002:
    Type: AWS::IAM::User
    Properties:
      UserName: OHcnappUser002
  OHcnappUser003:
    Type: AWS::IAM::User
    Properties:
      UserName: OHcnappUser003
  OHcnappUser004:
    Type: AWS::IAM::User
    Properties:
      UserName: OHcnappUser004
  OHcnappUser005:
    Type: AWS::IAM::User
    Properties:
      UserName: OHcnappUser005
  OHcnappUser006:
    Type: AWS::IAM::User
    Properties:
