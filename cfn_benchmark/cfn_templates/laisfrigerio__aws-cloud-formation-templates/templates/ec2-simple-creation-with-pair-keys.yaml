AWSTemplateFormatVersion: "2010-09-09"

Description: >
  Creates a simple EC2 instance in the specified VPC,
  with Apache installed via User Data and
  a Hello World page accessible via HTTP.

# ============================================================
# PARAMETERS
# These allow the template to be reusable and configurable
# ============================================================
Parameters:

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC where the instance will be created

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet from the selected VPC

  # Uses AWS Systems Manager Parameter Store to dynamically
  # retrieve the latest Amazon Linux 2023 AMI
  LatestAmazonLinuxAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing Key Pair name for SSH access

# ============================================================
# RESOURCES
# This section defines what AWS resources will be created
# ============================================================
Resources:

  # ----------------------------------------------------------
  # SECURITY GROUP
  # Controls inbound and outbound traffic to the EC2 instance
  # ----------------------------------------------------------
  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allows SSH and HTTP access
      VpcId: !Ref VpcId   # Associates the SG with the selected VPC

      # Inbound rules (who can access the instance)
      SecurityGroupIngress:

        # Allow SSH access from anywhere (⚠ not recommended for production)
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0

        # Allow HTTP access from anywhere
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

      Tags:
        - Key: Name
          Value: first-ec2-sg-ssh

  # ----------------------------------------------------------
  # EC2 INSTANCE
  # ----------------------------------------------------------
  EC2Instance:
    Type: AWS::EC2::Instance
    Properties:

      # Instance size (very small and low cost)
      InstanceType: t2.nano

      # Uses the latest Amazon Linux AMI dynamically
      ImageId: !Ref LatestAmazonLinuxAmi

      # Network configuration
      SubnetId: !Ref SubnetId
      KeyName: !Ref KeyPairName

      # Associates the instance with the Security Group created above
      SecurityGroupIds:
        - !Ref EC2SecurityGroup

      # Root volume configuration
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 8              # 8 GB root disk
            VolumeType: gp3            # General Purpose SSD
            DeleteOnTermination: true  # Deletes volume when instance is terminated

      # ------------------------------------------------------
      # USER DATA
      # Script executed during the first boot of the instance
      # Must be Base64 encoded in CloudFormation
      # ------------------------------------------------------
      UserData:
        Fn::Base64: |
          #!/bin/bash
          yum update -y
          yum install -y httpd
          systemctl start httpd
          systemctl enable httpd
          echo "<h1>Hello World from EC2 🚀</h1>" > /var/www/html/index.html

      Tags:
        - Key: Name
          Value: simple-ec2-server

# ============================================================
# OUTPUTS
# Values returned after stack creation
# ============================================================
Outputs:
  InstancePublicIP:
    Description: Public IP address of the EC2 instance
    Value: !GetAtt EC2Instance.PublicIp   # Retrieves the public IP attribute