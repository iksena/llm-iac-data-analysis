AWSTemplateFormatVersion: "2010-09-09"
Description: Step Machine infrastructure

Resources:
  IAMRoleStepFunctionsPEWMachine:
    Type: "AWS::IAM::Role"
    Properties:
      RoleName: "StepFunctions-PEWMachine-ExecutionRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Action: "sts:AssumeRole"
            Effect: "Allow"
            Principal:
              Service: "states.amazonaws.com"
      Policies:
        - PolicyName: "PEWMachine3CustomPolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: "LambdaExecution"
                Effect: "Allow"
                Action: "lambda:InvokeFunction"
                Resource:
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:Pew-Extractor:*"
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:Pew-Service:*"
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:Pew-Website:*"
              - Sid: "EphemeralStackManagement"
                Effect: "Allow"
                Action:
                  - "cloudformation:CreateStack"
                  - "cloudformation:DeleteStack"
                  - "cloudformation:DescribeStacks"
                Resource: !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/PEW-EphemeralEndpoints/*"
              - Sid: "S3AccessForTemplate"
                Effect: "Allow"
                Action: "s3:GetObject"
                Resource: !Sub "arn:aws:s3:::pew-resources-${AWS::AccountId}/vpc-eph-endpoints.yml"
              - Sid: "S3AccessForAmplify"
                Effect: "Allow"
                Action:
                  - "s3:GetObjectAcl"
                  - "s3:PutObjectAcl"
                Resource:
                  - !Sub "arn:aws:s3:::pew-website-${AWS::AccountId}"
                  - !Sub "arn:aws:s3:::pew-website-${AWS::AccountId}/*"
              - Sid: "ECSRunTaskPermissions"
                Effect: "Allow"
                Action:
                  - "ecs:RunTask"
                  - "ecs:DescribeTasks"
                  - "ecs:StopTask"
                Resource:
                  - !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/pew-task-family:*"
                  - !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:cluster/PEW-Fargate-Cluster"
              - Sid: "EventsForSyncTasks"
                Effect: "Allow"
                Action:
                  - "events:PutTargets"
                  - "events:PutRule"
                  - "events:DescribeRule"
                Resource: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/StepFunctionsGetEventsForECSTaskRule"
              - Sid: "IAMPassRole"
                Effect: "Allow"
                Action: "iam:PassRole"
                Resource: "*"
                Condition:
                  StringLike:
                    "iam:PassedToService":
                      - "cloudformation.amazonaws.com"
                      - "ecs-tasks.amazonaws.com"
              - Sid: "AmplifyStart"
                Effect: "Allow"
                Action:
                  - "amplify:StartDeployment"
                  - "amplify:GetJob"
                Resource:
                  - !Sub
                    - "arn:aws:amplify:${AWS::Region}:${AWS::AccountId}:apps/${AppId}/branches/main/jobs/*"
                    - AppId: !ImportValue AMPLIFY-APP-ID
                  - !Sub
                    - "arn:aws:amplify:${AWS::Region}:${AWS::AccountId}:apps/${AppId}/branches/main/deployments/start"
                    - AppId: !ImportValue AMPLIFY-APP-ID
              - Sid: "AmplifyCheck"
                Effect: "Allow"
                Action: "amplify:GetJob"
                Resource:
                  - !Sub
                    - "arn:aws:amplify:${AWS::Region}:${AWS::AccountId}:apps/${AppId}/branches/main"
                    - AppId: !ImportValue AMPLIFY-APP-ID
  CloudFormationServiceRole:
    Type: "AWS::IAM::Role"
    Properties:
      RoleName: "PEWMachine-CloudFormation-ServiceRole"
      Description: "Permette a CloudFormation di creare gli endpoint VPC"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Action: "sts:AssumeRole"
            Effect: "Allow"
            Principal:
              Service: "cloudformation.amazonaws.com"
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/AmazonVPCFullAccess"

  PEWStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: PEW-Machine
      RoleArn: !GetAtt IAMRoleStepFunctionsPEWMachine.Arn
      StateMachineType: "STANDARD"
      DefinitionSubstitutions:
        Region: !Ref "AWS::Region"
        AccountId: !Ref "AWS::AccountId"
        SubnetId: !ImportValue PEW-PRIVATE-SUBNET
        SecurityGroupId: !ImportValue PEW-VPC-SG-ID
        TaskDefArn: !ImportValue PEW-TASK-DEF-ID
        ClusterName: !ImportValue PEW-CLUSTER-ID
        CloudFormationRoleArn: !GetAtt CloudFormationServiceRole.Arn
        AmplifyAppId: !ImportValue AMPLIFY-APP-ID
      DefinitionString: |-
        {
          "Comment": "The PEW project state machine for orchestration",
          "StartAt": "Setup for computation",
          "States": {
            "Setup for computation": {
              "Type": "Parallel",
              "Branches": [
                {
                  "StartAt": "Clean Market data",
                  "States": {
                    "Clean Market data": {
                      "Type": "Task",
                      "Resource": "arn:aws:states:::lambda:invoke",
                      "OutputPath": "$.Payload",
                      "Parameters": {
                        "Payload": {
                          "command": "EMPTY",
                          "bucket": "pew-marketdata-${AccountId}"
                        },
                        "FunctionName": "arn:aws:lambda:${Region}:${AccountId}:function:Pew-Service:$LATEST"
                      },
                      "Retry": [
                        {
                          "ErrorEquals": [
                            "Lambda.ServiceException",
                            "Lambda.AWSLambdaException",
                            "Lambda.SdkClientException",
                            "Lambda.TooManyRequestsException"
                          ],
                          "IntervalSeconds": 1,
                          "MaxAttempts": 3,
                          "BackoffRate": 2,
                          "JitterStrategy": "FULL"
                        }
                      ],
                      "Next": "Clean Report"
                    },
                    "Clean Report": {
                      "Type": "Task",
                      "Resource": "arn:aws:states:::lambda:invoke",
                      "OutputPath": "$.Payload",
                      "Parameters": {
                        "FunctionName": "arn:aws:lambda:${Region}:${AccountId}:function:Pew-Service:$LATEST",
                        "Payload": {
                          "command": "EMPTY",
                          "bucket": "pew-report-${AccountId}"
                        }
                      },
                      "Retry": [
                        {
                          "ErrorEquals": [
                            "Lambda.ServiceException",
                            "Lambda.AWSLambdaException",
                            "Lambda.SdkClientException",
                            "Lambda.TooManyRequestsException"
                          ],
                          "IntervalSeconds": 1,
                          "MaxAttempts": 3,
                          "BackoffRate": 2,
                          "JitterStrategy": "FULL"
                        }
                      ],
                      "Next": "Download Data"
                    },
                    "Download Data": {
                      "Type": "Task",
                      "Resource": "arn:aws:states:::lambda:invoke",
                      "OutputPath": "$.Payload",
                      "Parameters": {
                        "Payload.$": "$",
                        "FunctionName": "arn:aws:lambda:${Region}:${AccountId}:function:Pew-Extractor:$LATEST"
                      },
                      "Next": "Data extraction succeded"
                    },
                    "Data extraction succeded": {
                      "Type": "Succeed"
                    }
                  }
                },
                {
                  "StartAt": "Create Ephemeral Endpoints",
                  "States": {
                    "Create Ephemeral Endpoints": {
                      "Type": "Task",
                      "Resource": "arn:aws:states:::aws-sdk:cloudformation:createStack",
                      "Parameters": {
                        "StackName": "PEW-EphemeralEndpoints",
                        "TemplateURL": "https://pew-resources-${AccountId}.s3.${Region}.amazonaws.com/vpc-eph-endpoints.yml",
                        "RoleARN": "${CloudFormationRoleArn}"
                      },
                      "Next": "Wait"
                    },
                    "Wait": {
                      "Type": "Wait",
                      "Seconds": 30,
                      "Next": "Check Endpoints"
                    },
                    "Check Endpoints": {
                      "Type": "Task",
                      "Resource": "arn:aws:states:::aws-sdk:cloudformation:describeStacks",
                      "Parameters": {
                        "StackName": "PEW-EphemeralEndpoints"
                      },
                      "Next": "Choice"
                    },
                    "Choice": {
                      "Type": "Choice",
                      "Choices": [
                        {
                          "Variable": "$.Stacks[0].StackStatus",
                          "StringEquals": "CREATE_COMPLETE",
                          "Next": "Endpoints Created"
                        },
                        {
                          "Variable": "$.Stacks[0].StackStatus",
                          "StringMatches": "*_IN_PROGRESS",
                          "Next": "Wait"
                        }
                      ],
                      "Default": "Endpoints Failed"
                    },
                    "Endpoints Failed": {
                      "Type": "Fail"
                    },
                    "Endpoints Created": {
                      "Type": "Succeed"
                    }
                  }
                }
              ],
              "Next": "Modeler Task",
              "Catch": [
                {
                  "ErrorEquals": [
                    "States.ALL"
                  ],
                  "Next": "Destroy Endpoints for Rollback"
                }
              ]
            },
            "Destroy Endpoints for Rollback": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:cloudformation:deleteStack",
              "Parameters": {
                "StackName": "PEW-EphemeralEndpoints",
                "RoleARN": "${CloudFormationRoleArn}"
              },
              "Next": "Failed preparation",
              "Catch": [
                {
                  "ErrorEquals": [
                    "States.ALL"
                  ],
                  "Comment": "In case endpoint was not created",
                  "Next": "Failed preparation"
                }
              ]
            },
            "Failed preparation": {
              "Type": "Fail"
            },
            "Modeler Task": {
              "Type": "Task",
              "Resource": "arn:aws:states:::ecs:runTask.sync",
              "Parameters": {
                "LaunchType": "FARGATE",
                "Cluster": "${ClusterName}",
                "TaskDefinition": "${TaskDefArn}",
                "NetworkConfiguration": {
                  "AwsvpcConfiguration": {
                    "Subnets": [
                      "${SubnetId}"
                    ],
                    "SecurityGroups": [
                      "${SecurityGroupId}"
                    ],
                    "AssignPublicIp": "DISABLED"
                  }
                }
              },
              "Next": "Post computation",
              "Catch": [
                {
                  "ErrorEquals": [
                    "States.TaskFailed"
                  ],
                  "Next": "Aborted computation endpoints"
                }
              ]
            },
            "Aborted computation endpoints": {
              "Type": "Task",
              "Parameters": {
                "StackName": "PEW-EphemeralEndpoints",
                "RoleARN": "${CloudFormationRoleArn}"
              },
              "Resource": "arn:aws:states:::aws-sdk:cloudformation:deleteStack",
              "Next": "Failed computation"
            },
            "Failed computation": {
              "Type": "Fail"
            },
            "Post computation": {
              "Type": "Parallel",
              "Next": "Clean post computation state",
              "Branches": [
                {
                  "StartAt": "Destroy Endpoints",
                  "States": {
                    "Destroy Endpoints": {
                      "Type": "Task",
                      "Resource": "arn:aws:states:::aws-sdk:cloudformation:deleteStack",
                      "Parameters": {
                        "StackName": "PEW-EphemeralEndpoints",
                        "RoleARN": "${CloudFormationRoleArn}"
                      },
                      "Next": "Wait for endpoint fate"
                    },
                    "Success": {
                      "Type": "Succeed"
                    },
                    "Wait for endpoint fate": {
                      "Type": "Wait",
                      "Seconds": 30,
                      "Next": "Check endpoint Fate"
                    },
                    "Check endpoint Fate": {
                      "Type": "Task",
                      "Parameters": {
                        "StackName": "PEW-EphemeralEndpoints"
                      },
                      "Resource": "arn:aws:states:::aws-sdk:cloudformation:describeStacks",
                      "Next": "Query endpoint fate",
                      "Catch": [
                        {
                          "ErrorEquals": [
                            "States.TaskFailed"
                          ],
                          "Comment": "endpoint cancelled",
                          "Next": "Success"
                        }
                      ]
                    },
                    "Query endpoint fate": {
                      "Type": "Choice",
                      "Choices": [
                        {
                          "Next": "Wait for endpoint fate",
                          "Variable": "$.Stacks[0].StackStatus",
                          "StringEquals": "DELETE_IN_PROGRESS"
                        }
                      ],
                      "Default": "Endpoint cancellation failed"
                    },
                    "Endpoint cancellation failed": {
                      "Type": "Fail"
                    }
                  }
                },
                {
                  "StartAt": "Clean Old Zip",
                  "States": {
                    "Clean Old Zip": {
                      "Type": "Task",
                      "Resource": "arn:aws:states:::lambda:invoke",
                      "OutputPath": "$.Payload",
                      "Parameters": {
                        "FunctionName": "arn:aws:lambda:${Region}:${AccountId}:function:Pew-Service:$LATEST",
                        "Payload": {
                          "command": "EMPTY",
                          "bucket": "pew-website-${AccountId}"
                        }
                      },
                      "Retry": [
                        {
                          "ErrorEquals": [
                            "Lambda.ServiceException",
                            "Lambda.AWSLambdaException",
                            "Lambda.SdkClientException",
                            "Lambda.TooManyRequestsException"
                          ],
                          "IntervalSeconds": 1,
                          "MaxAttempts": 3,
                          "BackoffRate": 2,
                          "JitterStrategy": "FULL"
                        }
                      ],
                      "Next": "Produce Zip"
                    },
                    "Produce Zip": {
                      "Type": "Task",
                      "Resource": "arn:aws:states:::lambda:invoke",
                      "OutputPath": "$.Payload",
                      "Parameters": {
                        "FunctionName": "arn:aws:lambda:${Region}:${AccountId}:function:Pew-Website:$LATEST",
                        "Payload": {
                          "source bucket": "pew-report-${AccountId}",
                          "target bucket": "pew-website-${AccountId}",
                          "resource bucket": "pew-resources-${AccountId}"
                        }
                      },
                      "Retry": [
                        {
                          "ErrorEquals": [
                            "Lambda.ServiceException",
                            "Lambda.AWSLambdaException",
                            "Lambda.SdkClientException",
                            "Lambda.TooManyRequestsException"
                          ],
                          "IntervalSeconds": 1,
                          "MaxAttempts": 3,
                          "BackoffRate": 2,
                          "JitterStrategy": "FULL"
                        }
                      ],
                      "Next": "Zip file generated"
                    },
                    "Zip file generated": {
                      "Type": "Succeed"
                    }
                  }
                }
              ],
              "Catch": [
                {
                  "ErrorEquals": [
                    "States.BranchFailed"
                  ],
                  "Comment": "Failed post pipeline",
                  "Next": "Last try endpoint safety"
                }
              ]
            },
            "Clean post computation state": {
              "Type": "Pass",
              "Next": "StartDeployment",
              "Result": {}
            },
            "Last try endpoint safety": {
              "Type": "Task",
              "Resource": "arn:aws:states:::aws-sdk:cloudformation:deleteStack",
              "Parameters": {
                "StackName": "PEW-EphemeralEndpoints",
                "RoleARN": "${CloudFormationRoleArn}"
              },
              "Next": "Failed postelaboration",
              "Catch": [
                {
                  "ErrorEquals": [
                    "States.ALL"
                  ],
                  "Comment": "In case endpoint was not created",
                  "Next": "Failed postelaboration"
                }
              ]
            },
            "StartDeployment": {
              "Type": "Task",
              "Parameters": {
                "AppId": "${AmplifyAppId}",
                "BranchName": "main",
                "SourceUrl": "s3://pew-website-${AccountId}/website_deploy.zip"
              },
              "Resource": "arn:aws:states:::aws-sdk:amplify:startDeployment",
              "Next": "Shape delivery",
              "Catch": [
                {
                  "ErrorEquals": [
                    "States.ALL"
                  ],
                  "Next": "Impossible to deliver website"
                }
              ],
              "ResultPath": "$.deployInfo"
            },
            "Shape delivery": {
              "Type": "Pass",
              "Next": "wait for site deployment",
              "Parameters": {
                "deployInfo": {
                  "Status.$": "$.deployInfo.JobSummary.Status",
                  "JobId.$": "$.deployInfo.JobSummary.JobId",
                  "LastCheckTime.$": "$$.State.EnteredTime"
                }
              }
            },
            "wait for site deployment": {
              "Type": "Wait",
              "Seconds": 15,
              "Next": "Check website fate"
            },
            "Check website fate": {
              "Type": "Task",
              "Parameters": {
                "AppId": "${AmplifyAppId}",
                "BranchName": "main",
                "JobId.$": "$.deployInfo.JobId"
              },
              "ResultSelector": {
                "JobId.$": "$.Job.Summary.JobId",
                "Status.$": "$.Job.Summary.Status",
                "LastCheckTime.$": "$$.State.EnteredTime"
              },
              "ResultPath": "$.deployInfo",
              "Resource": "arn:aws:states:::aws-sdk:amplify:getJob",
              "Next": "Query website fate"
            },
            "Query website fate": {
              "Type": "Choice",
              "Choices": [
                {
                  "Next": "Impossible to deliver website",
                  "Or": [
                    {
                      "Variable": "$.deployInfo.Status",
                      "StringEquals": "FAILED"
                    },
                    {
                      "Variable": "$.deployInfo.Status",
                      "StringEquals": "CANCELLED"
                    }
                  ]
                },
                {
                  "Next": "PEW Pipeline succeded",
                  "Variable": "$.deployInfo.Status",
                  "StringEquals": "SUCCEED"
                }
              ],
              "Default": "wait for site deployment"
            },
            "Impossible to deliver website": {
              "Type": "Fail"
            },
            "PEW Pipeline succeded": {
              "Type": "Succeed"
            },
            "Failed postelaboration": {
              "Type": "Fail"
            }
          },
          "QueryLanguage": "JSONPath"
        }