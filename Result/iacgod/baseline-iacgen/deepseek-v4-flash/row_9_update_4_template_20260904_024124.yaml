AWSTemplateFormatVersion: '2010-09-09'
Parameters:
  LogGroupName:
    Type: String
    Default: /aws/vpc/flowlogs/reject
    Description: Name for the CloudWatch Logs log group for VPC Flow Logs
  RetentionDays:
    Type: Number
    Default: 365
    Description: Retention period in days for the log group (compliance requirement)
  FlowLogRoleName:
    Type: String
    Default: VPCFlowLogsToCWL
    Description: Name of the IAM role for VPC Flow Logs to write to CloudWatch Logs
  AutomationRoleName:
    Type: String
    Default: VPCFlowLogAutomationRole
    Description: Name of the IAM role for SSM Automation execution
  DirectAutomationDocName:
    Type: String
    Default: EnableVPCFlowLogsRejectDirect
    Description: Name of the SSM Automation document for direct flow log enablement
  ChangeAutomationDocName:
    Type: String
    Default: EnableVPCFlowLogsRejectChangeMgmt
    Description: Name of the SSM Automation document that routes through Change Manager
Resources:
  FlowLogLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Ref LogGroupName
      RetentionInDays: !Ref RetentionDays
  FlowLogRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref FlowLogRoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: vpc-flow-logs.amazonaws.com
            Action: sts:AssumeRole
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WriteToCloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource: !GetAtt FlowLogLogGroup.Arn
  AutomationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref AutomationRoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ssm.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: VPCFlowLogManagement
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:CreateFlowLogs
                  - ec2:DescribeFlowLogs
                  - ec2:DescribeVpcs
                  - ec2:DescribeSubnets
                  - ec2:DescribeNetworkInterfaces
                Resource: '*'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                  - logs:DescribeLogGroups
                Resource: !GetAtt FlowLogLogGroup.Arn
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !GetAtt FlowLogRole.Arn
              - Effect: Allow
                Action:
                  - ssm:StartChangeRequestExecution
                  - ssm:StartAutomationExecution
                  - ssm:GetAutomationExecution
                Resource: '*'
  DirectEnableDocument:
    Type: AWS::SSM::Document
    Properties:
      Name: !Ref DirectAutomationDocName
      DocumentType: Automation
      Content:
        schemaVersion: '0.3'
        description: Enables VPC Flow Logs for reject traffic on a given VPC directly.
        assumeRole: !GetAtt AutomationExecutionRole.Arn
        parameters:
          VpcId:
            type: String
            description: The ID of the VPC to enable flow logs on (e.g., vpc-12345678)
          LogGroupName:
            type: String
            default: !Ref LogGroupName
            description: CloudWatch Logs log group to send flow logs to
          DeliveryRoleArn:
            type: String
            default: !GetAtt FlowLogRole.Arn
            description: IAM role ARN for flow log delivery
        mainSteps:
          - name: EnableVPCFlowLogs
            action: aws:executeScript
            description: Enables VPC Flow Logs capturing only rejected traffic
            inputs:
              Runtime: python3.11
              Handler: enable_flow_logs
              Script: |-
                import boto3
                def enable_flow_logs(events, context):
                    ec2 = boto3.client('ec2')
                    vpc_id = events['VpcId']
                    log_group_name = events['LogGroupName']
                    delivery_role_arn = events['DeliveryRoleArn']
                    try:
                        response = ec2.create_flow_logs(
                            ResourceIds=[vpc_id],
                            ResourceType='VPC',
                            TrafficType='REJECT',
                            LogGroupName=log_group_name,
                            DeliverLogsPermissionArn=delivery_role_arn
                        )
                        return {
                            'status': 'Success',
                            'flowLogIds': response['FlowLogIds'],
                            'message': f'Flow logs enabled for VPC {vpc_id}'
                        }
                    except Exception as e:
                        return {
                            'status': 'Failed',
                            'error': str(e)
                        }
              InputPayload:
                VpcId: '{{ VpcId }}'
                LogGroupName: '{{ LogGroupName }}'
                DeliveryRoleArn: '{{ DeliveryRoleArn }}'
  ChangeManagerDocument:
    Type: AWS::SSM::Document
    Properties:
      Name: !Ref ChangeAutomationDocName
      DocumentType: Automation
      Content:
        schemaVersion: '0.3'
        description: Enables VPC Flow Logs for reject traffic via a Change Manager change request.
        assumeRole: !GetAtt AutomationExecutionRole.Arn
        parameters:
          VpcId:
            type: String
            description: The ID of the VPC to enable flow logs on (e.g., vpc-12345678)
          ChangeRequestTitle:
            type: String
            default: Enable VPC Flow Logs for Reject Traffic
            description: Title for the change request
          ChangeRequestDescription:
            type: String
            default: Automated remediation to enable VPC Flow Logs capturing rejected traffic as per CIS benchmark
            description: Description of the change request
          ApprovalType:
            type: String
            default: None
            allowedValues:
              - None
              - Single
              - All
            description: Approval requirement for the change request
        mainSteps:
          - name: CreateChangeRequest
            action: aws:executeAutomation
            description: Creates a change request using AWS Systems Manager Change Manager
            inputs:
              DocumentName: AWS-StartChangeRequest
              RuntimeParameters:
                AutomationAssumeRole:
                  - !GetAtt AutomationExecutionRole.Arn
                ChangeRequestTitle:
                  - '{{ ChangeRequestTitle }}'
                ChangeRequestDescription:
                  - '{{ ChangeRequestDescription }}'
                ApprovalType:
                  - '{{ ApprovalType }}'
                AutomationDocumentName:
                  - !Ref DirectAutomationDocName
                AutomationDocumentParameters:
                  - '{"VpcId":"{{ VpcId }}"}'
          - name: WaitForApproval
            action: aws:approve
            description: Waits for the change request to be approved before proceeding
            inputs:
              Approvers:
                - '*'
              Message: 'Change request to enable VPC Flow Logs for reject traffic has been submitted. Please approve or reject this change request.'
          - name: ExecuteRemediation
            action: aws:executeAutomation
            description: Executes the direct enable flow log automation after approval
            inputs:
              DocumentName: !Ref DirectAutomationDocName
              RuntimeParameters:
                VpcId:
                  - '{{ VpcId }}'
Outputs:
  FlowLogLogGroupArn:
    Description: ARN of the CloudWatch Logs log group for flow logs
    Value: !GetAtt FlowLogLogGroup.Arn
  FlowLogRoleArn:
    Description: ARN of the IAM role used by VPC Flow Logs
    Value: !GetAtt FlowLogRole.Arn
  AutomationExecutionRoleArn:
    Description: ARN of the IAM role used by SSM Automation
    Value: !GetAtt AutomationExecutionRole.Arn
  DirectDocumentName:
    Description: Name of the direct SSM Automation document
    Value: !Ref DirectAutomationDocName
  ChangeDocumentName:
    Description: Name of the Change Manager routed SSM Automation document
    Value: !Ref ChangeAutomationDocName