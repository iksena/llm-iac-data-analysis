AWSTemplateFormatVersion: '2010-09-09'
Description: Long-form intrinsics ({"Ref"}, Fn::GetAtt, Fn::Sub, Fn::Join)
  instead of the ! short tags.

Resources:
  LongHttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: long-http
      ProtocolType: HTTP

  LongRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: {Ref: LongHttpApi}
      RouteKey: DELETE /archive/{id}
      Target:
        Fn::Join:
          - '/'
          - - integrations
            - Ref: LongIntegration

  LongIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: {Ref: LongHttpApi}
      IntegrationType: AWS_PROXY
      IntegrationUri:
        Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LongFunction.Arn}/invocations

  LongFunction:
    Type: AWS::Lambda::Function
    Metadata:
      aws:asset.path: src/handlers
    Properties:
      Handler: orders.handler
      Runtime: nodejs20.x
      Code:
        S3Bucket: some-bucket
        S3Key: long.zip

  LongRest:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: long-rest

  ArchiveResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: {Ref: LongRest}
      ParentId:
        Fn::GetAtt: [LongRest, RootResourceId]
      PathPart: archive

  GetArchiveMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: {Ref: LongRest}
      ResourceId: {Ref: ArchiveResource}
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Join:
            - ''
            - - 'arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/'
              - Fn::GetAtt: [LongFunction, Arn]
              - '/invocations'