AWSTemplateFormatVersion: "2010-09-09"
Parameters:
  StageName:
    Type: String
    Default: dev
    Description: Name of the API Gateway stage.
  ApiKeyName:
    Type: String
    Default: email-apikey
    Description: Name for the API key.
Resources:
  EmailApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: EmailSubmissionApi
      Description: REST API to submit emails via SES
  EmailModel:
    Type: AWS::ApiGateway::Model
    Properties:
      RestApiId: !Ref EmailApi
      ContentType: application/json
      Name: EmailSubmissionModel
      Schema:
        type: object
        required:
          - to
          - from
          - html
          - text
        properties:
          to:
            type: array
            items:
              type: string
            minItems: 1
          from:
            type: string
            format: email
          subject:
            type: string
          html:
            type: string
          text:
            type: string
          cc:
            type: array
            items:
              type: string
          bcc:
            type: array
            items:
              type: string
  EmailRequestValidator:
    Type: AWS::ApiGateway::RequestValidator
    Properties:
      RestApiId: !Ref EmailApi
      Name: EmailBodyValidator
      ValidateRequestBody: true
      ValidateRequestParameters: false
  EmailResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref EmailApi
      ParentId: !GetAtt EmailApi.RootResourceId
      PathPart: email
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaSESPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: "*"
        - PolicyName: LambdaLoggingPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
  EmailLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: EmailSubmissionHandler
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Runtime: nodejs24.x
      Code:
        ZipFile: |
          const AWS = require('aws-sdk');
          const ses = new AWS.SES();
          exports.handler = async (event) => {
            const body = JSON.parse(event.body);
            const params = {
              Source: body.from,
              Destination: {
                ToAddresses: body.to,
                CcAddresses: body.cc || [],
                BccAddresses: body.bcc || []
              },
              Message: {
                Subject: {
                  Data: body.subject || 'No Subject'
                },
                Body: {
                  Html: {
                    Data: body.html
                  },
                  Text: {
                    Data: body.text
                  }
                }
              }
            };
            try {
              await ses.sendEmail(params).promise();
              return {
                statusCode: 200,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: 'Email sent successfully' })
              };
            } catch (error) {
              return {
                statusCode: 500,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ error: error.message })
              };
            }
          };
  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref EmailLambdaFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${EmailApi}/*/POST/email"
  EmailMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref EmailApi
      ResourceId: !Ref EmailResource
      HttpMethod: POST
      AuthorizationType: NONE
      ApiKeyRequired: true
      RequestValidatorId: !Ref EmailRequestValidator
      RequestModels:
        application/json: !Ref EmailModel
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${EmailLambdaFunction.Arn}/invocations"
        IntegrationResponses:
          - StatusCode: 200
      MethodResponses:
        - StatusCode: 200
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - EmailMethod
      - EmailModel
      - EmailRequestValidator
    Properties:
      RestApiId: !Ref EmailApi
  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      StageName: !Ref StageName
      RestApiId: !Ref EmailApi
      DeploymentId: !Ref ApiDeployment
  UsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn:
      - ApiStage
    Properties:
      ApiStages:
        - ApiId: !Ref EmailApi
          Stage: !Ref StageName
      Throttle:
        BurstLimit: 1000
        RateLimit: 500
      Quota:
        Limit: 10000
        Period: MONTH
  ApiKey:
    Type: AWS::ApiGateway::ApiKey
    DependsOn:
      - ApiStage
    Properties:
      Name: !Ref ApiKeyName
      Enabled: true
      StageKeys:
        - RestApiId: !Ref EmailApi
          StageName: !Ref StageName
  UsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref ApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref UsagePlan
Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${EmailApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/email"
  ApiKeyId:
    Description: ID of the created API key
    Value: !Ref ApiKey
  UsagePlanId:
    Description: ID of the usage plan
    Value: !Ref UsagePlan