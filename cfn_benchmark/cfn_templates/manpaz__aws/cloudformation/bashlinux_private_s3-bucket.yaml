---
# Bashlinux::Private::S3 Bucket
#
#   Cloudformation template to deploy a private S3 bucket for the Application
#
#   Manuel F Martinez
#   Bashlinux
#   Los Angeles, CA
#
AWSTemplateFormatVersion: '2010-09-09'
Description: Private S3 Bucket template

###############################################################################
Parameters:

  BucketRole:
    Description: Role name of the bucket
    Type: String
    MinLength: "1"
    MaxLength: "42"
    ConstraintDescription: The role name of the bucket must be a string

  BucketUuid:
    Description: Unique ID to make the s3 bucket less discoverable
    Type: String
    MinLength: "24"
    MaxLength: "24"
    ConstraintDescription: Length of the ID must be exactly 24 characters

  Environment:
    Description: VPC environment
    Type: String
    MinLength: "4"
    MaxLength: "20"
    Default: staging
    AllowedValues: [ "prod", "staging" ]
    ConstraintDescription: Can only contain "prod" or "staging".

  Organization:
    Description: Organization or Customer name
    Type: String
    MinLength: "1"
    MaxLength: "32"
    Default: bashlinux
    AllowedPattern: "[a-zA-Z0-9\\-]*"
    ConstraintDescription: >
      Name of the organization must contains only letters, numbers and hyphens

###############################################################################
Conditions:

  IsProd: !Equals [!Ref Environment, "prod"]

###############################################################################
Resources:
  S3BucketEnvVars:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: "aws:kms"
              KMSMasterKeyID: !Sub "alias/${Organization}/s3/${Environment}"
            BucketKeyEnabled: true
      BucketName: !If
        - IsProd
        - !Sub "${Organization}-${BucketRole}-${BucketUuid}"
        - !Sub "${Organization}-${BucketRole}-${Environment}-${BucketUuid}"
      Tags:
      - Key: Name
        Value: !If
        - IsProd
        - !Sub "${Organization}-${BucketRole}-${BucketUuid}"
        - !Sub "${Organization}-${BucketRole}-${Environment}-${BucketUuid}"
      - Key: bashlinux:organization-name
        Value: !Ref Organization
      - Key: bashlinux:environment-name
        Value: !Ref Environment
      - Key: bashlinux:application-id
        Value: !Ref AWS::StackName
      - Key: bashlinux:network-visibility
        Value: private
      - Key: bashlinux:can-delete
        Value: 'false'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

###############################################################################
Outputs:

  S3BucketArn:
    Description: The ARN of the S3 bucket holding the ENV vars file
    Value: !GetAtt S3BucketEnvVars.Arn
    Export:
      Name: !Sub "${Organization}-${Environment}-S3BucketEnvVarsArn"

  S3BucketDomainName:
    Description: The IPv4 DNS name of the specified bucket
    Value: !GetAtt S3BucketEnvVars.DomainName

  S3BucketRegionalDomainName:
    Description: The regional domain name of the specified bucket
    Value: !GetAtt S3BucketEnvVars.RegionalDomainName