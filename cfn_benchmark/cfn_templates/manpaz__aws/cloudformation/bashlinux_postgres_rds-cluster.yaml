---
# Bashlinux::Postgres::RDS Cluster
#
#   Cloudformation template to deploy an RDS Postgres instance
#
#   Manuel F Martinez
#   Bashlinux
#   Los Angeles, CA
#
AWSTemplateFormatVersion: "2010-09-09"
Description: RDS Postgres Cluster template

###############################################################################
Parameters:

  Environment:
    Description: Postgres worker environment
    Type: String
    MinLength: "1"
    MaxLength: "20"
    Default: staging
    AllowedValues: ["prod","staging"]
    ConstraintDescription: >
      Environment name can only contain "prod" or "staging"

  Organization:
    Description: Organization or Customer name
    Type: String
    MinLength: "1"
    MaxLength: "32"
    Default: bashlinux
    AllowedPattern: "[a-zA-Z0-9\\-]*"
    ConstraintDescription: >
      Name of the organization must contains only letters, numbers and hyphens

  RDSInstanceSize:
    Description: RDS instance size for Postgres
    Type: String
    MinLength: "1"
    MaxLength: "32"
    Default: db.t4g.micro
    AllowedValues:
    - db.t4g.micro
    - db.t4g.small
    - db.t4g.medium
    - db.tg4.large
    - db.m6g.large
    - db.m6g.xlarge
    - db.m6g.2xlarge
    - db.m6g.4xlarge
    ConstraintDescription: >
      RDS instance size must be micro, small, medium, or large of the "db.t4g"
      type or large, xlarge, 2xlarge, or 4xlarge of the "db.m6g" type.

  RDSMultiAZ:
    Description: Either to deploy with a stand-by or just a standalone instance
    Type: String
    MinLength: "1"
    MaxLength: "16"
    Default: "false"
    AllowedValues:
    - "true"
    - "false"

  RDSPostgresEngineVersion:
    Description: RDS Engine version for Postgres DB
    Type: String
    MinLength: "1"
    MaxLength: "32"
    Default: "17.4"
    AllowedValues:
    - "17.5"
    - "17.4"
    - "17.3"
    - "17.2"
    - "17.1"
    - "16.9"
    - "16.8"
    - "15.13"
    - "15.12"
    - "14.18"
    - "14.17"
    ConstraintDescription: RDS Postgres must be a valid version.

  RDSStorageSize:
    Description: RDS instance storage size in GiB
    Type: Number
    MinValue: "5"
    MaxValue: "1024"
    Default: "10"
    ConstraintDescription: Postgres storage size in GiB must be a number.

###############################################################################
Resources:

  RdsPostgresInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      AllocatedStorage: !Ref RDSStorageSize
      AllowMajorVersionUpgrade: "false"
      CopyTagsToSnapshot: "true"
      DBInstanceClass: !Ref RDSInstanceSize
      DBInstanceIdentifier: !Sub "db01-${Organization}-${Environment}"
      DBSubnetGroupName: !ImportValue
        "Fn::Sub": "${Organization}-${Environment}-RdsSubnetGroupId"
      DeletionProtection: "true"
      Engine: postgres
      EngineVersion: !Ref RDSPostgresEngineVersion
      MasterUsername: !Ref Organization
      MasterUserPassword: !Sub "{{resolve:secretsmanager:secret/${Organization}/${Environment}/rds:SecretString:password}}"
      MultiAZ: !Ref RDSMultiAZ
      PubliclyAccessible: "false"
      StorageEncrypted: "true"
      KmsKeyId: !Sub "alias/${Organization}/rds/${Environment}"
      VPCSecurityGroups:
        - !ImportValue
            "Fn::Sub": "${Organization}-${Environment}-RdsPostgresSecurityGroupId"
      Tags:
      - Key: bashlinux:network-visibility
        Value: private
      - Key: bashlinux:organization-name
        Value: !Ref Organization
      - Key: bashlinux:environment-name
        Value: !Ref Environment
      - Key: bashlinux:application-role
        Value: db
      - Key: Name
        Value: !Sub "db01-${Organization}-${Environment}"

  # RDS Proxy: IAM Roles ----------------------------------
  RdsProxyPostgresRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - "rds.amazonaws.com"
            Action:
              - "sts:AssumeRole"
      ManagedPolicyArns:
        - !Ref RdsProxyPostgresPolicy
      RoleName: !Sub "${Organization}-${Environment}-rds-proxy-role"

  RdsProxyPostgresPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${Organization}-${Environment}-rds-proxy-policy"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - "secretsmanager:GetSecretValue"
              - "secretsmanager:DescribeSecret"
            Resource:
              - !ImportValue
                  "Fn::Sub": "${Organization}-${Environment}-rds-SecretsManagerCredentialsArn"
          - Effect: Allow
            Action:
              - "kms:Decrypt"
              - "kms:DescribeKey"
            Resource:
              - !ImportValue
                  "Fn::Sub": "${Organization}-${Environment}-rds-SecretsManagerCredentialsArn"

  # RDS Proxy: Postgres -----------------------------------
  RdsProxyPostgres:
    Type: AWS::RDS::DBProxy
    DependsOn: RdsPostgresInstance
    Properties:
      DebugLogging: true
      DBProxyName: !Sub "db01-${Organization}-${Environment}"
      EngineFamily: POSTGRESQL
      IdleClientTimeout: 120
      RequireTLS: false
      RoleArn: !GetAtt RdsProxyPostgresRole.Arn
      Auth:
        - AuthScheme: SECRETS
          IAMAuth: DISABLED
          SecretArn: !ImportValue
            "Fn::Sub": "${Organization}-${Environment}-rds-SecretsManagerCredentialsArn"
      VpcSubnetIds: !Split
        - ","
        - !ImportValue
            "Fn::Sub": "${Organization}-${Environment}-RdsSubnetIds"
      VpcSecurityGroupIds:
        - !ImportValue
            "Fn::Sub": "${Organization}-${Environment}-RdsPostgresSecurityGroupId"

  RdsProxyPostgresTargetGroup:
    Type: AWS::RDS::DBProxyTargetGroup
    DependsOn: RdsProxyPostgres
    Properties:
      DBProxyName: !Ref RdsProxyPostgres
      DBInstanceIdentifiers:
        - !Ref RdsPostgresInstance
      TargetGroupName: default
      ConnectionPoolConfigurationInfo:
          MaxConnectionsPercent: 100
          MaxIdleConnectionsPercent: 50
          ConnectionBorrowTimeout: 120

###############################################################################
Outputs:

  RdsPostgresInstanceId:
    Description: "RDS: RDS postgres instance ID"
    Value: !Ref RdsPostgresInstance

  RdsPostgresEndpoint:
    Description: "RDS: RDS postgres connection endpoint"
    Value: !GetAtt RdsPostgresInstance.Endpoint.Address

  RdsProxyArn:
    Description: ARN of the DB proxy
    Value: !GetAtt RdsProxyPostgres.DBProxyArn

  RdsProxyEndpoint:
    Description: Endpoint to connect to the DB proxy
    Value: !GetAtt RdsProxyPostgres.Endpoint