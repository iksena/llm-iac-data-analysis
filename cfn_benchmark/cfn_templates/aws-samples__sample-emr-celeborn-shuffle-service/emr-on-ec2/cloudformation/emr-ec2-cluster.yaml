AWSTemplateFormatVersion: "2010-09-09"
Description: >
  EMR on EC2 cluster for Spark workloads using Apache Celeborn as Remote Shuffle Service.
  Imports shared VPC, subnets, KMS key, and IAM roles from other stacks.
  EMR auto-creates default managed SGs; only EmrCelebornAccessSg is added for Celeborn connectivity.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Cluster Configuration
        Parameters:
          - ProjectName
          - EMRReleaseLabel
      - Label:
          default: Master Node
        Parameters:
          - MasterInstanceType
      - Label:
          default: Core Nodes
        Parameters:
          - CoreInstanceType
          - CoreInstanceCount
      - Label:
          default: S3
        Parameters:
          - S3BucketName

Parameters:
  ProjectName:
    Type: String
    Default: emr-celeborn-demo
    Description: Project name used to import exports and for tagging

  EMRReleaseLabel:
    Type: String
    Default: emr-7.12.0
    Description: EMR release label for the cluster

  MasterInstanceType:
    Type: String
    Default: m5.2xlarge
    Description: EC2 instance type for the EMR primary node

  CoreInstanceType:
    Type: String
    Default: r5.4xlarge
    Description: EC2 instance type for EMR core nodes (memory-optimized for Spark)

  CoreInstanceCount:
    Type: Number
    Default: 3
    MinValue: 1
    Description: Number of EMR core nodes

  S3BucketName:
    Type: String
    Description: S3 bucket name for EMR logs and Spark job artifacts

Resources:
  # --- EMR on EC2 Cluster ---

  EMRCluster:
    Type: AWS::EMR::Cluster
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W63
            reason: "SecurityConfiguration is not required for this blog post demonstration. In production, enable SecurityConfiguration to enforce encryption in transit and at rest."
      guard:
        SuppressedRules:
          - EMR_KERBEROS_ENABLED: "Kerberos authentication is not required for this blog post demonstration."
    Properties:
      Name: !Sub "${ProjectName}-emr-ec2"
      ReleaseLabel: !Ref EMRReleaseLabel
      Applications:
        - Name: Spark
        - Name: Hadoop
      ServiceRole: !ImportValue
        Fn::Sub: "${ProjectName}-EmrEc2ServiceRoleName"
      JobFlowRole: !ImportValue
        Fn::Sub: "${ProjectName}-EmrEc2InstanceProfileName"
      AutoScalingRole: !ImportValue
        Fn::Sub: "${ProjectName}-EmrEc2AutoScalingRoleArn"
      LogUri: !Sub "s3://${S3BucketName}/logs/emr-on-ec2/emr-steps/"
      VisibleToAllUsers: true
      StepConcurrencyLevel: 10

      # Network — private subnet with EMR default managed SGs + additional Celeborn SG.
      # EMR auto-creates ElasticMapReduce-Primary-Private, ElasticMapReduce-Core-Private,
      # and ElasticMapReduce-ServiceAccess with all required intra-cluster rules.
      # Only EmrCelebornAccessSg is added for Celeborn connectivity.
      Instances:
        Ec2SubnetId: !ImportValue
          Fn::Sub: "${ProjectName}-PrivateSubnet1Id"
        AdditionalMasterSecurityGroups:
          - !ImportValue
            Fn::Sub: "${ProjectName}-EmrCelebornAccessSgId"
        AdditionalSlaveSecurityGroups:
          - !ImportValue
            Fn::Sub: "${ProjectName}-EmrCelebornAccessSgId"
        KeepJobFlowAliveWhenNoSteps: true
        TerminationProtected: false
        MasterInstanceGroup:
          Name: !Sub "${ProjectName}-master"
          InstanceCount: 1
          InstanceType: !Ref MasterInstanceType
          Market: ON_DEMAND
        CoreInstanceGroup:
          Name: !Sub "${ProjectName}-core"
          InstanceCount: !Ref CoreInstanceCount
          InstanceType: !Ref CoreInstanceType
          Market: ON_DEMAND
          EbsConfiguration:
            EbsBlockDeviceConfigs:
              - VolumeSpecification:
                  VolumeType: gp3
                  SizeInGB: 100
                VolumesPerInstance: 1
            EbsOptimized: true

      # Bootstrap — install Celeborn client jars on all nodes
      BootstrapActions:
        - Name: install-celeborn-client
          ScriptBootstrapAction:
            Path: !Sub "s3://${S3BucketName}/bootstrap/install-celeborn-client.sh"

      Configurations:
        # Log aggregation to S3
        - Classification: yarn-site
          ConfigurationProperties:
            yarn.log-aggregation-enable: "true"
            yarn.log-aggregation.retain-seconds: "-1"
            yarn.nodemanager.remote-app-log-dir: !Sub "s3://${S3BucketName}/logs/emr-on-ec2/emr-steps/yarn-logs"

      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-emr-ec2"
        - Key: Project
          Value: !Ref ProjectName

Outputs:
  ClusterId:
    Description: ID of the EMR on EC2 cluster
    Value: !Ref EMRCluster
    Export:
      Name: !Sub "${ProjectName}-EmrEc2ClusterId"

  ClusterName:
    Description: Name of the EMR on EC2 cluster
    Value: !Sub "${ProjectName}-emr-ec2"
    Export:
      Name: !Sub "${ProjectName}-EmrEc2ClusterName"