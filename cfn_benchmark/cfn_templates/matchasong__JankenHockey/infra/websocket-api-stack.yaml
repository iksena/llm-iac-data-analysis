AWSTemplateFormatVersion: "2010-09-09"
Description: WebSocket API for JankenHockey

Parameters:
  LambdaBucket:
    Type: String
    Description: S3 Bucket name where Lambda code is stored.
  LambdaZipFile:
    Type: String
    Description: S3 Key for the Lambda zip file.
  UserPoolArn:
    Type: String
    Description: Cognito User Pool ARN
  UserPoolId:
    Type: String
    Description: Cognito User Pool ID
  UserPoolClientId:
    Type: String
    Description: Cognito User Pool Client ID
  CloudFrontOriginUrl:
    Type: String
    Description: CloudFront Origin URL for Web Hosting

Resources:
  #############################
  # Login (Lambda + IAM Role)
  #############################
  # IAM Role for Login Function
  JankenHockeyLoginFunctionRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    Properties:
      RoleName: JankenHockeyLoginFunctionRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: JankenHockeyLoginFunctionPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:*
                Resource: arn:aws:logs:*:*:*
              - Effect: Allow
                Action:
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminSetUserPassword
                  - cognito-idp:AdminInitiateAuth
                  - cognito-idp:ListUsers
                  - cognito-idp:AdminGetUser
                Resource: !Ref UserPoolArn

  # Lambda Function for Login
  JankenHockeyLoginFunction:
    Type: AWS::Lambda::Function
    DeletionPolicy: RetainExceptOnCreate
    Properties:
      FunctionName: JankenHockeyLoginFunction
      Handler: login.handler
      Role: !GetAtt JankenHockeyLoginFunctionRole.Arn
      Code:
        S3Bucket: !Ref LambdaBucket
        S3Key: !Ref LambdaZipFile
      Runtime: python3.12
      Timeout: 30
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPoolId
          CLIENT_ID: !Ref UserPoolClientId
      Tags:
        - Key: Project
          Value: JankenHockey

  ############################
  # DB
  ############################
  ## DynamoDB
  # GameHistory Table
  JankenHockeyGameHistoryTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: RetainExceptOnCreate
    Properties:
      TableName: GameHistory
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Project
          Value: JankenHockey

  # Connection Table
  JankenHockeyConnectionTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: RetainExceptOnCreate
    Properties:
      TableName: Connection
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: room_id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      GlobalSecondaryIndexes:
        - IndexName: roomId-index
          KeySchema:
            - AttributeName: room_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: JankenHockey

  # Room Table
  JankenHockeyRoomTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: RetainExceptOnCreate
    Properties:
      TableName: Room
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      Tags:
        - Key: Project
          Value: JankenHockey

  # ###########################
  # # Lambda関数
  # ###########################
  # # IAMロール
  JankenHockeyFunctionRole:
    DeletionPolicy: Retain
    Type: AWS::IAM::Role
    Properties:
      RoleName: JankenHockeyFunctionRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: JankenHockeyFunctionPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:*
                Resource: arn:aws:logs:*:*:*
              - Effect: Allow
                Action:
                  - dynamodb:*
                Resource: !GetAtt JankenHockeyConnectionTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:*
                Resource: !GetAtt JankenHockeyRoomTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:*
                Resource: !GetAtt JankenHockeyGameHistoryTable.Arn
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:JankenHockey*

  # デフォルト処理用 Lambda関数ロール
  JankenHockeyDefaultFunctionRole:
    Type: AWS::IAM::Role
    DeletionPolicy: RetainExceptOnCreate
    Properties:
      RoleName: JankenHockeyDefaultFunctionRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeSendMessageFunctionPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:*
                Resource: arn:aws:logs:*:*:*
              - Effect: Allow
                Action:
                  - dynamodb:*
                Resource: !GetAtt JankenHockeyConnectionTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:Query
                Resource:
                  - !GetAtt JankenHockeyConnectionTable.Arn
                  - !Sub
                    - arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}/index/roomId-index
                    - { TableName: !Ref JankenHockeyConnectionTable }
              - Effect: Allow
                Action:
                  - dynamodb:*
                Resource: !GetAtt JankenHockeyRoomTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:*
                Resource: !GetAtt JankenHockeyGameHistoryTable.Arn
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt JankenHockeyGameTimeoutFunction.Arn
              - Effect: Allow
                Action:
                  - execute-api:Invoke
                Resource: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${JankenHockeyAPI}/*/*/*
              - Effect: Allow
                Action:
                  - execute-api:ManageConnections
                Resource: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${JankenHockeyAPI}/*/*/*/*

  # ゲームタイムアウト用 Lambda関数ロール
  JankenHockeyGameTimeoutFunctionRole:
    Type: AWS::IAM::Role
    DeletionPolicy: RetainExceptOnCreate
    Properties:
      RoleName: JankenHockeyGameTimeoutFunctionRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: JankenHockeyGameTimeoutFunctionPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:*
                Resource: arn:aws:logs:*:*:*
              - Effect: Allow
                Action:
                  - dynamodb:Scan
                  - dynamodb:DeleteItem
                Resource: !GetAtt JankenHockeyConnectionTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:Query
                Resource:
                  - !GetAtt JankenHockeyConnectionTable.Arn
                  - !Sub
                    - arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TableName}/index/roomId-index
                    - { TableName: !Ref JankenHockeyConnectionTable }
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                Resource: !GetAtt JankenHockeyRoomTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource: !GetAtt JankenHockeyGameHistoryTable.Arn
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                Resource: !GetAtt JankenHockeyGameHistoryTable.Arn
              - Effect: Allow
                Action:
                  - execute-api:ManageConnections
                Resource: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${JankenHockeyAPI}/*/*/*/*

  ## Lambda
  # WebSocket接続処理 Lambda関数
  JankenHockeyConnectFunction:
    Type: AWS::Lambda::Function
    DeletionPolicy: RetainExceptOnCreate
    Properties:
      FunctionName: JankenHockeyConnectFunction
      Handler: connect.handler
      Role: !GetAtt JankenHockeyFunctionRole.Arn
      Code:
        S3Bucket: !Ref LambdaBucket
        S3Key: !Ref LambdaZipFile
      Runtime: python3.12
      Timeout: 30
      Tags:
        - Key: Project
          Value: JankenHockey
      Environment:
        Variables:
          CLOUDFRONT_ORIGIN_URL: !Ref CloudFrontOriginUrl

  # WebSocketデフォルト処理 Lambda関数
  JankenHockeyDefaultFunction:
    Type: AWS::Lambda::Function
    DeletionPolicy: RetainExceptOnCreate
    Properties:
      FunctionName: JankenHockeyDefaultFunction
      Handler: default.handler
      Role: !GetAtt JankenHockeyDefaultFunctionRole.Arn
      Code:
        S3Bucket: !Ref LambdaBucket
        S3Key: !Ref LambdaZipFile
      Runtime: python3.12
      Timeout: 1
      MemorySize: 10240
      Tags:
        - Key: Project
          Value: JankenHockey
      Environment:
        Variables:
          GAME_TIMEOUT_LAMBDA_NAME: !Ref JankenHockeyGameTimeoutFunction
          API_ENDPOINT: !GetAtt JankenHockeyAPI.ApiEndpoint
          STAGE: prod

  # ゲームタイムアウト用 Lambda関数
  JankenHockeyGameTimeoutFunction:
    Type: AWS::Lambda::Function
    DeletionPolicy: RetainExceptOnCreate
    Properties:
      FunctionName: JankenHockeyGameTimeoutFunction
      Handler: game_timeout.handler
      Role: !GetAtt JankenHockeyGameTimeoutFunctionRole.Arn
      Code:
        S3Bucket: !Ref LambdaBucket
        S3Key: !Ref LambdaZipFile
      Runtime: python3.12
      Timeout: 90 # 60秒のスリープ + 処理時間
      MemorySize: 512
      Tags:
        - Key: Project
          Value: JankenHockey
      Environment:
        Variables:
          API_ENDPOINT: !GetAtt JankenHockeyAPI.ApiEndpoint
          STAGE: prod

  # WebSocket切断処理 Lambda関数
  JankenHockeyDisconnectFunction:
    Type: AWS::Lambda::Function
    DeletionPolicy: RetainExceptOnCreate
    Properties:
      FunctionName: JankenHockeyDisconnectFunction
      Handler: disconnect.handler
      Role: !GetAtt JankenHockeyFunctionRole.Arn
      Code:
        S3Bucket: !Ref LambdaBucket
        S3Key: !Ref LambdaZipFile
      Runtime: python3.12
      Timeout: 30
      Tags:
        - Key: Project
          Value: JankenHockey
      Environment:
        Variables:
          DEFAULT_LAMBDA_NAME: !Ref JankenHockeyDefaultFunction

  ############################
  # API (WebSocket)
  ############################
  # API Gateway IAMロール
  JankenHockeyAPIRole:
    Type: AWS::IAM::Role
    DeletionPolicy: RetainExceptOnCreate
    Properties:
      RoleName: JankenHockeyAPIRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: JankenHockeyAPIPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt JankenHockeyConnectFunction.Arn
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt JankenHockeyDisconnectFunction.Arn
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt JankenHockeyDefaultFunction.Arn
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:JankenHockeyAuthorizerFunction
              - Effect: Allow
                Action:
                  - "execute-api:ManageConnections"
                  - "execute-api:InvalidateCache"
                Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${JankenHockeyAPI}/*"

  # API
  JankenHockeyAPI:
    Type: "AWS::ApiGatewayV2::Api"
    DeletionPolicy: RetainExceptOnCreate
    Properties:
      Name: JankenHockeyAPI
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: $request.body.action
      ApiKeySelectionExpression: $request.header.x-api-key

  # API Gateway ロググループ
  JankenHockeyAPILogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: RetainExceptOnCreate
    Properties:
      LogGroupName: !Join
        - "-"
        - - !Ref JankenHockeyAPI
          - access-logs

  # Lambda Authorizer
  JankenHockeyAPIAuthorizer:
    Type: "AWS::ApiGatewayV2::Authorizer"
    DeletionPolicy: RetainExceptOnCreate
    Properties:
      ApiId: !Ref JankenHockeyAPI
      AuthorizerType: REQUEST
      Name: JankenHockeyAuthorizer
      AuthorizerUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:JankenHockeyAuthorizerFunction/invocations"
      IdentitySource:
        - "route.request.querystring.token"

  # Connect Route
  JankenHockeyAPIConnectRoute:
    Type: "AWS::ApiGatewayV2::Route"
    Properties:
      ApiId: !Ref JankenHockeyAPI
      RouteKey: $connect
      Target: !Sub "integrations/${JankenHockeyAPIConnectIntegration}"
      AuthorizationType: CUSTOM
      AuthorizerId: !Ref JankenHockeyAPIAuthorizer

  JankenHockeyAPIConnectIntegration:
    Type: "AWS::ApiGatewayV2::Integration"
    Properties:
      ApiId: !Ref JankenHockeyAPI
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${JankenHockeyConnectFunction.Arn}/invocations"

  # Disconnect Route
  JankenHockeyAPIDisconnectRoute:
    Type: "AWS::ApiGatewayV2::Route"
    Properties:
      ApiId: !Ref JankenHockeyAPI
      RouteKey: $disconnect
      Target: !Sub "integrations/${JankenHockeyAPIDisconnectIntegration}"

  JankenHockeyAPIDisconnectIntegration:
    Type: "AWS::ApiGatewayV2::Integration"
    Properties:
      ApiId: !Ref JankenHockeyAPI
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${JankenHockeyDisconnectFunction.Arn}/invocations"
      PayloadFormatVersion: 1.0
      CredentialsArn: !GetAtt JankenHockeyAPIRole.Arn

  # Default Route
  JankenHockeyAPIDefaultRoute:
    Type: "AWS::ApiGatewayV2::Route"
    Properties:
      ApiId: !Ref JankenHockeyAPI
      RouteKey: $default
      Target: !Sub "integrations/${JankenHockeyAPIDefaultIntegration}"

  JankenHockeyAPIDefaultIntegration:
    Type: "AWS::ApiGatewayV2::Integration"
    Properties:
      ApiId: !Ref JankenHockeyAPI
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${JankenHockeyDefaultFunction.Arn}/invocations"
      PayloadFormatVersion: 1.0
      CredentialsArn: !GetAtt JankenHockeyAPIRole.Arn

  # Lambda Permission(Connect)
  JankenHockeyConnectPermission:
    Type: "AWS::Lambda::Permission"
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt JankenHockeyConnectFunction.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${JankenHockeyAPI}/*/*/*

  # Lambda Permission(Disconnect)
  JankenHockeyDisconnectPermission:
    Type: "AWS::Lambda::Permission"
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt JankenHockeyDisconnectFunction.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${JankenHockeyAPI}/*/*/*

  # Lambda Permission(Default)
  JankenHockeyDefaultPermission:
    Type: "AWS::Lambda::Permission"
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt JankenHockeyDefaultFunction.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${JankenHockeyAPI}/*/*/*

  # Lambda Permission(Authorizer)
  JankenHockeyAuthorizerPermission:
    Type: "AWS::Lambda::Permission"
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:JankenHockeyAuthorizerFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${JankenHockeyAPI}/authorizers/*

  # API Gateway Deployment
  JankenHockeyAPIDeployment:
    DeletionPolicy: RetainExceptOnCreate
    Type: "AWS::ApiGatewayV2::Deployment"
    DependsOn:
      - JankenHockeyAPIConnectRoute
      - JankenHockeyAPIDisconnectRoute
      - JankenHockeyAPIDefaultRoute
      - JankenHockeyAPIConnectIntegration
      - JankenHockeyAPIDisconnectIntegration
      - JankenHockeyAPIDefaultIntegration
    Properties:
      ApiId: !Ref JankenHockeyAPI
      Description: !Sub "Deployment triggered by Lambda package: ${LambdaZipFile}"

  # API Gateway ステージおよびログ出力設定
  JankenHockeyAPIStage:
    DeletionPolicy: RetainExceptOnCreate
    Type: "AWS::ApiGatewayV2::Stage"
    Properties:
      ApiId: !Ref JankenHockeyAPI
      DeploymentId: !Ref JankenHockeyAPIDeployment
      StageName: prod
      DefaultRouteSettings:
        DetailedMetricsEnabled: true
        LoggingLevel: INFO
        DataTraceEnabled: false
        ThrottlingBurstLimit: 500
        ThrottlingRateLimit: 100
      AccessLogSettings:
        DestinationArn: !GetAtt JankenHockeyAPILogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId", "ip": "$context.identity.sourceIp",
          "caller":"$context.identity.caller",
          "user":"$context.identity.user","requestTime":"$context.requestTime",
          "eventType":"$context.eventType","routeKey":"$context.routeKey",
          "status":"$context.status","connectionId":"$context.connectionId"}

Outputs:
  JankenHockeyWebSocketAPIId:
    Description: WebSocket API ID for JankenHockey
    Value: !Ref JankenHockeyAPI
    Export:
      Name: JankenHockeyWebSocketAPIId

  JankenHockeyGameHistoryTableName:
    Description: DynamoDB GameHistory Table Name
    Value: !Ref JankenHockeyGameHistoryTable
    Export:
      Name: JankenHockeyGameHistoryTableName

  JankenHockeyConnectionTableName:
    Description: DynamoDB Connection Table Name
    Value: !Ref JankenHockeyConnectionTable
    Export:
      Name: JankenHockeyConnectionTableName

  JankenHockeyRoomTableName:
    Description: DynamoDB Room Table Name
    Value: !Ref JankenHockeyRoomTable
    Export:
      Name: JankenHockeyRoomTableName

  JankenHockeyLoginFunctionName:
    Description: Lambda Function Name for JankenHockey Login
    Value: !Ref JankenHockeyLoginFunction
    Export:
      Name: JankenHockeyLoginFunctionName

  JankenHockeyConnectFunctionName:
    Description: Lambda Function Name for JankenHockey Connect
    Value: !Ref JankenHockeyConnectFunction
    Export:
      Name: JankenHockeyConnectFunctionName

  JankenHockeyDisconnectFunctionName:
    Description: Lambda Function Name for JankenHockey Disconnect
    Value: !Ref JankenHockeyDisconnectFunction
    Export:
      Name: JankenHockeyDisconnectFunctionName

  JankenHockeyDefaultFunctionName:
    Description: Lambda Function Name for JankenHockey Default
    Value: !Ref JankenHockeyDefaultFunction
    Export:
      Name: JankenHockeyDefaultFunctionName

  JankenHockeyGameTimeoutFunctionName:
    Description: Lambda Function Name for JankenHockey GameTimeout
    Value: !Ref JankenHockeyGameTimeoutFunction
    Export:
      Name: JankenHockeyGameTimeoutFunctionName