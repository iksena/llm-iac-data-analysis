AWSTemplateFormatVersion: "2010-09-09"
Description: svcrolegen-AWS-CloudWatch-Alarm
Parameters:
    InstanceImageId:
        Type: AWS::EC2::Image::Id
        Description: AMI ID to launch the EC2 instance that will be monitored by the alarm
Resources:
    MonitoredInstance:
        Type: AWS::EC2::Instance
        Properties:
            ImageId: !Ref InstanceImageId
            InstanceType: t3.micro
    AlarmTopic:
        Type: AWS::SNS::Topic
        Properties:
            TopicName: svcrolegensupport-AWS-CloudWatch-Alarm-Topic
    Alarm:
        Type: AWS::CloudWatch::Alarm
        Properties:
            MetricName: StatusCheckFailed_System
            ComparisonOperator: GreaterThanThreshold
            EvaluationPeriods: 1
            Period: 60
            Namespace: AWS/EC2
            #Statistic: Average
            Threshold: 1
            ActionsEnabled: true
            AlarmActions:
              - !Ref AlarmTopic
              - arn:aws:automate:ap-southeast-2:ec2:stop
              - !Sub arn:aws:automate:${AWS::Region}:ec2:terminate
              - !Sub arn:aws:automate:${AWS::Region}:ec2:recover
              - !Sub arn:aws:automate:${AWS::Region}:ec2:reboot
            AlarmDescription: mydescription
            AlarmName: myalarm
            DatapointsToAlarm: 1
            Dimensions:
              - Name: InstanceId
                Value: !Ref MonitoredInstance
            EvaluateLowSampleCountPercentile: evaluate
            ExtendedStatistic: p10.0
            InsufficientDataActions:
              - !Ref AlarmTopic
              - !Sub arn:aws:autoscaling:${AWS::Region}:${AWS::AccountId}:scalingPolicy:policy-id:autoScalingGroupName/group-friendly-name:policyName/policy-friendly-name
            # Metrics:
            #     - MetricDataQuery
            OKActions:
              - !Ref AlarmTopic
            # ThresholdMetricId: String
            TreatMissingData: notBreaching
            Unit: None
