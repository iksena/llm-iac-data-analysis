---
# Bashlinux::Secrets Manager::Credentials
#
#   Cloudformation template to generate a secret in Secrets Manager
#
#   Manuel F Martinez
#   Bashlinux
#   Los Angeles, CA
#
AWSTemplateFormatVersion: "2010-09-09"
Description: Secrets Manager Secret template

###############################################################################
Parameters:

  Environment:
    Description: Working environment
    Type: String
    MinLength: "1"
    MaxLength: "20"
    Default: staging
    AllowedValues: [ "prod", "staging" ]
    ConstraintDescription: >
      Environment name can only contain "prod" or "staging"

  Organization:
    Description: Organization or Customer name
    Type: String
    MinLength: "1"
    MaxLength: "32"
    Default: bashlinux
    AllowedPattern: "[a-zA-Z0-9\\-]*"
    ConstraintDescription: >
      Name of the organization must contains only letters, numbers and hyphens

  ManagedService:
    Description: Name of the managed service these credentials are created for
    Type: String
    MinLength: "1"
    MaxLength: "32"
    Default: any
    AllowedPattern: "[a-zA-Z0-9]*"
    ConstraintDescription: >
      Name of the managed service must contains only letters and numbers

  StringKey:
    Description: Key name of the key/value pair credential
    Type: String
    MinLength: "1"
    MaxLength: "32"
    Default: password
    AllowedPattern: "[a-zA-Z]*"
    ConstraintDescription: >
      Name of the key string must contains only letters

###############################################################################
Resources:

  SecretsManagerCredentials:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub "Credentials for ${Organization} ${Environment} ${ManagedService}"
      GenerateSecretString:
        ExcludeCharacters: "\"'`\\$,:=[]@/ #?="
        GenerateStringKey: !Ref StringKey
        SecretStringTemplate: !Sub '{"username": "${Organization}"}'
        PasswordLength: 32
      KmsKeyId: !Sub "alias/${Organization}/${ManagedService}/${Environment}"
      Name: !Sub "secret/${Organization}/${Environment}/${ManagedService}"
      Tags:
      - Key: Name
        Value: !Sub "secret/${Organization}/${Environment}/${ManagedService}"
      - Key: bashlinux:organization-name
        Value: !Ref Organization
      - Key: bashlinux:environment-name
        Value: !Ref Environment
      - Key: bashlinux:application-id
        Value: !Ref AWS::StackName
      - Key: bashlinux:can-delete
        Value: "false"
      - Key: bashlinux:network-visibility
        Value: private

###############################################################################
Outputs:

  SecretsManagerCredentialsArn:
    Description: Full ARN of the secret
    Value: !Ref SecretsManagerCredentials
    Export:
      Name: !Sub "${Organization}-${Environment}-${ManagedService}-SecretsManagerCredentialsArn"