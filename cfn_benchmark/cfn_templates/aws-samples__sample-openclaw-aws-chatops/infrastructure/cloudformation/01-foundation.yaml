AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  OpenClaw Foundation Stack - VPC, subnets, route tables, internet gateway,
  VPC endpoints, KMS keys, security groups, and EFS.

Parameters:
  Environment:
    Type: String
    Default: dev
    Description: Environment name
  ProjectName:
    Type: String
    Default: openclaw
    Description: Resource name prefix
  VpcCidr:
    Type: String
    Default: '10.100.0.0/16'
    Description: VPC CIDR block
  S3PrefixListId:
    Type: String
    Description: S3 managed prefix list ID for ComputeSG egress rules
  CloudFrontPrefixListId:
    Type: String
    Description: CloudFront origin-facing prefix list ID for ALB SG ingress

Resources:
  # ============================================================================
  # VPC + Internet Gateway (3 resources)
  # ============================================================================
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-vpc'
        - Key: Environment
          Value: !Ref Environment

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-igw'

  IGWAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # ============================================================================
  # Subnets (8 resources)
  # Fn::Cidr generates 64 /24 subnets from the /16 VPC.
  # Indices: 0,1=public  10,11=endpoint  20,21=compute  30,31=data
  # ============================================================================
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 64, 8]]
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-public-1'

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 64, 8]]
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-public-2'

  EndpointSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [10, !Cidr [!Ref VpcCidr, 64, 8]]
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-endpoint-1'

  EndpointSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [11, !Cidr [!Ref VpcCidr, 64, 8]]
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-endpoint-2'

  ComputeSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [20, !Cidr [!Ref VpcCidr, 64, 8]]
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-compute-1'

  ComputeSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [21, !Cidr [!Ref VpcCidr, 64, 8]]
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-compute-2'

  DataSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [30, !Cidr [!Ref VpcCidr, 64, 8]]
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-data-1'

  DataSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [31, !Cidr [!Ref VpcCidr, 64, 8]]
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-data-2'

  # ============================================================================
  # Route Tables (4 tables + 1 default route + 8 associations = 13 resources)
  # ============================================================================
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-public-rt'

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: IGWAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: '0.0.0.0/0'
      GatewayId: !Ref InternetGateway

  EndpointRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-endpoint-rt'

  ComputeRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-compute-rt'

  DataRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-data-rt'

  PublicSubnet1RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  EndpointSubnet1RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref EndpointSubnet1
      RouteTableId: !Ref EndpointRouteTable

  EndpointSubnet2RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref EndpointSubnet2
      RouteTableId: !Ref EndpointRouteTable

  ComputeSubnet1RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref ComputeSubnet1
      RouteTableId: !Ref ComputeRouteTable

  ComputeSubnet2RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref ComputeSubnet2
      RouteTableId: !Ref ComputeRouteTable

  DataSubnet1RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DataSubnet1
      RouteTableId: !Ref DataRouteTable

  DataSubnet2RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DataSubnet2
      RouteTableId: !Ref DataRouteTable

  # ============================================================================
  # Security Groups (4 groups + 1 ingress rule = 5 resources)
  # ============================================================================
  ComputeSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub '${ProjectName}-${Environment} Fargate tasks'
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !GetAtt VPC.CidrBlock
          Description: HTTPS to VPC endpoints
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          DestinationPrefixListId: !Ref S3PrefixListId
          Description: HTTPS to S3 via prefix list
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-compute-sg'

  ComputeSGEgressToEFS:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref ComputeSG
      IpProtocol: tcp
      FromPort: 2049
      ToPort: 2049
      DestinationSecurityGroupId: !Ref EFSSecurityGroup
      Description: NFS to EFS

  ComputeSGIngressFromALB:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ComputeSG
      IpProtocol: tcp
      FromPort: 18789
      ToPort: 18789
      SourceSecurityGroupId: !Ref ALBSecurityGroup
      Description: OpenClaw gateway from ALB

  EndpointsSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub '${ProjectName}-${Environment} VPC endpoint ENIs'
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !GetAtt VPC.CidrBlock
          Description: HTTPS from VPC CIDR
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 127.0.0.1/32
          Description: Dummy egress for cfn-nag (inbound-only SG)
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-endpoints-sg'

  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub '${ProjectName}-${Environment} ALB'
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !Ref CloudFrontPrefixListId
          Description: HTTP from CloudFront prefix list
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 18789
          ToPort: 18789
          DestinationSecurityGroupId: !Ref ComputeSG
          Description: OpenClaw gateway to Fargate tasks
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-alb-sg'

  DataSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub '${ProjectName}-${Environment} data tier (OpenSearch)'
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref ComputeSG
          Description: HTTPS from Fargate tasks
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 127.0.0.1/32
          Description: Dummy egress for cfn-nag (inbound-only SG)
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-data-sg'

  # ============================================================================
  # KMS Keys (4 keys + 4 aliases = 8 resources)
  # ============================================================================
  KnowledgeKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub '${ProjectName}-${Environment} knowledge data encryption'
      EnableKeyRotation: true
      PendingWindowInDays: 7
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableRootAccountAccess
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: AllowCloudWatchLogs
            Effect: Allow
            Principal:
              Service: !Sub 'logs.${AWS::Region}.amazonaws.com'
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: '*'
            Condition:
              ArnLike:
                kms:EncryptionContext:aws:logs:arn: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:*'
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-knowledge-key'

  KnowledgeKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/${ProjectName}-${Environment}-knowledge-key'
      TargetKeyId: !Ref KnowledgeKey

  InfraLogsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub '${ProjectName}-${Environment} infrastructure logs encryption'
      EnableKeyRotation: true
      PendingWindowInDays: 7
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableRootAccountAccess
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: AllowCloudWatchLogs
            Effect: Allow
            Principal:
              Service: !Sub 'logs.${AWS::Region}.amazonaws.com'
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: '*'
            Condition:
              ArnLike:
                kms:EncryptionContext:aws:logs:arn: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:*'
          - Sid: AllowCloudTrail
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: '*'
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-infralogs-key'

  InfraLogsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/${ProjectName}-${Environment}-infralogs-key'
      TargetKeyId: !Ref InfraLogsKey

  EventsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub '${ProjectName}-${Environment} events and SNS encryption'
      EnableKeyRotation: true
      PendingWindowInDays: 7
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableRootAccountAccess
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: AllowCloudWatchLogs
            Effect: Allow
            Principal:
              Service: !Sub 'logs.${AWS::Region}.amazonaws.com'
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: '*'
            Condition:
              ArnLike:
                kms:EncryptionContext:aws:logs:arn: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:*'
          - Sid: AllowSNS
            Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: '*'
          - Sid: AllowCloudWatchAlarms
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey*
            Resource: '*'
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-events-key'

  EventsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/${ProjectName}-${Environment}-events-key'
      TargetKeyId: !Ref EventsKey

  OpenSearchKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub '${ProjectName}-${Environment} OpenSearch encryption'
      EnableKeyRotation: true
      PendingWindowInDays: 7
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableRootAccountAccess
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-opensearch-key'

  OpenSearchKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/${ProjectName}-${Environment}-opensearch-key'
      TargetKeyId: !Ref OpenSearchKey

  # ============================================================================
  # VPC Endpoints (8 resources -- includes SSM for ECS Exec + Secrets)
  # ============================================================================

  # Gateway endpoint (free) -- routes to ALL 4 route tables
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PublicRouteTable
        - !Ref EndpointRouteTable
        - !Ref ComputeRouteTable
        - !Ref DataRouteTable
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowAccountBucketsOnly
            Effect: Allow
            Principal: '*'
            Action: 's3:*'
            Resource: 'arn:aws:s3:::*'
            Condition:
              StringEquals:
                s3:ResourceAccount: !Ref AWS::AccountId
          - Sid: AllowECRLayerBuckets
            Effect: Allow
            Principal: '*'
            Action: 's3:GetObject'
            Resource: 'arn:aws:s3:::prod-*-starport-layer-bucket/*'

  # Interface endpoints -- placed in EndpointSubnet1/2 with EndpointsSG
  ECRApiEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ecr.api'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref EndpointSubnet1
        - !Ref EndpointSubnet2
      SecurityGroupIds:
        - !Ref EndpointsSG

  ECRDkrEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ecr.dkr'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref EndpointSubnet1
        - !Ref EndpointSubnet2
      SecurityGroupIds:
        - !Ref EndpointsSG

  CloudWatchLogsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.logs'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref EndpointSubnet1
        - !Ref EndpointSubnet2
      SecurityGroupIds:
        - !Ref EndpointsSG

  BedrockRuntimeEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.bedrock-runtime'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref EndpointSubnet1
        - !Ref EndpointSubnet2
      SecurityGroupIds:
        - !Ref EndpointsSG

  SSMEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ssm'
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref EndpointSubnet1
        - !Ref EndpointSubnet2
      SecurityGroupIds:
        - !Ref EndpointsSG
      PrivateDnsEnabled: true

  SSMMessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ssmmessages'
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref EndpointSubnet1
        - !Ref EndpointSubnet2
      SecurityGroupIds:
        - !Ref EndpointsSG
      PrivateDnsEnabled: true

  # ============================================================================
  # EFS (5 resources)
  # Mount targets in COMPUTE subnets (where Fargate tasks run)
  # ============================================================================
  StateFileSystem:
    Type: AWS::EFS::FileSystem
    Properties:
      Encrypted: true
      KmsKeyId: !GetAtt KnowledgeKey.Arn
      PerformanceMode: generalPurpose
      ThroughputMode: elastic
      BackupPolicy:
        Status: ENABLED

  EFSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub '${ProjectName}-${Environment} EFS mount targets'
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId: !Ref ComputeSG
          Description: NFS from Fargate tasks
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 127.0.0.1/32
          Description: Dummy egress for cfn-nag (inbound-only SG)
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-efs-sg'

  EFSMountTarget1:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref StateFileSystem
      SubnetId: !Ref ComputeSubnet1
      SecurityGroups:
        - !Ref EFSSecurityGroup

  EFSMountTarget2:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref StateFileSystem
      SubnetId: !Ref ComputeSubnet2
      SecurityGroups:
        - !Ref EFSSecurityGroup

  EFSAccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref StateFileSystem
      PosixUser:
        Uid: '1000'
        Gid: '1000'
      RootDirectory:
        Path: /openclaw-state
        CreationInfo:
          OwnerUid: '1000'
          OwnerGid: '1000'
          Permissions: '755'
      AccessPointTags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-state-ap'

  # ============================================================================
  # DNS Firewall (4 resources)
  # Restrict VPC DNS resolution to AWS services + Cloud Map only
  # ============================================================================
  DNSFirewallAllowList:
    Type: AWS::Route53Resolver::FirewallDomainList
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-allow-domains'
      Domains:
        - '*.amazonaws.com'
        - '*.api.aws'
        - '*.aws.amazon.com'
        - '*.amazontrust.com'
        - 'openclaw.local'
        - '*.openclaw.local'

  DNSFirewallDenyAll:
    Type: AWS::Route53Resolver::FirewallDomainList
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-deny-all'
      Domains:
        - '*'

  DNSFirewallRuleGroup:
    Type: AWS::Route53Resolver::FirewallRuleGroup
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-dns-firewall'
      FirewallRules:
        - Action: ALLOW
          FirewallDomainListId: !Ref DNSFirewallAllowList
          Priority: 100
        - Action: BLOCK
          BlockResponse: NXDOMAIN
          FirewallDomainListId: !Ref DNSFirewallDenyAll
          Priority: 200

  DNSFirewallAssociation:
    Type: AWS::Route53Resolver::FirewallRuleGroupAssociation
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-dns-firewall-assoc'
      FirewallRuleGroupId: !Ref DNSFirewallRuleGroup
      VpcId: !Ref VPC
      Priority: 101

Outputs:
  VpcId:
    Value: !Ref VPC
  VpcCidr:
    Value: !GetAtt VPC.CidrBlock
  PublicSubnet1Id:
    Value: !Ref PublicSubnet1
  PublicSubnet2Id:
    Value: !Ref PublicSubnet2
  ComputeSubnet1Id:
    Value: !Ref ComputeSubnet1
  ComputeSubnet2Id:
    Value: !Ref ComputeSubnet2
  DataSubnet1Id:
    Value: !Ref DataSubnet1
  DataSubnet2Id:
    Value: !Ref DataSubnet2
  ComputeSGId:
    Value: !Ref ComputeSG
  ALBSecurityGroupId:
    Value: !Ref ALBSecurityGroup
  DataSGId:
    Value: !Ref DataSG
  KnowledgeKeyArn:
    Value: !GetAtt KnowledgeKey.Arn
  InfraLogsKeyArn:
    Value: !GetAtt InfraLogsKey.Arn
  EventsKeyArn:
    Value: !GetAtt EventsKey.Arn
  OpenSearchKeyArn:
    Value: !GetAtt OpenSearchKey.Arn
  EfsId:
    Value: !Ref StateFileSystem
  EfsAccessPointId:
    Value: !Ref EFSAccessPoint
  S3PrefixListId:
    Value: !Ref S3PrefixListId
  EFSSecurityGroupId:
    Value: !Ref EFSSecurityGroup