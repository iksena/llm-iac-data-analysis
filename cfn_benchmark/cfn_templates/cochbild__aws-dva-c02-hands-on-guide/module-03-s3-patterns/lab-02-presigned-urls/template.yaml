AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  DVA-C02 Lab 3.2 — Presigned URLs. A Lambda function that generates
  presigned PUT and GET URLs against the bucket from Lab 3.1. URLs force
  Content-Type and SSE-S3 via signed headers.

Parameters:
  TargetBucketName:
    Type: String
    Default: ""
    Description: >
      Override the target bucket. If blank, the function reads the Lab 3.1
      bucket name from the imported export "dva-lab-03-demo-bucket-name".

Conditions:
  UseImport: !Equals [!Ref TargetBucketName, ""]

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 256
    Architectures: [arm64]
    Tracing: Active

Resources:
  PresignerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-presigner"
      CodeUri: src/
      Handler: handler.lambda_handler
      Environment:
        Variables:
          TARGET_BUCKET: !If
            - UseImport
            - !ImportValue dva-lab-03-demo-bucket-name
            - !Ref TargetBucketName
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource: !Sub
                - "arn:${AWS::Partition}:s3:::${b}/uploads/*"
                - b: !If
                    - UseImport
                    - !ImportValue dva-lab-03-demo-bucket-name
                    - !Ref TargetBucketName

  PresignerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${PresignerFunction}"
      RetentionInDays: 7

Outputs:
  FunctionName:
    Description: Presigner Lambda function name
    Value: !Ref PresignerFunction

  TargetBucket:
    Description: Bucket the function presigns URLs against
    Value: !If
      - UseImport
      - !ImportValue dva-lab-03-demo-bucket-name
      - !Ref TargetBucketName