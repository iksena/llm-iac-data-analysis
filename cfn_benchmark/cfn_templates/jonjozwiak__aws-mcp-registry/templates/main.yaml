AWSTemplateFormatVersion: '2010-09-09'
Description: 'MCP Registry - Main Stack Orchestrator (Nested Stacks)'

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Deployment Configuration
        Parameters:
          - EnvironmentName
          - DeployMode
          - AccessMode
      - Label:
          default: Network Configuration
        Parameters:
          - VpcCidr
      - Label:
          default: Domain Configuration
        Parameters:
          - DomainName
          - HostedZoneId
      - Label:
          default: GitHub OAuth Configuration
        Parameters:
          - GitHubClientId
          - GitHubClientSecret
      - Label:
          default: Security Configuration
        Parameters:
          - JWTPrivateKey
          - DatabasePassword
      - Label:
          default: Registry Configuration
        Parameters:
          - EnableAnonymousAuth
          - EnableSeedData
          - SeedFrom
          - EnableRegistryValidation
      - Label:
          default: Monitoring Configuration
        Parameters:
          - AlarmEmail
      - Label:
          default: Template Location
        Parameters:
          - TemplateBucketName
          - TemplateBucketPrefix

Parameters:
  EnvironmentName:
    Type: String
    Description: Environment name for resource naming (lowercase, alphanumeric, hyphens)
    Default: mcp-registry
    AllowedPattern: ^[a-z0-9][a-z0-9-]*[a-z0-9]$
    ConstraintDescription: Must be lowercase alphanumeric with hyphens, not starting or ending with hyphen

  DeployMode:
    Type: String
    AllowedValues:
      - lab
      - ha
    Default: lab
    Description: |
      lab: Cost-optimized (1 NAT GW, smaller instances, single-AZ DB)
      ha: High availability (multi-AZ NAT GW, larger instances, Multi-AZ DB)

  AccessMode:
    Type: String
    AllowedValues:
      - public
      - private
    Default: public
    Description: |
      public: Internet-facing ALB, accessible from anywhere
      private: Internal ALB, accessible only within VPC (adds VPC endpoints)

  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    Description: CIDR block for the VPC
    AllowedPattern: ^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/([0-9]|[1-2][0-9]|3[0-2]))$

  DomainName:
    Type: String
    MinLength: 1
    Description: Custom domain name (e.g., registry.example.com).

  HostedZoneId:
    Type: String
    MinLength: 1
    Description: Route 53 hosted zone ID for the custom domain.

  GitHubClientId:
    Type: String
    Description: GitHub OAuth App client ID (create at https://github.com/settings/developers)
    NoEcho: true

  GitHubClientSecret:
    Type: String
    Description: GitHub OAuth App client secret
    NoEcho: true

  JWTPrivateKey:
    Type: String
    Description: 32-byte hex string for JWT signing (64 hex characters). Generate with 'openssl rand -hex 32'
    NoEcho: true
    AllowedPattern: ^[a-fA-F0-9]{64}$
    ConstraintDescription: Must be a 64-character hex string (32 bytes)

  DatabasePassword:
    Type: String
    Description: Master password for the PostgreSQL database (min 16 characters)
    NoEcho: true
    MinLength: 16
    MaxLength: 128

  EnableAnonymousAuth:
    Type: String
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'false'
    Description: Allow anonymous read access to the registry

  EnableSeedData:
    Type: String
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'true'
    Description: Pre-populate registry with data from official MCP registry

  SeedFrom:
    Type: String
    Default: 'https://registry.modelcontextprotocol.io/v0/servers'
    Description: Seed data source URL (used when EnableSeedData is true)

  EnableRegistryValidation:
    Type: String
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'true'
    Description: Validate package ownership when publishing

  AlarmEmail:
    Type: String
    Default: ''
    Description: Email address for CloudWatch alarm notifications (optional)

  TemplateBucketName:
    Type: String
    Description: S3 bucket containing nested stack templates

  TemplateBucketPrefix:
    Type: String
    Default: templates
    Description: S3 prefix (folder) for templates within the bucket

Rules:
  RequireDomainAndZone:
    Assertions:
      - Assert: !Not [!Equals [!Ref DomainName, '']]
        AssertDescription: DomainName is required for HTTPS.
      - Assert: !Not [!Equals [!Ref HostedZoneId, '']]
        AssertDescription: HostedZoneId is required to validate the ACM certificate.

Conditions:
  HasCustomDomain: !Not [!Equals [!Ref DomainName, '']]
  IsPublic: !Equals [!Ref AccessMode, 'public']

Resources:
  # Network Stack
  NetworkStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub 'https://${TemplateBucketName}.s3.${AWS::Region}.amazonaws.com/${TemplateBucketPrefix}/network.yaml'
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        DeployMode: !Ref DeployMode
        AccessMode: !Ref AccessMode
        VpcCidr: !Ref VpcCidr
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-network'

  # Security Stack
  SecurityStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: NetworkStack
    Properties:
      TemplateURL: !Sub 'https://${TemplateBucketName}.s3.${AWS::Region}.amazonaws.com/${TemplateBucketPrefix}/security.yaml'
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        VpcId: !GetAtt NetworkStack.Outputs.VpcId
        VpcCidr: !Ref VpcCidr
        AccessMode: !Ref AccessMode
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-security'

  # Database Stack
  DatabaseStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: SecurityStack
    Properties:
      TemplateURL: !Sub 'https://${TemplateBucketName}.s3.${AWS::Region}.amazonaws.com/${TemplateBucketPrefix}/database.yaml'
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        DeployMode: !Ref DeployMode
        DatabaseSubnetIds: !GetAtt NetworkStack.Outputs.DatabaseSubnetIds
        RDSSecurityGroupId: !GetAtt SecurityStack.Outputs.RDSSecurityGroupId
        DatabaseName: mcpregistry
        DatabaseUsername: mcpadmin
        DatabasePassword: !Ref DatabasePassword
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-database'

  # Load Balancer Stack
  LoadBalancerStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: SecurityStack
    Properties:
      TemplateURL: !Sub 'https://${TemplateBucketName}.s3.${AWS::Region}.amazonaws.com/${TemplateBucketPrefix}/loadbalancer.yaml'
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        VpcId: !GetAtt NetworkStack.Outputs.VpcId
        SubnetIds: !If
          - IsPublic
          - !GetAtt NetworkStack.Outputs.PublicSubnetIds
          - !GetAtt NetworkStack.Outputs.PrivateSubnetIds
        ALBSecurityGroupId: !GetAtt SecurityStack.Outputs.ALBSecurityGroupId
        AccessMode: !Ref AccessMode
        DomainName: !Ref DomainName
        HostedZoneId: !Ref HostedZoneId
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-loadbalancer'

  # Container Stack
  ContainerStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - DatabaseStack
      - LoadBalancerStack
    Properties:
      TemplateURL: !Sub 'https://${TemplateBucketName}.s3.${AWS::Region}.amazonaws.com/${TemplateBucketPrefix}/container.yaml'
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        DeployMode: !Ref DeployMode
        VpcId: !GetAtt NetworkStack.Outputs.VpcId
        PrivateSubnetIds: !GetAtt NetworkStack.Outputs.PrivateSubnetIds
        ECSSecurityGroupId: !GetAtt SecurityStack.Outputs.ECSSecurityGroupId
        ECSTaskExecutionRoleArn: !GetAtt SecurityStack.Outputs.ECSTaskExecutionRoleArn
        ECSTaskRoleArn: !GetAtt SecurityStack.Outputs.ECSTaskRoleArn
        TargetGroupArn: !GetAtt LoadBalancerStack.Outputs.TargetGroupArn
        DatabaseEndpoint: !GetAtt DatabaseStack.Outputs.DBEndpoint
        DatabasePort: !GetAtt DatabaseStack.Outputs.DBPort
        DatabaseName: !GetAtt DatabaseStack.Outputs.DBName
        DatabaseUsername: !GetAtt DatabaseStack.Outputs.DBUsername
        DatabasePassword: !Ref DatabasePassword
        GitHubClientId: !Ref GitHubClientId
        GitHubClientSecret: !Ref GitHubClientSecret
        JWTPrivateKey: !Ref JWTPrivateKey
        RegistryBaseURL: !GetAtt LoadBalancerStack.Outputs.RegistryURL
        EnableAnonymousAuth: !Ref EnableAnonymousAuth
        EnableSeedData: !Ref EnableSeedData
        SeedFrom: !Ref SeedFrom
        EnableRegistryValidation: !Ref EnableRegistryValidation
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-container'

  # Monitoring Stack
  MonitoringStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: ContainerStack
    Properties:
      TemplateURL: !Sub 'https://${TemplateBucketName}.s3.${AWS::Region}.amazonaws.com/${TemplateBucketPrefix}/monitoring.yaml'
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        DeployMode: !Ref DeployMode
        ClusterName: !GetAtt ContainerStack.Outputs.ClusterName
        ServiceName: !GetAtt ContainerStack.Outputs.ServiceName
        ALBArn: !GetAtt LoadBalancerStack.Outputs.ALBArn
        TargetGroupArn: !GetAtt LoadBalancerStack.Outputs.TargetGroupArn
        DBInstanceIdentifier: !Sub '${EnvironmentName}-postgres'
        AlarmEmail: !Ref AlarmEmail
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-monitoring'

Outputs:
  RegistryURL:
    Description: MCP Registry URL
    Value: !GetAtt LoadBalancerStack.Outputs.RegistryURL

  HealthCheckURL:
    Description: Health check endpoint
    Value: !Sub '${LoadBalancerStack.Outputs.RegistryURL}/v0.1/ping'

  ServersEndpoint:
    Description: List servers endpoint
    Value: !Sub '${LoadBalancerStack.Outputs.RegistryURL}/v0.1/servers'

  AuthLoginEndpoint:
    Description: GitHub OAuth login endpoint
    Value: !Sub '${LoadBalancerStack.Outputs.RegistryURL}/v0.1/auth/login'

  VpcId:
    Description: VPC ID
    Value: !GetAtt NetworkStack.Outputs.VpcId

  ECSClusterName:
    Description: ECS Cluster name
    Value: !GetAtt ContainerStack.Outputs.ClusterName

  ECSServiceName:
    Description: ECS Service name
    Value: !GetAtt ContainerStack.Outputs.ServiceName

  LogGroupName:
    Description: CloudWatch Log Group name
    Value: !GetAtt ContainerStack.Outputs.LogGroupName

  DashboardURL:
    Description: CloudWatch Dashboard URL
    Value: !GetAtt MonitoringStack.Outputs.DashboardURL

  DatabaseEndpoint:
    Description: RDS PostgreSQL endpoint
    Value: !GetAtt DatabaseStack.Outputs.DBEndpoint

  ALBDNSName:
    Description: Application Load Balancer DNS name
    Value: !GetAtt LoadBalancerStack.Outputs.ALBDNSName