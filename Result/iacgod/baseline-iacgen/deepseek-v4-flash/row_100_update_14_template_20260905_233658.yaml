AWSTemplateFormatVersion: '2010-09-09'
Description: 'Prerequisite resources and SSM Automation documents for PCI DSS remediation'
Parameters:
  LogGroupName:
    Type: String
    Default: /aws/cloudtrail/pci-logs
    Description: Name of the CloudWatch Logs log group for CloudTrail
  KmsKeyAliasName:
    Type: String
    Default: alias/pci-kms-key
    Description: Alias for the KMS customer master key
  SsmAutomationRoleName:
    Type: String
    Default: SSMAutomationRole
    Description: Name of the IAM role for SSM automations
  CloudTrailLogsRoleName:
    Type: String
    Default: CloudTrailCloudWatchLogsRole
    Description: Name of the IAM role for CloudTrail CloudWatch Logs integration
Resources:
  CloudTrailLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Ref LogGroupName
      RetentionInDays: 1827
  KmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: 'KMS key for PCI DSS compliance'
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableRootAccess
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
      Enabled: true
      EnableKeyRotation: true
      KeyUsage: ENCRYPT_DECRYPT
  KmsKeyAliasResource:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Ref KmsKeyAliasName
      TargetKeyId: !Ref KmsKey
  SsmAutomationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref SsmAutomationRoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ssm.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/IAMFullAccess
        - arn:aws:iam::aws:policy/AdministratorAccess
  CloudTrailLogsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref CloudTrailLogsRoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudTrailCloudWatchLogsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                Resource: '*'
  SSMDocumentEncryptCloudTrailWithKMSAndCloudWatch:
    Type: AWS::SSM::Document
    Properties:
      Name: PCI-EncryptCloudTrailWithKMSAndCloudWatch
      DocumentType: Automation
      Content:
        schemaVersion: '0.3'
        description: 'Encrypt a CloudTrail trail with a KMS key and integrate with CloudWatch Logs'
        assumeRole: !GetAtt SsmAutomationRole.Arn
        parameters:
          TrailName:
            type: String
            description: Name of the CloudTrail trail
          KmsKeyId:
            type: String
            description: KMS key ID or ARN
          LogGroupArn:
            type: String
            description: ARN of the CloudWatch Logs log group
          RoleArn:
            type: String
            description: ARN of the IAM role for CloudTrail CloudWatch Logs
        mainSteps:
          - name: UpdateTrail
            action: aws:executeAwsApi
            inputs:
              Service: cloudtrail
              Api: UpdateTrail
              Name: '{{ TrailName }}'
              KmsKeyId: '{{ KmsKeyId }}'
              CloudWatchLogsLogGroupArn: '{{ LogGroupArn }}'
              CloudWatchLogsRoleArn: '{{ RoleArn }}'
  SSMDocumentEnableKMSKeyRotation:
    Type: AWS::SSM::Document
    Properties:
      Name: PCI-EnableKMSKeyRotation
      DocumentType: Automation
      Content:
        schemaVersion: '0.3'
        description: 'Enable key rotation for a KMS key'
        assumeRole: !GetAtt SsmAutomationRole.Arn
        parameters:
          KeyId:
            type: String
            description: KMS key ID or ARN
        mainSteps:
          - name: EnableKeyRotation
            action: aws:executeAwsApi
            inputs:
              Service: kms
              Api: EnableKeyRotation
              KeyId: '{{ KeyId }}'
  SSMDocumentIntegrateCloudTrailWithCloudWatch:
    Type: AWS::SSM::Document
    Properties:
      Name: PCI-IntegrateCloudTrailWithCloudWatch
      DocumentType: Automation
      Content:
        schemaVersion: '0.3'
        description: 'Integrate a CloudTrail trail with CloudWatch Logs'
        assumeRole: !GetAtt SsmAutomationRole.Arn
        parameters:
          TrailName:
            type: String
            description: Name of the CloudTrail trail
          LogGroupArn:
            type: String
            description: ARN of the CloudWatch Logs log group
          RoleArn:
            type: String
            description: ARN of the IAM role for CloudTrail CloudWatch Logs
        mainSteps:
          - name: UpdateTrail
            action: aws:executeAwsApi
            inputs:
              Service: cloudtrail
              Api: UpdateTrail
              Name: '{{ TrailName }}'
              CloudWatchLogsLogGroupArn: '{{ LogGroupArn }}'
              CloudWatchLogsRoleArn: '{{ RoleArn }}'
  SSMDocumentUpdateIAMPasswordPolicy:
    Type: AWS::SSM::Document
    Properties:
      Name: PCI-UpdateIAMPasswordPolicy
      DocumentType: Automation
      Content:
        schemaVersion: '0.3'
        description: 'Update the account IAM password policy to PCI DSS compliant settings'
        assumeRole: !GetAtt SsmAutomationRole.Arn
        parameters: {}
        mainSteps:
          - name: UpdatePasswordPolicy
            action: aws:executeAwsApi
            inputs:
              Service: iam
              Api: UpdateAccountPasswordPolicy
              MinimumPasswordLength: 14
              RequireUppercaseCharacters: true
              RequireLowercaseCharacters: true
              RequireNumbers: true
              RequireSymbols: true
              AllowUsersToChangePassword: true
              HardExpiry: true
              MaxPasswordAge: 90
              PasswordReusePrevention: 24
  SSMDocumentEnableLogFileValidationAndMultiRegion:
    Type: AWS::SSM::Document
    Properties:
      Name: PCI-EnableLogFileValidationAndMultiRegion
      DocumentType: Automation
      Content:
        schemaVersion: '0.3'
        description: 'Enable log file validation and multi-region for a CloudTrail trail, and integrate with CloudWatch Logs'
        assumeRole: !GetAtt SsmAutomationRole.Arn
        parameters:
          TrailName:
            type: String
            description: Name of the CloudTrail trail
          LogGroupArn:
            type: String
            description: ARN of the CloudWatch Logs log group
          RoleArn:
            type: String
            description: ARN of the IAM role for CloudTrail CloudWatch Logs
        mainSteps:
          - name: UpdateTrail
            action: aws:executeAwsApi
            inputs:
              Service: cloudtrail
              Api: UpdateTrail
              Name: '{{ TrailName }}'
              EnableLogFileValidation: true
              IsMultiRegionTrail: true
              CloudWatchLogsLogGroupArn: '{{ LogGroupArn }}'
              CloudWatchLogsRoleArn: '{{ RoleArn }}'
  SSMDocumentRevokeDefaultSecurityGroupRules:
    Type: AWS::SSM::Document
    Properties:
      Name: PCI-RevokeDefaultSecurityGroupRules
      DocumentType: Automation
      Content:
        schemaVersion: '0.3'
        description: 'Revoke all inbound and outbound rules on a default security group'
        assumeRole: !GetAtt SsmAutomationRole.Arn
        parameters:
          GroupId:
            type: String
            description: ID of the default security group
        mainSteps:
          - name: DescribeSecurityGroupRules
            action: aws:executeAwsApi
            inputs:
              Service: ec2
              Api: DescribeSecurityGroupRules
              Filters:
                - Name: group-id
                  Values:
                    - '{{ GroupId }}'
            outputs:
              - Name: InboundRuleIds
                Selector: $.SecurityGroupRules[?IsEgress==false].SecurityGroupRuleId
                Type: StringList
              - Name: OutboundRuleIds
                Selector: $.SecurityGroupRules[?IsEgress==true].SecurityGroupRuleId
                Type: StringList
          - name: RevokeInboundRules
            action: aws:executeAwsApi
            inputs:
              Service: ec2
              Api: RevokeSecurityGroupIngress
              GroupId: '{{ GroupId }}'
              SecurityGroupRuleIds: '{{ DescribeSecurityGroupRules.InboundRuleIds }}'
          - name: RevokeOutboundRules
            action: aws:executeAwsApi
            inputs:
              Service: ec2
              Api: RevokeSecurityGroupEgress
              GroupId: '{{ GroupId }}'
              SecurityGroupRuleIds: '{{ DescribeSecurityGroupRules.OutboundRuleIds }}'
  SSMDocumentDeleteSecurityGroup:
    Type: AWS::SSM::Document
    Properties:
      Name: PCI-DeleteSecurityGroup
      DocumentType: Automation
      Content:
        schemaVersion: '0.3'
        description: 'Delete a specified security group'
        assumeRole: !GetAtt SsmAutomationRole.Arn
        parameters:
          GroupId:
            type: String
            description: ID of the security group to delete
        mainSteps:
          - name: DeleteSecurityGroup
            action: aws:executeAwsApi
            inputs:
              Service: ec2
              Api: DeleteSecurityGroup
              GroupId: '{{ GroupId }}'
  SSMDocumentReleaseElasticIP:
    Type: AWS::SSM::Document
    Properties:
      Name: PCI-ReleaseElasticIP
      DocumentType: Automation
      Content:
        schemaVersion: '0.3'
        description: 'Release an unused Elastic IP address'
        assumeRole: !GetAtt SsmAutomationRole.Arn
        parameters:
          AllocationId:
            type: String
            description: Allocation ID of the Elastic IP
        mainSteps:
          - name: ReleaseAddress
            action: aws:executeAwsApi
            inputs:
              Service: ec2
              Api: ReleaseAddress
              AllocationId: '{{ AllocationId }}'
  SSMDocumentRemoveCodeBuildEnvVars:
    Type: AWS::SSM::Document
    Properties:
      Name: PCI-RemoveCodeBuildEnvVars
      DocumentType: Automation
      Content:
        schemaVersion: '0.3'
        description: 'Remove AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY environment variables from a CodeBuild project'
        assumeRole: !GetAtt SsmAutomationRole.Arn
        parameters:
          ProjectName:
            type: String
            description: Name of the CodeBuild project
        mainSteps:
          - name: GetProject
            action: aws:executeAwsApi
            inputs:
              Service: codebuild
              Api: BatchGetProjects
              names:
                - '{{ ProjectName }}'
            outputs:
              - Name: ProjectEnv
                Selector: $.projects[0].environment
                Type: StringMap
          - name: FilterEnvironmentVariables
            action: aws:executeScript
            inputs:
              Runtime: python3.7
              Handler: filter_env_vars
              InputPayload:
                Environment: '{{ GetProject.ProjectEnv }}'
              Script: |-
                def filter_env_vars(events, context):
                    env = events['Environment']
                    env_vars = env.get('environmentVariables', [])
                    filtered = [v for v in env_vars if v['name'] not in ['AWS_ACCESS_KEY_ID', 'AWS_SECRET_ACCESS_KEY']]
                    env['environmentVariables'] = filtered
                    return {'UpdatedEnvironment': env}
            outputs:
              - Name: UpdatedEnv
                Selector: $.Payload.UpdatedEnvironment
                Type: StringMap
          - name: UpdateProject
            action: aws:executeAwsApi
            inputs:
              Service: codebuild
              Api: UpdateProject
              name: '{{ ProjectName }}'
              environment: '{{ FilterEnvironmentVariables.UpdatedEnv }}'
Outputs:
  LogGroupArn:
    Description: ARN of the CloudWatch Logs log group
    Value: !GetAtt CloudTrailLogGroup.Arn
    Export:
      Name: !Sub '${AWS::StackName}-LogGroupArn'
  KmsKeyId:
    Description: ID of the KMS key
    Value: !Ref KmsKey
    Export:
      Name: !Sub '${AWS::StackName}-KmsKeyId'
  SsmAutomationRoleArn:
    Description: ARN of the IAM role for SSM automations
    Value: !GetAtt SsmAutomationRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-SsmAutomationRoleArn'
  CloudTrailLogsRoleArn:
    Description: ARN of the IAM role for CloudTrail CloudWatch Logs
    Value: !GetAtt CloudTrailLogsRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-CloudTrailLogsRoleArn'
  DocumentNames:
    Description: List of SSM automation document names
    Value: !Join
      - ', '
      - - !Ref SSMDocumentEncryptCloudTrailWithKMSAndCloudWatch
        - !Ref SSMDocumentEnableKMSKeyRotation
        - !Ref SSMDocumentIntegrateCloudTrailWithCloudWatch
        - !Ref SSMDocumentUpdateIAMPasswordPolicy
        - !Ref SSMDocumentEnableLogFileValidationAndMultiRegion
        - !Ref SSMDocumentRevokeDefaultSecurityGroupRules
        - !Ref SSMDocumentDeleteSecurityGroup
        - !Ref SSMDocumentReleaseElasticIP
        - !Ref SSMDocumentRemoveCodeBuildEnvVars
    Export:
      Name: !Sub '${AWS::StackName}-DocumentNames'