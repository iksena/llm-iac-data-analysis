AWSTemplateFormatVersion: '2010-09-09'
Description: 'Security Hub Setup with CIS AWS Foundations Benchmark Standards'

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues:
      - development
      - staging
      - production
    Description: Environment name

  SecurityHubFindingImportRoleName:
    Type: String
    Default: SecurityHubFindingImportRole
    Description: IAM role name for importing findings into Security Hub

Resources:
  SecurityHub:
    Type: 'AWS::SecurityHub::Hub'
    Properties:
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: cloudformation
        - Key: Purpose
          Value: security-posture-audit

  CISStandardSubscription:
    Type: 'AWS::SecurityHub::Standard'
    Properties:
      StandardsArn: !Sub 'arn:aws:securityhub:::standards/cis-aws-foundations-benchmark/v/1.4.0'
      StandardsSubscription:
        Enabled: true

  AWSFBPSStandardSubscription:
    Type: 'AWS::SecurityHub::Standard'
    Properties:
      StandardsArn: !Sub 'arn:aws:securityhub:::standards/aws-foundational-security-best-practices/v/1.0.0'
      StandardsSubscription:
        Enabled: true

  PCIDSSStandardSubscription:
    Type: 'AWS::SecurityHub::Standard'
    Properties:
      StandardsArn: !Sub 'arn:aws:securityhub:::standards/pci-dss/v/3.2.1'
      StandardsSubscription:
        Enabled: !If [EnablePCIDSS, true, false]

Conditions:
  EnablePCIDSS: !Equals [!Ref Environment, 'production']

  SecurityHubFindingImportRole:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: !Ref SecurityHubFindingImportRoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: securityhub.amazonaws.com
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: SecurityHubFindingImport
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 'securityhub:BatchImportFindings'
                Resource: '*'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: cloudformation

  RemediationAction:
    Type: 'AWS::SecurityHub::ActionTarget'
    Properties:
      Name: 'Send to Remediation'
      Description: 'Sends the finding to the remediation queue'
      Id: 'send-to-remediation'

Outputs:
  SecurityHubArn:
    Description: ARN of the Security Hub
    Value: !GetAtt SecurityHub.Arn
  CISStandardArn:
    Description: ARN of the CIS Standard Subscription
    Value: !Ref CISStandardSubscription
  RemediationActionArn:
    Description: ARN of the Security Hub custom action
    Value: !GetAtt RemediationAction.Arn
  ImportRoleArn:
    Description: ARN of the finding import role
    Value: !GetAtt SecurityHubFindingImportRole.Arn