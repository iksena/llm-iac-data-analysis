AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  OpenClaw Observability Stack - CloudWatch alarms, metric filters, dashboard,
  CloudTrail, VPC flow logs.

Parameters:
  Environment:
    Type: String
    Default: dev
  ProjectName:
    Type: String
    Default: openclaw
  VpcId:
    Type: String
    Description: VPC ID from Foundation
  InfraLogsKeyArn:
    Type: String
    Description: InfraLogs KMS key ARN from Foundation
  EventsKeyArn:
    Type: String
    Description: Events KMS key ARN from Foundation
  InfraLogsBucketArn:
    Type: String
    Description: InfraLogs S3 bucket ARN from Data
  InfraLogsBucketName:
    Type: String
    Description: InfraLogs S3 bucket name from Data
  AdminSNSTopicArn:
    Type: String
    Description: Admin SNS topic ARN from Data
  ECSClusterName:
    Type: String
    Description: ECS cluster name from Compute
  ECSServiceName:
    Type: String
    Description: ECS service name from Compute
  ALBArn:
    Type: String
    Description: ALB ARN from Compute
  EnableCloudTrail:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Whether to create a CloudTrail trail (set false if trail limit reached)
  KnowledgeBucketArn:
    Type: String
    Description: Knowledge S3 bucket ARN for CloudTrail data events
  BackupBucketArn:
    Type: String
    Description: Backup S3 bucket ARN for CloudTrail data events

Conditions:
  CreateTrail: !Equals [!Ref EnableCloudTrail, 'true']

Resources:
  # ============================================================================
  # CloudWatch Log Groups (supplementary -- engine log group is in 03-compute)
  # ============================================================================
  DaemonLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/openclaw/${Environment}/daemon'
      RetentionInDays: 365
      KmsKeyId: !Ref InfraLogsKeyArn
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-daemon-logs'

  OnboardLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/openclaw/${Environment}/onboard'
      RetentionInDays: 90
      KmsKeyId: !Ref InfraLogsKeyArn
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-onboard-logs'

  # ============================================================================
  # Metric Filters (reference engine log group by name)
  # ============================================================================
  EngineErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Sub '/openclaw/${Environment}/engine'
      FilterPattern: 'ERROR'
      MetricTransformations:
        - MetricNamespace: !Sub 'OpenClaw/${Environment}'
          MetricName: EngineErrors
          MetricValue: '1'
          DefaultValue: 0

  KnowledgeIndexErrorFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Sub '/openclaw/${Environment}/engine'
      FilterPattern: '"knowledge" "index" "error"'
      MetricTransformations:
        - MetricNamespace: !Sub 'OpenClaw/${Environment}'
          MetricName: KnowledgeIndexErrors
          MetricValue: '1'
          DefaultValue: 0

  # ============================================================================
  # CloudWatch Alarms (6 alarms)
  # ============================================================================
  EngineErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-${Environment}-engine-errors'
      AlarmDescription: Engine error rate exceeded threshold
      Namespace: !Sub 'OpenClaw/${Environment}'
      MetricName: EngineErrors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AdminSNSTopicArn

  KnowledgeHealthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-${Environment}-knowledge-health'
      AlarmDescription: Knowledge index errors detected
      Namespace: !Sub 'OpenClaw/${Environment}'
      MetricName: KnowledgeIndexErrors
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref AdminSNSTopicArn

  ECSCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-${Environment}-ecs-cpu-high'
      AlarmDescription: ECS CPU utilization above 80%
      Namespace: AWS/ECS
      MetricName: CPUUtilization
      Dimensions:
        - Name: ClusterName
          Value: !Ref ECSClusterName
        - Name: ServiceName
          Value: !Ref ECSServiceName
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AdminSNSTopicArn

  ECSMemoryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-${Environment}-ecs-memory-high'
      AlarmDescription: ECS memory utilization above 85%
      Namespace: AWS/ECS
      MetricName: MemoryUtilization
      Dimensions:
        - Name: ClusterName
          Value: !Ref ECSClusterName
        - Name: ServiceName
          Value: !Ref ECSServiceName
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 85
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AdminSNSTopicArn

  ALB5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-${Environment}-alb-5xx'
      AlarmDescription: ALB 5xx error rate exceeded threshold
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_ELB_5XX_Count
      Dimensions:
        - Name: LoadBalancer
          Value: !Select
            - 1
            - !Split
              - 'loadbalancer/'
              - !Ref ALBArn
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AdminSNSTopicArn

  ALBUnhealthyHostsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-${Environment}-alb-unhealthy-hosts'
      AlarmDescription: ALB has unhealthy targets
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - Name: LoadBalancer
          Value: !Select
            - 1
            - !Split
              - 'loadbalancer/'
              - !Ref ALBArn
      Statistic: Average
      Period: 60
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AdminSNSTopicArn

  # ============================================================================
  # CloudWatch Dashboard
  # ============================================================================
  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub '${ProjectName}-${Environment}'
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "ECS CPU & Memory Utilization",
                "metrics": [
                  ["AWS/ECS", "CPUUtilization", "ClusterName", "${ECSClusterName}", "ServiceName", "${ECSServiceName}", {"stat": "Average"}],
                  ["AWS/ECS", "MemoryUtilization", "ClusterName", "${ECSClusterName}", "ServiceName", "${ECSServiceName}", {"stat": "Average"}]
                ],
                "period": 300,
                "region": "${AWS::Region}",
                "view": "timeSeries"
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "ALB Request Count & Latency",
                "metrics": [
                  ["AWS/ApplicationELB", "RequestCount", "LoadBalancer", "${ALBArn}", {"stat": "Sum"}],
                  ["AWS/ApplicationELB", "TargetResponseTime", "LoadBalancer", "${ALBArn}", {"stat": "Average"}]
                ],
                "period": 300,
                "region": "${AWS::Region}",
                "view": "timeSeries"
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "ALB Error Rates",
                "metrics": [
                  ["AWS/ApplicationELB", "HTTPCode_ELB_4XX_Count", "LoadBalancer", "${ALBArn}", {"stat": "Sum"}],
                  ["AWS/ApplicationELB", "HTTPCode_ELB_5XX_Count", "LoadBalancer", "${ALBArn}", {"stat": "Sum"}]
                ],
                "period": 300,
                "region": "${AWS::Region}",
                "view": "timeSeries"
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Engine Errors",
                "metrics": [
                  ["OpenClaw/${Environment}", "EngineErrors", {"stat": "Sum"}]
                ],
                "period": 300,
                "region": "${AWS::Region}",
                "view": "timeSeries"
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 12, "width": 12, "height": 6,
              "properties": {
                "title": "Knowledge Index Health",
                "metrics": [
                  ["OpenClaw/${Environment}", "KnowledgeIndexErrors", {"stat": "Sum"}]
                ],
                "period": 300,
                "region": "${AWS::Region}",
                "view": "singleValue"
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 12, "width": 12, "height": 6,
              "properties": {
                "title": "SNS Publish Metrics",
                "metrics": [
                  ["AWS/SNS", "NumberOfMessagesPublished", "TopicName", "${ProjectName}-${Environment}-admin-notifications", {"stat": "Sum"}],
                  ["AWS/SNS", "NumberOfNotificationsFailed", "TopicName", "${ProjectName}-${Environment}-admin-notifications", {"stat": "Sum"}]
                ],
                "period": 300,
                "region": "${AWS::Region}",
                "view": "timeSeries"
              }
            }
          ]
        }

  # ============================================================================
  # CloudTrail
  # ============================================================================
  CloudTrailLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: CreateTrail
    Properties:
      LogGroupName: !Sub '/aws/cloudtrail/${ProjectName}-${Environment}'
      RetentionInDays: 365
      KmsKeyId: !Ref InfraLogsKeyArn

  CloudTrailCloudWatchRole:
    Type: AWS::IAM::Role
    Condition: CreateTrail
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-cloudtrail-cw-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub '${ProjectName}-${Environment}-cloudtrail-cw-policy'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub '${CloudTrailLogGroup.Arn}:*'

  Trail:
    Type: AWS::CloudTrail::Trail
    Condition: CreateTrail
    Properties:
      TrailName: !Sub '${ProjectName}-${Environment}-trail'
      S3BucketName: !Ref InfraLogsBucketName
      KMSKeyId: !Ref InfraLogsKeyArn
      IsMultiRegionTrail: true
      IncludeGlobalServiceEvents: true
      EnableLogFileValidation: true
      IsLogging: true
      CloudWatchLogsLogGroupArn: !GetAtt CloudTrailLogGroup.Arn
      CloudWatchLogsRoleArn: !GetAtt CloudTrailCloudWatchRole.Arn
      EventSelectors:
        - ReadWriteType: All
          IncludeManagementEvents: true
          DataResources:
            - Type: AWS::S3::Object
              Values:
                - !Sub '${KnowledgeBucketArn}/'
                - !Sub '${BackupBucketArn}/'
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-trail'

  # ============================================================================
  # VPC Flow Logs (Lesson #4: use ${start} and ${end})
  # ============================================================================
  FlowLog:
    Type: AWS::EC2::FlowLog
    Properties:
      ResourceId: !Ref VpcId
      ResourceType: VPC
      TrafficType: ALL
      LogDestinationType: s3
      LogDestination: !Sub '${InfraLogsBucketArn}/vpc-flow-logs/'
      LogFormat: '${version} ${account-id} ${interface-id} ${srcaddr} ${dstaddr} ${srcport} ${dstport} ${protocol} ${packets} ${bytes} ${start} ${end} ${action} ${log-status}'
      MaxAggregationInterval: 60
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-flow-log'

Outputs:
  EngineLogGroupName:
    Value: !Sub '/openclaw/${Environment}/engine'
  DaemonLogGroupName:
    Value: !Sub '/openclaw/${Environment}/daemon'
  TrailArn:
    Condition: CreateTrail
    Value: !GetAtt Trail.Arn