AWSTemplateFormatVersion: "2010-09-09"
Description: |
  DVA-C02 Lab 3.7 — S3 Object Lambda. Bucket + standard access point +
  object lambda access point + Lambda function that redacts PII on read.
  A custom resource Lambda seeds the bucket with a sample PII file.

Resources:
  ## ──────────────────────────── Bucket ────────────────────────────
  SourceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub "dva-lab-03-07-${AWS::AccountId}-${AWS::Region}"
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  ## ──────────────────── Standard S3 Access Point ──────────────────
  StandardAccessPoint:
    Type: AWS::S3::AccessPoint
    Properties:
      Bucket: !Ref SourceBucket
      Name: dva-lab-03-07-sap
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  ## ───────────────────────── Redactor Lambda ──────────────────────
  RedactorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dva-lab-03-07-redactor-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: WriteGetObjectResponse
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3-object-lambda:WriteGetObjectResponse
                Resource: "*"

  RedactorLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: dva-lab-03-07-redactor
      Runtime: python3.12
      Handler: handler.handler
      Role: !GetAtt RedactorRole.Arn
      Code: ./src
      Timeout: 30
      MemorySize: 256
      LoggingConfig:
        LogGroup: !Ref RedactorLogGroup

  RedactorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/dva-lab-03-07-redactor
      RetentionInDays: 3

  ## ───────────────── Object Lambda Access Point ───────────────────
  ObjectLambdaAccessPoint:
    Type: AWS::S3ObjectLambda::AccessPoint
    Properties:
      Name: dva-lab-03-07-olap
      ObjectLambdaConfiguration:
        SupportingAccessPoint: !GetAtt StandardAccessPoint.Arn
        TransformationConfigurations:
          - Actions: [GetObject]
            ContentTransformation:
              AwsLambda:
                FunctionArn: !GetAtt RedactorLambda.Arn

  ## ───────────── Custom resource: seed sample object ──────────────
  SeederRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: WriteSampleObject
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject]
                Resource: !Sub "${SourceBucket.Arn}/*"

  SeederLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: dva-lab-03-07-seeder
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt SeederRole.Arn
      Timeout: 30
      Code:
        ZipFile: |
          import json, urllib.request, boto3
          s3 = boto3.client("s3")
          SAMPLE = """name,ssn,cc,email
          Alice Johnson,123-45-6789,4111-1111-1111-1111,alice@example.com
          Bob Smith,987-65-4321,5500-0000-0000-0004,bob@example.com
          Carol Garcia,555-12-3456,3782-822463-10005,carol@example.com
          """
          def send(event, status, data):
              body = json.dumps({
                  "Status": status, "Reason": "see logs", "PhysicalResourceId": "lab-07-seeder",
                  "StackId": event["StackId"], "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"], "Data": data,
              }).encode()
              req = urllib.request.Request(event["ResponseURL"], data=body, method="PUT", headers={"Content-Type": ""})
              urllib.request.urlopen(req)
          def handler(event, context):
              try:
                  bucket = event["ResourceProperties"]["BucketName"]
                  if event["RequestType"] in ("Create", "Update"):
                      s3.put_object(Bucket=bucket, Key="customers.txt", Body=SAMPLE.encode())
                  send(event, "SUCCESS", {})
              except Exception as e:
                  print("Seeder error:", e); send(event, "FAILED", {})

  Seed:
    Type: Custom::Seed
    Properties:
      ServiceToken: !GetAtt SeederLambda.Arn
      BucketName: !Ref SourceBucket

Outputs:
  BucketName:
    Value: !Ref SourceBucket
  AccessPointAlias:
    Description: Use as bucket name for aws s3api commands (regular access)
    Value: !Sub "${StandardAccessPoint.Alias}"
  ObjectLambdaAccessPointAlias:
    Description: Use as bucket name for aws s3api commands (redacted access)
    Value: !Sub "${ObjectLambdaAccessPoint.AliasValue}"