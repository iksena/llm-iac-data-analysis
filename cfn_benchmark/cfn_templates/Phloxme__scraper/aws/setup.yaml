AWSTemplateFormatVersion: '2010-09-09'
Description: AWS Infrastructure for Web Scraper with PROVISIONED DynamoDB Billing Mode

Parameters:
  StartURL:
    Type: String
    Description: Starting URL for the web scraper
    Default: 'https://www.alfredai.io'
  MaxDepth:
    Type: Number
    Description: Maximum depth for crawling
    Default: 3
  ReadCapacityUnits:
    Type: Number
    Description: Read capacity units for DynamoDB tables
    Default: 5
  WriteCapacityUnits:
    Type: Number
    Description: Write capacity units for DynamoDB tables
    Default: 5

Resources:

  ### DynamoDB Tables ###
  URLMetadataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: URLMetadataTable
      AttributeDefinitions:
        - AttributeName: url
          AttributeType: S
        - AttributeName: status
          AttributeType: S
      KeySchema:
        - AttributeName: url
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: status-index
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: url
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
          ProvisionedThroughput:
            ReadCapacityUnits: !Ref ReadCapacityUnits
            WriteCapacityUnits: !Ref WriteCapacityUnits
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: !Ref ReadCapacityUnits
        WriteCapacityUnits: !Ref WriteCapacityUnits

  ConfigTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ConfigTable
      AttributeDefinitions:
        - AttributeName: config_name
          AttributeType: S
      KeySchema:
        - AttributeName: config_name
          KeyType: HASH
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: !Ref ReadCapacityUnits
        WriteCapacityUnits: !Ref WriteCapacityUnits

  ### SQS Queue ###
  CrawlerQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: CrawlerQueue

  ### IAM Role for Lambda ###
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: LambdaCrawlerRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: LambdaCrawlerPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:*
                  - sqs:*
                Resource: "*"

  ### Lambda Functions ###
  CrawlerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: crawler_function
      Runtime: python3.9
      Role: !GetAtt LambdaExecutionRole.Arn
      Handler: crawler_function.lambda_handler
      Code:
        ZipFile: |
          # Your crawler_function code goes here
          # For the purpose of this template, we'll need to package the code separately
      Timeout: 900
      MemorySize: 1024
      Environment:
        Variables:
          DYNAMODB_TABLE: URLMetadataTable
          CONFIG_TABLE: ConfigTable
          SQS_QUEUE_URL: !Ref CrawlerQueue
          START_URL: !Ref StartURL

  APIGetProgressFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: api_get_progress
      Runtime: python3.9
      Role: !GetAtt LambdaExecutionRole.Arn
      Handler: api_get_progress.lambda_handler
      Code:
        ZipFile: |
          # Your api_get_progress code goes here
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          DYNAMODB_TABLE: URLMetadataTable
          CONFIG_TABLE: ConfigTable

  APIUpdateSettingsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: api_update_settings
      Runtime: python3.9
      Role: !GetAtt LambdaExecutionRole.Arn
      Handler: api_update_settings.lambda_handler
      Code:
        ZipFile: |
          # Your api_update_settings code goes here
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          CONFIG_TABLE: ConfigTable

  APIEnqueueURLFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: api_enqueue_url
      Runtime: python3.9
      Role: !GetAtt LambdaExecutionRole.Arn
      Handler: api_enqueue_url.lambda_handler
      Code:
        ZipFile: |
          # Your api_enqueue_url code goes here
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          SQS_QUEUE_URL: !Ref CrawlerQueue

  ### API Gateway ###
  CrawlerApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: CrawlerAPI

  ApiRootResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt CrawlerApi.RootResourceId
      PathPart: crawl
      RestApiId: !Ref CrawlerApi

  ProgressResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !Ref ApiRootResource
      PathPart: progress
      RestApiId: !Ref CrawlerApi

  SettingsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !Ref ApiRootResource
      PathPart: settings
      RestApiId: !Ref CrawlerApi

  EnqueueResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !Ref ApiRootResource
      PathPart: enqueue
      RestApiId: !Ref CrawlerApi

  ### API Methods ###
  GetProgressMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CrawlerApi
      ResourceId: !Ref ProgressResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - arn:aws:apigateway:${Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations
          - {
              Region: !Ref "AWS::Region",
              LambdaArn: !GetAtt APIGetProgressFunction.Arn
            }
      MethodResponses:
        - StatusCode: 200

  PostSettingsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CrawlerApi
      ResourceId: !Ref SettingsResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - arn:aws:apigateway:${Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations
          - {
              Region: !Ref "AWS::Region",
              LambdaArn: !GetAtt APIUpdateSettingsFunction.Arn
            }
      MethodResponses:
        - StatusCode: 200

  EnqueueMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CrawlerApi
      ResourceId: !Ref EnqueueResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub
          - arn:aws:apigateway:${Region}:lambda:path/2015-03-31/functions/${LambdaArn}/invocations
          - {
              Region: !Ref "AWS::Region",
              LambdaArn: !GetAtt APIEnqueueURLFunction.Arn
            }
      MethodResponses:
        - StatusCode: 200

  ### Lambda Permissions for API Gateway ###
  GetProgressPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt APIGetProgressFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${CrawlerApi}/*/GET/crawl/progress

  UpdateSettingsPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt APIUpdateSettingsFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${CrawlerApi}/*/POST/crawl/settings

  EnqueueURLPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt APIEnqueueURLFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${CrawlerApi}/*/POST/crawl/enqueue

  ### SQS Event Source Mapping for CrawlerFunction ###
  CrawlerFunctionEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !GetAtt CrawlerFunction.Arn
      EventSourceArn: !GetAtt CrawlerQueue.Arn
      BatchSize: 1
      Enabled: True

Outputs:
  ApiEndpoint:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${CrawlerApi}.execute-api.${AWS::Region}.amazonaws.com/prod/"