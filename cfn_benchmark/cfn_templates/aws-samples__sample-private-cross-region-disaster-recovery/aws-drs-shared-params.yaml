AWSTemplateFormatVersion: '2010-09-09'
Description: >
  **WARNING** This template creates an IAM Role, a Lambda function (with custom resource logic), and a
  Custom Resource to write all elatic disaster recovery related CIDR and region parameters into Systems Manager Parameter Store in
   both the Primary and Recovery regions. You will be billed for the AWS resources used if you create a stack from this template.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Primary Area Network"
        Parameters:
          - PrimarySourceVpcCidr
          - PrimarySourcePrivateSubnetCidr
          - PrimaryStagingVpcCidr
          - PrimaryStagingPrivateSubnetCidr
      - Label:
          default: "Recovery Area Network"
        Parameters:
          - RecoveryVpcCidr
          - RecoveryPrivateSubnetCidr
          - RecoveryStagingVpcCidr
          - RecoveryStagingPrivateSubnetCidr
          - RecoveryRegion
          - RecoveryPrimarySourceVpcCidr

Parameters:
  # -----------------------
  # Primary‐side values
  # -----------------------
  PrimarySourceVpcCidr:
    Type: String
    Default: "10.0.0.0/16"
    Description: "CIDR for the Primary source VPC (e.g. 10.0.0.0/16)"

  PrimarySourcePrivateSubnetCidr:
    Type: String
    Default: "10.0.1.0/24"
    Description: "CIDR for the Primary source private subnet (e.g. 10.0.1.0/24)"

  PrimaryStagingVpcCidr:
    Type: String
    Default: "10.1.0.0/16"
    Description: "CIDR for the Primary staging VPC (e.g. 10.1.0.0/16)"

  PrimaryStagingPrivateSubnetCidr:
    Type: String
    Default: "10.1.1.0/24"
    Description: "CIDR for the Primary staging private subnet (e.g. 10.1.1.0/24)"

  # -----------------------
  # Recovery‐side values
  # -----------------------
  RecoveryVpcCidr:
    Type: String
    Default: "10.2.0.0/16"
    Description: "CIDR for the Recovery VPC (e.g. 10.2.0.0/16)"

  RecoveryPrivateSubnetCidr:
    Type: String
    Default: "10.2.1.0/24"
    Description: "CIDR for the Recovery private subnet (e.g. 10.2.1.0/24)"

  RecoveryStagingVpcCidr:
    Type: String
    Default: "10.3.0.0/16"
    Description: "CIDR for the Recovery staging VPC (e.g. 10.3.0.0/16)"

  RecoveryStagingPrivateSubnetCidr:
    Type: String
    Default: "10.3.1.0/24"
    Description: "CIDR for the Recovery staging private subnet (e.g. 10.3.1.0/24)"

  RecoveryRegion:
    Type: String
    Default: "us-west-2"
    Description: "Name of the Recovery region (e.g. us-west-2)"

  # Re‐used so Recovery code knows the Primary‐source CIDR
  RecoveryPrimarySourceVpcCidr:
    Type: String
    Default: "10.0.0.0/16"
    Description: "CIDR of the Primary source VPC (must match PrimarySourceVpcCidr above)"

Resources:
  # ----------------------------------------
  # IAM Role for the Lambda that writes to SSM
  # ----------------------------------------
  SSMWriterFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Path: "/"
      Policies:
        - PolicyName: "SSMWritePolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "ssm:PutParameter"
                Resource: "arn:aws:ssm:*:<account-id>:parameter/dr/*"  # or restrict to "arn:aws:ssm:*:<account-id>:parameter/dr/*"
        - PolicyName: "LambdaBasicExecution"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "logs:CreateLogGroup"
                  - "logs:CreateLogStream"
                  - "logs:PutLogEvents"
                Resource: "arn:aws:logs:*:*:*"

  # ----------------------------------------
  # Lambda Function for writing parameters into SSM in both regions
  # ----------------------------------------
  SSMWriterFunction:
    Type: AWS::Lambda::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "VPC not required"
    Properties:
      Runtime: python3.9
      Handler: index.handler
      ReservedConcurrentExecutions: 5
      Role: !GetAtt SSMWriterFunctionRole.Arn
      Timeout: 300
      Code:
        ZipFile: |
          import json
          import boto3
          import logging
          import cfnresponse

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def handler(event, context):
              try:
                  props = event['ResourceProperties']
                  # PrimaryRegion is the region where this stack is running
                  primary_region = props['PrimaryRegion']
                  # RecoveryRegion comes from parameter
                  recovery_region = props['RecoveryRegion']
                  regions = [primary_region, recovery_region]

                  param_map = {
                      '/dr/primary/sourceVpcCidr': props['PrimarySourceVpcCidr'],
                      '/dr/primary/sourcePrivateSubnetCidr': props['PrimarySourcePrivateSubnetCidr'],
                      '/dr/primary/stagingVpcCidr': props['PrimaryStagingVpcCidr'],
                      '/dr/primary/stagingPrivateSubnetCidr': props['PrimaryStagingPrivateSubnetCidr'],
                      '/dr/primary/region': primary_region,

                      '/dr/recovery/vpcCidr': props['RecoveryVpcCidr'],
                      '/dr/recovery/privateSubnetCidr': props['RecoveryPrivateSubnetCidr'],
                      '/dr/recovery/stagingVpcCidr': props['RecoveryStagingVpcCidr'],
                      '/dr/recovery/stagingPrivateSubnetCidr': props['RecoveryStagingPrivateSubnetCidr'],
                      '/dr/recovery/region': recovery_region,
                      '/dr/recovery/primarySourceVpcCidr': props['RecoveryPrimarySourceVpcCidr']
                  }

                  if event['RequestType'] in ['Create', 'Update']:
                      for region in regions:
                          ssm = boto3.client('ssm', region_name=region)
                          for name, value in param_map.items():
                              ssm.put_parameter(
                                  Name=name,
                                  Value=value,
                                  Type='String',
                                  Overwrite=True
                              )
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
              except Exception as e:
                  logger.exception("Error writing SSM parameters")
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Message': str(e)})

  # ----------------------------------------
  # Custom Resource that triggers the Lambda
  # ----------------------------------------
  SSMWriter:
    Type: Custom::SSMWriter
    Properties:
      ServiceToken: !GetAtt SSMWriterFunction.Arn
      PrimarySourceVpcCidr: !Ref PrimarySourceVpcCidr
      PrimarySourcePrivateSubnetCidr: !Ref PrimarySourcePrivateSubnetCidr
      PrimaryStagingVpcCidr: !Ref PrimaryStagingVpcCidr
      PrimaryStagingPrivateSubnetCidr: !Ref PrimaryStagingPrivateSubnetCidr
      # Pass the current region to Lambda via a literal
      PrimaryRegion: !Ref "AWS::Region"
      RecoveryVpcCidr: !Ref RecoveryVpcCidr
      RecoveryPrivateSubnetCidr: !Ref RecoveryPrivateSubnetCidr
      RecoveryStagingVpcCidr: !Ref RecoveryStagingVpcCidr
      RecoveryStagingPrivateSubnetCidr: !Ref RecoveryStagingPrivateSubnetCidr
      RecoveryRegion: !Ref RecoveryRegion
      RecoveryPrimarySourceVpcCidr: !Ref RecoveryPrimarySourceVpcCidr

Outputs:
  Message:
    Description: "SSM parameters have been created in both regions"
    Value: "Deploy this stack in any single region; the Lambda will write all keys into both PrimaryRegion and RecoveryRegion."