AWSTemplateFormatVersion: "2010-09-09"
Description: "CloudFormation template to create an EC2 Image Builder pipeline for a hardened Amazon Linux 2023 ARM AMI with CIS Level 1 benchmarks, pre-configured for Elastic Beanstalk, daily build, vulnerability scanning, and lifecycle management."

Parameters:
  ParentImageArn:
    Type: String
    Description: "ARN of the parent CIS hardened Amazon Linux 2023 ARM image"
    AllowedPattern: "^arn:aws:imagebuilder:[a-z0-9-]+:aws:image/.+$"
  OrganizationId:
    Type: String
    Description: "AWS Organization ID to share the AMI with"
    AllowedPattern: "^o-[a-zA-Z0-9]{10,32}$"
  DevAccountId:
    Type: String
    Description: "AWS account ID for the dev deployment environment"
    AllowedPattern: "^\\d{12}$"
  ProdAccountId:
    Type: String
    Description: "AWS account ID for the prod deployment environment"
    AllowedPattern: "^\\d{12}$"
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: "VPC ID in which to launch the build instance"
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: "Subnet ID in which to launch the build instance"

Resources:
  ImageBuilderExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: EC2ImageBuilderExecutionRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: imagebuilder.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/EC2ImageBuilderExecutionPolicy
        - arn:aws:iam::aws:policy/AmazonSSMManagedEC2InstanceDefaultPolicy
      Policies:
        - PolicyName: ImageBuilderCustomPermissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:CreateTags
                  - ec2:ModifyImageAttribute
                  - ec2:ModifySnapshotAttribute
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource: "*"

  ImageBuilderInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: EC2ImageBuilderInstanceProfile
      Roles:
        - !Ref ImageBuilderExecutionRole

  EBPreConfigComponent:
    Type: AWS::ImageBuilder::Component
    Properties:
      Name: ElasticBeanstalkPreConfig
      Version: "1.0.0"
      Platform: "Linux"
      Description: "Custom component to pre-configure AMI for Elastic Beanstalk compatibility"
      ChangeDescription: "Initial version"
      Data: |
        name: ElasticBeanstalkPreConfig
        description: Pre-configure for Elastic Beanstalk
        schemaVersion: 1.0
        phases:
          - phase: build
            steps:
              - action: ExecuteBash
                name: InstallPackages
                inputs:
                  commands:
                    - yum install -y docker git amazon-efs-utils
              - action: ExecuteBash
                name: EnableDocker
                inputs:
                  commands:
                    - systemctl enable docker
            onFailure: Abort
          - phase: test
            steps:
              - action: ExecuteBash
                name: VerifyDocker
                inputs:
                  commands:
                    - docker --version

  ImageRecipe:
    Type: AWS::ImageBuilder::ImageRecipe
    Properties:
      Name: HardenedAmazonLinux2023ARM-EB
      Version: "1.0.0"
      ParentImage: !Ref ParentImageArn
      Components:
        - ComponentArn: !Ref EBPreConfigComponent
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 50
            VolumeType: gp3
      WorkingDirectory: /tmp
      Tags:
        Environment: Production

  InfrastructureConfiguration:
    Type: AWS::ImageBuilder::InfrastructureConfiguration
    Properties:
      Name: ImageBuilderInfrastructure
      Description: "Infrastructure configuration for Image Builder pipeline"
      InstanceProfileName: !Ref ImageBuilderInstanceProfile
      InstanceTypes:
        - t4g.micro
      SecurityGroupIds:
        - !Ref BuildSecurityGroup
      SubnetId: !Ref SubnetId
      Logging:
        S3Logs:
          S3BucketName: !Ref LogBucket
          S3KeyPrefix: imagebuilder-logs/
      ResourceTags:
        Environment: Production

  BuildSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Security group for Image Builder build instance"
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: ImageBuilderBuildSG

  LogBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "imagebuilder-logs-${AWS::AccountId}-${AWS::Region}"
      VersioningConfiguration:
        Status: Suspended
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireLogsAfter30Days
            Status: Enabled
            ExpirationInDays: 30

  DistributionConfiguration:
    Type: AWS::ImageBuilder::DistributionConfiguration
    Properties:
      Name: ImageBuilderDistributionConfig
      Description: "Distribution configuration to share AMI with organization and specific accounts"
      Distributions:
        - Region: !Ref "AWS::Region"
          AmiDistributionConfiguration:
            Name: "HardenedAmazonLinux2023ARM-EB-{{ imagebuilder:buildDate }}"
            Description: "CIS Level 1 hardened Amazon Linux 2023 ARM AMI pre-configured for Elastic Beanstalk"
            LaunchPermissionConfiguration:
              OrganizationArns:
                - !Sub "arn:aws:organizations::${AWS::AccountId}:organization/${OrganizationId}"
              UserIds:
                - !Ref DevAccountId
                - !Ref ProdAccountId
            AmiTags:
              Environment: Production
              ImagePipeline: HardenedAMIPipeline
      Tags:
        Environment: Production

  ImagePipeline:
    Type: AWS::ImageBuilder::ImagePipeline
    Properties:
      Name: HardenedAMIPipeline
      Description: "Daily pipeline to build hardened Amazon Linux 2023 ARM AMI"
      ImageRecipeArn: !Ref ImageRecipe
      InfrastructureConfigurationArn: !Ref InfrastructureConfiguration
      DistributionConfigurationArn: !Ref DistributionConfiguration
      ImageScanningConfiguration: {}
      Schedule:
        ScheduleExpression: "cron(0 2 * * ? *)"
        PipelineExecutionStartCondition: "EXPRESSION_MATCH_ONLY"
      Status: ENABLED
      Tags:
        Environment: Production

  ImageLifecyclePolicy:
    Type: AWS::ImageBuilder::LifecyclePolicy
    Properties:
      Name: DeleteOldImages
      Description: "Delete images older than 6 months (180 days)"
      ResourceSelection:
        resourceType: AMI_IMAGE
        recipeSelection:
          name: !GetAtt ImageRecipe.Name
          semanticVersion: "1.0.0"
      ExecutionRole: !GetAtt ImageBuilderExecutionRole.Arn
      PolicyDetails:
        - Action:
            Type: DELETE
            IncludeResources:
              amis: true
              snapshots: true
          Filter:
            Type: AGE
            Value: 180
            Unit: DAYS
          ExclusionRules: {}
      Status: ENABLED

Outputs:
  ImagePipelineArn:
    Description: "ARN of the Image Pipeline"
    Value: !Ref ImagePipeline
  ImageRecipeArn:
    Description: "ARN of the Image Recipe"
    Value: !Ref ImageRecipe
  LifecyclePolicyArn:
    Description: "ARN of the Lifecycle Policy"
    Value: !Ref ImageLifecyclePolicy
  LogBucketName:
    Description: "S3 bucket for build logs"
    Value: !Ref LogBucket