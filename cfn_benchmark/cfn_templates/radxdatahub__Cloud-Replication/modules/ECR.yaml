AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Last Modified: 2025/10/16 17:06:37
  "This template deploys the NIH RADx Data Hub ECR repositories."

Parameters:
  Environment:
    Type: String
    Description: The Project Environment
    AllowedValues:
      - dev
      - test
      - prod
      - shared
  ProjectName:
    Type: String
    Description: The Project name
    Default: radx
    AllowedValues:
      - radx

Conditions:
  DEV: !Equals [!Ref Environment, dev]
  TEST: !Equals [!Ref Environment, test]
  PROD: !Equals [!Ref Environment, prod]
  NOTDEV: !Not [!Equals [!Ref Environment, dev]]
  NOTPROD: !Not [!Equals [!Ref Environment, prod]]

Resources:
    ReporterRepository:
        Type: "AWS::ECR::Repository"
        Properties:
            RepositoryName: !Sub "radx-reporter/${Environment}"

    UserInterfaceRepository:
        Type: "AWS::ECR::Repository"
        Properties:
            RepositoryName: !Sub "radx-ui/${Environment}"

    SearchServiceRepository:
        Type: "AWS::ECR::Repository"
        Properties:
            RepositoryName: !Sub "radx-search/${Environment}"

    EntityServiceRepository:
        Type: "AWS::ECR::Repository"
        Properties:
            RepositoryName: !Sub "radx-entityservice/${Environment}"

    OpenSearchRefreshRepository:
        Type: "AWS::ECR::Repository"
        Properties:
            RepositoryName: !Sub "radx-opensearchrefresh/${Environment}"

    SubmissionServiceRepository:
        Type: "AWS::ECR::Repository"
        Properties:
            RepositoryName: !Sub "radx-submission-service/${Environment}"

    PublicationScriptRepository:
        Type: "AWS::ECR::Repository"
        Properties:
            RepositoryName: !Sub "radx-publicationscript/${Environment}"

    ApprovedDataServiceRepository:
        Type: "AWS::ECR::Repository"
        Properties:
            RepositoryName: !Sub "radx-approved-data-service/${Environment}"

    DownloadServiceRepository:
        Type: "AWS::ECR::Repository"
        Properties:
            RepositoryName: !Sub "radx-download-service/${Environment}"

    UserServiceRepository:
        Type: "AWS::ECR::Repository"
        Properties:
            RepositoryName: !Sub "radx-user-service/${Environment}"