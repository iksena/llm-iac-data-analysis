AWSTemplateFormatVersion: 2010-09-09
Description: >-
  WordPress architecture evolution - Stage 4 nested root stack
  Application server with separate RDS database & EFS shared storage
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Stage 4 configuration
        Parameters:
          - LatestAmiId
          - SourceAmiId
          - CfnMetadataNonce
    ParameterLabels:
      LatestAmiId:
        default: Amazon Linux 2023 AMI
      SourceAmiId:
        default: Stage 3 source AMI ID
      CfnMetadataNonce:
        default: cfn-init refresh nonce

Parameters:
  LatestAmiId:
    Description: Latest Amazon Linux 2023 AMI for greenfield stage 4.
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.18-x86_64
  SourceAmiId:
    Type: String
    Default: ''
    AllowedPattern: '^$|^ami-[a-z0-9]+$'
    Description: Optional AMI created from stage 3 before updating to stage 4. Use for same-stack upgrades to preserve wp-content files before EFS cutover.
  CfnMetadataNonce:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 2147483647
    Description: Increase on stack update so cfn-hup re-runs cfn-init.

Resources:
  NetworkStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../nested/network.yaml

  IamStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../nested/iam.yaml

  AutomationStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../nested/automation.yaml
      Parameters:
        RootStackName: !Ref AWS::StackName

  DatabaseStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../nested/database.yaml
      Parameters:
        RootStackName: !Ref AWS::StackName
        VpcId: !GetAtt NetworkStack.Outputs.VpcId
        DbSubnetAId: !GetAtt NetworkStack.Outputs.DbSubnetAId
        DbSubnetBId: !GetAtt NetworkStack.Outputs.DbSubnetBId
        DbSubnetCId: !GetAtt NetworkStack.Outputs.DbSubnetCId

  ContentStorageStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../nested/content-storage.yaml
      Parameters:
        VpcId: !GetAtt NetworkStack.Outputs.VpcId
        AppSubnetAId: !GetAtt NetworkStack.Outputs.AppSubnetAId
        AppSubnetBId: !GetAtt NetworkStack.Outputs.AppSubnetBId
        AppSubnetCId: !GetAtt NetworkStack.Outputs.AppSubnetCId

  SharedSsmStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ../nested/shared-ssm.yaml
      Parameters:
        DBEndpointValue: !GetAtt DatabaseStack.Outputs.DBEndpointAddress
        EFSfsidValue: !GetAtt ContentStorageStack.Outputs.EfsId

  AppServerStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: SharedSsmStack
    Properties:
      TemplateURL: ../nested/app-efs.yaml
      Parameters:
        LatestAmiId: !Ref LatestAmiId
        SourceAmiId: !Ref SourceAmiId
        CfnMetadataNonce: !Ref CfnMetadataNonce
        VpcId: !GetAtt NetworkStack.Outputs.VpcId
        PublicSubnetId: !GetAtt NetworkStack.Outputs.PublicSubnetAId
        InstanceProfileName: !GetAtt IamStack.Outputs.InstanceProfileName
        EfsId: !GetAtt ContentStorageStack.Outputs.EfsId

Outputs:
  WordpressURL:
    Description: Open this stable Elastic IP URL to verify WordPress.
    Value: !GetAtt AppServerStack.Outputs.WordpressURL
  WordpressInstanceId:
    Description: Current WordPress EC2 instance ID.
    Value: !GetAtt AppServerStack.Outputs.WordpressInstanceId
  WordpressInstanceAutoIP:
    Value: !GetAtt AppServerStack.Outputs.WordpressInstanceAutoIP
  WordpressLaunchTemplateId:
    Value: !GetAtt AppServerStack.Outputs.WordpressLaunchTemplateId
  EfsId:
    Value: !GetAtt ContentStorageStack.Outputs.EfsId
  PreStageSnapshotDocumentName:
    Value: !GetAtt AutomationStack.Outputs.PreStageSnapshotDocumentName
  AutomationRoleArn:
    Value: !GetAtt AutomationStack.Outputs.AutomationRoleArn
  VpcId:
    Value: !GetAtt NetworkStack.Outputs.VpcId