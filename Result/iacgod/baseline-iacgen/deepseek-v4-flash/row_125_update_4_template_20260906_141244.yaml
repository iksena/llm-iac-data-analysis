AWSTemplateFormatVersion: '2010-09-09'
Description: Configurable multi-tier VPC with Flow Logs and flexible NAT options

Parameters:
  VpcCidr:
    Type: String
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$
    ConstraintDescription: Must be a valid IPv4 CIDR notation
    Description: CIDR block for the VPC
    Default: '10.0.0.0/16'

  NumberOfAZs:
    Type: String
    AllowedValues:
      - '1'
      - '2'
      - '3'
    Default: '2'
    Description: Number of Availability Zones to use (1-3)

  EnableTier1:
    Type: String
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'true'
    Description: Enable the first tier (typically public)

  Tier1Name:
    Type: String
    Default: Public
    Description: Name for the first tier

  Tier1Cidr:
    Type: CommaDelimitedList
    Description: Comma-separated list of CIDR blocks for Tier 1 subnets (one per AZ)
    Default: '10.0.1.0/24,10.0.2.0/24,10.0.3.0/24'

  EnableTier2:
    Type: String
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'true'
    Description: Enable the second tier

  Tier2Name:
    Type: String
    Default: Private
    Description: Name for the second tier

  Tier2Cidr:
    Type: CommaDelimitedList
    Description: Comma-separated list of CIDR blocks for Tier 2 subnets (one per AZ)
    Default: '10.0.10.0/24,10.0.11.0/24,10.0.12.0/24'

  EnableTier3:
    Type: String
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'false'
    Description: Enable the third tier

  Tier3Name:
    Type: String
    Default: Restricted
    Description: Name for the third tier

  Tier3Cidr:
    Type: CommaDelimitedList
    Description: Comma-separated list of CIDR blocks for Tier 3 subnets (one per AZ)
    Default: '10.0.20.0/24,10.0.21.0/24,10.0.22.0/24'

  CreateInternetGateway:
    Type: String
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'true'
    Description: Create an Internet Gateway for tier 1

  NatGatewayType:
    Type: String
    AllowedValues:
      - None
      - Single
      - PerAz
    Default: None
    Description: Configure NAT Gateways (None, Single shared, or one per AZ)

  EnableFlowLogs:
    Type: String
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'true'
    Description: Enable VPC Flow Logs

  PermissionsBoundaryArn:
    Type: String
    Default: ''
    Description: Optional IAM permissions boundary ARN for Flow Logs role

Conditions:
  HasTier1: !Equals [!Ref EnableTier1, 'true']
  HasTier2: !Equals [!Ref EnableTier2, 'true']
  HasTier3: !Equals [!Ref EnableTier3, 'true']
  AnyTier: !Or [!Condition HasTier1, !Condition HasTier2, !Condition HasTier3]
  CreateIGWParam: !Equals [!Ref CreateInternetGateway, 'true']
  CreateIGW: !And [!Condition HasTier1, !Condition CreateIGWParam]
  CreateFlowLogs: !Equals [!Ref EnableFlowLogs, 'true']
  UsePermissionsBoundary: !Not [!Equals [!Ref PermissionsBoundaryArn, '']]
  NatSingle: !Equals [!Ref NatGatewayType, 'Single']
  NatPerAz: !Equals [!Ref NatGatewayType, 'PerAz']
  NatEnabled: !Or [!Condition NatSingle, !Condition NatPerAz]
  AZge2: !Not [!Equals [!Ref NumberOfAZs, '1']]
  AZeq3: !Equals [!Ref NumberOfAZs, '3']
  T1Sub0: !Condition HasTier1
  T1Sub1: !And [!Condition HasTier1, !Condition AZge2]
  T1Sub2: !And [!Condition HasTier1, !Condition AZeq3]
  T2Sub0: !Condition HasTier2
  T2Sub1: !And [!Condition HasTier2, !Condition AZge2]
  T2Sub2: !And [!Condition HasTier2, !Condition AZeq3]
  T3Sub0: !Condition HasTier3
  T3Sub1: !And [!Condition HasTier3, !Condition AZge2]
  T3Sub2: !And [!Condition HasTier3, !Condition AZeq3]
  Tier2NatRoute: !And [!Condition HasTier2, !Condition NatEnabled]
  Tier3NatRoute: !And [!Condition HasTier3, !Condition NatEnabled]
  NatPerAzAZge2: !And [!Condition NatPerAz, !Condition AZge2]
  NatPerAzAZeq3: !And [!Condition NatPerAz, !Condition AZeq3]

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-VPC'

  FlowLogsLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: CreateFlowLogs
    Properties:
      RetentionInDays: 14
      LogGroupName: !Sub '/aws/vpc/flowlogs/${AWS::StackName}'

  FlowLogsRole:
    Type: AWS::IAM::Role
    Condition: CreateFlowLogs
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: vpc-flow-logs.amazonaws.com
            Action: sts:AssumeRole
      Path: '/'
      PermissionsBoundary: !If [UsePermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref 'AWS::NoValue']
      Policies:
        - PolicyName: flow-logs-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                Resource: !GetAtt FlowLogsLogGroup.Arn

  FlowLog:
    Type: AWS::EC2::FlowLog
    Condition: CreateFlowLogs
    Properties:
      DeliverLogsPermissionArn: !GetAtt FlowLogsRole.Arn
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Ref FlowLogsLogGroup
      ResourceType: VPC
      ResourceId: !Ref VPC
      TrafficType: ALL

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Condition: CreateIGW
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-IGW'

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Condition: CreateIGW
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  Tier1Subnet0:
    Type: AWS::EC2::Subnet
    Condition: T1Sub0
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [0, !Ref Tier1Cidr]
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${Tier1Name}-${AWS::StackName}-0'

  Tier1Subnet1:
    Type: AWS::EC2::Subnet
    Condition: T1Sub1
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [1, !Ref Tier1Cidr]
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${Tier1Name}-${AWS::StackName}-1'

  Tier1Subnet2:
    Type: AWS::EC2::Subnet
    Condition: T1Sub2
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [2, !Ref Tier1Cidr]
      AvailabilityZone: !Select [2, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${Tier1Name}-${AWS::StackName}-2'

  Tier2Subnet0:
    Type: AWS::EC2::Subnet
    Condition: T2Sub0
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [0, !Ref Tier2Cidr]
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${Tier2Name}-${AWS::StackName}-0'

  Tier2Subnet1:
    Type: AWS::EC2::Subnet
    Condition: T2Sub1
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [1, !Ref Tier2Cidr]
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${Tier2Name}-${AWS::StackName}-1'

  Tier2Subnet2:
    Type: AWS::EC2::Subnet
    Condition: T2Sub2
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [2, !Ref Tier2Cidr]
      AvailabilityZone: !Select [2, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${Tier2Name}-${AWS::StackName}-2'

  Tier3Subnet0:
    Type: AWS::EC2::Subnet
    Condition: T3Sub0
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [0, !Ref Tier3Cidr]
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${Tier3Name}-${AWS::StackName}-0'

  Tier3Subnet1:
    Type: AWS::EC2::Subnet
    Condition: T3Sub1
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [1, !Ref Tier3Cidr]
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${Tier3Name}-${AWS::StackName}-1'

  Tier3Subnet2:
    Type: AWS::EC2::Subnet
    Condition: T3Sub2
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Select [2, !Ref Tier3Cidr]
      AvailabilityZone: !Select [2, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${Tier3Name}-${AWS::StackName}-2'

  RouteTableTier1:
    Type: AWS::EC2::RouteTable
    Condition: HasTier1
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${Tier1Name}-${AWS::StackName}'

  RouteTableTier2:
    Type: AWS::EC2::RouteTable
    Condition: HasTier2
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${Tier2Name}-${AWS::StackName}'

  RouteTableTier3:
    Type: AWS::EC2::RouteTable
    Condition: HasTier3
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${Tier3Name}-${AWS::StackName}'

  RouteIGW:
    Type: AWS::EC2::Route
    Condition: CreateIGW
    Properties:
      RouteTableId: !Ref RouteTableTier1
      DestinationCidrBlock: '0.0.0.0/0'
      GatewayId: !Ref InternetGateway

  NatEIPShared:
    Type: AWS::EC2::EIP
    Condition: NatSingle
    Properties:
      Domain: vpc

  NatGatewayShared:
    Type: AWS::EC2::NatGateway
    Condition: NatSingle
    Properties:
      AllocationId: !GetAtt NatEIPShared.AllocationId
      SubnetId: !If [T1Sub0, !Ref Tier1Subnet0, !Ref 'AWS::NoValue']

  NatEIP0:
    Type: AWS::EC2::EIP
    Condition: NatPerAz
    Properties:
      Domain: vpc

  NatGateway0:
    Type: AWS::EC2::NatGateway
    Condition: NatPerAz
    Properties:
      AllocationId: !GetAtt NatEIP0.AllocationId
      SubnetId: !If [T1Sub0, !Ref Tier1Subnet0, !Ref 'AWS::NoValue']

  NatEIP1:
    Type: AWS::EC2::EIP
    Condition: NatPerAzAZge2
    Properties:
      Domain: vpc

  NatGateway1:
    Type: AWS::EC2::NatGateway
    Condition: NatPerAzAZge2
    Properties:
      AllocationId: !GetAtt NatEIP1.AllocationId
      SubnetId: !If [T1Sub1, !Ref Tier1Subnet1, !Ref 'AWS::NoValue']

  NatEIP2:
    Type: AWS::EC2::EIP
    Condition: NatPerAzAZeq3
    Properties:
      Domain: vpc

  NatGateway2:
    Type: AWS::EC2::NatGateway
    Condition: NatPerAzAZeq3
    Properties:
      AllocationId: !GetAtt NatEIP2.AllocationId
      SubnetId: !If [T1Sub2, !Ref Tier1Subnet2, !Ref 'AWS::NoValue']

  RouteTier2ToNat:
    Type: AWS::EC2::Route
    Condition: Tier2NatRoute
    Properties:
      RouteTableId: !Ref RouteTableTier2
      DestinationCidrBlock: '0.0.0.0/0'
      NatGatewayId: !If [NatSingle, !Ref NatGatewayShared, !Ref NatGateway0]

  RouteTier3ToNat:
    Type: AWS::EC2::Route
    Condition: Tier3NatRoute
    Properties:
      RouteTableId: !Ref RouteTableTier3
      DestinationCidrBlock: '0.0.0.0/0'
      NatGatewayId: !If [NatSingle, !Ref NatGatewayShared, !Ref NatGateway0]

  SubnetRTAssocT10:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: T1Sub0
    Properties:
      SubnetId: !Ref Tier1Subnet0
      RouteTableId: !Ref RouteTableTier1

  SubnetRTAssocT11:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: T1Sub1
    Properties:
      SubnetId: !Ref Tier1Subnet1
      RouteTableId: !Ref RouteTableTier1

  SubnetRTAssocT12:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: T1Sub2
    Properties:
      SubnetId: !Ref Tier1Subnet2
      RouteTableId: !Ref RouteTableTier1

  SubnetRTAssocT20:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: T2Sub0
    Properties:
      SubnetId: !Ref Tier2Subnet0
      RouteTableId: !Ref RouteTableTier2

  SubnetRTAssocT21:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: T2Sub1
    Properties:
      SubnetId: !Ref Tier2Subnet1
      RouteTableId: !Ref RouteTableTier2

  SubnetRTAssocT22:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: T2Sub2
    Properties:
      SubnetId: !Ref Tier2Subnet2
      RouteTableId: !Ref RouteTableTier2

  SubnetRTAssocT30:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: T3Sub0
    Properties:
      SubnetId: !Ref Tier3Subnet0
      RouteTableId: !Ref RouteTableTier3

  SubnetRTAssocT31:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: T3Sub1
    Properties:
      SubnetId: !Ref Tier3Subnet1
      RouteTableId: !Ref RouteTableTier3

  SubnetRTAssocT32:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: T3Sub2
    Properties:
      SubnetId: !Ref Tier3Subnet2
      RouteTableId: !Ref RouteTableTier3

Outputs:
  VPCId:
    Description: ID of the VPC
    Value: !Ref VPC
    Export:
      Name: !Sub '${AWS::StackName}-VPCId'

  Tier1SubnetIds:
    Condition: HasTier1
    Description: Subnet IDs for Tier 1
    Value: !Join
      - ','
      - [!Ref Tier1Subnet0, !If [AZge2, !Ref Tier1Subnet1, !Ref 'AWS::NoValue'], !If [AZeq3, !Ref Tier1Subnet2, !Ref 'AWS::NoValue']]
    Export:
      Name: !Sub '${AWS::StackName}-Tier1SubnetIds'

  Tier2SubnetIds:
    Condition: HasTier2
    Description: Subnet IDs for Tier 2
    Value: !Join
      - ','
      - [!Ref Tier2Subnet0, !If [AZge2, !Ref Tier2Subnet1, !Ref 'AWS::NoValue'], !If [AZeq3, !Ref Tier2Subnet2, !Ref 'AWS::NoValue']]
    Export:
      Name: !Sub '${AWS::StackName}-Tier2SubnetIds'

  Tier3SubnetIds:
    Condition: HasTier3
    Description: Subnet IDs for Tier 3
    Value: !Join
      - ','
      - [!Ref Tier3Subnet0, !If [AZge2, !Ref Tier3Subnet1, !Ref 'AWS::NoValue'], !If [AZeq3, !Ref Tier3Subnet2, !Ref 'AWS::NoValue']]
    Export:
      Name: !Sub '${AWS::StackName}-Tier3SubnetIds'

  AllSubnetIds:
    Condition: AnyTier
    Description: All subnet IDs across all tiers
    Value: !Join
      - ','
      - [!If [T1Sub0, !Ref Tier1Subnet0, ''], !If [T1Sub1, !Ref Tier1Subnet1, ''], !If [T1Sub2, !Ref Tier1Subnet2, ''], !If [T2Sub0, !Ref Tier2Subnet0, ''], !If [T2Sub1, !Ref Tier2Subnet1, ''], !If [T2Sub2, !Ref Tier2Subnet2, ''], !If [T3Sub0, !Ref Tier3Subnet0, ''], !If [T3Sub1, !Ref Tier3Subnet1, ''], !If [T3Sub2, !Ref Tier3Subnet2, '']]
    Export:
      Name: !Sub '${AWS::StackName}-AllSubnetIds'

  NatGatewayIds:
    Description: NAT Gateway IDs (comma separated if multiple)
    Value: !If
      - NatSingle
      - !Ref NatGatewayShared
      - !If
        - NatPerAz
        - !Join
          - ','
          - [!Ref NatGateway0, !If [AZge2, !Ref NatGateway1, ''], !If [AZeq3, !Ref NatGateway2, '']]
        - 'None'