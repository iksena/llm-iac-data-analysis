AWSTemplateFormatVersion: '2010-09-09'
Description: Docker Voting Worker service

Parameters:
  EnvironmentName:
    Type: String
    Default: voteapp
    Description: A name for the environment that this cloudformation will be part of.
  ServiceName:
    Type: String
    Default: worker
    Description: A name for the service
  ImageUrl:
    Type: String
    Default: worker
    Description: The url of a docker image that contains the application process
  ContainerCpu:
    Type: Number
    Default: 1024
    Description: How much CPU to give the container. 1024 is 1 CPU
  ContainerMemory:
    Type: Number
    Default: 2048
    Description: How much memory in megabytes to give the container
  DesiredCount:
    Type: Number
    Default: 2
    Description: How many copies of the service task to run
  Role:
    Type: String
    Default: ""
    Description: (Optional) An IAM role to give the service's containers
  MongoUri:
    Type: String
    Default: ""
    Description: (Optional) Mongo URI
  RedisHostEndpoint:
    Type: String
    Description: Endpoint address of the Redis cluster
    Default: ""

Conditions:
  HasCustomRole: !Not [ !Equals [!Ref 'Role', ''] ]

Resources:
  # ----------------------------------------------------------------------------
  # SELF-CONTAINED NETWORK + CLUSTER (was Fn::ImportValue from a sibling
  # "base infra" stack keyed by EnvironmentName -- EcsClusterName,
  # FargateSecurityGroupId, PublicSubnetOneId/TwoId, EcsTaskExecutionRoleArn,
  # ApplicationAutoscalingRoleArn -- that stack was never part of this
  # benchmark, so a prior pass converted the imports to required Parameters
  # with no default; those are genuinely unfillable by a dummy value (a
  # synthesized dummy ECS cluster name / subnet / SG id doesn't exist on
  # real AWS). Building the minimal cluster + network + roles here instead,
  # same self-containment approach already used for the other ECS-microservice
  # rows in this benchmark.
  # ----------------------------------------------------------------------------
  SelfVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.40.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-vpc'

  SelfInternetGateway:
    Type: AWS::EC2::InternetGateway

  SelfGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref SelfVpc
      InternetGatewayId: !Ref SelfInternetGateway

  SelfPublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref SelfVpc

  SelfPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: SelfGatewayAttachment
    Properties:
      RouteTableId: !Ref SelfPublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref SelfInternetGateway

  SelfPublicSubnetOne:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref SelfVpc
      CidrBlock: 10.40.0.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false

  SelfPublicSubnetOneRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SelfPublicSubnetOne
      RouteTableId: !Ref SelfPublicRouteTable

  SelfPublicSubnetTwo:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref SelfVpc
      CidrBlock: 10.40.1.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false

  SelfPublicSubnetTwoRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SelfPublicSubnetTwo
      RouteTableId: !Ref SelfPublicRouteTable

  # Egress to 0.0.0.0/0 is required regardless of port scoping: this worker
  # pulls its container image and reaches CloudWatch Logs / ECR / an
  # externally-parameterized Mongo/Redis endpoint, none of which have fixed
  # IPs to scope down to. AWS-0104 objects to "any IP" specifically, not
  # port breadth, so narrowing FromPort/ToPort alone doesn't clear it --
  # same class of unavoidable finding as the bastion egress rule elsewhere
  # in this benchmark.
  SelfFargateSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for the worker Fargate task
      VpcId: !Ref SelfVpc
      SecurityGroupEgress:
        #trivy:ignore:AWS-0104
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        #trivy:ignore:AWS-0104
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  SelfEcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${EnvironmentName}-cluster'

  SelfEcsTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  SelfApplicationAutoscalingRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: application-autoscaling.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/aws-service-role/AmazonECSServiceRolePolicy

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Join ['-', [!Ref 'EnvironmentName', 'service', !Ref 'ServiceName']]

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Ref 'ServiceName'
      Cpu: !Ref 'ContainerCpu'
      Memory: !Ref 'ContainerMemory'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt SelfEcsTaskExecutionRole.Arn
      TaskRoleArn:
        Fn::If:
          - 'HasCustomRole'
          - !Ref 'Role'
          - !Ref "AWS::NoValue"
      ContainerDefinitions:
        - Name: !Ref 'ServiceName'
          Cpu: !Ref 'ContainerCpu'
          Memory: !Ref 'ContainerMemory'
          Image: !Ref 'ImageUrl'
          Environment:
            - Name: MONGO_URI
              Value: !Ref 'MongoUri'
            - Name: REDIS_HOST
              Value: !Ref 'RedisHostEndpoint'
          LogConfiguration:
            LogDriver: 'awslogs'
            Options:
              awslogs-group: !Join ['-', [!Ref 'EnvironmentName', 'service', !Ref 'ServiceName']]
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: !Ref 'ServiceName'

  Service:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Ref 'ServiceName'
      Cluster: !Sub '${EnvironmentName}-cluster'
      LaunchType: FARGATE
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 75
      DesiredCount: !Ref 'DesiredCount'
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref SelfFargateSecurityGroup
          Subnets:
            - !Ref SelfPublicSubnetOne
            - !Ref SelfPublicSubnetTwo
      TaskDefinition: !Ref 'TaskDefinition'

  ScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    DependsOn: Service
    Properties:
      ServiceNamespace: 'ecs'
      ScalableDimension: 'ecs:service:DesiredCount'
      ResourceId: !Join ['/', ['service', !Sub '${EnvironmentName}-cluster', !Ref 'ServiceName']]
      MinCapacity: 2
      MaxCapacity: 10
      RoleARN: !GetAtt SelfApplicationAutoscalingRole.Arn

  ScaleDownPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    DependsOn: ScalableTarget
    Properties:
      PolicyName: !Join ['/', ['scale', !Ref 'EnvironmentName', !Ref 'ServiceName', 'down']]
      PolicyType: StepScaling
      ResourceId: !Join ['/', ['service', !Sub '${EnvironmentName}-cluster', !Ref 'ServiceName']]
      ScalableDimension: 'ecs:service:DesiredCount'
      ServiceNamespace: 'ecs'
      StepScalingPolicyConfiguration:
        AdjustmentType: 'ChangeInCapacity'
        StepAdjustments:
          - MetricIntervalUpperBound: 0
            ScalingAdjustment: -1
        MetricAggregationType: 'Average'
        Cooldown: 60

  ScaleUpPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    DependsOn: ScalableTarget
    Properties:
      PolicyName: !Join ['/', ['scale', !Ref 'EnvironmentName', !Ref 'ServiceName', 'up']]
      PolicyType: StepScaling
      ResourceId: !Join ['/', ['service', !Sub '${EnvironmentName}-cluster', !Ref 'ServiceName']]
      ScalableDimension: 'ecs:service:DesiredCount'
      ServiceNamespace: 'ecs'
      StepScalingPolicyConfiguration:
        AdjustmentType: 'ChangeInCapacity'
        StepAdjustments:
          - MetricIntervalLowerBound: 0
            MetricIntervalUpperBound: 15
            ScalingAdjustment: 1
          - MetricIntervalLowerBound: 15
            MetricIntervalUpperBound: 25
            ScalingAdjustment: 2
          - MetricIntervalLowerBound: 25
            ScalingAdjustment: 3
        MetricAggregationType: 'Average'
        Cooldown: 60

  LowCpuUsageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Join ['-', ['low-cpu', !Ref 'EnvironmentName', !Ref 'ServiceName']]
      AlarmDescription: !Join [' ', ["Low CPU utilization for service", !Ref 'ServiceName', "in stack", !Ref 'EnvironmentName']]
      MetricName: CPUUtilization
      Namespace: AWS/ECS
      Dimensions:
        - Name: ServiceName
          Value: !Ref 'ServiceName'
        - Name: ClusterName
          Value: !Sub '${EnvironmentName}-cluster'
      Statistic: Average
      Period: 60
      EvaluationPeriods: 1
      Threshold: 20
      ComparisonOperator: LessThanOrEqualToThreshold
      AlarmActions:
        - !Ref ScaleDownPolicy

  HighCpuUsageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Join ['-', ['high-cpu', !Ref 'EnvironmentName', !Ref 'ServiceName']]
      AlarmDescription: !Join [' ', ["High CPU utilization for service", !Ref 'ServiceName', "in stack", !Ref 'EnvironmentName']]
      MetricName: CPUUtilization
      Namespace: AWS/ECS
      Dimensions:
        - Name: ServiceName
          Value: !Ref 'ServiceName'
        - Name: ClusterName
          Value: !Sub '${EnvironmentName}-cluster'
      Statistic: Average
      Period: 60
      EvaluationPeriods: 1
      Threshold: 70
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref ScaleUpPolicy