AWSTemplateFormatVersion: '2010-09-09'
Description: 'Lab 23: S3 Storage Class Analysis and Intelligent-Tiering'

Parameters:
  BucketPrefix:
    Type: String
    Default: lab23-storage-optimization
    Description: Prefix for S3 bucket names

Resources:
  # S3 Bucket with Intelligent-Tiering
  IntelligentTieringBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${BucketPrefix}-intelligent-tiering-${AWS::AccountId}
      IntelligentTieringConfigurations:
        - Id: EntireBucket
          Status: Enabled
          Tierings:
            - AccessTier: ARCHIVE_ACCESS
              Days: 90
            - AccessTier: DEEP_ARCHIVE_ACCESS
              Days: 180
      Tags:
        - Key: Name
          Value: Intelligent-Tiering-Bucket
        - Key: Lab
          Value: Lab23

  # S3 Bucket with Lifecycle Policies
  LifecycleBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${BucketPrefix}-lifecycle-${AWS::AccountId}
      LifecycleConfiguration:
        Rules:
          - Id: TransitionToIA
            Status: Enabled
            Transitions:
              - TransitionInDays: 30
                StorageClass: STANDARD_IA
              - TransitionInDays: 90
                StorageClass: GLACIER_IR
              - TransitionInDays: 180
                StorageClass: GLACIER
              - TransitionInDays: 365
                StorageClass: DEEP_ARCHIVE
            ExpirationInDays: 2555  # 7 years
      Tags:
        - Key: Name
          Value: Lifecycle-Bucket
        - Key: Lab
          Value: Lab23

  # S3 Bucket with Storage Class Analysis
  AnalysisBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${BucketPrefix}-analysis-${AWS::AccountId}
      AnalyticsConfigurations:
        - Id: EntireBucketAnalysis
          StorageClassAnalysis:
            DataExport:
              Destination:
                BucketArn: !GetAtt AnalysisResultsBucket.Arn
                Format: CSV
                Prefix: storage-analysis/
              OutputSchemaVersion: V_1
      Tags:
        - Key: Name
          Value: Analysis-Bucket
        - Key: Lab
          Value: Lab23

  # Bucket to store analysis results
  AnalysisResultsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${BucketPrefix}-results-${AWS::AccountId}
      Tags:
        - Key: Name
          Value: Analysis-Results
        - Key: Lab
          Value: Lab23

Outputs:
  IntelligentTieringBucket:
    Value: !Ref IntelligentTieringBucket
    Description: Bucket with Intelligent-Tiering enabled

  LifecycleBucket:
    Value: !Ref LifecycleBucket
    Description: Bucket with lifecycle policies

  AnalysisBucket:
    Value: !Ref AnalysisBucket
    Description: Bucket with Storage Class Analysis

  NextSteps:
    Value: |
      1. Upload sample files to buckets
      2. Wait 30+ days for Storage Class Analysis recommendations
      3. Review lifecycle transitions in S3 console
      4. Check Intelligent-Tiering automatic transitions