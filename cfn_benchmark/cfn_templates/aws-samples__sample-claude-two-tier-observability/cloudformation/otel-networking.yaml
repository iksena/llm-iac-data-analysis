AWSTemplateFormatVersion: '2010-09-09'
Description: >
  VPC and networking for the OTEL Collector (ECS Fargate).
  Uses only public subnets + Fargate (no NAT Gateway cost).
  Stack name convention: claude-code-networking-{OrgName}-{Environment}

Parameters:
  OrgName:
    Type: String
    Default: my-org
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, staging, prod]
  VpcCidr:
    Type: String
    Default: '10.200.0.0/16'
  PublicSubnet1Cidr:
    Type: String
    Default: '10.200.1.0/24'
  PublicSubnet2Cidr:
    Type: String
    Default: '10.200.2.0/24'

Resources:
  # =========================================================================
  # VPC
  # =========================================================================
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub 'claude-code-vpc-${OrgName}-${Environment}'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub 'claude-code-igw-${OrgName}-${Environment}'

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # =========================================================================
  # Public subnets (2 AZs for ALB requirement)
  # =========================================================================
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub 'claude-code-pub1-${OrgName}-${Environment}'

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub 'claude-code-pub2-${OrgName}-${Environment}'

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub 'claude-code-pub-rt-${OrgName}-${Environment}'

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: '0.0.0.0/0'
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # =========================================================================
  # Security groups
  # =========================================================================
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W5
            reason: "Outbound open required for ALB health checks and AWS API calls"
          - id: W9
            reason: "Ingress restricted to RFC 1918 and Amazon corporate ranges — not open to 0.0.0.0/0"
          - id: W33
            reason: "Ingress restricted to RFC 1918 and Amazon corporate ranges"
          - id: W40
            reason: "Egress open required for ALB to reach ECS tasks and AWS APIs"
    Properties:
      GroupDescription: ALB for OTEL collector - corporate network and VPN only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        # RFC 1918 ranges — covers office networks and some VPN configs
        - IpProtocol: tcp
          FromPort: 4318
          ToPort: 4318
          CidrIp: '10.0.0.0/8'
          Description: OTLP HTTP - corporate/VPN (10.x)
        - IpProtocol: tcp
          FromPort: 4318
          ToPort: 4318
          CidrIp: '172.16.0.0/12'
          Description: OTLP HTTP - corporate/VPN (172.16-31.x)
        - IpProtocol: tcp
          FromPort: 4318
          ToPort: 4318
          CidrIp: '192.168.0.0/16'
          Description: OTLP HTTP - corporate/VPN (192.168.x)
        # Amazon corporate VPN range (11.x.x.x)
        - IpProtocol: tcp
          FromPort: 4318
          ToPort: 4318
          CidrIp: '11.0.0.0/8'
          Description: OTLP HTTP - Amazon corporate VPN (11.x)
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: '10.0.0.0/8'
          Description: HTTPS - corporate/VPN (10.x)
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: '172.16.0.0/12'
          Description: HTTPS - corporate/VPN (172.16-31.x)
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: '192.168.0.0/16'
          Description: HTTPS - corporate/VPN (192.168.x)
        # Amazon corporate VPN range (11.x.x.x)
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: '11.0.0.0/8'
          Description: HTTPS - Amazon corporate VPN (11.x)
        # Amazon VPN NAT egress ranges
        - IpProtocol: tcp
          FromPort: 4318
          ToPort: 4318
          CidrIp: '52.94.0.0/16'
          Description: OTLP HTTP - Amazon VPN NAT (52.94.x)
        - IpProtocol: tcp
          FromPort: 4318
          ToPort: 4318
          CidrIp: '54.240.0.0/16'
          Description: OTLP HTTP - Amazon VPN NAT (54.240.x)
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: '52.94.0.0/16'
          Description: HTTPS - Amazon VPN NAT (52.94.x)
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: '54.240.0.0/16'
          Description: HTTPS - Amazon VPN NAT (54.240.x)
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: '0.0.0.0/0'
          Description: Allow all outbound traffic
      Tags:
        - Key: Name
          Value: !Sub 'claude-code-alb-sg-${OrgName}-${Environment}'

  EcsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W5
            reason: "Outbound open required for ECS Fargate to pull images and call AWS APIs"
          - id: W40
            reason: "Egress open required for ECS Fargate to pull images and call AWS APIs"
    Properties:
      GroupDescription: ECS Fargate tasks for OTEL collector
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 4318
          ToPort: 4318
          SourceSecurityGroupId: !Ref AlbSecurityGroup
          Description: OTLP HTTP from ALB
        - IpProtocol: tcp
          FromPort: 13133
          ToPort: 13133
          SourceSecurityGroupId: !Ref AlbSecurityGroup
          Description: Health check from ALB
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: '0.0.0.0/0'
          Description: Allow all outbound traffic
      Tags:
        - Key: Name
          Value: !Sub 'claude-code-ecs-sg-${OrgName}-${Environment}'

  # =========================================================================
  # VPC Flow Logs
  # =========================================================================
  # checkov:skip=CKV_AWS_158:Sample uses default encryption — production deployments should add KMS
  VpcFlowLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W84
            reason: "Sample uses default encryption — production deployments should add KMS"
          - id: W28
            reason: "Explicit name required for deploy.sh cross-stack references"
    Properties:
      LogGroupName: !Sub '/aws/vpc/flowlogs/claude-code-${OrgName}-${Environment}'
      RetentionInDays: 90

  VpcFlowLogRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: "Explicit name required for deploy.sh cross-stack references"
    Properties:
      RoleName: !Sub 'claude-code-vpc-flowlog-${OrgName}-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: vpc-flow-logs.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: flowlog-cloudwatch
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                Resource: !GetAtt VpcFlowLogGroup.Arn

  VpcFlowLog:
    Type: AWS::EC2::FlowLog
    Properties:
      ResourceId: !Ref Vpc
      ResourceType: VPC
      TrafficType: ALL
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Ref VpcFlowLogGroup
      DeliverLogsPermissionArn: !GetAtt VpcFlowLogRole.Arn
      Tags:
        - Key: Name
          Value: !Sub 'claude-code-vpc-flowlog-${OrgName}-${Environment}'

Outputs:
  VpcId:
    Value: !Ref Vpc
    Export:
      Name: !Sub '${AWS::StackName}-VpcId'
  PublicSubnet1Id:
    Value: !Ref PublicSubnet1
    Export:
      Name: !Sub '${AWS::StackName}-PublicSubnet1Id'
  PublicSubnet2Id:
    Value: !Ref PublicSubnet2
    Export:
      Name: !Sub '${AWS::StackName}-PublicSubnet2Id'
  AlbSecurityGroupId:
    Value: !Ref AlbSecurityGroup
    Export:
      Name: !Sub '${AWS::StackName}-AlbSecurityGroupId'
  EcsSecurityGroupId:
    Value: !Ref EcsSecurityGroup
    Export:
      Name: !Sub '${AWS::StackName}-EcsSecurityGroupId'