AWSTemplateFormatVersion: "2010-09-09"

Description: Demonstrate using the Fn::ForEach function to create multiple buckets and outputs for each one

Transform: AWS::LanguageExtensions

Resources:
  Fn::ForEach::Buckets:
    - Identifier
    - - A
      - B
      - C
    - S3Bucket${Identifier}:
        Type: AWS::S3::Bucket
        Properties:
          BucketEncryption:
            ServerSideEncryptionConfiguration:
              - ServerSideEncryptionByDefault:
                  SSEAlgorithm: AES256
          PublicAccessBlockConfiguration:
            BlockPublicAcls: true
            BlockPublicPolicy: true
            IgnorePublicAcls: true
            RestrictPublicBuckets: true
        DeletionPolicy: Retain
        UpdateReplacePolicy: Retain

  Fn::ForEach::BucketPolicies:
    - Identifier
    - - A
      - B
      - C
    - S3BucketPolicy${Identifier}:
        Type: AWS::S3::BucketPolicy
        Properties:
          Bucket: !Ref S3Bucket${Identifier}
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Principal: "*"
                Action: "s3:GetObject"
                Resource: !Sub "arn:aws:s3:::S3Bucket${Identifier}/*"

Outputs:
  Fn::ForEach::BucketOutputs:
    - Identifier
    - - A
      - B
      - C
    - Fn::ForEach::GetAttLoop:
        - Property
        - - Arn
        - S3Bucket${Identifier}${Property}:
            Value: !GetAtt
              - !Sub S3Bucket${Identifier}
              - !Ref Property