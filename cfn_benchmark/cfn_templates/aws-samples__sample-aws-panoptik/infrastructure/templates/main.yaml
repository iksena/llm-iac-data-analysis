AWSTemplateFormatVersion: "2010-09-09"
Description: "Panoptik — Parent stack orchestrating all nested stacks"

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
  VpcCidr:
    Type: String
    Default: "10.0.0.0/16"
  TemplatesBucket:
    Type: String
    Description: "S3 bucket containing nested stack templates"

Resources:
  # Network (VPC, subnets, SGs, flow logs)
  NetworkStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "https://${TemplatesBucket}.s3.amazonaws.com/templates/network.yaml"
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        VpcCidr: !Ref VpcCidr
      Tags:
        - Key: Name
          Value: !Sub "panoptik-${EnvironmentName}-network"

  # Storage (Redis, DynamoDB)
  StorageStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: NetworkStack
    Properties:
      TemplateURL: !Sub "https://${TemplatesBucket}.s3.amazonaws.com/templates/storage.yaml"
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        PrivateSubnetA: !GetAtt NetworkStack.Outputs.PrivateSubnetA
        PrivateSubnetB: !GetAtt NetworkStack.Outputs.PrivateSubnetB
        RedisSecurityGroupId: !GetAtt NetworkStack.Outputs.RedisSecurityGroupId
      Tags:
        - Key: Name
          Value: !Sub "panoptik-${EnvironmentName}-storage"

  # Auth (Cognito) — no VPC dependency, deploy in parallel with storage
  AuthStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "https://${TemplatesBucket}.s3.amazonaws.com/templates/auth.yaml"
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        CallbackUrls: "http://localhost:5173/auth/callback"
        LogoutUrls: "http://localhost:5173/login"
      Tags:
        - Key: Name
          Value: !Sub "panoptik-${EnvironmentName}-auth"

  # Compute (ECS, ALB, ECR) — needs network + storage + auth outputs
  ComputeStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - NetworkStack
      - StorageStack
      - AuthStack
    Properties:
      TemplateURL: !Sub "https://${TemplatesBucket}.s3.amazonaws.com/templates/compute.yaml"
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        VpcId: !GetAtt NetworkStack.Outputs.VpcId
        PublicSubnetA: !GetAtt NetworkStack.Outputs.PublicSubnetA
        PublicSubnetB: !GetAtt NetworkStack.Outputs.PublicSubnetB
        PrivateSubnetA: !GetAtt NetworkStack.Outputs.PrivateSubnetA
        PrivateSubnetB: !GetAtt NetworkStack.Outputs.PrivateSubnetB
        ALBSecurityGroupId: !GetAtt NetworkStack.Outputs.ALBSecurityGroupId
        ECSSecurityGroupId: !GetAtt NetworkStack.Outputs.ECSSecurityGroupId
        RedisEndpoint: !GetAtt StorageStack.Outputs.RedisEndpoint
        CognitoUserPoolId: !GetAtt AuthStack.Outputs.UserPoolId
        CognitoAppClientId: !GetAtt AuthStack.Outputs.AppClientId
        CorsOrigins: "*"
      Tags:
        - Key: Name
          Value: !Sub "panoptik-${EnvironmentName}-compute"

  # Frontend Hosting (S3 + CloudFront) — needs ALB DNS
  FrontendStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: ComputeStack
    Properties:
      TemplateURL: !Sub "https://${TemplatesBucket}.s3.amazonaws.com/templates/frontend-hosting.yaml"
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        ALBDnsName: !GetAtt ComputeStack.Outputs.ALBDnsName
        AccessLogsBucketName: !GetAtt ComputeStack.Outputs.AccessLogsBucketName
        AccessLogsBucketDomainName: !GetAtt ComputeStack.Outputs.AccessLogsBucketDomainName
      Tags:
        - Key: Name
          Value: !Sub "panoptik-${EnvironmentName}-frontend"

  # WAF (CloudFront scope, must be us-east-1)
  WAFStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "https://${TemplatesBucket}.s3.amazonaws.com/templates/waf.yaml"
      Parameters:
        EnvironmentName: !Ref EnvironmentName
      Tags:
        - Key: Name
          Value: !Sub "panoptik-${EnvironmentName}-waf"

Outputs:
  VpcId:
    Value: !GetAtt NetworkStack.Outputs.VpcId
  ALBDnsName:
    Value: !GetAtt ComputeStack.Outputs.ALBDnsName
  ECRRepositoryUri:
    Value: !GetAtt ComputeStack.Outputs.ECRRepositoryUri
  ClusterName:
    Value: !GetAtt ComputeStack.Outputs.ClusterName
  ServiceName:
    Value: !GetAtt ComputeStack.Outputs.ServiceName
  RedisEndpoint:
    Value: !GetAtt StorageStack.Outputs.RedisEndpoint
  FrontendBucket:
    Value: !GetAtt FrontendStack.Outputs.BucketName
  CloudFrontDistributionId:
    Value: !GetAtt FrontendStack.Outputs.DistributionId
  CloudFrontDomain:
    Value: !GetAtt FrontendStack.Outputs.DistributionDomainName
  CloudFrontUrl:
    Value: !GetAtt FrontendStack.Outputs.CloudFrontUrl
  UserPoolId:
    Value: !GetAtt AuthStack.Outputs.UserPoolId
  AppClientId:
    Value: !GetAtt AuthStack.Outputs.AppClientId
  CognitoDomain:
    Value: !GetAtt AuthStack.Outputs.CognitoDomain
  WAFWebACLArn:
    Value: !GetAtt WAFStack.Outputs.WebACLArn