AWSTemplateFormatVersion: "2010-09-09"
Description:  >-
    Last Modified: 2025/10/28 14:55:45
    "RADx OpenSearch stack"

Parameters:
    Environment:
        Type: String
        Description: The Project Environment
        AllowedValues:
          - dev
          - test
          - prod
          - shared
    ProjectName:
        Type: String
        Description: The Project name
        Default: radx
        AllowedValues:
          - radx
    PublicAccessEnabled:
      Type: String
      Description: Enable public (internet) endpoint instead of VPC access
      Default: "true"
      AllowedValues:
        - "true"
        - "false"
    AllowedIpCidrs:
      Type: CommaDelimitedList
      Description: CIDR blocks allowed to access the domain when PublicAccessEnabled=true
      Default: "0.0.0.0/0"
    OpenSearchUsername:
        Type: String
        Description: Master user for OpenSearch internal user database
        MinLength: 3
        MaxLength: 64
        AllowedPattern: "[a-zA-Z0-9_+=.@-]+"
      # Provided via parameters-{ENV}.json
    OpenSearchPassword:
        Type: String
        Description: Master password (use a strong value; rotate via stack update)
        NoEcho: true
        MinLength: 8
        MaxLength: 128
      # Provided via parameters-{ENV}.json

Conditions:
    DEV: !Equals [!Ref Environment, dev]
    TEST: !Equals [!Ref Environment, test]
    PROD: !Equals [!Ref Environment, prod]
    NOTDEV: !Not [!Equals [!Ref Environment, dev]]
    NOTPROD: !Not [!Equals [!Ref Environment, prod]]
    PUBLIC_ACCESS: !Equals [!Ref PublicAccessEnabled, "true"]

Resources:
    # NOTE: It is required that you uncomment and create this service linked role on the first run for any new AWS Account
    # OpenSearchServiceLinkedRole:
    #     Type: AWS::IAM::ServiceLinkedRole
    #     Properties:
    #         AWSServiceName: opensearchservice.amazonaws.com
    #         Description: "Service-linked role for Amazon OpenSearch Service VPC access"

    OpenSearchServiceDomain:
        Type: "AWS::OpenSearchService::Domain"
        Properties:
            DomainName: !Sub "${ProjectName}-opensearch-${Environment}"
            EngineVersion: "OpenSearch_2.11"
            ClusterConfig:
                ColdStorageOptions:
                    Enabled: false
                DedicatedMasterCount: 3
                DedicatedMasterEnabled: true
                DedicatedMasterType: "m7g.medium.search"
                InstanceCount: 2
                InstanceType: "m7g.medium.search"
                ZoneAwarenessEnabled: true
                ZoneAwarenessConfig:
                    AvailabilityZoneCount: 2
                WarmEnabled: false
            AccessPolicies: !If
                - PUBLIC_ACCESS
                -
                  Version: "2012-10-17"
                  Statement:
                    - Sid: "AllowFromIpRanges"
                      Effect: "Allow"
                      Principal: "*"
                      Action: "es:*"
                      Resource: !Sub "arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/${ProjectName}-opensearch-${Environment}/*"
                      Condition:
                        IpAddress:
                          aws:SourceIp: !Ref AllowedIpCidrs
                -
                  Version: "2012-10-17"
                  Statement:
                    - Effect: "Allow"
                      Principal:
                        AWS: "*"
                      Action: "es:*"
                      Resource: !Sub "arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/${ProjectName}-opensearch-${Environment}/*"
            VPCOptions: !If
                - PUBLIC_ACCESS
                - !Ref AWS::NoValue
                -
                  SubnetIds:
                    - Fn::ImportValue: !Sub "RADx-Networking-${Environment}-Private-Subnet-AZ1"
                    - Fn::ImportValue: !Sub "RADx-Networking-${Environment}-Private-Subnet-AZ2"
                  SecurityGroupIds:
                    - Fn::ImportValue: !Sub "RADx-Networking-${Environment}-ECS-Host-SecurityGroup"
            EncryptionAtRestOptions:
                Enabled: true
                # KmsKeyId: !Sub "arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/3edad626-9282-4afe-9f69-0c763ac7bd7d" ## MAY NEED TO FIX THIS, LIKELY NOT NEEDED
            NodeToNodeEncryptionOptions:
                Enabled: true
            AdvancedOptions:
                indices.fielddata.cache.size: "20"
                # override_main_response_version: "true"
                indices.query.bool.max_clause_count: "1024"
                rest.action.multi.allow_explicit_index: "true"
            EBSOptions:
                EBSEnabled: true
                VolumeType: "gp3"
                VolumeSize: 100
                Iops: 3000
                Throughput: 125
            CognitoOptions:
                Enabled: false
            LogPublishingOptions:
                ES_APPLICATION_LOGS:
                    CloudWatchLogsLogGroupArn: !GetAtt OpenSearchApplicationLogsGroup.Arn
                    Enabled: true
                AUDIT_LOGS:
                    CloudWatchLogsLogGroupArn: !GetAtt OpenSearchAuditLogsGroup.Arn
                    Enabled: true
            DomainEndpointOptions:
                EnforceHTTPS: true
                TLSSecurityPolicy: "Policy-Min-TLS-1-2-2019-07"
                CustomEndpointEnabled: false
            AdvancedSecurityOptions:
                Enabled: true
                InternalUserDatabaseEnabled: true
                AnonymousAuthEnabled: false
                MasterUserOptions:
                    MasterUserName: !Ref OpenSearchUsername
                    MasterUserPassword: !Ref OpenSearchPassword
            Tags:
              -
                Key: "Environment"
                Value: !Sub "${Environment}"

    OpenSearchApplicationLogsGroup:
        Type: AWS::Logs::LogGroup
        Properties:
            LogGroupName: !Sub "${ProjectName}-OpenSearch-${Environment}/application-logs"
            RetentionInDays: 30

    OpenSearchAuditLogsGroup:
        Type: AWS::Logs::LogGroup
        Properties:
            LogGroupName: !Sub "${ProjectName}-OpenSearch-${Environment}/audit-logs"
            RetentionInDays: 30

    OpenSearchLogsResourcePolicy:
        Type: AWS::Logs::ResourcePolicy
        Properties:
            PolicyName: !Sub "${ProjectName}-opensearch-logs-policy-${Environment}"
            PolicyDocument: !Sub |
              {
                "Version": "2012-10-17",
                "Statement": [
                  {
                    "Sid": "AllowOpenSearchServiceLogging",
                    "Effect": "Allow",
                    "Principal": {
                      "Service": "es.amazonaws.com"
                    },
                    "Action": [
                      "logs:CreateLogStream",
                      "logs:PutLogEvents"
                    ],
                    "Resource": [
                      "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:${ProjectName}-OpenSearch-${Environment}/application-logs:*",
                      "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:${ProjectName}-OpenSearch-${Environment}/audit-logs:*"
                    ]
                  }
                ]
              }

