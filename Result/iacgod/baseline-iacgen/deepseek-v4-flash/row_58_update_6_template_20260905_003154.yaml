AWSTemplateFormatVersion: '2010-09-09'
Description: CloudFormation template to create Glue databases and tables for property graph and RDF data (idempotent database creation)
Parameters:
  DataBucketName:
    Type: String
    Default: my-glue-data-bucket
    Description: S3 bucket name for Glue table data locations
Resources:
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: GlueDatabaseManagement
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - glue:CreateDatabase
                  - glue:GetDatabase
                  - glue:DeleteDatabase
                Resource: '*'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
  DatabaseCreatorFunction:
    Type: AWS::Lambda::Function
    DependsOn: LambdaExecutionRole
    Properties:
      Runtime: python3.14
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      Code:
        ZipFile: |
          import json
          import boto3
          import cfnresponse
          from botocore.exceptions import ClientError
          import logging
          logger = logging.getLogger()
          logger.setLevel(logging.INFO)
          glue = boto3.client('glue')
          def lambda_handler(event, context):
              logger.info("Received event: " + json.dumps(event))
              request_type = event['RequestType']
              props = event['ResourceProperties']
              database_name = props['DatabaseName']
              try:
                  if request_type == 'Create':
                      try:
                          glue.get_database(Name=database_name)
                          logger.info("Database already exists: " + database_name)
                      except ClientError as e:
                          if e.response['Error']['Code'] == 'EntityNotFoundException':
                              logger.info("Creating database: " + database_name)
                              glue.create_database(
                                  DatabaseInput={'Name': database_name, 'Description': props.get('Description', '')}
                              )
                          else:
                              raise e
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {'DatabaseName': database_name})
                  elif request_type == 'Update':
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {'DatabaseName': database_name})
                  elif request_type == 'Delete':
                      try:
                          glue.delete_database(Name=database_name)
                      except ClientError as e:
                          if e.response['Error']['Code'] != 'EntityNotFoundException':
                              raise e
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
              except Exception as e:
                  logger.error("Error: " + str(e))
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': str(e)})
  GraphDatabase:
    Type: Custom::GlueDatabase
    DependsOn: DatabaseCreatorFunction
    Properties:
      ServiceToken: !GetAtt DatabaseCreatorFunction.Arn
      DatabaseName: graph-database
      Description: Database for property graph tables
  RDFDatabase:
    Type: Custom::GlueDatabase
    DependsOn: DatabaseCreatorFunction
    Properties:
      ServiceToken: !GetAtt DatabaseCreatorFunction.Arn
      DatabaseName: graph-database-rdf
      Description: Database for RDF tables
  AirportTable:
    Type: AWS::Glue::Table
    DependsOn: GraphDatabase
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: graph-database
      TableInput:
        Name: airport
        Description: Airport vertex table
        TableType: EXTERNAL_TABLE
        Parameters:
          graphLabel: vertex
        StorageDescriptor:
          Location: !Sub s3://${DataBucketName}/airport/
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.serde2.lazy.LazySimpleSerDe
            Parameters:
              field.delim: ','
          Columns:
            - Name: code
              Type: string
            - Name: name
              Type: string
            - Name: city
              Type: string
            - Name: country
              Type: string
            - Name: lat
              Type: double
            - Name: lon
              Type: double
            - Name: elev
              Type: int
  CountryTable:
    Type: AWS::Glue::Table
    DependsOn: GraphDatabase
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: graph-database
      TableInput:
        Name: country
        Description: Country vertex table
        TableType: EXTERNAL_TABLE
        Parameters:
          graphLabel: vertex
        StorageDescriptor:
          Location: !Sub s3://${DataBucketName}/country/
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.serde2.lazy.LazySimpleSerDe
            Parameters:
              field.delim: ','
          Columns:
            - Name: code
              Type: string
            - Name: name
              Type: string
            - Name: continent
              Type: string
  ContinentTable:
    Type: AWS::Glue::Table
    DependsOn: GraphDatabase
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: graph-database
      TableInput:
        Name: continent
        Description: Continent vertex table
        TableType: EXTERNAL_TABLE
        Parameters:
          graphLabel: vertex
        StorageDescriptor:
          Location: !Sub s3://${DataBucketName}/continent/
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.serde2.lazy.LazySimpleSerDe
            Parameters:
              field.delim: ','
          Columns:
            - Name: code
              Type: string
            - Name: name
              Type: string
  RouteTable:
    Type: AWS::Glue::Table
    DependsOn: GraphDatabase
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: graph-database
      TableInput:
        Name: route
        Description: Route edge table
        TableType: EXTERNAL_TABLE
        Parameters:
          graphLabel: edge
          gremlinQuery: g.V().hasLabel('route').limit(10).project('source','dest').by('source_airport').by('dest_airport')
        StorageDescriptor:
          Location: !Sub s3://${DataBucketName}/route/
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.serde2.lazy.LazySimpleSerDe
            Parameters:
              field.delim: ','
          Columns:
            - Name: airline
              Type: string
            - Name: airline_id
              Type: int
            - Name: source_airport
              Type: string
            - Name: source_airport_id
              Type: int
            - Name: dest_airport
              Type: string
            - Name: dest_airport_id
              Type: int
            - Name: codeshare
              Type: string
            - Name: stops
              Type: int
            - Name: equipment
              Type: string
  CustomAirportTable:
    Type: AWS::Glue::Table
    DependsOn: GraphDatabase
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: graph-database
      TableInput:
        Name: customairport
        Description: Custom airport view table
        TableType: EXTERNAL_TABLE
        Parameters:
          graphLabel: view
        StorageDescriptor:
          Location: !Sub s3://${DataBucketName}/customairport/
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.serde2.lazy.LazySimpleSerDe
            Parameters:
              field.delim: ','
          Columns:
            - Name: code
              Type: string
            - Name: name
              Type: string
            - Name: city
              Type: string
            - Name: country
              Type: string
            - Name: lat
              Type: double
            - Name: lon
              Type: double
            - Name: elev
              Type: int
  AirportRdfTable:
    Type: AWS::Glue::Table
    DependsOn: RDFDatabase
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: graph-database-rdf
      TableInput:
        Name: airport_rdf
        Description: RDF airport table with class mode
        TableType: EXTERNAL_TABLE
        Parameters:
          classuri: 'class:Airport'
          querymode: class
          rdf-type: 'true'
          stripPrefixes: 'true'
          classNamespace: 'http://example.org/air-routes/class/'
          datatypePropertyNamespace: 'http://example.org/air-routes/datatypeProperty/'
          objectPropertyNamespace: 'http://example.org/air-routes/objectProperty/'
        StorageDescriptor:
          Location: !Sub s3://${DataBucketName}/airport_rdf/
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.serde2.lazy.LazySimpleSerDe
            Parameters:
              field.delim: ','
          Columns:
            - Name: code
              Type: string
            - Name: name
              Type: string
            - Name: city
              Type: string
            - Name: country
              Type: string
            - Name: lat
              Type: double
            - Name: lon
              Type: double
            - Name: elev
              Type: int
  RouteRdfTable:
    Type: AWS::Glue::Table
    DependsOn: RDFDatabase
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: graph-database-rdf
      TableInput:
        Name: route_rdf
        Description: RDF route table with SPARQL query using prefixes
        TableType: EXTERNAL_TABLE
        Parameters:
          querymode: sparql
          rdf-type: 'true'
          stripPrefixes: 'true'
          classNamespace: 'http://example.org/air-routes/class/'
          datatypePropertyNamespace: 'http://example.org/air-routes/datatypeProperty/'
          objectPropertyNamespace: 'http://example.org/air-routes/objectProperty/'
          sparqlQuery: 'PREFIX class: <http://example.org/air-routes/class/> PREFIX dt: <http://example.org/air-routes/datatypeProperty/> PREFIX op: <http://example.org/air-routes/objectProperty/> SELECT ?incode ?outcode WHERE { ?route op:hasSource ?source ; op:hasDest ?dest ; dt:distance ?dist . FILTER(?dist > 1000) }'
        StorageDescriptor:
          Location: !Sub s3://${DataBucketName}/route_rdf/
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.serde2.lazy.LazySimpleSerDe
            Parameters:
              field.delim: ','
          Columns:
            - Name: incode
              Type: string
            - Name: outcode
              Type: string
            - Name: dist
              Type: int
  RouteRdfNopfxTable:
    Type: AWS::Glue::Table
    DependsOn: RDFDatabase
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: graph-database-rdf
      TableInput:
        Name: route_rdf_nopfx
        Description: RDF route table with SPARQL query embedding URIs directly
        TableType: EXTERNAL_TABLE
        Parameters:
          querymode: sparql
          rdf-type: 'true'
          stripPrefixes: 'true'
          classNamespace: 'http://example.org/air-routes/class/'
          datatypePropertyNamespace: 'http://example.org/air-routes/datatypeProperty/'
          objectPropertyNamespace: 'http://example.org/air-routes/objectProperty/'
          sparqlQuery: 'SELECT ?incode ?outcode WHERE { ?route <http://example.org/air-routes/objectProperty/hasSource> ?source ; <http://example.org/air-routes/objectProperty/hasDest> ?dest ; <http://example.org/air-routes/datatypeProperty/distance> ?dist . FILTER(?dist > 1000) }'
        StorageDescriptor:
          Location: !Sub s3://${DataBucketName}/route_rdf_nopfx/
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.serde2.lazy.LazySimpleSerDe
            Parameters:
              field.delim: ','
          Columns:
            - Name: incode
              Type: string
            - Name: outcode
              Type: string
            - Name: dist
              Type: int
Outputs:
  GraphDatabaseName:
    Description: Name of the property graph database
    Value: graph-database
  RDFDatabaseName:
    Description: Name of the RDF database
    Value: graph-database-rdf
  AirportTableName:
    Description: Name of the airport table
    Value: !Ref AirportTable
  CountryTableName:
    Description: Name of the country table
    Value: !Ref CountryTable
  ContinentTableName:
    Description: Name of the continent table
    Value: !Ref ContinentTable
  RouteTableName:
    Description: Name of the route table
    Value: !Ref RouteTable
  CustomAirportTableName:
    Description: Name of the customairport table
    Value: !Ref CustomAirportTable
  AirportRdfTableName:
    Description: Name of the airport_rdf table
    Value: !Ref AirportRdfTable
  RouteRdfTableName:
    Description: Name of the route_rdf table
    Value: !Ref RouteRdfTable
  RouteRdfNopfxTableName:
    Description: Name of the route_rdf_nopfx table
    Value: !Ref RouteRdfNopfxTable