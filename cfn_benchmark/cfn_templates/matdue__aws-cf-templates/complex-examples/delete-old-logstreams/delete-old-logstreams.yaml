Outputs:
  Name:
    Description: 'Name'
    Value: !Ref LambdaFunction
    Export:
      Name: !Sub '${AWS::StackName}-Name'
  Arn:
    Description: 'Arn'
    Value: !GetAtt LambdaFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-Arn'