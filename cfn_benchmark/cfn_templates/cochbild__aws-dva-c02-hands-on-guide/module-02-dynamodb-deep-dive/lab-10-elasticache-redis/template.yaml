AWSTemplateFormatVersion: '2010-09-09'
Description: |
  DVA-C02 Lab 2.10 — ElastiCache Redis cache.t3.micro single node in default VPC.
  Lambda in same VPC connects via redis-py and demonstrates the four caching strategies.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>

Resources:
  CacheSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      CacheSubnetGroupName: dva-lab-02-10-subnet-group
      Description: DVA Lab 2.10 ElastiCache subnet group
      SubnetIds: !Ref SubnetIds

  CacheSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: dva-lab-02-10-cache-sg
      GroupDescription: ElastiCache Redis security group
      VpcId: !Ref VpcId

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: dva-lab-02-10-lambda-sg
      GroupDescription: Lambda security group
      VpcId: !Ref VpcId

  CacheIngressFromLambda:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref CacheSecurityGroup
      IpProtocol: tcp
      FromPort: 6379
      ToPort: 6379
      SourceSecurityGroupId: !Ref LambdaSecurityGroup

  CacheCluster:
    Type: AWS::ElastiCache::CacheCluster
    Properties:
      ClusterName: dva-lab-02-10-redis
      Engine: redis
      EngineVersion: '7.0'
      CacheNodeType: cache.t3.micro
      NumCacheNodes: 1
      CacheSubnetGroupName: !Ref CacheSubnetGroup
      VpcSecurityGroupIds:
        - !GetAtt CacheSecurityGroup.GroupId

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole

  CacheDemoFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: dva-lab-02-10-cache-demo
      Runtime: python3.12
      Handler: handler.handler
      Role: !GetAtt LambdaRole.Arn
      Code: ./src
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          REDIS_HOST: !GetAtt CacheCluster.RedisEndpoint.Address
          REDIS_PORT: !GetAtt CacheCluster.RedisEndpoint.Port
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds: !Ref SubnetIds

Outputs:
  FunctionName:
    Value: !Ref CacheDemoFunction
  RedisEndpoint:
    Value: !GetAtt CacheCluster.RedisEndpoint.Address
  RedisPort:
    Value: !GetAtt CacheCluster.RedisEndpoint.Port