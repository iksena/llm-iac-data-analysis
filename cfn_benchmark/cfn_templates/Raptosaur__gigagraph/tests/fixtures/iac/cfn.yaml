AWSTemplateFormatVersion: '2010-09-09'
Description: Raw CloudFormation with HTTP API v2, REST API, and AppSync.

Resources:
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: items-http
      ProtocolType: HTTP

  ItemsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /items/{itemId}
      Target: !Join ['/', ['integrations', !Ref ItemsIntegration]]

  ItemsIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ItemsFunction.Arn}/invocations

  ItemsFunction:
    Type: AWS::Lambda::Function
    Metadata:
      aws:asset.path: src/handlers
    Properties:
      Handler: items.handler
      Runtime: nodejs20.x
      Code:
        S3Bucket: some-bucket
        S3Key: items.zip

  ExternalRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: POST /external
      Target: !Join ['/', ['integrations', !Ref ExternalIntegration]]

  ExternalIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ExternalFunction.Arn}/invocations

  ExternalFunction:
    Type: AWS::Lambda::Function
    Properties:
      Handler: external.handler
      Runtime: nodejs20.x
      Code:
        S3Bucket: some-bucket
        S3Key: external.zip

  RestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: users-rest

  UsersResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: users

  UserIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !Ref UsersResource
      PathPart: '{userId}'

  DeleteUserMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref UserIdResource
      HttpMethod: DELETE
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ItemsFunction.Arn}/invocations

  GraphApi:
    Type: AWS::AppSync::GraphQLApi
    Properties:
      Name: graph-api
      AuthenticationType: API_KEY

  LambdaDS:
    Type: AWS::AppSync::DataSource
    Properties:
      ApiId: !GetAtt GraphApi.ApiId
      Name: LambdaDS
      Type: AWS_LAMBDA
      LambdaConfig:
        LambdaFunctionArn: !GetAtt ItemsFunction.Arn

  GetUserResolver:
    Type: AWS::AppSync::Resolver
    Properties:
      ApiId: !GetAtt GraphApi.ApiId
      TypeName: Query
      FieldName: getUser
      DataSourceName: !GetAtt LambdaDS.Name