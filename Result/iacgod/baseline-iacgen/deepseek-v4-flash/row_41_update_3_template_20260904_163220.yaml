AWSTemplateFormatVersion: "2010-09-09"
Parameters:
  ProjectName:
    Type: String
    Default: ambassador
  Environment:
    Type: String
    Default: lab
  Author:
    Type: String
    Default: rdevera@tenable.com
  Version:
    Type: String
    Default: v1
Resources:
  IAMGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: !Sub "${ProjectName}-${Environment}-group"
  IAMPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ProjectName}-${Environment}-readonly-policy"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Resource: "*"
          - Effect: Allow
            Action: s3:Get*
            Resource: "*"
      Groups:
        - !Ref IAMGroup
  OHcnappUser001:
    Type: AWS::IAM::User
    Properties:
      UserName: OHcnappUser001
      Tags:
        - Key: ProjectName
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Author
          Value: !Ref Author
        - Key: Version
          Value: !Ref Version
  OHcnappUser002:
    Type: AWS::IAM::User
    Properties:
      UserName: OHcnappUser002
