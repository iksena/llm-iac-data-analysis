AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Last Modified: 2025/10/14 16:52:06
  "This template deploys the NIH RADx Data Hub S3 Buckets. Bucket names must be globally unique. Please modify the bucket names to ensure uniqueness."
Parameters:
  Environment:
    Type: String
    Description: The Project Environment
    AllowedValues:
      - dev
      - test
      - prod
      - shared
  ProjectName:
    Type: String
    Description: The Project name
    Default: radx
    AllowedValues:
      - radx

Conditions:
  DEV: !Equals [!Ref Environment, dev]
  TEST: !Equals [!Ref Environment, test]
  PROD: !Equals [!Ref Environment, prod]
  NOTDEV: !Not [!Equals [!Ref Environment, dev]]
  NOTPROD: !Not [!Equals [!Ref Environment, prod]]

Resources:
  ## Required by application
  S3BucketRadxUploadPortal:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete ## CHANGE THIS FOR PRODUCTION
    Properties:
      BucketName: !Sub "radx-upload-portal-${Environment}" ## PLEASE MODIFY to ensure global uniqueness according to our organization's needs
      OwnershipControls:
        Rules:
        - ObjectOwnership: "BucketOwnerEnforced"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - BucketKeyEnabled: true
          ServerSideEncryptionByDefault:
            SSEAlgorithm: "AES256"

  ## Required by application
  S3BucketCovidRadxIngestPdf:
    Type: "AWS::S3::Bucket"
    DeletionPolicy: Delete ## CHANGE THIS
    Properties:
      PublicAccessBlockConfiguration:
        RestrictPublicBuckets: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        BlockPublicAcls: true
      BucketName: !Sub "covid-radx-ingest-pdf-${Environment}" ## PLEASE MODIFY to ensure global uniqueness according to our organization's needs
      VersioningConfiguration:
        Status: "Enabled"
      OwnershipControls:
        Rules:
        - ObjectOwnership: "BucketOwnerEnforced"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - BucketKeyEnabled: true
          ServerSideEncryptionByDefault:
            SSEAlgorithm: "AES256"

  ## Required by Macie scanning for posting scan results
  S3BucketRadxMacieResults:
    Type: "AWS::S3::Bucket"
    DeletionPolicy: Delete ## CHANGE THIS
    Properties:
      PublicAccessBlockConfiguration:
        RestrictPublicBuckets: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        BlockPublicAcls: true
      BucketName: !Sub "radx-macie-results-${Environment}" ## PLEASE MODIFY to ensure global uniqueness according to our organization's needs
      VersioningConfiguration:
        Status: "Enabled"
      OwnershipControls:
        Rules:
        - ObjectOwnership: "BucketOwnerEnforced"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - BucketKeyEnabled: true
          ServerSideEncryptionByDefault:
            SSEAlgorithm: "AES256"

  ## Bucket Policy for Macie Results Bucket
  S3BucketPolicyRadxMacieResults:
    Type: "AWS::S3::BucketPolicy"
    DeletionPolicy: Delete ## CHANGE THIS FOR PRODUCTION
    Properties:
      Bucket:
        Ref: "S3BucketRadxMacieResults"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
        - Condition:
            Bool:
              aws:SecureTransport: "false"
          Resource: !GetAtt S3BucketRadxMacieResults.Arn
          Action: "s3:*"
          Effect: "Deny"
          Principal: "*"

        #  Options for denying non-HTTPS access
        # Sid: "Deny non-HTTPS access"
        # - Condition:
        #     StringNotEquals:
        #       s3:x-amz-server-side-encryption-aws-kms-key-id: !Sub "arn:aws:kms:us-west-2:${AWS::AccountId}:key/f0ff72d0-a780-46b2-a12f-5c363410368b" ##FIXME - Parameterize KMS Key ARN
        #   Resource: !Sub "arn:aws:s3:::${ProjectName}-macie-results-${Environment}/*"
        #   Action: "s3:PutObject"
        #   Effect: "Deny"
        #   Principal:
        #     Service: "macie.amazonaws.com"
        #   Sid: "Deny incorrect encryption header. This is optional"
        - Condition:
            StringNotEquals:
              s3:x-amz-server-side-encryption: "aws:kms"
          Resource: !Join
          - ""
          -
            - !GetAtt S3BucketRadxMacieResults.Arn
            - "/*"
          Action: "s3:PutObject"
          Effect: "Deny"
          Principal:
            Service: "macie.amazonaws.com"
          # Sid: "Deny unencrypted object uploads. This is optional"
        # - Condition:
        #     StringEquals:
        #       aws:SourceAccount: !Sub "${AWS::AccountId}"
        #     ArnLike:
        #       aws:SourceArn:
        #       - !Sub "arn:aws:macie2:us-west-2:${AWS::AccountId}:export-configuration:*"
        #       - !Sub "arn:aws:macie2:us-west-2:${AWS::AccountId}:classification-job/*"
        #   Resource: !Sub "arn:aws:s3:::${ProjectName}-macie-results-${Environment}/*"
        #   Action: "s3:PutObject"
        #   Effect: "Allow"
        #   Principal:
        #     Service: "macie.amazonaws.com"
          # Sid: "Allow Macie to upload objects to the bucket"
        # - Condition:
        #     StringEquals:
        #       aws:SourceAccount: !Sub "${AWS::AccountId}"
        #     ArnLike:
        #       aws:SourceArn:
        #       - !Sub "arn:aws:macie2:us-west-2:${AWS::AccountId}:export-configuration:*"
        #       - !Sub "arn:aws:macie2:us-west-2:${AWS::AccountId}:classification-job/*"
        #   Resource: !Sub "arn:aws:s3:::${ProjectName}-macie-results-${Environment}"
        #   Action: "s3:GetBucketLocation"
        #   Effect: "Allow"
        #   Principal:
        #     Service: "macie.amazonaws.com"
        #   Sid: "Allow Macie to use the getBucketLocation operation"

  ## Required by SFTP server for user home directories
  S3BucketSftpRadx:
    Type: "AWS::S3::Bucket"
    DeletionPolicy: Delete ## CHANGE THIS FOR PRODUCTION
    Properties:
      PublicAccessBlockConfiguration:
        RestrictPublicBuckets: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        BlockPublicAcls: true
      BucketName: !Sub "sftp-radx-${Environment}" ## PLEASE MODIFY to ensure global uniqueness according to our organization's needs
      OwnershipControls:
        Rules:
        - ObjectOwnership: "BucketOwnerEnforced"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - BucketKeyEnabled: false
          ServerSideEncryptionByDefault:
            SSEAlgorithm: "AES256"
      ## Using EventBridge instead of S3 Events
      # NotificationConfiguration:
      #   QueueConfigurations: []
      #   LambdaConfigurations: []
      #   EventBridgeConfiguration:
      #     EventBridgeEnabled: true
      #   TopicConfigurations:
      #   - Topic: !Sub "arn:aws:sns:us-east-1:${AWS::AccountId}:SFTP-Object-Upload-Topic-${Environment}" ##FIXME - Parameterize SNS Topic ARN
      #     Filter:
      #       S3Key:
      #         Rules:
      #         - Value: "test/"
      #           Name: "Prefix"
      #     Event: "s3:ObjectCreated:*"
      #   - Topic: !Sub "arn:aws:sns:us-east-1:${AWS::AccountId}:SFTP-Object-Upload-Topic-${Environment}" ##FIXME - Parameterize SNS Topic ARN
      #     Filter:
      #       S3Key:
      #         Rules:
      #         - Value: "prod/"
      #           Name: "Prefix"
      #         - Value: ""
      #           Name: "Suffix"
      #     Event: "s3:ObjectCreated:*"
      # VersioningConfiguration:
      #   Status: "Enabled"
      Tags:
      - Value: "SFTP"
        Key: "Name"

  ## Required by Submission for in-review files for PII processing
  S3BucketCovidRadxReview:
    Type: "AWS::S3::Bucket"
    DeletionPolicy: Delete ## CHANGE THIS FOR PRODUCTION
    Properties:
      PublicAccessBlockConfiguration:
        RestrictPublicBuckets: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        BlockPublicAcls: true
      BucketName: !Sub "covid-radx-review-${Environment}" ## PLEASE MODIFY to ensure global uniqueness according to our organization's needs
      VersioningConfiguration:
        Status: "Enabled"
      OwnershipControls:
        Rules:
        - ObjectOwnership: "BucketOwnerEnforced"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - BucketKeyEnabled: true
          ServerSideEncryptionByDefault:
            SSEAlgorithm: "AES256"
      # LoggingConfiguration:
      #   TargetObjectKeyFormat:
      #     PartitionedPrefix:
      #       PartitionDateSource: "EventTime"
      #   DestinationBucketName: "covid-radx-s3-access-logging" ##FIXME - Parameterize Access Log Bucket Name
      #   LogFilePrefix: ""

