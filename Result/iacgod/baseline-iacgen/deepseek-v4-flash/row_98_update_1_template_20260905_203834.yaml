AWSTemplateFormatVersion: "2010-09-09"
Resources:
  QueueEncryptionKey:
    Type: AWS::KMS::Key
    Properties:
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          - Sid: Allow SQS to use key
            Effect: Allow
            Principal:
              Service: sqs.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey
            Resource: "*"
      Description: KMS key for SQS queue encryption
      Enabled: true
      KeyUsage: ENCRYPT_DECRYPT
      KeySpec: SYMMETRIC_DEFAULT
  FIFOQueueNoDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: TestFifoQueueNoDLQ.fifo
      FifoQueue: true
      ContentBasedDeduplication: false
      KmsMasterKeyId: !GetAtt QueueEncryptionKey.Arn
  FIFOQueueWithDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: TestFifoQueueWithDLQ.fifo
      FifoQueue: true
      ContentBasedDeduplication: false
      KmsMasterKeyId: !GetAtt QueueEncryptionKey.Arn
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt FIFODLQ.Arn
        maxReceiveCount: 3
  FIFODLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: TestFifoDLQ.fifo
      FifoQueue: true
      ContentBasedDeduplication: false
      KmsMasterKeyId: !GetAtt QueueEncryptionKey.Arn
  StandardQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: TestStandardQueue
      KmsMasterKeyId: !GetAtt QueueEncryptionKey.Arn
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt StandardDLQ.Arn
        maxReceiveCount: 5
  StandardDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: TestStandardDLQ
      KmsMasterKeyId: !GetAtt QueueEncryptionKey.Arn
  SeparateFifoDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: TestSeparateFifoDLQ.fifo
      FifoQueue: true
      ContentBasedDeduplication: false
      KmsMasterKeyId: !GetAtt QueueEncryptionKey.Arn
  StandardQueueNumberOfMessagesSentAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: StandardQueueNumberOfMessagesSent
      AlarmDescription: Alarm when number of messages sent on standard queue >= 1
      ActionsEnabled: false
      AlarmActions: []
      OKActions: []
      InsufficientDataActions: []
      MetricName: NumberOfMessagesSent
      Namespace: AWS/SQS
      Statistic: Sum
      Dimensions:
        - Name: QueueName
          Value: !GetAtt StandardQueue.QueueName
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: breaching
  FIFOQueueWithDLQAverageNumberOfMessagesSentAnomalyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: FIFOQueueWithDLQAverageNumberOfMessagesSentAnomaly
      AlarmDescription: Anomaly detection alarm on average number of messages sent on FIFO queue with DLQ
      ActionsEnabled: false
      AlarmActions: []
      OKActions: []
      InsufficientDataActions: []
      Metrics:
        - Id: m1
          MetricStat:
            Metric:
              Namespace: AWS/SQS
              MetricName: NumberOfMessagesSent
              Dimensions:
                - Name: QueueName
                  Value: !GetAtt FIFOQueueWithDLQ.QueueName
            Period: 300
            Stat: Average
        - Id: ad1
          Expression: ANOMALY_DETECTION_BAND(m1, 2)
          Label: AnomalyDetectionBand
          ReturnData: true
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      ThresholdMetricId: ad1
      ComparisonOperator: LessThanLowerOrGreaterThanUpperThreshold
      TreatMissingData: missing
  StandardQueueSentMessageSizeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: StandardQueueSentMessageSize
      AlarmDescription: Alarm when maximum sent message size on standard queue exceeds 183500 bytes
      ActionsEnabled: false
      AlarmActions: []
      OKActions: []
      InsufficientDataActions: []
      MetricName: SentMessageSize
      Namespace: AWS/SQS
      Statistic: Maximum
      Dimensions:
        - Name: QueueName
          Value: !GetAtt StandardQueue.QueueName
      Period: 300
      EvaluationPeriods: 1
      Threshold: 183500
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: missing
  SeparateFifoQueueSentMessageSizeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: SeparateFifoQueueSentMessageSize
      AlarmDescription: Alarm when maximum sent message size on separate FIFO queue exceeds 183500 bytes
      ActionsEnabled: false
      AlarmActions: []
      OKActions: []
      InsufficientDataActions: []
      MetricName: SentMessageSize
      Namespace: AWS/SQS
      Statistic: Maximum
      Dimensions:
        - Name: QueueName
          Value: !GetAtt SeparateFifoDLQ.QueueName
      Period: 300
      EvaluationPeriods: 1
      Threshold: 183500
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: missing
  StandardDLQVisibleMessagesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: StandardDLQVisibleMessages
      AlarmDescription: Alarm when visible messages on standard DLQ > 0
      ActionsEnabled: false
      AlarmActions: []
      OKActions: []
      InsufficientDataActions: []
      MetricName: ApproximateNumberOfMessagesVisible
      Namespace: AWS/SQS
      Statistic: Sum
      Dimensions:
        - Name: QueueName
          Value: !GetAtt StandardDLQ.QueueName
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: missing
  SeparateFifoDLQVisibleMessagesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: SeparateFifoDLQVisibleMessages
      AlarmDescription: Alarm when visible messages on separate FIFO DLQ > 0
      ActionsEnabled: false
      AlarmActions: []
      OKActions: []
      InsufficientDataActions: []
      MetricName: ApproximateNumberOfMessagesVisible
      Namespace: AWS/SQS
      Statistic: Sum
      Dimensions:
        - Name: QueueName
          Value: !GetAtt SeparateFifoDLQ.QueueName
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: missing
  StandardQueueOldestMessageAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: StandardQueueOldestMessageAge
      AlarmDescription: Alarm when oldest message age on standard queue exceeds 15 seconds
      ActionsEnabled: false
      AlarmActions: []
      OKActions: []
      InsufficientDataActions: []
      MetricName: ApproximateAgeOfOldestMessage
      Namespace: AWS/SQS
      Statistic: Maximum
      Dimensions:
        - Name: QueueName
          Value: !GetAtt StandardQueue.QueueName
      Period: 300
      EvaluationPeriods: 1
      Threshold: 15
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
  SeparateFifoQueueOldestMessageAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: SeparateFifoQueueOldestMessageAge
      AlarmDescription: Alarm when oldest message age on separate FIFO queue exceeds 15 seconds
      ActionsEnabled: false
      AlarmActions: []
      OKActions: []
      InsufficientDataActions: []
      MetricName: ApproximateAgeOfOldestMessage
      Namespace: AWS/SQS
      Statistic: Maximum
      Dimensions:
        - Name: QueueName
          Value: !GetAtt SeparateFifoDLQ.QueueName
      Period: 300
      EvaluationPeriods: 1
      Threshold: 15
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
  StandardQueueNotVisibleMessagesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: StandardQueueNotVisibleMessages
      AlarmDescription: Alarm when maximum not visible messages on standard queue exceeds 108000
      ActionsEnabled: false
      AlarmActions: []
      OKActions: []
      InsufficientDataActions: []
      MetricName: ApproximateNumberOfMessagesNotVisible
      Namespace: AWS/SQS
      Statistic: Maximum
      Dimensions:
        - Name: QueueName
          Value: !GetAtt StandardQueue.QueueName
      Period: 300
      EvaluationPeriods: 1
      Threshold: 108000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: missing
  SeparateFifoQueueNotVisibleMessagesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: SeparateFifoQueueNotVisibleMessages
      AlarmDescription: Alarm when maximum not visible messages on separate FIFO queue exceeds 18000
      ActionsEnabled: false
      AlarmActions: []
      OKActions: []
      InsufficientDataActions: []
      MetricName: ApproximateNumberOfMessagesNotVisible
      Namespace: AWS/SQS
      Statistic: Maximum
      Dimensions:
        - Name: QueueName
          Value: !GetAtt SeparateFifoDLQ.QueueName
      Period: 300
      EvaluationPeriods: 1
      Threshold: 18000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: missing
  StandardDLQOldestMessageAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: StandardDLQOldestMessageAge
      AlarmDescription: Alarm when oldest message age on standard DLQ exceeds 90 seconds
      ActionsEnabled: false
      AlarmActions: []
      OKActions: []
      InsufficientDataActions: []
      MetricName: ApproximateAgeOfOldestMessage
      Namespace: AWS/SQS
      Statistic: Maximum
      Dimensions:
        - Name: QueueName
          Value: !GetAtt StandardDLQ.QueueName
      Period: 300
      EvaluationPeriods: 1
      Threshold: 90
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: missing
  SyntheticAlwaysOKAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: SyntheticAlwaysOK
      AlarmDescription: Synthetic alarm that is always OK
      ActionsEnabled: false
      AlarmActions: []
      OKActions: []
      InsufficientDataActions: []
      Metrics:
        - Id: m1
          Expression: "0"
          Label: AlwaysZero
          ReturnData: true
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching