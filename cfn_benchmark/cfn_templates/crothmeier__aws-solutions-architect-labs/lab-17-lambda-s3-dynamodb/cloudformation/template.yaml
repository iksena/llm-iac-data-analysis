AWSTemplateFormatVersion: '2010-09-09'
Description: 'Lab 17: Lambda with S3 Event Triggers and DynamoDB - Event-driven file processing'

Parameters:
  EnvironmentName:
    Description: Environment name prefix for resources
    Type: String
    Default: Lab17

  LambdaRuntime:
    Description: Lambda runtime version
    Type: String
    Default: python3.11
    AllowedValues:
      - python3.11
      - python3.10
      - python3.9

  ReservedConcurrentExecutions:
    Description: Reserved concurrent executions for Lambda
    Type: Number
    Default: 100
    MinValue: 0
    MaxValue: 1000

  MaximumRetryAttempts:
    Description: Maximum retry attempts for failed invocations
    Type: Number
    Default: 2
    MinValue: 0
    MaxValue: 2

Resources:
  # S3 Upload Bucket
  UploadBucket:
    Type: AWS::S3::Bucket
    DependsOn: ProcessUploadPermission
    Properties:
      BucketName: !Sub ${EnvironmentName}-upload-${AWS::AccountId}
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 30
          - Id: MoveToIA
            Status: Enabled
            Transitions:
              - TransitionInDays: 30
                StorageClass: STANDARD_IA
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt ProcessUploadFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-Upload-Bucket
        - Key: Lab
          Value: Lab17

  # S3 Processed Bucket
  ProcessedBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${EnvironmentName}-processed-${AWS::AccountId}
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ArchiveOldFiles
            Status: Enabled
            Transitions:
              - TransitionInDays: 90
                StorageClass: GLACIER
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-Processed-Bucket
        - Key: Lab
          Value: Lab17

  # DynamoDB Table
  FileMetadataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${EnvironmentName}-FileMetadata
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: fileId
          AttributeType: S
        - AttributeName: uploadTimestamp
          AttributeType: S
        - AttributeName: fileType
          AttributeType: S
      KeySchema:
        - AttributeName: fileId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: TimestampIndex
          KeySchema:
            - AttributeName: uploadTimestamp
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: FileTypeIndex
          KeySchema:
            - AttributeName: fileType
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-FileMetadata-Table
        - Key: Lab
          Value: Lab17

  # Dead Letter Queue (SQS)
  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${EnvironmentName}-DLQ
      MessageRetentionPeriod: 1209600  # 14 days
      VisibilityTimeout: 300
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-DLQ
        - Key: Lab
          Value: Lab17

  # SNS Topic for Error Alerts
  ErrorAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${EnvironmentName}-Error-Alerts
      DisplayName: File Processing Error Alerts
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-Error-SNS
        - Key: Lab
          Value: Lab17

  # Lambda Execution Role
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${EnvironmentName}-Lambda-Execution-Role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                Resource:
                  - !Sub ${UploadBucket.Arn}/*
                  - !Sub ${ProcessedBucket.Arn}/*
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  - !GetAtt UploadBucket.Arn
                  - !GetAtt ProcessedBucket.Arn
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt FileMetadataTable.Arn
                  - !Sub ${FileMetadataTable.Arn}/index/*
        - PolicyName: SQSAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt DeadLetterQueue.Arn
        - PolicyName: SNSAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref ErrorAlertTopic
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-Lambda-Role
        - Key: Lab
          Value: Lab17

  # Lambda Function - Process Upload
  ProcessUploadFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${EnvironmentName}-ProcessUpload
      Runtime: !Ref LambdaRuntime
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 300
      MemorySize: 512
      ReservedConcurrentExecutions: !Ref ReservedConcurrentExecutions
      Environment:
        Variables:
          METADATA_TABLE: !Ref FileMetadataTable
          PROCESSED_BUCKET: !Ref ProcessedBucket
          ERROR_TOPIC_ARN: !Ref ErrorAlertTopic
          ENVIRONMENT: !Ref EnvironmentName
      DeadLetterConfig:
        TargetArn: !GetAtt DeadLetterQueue.Arn
      Code:
        ZipFile: |
          import json
          import boto3
          import os
          from datetime import datetime
          import hashlib
          from urllib.parse import unquote_plus

          s3 = boto3.client('s3')
          dynamodb = boto3.resource('dynamodb')
          sns = boto3.client('sns')
          table = dynamodb.Table(os.environ['METADATA_TABLE'])

          def lambda_handler(event, context):
              print(f"Event: {json.dumps(event)}")

              try:
                  for record in event['Records']:
                      bucket = record['s3']['bucket']['name']
                      key = unquote_plus(record['s3']['object']['key'])
                      size = record['s3']['object']['size']
                      etag = record['s3']['object'].get('eTag', '')

                      print(f"Processing: s3://{bucket}/{key}")

                      # Get object metadata
                      try:
                          response = s3.head_object(Bucket=bucket, Key=key)
                          content_type = response.get('ContentType', 'unknown')
                      except Exception as e:
                          print(f"Error getting object metadata: {str(e)}")
                          content_type = 'unknown'

                      # Determine file type
                      file_type = key.split('.')[-1] if '.' in key else 'unknown'

                      # Generate file ID
                      file_id = hashlib.md5(f"{bucket}{key}{etag}".encode()).hexdigest()

                      # Store metadata in DynamoDB
                      timestamp = datetime.utcnow().isoformat()
                      item = {
                          'fileId': file_id,
                          'bucket': bucket,
                          'key': key,
                          'size': size,
                          'fileType': file_type,
                          'contentType': content_type,
                          'etag': etag,
                          'uploadTimestamp': timestamp,
                          'processedTimestamp': timestamp,
                          'status': 'processed'
                      }

                      table.put_item(Item=item)
                      print(f"Stored metadata for file: {file_id}")

                      # Optional: Copy to processed bucket
                      processed_key = f"processed/{timestamp}/{key.split('/')[-1]}"
                      s3.copy_object(
                          CopySource={'Bucket': bucket, 'Key': key},
                          Bucket=os.environ['PROCESSED_BUCKET'],
                          Key=processed_key
                      )
                      print(f"Copied to processed bucket: {processed_key}")

                  return {
                      'statusCode': 200,
                      'body': json.dumps('Processing complete')
                  }

              except Exception as e:
                  error_msg = f"Error processing S3 event: {str(e)}"
                  print(error_msg)

                  # Send error notification
                  try:
                      sns.publish(
                          TopicArn=os.environ['ERROR_TOPIC_ARN'],
                          Subject='Lambda Processing Error',
                          Message=error_msg
                      )
                  except Exception as sns_error:
                      print(f"Error sending SNS notification: {str(sns_error)}")

                  raise e
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-ProcessUpload-Function
        - Key: Lab
          Value: Lab17

  # Lambda Permission for S3
  ProcessUploadPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProcessUploadFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub arn:aws:s3:::${EnvironmentName}-upload-${AWS::AccountId}

  # Lambda Function - Process DLQ
  ProcessDLQFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${EnvironmentName}-ProcessDLQ
      Runtime: !Ref LambdaRuntime
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          ERROR_TOPIC_ARN: !Ref ErrorAlertTopic
      Code:
        ZipFile: |
          import json
          import boto3
          import os

          sns = boto3.client('sns')

          def lambda_handler(event, context):
              print(f"Processing DLQ message: {json.dumps(event)}")

              for record in event['Records']:
                  body = json.loads(record['body'])

                  # Send detailed error notification
                  message = f"""
                  Failed Lambda Execution Detected

                  Error Details:
                  {json.dumps(body, indent=2)}

                  Please investigate the issue.
                  """

                  sns.publish(
                      TopicArn=os.environ['ERROR_TOPIC_ARN'],
                      Subject='DLQ Message - Failed Processing',
                      Message=message
                  )

              return {
                  'statusCode': 200,
                  'body': json.dumps('DLQ processed')
              }
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-ProcessDLQ-Function
        - Key: Lab
          Value: Lab17

  # Event Source Mapping for DLQ
  DLQEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref ProcessDLQFunction
      EventSourceArn: !GetAtt DeadLetterQueue.Arn
      BatchSize: 10
      Enabled: true

  # CloudWatch Log Groups
  ProcessUploadLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ProcessUploadFunction}
      RetentionInDays: 7

  ProcessDLQLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ProcessDLQFunction}
      RetentionInDays: 7

Outputs:
  UploadBucketName:
    Description: Upload S3 bucket name
    Value: !Ref UploadBucket
    Export:
      Name: !Sub ${EnvironmentName}-Upload-Bucket

  ProcessedBucketName:
    Description: Processed S3 bucket name
    Value: !Ref ProcessedBucket
    Export:
      Name: !Sub ${EnvironmentName}-Processed-Bucket

  TableName:
    Description: DynamoDB table name
    Value: !Ref FileMetadataTable
    Export:
      Name: !Sub ${EnvironmentName}-Table

  ProcessUploadFunctionArn:
    Description: Process upload Lambda function ARN
    Value: !GetAtt ProcessUploadFunction.Arn
    Export:
      Name: !Sub ${EnvironmentName}-ProcessUpload-ARN

  DLQUrl:
    Description: Dead Letter Queue URL
    Value: !Ref DeadLetterQueue
    Export:
      Name: !Sub ${EnvironmentName}-DLQ-URL

  DLQArn:
    Description: Dead Letter Queue ARN
    Value: !GetAtt DeadLetterQueue.Arn
    Export:
      Name: !Sub ${EnvironmentName}-DLQ-ARN

  ErrorTopicArn:
    Description: Error alert SNS topic ARN
    Value: !Ref ErrorAlertTopic
    Export:
      Name: !Sub ${EnvironmentName}-Error-Topic-ARN

  TestUploadCommand:
    Description: Command to test file upload
    Value: !Sub |
      echo '{"test":"data"}' > test.json && aws s3 cp test.json s3://${UploadBucket}/uploads/test.json