AWSTemplateFormatVersion: "2010-09-09"
Description: >
  VKP AWS_003 ECR. One ECR repository per VKP service/portal image (16 total). Scan-on-push,
  keep-last-10 lifecycle (caps storage cost), and EmptyOnDelete so the Destroy workflow can
  delete the stack even when images are present.

Resources:
  EcrVkpCompanyService:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: vkp-company-service
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          { "rules": [ { "rulePriority": 1, "description": "keep last 10",
            "selection": { "tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 10 },
            "action": { "type": "expire" } } ] }
  EcrVkpUserService:
    Type: AWS::ECR::Repository
    Properties:
