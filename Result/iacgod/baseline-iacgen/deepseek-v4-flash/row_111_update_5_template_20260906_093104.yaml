AWSTemplateFormatVersion: 2010-09-09
Parameters:
  kmsKeyArn:
    Type: String
    Description: ARN of existing KMS key for data encryption
    Default: arn:aws:kms:us-east-1:123456789012:key/12345678-1234-1234-1234-123456789012
  targetAccountId:
    Type: String
    Description: Target AWS Account ID for DMS VPC role AssumeRole
    Default: "123456789012"
Resources:
  DmsKinesisRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dm-dms-kinesis-role
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: dms.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DmsKinesisPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - kinesis:PutRecord
                  - kinesis:PutRecords
                Resource: !Sub arn:aws:kinesis:${AWS::Region}:${AWS::AccountId}:stream/*
      Tags:
        - Key: Project
          Value: DataMaster
        - Key: Component
          Value: Roles
  EventBridgePipesToFirehoseRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dm-eventbridge-pipes-firehose-role
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: pipes.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: EventBridgePipesToFirehosePolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - firehose:PutRecord
                  - firehose:PutRecordBatch
                Resource: !Sub arn:aws:firehose:${AWS::Region}:${AWS::AccountId}:deliverystream/*
      Tags:
        - Key: Project
          Value: DataMaster
        - Key: Component
          Value: Roles
  LambdaProcessingRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dm-lambda-processing-role
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaProcessingPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:Encrypt
                Resource: !Ref kmsKeyArn
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*
      Tags:
        - Key: Project
          Value: DataMaster
        - Key: Component
          Value: Roles
  FirehoseAccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dm-firehose-access-role
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: firehose.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: FirehoseAccessPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:Encrypt
                Resource: !Ref kmsKeyArn
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub arn:aws:s3:::dm-*-${AWS::AccountId}/*
      Tags:
        - Key: Project
          Value: DataMaster
        - Key: Component
          Value: Roles
  ProcessingControllerFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dm-processing-controller-function-role
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ProcessingControllerPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:Encrypt
                Resource: !Ref kmsKeyArn
              - Effect: Allow
                Action:
                  - states:StartExecution
                  - states:DescribeExecution
                Resource: !Sub arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:dm-*
      Tags:
        - Key: Project
          Value: DataMaster
        - Key: Component
          Value: Roles
  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dm-worker-role
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WorkerPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:Encrypt
                Resource: !Ref kmsKeyArn
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*
      Tags:
        - Key: Project
          Value: DataMaster
        - Key: Component
          Value: Roles
  GlueCrawlerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dm-glue-crawler-role
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: GlueCrawlerPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource: !Sub arn:aws:s3:::dm-*-${AWS::AccountId}/*
      Tags:
        - Key: Project
          Value: DataMaster
        - Key: Component
          Value: Roles
  GlueEtlRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dm-glue-etl-role
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: GlueEtlPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub arn:aws:s3:::dm-*-${AWS::AccountId}/*
      Tags:
        - Key: Project
          Value: DataMaster
        - Key: Component
          Value: Roles
  LakeFormationDataLakeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dm-lake-formation-role
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lakeformation.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSLakeFormationDataAccessServiceRolePolicy
      Tags:
        - Key: Project
          Value: DataMaster
        - Key: Component
          Value: Roles
  StepFunctionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dm-step-functions-role
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StepFunctionsPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                  - ecs:RunTask
                  - glue:StartJobRun
                  - emr-serverless:StartJobRun
                Resource: "*"
      Tags:
        - Key: Project
          Value: DataMaster
        - Key: Component
          Value: Roles
  EcsFargateTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dm-ecs-fargate-task-role
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: EcsFargatePolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*
      Tags:
        - Key: Project
          Value: DataMaster
        - Key: Component
          Value: Roles
  EmrServerlessJobRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dm-emr-serverless-role
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: emr-serverless.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSElementalMediaStoreServiceRolePolicy
      Policies:
        - PolicyName: EmrServerlessPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub arn:aws:s3:::dm-*-${AWS::AccountId}/*
      Tags:
        - Key: Project
          Value: DataMaster
        - Key: Component
          Value: Roles
  GrafanaMonitoringRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dm-grafana-monitoring-role
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: grafana.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonGrafanaRedshiftAccess
      Tags:
        - Key: Project
          Value: DataMaster
        - Key: Component
          Value: Roles
  DmsVpcRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: dm-dms-vpc-role
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${targetAccountId}:root
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref AWS::AccountId
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSDMSVPCManagementRole
      Tags:
        - Key: Project
          Value: DataMaster
        - Key: Component
          Value: Roles
Outputs:
  DmsKinesisRoleArn:
    Value: !GetAtt DmsKinesisRole.Arn
    Export:
      Name: !Sub dm-${AWS::StackName}-dms-kinesis-role-arn
  EventBridgePipesToFirehoseRoleArn:
    Value: !GetAtt EventBridgePipesToFirehoseRole.Arn
    Export:
      Name: !Sub dm-${AWS::StackName}-eventbridge-pipes-firehose-role-arn
  LambdaProcessingRoleArn:
    Value: !GetAtt LambdaProcessingRole.Arn
    Export:
      Name: !Sub dm-${AWS::StackName}-lambda-processing-role-arn
  FirehoseAccessRoleArn:
    Value: !GetAtt FirehoseAccessRole.Arn
    Export:
      Name: !Sub dm-${AWS::StackName}-firehose-access-role-arn
  ProcessingControllerFunctionRoleArn:
    Value: !GetAtt ProcessingControllerFunctionRole.Arn
    Export:
      Name: !Sub dm-${AWS::StackName}-processing-controller-function-role-arn
  WorkerRoleArn:
    Value: !GetAtt WorkerRole.Arn
    Export:
      Name: !Sub dm-${AWS::StackName}-worker-role-arn
  GlueCrawlerRoleArn:
    Value: !GetAtt GlueCrawlerRole.Arn
    Export:
      Name: !Sub dm-${AWS::StackName}-glue-crawler-role-arn
  GlueEtlRoleArn:
    Value: !GetAtt GlueEtlRole.Arn
    Export:
      Name: !Sub dm-${AWS::StackName}-glue-etl-role-arn
  LakeFormationDataLakeRoleArn:
    Value: !GetAtt LakeFormationDataLakeRole.Arn
    Export:
      Name: !Sub dm-${AWS::StackName}-lake-formation-role-arn
  StepFunctionsRoleArn:
    Value: !GetAtt StepFunctionsRole.Arn
    Export:
      Name: !Sub dm-${AWS::StackName}-step-functions-role-arn
  EcsFargateTaskRoleArn:
    Value: !GetAtt EcsFargateTaskRole.Arn
    Export:
      Name: !Sub dm-${AWS::StackName}-ecs-fargate-task-role-arn
  EmrServerlessJobRoleArn:
    Value: !GetAtt EmrServerlessJobRole.Arn
    Export:
      Name: !Sub dm-${AWS::StackName}-emr-serverless-role-arn
  GrafanaMonitoringRoleArn:
    Value: !GetAtt GrafanaMonitoringRole.Arn
    Export:
      Name: !Sub dm-${AWS::StackName}-grafana-monitoring-role-arn
  DmsVpcRoleArn:
    Value: !GetAtt DmsVpcRole.Arn
    Export:
      Name: !Sub dm-${AWS::StackName}-dms-vpc-role-arn