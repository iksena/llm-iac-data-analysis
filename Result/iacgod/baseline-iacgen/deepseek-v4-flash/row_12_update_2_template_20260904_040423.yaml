AWSTemplateFormatVersion: 2010-09-09
Description: Cost Management Stack - Monthly Budget with Encrypted SNS Notifications
Parameters:
  BudgetLimitAmount:
    Type: Number
    Default: 100
    Description: Monthly budget limit in USD
    MinValue: 1
    MaxValue: 100000
  NotificationProtocol:
    Type: String
    Default: sms
    AllowedValues:
      - sms
      - email
    Description: Notification delivery protocol (sms or email)
  NotificationEndpoint:
    Type: String
    Default: '+61400000000'
    Description: Endpoint for notifications (E.164 phone number for SMS, email address for email)
  BudgetName:
    Type: String
    Default: MonthlyBudget
    Description: Name for the budget
Resources:
  BillingKMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: KMS encryption key for billing alert SNS topic
      Enabled: true
      EnableKeyRotation: true
      KeyPolicy:
        Version: 2012-10-17
        Statement:
          - Sid: EnableRootAdminPermissions
            Effect: Allow
            Principal:
              AWS:
                !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'
          - Sid: AllowSNSServiceToUseKey
            Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: '*'
      KeySpec: SYMMETRIC_DEFAULT
      KeyUsage: ENCRYPT_DECRYPT
      Tags:
        - Key: Name
          Value: billing-topic-key
        - Key: Purpose
          Value: Billing Alert Encryption
  BillingKMSKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/billing-topic-key
      TargetKeyId:
        !Ref BillingKMSKey
  BillingSNSTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName:
        !Ref BudgetName
      KmsMasterKeyId:
        !Ref BillingKMSKey
      Tags:
        - Key: Name
          Value:
            !Ref BudgetName
        - Key: Purpose
          Value: Billing Cost Alerts
  SNSSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn:
        !Ref BillingSNSTopic
      Protocol:
        !Ref NotificationProtocol
      Endpoint:
        !Ref NotificationEndpoint
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName:
          !Ref BudgetName
        BudgetType: COST
        BudgetLimit:
          Amount:
            !Ref BudgetLimitAmount
          Unit: USD
        TimeUnit: MONTHLY
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address:
                !Ref BillingSNSTopic
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 99
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: SNS
              Address:
                !Ref BillingSNSTopic
Outputs:
  SNSNotificationTopicArn:
    Description: ARN of the SNS topic for billing alerts
    Value:
      !Ref BillingSNSTopic
  KMSKeyId:
    Description: ID of the KMS key used for SNS topic encryption
    Value:
      !Ref BillingKMSKey
  KMSKeyAlias:
    Description: Alias of the KMS key used for SNS topic encryption
    Value: alias/billing-topic-key
  BudgetName:
    Description: Name of the created monthly budget
    Value:
      !Ref BudgetName
  BudgetLimit:
    Description: Monthly budget limit in USD
    Value:
      !Ref BudgetLimitAmount
  NotificationMethod:
    Description: Notification delivery protocol configured
    Value:
      !Ref NotificationProtocol
  NotificationEndpoint:
    Description: Endpoint receiving budget alerts
    Value:
      !Ref NotificationEndpoint