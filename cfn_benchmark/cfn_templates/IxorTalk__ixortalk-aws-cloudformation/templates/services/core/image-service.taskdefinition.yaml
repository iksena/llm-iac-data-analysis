AWSTemplateFormatVersion: "2010-09-09"
Description: "Image Service - Storage for images."

Parameters:

    Environment:
       Description: The target environment (tst/stg/prd)
       Type: String
       Default: tst

    ProjectName:
       Type: String
       Default: demo

    SpringCloudConfigLabel:
       Description: The branch of the config environment to use
       Type: String

    LoadbalancerDNS:
        Type: String

    SpringProfilesActive:
        Type: String

    ImageServiceImageVersion:
        Type: String

    ImageServiceCustomImage:
      Description: A custom image to be used
      Type: String

Conditions:
    IsProd: !Or [!Equals ["prod", !Ref Environment], !Equals ["prd", !Ref Environment]]
    CustomImageProvided: !Not [ !Equals [ "", !Ref ImageServiceCustomImage ] ]

Resources:

    ImageS3Bucket:
        Type: AWS::S3::Bucket
        Properties:
            BucketName: !Sub ${ProjectName}-${Environment}-image-service
            Tags:
                - Key: "ixortalk:ass:s3:backup-and-empty-bucket-on-stop"
                  Value: !If [ IsProd, "no", "yes" ]
            PublicAccessBlockConfiguration:
                IgnorePublicAcls: true
                RestrictPublicBuckets: true

    TaskDefinition:
        Type: AWS::ECS::TaskDefinition
        Properties:
            Family: ixortalk-image-service
            TaskRoleArn: !ImportValue "ecs-infra:S3FullAccessServiceRoleArn"
            ContainerDefinitions:
                - Name: ixortalk-image-service
                  Image: !If [CustomImageProvided, !Ref ImageServiceCustomImage, !Sub "ixortalk/ixortalk-image-service:${ImageServiceImageVersion}"]
                  Memory: 640
                  Environment:
                  - Name: "SPRING_PROFILES_ACTIVE"
                    Value: !Ref SpringProfilesActive
                  - Name: "SPRING_CLOUD_CONFIG_URI"
                    Value: !Sub http://${LoadbalancerDNS}/config
                  - Name: "SPRING_CLOUD_CONFIG_LABEL"
                    Value: !Ref SpringCloudConfigLabel
                  - Name: "JAVA_OPTS"
                    Value: "-Xmx256m"
                  PortMappings:
                    - ContainerPort: 8006
                  LogConfiguration:
                    LogDriver: awslogs
                    Options:
                        awslogs-group: image-service-logs
                        awslogs-region: !Ref AWS::Region

    ImageServiceCloudWatchLogsGroup:
        Type: AWS::Logs::LogGroup
        Properties:
            LogGroupName: image-service-logs
            RetentionInDays: 365

Outputs:
    TaskDefinition:
        Value: !Ref TaskDefinition