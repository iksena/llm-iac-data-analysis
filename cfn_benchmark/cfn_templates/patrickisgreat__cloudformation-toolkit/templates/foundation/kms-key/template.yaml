AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  Customer-managed KMS key with automatic rotation, an alias, and a key policy
  composed from administrator, user, and AWS service principals.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Naming
        Parameters:
          - NamePrefix
          - Environment
          - AliasSuffix
      - Label:
          default: Key policy
        Parameters:
          - KeyAdminArn
          - KeyUserArn
          - ServicePrincipal
      - Label:
          default: Key behaviour
        Parameters:
          - MultiRegion
          - PendingWindowInDays

Parameters:
  NamePrefix:
    Type: String
    Description: Prefix for the key alias and description.
    AllowedPattern: "^[a-z][a-z0-9-]{1,30}[a-z0-9]$"
    ConstraintDescription: 3-32 lowercase characters, digits and hyphens.

  Environment:
    Type: String
    Description: Environment this key belongs to.
    Default: dev
    AllowedValues: [dev, staging, prod]

  AliasSuffix:
    Type: String
    Description: >-
      Suffix for the alias, which becomes alias/<NamePrefix>-<AliasSuffix>. Use
      it to distinguish keys within one component, e.g. "data" and "logs".
    Default: default
    AllowedPattern: "^[a-z0-9][a-z0-9-]{0,30}$"

  KeyAdminArn:
    Type: String
    Description: >-
      IAM principal ARN allowed to administer the key - schedule deletion, edit
      the policy, enable and disable it. Deliberately separate from the users:
      the point of a CMK is that the people who can read data and the people who
      can destroy the key are not the same set. Leave empty for account-root
      administration only.
    Default: ""

  KeyUserArn:
    Type: String
    Description: >-
      IAM principal ARN allowed to encrypt and decrypt with the key. This is the
      role your workload runs as. Leave empty to grant no direct usage and rely
      on IAM policies plus the account-root statement.
    Default: ""

  ServicePrincipal:
    Type: String
    Description: >-
      An AWS service principal allowed to use the key through a grant, e.g.
      "logs.amazonaws.com" for encrypted log groups or "s3.amazonaws.com" for
      SSE-KMS buckets. Leave empty for none.
    Default: ""

  MultiRegion:
    Type: String
    Description: >-
      Create a multi-region key. Only say yes if you know you will replicate it;
      it cannot be changed later, and a single-region key is cheaper to reason
      about.
    Default: "false"
    AllowedValues: ["true", "false"]

  PendingWindowInDays:
    Type: Number
    Description: >-
      Waiting period before a scheduled deletion completes. Anything encrypted
      with the key becomes permanently unreadable when it does, so this window is
      the only chance to notice the mistake.
    Default: 30
    MinValue: 7
    MaxValue: 30

Conditions:
  HasKeyAdmin: !Not [!Equals [!Ref KeyAdminArn, ""]]
  HasKeyUser: !Not [!Equals [!Ref KeyUserArn, ""]]
  HasServicePrincipal: !Not [!Equals [!Ref ServicePrincipal, ""]]

Resources:
  Key:
    Type: AWS::KMS::Key
    # A deleted KMS key makes every ciphertext encrypted under it permanently
    # unreadable. Retain is not conservatism here, it is the only safe default.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub "${NamePrefix}-${AliasSuffix} (${Environment})"
      Enabled: true
      # Annual rotation bounds the blast radius of a leaked key with no
      # application change: AWS keeps the old material to decrypt old ciphertext.
      EnableKeyRotation: true
      MultiRegion: !Ref MultiRegion
      PendingWindowInDays: !Ref PendingWindowInDays
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          # Without this statement the key is unmanageable: IAM policies cannot
          # grant access to a key whose policy does not delegate to the account.
          # Removing it is the classic way to permanently orphan a CMK.
          - Sid: EnableIAMPoliciesInThisAccount
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: kms:*
            Resource: "*"

          - !If
            - HasKeyAdmin
            - Sid: AllowKeyAdministration
              Effect: Allow
              Principal:
                AWS: !Ref KeyAdminArn
              Action:
                - kms:Create*
                - kms:Describe*
                - kms:Enable*
                - kms:List*
                - kms:Put*
                - kms:Update*
                - kms:Revoke*
                - kms:Disable*
                - kms:Get*
                - kms:Delete*
                - kms:TagResource
                - kms:UntagResource
                - kms:ScheduleKeyDeletion
                - kms:CancelKeyDeletion
              Resource: "*"
            - !Ref AWS::NoValue

          - !If
            - HasKeyUser
            - Sid: AllowUseOfTheKey
              Effect: Allow
              Principal:
                AWS: !Ref KeyUserArn
              Action:
                - kms:Encrypt
                - kms:Decrypt
                - kms:ReEncrypt*
                - kms:GenerateDataKey*
                - kms:DescribeKey
              Resource: "*"
            - !Ref AWS::NoValue

          - !If
            - HasServicePrincipal
            - Sid: AllowAwsServiceUse
              Effect: Allow
              Principal:
                Service: !Ref ServicePrincipal
              Action:
                - kms:Encrypt
                - kms:Decrypt
                - kms:ReEncrypt*
                - kms:GenerateDataKey*
                - kms:DescribeKey
              Resource: "*"
              Condition:
                StringEquals:
                  # Scope the service to this account so another account's
                  # log group cannot name your key and have AWS honour it.
                  aws:SourceAccount: !Ref AWS::AccountId
            - !Ref AWS::NoValue

  Alias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${NamePrefix}-${AliasSuffix}"
      TargetKeyId: !Ref Key

Outputs:
  KeyId:
    Description: Key ID, for properties that take an ID rather than an ARN.
    Value: !Ref Key

  KeyArn:
    Description: Key ARN, for KmsKeyId / KmsMasterKeyId properties and IAM policies.
    Value: !GetAtt Key.Arn

  AliasName:
    Description: Alias name (alias/...), which is stable across key replacement.
    Value: !Ref Alias