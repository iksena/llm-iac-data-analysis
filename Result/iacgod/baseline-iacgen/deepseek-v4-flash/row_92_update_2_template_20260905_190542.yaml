    Value:
      Fn::Sub: https://course-catalog-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com/oauth2/token
    Export:
      Name: CourseCatalogTokenEndpoint

  CourseCatalogOAuthScope:
