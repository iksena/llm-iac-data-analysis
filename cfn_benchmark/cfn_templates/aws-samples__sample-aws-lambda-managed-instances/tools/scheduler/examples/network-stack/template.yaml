AWSTemplateFormatVersion: '2010-09-09'
Description: >
  LMI Example - Network Stack (Infrastructure Team)
  Provisions VPC, subnets, and security group for LMI capacity providers.

Parameters:
  SubnetCount:
    Type: Number
    Default: 3
    MinValue: 1
    MaxValue: 3
    Description: Number of private subnets to create (1-3, each in a different AZ)
  EnvironmentName:
    Type: String
    Default: lmi-example

Conditions:
  Is1Subnet: !Equals [!Ref SubnetCount, 1]
  Is2Subnets: !Equals [!Ref SubnetCount, 2]
  Is3Subnets: !Equals [!Ref SubnetCount, 3]
  CreateSubnet2: !Or
    - !Condition Is2Subnets
    - !Condition Is3Subnets
  CreateSubnet3: !Condition Is3Subnets

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-vpc

  Subnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-subnet-1

  Subnet2:
    Type: AWS::EC2::Subnet
    Condition: CreateSubnet2
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-subnet-2

  Subnet3:
    Type: AWS::EC2::Subnet
    Condition: CreateSubnet3
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: !Select [2, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-subnet-3

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub ${EnvironmentName} - egress only
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${EnvironmentName}-sg

Outputs:
  VpcId:
    Description: VPC ID
    Value: !Ref Vpc
    Export:
      Name: !Sub ${EnvironmentName}-VpcId
  SubnetIds:
    Description: Comma-delimited list of subnet IDs
    Value: !If
      - Is3Subnets
      - !Sub "${Subnet1},${Subnet2},${Subnet3}"
      - !If
        - Is2Subnets
        - !Sub "${Subnet1},${Subnet2}"
        - !Ref Subnet1
    Export:
      Name: !Sub ${EnvironmentName}-SubnetIds
  SecurityGroupId:
    Description: Security group ID
    Value: !Ref SecurityGroup
    Export:
      Name: !Sub ${EnvironmentName}-SecurityGroupId
  SubnetCount:
    Description: Number of subnets created
    Value: !Ref SubnetCount