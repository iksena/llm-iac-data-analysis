AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: |
  DVA-C02 Lab 2.6 — Streams audit trail pattern.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    LoggingConfig:
      LogFormat: JSON

Resources:
  PostsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: dva-lab-02-06-posts
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: post_id
          AttributeType: S
      KeySchema:
        - AttributeName: post_id
          KeyType: HASH
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

  AuditTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: dva-lab-02-06-audit
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: audit_id
          AttributeType: S
      KeySchema:
        - AttributeName: audit_id
          KeyType: HASH

  AuditFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dva-lab-02-06-audit
      CodeUri: src/
      Handler: app.handler
      Environment:
        Variables:
          AUDIT_TABLE: !Ref AuditTable
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref AuditTable
      Events:
        DdbStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt PostsTable.StreamArn
            StartingPosition: TRIM_HORIZON
            BatchSize: 10
            MaximumBatchingWindowInSeconds: 5
            BisectBatchOnFunctionError: true
            FunctionResponseTypes:
              - ReportBatchItemFailures
            # Optional: filter to only INSERTs/MODIFYs (skip REMOVEs)
            # FilterCriteria:
            #   Filters:
            #     - Pattern: '{"eventName":["INSERT","MODIFY"]}'

Outputs:
  PostsTableName:
    Value: !Ref PostsTable
  AuditTableName:
    Value: !Ref AuditTable
  StreamArn:
    Value: !GetAtt PostsTable.StreamArn