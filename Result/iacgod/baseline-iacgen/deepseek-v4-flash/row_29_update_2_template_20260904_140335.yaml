AWSTemplateFormatVersion: "2010-09-09"
Description: "CloudFormation template to build a bastion AMI with MongoDB tools, Python/Synapse, .NET SDK, and SSM Agent using EC2 Image Builder"

Parameters:
  ImageVersion:
    Type: String
    Description: Version string for the resulting AMI
    AllowedPattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
    Default: "1.0.0"
  RootVolumeSize:
    Type: Number
    Description: Size in GB of the root EBS volume
    Default: 32
    MinValue: 8
    MaxValue: 1024
  OrganizationArn:
    Type: String
    Description: Full ARN of the AWS Organization to share the AMI with (e.g., arn:aws:organizations::123456789012:organization/o-xxxxxxxxxx)
    AllowedPattern: "^arn:aws:organizations::[0-9]{12}:organization/o-[a-z0-9]+$"
  VpcCidr:
    Type: String
    Description: CIDR block for the VPC
    Default: "10.0.0.0/16"
  PublicSubnetCidr:
    Type: String
    Description: CIDR block for the public subnet
    Default: "10.0.1.0/24"
  PrivateSubnetCidr:
    Type: String
    Description: CIDR block for the private subnet
    Default: "10.0.2.0/24"

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-vpc"

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-igw"

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnetCidr
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-subnet"

  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnetCidr
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-subnet"

  NatGatewayEIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-nat-eip"

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatGatewayEIP.AllocationId
      SubnetId: !Ref PublicSubnet
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-nat-gateway"

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public-rt"

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: "0.0.0.0/0"
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-rt"

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: "0.0.0.0/0"
      NatGatewayId: !Ref NatGateway

  PrivateSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet
      RouteTableId: !Ref PrivateRouteTable

  ImageBuilderSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Security group for Image Builder build instance"
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: "0.0.0.0/0"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-imagebuilder-sg"

  ImageBuilderInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/EC2InstanceProfileForImageBuilder
      Policies:
        - PolicyName: ImageBuilderInstanceS3Access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource: "*"
        - PolicyName: ImageBuilderInstanceMisc
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeTags
                Resource: "*"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-imagebuilder-instance-role"

  ImageBuilderInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref ImageBuilderInstanceRole

  ImageBuilderServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - imagebuilder.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/EC2ImageBuilderFullAccess
      Policies:
        - PolicyName: ImageBuilderServiceExtra
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:ModifyImageAttribute
                  - ec2:DescribeImageAttribute
                Resource: "*"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-imagebuilder-service-role"

  ImageBuilderComponent:
    Type: AWS::ImageBuilder::Component
    Properties:
      Name: !Sub "${AWS::StackName}-bastion-component"
      Platform: "Linux"
      Version: "1.0.0"
      Description: "Component to install SSM Agent, MongoDB 8.0 tools, Python Synapse client, and .NET SDK"
      ChangeDescription: "Initial component creation"
      Data: |
        name: BastionBuildComponent
        description: Installs SSM Agent, MongoDB 8.0 tools, Python/Synapse, .NET SDK
        schemaVersion: 1.0
        phases:
          - name: build
            steps:
              - name: InstallSSMAgent
                action: ExecuteBash
                inputs:
                  commands:
                    - echo "Updating SSM Agent to latest version"
                    - dnf update -y amazon-ssm-agent
              - name: InstallMongoDBTools
                action: ExecuteBash
                inputs:
                  commands:
                    - |
                      cat > /etc/yum.repos.d/mongodb-org-8.0.repo << 'EOF'
                      [mongodb-org-8.0]
                      name=MongoDB 8.0 Repository
                      baseurl=https://repo.mongodb.org/yum/amazon/2023/mongodb-org/8.0/$basearch/
                      gpgcheck=1
                      enabled=1
                      gpgkey=https://pgp.mongodb.com/server-8.0.asc
                      EOF
                    - dnf install -y mongodb-database-tools mongosh
              - name: InstallDotNetSDK
                action: ExecuteBash
                inputs:
                  commands:
                    - echo "Installing .NET SDK"
                    - dnf install -y dotnet-sdk-8.0
              - name: InstallPythonAndSynapse
                action: ExecuteBash
                inputs:
                  commands:
                    - echo "Installing Python and Synapse Python client"
                    - dnf install -y python3 python3-pip
                    - pip3 install synapsepythonclient
      Tags:
        Name: !Sub "${AWS::StackName}-component"

  ImageBuilderImageRecipe:
    Type: AWS::ImageBuilder::ImageRecipe
    Properties:
      Name: !Sub "${AWS::StackName}-bastion-recipe"
      Version: !Ref ImageVersion
      ParentImage: "arn:aws:imagebuilder:us-east-1:aws:image/amazon-linux-2023-x86/x.x.x"
      Components:
        - ComponentArn: !Ref ImageBuilderComponent
      BlockDeviceMappings:
        - DeviceName: "/dev/xvda"
          Ebs:
            VolumeSize: !Ref RootVolumeSize
            VolumeType: gp3
      Tags:
        Name: !Sub "${AWS::StackName}-image-recipe"

  ImageBuilderInfrastructureConfiguration:
    Type: AWS::ImageBuilder::InfrastructureConfiguration
    Properties:
      Name: !Sub "${AWS::StackName}-infra-config"
      Description: "Infrastructure configuration for bastion AMI build"
      InstanceProfileName: !Ref ImageBuilderInstanceProfile
      SecurityGroupIds:
        - !Ref ImageBuilderSecurityGroup
      SubnetId: !Ref PrivateSubnet
      Tags:
        Name: !Sub "${AWS::StackName}-infra-config"

  ImageBuilderDistributionConfiguration:
    Type: AWS::ImageBuilder::DistributionConfiguration
    Properties:
      Name: !Sub "${AWS::StackName}-distribution-config"
      Description: "Distributes AMI and shares with the AWS Organization"
      Distributions:
        - Region: !Ref AWS::Region
          AmiDistributionConfiguration:
            Name: !Sub "bastion-image-${ImageVersion}"
            Description: "Bastion AMI with MongoDB tools, Synapse, .NET SDK"
            AmiTags:
              Name: !Sub "bastion-ami-${ImageVersion}"
              ManagedBy: "EC2ImageBuilder"
              Stack: !Ref AWS::StackName
            LaunchPermissionConfiguration:
              OrganizationArns:
                - !Ref OrganizationArn
      Tags:
        Name: !Sub "${AWS::StackName}-distribution-config"

  ImageBuilderImagePipeline:
    Type: AWS::ImageBuilder::ImagePipeline
    Properties:
      Name: !Sub "${AWS::StackName}-bastion-pipeline"
      Description: "Pipeline to build bastion AMI"
      ImageRecipeArn: !Ref ImageBuilderImageRecipe
      InfrastructureConfigurationArn: !Ref ImageBuilderInfrastructureConfiguration
      DistributionConfigurationArn: !Ref ImageBuilderDistributionConfiguration
      ImageTestsConfiguration:
        ImageTestsEnabled: true
        TimeoutMinutes: 60
      Schedule:
        ScheduleExpression: "cron(0 6 ? * MON *)"
        PipelineExecutionStartCondition: "EXPRESSION_MATCH_ONLY"
      Status: "ENABLED"
      Tags:
        Name: !Sub "${AWS::StackName}-pipeline"

Outputs:
  PipelineArn:
    Description: ARN of the Image Builder pipeline
    Value: !Ref ImageBuilderImagePipeline
  ImageRecipeArn:
    Description: ARN of the Image Builder recipe
    Value: !Ref ImageBuilderImageRecipe
  VpcId:
    Description: ID of the created VPC
    Value: !Ref VPC
  PrivateSubnetId:
    Description: ID of the private subnet used for builds
    Value: !Ref PrivateSubnet
  PublicSubnetId:
    Description: ID of the public subnet used for NAT Gateway
    Value: !Ref PublicSubnet