AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Last Modified: 2025/09/24 17:13:25
  "This template deploys the NIH RADx Data Hub Step Functions."
Parameters:
  Environment:
    Type: String
    Description: The Project Environment
    AllowedValues:
      - dev
      - test
      - prod
      - shared
  ProjectName:
    Type: String
    Description: The Project name
    Default: radx
    AllowedValues:
      - radx

Conditions:
  DEV: !Equals [!Ref Environment, dev]
  TEST: !Equals [!Ref Environment, test]
  PROD: !Equals [!Ref Environment, prod]
  NOTDEV: !Not [!Equals [!Ref Environment, dev]]
  NOTPROD: !Not [!Equals [!Ref Environment, prod]]

Resources:
    PollingMacieJobStepFunction:
        Type: "AWS::StepFunctions::StateMachine"
        Properties:
            StateMachineName: !Sub "${ProjectName}-polling-macie-job-${Environment}"
            DefinitionString: !Sub |
                {
                  "Comment": "An example of the Amazon States Language that runs an AWS Batch job and monitors the job until it completes.",
                  "StartAt": "Wait X Seconds",
                  "States": {
                    "Wait X Seconds": {
                      "Type": "Wait",
                      "Next": "Get Job Status",
                      "SecondsPath": "$.waitTime"
                    },
                    "Get Job Status": {
                      "Type": "Task",
                      "Resource": "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProjectName}-check-macie-job-status-${Environment}",
                      "Next": "Job Complete?",
                      "InputPath": "$.jobId",
                      "ResultPath": "$.status",
                      "Retry": [
                        {
                          "ErrorEquals": [
                            "States.ALL"
                          ],
                          "IntervalSeconds": 1,
                          "MaxAttempts": 3,
                          "BackoffRate": 2
                        }
                      ]
                    },
                    "Job Complete?": {
                      "Type": "Choice",
                      "Choices": [
                        {
                          "Variable": "$.status",
                          "StringEquals": "COMPLETE",
                          "Next": "SQS SendMessage"
                        },
                        {
                          "And": [
                            {
                              "Not": {
                                "Variable": "$.status",
                                "StringEquals": "COMPLETE"
                              }
                            },
                            {
                              "Not": {
                                "Variable": "$.status",
                                "StringEquals": "RUNNING"
                              }
                            }
                          ],
                          "Next": "SNS Publish"
                        }
                      ],
                      "Default": "Wait X Seconds"
                    },
                    "SQS SendMessage": {
                      "Type": "Task",
                      "Resource": "arn:aws:states:::sqs:sendMessage",
                      "Parameters": {
                        "MessageBody.$": "$",
                        "QueueUrl": "https://sqs.${AWS::Region}.amazonaws.com/${AWS::AccountId}/${ProjectName}-pii-sqs-queue-${Environment}"
                      },
                      "End": true
                    },
                    "SNS Publish": {
                      "Type": "Task",
                      "Resource": "arn:aws:states:::sns:publish",
                      "Parameters": {
                        "TopicArn": "arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${ProjectName}-alerts-${Environment}",
                        "Message.$": "$"
                      },
                      "End": true
                    }
                  }
                }
            RoleArn: !Sub "arn:aws:iam::${AWS::AccountId}:role/service-role/${ProjectName}-stepfunctions-polling-macie-job-role-${Environment}"
            StateMachineType: "STANDARD"
            LoggingConfiguration:
                IncludeExecutionData: false
                Level: "OFF"