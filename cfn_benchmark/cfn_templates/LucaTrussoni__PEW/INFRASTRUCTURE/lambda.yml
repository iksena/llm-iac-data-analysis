AWSTemplateFormatVersion: "2010-09-09"
Description: The lambda function that extracts data from market API

Parameters:
  LayerVersion:
    Type: Number
    Default: 1
    Description: "Layer version (default = 1)"
  SecretName:
    Type: String
    Default: "DataProviderAPIKey"
  ModelTable:
    Type: String
    Default: "Models"
  TickerTable:
    Type: String
    Default: "Tickers"

Resources:
  PEWExtractorPolicy:
    Type: "AWS::IAM::ManagedPolicy"
    Properties:
      ManagedPolicyName: "PEWExtractorPolicy"
      Path: "/"
      Description: "Policy that allows the execution of the lambda of project pew"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "AccessingTablesAndSecret"
            Effect: "Allow"
            Action:
              - "s3:PutObject"
              - "s3:GetObject"
              - "s3:ListBucket"
              - "secretsmanager:GetSecretValue"
              - "dynamodb:DescribeTable"
              - "dynamodb:GetItem"
              - "dynamodb:Scan"
              - "dynamodb:Query"
            Resource:
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${TickerTable}"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ModelTable}"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ModelTable}/index/Activity"
              - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretName}-*"
              - !Sub "arn:aws:s3:::pew-marketdata-${AWS::AccountId}/*"
              - !Sub "arn:aws:s3:::pew-marketdata-${AWS::AccountId}"
          - Sid: "AccessingParameters"
            Effect: "Allow"
            Action:
              - "ssm:GetParametersByPath"
              - "ssm:GetParameters"
              - "ssm:GetParameter"
            Resource:
              - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/pew/*"
              - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/pew"

  PewExtractorRole:
    Type: "AWS::IAM::Role"
    Properties:
      RoleName: "pewExtractorRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Action: "sts:AssumeRole"
            Effect: "Allow"
            Principal:
              Service: "lambda.amazonaws.com"
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
        - !Ref PEWExtractorPolicy

  PewLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: Pew-Extractor
      Runtime: python3.11
      MemorySize: 512
      Handler: pew_lambda.lambda_handler
      Timeout: 150
      TracingConfig:
        Mode: "PassThrough"
      Role: !GetAtt PewExtractorRole.Arn
      Code:
        S3Bucket: !Sub pew-resources-${AWS::AccountId}
        S3Key: pew_lambda.zip
      Layers:
        - !Sub "arn:aws:lambda:${AWS::Region}:336392948345:layer:AWSSDKPandas-Python311:24"
        - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:layer:pew_custom_layer:${LayerVersion}"