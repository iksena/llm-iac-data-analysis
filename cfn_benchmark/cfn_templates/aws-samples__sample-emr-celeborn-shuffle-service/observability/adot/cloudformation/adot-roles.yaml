AWSTemplateFormatVersion: "2010-09-09"
Description: >
  IAM role for the ADOT Collector running on the Celeborn EKS cluster.
  Trust policy is updated at deploy time with the cluster OIDC provider (IRSA pattern).

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Configuration
        Parameters:
          - ProjectName

Parameters:
  ProjectName:
    Type: String
    Default: emr-celeborn-demo
    Description: Project name prefixed to resource names and stack exports

Resources:
  # --- ADOT Collector IRSA Role ---

  ADOTCollectorRole:
    Type: AWS::IAM::Role
    Metadata:
      guard:
        SuppressedRules:
          - IAM_NO_INLINE_POLICY_CHECK: "Inline policy is tightly scoped to aps:RemoteWrite only. A managed policy would require a separate stack with no security benefit for a blog post demonstration."
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: "Explicit role name required for IRSA trust policy binding in the deploy script. This is a blog post demonstration — resource replacement constraints are not a concern."
          - id: W11
            reason: "aps:RemoteWrite does not support resource-level permissions — wildcard resource is required for this API action."
      checkov:
        skip:
          - id: CKV_AWS_111
            comment: "aps:RemoteWrite does not support resource-level permissions — wildcard resource is required for this API action."
    Properties:
      RoleName: !Sub "${ProjectName}-adot-collector-role"
      Description: !Sub "IRSA role for ADOT collector to remote-write to AMP (${ProjectName})"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ADOTPrometheusWritePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AMPRemoteWrite
                Effect: Allow
                Action:
                  - aps:RemoteWrite
                Resource: "*"
      Tags:
        - Key: Project
          Value: !Ref ProjectName

Outputs:
  ADOTCollectorRoleArn:
    Description: ARN of the ADOT collector IAM role
    Value: !GetAtt ADOTCollectorRole.Arn
    Export:
      Name: !Sub "${ProjectName}-ADOTCollectorRoleArn"

  ADOTCollectorRoleName:
    Description: Name of the ADOT collector IAM role (used by deploy.sh to update IRSA trust policy)
    Value: !Ref ADOTCollectorRole
    Export:
      Name: !Sub "${ProjectName}-ADOTCollectorRoleName"