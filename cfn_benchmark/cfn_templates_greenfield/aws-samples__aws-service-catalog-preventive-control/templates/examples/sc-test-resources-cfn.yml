Outputs:
  VPCId:
    Value: !Ref VPC
  SubnetA:
    Value: !Ref SubnetA
  SubnetB:
    Value: !Ref SubnetB
  TestSG:
    Value: !Ref SecurityGroup
  TestKMS:
    Value: !Ref KMSKey
  DMSGroup:
    Value: !Ref DMSReplicationSubnetGroup
  ECSubnet:
    Value: !Ref ECSubnetGroup
  ECSG:
    Value: !Ref ECSecurityGroup
  SMRole:
    Value: !Ref SageMakerRole