AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: |
  DVA-C02 Lab 2.4 — Conditional writes & optimistic locking

Globals:
  Function:
    Runtime: python3.12
    Timeout: 15
    MemorySize: 256
    LoggingConfig:
      LogFormat: JSON

Resources:
  ProductsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: dva-lab-02-04-products
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  Function:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dva-lab-02-04-conditional
      CodeUri: src/
      Handler: app.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref ProductsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductsTable

Outputs:
  TableName:
    Value: !Ref ProductsTable
  FunctionName:
    Value: !Ref Function