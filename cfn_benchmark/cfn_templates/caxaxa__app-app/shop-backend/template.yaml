              Authorizer: CognitoAuthorizer

  # Nightly Google Calendar sync for all connected shops
  GoogleCalendarNightlySync:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Handler: google_calendar.nightly_sync_handler
      CodeUri: google_calendar_functions
      Timeout: 600
      MemorySize: 512
      Environment:
        Variables:
          APPOINTMENTS_TABLE: !Ref AppointmentsTable
          GOOGLE_TOKENS_TABLE: !Ref GoogleTokensTable
          CALENDAR_SYNC_TABLE: !Ref CalendarSyncTable
          GOOGLE_CLIENT_ID: !Ref GoogleClientId
          GOOGLE_CLIENT_SECRET: !Ref GoogleClientSecret
          GOOGLE_REDIRECT_URI: !Ref GoogleRedirectUri
          NIGHTLY_MAX_SHOPS: "50"
          NIGHTLY_MAX_ACTIONS_PER_SHOP: "100"
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource:
                - !GetAtt GoogleTokensTable.Arn
                - !GetAtt AppointmentsTable.Arn
      Events:
        NightlySchedule:
          Type: Schedule
          Properties:
            # 02:00 UTC daily; adjust as needed
            Schedule: cron(0 2 * * ? *)
            Description: Nightly Google Calendar sync for all connected shops
            Enabled: true

  # Internal single-shop sync function for immediate sync after booking
  GoogleCalendarShopSync:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Handler: google_calendar.sync_shop_handler
      CodeUri: google_calendar_functions
      Timeout: 120
      MemorySize: 512
      Environment:
        Variables:
          APPOINTMENTS_TABLE: !Ref AppointmentsTable
          GOOGLE_TOKENS_TABLE: !Ref GoogleTokensTable
          CALENDAR_SYNC_TABLE: !Ref CalendarSyncTable
          GOOGLE_CLIENT_ID: !Ref GoogleClientId
          GOOGLE_CLIENT_SECRET: !Ref GoogleClientSecret
          GOOGLE_REDIRECT_URI: !Ref GoogleRedirectUri
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:Scan
              Resource:
                - !GetAtt GoogleTokensTable.Arn
                - !GetAtt AppointmentsTable.Arn

