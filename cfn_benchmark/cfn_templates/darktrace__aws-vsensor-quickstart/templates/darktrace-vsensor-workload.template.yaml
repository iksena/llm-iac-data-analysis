AWSTemplateFormatVersion: '2010-09-09'
Description: This template deploys a scaling vSensor cluster for monitoring existing VPC subnets. **WARNING** You will be billed for AWS resources you use if you create a stack from this template. (qs-1rmjte82s)

Metadata:
  QuickStartDocumentation:
    EntrypointName: Parameters for deploying into an existing VPC
    Order: 2
  cfn-lint:
    config:
      ignore_checks:
        - W9001
        - W9006
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Darktrace Instance configuration
        Parameters:
          - DarktraceInstanceHostname
          - DarktraceInstancePushtoken
          - DarktraceInstanceProxy
      - Label:
          default: Darktrace vSensor configuration
        Parameters:
          - SessionManagerEnable
          - InstanceType
          - KeyPairName
          - InstanceSecurityGroups
          - VsensorUpdatekey
          - DesiredCapacityASG
          - MinSizeASG
          - MaxSizeASG
          - osSensorHMAC
      - Label:
          default: Network configuration
        Parameters:
          - DeploymentVPC
          - VpcCIDRBlock
          - SshCIDRBlock
          - Subnets
          - CrossZoneLBEnable
      - Label:
          default: VPC Traffic Mirror configuration
        Parameters:
          - TrafficMirrorRuleNumber
          - TrafficMirrorSourceCIDR
          - TrafficMirrorDestCIDR
      - Label:
          default: Logs and captured packet retention
        Parameters:
          - LogGroupRetention
          - LifecycleS3BucketDays
      - Label:
          default: Quick Start configuration
        Parameters:
          - ShortID

    ParameterLabels:
      # Darktrace Instance Config

      DarktraceInstanceHostname:
        default: Darktrace Instance FQDN / IP
      DarktraceInstancePushtoken:
        default: Darktrace Instance push token
      DarktraceInstanceProxy:
        default: Darktrace Instance proxy URL

      # vSensor Config

      SessionManagerEnable:
        default: Deploy with AWS Session Manager?
      InstanceType:
        default: EC2 instance type
      KeyPairName:
        default: EC2 key pair name
      InstanceSecurityGroups:
        default: Security groups
      VsensorUpdatekey:
        default: vSensor Update key
      DesiredCapacityASG:
        default: Desired vSensor instance capacity
      MinSizeASG:
        default: Minimum vSensor instance capacity
      MaxSizeASG:
        default: Maximum vSensor instance capacity
      osSensorHMAC:
        default: osSensor HMAC Token

      # Networking Config

      DeploymentVPC:
        default: Deployment VPC
      VpcCIDRBlock:
        default: VPC CIDR block
      SshCIDRBlock:
        default: SSH CIDR block
      Subnets:
        default: Subnets

      # Logs and PCAPs Config

      LogGroupRetention:
        default: CloudWatch logs retention (days)
      LifecycleS3BucketDays:
        default: Captured packets storage retention (days)

      # Traffic Mirror Config

      TrafficMirrorRuleNumber:
        default: Traffic Mirror rule number
      TrafficMirrorSourceCIDR:
        default: Source traffic CIDR to filter (0.0.0.0/0 for all traffic)
      TrafficMirrorDestCIDR:
        default: Destination traffic CIDR to filter (0.0.0.0/0 for all traffic)
      CrossZoneLBEnable:
        default: Enable Cross-Zone Load Balancing

      # Quickstart Config

      ShortID:
        default: Quick Start unique run ID (12 characters or less)

Parameters:
  # Darktrace Instance Config

  DarktraceInstanceHostname:
    Type: AWS::SSM::Parameter::Name
    Description: "Internet accessible FQDN of the Darktrace instance (e.g. https://instancename.cloud.darktrace.com:443). This should be the same FQDN you use to access the web interface of Darktrace. HTTPS Protocol prefix and port suffix are optional. Defaults to port 443. (AWS::SSM::Parameter::Name)"
  DarktraceInstancePushtoken:
    Type: AWS::SSM::Parameter::Name
    Description: "Push token to authenticate with the Darktrace instance, provided when you create a *push token* probe entry in the Darktrace UI Config. (AWS::SSM::Parameter::Name)"
  DarktraceInstanceProxy:
    Type: AWS::SSM::Parameter::Name
    Description: "Provide proxy if the vSensor requires proxy access to connect to the Darktrace instance. Include HTTP protocol and optional auth (e.g. http://user:pass@hostname:port). Set SSM parameter value to 'none' to disable. (AWS::SSM::Parameter::Name)"

  # vSensor Config

  SessionManagerEnable:
    Default: 'Yes'
    Description: Configure IAM permissions to enable AWS Systems Manager Sessions to access vSensors remotely. See QuickStart Deployment guide section "Using AWS Sessions Manager" (https://aws-ia.github.io/cfn-ps-darktrace-vsensor/#_using_aws_sessions_manager). This can be used in preference to a jump box for administrative connections to the vSensors. AWS Systems Manager Sessions is the recommended way to connect to your vSensors.
    Type: String
    AllowedValues:
      - 'Yes'
      - 'No'
  InstanceType:
    Default: t3.medium
    Type: String
    Description: Specify the EC2 instance type that will be used in the Auto-Scaling Group. It is recommended to start with `t3.medium`, change if you expect frequent high traffic. (String)
    AllowedValues:
      - t3.medium
      - m5.large
      - m6i.large
      - m7i.large
      - m5.xlarge
      - m6i.xlarge
      - m7i.xlarge
      - m5.2xlarge
      - m6i.2xlarge
      - m6i.2xlarge
      - m5.4xlarge
      - m6i.4xlarge
      - m7i.4xlarge
  KeyPairName:
    Type: String
    Description: Add a pre-existing EC2 key pair to use to authenticate to the vSensors. vSensors are designed to be self managed - however some optional administrative tasks will need to be performed via CLI. Use 'none' to proceed without a key pair (only if you are using SSM or Instance Connect, otherwise you will not be able to access your vSensor).
  InstanceSecurityGroups:
    Type: 'CommaDelimitedList'
    Description: "*Optional* Add additional Security Groups to the VPC by specifying preexisting Security Group IDs. Note, this is in addition to the required vSensor connectivity Security Group (port 80, 443, 4789, 6081 for the VPC) which will be added by this QuickStart template. (CommaDelimitedList)"
    Default: ""
  VsensorUpdatekey:
    Type: AWS::SSM::Parameter::Name
    Description: "The vSensor Update Key is required to download installation packages and updates from Darktrace. It is provided when you create a *push token* probe entry in the Darktrace UI Config or can be found on the Credentials section on the Darktrace Customer Portal (https://customerportal.darktrace.com) (AWS::SSM::Parameter::Name)"
  DesiredCapacityASG:
    Type: Number
    Description: Initial number of vSensor instances in the Auto-Scaling Group(s). The value represents the total for all Availability Zones, so must be at least equal to AZ count if cross-zone balancing is disabled. Default recommended value 1 with cross-zone.
    Default: 1
  MinSizeASG:
    Type: Number
    Description: Minimum number of vSensor instances in the Auto-Scaling Group(s). The value represents the total for all Availability Zones, so must be at least equal to AZ count if cross-zone balancing is disabled. Default recommended value 1 with cross-zone.
    Default: 1
  MaxSizeASG:
    Type: Number
    Description: Maximum number of vSensor instances in the Auto-Scaling Group(s). The value represents the total for all Availability Zones, so must be at least equal to AZ count if cross-zone balancing is disabled. Default recommended value 5 with cross-zone.
    Default: 5
  osSensorHMAC:
    Type: AWS::SSM::Parameter::Name
    Description: "Set a pre-shared (HMAC) token that can be supplied to osSensor agents in order for them to authenticate with vSensor. Required if you deploy osSensor agent traffic capturing. Not required if you use AWS Traffic Mirroring. Set SSM parameter value to 'none' to disable. (AWS::SSM::Parameter::Name)"

  # Networking Config

  DeploymentVPC:
    Type: 'AWS::EC2::VPC::Id'
    Description: Select the VPC into which to launch the vSensor Auto-Scaling group(s).
  VpcCIDRBlock:
    Type: String
    Default: '10.0.0.0/16'
    Description: Enter the CIDR block of the VPC specified above.
  SshCIDRBlock:
    Type: String
    Default: '10.0.0.0/24'
    Description: Permit SSH connections from this CIDR block. The vSensor Security Group will be altered accordingly. It is recommended to set any jump box addresses here, or set to the VPC CIDR.
  Subnets:
    Type: 'List<AWS::EC2::Subnet::Id>'
    Description: >-
      Select at least one subnet to launch a vSensor Auto-Scaling Group. It is recommended to deploy one Auto-Scaling Group in a subnet in each mirrored Availability Zone if not using cross-zone load balancing.
      You can specify at most one subnet per Availability Zone.

  # Traffic Mirror Config

  TrafficMirrorRuleNumber:
    Type: Number
    Description: Enter a priority to assign to the rule.
    Default: 100
  TrafficMirrorSourceCIDR:
    Type: String
    Default: '0.0.0.0/0'
    Description: "To restrict the traffic captured to that emerging from a specific source IP range, enter the source CIDR block. It will be applied to the Traffic Mirror filter. Enter `0.0.0.0/0` for all traffic."
  TrafficMirrorDestCIDR:
    Type: String
    Default: '0.0.0.0/0'
    Description: "To restrict the traffic captured to that destined for a specific IP range, enter the destination CIDR block. It will be applied to the Traffic Mirror filter. Enter `0.0.0.0/0` for all traffic."
  CrossZoneLBEnable:
    Type: String
    Description:
      Enable (Yes) or disable (No) Cross-Zone Load Balancing.
      To minimise traffic costs, Cross-Zone Load Balancing is disabled by default.
      When it is disabled, make sure there is at least one vSensor in each Availability Zone with mirror sources.
    AllowedValues:
      - 'Yes'
      - 'No'
    Default: 'No'

  # Logs & PCAPs Config

  LogGroupRetention:
    Type: Number
    AllowedValues:
      - 1
      - 3
      - 5
      - 7
      - 14
      - 30
      - 60
      - 90
      - 120
      - 150
      - 180
      - 365
      - 400
      - 545
      - 731
      - 1827
      - 3653
    Description: Specify the number of days to retain CloudWatch logs. Logs and metrics from the Darktrace vSensor EC2 instances are stored in CloudWatch.
    Default: 30
  LifecycleS3BucketDays:
    Type: Number
    Description: Darktrace vSensors store packet capture data in Amazon S3. The PCAP associated with network connections are retreivable via the Darktrace Threat Vizualiser UI. Specify the number of days to retain captured packets in Amazon S3. Set to 0 for no PCAP storage.
    MinValue: 0
    Default: 7

  # Quickstart Config
  ShortID:
    AllowedPattern: ^[0-9a-z-]{0,12}$
    ConstraintDescription: Unique ID prefix can include up to 12 characters, including numbers, lowercase letters, hyphens (-).
    Description: Quick Start short unique ID used to identify resources from other installations of this Quick Start. If left empty, a random string is generated.
    Default: ""
    Type: String

Conditions:
  # Check if begining of SSM parameter name is an ARN. Cloudformation allows name or ARN.
  UsingSSMARNs: !Equals
    - "arn"
    - Fn::Select:
      - 0
      - Fn::Split:
        - ":"
        - !Ref DarktraceInstanceHostname
  NotUsingExtraInstanceSecurityGroups: !Equals
    - !Join [",", !Ref "InstanceSecurityGroups"]
    - ""
  AllowSessionsManager: !Equals
    - !Ref SessionManagerEnable
    - "Yes"
  GenerateShortID: !Equals
    - !Ref ShortID
    - ""
  CreatePCAPStorage: !Not
    - !Equals
      - !Ref LifecycleS3BucketDays
      - 0
  AllowCrossZoneLB: !Equals
    - !Ref CrossZoneLBEnable
    - "Yes"
  NoKeyPair: !Equals
    - !Ref KeyPairName
    - "none"
Rules:
  SubnetsInVPC:
    Assertions:
      - Assert: !EachMemberIn
          - !ValueOfAll [AWS::EC2::Subnet::Id, VpcId]
          - !RefAll AWS::EC2::VPC::Id
        AssertDescription: All subnets must exist in the VPC.
Resources:

  ## Generate a short ID if the user does not define one.
  # This involves running a Lambda function.
  # From https://www.itonaut.com/2018/01/03/generate-passwords-in-aws-cloudformation-template/
  # Modified to take a user submitted ShortID and return this if provided, else generate the random value.
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Condition: GenerateShortID
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
          Action:
          - sts:AssumeRole

  RandomStringLambdaFunction:
    Type: AWS::Lambda::Function
    Condition: GenerateShortID
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            - E3030 # Valid value for Runtime (nodejs24.x)
    Properties:
      Code:
        ZipFile: >
          const response = require("cfn-response"); const randomString = (length, chars) => {
              var result = '';
              for (var i = length; i > 0; --i) result += chars[Math.floor(Math.random() * chars.length)];
              return result;
          }; exports.handler = async (event, context) =>{
            let str = "";
            let length = 12;
            if ("ResourceProperties" in event) {
              if ("ShortID" in event['ResourceProperties'] && event['ResourceProperties']['ShortID'] != "") {
                str = event['ResourceProperties']['ShortID'];
              }
              else if ("Length" in event['ResourceProperties']) {
                length = Number(event['ResourceProperties']['Length']);
              }
            }
            if (str == "") {
              str = randomString(length, '0123456789abcdefghijklmnopqrstuvwxyz');
            }
            const responseData = {IDString: str};
            await response.send(event, context, response.SUCCESS, responseData);
          };
      Handler: index.handler
      Runtime: nodejs24.x
      Role: !GetAtt LambdaExecutionRole.Arn
      MemorySize: 128
      Timeout: 20
      Tags:
        - Key: darktrace-vsensor-quickstart
          Value: !Ref ShortID
      TracingConfig:
        Mode: Active

  RandomStringLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: GenerateShortID
    Properties:
      LogGroupName: !Sub "/aws/lambda/${RandomStringLambdaFunction}"
      RetentionInDays: !Ref LogGroupRetention

  RandomStringLambdaLogPermissions:
    Type: AWS::IAM::Policy
    Condition: GenerateShortID
    Properties:
      Roles:
        - !Ref LambdaExecutionRole
      PolicyName: !Sub "${RandomStringLambdaFunction}-LogGroup"
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action:
          - logs:CreateLogStream
          - logs:PutLogEvents
          Resource:
          - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${RandomStringLambdaFunction}"
          - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${RandomStringLambdaFunction}:*"
          - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${RandomStringLambdaFunction}:*:*"

  ShortIDRand:
    Type: AWS::CloudFormation::CustomResource
    Condition: GenerateShortID
    DependsOn: RandomStringLambdaLogPermissions
    Properties:
      Length: 12
      ShortID: !Ref ShortID
      ServiceToken: !GetAtt RandomStringLambdaFunction.Arn

  SecurityGroupvSensor:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Security group for ASG vSensor"
      GroupName:
        !Sub
          - "${ShortID}-vSensor-SG"
          - ShortID: !If
            - GenerateShortID
            - !GetAtt ShortIDRand.IDString
            - !Ref ShortID
      VpcId: !Ref DeploymentVPC
      # SSH Access is configurable by customer
      # kics-scan ignore-line
      SecurityGroupIngress:
        - IpProtocol: tcp
          Description: Allow SSH management access from the configured SSH CIDR block
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SshCIDRBlock
        - IpProtocol: tcp
          Description: Allow osSensors from the VPC CIDR block to send mirrored traffic & allow health check
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref VpcCIDRBlock
        - IpProtocol: tcp
          Description: Allow osSensors from the VPC CIDR block to register to the vSensor
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCIDRBlock
        - IpProtocol: udp
          Description: Allow AWS Traffic Mirroring VXLAN packets to be ingested
          FromPort: 4789
          ToPort: 4789
          CidrIp: !Ref VpcCIDRBlock
        - IpProtocol: udp
          Description: Allow Traffic Mirroring GENEVE packets to be ingested
          FromPort: 6081
          ToPort: 6081
          CidrIp: !Ref VpcCIDRBlock
      SecurityGroupEgress:
        - Description: Allow all outbound traffic to access the Darktrace Packages / Ubuntu CDNs on HTTP.
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - Description: Allow all outbound traffic to access the Darktrace Packages / Ubuntu CDNs on HTTPS.
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

  ScalingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    # Ignore Classic Load Balancer "LoadBalancerNames".
    # kics-scan ignore-line
    Properties:
      AutoScalingGroupName: !Ref ASG
      EstimatedInstanceWarmup: 600
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        TargetValue: 75

  LaunchTemplate:
    Type: 'AWS::EC2::LaunchTemplate'
    Properties:
      LaunchTemplateData:
        UserData: !Base64
          'Fn::Sub':
            - |
              #!/bin/bash -xe
              function exittrap() {
                  exitcode="$?"
                  set +e
                  if [ "$exitcode" -gt 0 ]; then
                      echo "Failed to successfully configure vSensor, more details in /var/log/user-data.log"
                      aws autoscaling complete-lifecycle-action --lifecycle-action-result ABANDON --instance-id $INSTANCE_ID --lifecycle-hook-name "${lifecycleHookName}" --auto-scaling-group-name "${autoScalingGroupName}"  --region ${AWS::Region}
                  fi
                  exit "$exitcode"
              }
              mkdir -p /etc/darktrace/
              exec > >(tee -a /var/log/user-data.log|logger -t user-data -s 2>/dev/console) 2>&1

              trap "exittrap" EXIT

              # See https://youtu.be/unMiTRw8JVE for an example on how to review this console output if Cloudwatch logging fails.
              echo "Starting userdata"

              echo "Getting instance ID and attempt to disable source-dest checking metadata."
              TOKEN=`curl -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 120" -s`
              INSTANCE_ID=`curl -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-id -s`

              snap install aws-cli --classic
              aws ec2 modify-instance-attribute --no-source-dest-check --instance-id $INSTANCE_ID --region ${AWS::Region} || echo "Failed to set source-dest. Continuing anyway." # Not serious if this doesn't succeed.

              wget https://s3.amazonaws.com/amazoncloudwatch-agent/ubuntu/amd64/latest/amazon-cloudwatch-agent.deb
              apt-get -o DPkg::Lock::Timeout=240 install -y ./amazon-cloudwatch-agent.deb
              systemctl enable amazon-cloudwatch-agent
              cat >CW_AGENT.conf <<'EOF'
              {
                "agent": {
                  "metrics_collection_interval": 60,
                  "run_as_user": "root"
                },
                "logs": {
                  "logs_collected": {
                    "files": {
                      "collect_list": [
                        {
                          "file_path": "/var/log/syslog",
                          "log_group_name": "${vSensorLogGroup}",
                          "log_stream_name": "{instance_id}"
                        },
                        {
                          "file_path": "/var/log/sabreserver/lite/sabreserverlite.log",
                          "log_group_name": "${vSensorLogGroup}",
                          "log_stream_name": "{instance_id}"
                        },
                        {
                          "file_path": "/var/log/sabreserver/plasma/plasma.log",
                          "log_group_name": "${vSensorLogGroup}",
                          "log_stream_name": "{instance_id}"
                        },
                        {
                          "file_path": "/var/log/darktrace-apt-dist-upgrade.log",
                          "log_group_name": "${vSensorLogGroup}",
                          "log_stream_name": "{instance_id}"
                        },
                        {
                          "file_path": "/var/log/dpkg.log",
                          "log_group_name": "${vSensorLogGroup}",
                          "log_stream_name": "{instance_id}"
                        },
                        {
                          "file_path": "/var/log/darktrace-bro-keepalive.log",
                          "log_group_name": "${vSensorLogGroup}",
                          "log_stream_name": "{instance_id}"
                        },
                        {
                          "file_path": "/var/log/apt/term.log",
                          "log_group_name": "${vSensorLogGroup}",
                          "log_stream_name": "{instance_id}"
                        },
                        {
                          "file_path": "/var/log/apt/history.log",
                          "log_group_name": "${vSensorLogGroup}",
                          "log_stream_name": "{instance_id}"
                        },
                        {
                          "file_path": "/var/log/inithooks.log",
                          "log_group_name": "${vSensorLogGroup}",
                          "log_stream_name": "{instance_id}"
                        },
                        {
                          "file_path": "/var/log/nginx/access.log",
                          "log_group_name": "${vSensorLogGroup}",
                          "log_stream_name": "{instance_id}"
                        },
                        {
                          "file_path": "/var/log/rs-tunnels/*.log",
                          "log_group_name": "${vSensorLogGroup}",
                          "log_stream_name": "{instance_id}"
                        },
                        {
                          "file_path": "/var/opt/bro/spool/manager/stdout.log",
                          "log_group_name": "${vSensorLogGroup}",
                          "log_stream_name": "{instance_id}"
                        },
                        {
                          "file_path": "/var/opt/bro/spool/manager/stderr.log",
                          "log_group_name": "${vSensorLogGroup}",
                          "log_stream_name": "{instance_id}"
                        },
                        {
                          "file_path": "/var/opt/bro/spool/tmp/*/.crash-diag.out",
                          "log_group_name": "${vSensorLogGroup}",
                          "log_stream_name": "{instance_id}"
                        },
                        {
                          "file_path": "/var/log/chronicle/*.log",
                          "log_group_name": "${vSensorLogGroup}",
                          "log_stream_name": "{instance_id}"
                        },
                        {
                          "file_path": "/var/log/heka/*.log",
                          "log_group_name": "${vSensorLogGroup}",
                          "log_stream_name": "{instance_id}"
                        },
                        {
                          "file_path": "/var/log/redis/*.log",
                          "log_group_name": "${vSensorLogGroup}",
                          "log_stream_name": "{instance_id}"
                        },
                        {
                          "file_path": "/var/log/user-data.log",
                          "log_group_name": "${vSensorLogGroup}",
                          "log_stream_name": "{instance_id}-userdata"
                        }
                      ]
                    }
                  }
                },
                "metrics": {
                  "namespace": "vSensorMetrics",
                  "append_dimensions": {
                    "AutoScalingGroupName": "${!aws:AutoScalingGroupName}",
                    "ImageId": "${!aws:ImageId}",
                    "InstanceId": "${!aws:InstanceId}",
                    "InstanceType": "${!aws:InstanceType}"
                  },
                  "aggregation_dimensions": [["AutoScalingGroupName"], ["InstanceId", "InstanceType"]],
                  "metrics_collected": {
                    "cpu": {
                      "measurement": [
                        "cpu_usage_active",
                        "cpu_usage_iowait",
                        "cpu_usage_user",
                        "cpu_usage_system"
                      ],
                      "metrics_collection_interval": 60,
                      "resources": [
                        "*"
                      ],
                      "totalcpu": false
                    },
                    "disk": {
                      "measurement": [
                        "used_percent",
                        "inodes_free"
                      ],
                      "metrics_collection_interval": 60,
                      "resources": [
                        "*"
                      ]
                    },
                    "diskio": {
                      "measurement": [
                        "io_time"
                      ],
                      "metrics_collection_interval": 60,
                      "resources": [
                        "*"
                      ]
                    },
                    "mem": {
                      "measurement": [
                        "mem_used_percent"
                      ],
                      "metrics_collection_interval": 60
                    },
                    "net": {
                      "measurement": [
                        "net_bytes_recv",
                        "net_bytes_sent",
                        "net_drop_in",
                        "net_drop_out",
                        "net_err_in",
                        "net_err_out",
                        "net_packets_sent",
                        "net_packets_recv"
                      ],
                      "metrics_collection_interval": 60,
                      "resources": [
                        "*"
                      ]
                    },
                    "statsd": {
                      "metrics_aggregation_interval": 60,
                      "metrics_collection_interval": 10,
                      "service_address": ":8125"
                    },
                    "swap": {
                      "measurement": [
                        "swap_used_percent"
                      ],
                      "metrics_collection_interval": 60
                    }
                  }
                }
              }
              EOF
              /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -c file:./CW_AGENT.conf -s
              systemctl start amazon-cloudwatch-agent
              echo "Cloudwatch configuration complete."

              bash <(wget -O - https://packages-cdn.darktrace.com/install) --updateKey ${VsensorUpdatekey} --updateKeyType AWS:SSM

              echo "Setting configuration"
              set_pushtoken.sh -t "AWS:SSM" "${DarktraceInstancePushtoken}" "${DarktraceInstanceHostname}" "${DarktraceInstanceProxy}"
              set_ossensor_loadbalancer_direct.sh 1
              set_ephemeral.sh 1 # Configure vSensor for use in ASG.
              if [ -n "${bucketName}" ]; then
                set_pcap_s3_bucket.sh "${bucketName}"
              else
                set_pcap_size.sh 0
              fi
              if [ -n "${osSensorHMAC}" ]; then
                set_ossensor_hmac.sh -t "AWS:SSM" "${osSensorHMAC}"
              fi
              echo "Completed vSensor configuration"
              service confconsole restart || true # To update AWS screenshot with current config.
              echo "Successful configuration of vSensor. Now telling the ASG the AWS vSensor is ready (without waiting for upgrades)."
              aws autoscaling complete-lifecycle-action --lifecycle-action-result CONTINUE --instance-id $INSTANCE_ID --lifecycle-hook-name "${lifecycleHookName}" --auto-scaling-group-name "${autoScalingGroupName}"  --region ${AWS::Region}
              /usr/sbin/cron-apt-dist-upgrade.sh || true
              echo "Userdata script complete."
            - autoScalingGroupName: !Sub
                - "${ShortID}-vSensor-ASG"
                - ShortID: !If
                  - GenerateShortID
                  - !GetAtt ShortIDRand.IDString
                  - !Ref ShortID
              lifecycleHookName: !Sub
                - "${ShortID}-vSensor-LifecycleHook"
                - ShortID: !If
                  - GenerateShortID
                  - !GetAtt ShortIDRand.IDString
                  - !Ref ShortID
              bucketName: !If
                - CreatePCAPStorage
                - !Ref PCAPS
                - ""
        KeyName: !If
          - NoKeyPair
          - !Ref AWS::NoValue
          - !Ref KeyPairName
        InstanceType: !Ref InstanceType
        BlockDeviceMappings:
          - DeviceName: "/dev/sda1"
            Ebs:
              VolumeSize: 20
              Encrypted: true
              DeleteOnTermination: true
        SecurityGroupIds:
          Fn::If:
              - NotUsingExtraInstanceSecurityGroups
              - - !Sub "${SecurityGroupvSensor}"
              - !Split
                - ","
                - !Sub
                  - "${SecurityGroupvSensor},${customerSecurityGroups}"
                  - customerSecurityGroups: !Join [",", !Ref "InstanceSecurityGroups"]
        IamInstanceProfile:
          Arn: !GetAtt vSensorIamInstanceProfile.Arn
        ImageId: 'resolve:ssm:/aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id'
        TagSpecifications:
          - ResourceType: 'instance'
            Tags:
              - Key: 'vSensorProbe'
                Value: 'YES'
        Monitoring:
          Enabled: true
        MetadataOptions:
          HttpEndpoint: 'enabled'
          HttpTokens: 'required'
      LaunchTemplateName:
        !Sub
          - "${ShortID}-vSensor-Launch-Template"
          - ShortID: !If
            - GenerateShortID
            - !GetAtt ShortIDRand.IDString
            - !Ref ShortID

  vSensorLogGroup:
    Type: 'AWS::Logs::LogGroup'
    Properties:
      LogGroupName:
        !Sub
          - "${ShortID}-vSensor-Logs"
          - ShortID: !If
            - GenerateShortID
            - !GetAtt ShortIDRand.IDString
            - !Ref ShortID
      RetentionInDays: !Ref LogGroupRetention
      KmsKeyId: !GetAtt vSensorLogKMSKey.Arn

  vSensorLogKMSKey:
    Type: 'AWS::KMS::Key'
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [EIAMPolicyActionWildcard, EIAMPolicyWildcardResource]
    Properties:
      Description: KMS Key to allow CloudWatch and SSM Session Manager Session logs to be encrypted
      Enabled: True
      EnableKeyRotation: True
      # Ignore :root wildcard for KMS, this is a default AWS requirement
      # See: https://docs.aws.amazon.com/kms/latest/developerguide/key-policy-default.html
      # kics-scan ignore-line
      KeyPolicy:
        Version: "2012-10-17"
        Id: "key-default-1"
        Statement:
          - Sid: "Enable IAM User Permission for this account (AWS Default Key Policy)"
            Effect: Allow
            Principal:
              AWS : !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          - Sid: "Allow encrypted logs"
            Effect: Allow
            Principal:
              Service: !Sub "logs.${AWS::Region}.amazonaws.com"
            Action:
              - "kms:Encrypt"
              - "kms:Decrypt"
              - "kms:ReEncryptTo"
              - "kms:ReEncryptFrom"
              - "kms:GenerateDataKey"
              - "kms:DescribeKey"
              - "kms:DescribeCustomKeyStores"
            Resource: "*"
            Condition:
              ArnEquals:
                "kms:EncryptionContext:aws:logs:arn": !Sub
                  - "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${ShortID}-vSensor-Logs"
                  - ShortID: !If
                    - GenerateShortID
                    - !GetAtt ShortIDRand.IDString
                    - !Ref ShortID

  TrafficMirrorTarget:
    Type: 'AWS::EC2::TrafficMirrorTarget'
    Properties:
      NetworkLoadBalancerArn: !Ref LoadBalancer
      Description: Traffic mirror target associated with a network load balancer
      Tags:
        - Key: "Name"
          Value:
            !Sub
              - "${ShortID}-vSensor-Traffic-Mirror-Target"
              - ShortID: !If
                - GenerateShortID
                - !GetAtt ShortIDRand.IDString
                - !Ref ShortID

  TrafficMirrorFilter:
    Type: 'AWS::EC2::TrafficMirrorFilter'
    Properties:
      Description: Mirror filter for scaling vSensor, allow all from given CIDR range
      Tags:
        - Key: "Name"
          Value:
            !Sub
              - "${ShortID}-vSensor-Traffic-Filter"
              - ShortID: !If
                - GenerateShortID
                - !GetAtt ShortIDRand.IDString
                - !Ref ShortID

  TrafficMirrorFilterRuleIngress:
    Type: AWS::EC2::TrafficMirrorFilterRule
    Properties:
      Description: 'allow all ingress'
      DestinationCidrBlock: !Ref TrafficMirrorDestCIDR
      RuleAction: 'accept'
      RuleNumber: !Ref TrafficMirrorRuleNumber
      SourceCidrBlock: !Ref TrafficMirrorSourceCIDR
      TrafficDirection: 'ingress'
      TrafficMirrorFilterId: !Ref TrafficMirrorFilter

  TrafficMirrorFilterRuleEgress:
    Type: AWS::EC2::TrafficMirrorFilterRule
    Properties:
      Description: 'allow all egress'
      DestinationCidrBlock: !Ref TrafficMirrorDestCIDR
      RuleAction: 'accept'
      RuleNumber: !Ref TrafficMirrorRuleNumber
      SourceCidrBlock: !Ref TrafficMirrorSourceCIDR
      TrafficDirection: 'egress'
      TrafficMirrorFilterId: !Ref TrafficMirrorFilter

  TargetGroupUDP6081:
    Type: 'AWS::ElasticLoadBalancingV2::TargetGroup'
    Properties:
      Name:
        !Sub
          - "${ShortID}-vSensor-ASG-UDP6081"
          - ShortID: !If
            - GenerateShortID
            - !GetAtt ShortIDRand.IDString
            - !Ref ShortID
      HealthCheckEnabled: true
      HealthCheckIntervalSeconds: 30
      HealthCheckPath: /healthcheck
      HealthCheckPort: '443'
      HealthCheckProtocol: HTTPS
      Port: 6081
      Protocol: 'UDP'
      TargetGroupAttributes:
        - Key: deregistration_delay.connection_termination.enabled
          Value: true
      TargetType: 'instance'
      VpcId: !Ref DeploymentVPC

  TargetGroupUDP4789:
    Type: 'AWS::ElasticLoadBalancingV2::TargetGroup'
    Properties:
      Name:
        !Sub
          - "${ShortID}-vSensor-ASG-UDP4789"
          - ShortID: !If
            - GenerateShortID
            - !GetAtt ShortIDRand.IDString
            - !Ref ShortID
      HealthCheckEnabled: true
      HealthCheckIntervalSeconds: 30
      HealthCheckPath: /healthcheck
      HealthCheckPort: '443'
      HealthCheckProtocol: HTTPS
      Port: 4789
      Protocol: 'UDP'
      TargetGroupAttributes:
        - Key: deregistration_delay.connection_termination.enabled
          Value: true
      TargetType: 'instance'
      VpcId: !Ref DeploymentVPC

  TargetGroupTCP443:
    Type: 'AWS::ElasticLoadBalancingV2::TargetGroup'
    Properties:
      Name:
        !Sub
          - "${ShortID}-vSensor-ASG-TCP443"
          - ShortID: !If
            - GenerateShortID
            - !GetAtt ShortIDRand.IDString
            - !Ref ShortID
      HealthCheckEnabled: true
      HealthCheckIntervalSeconds: 30
      HealthCheckPath: /healthcheck
      HealthCheckPort: '443'
      HealthCheckProtocol: HTTPS
      Port: 443
      Protocol: 'TCP'
      TargetGroupAttributes:
        - Key: deregistration_delay.connection_termination.enabled
          Value: true
      TargetType: 'instance'
      VpcId: !Ref DeploymentVPC

  TargetGroupTCP80:
    Type: 'AWS::ElasticLoadBalancingV2::TargetGroup'
    Properties:
      Name:
        !Sub
          - "${ShortID}-vSensor-ASG-TCP80"
          - ShortID: !If
            - GenerateShortID
            - !GetAtt ShortIDRand.IDString
            - !Ref ShortID
      HealthCheckEnabled: true
      HealthCheckIntervalSeconds: 30
      HealthCheckPath: /healthcheck
      HealthCheckPort: '80'
      HealthCheckProtocol: HTTP
      Port: 80
      Protocol: 'TCP'
      TargetGroupAttributes:
        - Key: deregistration_delay.connection_termination.enabled
          Value: true
      TargetType: 'instance'
      VpcId: !Ref DeploymentVPC

  ASG:
    Type: 'AWS::AutoScaling::AutoScalingGroup'
    # Ignore the DependsOn !Ref below
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [W1019]
    Properties:
      # Give the Autoscaling group itself a name.
      AutoScalingGroupName: !Sub
        - "${ShortID}-vSensor-ASG"
        # Can't have a conditional DependsOn, so using !Ref here
        - DependsOn: !If
              - CreatePCAPStorage
              - !Ref PCAPCleanupBucketOnDelete # Such that on deletion, the ASG is removed before emptying S3.
              - ""
          ShortID: !If
              - GenerateShortID
              - !GetAtt ShortIDRand.IDString
              - !Ref ShortID
      MinSize: !Ref MinSizeASG
      MaxSize: !Ref MaxSizeASG
      MetricsCollection:
        - Granularity: 1Minute
      DesiredCapacity: !Ref DesiredCapacityASG
      VPCZoneIdentifier: !Ref Subnets
      TargetGroupARNs:
        - !Ref TargetGroupUDP6081
        - !Ref TargetGroupUDP4789
        - !Ref TargetGroupTCP443
        - !Ref TargetGroupTCP80
      LaunchTemplate:
        Version: !GetAtt
          - LaunchTemplate
          - LatestVersionNumber
        LaunchTemplateId: !Ref LaunchTemplate
      HealthCheckType: "ELB"
      HealthCheckGracePeriod: 60
      # Give each vSensor a name too.
      Tags:
        - Key: Name
          PropagateAtLaunch: True
          Value:
            !Sub
              - "${ShortID}-vSensor-ASG"
              - ShortID: !If
                - GenerateShortID
                - !GetAtt ShortIDRand.IDString
                - !Ref ShortID
      LifecycleHookSpecificationList:
        - LifecycleHookName: !Sub
            - "${ShortID}-vSensor-LifecycleHook"
            - ShortID: !If
              - GenerateShortID
              - !GetAtt ShortIDRand.IDString
              - !Ref ShortID
          DefaultResult: ABANDON
          HeartbeatTimeout: 900
          LifecycleTransition: "autoscaling:EC2_INSTANCE_LAUNCHING"

# PCAPS S3 Bucket

  PCAPS:
    Type: 'AWS::S3::Bucket'
    # Ignore Bucket versioning for PCAPS.
    # kics-scan ignore-line
    Condition: CreatePCAPStorage
    Metadata:
      cfn-lint:
        config:
          # Lint cannot resolve lambda generated ShortID is lowercase alphanumeric.
          ignore_checks: [W1031]
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: !Sub 'DeleteAfter${LifecycleS3BucketDays}Days'
            ExpirationInDays: !Ref LifecycleS3BucketDays
            Status: Enabled
      BucketName:
        !Sub
          - "${ShortID}-vsensor-pcaps"
          - ShortID: !If
            - GenerateShortID
            - !GetAtt ShortIDRand.IDString
            - !Ref ShortID
      LoggingConfiguration:
        LogFilePrefix: "s3logging"

  PCAPSSSLOnlyPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: CreatePCAPStorage
    Properties:
      Bucket: !Ref PCAPS
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Action: 's3:*'
            Effect: Deny
            Resource:
              - !Sub 'arn:${AWS::Partition}:s3:::${PCAPS}'
              - !Sub 'arn:${AWS::Partition}:s3:::${PCAPS}/*'
            Principal: '*'
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  # From https://gist.github.com/drumadrian/e1601ab34e7f609b5075f65599108960
  # Empty the PCAP bucket on Stack deletion to prevent failure.
  CleanupBucketOnDeleteLambdaRole:
    Type: AWS::IAM::Role
    Condition: CreatePCAPStorage
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
          Action:
          - sts:AssumeRole
      Path: "/"
      Policies:
        - PolicyName: !Sub
            - "${ShortID}-vSensor-S3CleanupLambdaPolicy"
            - ShortID: !If
              - GenerateShortID
              - !GetAtt ShortIDRand.IDString
              - !Ref ShortID
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
            - Effect: Allow
              Action:
              - s3:GetBucketVersioning
              - s3:PutBucketVersioning
              - s3:ListBucket
              - s3:ListBucketVersions
              Resource:
                - !Sub 'arn:${AWS::Partition}:s3:::${PCAPS}'
            - Effect: Allow
              Action:
              - s3:DeleteObject
              - s3:DeleteObjectVersion
              Resource:
                - !Sub 'arn:${AWS::Partition}:s3:::${PCAPS}/*'

  CleanupBucketOnDeleteLambda:
    DependsOn: PCAPS
    Type: "AWS::Lambda::Function"
    Condition: CreatePCAPStorage
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            - E3030 # Valid value for Runtime (python3.14)
    Properties:
      Code:
        ZipFile: |
          #!/usr/bin/env python
          # -*- coding: utf-8 -*-
          import json
          import boto3
          import urllib3
          def empty_delete_buckets(bucket_name):
              """
              Empties and deletes the bucket
              :param bucket_name:
              :return:
              """
              print("trying to delete the bucket {}".format(bucket_name))
              s3_client = boto3.client('s3')
              s3 = boto3.resource('s3')
              try:
                  bucket = s3.Bucket(bucket_name).load()
              except Exception:
                  print("bucket {} does not exist".format(bucket_name))
                  return
              # Check if versioning is enabled
              response = s3_client.get_bucket_versioning(Bucket=bucket_name)
              status = response.get('Status','')
              if status == 'Enabled':
                  response = s3_client.put_bucket_versioning(Bucket=bucket_name,
                                                            VersioningConfiguration={'Status': 'Suspended'})
              paginator = s3_client.get_paginator('list_object_versions')
              page_iterator = paginator.paginate(
                  Bucket=bucket_name
              )
              for page in page_iterator:
                  print(page)
                  if 'DeleteMarkers' in page:
                      delete_markers = page['DeleteMarkers']
                      if delete_markers is not None:
                          for delete_marker in delete_markers:
                              key = delete_marker['Key']
                              versionId = delete_marker['VersionId']
                              s3_client.delete_object(Bucket=bucket_name, Key=key, VersionId=versionId)
                  if 'Versions' in page and page['Versions'] is not None:
                      versions = page['Versions']
                      for version in versions:
                          print(version)
                          key = version['Key']
                          versionId = version['VersionId']
                          s3_client.delete_object(Bucket=bucket_name, Key=key, VersionId=versionId)
              object_paginator = s3_client.get_paginator('list_objects_v2')
              page_iterator = object_paginator.paginate(
                  Bucket=bucket_name
              )
              for page in page_iterator:
                  if 'Contents' in page:
                      for content in page['Contents']:
                          key = content['Key']
                          s3_client.delete_object(Bucket=bucket_name, Key=content['Key'])

              print ("Successfully emptied the bucket {}".format(bucket_name))
          def lambda_handler(event, context):
              try:
                  bucket = event['ResourceProperties']['BucketName']
                  if event['RequestType'] == 'Delete':
                      empty_delete_buckets(bucket)
                  else:
                      print("Skipping PCAP bucket deletion, cloudformation stack is not deleting.")

                  sendResponseCfn(event, context, "SUCCESS")
              except Exception as e:
                  print(e)
                  sendResponseCfn(event, context, "FAILED")
          def sendResponseCfn(event, context, responseStatus):
              response_body = {'Status': responseStatus,
                              'Reason': 'Log stream name: ' + context.log_stream_name,
                              'PhysicalResourceId': context.log_stream_name,
                              'StackId': event['StackId'],
                              'RequestId': event['RequestId'],
                              'LogicalResourceId': event['LogicalResourceId'],
                              'Data': json.loads("{}")}

              json_response_body = json.dumps(response_body)
              headers = {
                  'content-type' : '',
                  'content-length' : str(len(json_response_body))
              }

              try:
                  http = urllib3.PoolManager()
                  response = http.request('PUT', event['ResponseURL'], headers=headers, body=json_response_body)
                  print("Status code:", response.status)

              except Exception as e:
                  print("send(..) failed executing http.request(..):", e)

              #requests.put(event['ResponseURL'], data=json.dumps(response_body))

      Description: cleanup Bucket on Delete Lambda function.
      FunctionName: !Sub
        - "${ShortID}-vSensor-PCAPS-Cleanup"
        - ShortID: !If
          - GenerateShortID
          - !GetAtt ShortIDRand.IDString
          - !Ref ShortID
      Handler: index.lambda_handler
      Role: !GetAtt CleanupBucketOnDeleteLambdaRole.Arn
      Runtime: python3.14
      Timeout: 60
      Tags:
        - Key: darktrace-vsensor-quickstart
          Value: !If
            - GenerateShortID
            - !GetAtt ShortIDRand.IDString
            - !Ref ShortID
      TracingConfig:
        Mode: Active

  CleanupBucketOnDeleteLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: CreatePCAPStorage
    Properties:
      LogGroupName: !Sub "/aws/lambda/${CleanupBucketOnDeleteLambda}"
      RetentionInDays: !Ref LogGroupRetention

  CleanupBucketOnDeleteLambdaLogPermissions:
    Type: AWS::IAM::Policy
    Condition: CreatePCAPStorage
    Properties:
      Roles:
        - !Ref CleanupBucketOnDeleteLambdaRole
      PolicyName: !Sub "${ShortID}-vSensor-PCAPS-Cleanup-LambdaLogGroup"
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action:
          - logs:CreateLogStream
          - logs:PutLogEvents
          Resource:
          - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${CleanupBucketOnDeleteLambda}"
          - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${CleanupBucketOnDeleteLambda}:*"
          - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${CleanupBucketOnDeleteLambda}:*:*"

  PCAPCleanupBucketOnDelete:
    Type: AWS::CloudFormation::CustomResource
    Condition: CreatePCAPStorage
    Properties:
      ServiceToken:
        Fn::GetAtt:
          - "CleanupBucketOnDeleteLambda"
          - "Arn"
      BucketName: !Ref PCAPS

# LoadBalancer

  LoadBalancer:
    Type: 'AWS::ElasticLoadBalancingV2::LoadBalancer'
    Properties:
      Name:
        !Sub
          - "${ShortID}-vSensor-Balancer"
          - ShortID: !If
            - GenerateShortID
            - !GetAtt ShortIDRand.IDString
            - !Ref ShortID
      LoadBalancerAttributes:
        - Key: load_balancing.cross_zone.enabled
          Value: !If
            - "AllowCrossZoneLB"
            - "true"
            - "false"
      Subnets: !Ref Subnets
      Scheme: internal
      Type: network

  LoadBalancerListenerUDP6081:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
       - Type: "forward"
         TargetGroupArn: !Ref TargetGroupUDP6081
      LoadBalancerArn: !Ref LoadBalancer
      Port: 6081
      Protocol: 'UDP'

  LoadBalancerListenerUDP4789:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
       - Type: "forward"
         TargetGroupArn: !Ref TargetGroupUDP4789
      LoadBalancerArn: !Ref LoadBalancer
      Port: 4789
      Protocol: 'UDP'

  LoadBalancerListenerTCP443:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
       - Type: "forward"
         TargetGroupArn: !Ref TargetGroupTCP443
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: 'TCP'

  LoadBalancerListenerTCP80:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
       - Type: "forward"
         TargetGroupArn: !Ref TargetGroupTCP80
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: 'TCP'

# vSensor IAM

  vSensorIamInstanceProfile:
    Type: 'AWS::IAM::InstanceProfile'
    Properties:
      Roles:
        - Ref: vSensorIamRole
      InstanceProfileName:
        !Sub
          - "${ShortID}-vSensor-IAM-Instance-Profile"
          - ShortID: !If
            - GenerateShortID
            - !GetAtt ShortIDRand.IDString
            - !Ref ShortID

  vSensorIamRole:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName:
        !Sub
          - "${ShortID}-vSensor-IAM-Role"
          - ShortID: !If
            - GenerateShortID
            - !GetAtt ShortIDRand.IDString
            - !Ref ShortID
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/CloudWatchAgentServerPolicy"
      Policies:
        - Fn::If:
          - CreatePCAPStorage
          - PolicyName: ListPCAPBucket
            PolicyDocument:
              Version: 2012-10-17
              Statement:
              - Effect: Allow
                Action:
                  - 's3:ListBucket'
                  - 's3:GetBucketLocation'
                  - 's3:GetLifecycleConfiguration'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${PCAPS}'
          - !Ref AWS::NoValue
        - Fn::If:
          - CreatePCAPStorage
          - PolicyName: AccessPCAPBucket
            PolicyDocument:
              Version: 2012-10-17
              Statement:
              - Effect: Allow
                Action:
                  - 's3:PutObject'
                  - 's3:GetObject'
                  - 's3:DeleteObject'
                  - 's3:PutObjectTagging'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${PCAPS}/*'
          - !Ref AWS::NoValue
        - PolicyName: "CompleteLifecycleActionAllowPolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Action: "autoscaling:CompleteLifecycleAction"
                Resource: !Sub
                  - "arn:${AWS::Partition}:autoscaling:${AWS::Region}:${AWS::AccountId}:autoScalingGroup:*:autoScalingGroupName/${AutoScalingGroupName}"
                  - AutoScalingGroupName: !Sub
                    - "${ShortID}-vSensor-ASG"
                    - ShortID: !If
                      - GenerateShortID
                      - !GetAtt ShortIDRand.IDString
                      - !Ref ShortID
        - PolicyName: "AllowSourceDestCheckModificationPolicy"
          PolicyDocument:
            Statement:
            - Effect: "Allow"
              Action: "ec2:ModifyInstanceAttribute"
              Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
        - PolicyName: "AllowSSMParameterReads"
          PolicyDocument:
            Statement:
            - Effect: "Allow"
              Action:
                - "ssm:GetParameter"
                - "ssm:GetParameters"
              Resource:
                # Remove double slashes caused by SSM parameter names containing a leading slash
                !If
                  - UsingSSMARNs
                  - - !Ref VsensorUpdatekey
                    - !Ref DarktraceInstanceHostname
                    - !Ref DarktraceInstancePushtoken
                    - !Ref DarktraceInstanceProxy
                    - !Ref osSensorHMAC
                  - - !Join ["/", !Split ["//", !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${VsensorUpdatekey}"]]
                    - !Join ["/", !Split ["//", !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${DarktraceInstanceHostname}"]]
                    - !Join ["/", !Split ["//", !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${DarktraceInstancePushtoken}"]]
                    - !Join ["/", !Split ["//", !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${DarktraceInstanceProxy}"]]
                    - !Join ["/", !Split ["//", !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${osSensorHMAC}"]]
        - PolicyName: "AllowEncryptedCloudWatchLogging"
          PolicyDocument:
            Statement:
              - Effect: "Allow"
                Action:
                  - "logs:DescribeLogGroups"
                Resource:
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*"
        - !If
          - AllowSessionsManager
          - PolicyName: "AllowSSMSessions"
            PolicyDocument:
              Statement:
              - Effect: "Allow"
                Action:
                  - "ssmmessages:CreateControlChannel"
                  - "ssmmessages:CreateDataChannel"
                  - "ssmmessages:OpenControlChannel"
                  - "ssmmessages:OpenDataChannel"
                Resource: "*"
              - Effect: "Allow"
                Action:
                  - "s3:GetEncryptionConfiguration"
                Resource: !Sub "arn:${AWS::Partition}:s3:::*"
              - Effect: "Allow"
                Action:
                  - "ssm:UpdateInstanceInformation"
                Resource: "*"
              - Effect: "Allow"
                Action:
                  - "kms:Decrypt"
                Resource:
                  - !GetAtt vSensorLogKMSKey.Arn
          - Ref: AWS::NoValue

  SessionsManagerDocument:
    Type: AWS::SSM::Document
    Condition: AllowSessionsManager
    Properties:
      Name:
        !Sub
          - "${ShortID}-vSensor-SSM-Session-Settings"
          - ShortID: !If
            - GenerateShortID
            - !GetAtt ShortIDRand.IDString
            - !Ref ShortID
      DocumentFormat: YAML
      DocumentType: Session
      Content:
        schemaVersion: "1.0"
        description: Session Manager logging settings document for using Session Manager to connect to vSensors
        sessionType: "Standard_Stream"
        inputs:
          s3BucketName: ""
          s3KeyPrefix: ""
          s3EncryptionEnabled: true
          cloudWatchLogGroupName: !Ref vSensorLogGroup
          cloudWatchEncryptionEnabled: true
          idleSessionTimeout: "20"
          maxSessionDuration: ""
          cloudWatchStreamingEnabled: true
          kmsKeyId: !Ref vSensorLogKMSKey
          runAsEnabled: false
          runAsDefaultUser: ""
          shellProfile:
            linux: "TOKEN=`curl -X PUT \"http://169.254.169.254/latest/api/token\" -H \"X-aws-ec2-metadata-token-ttl-seconds: 120\" -s`\nINSTANCE_ID=`curl -H \"X-aws-ec2-metadata-token: $TOKEN\" http://169.254.169.254/latest/meta-data/instance-id -s`\nDATE=`date --iso-8601='ns'`\necho \"\"\necho \"\"; echo \"#######################################################\"; echo \"#                                                     #\"; echo \"# Session start: $DATE  #\"; echo \"#                                                     #\"; echo \"# Instance ID:  $INSTANCE_ID                   #\"; echo \"#                                                     #\";  echo \"#######################################################\"\necho \"\""
            windows: ""

Outputs:
  BucketName:
    Condition: CreatePCAPStorage
    Description: Name of the PCAP S3 bucket.
    Value: !Ref PCAPS

  LoadBalancer:
    Description: Network Load Balancer, required for osSensor clients.
    Value: !Ref LoadBalancer

  LoadBalancerDNS:
    Description: DNS name of the Network Load Balancer, required for osSensor clients.
    Value: !GetAtt LoadBalancer.DNSName

  LoadBalancerDNSZoneID:
    Description: Route 53 hosted zone name of the Network Load Balancer, required for osSensor clients.
    Value: !GetAtt LoadBalancer.CanonicalHostedZoneID

  TrafficMirrorFilterId:
    Description: ID of the Traffic Mirror filter generated for Traffic Mirror sessions.
    Value: !Ref TrafficMirrorFilter

  TrafficMirrorTargetId:
    Description: ID of the Traffic Mirror target generated for Traffic Mirror sessions.
    Value: !Ref TrafficMirrorTarget

  SessionManagerPreferences:
    Condition: AllowSessionsManager
    Description: Session Manager logging settings document for using Session Manager to connect to vSensors.
    Value: !Ref SessionsManagerDocument

  SessionManagerKMSKeyId:
    Condition: AllowSessionsManager
    Description: When using the web-based Session Manager terminal, you must set your preferences with this KMS Key ID for encryption to be enabled.
    Value: !GetAtt vSensorLogKMSKey.KeyId

  Postdeployment:
    Description: See the deployment guide for post-deployment steps.
    Value: https://github.com/darktrace/aws-vsensor-quickstart/blob/main/README.md