AWSTemplateFormatVersion: 2010-09-09
Description: SSM Automation document for creating a pre-upgrade WordPress AMI.

Resources:
  PreStageSnapshotDocument:
    Type: AWS::SSM::Document
    Properties:
      Name: Wordpress-PreStageSnapshot
      DocumentType: Automation
      DocumentFormat: YAML
      UpdateMethod: NewVersion
      Content:
        schemaVersion: '0.3'
        description: Create an AMI from the current WordPress EC2 instance before a stage upgrade.
        assumeRole: '{{ AutomationAssumeRole }}'
        parameters:
          AutomationAssumeRole:
            type: String
            description: IAM role ARN that allows the automation to call EC2 CreateImage and CreateTags.
          InstanceId:
            type: String
            description: EC2 instance ID to image.
          SourceStage:
            type: String
            default: stage
            description: Stage whose EC2 instance is being imaged, for example stage1, stage2, or stage3.
          SourceStackName:
            type: String
            default: manual
            description: Root stack name to tag on the created AMI and snapshot.
          NoReboot:
            type: Boolean
            default: false
            description: Set true for crash-consistent image without reboot.
        mainSteps:
          - name: createImage
            action: aws:executeAwsApi
            nextStep: tagImage
            isEnd: false
            inputs:
              Service: ec2
              Api: CreateImage
              InstanceId: '{{ InstanceId }}'
              Name: '{{ SourceStage }}-ami-{{ automation:EXECUTION_ID }}'
              NoReboot: '{{ NoReboot }}'
              TagSpecifications:
                - ResourceType: image
                  Tags:
                    - Key: Name
                      Value: '{{ SourceStage }}-ami'
                    - Key: SourceStack
                      Value: '{{ SourceStackName }}'
                    - Key: SourceInstanceId
                      Value: '{{ InstanceId }}'
                - ResourceType: snapshot
                  Tags:
                    - Key: Name
                      Value: '{{ SourceStage }}-snapshot'
                    - Key: SourceStack
                      Value: '{{ SourceStackName }}'
                    - Key: SourceInstanceId
                      Value: '{{ InstanceId }}'
            outputs:
              - Name: ImageId
                Selector: $.ImageId
                Type: String
          - name: tagImage
            action: aws:executeAwsApi
            nextStep: waitForImageAvailable
            isEnd: false
            inputs:
              Service: ec2
              Api: CreateTags
              Resources:
                - '{{ createImage.ImageId }}'
              Tags:
                - Key: Name
                  Value: '{{ SourceStage }}-ami'
                - Key: SourceStack
                  Value: '{{ SourceStackName }}'
                - Key: SourceInstanceId
                  Value: '{{ InstanceId }}'
          - name: waitForImageAvailable
            action: aws:waitForAwsResourceProperty
            timeoutSeconds: 1800
            isEnd: true
            inputs:
              Service: ec2
              Api: DescribeImages
              ImageIds:
                - '{{ createImage.ImageId }}'
              PropertySelector: $.Images[0].State
              DesiredValues:
                - available
        outputs:
          - createImage.ImageId

Outputs:
  DocumentName:
    Value: !Ref PreStageSnapshotDocument