AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  LMI Blog — Use Case 2: Data Aggregation ETL (GraalVM Native Image)

Globals:
  Function:
    Tracing: Active
    CodeUri: target/native-zip.zip
    Handler: org.springframework.cloud.function.adapter.aws.FunctionInvoker::handleRequest
    Runtime: provided.al2023
    Timeout: 120
    MemorySize: 1024
    Architectures: [arm64]
    Environment:
      Variables:
        SENSOR_TABLE_NAME: !Ref SensorTable
        OUTPUT_BUCKET_NAME: !Ref OutputBucket
        MAIN_CLASS: com.aws.lmi.etl.DataAggregationApplication

Resources:
  AggregationApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Name: lmi-blog-etl-native

  AggregateDataFunction:
    Type: AWS::Serverless::Function
    Properties:
      Environment:
        Variables:
          SPRING_CLOUD_FUNCTION_DEFINITION: dataAggregatorFunction
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref SensorTable
        - S3CrudPolicy:
            BucketName: !Ref OutputBucket
      Events:
        PostAggregate:
          Type: Api
          Properties:
            RestApiId: !Ref AggregationApi
            Path: /aggregate
            Method: post

  SensorTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-sensors"
      AttributeDefinitions:
        - AttributeName: deviceId
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: deviceId
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST

  OutputBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-output-${AWS::AccountId}"
      LifecycleConfiguration:
        Rules:
          - Id: Cleanup
            Status: Enabled
            ExpirationInDays: 7

Outputs:
  ApiEndpoint:
    Value: !Sub "https://${AggregationApi}.execute-api.${AWS::Region}.amazonaws.com/prod/aggregate"
  SensorTableName:
    Value: !Ref SensorTable