AWSTemplateFormatVersion: "2010-09-09"
Description: "CloudFormation template for IAM roles and instance profile supporting CodeDeploy and CodePipeline release pipeline demo"

Parameters:
  EnvironmentName:
    Type: String
    Default: "Demo"
    Description: "Environment name for resource naming"
  PipelineArtifactBucketName:
    Type: String
    Default: "codepipeline-artifacts-demo"
    Description: "Name of the S3 bucket for pipeline artifacts"

Resources:
  # EC2 Instance Role and Instance Profile
  EC2InstanceRole:
    Type: "AWS::IAM::Role"
    Properties:
      RoleName: !Sub "${EnvironmentName}-EC2InstanceRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess
      Path: "/"

  EC2InstanceProfile:
    Type: "AWS::IAM::InstanceProfile"
    Properties:
      InstanceProfileName: !Sub "${EnvironmentName}-EC2InstanceProfile"
      Roles:
        - !Ref EC2InstanceRole

  # CodeDeploy Service Role
  CodeDeployServiceRole:
    Type: "AWS::IAM::Role"
    Properties:
      RoleName: !Sub "${EnvironmentName}-CodeDeployServiceRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - !Sub "codedeploy.${AWS::Region}.amazonaws.com"
            Action: sts:AssumeRole
      Policies:
        - PolicyName: "CodeDeployPolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeInstanceStatus
                  - autoscaling:CompleteLifecycleAction
                  - autoscaling:RecordLifecycleActionHeartbeat
                  - autoscaling:DescribeAutoScalingGroups
                  - autoscaling:DescribeLifecycleHooks
                  - autoscaling:DescribeTags
                Resource: "*"
      Path: "/"

  # CodePipeline Service Role
  CodePipelineServiceRole:
    Type: "AWS::IAM::Role"
    Properties:
      RoleName: !Sub "${EnvironmentName}-CodePipelineServiceRole"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: "CodePipelinePolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:GetBucketVersioning
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${PipelineArtifactBucketName}"
                  - !Sub "arn:aws:s3:::${PipelineArtifactBucketName}/*"
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource: "*"
                Condition:
                  StringEquals:
                    iam:PassedToService:
                      - elasticbeanstalk.amazonaws.com
                      - ec2.amazonaws.com
                      - elasticloadbalancing.amazonaws.com
                      - autoscaling.amazonaws.com
                      - cloudwatch.amazonaws.com
                      - s3.amazonaws.com
                      - cloudformation.amazonaws.com
                      - rds.amazonaws.com
                      - sqs.amazonaws.com
                      - ecs.amazonaws.com
                      - codedeploy.amazonaws.com
                      - lambda.amazonaws.com
              - Effect: Allow
                Action:
                  - elasticbeanstalk:*
                  - ec2:*
                  - elasticloadbalancing:*
                  - autoscaling:*
                  - cloudwatch:*
                  - cloudformation:*
                  - rds:*
                  - sqs:*
                  - ecs:*
                  - codedeploy:*
                  - lambda:*
                Resource: "*"
      Path: "/"

Outputs:
  EC2InstanceRoleArn:
    Description: "ARN of the EC2 instance role"
    Value: !GetAtt EC2InstanceRole.Arn
  EC2InstanceProfileName:
    Description: "Name of the EC2 instance profile"
    Value: !Ref EC2InstanceProfile
  CodeDeployServiceRoleArn:
    Description: "ARN of the CodeDeploy service role"
    Value: !GetAtt CodeDeployServiceRole.Arn
  CodePipelineServiceRoleArn:
    Description: "ARN of the CodePipeline service role"
    Value: !GetAtt CodePipelineServiceRole.Arn