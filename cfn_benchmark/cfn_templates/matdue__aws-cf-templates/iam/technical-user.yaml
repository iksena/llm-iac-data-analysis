AWSTemplateFormatVersion: '2010-09-09'
Description: 'Policies for technical users'

Parameters:
  Username:
    Description: The user name
    Type: String
    Default: ''

Conditions:
  HasUsername: !Not [!Equals [!Ref Username, '']]

Resources:
  CloudFormationAssumedRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: Permissions-for-technical-user
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  # Whenever you add a permission, please add related permissions, too.
                  # For example, if you add CreateXxx, do so for DeleteXxx, UpdateXxx, ModifyXxx and so on,
                  # because a stack will be modified or deleted at some time.
                  # https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_actions-resources-contextkeys.html
                  # contains a list of all available actions.
                  - 'acm:*'
                  #- 'apigateway:*'
                  - 'apigateway:DELETE'
                  - 'apigateway:GET'
                  - 'apigateway:PATCH'
                  - 'apigateway:POST'
                  - 'apigateway:PUT'
                  - 'apigateway:TagResource'
                  - 'apigateway:UpdateRestApiPolicy'
                  #- 'batch:*'
                  - 'batch:CreateComputeEnvironment'
                  - 'batch:CreateJobQueue'
                  - 'batch:DeleteComputeEnvironment'
                  - 'batch:DeleteJobQueue'
                  - 'batch:DeregisterJobDefinition'
                  - 'batch:DescribeComputeEnvironments'
                  - 'batch:DescribeJobDefinitions'
                  - 'batch:DescribeJobQueues'
                  - 'batch:ListTagsForResource'
                  - 'batch:RegisterJobDefinition'
                  - 'batch:TagResource'
                  - 'batch:UntagResource'
                  - 'batch:UpdateComputeEnvironment'
                  - 'batch:UpdateJobQueue'
                  - 'cloudformation:*'
                  - 'cloudfront:*'
                  #- 'cloudwatch:*'
                  - 'cloudwatch:DeleteAlarms'
                  - 'cloudwatch:DeleteDashboards'
                  - 'cloudwatch:DescribeAlarms'
                  - 'cloudwatch:GetDashboard'
                  - 'cloudwatch:PutDashboard'
                  - 'cloudwatch:PutMetricAlarm'
                  - 'cognito-idp:*'
                  #- 'ec2:*'
                  - 'ec2:AllocateAddress'
                  - 'ec2:AssociateAddress'
                  - 'ec2:AssociateRouteTable'
                  - 'ec2:AssociateSubnetCidrBlock'
                  - 'ec2:AssociateVpcCidrBlock'
                  - 'ec2:AttachInternetGateway'
                  - 'ec2:AuthorizeSecurityGroupEgress'
                  - 'ec2:AuthorizeSecurityGroupIngress'
                  - 'ec2:CreateDefaultSubnet'
                  - 'ec2:CreateEgressOnlyInternetGateway'
                  - 'ec2:CreateInternetGateway'
                  - 'ec2:CreateNatGateway'
                  - 'ec2:CreateNetworkAcl'
                  - 'ec2:CreateNetworkAclEntry'
                  - 'ec2:CreateNetworkInterface'
                  - 'ec2:CreateRoute'
                  - 'ec2:CreateRouteTable'
                  - 'ec2:CreateSecurityGroup'
                  - 'ec2:CreateSubnet'
                  - 'ec2:CreateTags'
                  - 'ec2:CreateVpc'
                  - 'ec2:CreateVpcEndpoint'
                  - 'ec2:DeleteEgressOnlyInternetGateway'
                  - 'ec2:DeleteInternetGateway'
                  - 'ec2:DeleteNatGateway'
                  - 'ec2:DeleteNetworkAcl'
                  - 'ec2:DeleteNetworkAclEntry'
                  - 'ec2:DeleteNetworkInterface'
                  - 'ec2:DeleteRoute'
                  - 'ec2:DeleteRouteTable'
                  - 'ec2:DeleteSecurityGroup'
                  - 'ec2:DeleteSubnet'
                  - 'ec2:DeleteTags'
                  - 'ec2:DeleteVpc'
                  - 'ec2:DeleteVpcEndpoints'
                  - 'ec2:DescribeAccountAttributes'
                  - 'ec2:DescribeAddresses'
                  - 'ec2:DescribeAvailabilityZones'
                  - 'ec2:DescribeEgressOnlyInternetGateways'
                  - 'ec2:DescribeInternetGateways'
                  - 'ec2:DescribeNatGateways'
                  - 'ec2:DescribeNetworkAcls'
                  - 'ec2:DescribeNetworkInterfaces'
                  - 'ec2:DescribeRouteTables'
                  - 'ec2:DescribeSecurityGroups'
                  - 'ec2:DescribeSubnets'
                  - 'ec2:DescribeTags'
                  - 'ec2:DescribeVpcAttribute'
                  - 'ec2:DescribeVpcs'
                  - 'ec2:DescribeVpcEndpoints'
                  - 'ec2:DetachInternetGateway'
                  - 'ec2:DisassociateAddress'
                  - 'ec2:DisassociateRouteTable'
                  - 'ec2:DisassociateSubnetCidrBlock'
                  - 'ec2:DisassociateVpcCidrBlock'
                  - 'ec2:ModifySubnetAttribute'
                  - 'ec2:ModifyVpcAttribute'
                  - 'ec2:ReleaseAddress'
                  - 'ec2:ReplaceNetworkAclAssociation'
                  - 'ec2:ReplaceNetworkAclEntry'
                  - 'ec2:ReplaceRoute'
                  - 'ec2:ReplaceRouteTableAssociation'
                  - 'ec2:RevokeSecurityGroupEgress'
                  - 'ec2:RevokeSecurityGroupIngress'
                  - 'ec2:UpdateSecurityGroupRuleDescriptionsEgress'
                  - 'ec2:UpdateSecurityGroupRuleDescriptionsIngress'
                  #- 'ecr:*'
                  - 'ecr:CreateRepository'
                  - 'ecr:DeleteLifecyclePolicy'
                  - 'ecr:DeleteRepository'
                  - 'ecr:DeleteRepositoryPolicy'
                  - 'ecr:DescribeRepositories'
                  - 'ecr:GetLifecyclePolicy'
