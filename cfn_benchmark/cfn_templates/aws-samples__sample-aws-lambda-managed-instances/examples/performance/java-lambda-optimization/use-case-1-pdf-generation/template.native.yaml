AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  LMI Blog — Use Case 1: PDF Report Generation (GraalVM Native Image)

Globals:
  Function:
    Tracing: Active
    CodeUri: target/native-zip.zip
    Handler: org.springframework.cloud.function.adapter.aws.FunctionInvoker::handleRequest
    Runtime: provided.al2023
    Timeout: 60
    MemorySize: 1024
    Architectures:
      - arm64
    Environment:
      Variables:
        TRANSACTION_TABLE_NAME: !Ref TransactionsTable
        REPORT_BUCKET_NAME: !Ref ReportBucket
        MAIN_CLASS: com.aws.lmi.pdf.PdfGenerationApplication

Resources:
  ReportApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Name: lmi-blog-pdf-native

  GenerateReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      Environment:
        Variables:
          SPRING_CLOUD_FUNCTION_DEFINITION: pdfGeneratorFunction
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TransactionsTable
        - S3CrudPolicy:
            BucketName: !Ref ReportBucket
      Events:
        PostReport:
          Type: Api
          Properties:
            RestApiId: !Ref ReportApi
            Path: /reports
            Method: post

  TransactionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-transactions"
      AttributeDefinitions:
        - AttributeName: accountId
          AttributeType: S
        - AttributeName: transactionId
          AttributeType: S
      KeySchema:
        - AttributeName: accountId
          KeyType: HASH
        - AttributeName: transactionId
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST

  ReportBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-reports-${AWS::AccountId}"
      LifecycleConfiguration:
        Rules:
          - Id: CleanupOldReports
            Status: Enabled
            ExpirationInDays: 7

Outputs:
  ApiEndpoint:
    Value: !Sub "https://${ReportApi}.execute-api.${AWS::Region}.amazonaws.com/prod/reports"
  TransactionsTableName:
    Value: !Ref TransactionsTable
  ReportBucketName:
    Value: !Ref ReportBucket