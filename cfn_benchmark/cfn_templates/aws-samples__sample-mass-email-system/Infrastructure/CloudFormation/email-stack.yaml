      Code:
        ZipFile: |
          import json
          import os
          import decimal
          import boto3
          import logging
          from datetime import datetime

          # Configure logging
          logger = logging.getLogger()
          logger.setLevel(getattr(logging, os.environ.get('LOG_LEVEL', 'WARN').upper(), logging.WARNING))

          # Custom JSON encoder to handle Decimal types
          class DecimalEncoder(json.JSONEncoder):
              def default(self, obj):
                  if isinstance(obj, decimal.Decimal):
                      return int(obj) if obj % 1 == 0 else float(obj)
                  return super(DecimalEncoder, self).default(obj)

          def lambda_handler(event, context):
              """
              Lambda function to check if a single batch has completed processing
              Uses campaign-specific DynamoDB tables
              """
              # Log identifying fields only, consistent with the rest of the system.
              logger.info(
                  f"Checking batch status: batchId={event.get('batchId')} "
                  f"campaignId={event.get('campaignId')} "
                  f"waitIterations={event.get('waitIterations', 0)}"
              )

              # Get parameters from event
              batch_id = event.get('batchId')
              campaign_id = event.get('campaignId')
              batch_table_name = event.get('batchTrackingTable')
              recipient_table_name = event.get('recipientTrackingTable')
              total_messages = event.get('totalMessages', 0)
              wait_iterations = event.get('waitIterations', 0)
              max_wait_minutes = event.get('maxWaitMinutes', 600)

              # Store all input parameters for later use
              input_params = {
                  'batchId': batch_id,
                  'campaignId': campaign_id,
                  'recipientTrackingTable': recipient_table_name,
                  'batchTrackingTable': batch_table_name,
                  'totalMessages': total_messages,
                  'waitIterations': wait_iterations,
                  'maxWaitMinutes': max_wait_minutes
              }

              # Validate required parameters
              if not batch_id or not batch_table_name:
                  logger.error("Missing required batch ID or table name")
                  result = {
                      'statusCode': 400,
                      'error': 'No batch ID or table name provided',
                      'isComplete': False,
                      'shouldContinue': False
                  }
                  # Add all input parameters to the result
                  return {**result, **input_params}

              # Calculate max iterations
              check_interval_seconds = 60
              max_iterations = (max_wait_minutes * 60) // check_interval_seconds

              if wait_iterations >= max_iterations:
                  logger.warning(f"Reached maximum wait time for batch {batch_id}")
                  result = {
                      'statusCode': 408,
                      'message': 'Timeout waiting for batch to complete',
                      'isComplete': False,
                      'shouldContinue': False
                  }
                  return {**result, **input_params}

              # Get AWS clients
              dynamodb = boto3.resource('dynamodb')

              try:
                  batch_table = dynamodb.Table(batch_table_name)

                  # Get batch info from DynamoDB
                  batch_info = batch_table.get_item(Key={'BatchId': batch_id}).get('Item')

                  if not batch_info:
                      logger.error(f"Batch {batch_id} not found in table {batch_table_name}")
                      result = {
                          'statusCode': 404,
                          'error': f"Batch {batch_id} not found",
                          'isComplete': False,
                          'shouldContinue': False
                      }
                      return {**result, **input_params}

                  # Convert Decimal types to int/float
                  queued_count = int(batch_info.get('QueuedCount', 0)) if isinstance(batch_info.get('QueuedCount'), decimal.Decimal) else batch_info.get('QueuedCount', 0)
                  success_count = int(batch_info.get('SentCount', 0)) if isinstance(batch_info.get('SentCount'), decimal.Decimal) else batch_info.get('SentCount', 0)
                  failed_count = int(batch_info.get('FailedCount', 0)) if isinstance(batch_info.get('FailedCount'), decimal.Decimal) else batch_info.get('FailedCount', 0)

                  total_processed = success_count + failed_count

                  # Process batch status and return appropriate result
                  if total_processed >= queued_count and queued_count > 0:
                      # All messages processed
                      final_status = 'COMPLETED' if failed_count == 0 else 'COMPLETED_WITH_ERRORS'

                      # Update batch status
                      batch_table.update_item(
                          Key={'BatchId': batch_id},
                          UpdateExpression="SET #status = :status, ProcessingEndTime = :endTime",
                          ExpressionAttributeNames={'#status': 'Status'},
                          ExpressionAttributeValues={
                              ':status': final_status,
                              ':endTime': datetime.now().isoformat()
                          }
                      )

                      result = {
                          'statusCode': 200,
                          'message': 'Batch processing complete',
                          'status': final_status,
                          'sentCount': success_count,
                          'failedCount': failed_count,
                          'totalCount': queued_count,
                          'isComplete': True,
                          'shouldContinue': False
                      }
                      return {**result, **input_params}
                  else:
                      # Still processing or empty batch
                      remaining = queued_count - total_processed
                      progress = (total_processed * 100) // queued_count if queued_count > 0 else 0

                      result = {
                          'statusCode': 202,
                          'message': 'Batch still processing',
                          'progress': f"{progress}%",
                          'sent': success_count,
                          'failed': failed_count,
                          'remaining': remaining,
                          'isComplete': False,
                          'shouldContinue': True,
                          'waitIterations': wait_iterations + 1  # Increment wait iterations
                      }
                      return {**result, **input_params}

              except Exception as e:
                  logger.error(f"Error checking batch status: {str(e)}", exc_info=True)
                  result = {
                      'statusCode': 500,
                      'error': str(e),
                      'isComplete': False,
                      'shouldContinue': wait_iterations < max_iterations
                  }
                  return {**result, **input_params}
