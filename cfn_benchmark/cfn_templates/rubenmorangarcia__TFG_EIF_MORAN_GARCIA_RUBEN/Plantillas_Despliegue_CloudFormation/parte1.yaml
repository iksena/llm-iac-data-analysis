Description: Parte 1 - Despliegue inicial de VPCs para red híbrida con inspección centralizada

Resources:

  # VPC IPv6 Pro
  VPCIPv6Only:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.10.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: VPC_IPv6_Only

  IPv6BlockIPv6Only:
    Type: AWS::EC2::VPCCidrBlock
    Properties:
      VpcId: !Ref VPCIPv6Only
      AmazonProvidedIpv6CidrBlock: true

   # VPC Dual Stack Pro
  VPCDualStackPro:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: VPC_DualStack_Pro

  IPv6BlockDualStackPro:
    Type: AWS::EC2::VPCCidrBlock
    Properties:
      VpcId: !Ref VPCDualStackPro
      AmazonProvidedIpv6CidrBlock: true

  # VPC de inspección Norte (Dual Stack)
  VPCInspeccionNorte:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.30.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: VPC_Inspeccion_Norte

  IPv6BlockInspeccionNorte:
    Type: AWS::EC2::VPCCidrBlock
    Properties:
      VpcId: !Ref VPCInspeccionNorte
      AmazonProvidedIpv6CidrBlock: true

  # VPC de inspección Este (Dual Stack)
  VPCInspeccionEste:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.40.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: VPC_Inspeccion_Este

  IPv6BlockInspeccionEste:
    Type: AWS::EC2::VPCCidrBlock
    Properties:
      VpcId: !Ref VPCInspeccionEste
      AmazonProvidedIpv6CidrBlock: true

  # VPC Inspección Oeste (Dual Stack)
  VPCInspeccionOeste:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.50.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: VPC_Inspeccion_Oeste

  IPv6BlockInspeccionOeste:
    Type: AWS::EC2::VPCCidrBlock
    Properties:
      VpcId: !Ref VPCInspeccionOeste
      AmazonProvidedIpv6CidrBlock: true

  # VPC On-Premise simulada (IPv4-only)
  VPCOnPremise:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 172.16.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: VPC_OnPremise

Outputs:

  VPCIPv6OnlyId:
    Value: !Ref VPCIPv6Only
    Export:
      Name: VPCIPv6OnlyId

  VPCDualStackProId:
    Value: !Ref VPCDualStackPro
    Export:
      Name: VPCDualStackProId

  VPCInspeccionNorteId:
    Value: !Ref VPCInspeccionNorte
    Export:
      Name: VPCInspeccionNorteId

  VPCInspeccionEsteId:
    Value: !Ref VPCInspeccionEste
    Export:
      Name: VPCInspeccionEsteId

  VPCInspeccionOesteId:
    Value: !Ref VPCInspeccionOeste
    Export:
      Name: VPCInspeccionOesteId

  VPCOnPremiseId:
    Value: !Ref VPCOnPremise
    Export:
      Name: VPCOnPremiseId