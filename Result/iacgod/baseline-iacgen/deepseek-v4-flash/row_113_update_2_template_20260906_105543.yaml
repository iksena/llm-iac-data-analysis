AWSTemplateFormatVersion: "2010-09-09"
Parameters:
  ScriptBucketName:
    Type: String
    Description: Name of the S3 bucket containing Glue job scripts
  ScriptPathPrefix:
    Type: String
    Default: "glue-scripts/"
    Description: Prefix path for scripts within the script bucket
Resources:
  AdminS3Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "admin-suite-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
  AdminS3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AdminS3Bucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !Sub "arn:aws:s3:::${AdminS3Bucket}"
              - !Sub "arn:aws:s3:::${AdminS3Bucket}/*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"
  MainIAMRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "admin-suite-role-${AWS::AccountId}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - glue.amazonaws.com
                - cloudformation.amazonaws.com
                - firehose.amazonaws.com
                - streams.metrics.cloudwatch.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: admin-suite-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - quicksight:Describe*
                  - quicksight:List*
                  - quicksight:Search*
                  - quicksight:Get*
                Resource: "*"
              - Effect: Allow
                Action:
                  - glue:CreateJob
                  - glue:GetJob
                  - glue:GetJobRun
                  - glue:StartJobRun
                  - glue:UpdateJob
                  - glue:DeleteJob
                  - glue:CreateTrigger
                  - glue:GetTrigger
                  - glue:StartTrigger
                  - glue:UpdateTrigger
                  - glue:DeleteTrigger
                  - glue:PassRole
                Resource: "*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:ListBucket
                  - s3:AbortMultipartUpload
                  - s3:ListMultipartUploadParts
                Resource:
                  - !Sub "arn:aws:s3:::${AdminS3Bucket}"
                  - !Sub "arn:aws:s3:::${AdminS3Bucket}/*"
                  - !Sub "arn:aws:s3:::${ScriptBucketName}"
                  - !Sub "arn:aws:s3:::${ScriptBucketName}/${ScriptPathPrefix}*"
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                  - cloudwatch:ListMetrics
                  - cloudwatch:GetMetricData
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:DescribeAlarms
                Resource: "*"
              - Effect: Allow
                Action:
                  - firehose:PutRecord
                  - firehose:PutRecordBatch
                  - firehose:DescribeDeliveryStream
                  - firehose:ListDeliveryStreams
                Resource: !Sub "arn:aws:firehose:${AWS::Region}:${AWS::AccountId}:deliverystream/admin-suite-*"
              - Effect: Allow
                Action:
                  - iam:PassRole
                  - iam:GetRole
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/admin-suite-role-${AWS::AccountId}"
  GlueJobAssetsAccess:
    Type: AWS::Glue::Job
    Properties:
      Name: etl_job_admin_suite_assets_access
      Role: !GetAtt MainIAMRole.Arn
      Command:
        Name: pythonshell
        PythonVersion: "3.9"
        ScriptLocation: !Sub "s3://${ScriptBucketName}/${ScriptPathPrefix}assets_access.py"
      GlueVersion: "3.0"
      ExecutionProperty:
        MaxConcurrentRuns: 1
      Timeout: 120
      DefaultArguments:
        "--region": !Ref AWS::Region
        "--account-id": !Ref AWS::AccountId
        "--output-bucket": !Ref AdminS3Bucket
  GlueJobAssetsMetadata:
    Type: AWS::Glue::Job
    Properties:
      Name: etl_job_admin_suite_assets_metadata
      Role: !GetAtt MainIAMRole.Arn
      Command:
        Name: pythonshell
        PythonVersion: "3.9"
        ScriptLocation: !Sub "s3://${ScriptBucketName}/${ScriptPathPrefix}assets_metadata.py"
      GlueVersion: "3.0"
      ExecutionProperty:
        MaxConcurrentRuns: 1
      Timeout: 120
      DefaultArguments:
        "--region": !Ref AWS::Region
        "--account-id": !Ref AWS::AccountId
        "--output-bucket": !Ref AdminS3Bucket
  GlueJobFolderAssets:
    Type: AWS::Glue::Job
    Properties:
      Name: etl_job_admin_suite_folder_assets
      Role: !GetAtt MainIAMRole.Arn
      Command:
        Name: pythonshell
        PythonVersion: "3.9"
        ScriptLocation: !Sub "s3://${ScriptBucketName}/${ScriptPathPrefix}folder_assets.py"
      GlueVersion: "3.0"
      ExecutionProperty:
        MaxConcurrentRuns: 1
      Timeout: 120
      DefaultArguments:
        "--region": !Ref AWS::Region
        "--account-id": !Ref AWS::AccountId
        "--output-bucket": !Ref AdminS3Bucket
  GlueJobQMetadata:
    Type: AWS::Glue::Job
    Properties:
      Name: etl_job_admin_suite_q_metadata
      Role: !GetAtt MainIAMRole.Arn
      Command:
        Name: pythonshell
        PythonVersion: "3.9"
        ScriptLocation: !Sub "s3://${ScriptBucketName}/${ScriptPathPrefix}q_metadata.py"
      GlueVersion: "3.0"
      ExecutionProperty:
        MaxConcurrentRuns: 1
      Timeout: 120
      DefaultArguments:
        "--region": !Ref AWS::Region
        "--account-id": !Ref AWS::AccountId
        "--output-bucket": !Ref AdminS3Bucket
  GlueJobQAccess:
    Type: AWS::Glue::Job
    Properties:
      Name: etl_job_admin_suite_q_access
      Role: !GetAtt MainIAMRole.Arn
      Command:
        Name: pythonshell
        PythonVersion: "3.9"
        ScriptLocation: !Sub "s3://${ScriptBucketName}/${ScriptPathPrefix}q_access.py"
      GlueVersion: "3.0"
      ExecutionProperty:
        MaxConcurrentRuns: 1
      Timeout: 120
      DefaultArguments:
        "--region": !Ref AWS::Region
        "--account-id": !Ref AWS::AccountId
        "--output-bucket": !Ref AdminS3Bucket
  GlueJobDsProperties:
    Type: AWS