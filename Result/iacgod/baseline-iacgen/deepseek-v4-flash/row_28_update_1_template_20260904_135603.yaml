AWSTemplateFormatVersion: "2010-09-09"
Description: "CloudFormation template for a Step Functions Calculator demo with Lambda"
Resources:
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaLoggingPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:CreateLogGroup
                Resource: "*"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${CalculatorFunction}"
      RetentionInDays: 3

  CalculatorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: Calculator
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Runtime: nodejs20.x
      Code:
        ZipFile: |
          exports.handler = async (event) => {
            const { operator, operands } = event;
            const [a, b] = operands;
            let result;
            switch (operator) {
              case 'add':
                result = a + b;
                break;
              case 'subtract':
                result = a - b;
                break;
              case 'multiply':
                result = a * b;
                break;
              case 'divide':
                if (b === 0) {
                  throw new Error('Division by zero');
                }
                result = a / b;
                break;
              default:
                throw new Error(`Unknown operator: ${operator}`);
            }
            return { result };
          };
      MemorySize: 128
      Timeout: 10

  StateMachineExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeLambdaPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt CalculatorFunction.Arn

  CalculatorStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: Calculator-StateMachine
      RoleArn: !GetAtt StateMachineExecutionRole.Arn
      DefinitionString: !Sub |
        {
          "Comment": "Calculator State Machine",
          "StartAt": "ChooseOperation",
          "States": {
            "ChooseOperation": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.operator",
                  "StringEquals": "add",
                  "Next": "Addition"
                },
                {
                  "Variable": "$.operator",
                  "StringEquals": "subtract",
                  "Next": "Subtraction"
                },
                {
                  "Variable": "$.operator",
                  "StringEquals": "multiply",
                  "Next": "Multiplication"
                },
                {
                  "Variable": "$.operator",
                  "StringEquals": "divide",
                  "Next": "Division"
                }
              ],
              "Default": "UnknownOperator"
            },
            "Addition": {
              "Type": "Task",
              "Resource": "${CalculatorFunction.Arn}",
              "End": true
            },
            "Subtraction": {
              "Type": "Task",
              "Resource": "${CalculatorFunction.Arn}",
              "End": true
            },
            "Multiplication": {
              "Type": "Task",
              "Resource": "${CalculatorFunction.Arn}",
              "End": true
            },
            "Division": {
              "Type": "Task",
              "Resource": "${CalculatorFunction.Arn}",
              "End": true
            },
            "UnknownOperator": {
              "Type": "Fail",
              "Cause": "Unsupported operator",
              "Error": "UnsupportedOperatorError"
            }
          }
        }

Outputs:
  SampleInput:
    Description: "Sample input format for the Calculator state machine"
    Value: '{"operator": "add", "operands": [1, 2]}'
  StateMachineArn:
    Description: "ARN of the Calculator state machine"
    Value: !Ref CalculatorStateMachine