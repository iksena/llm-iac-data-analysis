AWSTemplateFormatVersion: 2010-09-09
Description: |
  Create an OTEL ECS Daemon Service on an ECS Cluster.
  NOTE: Contains conditional IAM roles (only created for s3 and Parameter Store).
  IAM warning appears even when no IAM resources are created - this is expected and safe to acknowledge.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Basic Configuration"
        Parameters:
          - ClusterName
          - CoralogixRegion
          - CoralogixApiKey
          - SupervisorEnabled
          - CDOTImageVersion
          - SupervisedImageRepository
          - SupervisedImageVersion
          - InitialFallbackConfigs

      - Label:
          default: "S3 Configuration"
        Parameters:
          - S3ConfigBucket
          - S3ConfigKey
          - S3SupervisorConfigKey

      - Label:
          default: "Profiling Configuration"
        Parameters:
          - ProfilingEnabled
          - ProfilingS3ConfigBucket
          - ProfilingS3ConfigKey
          - ProfilingInitialFallbackConfigs
          - ProfilingMemory

      - Label:
          default: "Container Configuration"
        Parameters:
          - Image
          - Memory

      - Label:
          default: "Health Check Configuration"
        Parameters:
          - HealthCheckEnabled
          - HealthCheckInterval
          - HealthCheckTimeout
          - HealthCheckRetries
          - HealthCheckStartPeriod

      - Label:
          default: "IAM Role Configuration"
        Parameters:
          - TaskRoleArn

    ParameterLabels:
      S3ConfigBucket:
        default: "S3 Bucket Name"
      S3ConfigKey:
        default: "S3 Object Key (file path)"
      S3SupervisorConfigKey:
        default: "S3 Supervisor Config Key"
      ProfilingS3ConfigBucket:
        default: "Profiling S3 Bucket Name"
      ProfilingS3ConfigKey:
        default: "Profiling S3 Object Key (file path)"
      ProfilingEnabled:
        default: "Enable Profiling Collector"
      ProfilingInitialFallbackConfigs:
        default: "Profiling Initial Fallback Configurations"
      ProfilingMemory:
        default: "Profiling Memory (MiB)"

      ClusterName:
        default: "ECS Cluster Name"
      CoralogixRegion:
        default: "Coralogix Region"
      CoralogixApiKey:
        default: "Coralogix API Key"
      CDOTImageVersion:
        default: "CDOT Image Version"
      SupervisorEnabled:
        default: "Enable Supervisor"
      SupervisedImageRepository:
        default: "Supervised Image Repository"
      SupervisedImageVersion:
        default: "Supervised Image Version"
      InitialFallbackConfigs:
        default: "Initial Fallback Configurations"
      Image:
        default: "Custom Image (overrides CDOTImageVersion)"
      Memory:
        default: "Memory (MiB)"
      HealthCheckEnabled:
        default: "Enable Health Check"
      HealthCheckInterval:
        default: "Health Check Interval (seconds)"
      HealthCheckTimeout:
        default: "Health Check Timeout (seconds)"
      HealthCheckRetries:
        default: "Health Check Retries"
      HealthCheckStartPeriod:
        default: "Health Check Start Period (seconds)"
      TaskRoleArn:
        default: "Task Role ARN (optional)"

Parameters:
  S3ConfigBucket:
    Type: String
    Description: |
      S3 bucket name containing configuration files. Required in collector mode and when
      InitialFallbackConfigs or ProfilingInitialFallbackConfigs is set.
      Fallback URLs must reference this bucket.
      Example: 'my-bucket'
    Default: ""

  S3ConfigKey:
    Type: String
    Description: |
      S3 object key for the collector configuration. Required in collector mode.
      Example: 'configs/otel-config.yaml'
    Default: ""

  S3SupervisorConfigKey:
    Type: String
    Description: |
      S3 object key for the Supervisor configuration.
      Leave empty in supervised mode to use the embedded configuration.
    Default: ""

  ProfilingS3ConfigBucket:
    Type: String
    Description: |
      S3 bucket name containing the profiling configuration file.
      Required when profiling is enabled in collector mode. Optional in supervised mode.
    Default: ""

  ProfilingS3ConfigKey:
    Type: String
    Description: |
      S3 object key (file path) for the profiling configuration file.
      Required when profiling is enabled in collector mode. Optional in supervised mode.
    Default: ""

  ProfilingInitialFallbackConfigs:
    Type: CommaDelimitedList
    Description: |
      Initial Supervisor fallback configuration URLs for the profiling agent, written as a comma-separated list.
      Example: s3://<BUCKET>.s3.<REGION>.amazonaws.com/<ACCOUNT_ID>/<GROUP_NAME>/<COLLECTOR_VERSION>/<REMOTE_CONFIG_NAME>/config.yaml
    Default: ""

  ClusterName:
    Description: |
      Name of the ECS Cluster onto which to deploy the OTEL Daemon Service.
    Type: String
    AllowedPattern: ".+"
    ConstraintDescription: "ECS cluster name is required."

  CDOTImageVersion:
    Description: |
      The Coralogix Distribution OpenTelemetry Image Version/Tag.
      View available tags here: https://hub.docker.com/r/coralogixrepo/coralogix-otel-collector/tags
      This is required when Custom Image is set to "none".
    Type: String

  SupervisorEnabled:
    Type: String
    Description: Run the collectors through the Supervisor.
    AllowedValues: ["true", "false"]
    Default: "false"

  SupervisedImageRepository:
    Type: String
    Description: Supervised CDOT image repository.
    Default: cgx.jfrog.io/coralogix-docker-images/coralogix-otel-supervised-cdot
    AllowedPattern: ".+"
    ConstraintDescription: Supervised image repository is required.

  SupervisedImageVersion:
    Type: String
    Description: Supervised CDOT image version/tag.
    Default: v0.11.0
    AllowedPattern: ".+"
    ConstraintDescription: Supervised image version is required.

  InitialFallbackConfigs:
    Type: CommaDelimitedList
    Description: |
      Initial Supervisor fallback configuration URLs for the main collector agent, written as a comma-separated list.
      Example: s3://<BUCKET>.s3.<REGION>.amazonaws.com/<ACCOUNT_ID>/<GROUP_NAME>/<COLLECTOR_VERSION>/<REMOTE_CONFIG_NAME>/config.yaml
    Default: ""

  Image:
    Description: |
      The OpenTelemetry Collector Image to use.
      If specified, this value will override the CDOTImageVersion parameter and
      the coralogix otel collector image.
    Default: "none"
    Type: String

  Memory:
    Description: |
      The amount of memory (in MiB) used by the task.
      Note that you cluster must have sufficient memory available to support the given value.
    Type: Number
    Default: "2048"

  ProfilingMemory:
    Description: |
      The amount of memory (in MiB) used by the profiling task.
    Type: Number
    Default: "512"

  ProfilingEnabled:
    Type: String
    Description: Enable separate profiling collector service.
    AllowedValues: ["true", "false"]
    Default: "false"

  CoralogixRegion:
      Type: String
      Description: "The Coralogix location region [EU1|EU2|AP1|AP2|AP3|US1|US2|US3]"
      AllowedValues:
        - EU1
        - EU2
        - AP1
        - AP2
        - AP3
        - US1
        - US2
        - US3

  CoralogixApiKey:
    Type: String
    Description: "The Send-Your-Data API key for your Coralogix account. See: https://coralogix.com/docs/user-guides/account-management/api-keys/send-your-data-api-key/"
    NoEcho: true
    AllowedPattern: ".+"
    ConstraintDescription: "API Key required."

  HealthCheckEnabled:
    Type: String
    Description: Enable ECS container health check for the OTEL agent container.
    AllowedValues: ["true", "false"]
    Default: "false"

  HealthCheckInterval:
    Type: Number
    Description: Health check interval (seconds). Only used if HealthCheckEnabled is true
    Default: "30"

  HealthCheckTimeout:
    Type: Number
    Description: Health check timeout (seconds). Only used if HealthCheckEnabled is true
    Default: "5"

  HealthCheckRetries:
    Type: Number
    Description: Health check retries. Only used if HealthCheckEnabled is true
    Default: "3"

  HealthCheckStartPeriod:
    Type: Number
    Description: Health check start period (seconds). Only used if HealthCheckEnabled is true
    Default: "10"

  TaskRoleArn:
    Type: String
    Description: |
      Optional ARN of the task role (IAM role) that the container can assume.
      If not provided, a minimal task role with S3 read permissions will be auto-created.
      This is separate from the execution role which is used by ECS to pull images and retrieve secrets.
    Default: ""

Rules:
  CollectorModeRequiresS3Config:
    RuleCondition: !Equals [!Ref SupervisorEnabled, "false"]
    Assertions:
      - Assert: !And
          - !Not [!Equals [!Ref S3ConfigBucket, ""]]
          - !Not [!Equals [!Ref S3ConfigKey, ""]]
        AssertDescription: "S3ConfigBucket and S3ConfigKey are required in collector mode."

  InitialFallbackConfigsRequireS3Bucket:
    Assertions:
      - Assert: !Or
          - !EachMemberEquals [!Ref InitialFallbackConfigs, ""]
          - !Not [!Equals [!Ref S3ConfigBucket, ""]]
        AssertDescription: "S3ConfigBucket is required when InitialFallbackConfigs is set."

  ProfilingInitialFallbackConfigsRequireS3Bucket:
    Assertions:
      - Assert: !Or
          - !EachMemberEquals [!Ref ProfilingInitialFallbackConfigs, ""]
          - !Not [!Equals [!Ref S3ConfigBucket, ""]]
        AssertDescription: "S3ConfigBucket is required when ProfilingInitialFallbackConfigs is set."

  ProfilingS3ConfigRequired:
    RuleCondition: !And
      - !Equals [!Ref ProfilingEnabled, "true"]
      - !Equals [!Ref SupervisorEnabled, "false"]
    Assertions:
      - Assert: !Not [!Equals [!Ref ProfilingS3ConfigBucket, ""]]
        AssertDescription: "ProfilingS3ConfigBucket is required when profiling is enabled in collector mode."
      - Assert: !Not [!Equals [!Ref ProfilingS3ConfigKey, ""]]
        AssertDescription: "ProfilingS3ConfigKey is required when profiling is enabled in collector mode."

Conditions:
  UseImage: !Not [!Equals [!Ref Image, "none"]]
  UseSupervisedImage: !Equals [!Ref SupervisorEnabled, "true"]
  UseS3CollectorConfig: !And
    - !Not [!Equals [!Ref S3ConfigBucket, ""]]
    - !Not [!Equals [!Ref S3ConfigKey, ""]]
  UseS3SupervisorConfig: !And
    - !Condition UseSupervisedImage
    - !Not [!Equals [!Ref S3ConfigBucket, ""]]
    - !Not [!Equals [!Ref S3SupervisorConfigKey, ""]]
  UseS3ProfilingConfig: !And
    - !Condition EnableProfiling
    - !Not [!Equals [!Ref ProfilingS3ConfigBucket, ""]]
    - !Not [!Equals [!Ref ProfilingS3ConfigKey, ""]]
  UseInitialFallbackConfigs: !Not
    - !Equals
      - !Join ["", !Ref InitialFallbackConfigs]
      - ""
  UseProfilingInitialFallbackConfigs: !Not
    - !Equals
      - !Join ["", !Ref ProfilingInitialFallbackConfigs]
      - ""
  UseMainS3Bucket: !Or
    - !Condition UseS3CollectorConfig
    - !Condition UseS3SupervisorConfig
    - !Condition UseInitialFallbackConfigs
    - !Condition UseProfilingInitialFallbackConfigs
  UseAnyS3Config: !Or
    - !Condition UseMainS3Bucket
    - !Condition UseS3ProfilingConfig
  EnableHealthCheck: !Equals [!Ref HealthCheckEnabled, "true"]
  UseCustomTaskRole: !Not [!Equals [!Ref TaskRoleArn, ""]]
  CreateTaskRole: !And
    - !Equals [!Ref TaskRoleArn, ""]
    - !Condition UseAnyS3Config
  EnableProfiling: !Equals [!Ref ProfilingEnabled, "true"]

Mappings:
  CoralogixRegionMap:
    EU1:
      Endpoint: ingress.eu1.coralogix.com:443
      Domain: eu1.coralogix.com
    EU2:
      Endpoint: ingress.eu2.coralogix.com:443
      Domain: eu2.coralogix.com
    AP1:
      Endpoint: ingress.ap1.coralogix.com:443
      Domain: ap1.coralogix.com
    AP2:
      Endpoint: ingress.ap2.coralogix.com:443
      Domain: ap2.coralogix.com
    AP3:
      Endpoint: ingress.ap3.coralogix.com:443
      Domain: ap3.coralogix.com
    US1:
      Endpoint: ingress.us1.coralogix.com:443
      Domain: us1.coralogix.com
    US2:
      Endpoint: ingress.us2.coralogix.com:443
      Domain: us2.coralogix.com

    US3:
      Endpoint: ingress.us3.coralogix.com:443
      Domain: us3.coralogix.com

Resources:
  OtelTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      ExecutionRoleArn: !Ref OtelTaskExecutionRole
      TaskRoleArn: !If
        - UseCustomTaskRole
        - !Ref TaskRoleArn
        - !If [CreateTaskRole, !Ref OtelTaskRole, !Ref AWS::NoValue]
      Family: opentelemetry
      RequiresCompatibilities:
        - EC2
      NetworkMode: host
      Volumes:
        - Name: otel-config

        - Name: hostfs
          Host:
            SourcePath: "/var/lib/docker/"

        - Name: docker-socket
          Host:
            SourcePath: /var/run/docker.sock

      ContainerDefinitions:
        - Name: config-loader
          Essential: false
          MemoryReservation: 32
          Image: public.ecr.aws/aws-cli/aws-cli:2.28.17
          EntryPoint:
            - sh
            - -c
          Command:
            - |
              set -e
              if [ -n "$S3_CONFIG_BUCKET" ] && [ -n "$S3_CONFIG_KEY" ]; then
                aws s3 cp "s3://$S3_CONFIG_BUCKET/$S3_CONFIG_KEY" /otel-config/collector-config.yaml
              elif [ "$SUPERVISOR_ENABLED" = "true" ]; then
                printf '%s\n' "$COLLECTOR_CONFIG" > /otel-config/collector-config.yaml
              else
                echo "S3_CONFIG_BUCKET and S3_CONFIG_KEY are required in collector mode" >&2
                exit 1
              fi
              if [ "$SUPERVISOR_ENABLED" = "true" ]; then
                if [ -n "$S3_CONFIG_BUCKET" ] && [ -n "$S3_SUPERVISOR_CONFIG_KEY" ]; then
                  aws s3 cp "s3://$S3_CONFIG_BUCKET/$S3_SUPERVISOR_CONFIG_KEY" /otel-config/supervisor.yaml
                else
                  printf '%s\n' "$SUPERVISOR_CONFIG" > /otel-config/supervisor.yaml
                fi
              fi
          Environment:
            - Name: SUPERVISOR_ENABLED
              Value: !Ref SupervisorEnabled
            - Name: S3_CONFIG_BUCKET
              Value: !Ref S3ConfigBucket
            - Name: S3_CONFIG_KEY
              Value: !Ref S3ConfigKey
            - Name: S3_SUPERVISOR_CONFIG_KEY
              Value: !Ref S3SupervisorConfigKey
            - !If
              - UseSupervisedImage
              - Name: COLLECTOR_CONFIG
                Value: |-
                  receivers:
                    nop:

                  exporters:
                    nop:

                  extensions:
                    health_check:
                      endpoint: "localhost:13133"

                  service:
                    extensions:
                      - health_check
                    telemetry:
                      logs:
                        encoding: json
                    pipelines:
                      traces:
                        receivers: [nop]
                        exporters: [nop]
                      metrics:
                        receivers: [nop]
                        exporters: [nop]
                      logs:
                        receivers: [nop]
                        exporters: [nop]
              - !Ref AWS::NoValue
            - !If
              - UseSupervisedImage
              - Name: SUPERVISOR_CONFIG
                Value:
                  Fn::Sub:
                    - |-
                      server:
                        endpoint: "https://ingress.${!env:CORALOGIX_DOMAIN}/opamp/v1"
                        headers:
                          Authorization: "Bearer ${!env:CORALOGIX_PRIVATE_KEY}"
                        tls:
                          insecure_skip_verify: false

                      capabilities:
                        reports_effective_config: true
                        reports_own_metrics: true
                        reports_own_logs: true
                        reports_own_traces: true
                        reports_health: true
                        accepts_remote_config: true
                        reports_remote_config: true

                      agent:
                        executable: /cdot
                        passthrough_logs: true
                        args: ["--feature-gates=+service.profilesSupport"]
                        config_files:
                          - /otel-config/collector-config.yaml
                        initial_fallback_configs: [${FallbackConfigs}]

                      storage:
                        directory: /etc/otelcol-contrib/supervisor-data/

                      telemetry:
                        logs:
                          level: info
                    - FallbackConfigs: !Join [", ", !Ref InitialFallbackConfigs]
              - !Ref AWS::NoValue
          MountPoints:
            - SourceVolume: otel-config
              ContainerPath: /otel-config

        - Name: coralogix-otel-agent
          Cpu: 0
          Memory: !Ref Memory
          EntryPoint: !If
            - UseSupervisedImage
            - [sh, -c]
            - !Ref AWS::NoValue
          Command: !If
            - UseSupervisedImage
            - ["exec /opampsupervisor -config /otel-config/supervisor.yaml"]
            - ["--config", "/otel-config/collector-config.yaml"]
          Image: !If
            - UseSupervisedImage
            - !Sub "${SupervisedImageRepository}:${SupervisedImageVersion}"
            - !If
              - UseImage
              - !Ref Image
              - !Sub "coralogixrepo/coralogix-otel-collector:${CDOTImageVersion}"

          Essential: true
          User: !If [UseSupervisedImage, "0", !Ref AWS::NoValue]
          DependsOn:
            - ContainerName: config-loader
              Condition: SUCCESS
          HealthCheck: !If
            - EnableHealthCheck
            - Command:
                - "/healthcheck"
              Interval: !Ref HealthCheckInterval
              Timeout: !Ref HealthCheckTimeout
              Retries: !Ref HealthCheckRetries
              StartPeriod: !Ref HealthCheckStartPeriod
            - !Ref AWS::NoValue

          PortMappings:
            # otel grpc endpoint
            - HostPort: 4317
              Protocol: tcp
              AppProtocol: grpc
              ContainerPort: 4317

            # otel http endpoint
            - HostPort: 4318
              Protocol: tcp
              ContainerPort: 4318

            # otel metrics endpoint
            - HostPort: 8888
              Protocol: tcp
              ContainerPort: 8888

            # pprof extension default port
            - HostPort: 1777
              Protocol: tcp
              ContainerPort: 1777

          # Privileged required to access certain host metrics
          Privileged: true

          MountPoints:
            - SourceVolume: otel-config
              ContainerPath: /otel-config
              ReadOnly: true

            - SourceVolume: hostfs
              ContainerPath: "/hostfs/var/lib/docker"
              ReadOnly: True

            - SourceVolume: docker-socket
              ContainerPath: /var/run/docker.sock

          Environment:
            - Name: CORALOGIX_DOMAIN
              Value: !FindInMap [CoralogixRegionMap, !Ref CoralogixRegion, Domain]

            - Name: CORALOGIX_PRIVATE_KEY
              Value: !Ref CoralogixApiKey

  # IAM Role for task execution (ECS infrastructure operations)
  OtelTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-otel-task-execution-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies: !If
        - UseAnyS3Config
        - - PolicyName: S3ReadAccess
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - s3:GetObject
                    - s3:GetObjectVersion
                  Resource:
                    - !If
                      - UseMainS3Bucket
                      - !Sub "arn:aws:s3:::${S3ConfigBucket}/*"
                      - !Ref AWS::NoValue
                    - !If
                      - UseS3ProfilingConfig
                      - !Sub "arn:aws:s3:::${ProfilingS3ConfigBucket}/*"
                      - !Ref AWS::NoValue
                - Effect: Allow
                  Action:
                    - s3:ListBucket
                  Resource:
                    - !If
                      - UseMainS3Bucket
                      - !Sub "arn:aws:s3:::${S3ConfigBucket}"
                      - !Ref AWS::NoValue
                    - !If
                      - UseS3ProfilingConfig
                      - !Sub "arn:aws:s3:::${ProfilingS3ConfigBucket}"
                      - !Ref AWS::NoValue
        - !Ref AWS::NoValue

  # IAM Role for task runtime (container operations - minimal permissions)
  # Only created if no custom task role is provided
  OtelTaskRole:
    Type: AWS::IAM::Role
    Condition: CreateTaskRole
    Properties:
      RoleName: !Sub "${AWS::StackName}-otel-task-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3ReadAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource:
                  - !If
                    - UseMainS3Bucket
                    - !Sub "arn:aws:s3:::${S3ConfigBucket}/*"
                    - !Ref AWS::NoValue
                  - !If
                    - UseS3ProfilingConfig
                    - !Sub "arn:aws:s3:::${ProfilingS3ConfigBucket}/*"
                    - !Ref AWS::NoValue
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  - !If
                    - UseMainS3Bucket
                    - !Sub "arn:aws:s3:::${S3ConfigBucket}"
                    - !Ref AWS::NoValue
                  - !If
                    - UseS3ProfilingConfig
                    - !Sub "arn:aws:s3:::${ProfilingS3ConfigBucket}"
                    - !Ref AWS::NoValue

  ECSService:
    Type: 'AWS::ECS::Service'
    Properties:
      Cluster: !Ref ClusterName
      LaunchType: EC2
      ServiceName: coralogix-otel-agent
      SchedulingStrategy: DAEMON
      DeploymentConfiguration:
        MaximumPercent: 100
        MinimumHealthyPercent: 0
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      DeploymentController:
        Type: ECS
      ServiceConnectConfiguration:
        Enabled: false
      PlacementStrategies: []
      PlacementConstraints: []
      Tags:
        - Key: 'ecs:service:stackId'
          Value: !Ref 'AWS::StackId'
      EnableECSManagedTags: true
      TaskDefinition: !Ref OtelTaskDefinition

  ProfilingTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Condition: EnableProfiling
    Properties:
      ExecutionRoleArn: !Ref OtelTaskExecutionRole
      TaskRoleArn: !If
        - UseCustomTaskRole
        - !Ref TaskRoleArn
        - !If [CreateTaskRole, !Ref OtelTaskRole, !Ref AWS::NoValue]
      Family: opentelemetry-profiling
      RequiresCompatibilities:
        - EC2
      NetworkMode: bridge
      Volumes:
        - Name: otel-config

        - Name: hostfs
          Host:
            SourcePath: "/var/lib/docker/"

        - Name: docker-socket
          Host:
            SourcePath: /var/run/docker.sock

        - Name: tracefs
          Host:
            SourcePath: /sys/kernel/tracing

        - Name: debugfs
          Host:
            SourcePath: /sys/kernel/debug

      ContainerDefinitions:
        - Name: profiling-config-loader
          Essential: false
          MemoryReservation: 32
          Image: public.ecr.aws/aws-cli/aws-cli:2.28.17
          EntryPoint:
            - sh
            - -c
          Command:
            - |
              set -e
              if [ -n "$PROFILING_S3_CONFIG_BUCKET" ] && [ -n "$PROFILING_S3_CONFIG_KEY" ]; then
                aws s3 cp "s3://$PROFILING_S3_CONFIG_BUCKET/$PROFILING_S3_CONFIG_KEY" /otel-config/collector-config.yaml
              elif [ "$SUPERVISOR_ENABLED" = "true" ]; then
                printf '%s\n' "$COLLECTOR_CONFIG" > /otel-config/collector-config.yaml
              else
                echo "PROFILING_S3_CONFIG_BUCKET and PROFILING_S3_CONFIG_KEY are required in collector mode" >&2
                exit 1
              fi
              if [ "$SUPERVISOR_ENABLED" = "true" ]; then
                printf '%s\n' "$SUPERVISOR_CONFIG" > /otel-config/supervisor.yaml
              fi
          Environment:
            - Name: SUPERVISOR_ENABLED
              Value: !Ref SupervisorEnabled
            - Name: PROFILING_S3_CONFIG_BUCKET
              Value: !Ref ProfilingS3ConfigBucket
            - Name: PROFILING_S3_CONFIG_KEY
              Value: !Ref ProfilingS3ConfigKey
            - !If
              - UseSupervisedImage
              - Name: COLLECTOR_CONFIG
                Value: |-
                  receivers:
                    nop:

                  exporters:
                    nop:

                  extensions:
                    health_check:
                      endpoint: "localhost:13133"

                  service:
                    extensions:
                      - health_check
                    telemetry:
                      logs:
                        encoding: json
                    pipelines:
                      traces:
                        receivers: [nop]
                        exporters: [nop]
                      metrics:
                        receivers: [nop]
                        exporters: [nop]
                      logs:
                        receivers: [nop]
                        exporters: [nop]
              - !Ref AWS::NoValue
            - !If
              - UseSupervisedImage
              - Name: SUPERVISOR_CONFIG
                Value:
                  Fn::Sub:
                    - |-
                      server:
                        endpoint: "https://ingress.${!env:CORALOGIX_DOMAIN}/opamp/v1"
                        headers:
                          Authorization: "Bearer ${!env:CORALOGIX_PRIVATE_KEY}"
                        tls:
                          insecure_skip_verify: false

                      capabilities:
                        reports_effective_config: true
                        reports_own_metrics: true
                        reports_own_logs: true
                        reports_own_traces: true
                        reports_health: true
                        accepts_remote_config: true
                        reports_remote_config: true

                      agent:
                        executable: /cdot
                        passthrough_logs: true
                        args: ["--feature-gates=+service.profilesSupport"]
                        config_files:
                          - /otel-config/collector-config.yaml
                        initial_fallback_configs: [${FallbackConfigs}]

                      storage:
                        directory: /etc/otelcol-contrib/supervisor-data/

                      telemetry:
                        logs:
                          level: info
                    - FallbackConfigs: !Join [", ", !Ref ProfilingInitialFallbackConfigs]
              - !Ref AWS::NoValue
          MountPoints:
            - SourceVolume: otel-config
              ContainerPath: /otel-config

        - Name: coralogix-otel-profiling-agent
          Cpu: 0
          Memory: !Ref ProfilingMemory
          EntryPoint:
            - sh
            - -c
          Command:
            - !If
              - UseSupervisedImage
              - "mkdir -p /sys/kernel/debug /sys/kernel/tracing && mount -t debugfs debugfs /sys/kernel/debug 2>/dev/null || true; mount -t tracefs tracefs /sys/kernel/tracing 2>/dev/null || true; exec /opampsupervisor -config /otel-config/supervisor.yaml"
              - "mkdir -p /sys/kernel/debug /sys/kernel/tracing && mount -t debugfs debugfs /sys/kernel/debug 2>/dev/null || true; mount -t tracefs tracefs /sys/kernel/tracing 2>/dev/null || true; exec /cdot --feature-gates=+service.profilesSupport --config /otel-config/collector-config.yaml"
          Image: !If
            - UseSupervisedImage
            - !Sub "${SupervisedImageRepository}:${SupervisedImageVersion}"
            - !If
              - UseImage
              - !Ref Image
              - !Sub "coralogixrepo/coralogix-otel-collector:${CDOTImageVersion}"

          Essential: true
          User: "0"
          DependsOn:
            - ContainerName: profiling-config-loader
              Condition: SUCCESS
          HealthCheck: !If
            - EnableHealthCheck
            - Command:
                - "/healthcheck"
              Interval: !Ref HealthCheckInterval
              Timeout: !Ref HealthCheckTimeout
              Retries: !Ref HealthCheckRetries
              StartPeriod: !Ref HealthCheckStartPeriod
            - !Ref AWS::NoValue

          Privileged: true

          MountPoints:
            - SourceVolume: otel-config
              ContainerPath: /otel-config
              ReadOnly: true

            - SourceVolume: hostfs
              ContainerPath: "/hostfs/var/lib/docker"
              ReadOnly: True

            - SourceVolume: docker-socket
              ContainerPath: /var/run/docker.sock

            - SourceVolume: tracefs
              ContainerPath: /sys/kernel/tracing
              ReadOnly: True

            - SourceVolume: debugfs
              ContainerPath: /sys/kernel/debug
              ReadOnly: True

          Environment:
            - Name: CORALOGIX_DOMAIN
              Value: !FindInMap [CoralogixRegionMap, !Ref CoralogixRegion, Domain]

            - Name: CORALOGIX_PRIVATE_KEY
              Value: !Ref CoralogixApiKey

  ProfilingECSService:
    Type: 'AWS::ECS::Service'
    Condition: EnableProfiling
    Properties:
      Cluster: !Ref ClusterName
      LaunchType: EC2
      ServiceName: coralogix-otel-profiling-agent
      SchedulingStrategy: DAEMON
      DeploymentConfiguration:
        MaximumPercent: 100
        MinimumHealthyPercent: 0
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      DeploymentController:
        Type: ECS
      ServiceConnectConfiguration:
        Enabled: false
      PlacementStrategies: []
      PlacementConstraints: []
      Tags:
        - Key: 'ecs:service:stackId'
          Value: !Ref 'AWS::StackId'
      EnableECSManagedTags: true
      TaskDefinition: !Ref ProfilingTaskDefinition