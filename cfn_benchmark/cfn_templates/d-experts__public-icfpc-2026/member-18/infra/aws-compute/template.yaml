AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Ephemeral AWS Batch Spot compute environment for ICFPC 2026 exploration.

Parameters:
  MaxVcpus:
    Type: Number
    Default: 640
    MinValue: 1
    MaxValue: 640
    Description: Maximum aggregate vCPUs available to the Spot compute environment.
  ImageTag:
    Type: String
    Default: bootstrap
    AllowedPattern: "^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$"
    Description: Immutable ECR image tag referenced by the Batch job definition.
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Existing public subnets with direct Internet Gateway routes.
  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Existing outbound-only security group in the selected VPC.

Resources:
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireSnapshotsAndResults
            Status: Enabled
            ExpirationInDays: 7
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: icfpc2026
        - Key: Purpose
          Value: agent-compute-artifacts

  ComputeRepository:
    Type: AWS::ECR::Repository
    Properties:
      EmptyOnDelete: true
      EncryptionConfiguration:
        EncryptionType: AES256
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: IMMUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire untagged images after seven days",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 7
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }
      Tags:
        - Key: Project
          Value: icfpc2026
        - Key: Purpose
          Value: agent-compute-image

  JobLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/batch/${AWS::StackName}"
      RetentionInDays: 7
      Tags:
        - Key: Project
          Value: icfpc2026

  ComputeLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              DeleteOnTermination: true
              Encrypted: true
              VolumeSize: 100
              VolumeType: gp3
        MetadataOptions:
          HttpEndpoint: enabled
          HttpPutResponseHopLimit: 2
          HttpTokens: required

  BatchInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role"
      Tags:
        - Key: Project
          Value: icfpc2026

  BatchInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref BatchInstanceRole

  SpotFleetRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - spotfleet.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonEC2SpotFleetTaggingRole"
      Tags:
        - Key: Project
          Value: icfpc2026

  JobExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"
      Tags:
        - Key: Project
          Value: icfpc2026

  JobRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: ArtifactsBucketAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: BucketMetadata
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: !GetAtt ArtifactsBucket.Arn
              - Sid: SnapshotAndResultObjects
                Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "${ArtifactsBucket.Arn}/*"
      Tags:
        - Key: Project
          Value: icfpc2026

  SpotComputeEnvironment:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      ComputeEnvironmentName: !Sub "${AWS::StackName}-spot"
      Type: MANAGED
      State: ENABLED
      ReplaceComputeEnvironment: false
      ComputeResources:
        Type: SPOT
        AllocationStrategy: SPOT_PRICE_CAPACITY_OPTIMIZED
        MinvCpus: 0
        MaxvCpus: !Ref MaxVcpus
        BidPercentage: 100
        InstanceRole: !GetAtt BatchInstanceProfile.Arn
        SpotIamFleetRole: !GetAtt SpotFleetRole.Arn
        SecurityGroupIds:
          - !Ref SecurityGroupId
        Subnets: !Ref SubnetIds
        Ec2Configuration:
          - ImageType: ECS_AL2023
        LaunchTemplate:
          LaunchTemplateId: !Ref ComputeLaunchTemplate
          Version: !GetAtt ComputeLaunchTemplate.LatestVersionNumber
        UpdateToLatestImageVersion: true
        InstanceTypes:
          - c8i.2xlarge
          - c8i.4xlarge
          - c8i.8xlarge
          - c8i.12xlarge
          - c8i.16xlarge
          - c8a.2xlarge
          - c8a.4xlarge
          - c8a.8xlarge
          - c8a.12xlarge
          - c8a.16xlarge
          - c7i.2xlarge
          - c7i.4xlarge
          - c7i.8xlarge
          - c7i.12xlarge
          - c7i.16xlarge
          - c7a.2xlarge
          - c7a.4xlarge
          - c7a.8xlarge
          - c7a.12xlarge
          - c7a.16xlarge
          - c6i.2xlarge
          - c6i.4xlarge
          - c6i.8xlarge
          - c6i.12xlarge
          - c6i.16xlarge
          - c6a.2xlarge
          - c6a.4xlarge
          - c6a.8xlarge
          - c6a.12xlarge
          - c6a.16xlarge
        Tags:
          Project: icfpc2026
          Purpose: agent-compute
      Tags:
        Project: icfpc2026
        Purpose: agent-compute
      UpdatePolicy:
        JobExecutionTimeoutMinutes: 1440
        TerminateJobsOnUpdate: false

  JobQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      JobQueueName: !Sub "${AWS::StackName}-queue"
      Priority: 1
      State: ENABLED
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment: !Ref SpotComputeEnvironment
      Tags:
        Project: icfpc2026

  JobDefinition:
    Type: AWS::Batch::JobDefinition
    Properties:
      JobDefinitionName: !Sub "${AWS::StackName}-job"
      Type: container
      PlatformCapabilities:
        - EC2
      PropagateTags: true
      ContainerProperties:
        Image: !Sub "${ComputeRepository.RepositoryUri}:${ImageTag}"
        ExecutionRoleArn: !GetAtt JobExecutionRole.Arn
        JobRoleArn: !GetAtt JobRole.Arn
        ResourceRequirements:
          - Type: VCPU
            Value: "1"
          - Type: MEMORY
            Value: "2048"
        LinuxParameters:
          InitProcessEnabled: true
        Environment:
          - Name: AWS_DEFAULT_REGION
            Value: !Ref AWS::Region
          - Name: AWS_REGION
            Value: !Ref AWS::Region
          - Name: ICFPC_SNAPSHOT_URI
            Value: ""
          - Name: ICFPC_SNAPSHOT_SHA256
            Value: ""
          - Name: ICFPC_RESULT_PREFIX
            Value: ""
          - Name: ICFPC_COMMAND_B64
            Value: ""
          - Name: ICFPC_COMPUTE_IMAGE
            Value: !Sub "${ComputeRepository.RepositoryUri}:${ImageTag}"
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: !Ref JobLogGroup
            awslogs-region: !Ref AWS::Region
            awslogs-stream-prefix: job
      RetryStrategy:
        Attempts: 3
        EvaluateOnExit:
          - Action: RETRY
            OnStatusReason: "Host EC2*"
          - Action: EXIT
            OnReason: "*"
      Timeout:
        AttemptDurationSeconds: 86400
      Tags:
        Project: icfpc2026

Outputs:
  ComputeEnvironmentArn:
    Description: AWS Batch Spot compute environment ARN.
    Value: !Ref SpotComputeEnvironment
  JobQueueArn:
    Description: AWS Batch job queue ARN used by submit-job.
    Value: !Ref JobQueue
  JobDefinitionArn:
    Description: AWS Batch job definition ARN used by submit-job.
    Value: !Ref JobDefinition
  ArtifactsBucketName:
    Description: S3 bucket for workspace snapshots and result archives.
    Value: !Ref ArtifactsBucket
  EcrRepositoryUri:
    Description: ECR repository URI for the compute image.
    Value: !GetAtt ComputeRepository.RepositoryUri
  ComputeImage:
    Description: Exact ECR image URI and immutable tag used by the job definition.
    Value: !Sub "${ComputeRepository.RepositoryUri}:${ImageTag}"
  LogGroupName:
    Description: CloudWatch Logs group receiving Batch job output.
    Value: !Ref JobLogGroup
  SubnetIds:
    Description: Existing public subnets used by the compute environment.
    Value: !Join [",", !Ref SubnetIds]
  SecurityGroupId:
    Description: Existing outbound-only security group used by workers.
    Value: !Ref SecurityGroupId