AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'Backend Stack - Lambda functions, API Gateway, EventBridge, SNS for Hospitality Insights'

Parameters:
  Environment:
    Type: String
    Description: Environment name
    Default: prod

  ProjectName:
    Type: String
    Description: Project name
    Default: hospitality-insights

  ProjectTag:
    Type: String
    Description: Project tag for all resources
    Default: hospitality-insights

  UserPoolId:
    Type: String
    Description: Cognito User Pool ID for API Gateway authorizer

  UserPoolClientId:
    Type: String
    Description: Cognito User Pool Client ID

  RawPostsStreamArn:
    Type: String
    Description: ARN of RawPosts DynamoDB stream

  AnalysisResultsStreamArn:
    Type: String
    Description: ARN of AnalysisResults DynamoDB stream

  TargetCompany:
    Type: String
    Default: AnyCompany
    Description: Replacement company name for demo data scrubbing

  KeywordReplacementsJson:
    Type: String
    Default: '{}'
    Description: >-
      JSON object mapping source keywords to replacement keywords during scrubbing.
      Example: {"BrandRewards":"Loyalty Program","PropTech":"PMS"}

Globals:
  Function:
    Runtime: python3.14
    Timeout: 300
    MemorySize: 512
    Tracing: Active
    Tags:
      Project: !Ref ProjectTag
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        PROJECT_NAME: !Ref ProjectName

Resources:
  # ============================================================================
  # Bedrock Application Inference Profile
  # ============================================================================

  BedrockSonnetApplicationProfile:
    Type: AWS::Bedrock::ApplicationInferenceProfile
    Properties:
      InferenceProfileName: !Ref ProjectName
      Description: Claude-Sonnet-4.6-profile
      ModelSource:
        CopyFrom: !Sub 'arn:aws:bedrock:${AWS::Region}::inference-profile/us.anthropic.claude-sonnet-4-6'
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref Environment

  # ============================================================================
  # SNS Topics
  # ============================================================================

  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${ProjectName}-alerts-${Environment}'
      DisplayName: Hospitality Insights Alerts
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref Environment

  OutageAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${ProjectName}-outage-alerts-${Environment}'
      DisplayName: Hospitality Insights Outage Alerts
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref Environment

  # ============================================================================
  # Step Functions State Machines
  # ============================================================================

  # Main scraper workflow (scheduled)
  ScraperWorkflowStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub '${ProjectName}-scraper-workflow-${Environment}'
      RoleArn: !GetAtt StepFunctionsExecutionRole.Arn
      TracingConfiguration:
        Enabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref Environment
      DefinitionString: !Sub |
        {
          "Comment": "Complete scraper workflow: scrape -> analyze -> detect alerts",
          "StartAt": "GetEnabledSources",
          "States": {
            "GetEnabledSources": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${ScraperOrchestratorFunction}",
                "Payload": {
                  "action": "list_sources"
                }
              },
              "ResultPath": "$.orchestratorResult",
              "Next": "InvokeScrapersInParallel"
            },
            "InvokeScrapersInParallel": {
              "Type": "Parallel",
              "Branches": [
                {
                  "StartAt": "CheckTwitterEnabled",
                  "States": {
                    "CheckTwitterEnabled": {
                      "Type": "Choice",
                      "Choices": [
                        {
                          "Variable": "$.orchestratorResult.Payload.platforms.twitter",
                          "BooleanEquals": true,
                          "Next": "InvokeTwitterScraper"
                        }
                      ],
                      "Default": "TwitterSkipped"
                    },
                    "InvokeTwitterScraper": {
                      "Type": "Task",
                      "Resource": "arn:aws:states:::lambda:invoke",
                      "Parameters": {
                        "FunctionName": "${ProjectName}-twitter-scraper-${Environment}",
                        "Payload": {
                          "sources.$": "$.orchestratorResult.Payload.sources"
                        }
                      },
                      "End": true
                    },
                    "TwitterSkipped": {
                      "Type": "Pass",
                      "End": true
                    }
                  }
                },
                {
                  "StartAt": "CheckRedditEnabled",
                  "States": {
                    "CheckRedditEnabled": {
                      "Type": "Choice",
                      "Choices": [
                        {
                          "Variable": "$.orchestratorResult.Payload.platforms.reddit",
                          "BooleanEquals": true,
                          "Next": "InvokeRedditScraper"
                        }
                      ],
                      "Default": "RedditSkipped"
                    },
                    "InvokeRedditScraper": {
                      "Type": "Task",
                      "Resource": "arn:aws:states:::lambda:invoke",
                      "Parameters": {
                        "FunctionName": "${ProjectName}-reddit-scraper-${Environment}",
                        "Payload": {
                          "sources.$": "$.orchestratorResult.Payload.sources"
                        }
                      },
                      "End": true
                    },
                    "RedditSkipped": {
                      "Type": "Pass",
                      "End": true
                    }
                  }
                },
                {
                  "StartAt": "CheckTripAdvisorEnabled",
                  "States": {
                    "CheckTripAdvisorEnabled": {
                      "Type": "Choice",
                      "Choices": [
                        {
                          "Variable": "$.orchestratorResult.Payload.platforms.tripadvisor",
                          "BooleanEquals": true,
                          "Next": "InvokeTripAdvisorScraper"
                        }
                      ],
                      "Default": "TripAdvisorSkipped"
                    },
                    "InvokeTripAdvisorScraper": {
                      "Type": "Task",
                      "Resource": "arn:aws:states:::lambda:invoke",
                      "Parameters": {
                        "FunctionName": "${ProjectName}-tripadvisor-scraper-${Environment}",
                        "Payload": {
                          "sources.$": "$.orchestratorResult.Payload.sources"
                        }
                      },
                      "End": true
                    },
                    "TripAdvisorSkipped": {
                      "Type": "Pass",
                      "End": true
                    }
                  }
                }
              ],
              "ResultPath": "$.scrapingResults",
              "Next": "QueryPendingPosts"
            },
            "QueryPendingPosts": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${QueryPendingPostsFunction}"
              },
              "ResultPath": "$.pendingPosts",
              "Next": "CheckPostsExist"
            },
            "CheckPostsExist": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.pendingPosts.Payload.count",
                  "NumericGreaterThan": 0,
                  "Next": "ProcessPostsMap"
                }
              ],
              "Default": "NoPosts"
            },
            "NoPosts": {
              "Type": "Pass",
              "Result": {
                "Payload": {
                  "processed": 0,
                  "filtered": 0,
                  "outages": {}
                }
              },
              "ResultPath": "$.analysisResult",
              "Next": "DetectAlerts"
            },
            "ProcessPostsMap": {
              "Type": "Map",
              "ToleratedFailurePercentage": 10,
              "ItemReader": {
                "Resource": "arn:aws:states:::s3:getObject",
                "ReaderConfig": {
                  "InputType": "JSONL",
                  "MaxItems": 10000
                },
                "Parameters": {
                  "Bucket.$": "$.pendingPosts.Payload.bucket",
                  "Key.$": "$.pendingPosts.Payload.key"
                }
              },
              "MaxConcurrency": 5,
              "ItemProcessor": {
                "ProcessorConfig": {
                  "Mode": "DISTRIBUTED",
                  "ExecutionType": "EXPRESS"
                },
                "StartAt": "CheckToxicity",
                "States": {
                  "CheckToxicity": {
                    "Type": "Task",
                    "Resource": "arn:aws:states:::lambda:invoke",
                    "Parameters": {
                      "FunctionName": "${ToxicityCheckerFunction}",
                      "Payload.$": "$"
                    },
                    "ResultSelector": {
                      "platformSourceId.$": "$.Payload.platformSourceId",
                      "timestampPostId.$": "$.Payload.timestampPostId",
                      "isToxic.$": "$.Payload.isToxic"
                    },
                    "Next": "IsToxic"
                  },
                  "IsToxic": {
                    "Type": "Choice",
                    "Choices": [
                      {
                        "Variable": "$.isToxic",
                        "BooleanEquals": true,
                        "Next": "PostFiltered"
                      }
                    ],
                    "Default": "AnalyzeSentiment"
                  },
                  "PostFiltered": {
                    "Type": "Pass",
                    "Result": {
                      "filtered": true
                    },
                    "End": true
                  },
                  "AnalyzeSentiment": {
                    "Type": "Task",
                    "Resource": "arn:aws:states:::lambda:invoke",
                    "Parameters": {
                      "FunctionName": "${SentimentAnalyzerSingleFunction}",
                      "Payload.$": "$"
                    },
                    "ResultSelector": {
                      "platformSourceId.$": "$.Payload.platformSourceId",
                      "timestampPostId.$": "$.Payload.timestampPostId",
                      "sentiment.$": "$.Payload.sentiment"
                    },
                    "Next": "ClassifyIssue"
                  },
                  "ClassifyIssue": {
                    "Type": "Task",
                    "Resource": "arn:aws:states:::lambda:invoke",
                    "Parameters": {
                      "FunctionName": "${IssueClassifierSingleFunction}",
                      "Payload.$": "$"
                    },
                    "ResultSelector": {
                      "platformSourceId.$": "$.Payload.platformSourceId",
                      "timestampPostId.$": "$.Payload.timestampPostId",
                      "sentiment.$": "$.Payload.sentiment",
                      "issueClassification.$": "$.Payload.issueClassification"
                    },
                    "Next": "StoreResult"
                  },
                  "StoreResult": {
                    "Type": "Task",
                    "Resource": "arn:aws:states:::lambda:invoke",
                    "Parameters": {
                      "FunctionName": "${StoreAnalysisResultFunction}",
                      "Payload.$": "$"
                    },
                    "ResultPath": null,
                    "End": true
                  }
                }
              },
              "ResultPath": null,
              "Next": "AggregateOutages"
            },
            "AggregateOutages": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${AggregateOutagesFunction}",
                "Payload": {}
              },
              "ResultPath": "$.analysisResult",
              "Next": "CheckOutagesDetected"
            },
            "CheckOutagesDetected": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.analysisResult.Payload.hasOutages",
                  "BooleanEquals": true,
                  "Next": "VerifyOutages"
                }
              ],
              "Default": "DetectAlerts"
            },
            "VerifyOutages": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${OutageVerifierFunction}",
                "Payload": {
                  "outagesDetected.$": "$.analysisResult.Payload.outagesDetected"
                }
              },
              "ResultPath": "$.verificationResult",
              "Next": "DetectAlertsWithVerification"
            },
            "DetectAlertsWithVerification": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${AlertDetectorFunction}",
                "Payload": {
                  "action": "check_pending",
                  "outagesDetected.$": "$.verificationResult.Payload.confirmedOutages"
                }
              },
              "ResultPath": "$.alertResult",
              "Next": "FormatSummary"
            },
            "DetectAlerts": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${AlertDetectorFunction}",
                "Payload": {
                  "action": "check_pending",
                  "outagesDetected": {}
                }
              },
              "ResultPath": "$.alertResult",
              "Next": "FormatSummary"
            },
            "FormatSummary": {
              "Type": "Pass",
              "Parameters": {
                "summary": {
                  "totalItemsAdded.$": "$.analysisResult.Payload.processed",
                  "totalFiltered.$": "$.analysisResult.Payload.filtered",
                  "alertsTriggered.$": "$.alertResult.Payload.alertsGenerated"
                }
              },
              "Next": "TriggerDataTransform"
            },
            "TriggerDataTransform": {
              "Type": "Task",
              "Resource": "arn:aws:states:::states:startExecution",
              "Parameters": {
                "StateMachineArn": "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${ProjectName}-data-transform-${Environment}",
                "Input": {
                  "triggeredBy": "scraper-workflow"
                }
              },
              "ResultPath": null,
              "End": true
            }
          }
        }

  # Ad-hoc processing workflow (manual trigger)
  ProcessRawPostsStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub '${ProjectName}-process-raw-posts-${Environment}'
      RoleArn: !GetAtt StepFunctionsExecutionRole.Arn
      TracingConfiguration:
        Enabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectTag
        - Key: Environment
          Value: !Ref Environment
      DefinitionString: !Sub |
        {
          "Comment": "Ad-hoc workflow: analyze pending posts -> detect alerts",
          "StartAt": "QueryPendingPosts",
          "States": {
            "QueryPendingPosts": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${QueryPendingPostsFunction}"
              },
              "ResultPath": "$.pendingPosts",
              "Next": "CheckPostsExist"
            },
            "CheckPostsExist": {
