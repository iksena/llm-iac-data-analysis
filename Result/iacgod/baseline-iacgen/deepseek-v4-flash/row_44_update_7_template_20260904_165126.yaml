AWSTemplateFormatVersion: '2010-09-09'
Parameters:
  ScriptBucketName:
    Type: String
    Default: admin-console-cfn-dataprepare-code
    Description: Name of the S3 bucket to store Glue ETL scripts.
Resources:
  AdminS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'admin-suite-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  AdminS3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AdminS3Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !Sub 'arn:aws:s3:::${AdminS3Bucket}'
              - !Sub 'arn:aws:s3:::${AdminS3Bucket}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'
  ScriptS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref ScriptBucketName
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  ScriptS3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ScriptS3Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !Sub 'arn:aws:s3:::${ScriptS3Bucket}'
              - !Sub 'arn:aws:s3:::${ScriptS3Bucket}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'
  ConsolidatedIAMRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: QuickSightAdminPipelineRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - glue.amazonaws.com
                - firehose.amazonaws.com
                - cloudwatch.amazonaws.com
                - lambda.amazonaws.com
                - cloudformation.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: QuickSightAdminPipelinePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:*
                Resource:
                  - !Sub 'arn:aws:s3:::${AdminS3Bucket}'
                  - !Sub 'arn:aws:s3:::${AdminS3Bucket}/*'
                  - !Sub 'arn:aws:s3:::${ScriptS3Bucket}'
                  - !Sub 'arn:aws:s3:::${ScriptS3Bucket}/*'
              - Effect: Allow
                Action:
                  - glue:*
                Resource: '*'
              - Effect: Allow
                Action:
                  - quicksight:*
                Resource: '*'
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource: '*'
              - Effect: Allow
                Action:
                  - cloudwatch:*
                Resource: '*'
              - Effect: Allow
                Action:
                  - logs:*
                Resource: '*'
              - Effect: Allow
                Action:
                  - firehose:*
                Resource: '*'
              - Effect: Allow
                Action:
                  - lambda:*
                Resource: '*'
  ScriptUploadLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: QuickSightScriptUploader
      Handler: index.lambda_handler
      Runtime: python3.12
      Role: !GetAtt ConsolidatedIAMRole.Arn
      Timeout: 300
      Code:
        ZipFile: |
          import boto3, cfnresponse, json
          def lambda_handler(event, context):
              try:
                  if event['RequestType'] == 'Create':
                      bucket = event['ResourceProperties']['BucketName']
                      s3 = boto3.client('s3')
                      scripts = {
                          'access_management.py': 'import sys\nfrom awsglue.transforms import *\nfrom awsglue.utils import getResolvedOptions\nfrom pyspark.context import SparkContext\nfrom awsglue.context import GlueContext\nfrom awsglue.job import Job\nimport boto3, json\n\nargs = getResolvedOptions(sys.argv, ["JOB_NAME","output_path"])\nsc = SparkContext()\nglueContext = GlueContext(sc)\nspark = glueContext.spark_session\njob = Job(glueContext)\njob.init(args["JOB_NAME"], args)\nquicksight = boto3.client("quicksight")\ndf = spark.createDataFrame([{"user":"admin","action":"login"}])\ndf.write.mode("overwrite").json(args["output_path"])\njob.commit()',
                          'dataset_metadata.py': 'import sys\nfrom awsglue.transforms import *\nfrom awsglue.utils import getResolvedOptions\nfrom pyspark.context import SparkContext\nfrom awsglue.context import GlueContext\nfrom awsglue.job import Job\nimport boto3, json\n\nargs = getResolvedOptions(sys.argv, ["JOB_NAME","output_path"])\nsc = SparkContext()\nglueContext = GlueContext(sc)\nspark = glueContext.spark_session\njob = Job(glueContext)\njob.init(args["JOB_NAME"], args)\nquicksight = boto3.client("quicksight")\ndf = spark.createDataFrame([{"dataset":"sales","size":100}])\ndf.write.mode("overwrite").json(args["output_path"])\njob.commit()',
                          'folder_assets.py': 'import sys\nfrom awsglue.transforms import *\nfrom awsglue.utils import getResolvedOptions\nfrom pyspark.context import SparkContext\nfrom awsglue.context import GlueContext\nfrom awsglue.job import Job\nimport boto3, json\n\nargs = getResolvedOptions(sys.argv, ["JOB_NAME","output_path"])\nsc = SparkContext()\nglueContext = GlueContext(sc)\nspark = glueContext.spark_session\njob = Job(glueContext)\njob.init(args["JOB_NAME"], args)\nquicksight = boto3.client("quicksight")\ndf = spark.createDataFrame([{"folder":"reports","asset":"dashboard1"}])\ndf.write.mode("overwrite").json(args["output_path"])\njob.commit()',
                          'q_metadata.py': 'import sys\nfrom awsglue.transforms import *\nfrom awsglue.utils import getResolvedOptions\nfrom pyspark.context import SparkContext\nfrom awsglue.context import GlueContext\nfrom awsglue.job import Job\nimport boto3, json\n\nargs = getResolvedOptions(sys.argv, ["JOB_NAME","output_path"])\nsc = SparkContext()\nglueContext = GlueContext(sc)\nspark = glueContext.spark_session\njob = Job(glueContext)\njob.init(args["JOB_NAME"], args)\nquicksight = boto3.client("quicksight")\ndf = spark.createDataFrame([{"index":"main","documents":1000}])\ndf.write.mode("overwrite").json(args["output_path"])\njob.commit()',
                          'datasource_properties.py': 'import sys\nfrom awsglue.transforms import *\nfrom awsglue.utils import getResolvedOptions\nfrom pyspark.context import SparkContext\nfrom awsglue.context import GlueContext\nfrom awsglue.job import Job\nimport boto3, json\n\nargs = getResolvedOptions(sys.argv, ["JOB_NAME","output_path"])\nsc = SparkContext()\nglueContext = GlueContext(sc)\nspark = glueContext.spark_session\njob = Job(glueContext)\njob.init(args["JOB_NAME"], args)\nquicksight = boto3.client("quicksight")\ndf = spark.createDataFrame([{"datasource":"rds","type":"mysql"}])\ndf.write.mode("overwrite").json(args["output_path"])\njob.commit()'
                      }
                      for key, content in scripts.items():
                          s3.put_object(Bucket=bucket, Key='scripts/' + key, Body=content)
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
              except Exception as e:
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': str(e)})
      Description: Uploads Glue ETL scripts to the script bucket.
  ScriptUploadCustomResource:
    Type: Custom::ScriptUpload
    Properties:
      ServiceToken: !GetAtt ScriptUploadLambda.Arn
      BucketName: !Ref ScriptBucketName
  GlueJobAccessManagement:
    Type: AWS::Glue::Job
    DependsOn:
      - ScriptUploadCustomResource
    Properties:
      Name: quickSight-access-management
      Role: !GetAtt ConsolidatedIAMRole.Arn
      Command:
        Name: glueetl
        ScriptLocation: !Sub 's3://${ScriptBucketName}/scripts/access_management.py'
        PythonVersion: 3
      GlueVersion: '5.0'
      WorkerType: G.2X
      NumberOfWorkers: 5
      Timeout: 360
      DefaultArguments:
        '--output_path': !Sub 's3://${AdminS3Bucket}/pipeline/access_management/'
  GlueJobDatasetMetadata:
    Type: AWS::Glue::Job
    DependsOn:
      - ScriptUploadCustomResource
    Properties:
      Name: quickSight-dataset-metadata
      Role: !GetAtt ConsolidatedIAMRole.Arn
      Command:
        Name: glueetl
        ScriptLocation: !Sub 's3://${ScriptBucketName}/scripts/dataset_metadata.py'
        PythonVersion: 3
      GlueVersion: '5.0'
      WorkerType: G.1X
      NumberOfWorkers: 2
      Timeout: 240
      DefaultArguments:
        '--output_path': !Sub 's3://${AdminS3Bucket}/pipeline/dataset_metadata/'
  GlueJobFolderAssets:
    Type: AWS::Glue::Job
    DependsOn:
      - ScriptUploadCustomResource
    Properties:
      Name: quickSight-folder-assets
      Role: !GetAtt ConsolidatedIAMRole.Arn
      Command:
        Name: glueetl
        ScriptLocation: !Sub 's3://${ScriptBucketName}/scripts/folder_assets.py'
        PythonVersion: 3
      GlueVersion: '5.0'
      WorkerType: G.1X
      NumberOfWorkers: 2
      Timeout: 240
      DefaultArguments:
        '--output_path': !Sub 's3://${AdminS3Bucket}/pipeline/folder_assets/'
  GlueJobQMetadata:
    Type: AWS::Glue::Job
    DependsOn:
      - ScriptUploadCustomResource
    Properties:
      Name: quickSight-q-metadata
      Role: !GetAtt ConsolidatedIAMRole.Arn
      Command:
        Name: glueetl
        ScriptLocation: !Sub 's3://${ScriptBucketName}/scripts/q_metadata.py'
        PythonVersion: 3
      GlueVersion: '5.0'
      WorkerType: G.1X
      NumberOfWorkers: 2
      Timeout: 240
      DefaultArguments:
        '--output_path': !Sub 's3://${AdminS3Bucket}/pipeline/q_metadata/'
  GlueJobDatasourceProperties:
    Type: AWS::Glue::Job
    DependsOn:
      - ScriptUploadCustomResource
    Properties:
      Name: quickSight-datasource-properties
      Role: !GetAtt ConsolidatedIAMRole.Arn
      Command:
        Name: glueetl
        ScriptLocation: !Sub 's3://${ScriptBucketName}/scripts/datasource_properties.py'
        PythonVersion: 3
      GlueVersion: '5.0'
      WorkerType: G.1X
      NumberOfWorkers: 2
      Timeout: 240
      DefaultArguments:
        '--output_path': !Sub 's3://${AdminS3Bucket}/pipeline/datasource_properties/'
  GlueTriggerAccessManagement:
    Type: AWS::Glue::Trigger
    Properties:
      Name: trigger-access-management
      Type: SCHEDULED
      Schedule: cron(0 2 * * ? *)
      Actions:
        - JobName: !Ref GlueJobAccessManagement
  GlueTriggerDatasetMetadata:
    Type: AWS::Glue::Trigger
    Properties:
      Name: trigger-dataset-metadata
      Type: SCHEDULED
      Schedule: cron(15 2 * * ? *)
      Actions:
        - JobName: !Ref GlueJobDatasetMetadata
  GlueTriggerFolderAssets:
    Type: AWS::Glue::Trigger
    Properties:
      Name: trigger-folder-assets
      Type: SCHEDULED
      Schedule: cron(30 2 * * ? *)
      Actions:
        - JobName: !Ref GlueJobFolderAssets
  GlueTriggerQMetadata:
    Type: AWS::Glue::Trigger
    Properties:
      Name: trigger-q-metadata
      Type: SCHEDULED
      Schedule: cron(45 2 * * ? *)
      Actions:
        - JobName: !Ref GlueJobQMetadata
  GlueTriggerDatasourceProperties:
    Type: AWS::Glue::Trigger
    Properties:
      Name: trigger-datasource-properties
      Type: SCHEDULED
      Schedule: cron(0 3 * * ? *)
      Actions:
        - JobName: !Ref GlueJobDatasourceProperties
  FirehoseDeliveryStreamIngestion:
    Type: AWS::KinesisFirehose::DeliveryStream
    Properties:
      DeliveryStreamName: quickSight-ingestion-metrics
      DeliveryStreamType: DirectPut
      S3DestinationConfiguration:
        BucketARN: !GetAtt AdminS3Bucket.Arn
        Prefix: cloudwatch/ingestion/
        BufferingHints:
          IntervalInSeconds: 60
          SizeInMBs: 5
        CompressionFormat: GZIP
        RoleARN: !GetAtt ConsolidatedIAMRole.Arn
  FirehoseDeliveryStreamDashboard:
    Type: AWS::KinesisFirehose::DeliveryStream
    Properties:
      DeliveryStreamName: quickSight-dashboard-metrics
      DeliveryStreamType: DirectPut
      S3DestinationConfiguration:
        BucketARN: !GetAtt AdminS3Bucket.Arn
        Prefix: cloudwatch/dashboard/
        BufferingHints:
          IntervalInSeconds: 60
          SizeInMBs: 5
        CompressionFormat: GZIP
        RoleARN: !GetAtt ConsolidatedIAMRole.Arn
  FirehoseDeliveryStreamSpice:
    Type: AWS::KinesisFirehose::DeliveryStream
    Properties:
      DeliveryStreamName: quickSight-spice-metrics
      DeliveryStreamType: DirectPut
      S3DestinationConfiguration:
        BucketARN: !GetAtt AdminS3Bucket.Arn
        Prefix: cloudwatch/spice/
        BufferingHints:
          IntervalInSeconds: 60
          SizeInMBs: 5
        CompressionFormat: GZIP
        RoleARN: !GetAtt ConsolidatedIAMRole.Arn
  FirehoseDeliveryStreamQIndex:
    Type: AWS::KinesisFirehose::DeliveryStream
    Properties:
      DeliveryStreamName: quickSight-qindex-metrics
      DeliveryStreamType: DirectPut
      S3DestinationConfiguration:
        BucketARN: !GetAtt AdminS3Bucket.Arn
        Prefix: cloudwatch/qindex/
        BufferingHints:
          IntervalInSeconds: 60
          SizeInMBs: 5
        CompressionFormat: GZIP
        RoleARN: !GetAtt ConsolidatedIAMRole.Arn
  FirehoseDeliveryStreamQAction:
    Type: AWS::KinesisFirehose::DeliveryStream
    Properties:
      DeliveryStreamName: quickSight-qaction-metrics
      DeliveryStreamType: DirectPut
      S3DestinationConfiguration:
        BucketARN: !GetAtt AdminS3Bucket.Arn
        Prefix: cloudwatch/qaction/
        BufferingHints:
          IntervalInSeconds: 60
          SizeInMBs: 5
        CompressionFormat: GZIP
        RoleARN: !GetAtt ConsolidatedIAMRole.Arn
  MetricStreamIngestion:
    Type: AWS::CloudWatch::MetricStream
    Properties:
      Name: quickSight-ingestion-metric-stream
      FirehoseArn: !GetAtt FirehoseDeliveryStreamIngestion.Arn
      RoleArn: !GetAtt ConsolidatedIAMRole.Arn
      OutputFormat: json
      IncludeFilters:
        - Namespace: AWS/QuickSight
          MetricNames:
            - IngestionSuccess
            - IngestionFailure
            - IngestionLatency
            - DatasetCount
  MetricStreamDashboard:
    Type: AWS::CloudWatch::MetricStream
    Properties:
      Name: quickSight-dashboard-metric-stream
      FirehoseArn: !GetAtt FirehoseDeliveryStreamDashboard.Arn
      RoleArn: !GetAtt ConsolidatedIAMRole.Arn
      OutputFormat: json
      IncludeFilters:
        - Namespace: AWS/QuickSight
          MetricNames:
            - DashboardCount
            - VisualCount
            - DashboardViewCount
            - DashboardErrorCount
  MetricStreamSpice:
    Type: AWS::CloudWatch::MetricStream
    Properties:
      Name: quickSight-spice-metric-stream
      FirehoseArn: !GetAtt FirehoseDeliveryStreamSpice.Arn
      RoleArn: !GetAtt ConsolidatedIAMRole.Arn
      OutputFormat: json
      IncludeFilters:
        - Namespace: AWS/QuickSight
          MetricNames:
            - SpiceCapacityUsed
            - SpiceCapacityRemaining
            - SpiceIngestionSuccess
            - SpiceIngestionFailure
  MetricStreamQIndex:
    Type: AWS::CloudWatch::MetricStream
    Properties:
      Name: quickSight-qindex-metric-stream
      FirehoseArn: !GetAtt FirehoseDeliveryStreamQIndex.Arn
      RoleArn: !GetAtt ConsolidatedIAMRole.Arn
      OutputFormat: json
      IncludeFilters:
        - Namespace: AWS/QuickSight
          MetricNames:
            - QIndexDocumentCount
            - QIndexTextSize
            - QIndexUpdateSuccess
            - QIndexUpdateFailure
  MetricStreamQAction:
    Type: AWS::CloudWatch::MetricStream
    Properties:
      Name: quickSight-qaction-metric-stream
      FirehoseArn: !GetAtt FirehoseDeliveryStreamQAction.Arn
      RoleArn: !GetAtt ConsolidatedIAMRole.Arn
      OutputFormat: json
      IncludeFilters:
        - Namespace: AWS/QuickSight
          MetricNames:
            - QActionInvocationCount
            - QActionErrorCount
            - QActionLatency
Outputs:
  AdminBucketName:
    Description: Name of the admin S3 bucket
    Value: !Ref AdminS3Bucket
  ScriptBucketName:
    Description: Name of the script S3 bucket
    Value: !Ref ScriptS3Bucket
  ConsolidatedRoleArn:
    Description: ARN of the consolidated IAM role
    Value: !GetAtt ConsolidatedIAMRole.Arn
  GlueJobAccessManagementName:
    Description: Name of the access management Glue job
    Value: !Ref GlueJobAccessManagement
  GlueJobDatasetMetadataName:
    Description: Name of the dataset metadata Glue job
    Value: !Ref GlueJobDatasetMetadata
  GlueJobFolderAssetsName:
    Description: Name of the folder assets Glue job
    Value: !Ref GlueJobFolderAssets
  GlueJobQMetadataName:
    Description: Name of the Q metadata Glue job
    Value: !Ref GlueJobQMetadata
  GlueJobDatasourcePropertiesName:
    Description: Name of the datasource properties Glue job
    Value: !Ref GlueJobDatasourceProperties