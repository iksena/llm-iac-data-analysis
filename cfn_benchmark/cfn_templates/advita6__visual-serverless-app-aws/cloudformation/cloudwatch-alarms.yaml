AWSTemplateFormatVersion: '2010-09-09'
Description: CloudWatch Alarms for Visual Serverless Application

Parameters:
  Stage:
    Type: String
    Default: dev
  LambdaFunctionName:
    Type: String
    Description: Name of the Lambda function to monitor
  AlarmEmail:
    Type: String
    Description: Email address to receive alarm notifications
  ErrorRateThreshold:
    Type: Number
    Default: 5
    Description: Lambda error rate threshold (percent)
  LatencyThresholdMs:
    Type: Number
    Default: 3000
    Description: API Gateway latency threshold in milliseconds

Resources:
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'serverless-app-alarms-${Stage}'
      Subscription:
        - Endpoint: !Ref AlarmEmail
          Protocol: email

  LambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${LambdaFunctionName}-errors-${Stage}'
      AlarmDescription: Lambda function error rate is too high
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref LambdaFunctionName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: !Ref ErrorRateThreshold
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref AlarmTopic
      TreatMissingData: notBreaching

  LambdaThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${LambdaFunctionName}-throttles-${Stage}'
      AlarmDescription: Lambda function is being throttled
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref LambdaFunctionName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref AlarmTopic

  LambdaDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${LambdaFunctionName}-duration-${Stage}'
      AlarmDescription: Lambda function duration is approaching timeout
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref LambdaFunctionName
      Statistic: p95
      Period: 300
      EvaluationPeriods: 2
      Threshold: 25000
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref AlarmTopic

  ApiGateway5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'api-gateway-5xx-errors-${Stage}'
      AlarmDescription: API Gateway 5xx error rate is too high
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref AlarmTopic

  ApiGatewayLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'api-gateway-latency-${Stage}'
      AlarmDescription: API Gateway p99 latency is too high
      Namespace: AWS/ApiGateway
      MetricName: IntegrationLatency
      Statistic: p99
      Period: 300
      EvaluationPeriods: 3
      Threshold: !Ref LatencyThresholdMs
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref AlarmTopic

Outputs:
  AlarmTopicArn:
    Description: SNS topic ARN for alarm notifications
    Value: !Ref AlarmTopic