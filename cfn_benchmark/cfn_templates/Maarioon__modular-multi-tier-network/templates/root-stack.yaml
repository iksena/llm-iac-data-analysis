AWSTemplateFormatVersion: '2010-09-09'
Description: >
  The "Modular Multi-Tier Network" root stack. Composes three
  independently-authored child templates (network, app, database)
  using AWS::CloudFormation::Stack (nested stacks). Each child stack's
  Outputs feed directly into the next child stack's Parameters,
  demonstrating how CloudFormation wires modular templates together
  natively - the CloudFormation equivalent of calling Terraform modules.

Parameters:
  EnvironmentName:
    Type: String
    Default: nested-network
  TemplateBucketUrl:
    Type: String
    Description: >
      Base HTTPS URL of the S3 bucket/prefix where network-tier.yaml,
      app-tier.yaml, and db-tier.yaml have been uploaded (e.g.
      https://your-bucket.s3.amazonaws.com/templates). CloudFormation
      requires child templates to be fetched from S3, not read from a
      local path - see README for the upload step.
  DBUsername:
    Type: String
    NoEcho: true
  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 8

Resources:
  NetworkStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "${TemplateBucketUrl}/network-tier.yaml"
      Parameters:
        EnvironmentName: !Ref EnvironmentName

  AppStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: NetworkStack
    Properties:
      TemplateURL: !Sub "${TemplateBucketUrl}/app-tier.yaml"
      Parameters:
        EnvironmentName: !Ref EnvironmentName
        VpcId: !GetAtt NetworkStack.Outputs.VpcId
        PublicSubnetIds: !GetAtt NetworkStack.Outputs.PublicSubnetIds

  DatabaseStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: AppStack
    Properties:
      TemplateURL: !Sub "${TemplateBucketUrl}/db-tier.yaml"
      Parameters:
        VpcId: !GetAtt NetworkStack.Outputs.VpcId
        PrivateSubnetIds: !GetAtt NetworkStack.Outputs.PrivateSubnetIds
        AppSecurityGroupId: !GetAtt AppStack.Outputs.SecurityGroupId
        DBUsername: !Ref DBUsername
        DBPassword: !Ref DBPassword

Outputs:
  VpcId:
    Value: !GetAtt NetworkStack.Outputs.VpcId
  AutoScalingGroupName:
    Value: !GetAtt AppStack.Outputs.AutoScalingGroupName
  DatabaseEndpoint:
    Value: !GetAtt DatabaseStack.Outputs.DatabaseEndpoint