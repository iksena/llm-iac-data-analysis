AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: |
  DVA Lab 6.2 — Standard vs Express. Two state machines with the IDENTICAL
  ASL definition, one Standard, one Express. Both invoke the same Lambda.
  Compare execution semantics, history, pricing, and observability.

Resources:

  WorkFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dva-lab-06-02-work
      Runtime: python3.12
      Handler: handler.work
      CodeUri: src/
      Timeout: 5
      MemorySize: 128

  StandardLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/vendedlogs/states/dva-lab-06-02-standard
      RetentionInDays: 7

  ExpressLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/vendedlogs/states/dva-lab-06-02-express
      RetentionInDays: 7

  SfnRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-lambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt WorkFunction.Arn
        - PolicyName: cloudwatch-logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogGroups
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

  StandardStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: dva-lab-06-02-standard
      StateMachineType: STANDARD
      RoleArn: !GetAtt SfnRole.Arn
      LoggingConfiguration:
        Level: ALL
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt StandardLogGroup.Arn
      DefinitionSubstitutions:
        WorkFunctionArn: !GetAtt WorkFunction.Arn
      DefinitionString: |-
        {
          "Comment": "Identical ASL — Standard.",
          "StartAt": "DoWork",
          "States": {
            "DoWork": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${WorkFunctionArn}",
                "Payload.$": "$"
              },
              "ResultSelector": { "result.$": "$.Payload.result" },
              "ResultPath": "$.work",
              "End": true
            }
          }
        }

  # Express requires StartSyncExecution semantics or async; both supported.
  # IMPORTANT: Express must enable logging — without a log group it has no
  # observability. Express does not retain visual history.
  ExpressStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: dva-lab-06-02-express
      StateMachineType: EXPRESS
      RoleArn: !GetAtt SfnRole.Arn
      LoggingConfiguration:
        Level: ALL
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt ExpressLogGroup.Arn
      DefinitionSubstitutions:
        WorkFunctionArn: !GetAtt WorkFunction.Arn
      DefinitionString: |-
        {
          "Comment": "Identical ASL — Express.",
          "StartAt": "DoWork",
          "States": {
            "DoWork": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${WorkFunctionArn}",
                "Payload.$": "$"
              },
              "ResultSelector": { "result.$": "$.Payload.result" },
              "ResultPath": "$.work",
              "End": true
            }
          }
        }

Outputs:
  StandardArn:
    Value: !Ref StandardStateMachine
  ExpressArn:
    Value: !Ref ExpressStateMachine
  StandardLogGroup:
    Value: !Ref StandardLogGroup
  ExpressLogGroup:
    Value: !Ref ExpressLogGroup
  WorkFunctionName:
    Value: !Ref WorkFunction