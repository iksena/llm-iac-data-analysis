---
AWSTemplateFormatVersion: 2010-09-09
Description: Role for SSM Digito-RestoreBackupInAnotherRegion_2020-10-26
Outputs:
  DigitoRestoreEFSBackupInAnotherRegionSOPAssumeRole:
    Description: Digito-RestoreBackupInAnotherRegion_2020-10-26 Automation Assume Role ARN
    Value:
      Fn::GetAtt: DigitoRestoreEFSBackupInAnotherRegionSOPAssumeRole.Arn
Resources:
  DigitoRestoreEFSBackupInAnotherRegionSOPAssumeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ssm.amazonaws.com
            Action:
              - sts:AssumeRole
  DigitoRestoreEFSBackupInAnotherRegionSOPAssumePolicy:
    Type: "AWS::IAM::Policy"
    Properties:
      PolicyName: "DigitoRestoreEFSBackupInAnotherRegionSOPAssumePolicy"
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Resource: "*"
            Action:
              - "backup:StartCopyJob"
              - "backup:DescribeCopyJob"
              - "backup:StartRestoreJob"
              - "backup:DescribeRestoreJob"
              - "backup:StartBackupJob"
              - "backup:DescribeBackupJob"
              - "elasticfilesystem:DescribeFileSystems"
              - "logs:CreateLogStream"
              - "logs:PutLogEvents"
              - "logs:DescribeLogGroups"
              - "logs:DescribeLogStreams"
          - Effect: Allow
            Resource: "*"
            Action:
              - "iam:PassRole"
            Condition:
              StringEquals:
                iam:PassedToService: backup.amazonaws.com
      Roles:
        - Ref: DigitoRestoreEFSBackupInAnotherRegionSOPAssumeRole