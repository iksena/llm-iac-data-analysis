AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: |
  DVA-C02 Lab 2.1 - Shared DynamoDB table with composite key + GSI1 + Streams.
  This stack is reused by Labs 2.2 through 2.6.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 256
    LoggingConfig:
      LogFormat: JSON

Resources:
  SharedTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: dva-lab-02-shared
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: gsi1pk
          AttributeType: S
        - AttributeName: gsi1sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: gsi1pk
              KeyType: HASH
            - AttributeName: gsi1sk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false   # enable in Lab 2.7

  CrudFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dva-lab-02-01-crud
      CodeUri: src/
      Handler: handler.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref SharedTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SharedTable

Outputs:
  TableName:
    Description: Shared table name (used by Labs 2.2-2.6)
    Value: !Ref SharedTable
    Export:
      Name: dva-lab-02-shared-table-name
  TableArn:
    Value: !GetAtt SharedTable.Arn
    Export:
      Name: dva-lab-02-shared-table-arn
  TableStreamArn:
    Description: DynamoDB stream ARN (used by Lab 2.6)
    Value: !GetAtt SharedTable.StreamArn
    Export:
      Name: dva-lab-02-shared-table-stream-arn
  FunctionName:
    Value: !Ref CrudFunction