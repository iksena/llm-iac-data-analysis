AWSTemplateFormatVersion: '2010-09-09'
Resources:
  DynamicApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: dynamic
      BodyS3Location:
        Bucket:
          Ref: BucketName
        Key: openapi/orders.json
  SubApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefinitionUri:
        Fn::Sub: s3://${Bucket}/${Key}