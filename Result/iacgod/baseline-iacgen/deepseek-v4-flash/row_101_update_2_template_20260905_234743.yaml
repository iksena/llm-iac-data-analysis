AWSTemplateFormatVersion: "2010-09-09"
Description: "CloudFormation template for CoWork Telemetry Monitoring - Creates CloudWatch Logs, MetricFilters, and Dashboard"

Parameters:
  DashboardName:
    Type: String
    Default: "CoWork-Telemetry-Dashboard"
    Description: "Name for the CloudWatch dashboard"
  MetricsRegion:
    Type: String
    Default: us-east-1
    Description: "AWS region for metrics and dashboard"
    AllowedPattern: "^[a-z]{2}-[a-z]+-[0-9]{1}$"

Resources:
  CoWorkLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: "/aws/co-work/telemetry"
      RetentionInDays: 30
      Tags:
        - Key: "Application"
          Value: "CoWork"
        - Key: "Purpose"
          Value: "Telemetry"

  MetricFilterInputTokensSchema1:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CoWorkLogGroup
      FilterPattern: "{ $.inputTokens > 0 && $.user != null }"
      MetricTransformations:
        - MetricValue: "$.inputTokens"
          MetricNamespace: "CoWork/Telemetry"
          MetricName: "InputTokens"
          DefaultValue: 0
          Dimensions:
            - Key: "User"
              Value: "$.user"
            - Key: "Model"
              Value: "$.model"

  MetricFilterInputTokensSchema2:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CoWorkLogGroup
      FilterPattern: "{ $.inputTokens > 0 && $.user = null }"
      MetricTransformations:
        - MetricValue: "$.inputTokens"
          MetricNamespace: "CoWork/Telemetry"
          MetricName: "InputTokens"
          DefaultValue: 0
          Dimensions:
            - Key: "User"
              Value: "all_users"
            - Key: "Model"
              Value: "unknown"

  MetricFilterOutputTokensSchema1:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CoWorkLogGroup
      FilterPattern: "{ $.outputTokens > 0 && $.user != null }"
      MetricTransformations:
        - MetricValue: "$.outputTokens"
          MetricNamespace: "CoWork/Telemetry"
          MetricName: "OutputTokens"
          DefaultValue: 0
          Dimensions:
            - Key: "User"
              Value: "$.user"
            - Key: "Model"
              Value: "$.model"

  MetricFilterOutputTokensSchema2:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CoWorkLogGroup
      FilterPattern: "{ $.outputTokens > 0 && $.user = null }"
      MetricTransformations:
        - MetricValue: "$.outputTokens"
          MetricNamespace: "CoWork/Telemetry"
          MetricName: "OutputTokens"
          DefaultValue: 0
          Dimensions:
            - Key: "User"
              Value: "all_users"
            - Key: "Model"
              Value: "unknown"

  MetricFilterCacheReadTokensSchema1:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CoWorkLogGroup
      FilterPattern: "{ $.cacheReadTokens > 0 && $.user != null }"
      MetricTransformations:
        - MetricValue: "$.cacheReadTokens"
          MetricNamespace: "CoWork/Telemetry"
          MetricName: "CacheReadTokens"
          DefaultValue: 0
          Dimensions:
            - Key: "User"
              Value: "$.user"
            - Key: "Model"
              Value: "$.model"

  MetricFilterCacheReadTokensSchema2:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CoWorkLogGroup
      FilterPattern: "{ $.cacheReadTokens > 0 && $.user = null }"
      MetricTransformations:
        - MetricValue: "$.cacheReadTokens"
          MetricNamespace: "CoWork/Telemetry"
          MetricName: "CacheReadTokens"
          DefaultValue: 0
          Dimensions:
            - Key: "User"
              Value: "all_users"
            - Key: "Model"
              Value: "unknown"

  MetricFilterCacheCreationTokensSchema1:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CoWorkLogGroup
      FilterPattern: "{ $.cacheCreationTokens > 0 && $.user != null }"
      MetricTransformations:
        - MetricValue: "$.cacheCreationTokens"
          MetricNamespace: "CoWork/Telemetry"
          MetricName: "CacheCreationTokens"
          DefaultValue: 0
          Dimensions:
            - Key: "User"
              Value: "$.user"
            - Key: "Model"
              Value: "$.model"

  MetricFilterCacheCreationTokensSchema2:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CoWorkLogGroup
      FilterPattern: "{ $.cacheCreationTokens > 0 && $.user = null }"
      MetricTransformations:
        - MetricValue: "$.cacheCreationTokens"
          MetricNamespace: "CoWork/Telemetry"
          MetricName: "CacheCreationTokens"
          DefaultValue: 0
          Dimensions:
            - Key: "User"
              Value: "all_users"
            - Key: "Model"
              Value: "unknown"

  MetricFilterEstimatedCostSchema1:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CoWorkLogGroup
      FilterPattern: "{ $.estimatedCost > 0 && $.user != null }"
      MetricTransformations:
        - MetricValue: "$.estimatedCost"
          MetricNamespace: "CoWork/Telemetry"
          MetricName: "EstimatedCost"
          DefaultValue: 0
          Dimensions:
            - Key: "User"
              Value: "$.user"
            - Key: "Model"
              Value: "$.model"

  MetricFilterEstimatedCostSchema2:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CoWorkLogGroup
      FilterPattern: "{ $.estimatedCost > 0 && $.user = null }"
      MetricTransformations:
        - MetricValue: "$.estimatedCost"
          MetricNamespace: "CoWork/Telemetry"
          MetricName: "EstimatedCost"
          DefaultValue: 0
          Dimensions:
            - Key: "User"
              Value: "all_users"
            - Key: "Model"
              Value: "unknown"

  MetricFilterSessionTurnCountSchema1:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CoWorkLogGroup
      FilterPattern: "{ $.turnNumber > 0 && $.user != null }"
      MetricTransformations:
        - MetricValue: "1"
          MetricNamespace: "CoWork/Telemetry"
          MetricName: "SessionTurnCount"
          DefaultValue: 0
          Dimensions:
            - Key: "User"
              Value: "$.user"
            - Key: "Model"
              Value: "$.model"

  MetricFilterSessionTurnCountSchema2:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CoWorkLogGroup
      FilterPattern: "{ $.turnNumber > 0 && $.user = null }"
      MetricTransformations:
        - MetricValue: "1"
          MetricNamespace: "CoWork/Telemetry"
          MetricName: "SessionTurnCount"
          DefaultValue: 0
          Dimensions:
            - Key: "User"
              Value: "all_users"
            - Key: "Model"
              Value: "unknown"

  MetricFilterInputTokensNoUserDimension:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CoWorkLogGroup
      FilterPattern: "{ $.inputTokens > 0 }"
      MetricTransformations:
        - MetricValue: "$.inputTokens"
          MetricNamespace: "CoWork/Telemetry"
          MetricName: "TotalInputTokens"
          DefaultValue: 0

  MetricFilterOutputTokensNoUserDimension:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CoWorkLogGroup
      FilterPattern: "{ $.outputTokens > 0 }"
      MetricTransformations:
        - MetricValue: "$.outputTokens"
          MetricNamespace: "CoWork/Telemetry"
          MetricName: "TotalOutputTokens"
          DefaultValue: 0

  MetricFilterCacheReadTokensNoUserDimension:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CoWorkLogGroup
      FilterPattern: "{ $.cacheReadTokens > 0 }"
      MetricTransformations:
        - MetricValue: "$.cacheReadTokens"
          MetricNamespace: "CoWork/Telemetry"
          MetricName: "TotalCacheReadTokens"
          DefaultValue: 0

  MetricFilterCacheCreationTokensNoUserDimension:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CoWorkLogGroup
      FilterPattern: "{ $.cacheCreationTokens > 0 }"
      MetricTransformations:
        - MetricValue: "$.cacheCreationTokens"
          MetricNamespace: "CoWork/Telemetry"
          MetricName: "TotalCacheCreationTokens"
          DefaultValue: 0

  MetricFilterEstimatedCostNoUserDimension:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CoWorkLogGroup
      FilterPattern: "{ $.estimatedCost > 0 }"
      MetricTransformations:
        - MetricValue: "$.estimatedCost"
          MetricNamespace: "CoWork/Telemetry"
          MetricName: "TotalEstimatedCost"
          DefaultValue: 0

  MetricFilterSessionTurnCountNoUserDimension:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CoWorkLogGroup
      FilterPattern: "{ $.turnNumber > 0 }"
      MetricTransformations:
        - MetricValue: "1"
          MetricNamespace: "CoWork/Telemetry"
          MetricName: "TotalSessionTurns"
          DefaultValue: 0

  MetricFilterActiveUsers:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref CoWorkLogGroup
      FilterPattern: "{ $.user != null && $.user = \"*\" }"
      MetricTransformations:
        - MetricValue: "1"
          MetricNamespace: "CoWork/Telemetry"
          MetricName: "ActiveUsers"
          DefaultValue: 0
          Dimensions:
            - Key: "User"
              Value: "$.user"

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Ref DashboardName
      DashboardBody:
        Fn::Sub:
          - |
            {
              "start": "-PT24H",
              "periodOverride": "auto",
              "widgets": [
                {
                  "type": "metric",
                  "x": 0,
                  "y": 0,
                  "width": 12,
                  "height": 6,
                  "properties": {
                    "metrics": [
                      [ "CoWork/Telemetry", "TotalInputTokens", { "stat": "Sum" } ],
                      [ "CoWork/Telemetry", "TotalOutputTokens", { "stat": "Sum" } ],
                      [ "CoWork/Telemetry", "TotalCacheReadTokens", { "stat": "Sum" } ],
                      [ "CoWork/Telemetry", "TotalCacheCreationTokens", { "stat": "Sum" } ]
                    ],
                    "view": "timeSeries",
                    "stacked": true,
                    "region": "${MetricsRegion}",
                    "stat": "Sum",
                    "period": 300,
                    "title": "Total Token Usage (All Users)",
                    "liveData": false,
                    "setPeriodToTimeRange": false
                  }
                },
                {
                  "type": "metric",
                  "x": 12,
                  "y": 0,
                  "width": 12,
                  "height": 6,
                  "properties": {
                    "metrics": [
                      [ "CoWork/Telemetry", "TotalEstimatedCost", { "stat": "Sum", "label": "Total Cost" } ],
                      [ { "expression": "m1 / TOTAL_TIME() * 3600", "label": "Cost Rate/hour", "id": "e1" } ]
                    ],
                    "view": "timeSeries",
                    "stacked": false,
                    "region": "${MetricsRegion}",
                    "stat": "Sum",
                    "period": 300,
                    "title": "Total Cost Trend",
                    "liveData": false,
                    "setPeriodToTimeRange": false
                  }
                },
                {
                  "type": "metric",
                  "x": 0,
                  "y": 6,
                  "width": 8,
                  "height": 6,
                  "properties": {
                    "metrics": [
                      [ "CoWork/Telemetry", "TotalSessionTurns", { "stat": "Sum", "label": "Turn Count" } ]
                    ],
                    "view": "timeSeries",
                    "stacked": false,
                    "region": "${MetricsRegion}",
                    "stat": "Sum",
                    "period": 300,
                    "title": "Session Turn Counts",
                    "liveData": false
                  }
                },
                {
                  "type": "metric",
                  "x": 8,
                  "y": 6,
                  "width": 8,
                  "height": 6,
                  "properties": {
                    "metrics": [
                      [ "CoWork/Telemetry", "TotalCacheReadTokens", { "stat": "Sum", "label": "Cache Read Tokens" } ],
                      [ "CoWork/Telemetry", "TotalCacheCreationTokens", { "stat": "Sum", "label": "Cache Creation Tokens" } ]
                    ],
                    "view": "timeSeries",
                    "stacked": true,
                    "region": "${MetricsRegion}",
                    "stat": "Sum",
                    "period": 300,
                    "title": "Cache Hit Tokens",
                    "liveData": false
                  }
                },
                {
                  "type": "metric",
                  "x": 16,
                  "y": 6,
                  "width": 8,
                  "height": 6,
                  "properties": {
                    "metrics": [
                      [ { "expression": "SUM(METRICS(\"CoWork/Telemetry\", \"TotalEstimatedCost\")) / SUM(METRICS(\"CoWork/Telemetry\", \"TotalSessionTurns\"))", "label": "Avg Cost per Turn", "id": "e1" } ]
                    ],
                    "view": "timeSeries",
                    "stacked": false,
                    "region": "${MetricsRegion}",
                    "stat": "Sum",
                    "period": 300,
                    "title": "Average Cost per Turn",
                    "liveData": false
                  }
                },
                {
                  "type": "metric",
                  "x": 0,
                  "y": 12,
                  "width": 24,
                  "height": 6,
                  "properties": {
                    "metrics": [
                      [ "CoWork/Telemetry", "TotalInputTokens", { "label": "Total Input Tokens", "stat": "Sum" } ],
                      [ "CoWork/Telemetry", "TotalOutputTokens", { "label": "Total Output Tokens", "stat": "Sum" } ],
                      [ "CoWork/Telemetry", "TotalCacheReadTokens", { "label": "Total Cache Read", "stat": "Sum" } ],
                      [ "CoWork/Telemetry", "TotalCacheCreationTokens", { "label": "Total Cache Created", "stat": "Sum" } ]
                    ],
                    "view": "timeSeries",
                    "stacked": true,
                    "region": "${MetricsRegion}",
                    "stat": "Sum",
                    "period": 3600,
                    "title": "Usage Trends Over Time (Hourly)",
                    "liveData": false
                  }
                },
                {
                  "type": "metric",
                  "x": 0,
                  "y": 18,
                  "width": 24,
                  "height": 6,
                  "properties": {
                    "metrics": [
                      [ "CoWork/Telemetry", "TotalEstimatedCost", { "label": "Total Cost", "stat": "Sum" } ]
                    ],
                    "view": "timeSeries",
                    "stacked": false,
                    "region": "${MetricsRegion}",
                    "stat": "Sum",
                    "period": 3600,
                    "title": "Cost Trends Over Time (Hourly)",
                    "liveData": false
                  }
                },
                {
                  "type": "metric",
                  "x": 0,
                  "y": 24,
                  "width": 12,
                  "height": 6,
                  "properties": {
                    "metrics": [
                      [ "CoWork/Telemetry", "InputTokens", "User", "*", { "stat": "Sum", "id": "m1", "visible": false } ],
                      [ { "expression": "SUM(FILTER(m1, User!='all_users'))", "label": "Total Per User Input Tokens", "id": "e1" } ]
                    ],
                    "view": "timeSeries",
                    "stacked": true,
                    "region": "${MetricsRegion}",
                    "stat": "Sum",
                    "period": 3600,
                    "title": "Per User Token Usage (Input Tokens by User)",
                    "liveData": false
                  }
                },
                {
                  "type": "metric",
                  "x": 12,
                  "y": 24,
                  "width": 12,
                  "height": 6,
                  "properties": {
                    "metrics": [
                      [ "CoWork/Telemetry", "EstimatedCost", "User", "*", { "stat": "Sum", "visible": false } ],
                      [ { "expression": "SUM(FILTER(m1, User!='all_users'))", "label": "Cost by User", "id": "e1" } ]
                    ],
                    "view": "timeSeries",
                    "stacked": true,
                    "region": "${MetricsRegion}",
                    "stat": "Sum",
                    "period": 3600,
                    "title": "Per User Cost Breakdown",
                    "liveData": false
                  }
                },
                {
                  "type": "metric",
                  "x": 0,
                  "y": 30,
                  "width": 8,
                  "height": 6,
                  "properties": {
                    "metrics": [
                      [ "CoWork/Telemetry", "ActiveUsers", { "stat": "SampleCount", "label": "Active Users" } ]
                    ],
                    "view": "singleValue",
                    "region": "${MetricsRegion}",
                    "stat": "SampleCount",
                    "period": 86400,
                    "title": "Active User Count (Last 24h)",
                    "liveData": false
                  }
                },
                {
                  "type": "metric",
                  "x": 8,
                  "y": 30,
                  "width": 8,
                  "height": 6,
                  "properties": {
                    "metrics": [
                      [ "CoWork/Telemetry", "TotalSessionTurns", { "stat": "Sum", "label": "Total Turns" } ],
                      [ "CoWork/Telemetry", "ActiveUsers", { "stat": "SampleCount", "label": "Active Users" } ]
                    ],
                    "view": "singleValue",
                    "region": "${MetricsRegion}",
                    "stat": "Sum",
                    "period": 86400,
                    "title": "Session Activity Summary",
                    "liveData": false
                  }
                },
                {
                  "type": "log",
                  "x": 16,
                  "y": 30,
                  "width": 8,
                  "height": 6,
                  "properties": {
                    "query": "SOURCE '/aws/co-work/telemetry' | fields @timestamp, @message\n| filter @message like /CoWork/\n| sort @timestamp desc\n| limit 50",
                    "region": "${MetricsRegion}",
                    "title": "Recent Raw Events (Last 50)",
                    "view": "table"
                  }
                }
              ]
            }
          - {
              MetricsRegion: !Ref MetricsRegion
            }

Outputs:
  DashboardURL:
    Description: "Direct console URL to the created CoWork telemetry dashboard"
    Value:
      Fn::Sub:
        - "https://console.aws.amazon.com/cloudwatch/home?region=${MetricsRegion}#dashboards:name=${DashboardName}"
        - {
            DashboardName: !Ref DashboardName,
            MetricsRegion: !Ref MetricsRegion
          }