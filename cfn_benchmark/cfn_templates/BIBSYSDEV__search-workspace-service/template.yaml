AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Search Workspace Service API and Handlers
Globals:
  Function:
    Timeout: 60
    MemorySize: 1800
    Runtime: java21
    Architectures:
      - arm64
    Environment:
      Variables:
        ELASTICSEARCH_REGION: "eu-west-1"
        SCOPE_IDENTIFIER: "https://api.sws.aws.sikt.no/scopes"
        API_GATEWAY_URL: !Sub "https://api.${CustomDomain}"
        BACKUP_BUCKET_NAME: !Sub "${BackupBucketName}"
        BACKUP_ROLE_ARN: !GetAtt SWSSnapshotRepoRole.Arn
        COGNITO_AUTHORIZER_URLS: !GetAtt UserPool.ProviderURL
        API_HOST: !Sub "api.${CustomDomain}"
        LOG_LEVEL: "info"
        LOG4J_CONFIGURATION_FILE: classpath:nva-log4j2.xml

  Api:
    Cors:
      AllowMethods: "'PUT, GET,OPTIONS,DELETE,POST'"
      AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
      AllowOrigin: "'*'"

Parameters:
  ElasticSearchSize:
    Type: String
    Default: small
    AllowedValues:
      - small
      - large
  UserPoolDomainPrefix:
    Type: String
    Default: sws-auth-dev
    Description: The prefix for the Cognito domain that hosts the sign-up and sign-in pages for your application.
  DashboardApplicationName:
    Type: String
    Default: sws-dev-dashboard
    Description: Name of the OpenSearch UI dashboard application. Must be unique per account and region.
    AllowedPattern: "[a-z][a-z0-9\\-]+"
    MinLength: 3
    MaxLength: 40
  CustomDomain:
    Type: String
    Description: Custom API to connect this lambda to
  BackupBucketName:
    Type: String
    Description: Name of the S3 bucket for OpenSearch backups
  LogRetentionInDays:
    Type: Number
    Default: 90
    Description: Number of days to retain CloudWatch logs
    AllowedValues:
      - 7
      - 30
      - 90
      - 400
  LogGroupPrefix:
    Type: String
    Default: "/nva/sws/"
    Description: Prefix for log group names
  SlackSnsArn:
    Type: AWS::SSM::Parameter::Value<String>
    Default: "/NVA/Monitoring/SlackSnsArn"

Conditions:
  LargeElasticSearch: !Equals [!Ref ElasticSearchSize, "large"]

Resources:
  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "api/${LogGroupPrefix}/ApiAccessLogGroup"
      RetentionInDays: !Ref LogRetentionInDays

  IndexHandlerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "lambda/${LogGroupPrefix}/IndexHandler"
      RetentionInDays: !Ref LogRetentionInDays

  WorkspaceHandlerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "lambda/${LogGroupPrefix}/WorkspaceHandler"
      RetentionInDays: !Ref LogRetentionInDays

  CognitoHandlerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "lambda/${LogGroupPrefix}/CognitoHandler"
      RetentionInDays: !Ref LogRetentionInDays

  SnapshotRegisterRepoHandlerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "lambda/${LogGroupPrefix}/SnapshotRegisterRepoHandler"
      RetentionInDays: !Ref LogRetentionInDays

  SnapshotTakingHandlerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "lambda/${LogGroupPrefix}/SnapshotTakingHandler"
      RetentionInDays: !Ref LogRetentionInDays

  SnapshotRoutineDeletionHandlerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "lambda/${LogGroupPrefix}/SnapshotRoutineDeletionHandler"
      RetentionInDays: !Ref LogRetentionInDays

  SnapshotRestorationHandlerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "lambda/${LogGroupPrefix}/SnapshotRestorationHandler"
      RetentionInDays: !Ref LogRetentionInDays

  ClusterSettingsHandlerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "lambda/${LogGroupPrefix}/ClusterSettingsHandler"
      RetentionInDays: !Ref LogRetentionInDays

  ElasticSearchRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: [lambda.amazonaws.com]
            Action: ["sts:AssumeRole"]
      Policies:
        - PolicyName: writeLog
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:*:*"
        - PolicyName: readIdentitySecret
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:IdentityServiceSecret*"

  SWSLambdaTriggerRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: writeLog
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:*:*"
        - PolicyName: allOpenSearch
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - es:ESHttpDelete
                  - es:ESHttpPost
                  - es:ESHttpPut
                  - es:ESHttpGet
                  - es:ESHttpHead
                Resource: !Sub "arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/*"
        - PolicyName: invokeLambda
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: "*"

  SWSCognitoRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: writeLog
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:*:*"
        - PolicyName: invokeLambda
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: "*"
        - PolicyName: cognitoCreateScopeAndClient
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:ListResourceServers
                  - cognito-idp:UpdateResourceServer
                  - cognito-idp:CreateUserPool
                  - cognito-idp:ListUserPools
                  - cognito-idp:CreateUserPoolClient
                  - cognito-idp:DescribeUserPoolClient
                  - cognito-idp:ListUserPoolClients
                Resource: "*"

  SWSSnapshotRepoRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: writeLog
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:*:*"
        - PolicyName: allOpenSearch
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - es:ESHttpDelete
                  - es:ESHttpPost
                  - es:ESHttpPut
                  - es:ESHttpGet
                  - es:ESHttpHead
                Resource: !Sub "arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/*"
        - PolicyName: invokeLambda
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                  - iam:PassRole
                Resource: "*"
        - PolicyName: snapshotS3Repo
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub "arn:aws:s3:::${BackupBucketName}/*"
        - PolicyName: lists3Bucket
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !Sub "arn:aws:s3:::${BackupBucketName}"

  SWSApi:
    Type: AWS::Serverless::Api
    Properties:
      AccessLogSetting:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: '{ "apiId": "$context.apiId", "requestId": "$context.requestId", "requestTime": "$context.requestTime", "requestTimeEpoch": "$context.requestTimeEpoch", "httpMethod": "$context.httpMethod", "path": "$context.path", "status": "$context.status",  "error.message": "$context.error.message" }'
      StageName: Prod
      EndpointConfiguration: REGIONAL
      DefinitionBody:
        "Fn::Transform":
          Name: "AWS::Include"
          Parameters:
            Location: ./docs/openapi.yaml

  CustomCodeDeployServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Action:
              - sts:AssumeRole
            Effect: Allow
            Principal:
              Service: [codedeploy.amazonaws.com]
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSCodeDeployRoleForLambda

  IndexHandler:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: sws
      Description: Index handler for indeces within a workspace
      LoggingConfig:
        LogGroup: !Ref IndexHandlerLogGroup
      Environment:
        Variables:
          ALLOWED_ORIGIN: "*"
          OPENSEARCH_ENDPOINT_PROTOCOL: "https"
          OPENSEARCH_ENDPOINT_ADDRESS: !GetAtt SWSOpenSearch.DomainEndpoint
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSLambda_ReadOnlyAccess
      Events:
        PutEvent:
          Type: Api
          Properties:
            Method: put
            Path: /{resource+}
            RestApiId: !Ref SWSApi
        HeadEvent:
          Type: Api
          Properties:
            Method: head
            Path: /{resource+}
            RestApiId: !Ref SWSApi
        DeleteEvent:
          Type: Api
          Properties:
            Method: delete
            Path: /{resource+}
            RestApiId: !Ref SWSApi
        GetEvent:
          Type: Api
          Properties:
            Method: get
            Path: /{resource+}
            RestApiId: !Ref SWSApi
        PostEvent:
          Type: Api
          Properties:
            Method: post
            Path: /{resource+}
            RestApiId: !Ref SWSApi
      Handler: no.sikt.sws.IndexHandler::handleRequest
      Role: !GetAtt SWSLambdaTriggerRole.Arn

  WorkspaceHandler:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: sws
      Description: Handler for workspace - listing indeces and showing account identifier
      LoggingConfig:
        LogGroup: !Ref WorkspaceHandlerLogGroup
      Environment:
        Variables:
          ALLOWED_ORIGIN: "*"
          OPENSEARCH_ENDPOINT_PROTOCOL: "https"
          OPENSEARCH_ENDPOINT_ADDRESS: !GetAtt SWSOpenSearch.DomainEndpoint
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSLambda_ReadOnlyAccess
      Events:
        GetEvent:
          Type: Api
          Properties:
            Method: get
            Path: /
            RestApiId: !Ref SWSApi
      Handler: no.sikt.sws.WorkspaceHandler::handleRequest
      Role: !GetAtt SWSLambdaTriggerRole.Arn

  CognitoHandler:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: sws
      Description: Handler for Cognito - create new users / workspaces
      LoggingConfig:
        LogGroup: !Ref CognitoHandlerLogGroup
      Environment:
        Variables:
          ALLOWED_ORIGIN: "*"
          OPENSEARCH_ENDPOINT_PROTOCOL: "https"
          OPENSEARCH_ENDPOINT_ADDRESS: !GetAtt SWSOpenSearch.DomainEndpoint
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSLambda_ReadOnlyAccess
      Handler: no.sikt.sws.CognitoHandler::handleRequest
      Role: !GetAtt SWSCognitoRole.Arn

  SnapshotRegisterRepoHandler:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: sws
      Description: Handler for registering repository for manual snapshots. Needs to be run from Lambda test in console.
      LoggingConfig:
        LogGroup: !Ref SnapshotRegisterRepoHandlerLogGroup
      Environment:
        Variables:
          ALLOWED_ORIGIN: "*"
          OPENSEARCH_ENDPOINT_PROTOCOL: "https"
          OPENSEARCH_ENDPOINT_ADDRESS: !GetAtt SWSOpenSearch.DomainEndpoint
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSLambda_ReadOnlyAccess
      Handler: no.sikt.sws.SnapshotRegisterRepoHandler::handleRequest
      Role: !GetAtt SWSSnapshotRepoRole.Arn

  SnapshotTakingHandler:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: sws
      Description: Handler which takes manual ie via call snapshots of opensearch hourly
      LoggingConfig:
        LogGroup: !Ref SnapshotTakingHandlerLogGroup
      Environment:
        Variables:
          ALLOWED_ORIGIN: "*"
          OPENSEARCH_ENDPOINT_PROTOCOL: "https"
          OPENSEARCH_ENDPOINT_ADDRESS: !GetAtt SWSOpenSearch.DomainEndpoint
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSLambda_ReadOnlyAccess
      Handler: no.sikt.sws.SnapshotTakingHandler::handleRequest
      Role: !GetAtt SWSSnapshotRepoRole.Arn
      Events:
        ScheduledEventTakingSnapshot:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)

  SnapshotRoutineDeletionHandler:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: sws
      Description: automation of outdated snapshot deletion
      LoggingConfig:
        LogGroup: !Ref SnapshotRoutineDeletionHandlerLogGroup
      Environment:
        Variables:
          ALLOWED_ORIGIN: "*"
          OPENSEARCH_ENDPOINT_PROTOCOL: "https"
          OPENSEARCH_ENDPOINT_ADDRESS: !GetAtt SWSOpenSearch.DomainEndpoint
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSLambda_ReadOnlyAccess
      Handler: no.sikt.sws.SnapshotRoutineDeletionHandler::handleRequest
      Role: !GetAtt SWSSnapshotRepoRole.Arn
      Events:
        ScheduledDeletionSnap:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)

  SnapshotRestorationHandler:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: sws
      Description: Handler for Restoring from a snapshot
      LoggingConfig:
        LogGroup: !Ref SnapshotRestorationHandlerLogGroup
      Environment:
        Variables:
          ALLOWED_ORIGIN: "*"
          OPENSEARCH_ENDPOINT_PROTOCOL: "https"
          OPENSEARCH_ENDPOINT_ADDRESS: !GetAtt SWSOpenSearch.DomainEndpoint
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSLambda_ReadOnlyAccess
      Handler: no.sikt.sws.SnapshotRestorationHandler::handleRequest
      Role: !GetAtt SWSSnapshotRepoRole.Arn

  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      MfaConfiguration: "OFF"
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: false
      UsernameConfiguration:
        CaseSensitive: true
      UserPoolName: "SWSUserPool"

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Ref UserPoolDomainPrefix

  ResourceServerScopes:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      Identifier: https://api.sws.aws.sikt.no/scopes
      Name: Scopes for backend
      Scopes:
        - ScopeDescription: Scope for accessing workspaces
          ScopeName: workspace
      UserPoolId: !Ref UserPool

  SwsBasePathMapping:
    Type: AWS::ApiGateway::BasePathMapping
    Properties:
      DomainName: !Sub api.${CustomDomain}
      RestApiId: !Ref SWSApi
      Stage: !Ref SWSApi.Stage

  SWSOpenSearch:
    Type: AWS::OpenSearchService::Domain
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    UpdatePolicy:
      EnableVersionUpgrade: true
    Properties:
      AccessPolicies:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              AWS: !GetAtt ElasticSearchRole.Arn
            Action:
              - es:ESHttpPost
              - es:ESHttpGet
              - es:ESHttpPut
              - es:ESHttpDelete
              - es:ESHttpHead
              - s3:PutObject
              - s3:GetObject
              - s3:DeleteObject
            Resource: !Sub "arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/*"
      ClusterConfig: !If
        - LargeElasticSearch
        - DedicatedMasterEnabled: true
          DedicatedMasterType: m6g.large.search
          DedicatedMasterCount: 3
          InstanceCount: 5
          InstanceType: r7g.large.search
          ZoneAwarenessEnabled: true
          ZoneAwarenessConfig:
            AvailabilityZoneCount: 3
        - DedicatedMasterEnabled: true
          DedicatedMasterType: m6g.large.search
          DedicatedMasterCount: 3
          InstanceCount: 5
          InstanceType: r7g.large.search
          ZoneAwarenessEnabled: true
          ZoneAwarenessConfig:
            AvailabilityZoneCount: 3
      EngineVersion: "OpenSearch_3.5"
      EBSOptions:
        EBSEnabled: true
        VolumeSize: 50
        VolumeType: gp3
      CognitoOptions:
        Enabled: false
      AdvancedOptions:
        "indices.query.bool.max_clause_count": "4096"

  # action.auto_create_index is not supported in AdvancedOptions and must be
  # applied through the cluster settings API. The handler runs after every
  # completed deployment of this stack and on a weekly schedule as a fallback.
  ClusterSettingsHandler:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: sws
      Description: Applies OpenSearch cluster settings not supported by AdvancedOptions
      LoggingConfig:
        LogGroup: !Ref ClusterSettingsHandlerLogGroup
      Environment:
        Variables:
          ALLOWED_ORIGIN: "*"
          OPENSEARCH_ENDPOINT_PROTOCOL: "https"
          OPENSEARCH_ENDPOINT_ADDRESS: !GetAtt SWSOpenSearch.DomainEndpoint
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSLambda_ReadOnlyAccess
      Handler: no.sikt.sws.ClusterSettingsHandler::handleRequest
      Role: !GetAtt SWSLambdaTriggerRole.Arn
      Events:
        StackDeployed:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source:
                - aws.cloudformation
              detail-type:
                - CloudFormation Stack Status Change
              resources:
                - !Ref AWS::StackId
              detail:
                status-details:
                  status:
                    - CREATE_COMPLETE
                    - UPDATE_COMPLETE
        WeeklySchedule:
          Type: Schedule
          Properties:
            Schedule: rate(7 days)

  ClusterSettingsErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: SWS applying OpenSearch cluster settings failed
      AlarmDescription: Errors in ClusterSettingsHandler. The cluster may be running with action.auto_create_index enabled. Check logs.
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Dimensions:
        - Name: FunctionName
          Value: !Ref ClusterSettingsHandler
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref SlackSnsArn

  SWSDashboardApplication:
    Type: AWS::OpenSearchService::Application
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Ref DashboardApplicationName
      DataSources:
        - DataSourceArn: !GetAtt SWSOpenSearch.Arn
          DataSourceDescription: SWS OpenSearch cluster
      AppConfigs:
        - Key: opensearchDashboards.dashboardAdmin.users
          Value: "*"