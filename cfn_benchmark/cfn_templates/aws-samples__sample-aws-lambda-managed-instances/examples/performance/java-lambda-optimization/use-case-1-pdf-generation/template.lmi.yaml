AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  LMI Blog — Use Case 1: PDF Report Generation (Lambda Managed Instances)
  Demonstrates JIT C2 compilation advantage on long-lived instances.

Parameters:
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnet IDs for the LMI capacity provider (at least 2 AZs)
  SecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
    Description: Security group IDs for the LMI capacity provider

Globals:
  Function:
    Tracing: Active
    CodeUri: target/pdf-generation-1.0.0-SNAPSHOT.jar
    Handler: org.springframework.cloud.function.adapter.aws.FunctionInvoker::handleRequest
    Runtime: java25
    Timeout: 60
    MemorySize: 2048
    Architectures:
      - x86_64
    Environment:
      Variables:
        TRANSACTION_TABLE_NAME: !Ref TransactionsTable
        REPORT_BUCKET_NAME: !Ref ReportBucket
        MAIN_CLASS: com.aws.lmi.pdf.PdfGenerationApplication
        JAVA_TOOL_OPTIONS: "-XX:+TieredCompilation -XX:+UseG1GC -Xms512m -Xmx1408m -Xlog:gc:stderr:time,tags"

Resources:
  # LMI Capacity Provider — the core LMI resource
  PdfCapacityProvider:
    Type: AWS::Serverless::CapacityProvider
    Properties:
      CapacityProviderName: !Sub "${AWS::StackName}-pdf-cp"
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds: !Ref SecurityGroupIds
      InstanceRequirements:
        Architectures:
          - x86_64
      ScalingConfig:
        MaxVCpuCount: 40
        AverageCPUUtilization: 70.0
      Tags:
        UseCase: pdf-generation
        Blog: lmi-java-performance

  ReportApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Name: lmi-blog-pdf-managed-instances

  GenerateReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      AutoPublishAlias: live
      CapacityProviderConfig:
        Arn: !GetAtt PdfCapacityProvider.Arn
        ExecutionEnvironmentMemoryGiBPerVCpu: 2
        PerExecutionEnvironmentMaxConcurrency: 3
      Environment:
        Variables:
          SPRING_CLOUD_FUNCTION_DEFINITION: pdfGeneratorFunction
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TransactionsTable
        - S3CrudPolicy:
            BucketName: !Ref ReportBucket
      Events:
        PostReport:
          Type: Api
          Properties:
            RestApiId: !Ref ReportApi
            Path: /reports
            Method: post

  TransactionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-transactions"
      AttributeDefinitions:
        - AttributeName: accountId
          AttributeType: S
        - AttributeName: transactionId
          AttributeType: S
      KeySchema:
        - AttributeName: accountId
          KeyType: HASH
        - AttributeName: transactionId
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST

  ReportBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-reports-${AWS::AccountId}"
      LifecycleConfiguration:
        Rules:
          - Id: CleanupOldReports
            Status: Enabled
            ExpirationInDays: 7

Outputs:
  ApiEndpoint:
    Value: !Sub "https://${ReportApi}.execute-api.${AWS::Region}.amazonaws.com/prod/reports"
  Arn:
    Value: !GetAtt PdfCapacityProvider.Arn
  TransactionsTableName:
    Value: !Ref TransactionsTable
  ReportBucketName:
    Value: !Ref ReportBucket