AWSTemplateFormatVersion: '2010-09-09'
Description: Create (and optionally attach) SCP to protect alternate contacts (Organizations CFN runs in us-east-1)

Parameters:
  SCPAttachmentTargetId:
    Type: String
    Default: ''
    Description: Root ID (r-xxxx), OU ID (ou-xxxx-xxxxxxxx), or Account ID to attach the SCP. Leave blank to create without attaching.

Conditions:
  HasSCPTarget: !Not [!Equals [!Ref SCPAttachmentTargetId, '']]

Resources:
  ProtectAlternateContactsPolicy:
    Type: AWS::Organizations::Policy
    Properties:
      Name: ProtectAlternateContacts
      Description: >
        Deny deleting alternate contacts, and deny updating them unless called
        from the management account.
      Type: SERVICE_CONTROL_POLICY
      Content:
        Fn::Sub: |
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Sid": "DenyDeleteAlternateContact",
                "Effect": "Deny",
                "Action": [ "account:DeleteAlternateContact" ],
                "Resource": "*"
              },
              {
                "Sid": "RestrictPutAlternateContactToMgmt",
                "Effect": "Deny",
                "Action": [ "account:PutAlternateContact" ],
                "Resource": "*",
                "Condition": {
                  "StringNotEquals": { "aws:PrincipalAccount": "${AWS::AccountId}" }
                }
              }
            ]
          }
      # Attach at create-time if a target was provided
      TargetIds:
        Fn::If:
          - HasSCPTarget
          - [ !Ref SCPAttachmentTargetId ]
          - !Ref AWS::NoValue

Outputs:
  SCPPolicyId:
    Value: !Ref ProtectAlternateContactsPolicy
    Description: ID of the created SCP