AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  OpenClaw Data Stack - OpenSearch domain, S3 buckets, SNS topics.

Parameters:
  Environment:
    Type: String
    Default: dev
  ProjectName:
    Type: String
    Default: openclaw
  VpcId:
    Type: String
    Description: VPC ID from Foundation
  DataSubnet1Id:
    Type: String
    Description: Data subnet AZ-1 from Foundation
  DataSubnet2Id:
    Type: String
    Description: Data subnet AZ-2 from Foundation
  DataSGId:
    Type: String
    Description: Data security group from Foundation
  KnowledgeKeyArn:
    Type: String
    Description: Knowledge KMS key ARN from Foundation
  InfraLogsKeyArn:
    Type: String
    Description: InfraLogs KMS key ARN from Foundation
  EventsKeyArn:
    Type: String
    Description: Events KMS key ARN from Foundation
  OpenSearchKeyArn:
    Type: String
    Description: OpenSearch KMS key ARN from Foundation
  OpenSearchInstanceType:
    Type: String
    Default: t3.small.search
    Description: OpenSearch instance type

Resources:
  # ============================================================================
  # MCP Knowledge Task Role (FGAC master user)
  # Created here in Data stack so it can be set as OpenSearch MasterUserARN.
  # Bare role with ECS trust only — operational policies attached in Compute
  # stack via AWS::IAM::Policy (cross-stack pattern).
  # No RoleName — auto-generated to avoid collision during transition deploy.
  # NOTE: For production, separate the master user from the application task role.
  # ============================================================================
  MCPKnowledgeTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-mcp-knowledge-task-role'
        - Key: Environment
          Value: !Ref Environment

  # ============================================================================
  # OpenSearch CloudWatch Log Groups + Resource Policy
  # ============================================================================
  OpenSearchIndexSlowLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/opensearch/${ProjectName}-kb-${Environment}/index-slow'
      RetentionInDays: 90
      KmsKeyId: !Ref InfraLogsKeyArn

  OpenSearchSearchSlowLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/opensearch/${ProjectName}-kb-${Environment}/search-slow'
      RetentionInDays: 90
      KmsKeyId: !Ref InfraLogsKeyArn

  OpenSearchESAppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/opensearch/${ProjectName}-kb-${Environment}/app'
      RetentionInDays: 90
      KmsKeyId: !Ref InfraLogsKeyArn

  OpenSearchAuditLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/opensearch/${ProjectName}-kb-${Environment}/audit'
      RetentionInDays: 90
      KmsKeyId: !Ref InfraLogsKeyArn

  OpenSearchLogResourcePolicy:
    Type: AWS::Logs::ResourcePolicy
    Properties:
      PolicyName: !Sub '${ProjectName}-${Environment}-opensearch-log-policy'
      PolicyDocument: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "AllowOpenSearchLogs",
              "Effect": "Allow",
              "Principal": {
                "Service": "es.amazonaws.com"
              },
              "Action": [
                "logs:PutLogEvents",
                "logs:CreateLogStream"
              ],
              "Resource": "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/opensearch/${ProjectName}-kb-${Environment}/*"
            }
          ]
        }

  # ============================================================================
  # OpenSearch Domain (Lesson #7: AWS::OpenSearchService::Domain)
  # ============================================================================
  OpenSearchDomain:
    Type: AWS::OpenSearchService::Domain
    Properties:
      DomainName: !Sub '${ProjectName}-kb-${Environment}'
      EngineVersion: OpenSearch_2.11
      ClusterConfig:
        InstanceType: !Ref OpenSearchInstanceType
        InstanceCount: 1
        DedicatedMasterEnabled: false
        ZoneAwarenessEnabled: false
      EBSOptions:
        EBSEnabled: true
        VolumeType: gp3
        VolumeSize: 20
      VPCOptions:
        SubnetIds:
          - !Ref DataSubnet1Id
        SecurityGroupIds:
          - !Ref DataSGId
      EncryptionAtRestOptions:
        Enabled: true
        KmsKeyId: !Ref OpenSearchKeyArn
      NodeToNodeEncryptionOptions:
        Enabled: true
      DomainEndpointOptions:
        EnforceHTTPS: true
        TLSSecurityPolicy: Policy-Min-TLS-1-2-2019-07
      AdvancedSecurityOptions:
        Enabled: true
        InternalUserDatabaseEnabled: false
        MasterUserOptions:
          MasterUserARN: !GetAtt MCPKnowledgeTaskRole.Arn
      AccessPolicies:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: '*'
            Action: 'es:*'
            Resource: !Sub 'arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/${ProjectName}-kb-${Environment}/*'
            Condition:
              StringEquals:
                aws:SourceVpc: !Ref VpcId
      LogPublishingOptions:
        INDEX_SLOW_LOGS:
          CloudWatchLogsLogGroupArn: !GetAtt OpenSearchIndexSlowLogGroup.Arn
          Enabled: true
        SEARCH_SLOW_LOGS:
          CloudWatchLogsLogGroupArn: !GetAtt OpenSearchSearchSlowLogGroup.Arn
          Enabled: true
        ES_APPLICATION_LOGS:
          CloudWatchLogsLogGroupArn: !GetAtt OpenSearchESAppLogGroup.Arn
          Enabled: true
        AUDIT_LOGS:
          CloudWatchLogsLogGroupArn: !GetAtt OpenSearchAuditLogGroup.Arn
          Enabled: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-opensearch'

  # ============================================================================
  # S3 Buckets (3 app buckets + ALB logs bucket + policies)
  # Lesson #2: DenyHTTP only, NO VPCE conditions
  # ============================================================================
  KnowledgeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-${Environment}-knowledge-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref KnowledgeKeyArn
            BucketKeyEnabled: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: TransitionToIntelligentTiering
            Status: Enabled
            Transitions:
              - StorageClass: INTELLIGENT_TIERING
                TransitionInDays: 90
      LoggingConfiguration:
        DestinationBucketName: !Ref InfraLogsBucket
        LogFilePrefix: !Sub 's3-access-logs/knowledge/'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-knowledge'

  KnowledgeBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref KnowledgeBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyHTTP
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt KnowledgeBucket.Arn
              - !Sub '${KnowledgeBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  InfraLogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-${Environment}-infra-logs-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref InfraLogsKeyArn
            BucketKeyEnabled: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: TransitionToGlacier
            Status: Enabled
            Transitions:
              - StorageClass: GLACIER
                TransitionInDays: 365
            ExpirationInDays: 2555
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-infra-logs'

  InfraLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref InfraLogsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyHTTP
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt InfraLogsBucket.Arn
              - !Sub '${InfraLogsBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          - Sid: AllowCloudTrailGetBucketAcl
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt InfraLogsBucket.Arn
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${ProjectName}-${Environment}-trail'
          - Sid: AllowCloudTrailPutObject
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${InfraLogsBucket.Arn}/AWSLogs/${AWS::AccountId}/*'
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
                AWS:SourceArn: !Sub 'arn:aws:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${ProjectName}-${Environment}-trail'
          - Sid: AllowVPCFlowLogs
            Effect: Allow
            Principal:
              Service: delivery.logs.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${InfraLogsBucket.Arn}/vpc-flow-logs/*'
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
          - Sid: AllowVPCFlowLogsGetBucketAcl
            Effect: Allow
            Principal:
              Service: delivery.logs.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt InfraLogsBucket.Arn
          - Sid: AllowS3AccessLogs
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${InfraLogsBucket.Arn}/s3-access-logs/*'
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref 'AWS::AccountId'

  EventSummariesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-${Environment}-event-summaries-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref EventsKeyArn
            BucketKeyEnabled: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireAfter365Days
            Status: Enabled
            ExpirationInDays: 365
      LoggingConfiguration:
        DestinationBucketName: !Ref InfraLogsBucket
        LogFilePrefix: !Sub 's3-access-logs/event-summaries/'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-event-summaries'

  EventSummariesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref EventSummariesBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyHTTP
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt EventSummariesBucket.Arn
              - !Sub '${EventSummariesBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  BackupBucket:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-${Environment}-backups-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref KnowledgeKeyArn
            BucketKeyEnabled: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireAfter30Days
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
      LoggingConfiguration:
        DestinationBucketName: !Ref InfraLogsBucket
        LogFilePrefix: !Sub 's3-access-logs/backups/'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-backups'

  # ============================================================================
  # ALB Access Logs Bucket (SSE-S3 required by ELB -- KMS-SSE is incompatible)
  # ============================================================================
  ALBLogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-${Environment}-alb-logs-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireAfter90Days
            Status: Enabled
            ExpirationInDays: 90
            NoncurrentVersionExpiration:
              NoncurrentDays: 7
      LoggingConfiguration:
        DestinationBucketName: !Ref InfraLogsBucket
        LogFilePrefix: !Sub 's3-access-logs/alb-logs/'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-alb-logs'

  ALBLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ALBLogsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyHTTP
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt ALBLogsBucket.Arn
              - !Sub '${ALBLogsBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          - Sid: AllowELBLogs
            Effect: Allow
            Principal:
              AWS: 'arn:aws:iam::127311923021:root'
            Action: s3:PutObject
            Resource: !Sub '${ALBLogsBucket.Arn}/alb-logs/*'
          - Sid: AllowLogDelivery
            Effect: Allow
            Principal:
              Service: logdelivery.elasticloadbalancing.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${ALBLogsBucket.Arn}/alb-logs/*'

  # ============================================================================
  # SNS Topics (2 topics + 2 policies = 4 resources)
  # ============================================================================
  AdminNotificationsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${ProjectName}-${Environment}-admin-notifications'
      KmsMasterKeyId: !Ref EventsKeyArn
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-admin-notifications'

  AdminNotificationsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref AdminNotificationsTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudWatchAlarms
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AdminNotificationsTopic

  ApprovalRequestsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${ProjectName}-${Environment}-approval-requests'
      KmsMasterKeyId: !Ref EventsKeyArn
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-approval-requests'

  ApprovalRequestsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref ApprovalRequestsTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowECSTaskPublish
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: sns:Publish
            Resource: !Ref ApprovalRequestsTopic

Outputs:
  OpenSearchEndpoint:
    Value: !GetAtt OpenSearchDomain.DomainEndpoint
  OpenSearchArn:
    Value: !GetAtt OpenSearchDomain.Arn
  MCPKnowledgeTaskRoleArn:
    Value: !GetAtt MCPKnowledgeTaskRole.Arn
  MCPKnowledgeTaskRoleName:
    Value: !Ref MCPKnowledgeTaskRole
  KnowledgeBucketName:
    Value: !Ref KnowledgeBucket
  KnowledgeBucketArn:
    Value: !GetAtt KnowledgeBucket.Arn
  InfraLogsBucketName:
    Value: !Ref InfraLogsBucket
  InfraLogsBucketArn:
    Value: !GetAtt InfraLogsBucket.Arn
  ALBLogsBucketName:
    Value: !Ref ALBLogsBucket
  BackupBucketArn:
    Value: !GetAtt BackupBucket.Arn
  AdminSNSTopicArn:
    Value: !Ref AdminNotificationsTopic
  ApprovalSNSTopicArn:
    Value: !Ref ApprovalRequestsTopic