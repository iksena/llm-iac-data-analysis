AWSTemplateFormatVersion: 2010-09-09
Parameters:
  ResourceNamePrefix:
    Type: String
    Description: Prefix for resource names
  EKSClusterName:
    Type: String
    Description: Name of the EKS cluster
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID for the SageMaker HyperPod cluster
  SecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
    Description: List of security group IDs
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: List of private subnet IDs
  LifecycleScriptsBucketName:
    Type: String
    Description: S3 bucket name for lifecycle scripts
  RIGInputBucketName:
    Type: String
    Default: ""
    Description: S3 bucket name for RIG input (optional)
  RIGOutputBucketName:
    Type: String
    Default: ""
    Description: S3 bucket name for RIG output (optional)
  CreateRIGResources:
    Type: String
    AllowedValues:
      - true
      - false
    Default: false
    Description: Flag to create RIG resources
  EnableGatedAccess:
    Type: String
    AllowedValues:
      - true
      - false
    Default: false
    Description: Flag to enable gated access
Conditions:
  CreateRIGResources: !Equals [!Ref CreateRIGResources, "true"]
  EnableGatedAccess: !Equals [!Ref EnableGatedAccess, "true"]
  HasRIGInputBucket: !Not [!Equals [!Ref RIGInputBucketName, ""]]
  HasRIGOutputBucket: !Not [!Equals [!Ref RIGOutputBucketName, ""]]
Resources:
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ResourceNamePrefix}ExecRole"
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: sagemaker.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSageMakerClusterInstanceRolePolicy
      Policies:
        - PolicyName: EKSCNIPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - ec2:AttachNetworkInterface
                  - ec2:DescribeInstances
                  - ec2:DescribeTags
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeInstanceTypes
                  - ec2:DescribeSubnets
                  - ec2:CreateTags
                Resource: "*"
                Condition:
                  StringEquals:
                    ec2:ResourceTag/aws:ec2:source: "network-interface"
        - PolicyName: BroaderENIManagementPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - ec2:AssignPrivateIpAddresses
                  - ec2:CreateNetworkInterface
                  - ec2:DeleteNetworkInterface
                  - ec2:ModifyNetworkInterface
                  - ec2:DetachNetworkInterface
                Resource: "*"
                Condition:
                  StringEquals:
                    ec2:Vpc: !Ref VpcId
              - Effect: Allow
                Action:
                  - ec2:DescribeVpcs
                  - ec2:DescribeDhcpOptions
                  - ec2:DescribeSecurityGroups
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - cloudwatch:DescribeAlarms
                Resource: "*"
              - Effect: Allow
                Action:
                  - eks-auth:AssumeRoleForPodIdentity
                Resource: !Sub "arn:aws:eks:${AWS::Region}:${AWS::AccountId}:cluster/${EKSClusterName}"
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetObject
                Resource:
                  - !Sub "arn:aws:s3:::${LifecycleScriptsBucketName}"
                  - !Sub "arn:aws:s3:::${LifecycleScriptsBucketName}/*"
              - Effect: Allow
                Action:
                  - ec2:AssignPrivateIpAddresses
                  - ec2:CreateNetworkInterface
                  - ec2:DeleteNetworkInterface
                  - ec2:ModifyNetworkInterface
                  - ec2:DetachNetworkInterface
                Resource: "*"
                Condition:
                  StringEquals:
                    ec2:Vpc: !Ref VpcId
        - !If
          - CreateRIGResources
          - PolicyName: RIGPolicy
            PolicyDocument:
              Version: 2012-10-17
              Statement:
                - !If
                  - HasRIGInputBucket
                  - Effect: Allow
                    Action:
                      - s3:ListBucket
                      - s3:GetObject
                    Resource:
                      - !Sub "arn:aws:s3:::${RIGInputBucketName}"
                      - !Sub "arn:aws:s3:::${RIGInputBucketName}/*"
                  - !Ref "AWS::NoValue"
                - Effect: Allow
                  Action:
                    - lambda:InvokeFunction
                  Resource: "*"
                  Condition:
                    StringLike:
                      lambda:FunctionName:
                        - "*SageMaker*"
                        - "*sagemaker*"
                - !If
                  - EnableGatedAccess
                  - Effect: Allow
                    Action:
                      - s3:GetObject
                    Resource:
                      - !Sub "arn:aws:s3:::${RIGInputBucketName}/*"
                      - !Sub "arn:aws:s3:::*:accesspoint/*"
                    Condition:
                      StringEquals:
                        s3:DataAccessPointBucket: !If [HasRIGInputBucket, !Ref RIGInputBucketName, !Ref "AWS::NoValue"]
                  - !Ref "AWS::NoValue"
                - !If
                  - EnableGatedAccess
                  - Effect: Allow
                    Action:
                      - sqs:SendMessage
                      - sqs:ReceiveMessage
                      - sqs:DeleteMessage
                      - sqs:GetQueueAttributes
                      - sqs:GetQueueUrl
                    Resource: "arn:aws:sqs:*:*:*"
                    Condition:
                      StringLike:
                        sqs:QueueName:
                          - "*SageMaker*"
                          - "*sagemaker*"
                  - !Ref "AWS::NoValue"
                - !If
                  - HasRIGOutputBucket
                  - Effect: Allow
                    Action:
                      - s3:GetObject
                      - s3:PutObject
                      - s3:DeleteObject
                    Resource:
                      - !Sub "arn:aws:s3:::${RIGOutputBucketName}"
                      - !Sub "arn:aws:s3:::${RIGOutputBucketName}/*"
                  - !Ref "AWS::NoValue"
          - !Ref "AWS::NoValue"
      Tags:
        - Key: SageMakerHyperPodPrerequisites
          Value: !Sub "${ResourceNamePrefix}ExecRole"
Outputs:
  RoleName:
    Description: Name of the IAM execution role
    Value: !Ref ExecutionRole
  RoleArn:
    Description: ARN of the IAM execution role
    Value: !GetAtt ExecutionRole.Arn