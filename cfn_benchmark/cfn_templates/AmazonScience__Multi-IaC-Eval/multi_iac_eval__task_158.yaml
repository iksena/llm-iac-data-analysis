AWSTemplateFormatVersion: "2010-09-09"

Description: |
  This stack automates the creation of an AWS Auto Scaling group
  using the latest EC2 AMI image using Amazon Linux 2. It also creates
  the related resources like a launch template and security groups

Parameters:
  LatestAmiId:
    Description: Region specific image from the Parameter Store
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2

  VpcId:
    Description: A VPC ID for the security group
    Type: AWS::EC2::VPC::Id

  Subnets:
    Description: A list of subnets for the Auto Scaling group
    Type: List<AWS::EC2::Subnet::Id>

  EnableHttpEndpoint:
    Description: Enable or disable the HTTP endpoint for EC2 instances
    Type: String
    AllowedValues:
      - enabled
      - disabled
    Default: disabled

  EnableSshAccess:
    Description: Allow SSH access to the instances
    Type: String
    AllowedValues:
      - yes
      - no
    Default: no

Resources:

  # A security group to be used by the launch template
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Auto scaling group security group
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !If
            - ShouldAllowSSH
            - 0.0.0.0/0
            - 0.0.0.0/32
          Description: "Allow SSH access if enabled"

  # A launch template to be used by the AWS auto scaling group
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub ${AWS::StackName}-launch-template
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: t3.micro
        SecurityGroupIds:
          - !GetAtt SecurityGroup.GroupId
        MetadataOptions:
          HttpEndpoint: !Ref EnableHttpEndpoint

  # An AWS Auto scaling group using a launch template
  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      MaxSize: "1"
      MinSize: "0"
      DesiredCapacity: "1"
      VPCZoneIdentifier: !Ref Subnets

Conditions:
  ShouldAllowSSH:
    !Equals
      - !Ref EnableSshAccess
      - "yes"