AWSTemplateFormatVersion: '2010-09-09'
Description: PCI Conformance Pack with Remediations - EC2, Autoscaling, Lambda (qs-1t0eilb5g)

Resources:

  # DeliveryS3Bucket used to default to the literal placeholder
  # 'config-bucket-accountid' -- a bucket that doesn't exist, hence Config's
  # 'Access denied for operation PutConformancePack'. Self-containment gap:
  # create the delivery bucket + the bucket policy Config needs to write
  # conformance pack templates into it, instead of assuming one exists.
  ConformancePackDeliveryBucketKey:
    Type: AWS::KMS::Key
    Properties:
      Description: CMK for ConformancePackDeliveryBucket encryption
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowAccountFullAccess
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: AllowConfigToUseKey
            Effect: Allow
            Principal:
              Service: config.amazonaws.com
            Action:
              - kms:GenerateDataKey*
              - kms:Decrypt
              - kms:DescribeKey
            Resource: '*'
  ConformancePackDeliveryBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !Ref ConformancePackDeliveryBucketKey
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  ConformancePackDeliveryBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ConformancePackDeliveryBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AWSConfigConformancePackDelivery
            Effect: Allow
            Principal:
              Service: config.amazonaws.com
            Action:
              - s3:PutObject
              - s3:GetBucketAcl
            Resource:
              - !GetAtt ConformancePackDeliveryBucket.Arn
              - !Sub '${ConformancePackDeliveryBucket.Arn}/*'

  ConformancePack:
    Type: 'AWS::Config::ConformancePack'
    DependsOn: ConformancePackDeliveryBucketPolicy
    Properties:
      ConformancePackName: CustomPCIEC2LambdaConfPack
      DeliveryS3Bucket: !Ref ConformancePackDeliveryBucket
      TemplateBody: |-
        Resources:
            AutoScalingELBHealthCheck:
              Type: AWS::Config::ConfigRule
              Properties:
                ConfigRuleName: AutoScalingELBHealthCheck
                Description: >-
                  [PCI.AutoScaling.1] Auto scaling groups associated with a load balancer should use health checks
                Scope:
                  ComplianceResourceTypes:
                  - "AWS::AutoScaling::AutoScalingGroup"
                Source:
                  Owner: AWS
                  SourceIdentifier: AUTOSCALING_GROUP_ELB_HEALTHCHECK_REQUIRED
            AutoScalingELBHealthCheckRemediation:
              DependsOn: AutoScalingELBHealthCheck
              Type: 'AWS::Config::RemediationConfiguration'
              Properties:
                ConfigRuleName: AutoScalingELBHealthCheck
                ResourceType: "AWS::AutoScaling::AutoScalingGroup"
                TargetId: "Custom-AutoScalingELBHealthCheck"
                TargetType: "SSM_DOCUMENT"
                TargetVersion: "1"
                Parameters:
                  AutomationAssumeRole:
                    StaticValue:
                      Values:
                        - arn:aws:iam::accountid:role/pciautomationassumerole-region
                  ASGGroupArn:
                    ResourceValue:
                      Value: "RESOURCE_ID"
                ExecutionControls:
                  SsmControls:
                    ConcurrentExecutionRatePercentage: 10
                    ErrorPercentage: 10
                Automatic: True
                MaximumAutomaticAttempts: 10
                RetryAttemptSeconds: 600
            RemoveUnusedEC2SecurityGroups:
              Type: AWS::Config::ConfigRule
              Properties:
                ConfigRuleName: RemoveUnusedEC2SecurityGroups
                Description: >-
                  PCI.EC2.3 – Unused EC2 Security Groups should be removed
                Scope:
                  ComplianceResourceTypes:
                  - "AWS::EC2::SecurityGroup"
                Source:
                  Owner: AWS
                  SourceIdentifier: EC2_SECURITY_GROUP_ATTACHED_TO_ENI
            RemoveUnusedEC2SecurityGroupsRemediation:
              DependsOn: RemoveUnusedEC2SecurityGroups
              Type: 'AWS::Config::RemediationConfiguration'
              Properties:
                ConfigRuleName: RemoveUnusedEC2SecurityGroups
                ResourceType: "AWS::EC2::SecurityGroup"
                TargetId: "Custom-RemoveSecurityGroup"
                TargetType: "SSM_DOCUMENT"
                TargetVersion: "1"
                Parameters:
                  AutomationAssumeRole:
                    StaticValue:
                      Values:
                        - arn:aws:iam::accountid:role/pciautomationassumerole-region
                  groupId:
                    ResourceValue:
                      Value: "RESOURCE_ID"
                ExecutionControls:
                  SsmControls:
                    ConcurrentExecutionRatePercentage: 10
                    ErrorPercentage: 10
                Automatic: True
                MaximumAutomaticAttempts: 10
                RetryAttemptSeconds: 600
            RestrictDefaultSecurityGroup:
              Type: AWS::Config::ConfigRule
              Properties:
                ConfigRuleName: RestrictDefaultSecurityGroup
                Description: >-
                  PCI.EC2.2 VPC default security group should prohibit inbound and outbound traffic
                Scope:
                  ComplianceResourceTypes:
                  - "AWS::EC2::SecurityGroup"
                Source:
                  Owner: AWS
                  SourceIdentifier: VPC_DEFAULT_SECURITY_GROUP_CLOSED
            RestrictDefaultSecurityGroupRemediation:
              DependsOn: RestrictDefaultSecurityGroup
              Type: 'AWS::Config::RemediationConfiguration'
              Properties:
                ConfigRuleName: RestrictDefaultSecurityGroup
                ResourceType: "AWS::EC2::SecurityGroup"
                TargetId: "Custom-RestrictSecurityGroup"
                TargetType: "SSM_DOCUMENT"
                TargetVersion: "1"
                Parameters:
                  AutomationAssumeRole:
                    StaticValue:
                      Values:
                        - arn:aws:iam::accountid:role/pciautomationassumerole-region
                  IpAddressToBlock:
                    StaticValue:
                      Values:
                        - '0.0.0.0/0'
                  groupId:
                    ResourceValue:
                      Value: "RESOURCE_ID"
                ExecutionControls:
                  SsmControls:
                    ConcurrentExecutionRatePercentage: 10
                    ErrorPercentage: 10
                Automatic: True
                MaximumAutomaticAttempts: 10
                RetryAttemptSeconds: 600
            ReleaseElasticIP:
              Type: AWS::Config::ConfigRule
              Properties:
                ConfigRuleName: ReleaseElasticIP
                Description: >-
                  [PCI.EC2.4] Unused EC2 EIPs should be removed
                Scope:
                  ComplianceResourceTypes:
                  - "AWS::EC2::EIP"
                Source:
                  Owner: AWS
                  SourceIdentifier: EIP_ATTACHED
            ReleaseElasticIPRemediation:
              DependsOn: ReleaseElasticIP
              Type: 'AWS::Config::RemediationConfiguration'
              Properties:
                ConfigRuleName: ReleaseElasticIP
                ResourceType: "AWS::EC2::EIP"
                TargetId: "AWS-ReleaseElasticIP"
                TargetType: "SSM_DOCUMENT"
                TargetVersion: "1"
                Parameters:
                  AutomationAssumeRole:
                    StaticValue:
                      Values:
                        - arn:aws:iam::accountid:role/pciautomationassumerole-region
                  AllocationId:
                    ResourceValue:
                      Value: "RESOURCE_ID"
                ExecutionControls:
                  SsmControls:
                    ConcurrentExecutionRatePercentage: 10
                    ErrorPercentage: 10
                Automatic: True
                MaximumAutomaticAttempts: 10
                RetryAttemptSeconds: 600