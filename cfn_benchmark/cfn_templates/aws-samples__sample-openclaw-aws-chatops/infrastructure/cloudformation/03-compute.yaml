  # ── MCP Ops IAM Roles ────────────────────────────────────────────────────
  MCPOpsTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-mcp-ops-task-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: MCPOpsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Security hardening: aws:ResourceAccount restricts to same-account resources only.
              # Rollback: if a Sid breaks, remove its Condition block (surgical per-Sid rollback).
              - Sid: ReadOnlyMonitoring
                Effect: Allow
                Action:
                  - cloudwatch:Get*
                  - cloudwatch:Describe*
                  - cloudwatch:List*
                  - logs:Describe*
                  - logs:Get*
                  - logs:FilterLogEvents
                  - logs:StartQuery
                  - logs:StopQuery
                  - logs:GetQueryResults
                  - ec2:Describe*
                  - ecs:Describe*
                  - ecs:List*
                  - lambda:Get*
                  - lambda:List*
                  - elasticloadbalancing:Describe*
                  - autoscaling:Describe*
                  - sqs:GetQueueAttributes
                  - sqs:GetQueueUrl
                  - sqs:ListQueues
                  - cloudformation:Describe*
                  - cloudformation:List*
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - es:Describe*
                  - es:List*
                  - rds:Describe*
                  - rds:List*
                  - eks:Describe*
                  - eks:List*
                  - ssm:DescribeParameters
                  - ssm:ListCommands
                  - ssm:ListCommandInvocations
                  - ssm:GetCommandInvocation
                  - tag:GetResources
                  - tag:GetTagKeys
                  - tag:GetTagValues
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:ListAllMyBuckets
                  - s3:GetBucketLocation
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:ResourceAccount: !Ref AWS::AccountId
              - Sid: ReadOnlyMonitoringGlobal
                Effect: Allow
                Action:
                  - ce:GetCostAndUsage
                  - ce:GetCostForecast
                Resource: '*'
              - Sid: SecurityAndOptimizationReadOnly
                Effect: Allow
                Action:
                  - wellarchitected:GetWorkload
                  - wellarchitected:ListWorkloads
                  - wellarchitected:GetAnswer
                  - wellarchitected:ListAnswers
                  - wellarchitected:GetLensReview
                  - wellarchitected:GetLensReviewReport
                  - wellarchitected:ListLensReviewImprovements
                  - wellarchitected:ListLensReviews
                  - wellarchitected:ListCheckDetails
                  - wellarchitected:ListCheckSummaries
                  - securityhub:GetFindings
                  - securityhub:BatchGetSecurityControls
                  - securityhub:GetInsights
                  - securityhub:ListEnabledProductsForImport
                  - access-analyzer:ListAnalyzers
                  - access-analyzer:ListFindings
                  - access-analyzer:GetFinding
                  - guardduty:ListDetectors
                  - guardduty:ListFindings
                  - guardduty:GetFindings
                  - guardduty:GetDetector
                  - compute-optimizer:GetRecommendationSummaries
                  - compute-optimizer:GetEC2InstanceRecommendations
                  - compute-optimizer:GetEBSVolumeRecommendations
                  - compute-optimizer:GetLambdaFunctionRecommendations
                  - compute-optimizer:GetECSServiceRecommendations
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:ResourceAccount: !Ref AWS::AccountId
              - Sid: BackupAndEFSReadOnly
                Effect: Allow
                Action:
                  - backup:ListBackupPlans
                  - backup:ListBackupVaults
                  - backup:ListRecoveryPointsByBackupVault
                  - elasticfilesystem:DescribeBackupPolicy
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:ResourceAccount: !Ref AWS::AccountId
              - Sid: ResourceTagging
                Effect: Allow
                Action:
                  - tag:TagResources
                  - tag:UntagResources
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:ResourceAccount: !Ref AWS::AccountId
              - Sid: ResourceTaggingServiceSpecific
                Effect: Allow
                Action:
                  - ec2:CreateTags
                  - ec2:DeleteTags
                  - ecs:TagResource
                  - ecs:UntagResource
                  - lambda:TagResource
                  - lambda:UntagResource
                  - rds:AddTagsToResource
                  - rds:RemoveTagsFromResource
                  - s3:PutBucketTagging
                  - s3:GetBucketTagging
                  - elasticloadbalancing:AddTags
                  - elasticloadbalancing:RemoveTags
                  - es:AddTags
                  - es:RemoveTags
                  - elasticfilesystem:CreateTags
                  - elasticfilesystem:DeleteTags
                  - sqs:TagQueue
                  - sqs:UntagQueue
                  - sns:TagResource
                  - sns:UntagResource
                  - dynamodb:TagResource
                  - dynamodb:UntagResource
                  - elasticache:AddTagsToResource
                  - elasticache:RemoveTagsFromResource
                  - kms:TagResource
                  - kms:UntagResource
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:ResourceAccount: !Ref AWS::AccountId
              - Sid: WellArchitectedWrite
                Effect: Allow
                Action:
                  - wellarchitected:CreateWorkload
                  - wellarchitected:UpdateWorkload
                  - wellarchitected:DeleteWorkload
                  - wellarchitected:UpdateAnswer
                  - wellarchitected:CreateMilestone
                  - wellarchitected:ListMilestones
                  - wellarchitected:GetMilestone
                  - wellarchitected:AssociateLenses
                  - wellarchitected:DisassociateLenses
                  - wellarchitected:ListLenses
                  - wellarchitected:GetLens
                  - wellarchitected:GetConsolidatedReport
