AWSTemplateFormatVersion: 2010-09-09
Description: Student Services Agent Infrastructure - Self-contained Bedrock AgentCore with Cognito OAuth2 and IAM execution roles
Resources:
  BaseManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: StudentServicesBasePolicy
      Description: Base policy granting Bedrock model invocation, CloudWatch logging/metrics under bedrock-agentcore namespace, X-Ray tracing, and SSM parameter access for student-services path
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
            Resource: "*"
          - Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: "*"
          - Effect: Allow
            Action: cloudwatch:PutMetricData
            Resource: "*"
            Condition:
              StringEquals:
                cloudwatch:Namespace: bedrock-agentcore
          - Effect: Allow
            Action:
              - xray:PutTraceSegments
              - xray:PutTelemetryRecords
            Resource: "*"
          - Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:GetParameters
              - ssm:GetParametersByPath
            Resource:
              Fn::Sub: arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/student-services/*

  StudentServicesAgentExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: StudentServicesAgentExecutionRole
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount:
                  Ref: AWS::AccountId
              ArnLike:
                aws:SourceArn:
                  Fn::Sub: arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:agent/*
      ManagedPolicyArns:
        - Ref: BaseManagedPolicy

  StudentServicesGatewayUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: StudentServicesGatewayUserPool
      AutoVerifiedAttributes:
        - email
      Schema:
        - Name: email
          Required: true
          Mutable: true
      Policies:
        PasswordPolicy:
          MinimumLength: 6
          RequireLowercase: false
          RequireUppercase: false
          RequireNumbers: false
          RequireSymbols: false
          TemporaryPasswordValidityDays: 30
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  StudentServicesGatewayUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain:
        Fn::Sub: student-gateway-${AWS::AccountId}
      UserPoolId:
        Ref: StudentServicesGatewayUserPool

  StudentServicesGatewayResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      Identifier:
        Fn::Sub: https://student-gateway-${AWS::AccountId}
      Name: StudentServicesGatewayResourceServer
      Scopes:
        - ScopeName: access
          ScopeDescription: Access scope for StudentServicesGateway
      UserPoolId:
        Ref: StudentServicesGatewayUserPool

  StudentServicesGatewayUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: StudentServicesGatewayResourceServer
    Properties:
      ClientName: StudentServicesGatewayClient
      UserPoolId:
        Ref: StudentServicesGatewayUserPool
      GenerateSecret: true
      AllowedOAuthFlows:
        - client_credentials
      AllowedOAuthScopes:
        - Fn::Sub: https://student-gateway-${AWS::AccountId}/access
      AllowedOAuthFlowsUserPoolClient: true
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_CLIENT_CREDENTIALS
      SupportedIdentityProviders:
        - COGNITO

  CourseRegistrationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CourseRegistrationExecutionRole
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount:
                  Ref: AWS::AccountId
              ArnLike:
                aws:SourceArn:
                  Fn::Sub: arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:agent/*
      ManagedPolicyArns:
        - Ref: BaseManagedPolicy
      Policies:
        - PolicyName: CourseRegistrationDynamoDBFullAccess
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:DescribeTable
                  - dynamodb:CreateTable
                  - dynamodb:DeleteTable
                  - dynamodb:UpdateTable
                  - dynamodb:CreateBackup
                  - dynamodb:DeleteBackup
                  - dynamodb:RestoreTableFromBackup
                  - dynamodb:RestoreTableToPointInTime
                  - dynamodb:DescribeContinuousBackups
                  - dynamodb:DescribeBackup
                  - dynamodb:ListBackups
                  - dynamodb:ListTables
                  - dynamodb:DescribeGlobalTable
                  - dynamodb:ListGlobalTables
                  - dynamodb:UpdateGlobalTable
                  - dynamodb:DescribeGlobalTableSettings
                  - dynamodb:UpdateGlobalTableSettings
                  - dynamodb:DescribeTimeToLive
                  - dynamodb:UpdateTimeToLive
                  - dynamodb:GetRecords
                  - dynamodb:GetShardIterator
                  - dynamodb:DescribeStream
                  - dynamodb:ListStreams
                Resource: "*"

  CourseRegistrationUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: CourseRegistrationUserPool
      AutoVerifiedAttributes:
        - email
      Schema:
        - Name: email
          Required: true
          Mutable: true
      Policies:
        PasswordPolicy:
          MinimumLength: 6
          RequireLowercase: false
          RequireUppercase: false
          RequireNumbers: false
          RequireSymbols: false
          TemporaryPasswordValidityDays: 30
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  CourseRegistrationUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain:
        Fn::Sub: course-registration-${AWS::AccountId}
      UserPoolId:
        Ref: CourseRegistrationUserPool

  CourseRegistrationResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      Identifier:
        Fn::Sub: https://course-registration-${AWS::AccountId}
      Name: CourseRegistrationResourceServer
      Scopes:
        - ScopeName: access
          ScopeDescription: Access scope for CourseRegistration
      UserPoolId:
        Ref: CourseRegistrationUserPool

  CourseRegistrationUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: CourseRegistrationResourceServer
    Properties:
      ClientName: CourseRegistrationClient
      UserPoolId:
        Ref: CourseRegistrationUserPool
      GenerateSecret: true
      AllowedOAuthFlows:
        - client_credentials
      AllowedOAuthScopes:
        - Fn::Sub: https://course-registration-${AWS::AccountId}/access
      AllowedOAuthFlowsUserPoolClient: true
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_CLIENT_CREDENTIALS
      SupportedIdentityProviders:
        - COGNITO

