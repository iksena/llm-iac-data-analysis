                              all_attachments = list(message_body.get('attachments', [])) + embedded_attachments

                          else:
                              # Use regular templated email
                              metadata = recipient.get('metadata', {})
                              template_data = json.dumps(metadata or {"firstName": "", "lastName": ""})
                              template_name = template.get('name')

                              # Verify template has unsubscribe placeholder
                              template_has_placeholder = False
                              try:
                                  template_response = ses_client.get_email_template(TemplateName=template_name)
                                  template_content = template_response.get('TemplateContent', {})

                                  html_part = template_content.get('Html', '')
                                  text_part = template_content.get('Text', '')

                                  template_has_placeholder = ('{{amazonSESUnsubscribeUrl}}' in html_part or
                                                            '{{amazonSESUnsubscribeUrl}}' in text_part)

                                  if not template_has_placeholder:
                                      logger.warning(f"Template {template_name} doesn't contain {{amazonSESUnsubscribeUrl}} placeholder")
                              except Exception as e:
                                  logger.warning(f"Error checking template {template_name}: {str(e)}")

                              # Prepare email parameters for templated email
                              email_params = {
                                  'FromEmailAddress': f"{sender.get('name', 'Notification Service')} <{sender['email']}>",
                                  'Destination': {
                                      'ToAddresses': [email]
                                  },
                                  'Content': {
                                      'Template': {
                                          'TemplateName': template_name,
                                          'TemplateData': template_data
                                      }
                                  }
                              }

                              # For templated emails, only process regular attachments
                              all_attachments = message_body.get('attachments', [])

                          # Add attachments if they exist
                          if all_attachments:
                              if not s3_client:
                                  s3_client = boto3.client('s3')
                              attachments_bucket = os.environ.get('ATTACHMENTS_BUCKET')

                              attachment_list = []
                              for attachment in all_attachments:
                                  # Handle both regular attachments (with s3Key) and embedded attachments (with content)
                                  if 's3Key' in attachment:
