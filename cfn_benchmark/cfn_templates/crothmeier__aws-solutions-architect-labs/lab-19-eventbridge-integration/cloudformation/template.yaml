AWSTemplateFormatVersion: '2010-09-09'
Description: 'Lab 19: EventBridge with Lambda and SNS Integration'

Parameters:
  EnvironmentName:
    Type: String
    Default: Lab19

Resources:
  # SNS Topic
  NotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${EnvironmentName}-Notifications

  # Lambda Function - Process Events
  ProcessEventFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${EnvironmentName}-ProcessEvent
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt LambdaRole.Arn
      Code:
        ZipFile: |
          import json
          def lambda_handler(event, context):
              print(f"Event received: {json.dumps(event)}")
              detail = event.get('detail', {})
              return {'statusCode': 200, 'body': json.dumps('Event processed')}

  # Lambda Function - Scheduled Report
  ScheduledReportFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${EnvironmentName}-ScheduledReport
      Runtime: python3.11
      Handler: index.lambda_handler
      Role: !GetAtt LambdaRole.Arn
      Code:
        ZipFile: |
          import json
          from datetime import datetime
          def lambda_handler(event, context):
              report = f"Daily report generated at {datetime.utcnow().isoformat()}"
              print(report)
              return {'statusCode': 200, 'body': json.dumps(report)}

  # IAM Role for Lambda
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  # EventBridge Rule - EC2 State Changes
  EC2StateChangeRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ${EnvironmentName}-EC2-StateChange
      Description: Trigger on EC2 instance state changes
      EventPattern:
        source:
          - aws.ec2
        detail-type:
          - EC2 Instance State-change Notification
      Targets:
        - Arn: !GetAtt ProcessEventFunction.Arn
          Id: ProcessEventTarget
        - Arn: !Ref NotificationTopic
          Id: SNSTarget

  # EventBridge Rule - Scheduled
  ScheduledRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ${EnvironmentName}-Daily-Report
      Description: Trigger daily report
      ScheduleExpression: cron(0 12 * * ? *)
      Targets:
        - Arn: !GetAtt ScheduledReportFunction.Arn
          Id: ScheduledReportTarget

  # Lambda Permissions
  ProcessEventPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProcessEventFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt EC2StateChangeRule.Arn

  ScheduledReportPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ScheduledReportFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ScheduledRule.Arn

  # SNS Topic Policy
  SNSTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref NotificationTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref NotificationTopic

Outputs:
  ProcessEventFunctionArn:
    Value: !GetAtt ProcessEventFunction.Arn
  NotificationTopicArn:
    Value: !Ref NotificationTopic
  EC2RuleArn:
    Value: !GetAtt EC2StateChangeRule.Arn