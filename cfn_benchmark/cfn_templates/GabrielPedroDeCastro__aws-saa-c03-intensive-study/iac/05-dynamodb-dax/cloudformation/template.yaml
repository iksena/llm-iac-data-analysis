AWSTemplateFormatVersion: '2010-09-09'
Description: 'SAA Lab 05 - DynamoDB on-demand e DAX opcional; padrao barato sem DAX'

Parameters:
  ProjectName:
    Type: String
    Default: saa-lab-05
  EnableDax:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: DAX gera cobranca por hora; false mantém somente DynamoDB on-demand.
  DaxReplicationFactor:
    Type: Number
    Default: 1
    AllowedValues: [1, 3]
    Description: 1 para estudo barato; 3 para alta disponibilidade.

Conditions:
  CreateDax: !Equals [!Ref EnableDax, 'true']

Resources:
  OrdersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub '${ProjectName}-orders'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: customerId, AttributeType: S}
        - {AttributeName: orderId, AttributeType: S}
      KeySchema:
        - {AttributeName: customerId, KeyType: HASH}
        - {AttributeName: orderId, KeyType: RANGE}
      SSESpecification: {SSEEnabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: false}
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-orders'}
        - {Key: Project, Value: saa-c03-intensive}
        - {Key: Lab, Value: '05'}
        - {Key: ManagedBy, Value: CloudFormation}

  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.50.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-vpc'}, {Key: Project, Value: saa-c03-intensive}, {Key: Lab, Value: '05'}]
  DaxSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.50.10.0/24
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-dax-a'}, {Key: Lab, Value: '05'}]
  DaxSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.50.11.0/24
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-dax-b'}, {Key: Lab, Value: '05'}]
  ClientSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Anexe ao cliente DAX autorizado
      VpcId: !Ref VPC
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-client-sg'}, {Key: Lab, Value: '05'}]
  DaxSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: DAX somente a partir do client SG
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8111
          ToPort: 8111
          SourceSecurityGroupId: !Ref ClientSecurityGroup
          Description: Cliente DAX
      Tags: [{Key: Name, Value: !Sub '${ProjectName}-dax-sg'}, {Key: Lab, Value: '05'}]
  DaxSubnetGroup:
    Type: AWS::DAX::SubnetGroup
    Condition: CreateDax
    Properties:
      Description: Sub-redes privadas para DAX
      SubnetGroupName: !Sub '${ProjectName}-dax-subnets'
      SubnetIds: [!Ref DaxSubnetA, !Ref DaxSubnetB]

  DaxServiceRole:
    Type: AWS::IAM::Role
    Condition: CreateDax
    Properties:
      RoleName: !Sub '${ProjectName}-dax-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: dax.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: OrdersTableAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:ConditionCheckItem
                  - dynamodb:DeleteItem
                  - dynamodb:DescribeTable
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:UpdateItem
                Resource:
                  - !GetAtt OrdersTable.Arn
                  - !Sub '${OrdersTable.Arn}/index/*'
      Tags: [{Key: Project, Value: saa-c03-intensive}, {Key: Lab, Value: '05'}, {Key: ManagedBy, Value: CloudFormation}]

  DaxCluster:
    Type: AWS::DAX::Cluster
    Condition: CreateDax
    Properties:
      ClusterName: !Sub '${ProjectName}-dax'
      IAMRoleARN: !GetAtt DaxServiceRole.Arn
      NodeType: dax.t3.small
      ReplicationFactor: !Ref DaxReplicationFactor
      SecurityGroupIds: [!Ref DaxSecurityGroup]
      SubnetGroupName: !Ref DaxSubnetGroup
      SSESpecification: {SSEEnabled: true}
      Tags: {Project: saa-c03-intensive, Lab: '05', ManagedBy: CloudFormation}

Outputs:
  TableName: {Value: !Ref OrdersTable}
  TableArn: {Value: !GetAtt OrdersTable.Arn}
  DaxEnabled: {Value: !Ref EnableDax}
  DaxDiscoveryEndpoint:
    Value: !If [CreateDax, !GetAtt DaxCluster.ClusterDiscoveryEndpoint, disabled]
  ClientSecurityGroupId: {Value: !Ref ClientSecurityGroup}