          import json
          import boto3
          import os
          from botocore.exceptions import ClientError

          sesv2_client = boto3.client('sesv2')
          CORS_ORIGIN = os.environ.get('ALLOWED_ORIGIN', 'NONE')

          def lambda_handler(event, context):
              try:
                  response = sesv2_client.list_email_identities()

                  # Filter for verified email identities
                  verified_emails = []
                  for identity in response.get('EmailIdentities', []):
                      if identity.get('IdentityType') == 'EMAIL_ADDRESS':
                          # Get identity details to check verification status
                          identity_info = sesv2_client.get_email_identity(
