AWSTemplateFormatVersion: '2010-09-09'
Description: 'AI Governance Watchdog Platform - Complete Infrastructure'

Parameters:
  BedrockModelID:
    Type: String
    Default: 'anthropic.claude-3-sonnet-20240229-v1:0'
    Description: 'Bedrock model ID for bias analysis'

Resources:
  # DynamoDB Table for Audit Summaries
  AuditSummariesTable:
    Type: 'AWS::DynamoDB::Table'
    Properties:
      TableName: 'AuditSummaries'
      BillingMode: 'PAY_PER_REQUEST'
      AttributeDefinitions:
        - AttributeName: 'user_id'
          AttributeType: 'S'
        - AttributeName: 'timestamp'
          AttributeType: 'S'
      KeySchema:
        - AttributeName: 'user_id'
          KeyType: 'HASH'
        - AttributeName: 'timestamp'
          KeyType: 'RANGE'
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  # S3 Bucket for Reports
  ReportsBucket:
    Type: 'AWS::S3::Bucket'
    Properties:
      BucketName: !Sub 'ai-governance-reports-${AWS::AccountId}'
      VersioningConfiguration:
        Status: 'Enabled'
      LifecycleConfiguration:
        Rules:
          - Id: 'DeleteOldReports'
            Status: 'Enabled'
            ExpirationInDays: 90
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: 'AES256'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # IAM Role for Lambda
  LambdaExecutionRole:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: 'ai-governance-watchdog-lambda-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: 'Allow'
            Principal:
              Service: 'lambda.amazonaws.com'
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: 'BedrockAccess'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: 'Allow'
                Action:
                  - 'bedrock:InvokeModel'
                  - 'bedrock:InvokeModelWithResponseStream'
                Resource: '*'
        - PolicyName: 'SageMakerAccess'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: 'Allow'
                Action:
                  - 'sagemaker:InvokeEndpoint'
                Resource: '*'
        - PolicyName: 'DynamoDBAccess'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: 'Allow'
                Action:
                  - 'dynamodb:PutItem'
                  - 'dynamodb:GetItem'
                  - 'dynamodb:Query'
                  - 'dynamodb:Scan'
                Resource: !GetAtt AuditSummariesTable.Arn
        - PolicyName: 'S3Access'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: 'Allow'
                Action:
                  - 's3:PutObject'
                  - 's3:GetObject'
                  - 's3:ListBucket'
                Resource:
                  - !GetAtt ReportsBucket.Arn
                  - !Sub '${ReportsBucket.Arn}/*'

  # Lambda Function
  AuditLambdaFunction:
    Type: 'AWS::Lambda::Function'
    Properties:
      FunctionName: 'ai-governance-watchdog-handler'
      Runtime: 'python3.10'
      Handler: 'handler.lambda_handler'
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        ZipFile: |
          # Placeholder - actual code deployed via CI/CD or manual upload
          def lambda_handler(event, context):
              return {'statusCode': 200, 'body': 'Please upload handler code'}
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          DYNAMODB_TABLE_NAME: !Ref AuditSummariesTable
          S3_BUCKET_NAME: !Ref ReportsBucket
          BEDROCK_MODEL_ID: !Ref BedrockModelID

  # API Gateway REST API
  RestAPI:
    Type: 'AWS::ApiGateway::RestApi'
    Properties:
      Name: 'ai-governance-watchdog-api'
      Description: 'API for AI Governance Watchdog Platform'
      EndpointConfiguration:
        Types:
          - 'REGIONAL'

  # API Gateway Resource (proxy)
  APIResource:
    Type: 'AWS::ApiGateway::Resource'
    Properties:
      RestApiId: !Ref RestAPI
      ParentId: !GetAtt RestAPI.RootResourceId
      PathPart: '{proxy+}'

  # API Gateway Method (ANY)
  APIMethodAny:
    Type: 'AWS::ApiGateway::Method'
    Properties:
      RestApiId: !Ref RestAPI
      ResourceId: !Ref APIResource
      HttpMethod: 'ANY'
      AuthorizationType: 'NONE'
      Integration:
        Type: 'AWS_PROXY'
        IntegrationHttpMethod: 'POST'
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuditLambdaFunction.Arn}/invocations'

  # Lambda Invoke Permission
  LambdaInvokePermission:
    Type: 'AWS::Lambda::Permission'
    Properties:
      FunctionName: !Ref AuditLambdaFunction
      Action: 'lambda:InvokeFunction'
      Principal: 'apigateway.amazonaws.com'
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${RestAPI}/*/*'

  # API Gateway Deployment
  APIDeployment:
    Type: 'AWS::ApiGateway::Deployment'
    DependsOn: APIMethodAny
    Properties:
      RestApiId: !Ref RestAPI
      StageName: 'prod'

Outputs:
  APIEndpoint:
    Description: 'API Gateway endpoint URL'
    Value: !Sub 'https://${RestAPI}.execute-api.${AWS::Region}.amazonaws.com/prod'
    Export:
      Name: 'AIGovernanceWatchdogAPIEndpoint'

  DynamoDBTable:
    Description: 'DynamoDB table name'
    Value: !Ref AuditSummariesTable
    Export:
      Name: 'AIGovernanceWatchdogDynamoDBTable'

  S3Bucket:
    Description: 'S3 bucket for reports'
    Value: !Ref ReportsBucket
    Export:
      Name: 'AIGovernanceWatchdogS3Bucket'

  LambdaFunctionArn:
    Description: 'Lambda function ARN'
    Value: !GetAtt AuditLambdaFunction.Arn
    Export:
      Name: 'AIGovernanceWatchdogLambdaArn'