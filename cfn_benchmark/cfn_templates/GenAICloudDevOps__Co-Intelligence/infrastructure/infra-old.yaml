AWSTemplateFormatVersion: '2010-09-09'
Description: 'Co-Intelligence Infrastructure - VPC, RDS, ECR, S3, EKS'

Parameters:
  DBUsername:
    Type: String
    Default: cointelligence
    Description: Database master username

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: co-intelligence-vpc

  Subnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: us-east-1a
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: co-intelligence-subnet-1

  Subnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: us-east-1b
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: co-intelligence-subnet-2

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: co-intelligence-igw

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: co-intelligence-rt

  Route:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociation1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref Subnet1
      RouteTableId: !Ref RouteTable

  SubnetRouteTableAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref Subnet2
      RouteTableId: !Ref RouteTable

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnet group for RDS
      SubnetIds:
        - !Ref Subnet1
        - !Ref Subnet2
      Tags:
        - Key: Name
          Value: co-intelligence-db-subnet-group

  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for RDS
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 10.0.0.0/16
      Tags:
        - Key: Name
          Value: co-intelligence-db-sg

  EKSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for EKS
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: co-intelligence-eks-sg

  RDSParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      DBParameterGroupName: co-intelligence-pg
      Description: Parameter group to disable SSL requirement
      Family: postgres17
      Parameters:
        rds.force_ssl: '0'
      Tags:
        - Key: Name
          Value: co-intelligence-pg

  RDSInstance:
    Type: AWS::RDS::DBInstance
    DependsOn: AppSecrets
    Properties:
      DBInstanceIdentifier: co-intelligence-db
      Engine: postgres
      EngineVersion: '17.2'
      DBInstanceClass: db.t3.medium
      AllocatedStorage: 20
      StorageType: gp2
      MasterUsername: !Sub '{{resolve:secretsmanager:${AppSecrets}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${AppSecrets}:SecretString:password}}'
      DBSubnetGroupName: !Ref DBSubnetGroup
      DBParameterGroupName: !Ref RDSParameterGroup
      VPCSecurityGroups:
        - !Ref DBSecurityGroup
      PubliclyAccessible: false
      BackupRetentionPeriod: 7
      Tags:
        - Key: Name
          Value: co-intelligence-rds

  EKSClusterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: co-intelligence-eks-cluster-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy

  EKSNodeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: co-intelligence-eks-node-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
      Policies:
        - PolicyName: LambdaInvokePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt CodeExecutorLambda.Arn

  BackendECR:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: co-intelligence-backend
      ImageScanningConfiguration:
        ScanOnPush: true

  FrontendECR:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: co-intelligence-frontend
      ImageScanningConfiguration:
        ScanOnPush: true

  S3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'co-intelligence-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # Secrets Manager - Auto-generates DB password (uses 'username'/'password' keys for RDS attachment)
  AppSecrets:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: co-intelligence-secrets
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username":"${DBUsername}"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/\'''
      Tags:
        - Key: Name
          Value: co-intelligence-secrets

  # Auto-generate SECRET_KEY separately
  AppSecretKey:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: co-intelligence-secret-key
      GenerateSecretString:
        PasswordLength: 32
        ExcludePunctuation: true
      Tags:
        - Key: Name
          Value: co-intelligence-secret-key

  # Attach secret to RDS for rotation support
  SecretRDSAttachment:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Properties:
      SecretId: !Ref AppSecrets
      TargetId: !Ref RDSInstance
      TargetType: AWS::RDS::DBInstance

  # EKS Node Group
  EKSNodeGroup:
    Type: AWS::EKS::Nodegroup
    DependsOn: EKSCluster
    Properties:
      ClusterName: !Ref EKSCluster
      NodegroupName: co-intelligence-nodes
      NodeRole: !GetAtt EKSNodeRole.Arn
      InstanceTypes:
        - t3.medium
      ScalingConfig:
        MinSize: 8
        MaxSize: 9
        DesiredSize: 8
      Subnets:
        - !Ref Subnet1
        - !Ref Subnet2
      Tags:
        Name: co-intelligence-nodes

  # Lambda Execution Role
  CodeExecutorLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: co-intelligence-code-executor-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Tags:
        - Key: Name
          Value: co-intelligence-code-executor-role

  # EKS Cluster
  EKSCluster:
    Type: AWS::EKS::Cluster
    DependsOn:
      - EKSClusterRole
      - Subnet1
      - Subnet2
      - EKSSecurityGroup
    Properties:
      Name: co-intelligence-cluster
      Version: '1.34'
      RoleArn: !GetAtt EKSClusterRole.Arn
      UpgradePolicy:
        SupportType: STANDARD
      AccessConfig:
        AuthenticationMode: API_AND_CONFIG_MAP
      ResourcesVpcConfig:
        SubnetIds:
          - !Ref Subnet1
          - !Ref Subnet2
        SecurityGroupIds:
          - !Ref EKSSecurityGroup
        EndpointPublicAccess: true
        EndpointPrivateAccess: true
      Tags:
        - Key: Name
          Value: co-intelligence-cluster

  # Lambda Function for Code Execution
  CodeExecutorLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: co-intelligence-code-executor
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt CodeExecutorLambdaRole.Arn
      Timeout: 30
      MemorySize: 512
      Code:
        ZipFile: |
          import json
          import sys
          import io
          import traceback
          from contextlib import redirect_stdout, redirect_stderr
          import math
          import datetime
          import random
          import statistics
          import re
          import collections
          import itertools
          import string
          import decimal
          import fractions
          import uuid
          import hashlib
          import base64
          import textwrap

          def lambda_handler(event, context):
              code = event.get('code', '')
              if not code:
                  return {'statusCode': 400, 'body': json.dumps({'error': 'No code provided'})}

              stdout_capture = io.StringIO()
              stderr_capture = io.StringIO()

              try:
                  allowed_modules = {'math', 'json', 'datetime', 'random', 'statistics', 're', 'collections', 'itertools', 'string', 'decimal', 'fractions', 'uuid', 'hashlib', 'base64', 'textwrap'}

                  def safe_import(name, *args, **kwargs):
                      if name in allowed_modules:
                          return __import__(name, *args, **kwargs)
                      raise ImportError(f"Module '{name}' is not allowed")

                  safe_globals = {
                      '__builtins__': {
                          '__import__': safe_import, 'print': print, 'len': len, 'range': range,
                          'str': str, 'int': int, 'float': float, 'list': list, 'dict': dict,
                          'set': set, 'tuple': tuple, 'sum': sum, 'max': max, 'min': min,
                          'abs': abs, 'round': round, 'sorted': sorted, 'enumerate': enumerate,
                          'zip': zip, 'map': map, 'filter': filter, 'any': any, 'all': all,
                          'bool': bool, 'bytes': bytes, 'chr': chr, 'ord': ord, 'hex': hex,
                          'oct': oct, 'bin': bin, 'pow': pow, 'divmod': divmod,
                          'isinstance': isinstance, 'issubclass': issubclass, 'type': type,
                      },
                      'math': math, 'json': json, 'datetime': datetime, 'random': random,
                      'statistics': statistics, 're': re, 'collections': collections,
                      'itertools': itertools, 'string': string, 'decimal': decimal,
                      'fractions': fractions, 'uuid': uuid, 'hashlib': hashlib,
                      'base64': base64, 'textwrap': textwrap,
                  }

                  with redirect_stdout(stdout_capture), redirect_stderr(stderr_capture):
                      exec(code, safe_globals)

                  return {'statusCode': 200, 'body': json.dumps({'output': stdout_capture.getvalue(), 'errors': stderr_capture.getvalue() or None, 'success': True})}
              except Exception as e:
                  return {'statusCode': 200, 'body': json.dumps({'output': stdout_capture.getvalue(), 'errors': f"{type(e).__name__}: {str(e)}\n{traceback.format_exc()}", 'success': False})}
      Tags:
        - Key: Name
          Value: co-intelligence-code-executor

Outputs:
  VPCId:
    Value: !Ref VPC
    Description: VPC ID for EKS
  Subnet1Id:
    Value: !Ref Subnet1
    Description: Subnet 1 ID for EKS
  Subnet2Id:
    Value: !Ref Subnet2
    Description: Subnet 2 ID for EKS
  EKSSecurityGroupId:
    Value: !Ref EKSSecurityGroup
    Description: Security Group for EKS
  EKSClusterRoleArn:
    Value: !GetAtt EKSClusterRole.Arn
    Description: IAM Role ARN for EKS Cluster
  EKSNodeRoleArn:
    Value: !GetAtt EKSNodeRole.Arn
    Description: IAM Role ARN for EKS Nodes
  RDSEndpoint:
    Value: !GetAtt RDSInstance.Endpoint.Address
    Description: RDS PostgreSQL Endpoint
  RDSPort:
    Value: !GetAtt RDSInstance.Endpoint.Port
    Description: RDS Port
  BackendECRUri:
    Value: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${BackendECR}'
    Description: Backend ECR Repository URI
  FrontendECRUri:
    Value: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${FrontendECR}'
    Description: Frontend ECR Repository URI
  S3BucketName:
    Value: !Ref S3Bucket
    Description: S3 Bucket Name
  CodeExecutorLambdaArn:
    Value: !GetAtt CodeExecutorLambda.Arn
    Description: Code Executor Lambda Function ARN
  EKSClusterName:
    Value: !Ref EKSCluster
    Description: EKS Cluster Name
  EKSClusterEndpoint:
    Value: !GetAtt EKSCluster.Endpoint
    Description: EKS Cluster API Endpoint
  EKSClusterArn:
    Value: !GetAtt EKSCluster.Arn
    Description: EKS Cluster ARN
  AppSecretsArn:
    Value: !Ref AppSecrets
    Description: Secrets Manager Secret ARN