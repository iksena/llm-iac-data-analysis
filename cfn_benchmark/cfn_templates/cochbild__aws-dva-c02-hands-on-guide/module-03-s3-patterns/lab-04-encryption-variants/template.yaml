AWSTemplateFormatVersion: "2010-09-09"
Description: |
  DVA-C02 Lab 3.4 — Customer-managed KMS key + bucket using SSE-KMS with
  S3 Bucket Key enabled. Demonstrates SSE-KMS + customer CMK.
  Lab 3.1 shared bucket (SSE-S3 default) is referenced via cross-stack import.

Resources:
  CustomerKey:
    Type: AWS::KMS::Key
    Properties:
      Description: DVA Lab 3.4 customer-managed CMK
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowAccountFullAccess
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"

  CustomerKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/dva-lab-03-04-cmk
      TargetKeyId: !Ref CustomerKey

  KmsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub "dva-lab-03-04-kms-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt CustomerKey.Arn
            BucketKeyEnabled: true   # cost optimization
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

Outputs:
  KmsBucketName:
    Value: !Ref KmsBucket
  KmsKeyArn:
    Value: !GetAtt CustomerKey.Arn
  KmsKeyId:
    Value: !Ref CustomerKey