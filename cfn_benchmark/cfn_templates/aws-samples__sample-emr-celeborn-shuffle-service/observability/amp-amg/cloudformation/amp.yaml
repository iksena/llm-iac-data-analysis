AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Amazon Managed Service for Prometheus (AMP) workspace for collecting
  Celeborn metrics from the EMR Celeborn demo environment.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Configuration
        Parameters:
          - ProjectName

Parameters:
  ProjectName:
    Type: String
    Default: emr-celeborn-demo
    Description: Project name prefixed to resource names and stack exports

Resources:
  # --- Amazon Managed Prometheus Workspace ---

  AMPWorkspace:
    Type: AWS::APS::Workspace
    Properties:
      Alias: !Sub "${ProjectName}-celeborn-metrics"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-amp-workspace"
        - Key: Project
          Value: !Ref ProjectName

Outputs:
  AMPWorkspaceId:
    Description: ID of the AMP workspace
    Value: !GetAtt AMPWorkspace.WorkspaceId
    Export:
      Name: !Sub "${ProjectName}-AMPWorkspaceId"

  AMPRemoteWriteUrl:
    Description: Remote write endpoint URL for the AMP workspace
    Value: !Sub
      - "https://aps-workspaces.${AWS::Region}.amazonaws.com/workspaces/${WorkspaceId}/api/v1/remote_write"
      - WorkspaceId: !GetAtt AMPWorkspace.WorkspaceId
    Export:
      Name: !Sub "${ProjectName}-AMPRemoteWriteUrl"