AWSTemplateFormatVersion: "2010-09-09"

Resources:
  HealthEventsSinkRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: PRX-HealthEventsSinkRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PutEventsToHealthEventsSink
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: events:PutEvents
                Resource: arn:aws:events:us-east-2:048723829744:event-bus/HealthEvents-sink

  HealthEventsRule:
    Type: AWS::Events::Rule
    Properties:
      EventPattern:
        detail-type:
          - AWS Health Event
        source:
          - aws.health
      State: ENABLED
      Targets:
        - Arn: arn:aws:events:us-east-2:048723829744:event-bus/HealthEvents-sink
          Id: mgmt-sink-health-event
          RoleArn: !GetAtt HealthEventsSinkRole.Arn
