AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  anything-data

Parameters:
  stage:
    Type: String
    Default: dev-123
    Description: Deployment stage with unique key, like "dev-123"

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 3
    MemorySize: 128

Resources:
  loggingBucket:
    Type: AWS::SSM::Parameter
    Properties:
      Type: String
      Tier: Standard
      Value:
        Fn::ImportValue: !Sub "anything-${stage}-loggingBucket" # OK

  streamArn:
    Type: AWS::SSM::Parameter
    Properties:
      Type: String
      Tier: Standard
      Value:
        Fn::ImportValue: !Sub "anything-${stage}-streamArn" # OK

  streamTableName:
    Type: AWS::SSM::Parameter
    Properties:
      Type: String
      Tier: Standard
      Value:
        Fn::ImportValue: !Sub "anything-${stage}-streamTableName" # OK

  tableLocation:
    Type: AWS::SSM::Parameter
    Properties:
      Type: String
      Tier: Standard
      Value: !Sub "s3://anything-${stage}-data/main"

  streamToFirehose:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/modules/stream/lambda-streams-to-firehose/
      Handler: handler.handler
      Role: !GetAtt LambdaRole.Arn
      Events:
        # ref: https://github.com/aws/serverless-application-model/blob/master/versions/2016-10-31.md#dynamodb
        stream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt streamArn.Value
            MaximumBatchingWindowInSeconds: 10 # seconds
            BatchSize: 100
            BisectBatchOnFunctionError: true
            MaximumRetryAttempts: 1 # 10
            StartingPosition: TRIM_HORIZON # LATEST
            Enabled: true
      Environment:
        Variables:
          TRANSFORMER_FUNCTION: flattenDynamoDBTransformer
          DEFAULT_DELIVERY_STREAM: !GetAtt streamTableName.Value
          AWS_NODEJS_CONNECTION_REUSE_ENABLED: 1
          #STREAM_DATATYPE
          #MAX_RETRY_ON_FAILED_PUT
          #RETRY_INTERVAL_MS
          #EXTRACT_KEYS
          #DEBUG
          #WRITABLE_EVENT_TYPES
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Target: ES2021
        External:
          - "@aws-sdk/client-firehose"
          - "@aws-sdk/util-dynamodb"

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "anything-data-${stage}-lambda-role"
      Path: '/anything/roles/'
      Description: 'Execution role for data streaming lambda'
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub "anything-data-${stage}-lambda-policy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - 'firehose:PutRecord'
                  - 'firehose:PutRecordBatch'
                  - 'firehose:UpdateDestination'
                Resource: !GetAtt DeliveryStream.Arn
              - Effect: Allow
                Action:
                  - 'dynamodb:DescribeStream'
                  - 'dynamodb:GetRecords'
                  - 'dynamodb:GetShardIterator'
                  - 'dynamodb:ListStreams'
                Resource: !GetAtt streamArn.Value
              # Clone of basic lambda permissions
              # ref: https://docs.aws.amazon.com/aws-managed-policy/latest/reference/AWSLambdaBasicExecutionRole.html
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"

  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "anything-${stage}-data"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: True
        BlockPublicPolicy: True
        IgnorePublicAcls: True
        RestrictPublicBuckets: True
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: 'AES256'
      LoggingConfiguration:
        DestinationBucketName: !GetAtt loggingBucket.Value
        LogFilePrefix: s3-data-logs
      LifecycleConfiguration:
        Rules:
          - Id: IntTierRule
            Status: Enabled
            Transitions:
              - TransitionInDays: 0
                StorageClass: INTELLIGENT_TIERING

  DeliveryStreamRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "anything-${stage}-delivery-stream-role"
      Path: '/anything/roles/'
      Description: 'Role for Firehose to read/write to data bucket'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ''
            Effect: Allow
            Principal:
              Service: firehose.amazonaws.com
            Action: 'sts:AssumeRole'
            Condition:
              StringEquals:
                'sts:ExternalId': !Ref 'AWS::AccountId'
      Policies:
        # To add permissions to use customer managed keys refer to:
        #  https://docs.aws.amazon.com/firehose/latest/dev/controlling-access.html#using-iam-s3
        - PolicyName: !Sub "anything-${stage}-delivery-stream-policy"
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 's3:AbortMultipartUpload'
                  - 's3:GetBucketLocation'
                  - 's3:GetObject'
                  - 's3:ListBucket'
                  - 's3:ListBucketMultipartUploads'
                  - 's3:PutObject'
                Resource:
                  - !GetAtt DataBucket.Arn
                  - !Sub ${DataBucket.Arn}/*
              - Effect: Allow
                Action:
                  - 'glue:GetTableVersions'
                Resource:
                  # ref: https://docs.aws.amazon.com/glue/latest/dg/glue-specifying-resource-arns.html
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:catalog
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:database/${GlueDatabase}
                  - !Sub arn:aws:glue:${AWS::Region}:${AWS::AccountId}:table/${GlueDatabase}/${GlueMainTable}

  # ref: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-kinesisfirehose-deliverystream.html
  DeliveryStream:
    Type: AWS::KinesisFirehose::DeliveryStream
    Properties:
      # Match the source DynamoDB table name, this match is used by lambda-streams-to-firehose handler
      DeliveryStreamName: !GetAtt streamTableName.Value
      DeliveryStreamType: DirectPut
      DeliveryStreamEncryptionConfigurationInput:
        KeyType: AWS_OWNED_CMK
      ExtendedS3DestinationConfiguration:
        BucketARN: !GetAtt DataBucket.Arn
        RoleARN: !GetAtt DeliveryStreamRole.Arn
        Prefix: 'main/!{timestamp:YYYY}-!{timestamp:MM}-!{timestamp:dd}/!{timestamp:HH}/'
        ErrorOutputPrefix: 'main/error/!{firehose:error-output-type}/!{timestamp:YYYY}-!{timestamp:MM}-!{timestamp:dd}/!{timestamp:HH}/'
        BufferingHints:
          SizeInMBs: 128
          IntervalInSeconds: 300
        # Must set to uncompressed when using data format conversion. Compression set in the output format config.
        CompressionFormat: UNCOMPRESSED
        S3BackupMode: Disabled
        DataFormatConversionConfiguration:
          # ref: https://docs.aws.amazon.com/firehose/latest/dev/record-format-conversion.html
          SchemaConfiguration:
            CatalogId: !Ref AWS::AccountId
            RoleARN: !GetAtt DeliveryStreamRole.Arn
            DatabaseName: !Ref GlueDatabase
            TableName: !Ref GlueMainTable
            Region: !Ref AWS::Region
            VersionId: LATEST
          InputFormatConfiguration:
            Deserializer:
              #OpenXJsonSerDe: {}
              HiveJsonSerDe:
                TimestampFormats:
                - millis
          OutputFormatConfiguration:
            Serializer:
              #ParquetSerDe:
              #  Compression: GZIP
              OrcSerDe:
                Compression: ZLIB
          Enabled: True

  GlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        # Athena needs lowercase, numbers, and underscores for database / table / column names. I.e. no dashes in names.
        # ref: https://docs.aws.amazon.com/athena/latest/ug/glue-best-practices.html#schema-names
        Name: !Sub "anything_${stage}"

  GlueMainTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabase
      TableInput:
        Name: main
        Owner: owner
        Retention: 0
        TableType: EXTERNAL_TABLE
        PartitionKeys:
        - Name: date
          Type: date
        - Name: hour
          Type: string
        StorageDescriptor:
          Columns:
          - Name: id
            Type: string
          - Name: sort
            Type: string
          - Name: modified
            Type: timestamp
          - Name: author
            Type: string
          - Name: type
            Type: string
          - Name: ctype
            Type: string
          - Name: deleted
            Type: boolean
          - Name: currentVersion
            Type: int
          - Name: eventName
            Type: string
          #- Name: itemIds
          #  Type: array<string>
          # ref: https://github.com/aws/aws-cdk/blob/main/packages/%40aws-cdk/aws-glue-alpha/lib/data-format.ts
          #InputFormat: org.apache.hadoop.mapred.TextInputFormat
          #InputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat
          InputFormat: org.apache.hadoop.hive.ql.io.orc.OrcInputFormat
          #OutputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.orc.OrcOutputFormat
          Compressed: True
          NumberOfBuckets: -1
          SerdeInfo:
            #SerializationLibrary: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe
            SerializationLibrary: org.apache.hadoop.hive.ql.io.orc.OrcSerde
            Parameters:
              serialization.format: '1'
          BucketColumns: []
          SortColumns: []
          StoredAsSubDirectories: False
          Location: !Sub "${tableLocation.Value}/"
        Parameters:
          "orc.compress": "ZLIB"
          "projection.enabled": "true"
          "projection.date.type": "date"
          "projection.date.format": "yyyy-MM-dd"
          "projection.date.range": "2023-01-01,NOW"
          "projection.date.interval": "1"
          "projection.date.interval.unit": "DAYS"
          "projection.hour.type": "integer"
          "projection.hour.range": "00,23"
          "projection.hour.digits": "2"
          "storage.location.template": !Join
            - ''
            - - !GetAtt tableLocation.Value
              - /${date}/${hour}/

  QueryResultsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "anything-${stage}-queries"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: True
        BlockPublicPolicy: True
        IgnorePublicAcls: True
        RestrictPublicBuckets: True
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: 'AES256'
      LoggingConfiguration:
        DestinationBucketName: !GetAtt loggingBucket.Value
        LogFilePrefix: s3-queries-logs
      LifecycleConfiguration:
        Rules:
          # Lifecycle rules run once per day; clean up old queries since they're for a live dashboard
          - Id: Daily deletion
            ExpirationInDays: 1
            Status: Enabled

  WorkGroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: !Sub "anything-${stage}-workgroup"
      State: ENABLED
      WorkGroupConfiguration:
        BytesScannedCutoffPerQuery: 10000000 # 10MB is minimum
        EnforceWorkGroupConfiguration: True
        RequesterPaysEnabled: False
        ResultConfiguration:
          ExpectedBucketOwner: !Ref AWS::AccountId
          OutputLocation: !Sub s3://${QueryResultsBucket}
      RecursiveDeleteOption: True

  # Note: Following named queries are just for reference

  # Alternative, Athena-based form for creating Glue table
  CreateTableQuery:
    Type: AWS::Athena::NamedQuery
    Properties:
      Database: !Ref GlueDatabase
      WorkGroup: !Ref WorkGroup
      Name: CreateMainTable
      Description: "Define main table"
      # ref: https://docs.aws.amazon.com/athena/latest/ug/partition-projection-kinesis-firehose-example.html
      # Note: ${!date} resolves as ${date}, ! marks as string literal not substitution
      QueryString: !Sub |
        CREATE EXTERNAL TABLE IF NOT EXISTS main (
          id string,
          sort string,
          modified timestamp,
          author string,
          type string,
          ctype string,
          deleted boolean,
          currentVersion int,
          eventName string
        )
        PARTITIONED BY (
          date date,
          hour string
        )
        STORED AS ORC
        LOCATION ${tableLocation.Value}/
        TBLPROPERTIES (
          "orc.compress" = "ZLIB",
          "projection.enabled" = "true",
          "projection.date.type" = "date",
          "projection.date.format" = "yyyy-MM-dd",
          "projection.date.range" = "2023-01-01,NOW",
          "projection.date.interval" = "1",
          "projection.date.interval.unit" = "DAYS",
          "projection.hour.type" = "integer",
          "projection.hour.range" = "00,23",
          "projection.hour.digits" = "2",
          "storage.location.template" = "${tableLocation.Value}/${!date}/${!hour}/"
        )

  # Could be a prepared statement with "LIMIT ?" instead.
  ItemCountsByType:
    Type: AWS::Athena::NamedQuery
    Properties:
      Database: !Ref GlueDatabase
      WorkGroup: !Ref WorkGroup
      Name: ItemCountsByType
      Description: "Types and counts of current items for that type"
      QueryString: >
        SELECT type, count(*) as itemcount
        FROM main
        WHERE sort='v0'
        GROUP BY type ORDER BY itemcount DESC LIMIT 20;

  # Could be prepared statement with "INTERVAL ? DAY" instead.
  # LIMIT should be > unique(author) * 30 days.
  # Cast date as string to just avoid Grafana issues interpreting dates as user's local time zone depending on settings.
  UserActivity:
    Type: AWS::Athena::NamedQuery
    Properties:
      Database: !Ref GlueDatabase
      WorkGroup: !Ref WorkGroup
      Name: UserActivity
      Description: "Activity (stream events) grouped by date and user"
      QueryString: >
        SELECT cast(date as varchar) as date, coalesce(author, 'system') as author, count(*) as eventcount
        FROM main
        WHERE date > CURRENT_DATE - INTERVAL '30' DAY
        GROUP BY date, author
        ORDER BY date DESC LIMIT 1000;

Outputs:
  dataBucketArn:
    Value: !GetAtt DataBucket.Arn
    Export:
      Name: !Sub "anything-${stage}-dataBucketArn"
  queryResultsBucketArn:
    Value: !GetAtt QueryResultsBucket.Arn
    Description: Bucket that stores Athena query results
    Export:
      Name: !Sub "anything-${stage}-queryResultsBucketArn"
  glueDatabase:
    Value: !Ref GlueDatabase
    Export:
      Name: !Sub "anything-${stage}-glueDatabase"
  glueMainTable:
    Value: !Ref GlueMainTable
    Export:
      Name: !Sub "anything-${stage}-glueMainTable"
  athenaWorkgroup:
    Value: !Ref WorkGroup
    Export:
      Name: !Sub "anything-${stage}-athenaWorkgroup"