  # SSO Config (unauthenticated — returns identity provider info for login page)
  SSOConfigFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-sso-config-${Environment}'
      Handler: sso_config.lambda_handler
      CodeUri: ../lambda/auth/
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - cognito-idp:DescribeUserPoolClient
                - cognito-idp:DescribeUserPool
              Resource: !Sub 'arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${UserPoolId}'
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPoolId
          USER_POOL_CLIENT_ID: !Ref UserPoolClientId
      Tags:
        Project: !Ref ProjectTag
        Environment: !Ref Environment

