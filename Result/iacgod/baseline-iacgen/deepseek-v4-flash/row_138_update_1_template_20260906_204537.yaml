AWSTemplateFormatVersion: "2010-09-09"
Parameters:
  CommonNamePrefix:
    Type: String
    Description: Prefix used to derive all IAM role and resource names
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9-]*$"
    ConstraintDescription: Must start with a letter and contain only alphanumeric characters and hyphens
Resources:
  LambdaExecutionRoleS3CopyAssets:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${CommonNamePrefix}-lambda-s3-copy-assets"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3CopyAssetsPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource: "*"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
  LambdaExecutionRoleReadResources:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${CommonNamePrefix}-lambda-read-resources"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReadResourcesPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:Describe*
                  - ec2:Get*
                  - s3:List*
                  - s3:Get*
                  - iam:Get*
                  - iam:List*
                  - lambda:Get*
                  - lambda:List*
                  - cloudformation:Describe*
                  - cloudformation:List*
                  - elasticloadbalancing:Describe*
                  - elasticloadbalancingv2:Describe*
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                  - sts:GetCallerIdentity
                Resource: "*"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
  LambdaExecutionRoleCreateVpcIamRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${CommonNamePrefix}-lambda-create-vpc-iam-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CreateVpcIamRolePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:AttachRolePolicy
                  - iam:PutRolePolicy
                  - iam:PassRole
                  - iam:GetRole
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                Resource: "*"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
  LambdaExecutionRoleDeleteS3BucketContents:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${CommonNamePrefix}-lambda-delete-s3-contents"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DeleteS3ContentsPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                  - s3:ListBucket
                  - s3:ListBucketVersions
                Resource: "*"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
  LambdaExecutionRoleCleanupLoadBalancers:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${CommonNamePrefix}-lambda-cleanup-lb"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CleanupLoadBalancersPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - elasticloadbalancing:DescribeLoadBalancers
                  - elasticloadbalancing:DescribeTargetGroups
                  - elasticloadbalancing:DescribeListeners
                  - elasticloadbalancing:DeleteLoadBalancer
                  - elasticloadbalancing:DeleteTargetGroup
                  - elasticloadbalancingv2:DescribeLoadBalancers
                  - elasticloadbalancingv2:DescribeTargetGroups
                  - elasticloadbalancingv2:DescribeListeners
                  - elasticloadbalancingv2:DeleteLoadBalancer
                  - elasticloadbalancingv2:DeleteTargetGroup
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteSecurityGroup
                  - ec2:DeleteNetworkInterface
                  - ec2:DescribeInstances
                  - ec2:DescribeVpcs
                  - ec2:DescribeSubnets
                Resource: "*"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
  LambdaExecutionRoleCleanupLambdaFunctions:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${CommonNamePrefix}-lambda-cleanup-functions"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CleanupLambdaFunctionsPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - lambda:ListFunctions
                  - lambda:DeleteFunction
                  - lambda:GetFunction
                  - lambda:ListTags
                Resource: "*"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
  LambdaExecutionRoleLookupCallerIdentity:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${CommonNamePrefix}-lambda-lookup-identity"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LookupCallerIdentityPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sts:GetCallerIdentity
                Resource: "*"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
  LambdaExecutionRoleRegisterCfnTypes:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${CommonNamePrefix}-lambda-register-cfn-types"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RegisterCfnTypesPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:RegisterType
                  - cloudformation:DeregisterType
                  - cloudformation:ListTypeRegistrations
                  - cloudformation:DescribeTypeRegistration
                  - cloudformation:DescribeType
                  - cloudformation:ListTypes
                  - cloudformation:SetTypeConfiguration
                  - cloudformation:ListTypeVersions
                  - iam:PassRole
                Resource: "*"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
  LambdaExecutionRoleResolveSsmParameters:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${CommonNamePrefix}-lambda-resolve-ssm"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ResolveSsmParametersPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                  - ssm:DescribeParameters
                Resource: "*"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
  LambdaExecutionRoleCreateCfnVpcRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${CommonNamePrefix}-lambda-create-cfn-vpc-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CreateCfnVpcRolePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:AttachRolePolicy
                  - iam:PutRolePolicy
                  - iam:PassRole
                  - iam:GetRole
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                Resource: "*"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
  EksControlPlaneRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${CommonNamePrefix}-eks-control-plane"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy
        - arn:aws:iam::aws:policy/AmazonEKSVPCResourceController
  EksFargateProfileRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${CommonNamePrefix}-eks-fargate-profile"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: eks-fargate-pods.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSFargatePodExecutionRolePolicy
  ManagedNodeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${CommonNamePrefix}-eks-managed-node"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/AmazonElasticFileSystemReadOnlyAccess
      Policies:
        - PolicyName: CfnSignalPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:SignalResource
                Resource: "*"
  ManagedNodeInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "${CommonNamePrefix}-eks-managed-node"
      Roles:
        - !Ref ManagedNodeRole
  UnmanagedNodeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${CommonNamePrefix}-eks-unmanaged-node"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/AmazonElasticFileSystemReadOnlyAccess
      Policies:
        - PolicyName: CfnSignalPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:SignalResource
                Resource: "*"
  UnmanagedNodeInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "${CommonNamePrefix}-eks-unmanaged-node"
      Roles:
        - !Ref UnmanagedNodeRole
Outputs:
  LambdaExecutionRoleS3CopyAssetsArn:
    Description: ARN of Lambda execution role for S3 copy assets
    Value: !GetAtt LambdaExecutionRoleS3CopyAssets.Arn
  LambdaExecutionRoleReadResourcesArn:
    Description: ARN of Lambda execution role for reading resources
    Value: !GetAtt LambdaExecutionRoleReadResources.Arn
  LambdaExecutionRoleCreateVpcIamRoleArn:
    Description: ARN of Lambda execution role for creating VPC IAM role
    Value: !GetAtt LambdaExecutionRoleCreateVpcIamRole.Arn
  LambdaExecutionRoleDeleteS3BucketContentsArn:
    Description: ARN of Lambda execution role for deleting S3 bucket contents
    Value: !GetAtt LambdaExecutionRoleDeleteS3BucketContents.Arn
  LambdaExecutionRoleCleanupLoadBalancersArn:
    Description: ARN of Lambda execution role for cleaning up load balancers
    Value: !GetAtt LambdaExecutionRoleCleanupLoadBalancers.Arn
  LambdaExecutionRoleCleanupLambdaFunctionsArn:
    Description: ARN of Lambda execution role for cleaning up Lambda functions
    Value: !GetAtt LambdaExecutionRoleCleanupLambdaFunctions.Arn
  LambdaExecutionRoleLookupCallerIdentityArn:
    Description: ARN of Lambda execution role for looking up caller identity
    Value: !GetAtt LambdaExecutionRoleLookupCallerIdentity.Arn
  LambdaExecutionRoleRegisterCfnTypesArn:
    Description: ARN of Lambda execution role for registering CloudFormation types
    Value: !GetAtt LambdaExecutionRoleRegisterCfnTypes.Arn
  LambdaExecutionRoleResolveSsmParametersArn:
    Description: ARN of Lambda execution role for resolving SSM parameters
    Value: !GetAtt LambdaExecutionRoleResolveSsmParameters.Arn
  LambdaExecutionRoleCreateCfnVpcRoleArn:
    Description: ARN of Lambda execution role for creating CFN VPC role
    Value: !GetAtt LambdaExecutionRoleCreateCfnVpcRole.Arn
  EksControlPlaneRoleArn:
    Description: ARN of EKS control plane role
    Value: !GetAtt EksControlPlaneRole.Arn
  EksFargateProfileRoleArn:
    Description: ARN of EKS Fargate profile role
    Value: !GetAtt EksFargateProfileRole.Arn
  ManagedNodeRoleArn:
    Description: ARN of managed node role
    Value: !GetAtt ManagedNodeRole.Arn
  ManagedNodeInstanceProfileName:
    Description: Name of managed node instance profile
    Value: !Ref ManagedNodeInstanceProfile
  UnmanagedNodeRoleArn:
    Description: ARN of unmanaged node role
    Value: !GetAtt UnmanagedNodeRole.Arn
  UnmanagedNodeInstanceProfileName:
    Description: Name of unmanaged node instance profile
    Value: !Ref UnmanagedNodeInstanceProfile