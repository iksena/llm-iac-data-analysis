AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFormation template for Maths MCP server with API Gateway, Lambda, and Cognito authentication'
Parameters:
  DeploymentStage:
    Type: String
    Default: dev
    Description: Deployment stage name for API Gateway
  UserPoolName:
    Type: String
    Default: maths-mcp-users
    Description: Name of the Cognito User Pool
  AppClientName:
    Type: String
    Default: maths-mcp-client
    Description: Name of the Cognito User Pool App Client
Resources:
  MathsMCPUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Ref UserPoolName
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: email
          Required: true
          Mutable: true
  MathsMCPUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Ref AppClientName
      UserPoolId: !Ref MathsMCPUserPool
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      GenerateSecret: false
  MathsMCPLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
  MathsMCPLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-maths-mcp"
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt MathsMCPLambdaRole.Arn
      Timeout: 30
      MemorySize: 512
      Code:
        ZipFile: |
          import json
          def lambda_handler(event, context):
              return {
                  'statusCode': 200,
                  'body': json.dumps('Hello from Maths MCP Lambda')
              }
  MathsMCPApiGateway:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "${AWS::StackName}-maths-mcp-api"
      EndpointConfiguration:
        Types:
          - REGIONAL
  MathsMCPApiGatewayRootResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref MathsMCPApiGateway
      ParentId: !GetAtt MathsMCPApiGateway.RootResourceId
      PathPart: mcp
  MathsMCPApiGatewayAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: MathsMCPAuthorizer
      RestApiId: !Ref MathsMCPApiGateway
      Type: COGNITO
      IdentitySource: method.request.header.Authorization
      ProviderARNs:
        - !GetAtt MathsMCPUserPool.Arn
  MathsMCPApiGatewayPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MathsMCPApiGateway
      ResourceId: !Ref MathsMCPApiGatewayRootResource
      HttpMethod: POST
      AuthorizationType: COGNITO
      AuthorizerId: !Ref MathsMCPApiGatewayAuthorizer
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${MathsMCPLambdaFunction.Arn}/invocations"
  MathsMCPApiGatewayOptionsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MathsMCPApiGateway
      ResourceId: !Ref MathsMCPApiGatewayRootResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin: "'*'"
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin: true
  MathsMCPApiGatewayHealthCheckMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref MathsMCPApiGateway
      ResourceId: !GetAtt MathsMCPApiGateway.RootResourceId
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 200}'
        IntegrationResponses:
          - StatusCode: 200
            ResponseTemplates:
              application/json: '{"status": "healthy"}'
      MethodResponses:
        - StatusCode: 200
  MathsMCPApiGatewayDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - MathsMCPApiGatewayPostMethod
      - MathsMCPApiGatewayOptionsMethod
      - MathsMCPApiGatewayHealthCheckMethod
    Properties:
      RestApiId: !Ref MathsMCPApiGateway
      StageName: !Ref DeploymentStage
  MathsMCPLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref MathsMCPLambdaFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${MathsMCPApiGateway}/*/POST/mcp"
Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${MathsMCPApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${DeploymentStage}"
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref MathsMCPUserPool
  AppClientId:
    Description: Cognito User Pool App Client ID
    Value: !Ref MathsMCPUserPoolClient
  LambdaFunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt MathsMCPLambdaFunction.Arn