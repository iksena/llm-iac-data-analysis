AWSTemplateFormatVersion: "2010-09-09"

Description: This template demonstrates how to use the Fn::ForEach function to create multiple tables and includes an S3 bucket for backups with lifecycle policies.

Transform: AWS::LanguageExtensions

Resources:
  Fn::ForEach::Tables:
    - TableName
    - - Points
      - Score
      - Name
      - Leaderboard
    - DynamoDB${TableName}:
        Type: AWS::DynamoDB::Table
        Properties:
          TableName: !Ref TableName
          AttributeDefinitions:
            - AttributeName: id
              AttributeType: S
          KeySchema:
            - AttributeName: id
              KeyType: HASH
          ProvisionedThroughput:
            ReadCapacityUnits: "5"
            WriteCapacityUnits: "5"

  BackupBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "backup-bucket-${AWS::StackName}"
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            Status: Enabled
            ExpirationInDays: 7
            NoncurrentVersionExpirationInDays: 7
          - Id: TransitionToIA
            Status: Enabled
            Transitions:
              - StorageClass: INTELLIGENT_TIERING
                TransitionInDays: 30

  CloudWatchAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${TableName}-HighReadCapacityUtilization"
      MetricName: ConsumedReadCapacityUnits
      Namespace: AWS/DynamoDB
      Dimensions:
        - Name: TableName
          Value: !Ref TableName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 4
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
        - !Ref AlarmTopic

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${TableName}-AlarmTopic"