AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  Athena workgroup with an enforced result location, encrypted results, a
  per-query data-scanned cutoff, and CloudWatch metrics.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Naming
        Parameters:
          - NamePrefix
          - Environment
          - WorkgroupSuffix
      - Label:
          default: Results
        Parameters:
          - ResultsBucketArn
          - ResultsPrefix
          - ResultsKmsKeyArn
      - Label:
          default: Cost control
        Parameters:
          - BytesScannedCutoffPerQuery
          - EngineVersion

Parameters:
  NamePrefix:
    Type: String
    Description: Prefix for the workgroup name.
    AllowedPattern: "^[a-z][a-z0-9-]{1,30}[a-z0-9]$"
    ConstraintDescription: 3-32 lowercase characters, digits and hyphens.

  Environment:
    Type: String
    Description: Environment this workgroup serves.
    Default: dev
    AllowedValues: [dev, staging, prod]

  WorkgroupSuffix:
    Type: String
    Description: Distinguishes workgroups, e.g. "analytics" or "adhoc".
    Default: analytics
    AllowedPattern: "^[a-z0-9][a-z0-9-]{0,60}$"

  ResultsBucketArn:
    Type: String
    Description: >-
      Bucket Athena writes query results to. Give it a short lifecycle expiry -
      results accumulate forever otherwise, and they are a full copy of whatever
      the query returned, with none of the source table's access controls.

  ResultsPrefix:
    Type: String
    Description: Key prefix for query results.
    Default: athena-results

  ResultsKmsKeyArn:
    Type: String
    Description: >-
      KMS key for result encryption. Leave empty for SSE-S3. Worth a CMK when
      queries return data the source table restricts - the result object does not
      inherit those restrictions.
    Default: ""

  BytesScannedCutoffPerQuery:
    Type: Number
    Description: >-
      Cancel any single query that scans more than this many bytes. Athena bills
      per terabyte scanned, so one accidental SELECT * over an unpartitioned
      lake is a real invoice. The default is 10 GB, roughly $0.05 - raise it
      deliberately once you know a query needs more. 0 disables the cutoff.
    Default: 10737418240
    MinValue: 0
    MaxValue: 1099511627776

  EngineVersion:
    Type: String
    Description: >-
      Athena engine. Version 3 is Trino-based, faster, and supports more
      functions; AUTO lets AWS pick and upgrade.
    Default: AUTO
    AllowedValues: [AUTO, "Athena engine version 2", "Athena engine version 3"]

Conditions:
  UsesKms: !Not [!Equals [!Ref ResultsKmsKeyArn, ""]]
  HasScanCutoff: !Not [!Equals [!Ref BytesScannedCutoffPerQuery, 0]]
  IsAutoEngine: !Equals [!Ref EngineVersion, "AUTO"]

Resources:
  Workgroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: !Sub "${NamePrefix}-${Environment}-${WorkgroupSuffix}"
      Description: !Sub "${WorkgroupSuffix} queries (${Environment})"
      State: ENABLED
      # Deleting a workgroup with saved queries in it fails unless this is set,
      # which turns a stack teardown into a manual cleanup.
      RecursiveDeleteOption: true
      WorkGroupConfiguration:
        # Without this, a client can override the result location and the scan
        # cutoff from its own settings — which makes both of them suggestions.
        EnforceWorkGroupConfiguration: true
        PublishCloudWatchMetricsEnabled: true
        BytesScannedCutoffPerQuery: !If
          - HasScanCutoff
          - !Ref BytesScannedCutoffPerQuery
          - !Ref AWS::NoValue
        EngineVersion: !If
          - IsAutoEngine
          - !Ref AWS::NoValue
          - SelectedEngineVersion: !Ref EngineVersion
        ResultConfiguration:
          OutputLocation: !Sub
            - "s3://${BucketName}/${ResultsPrefix}/"
            - BucketName: !Select [5, !Split [":", !Ref ResultsBucketArn]]
          EncryptionConfiguration:
            EncryptionOption: !If [UsesKms, SSE_KMS, SSE_S3]
            KmsKey: !If [UsesKms, !Ref ResultsKmsKeyArn, !Ref "AWS::NoValue"]

Outputs:
  WorkgroupName:
    Description: >-
      Workgroup name. Pass it as --work-group to the CLI or set it in the JDBC
      driver; queries run outside it get none of these controls.
    Value: !Ref Workgroup

  ResultsLocation:
    Description: s3:// location query results are written to.
    Value: !Sub
      - "s3://${BucketName}/${ResultsPrefix}/"
      - BucketName: !Select [5, !Split [":", !Ref ResultsBucketArn]]