AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  IAM role that GitHub Actions assumes through OIDC, scoped to one repository and
  a chosen set of refs. Deploy from CI with no long-lived access keys.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Naming
        Parameters:
          - NamePrefix
          - Environment
      - Label:
          default: Which workflows may assume this role
        Parameters:
          - GitHubOrg
          - GitHubRepo
          - AllowedBranch
          - AllowedEnvironment
          - AllowPullRequests
      - Label:
          default: What the role may do
        Parameters:
          - ManagedPolicyArn
          - GrantCloudFormationDeploy
          - ArtifactsBucketArn
          - PermissionsBoundaryArn
      - Label:
          default: OIDC provider
        Parameters:
          - CreateOidcProvider
          - ExistingOidcProviderArn
      - Label:
          default: Session
        Parameters:
          - MaxSessionDurationSeconds

Parameters:
  NamePrefix:
    Type: String
    Description: Prefix for the role name.
    AllowedPattern: "^[a-z][a-z0-9-]{1,30}[a-z0-9]$"
    ConstraintDescription: 3-32 lowercase characters, digits and hyphens.

  Environment:
    Type: String
    Description: Environment this role deploys into.
    Default: dev
    AllowedValues: [dev, staging, prod]

  GitHubOrg:
    Type: String
    Description: GitHub organisation or user that owns the repository.
    AllowedPattern: "^[A-Za-z0-9][A-Za-z0-9-]{0,38}$"

  GitHubRepo:
    Type: String
    Description: >-
      Repository name, without the owner. The trust policy is scoped to exactly
      this repository - a wildcard here would let any repo in the org assume the
      role.
    AllowedPattern: "^[A-Za-z0-9._-]{1,100}$"

  AllowedBranch:
    Type: String
    Description: >-
      Branch whose workflows may assume the role. Supports a trailing wildcard
      ("release/*"). Set to "*" only if you understand that it lets any branch,
      including one pushed by a fork-triggered workflow, deploy.
    Default: main

  AllowedEnvironment:
    Type: String
    Description: >-
      GitHub Environment name whose jobs may assume the role, e.g. "production".
      This is the strongest scoping GitHub offers, because an environment can
      require a manual approval before the job runs. Leave empty to skip.
    Default: ""

  AllowPullRequests:
    Type: String
    Description: >-
      Let pull-request workflows assume the role. Off by default: a PR from a
      fork runs code the author controls, and this role can deploy.
    Default: "false"
    AllowedValues: ["true", "false"]

  ManagedPolicyArn:
    Type: String
    Description: >-
      Managed policy to attach, e.g. arn:aws:iam::aws:policy/PowerUserAccess or
      your own least-privilege deploy policy. Leave empty to rely solely on the
      built-in CloudFormation deploy permissions below.
    Default: ""

  GrantCloudFormationDeploy:
    Type: String
    Description: >-
      Attach an inline policy allowing this role to run `cfn deploy` - change
      sets, stack updates, and reading template artifacts from the bucket below.
      It intentionally does not grant permission to create the underlying
      resources; CloudFormation does that with its own service role or with these
      credentials plus a managed policy.
    Default: "true"
    AllowedValues: ["true", "false"]

  ArtifactsBucketArn:
    Type: String
    Description: >-
      ARN of the S3 bucket that `cfn deploy` packages nested templates into.
      Required when GrantCloudFormationDeploy is true and you deploy stacks with
      nested templates.
    Default: ""

  PermissionsBoundaryArn:
    Type: String
    Description: >-
      Optional permissions boundary. In an organisation that uses boundaries,
      omitting one here is usually what makes the role creation fail.
    Default: ""

  CreateOidcProvider:
    Type: String
    Description: >-
      Create the GitHub OIDC provider in this account. There can only be one per
      account, so set this to false in every stack after the first.
    Default: "true"
    AllowedValues: ["true", "false"]

  ExistingOidcProviderArn:
    Type: String
    Description: ARN of the existing GitHub OIDC provider, when not creating one.
    Default: ""

  MaxSessionDurationSeconds:
    Type: Number
    Description: >-
      Maximum session length. One hour covers almost every deploy; raise it only
      if a single job genuinely runs longer, since the credential lives that long.
    Default: 3600
    MinValue: 900
    MaxValue: 43200

Conditions:
  ShouldCreateOidcProvider: !Equals [!Ref CreateOidcProvider, "true"]
  HasEnvironmentScope: !Not [!Equals [!Ref AllowedEnvironment, ""]]
  ShouldAllowPullRequests: !Equals [!Ref AllowPullRequests, "true"]
  HasManagedPolicy: !Not [!Equals [!Ref ManagedPolicyArn, ""]]
  ShouldGrantDeploy: !Equals [!Ref GrantCloudFormationDeploy, "true"]
  HasArtifactsBucket: !Not [!Equals [!Ref ArtifactsBucketArn, ""]]
  HasPermissionsBoundary: !Not [!Equals [!Ref PermissionsBoundaryArn, ""]]
  ShouldGrantArtifactAccess: !And [!Condition ShouldGrantDeploy, !Condition HasArtifactsBucket]

Resources:
  OidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      # IAM no longer verifies thumbprints for well-known providers, but the
      # property is still required by the resource schema. These are GitHub's
      # published values.
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${NamePrefix}-github-deploy"
      Description: !Sub "GitHub Actions deploy role for ${GitHubOrg}/${GitHubRepo} (${Environment})"
      MaxSessionDuration: !Ref MaxSessionDurationSeconds
      PermissionsBoundary: !If [HasPermissionsBoundary, !Ref PermissionsBoundaryArn, !Ref "AWS::NoValue"]
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - ShouldCreateOidcProvider
                - !Ref OidcProvider
                - !Ref ExistingOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              # The audience check is what stops a token minted for a different
              # relying party from being replayed against STS.
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              # The subject check is what stops *any other repository* from
              # assuming this role. Without it, the audience check alone means
              # every GitHub repository on earth is a trusted principal.
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub "repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/${AllowedBranch}"
                  - !If
                    - HasEnvironmentScope
                    - !Sub "repo:${GitHubOrg}/${GitHubRepo}:environment:${AllowedEnvironment}"
                    - !Ref AWS::NoValue
                  - !If
                    - ShouldAllowPullRequests
                    - !Sub "repo:${GitHubOrg}/${GitHubRepo}:pull_request"
                    - !Ref AWS::NoValue
      ManagedPolicyArns:
        - !If [HasManagedPolicy, !Ref ManagedPolicyArn, !Ref "AWS::NoValue"]
      Policies:
        - !If
          - ShouldGrantDeploy
          - PolicyName: cloudformation-deploy
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Sid: DriveStacksInThisAccount
                  Effect: Allow
                  Action:
                    - cloudformation:CreateChangeSet
                    - cloudformation:DeleteChangeSet
                    - cloudformation:DescribeChangeSet
                    - cloudformation:ExecuteChangeSet
                    - cloudformation:CreateStack
                    - cloudformation:UpdateStack
                    - cloudformation:DeleteStack
                    - cloudformation:DescribeStacks
                    - cloudformation:DescribeStackEvents
                    - cloudformation:DescribeStackResource
                    - cloudformation:DescribeStackResources
                    - cloudformation:GetTemplate
                    - cloudformation:GetTemplateSummary
                    - cloudformation:ListStackResources
                    - cloudformation:DetectStackDrift
                    - cloudformation:DescribeStackDriftDetectionStatus
                    - cloudformation:DescribeStackResourceDrifts
                  Resource:
                    - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${Environment}-*/*"
                    - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/*"
                - Sid: ReadTransformsAndValidate
                  Effect: Allow
                  Action:
                    - cloudformation:ValidateTemplate
                    - cloudformation:ListStacks
                  # Neither action accepts a resource ARN; IAM documents them as
                  # "resource type: not applicable".
                  Resource: "*"
          - !Ref AWS::NoValue
        - !If
          - ShouldGrantArtifactAccess
          - PolicyName: packaging-artifacts
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - s3:PutObject
                    - s3:GetObject
                    - s3:GetObjectVersion
                    - s3:ListBucket
                  Resource:
                    - !Ref ArtifactsBucketArn
                    - !Sub "${ArtifactsBucketArn}/*"
          - !Ref AWS::NoValue

Outputs:
  RoleArn:
    Description: >-
      Role ARN for the workflow's aws-actions/configure-aws-credentials step
      (role-to-assume).
    Value: !GetAtt Role.Arn

  RoleName:
    Description: Name of the deploy role.
    Value: !Ref Role

  OidcProviderArn:
    Description: ARN of the OIDC provider, when this stack created one.
    Condition: ShouldCreateOidcProvider
    Value: !Ref OidcProvider