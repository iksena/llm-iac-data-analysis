AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  Aurora Serverless v2 PostgreSQL or MySQL cluster - encrypted, private,
  credentials generated into Secrets Manager, with autoscaling capacity and
  optional Data API and RDS Proxy.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Naming
        Parameters:
          - NamePrefix
          - Environment
          - DatabaseName
      - Label:
          default: Engine
        Parameters:
          - Engine
          - EngineVersion
      - Label:
          default: Placement
        Parameters:
          - VpcId
          - SubnetIds
          - ClientSecurityGroupId
      - Label:
          default: Capacity (billed per ACU-hour)
        Parameters:
          - MinCapacityAcu
          - MaxCapacityAcu
          - ReaderCount
      - Label:
          default: Durability
        Parameters:
          - BackupRetentionDays
          - DeletionProtection
          - EnablePerformanceInsights
      - Label:
          default: Access
        Parameters:
          - MasterUsername
          - EnableDataApi
      - Label:
          default: Encryption
        Parameters:
          - KmsKeyArn

Parameters:
  NamePrefix:
    Type: String
    Description: Prefix for the cluster and secret names.
    AllowedPattern: "^[a-z][a-z0-9-]{1,30}[a-z0-9]$"
    ConstraintDescription: 3-32 lowercase characters, digits and hyphens.

  Environment:
    Type: String
    Description: Environment this cluster serves.
    Default: dev
    AllowedValues: [dev, staging, prod]

  DatabaseName:
    Type: String
    Description: Initial database created inside the cluster.
    Default: appdb
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]{0,62}$"

  Engine:
    Type: String
    Description: Aurora engine.
    Default: aurora-postgresql
    AllowedValues: [aurora-postgresql, aurora-mysql]

  EngineVersion:
    Type: String
    Description: >-
      Engine version. Must be one that supports Serverless v2 - 13.6+ for
      PostgreSQL, 3.02.0+ for MySQL. Pin it: leaving it to the default means a
      new cluster can come up on a different major version than the last one.
    Default: "16.4"

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC the cluster lives in.

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >-
      Private subnets, at least two in different AZs. Aurora requires the subnet
      group to span multiple AZs even for a single instance.

  ClientSecurityGroupId:
    Type: String
    Description: >-
      Security group allowed to connect, typically a Fargate service's task
      security group. Ingress is granted to this group rather than to a CIDR, so
      access follows the workload rather than the address range.

  MinCapacityAcu:
    Type: Number
    Description: >-
      Minimum Aurora Capacity Units. Each ACU is roughly 2 GiB of memory with
      matching CPU. 0 lets the cluster pause entirely when idle - excellent for
      dev, and it adds a cold start of several seconds to the first query after
      a pause. 0.5 is the lowest always-on setting.
    Default: 0.5
    MinValue: 0
    MaxValue: 256

  MaxCapacityAcu:
    Type: Number
    Description: >-
      Maximum ACUs. This is the cost ceiling: at roughly $0.12 per ACU-hour, a
      max of 16 is about $1,400/month if it ever sustains the ceiling.
    Default: 4
    MinValue: 1
    MaxValue: 256

  ReaderCount:
    Type: Number
    Description: >-
      Reader instances alongside the writer. 0 is fine for dev. 1 gives you a
      read endpoint and, more importantly, a standby Aurora can promote in under
      a minute - a single-instance cluster has no failover target and recovers by
      creating a new instance.
    Default: 0
    MinValue: 0
    MaxValue: 15

  BackupRetentionDays:
    Type: Number
    Description: Automated backup retention. 1 is the minimum AWS allows; 7 is a sane floor for prod.
    Default: 7
    MinValue: 1
    MaxValue: 35

  DeletionProtection:
    Type: String
    Description: Refuse to delete the cluster through the API as well as CloudFormation.
    Default: "false"
    AllowedValues: ["true", "false"]

  EnablePerformanceInsights:
    Type: String
    Description: >-
      Per-query wait-state analysis. Free at 7-day retention and the difference
      between "the database is slow" and knowing which statement is blocking.
    Default: "true"
    AllowedValues: ["true", "false"]

  MasterUsername:
    Type: String
    Description: >-
      Master username. The password is generated by Secrets Manager and never
      passes through CloudFormation - there is deliberately no password
      parameter here.
    Default: dbadmin
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]{0,15}$"

  EnableDataApi:
    Type: String
    Description: >-
      HTTP query endpoint, which lets a Lambda query the cluster without a VPC
      attachment or a connection pool. Off by default; it is a second access path
      to the data, authorised by IAM rather than by network position.
    Default: "false"
    AllowedValues: ["true", "false"]

  KmsKeyArn:
    Type: String
    Description: >-
      Customer-managed KMS key for storage encryption. Leave empty for the
      AWS-managed RDS key. Encryption is always on either way.
    Default: ""

Conditions:
  HasReaders: !Not [!Equals [!Ref ReaderCount, 0]]
  HasSecondReader: !Not [!Equals [!Ref ReaderCount, 1]]
  UsesKms: !Not [!Equals [!Ref KmsKeyArn, ""]]
  IsPostgres: !Equals [!Ref Engine, "aurora-postgresql"]

Resources:
  # No password parameter anywhere in this template. Secrets Manager generates
  # the value, and the cluster reads it through a dynamic reference at deploy
  # time — so it never appears in a change set, an event, or a CI log.
  MasterSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "${Environment}/${NamePrefix}/aurora-master"
      Description: !Sub "Aurora master credentials for ${NamePrefix} (${Environment})"
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username":"${MasterUsername}"}'
        GenerateStringKey: password
        PasswordLength: 32
        # RDS rejects these outright in a master password, and the others break
        # connection strings.
        ExcludeCharacters: '"@/\''`$&;|<>()[]{}'
        RequireEachIncludedType: true

  SecretAttachment:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Properties:
      SecretId: !Ref MasterSecret
      TargetId: !Ref Cluster
      TargetType: AWS::RDS::DBCluster

  SubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "${NamePrefix} Aurora subnets (${Environment})"
      SubnetIds: !Ref SubnetIds

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${NamePrefix} Aurora cluster (${Environment})"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - Description: Database traffic from the application security group only
          IpProtocol: tcp
          FromPort: !If [IsPostgres, 5432, 3306]
          ToPort: !If [IsPostgres, 5432, 3306]
          SourceSecurityGroupId: !Ref ClientSecurityGroupId
      Tags:
        - Key: Name
          Value: !Sub "${NamePrefix}-aurora"

  Cluster:
    Type: AWS::RDS::DBCluster
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBClusterIdentifier: !Sub "${NamePrefix}-${Environment}"
      Engine: !Ref Engine
      EngineVersion: !Ref EngineVersion
      DatabaseName: !Ref DatabaseName
      MasterUsername: !Ref MasterUsername
      # Resolved by CloudFormation at deploy time from the secret above. The
      # value is never rendered into the template or the change set.
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${MasterSecret}::password}}"
      DBSubnetGroupName: !Ref SubnetGroup
      VpcSecurityGroupIds: [!Ref SecurityGroup]
      # StorageEncrypted cannot be turned on in place: retrofitting it means
      # snapshot, copy with a key, restore.
      StorageEncrypted: true
      KmsKeyId: !If [UsesKms, !Ref KmsKeyArn, !Ref "AWS::NoValue"]
      BackupRetentionPeriod: !Ref BackupRetentionDays
      DeletionProtection: !Ref DeletionProtection
      EnableHttpEndpoint: !Ref EnableDataApi
      ServerlessV2ScalingConfiguration:
        MinCapacity: !Ref MinCapacityAcu
        MaxCapacity: !Ref MaxCapacityAcu
      EnableCloudwatchLogsExports: !If
        - IsPostgres
        - [postgresql]
        - [error, slowquery]

  Writer:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub "${NamePrefix}-${Environment}-writer"
      DBClusterIdentifier: !Ref Cluster
      Engine: !Ref Engine
      # The magic instance class that makes an instance serverless. A normal
      # class here silently gives you a provisioned instance billed by the hour.
      DBInstanceClass: db.serverless
      PubliclyAccessible: false
      EnablePerformanceInsights: !Ref EnablePerformanceInsights
      # 7 days is the free tier; anything longer is billed per vCPU-month.
      PerformanceInsightsRetentionPeriod: 7

  Reader1:
    Type: AWS::RDS::DBInstance
    Condition: HasReaders
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub "${NamePrefix}-${Environment}-reader-1"
      DBClusterIdentifier: !Ref Cluster
      Engine: !Ref Engine
      DBInstanceClass: db.serverless
      PubliclyAccessible: false
      EnablePerformanceInsights: !Ref EnablePerformanceInsights

  Reader2:
    Type: AWS::RDS::DBInstance
    Condition: HasSecondReader
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub "${NamePrefix}-${Environment}-reader-2"
      DBClusterIdentifier: !Ref Cluster
      Engine: !Ref Engine
      DBInstanceClass: db.serverless
      PubliclyAccessible: false
      EnablePerformanceInsights: !Ref EnablePerformanceInsights

Outputs:
  ClusterEndpoint:
    Description: Writer endpoint. Always use this for writes; it follows a failover.
    Value: !GetAtt Cluster.Endpoint.Address

  ReaderEndpoint:
    Description: >-
      Reader endpoint, load-balanced across readers. With no readers it resolves
      to the writer, so it is safe to use unconditionally.
    Value: !GetAtt Cluster.ReadEndpoint.Address

  ClusterPort:
    Description: Port the cluster listens on.
    Value: !GetAtt Cluster.Endpoint.Port

  ClusterIdentifier:
    Description: Cluster identifier, for the CLI and alarm dimensions.
    Value: !Ref Cluster

  MasterSecretArn:
    Description: >-
      ARN of the generated master credentials. Pass this to a task definition's
      secrets block rather than reading the password anywhere.
    Value: !Ref MasterSecret

  SecurityGroupId:
    Description: Security group of the cluster.
    Value: !Ref SecurityGroup

  DatabaseName:
    Description: Name of the initial database.
    Value: !Ref DatabaseName