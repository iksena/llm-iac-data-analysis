AWSTemplateFormatVersion: 2010-09-09
Description: WordPress evolution stage 5 ALB and Auto Scaling app tier.

Parameters:
  LatestAmiId:
    Type: AWS::EC2::Image::Id
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnetAId:
    Type: AWS::EC2::Subnet::Id
  PublicSubnetBId:
    Type: AWS::EC2::Subnet::Id
  PublicSubnetCId:
    Type: AWS::EC2::Subnet::Id
  InstanceProfileName:
    Type: String
  EfsId:
    Type: String
  HostedZoneName:
    Description: Optional Route 53 hosted zone name, for example example.com. Leave blank to use the ALB DNS name.
    Type: String
    Default: ''
    AllowedPattern: '^$|^[A-Za-z0-9][A-Za-z0-9.-]*[A-Za-z0-9]$'
  HostedZoneId:
    Description: Optional Route 53 hosted zone ID for HostedZoneName. Required when using a custom domain.
    Type: String
    Default: ''
    AllowedPattern: '^$|^[A-Z0-9]+$'
  CustomSubdomainName:
    Description: Optional single DNS label for WordPress, for example wordpress. Leave blank to use the ALB DNS name.
    Type: String
    Default: ''
    AllowedPattern: '^$|^[A-Za-z0-9][A-Za-z0-9-]{0,62}$'

Rules:
  CustomDomainAllOrNone:
    Assertions:
      - Assert: !Or
          - !And
              - !Equals [!Ref HostedZoneName, '']
              - !Equals [!Ref HostedZoneId, '']
              - !Equals [!Ref CustomSubdomainName, '']
          - !And
              - !Not [!Equals [!Ref HostedZoneName, '']]
              - !Not [!Equals [!Ref HostedZoneId, '']]
              - !Not [!Equals [!Ref CustomSubdomainName, '']]
        AssertDescription: Enter HostedZoneName, HostedZoneId, and CustomSubdomainName together, or leave all three blank.

Conditions:
  HasHostedZoneName: !Not [!Equals [!Ref HostedZoneName, '']]
  HasHostedZoneId: !Not [!Equals [!Ref HostedZoneId, '']]
  HasCustomSubdomainName: !Not [!Equals [!Ref CustomSubdomainName, '']]
  UseCustomDomain: !And
    - !Condition HasHostedZoneName
    - !Condition HasHostedZoneId
    - !Condition HasCustomSubdomainName

Resources:
  SGALB:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref VpcId
      GroupDescription: Allow HTTP traffic to the WordPress ALB
      SecurityGroupIngress:
        - Description: Allow HTTP IPv4 from anywhere
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - !If
          - UseCustomDomain
          - Description: Allow HTTPS IPv4 from anywhere
            IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            CidrIp: 0.0.0.0/0
          - !Ref AWS::NoValue
      Tags:
        - Key: Name
          Value: alb-sg

  SGWordpress:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref VpcId
      GroupDescription: Allow HTTP traffic from the WordPress ALB
      SecurityGroupIngress:
        - Description: Allow HTTP from ALB
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref SGALB
      Tags:
        - Key: Name
          Value: wordpress-sg

  WordpressALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Subnets:
        - !Ref PublicSubnetAId
        - !Ref PublicSubnetBId
        - !Ref PublicSubnetCId
      SecurityGroups:
        - !Ref SGALB
      Tags:
        - Key: Name
          Value: wordpress-alb

  ALBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      TargetType: instance
      Protocol: HTTP
      Port: 80
      VpcId: !Ref VpcId
      HealthCheckPath: /
      Matcher:
        HttpCode: 200-399

  WordpressALBHttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref WordpressALB
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ALBTargetGroup

  WordpressALBHttpRedirectRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Condition: UseCustomDomain
    Properties:
      ListenerArn: !Ref WordpressALBHttpListener
      Priority: 1
      Conditions:
        - Field: host-header
          HostHeaderConfig:
            Values:
              - !Sub '${CustomSubdomainName}.${HostedZoneName}'
      Actions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: '443'
            StatusCode: HTTP_301

  WordpressCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: UseCustomDomain
    Properties:
      DomainName: !Sub '${CustomSubdomainName}.${HostedZoneName}'
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Sub '${CustomSubdomainName}.${HostedZoneName}'
          HostedZoneId: !Ref HostedZoneId

  WordpressALBHttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: UseCustomDomain
    Properties:
      LoadBalancerArn: !Ref WordpressALB
      Protocol: HTTPS
      Port: 443
      Certificates:
        - CertificateArn: !Ref WordpressCertificate
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ALBTargetGroup

  WordpressDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: UseCustomDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub '${CustomSubdomainName}.${HostedZoneName}.'
      Type: A
      AliasTarget:
        DNSName: !GetAtt WordpressALB.DNSName
        HostedZoneId: !GetAtt WordpressALB.CanonicalHostedZoneID

  WordpressLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      VersionDescription: Stage 5 WordPress ASG app tier with RDS and EFS
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: t2.micro
        SecurityGroupIds:
          - !Ref SGWordpress
        IamInstanceProfile:
          Name: !Ref InstanceProfileName
        DisableApiTermination: false
        CreditSpecification:
          CpuCredits: standard
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
          HttpPutResponseHopLimit: 2
        UserData:
          Fn::Base64:
            Fn::Sub:
              - |
                #!/bin/bash
                set -xe
                EFS_ID='${EfsId}'
                NEW_PUBLIC_SITE_URL='${PublicSiteUrl}'

                if ! rpm -q aws-cfn-bootstrap >/dev/null 2>&1; then dnf install -y aws-cfn-bootstrap; fi
                _cfn_exit() {
                  local s=$?
                  /opt/aws/bin/cfn-signal -e "$s" --stack ${AWS::StackId} --resource WordpressASG --region ${AWS::Region} || true
                }
                trap _cfn_exit EXIT

                DBName=$(aws ssm get-parameters --region ${AWS::Region} --names /Wordpress/DBName --query Parameters[0].Value --output text)
                DBUser=$(aws ssm get-parameters --region ${AWS::Region} --names /Wordpress/DBUser --query Parameters[0].Value --output text)
                DBEndpoint=$(aws ssm get-parameters --region ${AWS::Region} --names /Wordpress/DBEndpoint --query Parameters[0].Value --output text)
                DBPassword=$(aws ssm get-parameters --region ${AWS::Region} --names /Wordpress/DBPassword --with-decryption --query Parameters[0].Value --output text)

                dnf -y --refresh upgrade || true
                dnf install -y aws-cfn-bootstrap wget rsync httpd php php-mysqlnd php-fpm php-mysqli php-json php-mbstring php-xml php-gd php-opcache php-intl php-zip php-devel
                dnf install -y amazon-efs-utils stress || true
                systemctl enable httpd
                systemctl start httpd

                mkdir -p /var/www/html
                wget https://wordpress.org/latest.tar.gz -P /var/www/html
                cd /var/www/html
                tar -zxvf latest.tar.gz
                cp -rvf wordpress/* .
                rm -rf wordpress latest.tar.gz
                cp ./wp-config-sample.php ./wp-config.php
                sed -i "s/'database_name_here'/'$DBName'/g" wp-config.php
                sed -i "s/'username_here'/'$DBUser'/g" wp-config.php
                sed -i "s/'password_here'/'$DBPassword'/g" wp-config.php
                sed -i "s/'localhost'/'$DBEndpoint'/g" wp-config.php
                if ! grep -q 'Follow browser hostname and forwarded scheme for WP_HOME' wp-config.php; then
                  WPCONFIG_INSERT_TMP=$(mktemp)
                  WPCONFIG_MERGED_TMP=$(mktemp)
                  cat > "$WPCONFIG_INSERT_TMP" <<'WPCONFIG_BROWSER_HOST_SNIPPET'
                /* Follow browser hostname and forwarded scheme for WP_HOME and WP_SITEURL. */
                if (php_sapi_name() !== 'cli' && !empty($_SERVER['HTTP_HOST'])) {
                    $wp_forwarded_proto = '';
                    if (!empty($_SERVER['HTTP_X_FORWARDED_PROTO'])) {
                        $wp_forwarded_parts = explode(',', $_SERVER['HTTP_X_FORWARDED_PROTO']);
                        $wp_forwarded_proto = strtolower(trim($wp_forwarded_parts[0]));
                    }
                    if ($wp_forwarded_proto === 'https') {
                        $_SERVER['HTTPS'] = 'on';
                    }
                    $wp_scheme = ($wp_forwarded_proto === 'https' || (!empty($_SERVER['HTTPS']) && $_SERVER['HTTPS'] !== 'off')) ? 'https' : 'http';
                    define('WP_HOME', $wp_scheme . '://' . $_SERVER['HTTP_HOST']);
                    define('WP_SITEURL', $wp_scheme . '://' . $_SERVER['HTTP_HOST']);
                }
                WPCONFIG_BROWSER_HOST_SNIPPET
                  awk 'NR==FNR { buf = buf $0 ORS; next } /stop editing! Happy publishing/ && !done { printf "%s", buf; done=1 } { print }' "$WPCONFIG_INSERT_TMP" wp-config.php > "$WPCONFIG_MERGED_TMP"
                  mv "$WPCONFIG_MERGED_TMP" wp-config.php
                  rm -f "$WPCONFIG_INSERT_TMP"
                fi

                mkdir -p /var/www/html/wp-content-seed
                cp -a /var/www/html/wp-content/. /var/www/html/wp-content-seed/ || true
                rm -rf /var/www/html/wp-content
                mkdir -p /var/www/html/wp-content
                if ! grep -qE '^[^#].*[[:space:]]/var/www/html/wp-content[[:space:]]+' /etc/fstab; then
                  echo "$EFS_ID:/ /var/www/html/wp-content efs _netdev,tls,iam 0 0" >> /etc/fstab
                fi
                for attempt in $(seq 1 90); do
                  mount /var/www/html/wp-content 2>/dev/null || mount -t nfs4 -o nfsvers=4.1 "$EFS_ID.efs.${AWS::Region}.amazonaws.com:/" /var/www/html/wp-content 2>/dev/null || true
                  mountpoint -q /var/www/html/wp-content && break
                  sleep 5
                done
                mountpoint -q /var/www/html/wp-content
                if [ -z "$(find /var/www/html/wp-content -mindepth 1 -maxdepth 1 2>/dev/null)" ]; then
                  cp -a /var/www/html/wp-content-seed/. /var/www/html/wp-content/ || true
                fi

                usermod -a -G apache ec2-user || true
                mkdir -p /var/www/html/wp-content/uploads
                chown -R ec2-user:apache /var/www
                chmod 2775 /var/www
                find /var/www -type d -exec chmod 2775 {} \; 2>/dev/null || true
                find /var/www -type f -exec chmod 0664 {} \; 2>/dev/null || true
                SELINUX_STATE=$(getenforce 2>/dev/null || true)
                if [ "$SELINUX_STATE" = "Enforcing" ] || [ "$SELINUX_STATE" = "Permissive" ]; then
                  setsebool -P httpd_use_nfs 1 2>/dev/null || true
                fi

                curl -fsSLo /var/www/html/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar || true
                if [ -f /var/www/html/wp-cli.phar ]; then
                  RAW_HOME_URL=$(php /var/www/html/wp-cli.phar --path=/var/www/html --allow-root eval 'global $wpdb; echo $wpdb->get_var("SELECT option_value FROM {$wpdb->options} WHERE option_name = '\''home'\''");' 2>/dev/null || true)
                  RAW_SITEURL=$(php /var/www/html/wp-cli.phar --path=/var/www/html --allow-root eval 'global $wpdb; echo $wpdb->get_var("SELECT option_value FROM {$wpdb->options} WHERE option_name = '\''siteurl'\''");' 2>/dev/null || true)
                  php /var/www/html/wp-cli.phar --path=/var/www/html --allow-root option update home "$NEW_PUBLIC_SITE_URL" || true
                  php /var/www/html/wp-cli.phar --path=/var/www/html --allow-root option update siteurl "$NEW_PUBLIC_SITE_URL" || true
                  wp_search_replace_if_changed() {
                    old_value="$1"
                    new_value="$2"
                    if [ -n "$old_value" ] && [ "$old_value" != "$new_value" ]; then
                      php /var/www/html/wp-cli.phar --path=/var/www/html --allow-root search-replace "$old_value" "$new_value" --all-tables || true
                      old_no_slash=$(printf '%s' "$old_value" | sed 's|/*$||')
                      new_no_slash=$(printf '%s' "$new_value" | sed 's|/*$||')
                      php /var/www/html/wp-cli.phar --path=/var/www/html --allow-root search-replace "$old_no_slash/" "$new_no_slash/" --all-tables || true
                      old_lower=$(printf '%s' "$old_value" | tr '[:upper:]' '[:lower:]')
                      old_lower_no_slash=$(printf '%s' "$old_lower" | sed 's|/*$||')
                      if [ "$old_lower" != "$old_value" ]; then
                        php /var/www/html/wp-cli.phar --path=/var/www/html --allow-root search-replace "$old_lower" "$new_value" --all-tables || true
                        php /var/www/html/wp-cli.phar --path=/var/www/html --allow-root search-replace "$old_lower_no_slash/" "$new_no_slash/" --all-tables || true
                      fi
                    fi
                  }
                  wp_search_replace_if_changed "$RAW_HOME_URL" "$NEW_PUBLIC_SITE_URL"
                  wp_search_replace_if_changed "$RAW_SITEURL" "$NEW_PUBLIC_SITE_URL"
                fi
              - PublicSiteUrl: !If
                  - UseCustomDomain
                  - !Sub 'https://${CustomSubdomainName}.${HostedZoneName}'
                  - !Sub 'http://${WordpressALB.DNSName}'

  WordpressASG:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn:
      - WordpressALBHttpListener
    CreationPolicy:
      ResourceSignal:
        Count: 1
        Timeout: PT30M
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MaxBatchSize: 1
        MinInstancesInService: 0
        PauseTime: PT30M
        WaitOnResourceSignals: true
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref WordpressLaunchTemplate
        Version: !GetAtt WordpressLaunchTemplate.LatestVersionNumber
      VPCZoneIdentifier:
        - !Ref PublicSubnetAId
        - !Ref PublicSubnetBId
        - !Ref PublicSubnetCId
      TargetGroupARNs:
        - !Ref ALBTargetGroup
      HealthCheckType: ELB
      HealthCheckGracePeriod: 300
      DesiredCapacity: 1
      MinSize: 1
      MaxSize: 3
      MetricsCollection:
        - Granularity: 1Minute
      Tags:
        - Key: Name
          Value: wordpress-asg
          PropagateAtLaunch: true

  WpLowCreditScaleOut:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref WordpressASG
      PolicyType: SimpleScaling
      AdjustmentType: ChangeInCapacity
      ScalingAdjustment: 1
      Cooldown: 300

  WpLowCreditAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      MetricName: CPUCreditBalance
      Namespace: AWS/EC2
      Dimensions:
        - Name: AutoScalingGroupName
          Value: !Ref WordpressASG
      Statistic: Minimum
      Period: 120
      Threshold: 3
      ComparisonOperator: LessThanThreshold
      DatapointsToAlarm: 3
      EvaluationPeriods: 4
      AlarmActions:
        - !Ref WpLowCreditScaleOut

  WpHighCpuScaleOut:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref WordpressASG
      PolicyType: SimpleScaling
      AdjustmentType: ChangeInCapacity
      ScalingAdjustment: 1
      Cooldown: 300

  WpHighCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      MetricName: CPUUtilization
      Namespace: AWS/EC2
      Dimensions:
        - Name: AutoScalingGroupName
          Value: !Ref WordpressASG
      Statistic: Average
      Period: 120
      Threshold: 50
      ComparisonOperator: GreaterThanThreshold
      DatapointsToAlarm: 2
      EvaluationPeriods: 3
      AlarmActions:
        - !Ref WpHighCpuScaleOut

  WpLowCpuScaleIn:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref WordpressASG
      PolicyType: SimpleScaling
      AdjustmentType: ChangeInCapacity
      ScalingAdjustment: -1
      Cooldown: 300

  WpLowCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      MetricName: CPUUtilization
      Namespace: AWS/EC2
      Dimensions:
        - Name: AutoScalingGroupName
          Value: !Ref WordpressASG
      Statistic: Average
      Period: 120
      Threshold: 15
      ComparisonOperator: LessThanThreshold
      DatapointsToAlarm: 2
      EvaluationPeriods: 3
      AlarmActions:
        - !Ref WpLowCpuScaleIn

Outputs:
  WordpressURL:
    Value: !If
      - UseCustomDomain
      - !Sub 'https://${CustomSubdomainName}.${HostedZoneName}'
      - !Sub 'http://${WordpressALB.DNSName}'
  AlbDnsName:
    Value: !GetAtt WordpressALB.DNSName
  WordpressSecurityGroupId:
    Value: !Ref SGWordpress
  WordpressLaunchTemplateId:
    Value: !Ref WordpressLaunchTemplate