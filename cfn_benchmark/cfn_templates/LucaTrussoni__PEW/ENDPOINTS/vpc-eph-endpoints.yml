AWSTemplateFormatVersion: "2010-09-09"
Description: Ephemeral networking infrastructure

Resources:

  SSMEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !ImportValue PEW-VPC-ID
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ssm"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !ImportValue PEW-PRIVATE-SUBNET
      SecurityGroupIds:
        - !ImportValue PEW-VPC-SG-ID

  ECRApiEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !ImportValue PEW-VPC-ID
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ecr.api"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !ImportValue PEW-PRIVATE-SUBNET
      SecurityGroupIds:
        - !ImportValue PEW-VPC-SG-ID

  ECRDkrEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !ImportValue PEW-VPC-ID
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ecr.dkr"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !ImportValue PEW-PRIVATE-SUBNET
      SecurityGroupIds:
        - !ImportValue PEW-VPC-SG-ID

  CloudWatchLogsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !ImportValue PEW-VPC-ID
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.logs"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !ImportValue PEW-PRIVATE-SUBNET
      SecurityGroupIds:
        - !ImportValue PEW-VPC-SG-ID