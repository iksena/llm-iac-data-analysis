AWSTemplateFormatVersion: '2010-09-09'
Description: 'Price Staleness Scanner - Daily Lambda function to flag outdated market prices'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Environment name

  MarketPricesTableName:
    Type: String
    Default: kitchen-agent-market-prices
    Description: Name of the DynamoDB market prices table

  StalenessThresholdDays:
    Type: Number
    Default: 30
    Description: Number of days after which prices are considered stale

  AlertThresholdPercent:
    Type: Number
    Default: 50
    Description: Percentage of stale prices that triggers SNS alert

  AlertEmail:
    Type: String
    Default: ''
    Description: Email address for staleness alerts (optional)

Conditions:
  CreateSNSTopic: !Not [!Equals [!Ref AlertEmail, '']]

Resources:
  # SNS Topic for Alerts
  StalenessAlertTopic:
    Type: AWS::SNS::Topic
    Condition: CreateSNSTopic
    Properties:
      TopicName: !Sub '${Environment}-market-price-staleness-alerts'
      DisplayName: Market Price Staleness Alerts
      Subscription:
        - Endpoint: !Ref AlertEmail
          Protocol: email

  # IAM Role for Lambda
  PriceStalenessScannerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Environment}-price-staleness-scanner-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Scan
                  - dynamodb:UpdateItem
                Resource: !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${MarketPricesTableName}'

        - PolicyName: CloudWatchMetrics
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: '*'

        - PolicyName: SNSPublish
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource: !If
                  - CreateSNSTopic
                  - !Ref StalenessAlertTopic
                  - !Sub 'arn:aws:sns:${AWS::Region}:${AWS::AccountId}:*'

  # Lambda Function
  PriceStalenessScannerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Environment}-price-staleness-scanner'
      Description: Daily scanner to flag stale market prices (>30 days old)
      Runtime: python3.11
      Handler: price_staleness_scanner.lambda_handler
      Role: !GetAtt PriceStalenessScannerRole.Arn
      Timeout: 300
      MemorySize: 256
      Environment:
        Variables:
          TABLE_NAME: !Ref MarketPricesTableName
          STALENESS_THRESHOLD_DAYS: !Ref StalenessThresholdDays
          SNS_TOPIC_ARN: !If
            - CreateSNSTopic
            - !Ref StalenessAlertTopic
            - ''
          ALERT_THRESHOLD_PERCENT: !Ref AlertThresholdPercent
      Code:
        ZipFile: |
          # Placeholder - deploy actual code from infrastructure/lambda/price_staleness_scanner.py
          import json
          def lambda_handler(event, context):
              return {'statusCode': 200, 'body': json.dumps('Placeholder')}
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: AndraKitchenAgent
        - Key: Component
          Value: PriceStalenessScanner

  # CloudWatch Log Group
  PriceStalenessScannerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${PriceStalenessScannerFunction}'
      RetentionInDays: 30

  # EventBridge Rule - Daily at 2 AM UTC
  DailyScanSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${Environment}-price-staleness-daily-scan'
      Description: Trigger price staleness scanner daily at 2 AM UTC
      ScheduleExpression: 'cron(0 2 * * ? *)'
      State: ENABLED
      Targets:
        - Arn: !GetAtt PriceStalenessScannerFunction.Arn
          Id: PriceStalenessScannerTarget

  # Permission for EventBridge to invoke Lambda
  EventBridgeInvokeLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PriceStalenessScannerFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DailyScanSchedule.Arn

  # CloudWatch Alarm - High Staleness Percentage
  HighStalenessAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: CreateSNSTopic
    Properties:
      AlarmName: !Sub '${Environment}-high-price-staleness'
      AlarmDescription: Alert when more than 50% of market prices are stale
      MetricName: StalenessPercentage
      Namespace: AndraKitchenAgent/MarketPrices
      Statistic: Maximum
      Period: 86400  # 24 hours
      EvaluationPeriods: 1
      Threshold: !Ref AlertThresholdPercent
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
        - !Ref StalenessAlertTopic
      TreatMissingData: notBreaching

  # CloudWatch Alarm - Scanner Execution Failures
  ScannerFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: CreateSNSTopic
    Properties:
      AlarmName: !Sub '${Environment}-price-staleness-scanner-failures'
      AlarmDescription: Alert when price staleness scanner fails
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Ref PriceStalenessScannerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref StalenessAlertTopic
      TreatMissingData: notBreaching

Outputs:
  LambdaFunctionArn:
    Description: ARN of the price staleness scanner Lambda function
    Value: !GetAtt PriceStalenessScannerFunction.Arn
    Export:
      Name: !Sub '${Environment}-price-staleness-scanner-arn'

  LambdaFunctionName:
    Description: Name of the price staleness scanner Lambda function
    Value: !Ref PriceStalenessScannerFunction
    Export:
      Name: !Sub '${Environment}-price-staleness-scanner-name'

  ScheduleRuleArn:
    Description: ARN of the EventBridge schedule rule
    Value: !GetAtt DailyScanSchedule.Arn
    Export:
      Name: !Sub '${Environment}-price-staleness-schedule-arn'

  SNSTopicArn:
    Description: ARN of the SNS topic for alerts
    Condition: CreateSNSTopic
    Value: !Ref StalenessAlertTopic
    Export:
      Name: !Sub '${Environment}-price-staleness-alerts-topic-arn'

  CloudWatchLogGroup:
    Description: CloudWatch Log Group for Lambda function
    Value: !Ref PriceStalenessScannerLogGroup
    Export:
      Name: !Sub '${Environment}-price-staleness-scanner-logs'