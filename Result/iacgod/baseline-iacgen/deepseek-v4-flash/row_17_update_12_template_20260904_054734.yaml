AWSTemplateFormatVersion: "2010-09-09"
Description: "Creates two VPCs (Users and Fog) for edge computing with private connectivity to S3, KMS, and additional services for Fog VPC. IMPORTANT: This template creates two new VPCs. Ensure your AWS account has sufficient VPC capacity (default limit is 5 per region). If you encounter a 'maximum number of VPCs reached' error, request a VPC limit increase via the AWS Support Console or delete unused VPCs before deploying."
Resources:
  UsersVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.50.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: UsersVPC
  UsersSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref UsersVPC
      CidrBlock: 10.50.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: UsersSubnet
  UsersRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref UsersVPC
      Tags:
        - Key: Name
          Value: UsersRouteTable
  UsersSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref UsersSubnet
      RouteTableId: !Ref UsersRouteTable
  UsersS3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref UsersVPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref UsersRouteTable
  UsersKMSEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for KMS interface endpoint in Users VPC
      VpcId: !Ref UsersVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !GetAtt UsersVPC.CidrBlock
  UsersKMSEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref UsersVPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.kms"
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref UsersSubnet
      SecurityGroupIds:
        - !Ref UsersKMSEndpointSecurityGroup
      PrivateDnsEnabled: true
  FogVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.60.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: FogVPC
  FogSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref FogVPC
      CidrBlock: 10.60.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: FogSubnet
  FogRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref FogVPC
      Tags:
        - Key: Name
          Value: FogRouteTable
  FogSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref FogSubnet
      RouteTableId: !Ref FogRouteTable
  FogS3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref FogVPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref FogRouteTable
  FogEndpointsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for interface endpoints in Fog VPC
      VpcId: !Ref FogVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !GetAtt FogVPC.CidrBlock
  FogKMSEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref FogVPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.kms"
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref FogSubnet
      SecurityGroupIds:
        - !Ref FogEndpointsSecurityGroup
      PrivateDnsEnabled: true
  FogSecretsManagerEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref FogVPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.secretsmanager"
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref FogSubnet
      SecurityGroupIds:
        - !Ref FogEndpointsSecurityGroup
      PrivateDnsEnabled: true
  FogEventBridgeEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref FogVPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.events"
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref FogSubnet
      SecurityGroupIds:
        - !Ref FogEndpointsSecurityGroup
      PrivateDnsEnabled: true
  FogSTSEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref FogVPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.sts"
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref FogSubnet
      SecurityGroupIds:
        - !Ref FogEndpointsSecurityGroup
      PrivateDnsEnabled: true
  FogLambdaEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref FogVPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.lambda"
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref FogSubnet
      SecurityGroupIds:
        - !Ref FogEndpointsSecurityGroup
      PrivateDnsEnabled: true