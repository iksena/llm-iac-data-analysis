AWSTemplateFormatVersion: "2010-09-09"
Description: "CloudFormation template for KerberosEMRonEKS VPC with Microsoft AD infrastructure support, including subnets, NAT gateways, flow logs, KMS key, and VPC endpoints."

Parameters:
  VpcCidr:
    Type: String
    Default: "10.0.0.0/24"
    Description: "CIDR block for the VPC"
  PublicSubnet1Cidr:
    Type: String
    Default: "10.0.0.0/26"
    Description: "CIDR block for public subnet 1"
  PublicSubnet2Cidr:
    Type: String
    Default: "10.0.0.64/26"
    Description: "CIDR block for public subnet 2"
  PrivateSubnet1Cidr:
    Type: String
    Default: "10.0.0.128/26"
    Description: "CIDR block for private subnet 1"
  PrivateSubnet2Cidr:
    Type: String
    Default: "10.0.0.192/26"
    Description: "CIDR block for private subnet 2"
  AvailabilityZone1:
    Type: String
    Default: ""
    Description: "First availability zone (leave empty to auto-select)"
  AvailabilityZone2:
    Type: String
    Default: ""
    Description: "Second availability zone (leave empty to auto-select)"

Conditions:
  UseDefaultAz1: !Equals [!Ref AvailabilityZone1, ""]
  UseDefaultAz2: !Equals [!Ref AvailabilityZone2, ""]

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: "KerberosEMRonEKS-VPC"

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: "KerberosEMRonEKS-IGW"

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet1Cidr
      AvailabilityZone: !If [UseDefaultAz1, !Select [0, !GetAZs ""], !Ref AvailabilityZone1]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: "KerberosEMRonEKS-PublicSubnet1"

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet2Cidr
      AvailabilityZone: !If [UseDefaultAz2, !Select [1, !GetAZs ""], !Ref AvailabilityZone2]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: "KerberosEMRonEKS-PublicSubnet2"

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnet1Cidr
      AvailabilityZone: !If [UseDefaultAz1, !Select [0, !GetAZs ""], !Ref AvailabilityZone1]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: "KerberosEMRonEKS-PrivateSubnet1"

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnet2Cidr
      AvailabilityZone: !If [UseDefaultAz2, !Select [1, !GetAZs ""], !Ref AvailabilityZone2]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: "KerberosEMRonEKS-PrivateSubnet2"

  NatEIP1:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: "KerberosEMRonEKS-NatEIP1"

  NatEIP2:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: "KerberosEMRonEKS-NatEIP2"

  NatGateway1:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEIP1.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: "KerberosEMRonEKS-NatGateway1"

  NatGateway2:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEIP2.AllocationId
      SubnetId: !Ref PublicSubnet2
      Tags:
        - Key: Name
          Value: "KerberosEMRonEKS-NatGateway2"

  PublicRouteTable1:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: "KerberosEMRonEKS-PublicRouteTable1"

  PublicRouteTable2:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: "KerberosEMRonEKS-PublicRouteTable2"

  PublicRoute1:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PublicRouteTable1
      DestinationCidrBlock: "0.0.0.0/0"
      GatewayId: !Ref InternetGateway

  PublicRoute2:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PublicRouteTable2
      DestinationCidrBlock: "0.0.0.0/0"
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable1

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable2

  PrivateRouteTable1:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: "KerberosEMRonEKS-PrivateRouteTable1"

  PrivateRouteTable2:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: "KerberosEMRonEKS-PrivateRouteTable2"

  PrivateRoute1:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable1
      DestinationCidrBlock: "0.0.0.0/0"
      NatGatewayId: !Ref NatGateway1

  PrivateRoute2:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable2
      DestinationCidrBlock: "0.0.0.0/0"
      NatGatewayId: !Ref NatGateway2

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable1

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable2

  FlowLogKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: "KMS key for encrypting VPC flow logs"
      Enabled: true
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: "Enable IAM User Permissions"
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          - Sid: "Allow CloudWatch Logs to use the key"
            Effect: Allow
            Principal:
              Service: "logs.amazonaws.com"
            Action:
              - "kms:Encrypt"
              - "kms:Decrypt"
              - "kms:ReEncrypt*"
              - "kms:GenerateDataKey*"
              - "kms:DescribeKey"
            Resource: "*"
      Tags:
        - Key: Name
          Value: "KerberosEMRonEKS-FlowLogKmsKey"

  FlowLogLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: "/aws/vpc/flowlogs/KerberosEMRonEKS"
      RetentionInDays: 30
      Tags:
        - Key: Name
          Value: "KerberosEMRonEKS-FlowLogLogGroup"

  FlowLogRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: "vpc-flow-logs.amazonaws.com"
            Action: "sts:AssumeRole"
      Policies:
        - PolicyName: "FlowLogPolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - "logs:CreateLogStream"
                  - "logs:PutLogEvents"
                  - "logs:DescribeLogGroups"
                  - "logs:DescribeLogStreams"
                Resource: "*"
              - Effect: Allow
                Action:
                  - "kms:Encrypt"
                  - "kms:Decrypt"
                  - "kms:ReEncrypt*"
                  - "kms:GenerateDataKey*"
                  - "kms:DescribeKey"
                Resource: !GetAtt FlowLogKmsKey.Arn
      Tags:
        - Key: Name
          Value: "KerberosEMRonEKS-FlowLogRole"

  VPCFlowLog:
    Type: AWS::EC2::FlowLog
    Properties:
      ResourceId: !Ref VPC
      ResourceType: VPC
      TrafficType: ALL
      LogGroupName: !Ref FlowLogLogGroup
      DeliverLogsPermissionArn: !GetAtt FlowLogRole.Arn
      Tags:
        - Key: Name
          Value: "KerberosEMRonEKS-VPCFlowLog"

  VPCEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Security group for VPC interface endpoints"
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCidr
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCidr
      Tags:
        - Key: Name
          Value: "KerberosEMRonEKS-VPCEndpointSG"

  SSMEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ssm"
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup
      PrivateDnsEnabled: true
      Tags:
        - Key: Name
          Value: "KerberosEMRonEKS-SSM-Endpoint"

  SSMMessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ssmmessages"
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup
      PrivateDnsEnabled: true
      Tags:
        - Key: Name
          Value: "KerberosEMRonEKS-SSMMessages-Endpoint"

  EC2MessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ec2messages"
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup
      PrivateDnsEnabled: true
      Tags:
        - Key: Name
          Value: "KerberosEMRonEKS-EC2Messages-Endpoint"

  SecretsManagerEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.secretsmanager"
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup
      PrivateDnsEnabled: true
      Tags:
        - Key: Name
          Value: "KerberosEMRonEKS-SecretsManager-Endpoint"

Outputs:
  VpcId:
    Description: "VPC ID"
    Value: !Ref VPC
  PublicSubnet1Id:
    Description: "Public Subnet 1 ID"
    Value: !Ref PublicSubnet1
  PublicSubnet2Id:
    Description: "Public Subnet 2 ID"
    Value: !Ref PublicSubnet2
  PrivateSubnet1Id:
    Description: "Private Subnet 1 ID"
    Value: !Ref PrivateSubnet1
  PrivateSubnet2Id:
    Description: "Private Subnet 2 ID"
    Value: !Ref PrivateSubnet2
  NatGateway1Id:
    Description: "NAT Gateway 1 ID"
    Value: !Ref NatGateway1
  NatGateway2Id:
    Description: "NAT Gateway 2 ID"
    Value: !Ref NatGateway2
  FlowLogKmsKeyArn:
    Description: "KMS Key ARN for flow log encryption"
    Value: !GetAtt FlowLogKmsKey.Arn
  FlowLogLogGroupName:
    Description: "CloudWatch Log Group name for VPC flow logs"
    Value: !Ref FlowLogLogGroup
  VPCEndpointSecurityGroupId:
    Description: "Security Group ID for VPC endpoints"
    Value: !Ref VPCEndpointSecurityGroup
  SSMEndpointId:
    Description: "SSM VPC Endpoint ID"
    Value: !Ref SSMEndpoint
  SSMMessagesEndpointId:
    Description: "SSM Messages VPC Endpoint ID"
    Value: !Ref SSMMessagesEndpoint
  EC2MessagesEndpointId:
    Description: "EC2 Messages VPC Endpoint ID"
    Value: !Ref EC2MessagesEndpoint
  SecretsManagerEndpointId:
    Description: "Secrets Manager VPC Endpoint ID"
    Value: !Ref SecretsManagerEndpoint