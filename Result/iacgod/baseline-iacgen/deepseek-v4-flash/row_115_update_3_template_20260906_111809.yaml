AWSTemplateFormatVersion: "2010-09-09"
Description: "Step Functions state machine with version, alias, and multiple event-driven triggers"

Parameters:
  StateMachineName:
    Type: String
    Default: MyStateMachine
    Description: Name for the Step Functions state machine

Resources:
  # Step Functions State Machine
  StateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Ref StateMachineName
      DefinitionString: |-
        {
          "StartAt": "PassState",
          "States": {
            "PassState": {
              "Type": "Pass",
              "Result": 1,
              "End": true
            }
          }
        }
      RoleArn: !GetAtt StateMachineRole.Arn
      StateMachineType: STANDARD

  StateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StateMachinePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"

  # State Machine Version
  StateMachineVersion:
    Type: AWS::StepFunctions::StateMachineVersion
    Properties:
      StateMachineArn: !Ref StateMachine

  # State Machine Alias
  StateMachineAlias:
    Type: AWS::StepFunctions::StateMachineAlias
    Properties:
      Name: prod
      RoutingConfiguration:
        - StateMachineVersionArn: !Ref StateMachineVersion
          Weight: 100

  # IAM Role for API Gateway
  ApiGatewayRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StartExecutionPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Ref StateMachineAlias

  # API Gateway REST API
  RestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub "${StateMachineName}-api"
      Description: API to start Step Functions execution

  ApiResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: start

  ApiMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref ApiResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS
        IntegrationHttpMethod: POST
        Uri: !Sub "arn:aws:apigateway:${AWS::Region}:states:action/StartExecution"
        Credentials: !GetAtt ApiGatewayRole.Arn
        RequestTemplates:
          application/json: !Sub |
            {
              "stateMachineArn": "${StateMachineAlias}",
              "input": "{}"
            }
        IntegrationResponses:
          - StatusCode: 200
            ResponseTemplates:
              application/json: ""
      MethodResponses:
        - StatusCode: 200

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: ApiMethod
    Properties:
      RestApiId: !Ref RestApi
      StageName: prod

  # EventBridge Rule for terminated state changes
  EventRuleTerminated:
    Type: AWS::Events::Rule
    Properties:
      EventPattern:
        source:
          - aws.states
        detail-type:
          - Step Functions Execution Status Change
        detail:
          status:
            - SUCCEEDED
            - FAILED
            - TIMED_OUT
            - ABORTED
      State: ENABLED
      Targets:
        - Arn: !Ref StateMachineAlias
          Id: StateMachineTarget
          RoleArn: !GetAtt EventRoleTerminated.Arn

  EventRoleTerminated:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StartExecutionPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Ref StateMachineAlias

  # EventBridge Scheduled Rule (disabled, every minute)
  EventRuleScheduled:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: rate(1 minute)
      State: DISABLED
      Targets:
        - Arn: !Ref StateMachineAlias
          Id: StateMachineTarget
          RoleArn: !GetAtt EventRoleScheduled.Arn

  EventRoleScheduled:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StartExecutionPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Ref StateMachineAlias

  # EventBridge Rule for tag events
  EventRuleTagEvents:
    Type: AWS::Events::Rule
    Properties:
      EventPattern:
        source:
          - aws.tag
        detail-type:
          - Tag Change on Resource
      State: ENABLED
      Targets:
        - Arn: !Ref StateMachineAlias
          Id: StateMachineTarget
          RoleArn: !GetAtt EventRoleTagEvents.Arn

  EventRoleTagEvents:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StartExecutionPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Ref StateMachineAlias

  # EventBridge Scheduler Schedule (every minute, flexible time windows disabled)
  SchedulerSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      FlexibleTimeWindow:
        Mode: "OFF"
      ScheduleExpression: rate(1 minute)
      State: ENABLED
      Target:
        Arn: !Ref StateMachineAlias
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: "{}"

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StartExecutionPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Ref StateMachineAlias

Outputs:
  StateMachineAliasArn:
    Description: ARN of the Step Functions alias
    Value: !Ref StateMachineAlias
  ApiEndpoint:
    Description: Invoke URL for the API Gateway
    Value: !Sub "https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/prod/start"