AWSTemplateFormatVersion: "2010-09-09"
Description: "Configures subnets, route tables, and VPC endpoints for Users and Fog layers using existing VPCs. IMPORTANT: Provide two existing VPC IDs as parameters. Ensure your account has at least 2 VPCs available (default limit is 5 per region). If you need to create new VPCs, please request a VPC limit increase via AWS Support Console or delete unused VPCs."
Parameters:
  ExistingUsersVPCId:
    Type: String
    Description: "ID of the existing VPC for the Users layer (CIDR 10.50.0.0/16 recommended)."
    AllowedPattern: "^vpc-[0-9a-f]{8,17}$"
    ConstraintDescription: "Must be a valid VPC ID starting with vpc-"
  ExistingFogVPCId:
    Type: String
    Description: "ID of the existing VPC for the Fog layer (CIDR 10.60.0.0/16 recommended)."
    AllowedPattern: "^vpc-[0-9a-f]{8,17}$"
    ConstraintDescription: "Must be a valid VPC ID starting with vpc-"
Resources:
  UsersSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ExistingUsersVPCId
      CidrBlock: 10.50.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: UsersSubnet
  UsersRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref ExistingUsersVPCId
      Tags:
        - Key: Name
          Value: UsersRouteTable
  UsersSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref UsersSubnet
      RouteTableId: !Ref UsersRouteTable
  UsersS3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref ExistingUsersVPCId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref UsersRouteTable
  UsersKMSEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for KMS interface endpoint in Users VPC
      VpcId: !Ref ExistingUsersVPCId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 10.50.0.0/16
  UsersKMSEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref ExistingUsersVPCId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.kms"
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref UsersSubnet
      SecurityGroupIds:
        - !Ref UsersKMSEndpointSecurityGroup
      PrivateDnsEnabled: true
  FogSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ExistingFogVPCId
      CidrBlock: 10.60.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: FogSubnet
  FogRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref ExistingFogVPCId
      Tags:
        - Key: Name
          Value: FogRouteTable
  FogSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref FogSubnet
      RouteTableId: !Ref FogRouteTable
  FogS3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref ExistingFogVPCId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref FogRouteTable
  FogEndpointsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for interface endpoints in Fog VPC
      VpcId: !Ref ExistingFogVPCId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 10.60.0.0/16
  FogKMSEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref ExistingFogVPCId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.kms"
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref FogSubnet
      SecurityGroupIds:
        - !Ref FogEndpointsSecurityGroup
      PrivateDnsEnabled: true
  FogSecretsManagerEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref ExistingFogVPCId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.secretsmanager"
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref FogSubnet
      SecurityGroupIds:
        - !Ref FogEndpointsSecurityGroup
      PrivateDnsEnabled: true
  FogEventBridgeEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref ExistingFogVPCId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.events"
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref FogSubnet
      SecurityGroupIds:
        - !Ref FogEndpointsSecurityGroup
      PrivateDnsEnabled: true
  FogSTSEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref ExistingFogVPCId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.sts"
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref FogSubnet
      SecurityGroupIds:
        - !Ref FogEndpointsSecurityGroup
      PrivateDnsEnabled: true
  FogLambdaEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref ExistingFogVPCId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.lambda"
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref FogSubnet
      SecurityGroupIds:
        - !Ref FogEndpointsSecurityGroup
      PrivateDnsEnabled: true