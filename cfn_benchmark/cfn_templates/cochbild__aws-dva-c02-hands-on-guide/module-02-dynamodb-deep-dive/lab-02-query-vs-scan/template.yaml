AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: |
  DVA-C02 Lab 2.2 — Query vs Scan
  Composite key table with seed/query/scan functions.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    LoggingConfig:
      LogFormat: JSON

Resources:
  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: dva-lab-02-02-orders
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: order_sk     # composite sort key: <date>#<order_id>
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: order_sk
          KeyType: RANGE

  SeedFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dva-lab-02-02-seed
      CodeUri: src/
      Handler: seed.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref OrdersTable
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref OrdersTable

  QueryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dva-lab-02-02-query
      CodeUri: src/
      Handler: query.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref OrdersTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref OrdersTable

  ScanFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dva-lab-02-02-scan
      CodeUri: src/
      Handler: scan.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref OrdersTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref OrdersTable

Outputs:
  TableName:
    Value: !Ref OrdersTable
  SeedFunctionName:
    Value: !Ref SeedFunction
  QueryFunctionName:
    Value: !Ref QueryFunction
  ScanFunctionName:
    Value: !Ref ScanFunction