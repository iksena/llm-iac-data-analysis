AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  DynamoDB table with encryption, point-in-time recovery, optional sort key, a
  global secondary index, TTL and change streams.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Naming
        Parameters:
          - NamePrefix
          - Environment
          - TableSuffix
      - Label:
          default: Key schema (immutable after creation)
        Parameters:
          - PartitionKeyName
          - PartitionKeyType
          - SortKeyName
          - SortKeyType
      - Label:
          default: Capacity
        Parameters:
          - BillingMode
          - ReadCapacityUnits
          - WriteCapacityUnits
      - Label:
          default: Global secondary index
        Parameters:
          - IndexName
          - IndexPartitionKeyName
          - IndexSortKeyName
          - IndexProjection
      - Label:
          default: Durability and lifecycle
        Parameters:
          - PointInTimeRecovery
          - DeletionProtection
          - TtlAttributeName
          - StreamViewType
      - Label:
          default: Encryption
        Parameters:
          - KmsKeyArn

Parameters:
  NamePrefix:
    Type: String
    Description: Prefix for the table name.
    AllowedPattern: "^[a-z][a-z0-9-]{1,30}[a-z0-9]$"
    ConstraintDescription: 3-32 lowercase characters, digits and hyphens.

  Environment:
    Type: String
    Description: Environment this table belongs to.
    Default: dev
    AllowedValues: [dev, staging, prod]

  TableSuffix:
    Type: String
    Description: What this table holds, e.g. "orders" or "sessions".
    Default: items
    AllowedPattern: "^[a-zA-Z0-9_.-]{1,50}$"

  PartitionKeyName:
    Type: String
    Description: >-
      Partition key attribute. This and the sort key are the only access pattern
      the base table supports, and neither can be changed after creation -
      changing one means creating a new table and migrating.
    Default: pk
    AllowedPattern: "^[a-zA-Z0-9_.-]{1,255}$"

  PartitionKeyType:
    Type: String
    Description: S (string), N (number) or B (binary).
    Default: S
    AllowedValues: [S, N, B]

  SortKeyName:
    Type: String
    Description: >-
      Sort key attribute. Leave empty for a key-value table. A sort key is what
      makes range queries, prefix queries and single-table designs possible, and
      it cannot be added later.
    Default: sk
    AllowedPattern: "^[a-zA-Z0-9_.-]{0,255}$"

  SortKeyType:
    Type: String
    Description: Sort key attribute type.
    Default: S
    AllowedValues: [S, N, B]

  BillingMode:
    Type: String
    Description: >-
      PAY_PER_REQUEST bills per read and write with no capacity to manage and no
      throttling. PROVISIONED is meaningfully cheaper only at high, steady,
      well-understood traffic - and throttles when you are wrong.
    Default: PAY_PER_REQUEST
    AllowedValues: [PAY_PER_REQUEST, PROVISIONED]

  ReadCapacityUnits:
    Type: Number
    Description: Read units, when BillingMode is PROVISIONED.
    Default: 5
    MinValue: 1
    MaxValue: 40000

  WriteCapacityUnits:
    Type: Number
    Description: Write units, when BillingMode is PROVISIONED.
    Default: 5
    MinValue: 1
    MaxValue: 40000

  IndexName:
    Type: String
    Description: >-
      Name of a global secondary index. Leave empty for none. A GSI is a second
      copy of the projected attributes with its own capacity, so it costs
      storage and write units on every write to the base table.
    Default: ""

  IndexPartitionKeyName:
    Type: String
    Description: Partition key attribute of the index. Required when IndexName is set.
    Default: ""

  IndexSortKeyName:
    Type: String
    Description: Optional sort key attribute of the index.
    Default: ""

  IndexProjection:
    Type: String
    Description: >-
      KEYS_ONLY projects only the keys - cheapest, and enough when you follow up
      with a GetItem. ALL projects every attribute, doubling storage and write
      cost. INCLUDE is not offered here because it needs an attribute list.
    Default: KEYS_ONLY
    AllowedValues: [KEYS_ONLY, ALL]

  PointInTimeRecovery:
    Type: String
    Description: >-
      Continuous backups with restore to any second in the last 35 days. This is
      the only defence against a bad migration or a runaway delete, it costs
      roughly 20% of table storage, and it cannot be applied retroactively - the
      window starts when you turn it on.
    Default: "true"
    AllowedValues: ["true", "false"]

  DeletionProtection:
    Type: String
    Description: >-
      Refuse to delete the table, even by API. Distinct from DeletionPolicy,
      which only stops CloudFormation.
    Default: "false"
    AllowedValues: ["true", "false"]

  TtlAttributeName:
    Type: String
    Description: >-
      Attribute holding a Unix epoch-second expiry. DynamoDB deletes expired
      items within about 48 hours, free, and the delete appears in the stream.
      Leave empty to disable.
    Default: ""

  StreamViewType:
    Type: String
    Description: >-
      Change stream contents. NONE disables streams. NEW_AND_OLD_IMAGES is what
      change-data-capture and audit consumers need; enabling a stream later
      starts it empty, so the history in between is lost.
    Default: NONE
    AllowedValues: [NONE, KEYS_ONLY, NEW_IMAGE, OLD_IMAGE, NEW_AND_OLD_IMAGES]

  KmsKeyArn:
    Type: String
    Description: >-
      Customer-managed KMS key. Leave empty for the AWS-owned key, which is free
      and still means the table is encrypted at rest.
    Default: ""

Conditions:
  HasSortKey: !Not [!Equals [!Ref SortKeyName, ""]]
  IsProvisioned: !Equals [!Ref BillingMode, "PROVISIONED"]
  HasIndex: !Not [!Equals [!Ref IndexName, ""]]
  HasIndexSortKey: !And [!Condition HasIndex, !Not [!Equals [!Ref IndexSortKeyName, ""]]]
  HasTtl: !Not [!Equals [!Ref TtlAttributeName, ""]]
  HasStream: !Not [!Equals [!Ref StreamViewType, "NONE"]]
  UsesKms: !Not [!Equals [!Ref KmsKeyArn, ""]]

Resources:
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "${NamePrefix}-${Environment}-${TableSuffix}"
      BillingMode: !Ref BillingMode
      ProvisionedThroughput: !If
        - IsProvisioned
        - ReadCapacityUnits: !Ref ReadCapacityUnits
          WriteCapacityUnits: !Ref WriteCapacityUnits
        - !Ref AWS::NoValue
      # Only key attributes are declared. DynamoDB is schemaless for everything
      # else, and declaring a non-key attribute here is rejected.
      AttributeDefinitions:
        - AttributeName: !Ref PartitionKeyName
          AttributeType: !Ref PartitionKeyType
        - !If
          - HasSortKey
          - AttributeName: !Ref SortKeyName
            AttributeType: !Ref SortKeyType
          - !Ref AWS::NoValue
        - !If
          - HasIndex
          - AttributeName: !Ref IndexPartitionKeyName
            AttributeType: S
          - !Ref AWS::NoValue
        - !If
          - HasIndexSortKey
          - AttributeName: !Ref IndexSortKeyName
            AttributeType: S
          - !Ref AWS::NoValue
      KeySchema:
        - AttributeName: !Ref PartitionKeyName
          KeyType: HASH
        - !If
          - HasSortKey
          - AttributeName: !Ref SortKeyName
            KeyType: RANGE
          - !Ref AWS::NoValue
      GlobalSecondaryIndexes: !If
        - HasIndex
        - - IndexName: !Ref IndexName
            KeySchema:
              - AttributeName: !Ref IndexPartitionKeyName
                KeyType: HASH
              - !If
                - HasIndexSortKey
                - AttributeName: !Ref IndexSortKeyName
                  KeyType: RANGE
                - !Ref AWS::NoValue
            Projection:
              ProjectionType: !Ref IndexProjection
            ProvisionedThroughput: !If
              - IsProvisioned
              - ReadCapacityUnits: !Ref ReadCapacityUnits
                WriteCapacityUnits: !Ref WriteCapacityUnits
              - !Ref AWS::NoValue
        - !Ref AWS::NoValue
      SSESpecification:
        SSEEnabled: true
        SSEType: !If [UsesKms, KMS, !Ref "AWS::NoValue"]
        KMSMasterKeyId: !If [UsesKms, !Ref KmsKeyArn, !Ref "AWS::NoValue"]
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !Ref PointInTimeRecovery
      DeletionProtectionEnabled: !Ref DeletionProtection
      TimeToLiveSpecification: !If
        - HasTtl
        - AttributeName: !Ref TtlAttributeName
          Enabled: true
        - !Ref AWS::NoValue
      StreamSpecification: !If
        - HasStream
        - StreamViewType: !Ref StreamViewType
        - !Ref AWS::NoValue

Outputs:
  TableName:
    Description: Table name, for the SDK and for alarm dimensions.
    Value: !Ref Table

  TableArn:
    Description: Table ARN, for IAM policies. Index access also needs "<arn>/index/*".
    Value: !GetAtt Table.Arn

  StreamArn:
    Description: >-
      Change stream ARN, for a Lambda event source mapping. Present only when
      StreamViewType is not NONE.
    Condition: HasStream
    Value: !GetAtt Table.StreamArn