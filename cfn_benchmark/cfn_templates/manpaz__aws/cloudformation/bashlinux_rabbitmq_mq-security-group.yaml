---
# Bashlinux::RabbitMQ::MQ Security Group
#
#   Cloudformation template to deploy an EC2 security group
#   for an MQ cluster exposing the RabbitMQ port
#   on a private subnet
#
#   Manuel F Martinez
#   Bashlinux
#   Los Angeles, CA
#
AWSTemplateFormatVersion: "2010-09-09"
Description: MQ RabbitMQ Security Group template

###############################################################################
Parameters:

  Environment:
    Description: RabbitMQ cluster environment
    Type: String
    MinLength: "1"
    MaxLength: "20"
    Default: staging
    AllowedValues: [ "prod", "staging" ]
    ConstraintDescription: >
      Environment name can only contain "prod" or "staging".

  Organization:
    Description: Organization or Customer name
    Type: String
    MinLength: "1"
    MaxLength: "32"
    Default: bashlinux
    AllowedPattern: "[a-zA-Z0-9\\-]*"
    ConstraintDescription: >
      Name of the organization must contains only letters, numbers and hyphens

###############################################################################
Resources:

  MqRabbitmqSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Enable access to the RabbitMQ cluster port
      VpcId: !ImportValue
        "Fn::Sub": "bashlinux-${Environment}-VpcId"
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: "5671"
        ToPort: "5671"
        SourceSecurityGroupId: !ImportValue
          "Fn::Sub": "bashlinux-${Environment}-Ec2BastionSecurityGroupId"
      - IpProtocol: tcp
        FromPort: "15671"
        ToPort: "15671"
        SourceSecurityGroupId: !ImportValue
          "Fn::Sub": "bashlinux-${Environment}-Ec2BastionSecurityGroupId"
      SecurityGroupEgress:
      - IpProtocol: "-1"
        FromPort: "0"
        ToPort: "65535"
        CidrIp: 0.0.0.0/0
      Tags:
      - Key: Name
        Value: !Sub "${Organization}-${Environment}-rabbitmq-sg"
      - Key: bashlinux:organization-name
        Value: !Ref Organization
      - Key: bashlinux:environment-name
        Value: !Ref Environment
      - Key: bashlinux:application-id
        Value: !Ref AWS::StackName
      - Key: bashlinux:can-delete
        Value: "false"

  ingressMqBrokers:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: "RabbitMQ: Access from the MQ brokers"
      GroupId: !GetAtt MqRabbitmqSecurityGroup.GroupId
      SourceSecurityGroupId: !GetAtt MqRabbitmqSecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: "5671"
      ToPort: "5671"

###############################################################################
Outputs:

  MqRabbitmqSecurityGroupId:
    Description: "SecurityGroup: MQ RabbitMQ port exposed"
    Value: !GetAtt MqRabbitmqSecurityGroup.GroupId
    Export:
      Name: !Sub "${Organization}-${Environment}-MqRabbitmqSecurityGroup"