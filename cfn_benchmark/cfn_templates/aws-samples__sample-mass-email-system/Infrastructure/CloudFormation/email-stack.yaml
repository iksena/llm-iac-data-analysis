                      'RecipientTrackingTable': recipient_table_name,
                      'BatchTrackingTable': batch_table_name,
                      'TrackingRetentionDays': ttl_days,
                  })
                  logger.info(f'Registered campaign {campaign_id} in {registry_table}')
              except Exception as e:
                  logger.warning(f'Could not register campaign {campaign_id}: {e}')
