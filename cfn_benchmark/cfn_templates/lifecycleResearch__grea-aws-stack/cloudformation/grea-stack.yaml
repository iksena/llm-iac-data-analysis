AWSTemplateFormatVersion: '2010-09-09'
Description: >
  GREA Free-Tier AWS Stack — DynamoDB, EC2, SES, S3, IAM for email outreach
  and analytics pipelines.

Parameters:
  EnvironmentName:
    Description: Logical name for this environment (production, staging, dev)
    Type: String
    Default: production
    AllowedPattern: '^[a-zA-Z0-9-]+$'
    ConstraintDescription: Must contain only alphanumeric characters and hyphens.

  InstanceType:
    Description: EC2 instance type (free-tier eligible)
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium
      - t2.micro
      - t2.small
    ConstraintDescription: Must be a free-tier eligible instance type.

  MailDomain:
    Description: Domain for SES identity (must be registered/accessible for DNS verification)
    Type: String
    Default: grea.site
    AllowedPattern: '^([a-zA-Z0-9]+(-[a-zA-Z0-9]+)*\.)+[a-zA-Z]{2,}$'
    ConstraintDescription: Must be a valid domain name.

  KeyName:
    Description: Name of an existing EC2 KeyPair for SSH access
    Type: AWS::EC2::KeyPair::KeyName
    Default: grea-ec2-key

  SSHLocation:
    Description: CIDR block for SSH access to the EC2 instance
    Type: String
    Default: 0.0.0.0/0
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    ConstraintDescription: Must be a valid CIDR notation IP address range (e.g. 0.0.0.0/0).

Conditions:
  IsDefaultSSH: !Equals [!Ref SSHLocation, '0.0.0.0/0']

Resources:
  # ──────────────────────────────────────────────
  # DynamoDB Tables
  # ──────────────────────────────────────────────

  ContactsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'grea-contacts-${EnvironmentName}'
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
        - AttributeName: status
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: status-index
          KeySchema:
            - AttributeName: status
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: GREA

  SendsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'grea-sends-${EnvironmentName}'
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
        - AttributeName: sent_at
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH
        - AttributeName: sent_at
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: GREA

  PipelineJobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'grea-pipeline-jobs-${EnvironmentName}'
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: GREA

  StatsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'grea-stats-${EnvironmentName}'
      AttributeDefinitions:
        - AttributeName: date
          AttributeType: S
        - AttributeName: metric
          AttributeType: S
      KeySchema:
        - AttributeName: date
          KeyType: HASH
        - AttributeName: metric
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: GREA

  # ──────────────────────────────────────────────
  # IAM Role + Instance Profile
  # ──────────────────────────────────────────────

  EC2Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'grea-ec2-role-${EnvironmentName}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:DescribeTable
                Resource:
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/grea-contacts-${EnvironmentName}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/grea-contacts-${EnvironmentName}/index/*'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/grea-sends-${EnvironmentName}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/grea-sends-${EnvironmentName}/index/*'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/grea-pipeline-jobs-${EnvironmentName}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/grea-pipeline-jobs-${EnvironmentName}/index/*'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/grea-stats-${EnvironmentName}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/grea-stats-${EnvironmentName}/index/*'
        - PolicyName: SESAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                  - ses:GetSendQuota
                  - ses:GetSendStatistics
                  - ses:ListIdentities
                Resource: '*'
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:GetBucketLocation
                Resource:
                  - !Sub 'arn:aws:s3:::grea-exports-${EnvironmentName}-*'
                  - !Sub 'arn:aws:s3:::grea-exports-${EnvironmentName}-*/*'
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: GREA

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub 'grea-ec2-profile-${EnvironmentName}'
      Roles:
        - !Ref EC2Role

  # ──────────────────────────────────────────────
  # Security Group
  # ──────────────────────────────────────────────

  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: GREA web and gateway security group
      GroupName: !Sub 'grea-web-sg-${EnvironmentName}'
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SSHLocation
          Description: SSH access
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS
        - IpProtocol: tcp
          FromPort: 8642
          ToPort: 8642
          CidrIp: 0.0.0.0/0
          Description: Hermes Gateway
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: GREA

  # ──────────────────────────────────────────────
  # EC2 Instance
  # ──────────────────────────────────────────────

  EC2Instance:
    Type: AWS::EC2::Instance
    DependsOn:
      - EC2InstanceProfile
      - WebSecurityGroup
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !FindInMap [RegionMap, !Ref 'AWS::Region', AMI]
      KeyName: !Ref KeyName
      SecurityGroupIds:
        - !Ref WebSecurityGroup
      IamInstanceProfile: !Ref EC2InstanceProfile
      AssociatePublicIpAddress: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail

          # Bootstrap script embedded inline — see scripts/bootstrap-ec2.sh for source
          export ENVIRONMENT_NAME=${EnvironmentName}
          export MAIL_DOMAIN=${MailDomain}
          export AWS_DEFAULT_REGION=${AWS::Region}

          # Run the bootstrap
          curl -sSL https://raw.githubusercontent.com/lifecycleResearch/grea-aws-stack/main/scripts/bootstrap-ec2.sh | bash
      Tags:
        - Key: Name
          Value: !Sub 'grea-hermes-${EnvironmentName}'
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: GREA

  # ──────────────────────────────────────────────
  # S3 Export Bucket
  # ──────────────────────────────────────────────

  ExportBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'grea-exports-${EnvironmentName}-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: NoncurrentVersionExpiration
            Status: Enabled
            NoncurrentVersionExpirationInDays: 30
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: GREA

  # ──────────────────────────────────────────────
  # SES Domain Identity
  # ──────────────────────────────────────────────

  SESDomainIdentity:
    Type: AWS::SES::EmailIdentity
    Properties:
      EmailIdentity: !Ref MailDomain
      MailFromAttributes:
        MailFromDomain: !Sub 'bounce.${MailDomain}'

Outputs:
  StackName:
    Description: CloudFormation stack name
    Value: !Ref 'AWS::StackName'

  EnvironmentName:
    Description: Environment name
    Value: !Ref EnvironmentName

  EC2InstanceId:
    Description: EC2 instance ID
    Value: !Ref EC2Instance

  EC2PublicIP:
    Description: Public IP address of the EC2 instance
    Value: !GetAtt EC2Instance.PublicIp

  EC2PublicDnsName:
    Description: Public DNS name of the EC2 instance
    Value: !GetAtt EC2Instance.PublicDnsName

  EC2SecurityGroup:
    Description: EC2 security group ID
    Value: !Ref WebSecurityGroup

  ContactsTable:
    Description: DynamoDB contacts table name
    Value: !Ref ContactsTable

  SendsTable:
    Description: DynamoDB sends table name
    Value: !Ref SendsTable

  PipelineJobsTable:
    Description: DynamoDB pipeline jobs table name
    Value: !Ref PipelineJobsTable

  StatsTable:
    Description: DynamoDB stats table name
    Value: !Ref StatsTable

  ExportBucketName:
    Description: S3 export bucket name
    Value: !Ref ExportBucket

  IAMRoleArn:
    Description: EC2 IAM role ARN
    Value: !GetAtt EC2Role.Arn

  SESDomainArn:
    Description: SES verified domain identity ARN
    Value: !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${MailDomain}'

  SESDkimTokens:
    Description: DKIM DNS tokens for domain verification (add these as CNAME records in your DNS provider)
    Value: !Join [',', [!GetAtt SESDomainIdentity.DkimDNSTokenName1, !GetAtt SESDomainIdentity.DkimDNSTokenName2, !GetAtt SESDomainIdentity.DkimDNSTokenName3]]

