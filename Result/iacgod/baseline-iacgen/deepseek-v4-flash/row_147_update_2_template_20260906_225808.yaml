AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudFormation template to connect AWS account to marbot.io monitoring service with EventBridge API destination, cross-account IAM role, and feature-flagged permissions.'
Parameters:
  MarbotEndpointId:
    Type: String
    Description: The endpoint ID provided by marbot.io for this connection.
    NoEcho: true
    AllowedPattern: '^[a-zA-Z0-9_-]+$'
    ConstraintDescription: Must contain only alphanumeric characters, hyphens, or underscores.
  MarbotAwsAccountId:
    Type: String
    Description: The AWS account ID of the marbot.io service that will assume the cross-account role.
    AllowedPattern: '^\d{12}$'
    ConstraintDescription: Must be a 12-digit AWS account ID.
  MarbotApiBaseUrl:
    Type: String
    Description: The base URL for marbot.io API endpoints.
    Default: 'https://api.marbot.io'
    AllowedPattern: '^https://[a-zA-Z0-9.-]+(:[0-9]+)?(/.*)?$'
    ConstraintDescription: Must be a valid HTTPS URL.
  EnableAutoMonitoring:
    Type: String
    Description: Enable automatic configuration of CloudWatch alarms and monitoring rules.
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
  EnableAccountAlias:
    Type: String
    Description: Enable enrichment of account IDs with friendly aliases.
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
  EnableMetricGraphs:
    Type: String
    Description: Enable embedding metric graphs into CloudWatch alarm notifications.
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
  EnableCodePipelineApproval:
    Type: String
    Description: Enable automatic approval or rejection of CodePipeline manual approval requests.
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
Conditions:
  AutoMonitoringEnabled:
    Fn::Equals:
      - Ref: EnableAutoMonitoring
      - 'true'
  AccountAliasEnabled:
    Fn::Equals:
      - Ref: EnableAccountAlias
      - 'true'
  MetricGraphsEnabled:
    Fn::Equals:
      - Ref: EnableMetricGraphs
      - 'true'
  CodePipelineApprovalEnabled:
    Fn::Equals:
      - Ref: EnableCodePipelineApproval
      - 'true'
Resources:
  EventBridgeConnection:
    Type: AWS::Events::Connection
    Properties:
      Name:
        Fn::Sub: 'marbot-connection-${AWS::StackName}'
      Description: 'Connection to marbot.io monitoring service.'
      AuthorizationType: API_KEY
      AuthParameters:
        ApiKeyAuthParameters:
          ApiKeyName: 'X-API-Key'
          ApiKeyValue:
            Ref: MarbotEndpointId
  EventBridgeApiDestination:
    Type: AWS::Events::ApiDestination
    Properties:
      Name:
        Fn::Sub: 'marbot-api-destination-${AWS::StackName}'
      Description: 'API destination for marbot.io keepalive and registration calls.'
      ConnectionArn:
        Fn::GetAtt:
          - EventBridgeConnection
          - Arn
      HttpMethod: POST
      InvocationEndpoint:
        Fn::Sub: '${MarbotApiBaseUrl}/v1/keepalive'
      InvocationRateLimitPerSecond: 10
  EventBridgeInvocationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: 'marbot-eventbridge-invocation-${AWS::StackName}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeApiDestination
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: events:InvokeApiDestination
                Resource:
                  Fn::GetAtt:
                    - EventBridgeApiDestination
                    - Arn
  ScheduledKeepaliveRule:
    Type: AWS::Events::Rule
    Properties:
      Name:
        Fn::Sub: 'marbot-keepalive-${AWS::StackName}'
      Description: 'Scheduled rule that posts account details to marbot.io every 30 days.'
      ScheduleExpression: rate(30 days)
      State: ENABLED
      Targets:
        - Id: MarbotKeepaliveTarget
          Arn:
            Fn::GetAtt:
              - EventBridgeApiDestination
              - Arn
          RoleArn:
            Fn::GetAtt:
              - EventBridgeInvocationRole
              - Arn
          InputTransformer:
            InputPathsMap:
              account: $.detail.account
            InputTemplate:
              Fn::Sub:
                - '{"accountId":"<account>","stackId":"${AWS::StackId}","stackName":"${AWS::StackName}","region":"${AWS::Region}","timestamp":"<time>","endpointId":"${EndpointId}"}'
                - EndpointId:
                    Ref: MarbotEndpointId
  CrossAccountRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: 'marbot-monitoring-${AWS::StackName}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS:
                Ref: MarbotAwsAccountId
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId:
                  Ref: AWS::StackId
      ManagedPolicyArns:
        - Fn::If:
            - AutoMonitoringEnabled
            - Ref: AutoMonitoringManagedPolicy
            - Ref: AWS::NoValue
        - Fn::If:
            - AccountAliasEnabled
            - Ref: AccountAliasManagedPolicy
            - Ref: AWS::NoValue
        - Fn::If:
            - MetricGraphsEnabled
            - Ref: MetricGraphsManagedPolicy
            - Ref: AWS::NoValue
        - Fn::If:
            - CodePipelineApprovalEnabled
            - Ref: CodePipelineApprovalManagedPolicy
            - Ref: AWS::NoValue
        - Fn::If:
            - AutoMonitoringEnabled
            - Fn::GetAtt:
                - PermissionsBoundaryPolicy
                - PolicyArn
            - Ref: AWS::NoValue
  AutoMonitoringManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: AutoMonitoringEnabled
    Properties:
      ManagedPolicyName:
        Fn::Sub: 'marbot-auto-monitoring-${AWS::StackName}'
      Description: 'Permissions for marbot to automatically configure CloudWatch alarms and monitoring rules.'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - cloudwatch:PutMetricAlarm
              - cloudwatch:DeleteAlarms
              - cloudwatch:DescribeAlarms
              - cloudwatch:DescribeAlarmHistory
              - cloudwatch:PutMetricData
              - cloudwatch:GetMetricData
              - cloudwatch:ListMetrics
              - ec2:DescribeInstances
              - ec2:DescribeInstanceStatus
              - rds:DescribeDBInstances
              - rds:DescribeDBClusters
              - lambda:ListFunctions
              - lambda:GetFunction
              - elasticloadbalancing:DescribeLoadBalancers
              - elasticloadbalancing:DescribeTargetGroups
              - elasticloadbalancing:DescribeListeners
              - sns:ListTopics
              - sns:GetTopicAttributes
              - sns:Subscribe
              - sns:Unsubscribe
              - sqs:ListQueues
              - sqs:GetQueueAttributes
              - dynamodb:ListTables
              - dynamodb:DescribeTable
              - autoscaling:DescribeAutoScalingGroups
              - autoscaling:DescribeAutoScalingInstances
              - apigateway:GET
              - kinesis:ListStreams
              - kinesis:DescribeStream
              - es:ListDomainNames
              - es:DescribeElasticsearchDomain
            Resource: '*'
  AccountAliasManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: AccountAliasEnabled
    Properties:
      ManagedPolicyName:
        Fn::Sub: 'marbot-account-alias-${AWS::StackName}'
      Description: 'Permissions for marbot to enrich account IDs with friendly aliases.'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - iam:ListAccountAliases
            Resource: '*'
  MetricGraphsManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: MetricGraphsEnabled
    Properties:
      ManagedPolicyName:
        Fn::Sub: 'marbot-metric-graphs-${AWS::StackName}'
      Description: 'Permissions for marbot to embed metric graphs into CloudWatch alarm notifications.'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - cloudwatch:GetMetricWidgetImage
            Resource: '*'
  CodePipelineApprovalManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: CodePipelineApprovalEnabled
    Properties:
      ManagedPolicyName:
        Fn::Sub: 'marbot-codepipeline-approval-${AWS::StackName}'
      Description: 'Permissions for marbot to approve or reject CodePipeline manual approval requests.'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - codepipeline:PutApprovalResult
              - codepipeline:GetPipelineState
              - codepipeline:ListPipelines
              - codepipeline:GetPipeline
            Resource: '*'
  PermissionsBoundaryPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: AutoMonitoringEnabled
    Properties:
      ManagedPolicyName:
        Fn::Sub: 'marbot-permissions-boundary-${AWS::StackName}'
      Description: 'Permissions boundary that restricts the cross-account role when automatic monitoring is enabled.'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - cloudwatch:PutMetricAlarm
              - cloudwatch:DeleteAlarms
              - cloudwatch:DescribeAlarms
              - cloudwatch:DescribeAlarmHistory
              - cloudwatch:PutMetricData
              - cloudwatch:GetMetricData
              - cloudwatch:ListMetrics
              - cloudwatch:GetMetricWidgetImage
              - ec2:DescribeInstances
              - ec2:DescribeInstanceStatus
              - rds:DescribeDBInstances
              - rds:DescribeDBClusters
              - lambda:ListFunctions
              - lambda:GetFunction
              - elasticloadbalancing:DescribeLoadBalancers
              - elasticloadbalancing:DescribeTargetGroups
              - elasticloadbalancing:DescribeListeners
              - sns:ListTopics
              - sns:GetTopicAttributes
              - sns:Subscribe
              - sns:Unsubscribe
              - sqs:ListQueues
              - sqs:GetQueueAttributes
              - dynamodb:ListTables
              - dynamodb:DescribeTable
              - autoscaling:DescribeAutoScalingGroups
              - autoscaling:DescribeAutoScalingInstances
              - apigateway:GET
              - kinesis:ListStreams
              - kinesis:DescribeStream
              - es:ListDomainNames
              - es:DescribeElasticsearchDomain
              - iam:ListAccountAliases
              - codepipeline:PutApprovalResult
              - codepipeline:GetPipelineState
              - codepipeline:ListPipelines
              - codepipeline:GetPipeline
            Resource: '*'
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: 'marbot-custom-resource-lambda-${AWS::StackName}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
  CustomResourceLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName:
        Fn::Sub: 'marbot-registration-${AWS::StackName}'
      Handler: index.handler
      Role:
        Fn::GetAtt:
          - LambdaExecutionRole
          - Arn
      Runtime: python3.13
      Timeout: 120
      MemorySize: 128
      Environment:
        Variables:
          MARBOT_API_BASE_URL:
            Ref: MarbotApiBaseUrl
      Code:
        ZipFile: |
          import os
          import json
          import logging
          import urllib.request
          import urllib.error

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def send_response(event, context, response_status, response_data, physical_resource_id=None, reason=None):
              response_body = {
                  'Status': response_status,
                  'Reason': reason or 'See the details in CloudWatch Log Stream: ' + context.log_stream_name,
                  'PhysicalResourceId': physical_resource_id or context.log_stream_name,
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': response_data
              }
              response_body_json = json.dumps(response_body)
              response_url = event['ResponseURL']
              req = urllib.request.Request(response_url, data=response_body_json.encode('utf-8'),
                  headers={'Content-Type': 'application/json', 'Content-Length': str(len(response_body_json))},
                  method='PUT')
              try:
                  urllib.request.urlopen(req)
                  logger.info('CloudFormation response sent successfully.')
              except Exception as e:
                  logger.error(f'Failed to send CloudFormation response: {str(e)}')

          def handler(event, context):
              logger.info(f'Received event: {json.dumps(event)}')
              try:
                  base_url = os.environ.get('MARBOT_API_BASE_URL', 'https://api.marbot.io')
                  endpoint_id = event['ResourceProperties']['EndpointId']
                  account_id = event['ResourceProperties']['AccountId']
                  stack_id = event['ResourceProperties']['StackId']
                  role_arn = event['ResourceProperties']['CrossAccountRoleArn']

                  if event['RequestType'] in ['Create', 'Update']:
                      url = f'{base_url}/v1/register'
                      payload = {
                          'endpointId': endpoint_id,
                          'accountId': account_id,
                          'stackId': stack_id,
                          'region': os.environ.get('AWS_REGION', 'us-east-1'),
                          'crossAccountRoleArn': role_arn
                      }
                      data = json.dumps(payload).encode('utf-8')
                      req = urllib.request.Request(url, data=data,
                          headers={'Content-Type': 'application/json'},
                          method='POST')
                      try:
                          response = urllib.request.urlopen(req, timeout=30)
                          response_data = json.loads(response.read().decode('utf-8'))
                          logger.info(f'Registration response: {response_data}')
                          send_response(event, context, 'SUCCESS', {'Message': 'Registration successful', 'Response': response_data}, physical_resource_id='marbot-registration')
                      except urllib.error.HTTPError as e:
                          error_body = e.read().decode('utf-8')
                          logger.error(f'Registration HTTP error: {e.code} - {error_body}')
                          send_response(event, context, 'FAILED', {}, reason=f'HTTP error: {e.code}')
                      except Exception as e:
                          logger.error(f'Registration error: {str(e)}')
                          send_response(event, context, 'FAILED', {}, reason=f'Error: {str(e)}')
                  else:
                      send_response(event, context, 'SUCCESS', {}, physical_resource_id='marbot-registration')
              except Exception as e:
                  logger.error(f'Handler error: {str(e)}')
                  send_response(event, context, 'FAILED', {}, reason=f'Handler error: {str(e)}')
  CustomResourceRegistration:
    Type: Custom::MarbotRegistration
    DependsOn:
      - CrossAccountRole
      - CustomResourceLambda
    Properties:
      ServiceToken:
        Fn::GetAtt:
          - CustomResourceLambda
          - Arn
      EndpointId:
        Ref: MarbotEndpointId
      AccountId:
        Ref: AWS::AccountId
      StackId:
        Ref: AWS::StackId
      CrossAccountRoleArn:
        Fn::GetAtt:
          - CrossAccountRole
          - Arn
      Region:
        Ref: AWS::Region