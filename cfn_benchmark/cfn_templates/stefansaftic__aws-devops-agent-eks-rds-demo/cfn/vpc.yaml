AWSTemplateFormatVersion: '2010-09-09'
Description: EKS-FAIL-DEMO - VPC with 3 private subnets, single NAT for limited internet egress

# Egress model: AWS services through interface/gateway endpoints (cheaper,
# private), plus a single NAT Gateway in subnet A for the small amount of
# internet egress the demo workload needs (e.g. pip install at pod startup).
# Operator access to nodes/pods is via SSM Session Manager and
# `kubectl port-forward` (which goes through the EKS API server).
#
# Every taggable resource here carries auto-delete=never to opt out of
# automated cost-cleanup tooling.

Parameters:
  ProjectName:
    Type: String
    Default: devops-agent-demo
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-vpc'}
        - {Key: auto-delete, Value: never}

  # ----- Internet egress -----
  # Single NAT Gateway in a public subnet (AZ-a). All three private route
  # tables default-route to it. Adds ~$0.045/hr in NAT GW + ~$0.045/GB
  # processing — fine for the demo. The az-disrupt FIS experiment that
  # blocks AZ-a's subnet still produces the intended pod-stuck-in-AZ-a
  # behavior; cross-AZ pods just lose their internet path during the test.
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-igw'}
        - {Key: auto-delete, Value: never}

  IgwAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.0.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-public-a'}
        - {Key: auto-delete, Value: never}

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-public-rt'}
        - {Key: auto-delete, Value: never}

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: IgwAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicSubnetA, RouteTableId: !Ref PublicRouteTable}

  NatEip:
    Type: AWS::EC2::EIP
    DependsOn: IgwAttachment
    Properties:
      Domain: vpc
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-nat-eip'}
        - {Key: auto-delete, Value: never}

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnetA
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-nat'}
        - {Key: auto-delete, Value: never}

  # Private subnets — one per AZ, hosts EKS nodes.
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-private-a
        - Key: kubernetes.io/role/internal-elb
          Value: '1'
        - Key: auto-delete
          Value: never

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-private-b
        - Key: kubernetes.io/role/internal-elb
          Value: '1'
        - Key: auto-delete
          Value: never

  PrivateSubnetC:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: !Select [2, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-private-c
        - Key: kubernetes.io/role/internal-elb
          Value: '1'
        - Key: auto-delete
          Value: never

  PrivateRouteTableA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-private-rt-a'}
        - {Key: auto-delete, Value: never}

  PrivateRouteTableB:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-private-rt-b'}
        - {Key: auto-delete, Value: never}

  PrivateRouteTableC:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-private-rt-c'}
        - {Key: auto-delete, Value: never}

  PrivateSubnetARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PrivateSubnetA, RouteTableId: !Ref PrivateRouteTableA}

  PrivateSubnetBRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PrivateSubnetB, RouteTableId: !Ref PrivateRouteTableB}

  PrivateSubnetCRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PrivateSubnetC, RouteTableId: !Ref PrivateRouteTableC}

  # Default route: private subnets -> NAT GW -> internet
  PrivateDefaultRouteA:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTableA
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateDefaultRouteB:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTableB
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateDefaultRouteC:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTableC
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  # Security group for VPC interface endpoints
  EndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTPS from VPC to interface endpoints
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCidr
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-endpoint-sg'}
        - {Key: auto-delete, Value: never}

  # Gateway endpoint for S3 (free) — used by ECR image layer pulls,
  # including pulls from public.ecr.aws which AWS routes via S3.
  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTableA
        - !Ref PrivateRouteTableB
        - !Ref PrivateRouteTableC
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-vpce-s3'}
        - {Key: auto-delete, Value: never}

  EcrApiEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ecr.api
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB, !Ref PrivateSubnetC]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-vpce-ecr-api'}
        - {Key: auto-delete, Value: never}

  EcrDkrEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ecr.dkr
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB, !Ref PrivateSubnetC]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-vpce-ecr-dkr'}
        - {Key: auto-delete, Value: never}

  Ec2Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ec2
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB, !Ref PrivateSubnetC]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-vpce-ec2'}
        - {Key: auto-delete, Value: never}

  StsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.sts
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB, !Ref PrivateSubnetC]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-vpce-sts'}
        - {Key: auto-delete, Value: never}

  LogsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.logs
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB, !Ref PrivateSubnetC]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-vpce-logs'}
        - {Key: auto-delete, Value: never}

  # ----- SSM endpoints — for Session Manager access to nodes -----
  # All three are required: ssm (control plane), ssmmessages (channel),
  # ec2messages (instance heartbeats).
  SsmEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ssm
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB, !Ref PrivateSubnetC]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-vpce-ssm'}
        - {Key: auto-delete, Value: never}

  SsmMessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ssmmessages
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB, !Ref PrivateSubnetC]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-vpce-ssmmessages'}
        - {Key: auto-delete, Value: never}

  Ec2MessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ec2messages
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB, !Ref PrivateSubnetC]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-vpce-ec2messages'}
        - {Key: auto-delete, Value: never}

Outputs:
  VpcId:
    Value: !Ref Vpc
  VpcCidr:
    Value: !Ref VpcCidr
  PrivateSubnetIds:
    Value: !Join [',', [!Ref PrivateSubnetA, !Ref PrivateSubnetB, !Ref PrivateSubnetC]]
  PrivateSubnetA:
    Value: !Ref PrivateSubnetA
  PrivateSubnetB:
    Value: !Ref PrivateSubnetB
  PrivateSubnetC:
    Value: !Ref PrivateSubnetC